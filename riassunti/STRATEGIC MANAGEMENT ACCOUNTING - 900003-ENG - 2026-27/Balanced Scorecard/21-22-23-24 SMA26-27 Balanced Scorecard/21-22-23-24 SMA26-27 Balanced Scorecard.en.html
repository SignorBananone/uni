&lt;p&gt;&lt;b&gt;Improving&lt;/b&gt;: defects 185→91, warranty claims 46→27, complaints 102→58, purchase order lead time 8→4 days, process time 2.1→1.8. &lt;b&gt;Deteriorating&lt;/b&gt;: scrap 1%→3% of cost, downtime up, machine utilisation down, longer setups, throughput 6→10, MCE 0.35→0.18, delivery 15→24, on-time deliveries 96%→89%. Month 4 without queues: 0.7+1.8+0.5 = 3.0 days, MCE 0.60; without queues or inspection: 2.3 days, MCE 0.78.&lt;/p&gt;
&lt;p class=&quot;note&quot;&gt;&lt;b&gt;Better quality, worse flow.&lt;/b&gt; Without the time measures, management would see only the good news.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;The new flexible plant (slides 143–144)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Throughput 7.4 → 8.0 → 8.8 → 9.5; delivery 23.4 → 25.5 → 27.8 → 30.0; MCE 0.28 → 0.25 → 0.22 → 0.19. Process time falls, but queues and waiting grow faster: on-time delivery from 91% to 79% and sales declining every month. &lt;b&gt;Faster processing, slower company.&lt;/b&gt; Month 4 without queues: 0.4+1.8+0.6 = 2.8 days, MCE 0.64; without queues or inspection: 2.2 days, MCE 0.82.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Amazon&lt;/span&gt;&lt;h4&gt;Speed as the promise&lt;/h4&gt;It measures how many orders arrive the same or the next day and has reorganised its warehouses into regional networks. In 2024 it delivered 9 billion items the same or the next day: here the time measure &lt;b&gt;is&lt;/b&gt; the value proposition.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Zara (Inditex)&lt;/span&gt;&lt;h4&gt;From design to store in weeks&lt;/h4&gt;Traditional fashion plans months in advance; Zara designs, produces (largely close to Spain) and ships in short cycles. Shorter throughput = &lt;b&gt;less unsold stock&lt;/b&gt; and fewer end-of-season markdowns.&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check · Narton Corp. (slides 132–135)&lt;/h3&gt;
&lt;p class=&quot;cap&quot;&gt;Wait 3.0 · Inspection 0.4 · Process 0.2 · Move 0.5 · Queue 9.3 (days)&lt;/p&gt;
&lt;div id=&quot;qz-time&quot;&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Why does eliminating queue time raise MCE without changing process time?&lt;/summary&gt;&lt;div&gt;MCE has process time in the numerator (fixed) and throughput time in the denominator: removing non-value-added time shrinks the denominator and the value-added share grows (Codington: 2.2 ÷ 3.8 = 0.58).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s8&quot; class=&quot;part p-brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;08&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section VIII · slides 146–157&lt;/div&gt;&lt;h2&gt;Overall equipment effectiveness&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;&lt;b&gt;Overall equipment effectiveness (OEE)&lt;/b&gt; measures a machine&#x27;s productivity along three dimensions and is widely used by &lt;span class=&quot;t&quot;&gt;lean&lt;/span&gt; &lt;i&gt;(focused on eliminating waste)&lt;/i&gt; manufacturers. Goal &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;b&gt;OEE&lt;/b&gt; = Utilisation rate × Efficiency rate × Quality rate&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;th&gt;Formula&lt;/th&gt;&lt;th&gt;Question&lt;/th&gt;&lt;th&gt;How to raise it (slide 149)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Utilisation&lt;/td&gt;&lt;td&gt;Actual run time ÷ Machine time available&lt;/td&gt;&lt;td&gt;Does it run when it could? Breakdowns and long setups leave it idle.&lt;/td&gt;&lt;td&gt;Avoid breakdowns, reduce average setup times.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Efficiency&lt;/td&gt;&lt;td&gt;Actual run rate ÷ Ideal run rate&lt;/td&gt;&lt;td&gt;When it runs, does it run at full speed? Minor stoppages slow it down.&lt;/td&gt;&lt;td&gt;Avoid minor stoppages; retain and train operators to use and maintain it.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Quality&lt;/td&gt;&lt;td&gt;Defect free output ÷ Total output&lt;/td&gt;&lt;td&gt;Of what it produces, how much is defect-free?&lt;/td&gt;&lt;td&gt;Reduce defective units as a % of output.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;Each rate lies between 0 and 1, so OEE is always smaller than the weakest rate: three rates of 90% give only 0.9³ = &lt;b&gt;73%&lt;/b&gt;. Note the link with learning and growth: retaining and training operators (a people measure) should improve a process measure. A ready-made if/then hypothesis.&lt;/p&gt;

&lt;div class=&quot;fig&quot;&gt;
&lt;h4 style=&quot;margin-top:0&quot;&gt;OEE lab: where units are lost&lt;/h4&gt;
&lt;div id=&quot;opre&quot; style=&quot;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;ou&quot;&gt;Utilisation&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ou&quot; min=&quot;0.3&quot; max=&quot;1&quot; step=&quot;0.005&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;oe&quot;&gt;Efficiency&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;oe&quot; min=&quot;0.3&quot; max=&quot;1&quot; step=&quot;0.005&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;oq&quot;&gt;Quality&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;oq&quot; min=&quot;0.3&quot; max=&quot;1&quot; step=&quot;0.005&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot; id=&quot;ocap&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;OEE&lt;/span&gt;&lt;b id=&quot;ooee&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Good units&lt;/span&gt;&lt;b id=&quot;ogood&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Units lost&lt;/span&gt;&lt;b id=&quot;olost&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 440 300&quot; id=&quot;osvg&quot; aria-label=&quot;Waterfall chart of losses&quot;&gt;&lt;/svg&gt;
&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Steps (slide 153): &lt;b&gt;maximum output&lt;/b&gt; = time available × ideal rate; &lt;b&gt;utilisation loss&lt;/b&gt; = (time available − run time) × ideal rate; &lt;b&gt;efficiency loss&lt;/b&gt; = run time × (ideal − actual rate); &lt;b&gt;quality loss&lt;/b&gt; = total output − defect free output. Check: good ÷ maximum = OEE.&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Jayson · the bottleneck machine&lt;/h4&gt;Demand exceeds capacity: this machine is the &lt;span class=&quot;t&quot;&gt;bottleneck&lt;/span&gt; &lt;i&gt;(the constraint: every unit not produced here is a unit not sold)&lt;/i&gt;. 0.70 × 0.95 × 0.925 = &lt;b&gt;0.615&lt;/b&gt;. Out of 26,000 possible units: −7,800 from downtime, −910 from slow running, −1,290 defective = 16,000 good. &lt;b&gt;10,000 products that customers wanted and did not get.&lt;/b&gt; The weakest rate is utilisation: 1,950 minutes of downtime out of 6,500.&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Kilmer · two weeks&lt;/h4&gt;Week A: 0.70 × 0.95 × 0.85 = &lt;b&gt;0.565&lt;/b&gt; (28,000 − 8,400 − 980 − 2,793 = 15,827). Week B: 0.60 × 0.85 × 0.70 = &lt;b&gt;0.357&lt;/b&gt; (66,000 − 26,400 − 5,940 − 10,098 = 23,562): downtime is the largest loss, but the machine also scraps three units in ten. Both problems deserve attention &lt;b&gt;before buying a new machine&lt;/b&gt;.&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;A machine has utilisation 0.80, efficiency 0.90, quality 0.95. What is its OEE?&lt;/summary&gt;&lt;div&gt;0.80 × 0.90 × 0.95 = 0.684. The biggest lever is utilisation (the lowest rate).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Run time 4,550 min, ideal 4.0 u/min, actual 3.8: why is the efficiency loss 910?&lt;/summary&gt;&lt;div&gt;While running, the machine produces 0.2 units per minute fewer than the ideal: 4,550 × 0.2 = 910 units.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why does OEE “in units” equal the product of the three rates?&lt;/summary&gt;&lt;div&gt;Good = available × U × ideal × E × Q, and maximum = available × ideal; the ratio is U × E × Q.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s9&quot; class=&quot;part p-acc&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;09&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section IX · slides 158–173&lt;/div&gt;&lt;h2&gt;Building a scorecard&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot; data-steps&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Step 1 of 4&lt;/span&gt;&lt;h3 style=&quot;margin-top:.4em&quot;&gt;Define the strategy&lt;/h3&gt;&lt;p&gt;Name the target customers and the value proposition. Without this sentence, every subsequent measure is arbitrary.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Step 2 of 4&lt;/span&gt;&lt;h3 style=&quot;margin-top:.4em&quot;&gt;Choose measures&lt;/h3&gt;&lt;p&gt;A few per perspective, each with a direction (↑ or ↓).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Step 3 of 4&lt;/span&gt;&lt;h3 style=&quot;margin-top:.4em&quot;&gt;Link them in a strategy map&lt;/h3&gt;&lt;p&gt;Draw the arrows and write each arrow as an if/then statement.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Step 4 of 4&lt;/span&gt;&lt;h3 style=&quot;margin-top:.4em&quot;&gt;Test and reward&lt;/h3&gt;&lt;p&gt;Collect the data, check the links and only later tie pay to the measures. In short: define the strategy, translate it into measures that track its execution, and link them in a &lt;b&gt;cause-and-effect&lt;/b&gt; way.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;next →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Jaguar: one strategy, one map, four hypotheses&lt;/h3&gt;
&lt;p class=&quot;def&quot; style=&quot;font-style:italic&quot;&gt;“Jaguar&#x27;s strategy is to offer distinctive, luxury automobiles to wealthy individuals who prize handcrafted, individualised products.”&lt;/p&gt;
&lt;div id=&quot;qz-jag&quot;&gt;&lt;/div&gt;
&lt;p&gt;Almost unlimited options for leathers, colours and wooden dashboards: every car is almost unique. &lt;b&gt;The catch&lt;/b&gt;: Jaguar must deliver a fully customised car within a reasonable time and without spending more on customisation than the customer is willing to pay.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 860 330&quot; id=&quot;jagmap&quot; aria-label=&quot;A possible balanced scorecard for Jaguar&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;A possible balanced scorecard for Jaguar (slide 162), redrawn.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;fig&quot; data-steps&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;If&lt;/b&gt; retention and training hours increase, &lt;b&gt;then&lt;/b&gt; the options available increase, while errors per vehicle and the time to install an option decrease.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;If&lt;/b&gt; options increase and errors and installation times decrease, &lt;b&gt;then&lt;/b&gt; satisfaction with options increases, and with it the share of the luxury car market.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;If&lt;/b&gt; satisfaction with options increases and installation time decreases, &lt;b&gt;then&lt;/b&gt; the contribution margin per car increases.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;If&lt;/b&gt; market share and contribution margin per car increase, &lt;b&gt;then&lt;/b&gt; residual income increases.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;And if it does not happen?&lt;/b&gt; If Jaguar offers more options, makes fewer errors and installs faster, but satisfaction, market share, margin and residual income do not move, the strategy must be reconsidered. Without this feedback a company can carry on for years with an ineffective strategy built on wrong assumptions.&lt;/div&gt;
&lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;next →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;small&gt;The scorecard is a theory · slide 164&lt;/small&gt;It lays out how concrete actions should lead to the results we want. Data then tells us whether the theory holds.&lt;/div&gt;

&lt;h3&gt;What makes a good if/then statement&lt;/h3&gt;
&lt;div class=&quot;vs&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--brick-bg);border:0&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Weak&lt;/span&gt;&lt;p&gt;&lt;b&gt;“If employees are happier, the company will do better.”&lt;/b&gt; Neither side is a measure, there is no direction, nothing can be tested.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--sage-bg);border:0&quot;&gt;&lt;span class=&quot;pill&quot; style=&quot;color:var(--sage)&quot;&gt;Strong&lt;/span&gt;&lt;p&gt;&lt;b&gt;“If employee turnover ↓, then the number of warranty claims ↓.”&lt;/b&gt; Two named measures, a direction for each, an explainable mechanism: experienced staff make fewer mistakes.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;&lt;b&gt;Checklist&lt;/b&gt;: two specific measures · a direction for each · usually from one perspective to the next · a plausible reason · data that can actually be collected.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Write the hypothesis, then break it: five links and how they could fail (slides 166–167)&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Hypothesis&lt;/th&gt;&lt;th&gt;Why the link might not hold&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Turnover ↓ → warranty claims ↓&lt;/td&gt;&lt;td&gt;Defects may come from designs or supplier components, not from inexperienced staff.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Defection rate ↓ → sales growth ↑&lt;/td&gt;&lt;td&gt;Loyal customers may buy less each year, or prices were cut to retain them.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;New products designed ↑ → share of wallet ↑&lt;/td&gt;&lt;td&gt;New products may not meet needs or may cannibalise older ones.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Non value added costs ↓ → net operating income ↑&lt;/td&gt;&lt;td&gt;The freed-up capacity remains unused, or the costs are fixed and do not disappear.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Suggestions per employee ↑ → non value added costs ↓&lt;/td&gt;&lt;td&gt;Suggestions may be poor or never implemented.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Powder 8 Lodge: a ski resort cafeteria&lt;/h3&gt;
&lt;p&gt;A small resort for day skiers acquired by Western Resorts, which wants to turn it into a destination. Limited menu (hamburgers, hot dogs, chili, sandwiches, pizza, fries); staff retained; an enthusiastic manager who is new to food service.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 860 330&quot; id=&quot;p8map&quot; aria-label=&quot;A possible scorecard for Powder 8 Lodge&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Links (slide 169): i drives c and h; j drives g and d; c drives e; h, g and d drive f; e and f drive a; a drives b.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Courses → better work?&lt;/h4&gt;A course may not change habits in a busy cafeteria, especially without an experienced manager.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;More dishes → more satisfaction?&lt;/h4&gt;Skiers may want speed more than choice; a long menu slows down preparation.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Satisfaction → sales?&lt;/h4&gt;It is the only place to eat on the slopes: sales depend more on the number of skiers.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Sales → profit?&lt;/h4&gt;Not if the new menu and training cost more than the extra sales.&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;&lt;b&gt;How management finds out&lt;/b&gt;: it tracks each measure over time. If an “if” measure improves and its “then” does not, that link is in doubt.&lt;/p&gt;

&lt;h3&gt;The downtown store: two problems, sixteen candidate measures&lt;/h3&gt;
&lt;p&gt;A store losing ground to the chains has two problems: (1) customers pay their store credit card statements late and bad debts are high, mainly because sales clerks enter incorrect data and the bills are disputed; (2) unsold seasonal clothing is sold off at a loss.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 860 200&quot; aria-label=&quot;Two chains converging on profit&quot;&gt;
&lt;g font-size=&quot;12.5&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;54&quot;&gt;b. Clerks trained ↑&lt;/text&gt;
&lt;rect x=&quot;180&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;46&quot;&gt;a. Bills with&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;63&quot;&gt;errors ↓&lt;/text&gt;
&lt;rect x=&quot;350&quot; y=&quot;20&quot; width=&quot;150&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;var(--accbg)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;425&quot; y=&quot;46&quot;&gt;e. Satisfaction with&lt;/text&gt;&lt;text x=&quot;425&quot; y=&quot;63&quot;&gt;bill accuracy ↑&lt;/text&gt;
&lt;rect x=&quot;530&quot; y=&quot;20&quot; width=&quot;150&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;605&quot; y=&quot;46&quot;&gt;c. Age of receivables ↓&lt;/text&gt;&lt;text x=&quot;605&quot; y=&quot;63&quot;&gt;m. Bad debts ↓&lt;/text&gt;
&lt;rect x=&quot;10&quot; y=&quot;120&quot; width=&quot;140&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;146&quot;&gt;k. Suppliers with&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;163&quot;&gt;JIT delivery ↑&lt;/text&gt;
&lt;rect x=&quot;180&quot; y=&quot;120&quot; width=&quot;140&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;146&quot;&gt;i. Unsold season&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;163&quot;&gt;end inventory ↓&lt;/text&gt;
&lt;rect x=&quot;730&quot; y=&quot;70&quot; width=&quot;120&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;790&quot; y=&quot;104&quot; font-size=&quot;14&quot;&gt;p. Total profit ↑&lt;/text&gt;
&lt;/g&gt;
&lt;g stroke=&quot;var(--acc)&quot; stroke-width=&quot;2.2&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M152 49H176&quot;/&gt;&lt;path d=&quot;M322 49H346&quot;/&gt;&lt;path d=&quot;M502 49H526&quot;/&gt;&lt;path d=&quot;M682 55L726 90&quot;/&gt;&lt;path d=&quot;M152 149H176&quot;/&gt;&lt;path d=&quot;M322 149L726 108&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;figcaption&gt;Trained clerks make fewer mistakes; correct bills are not disputed; customers pay sooner and fewer receivables are lost. &lt;span class=&quot;t&quot;&gt;Just in time&lt;/span&gt; &lt;i&gt;(punctual deliveries in small lots when needed)&lt;/i&gt; suppliers allow smaller orders placed closer to the season: less unsold stock. Measures d, f, g, j, l, n, o address neither problem (slides 171–172).&lt;/figcaption&gt;&lt;/figure&gt;
&lt;p&gt;What if, after a year, the results are mixed? Find the &lt;b&gt;first link&lt;/b&gt; that did not work in each chain: is the hypothesis wrong, or does the effect need more time? Correct bills but customers still paying late: perhaps credit is granted too easily, collection is weak or customers are short of money. Better numbers but the same profit: savings eaten up by training or supplier costs, inventory so lean that sales are lost, tighter credit pushing customers towards the chains. The scorecard does not merely report a disappointing profit: it points to &lt;b&gt;which hypothesis to examine&lt;/b&gt;.&lt;/p&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;div id=&quot;qz-ifthen&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s10&quot; class=&quot;part p-acc&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;10&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section X · slides 174–186&lt;/div&gt;&lt;h2&gt;Using the scorecard&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;h3&gt;Tie pay to the scorecard, but not from day one&lt;/h3&gt;
&lt;p&gt;Bonuses can, and probably should, be tied to scorecard measures, otherwise they will be ignored. But only after the organisation has been managed with the scorecard for a while, &lt;b&gt;perhaps a year or more&lt;/b&gt;. First you must be confident that the measures are &lt;b&gt;reliable&lt;/b&gt;, &lt;b&gt;sensible&lt;/b&gt;, &lt;b&gt;understood&lt;/b&gt; by those being evaluated and &lt;b&gt;not easily manipulated&lt;/b&gt;.&lt;/p&gt;

&lt;div class=&quot;fig&quot;&gt;
&lt;h4 style=&quot;margin-top:0&quot;&gt;Pipeline Unlimited: what do you base commissions on?&lt;/h4&gt;
&lt;p class=&quot;cap&quot; style=&quot;margin-top:0&quot;&gt;A surfing equipment manufacturer operating at 75% of capacity; its scorecard includes sales growth. Two boards: XR7 (price $695, variable costs $344, &lt;span class=&quot;t&quot;&gt;contribution margin&lt;/span&gt; &lt;i&gt;· price less variable costs&lt;/i&gt; $351) and Turbo ($749, $410, CM $339).&lt;/p&gt;
&lt;div style=&quot;display:flex;gap:6px;flex-wrap:wrap&quot;&gt;&lt;button class=&quot;btn on&quot; type=&quot;button&quot; id=&quot;cm1&quot;&gt;10% of sales&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;cm2&quot;&gt;10% of contribution margin&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;kpis&quot; style=&quot;margin-top:10px&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;XR7 commission&lt;/span&gt;&lt;b id=&quot;cx&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Turbo commission&lt;/span&gt;&lt;b id=&quot;ct&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Salespeople push&lt;/span&gt;&lt;b id=&quot;cp&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p id=&quot;cmsg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;How a measure gets “gamed”&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;t&quot;&gt;Gaming&lt;/span&gt; &lt;i&gt;(manipulating behaviour to improve the number without improving the company)&lt;/i&gt; is the risk of every stand-alone measure. Try to guess the trick before opening.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;1 · Speed to market: R&amp;amp;D is evaluated on the average development time before release&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Trick&lt;/b&gt;: release products that are not fully tested. Development time falls but defects and returns rise after launch. &lt;b&gt;Counterweight&lt;/b&gt;: defect rate after launch.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;2 · Luggage unloading: a bonus if the average time from parking to the last bag beats the previous month&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Trick&lt;/b&gt;: rush the luggage, or work slowly one month and fast the next (a slow month sets up an easy win). &lt;b&gt;Counterweight&lt;/b&gt;: damaged luggage; a fixed target instead of comparison with the previous month.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;3 · On time shipments: the production manager agrees the date with the customer and is judged on the % shipped by that date&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Trick&lt;/b&gt;: agree on dates far in the future. The on-time % rises while customers wait longer. &lt;b&gt;Counterweight&lt;/b&gt;: delivery cycle time.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;4 · Revenue per employee for branch managers&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Trick&lt;/b&gt;: replace employees with outside contractors, or cut prices to drive volume. The ratio rises, costs rise and margins fall. &lt;b&gt;Counterweight&lt;/b&gt;: profit per employee.&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;note&quot;&gt;&lt;b&gt;Lesson&lt;/b&gt;: a single measure invites gaming. Pair it with a &lt;b&gt;counterweight&lt;/b&gt; that worsens when someone cheats.&lt;/p&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Case · slide 180&lt;/span&gt;&lt;h4&gt;Wells Fargo: when a single measure ran the bank&lt;/h4&gt;&lt;p&gt;A strategy built on &lt;span class=&quot;t&quot;&gt;cross selling&lt;/span&gt; &lt;i&gt;(selling more products to the same customer)&lt;/i&gt;, with the internal motto “eight is great”. Under daily sales targets, branch employees opened up to 3.5 million accounts that customers had never requested. In 2020 the bank agreed to pay USD 3 billion to settle the criminal and civil investigations, and its reputation suffered for years. &lt;b&gt;Measure&lt;/b&gt;: products per customer ↑. &lt;b&gt;Missing counterweights&lt;/b&gt;: accounts actually used ↑, customer complaints ↓, branch staff turnover ↓.&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Beyond shareholders: CSR in the scorecard&lt;/h3&gt;
&lt;p&gt;Companies must satisfy shareholders, but they also have responsibilities towards other stakeholders: customers, employees, suppliers, communities, environmental and human rights groups. &lt;span class=&quot;t&quot;&gt;Corporate social responsibility (CSR)&lt;/span&gt; &lt;i&gt;(a company&#x27;s responsibility towards society)&lt;/i&gt; means considering the needs of all stakeholders in decision-making, going beyond legal compliance through voluntary action.&lt;/p&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--sage-bg);border:0&quot;&gt;&lt;h4&gt;Opportunity&lt;/h4&gt;Toyota developed the Prius hybrid to respond to concerns about emissions and to grow shareholder value. Timberland makes Earthkeepers shoes from recycled plastic bottles (a line that grew quickly and profitably). Procter &amp;amp; Gamble merged distribution centres, cutting costs and emissions.&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--brick-bg);border:0&quot;&gt;&lt;h4&gt;Risk&lt;/h4&gt;Polluting, buying from suppliers that use child labour, discriminating: reputational damage. Then boycotts, fewer strong candidates, higher turnover, dissatisfied investors, lawsuits and fines.&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Whatever the motive (ethics, opportunity or risk), measurement is needed: with indicators that managers can track and stakeholders can read.&lt;/p&gt;
&lt;h4&gt;The GRI framework&lt;/h4&gt;
&lt;p&gt;The &lt;span class=&quot;t&quot;&gt;GRI&lt;/span&gt; &lt;i&gt;(Global Reporting Initiative)&lt;/i&gt; is a leading organisation in the measurement of social and environmental performance. Its sustainability reporting framework comprises &lt;b&gt;universal standards&lt;/b&gt; (a statement from senior leadership on CSR; stakeholders and frequency of engagement; the board&#x27;s role in risk and reporting) and three groups of &lt;b&gt;topic specific standards&lt;/b&gt;: &lt;b&gt;economic&lt;/b&gt; (pension plans, local suppliers and managers, entry-level wages by gender, climate risk), &lt;b&gt;environmental&lt;/b&gt; (water, waste, energy, biodiversity, emissions), &lt;b&gt;social&lt;/b&gt; (health and safety, human rights, training, diversity, product safety and labelling). The three areas reflect the &lt;span class=&quot;t&quot;&gt;triple bottom line&lt;/span&gt; &lt;i&gt;(people, planet, profit)&lt;/i&gt;.&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Perspective&lt;/th&gt;&lt;th&gt;CSR measures (slide 184)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Financial&lt;/td&gt;&lt;td&gt;Revenue from eco products ↑; fuel cost per dollar of sales ↓; total workers&#x27; compensation costs; investment in green products and processes&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Customer&lt;/td&gt;&lt;td&gt;Customers agreeing that we care about communities ↑, product safety ↑, the environment ↑, and that we inform them about our CSR ↑&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Internal processes&lt;/td&gt;&lt;td&gt;Water per unit ↓; recycled inputs ↑; carbon emissions per unit ↓; pounds of waste ↓&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Learning and growth&lt;/td&gt;&lt;td&gt;Workplace injuries ↓; average pay of women relative to men ↑; job applicants from under-represented groups ↑; volunteer hours per employee ↑&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Within the four boxes&lt;/h4&gt;Add social and environmental measures to the existing perspectives.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;A fifth perspective&lt;/h4&gt;A category dedicated to a broader range of stakeholders.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;A separate scorecard&lt;/h4&gt;Dedicated to the social and environmental performance of the company or its suppliers.&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Whatever the format, two rules apply: link the measures with if/then statements and tie them to how senior managers are evaluated and rewarded. &lt;b&gt;Otherwise a stated commitment may not translate into action.&lt;/b&gt;&lt;/p&gt;

&lt;h3&gt;Key takeaways, and what comes next&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;ol style=&quot;margin:0;padding-left:1.2em&quot;&gt;&lt;li&gt;&lt;b&gt;Strategy first&lt;/b&gt;: the value proposition determines which measures go into the scorecard.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Four linked perspectives&lt;/b&gt;, connected by if/then hypotheses and drawn as a strategy map.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Non-financial measures&lt;/b&gt; such as quality, time and OEE anticipate financial results.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Balance and rewards&lt;/b&gt;: every measure with a counterweight, then the link to pay.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Next lecture&lt;/span&gt;&lt;h4&gt;The Sustainable Balanced Scorecard&lt;/h4&gt;&lt;p&gt;When the environment and society are included among the stakeholders, the map needs new objectives. To think about beforehand: where does Enel&#x27;s renewable capacity sit in its strategy map? Which environmental measure would you add to Ryanair&#x27;s map?&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why not tie bonuses to the scorecard straight away?&lt;/summary&gt;&lt;div&gt;Because you must first verify that the measures are reliable, sensible, understood and hard to manipulate, and that the if/then hypotheses hold: paying on the wrong measures rewards the wrong behaviour (Wells Fargo).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;With commissions at 10% of sales, which board do salespeople push and which one benefits the company?&lt;/summary&gt;&lt;div&gt;They push the Turbo ($74.90 versus $69.50), but the XR7 benefits the company (CM $351 versus $339). Paying on contribution margin aligns interests: as long as fixed costs do not depend on the mix, maximising CM maximises profit.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What are the three ways of bringing CSR into the scorecard?&lt;/summary&gt;&lt;div&gt;Measures within the four perspectives; a fifth perspective for stakeholders; a separate scorecard (for the company or its suppliers).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s11&quot; class=&quot;part p-acc&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;→&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;External sources · found on the web&lt;/div&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;The cards below cover authors, texts, cases and standards &lt;b&gt;cited in the slides&lt;/b&gt;. The content of each card comes from web research and is marked as an &lt;b&gt;external source&lt;/b&gt;: it is not part of the slides. Where the external source does not match the slide, this is pointed out.&lt;/p&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Kaplan &amp;amp; Norton (1992), “The Balanced Scorecard: Measures That Drive Performance”, &lt;i&gt;Harvard Business Review&lt;/i&gt;, Jan–Feb 1992&lt;/h4&gt;&lt;p&gt;The article that introduced the scorecard, based on a year-long research project with 12 companies: a set of measures that complements financial results with operational measures on customers, internal processes and innovation/learning. HBR republished it as a “classic” in 2005. It matters because it is the original text behind slide 12.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://hbr.org/1992/01/the-balanced-scorecard-measures-that-drive-performance-2&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;hbr.org · 1992 article&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Kaplan &amp;amp; Norton (1996), &lt;i&gt;The Balanced Scorecard: Translating Strategy into Action&lt;/i&gt;, Harvard Business School Press&lt;/h4&gt;&lt;p&gt;The book (about 320 pages) that turns the scorecard from a reporting tool into a strategic management system, with the four perspectives financial, customer, internal business processes, learning and growth. The first part is theoretical, the second explains how to build one.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://find.library.upatras.gr/Record/63249/Description?lng=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;library catalogue record (University of Patras)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Kaplan &amp;amp; Norton (2004), &lt;i&gt;Strategy Maps: Converting Intangible Assets into Tangible Outcomes&lt;/i&gt;, Harvard Business School Press&lt;/h4&gt;&lt;p&gt;The sequel that introduces strategy maps: how intangible assets (people, information, organisation) are translated, through processes and customers, into financial results. It is the basis of the Ryanair, Jaguar and Powder 8 Lodge maps.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.emerald.com/insight/content/doi/10.1108/jbs.2004.28825eae.003/full/html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;review in the Journal of Business Strategy (Emerald)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Treacy &amp;amp; Wiersema (1993), “Customer Intimacy and Other Value Disciplines”, &lt;i&gt;HBR&lt;/i&gt; 71(1), pp. 84–93&lt;/h4&gt;&lt;p&gt;Proposes the three “value disciplines”: operational excellence, customer intimacy, product leadership. Central thesis: a company can lead in only one, while maintaining a threshold level in the other two. Developed in the book &lt;i&gt;The Discipline of Market Leaders&lt;/i&gt; (1995). The link points to a secondary summary, not to the original article.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.toolshero.com/strategy/value-disciplines-treacy-wiersema/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;summary of the model (Toolshero)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Enel, USD 1.5 billion “SDG-linked” bond (September 2019)&lt;/h4&gt;&lt;p&gt;Enel&#x27;s press release confirms: a five-year bond on the US market, KPI = share of installed renewable capacity of at least 55% by 31/12/2021 (45.9% at 30/6/2019), with a 25 basis point step-up if missed. The first instrument of its kind: a textbook case of a non-financial measure embedded in a financial contract.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.emarketstorage.it/sites/default/files/comunicati/2022-05/20190906_67431.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Enel press release (eMarket Storage archive)&lt;/a&gt; · &lt;a class=&quot;lnk&quot; href=&quot;https://cib.bnpparibas/italian-energy-company-issues-groundbreaking-sdg-linked-bond/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BNP Paribas&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Luxottica, shorter working week (Il Giornale, 30/11/2023)&lt;/h4&gt;&lt;p&gt;The source cited in the slide. The press describes the agreement reached at the end of 2023, with a trial start in April 2024: four days for 20 weeks a year at the same pay, in some departments of six plants (Agordo, Sedico, Cencenighe, Pederobba, Lauriano, Rovereto), on a voluntary basis, in exchange for giving up some leave entitlements. &lt;b&gt;Caution&lt;/b&gt;: the sources mention about a thousand workers involved at launch, whereas the slide indicates about 15,000 employees covered; check the figure.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.ilgiornale.it/news/aziende/luxottica-settimana-lavorativa-quattro-giorni-senza-toccare-2249477.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Il Giornale&lt;/a&gt; · &lt;a class=&quot;lnk&quot; href=&quot;https://www.ilpost.it/2023/12/01/essilorluxottica-settimana-quattro-giorni/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Il Post&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Stellantis EV Day (8 July 2021)&lt;/h4&gt;&lt;p&gt;Presentation of the electrification strategy: four STLA platforms (Small, Medium, Large and the body-on-frame Frame) with shared electric drive modules. Useful for the case on process measures (platforms and common parts).&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.stellantis.com/en/news/press-releases/2021/july/stellantis-intensifies-electrification-while-targeting-sustainable-double-digit-adjusted-operating-income-margins-in-the-mid-term&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Stellantis press release&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Wells Fargo, USD 3 billion settlement (February 2020)&lt;/h4&gt;&lt;p&gt;The US Department of Justice documents the settlement resolving the criminal and civil investigations into sales practices from 2002–2016 (accounts opened without authorisation, internally called “gaming”), with a three-year deferred prosecution agreement and 500 million allocated to the SEC. It is the primary source for the case on slide 180.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.justice.gov/archives/opa/pr/wells-fargo-agrees-pay-3-billion-resolve-criminal-and-civil-investigations-sales-practices&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;justice.gov · DOJ press release&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;GRI Standards (Global Reporting Initiative)&lt;/h4&gt;&lt;p&gt;Since 2021 the Universal Standards have been GRI 1 (Foundation), GRI 2 (General Disclosures) and GRI 3 (Material Topics); the Topic Standards (200 series economic, 300 environmental, 400 social) apply to the material topics identified using GRI 3. They are the most widely used sustainability reporting standard and the basis of slide 183.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.globalreporting.org/standards/standards-development/universal-standards/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;globalreporting.org · Universal Standards&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Economic Value Added (Stern Stewart) and Coca-Cola&lt;/h4&gt;&lt;p&gt;EVA was developed by Stern Stewart &amp;amp; Co. in the 1980s: operating profit less a charge for all the capital invested, the same logic as residual income. Coca-Cola, under CEO Roberto Goizueta, was among the first and best-known adopters in the 1990s.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://sternvaluemanagement.com/about-us/our-history&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Stern Value Management · history&lt;/a&gt; · &lt;a class=&quot;lnk&quot; href=&quot;https://money.cnn.com/magazines/fortune/fortune_archive/1995/12/11/208459/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fortune, 1995&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Amazon: 9 billion items delivered same-day or next-day (2024)&lt;/h4&gt;&lt;p&gt;Amazon announcement (February 2025): the fastest-ever deliveries for Prime customers in 2024, with over 9 billion items delivered same-day or next-day worldwide. The figure comes from the company itself.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.aboutamazon.eu/news/retail/amazon-prime-members-enjoyed-fastest-ever-delivery-speeds-in-2024&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;aboutamazon.eu&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;External source&lt;/span&gt;&lt;h4&gt;Zara (Inditex): the “fast fashion” model&lt;/h4&gt;&lt;p&gt;Analyses describe design-to-store times of about two to three weeks, production in small batches and about half of the garments (those most trend-driven) produced close to Spain. Figures vary from source to source; for official numbers, see Inditex&#x27;s reports.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.retail-week.com/fashion/inside-inditex-how-zara-became-a-global-fashion-phenomenon/5065325.article&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Retail Week · Inside Inditex&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot; style=&quot;margin-top:18px&quot;&gt;&lt;b&gt;On the other course materials.&lt;/b&gt; The brief asked for the &lt;code&gt;corso/&lt;/code&gt; folder to be consulted in order to link this lecture to the others. With the tools available in that session it was not possible to list the folder&#x27;s contents, so this canvas uses &lt;b&gt;only&lt;/b&gt; the PDF “21-22-23-24 SMA26-27 Balanced Scorecard”. The only link to other lectures comes from slide 186, which announces the next lecture, &lt;i&gt;The Sustainable Balanced Scorecard&lt;/i&gt;.&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
