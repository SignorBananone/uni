&lt;a href=&quot;#s4&quot;&gt;&lt;rect x=&quot;700&quot; y=&quot;352&quot; width=&quot;160&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;780&quot; y=&quot;376&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;ROA · ROE · ROI&lt;/text&gt;&lt;text x=&quot;780&quot; y=&quot;394&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;RI · EPS · P/E&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s9&quot;&gt;&lt;rect x=&quot;230&quot; y=&quot;448&quot; width=&quot;290&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--accbg)&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;375&quot; y=&quot;472&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;15&quot;&gt;9 · Building a scorecard&lt;/text&gt;&lt;text x=&quot;375&quot; y=&quot;490&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;4 steps · Jaguar · hypotheses to test&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s10&quot;&gt;&lt;rect x=&quot;580&quot; y=&quot;448&quot; width=&quot;280&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--accbg)&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;720&quot; y=&quot;472&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;15&quot;&gt;10 · Using the scorecard&lt;/text&gt;&lt;text x=&quot;720&quot; y=&quot;490&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;pay · gaming · CSR and GRI&lt;/text&gt;&lt;/a&gt;
&lt;/svg&gt;

&lt;/div&gt;&lt;/nav&gt;

&lt;main&gt;
&lt;section id=&quot;s1&quot; class=&quot;part p-slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;01&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section I · slides 3–20&lt;/div&gt;&lt;h2&gt;Strategy comes first&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

&lt;p&gt;&lt;b&gt;Learning objectives&lt;/b&gt; (slide 2): give examples of measures for each of the four perspectives; know the four types of quality cost and prepare a quality cost report; compute throughput time, delivery cycle time, manufacturing cycle efficiency and overall equipment effectiveness; build a balanced scorecard, link its measures and use it to evaluate a strategy.&lt;/p&gt;

&lt;h3&gt;The opening case: Enel and the “green” number that sets the interest rate&lt;/h3&gt;
&lt;p&gt;In 2019 Enel issued a USD 1.5 billion bond whose interest rate depends on a &lt;span class=&quot;t&quot;&gt;non-financial measure&lt;/span&gt; &lt;i&gt;(a measure not expressed in monetary terms)&lt;/i&gt;: the share of renewable capacity in total installed capacity.&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;The measure&lt;/h4&gt;Renewable capacity / total installed capacity (45.9% in mid-2019).&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;The target&lt;/h4&gt;At least 55% by the end of 2021.&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;If the target is missed&lt;/h4&gt;The rate rises by 0.25 percentage points until maturity (&lt;span class=&quot;t&quot;&gt;step-up&lt;/span&gt; &lt;i&gt;· automatic coupon increase&lt;/i&gt;).&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;The outcome&lt;/h4&gt;Orders of about 4 billion: almost three times the amount offered.&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;The key idea of the lecture: a non-financial measure matters when it is &lt;b&gt;linked&lt;/b&gt; to outcomes that &lt;span class=&quot;t&quot;&gt;stakeholders&lt;/span&gt; &lt;i&gt;(shareholders, customers, employees, communities…)&lt;/i&gt; consider important. The balanced scorecard makes these links visible.&lt;/p&gt;

&lt;h3&gt;Why measure performance, and why profit is not enough&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;To inform&lt;/h4&gt;Measures give employees the information they need to execute the strategy (a shift supervisor who sees today&#x27;s defect rate knows where to intervene) and give managers feedback: is the plan working?&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;To influence · shaping behaviour&lt;/h4&gt;Measures feed into bonuses and promotions: people focus on what they are evaluated on. It is a powerful tool that can backfire if the measure is poorly chosen (we will see this with Wells Fargo, §10).&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;It arrives late&lt;/h4&gt;Profit reports on the past quarter: by the time it falls, the causes occurred months earlier.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;It does not say why&lt;/h4&gt;A lower margin may stem from defects, slow deliveries, lost customers or untrained staff.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;It can be “managed”&lt;/h4&gt;Cutting training or maintenance raises this year&#x27;s profit and damages next year&#x27;s.&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Financial results remain the ultimate test; but we also need measures that show what happens &lt;b&gt;before&lt;/b&gt; the money moves.&lt;/p&gt;

&lt;h3&gt;Two reasons for non-financial measures&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Reason 1&lt;/span&gt;&lt;h4&gt;They capture underlying changes&lt;/h4&gt;Financial measures are &lt;span class=&quot;t&quot;&gt;lag indicators&lt;/span&gt; &lt;i&gt;(they summarise the outcome of past actions)&lt;/i&gt;; non-financial measures are &lt;span class=&quot;t&quot;&gt;leading indicators&lt;/span&gt; &lt;i&gt;(they move first and help predict the outcome)&lt;/i&gt;.&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Reason 2&lt;/span&gt;&lt;h4&gt;They are easier to understand and to influence&lt;/h4&gt;A warehouse manager cannot move &lt;span class=&quot;t&quot;&gt;return on equity&lt;/span&gt; &lt;i&gt;(the return on shareholders&#x27; equity)&lt;/i&gt;, but can improve the percentage of orders shipped on time.&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Leading and lagging: the same measure changes role along the chain&lt;/h4&gt;
&lt;div class=&quot;fig&quot; data-steps data-cb=&quot;llStep&quot;&gt;
&lt;svg viewBox=&quot;0 0 860 120&quot; id=&quot;llsvg&quot; aria-label=&quot;Chain from training hours to profit&quot;&gt;
&lt;g id=&quot;llnodes&quot;&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;Step 1.&lt;/b&gt; &lt;i&gt;Hours of staff training&lt;/i&gt; is leading with respect to &lt;i&gt;errors per order&lt;/i&gt;: more training today → fewer errors tomorrow.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;Step 2.&lt;/b&gt; &lt;i&gt;Errors per order&lt;/i&gt;, which was lagging in the previous step, is now leading for &lt;i&gt;customer satisfaction&lt;/i&gt;.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;Step 3.&lt;/b&gt; &lt;i&gt;Customer satisfaction&lt;/i&gt; anticipates &lt;i&gt;repeat purchases&lt;/i&gt;.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;Step 4.&lt;/b&gt; &lt;i&gt;Repeat purchases&lt;/i&gt; anticipate &lt;i&gt;profit&lt;/i&gt;, the final outcome. A good scorecard mixes both types: you act on the drivers and monitor the outcomes (slide 9).&lt;/div&gt;
&lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;next →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;def&quot;&gt;&lt;small&gt;Definition · slide 10&lt;/small&gt;A balanced scorecard is an integrated set of performance measures that are derived from and support a company&#x27;s strategy.&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Integrated&lt;/h4&gt;The measures are linked to one another: not a list.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Derived from&lt;/h4&gt;You start from the strategy and then choose the measures.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Support&lt;/h4&gt;The measures help people put the strategy into practice.&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;In practice, management translates &lt;b&gt;mission and strategy&lt;/b&gt; → &lt;b&gt;objectives in the four perspectives&lt;/b&gt; → &lt;b&gt;measures that employees understand and can influence&lt;/b&gt; (slide 11).&lt;/p&gt;

&lt;h4&gt;Where the idea comes from&lt;/h4&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;big&quot;&gt;1992&lt;/span&gt;&lt;p&gt;Robert Kaplan and David Norton propose, in the &lt;i&gt;Harvard Business Review&lt;/i&gt;, a balanced set of financial and operational measures.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;big&quot;&gt;1996&lt;/span&gt;&lt;p&gt;Their book presents the scorecard as a &lt;b&gt;management system&lt;/b&gt; for translating strategy into action, not merely as a report.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;big&quot;&gt;2004&lt;/span&gt;&lt;p&gt;&lt;span class=&quot;t&quot;&gt;Strategy maps&lt;/span&gt; &lt;i&gt;(diagrams of the cause-and-effect relationships among objectives)&lt;/i&gt; are introduced.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;&lt;b&gt;Balanced&lt;/b&gt; means a balance between financial and non-financial measures, short and long term, outcomes and drivers, internal and external views.&lt;/p&gt;

&lt;h3&gt;What strategy is: the customer value proposition&lt;/h3&gt;
&lt;p&gt;A &lt;b&gt;strategy&lt;/b&gt; is the “game plan” through which a company attracts customers by differentiating itself from competitors. Its distinctive features form the &lt;span class=&quot;t&quot;&gt;customer value proposition&lt;/span&gt; &lt;i&gt;(the reason why customers should choose us rather than others)&lt;/i&gt;. Quick test: complete the sentence “&lt;i&gt;You should choose us because…&lt;/i&gt;”. If you cannot say it in one sentence, you are not ready to build a scorecard.&lt;/p&gt;
&lt;p&gt;Strategy describes how the company matches its &lt;b&gt;capabilities&lt;/b&gt; with market &lt;b&gt;opportunities&lt;/b&gt;: this requires understanding the industry (customers, competitors, suppliers, substitutes, rules of the game) and the company&#x27;s own &lt;b&gt;strategic resources&lt;/b&gt; (what it owns or knows that others cannot easily copy). Example: a small winery with a few hectares of a rare grape variety, in a crowded market, opts for a limited, premium product rather than volume.&lt;/p&gt;

&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tl&quot; role=&quot;tablist&quot;&gt;
&lt;button class=&quot;btn on&quot; data-tab=&quot;ci&quot; type=&quot;button&quot;&gt;Customer intimacy&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-tab=&quot;oe&quot; type=&quot;button&quot;&gt;Operational excellence&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-tab=&quot;pl&quot; type=&quot;button&quot;&gt;Product leadership&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-tab=&quot;pairs&quot; type=&quot;button&quot;&gt;Same industry, opposite promises&lt;/button&gt;
&lt;/div&gt;
&lt;div data-panel=&quot;ci&quot; class=&quot;on card tint&quot;&gt;&lt;h4&gt;“Choose us because we tailor products and services to your needs better than our competitors”&lt;/h4&gt;&lt;p&gt;Think of a tailor, a private bank, a made-to-order luxury car, the Ritz Carlton (staff remember your preferences and can solve any problem on the spot). Guiding question for processes: &lt;b&gt;“Is it made for me?”&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;oe&quot; class=&quot;card tint&quot;&gt;&lt;h4&gt;“Choose us because we deliver faster, more conveniently and at a lower price”&lt;/h4&gt;&lt;p&gt;Low-cost airlines (Ryanair: “we get you there for less than anyone else, no frills”), discount stores, IKEA (low-cost design because you carry it home and assemble it yourself), Amazon (almost everything, at the right price, in one or two days). Guiding question: &lt;b&gt;“Is it cheap and fast?”&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;pl&quot; class=&quot;card tint&quot;&gt;&lt;h4&gt;“Choose us because we offer more innovative, higher-quality products”&lt;/h4&gt;&lt;p&gt;Pharmaceutical innovators, technology leaders, Apple (simple, beautiful products that work together), Ferrari (a rare car with a racing heritage that no one else can offer). Guiding question: &lt;b&gt;“Is it new and better?”&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;pairs&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Industry&lt;/th&gt;&lt;th&gt;One promise&lt;/th&gt;&lt;th&gt;The opposite promise&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Cars&lt;/td&gt;&lt;td&gt;&lt;b&gt;Dacia&lt;/b&gt;: everything you need and nothing more, at the lowest price&lt;/td&gt;&lt;td&gt;&lt;b&gt;Ferrari&lt;/b&gt;: performance and exclusivity, in limited numbers&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Fashion&lt;/td&gt;&lt;td&gt;&lt;b&gt;Zara&lt;/b&gt;: the latest trends in store within a few weeks, at affordable prices&lt;/td&gt;&lt;td&gt;&lt;b&gt;Brunello Cucinelli&lt;/b&gt;: handmade cashmere that lasts for years, made in Solomeo&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Groceries&lt;/td&gt;&lt;td&gt;&lt;b&gt;Lidl&lt;/b&gt;: low prices on a short, selected range&lt;/td&gt;&lt;td&gt;&lt;b&gt;Eataly&lt;/b&gt;: quality Italian food, with tastings and courses&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Different promises require different measures: two companies in the same industry should not share the same scorecard (slide 15).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;The three value disciplines come from Treacy &amp;amp; Wiersema, HBR 1993 (slide 17): see “Further reading”.&lt;/p&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check · match each company to its proposition (slides 18–19)&lt;/h3&gt;&lt;div id=&quot;qz-vp&quot;&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Why is profit alone not enough? Give three reasons.&lt;/summary&gt;&lt;div&gt;It arrives late (it reflects causes that occurred months earlier); it does not say why (defects? deliveries? lost customers?); it can be manipulated in the short term (cutting training and maintenance).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Is “errors per order” leading or lagging?&lt;/summary&gt;&lt;div&gt;It depends on the step in the chain: it is lagging with respect to training hours and leading with respect to customer satisfaction.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s2&quot; class=&quot;part p-slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;02&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section II · slides 21–34&lt;/div&gt;&lt;h2&gt;The framework: four perspectives and a chain&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;On the left, the &lt;b&gt;vision and strategy&lt;/b&gt; (what financial objectives? which customers to serve, and how to win and retain them? which internal processes are critical?); on the right, the measures organised into four &lt;span class=&quot;t&quot;&gt;perspectives&lt;/span&gt; &lt;i&gt;(viewpoints on performance)&lt;/i&gt;, each with a guiding question. Click a level.&lt;/p&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 300 330&quot; id=&quot;persp&quot; aria-label=&quot;The four perspectives&quot;&gt;
&lt;g id=&quot;pnodes&quot;&gt;&lt;/g&gt;
&lt;text x=&quot;150&quot; y=&quot;325&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; style=&quot;fill:var(--muted)&quot;&gt;read from bottom to top&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;card&quot; id=&quot;ppanel&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Strategy decides what goes in each box&lt;/h3&gt;
&lt;p&gt;Two pizzerias on the same street: &lt;b&gt;A&lt;/b&gt; wants to be the fastest and cheapest, &lt;b&gt;B&lt;/b&gt; the best in town. Read from the bottom up.&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Perspective&lt;/th&gt;&lt;th&gt;Pizzeria A · fast and cheap&lt;/th&gt;&lt;th&gt;Pizzeria B · the best in town&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Financial&lt;/td&gt;&lt;td&gt;Cost per pizza &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;, pizzas sold per evening &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Average price per pizza &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Customer&lt;/td&gt;&lt;td&gt;Repeat orders per customer &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Online reviews praising the taste &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Internal processes&lt;/td&gt;&lt;td&gt;Minutes from order to pizza &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;td&gt;New seasonal pizzas on the menu &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Learning and growth&lt;/td&gt;&lt;td&gt;Staff trained on every station &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Pizza chefs trained in dough and toppings &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Same street, same oven, different strategies: different measures in every box. A scorecard copied from a competitor measures the wrong things.&lt;/p&gt;

&lt;h3&gt;Every arrow is a hypothesis to be tested&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;small&gt;The if/then logic · slide 29&lt;/small&gt;If we improve this measure, then that other measure should also improve.&lt;/div&gt;
&lt;p&gt;Example: if the average training hours per employee increase, then errors per order should fall. After a few months you check: if errors do not decrease, either the training is poor or the errors have another cause. This makes the scorecard a &lt;b&gt;testable theory&lt;/b&gt;, not a list.&lt;/p&gt;

&lt;h3&gt;Strategy map: the chain on one page&lt;/h3&gt;
&lt;p&gt;A &lt;b&gt;strategy map&lt;/b&gt; shows the &lt;b&gt;objectives&lt;/b&gt; in each perspective and the &lt;b&gt;arrows&lt;/b&gt; indicating which objective should cause another, all on &lt;b&gt;one page&lt;/b&gt; so that every employee can see how their work leads to results. Each objective then receives a &lt;b&gt;measure&lt;/b&gt;, a &lt;b&gt;target&lt;/b&gt; and an &lt;b&gt;initiative&lt;/b&gt;: this is the scorecard.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 860 330&quot; aria-label=&quot;Ryanair strategy map&quot;&gt;
&lt;g font-size=&quot;13&quot;&gt;
&lt;text x=&quot;10&quot; y=&quot;45&quot; font-weight=&quot;600&quot;&gt;Financial&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;125&quot; font-weight=&quot;600&quot;&gt;Customer&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;205&quot; font-weight=&quot;600&quot;&gt;Processes&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;278&quot; font-weight=&quot;600&quot;&gt;Learning&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;294&quot; font-weight=&quot;600&quot;&gt;&amp;amp; growth&lt;/text&gt;
&lt;/g&gt;

&lt;/figure&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Perspective&lt;/th&gt;&lt;th&gt;Objective&lt;/th&gt;&lt;th&gt;Measure&lt;/th&gt;&lt;th&gt;Target&lt;/th&gt;&lt;th&gt;Initiative&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Financial&lt;/td&gt;&lt;td&gt;Low cost per seat&lt;/td&gt;&lt;td&gt;Cost per passenger &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Lowest in Europe&lt;/td&gt;&lt;td&gt;Large orders of a single aircraft type&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Customer&lt;/td&gt;&lt;td&gt;Flights on time&lt;/td&gt;&lt;td&gt;Flights on time &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;90%&lt;/td&gt;&lt;td&gt;Daily punctuality report by base&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Processes&lt;/td&gt;&lt;td&gt;Fast turnaround&lt;/td&gt;&lt;td&gt;Minutes from landing to take-off &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;td&gt;25&lt;/td&gt;&lt;td&gt;Front and rear stairs, no assigned gates&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Learning &amp;amp; growth&lt;/td&gt;&lt;td&gt;Crews work as one team&lt;/td&gt;&lt;td&gt;Crews trained in the turnaround routine &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;100%&lt;/td&gt;&lt;td&gt;Training for every new member&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Map = which objectives cause which. Scorecard = how we measure each objective and how far we want to go. Illustrative targets (slide 32).&lt;/p&gt;

&lt;h3&gt;Two rules for every measure&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;1 · Give it an arrow&lt;/h4&gt;“Employee turnover 12%”: good or bad? On its own, you cannot tell. “Employee turnover ↓”: now the objective is clear. Without an arrow, a number is information; &lt;b&gt;with the arrow it becomes an objective&lt;/b&gt;.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;2 · The € sign does not make it financial&lt;/h4&gt;Ask what the measure is about, not what unit it is expressed in. Cost of quality → internal process; training spend per employee → learning and growth; &lt;span class=&quot;t&quot;&gt;customer lifetime value&lt;/span&gt; &lt;i&gt;(present value of the margins expected from a customer over time)&lt;/i&gt; → customer; net operating income → financial.&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;Three misreadings (slide 34)&lt;/h4&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;What people sometimes think&lt;/th&gt;&lt;th&gt;What the scorecard really is&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;“It is a long list of KPIs”&lt;/td&gt;&lt;td&gt;A &lt;b&gt;short&lt;/b&gt; set of measures chosen because they derive from the strategy and are linked to one another. (&lt;span class=&quot;t&quot;&gt;KPI&lt;/span&gt; &lt;i&gt;· key performance indicator&lt;/i&gt;)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;“Improve the operating numbers and profit will follow”&lt;/td&gt;&lt;td&gt;The financial perspective exists to verify this. If it does not happen, the strategy must be reconsidered.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;“The same scorecard suits everyone”&lt;/td&gt;&lt;td&gt;Measures differ from company to company because strategies differ.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between a strategy map and a scorecard?&lt;/summary&gt;&lt;div&gt;The map shows the objectives and the cause-and-effect relationships among them; the scorecard assigns each objective a measure (with a direction), a target and an initiative.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is the financial perspective at the top?&lt;/summary&gt;&lt;div&gt;It is what ultimately matters to shareholders: all the underlying improvements should translate into results there. If this never happens, the strategy itself may be wrong.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;“Lost sales due to out of stock merchandise” is expressed in euros: which perspective does it belong to?&lt;/summary&gt;&lt;div&gt;Internal business process: it describes a failure of the inventory management process, even though it is expressed in monetary terms (slide 87).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s3&quot; class=&quot;part p-sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;03&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section III · slides 35–55&lt;/div&gt;&lt;h2&gt;People, processes and customers&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tl&quot; role=&quot;tablist&quot;&gt;&lt;button class=&quot;btn on&quot; data-tab=&quot;lg&quot; type=&quot;button&quot;&gt;Learning and growth&lt;/button&gt;&lt;button class=&quot;btn&quot; data-tab=&quot;ip&quot; type=&quot;button&quot;&gt;Internal processes&lt;/button&gt;&lt;button class=&quot;btn&quot; data-tab=&quot;cu&quot; type=&quot;button&quot;&gt;Customer&lt;/button&gt;&lt;/div&gt;

&lt;div data-panel=&quot;lg&quot; class=&quot;on&quot;&gt;
&lt;p&gt;“Our employees are our most important asset”: the scorecard asks us to take this seriously and to &lt;b&gt;measure&lt;/b&gt; it. The reasoning: if a company with a &lt;b&gt;viable strategy&lt;/b&gt; develops its employees&#x27; capabilities, financial performance should improve. Note the condition: brilliant people cannot save a strategy that customers do not want. Learning and growth is &lt;b&gt;the foundation of the chain, not a substitute for it&lt;/b&gt;.&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Area&lt;/th&gt;&lt;th&gt;Question&lt;/th&gt;&lt;th&gt;Measures (slides 39–40)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Recruiting&lt;/td&gt;&lt;td&gt;Do we attract the best candidates at a reasonable cost?&lt;/td&gt;&lt;td&gt;% of “outstanding” candidates who accept &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; recruiting spend per hire &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Skills development&lt;/td&gt;&lt;td&gt;Do people receive training, mentoring and resources?&lt;/td&gt;&lt;td&gt;% agreeing “I have the resources to do my job” &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; average hours of mentorship &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt; and of training &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Pay and advancement&lt;/td&gt;&lt;td&gt;Can good performers grow and be promoted from within?&lt;/td&gt;&lt;td&gt;Leadership positions filled internally &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; % promoted in the last 3 years &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; average pay increase &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Wellness and safety&lt;/td&gt;&lt;td&gt;Are people healthy, present and safe?&lt;/td&gt;&lt;td&gt;Absenteeism rate &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; injuries per employee &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Job satisfaction&lt;/td&gt;&lt;td&gt;Do people enjoy their work and is their contribution recognised?&lt;/td&gt;&lt;td&gt;“This is a great place to work” &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; “my contribution is recognised” &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; improvement suggestions per employee &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Retention&lt;/td&gt;&lt;td&gt;Do good performers stay long enough to gain experience?&lt;/td&gt;&lt;td&gt;Employee turnover &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; average years of service &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;A people measure earns its place only if it moves something else: &lt;i&gt;training hours ↑ → errors in the process ↓&lt;/i&gt;; &lt;i&gt;employee turnover ↓ → customer loyalty ↑&lt;/i&gt; (the “familiar face” argument: customers like dealing with the same people). &lt;b&gt;Both links are hypotheses, not facts.&lt;/b&gt;&lt;/p&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Italian example · slide 42&lt;/span&gt;&lt;h4&gt;Luxottica (Agordo, BL): welfare as part of the strategy&lt;/h4&gt;&lt;p&gt;One of the first Italian companies with a corporate welfare system (supplementary healthcare, free check-ups for employees over 50, scholarships for employees&#x27; children). 2024–2026 agreement: &lt;b&gt;a four-day week for 20 weeks a year&lt;/b&gt; in six Italian plants, at the same pay and on a voluntary basis. Scorecard measures it should move: absenteeism &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;, turnover &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;, applications per open position &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;. &lt;span class=&quot;src&quot;&gt;Source cited in the slide: Il Giornale, 30/11/2023.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div data-panel=&quot;ip&quot;&gt;
&lt;p&gt;A &lt;span class=&quot;t&quot;&gt;business process&lt;/span&gt; &lt;i&gt;(a series of steps followed to carry out a task)&lt;/i&gt; cuts across departments: sales takes the order → purchasing buys the materials → production makes the product → logistics ships it. The customer sees only how long the whole order took and whether it arrived correct: improving a process measure &lt;b&gt;forces managers from different departments to cooperate&lt;/b&gt;.&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Dimension&lt;/th&gt;&lt;th&gt;Question&lt;/th&gt;&lt;th&gt;Typical measures&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Innovation&lt;/td&gt;&lt;td&gt;How many new products and patents do we create?&lt;/td&gt;&lt;td&gt;New products designed &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; patents approved &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; % of previously designed parts reused &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Quality&lt;/td&gt;&lt;td&gt;How often does everything work right the first time?&lt;/td&gt;&lt;td&gt;Warranty claims &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; defect-free units / units completed &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; complaints resolved at first contact &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Agility&lt;/td&gt;&lt;td&gt;How quickly do we adapt?&lt;/td&gt;&lt;td&gt;Modular designs &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; suppliers on long-term contracts &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; average batch size &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Cost&lt;/td&gt;&lt;td&gt;How much do we spend on what adds no value?&lt;/td&gt;&lt;td&gt;Cost of quality &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; non value added activity costs &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; sales lost to stock-outs &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Time&lt;/td&gt;&lt;td&gt;How long from order to shipment, and how much of it is real work?&lt;/td&gt;&lt;td&gt;Delivery cycle time &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; throughput time &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; MCE &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt; (§7)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Lean resources&lt;/td&gt;&lt;td&gt;Plant, inventory and space without waste?&lt;/td&gt;&lt;td&gt;OEE &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt; (§8); WIP as % of sales &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; workstation cleanliness score &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;Each strategy looks first at one column: product leaders at &lt;b&gt;innovation&lt;/b&gt; (“Is it new and better?”, e.g. Apple), operational excellence at &lt;b&gt;cost and time&lt;/b&gt; (“Is it cheap and fast?”, Ryanair), customer intimacy at &lt;b&gt;service and flexibility&lt;/b&gt; (“Is it made for me?”, Ritz Carlton).&lt;/p&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Case · slide 49&lt;/span&gt;&lt;h4&gt;Stellantis: 14 brands on a few shared platforms&lt;/h4&gt;&lt;p&gt;Formed in 2021 from the FCA–PSA merger; in July 2021 it announced that its electric cars would be built on four platforms (STLA Small, Medium, Large, Frame) with three common drive modules. The same idea as Toyota and Volkswagen: share components to buy in volume, design faster and spend less on plant. The risk: cars from different brands becoming too similar. &lt;b&gt;Possible process measures:&lt;/b&gt; share of models on the four platforms &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;, share of parts common across brands &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;, months from design to launch &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;h4&gt;Which strategy would adopt each measure? (slides 50–51)&lt;/h4&gt;
&lt;div id=&quot;qz-proc&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div data-panel=&quot;cu&quot;&gt;
&lt;p&gt;If a company improves its people and processes, the gains must &lt;b&gt;eventually&lt;/b&gt; show up in the customer measures. If they do not, the company has not understood what shapes customers&#x27; perceptions and behaviour.&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Area&lt;/th&gt;&lt;th&gt;Measures (slides 54–55)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Satisfaction&lt;/td&gt;&lt;td&gt;% “would readily recommend your company” &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; customer referrals &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Acquisition&lt;/td&gt;&lt;td&gt;Market share &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; average customer acquisition cost &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; % of leads converted into sales &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Retention&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;t&quot;&gt;Customer defection rate&lt;/span&gt; &lt;i&gt;(share of customers who leave us)&lt;/i&gt; &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Lifetime value&lt;/td&gt;&lt;td&gt;Average revenue per order &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; average gross margin per order &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; average time between purchases &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Loyalty&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;t&quot;&gt;Share of wallet&lt;/span&gt; &lt;i&gt;(share of the customer&#x27;s spending that comes to us)&lt;/i&gt; &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; innovations co-developed with customers &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Service&lt;/td&gt;&lt;td&gt;% agreeing “order delivered on time”, “problem solved quickly”, “website easy to use”, “treated courteously” &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Proposition&lt;/td&gt;&lt;td&gt;Customer perception of our product leadership / operational excellence / customer intimacy &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Note: many customer measures are built on surveys using “strongly agree”. This is the operational translation of the word &lt;i&gt;recognise&lt;/i&gt;: what is measured is perception, not just internal performance.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why are “customers served by processes, not by departments”?&lt;/summary&gt;&lt;div&gt;The customer sees only the outcome of the whole chain (total time, correct order). A process measure cuts across departments and therefore forces them to cooperate instead of each optimising its own piece.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Long term supplier contracts ↑: which strategy?&lt;/summary&gt;&lt;div&gt;In the slides: customer intimacy (partners able to meet special requests). One can also argue for operational excellence: stable suppliers = reliable sourcing and lower purchase costs (note on slide 51).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What does the condition “with a viable strategy” imply?&lt;/summary&gt;&lt;div&gt;That investing in people improves results only if the strategy is sound: learning and growth is the foundation of the chain and cannot replace it.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s4&quot; class=&quot;part p-ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;04&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section IV · slides 56–90&lt;/div&gt;&lt;h2&gt;Financial measures&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;small&gt;Why keep the financial perspective · slide 60&lt;/small&gt;The scorecard does not assume that better processes automatically bring better profits. It checks.&lt;/div&gt;
&lt;p&gt;The financial perspective holds the organisation accountable for turning non-financial improvements into &lt;span class=&quot;t&quot;&gt;bottom line&lt;/span&gt; &lt;i&gt;(net income, the last line of the income statement)&lt;/i&gt; results. If favourable trends in people, processes and customers do not translate into results, the scorecard forces a rethink of how the company differentiates itself.&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Sales&lt;/h4&gt;Sales from new customers; from products less than 3 years old (suited to product leadership); patent-protected sales &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Profits&lt;/h4&gt;Contribution margin; net operating income; residual income &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Ratios&lt;/h4&gt;Gross margin %; net profit margin %; ROA; ROE &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Trend · cash · market&lt;/h4&gt;Growth rates; operating cash flow (÷ average assets, ÷ sales); stock price, EPS, P/E &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;. They show what profit does not reveal: &lt;b&gt;liquidity&lt;/b&gt; and &lt;b&gt;investor expectations&lt;/b&gt;.&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The basics: income statement and balance sheet&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 320 200&quot; aria-label=&quot;Diagram of the income statement&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;145&quot; height=&quot;120&quot; rx=&quot;6&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;82&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Negative items&lt;/text&gt;&lt;text x=&quot;82&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;(expenses)&lt;/text&gt;
&lt;rect x=&quot;10&quot; y=&quot;134&quot; width=&quot;145&quot; height=&quot;56&quot; rx=&quot;6&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;82&quot; y=&quot;167&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--paper)&quot; font-weight=&quot;600&quot;&gt;Net income&lt;/text&gt;
&lt;rect x=&quot;165&quot; y=&quot;10&quot; width=&quot;145&quot; height=&quot;180&quot; rx=&quot;6&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;237&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Positive items&lt;/text&gt;&lt;text x=&quot;237&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;(revenues)&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;&lt;b&gt;Income statement&lt;/b&gt;: compares the positive and negative items of the year; the difference is &lt;b&gt;net income&lt;/b&gt;. It is a &lt;b&gt;film&lt;/b&gt;: it covers the whole year.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 320 200&quot; aria-label=&quot;Diagram of the balance sheet&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;145&quot; height=&quot;180&quot; rx=&quot;6&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;82&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Assets&lt;/text&gt;
&lt;rect x=&quot;165&quot; y=&quot;10&quot; width=&quot;145&quot; height=&quot;110&quot; rx=&quot;6&quot; fill=&quot;var(--accbg)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;237&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Liabilities&lt;/text&gt;
&lt;rect x=&quot;165&quot; y=&quot;124&quot; width=&quot;145&quot; height=&quot;66&quot; rx=&quot;6&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;237&quot; y=&quot;153&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Equity&lt;/text&gt;&lt;text x=&quot;237&quot; y=&quot;171&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;includes net income&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;&lt;b&gt;Balance sheet&lt;/b&gt;: at year end, what the company owns and how it is financed. &lt;b&gt;Assets = Liabilities + Equity&lt;/b&gt;. It is a &lt;b&gt;snapshot&lt;/b&gt; of a single day.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Glossary of items (slides 64–66)&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;b&gt;Assets&lt;/b&gt;: cash and cash equivalents (cash and bank accounts); accounts receivable (amounts owed by customers for goods already delivered); inventories; property, plant and equipment (assets not easily converted into cash: computers, cars, plant); securities (financial instruments bought as investments).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Liabilities&lt;/b&gt;: bank overdraft; accounts payable (amounts owed to suppliers); notes payable (an obligation to repay at a future date); severance provisions (funds set aside for employees&#x27; severance pay, in Italy the TFR); long term borrowings (debt due beyond 12 months).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Equity&lt;/b&gt;: share capital (capital contributed by shareholders); par value (the nominal value of a share); additional paid in capital (the amount paid above par value); retained earnings (accumulated undistributed profits); net income (profit or loss for the year).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Three tools for making sense of the numbers: Norton Corporation&lt;/h3&gt;
&lt;p&gt;A financial statement item on its own says little: it gains meaning when you &lt;b&gt;compare&lt;/b&gt; it. Norton Corporation is a textbook company with two years of financial statements (slides 67–69).&lt;/p&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button class=&quot;btn on&quot; data-tab=&quot;h&quot; type=&quot;button&quot;&gt;1 · Horizontal analysis&lt;/button&gt;&lt;button class=&quot;btn&quot; data-tab=&quot;v&quot; type=&quot;button&quot;&gt;2 · Common size&lt;/button&gt;&lt;button class=&quot;btn&quot; data-tab=&quot;bs&quot; type=&quot;button&quot;&gt;Balance sheet&lt;/button&gt;&lt;/div&gt;
&lt;div data-panel=&quot;h&quot; class=&quot;on&quot;&gt;
&lt;p&gt;&lt;b&gt;Horizontal (trend) analysis&lt;/b&gt;: the same line, years side by side. &lt;span class=&quot;formula&quot; style=&quot;display:block&quot;&gt;Change = This year − Last year &amp;nbsp;·&amp;nbsp; % change = Change ÷ Last year&lt;/span&gt; Changes in currency show what &lt;b&gt;matters most&lt;/b&gt; (+44,000 in sales counts more than +2,000 in stationery); percentage changes show what is &lt;b&gt;unusual&lt;/b&gt; (stationery from 2,000 to 4,000 = +100%: little money, but it deserves a question).&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;$&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;This year&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Last year&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Change&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;%&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;494,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;450,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;44,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;9.8%&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;140,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;127,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;13,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.2%&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Gross margin&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;354,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;323,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;31,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;9.6%&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Operating expenses&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;270,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;249,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;21,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8.4%&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;84,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;74,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;13.5%&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Interest expense&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;7,300&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(700)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(8.8%)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Net income before taxes&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;76,700&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;66,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,700&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;16.2%&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Income taxes (30%)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;23,010&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;19,800&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,210&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;16.2%&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;53,690&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;46,200&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;7,490&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;16.2%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Sales +9.8%, net income +16.2%: the costs below gross margin grew less than sales. &lt;b&gt;Gross margin&lt;/b&gt; = sales − cost of goods sold (product costs only); &lt;b&gt;interest expense&lt;/b&gt; = the cost of financial resources.&lt;/p&gt;
&lt;/div&gt;
&lt;div data-panel=&quot;v&quot;&gt;
&lt;p&gt;&lt;b&gt;Vertical analysis&lt;/b&gt;: relationships among items at a given point in time. The &lt;b&gt;common size statement&lt;/b&gt; expresses each item as a % of a total: of &lt;b&gt;sales&lt;/b&gt; in the income statement, of &lt;b&gt;total assets&lt;/b&gt; in the balance sheet. This makes companies of different sizes, or years with different volumes, comparable.&lt;/p&gt;
&lt;div id=&quot;cs&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Gross margin is stable (about 72 cents of each sales euro remain after product costs); operating expenses fall from 55.3% to 54.7%, so net income rises from 10.3% to 10.9% of sales.&lt;/p&gt;
&lt;/div&gt;
&lt;div data-panel=&quot;bs&quot;&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;$&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;This year&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Last year&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;30,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Accounts receivable, net&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;17,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Inventory&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;12,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Prepaid expenses&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Land&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;165,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;123,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Buildings and equipment, net&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;116,390&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;128,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total assets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;346,390&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;300,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Accounts payable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;39,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;40,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Notes payable (short + long term)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;73,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;80,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Common stock, $1 par&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;27,400&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;17,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Additional paid in capital&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;158,100&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;113,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Retained earnings&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;48,890&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total stockholders&#x27; equity&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;234,390&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;180,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;3 · Financial perspective ratios&lt;/h3&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;The “film ÷ snapshot” rule&lt;/b&gt; (slide 82): when a ratio divides an income statement amount (a film, the whole year) by a balance sheet amount (a snapshot, a single day), the denominator uses the &lt;b&gt;average&lt;/b&gt; of the beginning and end of the year. Profit is earned throughout the year, so it must be compared with the resources available on average.&lt;/div&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Gross margin percentage&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;Gross margin ÷ Sales&lt;/div&gt;354,000 ÷ 494,000 = &lt;b class=&quot;big&quot; style=&quot;font-size:1.8rem&quot;&gt;71.7%&lt;/b&gt;&lt;p&gt;How much of each euro remains after the cost of the product: pricing power or low-cost production. Luxury firms (Ferrari, Prada) retain a lot; discounters retain little and win on volume.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Net profit margin percentage&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;Net income ÷ Sales&lt;/div&gt;53,690 ÷ 494,000 = &lt;b class=&quot;big&quot; style=&quot;font-size:1.8rem&quot;&gt;10.9%&lt;/b&gt;&lt;p&gt;How much becomes profit after all costs (selling, administrative, interest, taxes). Supermarkets: a few cents; large software companies: 20 or more.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Return on assets (ROA)&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;[Net income + Interest × (1 − t)] ÷ Avg total assets&lt;/div&gt;[53,690 + 7,300 × 0.70] ÷ [(300,000 + 346,390) ÷ 2] = 58,800 ÷ 323,195 = &lt;b class=&quot;big&quot; style=&quot;font-size:1.8rem&quot;&gt;18.19%&lt;/b&gt;&lt;p&gt;Profit on everything the company owns. Interest (net of tax) is &lt;b&gt;added back&lt;/b&gt; so that more and less indebted companies can be compared fairly. High in “asset-light” businesses, low in railways, steelworks and utilities.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Return on equity (ROE)&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;Net income ÷ Avg stockholders&#x27; equity&lt;/div&gt;53,690 ÷ [(180,000 + 234,390) ÷ 2] = 53,690 ÷ 207,195 = &lt;b class=&quot;big&quot; style=&quot;font-size:1.8rem&quot;&gt;25.91%&lt;/b&gt;&lt;p&gt;Profit per euro invested by shareholders. ROE &amp;gt; ROA, as at Norton, signals the use of debt (&lt;span class=&quot;t&quot;&gt;leverage&lt;/span&gt; &lt;i&gt;· financial leverage&lt;/i&gt;). Banks (Intesa Sanpaolo, UniCredit) put it at the centre of their results.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Earnings per share (EPS)&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;Net income ÷ Avg common shares outstanding&lt;/div&gt;53,690 ÷ [(17,000 + 27,400) ÷ 2] = 53,690 ÷ 22,200 = &lt;b class=&quot;big&quot; style=&quot;font-size:1.8rem&quot;&gt;$2.42&lt;/b&gt;&lt;p&gt;How much profit belongs to each share: the starting point for dividends and share price. Listed companies announce it every quarter, and a “miss” against forecasts can send the stock tumbling in a day.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Price earnings ratio (P/E)&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;Market price per share ÷ EPS&lt;/div&gt;20.00 ÷ 2.42 = &lt;b class=&quot;big&quot; style=&quot;font-size:1.8rem&quot;&gt;8.26×&lt;/b&gt;&lt;p&gt;How many euros are paid today for one euro of this year&#x27;s earnings: it measures growth &lt;b&gt;expectations&lt;/b&gt;, not current performance. Growing tech firms: high multiples; mature banks and utilities: low.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;ROI and residual income: evaluating a division&lt;/h3&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;b&gt;ROI&lt;/b&gt; = Net operating income (EBIT) ÷ Average operating assets = &lt;b&gt;Margin&lt;/b&gt; × &lt;b&gt;Turnover&lt;/b&gt;&lt;br&gt;Margin = NOI ÷ Sales &amp;nbsp;·&amp;nbsp; Turnover = Sales ÷ Avg operating assets&lt;/div&gt;
&lt;p&gt;&lt;span class=&quot;t&quot;&gt;EBIT&lt;/span&gt; &lt;i&gt;(earnings before interest and taxes, operating income)&lt;/i&gt;. &lt;b&gt;Operating assets&lt;/b&gt; (cash, receivables, inventory, plant used in operations) are measured at &lt;span class=&quot;t&quot;&gt;net book value&lt;/span&gt; &lt;i&gt;(historical cost less accumulated depreciation: a 100,000 machine depreciated by 20,000 a year is worth 40,000 after 3 years)&lt;/i&gt;. Norton (all assets treated as operating): margin 84,000 ÷ 494,000 = 17.0%; turnover 494,000 ÷ 323,195 = 1.53; ROI = &lt;b&gt;26.0%&lt;/b&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;b&gt;Residual income&lt;/b&gt; = NOI − (Average operating assets × Minimum required rate of return)&lt;/div&gt;
&lt;p&gt;It is an amount in currency: it tells whether the division earns more than the minimum return required by the owners. Norton with a 15% minimum: 84,000 − 323,195 × 15% = &lt;b&gt;$35,521&lt;/b&gt;. In practice, this is the idea behind &lt;span class=&quot;t&quot;&gt;economic value added (EVA)&lt;/span&gt; &lt;i&gt;(profit less a charge for all the capital employed)&lt;/i&gt;, made famous by Coca-Cola in the 1990s.&lt;/p&gt;
&lt;div class=&quot;fig&quot;&gt;
&lt;h4 style=&quot;margin-top:0&quot;&gt;Lab: why residual income corrects a flaw in ROI&lt;/h4&gt;
&lt;p class=&quot;cap&quot; style=&quot;margin-top:0&quot;&gt;A division with assets of 1,000 and NOI of 250 (ROI 25%) is offered a project of 200. The company requires at least 15%. Move the project&#x27;s return.&lt;/p&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;rr&quot;&gt;Project return&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rr&quot; min=&quot;0&quot; max=&quot;35&quot; step=&quot;0.5&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;rro&quot;&gt;20%&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;rm&quot;&gt;Minimum required&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rm&quot; min=&quot;5&quot; max=&quot;25&quot; step=&quot;0.5&quot; value=&quot;15&quot;&gt;&lt;output id=&quot;rmo&quot;&gt;15%&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;ROI before&lt;/span&gt;&lt;b&gt;25.0%&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;ROI after the project&lt;/span&gt;&lt;b id=&quot;roi2&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Δ residual income&lt;/span&gt;&lt;b id=&quot;ri2&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p id=&quot;rimsg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;h4&gt;Norton at a glance&lt;/h4&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Ratio&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Norton&lt;/th&gt;&lt;th&gt;Scorecard heading&lt;/th&gt;&lt;th&gt;Goal&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Gross margin %&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;71.7%&lt;/td&gt;&lt;td&gt;Profitability ratios&lt;/td&gt;&lt;td class=&quot;up&quot;&gt;↑&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Net profit margin %&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.9%&lt;/td&gt;&lt;td&gt;Profitability ratios&lt;/td&gt;&lt;td class=&quot;up&quot;&gt;↑&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ROA&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;18.19%&lt;/td&gt;&lt;td&gt;Profitability ratios&lt;/td&gt;&lt;td class=&quot;up&quot;&gt;↑&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ROE&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;25.91%&lt;/td&gt;&lt;td&gt;Profitability ratios&lt;/td&gt;&lt;td class=&quot;up&quot;&gt;↑&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;EPS&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$2.42&lt;/td&gt;&lt;td&gt;Market performance&lt;/td&gt;&lt;td class=&quot;up&quot;&gt;↑&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P/E&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8.26×&lt;/td&gt;&lt;td&gt;Market performance&lt;/td&gt;&lt;td class=&quot;up&quot;&gt;↑&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;A ratio becomes a scorecard measure only when it has a &lt;b&gt;direction&lt;/b&gt;, a &lt;b&gt;target&lt;/b&gt; and a &lt;b&gt;link&lt;/b&gt; to the non-financial measures that drive it.&lt;/p&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check · which perspective does each measure belong to? (slides 86–87)&lt;/h3&gt;
&lt;div id=&quot;qz-persp&quot;&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Why is Interest × (1 − tax rate) added in ROA?&lt;/summary&gt;&lt;div&gt;To make ROA independent of how the assets are financed: interest is a cost of debt, not of managing the assets. It is added back net of tax because it is deductible (it saves 30% in taxes).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Compute: ROI with a margin of 10% and a turnover of 2.&lt;/summary&gt;&lt;div&gt;ROI = 10% × 2 = 20%.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Label, link and name the strategy: companies A–D (slides 88–90)&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;b&gt;A&lt;/b&gt; · L&amp;amp;G years of service ↑ → Process new products designed ↑ → Customer market share ↑ → Financial sales from products less than 3 years old ↑. &lt;b&gt;Product leadership.&lt;/b&gt;&lt;/p&gt;
&lt;p&gt;&lt;b&gt;B&lt;/b&gt; · L&amp;amp;G “outstanding” candidates who accept ↑ → Process patents approved ↑ → Customer perception of product leadership ↑ → Financial patent-protected sales ↑. &lt;b&gt;Product leadership.&lt;/b&gt;&lt;/p&gt;
&lt;p&gt;&lt;b&gt;C&lt;/b&gt; · L&amp;amp;G improvement suggestions ↑ → Process pounds of waste ↓ → Customer perceived environmental stewardship ↑ → Financial revenue from eco products ↑. &lt;b&gt;Open question&lt;/b&gt;: waste and suggestions point to operational excellence, while eco products and a green image point to product leadership. It shows that social and environmental measures fit within the four perspectives.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;D&lt;/b&gt; · L&amp;amp;G training hours ↑ → Process MCE ↑ → Customer “delivered on time” ↑ → Financial NOI growth ↑. &lt;b&gt;Operational excellence.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s5&quot; class=&quot;part p-brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;05&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section V · slides 91–101&lt;/div&gt;&lt;h2&gt;The cost of quality&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;small&gt;Definition · slide 92&lt;/small&gt;Costs incurred to prevent defects, or that result from defects in products, are known as quality costs.&lt;/div&gt;
&lt;p&gt;These costs are often large and scattered across many departments; many companies work to reduce them, and those that succeed have a high &lt;span class=&quot;t&quot;&gt;quality of conformance&lt;/span&gt; &lt;i&gt;(the degree to which a product meets or exceeds its design specifications and is free of defects that impair its appearance or performance)&lt;/i&gt;. The question is not “is it a luxury product?” but “&lt;b&gt;does it do what it was designed to do, every time?&lt;/b&gt;”. A simple city bike whose brakes always work has high quality of conformance; an expensive racing bike whose gears slip does not, however advanced its design.&lt;/p&gt;

&lt;h3&gt;Four types of quality cost&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--slate-bg);border:0&quot;&gt;&lt;span class=&quot;pill&quot; style=&quot;color:var(--slate)&quot;&gt;Before defects&lt;/span&gt;&lt;h4&gt;Prevention costs&lt;/h4&gt;Support activities that stop defects from arising: systems development, quality engineering, quality training, &lt;span class=&quot;t&quot;&gt;quality circles&lt;/span&gt; &lt;i&gt;(small groups of workers who analyse and solve quality problems)&lt;/i&gt;, &lt;span class=&quot;t&quot;&gt;statistical process control&lt;/span&gt; &lt;i&gt;(SPC: statistical monitoring of the process to detect drifts before they produce defects)&lt;/i&gt;, quality supervision and data, improvement projects, technical support to suppliers.&lt;p&gt;&lt;b&gt;Test:&lt;/b&gt; does it prevent a defect from being created?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--slate-bg);border:0&quot;&gt;&lt;span class=&quot;pill&quot; style=&quot;color:var(--slate)&quot;&gt;Before defects&lt;/span&gt;&lt;h4&gt;Appraisal costs&lt;/h4&gt;Inspection costs incurred to find defective products before they reach customers: inspection of incoming materials and of &lt;span class=&quot;t&quot;&gt;work in process&lt;/span&gt; &lt;i&gt;(partly finished goods)&lt;/i&gt;, final testing, test materials, supervision of testing, depreciation and maintenance of test equipment, utilities in the inspection area, field testing at the customer&#x27;s site.&lt;p&gt;&lt;b&gt;Test:&lt;/b&gt; does it look for defects that may already exist?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--brick-bg);border:0&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Because of defects&lt;/span&gt;&lt;h4&gt;Internal failure costs&lt;/h4&gt;Defects found &lt;b&gt;before&lt;/b&gt; shipment: scrap (net cost of scrap and spoilage), rework, re-inspection and re-testing, downtime caused by quality problems, disposal of defective products, root-cause analysis, correction of data-entry errors.&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--brick-bg);border:0&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Because of defects&lt;/span&gt;&lt;h4&gt;External failure costs&lt;/h4&gt;The defect reaches the customer: customer service and complaints, warranty repairs and replacements, out-of-warranty repairs, product recalls, product liability, returns and allowances, sales lost to a poor reputation. &lt;b&gt;The most expensive place to find a defect.&lt;/b&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;b&gt;Cost of quality&lt;/b&gt; = prevention + appraisal + internal failure + external failure &amp;nbsp;→&amp;nbsp; goal: reduce the total over time&lt;/div&gt;

&lt;h3&gt;The further a defect travels, the more it costs: the Serio Bikes brake cable&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 860 300&quot; aria-label=&quot;Cost per defect at the four stages&quot;&gt;
&lt;g id=&quot;brk&quot;&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Illustrative costs per defect (slide 97), on a logarithmic scale: each tick is ×10. Prevention €2 (a sturdier cable agreed with the supplier, trained assemblers) · Appraisal €10 (testing every brake before packing) · Internal failure €40 (replacing the cable at the factory: labour, parts, delayed order) · External failure €400 or more (warranty, shipping, an angry customer, negative reviews, risk of accident and recall).&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Spend a little more before…&lt;/h4&gt;An effective quality programme spends more on prevention &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt; and appraisal &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; the investment is &lt;b&gt;more than offset&lt;/b&gt; by the drop in internal and external failure &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;, so the total falls.&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;…lose much less after&lt;/h4&gt;Over time, appraisal should also decline: if defects are prevented at the source, there is less to inspect. &lt;b&gt;Every euro shifted from failure to prevention is a sign that the quality system is maturing.&lt;/b&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check · classify the 19 activities (slides 100–101)&lt;/h3&gt;
&lt;div id=&quot;qz-coq&quot;&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Which two categories are incurred to &lt;i&gt;avoid&lt;/i&gt; poor quality, and which two arise &lt;i&gt;because&lt;/i&gt; it has occurred?&lt;/summary&gt;&lt;div&gt;Prevention and appraisal serve to stop poor quality of conformance from reaching customers; internal and external failure are incurred because poor quality has occurred.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s6&quot; class=&quot;part p-brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;06&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section VI · slides 102–123&lt;/div&gt;&lt;h2&gt;Quality cost reports&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;A &lt;b&gt;quality cost report&lt;/b&gt; details the prevention, appraisal, internal failure and external failure costs arising from current quality efforts; it is used to monitor the reduction of total cost, usually by comparing two or more periods. Structure: (1) the four categories with detail lines and a subtotal; (2) the total, i.e. the cost of quality; (3) each amount also as a &lt;b&gt;percentage&lt;/b&gt; of a base, usually sales; (4) one column per year, side by side.&lt;/p&gt;

&lt;div class=&quot;fig&quot;&gt;
&lt;h4 style=&quot;margin-top:0&quot;&gt;Lab: read the reports from the cases in the slides&lt;/h4&gt;
&lt;div class=&quot;tl&quot; id=&quot;coqcases&quot; style=&quot;display:flex;flex-wrap:wrap;gap:6px&quot;&gt;&lt;/div&gt;
&lt;div id=&quot;coqout&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The two tests a good report must pass (Serio, slide 106)&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;1 · Spend more before, save much more after&lt;/h4&gt;Prevention + appraisal +300; failure −700. Each extra euro spent upfront saved about 2.30 later (700 ÷ 300 = 2.33).&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;2 · The total falls as a % of sales&lt;/h4&gt;Year 1: 1,500 ÷ 10,000 = 15%. Year 2: 1,100 ÷ 10,000 = 11%. Four cents per euro of sales are no longer lost to poor quality.&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Three observations: year 1 was poorly distributed (80% on failure, 1,200 out of 1,500); year 2 shifted money “upstream” (prevention tripled, warranty from 900 to 250); the next step is fewer inspections.&lt;/p&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Why managers need it&lt;/h4&gt;&lt;b&gt;It shows the size&lt;/b&gt; (cross-functional costs that the costing system usually does not capture: they often come as a surprise); &lt;b&gt;it ranks the problems&lt;/b&gt; (scrap? warranty?); &lt;b&gt;it shows the mix&lt;/b&gt; (a good mix leans towards prevention and appraisal).&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;What it cannot do&lt;/h4&gt;&lt;b&gt;It fixes nothing&lt;/b&gt;: only action does. &lt;b&gt;Results come late&lt;/b&gt;: at first the total may even rise while new systems are installed. &lt;b&gt;The biggest cost is missing&lt;/b&gt;: sales lost to dissatisfied customers, which are hard to estimate and often the most important quality cost.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card tint&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Mercury · slides 112–114&lt;/span&gt;&lt;p&gt;Production manager John Tran was sceptical (“quality is too abstract to attach costs to it”) and notes that rework has risen from 50k to 130k. He is right about the figure, but the reason is a good one: defects are now found in the factory instead of by customers (returns from 320k to 80k). As prevention matures, rework, scrap and workload should fall. And what about the cost of “doing nothing”? Lost sales and market share: these can be estimated from the market share trend, from surveys on why customers switch suppliers, and from the margin lost per customer.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Alfa · slide 123&lt;/span&gt;&lt;p&gt;&lt;b&gt;Non-financial&lt;/b&gt; quality measures that Alfa could monitor: defective units shipped as a % of units shipped &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt; (customer); &lt;span class=&quot;t&quot;&gt;good output ratio&lt;/span&gt; &lt;i&gt;(good output / total output per process)&lt;/i&gt; &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt; (process); training hours &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt; and turnover &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt; (learning and growth); complaints and warranty claims per thousand units sold &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt; (customer). They move before the euro figures: they are &lt;b&gt;leading indicators&lt;/b&gt; of the cost of quality.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Walton: prevention 357→650, appraisal 445→545, internal 790→500, external 1,100→680 ($000). Is the trend favourable?&lt;/summary&gt;&lt;div&gt;Yes. The total falls from 2,692 to 2,375 (−317). +393 on prevention and appraisal, −710 on failure; failure costs go from 70.2% to 49.7% of the total. Goal: keep shifting spending towards prevention.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why can internal failure costs rise at the start of a quality programme?&lt;/summary&gt;&lt;div&gt;Because more appraisal means that defects are caught in the factory instead of by customers: external failure falls, internal failure rises (Florex +1.2 million internal, −4.2 million external).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Florex: prepare the report from the 13 raw items.&lt;/summary&gt;&lt;div&gt;Prevention = quality engineering + SPC + systems development (900 → 1,500); appraisal = inspection + depreciation of test equipment + test materials + product testing (1,800 → 2,400); internal = rework + scrap + disposal (2,400 → 3,600); external = field servicing + warranty + recalls (6,900 → 2,700). Total 12,000 (16.00% of 75 million) → 10,200 (13.60%). Use the lab above to see the mix.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s7&quot; class=&quot;part p-brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;07&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section VII · slides 124–145&lt;/div&gt;&lt;h2&gt;Time is a performance measure&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;The life of a customer order: &lt;b&gt;order received&lt;/b&gt; → wait → &lt;b&gt;production started&lt;/b&gt; → processing, inspection, moves, queues → &lt;b&gt;goods shipped&lt;/b&gt;.&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Throughput time&lt;/h4&gt;&lt;span class=&quot;t&quot;&gt;Manufacturing cycle time&lt;/span&gt; &lt;i&gt;(the time a unit spends in production)&lt;/i&gt;: from the start of production to shipment. Goal &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;.&lt;div class=&quot;formula&quot;&gt;Process + Inspection + Move + Queue&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Delivery cycle time&lt;/h4&gt;From receipt of the order to shipment: the time the customer &lt;b&gt;experiences&lt;/b&gt;. Goal &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;.&lt;div class=&quot;formula&quot;&gt;Wait time + Throughput time&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Manufacturing cycle efficiency&lt;/h4&gt;The share of throughput time spent on actual work. Goal &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;, maximum 1.&lt;div class=&quot;formula&quot;&gt;MCE = Process time ÷ Throughput time&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Value-added: process time only&lt;/h4&gt;The customer would gladly pay for this time: it transforms the product.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Non-value-added: wait, inspection, move, queue&lt;/h4&gt;The customer gains nothing from a product sitting in a queue, travelling around the plant or being checked. Inspection seems useful, but it exists only because defects are possible: &lt;b&gt;prevent defects and inspection can be reduced&lt;/b&gt; (link to §5).&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;An MCE of 0.5 means that half of the production time goes into inspections, moves and waiting. In many manufacturing companies MCE is &lt;b&gt;below 0.10&lt;/b&gt;: over 90% of the time a unit is “in production” adds no value.&lt;/p&gt;

&lt;div class=&quot;fig&quot;&gt;
&lt;h4 style=&quot;margin-top:0&quot;&gt;Lab: break down the time of an order&lt;/h4&gt;
&lt;div class=&quot;tl&quot; id=&quot;tpre&quot; style=&quot;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px&quot;&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 860 150&quot; id=&quot;tsvg&quot; aria-label=&quot;Order timeline&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;tw&quot;&gt;Wait&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tw&quot; min=&quot;0&quot; max=&quot;25&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;tp&quot;&gt;Process&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tp&quot; min=&quot;0.1&quot; max=&quot;10&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;ti&quot;&gt;Inspection&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ti&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;tm&quot;&gt;Move&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tm&quot; min=&quot;0&quot; max=&quot;6&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;tq&quot;&gt;Queue&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tq&quot; min=&quot;0&quot; max=&quot;20&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Throughput&lt;/span&gt;&lt;b id=&quot;kt&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Delivery cycle&lt;/span&gt;&lt;b id=&quot;kd&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;MCE&lt;/span&gt;&lt;b id=&quot;km&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Non-value-added&lt;/span&gt;&lt;b id=&quot;kn&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot; id=&quot;tnote&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Case (slide)&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Throughput&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;MCE&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Delivery&lt;/th&gt;&lt;th&gt;Interpretation&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Novex, days (130–131)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8.0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.25&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;25.0&lt;/td&gt;&lt;td&gt;Work is done only a quarter of the time; the customer waits 17 days before work begins.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Codington, hours (136–137)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;25.8&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.09&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;46.6&lt;/td&gt;&lt;td&gt;Typical: less than 10% adds value. With wait 1.0, move 0.8, queue 0.6: throughput 3.8, MCE 0.58, delivery 4.8.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Mittel, days (138–139)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;9.0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.30&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;23.0&lt;/td&gt;&lt;td&gt;Without queues: throughput 4.0, MCE 0.675, delivery 18.0; but the 14 days of waiting still dominate the customer&#x27;s experience.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;

&lt;details&gt;&lt;summary&gt;Tombro, a plant moving to automation: four months (slides 140–142)&lt;/summary&gt;&lt;div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Days&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;M1&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;M2&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;M3&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;M4&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Throughput&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;6.0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;7.5&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;9.0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.0&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MCE&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.35&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.27&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.21&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.18&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Delivery cycle&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;15.0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;19.0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;21.0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;24.0&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
