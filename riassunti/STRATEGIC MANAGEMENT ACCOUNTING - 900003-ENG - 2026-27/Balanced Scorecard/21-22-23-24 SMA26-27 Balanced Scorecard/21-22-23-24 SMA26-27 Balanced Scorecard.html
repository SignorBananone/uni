&lt;a href=&quot;#s4&quot;&gt;&lt;rect x=&quot;700&quot; y=&quot;352&quot; width=&quot;160&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;780&quot; y=&quot;376&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;ROA · ROE · ROI&lt;/text&gt;&lt;text x=&quot;780&quot; y=&quot;394&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;RI · EPS · P/E&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s9&quot;&gt;&lt;rect x=&quot;230&quot; y=&quot;448&quot; width=&quot;290&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--accbg)&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;375&quot; y=&quot;472&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;15&quot;&gt;9 · Building a scorecard&lt;/text&gt;&lt;text x=&quot;375&quot; y=&quot;490&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;4 passi · Jaguar · ipotesi da testare&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s10&quot;&gt;&lt;rect x=&quot;580&quot; y=&quot;448&quot; width=&quot;280&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--accbg)&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;720&quot; y=&quot;472&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;15&quot;&gt;10 · Using the scorecard&lt;/text&gt;&lt;text x=&quot;720&quot; y=&quot;490&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;pay · gaming · CSR e GRI&lt;/text&gt;&lt;/a&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Mappa della lezione. Le frecce arancioni sono la catena causa-effetto delle quattro prospettive e il ciclo di feedback che riporta alla strategia. Clicca un nodo per aprire la sezione.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;main&gt;
&lt;section id=&quot;s1&quot; class=&quot;part p-slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;01&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section I · slide 3–20&lt;/div&gt;&lt;h2&gt;Strategy comes first&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

&lt;p&gt;&lt;b&gt;Obiettivi della lezione&lt;/b&gt; (slide 2): saper dare esempi di misure per ciascuna delle quattro prospettive; conoscere i quattro tipi di quality cost e preparare un quality cost report; calcolare throughput time, delivery cycle time, manufacturing cycle efficiency e overall equipment effectiveness; costruire una balanced scorecard, collegarne le misure e usarla per valutare una strategia.&lt;/p&gt;

&lt;h3&gt;Il caso di apertura: Enel e il numero «verde» che fissa il tasso&lt;/h3&gt;
&lt;p&gt;Nel 2019 Enel emette un bond da 1,5 miliardi di dollari il cui interesse dipende da una &lt;span class=&quot;t&quot;&gt;non-financial measure&lt;/span&gt; &lt;i&gt;(misura non espressa in moneta)&lt;/i&gt;: la quota di capacità rinnovabile sul totale degli impianti.&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;La misura&lt;/h4&gt;Capacità rinnovabile / capacità installata totale (45,9% a metà 2019).&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Il target&lt;/h4&gt;Almeno 55% entro fine 2021.&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Se manca il target&lt;/h4&gt;Il tasso sale di 0,25 punti fino a scadenza (&lt;span class=&quot;t&quot;&gt;step-up&lt;/span&gt; &lt;i&gt;· aumento automatico della cedola&lt;/i&gt;).&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Com&#x27;è andata&lt;/h4&gt;Ordini per circa 4 miliardi: quasi tre volte l&#x27;offerta.&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;L&#x27;idea della lezione: una misura non finanziaria conta quando è &lt;b&gt;collegata&lt;/b&gt; a risultati che gli &lt;span class=&quot;t&quot;&gt;stakeholder&lt;/span&gt; &lt;i&gt;(portatori di interesse: azionisti, clienti, dipendenti, comunità…)&lt;/i&gt; considerano importanti. La balanced scorecard serve a rendere visibili questi collegamenti.&lt;/p&gt;

&lt;h3&gt;Perché misurare la performance, e perché il profitto non basta&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;To inform · informare&lt;/h4&gt;Le misure danno ai dipendenti le informazioni per eseguire la strategia (il capoturno che vede il tasso di difetti di oggi sa dove intervenire) e danno ai manager un feedback: il piano funziona?&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;To influence · orientare i comportamenti&lt;/h4&gt;Le misure entrano in bonus e promozioni: le persone guardano ciò su cui sono valutate. È uno strumento potente che può ritorcersi contro se la misura è scelta male (lo vedremo con Wells Fargo, §10).&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Arriva tardi&lt;/h4&gt;Il profitto racconta il trimestre passato: quando scende, le cause sono avvenute mesi prima.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Non dice perché&lt;/h4&gt;Un margine più basso può venire da difetti, consegne lente, clienti persi o personale non formato.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Si può «gestire»&lt;/h4&gt;Tagliare formazione o manutenzione alza il profitto di quest&#x27;anno e danneggia quello del prossimo.&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;I risultati finanziari restano il test finale; servono però misure che mostrino cosa succede &lt;b&gt;prima&lt;/b&gt; che si muova il denaro.&lt;/p&gt;

&lt;h3&gt;Due ragioni per le misure non finanziarie&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Reason 1&lt;/span&gt;&lt;h4&gt;Catturano i cambiamenti di fondo&lt;/h4&gt;Le misure finanziarie sono &lt;span class=&quot;t&quot;&gt;lag indicators&lt;/span&gt; &lt;i&gt;(indicatori «in ritardo»: riassumono l&#x27;esito di azioni passate)&lt;/i&gt;; quelle non finanziarie sono &lt;span class=&quot;t&quot;&gt;leading indicators&lt;/span&gt; &lt;i&gt;(indicatori «anticipatori»: si muovono prima e aiutano a prevedere il risultato)&lt;/i&gt;.&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Reason 2&lt;/span&gt;&lt;h4&gt;Sono più facili da capire e da influenzare&lt;/h4&gt;Un responsabile di magazzino non può muovere il &lt;span class=&quot;t&quot;&gt;return on equity&lt;/span&gt; &lt;i&gt;(rendimento del capitale proprio)&lt;/i&gt;, ma può migliorare la percentuale di ordini spediti in tempo.&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Leading e lagging: la stessa misura cambia ruolo lungo la catena&lt;/h4&gt;
&lt;div class=&quot;fig&quot; data-steps data-cb=&quot;llStep&quot;&gt;
&lt;svg viewBox=&quot;0 0 860 120&quot; id=&quot;llsvg&quot; aria-label=&quot;Catena da ore di formazione a profitto&quot;&gt;
&lt;g id=&quot;llnodes&quot;&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;Passo 1.&lt;/b&gt; &lt;i&gt;Hours of staff training&lt;/i&gt; è leading rispetto a &lt;i&gt;errors per order&lt;/i&gt;: più formazione oggi → meno errori domani.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;Passo 2.&lt;/b&gt; &lt;i&gt;Errors per order&lt;/i&gt;, che era lagging al passo prima, ora è leading per &lt;i&gt;customer satisfaction&lt;/i&gt;.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;Passo 3.&lt;/b&gt; &lt;i&gt;Customer satisfaction&lt;/i&gt; anticipa le &lt;i&gt;repeat purchases&lt;/i&gt; (acquisti ripetuti).&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;Passo 4.&lt;/b&gt; &lt;i&gt;Repeat purchases&lt;/i&gt; anticipano il &lt;i&gt;profit&lt;/i&gt;, l&#x27;esito finale. Una buona scorecard mescola i due tipi: si agisce sui driver e si controllano i risultati (slide 9).&lt;/div&gt;
&lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;avanti →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;def&quot;&gt;&lt;small&gt;Definizione · slide 10&lt;/small&gt;A balanced scorecard is an integrated set of performance measures that are derived from and support a company&#x27;s strategy.&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Integrated&lt;/h4&gt;Le misure sono collegate tra loro: non una lista.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Derived from&lt;/h4&gt;Si parte dalla strategia e poi si scelgono le misure.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Support&lt;/h4&gt;Le misure aiutano le persone a mettere in pratica la strategia.&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;In pratica il management traduce &lt;b&gt;mission e strategia&lt;/b&gt; → &lt;b&gt;obiettivi nelle quattro prospettive&lt;/b&gt; → &lt;b&gt;misure che i dipendenti capiscono e possono influenzare&lt;/b&gt; (slide 11).&lt;/p&gt;

&lt;h4&gt;Da dove viene l&#x27;idea&lt;/h4&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;big&quot;&gt;1992&lt;/span&gt;&lt;p&gt;Robert Kaplan e David Norton propongono sulla &lt;i&gt;Harvard Business Review&lt;/i&gt; un insieme bilanciato di misure finanziarie e operative.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;big&quot;&gt;1996&lt;/span&gt;&lt;p&gt;Il libro presenta la scorecard come &lt;b&gt;sistema di gestione&lt;/b&gt; per tradurre la strategia in azione, non solo come report.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;big&quot;&gt;2004&lt;/span&gt;&lt;p&gt;Arrivano le &lt;span class=&quot;t&quot;&gt;strategy maps&lt;/span&gt; &lt;i&gt;(diagrammi dei rapporti causa-effetto tra obiettivi)&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;&lt;b&gt;Balanced&lt;/b&gt; significa equilibrio tra misure finanziarie e non finanziarie, breve e lungo periodo, risultati e driver, visione interna ed esterna.&lt;/p&gt;

&lt;h3&gt;Che cos&#x27;è la strategia: la customer value proposition&lt;/h3&gt;
&lt;p&gt;Una &lt;b&gt;strategy&lt;/b&gt; è il «piano di gioco» con cui l&#x27;impresa attira clienti distinguendosi dai concorrenti. I tratti distintivi sono la &lt;span class=&quot;t&quot;&gt;customer value proposition&lt;/span&gt; &lt;i&gt;(la ragione per cui il cliente dovrebbe scegliere noi e non altri)&lt;/i&gt;. Test rapido: finisci la frase «&lt;i&gt;You should choose us because…&lt;/i&gt;». Se non riesci a dirla in una frase, non sei pronto a costruire una scorecard.&lt;/p&gt;
&lt;p&gt;La strategia descrive come l&#x27;impresa abbina le proprie &lt;b&gt;capabilities&lt;/b&gt; (capacità) alle &lt;b&gt;opportunities&lt;/b&gt; del mercato: bisogna capire il settore (clienti, concorrenti, fornitori, sostituti, regole del gioco) e le proprie &lt;b&gt;strategic resources&lt;/b&gt; (ciò che si possiede o si sa e che altri non copiano facilmente). Esempio: una piccola cantina con pochi ettari di un vitigno raro, in un mercato affollato, sceglie un prodotto limitato e premium invece del volume.&lt;/p&gt;

&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tl&quot; role=&quot;tablist&quot;&gt;
&lt;button class=&quot;btn on&quot; data-tab=&quot;ci&quot; type=&quot;button&quot;&gt;Customer intimacy&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-tab=&quot;oe&quot; type=&quot;button&quot;&gt;Operational excellence&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-tab=&quot;pl&quot; type=&quot;button&quot;&gt;Product leadership&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-tab=&quot;pairs&quot; type=&quot;button&quot;&gt;Stesso settore, promesse opposte&lt;/button&gt;
&lt;/div&gt;
&lt;div data-panel=&quot;ci&quot; class=&quot;on card tint&quot;&gt;&lt;h4&gt;«Sceglieteci perché personalizziamo prodotti e servizi sui vostri bisogni meglio dei concorrenti»&lt;/h4&gt;&lt;p&gt;Pensa a un sarto, una private bank, un&#x27;auto di lusso costruita su ordinazione, il Ritz Carlton (lo staff ricorda le tue preferenze e può risolvere subito ogni problema). Domanda guida sui processi: &lt;b&gt;«Is it made for me?»&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;oe&quot; class=&quot;card tint&quot;&gt;&lt;h4&gt;«Sceglieteci perché consegniamo più in fretta, più comodamente e a prezzo più basso»&lt;/h4&gt;&lt;p&gt;Compagnie aeree low cost (Ryanair: «ti portiamo lì per meno di chiunque altro, senza fronzoli»), discount, IKEA (design a poco prezzo perché porti a casa e monti tu), Amazon (quasi tutto, a prezzo giusto, in uno o due giorni). Domanda guida: &lt;b&gt;«Is it cheap and fast?»&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;pl&quot; class=&quot;card tint&quot;&gt;&lt;h4&gt;«Sceglieteci perché offriamo prodotti più innovativi e di qualità superiore»&lt;/h4&gt;&lt;p&gt;Innovatori farmaceutici, leader tecnologici, Apple (prodotti semplici, belli, che funzionano insieme), Ferrari (un&#x27;auto rara con un&#x27;eredità sportiva che nessun altro può offrire). Domanda guida: &lt;b&gt;«Is it new and better?»&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;pairs&quot;&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Settore&lt;/th&gt;&lt;th&gt;Una promessa&lt;/th&gt;&lt;th&gt;La promessa opposta&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Auto&lt;/td&gt;&lt;td&gt;&lt;b&gt;Dacia&lt;/b&gt;: tutto ciò che serve e niente di più, al prezzo più basso&lt;/td&gt;&lt;td&gt;&lt;b&gt;Ferrari&lt;/b&gt;: prestazioni ed esclusività, in numeri limitati&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Moda&lt;/td&gt;&lt;td&gt;&lt;b&gt;Zara&lt;/b&gt;: le ultime tendenze in negozio in poche settimane, a prezzi accessibili&lt;/td&gt;&lt;td&gt;&lt;b&gt;Brunello Cucinelli&lt;/b&gt;: cashmere fatto a mano che dura anni, a Solomeo&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Alimentari&lt;/td&gt;&lt;td&gt;&lt;b&gt;Lidl&lt;/b&gt;: prezzi bassi su un assortimento corto e selezionato&lt;/td&gt;&lt;td&gt;&lt;b&gt;Eataly&lt;/b&gt;: cibo italiano di qualità, con degustazioni e corsi&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Promesse diverse richiedono misure diverse: due imprese dello stesso settore non dovrebbero condividere la scorecard (slide 15).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;Le tre value disciplines vengono da Treacy &amp;amp; Wiersema, HBR 1993 (slide 17): vedi «Per approfondire».&lt;/p&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica · associa ogni impresa alla sua proposition (slide 18–19)&lt;/h3&gt;&lt;div id=&quot;qz-vp&quot;&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Perché il profitto da solo non basta? Dai tre motivi.&lt;/summary&gt;&lt;div&gt;Arriva tardi (misura cause avvenute mesi prima); non dice perché (difetti? consegne? clienti persi?); può essere manipolato nel breve (tagliare formazione e manutenzione).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;«Errors per order» è leading o lagging?&lt;/summary&gt;&lt;div&gt;Dipende dal passo della catena: è lagging rispetto alle ore di formazione e leading rispetto alla customer satisfaction.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s2&quot; class=&quot;part p-slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;02&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section II · slide 21–34&lt;/div&gt;&lt;h2&gt;Il framework: quattro prospettive e una catena&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;A sinistra la &lt;b&gt;vision and strategy&lt;/b&gt; (quali obiettivi finanziari? quali clienti servire e come vincerli e trattenerli? quali processi interni sono critici?), a destra le misure organizzate in quattro &lt;span class=&quot;t&quot;&gt;perspectives&lt;/span&gt; &lt;i&gt;(punti di vista sulla performance)&lt;/i&gt;, ciascuna con una domanda guida. Clicca un livello.&lt;/p&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 300 330&quot; id=&quot;persp&quot; aria-label=&quot;Le quattro prospettive&quot;&gt;
&lt;g id=&quot;pnodes&quot;&gt;&lt;/g&gt;
&lt;text x=&quot;150&quot; y=&quot;325&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; style=&quot;fill:var(--muted)&quot;&gt;si legge dal basso verso l&#x27;alto&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;card&quot; id=&quot;ppanel&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;La strategia decide che cosa va in ogni casella&lt;/h3&gt;
&lt;p&gt;Due pizzerie nella stessa via: &lt;b&gt;A&lt;/b&gt; vuole essere la più veloce ed economica, &lt;b&gt;B&lt;/b&gt; la migliore della città. Leggi dal basso.&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Prospettiva&lt;/th&gt;&lt;th&gt;Pizzeria A · fast and cheap&lt;/th&gt;&lt;th&gt;Pizzeria B · the best in town&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Financial&lt;/td&gt;&lt;td&gt;Costo per pizza &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;, pizze vendute per sera &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Prezzo medio per pizza &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Customer&lt;/td&gt;&lt;td&gt;Ordini ripetuti per cliente &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Recensioni online che lodano il gusto &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Internal processes&lt;/td&gt;&lt;td&gt;Minuti dall&#x27;ordine alla pizza &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Nuove pizze stagionali in menu &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Learning and growth&lt;/td&gt;&lt;td&gt;Staff formato su ogni postazione &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Pizzaioli formati su impasto e condimenti &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Stessa via, stesso forno, strategie diverse: misure diverse in ogni casella. Una scorecard copiata dal concorrente misura le cose sbagliate.&lt;/p&gt;

&lt;h3&gt;Ogni freccia è un&#x27;ipotesi da verificare&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;small&gt;La logica if/then · slide 29&lt;/small&gt;If we improve this measure, then that other measure should also improve.&lt;/div&gt;
&lt;p&gt;Esempio: se aumentano le ore medie di formazione per dipendente, allora gli errori per ordine dovrebbero scendere. Dopo qualche mese si controlla: se gli errori non calano, o la formazione è scadente o gli errori hanno un&#x27;altra causa. Questo rende la scorecard una &lt;b&gt;teoria verificabile&lt;/b&gt;, non un elenco.&lt;/p&gt;

&lt;h3&gt;Strategy map: la catena su una pagina&lt;/h3&gt;
&lt;p&gt;Una &lt;b&gt;strategy map&lt;/b&gt; mostra gli &lt;b&gt;obiettivi&lt;/b&gt; in ciascuna prospettiva, le &lt;b&gt;frecce&lt;/b&gt; che indicano quale obiettivo dovrebbe causarne un altro, tutto su &lt;b&gt;una pagina&lt;/b&gt; perché ogni dipendente veda come il suo lavoro porta ai risultati. Poi ogni obiettivo riceve una &lt;b&gt;measure&lt;/b&gt;, un &lt;b&gt;target&lt;/b&gt; e una &lt;b&gt;initiative&lt;/b&gt;: questa è la scorecard.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;

&lt;p class=&quot;cap&quot;&gt;Map = quali obiettivi causano quali. Scorecard = come misuriamo ogni obiettivo e fin dove vogliamo arrivare. Target illustrativi (slide 32).&lt;/p&gt;

&lt;h3&gt;Due regole per ogni misura&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;1 · Dalle una freccia&lt;/h4&gt;«Employee turnover 12%»: buono o cattivo? Da solo non si sa. «Employee turnover ↓»: ora l&#x27;obiettivo è chiaro. Senza freccia un numero è informazione; &lt;b&gt;con la freccia diventa un obiettivo&lt;/b&gt;.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;2 · Il simbolo € non la rende finanziaria&lt;/h4&gt;Chiediti di che cosa parla la misura, non in che unità è espressa. Cost of quality → internal process; spesa di formazione per dipendente → learning and growth; &lt;span class=&quot;t&quot;&gt;customer lifetime value&lt;/span&gt; &lt;i&gt;(valore attuale dei margini attesi da un cliente nel tempo)&lt;/i&gt; → customer; net operating income → financial.&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;Tre letture sbagliate (slide 34)&lt;/h4&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Cosa si pensa a volte&lt;/th&gt;&lt;th&gt;Cosa è davvero la scorecard&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;«È una lunga lista di KPI»&lt;/td&gt;&lt;td&gt;Un insieme &lt;b&gt;breve&lt;/b&gt; di misure scelte perché derivano dalla strategia e sono collegate tra loro. (&lt;span class=&quot;t&quot;&gt;KPI&lt;/span&gt; &lt;i&gt;· key performance indicator, indicatore chiave&lt;/i&gt;)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;«Migliora i numeri operativi e il profitto seguirà»&lt;/td&gt;&lt;td&gt;La prospettiva finanziaria esiste per verificarlo. Se non succede, la strategia va riconsiderata.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;«La stessa scorecard va bene per tutti»&lt;/td&gt;&lt;td&gt;Le misure cambiano da impresa a impresa perché cambiano le strategie.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Qual è la differenza tra strategy map e scorecard?&lt;/summary&gt;&lt;div&gt;La mappa mostra gli obiettivi e le relazioni causa-effetto tra essi; la scorecard associa a ogni obiettivo una misura (con direzione), un target e un&#x27;iniziativa.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché la prospettiva finanziaria sta in cima?&lt;/summary&gt;&lt;div&gt;È ciò che interessa in ultima istanza agli azionisti: tutti i miglioramenti sottostanti dovrebbero tradursi in risultati lì. Se non accade mai, la strategia stessa potrebbe essere sbagliata.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;«Lost sales due to out of stock merchandise» è in euro: in quale prospettiva va?&lt;/summary&gt;&lt;div&gt;Internal business process: descrive un fallimento del processo di gestione delle scorte, anche se è espressa in moneta (slide 87).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s3&quot; class=&quot;part p-sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;03&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section III · slide 35–55&lt;/div&gt;&lt;h2&gt;People, processes and customers&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tl&quot; role=&quot;tablist&quot;&gt;&lt;button class=&quot;btn on&quot; data-tab=&quot;lg&quot; type=&quot;button&quot;&gt;Learning and growth&lt;/button&gt;&lt;button class=&quot;btn&quot; data-tab=&quot;ip&quot; type=&quot;button&quot;&gt;Internal processes&lt;/button&gt;&lt;button class=&quot;btn&quot; data-tab=&quot;cu&quot; type=&quot;button&quot;&gt;Customer&lt;/button&gt;&lt;/div&gt;

&lt;div data-panel=&quot;lg&quot; class=&quot;on&quot;&gt;
&lt;p&gt;«Our employees are our most important asset»: la scorecard chiede di prenderlo sul serio e di &lt;b&gt;misurarlo&lt;/b&gt;. Il ragionamento: se un&#x27;impresa con una &lt;b&gt;viable strategy&lt;/b&gt; (strategia sostenibile) fa crescere le capacità dei dipendenti, la performance finanziaria dovrebbe migliorare. Nota la condizione: persone brillanti non salvano una strategia che i clienti non vogliono. Learning and growth è &lt;b&gt;la base della catena, non un suo sostituto&lt;/b&gt;.&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Area&lt;/th&gt;&lt;th&gt;Domanda&lt;/th&gt;&lt;th&gt;Misure (slide 39–40)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Recruiting&lt;/td&gt;&lt;td&gt;Attiriamo i candidati migliori a un costo sensato?&lt;/td&gt;&lt;td&gt;% di candidati «outstanding» che accettano &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; spesa di selezione per assunto &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Skills development&lt;/td&gt;&lt;td&gt;Le persone ricevono formazione, mentoring, risorse?&lt;/td&gt;&lt;td&gt;% che concorda «ho le risorse per fare il mio lavoro» &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; ore medie di mentorship &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt; e di training &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Pay and advancement&lt;/td&gt;&lt;td&gt;I bravi possono crescere ed essere promossi dall&#x27;interno?&lt;/td&gt;&lt;td&gt;Posizioni di leadership coperte internamente &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; % promossi negli ultimi 3 anni &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; aumento medio di stipendio &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Wellness and safety&lt;/td&gt;&lt;td&gt;Le persone sono in salute, presenti e al sicuro?&lt;/td&gt;&lt;td&gt;Absenteeism rate &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; infortuni per dipendente &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Job satisfaction&lt;/td&gt;&lt;td&gt;Il lavoro piace e il contributo è riconosciuto?&lt;/td&gt;&lt;td&gt;«This is a great place to work» &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; «il mio contributo è riconosciuto» &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; suggerimenti di miglioramento per dipendente &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Retention&lt;/td&gt;&lt;td&gt;I bravi restano abbastanza per fare esperienza?&lt;/td&gt;&lt;td&gt;Employee turnover &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; anni medi di anzianità &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Una misura sulle persone si guadagna il posto solo se muove qualcos&#x27;altro: &lt;i&gt;training hours ↑ → errors in the process ↓&lt;/i&gt;; &lt;i&gt;employee turnover ↓ → customer loyalty ↑&lt;/i&gt; (argomento della «familiar face»: i clienti amano trattare con le stesse persone). &lt;b&gt;Entrambi i legami sono ipotesi, non fatti.&lt;/b&gt;&lt;/p&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Esempio italiano · slide 42&lt;/span&gt;&lt;h4&gt;Luxottica (Agordo, BL): il welfare come parte della strategia&lt;/h4&gt;&lt;p&gt;Tra le prime imprese italiane con un sistema di welfare aziendale (sanità integrativa, check-up gratuiti per gli over 50, borse di studio per i figli). Accordo 2024–2026: &lt;b&gt;settimana di quattro giorni per 20 settimane l&#x27;anno&lt;/b&gt; in sei stabilimenti italiani, a parità di stipendio e su base volontaria. Misure della scorecard che dovrebbe muovere: absenteeism &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;, turnover &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;, candidature per posizione aperta &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;. &lt;span class=&quot;src&quot;&gt;Fonte della slide: Il Giornale, 30/11/2023.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div data-panel=&quot;ip&quot;&gt;
&lt;p&gt;Un &lt;span class=&quot;t&quot;&gt;business process&lt;/span&gt; &lt;i&gt;(una sequenza di passi per svolgere un compito)&lt;/i&gt; attraversa i reparti: vendite prende l&#x27;ordine → acquisti compra i materiali → produzione realizza → logistica spedisce. Il cliente vede solo quanto ha impiegato l&#x27;intero ordine e se è arrivato giusto: migliorare una misura di processo &lt;b&gt;costringe i manager di reparti diversi a cooperare&lt;/b&gt;.&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Dimensione&lt;/th&gt;&lt;th&gt;Domanda&lt;/th&gt;&lt;th&gt;Misure tipiche&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Innovation&lt;/td&gt;&lt;td&gt;Quanti nuovi prodotti e brevetti creiamo?&lt;/td&gt;&lt;td&gt;Nuovi prodotti progettati &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; brevetti approvati &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; % di parti già progettate riusate &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Quality&lt;/td&gt;&lt;td&gt;Quanto spesso funziona tutto al primo colpo?&lt;/td&gt;&lt;td&gt;Warranty claims &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; unità senza difetti / completate &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; reclami risolti al primo contatto &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Agility&lt;/td&gt;&lt;td&gt;Quanto in fretta ci adattiamo?&lt;/td&gt;&lt;td&gt;Design modulari &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; fornitori con contratti lunghi &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; batch size medio &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Cost&lt;/td&gt;&lt;td&gt;Quanto spendiamo in ciò che non aggiunge valore?&lt;/td&gt;&lt;td&gt;Cost of quality &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; non value added activity costs &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; vendite perse per stock-out &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Time&lt;/td&gt;&lt;td&gt;Quanto dall&#x27;ordine alla spedizione, e quanto è vero lavoro?&lt;/td&gt;&lt;td&gt;Delivery cycle time &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; throughput time &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; MCE &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt; (§7)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Lean resources&lt;/td&gt;&lt;td&gt;Impianti, scorte, spazi senza sprechi?&lt;/td&gt;&lt;td&gt;OEE &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt; (§8); WIP in % delle vendite &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; punteggio pulizia postazioni &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;Ogni strategia guarda prima una colonna: i product leader l&#x27;&lt;b&gt;innovation&lt;/b&gt; («Is it new and better?», es. Apple), l&#x27;operational excellence &lt;b&gt;cost e time&lt;/b&gt; («Is it cheap and fast?», Ryanair), la customer intimacy &lt;b&gt;service e flessibilità&lt;/b&gt; («Is it made for me?», Ritz Carlton).&lt;/p&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Caso · slide 49&lt;/span&gt;&lt;h4&gt;Stellantis: 14 marchi su poche piattaforme condivise&lt;/h4&gt;&lt;p&gt;Nata nel 2021 dalla fusione FCA–PSA; a luglio 2021 annuncia che le auto elettriche nasceranno su quattro piattaforme (STLA Small, Medium, Large, Frame) con tre moduli di trazione comuni. Stessa idea di Toyota e Volkswagen: condividere componenti per comprare in volume, progettare più in fretta, spendere meno in impianti. Rischio: auto di marchi diversi troppo simili. &lt;b&gt;Misure di processo possibili:&lt;/b&gt; quota di modelli sulle quattro piattaforme &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;, quota di parti comuni tra marchi &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;, mesi dal design al lancio &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;h4&gt;Quale strategia adotterebbe ogni misura? (slide 50–51)&lt;/h4&gt;
&lt;div id=&quot;qz-proc&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div data-panel=&quot;cu&quot;&gt;
&lt;p&gt;Se un&#x27;impresa migliora persone e processi, i guadagni devono &lt;b&gt;alla fine&lt;/b&gt; comparire nelle misure di cliente. Se non succede, l&#x27;impresa non ha capito che cosa forma percezioni e comportamenti dei clienti.&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Area&lt;/th&gt;&lt;th&gt;Misure (slide 54–55)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Satisfaction&lt;/td&gt;&lt;td&gt;% «would readily recommend your company» &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; customer referrals &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Acquisition&lt;/td&gt;&lt;td&gt;Market share &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; costo medio di acquisizione cliente &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;; % di lead che diventano vendita &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Retention&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;t&quot;&gt;Customer defection rate&lt;/span&gt; &lt;i&gt;(quota di clienti che ci abbandonano)&lt;/i&gt; &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Lifetime value&lt;/td&gt;&lt;td&gt;Ricavo medio per ordine &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; margine lordo medio per ordine &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; tempo medio tra acquisti &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Loyalty&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;t&quot;&gt;Share of wallet&lt;/span&gt; &lt;i&gt;(quota della spesa del cliente che arriva a noi)&lt;/i&gt; &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; innovazioni co-sviluppate con i clienti &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Service&lt;/td&gt;&lt;td&gt;% che concorda «ordine consegnato in tempo», «problema risolto in fretta», «sito facile da usare», «trattato con cortesia» &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Proposition&lt;/td&gt;&lt;td&gt;Percezione del cliente della nostra product leadership / operational excellence / customer intimacy &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Nota: molte misure di cliente sono costruite su survey con «strongly agree». È la traduzione operativa della parola &lt;i&gt;recognise&lt;/i&gt;: si misura la percezione, non solo la prestazione interna.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché «customers are served by processes, not by departments»?&lt;/summary&gt;&lt;div&gt;Il cliente vede solo l&#x27;esito dell&#x27;intera catena (tempo totale, ordine corretto). Una misura di processo attraversa i reparti e quindi li obbliga a cooperare invece di ottimizzare ciascuno il proprio pezzo.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Long term supplier contracts ↑: quale strategia?&lt;/summary&gt;&lt;div&gt;Nelle slide: customer intimacy (partner capaci di soddisfare richieste speciali). Si può argomentare anche operational excellence: fornitori stabili = approvvigionamento affidabile e costi d&#x27;acquisto più bassi (nota a slide 51).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa dice la condizione «with a viable strategy»?&lt;/summary&gt;&lt;div&gt;Che investire nelle persone migliora i risultati solo se la strategia è valida: learning and growth è la base della catena, non può sostituirla.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s4&quot; class=&quot;part p-ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;04&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section IV · slide 56–90&lt;/div&gt;&lt;h2&gt;Financial measures&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;small&gt;Perché tenere la prospettiva finanziaria · slide 60&lt;/small&gt;The scorecard does not assume that better processes automatically bring better profits. It checks.&lt;/div&gt;
&lt;p&gt;La prospettiva finanziaria rende l&#x27;organizzazione responsabile di trasformare i miglioramenti non finanziari in risultati di &lt;span class=&quot;t&quot;&gt;bottom line&lt;/span&gt; &lt;i&gt;(l&#x27;utile, l&#x27;ultima riga del conto economico)&lt;/i&gt;. Se i trend favorevoli su persone, processi e clienti non si traducono in risultati, la scorecard costringe a ripensare come l&#x27;impresa si differenzia.&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Sales&lt;/h4&gt;Vendite da nuovi clienti; da prodotti con meno di 3 anni (adatta alla product leadership); vendite protette da brevetto &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Profits&lt;/h4&gt;Contribution margin; net operating income; residual income &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Ratios&lt;/h4&gt;Gross margin %; net profit margin %; ROA; ROE &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Trend · cash · market&lt;/h4&gt;Tassi di crescita; operating cash flow (÷ attivo medio, ÷ vendite); stock price, EPS, P/E &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;. Mostrano ciò che il profitto non dice: &lt;b&gt;liquidità&lt;/b&gt; e &lt;b&gt;aspettative degli investitori&lt;/b&gt;.&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Le basi: conto economico e stato patrimoniale&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 320 200&quot; aria-label=&quot;Schema del conto economico&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;145&quot; height=&quot;120&quot; rx=&quot;6&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;82&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Negative items&lt;/text&gt;&lt;text x=&quot;82&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;(costi)&lt;/text&gt;
&lt;rect x=&quot;10&quot; y=&quot;134&quot; width=&quot;145&quot; height=&quot;56&quot; rx=&quot;6&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;82&quot; y=&quot;167&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--paper)&quot; font-weight=&quot;600&quot;&gt;Net income&lt;/text&gt;
&lt;rect x=&quot;165&quot; y=&quot;10&quot; width=&quot;145&quot; height=&quot;180&quot; rx=&quot;6&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;237&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;Positive items&lt;/text&gt;&lt;text x=&quot;237&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;(ricavi)&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;&lt;b&gt;Income statement&lt;/b&gt; (conto economico): confronta componenti positivi e negativi dell&#x27;anno; la differenza è il &lt;b&gt;net income&lt;/b&gt; (utile). È un &lt;b&gt;film&lt;/b&gt;: copre tutto l&#x27;anno.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 320 200&quot; aria-label=&quot;Schema dello stato patrimoniale&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;145&quot; height=&quot;180&quot; rx=&quot;6&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;82&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Assets&lt;/text&gt;
&lt;rect x=&quot;165&quot; y=&quot;10&quot; width=&quot;145&quot; height=&quot;110&quot; rx=&quot;6&quot; fill=&quot;var(--accbg)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;237&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Liabilities&lt;/text&gt;
&lt;rect x=&quot;165&quot; y=&quot;124&quot; width=&quot;145&quot; height=&quot;66&quot; rx=&quot;6&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;237&quot; y=&quot;153&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Equity&lt;/text&gt;&lt;text x=&quot;237&quot; y=&quot;171&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;include il net income&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;&lt;b&gt;Balance sheet&lt;/b&gt; (stato patrimoniale): a fine anno, ciò che l&#x27;impresa possiede e come è finanziata. &lt;b&gt;Assets = Liabilities + Equity&lt;/b&gt;. È una &lt;b&gt;foto&lt;/b&gt; di un giorno.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Glossario delle voci (slide 64–66)&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;b&gt;Assets&lt;/b&gt;: cash and cash equivalents (denaro e conti); accounts receivable (crediti verso clienti per beni già consegnati); inventories (scorte); property, plant and equipment (beni non facilmente liquidabili: computer, auto, impianti); securities (titoli acquistati per investimento).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Liabilities&lt;/b&gt;: bank overdraft (scoperto di conto corrente); accounts payable (debiti verso fornitori); notes payable (obbligo di rimborso a una data futura); severance provisions (fondi per le liquidazioni dei dipendenti, in Italia il TFR); long term borrowings (debiti oltre 12 mesi).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Equity&lt;/b&gt;: share capital (capitale versato dai soci); par value (valore nominale di un&#x27;azione); additional paid in capital (quanto pagato sopra il nominale); retained earnings (utili accumulati non distribuiti); net income (utile o perdita dell&#x27;anno).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Tre strumenti per dare senso ai numeri: Norton Corporation&lt;/h3&gt;
&lt;p&gt;Una voce di bilancio da sola dice poco: acquista significato quando la &lt;b&gt;confronti&lt;/b&gt;. Norton Corporation è un&#x27;impresa da manuale con due anni di bilancio (slide 67–69).&lt;/p&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button class=&quot;btn on&quot; data-tab=&quot;h&quot; type=&quot;button&quot;&gt;1 · Horizontal analysis&lt;/button&gt;&lt;button class=&quot;btn&quot; data-tab=&quot;v&quot; type=&quot;button&quot;&gt;2 · Common size&lt;/button&gt;&lt;button class=&quot;btn&quot; data-tab=&quot;bs&quot; type=&quot;button&quot;&gt;Stato patrimoniale&lt;/button&gt;&lt;/div&gt;
&lt;div data-panel=&quot;h&quot; class=&quot;on&quot;&gt;
&lt;p&gt;&lt;b&gt;Horizontal (trend) analysis&lt;/b&gt;: stessa riga, anni affiancati. &lt;span class=&quot;formula&quot; style=&quot;display:block&quot;&gt;Change = This year − Last year &amp;nbsp;·&amp;nbsp; % change = Change ÷ Last year&lt;/span&gt; Le variazioni in euro mostrano ciò che &lt;b&gt;pesa di più&lt;/b&gt; (+44.000 di vendite contano più di +2.000 di cancelleria); quelle percentuali ciò che è &lt;b&gt;insolito&lt;/b&gt; (cancelleria da 2.000 a 4.000 = +100%: poco denaro, ma merita una domanda).&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;$&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;This year&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Last year&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Change&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;%&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;494,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;450,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;44,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;9.8%&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Cost of goods sold&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;140,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;127,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;13,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.2%&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Gross margin&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;354,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;323,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;31,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;9.6%&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Operating expenses&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;270,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;249,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;21,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8.4%&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net operating income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;84,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;74,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;13.5%&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Interest expense&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;7,300&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(700)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(8.8%)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Net income before taxes&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;76,700&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;66,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,700&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;16.2%&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Income taxes (30%)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;23,010&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;19,800&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,210&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;16.2%&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Net income&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;53,690&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;46,200&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;7,490&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;16.2%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Vendite +9,8%, utile netto +16,2%: i costi sotto il gross margin sono cresciuti meno delle vendite. &lt;b&gt;Gross margin&lt;/b&gt; = vendite − costo del venduto (solo costi di prodotto); &lt;b&gt;interest expense&lt;/b&gt; = costo delle risorse finanziarie.&lt;/p&gt;
&lt;/div&gt;
&lt;div data-panel=&quot;v&quot;&gt;
&lt;p&gt;&lt;b&gt;Vertical analysis&lt;/b&gt;: relazioni tra voci in un dato momento. Il &lt;b&gt;common size statement&lt;/b&gt; esprime ogni voce in % di un totale: delle &lt;b&gt;vendite&lt;/b&gt; nel conto economico, del &lt;b&gt;totale attivo&lt;/b&gt; nello stato patrimoniale. Così diventano confrontabili imprese di dimensioni diverse o anni con volumi diversi.&lt;/p&gt;
&lt;div id=&quot;cs&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Il gross margin è stabile (circa 72 centesimi per euro di vendite restano dopo i costi di prodotto); le spese operative scendono dal 55,3% al 54,7%, quindi il net income passa dal 10,3% al 10,9% delle vendite.&lt;/p&gt;
&lt;/div&gt;
&lt;div data-panel=&quot;bs&quot;&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;$&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;This year&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Last year&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;30,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Accounts receivable, net&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;17,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Inventory&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;12,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Prepaid expenses&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Land&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;165,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;123,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Buildings and equipment, net&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;116,390&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;128,000&lt;/td&gt;&lt;/tr&gt;
