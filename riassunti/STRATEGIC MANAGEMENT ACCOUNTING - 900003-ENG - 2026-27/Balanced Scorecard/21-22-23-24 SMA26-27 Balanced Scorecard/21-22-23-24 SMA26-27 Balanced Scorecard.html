&lt;tr&gt;&lt;td&gt;Accounts payable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;39,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;40,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Notes payable (short + long term)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;73,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;80,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Common stock, $1 par&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;27,400&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;17,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Additional paid in capital&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;158,100&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;113,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Retained earnings&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;48,890&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total stockholders&#x27; equity&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;234,390&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;180,000&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;3 · I ratios della prospettiva finanziaria&lt;/h3&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Regola «film ÷ foto»&lt;/b&gt; (slide 82): quando un ratio divide una grandezza di conto economico (film, tutto l&#x27;anno) per una di stato patrimoniale (foto, un giorno), al denominatore si usa la &lt;b&gt;media&lt;/b&gt; tra inizio e fine anno. L&#x27;utile si forma durante tutto l&#x27;anno, quindi va confrontato con le risorse disponibili in media.&lt;/div&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Gross margin percentage&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;Gross margin ÷ Sales&lt;/div&gt;354,000 ÷ 494,000 = &lt;b class=&quot;big&quot; style=&quot;font-size:1.8rem&quot;&gt;71.7%&lt;/b&gt;&lt;p&gt;Quanto resta di ogni euro dopo il costo del prodotto: potere di prezzo o produzione economica. Il lusso (Ferrari, Prada) ne trattiene molto; il discount poco e vince sul volume.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Net profit margin percentage&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;Net income ÷ Sales&lt;/div&gt;53,690 ÷ 494,000 = &lt;b class=&quot;big&quot; style=&quot;font-size:1.8rem&quot;&gt;10.9%&lt;/b&gt;&lt;p&gt;Quanto diventa utile dopo tutti i costi (commerciali, amministrativi, interessi, tasse). Supermercati: pochi centesimi; grandi software house: 20 e oltre.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Return on assets (ROA)&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;[Net income + Interest × (1 − t)] ÷ Avg total assets&lt;/div&gt;[53,690 + 7,300 × 0.70] ÷ [(300,000 + 346,390) ÷ 2] = 58,800 ÷ 323,195 = &lt;b class=&quot;big&quot; style=&quot;font-size:1.8rem&quot;&gt;18.19%&lt;/b&gt;&lt;p&gt;Profitto su tutto ciò che l&#x27;impresa possiede. Gli interessi (al netto delle tasse) si &lt;b&gt;riaggiungono&lt;/b&gt; per confrontare equamente imprese più o meno indebitate. Alto nelle attività «asset light», basso in ferrovie, acciaierie, utilities.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Return on equity (ROE)&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;Net income ÷ Avg stockholders&#x27; equity&lt;/div&gt;53,690 ÷ [(180,000 + 234,390) ÷ 2] = 53,690 ÷ 207,195 = &lt;b class=&quot;big&quot; style=&quot;font-size:1.8rem&quot;&gt;25.91%&lt;/b&gt;&lt;p&gt;Profitto per ogni euro investito dai soci. ROE &amp;gt; ROA, come in Norton, segnala l&#x27;uso del debito (&lt;span class=&quot;t&quot;&gt;leverage&lt;/span&gt; &lt;i&gt;· leva finanziaria&lt;/i&gt;). Le banche (Intesa Sanpaolo, UniCredit) lo mettono al centro dei risultati.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Earnings per share (EPS)&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;Net income ÷ Avg common shares outstanding&lt;/div&gt;53,690 ÷ [(17,000 + 27,400) ÷ 2] = 53,690 ÷ 22,200 = &lt;b class=&quot;big&quot; style=&quot;font-size:1.8rem&quot;&gt;$2.42&lt;/b&gt;&lt;p&gt;Quanto utile spetta a ogni azione: punto di partenza per dividendi e prezzo. Le quotate lo annunciano ogni trimestre e un «miss» sulle previsioni può far crollare il titolo in un giorno.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Price earnings ratio (P/E)&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;Market price per share ÷ EPS&lt;/div&gt;20.00 ÷ 2.42 = &lt;b class=&quot;big&quot; style=&quot;font-size:1.8rem&quot;&gt;8.26×&lt;/b&gt;&lt;p&gt;Quanti euro si pagano oggi per un euro di utile di quest&#x27;anno: misura le &lt;b&gt;aspettative&lt;/b&gt; di crescita, non la performance corrente. Tech in crescita: multipli alti; banche e utilities mature: bassi.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;ROI e residual income: valutare una divisione&lt;/h3&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;b&gt;ROI&lt;/b&gt; = Net operating income (EBIT) ÷ Average operating assets = &lt;b&gt;Margin&lt;/b&gt; × &lt;b&gt;Turnover&lt;/b&gt;&lt;br&gt;Margin = NOI ÷ Sales &amp;nbsp;·&amp;nbsp; Turnover = Sales ÷ Avg operating assets&lt;/div&gt;
&lt;p&gt;&lt;span class=&quot;t&quot;&gt;EBIT&lt;/span&gt; &lt;i&gt;(earnings before interest and taxes, risultato operativo)&lt;/i&gt;. Gli &lt;b&gt;operating assets&lt;/b&gt; (cassa, crediti, scorte, impianti usati per operare) si misurano al &lt;span class=&quot;t&quot;&gt;net book value&lt;/span&gt; &lt;i&gt;(costo storico meno ammortamenti accumulati: macchina da 100.000 ammortizzata 20.000 l&#x27;anno, dopo 3 anni vale 40.000)&lt;/i&gt;. Norton (tutto l&#x27;attivo trattato come operativo): margin 84,000 ÷ 494,000 = 17,0%; turnover 494,000 ÷ 323,195 = 1,53; ROI = &lt;b&gt;26,0%&lt;/b&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;b&gt;Residual income&lt;/b&gt; = NOI − (Average operating assets × Minimum required rate of return)&lt;/div&gt;
&lt;p&gt;È un importo in euro: dice se la divisione guadagna più del rendimento minimo richiesto dai proprietari. Norton con un minimo del 15%: 84,000 − 323,195 × 15% = &lt;b&gt;$35,521&lt;/b&gt;. Nella pratica è l&#x27;idea dell&#x27;&lt;span class=&quot;t&quot;&gt;economic value added (EVA)&lt;/span&gt; &lt;i&gt;(utile meno un costo per tutto il capitale usato)&lt;/i&gt;, resa famosa da Coca-Cola negli anni &#x27;90.&lt;/p&gt;
&lt;div class=&quot;fig&quot;&gt;
&lt;h4 style=&quot;margin-top:0&quot;&gt;Laboratorio: perché il residual income corregge un difetto del ROI&lt;/h4&gt;
&lt;p class=&quot;cap&quot; style=&quot;margin-top:0&quot;&gt;Divisione con attivo 1.000 e NOI 250 (ROI 25%). Le viene proposto un progetto da 200. L&#x27;impresa richiede almeno il 15%. Muovi il rendimento del progetto.&lt;/p&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;rr&quot;&gt;Rendimento progetto&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rr&quot; min=&quot;0&quot; max=&quot;35&quot; step=&quot;0.5&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;rro&quot;&gt;20%&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;rm&quot;&gt;Minimo richiesto&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rm&quot; min=&quot;5&quot; max=&quot;25&quot; step=&quot;0.5&quot; value=&quot;15&quot;&gt;&lt;output id=&quot;rmo&quot;&gt;15%&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;ROI prima&lt;/span&gt;&lt;b&gt;25,0%&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;ROI dopo il progetto&lt;/span&gt;&lt;b id=&quot;roi2&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Δ residual income&lt;/span&gt;&lt;b id=&quot;ri2&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p id=&quot;rimsg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;h4&gt;Norton a colpo d&#x27;occhio&lt;/h4&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Ratio&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Norton&lt;/th&gt;&lt;th&gt;Scorecard heading&lt;/th&gt;&lt;th&gt;Goal&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Gross margin %&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;71.7%&lt;/td&gt;&lt;td&gt;Profitability ratios&lt;/td&gt;&lt;td class=&quot;up&quot;&gt;↑&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Net profit margin %&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.9%&lt;/td&gt;&lt;td&gt;Profitability ratios&lt;/td&gt;&lt;td class=&quot;up&quot;&gt;↑&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ROA&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;18.19%&lt;/td&gt;&lt;td&gt;Profitability ratios&lt;/td&gt;&lt;td class=&quot;up&quot;&gt;↑&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ROE&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;25.91%&lt;/td&gt;&lt;td&gt;Profitability ratios&lt;/td&gt;&lt;td class=&quot;up&quot;&gt;↑&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;EPS&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$2.42&lt;/td&gt;&lt;td&gt;Market performance&lt;/td&gt;&lt;td class=&quot;up&quot;&gt;↑&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P/E&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8.26×&lt;/td&gt;&lt;td&gt;Market performance&lt;/td&gt;&lt;td class=&quot;up&quot;&gt;↑&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Un ratio diventa misura della scorecard solo quando ha una &lt;b&gt;direzione&lt;/b&gt;, un &lt;b&gt;target&lt;/b&gt; e un &lt;b&gt;legame&lt;/b&gt; con le misure non finanziarie che lo guidano.&lt;/p&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica · in quale prospettiva va ogni misura? (slide 86–87)&lt;/h3&gt;
&lt;div id=&quot;qz-persp&quot;&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Perché nel ROA si aggiunge Interest × (1 − tax rate)?&lt;/summary&gt;&lt;div&gt;Per rendere il ROA indipendente da come è finanziato l&#x27;attivo: gli interessi sono un costo del debito, non della gestione degli asset. Si aggiungono al netto delle tasse perché sono deducibili (risparmiano il 30% di imposte).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Calcola: ROI con margin 10% e turnover 2.&lt;/summary&gt;&lt;div&gt;ROI = 10% × 2 = 20%.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Label, link and name the strategy: le aziende A–D (slide 88–90)&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;b&gt;A&lt;/b&gt; · L&amp;amp;G anni di anzianità ↑ → Process nuovi prodotti progettati ↑ → Customer market share ↑ → Financial vendite da prodotti con meno di 3 anni ↑. &lt;b&gt;Product leadership.&lt;/b&gt;&lt;/p&gt;
&lt;p&gt;&lt;b&gt;B&lt;/b&gt; · L&amp;amp;G candidati «outstanding» che accettano ↑ → Process brevetti approvati ↑ → Customer percezione di product leadership ↑ → Financial vendite protette da brevetto ↑. &lt;b&gt;Product leadership.&lt;/b&gt;&lt;/p&gt;
&lt;p&gt;&lt;b&gt;C&lt;/b&gt; · L&amp;amp;G suggerimenti di miglioramento ↑ → Process libbre di rifiuti ↓ → Customer stewardship ambientale percepita ↑ → Financial ricavi da prodotti eco ↑. &lt;b&gt;Domanda aperta&lt;/b&gt;: rifiuti e suggerimenti indicano operational excellence, prodotti eco e immagine verde indicano product leadership. Mostra che le misure sociali e ambientali stanno dentro le quattro prospettive.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;D&lt;/b&gt; · L&amp;amp;G ore di formazione ↑ → Process MCE ↑ → Customer «consegnato in tempo» ↑ → Financial crescita del NOI ↑. &lt;b&gt;Operational excellence.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s5&quot; class=&quot;part p-brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;05&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section V · slide 91–101&lt;/div&gt;&lt;h2&gt;The cost of quality&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;small&gt;Definizione · slide 92&lt;/small&gt;Costs incurred to prevent defects, or that result from defects in products, are known as quality costs.&lt;/div&gt;
&lt;p&gt;Sono costi spesso grandi e sparsi in molti reparti; molte imprese lavorano per ridurli, e quelle che ci riescono hanno alta &lt;span class=&quot;t&quot;&gt;quality of conformance&lt;/span&gt; &lt;i&gt;(qualità di conformità: il prodotto rispetta o supera le specifiche di progetto ed è privo di difetti che ne rovinano aspetto o prestazioni)&lt;/i&gt;. La domanda non è «è un prodotto di lusso?» ma «&lt;b&gt;fa ciò per cui è stato progettato, ogni volta?&lt;/b&gt;». Una city bike semplice con freni che funzionano sempre ha alta qualità di conformità; una bici da corsa costosa con il cambio che salta no, per quanto avanzato sia il progetto.&lt;/p&gt;

&lt;h3&gt;Quattro tipi di quality cost&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--slate-bg);border:0&quot;&gt;&lt;span class=&quot;pill&quot; style=&quot;color:var(--slate)&quot;&gt;Before defects&lt;/span&gt;&lt;h4&gt;Prevention costs&lt;/h4&gt;Attività di supporto che impediscono ai difetti di nascere: systems development, quality engineering, quality training, &lt;span class=&quot;t&quot;&gt;quality circles&lt;/span&gt; &lt;i&gt;(piccoli gruppi di operatori che analizzano e risolvono problemi di qualità)&lt;/i&gt;, &lt;span class=&quot;t&quot;&gt;statistical process control&lt;/span&gt; &lt;i&gt;(SPC: controllo statistico del processo per accorgersi delle derive prima che producano difetti)&lt;/i&gt;, supervisione e dati sulla qualità, progetti di miglioramento, supporto tecnico ai fornitori.&lt;p&gt;&lt;b&gt;Test:&lt;/b&gt; impedisce che un difetto venga creato?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--slate-bg);border:0&quot;&gt;&lt;span class=&quot;pill&quot; style=&quot;color:var(--slate)&quot;&gt;Before defects&lt;/span&gt;&lt;h4&gt;Appraisal costs&lt;/h4&gt;Costi di ispezione per trovare i prodotti difettosi prima che arrivino ai clienti: ispezione dei materiali in entrata e del &lt;span class=&quot;t&quot;&gt;work in process&lt;/span&gt; &lt;i&gt;(semilavorati)&lt;/i&gt;, collaudo finale, materiali di test, supervisione dei test, ammortamento e manutenzione delle attrezzature di test, utenze dell&#x27;area ispezioni, field testing presso il cliente.&lt;p&gt;&lt;b&gt;Test:&lt;/b&gt; cerca difetti che potrebbero già esistere?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--brick-bg);border:0&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Because of defects&lt;/span&gt;&lt;h4&gt;Internal failure costs&lt;/h4&gt;Difetti trovati &lt;b&gt;prima&lt;/b&gt; della spedizione: scarti (net cost of scrap e spoilage), rilavorazioni, re-ispezione e re-test, fermi macchina per problemi di qualità, smaltimento dei difettosi, analisi delle cause, correzione di errori di inserimento dati.&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--brick-bg);border:0&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Because of defects&lt;/span&gt;&lt;h4&gt;External failure costs&lt;/h4&gt;Il difetto arriva al cliente: assistenza e reclami, riparazioni e sostituzioni in garanzia, riparazioni oltre garanzia, richiami, responsabilità per prodotti difettosi, resi e sconti, vendite perse per cattiva reputazione. &lt;b&gt;Il posto più caro in cui trovare un difetto.&lt;/b&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;b&gt;Cost of quality&lt;/b&gt; = prevention + appraisal + internal failure + external failure &amp;nbsp;→&amp;nbsp; obiettivo: ridurre il totale nel tempo&lt;/div&gt;

&lt;h3&gt;Più il difetto viaggia, più costa: il cavo del freno di Serio Bikes&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 860 300&quot; aria-label=&quot;Costo per difetto nelle quattro fasi&quot;&gt;
&lt;g id=&quot;brk&quot;&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Costi per difetto illustrativi (slide 97), su scala logaritmica: ogni tacca vale ×10. Prevenzione €2 (cavo più robusto concordato col fornitore, assemblatori formati) · Appraisal €10 (test di ogni freno prima dell&#x27;imballo) · Internal failure €40 (sostituire il cavo in fabbrica: manodopera, pezzi, ordine in ritardo) · External failure €400 o più (garanzia, spedizione, cliente arrabbiato, recensioni negative, rischio di incidente e richiamo).&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Spend a little more before…&lt;/h4&gt;Un programma di qualità efficace investe di più in prevention &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt; e appraisal &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;; l&#x27;investimento è &lt;b&gt;più che compensato&lt;/b&gt; dal calo di internal e external failure &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;, quindi il totale scende.&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;…lose much less after&lt;/h4&gt;Col tempo anche l&#x27;appraisal dovrebbe calare: se i difetti sono prevenuti alla fonte, c&#x27;è meno da ispezionare. &lt;b&gt;Ogni euro spostato dai failure alla prevenzione è segno che il sistema qualità sta maturando.&lt;/b&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica · classifica le 19 attività (slide 100–101)&lt;/h3&gt;
&lt;div id=&quot;qz-coq&quot;&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Quali due categorie si spendono per &lt;i&gt;evitare&lt;/i&gt; la cattiva qualità e quali due nascono &lt;i&gt;perché&lt;/i&gt; c&#x27;è stata?&lt;/summary&gt;&lt;div&gt;Prevention e appraisal servono a impedire che una scarsa qualità di conformità raggiunga i clienti; internal e external failure si sostengono perché la cattiva qualità si è verificata.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s6&quot; class=&quot;part p-brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;06&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section VI · slide 102–123&lt;/div&gt;&lt;h2&gt;Quality cost reports&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Un &lt;b&gt;quality cost report&lt;/b&gt; dettaglia prevention, appraisal, internal e external failure generati dagli attuali sforzi sulla qualità; serve a monitorare la riduzione del costo totale, di solito confrontando due o più periodi. Struttura: (1) le quattro categorie con righe di dettaglio e subtotale; (2) il totale, cioè il cost of quality; (3) ogni importo anche in &lt;b&gt;percentuale&lt;/b&gt; di una base, di solito le vendite; (4) una colonna per anno, affiancate.&lt;/p&gt;

&lt;div class=&quot;fig&quot;&gt;
&lt;h4 style=&quot;margin-top:0&quot;&gt;Laboratorio: leggi i report dei casi delle slide&lt;/h4&gt;
&lt;div class=&quot;tl&quot; id=&quot;coqcases&quot; style=&quot;display:flex;flex-wrap:wrap;gap:6px&quot;&gt;&lt;/div&gt;
&lt;div id=&quot;coqout&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Le due prove che un buon report deve superare (Serio, slide 106)&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;1 · Più speso prima, molto più risparmiato dopo&lt;/h4&gt;Prevention + appraisal +300; failure −700. Ogni euro in più speso prima ne ha risparmiati circa 2,30 dopo (700 ÷ 300 = 2,33).&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;2 · Il totale scende in % delle vendite&lt;/h4&gt;Anno 1: 1.500 ÷ 10.000 = 15%. Anno 2: 1.100 ÷ 10.000 = 11%. Quattro centesimi per euro di vendite non sono più persi per la cattiva qualità.&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Tre osservazioni: l&#x27;anno 1 era mal distribuito (80% sui failure, 1.200 su 1.500); l&#x27;anno 2 ha spostato i soldi «a monte» (prevenzione triplicata, garanzia da 900 a 250); prossimo passo, meno ispezioni.&lt;/p&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Perché ai manager serve&lt;/h4&gt;&lt;b&gt;Mostra la dimensione&lt;/b&gt; (costi trasversali che il sistema di costing di solito non raccoglie: spesso sorprendono); &lt;b&gt;ordina i problemi&lt;/b&gt; (scarti? garanzia?); &lt;b&gt;mostra il mix&lt;/b&gt; (un buon mix pende verso prevention e appraisal).&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Che cosa non può fare&lt;/h4&gt;&lt;b&gt;Non aggiusta nulla&lt;/b&gt;: solo l&#x27;azione lo fa. &lt;b&gt;I risultati arrivano tardi&lt;/b&gt;: all&#x27;inizio il totale può perfino salire mentre si installano nuovi sistemi. &lt;b&gt;Manca il costo più grande&lt;/b&gt;: le vendite perse per clienti insoddisfatti, difficili da stimare e spesso il costo di qualità più importante.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card tint&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Mercury · slide 112–114&lt;/span&gt;&lt;p&gt;Il production manager John Tran era scettico («la qualità è troppo astratta per attribuirle dei costi») e nota che le rilavorazioni sono salite da 50k a 130k. Ha ragione sul dato, ma il motivo è buono: i difetti ora sono trovati in fabbrica invece che dai clienti (resi da 320k a 80k). Con la prevenzione che matura, rilavorazioni, scarti e carico di lavoro dovrebbero calare. E il costo del «non fare niente»? Vendite e quota persi: si possono stimare dal trend della quota di mercato, dalle survey sul perché i clienti cambiano fornitore e dal margine perso per cliente.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Alfa · slide 123&lt;/span&gt;&lt;p&gt;Misure &lt;b&gt;non finanziarie&lt;/b&gt; di qualità che Alfa potrebbe monitorare: unità difettose spedite in % delle spedite &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt; (customer); &lt;span class=&quot;t&quot;&gt;good output ratio&lt;/span&gt; &lt;i&gt;(output buono / output totale per processo)&lt;/i&gt; &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt; (process); ore di formazione &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt; e turnover &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt; (learning and growth); reclami e garanzie ogni mille unità vendute &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt; (customer). Si muovono prima delle cifre in euro: sono &lt;b&gt;leading indicators&lt;/b&gt; del cost of quality.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Walton: prevention 357→650, appraisal 445→545, internal 790→500, external 1.100→680 ($000). Trend favorevole?&lt;/summary&gt;&lt;div&gt;Sì. Totale da 2.692 a 2.375 (−317). +393 su prevention e appraisal, −710 sui failure; i failure passano dal 70,2% al 49,7% del totale. Obiettivo: continuare a spostare spesa verso la prevenzione.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché all&#x27;inizio di un programma qualità le internal failure possono salire?&lt;/summary&gt;&lt;div&gt;Perché più appraisal significa che i difetti vengono intercettati in fabbrica invece che dai clienti: le external failure calano, le internal salgono (Florex +1,2 milioni internal, −4,2 milioni external).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Florex: prepara il report dalle 13 voci grezze.&lt;/summary&gt;&lt;div&gt;Prevention = quality engineering + SPC + systems development (900 → 1.500); appraisal = ispezione + ammortamento attrezzature di test + materiali di test + product testing (1.800 → 2.400); internal = rework + scrap + smaltimento (2.400 → 3.600); external = field servicing + garanzia + richiami (6.900 → 2.700). Totale 12.000 (16,00% di 75 milioni) → 10.200 (13,60%). Usa il laboratorio sopra per vedere il mix.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s7&quot; class=&quot;part p-brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;07&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section VII · slide 124–145&lt;/div&gt;&lt;h2&gt;Time is a performance measure&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;La vita di un ordine cliente: &lt;b&gt;order received&lt;/b&gt; → attesa → &lt;b&gt;production started&lt;/b&gt; → lavorazione, ispezione, spostamenti, code → &lt;b&gt;goods shipped&lt;/b&gt;.&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Throughput time&lt;/h4&gt;&lt;span class=&quot;t&quot;&gt;Manufacturing cycle time&lt;/span&gt; &lt;i&gt;(tempo di attraversamento)&lt;/i&gt;: dall&#x27;avvio della produzione alla spedizione. Goal &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;.&lt;div class=&quot;formula&quot;&gt;Process + Inspection + Move + Queue&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Delivery cycle time&lt;/h4&gt;Dal ricevimento dell&#x27;ordine alla spedizione: il tempo che il cliente &lt;b&gt;vive&lt;/b&gt;. Goal &lt;span class=&quot;dn&quot;&gt;↓&lt;/span&gt;.&lt;div class=&quot;formula&quot;&gt;Wait time + Throughput time&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Manufacturing cycle efficiency&lt;/h4&gt;Quota del throughput in cui si lavora davvero. Goal &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;, massimo 1.&lt;div class=&quot;formula&quot;&gt;MCE = Process time ÷ Throughput time&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Value-added: solo il process time&lt;/h4&gt;Il cliente pagherebbe volentieri questo tempo: trasforma il prodotto.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Non-value-added: wait, inspection, move, queue&lt;/h4&gt;Il cliente non guadagna nulla da un prodotto in coda, in viaggio per lo stabilimento o sotto controllo. L&#x27;ispezione sembra utile, ma esiste solo perché i difetti sono possibili: &lt;b&gt;previeni i difetti e l&#x27;ispezione può ridursi&lt;/b&gt; (collegamento con §5).&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Un MCE di 0,5 significa che metà del tempo di produzione va in ispezioni, spostamenti e attese. In molte imprese manifatturiere l&#x27;MCE è &lt;b&gt;sotto 0,10&lt;/b&gt;: oltre il 90% del tempo in cui un&#x27;unità è «in lavorazione» non aggiunge valore.&lt;/p&gt;

&lt;div class=&quot;fig&quot;&gt;
&lt;h4 style=&quot;margin-top:0&quot;&gt;Laboratorio: smonta il tempo di un ordine&lt;/h4&gt;
&lt;div class=&quot;tl&quot; id=&quot;tpre&quot; style=&quot;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px&quot;&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 860 150&quot; id=&quot;tsvg&quot; aria-label=&quot;Linea del tempo dell&#x27;ordine&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;tw&quot;&gt;Wait&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tw&quot; min=&quot;0&quot; max=&quot;25&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;tp&quot;&gt;Process&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tp&quot; min=&quot;0.1&quot; max=&quot;10&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;ti&quot;&gt;Inspection&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ti&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;tm&quot;&gt;Move&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tm&quot; min=&quot;0&quot; max=&quot;6&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;tq&quot;&gt;Queue&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;tq&quot; min=&quot;0&quot; max=&quot;20&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Throughput&lt;/span&gt;&lt;b id=&quot;kt&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Delivery cycle&lt;/span&gt;&lt;b id=&quot;kd&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;MCE&lt;/span&gt;&lt;b id=&quot;km&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Non-value-added&lt;/span&gt;&lt;b id=&quot;kn&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot; id=&quot;tnote&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Caso (slide)&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Throughput&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;MCE&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Delivery&lt;/th&gt;&lt;th&gt;Lettura&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Novex, giorni (130–131)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8.0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.25&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;25.0&lt;/td&gt;&lt;td&gt;Lavorato solo un quarto del tempo; il cliente aspetta 17 giorni prima che inizi il lavoro.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Codington, ore (136–137)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;25.8&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.09&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;46.6&lt;/td&gt;&lt;td&gt;Tipico: meno del 10% aggiunge valore. Con wait 1.0, move 0.8, queue 0.6: throughput 3.8, MCE 0.58, delivery 4.8.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Mittel, giorni (138–139)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;9.0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.30&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;23.0&lt;/td&gt;&lt;td&gt;Senza code: throughput 4.0, MCE 0.675, delivery 18.0; ma i 14 giorni di attesa dominano ancora l&#x27;esperienza del cliente.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;

&lt;details&gt;&lt;summary&gt;Tombro, impianto che si automatizza: quattro mesi (slide 140–142)&lt;/summary&gt;&lt;div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Giorni&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;M1&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;M2&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;M3&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;M4&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Throughput&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;6.0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;7.5&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;9.0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.0&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MCE&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.35&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.27&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.21&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0.18&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Delivery cycle&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;15.0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;19.0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;21.0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;24.0&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;b&gt;Migliora&lt;/b&gt;: difetti 185→91, warranty claims 46→27, reclami 102→58, lead time ordini d&#x27;acquisto 8→4 giorni, process time 2.1→1.8. &lt;b&gt;Peggiora&lt;/b&gt;: scarti 1%→3% del costo, downtime su, utilizzo macchine giù, setup più lunghi, throughput 6→10, MCE 0.35→0.18, delivery 15→24, consegne puntuali 96%→89%. Mese 4 senza code: 0.7+1.8+0.5 = 3.0 giorni, MCE 0.60; senza code né ispezione: 2.3 giorni, MCE 0.78.&lt;/p&gt;
&lt;p class=&quot;note&quot;&gt;&lt;b&gt;Better quality, worse flow.&lt;/b&gt; Senza le misure di tempo il management vedrebbe solo le buone notizie.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Il nuovo impianto flessibile (slide 143–144)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Throughput 7.4 → 8.0 → 8.8 → 9.5; delivery 23.4 → 25.5 → 27.8 → 30.0; MCE 0.28 → 0.25 → 0.22 → 0.19. Il process time scende, ma code e attese crescono più in fretta: puntualità dal 91% al 79% e vendite in calo ogni mese. &lt;b&gt;Faster processing, slower company.&lt;/b&gt; Mese 4 senza code: 0.4+1.8+0.6 = 2.8 giorni, MCE 0.64; senza code né ispezione: 2.2 giorni, MCE 0.82.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Amazon&lt;/span&gt;&lt;h4&gt;La velocità come promessa&lt;/h4&gt;Misura quanti ordini arrivano in giornata o il giorno dopo e ha riorganizzato i magazzini in reti regionali. Nel 2024 ha consegnato 9 miliardi di articoli in giornata o il giorno dopo: qui la misura di tempo &lt;b&gt;è&lt;/b&gt; la value proposition.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Zara (Inditex)&lt;/span&gt;&lt;h4&gt;Dal disegno al negozio in settimane&lt;/h4&gt;La moda tradizionale pianifica con mesi di anticipo; Zara disegna, produce (molto vicino alla Spagna) e spedisce in cicli brevi. Throughput più corto = &lt;b&gt;meno invenduto&lt;/b&gt; e meno saldi di fine stagione.&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica · Narton Corp. (slide 132–135)&lt;/h3&gt;
&lt;p class=&quot;cap&quot;&gt;Wait 3.0 · Inspection 0.4 · Process 0.2 · Move 0.5 · Queue 9.3 (giorni)&lt;/p&gt;
&lt;div id=&quot;qz-time&quot;&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Perché eliminare la queue alza l&#x27;MCE ma non tocca il process time?&lt;/summary&gt;&lt;div&gt;L&#x27;MCE ha il process time al numeratore (fisso) e il throughput al denominatore: togliendo tempo non a valore il denominatore si riduce e la quota a valore cresce (Codington: 2.2 ÷ 3.8 = 0.58).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s8&quot; class=&quot;part p-brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;08&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section VIII · slide 146–157&lt;/div&gt;&lt;h2&gt;Overall equipment effectiveness&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;L&#x27;&lt;b&gt;overall equipment effectiveness (OEE)&lt;/b&gt; misura la produttività di una macchina su tre dimensioni ed è molto usata dai produttori &lt;span class=&quot;t&quot;&gt;lean&lt;/span&gt; &lt;i&gt;(orientati a eliminare gli sprechi)&lt;/i&gt;. Goal &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;b&gt;OEE&lt;/b&gt; = Utilisation rate × Efficiency rate × Quality rate&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Rate&lt;/th&gt;&lt;th&gt;Formula&lt;/th&gt;&lt;th&gt;Domanda&lt;/th&gt;&lt;th&gt;Come alzarlo (slide 149)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Utilisation&lt;/td&gt;&lt;td&gt;Actual run time ÷ Machine time available&lt;/td&gt;&lt;td&gt;Gira quando potrebbe? Guasti e setup lunghi la lasciano ferma.&lt;/td&gt;&lt;td&gt;Evitare guasti, ridurre i tempi medi di setup.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Efficiency&lt;/td&gt;&lt;td&gt;Actual run rate ÷ Ideal run rate&lt;/td&gt;&lt;td&gt;Quando gira, va a piena velocità? Le micro-fermate la rallentano.&lt;/td&gt;&lt;td&gt;Evitare micro-fermate; trattenere e formare gli operatori a usarla e manutenerla.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Quality&lt;/td&gt;&lt;td&gt;Defect free output ÷ Total output&lt;/td&gt;&lt;td&gt;Di ciò che produce, quanto è senza difetti?&lt;/td&gt;&lt;td&gt;Ridurre i difettosi in % dell&#x27;output.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;Ogni rate è tra 0 e 1, quindi l&#x27;OEE è sempre più piccolo del rate più debole: tre rate al 90% danno solo 0,9³ = &lt;b&gt;73%&lt;/b&gt;. Nota il legame con learning and growth: trattenere e formare gli operatori (misura sulle persone) dovrebbe migliorare una misura di processo. Un&#x27;ipotesi if/then già pronta.&lt;/p&gt;

&lt;div class=&quot;fig&quot;&gt;
&lt;h4 style=&quot;margin-top:0&quot;&gt;Laboratorio OEE: dove si perdono le unità&lt;/h4&gt;
&lt;div id=&quot;opre&quot; style=&quot;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;ou&quot;&gt;Utilisation&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ou&quot; min=&quot;0.3&quot; max=&quot;1&quot; step=&quot;0.005&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;oe&quot;&gt;Efficiency&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;oe&quot; min=&quot;0.3&quot; max=&quot;1&quot; step=&quot;0.005&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;oq&quot;&gt;Quality&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;oq&quot; min=&quot;0.3&quot; max=&quot;1&quot; step=&quot;0.005&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot; id=&quot;ocap&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;OEE&lt;/span&gt;&lt;b id=&quot;ooee&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Unità buone&lt;/span&gt;&lt;b id=&quot;ogood&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Unità perse&lt;/span&gt;&lt;b id=&quot;olost&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 440 300&quot; id=&quot;osvg&quot; aria-label=&quot;Grafico a cascata delle perdite&quot;&gt;&lt;/svg&gt;
&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Passi (slide 153): &lt;b&gt;maximum output&lt;/b&gt; = time available × ideal rate; &lt;b&gt;utilisation loss&lt;/b&gt; = (time available − run time) × ideal rate; &lt;b&gt;efficiency loss&lt;/b&gt; = run time × (ideal − actual rate); &lt;b&gt;quality loss&lt;/b&gt; = total output − defect free output. Controllo: good ÷ maximum = OEE.&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Jayson · la macchina collo di bottiglia&lt;/h4&gt;La domanda supera la capacità: questa macchina è il &lt;span class=&quot;t&quot;&gt;bottleneck&lt;/span&gt; &lt;i&gt;(vincolo: ogni unità non prodotta qui è un&#x27;unità non venduta)&lt;/i&gt;. 0.70 × 0.95 × 0.925 = &lt;b&gt;0.615&lt;/b&gt;. Su 26.000 unità possibili: −7.800 per fermo, −910 per lentezza, −1.290 difettose = 16.000 buone. &lt;b&gt;10.000 prodotti che i clienti volevano e non hanno avuto.&lt;/b&gt; Il rate più debole è l&#x27;utilizzo: 1.950 minuti di fermo su 6.500.&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Kilmer · due settimane&lt;/h4&gt;Settimana A: 0.70 × 0.95 × 0.85 = &lt;b&gt;0.565&lt;/b&gt; (28.000 − 8.400 − 980 − 2.793 = 15.827). Settimana B: 0.60 × 0.85 × 0.70 = &lt;b&gt;0.357&lt;/b&gt; (66.000 − 26.400 − 5.940 − 10.098 = 23.562): il fermo è la perdita maggiore, ma scarta anche tre unità su dieci. Entrambi i problemi meritano attenzione &lt;b&gt;prima di comprare una macchina nuova&lt;/b&gt;.&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Una macchina ha utilisation 0.80, efficiency 0.90, quality 0.95. OEE?&lt;/summary&gt;&lt;div&gt;0.80 × 0.90 × 0.95 = 0.684. La leva più grande è l&#x27;utilizzo (il rate più basso).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Run time 4.550 min, ideal 4.0 u/min, actual 3.8: perché l&#x27;efficiency loss è 910?&lt;/summary&gt;&lt;div&gt;Mentre gira, la macchina produce 0.2 unità al minuto in meno dell&#x27;ideale: 4.550 × 0.2 = 910 unità.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché l&#x27;OEE «in unità» coincide con il prodotto dei tre rate?&lt;/summary&gt;&lt;div&gt;Good = available × U × ideal × E × Q, e maximum = available × ideal; il rapporto è U × E × Q.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s9&quot; class=&quot;part p-acc&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;09&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section IX · slide 158–173&lt;/div&gt;&lt;h2&gt;Building a scorecard&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot; data-steps&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Passo 1 di 4&lt;/span&gt;&lt;h3 style=&quot;margin-top:.4em&quot;&gt;Define the strategy&lt;/h3&gt;&lt;p&gt;Nomina i clienti target e la value proposition. Senza questa frase, ogni misura successiva è arbitraria.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Passo 2 di 4&lt;/span&gt;&lt;h3 style=&quot;margin-top:.4em&quot;&gt;Choose measures&lt;/h3&gt;&lt;p&gt;Poche per prospettiva, ciascuna con una direzione (↑ o ↓).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Passo 3 di 4&lt;/span&gt;&lt;h3 style=&quot;margin-top:.4em&quot;&gt;Link them in a strategy map&lt;/h3&gt;&lt;p&gt;Disegna le frecce e scrivi ogni freccia come un&#x27;affermazione if/then.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Passo 4 di 4&lt;/span&gt;&lt;h3 style=&quot;margin-top:.4em&quot;&gt;Test and reward&lt;/h3&gt;&lt;p&gt;Raccogli i dati, controlla i legami e solo più tardi collega la retribuzione alle misure. In sintesi: definire la strategia, tradurla in misure che ne seguono l&#x27;esecuzione, collegarle in modo &lt;b&gt;causa-effetto&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;avanti →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Jaguar: una strategia, una mappa, quattro ipotesi&lt;/h3&gt;
&lt;p class=&quot;def&quot; style=&quot;font-style:italic&quot;&gt;«Jaguar&#x27;s strategy is to offer distinctive, luxury automobiles to wealthy individuals who prize handcrafted, individualised products.»&lt;/p&gt;
&lt;div id=&quot;qz-jag&quot;&gt;&lt;/div&gt;
&lt;p&gt;Opzioni quasi illimitate di pelli, colori e cruscotti in legno: ogni auto è quasi unica. &lt;b&gt;The catch&lt;/b&gt;: Jaguar deve consegnare un&#x27;auto completamente personalizzata in tempi ragionevoli e senza spendere in personalizzazione più di quanto il cliente sia disposto a pagare.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 860 330&quot; id=&quot;jagmap&quot; aria-label=&quot;Balanced scorecard possibile per Jaguar&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Una possibile balanced scorecard per Jaguar (slide 162), ridisegnata.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;fig&quot; data-steps&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;If&lt;/b&gt; retention e ore di formazione salgono, &lt;b&gt;then&lt;/b&gt; le opzioni disponibili salgono, mentre errori per veicolo e tempo di installazione di un&#x27;opzione scendono.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;If&lt;/b&gt; le opzioni salgono ed errori e tempi di installazione scendono, &lt;b&gt;then&lt;/b&gt; la soddisfazione per le opzioni sale, e con essa la quota nel mercato delle auto di lusso.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;If&lt;/b&gt; la soddisfazione per le opzioni sale e il tempo di installazione scende, &lt;b&gt;then&lt;/b&gt; il contribution margin per auto sale.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;If&lt;/b&gt; quota di mercato e contribution margin per auto salgono, &lt;b&gt;then&lt;/b&gt; il residual income sale.&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;b&gt;E se non succede?&lt;/b&gt; Se Jaguar offre più opzioni, sbaglia meno e installa più in fretta ma soddisfazione, quota, margine e residual income non si muovono, la strategia va riconsiderata. Senza questo feedback un&#x27;impresa può andare avanti per anni con una strategia inefficace costruita su ipotesi sbagliate.&lt;/div&gt;
&lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;avanti →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;small&gt;The scorecard is a theory · slide 164&lt;/small&gt;It lays out how concrete actions should lead to the results we want. Data then tells us whether the theory holds.&lt;/div&gt;

&lt;h3&gt;Che cosa rende buona un&#x27;affermazione if/then&lt;/h3&gt;
&lt;div class=&quot;vs&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--brick-bg);border:0&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Weak&lt;/span&gt;&lt;p&gt;&lt;b&gt;«If employees are happier, the company will do better.»&lt;/b&gt; Nessuno dei due lati è una misura, non c&#x27;è direzione, niente si può verificare.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--sage-bg);border:0&quot;&gt;&lt;span class=&quot;pill&quot; style=&quot;color:var(--sage)&quot;&gt;Strong&lt;/span&gt;&lt;p&gt;&lt;b&gt;«If employee turnover ↓, then the number of warranty claims ↓.»&lt;/b&gt; Due misure con nome, una direzione ciascuna, un meccanismo spiegabile: il personale esperto sbaglia meno.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;&lt;b&gt;Checklist&lt;/b&gt;: due misure specifiche · una direzione per ciascuna · di solito da una prospettiva alla successiva · una ragione plausibile · dati che si possono davvero raccogliere.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Write the hypothesis, then break it: cinque legami e come potrebbero fallire (slide 166–167)&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Ipotesi&lt;/th&gt;&lt;th&gt;Perché il legame potrebbe non reggere&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Turnover ↓ → warranty claims ↓&lt;/td&gt;&lt;td&gt;I difetti possono venire da progetti o componenti dei fornitori, non da personale inesperto.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Defection rate ↓ → sales growth ↑&lt;/td&gt;&lt;td&gt;I clienti fedeli possono comprare meno ogni anno, o i prezzi sono stati tagliati per trattenerli.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;New products designed ↑ → share of wallet ↑&lt;/td&gt;&lt;td&gt;I nuovi prodotti possono non rispondere ai bisogni o cannibalizzare i vecchi.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Non value added costs ↓ → net operating income ↑&lt;/td&gt;&lt;td&gt;La capacità liberata resta inutilizzata, o i costi sono fissi e non spariscono.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Suggestions per employee ↑ → non value added costs ↓&lt;/td&gt;&lt;td&gt;I suggerimenti possono essere scadenti o mai applicati.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Powder 8 Lodge: la caffetteria di una stazione sciistica&lt;/h3&gt;
&lt;p&gt;Piccolo resort per sciatori giornalieri acquistato da Western Resorts, che vuole farne una destinazione. Menu ridotto (hamburger, hot dog, chili, panini, pizza, patatine); staff mantenuto; manager entusiasta ma nuovo alla ristorazione.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 860 330&quot; id=&quot;p8map&quot; aria-label=&quot;Scorecard possibile per Powder 8 Lodge&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Legami (slide 169): i guida c e h; j guida g e d; c guida e; h, g e d guidano f; e ed f guidano a; a guida b.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Corsi → lavoro migliore?&lt;/h4&gt;Un corso può non cambiare le abitudini in una caffetteria affollata, soprattutto senza un manager esperto.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Più piatti → più soddisfazione?&lt;/h4&gt;Gli sciatori possono volere velocità più che scelta; un menu lungo rallenta la preparazione.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Soddisfazione → vendite?&lt;/h4&gt;È l&#x27;unico posto dove mangiare sulle piste: le vendite dipendono più dal numero di sciatori.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Vendite → profitto?&lt;/h4&gt;Non se nuovo menu e formazione costano più delle vendite in più.&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;&lt;b&gt;Come se ne accorge il management&lt;/b&gt;: segue ogni misura nel tempo. Se una misura «if» migliora e la sua «then» no, quel legame è in dubbio.&lt;/p&gt;

&lt;h3&gt;Il negozio in centro: due problemi, sedici misure candidate&lt;/h3&gt;
&lt;p&gt;Un negozio che perde terreno contro le catene ha due problemi: (1) i clienti pagano tardi l&#x27;estratto conto della carta del negozio e i crediti inesigibili sono alti, soprattutto perché i commessi inseriscono dati sbagliati e le fatture vengono contestate; (2) l&#x27;abbigliamento stagionale invenduto viene svenduto in perdita.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 860 200&quot; aria-label=&quot;Due catene che si incontrano nel profitto&quot;&gt;
&lt;g font-size=&quot;12.5&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;54&quot;&gt;b. Clerks trained ↑&lt;/text&gt;
&lt;rect x=&quot;180&quot; y=&quot;20&quot; width=&quot;140&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;46&quot;&gt;a. Bills with&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;63&quot;&gt;errors ↓&lt;/text&gt;
&lt;rect x=&quot;350&quot; y=&quot;20&quot; width=&quot;150&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;var(--accbg)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;425&quot; y=&quot;46&quot;&gt;e. Satisfaction with&lt;/text&gt;&lt;text x=&quot;425&quot; y=&quot;63&quot;&gt;bill accuracy ↑&lt;/text&gt;
&lt;rect x=&quot;530&quot; y=&quot;20&quot; width=&quot;150&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;605&quot; y=&quot;46&quot;&gt;c. Age of receivables ↓&lt;/text&gt;&lt;text x=&quot;605&quot; y=&quot;63&quot;&gt;m. Bad debts ↓&lt;/text&gt;
&lt;rect x=&quot;10&quot; y=&quot;120&quot; width=&quot;140&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;146&quot;&gt;k. Suppliers with&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;163&quot;&gt;JIT delivery ↑&lt;/text&gt;
&lt;rect x=&quot;180&quot; y=&quot;120&quot; width=&quot;140&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;146&quot;&gt;i. Unsold season&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;163&quot;&gt;end inventory ↓&lt;/text&gt;
&lt;rect x=&quot;730&quot; y=&quot;70&quot; width=&quot;120&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;790&quot; y=&quot;104&quot; font-size=&quot;14&quot;&gt;p. Total profit ↑&lt;/text&gt;
&lt;/g&gt;
&lt;g stroke=&quot;var(--acc)&quot; stroke-width=&quot;2.2&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M152 49H176&quot;/&gt;&lt;path d=&quot;M322 49H346&quot;/&gt;&lt;path d=&quot;M502 49H526&quot;/&gt;&lt;path d=&quot;M682 55L726 90&quot;/&gt;&lt;path d=&quot;M152 149H176&quot;/&gt;&lt;path d=&quot;M322 149L726 108&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;figcaption&gt;Commessi formati sbagliano meno; fatture corrette non vengono contestate; i clienti pagano prima e meno crediti vanno persi. Fornitori &lt;span class=&quot;t&quot;&gt;just in time&lt;/span&gt; &lt;i&gt;(consegne puntuali in piccoli lotti quando servono)&lt;/i&gt; permettono ordini più piccoli e vicini alla stagione: meno invenduto. Le misure d, f, g, j, l, n, o non affrontano nessuno dei due problemi (slide 171–172).&lt;/figcaption&gt;&lt;/figure&gt;
&lt;p&gt;E se dopo un anno i risultati sono misti? Trova il &lt;b&gt;primo legame&lt;/b&gt; che non ha funzionato in ogni catena: l&#x27;ipotesi è sbagliata o l&#x27;effetto ha bisogno di più tempo? Fatture corrette ma clienti ancora in ritardo: forse il credito è concesso troppo facilmente, la riscossione è debole o i clienti sono a corto di soldi. Numeri migliori ma stesso profitto: risparmi mangiati dai costi di formazione o dei fornitori, scorte troppo snelle che fanno perdere vendite, credito più stretto che spinge i clienti verso le catene. La scorecard non riporta solo un profitto deludente: indica &lt;b&gt;quale ipotesi esaminare&lt;/b&gt;.&lt;/p&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;div id=&quot;qz-ifthen&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s10&quot; class=&quot;part p-acc&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;10&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Section X · slide 174–186&lt;/div&gt;&lt;h2&gt;Using the scorecard&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;h3&gt;Collega la retribuzione alla scorecard, ma non dal primo giorno&lt;/h3&gt;
&lt;p&gt;I bonus possono, e probabilmente devono, essere legati alle misure della scorecard, altrimenti verranno ignorate. Ma solo dopo che l&#x27;organizzazione è stata gestita con la scorecard per un po&#x27;, &lt;b&gt;forse un anno o più&lt;/b&gt;. Prima bisogna essere sicuri che le misure siano &lt;b&gt;reliable&lt;/b&gt; (affidabili), &lt;b&gt;sensible&lt;/b&gt; (sensate), &lt;b&gt;comprese&lt;/b&gt; da chi viene valutato e &lt;b&gt;non facilmente manipolabili&lt;/b&gt;.&lt;/p&gt;

&lt;div class=&quot;fig&quot;&gt;
&lt;h4 style=&quot;margin-top:0&quot;&gt;Pipeline Unlimited: su che cosa paghi le provvigioni?&lt;/h4&gt;
&lt;p class=&quot;cap&quot; style=&quot;margin-top:0&quot;&gt;Produttore di attrezzatura da surf al 75% della capacità; in scorecard mette la crescita delle vendite. Due tavole: XR7 (prezzo $695, costi variabili $344, &lt;span class=&quot;t&quot;&gt;contribution margin&lt;/span&gt; &lt;i&gt;· prezzo meno costi variabili&lt;/i&gt; $351) e Turbo ($749, $410, CM $339).&lt;/p&gt;
&lt;div style=&quot;display:flex;gap:6px;flex-wrap:wrap&quot;&gt;&lt;button class=&quot;btn on&quot; type=&quot;button&quot; id=&quot;cm1&quot;&gt;10% delle vendite&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;cm2&quot;&gt;10% del contribution margin&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;kpis&quot; style=&quot;margin-top:10px&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Provvigione XR7&lt;/span&gt;&lt;b id=&quot;cx&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;Provvigione Turbo&lt;/span&gt;&lt;b id=&quot;ct&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;span&gt;I venditori spingono&lt;/span&gt;&lt;b id=&quot;cp&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p id=&quot;cmsg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Come si «gioca» una misura (gaming)&lt;/h3&gt;
&lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;gaming&lt;/span&gt; &lt;i&gt;(manipolare il comportamento per migliorare il numero senza migliorare l&#x27;impresa)&lt;/i&gt; è il rischio di ogni misura isolata. Prova a indovinare il trucco prima di aprire.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;1 · Speed to market: R&amp;amp;D è valutata sul tempo medio di sviluppo prima del rilascio&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Trucco&lt;/b&gt;: rilasciare prodotti non del tutto testati. Il tempo di sviluppo scende ma difetti e resi salgono dopo il lancio. &lt;b&gt;Contrappeso&lt;/b&gt;: defect rate dopo il lancio.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;2 · Luggage unloading: bonus se il tempo medio dal parcheggio all&#x27;ultimo bagaglio batte il mese precedente&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Trucco&lt;/b&gt;: correre con i bagagli, o lavorare lentamente un mese e veloce il successivo (un mese lento prepara una vittoria facile). &lt;b&gt;Contrappeso&lt;/b&gt;: bagagli danneggiati; un target fisso invece del confronto col mese prima.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;3 · On time shipments: il production manager concorda la data con il cliente ed è giudicato sulla % spedita entro quella data&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Trucco&lt;/b&gt;: concordare date lontane nel futuro. La % puntuale sale mentre i clienti aspettano di più. &lt;b&gt;Contrappeso&lt;/b&gt;: delivery cycle time.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;4 · Revenue per employee per i manager delle filiali&lt;/summary&gt;&lt;div&gt;&lt;b&gt;Trucco&lt;/b&gt;: sostituire dipendenti con collaboratori esterni, o tagliare i prezzi per fare volume. Il rapporto sale, i costi salgono e i margini scendono. &lt;b&gt;Contrappeso&lt;/b&gt;: profit per employee.&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;note&quot;&gt;&lt;b&gt;Lezione&lt;/b&gt;: una misura singola invita al gaming. Affiancale un &lt;b&gt;counterweight&lt;/b&gt; (contrappeso) che peggiora quando qualcuno bara.&lt;/p&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Caso · slide 180&lt;/span&gt;&lt;h4&gt;Wells Fargo: quando una sola misura governava la banca&lt;/h4&gt;&lt;p&gt;Strategia costruita sul &lt;span class=&quot;t&quot;&gt;cross selling&lt;/span&gt; &lt;i&gt;(vendere più prodotti allo stesso cliente)&lt;/i&gt;, motto interno «eight is great». Con obiettivi di vendita giornalieri, i dipendenti delle filiali aprirono fino a 3,5 milioni di conti mai richiesti dai clienti. Nel 2020 la banca ha accettato di pagare 3 miliardi di dollari per chiudere le indagini penali e civili, e la reputazione ne ha sofferto per anni. &lt;b&gt;Misura&lt;/b&gt;: prodotti per cliente ↑. &lt;b&gt;Contrappesi mancanti&lt;/b&gt;: conti effettivamente usati ↑, reclami dei clienti ↓, turnover del personale di filiale ↓.&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Oltre gli azionisti: CSR nella scorecard&lt;/h3&gt;
&lt;p&gt;Le imprese devono soddisfare gli azionisti, ma hanno responsabilità anche verso altri stakeholder: clienti, dipendenti, fornitori, comunità, associazioni ambientaliste e per i diritti umani. La &lt;span class=&quot;t&quot;&gt;corporate social responsibility (CSR)&lt;/span&gt; &lt;i&gt;(responsabilità sociale d&#x27;impresa)&lt;/i&gt; significa considerare i bisogni di tutti gli stakeholder nelle decisioni, andando oltre il rispetto della legge con azioni volontarie.&lt;/p&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--sage-bg);border:0&quot;&gt;&lt;h4&gt;Opportunity&lt;/h4&gt;Toyota sviluppa la Prius ibrida per rispondere alle preoccupazioni sulle emissioni e far crescere il valore per gli azionisti. Timberland fa le scarpe Earthkeepers con bottiglie di plastica riciclate (linea cresciuta in fretta e con profitto). Procter &amp;amp; Gamble unisce centri di distribuzione e taglia costi ed emissioni.&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--brick-bg);border:0&quot;&gt;&lt;h4&gt;Risk&lt;/h4&gt;Inquinare, comprare da fornitori che usano lavoro minorile, discriminare: danni di reputazione. Poi boicottaggi, meno candidati forti, più turnover, investitori scontenti, cause e multe.&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Qualunque sia il motivo (etica, opportunità o rischio), serve misurare: con indicatori che i manager possono seguire e gli stakeholder leggere.&lt;/p&gt;
&lt;h4&gt;Il framework GRI&lt;/h4&gt;
&lt;p&gt;La &lt;span class=&quot;t&quot;&gt;GRI&lt;/span&gt; &lt;i&gt;(Global Reporting Initiative)&lt;/i&gt; è un&#x27;organizzazione di riferimento nella misura della performance sociale e ambientale. Il suo framework di sustainability reporting ha &lt;b&gt;universal standards&lt;/b&gt; (dichiarazione del vertice sulla CSR; stakeholder e frequenza del dialogo; ruolo del board su rischi e reporting) e tre gruppi di &lt;b&gt;topic specific standards&lt;/b&gt;: &lt;b&gt;economic&lt;/b&gt; (fondi pensione, fornitori e manager locali, salari d&#x27;ingresso per genere, rischio climatico), &lt;b&gt;environmental&lt;/b&gt; (acqua, rifiuti, energia, biodiversità, emissioni), &lt;b&gt;social&lt;/b&gt; (salute e sicurezza, diritti umani, formazione, diversità, sicurezza ed etichettatura dei prodotti). Le tre aree riflettono la &lt;span class=&quot;t&quot;&gt;triple bottom line&lt;/span&gt; &lt;i&gt;(people, planet, profit)&lt;/i&gt;.&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Prospettiva&lt;/th&gt;&lt;th&gt;Misure CSR (slide 184)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Financial&lt;/td&gt;&lt;td&gt;Ricavi da prodotti eco ↑; costo carburante per dollaro di vendite ↓; costi totali di indennizzo dei lavoratori; investimenti in prodotti e processi green&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Customer&lt;/td&gt;&lt;td&gt;Clienti che concordano che teniamo a comunità ↑, sicurezza del prodotto ↑, ambiente ↑, e che li informiamo sulla nostra CSR ↑&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Internal processes&lt;/td&gt;&lt;td&gt;Acqua per unità ↓; input riciclati ↑; emissioni di carbonio per unità ↓; libbre di rifiuti ↓&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Learning and growth&lt;/td&gt;&lt;td&gt;Infortuni ↓; retribuzione media donne/uomini ↑; candidati da gruppi sottorappresentati ↑; ore di volontariato per dipendente ↑&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Dentro le quattro caselle&lt;/h4&gt;Aggiungere misure sociali e ambientali alle prospettive esistenti.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Una quinta prospettiva&lt;/h4&gt;Una categoria dedicata a una platea più ampia di stakeholder.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Una scorecard separata&lt;/h4&gt;Dedicata alla performance sociale e ambientale dell&#x27;impresa o dei suoi fornitori.&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;In ogni formato valgono due regole: collegare le misure con affermazioni if/then e legarle a come i senior manager sono valutati e premiati. &lt;b&gt;Altrimenti un impegno proclamato può non tradursi in azione.&lt;/b&gt;&lt;/p&gt;

&lt;h3&gt;Che cosa portiamo via, e che cosa viene dopo&lt;/h3&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;ol style=&quot;margin:0;padding-left:1.2em&quot;&gt;&lt;li&gt;&lt;b&gt;Strategy first&lt;/b&gt;: la value proposition decide quali misure vanno in scorecard.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Quattro prospettive collegate&lt;/b&gt; da ipotesi if/then e disegnate come strategy map.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Misure non finanziarie&lt;/b&gt; come qualità, tempo e OEE anticipano i risultati finanziari.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Balance and rewards&lt;/b&gt;: ogni misura con un contrappeso, poi il legame con la retribuzione.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Prossima lezione&lt;/span&gt;&lt;h4&gt;The Sustainable Balanced Scorecard&lt;/h4&gt;&lt;p&gt;Quando tra gli stakeholder entrano ambiente e società, la mappa ha bisogno di nuovi obiettivi. Da pensare prima: dove sta la capacità rinnovabile di Enel nella sua strategy map? Quale misura ambientale aggiungeresti alla mappa di Ryanair?&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché non legare subito i bonus alla scorecard?&lt;/summary&gt;&lt;div&gt;Perché prima va verificato che le misure siano affidabili, sensate, comprese e difficili da manipolare, e che le ipotesi if/then reggano: pagare su misure sbagliate premia i comportamenti sbagliati (Wells Fargo).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Con provvigioni al 10% delle vendite, quale tavola spingono i venditori e quale conviene all&#x27;impresa?&lt;/summary&gt;&lt;div&gt;Spingono la Turbo ($74,90 contro $69,50) ma all&#x27;impresa conviene la XR7 (CM $351 contro $339). Pagando sul contribution margin gli interessi si allineano: finché i costi fissi non dipendono dal mix, massimizzare il CM massimizza il profitto.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quali sono i tre modi per portare la CSR nella scorecard?&lt;/summary&gt;&lt;div&gt;Misure dentro le quattro prospettive; una quinta prospettiva per gli stakeholder; una scorecard separata (dell&#x27;impresa o dei fornitori).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s11&quot; class=&quot;part p-acc&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;→&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Fonti esterne · cercate sul web&lt;/div&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Le schede qui sotto riguardano autori, testi, casi e standard &lt;b&gt;citati nelle slide&lt;/b&gt;. Il contenuto di ogni scheda viene dalla ricerca web ed è segnato come &lt;b&gt;fonte esterna&lt;/b&gt;: non fa parte delle slide. Dove la fonte esterna non coincide con la slide, lo segnalo.&lt;/p&gt;
&lt;div class=&quot;grid two&quot;&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Kaplan &amp;amp; Norton (1992), «The Balanced Scorecard: Measures That Drive Performance», &lt;i&gt;Harvard Business Review&lt;/i&gt;, gen–feb 1992&lt;/h4&gt;&lt;p&gt;L&#x27;articolo che introduce la scorecard, nato da un progetto di ricerca di un anno con 12 imprese: un insieme di misure che affianca ai risultati finanziari misure operative su clienti, processi interni e innovazione/apprendimento. HBR lo ha ripubblicato come «classico» nel 2005. Conta perché è il testo d&#x27;origine della slide 12.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://hbr.org/1992/01/the-balanced-scorecard-measures-that-drive-performance-2&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;hbr.org · articolo del 1992&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Kaplan &amp;amp; Norton (1996), &lt;i&gt;The Balanced Scorecard: Translating Strategy into Action&lt;/i&gt;, Harvard Business School Press&lt;/h4&gt;&lt;p&gt;Il libro (circa 320 pagine) che trasforma la scorecard da strumento di reporting a sistema di gestione della strategia, con le quattro prospettive financial, customer, internal business processes, learning and growth. Prima parte teorica, seconda su come costruirla.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://find.library.upatras.gr/Record/63249/Description?lng=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda di catalogo bibliotecario (Università di Patrasso)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Kaplan &amp;amp; Norton (2004), &lt;i&gt;Strategy Maps: Converting Intangible Assets into Tangible Outcomes&lt;/i&gt;, Harvard Business School Press&lt;/h4&gt;&lt;p&gt;Il seguito che introduce le strategy maps: come gli asset intangibili (persone, informazioni, organizzazione) si traducono, attraverso processi e clienti, in risultati finanziari. È la base delle mappe di Ryanair, Jaguar e Powder 8 Lodge.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.emerald.com/insight/content/doi/10.1108/jbs.2004.28825eae.003/full/html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;recensione su Journal of Business Strategy (Emerald)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Treacy &amp;amp; Wiersema (1993), «Customer Intimacy and Other Value Disciplines», &lt;i&gt;HBR&lt;/i&gt; 71(1), pp. 84–93&lt;/h4&gt;&lt;p&gt;Propone le tre «value disciplines»: operational excellence, customer intimacy, product leadership. Tesi centrale: si può essere leader in una sola, mantenendo un livello soglia nelle altre due. Sviluppato nel libro &lt;i&gt;The Discipline of Market Leaders&lt;/i&gt; (1995). Il link è a una sintesi secondaria, non all&#x27;articolo originale.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.toolshero.com/strategy/value-disciplines-treacy-wiersema/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sintesi del modello (Toolshero)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Enel, bond «SDG-linked» da 1,5 miliardi di dollari (settembre 2019)&lt;/h4&gt;&lt;p&gt;Il comunicato di Enel conferma: bond quinquennale sul mercato USA, KPI = quota di capacità rinnovabile installata almeno al 55% entro il 31/12/2021 (45,9% al 30/6/2019), step-up di 25 punti base se mancato. Il primo strumento di questo tipo: un caso scuola di misura non finanziaria dentro un contratto finanziario.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.emarketstorage.it/sites/default/files/comunicati/2022-05/20190906_67431.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;comunicato stampa Enel (archivio eMarket Storage)&lt;/a&gt; · &lt;a class=&quot;lnk&quot; href=&quot;https://cib.bnpparibas/italian-energy-company-issues-groundbreaking-sdg-linked-bond/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BNP Paribas&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Luxottica, settimana corta (Il Giornale, 30/11/2023)&lt;/h4&gt;&lt;p&gt;La fonte citata nella slide. La stampa descrive l&#x27;accordo di fine 2023 con avvio sperimentale ad aprile 2024: quattro giorni per 20 settimane l&#x27;anno a parità di salario, in alcuni reparti di sei stabilimenti (Agordo, Sedico, Cencenighe, Pederobba, Lauriano, Rovereto), su base volontaria, rinunciando ad alcuni permessi. &lt;b&gt;Attenzione&lt;/b&gt;: le fonti parlano di circa mille lavoratori coinvolti all&#x27;avvio, mentre la slide indica circa 15.000 dipendenti coperti; verifica il dato.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.ilgiornale.it/news/aziende/luxottica-settimana-lavorativa-quattro-giorni-senza-toccare-2249477.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Il Giornale&lt;/a&gt; · &lt;a class=&quot;lnk&quot; href=&quot;https://www.ilpost.it/2023/12/01/essilorluxottica-settimana-quattro-giorni/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Il Post&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Stellantis EV Day (8 luglio 2021)&lt;/h4&gt;&lt;p&gt;Presentazione della strategia di elettrificazione: quattro piattaforme STLA (Small, Medium, Large e la body-on-frame Frame) con moduli di trazione elettrica condivisi. Utile per il caso sulle misure di processo (piattaforme e parti comuni).&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.stellantis.com/en/news/press-releases/2021/july/stellantis-intensifies-electrification-while-targeting-sustainable-double-digit-adjusted-operating-income-margins-in-the-mid-term&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;comunicato stampa Stellantis&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Wells Fargo, accordo da 3 miliardi di dollari (febbraio 2020)&lt;/h4&gt;&lt;p&gt;Il Dipartimento di Giustizia USA documenta l&#x27;accordo per chiudere le indagini penali e civili sulle pratiche di vendita 2002–2016 (conti aperti senza autorizzazione, chiamati internamente «gaming»), con un deferred prosecution agreement di tre anni e 500 milioni destinati alla SEC. È la fonte primaria del caso di slide 180.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.justice.gov/archives/opa/pr/wells-fargo-agrees-pay-3-billion-resolve-criminal-and-civil-investigations-sales-practices&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;justice.gov · comunicato DOJ&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;GRI Standards (Global Reporting Initiative)&lt;/h4&gt;&lt;p&gt;Dal 2021 gli Universal Standards sono GRI 1 (Foundation), GRI 2 (General Disclosures) e GRI 3 (Material Topics); i Topic Standards (serie 200 economici, 300 ambientali, 400 sociali) si applicano ai temi materiali individuati con GRI 3. Sono lo standard di sustainability reporting più diffuso e la base della slide 183.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.globalreporting.org/standards/standards-development/universal-standards/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;globalreporting.org · Universal Standards&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Economic Value Added (Stern Stewart) e Coca-Cola&lt;/h4&gt;&lt;p&gt;L&#x27;EVA è stato sviluppato da Stern Stewart &amp;amp; Co. negli anni &#x27;80: utile operativo meno un costo per tutto il capitale investito, la stessa logica del residual income. Coca-Cola, con il CEO Roberto Goizueta, è stata tra i primi e più noti adottanti negli anni &#x27;90.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://sternvaluemanagement.com/about-us/our-history&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Stern Value Management · storia&lt;/a&gt; · &lt;a class=&quot;lnk&quot; href=&quot;https://money.cnn.com/magazines/fortune/fortune_archive/1995/12/11/208459/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fortune, 1995&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Amazon: 9 miliardi di articoli in giornata o il giorno dopo (2024)&lt;/h4&gt;&lt;p&gt;Annuncio di Amazon (febbraio 2025): consegne più veloci di sempre per i clienti Prime nel 2024, oltre 9 miliardi di articoli same-day o next-day nel mondo. Il dato viene dall&#x27;azienda stessa.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.aboutamazon.eu/news/retail/amazon-prime-members-enjoyed-fastest-ever-delivery-speeds-in-2024&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;aboutamazon.eu&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Zara (Inditex): il modello «fast fashion»&lt;/h4&gt;&lt;p&gt;Le analisi descrivono tempi dal disegno al negozio di circa due–tre settimane, produzione in piccoli lotti e circa metà dei capi (i più legati alle tendenze) prodotta vicino alla Spagna. Le cifre variano da fonte a fonte; per i numeri ufficiali vanno visti i report di Inditex.&lt;/p&gt;&lt;a class=&quot;lnk&quot; href=&quot;https://www.retail-week.com/fashion/inside-inditex-how-zara-became-a-global-fashion-phenomenon/5065325.article&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Retail Week · Inside Inditex&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot; style=&quot;margin-top:18px&quot;&gt;&lt;b&gt;Sugli altri materiali del corso.&lt;/b&gt; La consegna chiedeva di consultare la cartella &lt;code&gt;corso/&lt;/code&gt; per collegare questa lezione alle altre. Con gli strumenti disponibili in questa sessione non è stato possibile elencare il contenuto della cartella, quindi questo canvas usa &lt;b&gt;solo&lt;/b&gt; il PDF «21-22-23-24 SMA26-27 Balanced Scorecard». L&#x27;unico collegamento con altre lezioni viene dalla slide 186, che annuncia la lezione successiva, &lt;i&gt;The Sustainable Balanced Scorecard&lt;/i&gt;.&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
&lt;/div&gt;&lt;/footer&gt;
