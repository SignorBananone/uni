&lt;figcaption&gt;&lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt; Modello inventato per far vedere il meccanismo: failure costs = 900 × e&lt;sup&gt;−x/90&lt;/sup&gt;. Le slide non danno curve né un punto di minimo. La regola delle slide è solo che il totale si deve abbassare nel tempo.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;p class=&quot;quote&quot;&gt;“Preventing defects is better than detecting them after they have occurred.”&lt;/p&gt;
&lt;p&gt;Ogni euro spostato dalle failures alla prevention è segno che il quality system sta maturando. &lt;span class=&quot;src&quot;&gt;slide 28&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Autoverifica: che tipo di quality cost è?&lt;/h3&gt;
&lt;div class=&quot;sorter&quot; data-opts=&quot;Prevention|Appraisal|Internal failure|External failure&quot;&gt;
&lt;p class=&quot;score&quot;&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li data-a=&quot;2&quot; data-w=&quot;Difetto trovato prima della spedizione (slide 26).&quot;&gt;Scrap di 200 pezzi trovati difettosi in reparto&lt;/li&gt;
&lt;li data-a=&quot;3&quot; data-w=&quot;Il prodotto difettoso ha già raggiunto il cliente (slide 26).&quot;&gt;Riparazioni in warranty&lt;/li&gt;
&lt;li data-a=&quot;1&quot; data-w=&quot;Serve a trovare i difettosi prima del cliente (slide 26).&quot;&gt;Ispezione finale dei prodotti&lt;/li&gt;
&lt;li data-a=&quot;0&quot; data-w=&quot;Serve a impedire il difetto. Esempio di integrazione, coerente con la slide 26.&quot;&gt;Corso di qualità per gli operai&lt;/li&gt;
&lt;li data-a=&quot;3&quot; data-w=&quot;Il cliente deluso non ricompra (slide 26). In pratica è una stima.&quot;&gt;Lost sales per cattiva reputazione&lt;/li&gt;
&lt;li data-a=&quot;2&quot; data-w=&quot;La slide 26 cita il downtime tra le internal failures: la linea si ferma per un difetto.&quot;&gt;Downtime causato da un lotto difettoso&lt;/li&gt;
&lt;li data-a=&quot;0&quot; data-w=&quot;Elimina la causa alla fonte. Esempio di integrazione.&quot;&gt;Riprogettare un pezzo perché non si possa montare male&lt;/li&gt;
&lt;li data-a=&quot;3&quot; data-w=&quot;Il difetto è uscito dall&#x27;azienda (slide 26).&quot;&gt;Recall di un modello già venduto&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-ar&quot; id=&quot;s6&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Sezione VI&lt;/span&gt;&lt;h2&gt;Quality cost reports&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slide 29–30. Far vedere dove finiscono i soldi della qualità.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;p&gt;Un &lt;b&gt;quality cost report&lt;/b&gt; dettaglia prevention, appraisal, internal e external failure costs dell&#x27;azienda. Serve a monitorare i progressi nel ridurre il cost of quality, di solito confrontando due o più periodi. La struttura è in quattro punti. &lt;span class=&quot;src&quot;&gt;slide 30&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;steps&quot; data-steps&gt;&lt;ol&gt;
&lt;li&gt;Le &lt;b&gt;quattro categorie&lt;/b&gt;, ciascuna con le righe di dettaglio e un subtotal.&lt;/li&gt;
&lt;li&gt;Un &lt;b&gt;grand total&lt;/b&gt;: il cost of quality.&lt;/li&gt;
&lt;li&gt;Ogni importo anche come &lt;b&gt;percentuale&lt;/b&gt; di una base, di solito le total sales.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Una colonna per anno&lt;/b&gt;, affiancate.&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;h3&gt;Un report di esempio&lt;/h3&gt;
&lt;p&gt;Dati inventati, in k€. Sales: 10.000 nell&#x27;anno 1, 12.500 nell&#x27;anno 2. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;div class=&quot;ctl&quot; id=&quot;rep-tg&quot; role=&quot;group&quot; aria-label=&quot;Livello di dettaglio&quot; style=&quot;margin:0 0 .5rem&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;tog&quot; aria-pressed=&quot;true&quot;&gt;Tutte le righe&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;tog&quot; aria-pressed=&quot;false&quot;&gt;Solo subtotal&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tw&quot; style=&quot;margin:.4rem 0&quot;&gt;&lt;table id=&quot;rep-t&quot;&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Voce&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Anno 1&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;% sales&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Anno 2&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;% sales&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody id=&quot;rep-b&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;sb-r&quot;&gt;&lt;span&gt;Anno 1&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;sb&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sb-r&quot;&gt;&lt;span&gt;Anno 2&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;sb&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;keys&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:oklch(43% .1 250)&quot;&gt;&lt;/i&gt;Prevention&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:oklch(66% .09 250)&quot;&gt;&lt;/i&gt;Appraisal&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:oklch(62% .12 35)&quot;&gt;&lt;/i&gt;Internal failure&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:oklch(38% .1 28)&quot;&gt;&lt;/i&gt;External failure&lt;/span&gt;&lt;/div&gt;
&lt;/figure&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3&gt;Come si legge&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Il mix si è spostato.&lt;/b&gt; Prevention e appraisal salgono da 150 a 230 (+80). Le failure scendono da 670 a 380 (−290).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;L&#x27;investimento è more than offset.&lt;/b&gt; +80 contro −290: il totale scende di 210, da 820 a 610.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;La percentuale conta.&lt;/b&gt; Le sales sono cresciute, quindi il confronto in euro sottostima il progresso: da 8,20% a 4,88% delle sales.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;note int read&quot;&gt;&lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;p&gt;Alcune voci vanno stimate, come le lost sales, che non hanno una fattura. Un report può quindi sottostimare il costo reale delle external failures.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Prevention 60, appraisal 90, internal 150, external 200, sales 5.000. Quanto vale il cost of quality, in valore e in percentuale?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;60 + 90 + 150 + 200 = &lt;b&gt;500&lt;/b&gt;; 500 ÷ 5.000 = &lt;b&gt;10%&lt;/b&gt; delle sales.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché usare le percentuali se ci sono già gli importi?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Per confrontare periodi con volumi diversi: un costo può salire in euro e scendere rispetto alle sales (slide 30).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Nell&#x27;anno 2 la prevention sale. È una cattiva notizia?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Non da sola. È positivo se le failure scendono di più e il totale cala (slide 27 e 28).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-ar&quot; id=&quot;s7&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Sezione VII&lt;/span&gt;&lt;h2&gt;Time is a performance measure&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slide 31–35. La vita di un ordine, misurata.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;p&gt;Un ordine attraversa cinque fasi. Solo una aggiunge valore: il &lt;b&gt;process time&lt;/b&gt;, quando sul prodotto si lavora davvero (&lt;b&gt;value-added&lt;/b&gt;). Wait, inspection, move e queue sono &lt;b&gt;non-value-added&lt;/b&gt;: vanno ridotti il più possibile. &lt;span class=&quot;src&quot;&gt;slide 32&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Muovi i cursori. I valori iniziali sono inventati e il calcolo è lo stesso dell&#x27;esercizio qui sotto.&lt;/p&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;label class=&quot;sl-r&quot; for=&quot;t-wait&quot;&gt;&lt;span&gt;Wait&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;t-wait&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;9&quot;&gt;&lt;output id=&quot;o-wait&quot; for=&quot;t-wait&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;sl-r&quot; for=&quot;t-proc&quot;&gt;&lt;span&gt;Process&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;t-proc&quot; min=&quot;0.5&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;o-proc&quot; for=&quot;t-proc&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;sl-r&quot; for=&quot;t-insp&quot;&gt;&lt;span&gt;Inspection&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;t-insp&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.1&quot; value=&quot;0.4&quot;&gt;&lt;output id=&quot;o-insp&quot; for=&quot;t-insp&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;sl-r&quot; for=&quot;t-move&quot;&gt;&lt;span&gt;Move&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;t-move&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.1&quot; value=&quot;0.6&quot;&gt;&lt;output id=&quot;o-move&quot; for=&quot;t-move&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;sl-r&quot; for=&quot;t-queue&quot;&gt;&lt;span&gt;Queue&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;t-queue&quot; min=&quot;0&quot; max=&quot;20&quot; step=&quot;0.5&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;o-queue&quot; for=&quot;t-queue&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;tbar&quot; id=&quot;t-bar&quot; aria-hidden=&quot;true&quot;&gt;&lt;i class=&quot;seg0&quot;&gt;&lt;/i&gt;&lt;i class=&quot;seg1&quot;&gt;&lt;/i&gt;&lt;i class=&quot;seg2&quot;&gt;&lt;/i&gt;&lt;i class=&quot;seg3&quot;&gt;&lt;/i&gt;&lt;i class=&quot;seg4&quot;&gt;&lt;/i&gt;&lt;/div&gt;
&lt;div class=&quot;brk&quot; id=&quot;b-th&quot;&gt;Throughput time&lt;/div&gt;
&lt;div class=&quot;brk&quot; style=&quot;margin-top:0&quot;&gt;Delivery cycle time&lt;/div&gt;
&lt;div class=&quot;keys&quot;&gt;&lt;span&gt;&lt;i class=&quot;seg0&quot;&gt;&lt;/i&gt;Wait: ordine ricevuto, produzione non iniziata&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;seg1&quot;&gt;&lt;/i&gt;Process: value-added&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;seg2&quot;&gt;&lt;/i&gt;Inspection&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;seg3&quot;&gt;&lt;/i&gt;Move&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;seg4&quot;&gt;&lt;/i&gt;Queue&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ko&quot;&gt;
&lt;div&gt;&lt;b id=&quot;k-th&quot;&gt;&lt;/b&gt;&lt;span&gt;Throughput time ↓&lt;/span&gt;&lt;/div&gt;
&lt;div&gt;&lt;b id=&quot;k-dc&quot;&gt;&lt;/b&gt;&lt;span&gt;Delivery cycle time ↓&lt;/span&gt;&lt;/div&gt;
&lt;div&gt;&lt;b id=&quot;k-mce&quot;&gt;&lt;/b&gt;&lt;span&gt;MCE ↑ (massimo 1)&lt;/span&gt;&lt;/div&gt;
&lt;div&gt;&lt;b id=&quot;k-nva&quot;&gt;&lt;/b&gt;&lt;span&gt;Produzione senza valore&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;out&quot; id=&quot;t-msg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;/figure&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Throughput time&lt;/h4&gt;&lt;p&gt;Detto anche manufacturing cycle time: da quando parte la produzione a quando i prodotti finiti vengono spediti. &lt;span class=&quot;src&quot;&gt;slide 33&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;f&quot; style=&quot;font-size:1.05rem;background:var(--paper)&quot;&gt;Process + Inspection + Move + Queue&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Delivery cycle time&lt;/h4&gt;&lt;p&gt;Dall&#x27;ordine &lt;b&gt;ricevuto&lt;/b&gt; ai prodotti &lt;b&gt;spediti&lt;/b&gt;: è il tempo che il cliente vive davvero. &lt;span class=&quot;src&quot;&gt;slide 34&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;f&quot; style=&quot;font-size:1.05rem;background:var(--paper)&quot;&gt;Wait time + Throughput time&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Manufacturing cycle efficiency&lt;/h4&gt;&lt;p&gt;L&#x27;MCE dice quanta parte del throughput time è lavoro vero. Massimo 1. &lt;span class=&quot;src&quot;&gt;slide 35&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;f&quot; style=&quot;font-size:1.05rem;background:var(--paper)&quot;&gt;Value-added time ÷ Throughput time&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;p&gt;Le quattro componenti: &lt;b&gt;process&lt;/b&gt;, lavoro effettivo; &lt;b&gt;inspection&lt;/b&gt;, controllo che il prodotto non sia difettoso; &lt;b&gt;move&lt;/b&gt;, trasporto di materiali o semilavorati fra le workstations (postazioni); &lt;b&gt;queue&lt;/b&gt;, attesa di essere lavorato, spostato, ispezionato o spedito. Il &lt;b&gt;wait time&lt;/b&gt; va dalla ricezione dell&#x27;ordine all&#x27;inizio della produzione. Non aggiunge valore. &lt;span class=&quot;src&quot;&gt;slide 33 e 34&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Un MCE di 0,5 significa che metà del tempo di produzione se ne va in ispezioni, spostamenti e attese. In molte aziende manifatturiere l&#x27;MCE è &lt;b&gt;sotto 0,10&lt;/b&gt;: oltre il 90% del tempo in lavorazione non aggiunge valore. Chi taglia drasticamente wait time e parti non-value-added può alzare insieme customer satisfaction e profit. &lt;span class=&quot;src&quot;&gt;slide 34 e 35&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;note warn read&quot;&gt;&lt;p&gt;&lt;b&gt;Trappola d&#x27;esame.&lt;/b&gt; Il wait time entra nel delivery cycle time, ma &lt;b&gt;non&lt;/b&gt; nel throughput time e quindi non nell&#x27;MCE. Ridurre il wait migliora ciò che vive il cliente e lascia l&#x27;MCE invariato.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3&gt;Esercizio svolto&lt;/h3&gt;
&lt;p&gt;Wait 9 giorni, process 2, inspection 0,4, move 0,6, queue 5. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;steps&quot; data-steps&gt;&lt;ol&gt;
&lt;li&gt;&lt;b&gt;Throughput time&lt;/b&gt; = 2 + 0,4 + 0,6 + 5 = &lt;b&gt;8 giorni&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Delivery cycle time&lt;/b&gt; = 9 + 8 = &lt;b&gt;17 giorni&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;MCE&lt;/b&gt; = 2 ÷ 8 = &lt;b&gt;0,25&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Lettura&lt;/b&gt;: il 75% del throughput time non aggiunge valore. Il blocco più lungo è il wait, poi la queue: partire da lì rende più che accelerare il process.&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Process 1 giorno, inspection 0,5, move 0,5, queue 3, wait 5. Calcola i tre valori.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Throughput = 1 + 0,5 + 0,5 + 3 = &lt;b&gt;5 giorni&lt;/b&gt;. Delivery cycle = 5 + 5 = &lt;b&gt;10 giorni&lt;/b&gt;. MCE = 1 ÷ 5 = &lt;b&gt;0,20&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;L&#x27;azienda elimina il wait time. Che cosa cambia?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Scende il delivery cycle time, mentre throughput time e MCE restano uguali.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;L&#x27;MCE può arrivare a 1? Che cosa significherebbe?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sì in teoria: significherebbe nessun tempo di inspection, move o queue. Ogni tempo non-value-added lo tiene sotto 1 (slide 35).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;L&#x27;inspection serve alla qualità: perché è non-value-added?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché non trasforma il prodotto: controlla soltanto. È coerente con la sezione V: se si previene alla fonte c&#x27;è meno da ispezionare (slide 27 e 32).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-ar&quot; id=&quot;s8&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Sezione VIII&lt;/span&gt;&lt;h2&gt;Overall equipment effectiveness&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slide 36–38. Tre modi in cui una macchina può deludere.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;p&gt;L&#x27;&lt;b&gt;overall equipment effectiveness&lt;/b&gt; (OEE, efficacia complessiva dell&#x27;impianto) misura la produttività di un macchinario su tre dimensioni. È molto usata dai lean manufacturers, i produttori che puntano a eliminare gli sprechi. Obiettivo: ↑. &lt;span class=&quot;src&quot;&gt;slide 37&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Utilisation&lt;/h4&gt;&lt;p&gt;La macchina gira quando potrebbe? Breakdowns (guasti) e long setups (attrezzaggi lunghi) la lasciano ferma.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Actual run time ÷ Machine time available&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Efficiency&lt;/h4&gt;&lt;p&gt;Quando gira, va a piena velocità? Le minor stoppages (micro-fermate) la rallentano.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Actual run rate ÷ Ideal run rate&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Quality&lt;/h4&gt;&lt;p&gt;Di ciò che produce, quanto è senza difetti?&lt;/p&gt;&lt;p&gt;&lt;b&gt;Defect free output ÷ Total output&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;f&quot;&gt;OEE = Utilisation rate × Efficiency rate × Quality rate&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;label class=&quot;sl-r&quot; for=&quot;oee-u&quot;&gt;&lt;span&gt;Utilisation&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;oee-u&quot; min=&quot;10&quot; max=&quot;100&quot; value=&quot;90&quot;&gt;&lt;output id=&quot;ov-u&quot; for=&quot;oee-u&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;sl-r&quot; for=&quot;oee-e&quot;&gt;&lt;span&gt;Efficiency&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;oee-e&quot; min=&quot;10&quot; max=&quot;100&quot; value=&quot;90&quot;&gt;&lt;output id=&quot;ov-e&quot; for=&quot;oee-e&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;sl-r&quot; for=&quot;oee-q&quot;&gt;&lt;span&gt;Quality&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;oee-q&quot; min=&quot;10&quot; max=&quot;100&quot; value=&quot;90&quot;&gt;&lt;output id=&quot;ov-q&quot; for=&quot;oee-q&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;nx&quot; data-oee=&quot;90,90,90&quot;&gt;90 / 90 / 90&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;nx&quot; data-oee=&quot;60,100,100&quot;&gt;60 / 100 / 100&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;nx&quot; data-oee=&quot;83,90,95&quot;&gt;83 / 90 / 95&lt;/button&gt;&lt;/div&gt;
&lt;svg class=&quot;narrow&quot; viewBox=&quot;0 0 460 236&quot; role=&quot;img&quot; aria-label=&quot;Quattro barre: tempo disponibile al 100%, poi ciò che resta dopo utilisation, efficiency e quality&quot; style=&quot;margin-top:.7rem&quot;&gt;
&lt;path class=&quot;ln&quot; d=&quot;M15 205H445&quot;/&gt;
&lt;rect id=&quot;b0&quot; x=&quot;30&quot; width=&quot;80&quot; fill=&quot;var(--seg-wait)&quot;/&gt;&lt;rect id=&quot;b1&quot; x=&quot;140&quot; width=&quot;80&quot; fill=&quot;oklch(66% .09 250)&quot;/&gt;&lt;rect id=&quot;b2&quot; x=&quot;250&quot; width=&quot;80&quot; fill=&quot;oklch(54% .1 250)&quot;/&gt;&lt;rect id=&quot;b3&quot; x=&quot;360&quot; width=&quot;80&quot; fill=&quot;oklch(42% .1 250)&quot;/&gt;
&lt;text id=&quot;v0&quot; class=&quot;t tc num&quot; x=&quot;70&quot;&gt;&lt;/text&gt;&lt;text id=&quot;v1&quot; class=&quot;t tc num&quot; x=&quot;180&quot;&gt;&lt;/text&gt;&lt;text id=&quot;v2&quot; class=&quot;t tc num&quot; x=&quot;290&quot;&gt;&lt;/text&gt;&lt;text id=&quot;v3&quot; class=&quot;t tc num&quot; x=&quot;400&quot;&gt;&lt;/text&gt;
&lt;text class=&quot;ts tc&quot; x=&quot;70&quot; y=&quot;224&quot;&gt;Time available&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;180&quot; y=&quot;224&quot;&gt;× Utilisation&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;290&quot; y=&quot;224&quot;&gt;× Efficiency&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;400&quot; y=&quot;224&quot;&gt;× Quality = OEE&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;ko&quot;&gt;&lt;div&gt;&lt;b id=&quot;k-oee&quot;&gt;&lt;/b&gt;&lt;span&gt;OEE&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;k-weak&quot; style=&quot;font-size:1.2rem&quot;&gt;&lt;/b&gt;&lt;span&gt;Rate più debole&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;out&quot; id=&quot;oee-msg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;figcaption&gt;Con tre rates al 90% l&#x27;OEE è 72,9%: la slide 38 lo arrotonda a 73%.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;note warn read&quot;&gt;&lt;p&gt;&lt;b&gt;Una precisazione.&lt;/b&gt; La slide 38 dice che l&#x27;OEE è &lt;i&gt;always smaller&lt;/i&gt; della rate più debole. A rigore è minore &lt;b&gt;o uguale&lt;/b&gt;: con 60 / 100 / 100 l&#x27;OEE è 60%. Provalo col secondo pulsante.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3&gt;Dai dati grezzi all&#x27;OEE&lt;/h3&gt;
&lt;p&gt;Turno di 480 minuti. La macchina gira 400 minuti. Velocità ideale 1 pezzo al minuto, reale 0,9. Prodotti 360 pezzi, di cui 342 senza difetti. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;steps&quot; data-steps&gt;&lt;ol&gt;
&lt;li&gt;&lt;b&gt;Utilisation&lt;/b&gt; = 400 ÷ 480 = 0,833.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Efficiency&lt;/b&gt; = 0,9 ÷ 1 = 0,90.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Quality&lt;/b&gt; = 342 ÷ 360 = 0,95.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;OEE&lt;/b&gt; = 0,833 × 0,90 × 0,95 = &lt;b&gt;0,7125&lt;/b&gt;, cioè 71,25%.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Controllo&lt;/b&gt;: in 480 minuti la macchina ideale farebbe 480 pezzi buoni. Ne ha fatti 342, e 342 ÷ 480 = 71,25%. L&#x27;OEE è la quota di output buono rispetto al massimo teorico.&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;note ext read&quot;&gt;&lt;span class=&quot;tag e&quot;&gt;fonte esterna&lt;/span&gt;&lt;p&gt;L&#x27;OEE è legato a Seiichi Nakajima e alla Total Productive Maintenance (TPM). Fuori dal corso le stesse tre componenti si chiamano spesso availability, performance e quality. Il valore “world class” che si cita spesso è 85% (90% × 95% × 99%), ma la stessa letteratura avverte che l&#x27;OEE non è valido per confrontare impianti diversi. &lt;a href=&quot;https://mdpi.com/2076-3417/10/18/6469/htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Rassegna in Applied Sciences, 2020&lt;/a&gt; · &lt;a href=&quot;https://www.emerson.com/is/content/emerson/en/corporate/shared-assets/documents/introduction-to-overall-equipment-effectiveness.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Introduzione di Emerson (PDF)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Utilisation 80%, efficiency 75%, quality 100%. Quanto vale l&#x27;OEE?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;0,80 × 0,75 × 1 = &lt;b&gt;60%&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un lungo setup a quale rate pesa? E una serie di micro-fermate?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il setup pesa sulla &lt;b&gt;utilisation&lt;/b&gt;, le micro-fermate sulla &lt;b&gt;efficiency&lt;/b&gt; (slide 37).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché tre rates “buone” danno un OEE deludente?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché si moltiplicano: ogni perdita agisce su ciò che resta dopo le altre. Tre rates al 90% danno 0,9 × 0,9 × 0,9 = 72,9% (slide 38).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è fra MCE e OEE?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;L&#x27;MCE misura il tempo di un&#x27;unità lungo tutto il processo, l&#x27;OEE la produttività di un singolo macchinario. Sono misure della perspective internal processes (slide 17).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-ma&quot; id=&quot;s9&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Sezione IX&lt;/span&gt;&lt;h2&gt;Building a scorecard&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slide 39–41. Si definisce la strategy, la si traduce in misure, si collegano le misure con causa ed effetto.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Four steps&lt;/h3&gt;
&lt;div class=&quot;steps&quot; data-steps&gt;&lt;ol&gt;
&lt;li&gt;&lt;b&gt;Define the strategy.&lt;/b&gt; Si nominano i target customers (i clienti a cui ci si rivolge) e la value proposition.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Choose measures.&lt;/b&gt; Poche per perspective, ciascuna con una direzione.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Link them in a strategy map.&lt;/b&gt; Si disegnano le arrows e si scrive ciascuna come if/then statement.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Test and reward.&lt;/b&gt; Si raccolgono i dati, si controllano i link e solo più tardi si lega la retribuzione alle misure.&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;Slide 40.&lt;/p&gt;
&lt;h3&gt;Una stessa azienda, tre scorecard&lt;/h3&gt;
&lt;p&gt;Un produttore di biciclette inventato. Le measures vengono dalle slide 16–23. Objectives, target e initiatives sono esempi. Cambiando value proposition cambia quasi tutto. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Scorecard per value proposition&quot;&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Product leadership&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Operational excellence&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Customer intimacy&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;div data-sc=&quot;0&quot; class=&quot;tw&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;&lt;p class=&quot;next&quot; style=&quot;margin-top:.8rem&quot;&gt;&lt;b&gt;If/then:&lt;/b&gt; se le training hours ↑, allora i defects ↓; se i defects ↓ e i new products ↑, allora il market share ↑; se il market share ↑, allora il sales growth rate ↑.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;div data-sc=&quot;1&quot; class=&quot;tw&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;&lt;p class=&quot;next&quot; style=&quot;margin-top:.8rem&quot;&gt;&lt;b&gt;If/then:&lt;/b&gt; se gli improvement suggestions ↑, allora il waste ↓; se il delivery cycle time ↓, allora gli orders on time ↑; se gli orders on time ↑ e il cost per unit ↓, allora il net operating income ↑.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;div data-sc=&quot;2&quot; class=&quot;tw&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;&lt;p class=&quot;next&quot; style=&quot;margin-top:.8rem&quot;&gt;&lt;b&gt;If/then:&lt;/b&gt; se l&#x27;employee turnover ↓, allora i complaints solved at first contact ↑; se questi ↑, allora il defection rate ↓; se il defection rate ↓ e lo share of wallet ↑, allora il contribution margin ↑.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3&gt;Che cosa rende buono un if/then statement&lt;/h3&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;--tint:var(--acc-t)&quot;&gt;&lt;h4&gt;Weak&lt;/h4&gt;&lt;p class=&quot;quote&quot; style=&quot;margin:.2rem 0 .5rem;font-size:1.2rem;color:inherit&quot;&gt;“If employees are happier, the company will do better”.&lt;/p&gt;&lt;p&gt;Nessuno dei due lati è una misura, non c&#x27;è direzione, non si può verificare nulla.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Strong&lt;/h4&gt;&lt;p class=&quot;quote&quot; style=&quot;margin:.2rem 0 .5rem;font-size:1.2rem;color:inherit&quot;&gt;“If employee turnover ↓, then the number of warranty claims ↓”.&lt;/p&gt;&lt;p&gt;Due misure nominate, una direzione per ciascuna, un meccanismo spiegabile: il personale esperto sbaglia meno.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;p&gt;&lt;b&gt;Checklist&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;slide 41&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Due measures specifiche.&lt;/li&gt;&lt;li&gt;Una direzione per ciascuna.&lt;/li&gt;&lt;li&gt;Di solito da una perspective alla successiva.&lt;/li&gt;&lt;li&gt;Una ragione plausibile.&lt;/li&gt;&lt;li&gt;Dati che si possono davvero raccogliere.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3&gt;Usare la scorecard per valutare la strategy&lt;/h3&gt;&lt;p&gt;È l&#x27;ultimo learning objective. Indica che cosa si muove e leggi dove si rompe la chain. &lt;span class=&quot;tag i&quot;&gt;lo strumento è un&#x27;integrazione, i criteri vengono dalle slide citate&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;div class=&quot;diag&quot; id=&quot;diag&quot; role=&quot;group&quot; aria-label=&quot;Quali livelli migliorano&quot;&gt;
&lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;&lt;b&gt;Financial&lt;/b&gt;&lt;span&gt;&lt;/span&gt;&lt;/button&gt;
&lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;&lt;b&gt;Customer&lt;/b&gt;&lt;span&gt;&lt;/span&gt;&lt;/button&gt;
&lt;button type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;&lt;b&gt;Internal processes&lt;/b&gt;&lt;span&gt;&lt;/span&gt;&lt;/button&gt;
&lt;button type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;&lt;b&gt;Learning and growth&lt;/b&gt;&lt;span&gt;&lt;/span&gt;&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;out&quot; id=&quot;diag-o&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/figure&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Autoverifica: weak o strong?&lt;/h3&gt;
&lt;div class=&quot;sorter&quot; data-opts=&quot;Weak|Strong&quot;&gt;
&lt;p class=&quot;score&quot;&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li data-a=&quot;1&quot; data-w=&quot;Due misure, due direzioni, meccanismo chiaro (slide 13).&quot;&gt;If training hours per employee ↑, then errors per order ↓&lt;/li&gt;
&lt;li data-a=&quot;0&quot; data-w=&quot;“Quality” e “love” non sono misure e non si possono verificare (slide 41).&quot;&gt;If we care about quality, customers will love us&lt;/li&gt;
&lt;li data-a=&quot;1&quot; data-w=&quot;Da processes a customer, misure raccoglibili, ragione plausibile.&quot;&gt;If delivery cycle time ↓, then customer defection rate ↓&lt;/li&gt;
&lt;li data-a=&quot;0&quot; data-w=&quot;Le misure ci sono, ma salta due perspectives e il meccanismo è vago. La checklist vuole di solito un passo alla volta.&quot;&gt;If training hours per employee ↑, then earnings per share ↑&lt;/li&gt;
&lt;li data-a=&quot;0&quot; data-w=&quot;Il morale non è specificato come misura e “the strategy works” non è verificabile.&quot;&gt;If morale rises, the strategy will work&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-ma&quot; id=&quot;s10&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Sezione X&lt;/span&gt;&lt;h2&gt;Using the scorecard&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slide 42–45. Il legame con la retribuzione, e gli altri stakeholders.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Tie pay to the scorecard, but not on day one&lt;/h3&gt;
&lt;p&gt;I bonus possono, e probabilmente devono, essere legati alle misure della scorecard: altrimenti è facile che vengano ignorate. Però solo dopo che l&#x27;organizzazione è stata gestita con la scorecard per un certo tempo, &lt;b&gt;perhaps a year or more&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 43&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 420 96&quot; role=&quot;img&quot; aria-label=&quot;Linea del tempo: dal primo giorno si gestisce con la scorecard senza bonus; dopo circa un anno o più si legano i bonus&quot;&gt;
&lt;rect class=&quot;n&quot; x=&quot;6&quot; y=&quot;30&quot; width=&quot;260&quot; height=&quot;30&quot; fill=&quot;var(--tint)&quot;/&gt;&lt;rect x=&quot;266&quot; y=&quot;30&quot; width=&quot;148&quot; height=&quot;30&quot; fill=&quot;var(--c)&quot;/&gt;
&lt;text class=&quot;ts tc&quot; x=&quot;136&quot; y=&quot;50&quot; style=&quot;fill:var(--ink)&quot;&gt;si gestisce e si testano i link&lt;/text&gt;
&lt;text class=&quot;ts tc&quot; x=&quot;340&quot; y=&quot;50&quot; style=&quot;fill:var(--on)&quot;&gt;bonus legati&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;6&quot; y=&quot;20&quot;&gt;day one&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;266&quot; y=&quot;20&quot;&gt;perhaps a year or more&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;6&quot; y=&quot;82&quot;&gt;prima: reliable? sensible? understood? not manipulable?&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;read&quot;&gt;&lt;p&gt;Prima bisogna essere sicuri che le misure siano: &lt;b&gt;reliable&lt;/b&gt; (affidabili), &lt;b&gt;sensible&lt;/b&gt; (sensate), &lt;b&gt;understood&lt;/b&gt; dalle persone valutate, &lt;b&gt;not easily manipulated&lt;/b&gt; (non facili da manipolare). &lt;span class=&quot;src&quot;&gt;slide 43&lt;/span&gt;&lt;/p&gt;
&lt;h3&gt;Beyond shareholders&lt;/h3&gt;
&lt;p&gt;Le aziende devono dare risultati finanziari agli shareholders, ma sono responsabili anche verso altri &lt;b&gt;stakeholders&lt;/b&gt;, i portatori di interesse legati alla loro performance. La &lt;b&gt;corporate social responsibility&lt;/b&gt; (CSR, responsabilità sociale d&#x27;impresa) significa considerare i bisogni di tutti gli stakeholders nelle decisioni. Va oltre il rispetto della legge e include azioni volontarie. &lt;span class=&quot;src&quot;&gt;slide 44&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;figure class=&quot;fig narrow&quot;&gt;
&lt;svg viewBox=&quot;0 0 420 256&quot; role=&quot;img&quot; aria-label=&quot;L&#x27;azienda al centro, collegata a shareholders, customers, employees, suppliers, communities, environmental advocates e human rights advocates&quot;&gt;
&lt;path class=&quot;ln&quot; d=&quot;M210 160V40M210 160L152 87M210 160L152 157M210 160L152 227M210 160L268 87M210 160L268 157M210 160L268 227&quot;/&gt;
&lt;g class=&quot;n&quot;&gt;&lt;rect x=&quot;135&quot; y=&quot;6&quot; width=&quot;150&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;210&quot; y=&quot;28&quot; style=&quot;font-size:12.5px&quot;&gt;Shareholders&lt;/text&gt;
&lt;rect x=&quot;2&quot; y=&quot;70&quot; width=&quot;150&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;77&quot; y=&quot;92&quot; style=&quot;font-size:12.5px&quot;&gt;Customers&lt;/text&gt;
&lt;rect x=&quot;2&quot; y=&quot;140&quot; width=&quot;150&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;77&quot; y=&quot;162&quot; style=&quot;font-size:12.5px&quot;&gt;Employees&lt;/text&gt;
&lt;rect x=&quot;2&quot; y=&quot;210&quot; width=&quot;150&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;77&quot; y=&quot;232&quot; style=&quot;font-size:12.5px&quot;&gt;Suppliers&lt;/text&gt;
&lt;rect x=&quot;268&quot; y=&quot;70&quot; width=&quot;150&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;343&quot; y=&quot;92&quot; style=&quot;font-size:12.5px&quot;&gt;Communities&lt;/text&gt;
&lt;rect x=&quot;268&quot; y=&quot;140&quot; width=&quot;150&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;343&quot; y=&quot;162&quot; style=&quot;font-size:11.5px&quot;&gt;Environmental advocates&lt;/text&gt;
&lt;rect x=&quot;268&quot; y=&quot;210&quot; width=&quot;150&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;343&quot; y=&quot;232&quot; style=&quot;font-size:11.5px&quot;&gt;Human rights advocates&lt;/text&gt;&lt;/g&gt;
&lt;circle cx=&quot;210&quot; cy=&quot;160&quot; r=&quot;42&quot; fill=&quot;var(--c)&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;210&quot; y=&quot;165&quot; style=&quot;fill:var(--on);font-size:13px&quot;&gt;Company&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3&gt;Tre modi di portare la CSR nella scorecard&lt;/h3&gt;&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Formati CSR&quot;&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Inside the four boxes&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;A fifth perspective&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;A separate scorecard&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Si aggiungono misure sociali e ambientali alle perspectives esistenti.&lt;/p&gt;
&lt;svg class=&quot;narrow&quot; viewBox=&quot;0 0 300 50&quot; aria-hidden=&quot;true&quot;&gt;&lt;g fill=&quot;var(--tint2)&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;5&quot; width=&quot;70&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;76&quot; y=&quot;5&quot; width=&quot;70&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;152&quot; y=&quot;5&quot; width=&quot;70&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;228&quot; y=&quot;5&quot; width=&quot;70&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;/g&gt;&lt;g fill=&quot;var(--c)&quot;&gt;&lt;circle cx=&quot;35&quot; cy=&quot;25&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;111&quot; cy=&quot;25&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;187&quot; cy=&quot;25&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;263&quot; cy=&quot;25&quot; r=&quot;6&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Si aggiunge una categoria dedicata a un insieme più ampio di stakeholders.&lt;/p&gt;
&lt;svg class=&quot;narrow&quot; viewBox=&quot;0 0 300 50&quot; aria-hidden=&quot;true&quot;&gt;&lt;g fill=&quot;var(--tint2)&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;5&quot; width=&quot;54&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;60&quot; y=&quot;5&quot; width=&quot;54&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;120&quot; y=&quot;5&quot; width=&quot;54&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;180&quot; y=&quot;5&quot; width=&quot;54&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;/g&gt;&lt;rect x=&quot;240&quot; y=&quot;5&quot; width=&quot;58&quot; height=&quot;40&quot; rx=&quot;4&quot; fill=&quot;var(--c)&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Si costruisce una scorecard dedicata alla performance sociale e ambientale dell&#x27;azienda o dei suoi suppliers.&lt;/p&gt;
&lt;svg class=&quot;narrow&quot; viewBox=&quot;0 0 300 50&quot; aria-hidden=&quot;true&quot;&gt;&lt;g fill=&quot;var(--tint2)&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;34&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;68&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;102&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;/g&gt;&lt;g fill=&quot;var(--c)&quot;&gt;&lt;rect x=&quot;168&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;202&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;236&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;270&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;p&gt;Qualunque sia il formato, valgono due regole: collegare le misure con if/then statements e legarle a come i senior manager vengono valutati e premiati. &lt;b&gt;Otherwise a proclaimed commitment may not lead to action&lt;/b&gt;: altrimenti l&#x27;impegno dichiarato può restare una dichiarazione. &lt;span class=&quot;src&quot;&gt;slide 45&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;note ext read&quot;&gt;&lt;span class=&quot;tag e&quot;&gt;fonte esterna&lt;/span&gt;&lt;p&gt;La Commissione europea definisce la CSR come “the responsibility of enterprises for their impacts on society”: è un&#x27;impostazione più ampia del solo volontariato. &lt;a href=&quot;https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=celex%3A52011DC0681&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;COM(2011) 681&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché non legare subito i bonus alla scorecard?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché prima bisogna sapere se le misure sono reliable, sensible, understood e not easily manipulated. Altrimenti si premia il numero sbagliato (slide 43).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;E perché legarli comunque, prima o poi?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché altrimenti le misure rischiano di essere ignorate (slide 43).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa distingue la CSR dalla compliance?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;La compliance è il rispetto della legge. La CSR va oltre e include azioni volontarie, considerando tutti gli stakeholders (slide 44).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un&#x27;azienda aggiunge “CO₂ per unit ↓” alla perspective internal processes. Quale formato è? Che cosa manca perché funzioni?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;È &lt;i&gt;inside the four boxes&lt;/i&gt;. Mancano un if/then statement che colleghi la misura e un legame con la valutazione dei senior manager (slide 45).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-te&quot; id=&quot;formule&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Da ripassare&lt;/span&gt;&lt;h2&gt;Tutte le formule&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Misura&lt;/th&gt;&lt;th&gt;Formula&lt;/th&gt;&lt;th&gt;Obiettivo&lt;/th&gt;&lt;th&gt;Origine&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Cost of quality&lt;/td&gt;&lt;td&gt;Prevention + Appraisal + Internal failure + External failure&lt;/td&gt;&lt;td&gt;↓&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 26&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Throughput time&lt;/td&gt;&lt;td&gt;Process + Inspection + Move + Queue&lt;/td&gt;&lt;td&gt;↓&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 33&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Delivery cycle time&lt;/td&gt;&lt;td&gt;Wait time + Throughput time&lt;/td&gt;&lt;td&gt;↓&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 34&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;MCE&lt;/td&gt;&lt;td&gt;Value-added time (process time) ÷ Throughput time&lt;/td&gt;&lt;td&gt;↑, max 1&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 35&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Utilisation rate&lt;/td&gt;&lt;td&gt;Actual run time ÷ Machine time available&lt;/td&gt;&lt;td&gt;↑&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 38&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Efficiency rate&lt;/td&gt;&lt;td&gt;Actual run rate ÷ Ideal run rate&lt;/td&gt;&lt;td&gt;↑&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 38&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Quality rate&lt;/td&gt;&lt;td&gt;Defect free output ÷ Total output&lt;/td&gt;&lt;td&gt;↑&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 38&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;OEE&lt;/td&gt;&lt;td&gt;Utilisation rate × Efficiency rate × Quality rate&lt;/td&gt;&lt;td&gt;↑&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 38&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Residual income&lt;/td&gt;&lt;td&gt;Net operating income − (Average operating assets × Minimum required rate of return)&lt;/td&gt;&lt;td&gt;↑&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;ROA · ROE&lt;/td&gt;&lt;td&gt;Net income ÷ Average total assets · Net income ÷ Average equity&lt;/td&gt;&lt;td&gt;↑&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EPS · P/E&lt;/td&gt;&lt;td&gt;Net income ÷ Numero di azioni · Prezzo dell&#x27;azione ÷ EPS&lt;/td&gt;&lt;td&gt;↑&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;

&lt;p class=&quot;cap&quot;&gt;Le formule segnate come integrazione sono definizioni usuali, senza fonte nelle slide. Verifica le varianti sul testo del corso.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part h-te&quot; id=&quot;fonti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fine lezione&lt;/span&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;p&gt;&lt;b&gt;Le slide citano una sola fonte esplicita&lt;/b&gt;, Treacy e Wiersema. Gli altri titoli non sono nelle slide: li ho cercati perché trattano le idee della lezione. Tutta questa sezione è &lt;span class=&quot;tag e&quot;&gt;fonte esterna&lt;/span&gt;. Le ricerche hanno restituito schede e sintesi, non i testi integrali, quindi le descrizioni qui sotto vanno verificate sull&#x27;originale.&lt;/p&gt;
&lt;/div&gt;
&lt;h3&gt;Citata nelle slide&lt;/h3&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Treacy e Wiersema, “Customer Intimacy and Other Value Disciplines”&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;Harvard Business Review, gennaio–febbraio 1993, vol. 71 n. 1, pp. 84–93. Citato alla slide 9.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; uno studio su oltre 40 aziende. Leader come Dell, Home Depot e Nike restringono il focus su una delle tre value disciplines. L&#x27;idea è stata poi ampliata nel libro &lt;i&gt;The Discipline of Market Leaders&lt;/i&gt; (1995).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;origine delle tre value propositions da cui parte tutta la scorecard.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://hbr.org/1993/01/customer-intimacy-and-other-value-disciplines&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina dell&#x27;articolo su HBR&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Non citate nelle slide: origine dei concetti&lt;/h3&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Kaplan e Norton, “The Balanced Scorecard: Measures That Drive Performance”&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;Harvard Business Review, gennaio–febbraio 1992, pp. 71–79. Ripubblicato nel 2005.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; misure finanziarie affiancate da tre gruppi di misure operative. La quarta perspective qui si chiama ancora “innovation and learning”.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;articolo che ha lanciato lo strumento (sezioni I e II).&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://hbr.org/2005/07/the-balanced-scorecard-measures-that-drive-performance&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Ristampa su HBR&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Kaplan e Norton, “Having Trouble with Your Strategy? Then Map It”&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;Harvard Business Review, settembre 2000. Poi il libro &lt;i&gt;Strategy Maps&lt;/i&gt; (2004).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; l&#x27;adattamento della scorecard in strategy map, con il caso Mobil North American Marketing and Refining.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; approfondisce la slide 14.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://store.hbr.org/product/having-trouble-with-your-strategy-then-map-it/R00509&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda su HBR Store&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Ittner e Larcker, “Coming Up Short on Nonfinancial Performance Measurement”&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;Harvard Business Review, 2003, vol. 81 n. 11, pp. 88–95. Il link porta a una sintesi di terzi.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; secondo la sintesi, solo il 23% delle aziende studiate aveva costruito e verificato modelli causali della performance, e queste avevano in media un ROA più alto.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; dà sostanza all&#x27;idea che ogni arrow vada testata (slide 13 e 40).&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumIttnerLarcker03.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sintesi su Management And Accounting Web&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Nørreklit, “The balance on the balanced scorecard: a critical analysis of some of its assumptions”&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;Management Accounting Research, 2000, vol. 11 n. 1, pp. 65–88.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; un esame critico degli assunti dello strumento. Altri autori lo citano per la tesi che le relazioni fra perspectives non siano causali. Non ho letto il testo integrale.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è il contrappeso alla chain presentata come causa ed effetto, utile per una discussione critica.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://doi.org/10.1006/mare.1999.0121&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI dell&#x27;articolo&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;ASQ, “Cost of Quality”&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;American Society for Quality, pagina di riferimento.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; definizioni ed esempi delle quattro categorie.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; utile per classificare le voci di un quality cost report (sezioni V e VI).&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.asq.org/quality-resources/cost-of-quality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina ASQ&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;OEE: rassegna della letteratura e ISO 22400-2&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;Applied Sciences 2020, 10(18), 6469. ISO 22400-2:2014, in revisione.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; la rassegna confronta i diversi approcci all&#x27;OEE, le cui origini sono legate a Nakajima e alla TPM; le fonti non concordano sulla data esatta. La norma ISO elenca KPI di produzione con formule e unità di misura.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; l&#x27;OEE non ha una sola definizione: una ricerca di Schiraldi e Varisco segnala divergenze fra le versioni ISO e la formulazione di Nakajima. Per l&#x27;esame usa quella della slide 38.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://mdpi.com/2076-3417/10/18/6469/htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Rassegna su MDPI&lt;/a&gt; · &lt;a href=&quot;https://www.iso.org/standard/54497.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ISO 22400-2&lt;/a&gt; · &lt;a href=&quot;https://art.torvergata.it/handle/2108/280082&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Schiraldi e Varisco&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Commissione europea, COM(2011) 681&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;“A renewed EU strategy 2011-14 for Corporate Social Responsibility”, 25 ottobre 2011. Disponibile anche in italiano.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; la definizione di CSR come responsabilità delle imprese per i loro impatti sulla società, e il rimando ai quadri internazionali. La strategia copre il periodo 2011–14: è un riferimento storico, non il quadro normativo attuale.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; mostra una definizione istituzionale da confrontare con quella della slide 44.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=celex%3A52011DC0681&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex (inglese)&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/LexUriServ/LexUriServ.do?uri=COM%3A2011%3A0681%3AFIN%3AIT%3APDF&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF in italiano&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;ISO 26000:2010, Guidance on social responsibility&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;International Organization for Standardization.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; linee guida su concetti e temi centrali della responsabilità sociale. Non contiene requisiti e non è certificabile.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è un riferimento per scegliere le misure CSR da mettere in scorecard (slide 45).&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.iso.org/standard/42546.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina ISO&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Altri materiali del corso&lt;/h3&gt;
&lt;div class=&quot;note int read&quot;&gt;&lt;p&gt;Tutto il riassunto viene dal file &lt;i&gt;CLEAN SMA26-27 Balanced Scorecard.pdf&lt;/i&gt;. In &lt;i&gt;corso/&lt;/i&gt; esistono anche le cartelle &lt;i&gt;Budgeting&lt;/i&gt; e &lt;i&gt;Activity-Based Costing&lt;/i&gt;, ma non sono riuscito ad aprirne i file. Nulla qui viene da lì, e possono esserci altri materiali, come programma o esercizi, che non ho visto. I collegamenti con le altre lezioni restano quindi da fare.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;
&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;&lt;/div&gt;&lt;/footer&gt;
