&lt;p class=&quot;eyebrow&quot;&gt;Strategic Management Accounting · A.Y. 2026/2027&lt;br&gt;Rocco Frondizi · Università degli Studi di Bergamo&lt;/p&gt;
&lt;h1&gt;The Balanced Scorecard&lt;/h1&gt;
&lt;p class=&quot;lede&quot;&gt;Il profit dice com&#x27;è andata, non perché né come andrà. La balanced scorecard parte dalla strategia, sceglie poche misure collegate tra loro da causa ed effetto e controlla se la strategia funziona davvero.&lt;/p&gt;
&lt;p&gt;La mappa mostra come si legano i dieci argomenti della lezione. Ogni riquadro porta alla sua sezione. I colori distinguono le quattro parti: fondamenta, perspectives, misure di processo, uso pratico.&lt;/p&gt;

&lt;li&gt;&lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt; spiegazione, formula o esempio inventato aggiunto da Claude per chiarire: non è nelle slide.&lt;/li&gt;

&lt;section class=&quot;part h-sa&quot; id=&quot;s1&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Sezione I&lt;/span&gt;&lt;h2&gt;Strategy comes first&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slide 3–9. Prima la strategia, poi le misure.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;h3 style=&quot;margin-top:0&quot;&gt;Perché il profit non basta&lt;/h3&gt;
&lt;p&gt;Il profit (utile) resta il test finale, ma da solo guida male chi deve decidere. Le slide danno tre motivi. &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;It arrives late&lt;/h4&gt;&lt;p&gt;Racconta il trimestre scorso. Quando cala, le cause sono avvenute mesi prima.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;It does not say why&lt;/h4&gt;&lt;p&gt;Un margine più basso può venire da difetti, consegne lente, clienti persi o personale non formato. Il numero non dice quale.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;It can be managed&lt;/h4&gt;&lt;p&gt;Tagliare training (formazione) o maintenance (manutenzione) alza il profit di quest&#x27;anno e danneggia l&#x27;azienda l&#x27;anno prossimo.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;p&gt;Serve quindi qualcosa che mostri cosa succede &lt;b&gt;prima&lt;/b&gt; che i soldi si muovano. Da qui i due motivi per usare &lt;b&gt;non-financial measures&lt;/b&gt;, misure non monetarie. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card line&quot;&gt;&lt;h4&gt;1. Colgono i cambiamenti di fondo&lt;/h4&gt;&lt;p&gt;Gli indicatori operativi misurano i cambiamenti reali che l&#x27;azienda sta facendo. Le misure finanziarie riassumono azioni passate.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line&quot;&gt;&lt;h4&gt;2. Si capiscono e si influenzano&lt;/h4&gt;&lt;p&gt;I top manager rispondono delle misure finanziarie, i livelli più bassi molto meno. Un warehouse supervisor (responsabile di magazzino) non può muovere il return on equity (il rendimento del capitale proprio), ma può muovere la percentuale di ordini spediti in tempo.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;h3&gt;Leading e lagging indicators&lt;/h3&gt;
&lt;p&gt;Un &lt;b&gt;lagging indicator&lt;/b&gt; (indicatore in ritardo) registra un esito già avvenuto: profit, sales (vendite), market share (quota di mercato). Un &lt;b&gt;leading indicator&lt;/b&gt; (indicatore anticipatore) si muove prima e aiuta a prevedere l&#x27;esito: training hours (ore di formazione), defect rates (tassi di difetto), delivery times (tempi di consegna). Una buona scorecard li mescola: si agisce sui driver, le leve che producono il risultato, e si controlla il risultato. &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;figure class=&quot;fig&quot; id=&quot;ll&quot;&gt;
&lt;div class=&quot;chips&quot;&gt;&lt;span&gt;Training hours&lt;/span&gt;&lt;em&gt;→&lt;/em&gt;&lt;span&gt;Errors per order&lt;/span&gt;&lt;em&gt;→&lt;/em&gt;&lt;span&gt;Customer satisfaction&lt;/span&gt;&lt;em&gt;→&lt;/em&gt;&lt;span&gt;Repeat purchases&lt;/span&gt;&lt;em&gt;→&lt;/em&gt;&lt;span&gt;Profit&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot; role=&quot;group&quot; aria-label=&quot;Scegli l&#x27;anello della catena&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;tog&quot;&gt;Anello 1&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;tog&quot;&gt;Anello 2&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;tog&quot;&gt;Anello 3&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;tog&quot;&gt;Anello 4&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;out&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Scorri gli anelli: colore pieno è il leading, colore tenue è il lagging. La stessa misura può essere lagging per un passo e leading per il successivo. &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;note int read&quot;&gt;&lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;
&lt;p&gt;La slide 5 dice che le financial measures sono lag e le non-financial sono lead. È una semplificazione: la slide 6 elenca il market share tra i lagging, pur non essendo un valore monetario. Conta la posizione nella catena, non l&#x27;unità di misura.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;read&quot;&gt;
&lt;h3&gt;La definizione&lt;/h3&gt;
&lt;p class=&quot;quote&quot;&gt;“A balanced scorecard is an integrated set of performance measures that are derived from and support a company&#x27;s strategy.”&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt; Tre parole fanno il lavoro:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Integrated&lt;/b&gt;: le misure sono legate tra loro, non sono una lista.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Derived from&lt;/b&gt;: si parte dalla strategy e solo dopo si scelgono le misure.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Support&lt;/b&gt;: le misure aiutano le persone a mettere in pratica la strategy.&lt;/li&gt;
&lt;/ul&gt;
&lt;h3&gt;Strategy e customer value proposition&lt;/h3&gt;
&lt;p&gt;Una &lt;b&gt;strategy&lt;/b&gt; è il “game plan” dell&#x27;azienda, il piano di gioco per attirare clienti distinguendosi dai concorrenti. Gli elementi distintivi formano la &lt;b&gt;customer value proposition&lt;/b&gt;: il motivo per cui un cliente dovrebbe scegliere noi e non altri. È l&#x27;essenza della strategy. Se non si riesce a dirla in una frase, non si è pronti a costruire una scorecard. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Le slide presentano tre value propositions. &lt;span class=&quot;src&quot;&gt;slide 9, da Treacy e Wiersema, HBR 1993&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Le tre value propositions&quot;&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Customer intimacy&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Operational excellence&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Product leadership&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p class=&quot;quote&quot; style=&quot;margin-top:0&quot;&gt;“Choose us because we can customise our products and services to your individual needs better than our competitors.”&lt;/p&gt;&lt;p&gt;Vicinanza al cliente: su misura, relazione lunga. Domanda del cliente: “Is it made for me?” &lt;span class=&quot;src&quot;&gt;slide 9 e 19&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p class=&quot;quote&quot; style=&quot;margin-top:0&quot;&gt;“Choose us because we deliver faster, more conveniently and at a lower price than our competitors.”&lt;/p&gt;&lt;p&gt;Eccellenza nell&#x27;esecuzione: veloce, comodo, economico. Domanda del cliente: “Is it cheap and fast?” &lt;span class=&quot;src&quot;&gt;slide 9 e 19&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p class=&quot;quote&quot; style=&quot;margin-top:0&quot;&gt;“Choose us because we offer more innovative and higher quality products than our competitors.”&lt;/p&gt;&lt;p&gt;Il prodotto migliore e più nuovo. Domanda del cliente: “Is it new and better?” &lt;span class=&quot;src&quot;&gt;slide 9 e 19&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note ext read&quot;&gt;&lt;span class=&quot;tag e&quot;&gt;fonte esterna&lt;/span&gt;
&lt;p&gt;Secondo Treacy e Wiersema un&#x27;azienda punta a primeggiare in una sola disciplina e a rispettare almeno gli standard di settore nelle altre due. Le slide lo dicono così: ogni azienda guarda tutte e tre, ma la strategy decide quale viene prima (slide 19). &lt;a href=&quot;https://hbr.org/1993/01/customer-intimacy-and-other-value-disciplines&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HBR, 1993&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché un profit in crescita può essere una cattiva notizia?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Può nascere da tagli a training o maintenance: migliora quest&#x27;anno e danneggia l&#x27;anno prossimo (“it can be managed”, slide 4).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;“Customer satisfaction” è leading o lagging?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Dipende dall&#x27;anello: lagging rispetto agli errors per order, leading rispetto ai repeat purchases (slide 6).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa significa “derived from” nella definizione?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Che l&#x27;ordine è obbligato: prima la strategy, poi le misure. Una scorecard fatta partendo dai dati già disponibili è solo una lista (slide 7).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Una catena di discount promette “prezzi più bassi e consegna in 24 ore”. Quale value proposition è?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Operational excellence: faster, more conveniently, at a lower price (slide 9).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quando si è pronti a costruire una scorecard?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Quando si riesce a dire la value proposition in una frase (slide 8).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-sa&quot; id=&quot;s2&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Sezione II&lt;/span&gt;&lt;h2&gt;The framework&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slide 10–14. Strategia a sinistra, misure a destra, frecce in mezzo.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;h3 style=&quot;margin-top:0&quot;&gt;Dalla strategy alle quattro perspectives&lt;/h3&gt;
&lt;p&gt;Dalla vision and strategy nascono tre domande: quali sono i nostri obiettivi finanziari? Quali clienti vogliamo servire, e come li conquistiamo e li teniamo? Quali internal business processes sono critici per dare valore ai clienti? Le risposte si misurano su quattro &lt;b&gt;perspectives&lt;/b&gt;, punti di vista, ciascuno con una domanda guida. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Perspective&lt;/th&gt;&lt;th&gt;Domanda guida&lt;/th&gt;&lt;th&gt;In italiano&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Financial&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;i&gt;Has our financial performance improved?&lt;/i&gt;&lt;/td&gt;&lt;td&gt;I risultati economici sono migliorati?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Customer&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;i&gt;Do customers recognise that we are delivering more value?&lt;/i&gt;&lt;/td&gt;&lt;td&gt;I clienti percepiscono più valore?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Internal business processes&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;i&gt;Have we improved key processes so we can deliver more value?&lt;/i&gt;&lt;/td&gt;&lt;td&gt;Abbiamo migliorato i processi chiave?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Learning and growth&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;i&gt;Are we keeping our ability to change and improve?&lt;/i&gt;&lt;/td&gt;&lt;td&gt;Sappiamo ancora cambiare e migliorare?&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3&gt;Le perspectives formano una chain&lt;/h3&gt;&lt;p&gt;La catena si legge &lt;b&gt;dal basso&lt;/b&gt;. Scorri i passi. &lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;align-items:center&quot;&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;
&lt;svg class=&quot;mb&quot; viewBox=&quot;0 0 320 262&quot; role=&quot;img&quot; aria-label=&quot;Catena dal basso verso l&#x27;alto: employees who learn, better internal processes, more satisfied customers, better financial results&quot;&gt;
&lt;rect class=&quot;r4r&quot; x=&quot;20&quot; y=&quot;4&quot; width=&quot;280&quot; height=&quot;46&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r4x&quot; x=&quot;160&quot; y=&quot;32&quot;&gt;Better financial results&lt;/text&gt;
&lt;rect class=&quot;r3r&quot; x=&quot;20&quot; y=&quot;74&quot; width=&quot;280&quot; height=&quot;46&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r3x&quot; x=&quot;160&quot; y=&quot;102&quot;&gt;More satisfied customers&lt;/text&gt;
&lt;rect class=&quot;r2r&quot; x=&quot;20&quot; y=&quot;144&quot; width=&quot;280&quot; height=&quot;46&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r2x&quot; x=&quot;160&quot; y=&quot;172&quot;&gt;Better internal processes&lt;/text&gt;
&lt;rect class=&quot;r1r&quot; x=&quot;20&quot; y=&quot;214&quot; width=&quot;280&quot; height=&quot;46&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r1x&quot; x=&quot;160&quot; y=&quot;242&quot;&gt;Employees who learn&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M160 214V192&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M160 144V122&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M160 74V52&quot; marker-end=&quot;url(#ah)&quot;/&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;steps&quot; data-steps&gt;&lt;ol&gt;
&lt;li&gt;I dipendenti devono continuare a imparare per migliorare gli &lt;b&gt;internal business processes&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Processi migliori sono necessari per aumentare la &lt;b&gt;customer satisfaction&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Una customer satisfaction più alta è necessaria per migliorare i &lt;b&gt;financial results&lt;/b&gt;.&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;h3&gt;Ogni arrow è una hypothesis&lt;/h3&gt;
&lt;p class=&quot;quote&quot;&gt;“If we improve this measure, then that other measure should also improve.”&lt;/p&gt;
&lt;p&gt;Una freccia è un&#x27;ipotesi da verificare con i dati, non una verità. &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;
&lt;h3&gt;La strategy map&lt;/h3&gt;
&lt;p&gt;Una &lt;b&gt;strategy map&lt;/b&gt; è il disegno della strategy: gli &lt;b&gt;objectives&lt;/b&gt; (obiettivi) di ciascuna perspective, le &lt;b&gt;arrows&lt;/b&gt; che indicano quale obiettivo dovrebbe causare quale altro, tutto su &lt;b&gt;una pagina&lt;/b&gt;, così ogni dipendente vede come il proprio lavoro porta ai risultati. Poi ogni objective riceve una &lt;b&gt;measure&lt;/b&gt; (cosa misuriamo), un &lt;b&gt;target&lt;/b&gt; (il valore da raggiungere) e un&#x27;&lt;b&gt;initiative&lt;/b&gt; (l&#x27;azione per arrivarci): quella è la scorecard. &lt;span class=&quot;src&quot;&gt;slide 14&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Clicca una freccia per leggerne l&#x27;ipotesi e il test.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;align-items:start&quot;&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;
&lt;svg class=&quot;mb&quot; viewBox=&quot;0 0 400 378&quot; role=&quot;group&quot; aria-label=&quot;Strategy map con quattro livelli e tre frecce cliccabili&quot;&gt;
&lt;text class=&quot;ts&quot; x=&quot;0&quot; y=&quot;13&quot;&gt;Financial&lt;/text&gt;
&lt;rect class=&quot;r4r&quot; x=&quot;0&quot; y=&quot;20&quot; width=&quot;195&quot; height=&quot;50&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r4x&quot; x=&quot;97&quot; y=&quot;50&quot;&gt;Grow revenue&lt;/text&gt;
&lt;rect class=&quot;r4r&quot; x=&quot;205&quot; y=&quot;20&quot; width=&quot;195&quot; height=&quot;50&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r4x&quot; x=&quot;302&quot; y=&quot;50&quot;&gt;Improve productivity&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;0&quot; y=&quot;113&quot;&gt;Customer&lt;/text&gt;
&lt;rect class=&quot;r3r&quot; x=&quot;0&quot; y=&quot;120&quot; width=&quot;400&quot; height=&quot;50&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r3x&quot; x=&quot;200&quot; y=&quot;150&quot;&gt;Win and keep the right customers&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;0&quot; y=&quot;213&quot;&gt;Processes&lt;/text&gt;
&lt;rect class=&quot;r2r&quot; x=&quot;0&quot; y=&quot;220&quot; width=&quot;400&quot; height=&quot;50&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r2x&quot; x=&quot;200&quot; y=&quot;250&quot;&gt;Excel at the processes customers value&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;0&quot; y=&quot;313&quot;&gt;Learning and growth&lt;/text&gt;
&lt;rect class=&quot;r1r&quot; x=&quot;0&quot; y=&quot;320&quot; width=&quot;195&quot; height=&quot;50&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r1x&quot; x=&quot;97&quot; y=&quot;350&quot;&gt;Skilled, motivated people&lt;/text&gt;
&lt;rect class=&quot;r1r&quot; x=&quot;205&quot; y=&quot;320&quot; width=&quot;195&quot; height=&quot;50&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r1x&quot; x=&quot;302&quot; y=&quot;350&quot;&gt;Useful information&lt;/text&gt;
&lt;g class=&quot;hp&quot; data-k=&quot;c&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;Freccia da customer a financial&quot;&gt;&lt;circle cx=&quot;200&quot; cy=&quot;95&quot; r=&quot;17&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;100&quot;&gt;↑&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;hp&quot; data-k=&quot;b&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;Freccia da processes a customer&quot;&gt;&lt;circle cx=&quot;200&quot; cy=&quot;195&quot; r=&quot;17&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;200&quot;&gt;↑&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;hp&quot; data-k=&quot;a&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;Freccia da learning and growth a processes&quot;&gt;&lt;circle cx=&quot;200&quot; cy=&quot;295&quot; r=&quot;17&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;300&quot;&gt;↑&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Schema della slide 14.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;out&quot; id=&quot;hyp-out&quot; aria-live=&quot;polite&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Da quale perspective si comincia a leggere la chain, e perché?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Da learning and growth: tutto ciò che sta sopra dipende dalle persone che fanno girare i processi (slide 12 e 16).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Le ore di training salgono, gli errori no. Che cosa si conclude?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;L&#x27;ipotesi non è confermata: o il training è fatto male, o gli errori hanno un&#x27;altra causa (slide 13).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa manca a una strategy map per diventare una scorecard?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Per ogni objective: una measure, un target e un&#x27;initiative (slide 14).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-oc&quot; id=&quot;s3&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Sezione III&lt;/span&gt;&lt;h2&gt;People, processes and customers&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slide 15–20, più la perspective finanziaria della slide 22.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;p&gt;Ogni measure ha una direzione desiderata: ↑ vuol dire che deve salire, ↓ che deve scendere. Senza direzione, un numero non dice se stiamo migliorando. Scegli un livello della chain.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tabs persp&quot; data-tabs data-start=&quot;3&quot;&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Le quattro perspectives&quot; aria-orientation=&quot;vertical&quot;&gt;
&lt;button type=&quot;button&quot; role=&quot;tab&quot; class=&quot;r4&quot;&gt;Financial&lt;/button&gt;
&lt;button type=&quot;button&quot; role=&quot;tab&quot; class=&quot;r3&quot;&gt;Customer&lt;/button&gt;
&lt;button type=&quot;button&quot; role=&quot;tab&quot; class=&quot;r2&quot;&gt;Internal processes&lt;/button&gt;
&lt;button type=&quot;button&quot; role=&quot;tab&quot; class=&quot;r1&quot;&gt;Learning and growth&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p class=&quot;q-g&quot;&gt;Has our financial performance improved?&lt;/p&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:0&quot;&gt;&lt;div&gt;&lt;p&gt;I risultati che interessano agli shareholders (azionisti). È il controllo finale: se persone, processi e clienti migliori non arrivano mai qui, la strategy stessa può essere sbagliata.&lt;/p&gt;&lt;/div&gt;
&lt;ul class=&quot;ms&quot;&gt;&lt;li&gt;Sales growth rate&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Net operating income&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Residual income&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Return on assets&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Net cash flow from operations&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Earnings per share&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;p class=&quot;next&quot;&gt;Non c&#x27;è un livello sopra: i dettagli sono nella &lt;a href=&quot;#s4&quot;&gt;sezione IV&lt;/a&gt;. &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p class=&quot;q-g&quot;&gt;Do customers recognise that we are delivering more value?&lt;/p&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:0&quot;&gt;&lt;div&gt;&lt;p&gt;Se i clienti notano i miglioramenti e cambiano comportamento: ricomprano, comprano di più, ci raccomandano. La parola chiave è &lt;b&gt;recognise&lt;/b&gt;, riconoscere.&lt;/p&gt;&lt;/div&gt;
&lt;ul class=&quot;ms&quot;&gt;&lt;li&gt;Market share&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Customer defection rate&lt;b&gt;↓&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Customer referrals&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Share of wallet&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Orders delivered on time, as customers see it&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;p class=&quot;next&quot;&gt;&lt;b&gt;Next level up:&lt;/b&gt; clienti che comprano di più e restano più a lungo dovrebbero produrre &lt;b&gt;better financial results&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;note int&quot;&gt;&lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;p&gt;&lt;b&gt;Defection rate&lt;/b&gt;: quota di clienti persi. &lt;b&gt;Referrals&lt;/b&gt;: nuovi clienti portati da clienti esistenti. &lt;b&gt;Share of wallet&lt;/b&gt;: quota della spesa del cliente in questa categoria che arriva a noi; a differenza del market share guarda il singolo cliente.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p class=&quot;q-g&quot;&gt;Have we improved key processes so that we deliver more value to customers?&lt;/p&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:0&quot;&gt;&lt;div&gt;&lt;p&gt;Quanto bene, quanto in fretta e a che costo l&#x27;azienda svolge le attività che servono i clienti, come assemblare un prodotto o gestire i bagagli.&lt;/p&gt;&lt;/div&gt;
&lt;ul class=&quot;ms&quot;&gt;&lt;li&gt;New products designed&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Warranty claims&lt;b&gt;↓&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Cost of quality&lt;b&gt;↓&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Delivery cycle time&lt;b&gt;↓&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Manufacturing cycle efficiency&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Overall equipment effectiveness&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;p class=&quot;next&quot;&gt;&lt;b&gt;Next level up:&lt;/b&gt; processi migliori dovrebbero dare ai &lt;b&gt;customers&lt;/b&gt; qualcosa che notano e apprezzano. &lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;&lt;/p&gt;
&lt;p style=&quot;margin-top:.8rem&quot;&gt;&lt;b&gt;Warranty claims&lt;/b&gt; sono le richieste di intervento in garanzia. Le tre misure più tecniche hanno una sezione propria: &lt;a href=&quot;#s5&quot;&gt;cost of quality&lt;/a&gt;, &lt;a href=&quot;#s7&quot;&gt;delivery cycle time e MCE&lt;/a&gt;, &lt;a href=&quot;#s8&quot;&gt;OEE&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p class=&quot;q-g&quot;&gt;Are we maintaining our ability to change and improve?&lt;/p&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:0&quot;&gt;&lt;div&gt;&lt;p&gt;Competenze, motivazione, salute e stabilità delle persone che fanno girare i processi. È la base: tutto ciò che sta sopra dipende da qui.&lt;/p&gt;&lt;/div&gt;
&lt;ul class=&quot;ms&quot;&gt;&lt;li&gt;Training hours per employee&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Employee turnover&lt;b&gt;↓&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Absenteeism rate&lt;b&gt;↓&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Improvement suggestions per employee&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Leadership roles filled internally&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;p class=&quot;next&quot;&gt;&lt;b&gt;Next level up:&lt;/b&gt; persone più formate e stabili dovrebbero gestire &lt;b&gt;better processes&lt;/b&gt;. Queste misure si muovono lentamente. &lt;span class=&quot;src&quot;&gt;slide 16&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;h3&gt;Sei dimensioni di process performance&lt;/h3&gt;
&lt;p&gt;Le misure di processo rispondono a sei domande. Quali contano di più lo decide la strategy: “every company watches all three, but the strategy decides which one comes first on a short scorecard”. Scegli una value proposition e guarda cosa si accende. &lt;span class=&quot;src&quot;&gt;slide 18 e 19&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs id=&quot;dims&quot;&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Value proposition&quot;&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Product leadership&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Operational excellence&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Customer intimacy&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;“Is it new and better?”&lt;/b&gt; Si guardano innovation e quality: New products designed ↑, Patents (brevetti) approved ↑, Defects ↓.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;“Is it cheap and fast?”&lt;/b&gt; Si guardano cost e time: Cost per unit ↓, Delivery cycle time ↓, Waste (sprechi) ↓.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;“Is it made for me?”&lt;/b&gt; Si guardano service e flexibility: Complaints (reclami) solved at first contact ↑, Custom orders (ordini su misura) on time ↑, Small batch sizes (lotti piccoli) ↓. Il service non è tra le sei caselle: sotto si accende solo la più vicina alla flexibility, agility. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;grid g3&quot; style=&quot;margin-top:.85rem&quot;&gt;
&lt;div class=&quot;card line dim&quot; data-d=&quot;Innovation&quot;&gt;&lt;h4&gt;Innovation&lt;/h4&gt;&lt;p&gt;Quanti nuovi prodotti e patents creiamo?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line dim&quot; data-d=&quot;Quality&quot;&gt;&lt;h4&gt;Quality&lt;/h4&gt;&lt;p&gt;Quanto spesso prodotti e servizi funzionano bene al primo colpo?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line dim&quot; data-d=&quot;Agility&quot;&gt;&lt;h4&gt;Agility&lt;/h4&gt;&lt;p&gt;Quanto in fretta sappiamo adattarci o cambiare?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line dim&quot; data-d=&quot;Cost&quot;&gt;&lt;h4&gt;Cost&lt;/h4&gt;&lt;p&gt;Quanto spendiamo in cose che non aggiungono valore?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line dim&quot; data-d=&quot;Time&quot;&gt;&lt;h4&gt;Time&lt;/h4&gt;&lt;p&gt;Quanto passa dall&#x27;ordine alla spedizione, e quanto di quel tempo è lavoro vero?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line dim&quot; data-d=&quot;Lean&quot;&gt;&lt;h4&gt;Lean resources&lt;/h4&gt;&lt;p&gt;Impianti, inventory (scorte) e spazi sono usati senza sprechi?&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Autoverifica: in quale perspective va la misura?&lt;/h3&gt;
&lt;div class=&quot;sorter&quot; data-opts=&quot;Learning|Processes|Customer|Financial&quot;&gt;
&lt;p class=&quot;score&quot;&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li data-a=&quot;0&quot; data-w=&quot;Riguarda la stabilità delle persone (slide 16).&quot;&gt;Employee turnover&lt;/li&gt;
&lt;li data-a=&quot;1&quot; data-w=&quot;Misura una conseguenza della qualità dei processi (slide 17).&quot;&gt;Warranty claims&lt;/li&gt;
&lt;li data-a=&quot;2&quot; data-w=&quot;Quanta spesa del cliente arriva a noi (slide 20).&quot;&gt;Share of wallet&lt;/li&gt;
&lt;li data-a=&quot;3&quot; data-w=&quot;Compare fra i risultati per gli shareholders (slide 22).&quot;&gt;Net cash flow from operations&lt;/li&gt;
&lt;li data-a=&quot;1&quot; data-w=&quot;Tempo dall&#x27;ordine alla spedizione, misurato dall&#x27;interno (slide 17).&quot;&gt;Delivery cycle time&lt;/li&gt;
&lt;li data-a=&quot;2&quot; data-w=&quot;È la stessa puntualità, ma vista dal cliente: la slide 20 lo precisa, “as customers see it”.&quot;&gt;Orders delivered on time, as customers see it&lt;/li&gt;
&lt;li data-a=&quot;0&quot; data-w=&quot;Quante idee di miglioramento arrivano dalle persone (slide 16).&quot;&gt;Improvement suggestions per employee&lt;/li&gt;
&lt;li data-a=&quot;2&quot; data-w=&quot;Lo si trova nella perspective customer (slide 20), anche se è un esito già avvenuto.&quot;&gt;Market share&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-oc&quot; id=&quot;s4&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Sezione IV&lt;/span&gt;&lt;h2&gt;Financial measures&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slide 21–23. Il controllo finale della catena.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;p&gt;I manager calcolano molti ratios (indici). Nella balanced scorecard compaiono sotto tre titoli. La slide elenca le voci senza formule: le formule e i numeri qui sotto sono un&#x27;aggiunta. &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt; &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Azienda inventata, in k€: sales 2.000; cost of goods sold 1.200; selling and administrative expenses 500; variable expenses 1.100; interessi e imposte 100; average operating assets 2.000; equity 1.000; 100.000 azioni a 30 € l&#x27;una; minimum required return 10%.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Tre gruppi di misure&quot;&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Profitability ratios&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Profits&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Market performance&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; class=&quot;acc&quot;&gt;
&lt;details open&gt;&lt;summary&gt;Gross margin percentage&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Gross margin ÷ Sales&lt;/div&gt;&lt;p&gt;Quanto resta delle vendite dopo il costo del venduto. (2.000 − 1.200) ÷ 2.000 = &lt;b&gt;40%&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Net profit margin percentage&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Net income ÷ Sales&lt;/div&gt;&lt;p&gt;Net operating income 300 − interessi e imposte 100 = net income 200. 200 ÷ 2.000 = &lt;b&gt;10%&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Return on assets (ROA)&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Net income ÷ Average total assets&lt;/div&gt;&lt;p&gt;Quanto rende l&#x27;intero attivo. Assumendo total assets pari agli operating assets: 200 ÷ 2.000 = &lt;b&gt;10%&lt;/b&gt;. Alcuni testi aggiungono al numeratore gli interessi al netto delle imposte: verifica la versione del corso.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Return on equity (ROE)&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Net income ÷ Average equity&lt;/div&gt;&lt;p&gt;Quanto rende il capitale degli azionisti. 200 ÷ 1.000 = &lt;b&gt;20%&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; class=&quot;acc&quot;&gt;
&lt;details open&gt;&lt;summary&gt;Contribution margin ↑&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Sales − Variable expenses&lt;/div&gt;&lt;p&gt;Quanto resta per coprire i fixed costs (costi fissi) e fare profit. 2.000 − 1.100 = &lt;b&gt;900&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Net operating income ↑&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Gross margin − Selling and administrative expenses&lt;/div&gt;&lt;p&gt;Il risultato della gestione operativa, prima di interessi e imposte. 800 − 500 = &lt;b&gt;300&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Residual income ↑&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Net operating income − (Average operating assets × Minimum required rate of return)&lt;/div&gt;&lt;p&gt;Il profit oltre il rendimento minimo richiesto sugli asset. 300 − (2.000 × 10%) = &lt;b&gt;100&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; class=&quot;acc&quot;&gt;
&lt;details open&gt;&lt;summary&gt;Stock price ↑&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il prezzo dell&#x27;azione: qui 30 €. Riflette le attese del mercato, quindi anche fattori che i manager non controllano.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Earnings per share (EPS) ↑&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Net income ÷ Numero di azioni&lt;/div&gt;&lt;p&gt;200.000 € ÷ 100.000 = &lt;b&gt;2 €&lt;/b&gt; per azione. Eventuali preferred dividends si sottraggono al numeratore.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Price earnings ratio ↑&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Prezzo dell&#x27;azione ÷ EPS&lt;/div&gt;&lt;p&gt;Quanti euro paga il mercato per ogni euro di utile. 30 ÷ 2 = &lt;b&gt;15&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note int read&quot;&gt;&lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;p&gt;Queste voci rispondono al motivo della slide 5: il warehouse supervisor non può muoverle direttamente. Per questo stanno in cima alla chain e sotto ci sono misure che chi lavora può influenzare.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Sotto quale titolo sta il residual income? E il price earnings ratio?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il residual income sotto &lt;b&gt;profits&lt;/b&gt;, il price earnings ratio sotto &lt;b&gt;market performance&lt;/b&gt; (slide 23).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Operating assets 500, minimum required return 12%, net operating income 80. Qual è il residual income?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;80 − (500 × 12%) = 80 − 60 = &lt;b&gt;20&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Le misure di base migliorano da anni, quelle financial no. Che cosa si può dire?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;La strategy stessa può essere sbagliata: il financial è il controllo finale (slide 22).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-ar&quot; id=&quot;s5&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Sezione V&lt;/span&gt;&lt;h2&gt;The cost of quality&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slide 24–28. Spendere un po&#x27; di più prima per perdere molto meno dopo.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;p&gt;&lt;b&gt;Quality costs&lt;/b&gt; sono i costi sostenuti per prevenire i difetti o che derivano dai difetti. Spesso sono grandi e sparsi in molti reparti, perciò molte aziende lavorano per ridurli. Chi ci riesce ha un&#x27;alta &lt;b&gt;quality of conformance&lt;/b&gt;: la grande maggioranza dei prodotti è conforme alle design specifications (le specifiche di progetto) e senza difetti. &lt;span class=&quot;src&quot;&gt;slide 25&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 420 186&quot; role=&quot;img&quot; aria-label=&quot;I quattro tipi di quality cost lungo il percorso del prodotto: prevention e appraisal prima dei difetti, internal e external failure a causa dei difetti, con la spedizione al cliente fra internal ed external&quot;&gt;
&lt;path class=&quot;ln&quot; d=&quot;M5 26H205&quot;/&gt;&lt;text class=&quot;ts tc&quot; x=&quot;105&quot; y=&quot;18&quot;&gt;before defects&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M215 26H415&quot;/&gt;&lt;text class=&quot;ts tc&quot; x=&quot;315&quot; y=&quot;18&quot;&gt;because of defects&lt;/text&gt;
&lt;g class=&quot;n h-ar&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;36&quot; width=&quot;95&quot; height=&quot;84&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;52&quot; y=&quot;66&quot; style=&quot;font-size:13px&quot;&gt;Prevention&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;52&quot; y=&quot;86&quot;&gt;evitare&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;52&quot; y=&quot;102&quot;&gt;i difetti&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;n h-ar&quot;&gt;&lt;rect x=&quot;110&quot; y=&quot;36&quot; width=&quot;95&quot; height=&quot;84&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;157&quot; y=&quot;66&quot; style=&quot;font-size:13px&quot;&gt;Appraisal&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;157&quot; y=&quot;86&quot;&gt;trovarli&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;157&quot; y=&quot;102&quot;&gt;con l&#x27;ispezione&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;n h-ma&quot;&gt;&lt;rect x=&quot;215&quot; y=&quot;36&quot; width=&quot;95&quot; height=&quot;84&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;262&quot; y=&quot;56&quot; style=&quot;font-size:13px&quot;&gt;Internal&lt;/text&gt;&lt;text class=&quot;t tc&quot; x=&quot;262&quot; y=&quot;72&quot; style=&quot;font-size:13px&quot;&gt;failure&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;262&quot; y=&quot;92&quot;&gt;scrap, rework,&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;262&quot; y=&quot;108&quot;&gt;downtime&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;n h-ma&quot;&gt;&lt;rect x=&quot;320&quot; y=&quot;36&quot; width=&quot;95&quot; height=&quot;84&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;367&quot; y=&quot;56&quot; style=&quot;font-size:13px&quot;&gt;External&lt;/text&gt;&lt;text class=&quot;t tc&quot; x=&quot;367&quot; y=&quot;72&quot; style=&quot;font-size:13px&quot;&gt;failure&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;367&quot; y=&quot;88&quot;&gt;warranty,&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;367&quot; y=&quot;101&quot;&gt;recalls,&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;367&quot; y=&quot;114&quot;&gt;lost sales&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M315 30V150&quot; stroke-dasharray=&quot;4 3&quot;/&gt;
&lt;path class=&quot;ln&quot; d=&quot;M5 140H415&quot; marker-end=&quot;url(#ah)&quot;/&gt;
&lt;text class=&quot;ts tc&quot; x=&quot;315&quot; y=&quot;170&quot;&gt;spedizione al cliente&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;5&quot; y=&quot;160&quot;&gt;tempo e danno crescono&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Schema costruito sulla slide 26. Prima si intercetta il difetto, meno costa. &lt;span class=&quot;tag i&quot;&gt;la lettura lungo il tempo è un&#x27;integrazione&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;f&quot;&gt;Cost of quality = Prevention + Appraisal + Internal failure + External failure&lt;/div&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card line&quot;&gt;&lt;h4&gt;Prevention costs&lt;/h4&gt;&lt;p&gt;Attività di supporto che servono a impedire che il difetto nasca.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line&quot;&gt;&lt;h4&gt;Appraisal costs&lt;/h4&gt;&lt;p&gt;Inspection costs: spesi per trovare i prodotti difettosi prima che arrivino ai clienti.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line&quot;&gt;&lt;h4&gt;Internal failure costs&lt;/h4&gt;&lt;p&gt;Da difetti trovati &lt;b&gt;prima&lt;/b&gt; della spedizione: scrap (scarti), rework (rilavorazioni), downtime (fermi macchina).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line&quot;&gt;&lt;h4&gt;External failure costs&lt;/h4&gt;&lt;p&gt;Quando il difetto arriva al cliente: warranty (garanzia), recalls (richiami), lost sales (vendite perse).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note ext read&quot;&gt;&lt;span class=&quot;tag e&quot;&gt;fonte esterna&lt;/span&gt;&lt;p&gt;ASQ, l&#x27;associazione americana per la qualità, usa le stesse quattro categorie e spesso le raggruppa: prevention e appraisal come cost of good quality, internal ed external failure come cost of poor quality. &lt;a href=&quot;https://www.asq.org/quality-resources/cost-of-quality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ASQ, Cost of quality&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3&gt;Spend a little more before, lose much less after&lt;/h3&gt;
&lt;p&gt;Un buon quality programme fa investimenti extra in prevention e appraisal che sono &lt;b&gt;more than offset&lt;/b&gt;, più che compensati, dal calo delle failure costs: il totale scende. Col tempo dovrebbe scendere anche l&#x27;appraisal, perché se i difetti si prevengono alla fonte c&#x27;è meno da ispezionare. &lt;span class=&quot;src&quot;&gt;slide 27&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Prova a spostare il cursore.&lt;/p&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;div class=&quot;lab&quot;&gt;&lt;label class=&quot;sl-r&quot; for=&quot;coq-r&quot;&gt;&lt;span&gt;Prevention + appraisal&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;coq-r&quot; min=&quot;0&quot; max=&quot;300&quot; step=&quot;5&quot; value=&quot;50&quot;&gt;&lt;output id=&quot;coq-o&quot; for=&quot;coq-r&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 480 272&quot; role=&quot;img&quot; aria-label=&quot;Grafico: all&#x27;aumentare della spesa in prevention e appraisal le failure costs calano e il totale scende fino a un minimo&quot;&gt;
&lt;g class=&quot;ln&quot; style=&quot;stroke:var(--rule);stroke-width:1&quot;&gt;&lt;path d=&quot;M50 166.7H450M50 93.3H450M50 20H450&quot;/&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M50 20V240H450&quot;/&gt;

&lt;text class=&quot;ts tc&quot; x=&quot;50&quot; y=&quot;257&quot;&gt;0&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;183.3&quot; y=&quot;257&quot;&gt;100&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;316.7&quot; y=&quot;257&quot;&gt;200&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;450&quot; y=&quot;257&quot;&gt;300&lt;/text&gt;

&lt;/svg&gt;

&lt;div&gt;&lt;b id=&quot;k-d&quot;&gt;&lt;/b&gt;&lt;span&gt;Rispetto alla partenza&lt;/span&gt;&lt;/div&gt;
