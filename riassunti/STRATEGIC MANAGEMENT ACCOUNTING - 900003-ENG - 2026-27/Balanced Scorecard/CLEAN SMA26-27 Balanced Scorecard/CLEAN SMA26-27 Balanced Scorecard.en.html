&lt;h1&gt;The Balanced Scorecard&lt;/h1&gt;
&lt;p class=&quot;lede&quot;&gt;Profit shows how things went, but neither why nor how they will go. The balanced scorecard starts from the strategy, selects a few measures linked by cause and effect, and checks whether the strategy actually works.&lt;/p&gt;
&lt;p&gt;The map shows how the ten topics of the lecture connect. Each box leads to its section. The colours distinguish the four parts: foundations, perspectives, process measures and practical use.&lt;/p&gt;

&lt;section class=&quot;part h-sa&quot; id=&quot;s1&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Section I&lt;/span&gt;&lt;h2&gt;Strategy comes first&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slides 3–9. First the strategy, then the measures.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;h3 style=&quot;margin-top:0&quot;&gt;Why profit is not enough&lt;/h3&gt;
&lt;p&gt;Profit remains the final test, but on its own it is a poor guide for decision-makers. The slides give three reasons. &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;It arrives late&lt;/h4&gt;&lt;p&gt;It reports on the last quarter. By the time it falls, the causes occurred months earlier.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;It does not say why&lt;/h4&gt;&lt;p&gt;A lower margin may stem from defects, slow deliveries, lost customers or untrained staff. The figure does not say which.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;It can be managed&lt;/h4&gt;&lt;p&gt;Cutting training or maintenance raises this year&#x27;s profit and damages the company next year.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;p&gt;What is needed, therefore, is something that shows what happens &lt;b&gt;before&lt;/b&gt; the money moves. Hence the two reasons for using &lt;b&gt;non-financial measures&lt;/b&gt;, that is, measures not expressed in monetary terms. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card line&quot;&gt;&lt;h4&gt;1. They capture underlying changes&lt;/h4&gt;&lt;p&gt;Operational indicators measure the real changes the company is making. Financial measures summarise past actions.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line&quot;&gt;&lt;h4&gt;2. They can be understood and influenced&lt;/h4&gt;&lt;p&gt;Top managers are accountable for financial measures; lower levels much less so. A warehouse supervisor cannot move return on equity, but can move the percentage of orders shipped on time.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;h3&gt;Leading and lagging indicators&lt;/h3&gt;
&lt;p&gt;A &lt;b&gt;lagging indicator&lt;/b&gt; records an outcome that has already occurred: profit, sales, market share. A &lt;b&gt;leading indicator&lt;/b&gt; moves first and helps to predict the outcome: training hours, defect rates, delivery times. A good scorecard combines the two: managers act on the drivers, the levers that produce the result, and then check the result. &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;figure class=&quot;fig&quot; id=&quot;ll&quot;&gt;
&lt;div class=&quot;chips&quot;&gt;&lt;span&gt;Training hours&lt;/span&gt;&lt;em&gt;→&lt;/em&gt;&lt;span&gt;Errors per order&lt;/span&gt;&lt;em&gt;→&lt;/em&gt;&lt;span&gt;Customer satisfaction&lt;/span&gt;&lt;em&gt;→&lt;/em&gt;&lt;span&gt;Repeat purchases&lt;/span&gt;&lt;em&gt;→&lt;/em&gt;&lt;span&gt;Profit&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot; role=&quot;group&quot; aria-label=&quot;Choose the link in the chain&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;tog&quot;&gt;Link 1&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;tog&quot;&gt;Link 2&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;tog&quot;&gt;Link 3&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;tog&quot;&gt;Link 4&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;out&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Step through the links: solid colour marks the leading indicator, pale colour the lagging one. The same measure can be lagging for one step and leading for the next. &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;note int read&quot;&gt;&lt;span class=&quot;tag i&quot;&gt;addition&lt;/span&gt;
&lt;p&gt;Slide 5 states that financial measures are lag and non-financial measures are lead. This is a simplification: slide 6 lists market share among the lagging indicators, although it is not a monetary value. What matters is the position in the chain, not the unit of measurement.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;read&quot;&gt;
&lt;h3&gt;The definition&lt;/h3&gt;
&lt;p class=&quot;quote&quot;&gt;“A balanced scorecard is an integrated set of performance measures that are derived from and support a company&#x27;s strategy.”&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt; Three terms do the work:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Integrated&lt;/b&gt;: the measures are linked to one another; they are not a list.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Derived from&lt;/b&gt;: the starting point is the strategy, and only then are the measures chosen.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Support&lt;/b&gt;: the measures help people put the strategy into practice.&lt;/li&gt;
&lt;/ul&gt;
&lt;h3&gt;Strategy and customer value proposition&lt;/h3&gt;
&lt;p&gt;A &lt;b&gt;strategy&lt;/b&gt; is the company&#x27;s “game plan” for attracting customers by standing out from competitors. The distinctive elements form the &lt;b&gt;customer value proposition&lt;/b&gt;: the reason why a customer should choose this company rather than others. It is the essence of the strategy. A company that cannot state it in one sentence is not ready to build a scorecard. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;The slides present three value propositions. &lt;span class=&quot;src&quot;&gt;slide 9, from Treacy and Wiersema, HBR 1993&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;The three value propositions&quot;&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Customer intimacy&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Operational excellence&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Product leadership&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p class=&quot;quote&quot; style=&quot;margin-top:0&quot;&gt;“Choose us because we can customise our products and services to your individual needs better than our competitors.”&lt;/p&gt;&lt;p&gt;Closeness to the customer: tailored offerings, long-term relationships. The customer&#x27;s question: “Is it made for me?” &lt;span class=&quot;src&quot;&gt;slides 9 and 19&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p class=&quot;quote&quot; style=&quot;margin-top:0&quot;&gt;“Choose us because we deliver faster, more conveniently and at a lower price than our competitors.”&lt;/p&gt;&lt;p&gt;Excellence in execution: fast, convenient, inexpensive. The customer&#x27;s question: “Is it cheap and fast?” &lt;span class=&quot;src&quot;&gt;slides 9 and 19&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p class=&quot;quote&quot; style=&quot;margin-top:0&quot;&gt;“Choose us because we offer more innovative and higher quality products than our competitors.”&lt;/p&gt;&lt;p&gt;The best and newest product. The customer&#x27;s question: “Is it new and better?” &lt;span class=&quot;src&quot;&gt;slides 9 and 19&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note ext read&quot;&gt;&lt;span class=&quot;tag e&quot;&gt;external source&lt;/span&gt;
&lt;p&gt;According to Treacy and Wiersema, a company aims to excel in a single discipline and to meet at least industry standards in the other two. The slides put it this way: every company watches all three, but the strategy decides which one comes first (slide 19). &lt;a href=&quot;https://hbr.org/1993/01/customer-intimacy-and-other-value-disciplines&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HBR, 1993&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why can rising profit be bad news?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It may result from cuts to training or maintenance: it improves this year and damages next year (“it can be managed”, slide 4).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Is “customer satisfaction” leading or lagging?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It depends on the link: lagging relative to errors per order, leading relative to repeat purchases (slide 6).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What does “derived from” mean in the definition?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;That the order is fixed: first the strategy, then the measures. A scorecard built from whatever data are already available is merely a list (slide 7).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;A discount chain promises “lower prices and delivery within 24 hours”. Which value proposition is this?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Operational excellence: faster, more conveniently, at a lower price (slide 9).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;When is a company ready to build a scorecard?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;When it can state the value proposition in one sentence (slide 8).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-sa&quot; id=&quot;s2&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Section II&lt;/span&gt;&lt;h2&gt;The framework&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slides 10–14. Strategy on the left, measures on the right, arrows in between.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;h3 style=&quot;margin-top:0&quot;&gt;From strategy to the four perspectives&lt;/h3&gt;
&lt;p&gt;Three questions arise from the vision and strategy: what are our financial goals? Which customers do we want to serve, and how do we win and retain them? Which internal business processes are critical to delivering value to customers? The answers are measured along four &lt;b&gt;perspectives&lt;/b&gt;, or points of view, each with a guiding question. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Perspective&lt;/th&gt;&lt;th&gt;Guiding question&lt;/th&gt;&lt;th&gt;In plain terms&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Financial&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;i&gt;Has our financial performance improved?&lt;/i&gt;&lt;/td&gt;&lt;td&gt;Have the economic results improved?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Customer&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;i&gt;Do customers recognise that we are delivering more value?&lt;/i&gt;&lt;/td&gt;&lt;td&gt;Do customers perceive more value?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Internal business processes&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;i&gt;Have we improved key processes so we can deliver more value?&lt;/i&gt;&lt;/td&gt;&lt;td&gt;Have we improved the key processes?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Learning and growth&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;i&gt;Are we keeping our ability to change and improve?&lt;/i&gt;&lt;/td&gt;&lt;td&gt;Can we still change and improve?&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3&gt;The perspectives form a chain&lt;/h3&gt;&lt;p&gt;The chain is read &lt;b&gt;from the bottom up&lt;/b&gt;. Step through it. &lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;align-items:center&quot;&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;
&lt;svg class=&quot;mb&quot; viewBox=&quot;0 0 320 262&quot; role=&quot;img&quot; aria-label=&quot;Chain from the bottom up: employees who learn, better internal processes, more satisfied customers, better financial results&quot;&gt;
&lt;rect class=&quot;r4r&quot; x=&quot;20&quot; y=&quot;4&quot; width=&quot;280&quot; height=&quot;46&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r4x&quot; x=&quot;160&quot; y=&quot;32&quot;&gt;Better financial results&lt;/text&gt;
&lt;rect class=&quot;r3r&quot; x=&quot;20&quot; y=&quot;74&quot; width=&quot;280&quot; height=&quot;46&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r3x&quot; x=&quot;160&quot; y=&quot;102&quot;&gt;More satisfied customers&lt;/text&gt;
&lt;rect class=&quot;r2r&quot; x=&quot;20&quot; y=&quot;144&quot; width=&quot;280&quot; height=&quot;46&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r2x&quot; x=&quot;160&quot; y=&quot;172&quot;&gt;Better internal processes&lt;/text&gt;
&lt;rect class=&quot;r1r&quot; x=&quot;20&quot; y=&quot;214&quot; width=&quot;280&quot; height=&quot;46&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r1x&quot; x=&quot;160&quot; y=&quot;242&quot;&gt;Employees who learn&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M160 214V192&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M160 144V122&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M160 74V52&quot; marker-end=&quot;url(#ah)&quot;/&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;steps&quot; data-steps&gt;&lt;ol&gt;
&lt;li&gt;Employees must keep learning in order to improve &lt;b&gt;internal business processes&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Better processes are needed to increase &lt;b&gt;customer satisfaction&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Higher customer satisfaction is needed to improve &lt;b&gt;financial results&lt;/b&gt;.&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;h3&gt;Every arrow is a hypothesis&lt;/h3&gt;
&lt;p class=&quot;quote&quot;&gt;“If we improve this measure, then that other measure should also improve.”&lt;/p&gt;
&lt;p&gt;An arrow is a hypothesis to be tested against the data, not a truth. &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;
&lt;h3&gt;The strategy map&lt;/h3&gt;
&lt;p&gt;A &lt;b&gt;strategy map&lt;/b&gt; is a picture of the strategy: the &lt;b&gt;objectives&lt;/b&gt; of each perspective and the &lt;b&gt;arrows&lt;/b&gt; showing which objective should cause which other, all on &lt;b&gt;one page&lt;/b&gt;, so that every employee can see how their own work leads to results. Each objective then receives a &lt;b&gt;measure&lt;/b&gt; (what is measured), a &lt;b&gt;target&lt;/b&gt; (the value to be reached) and an &lt;b&gt;initiative&lt;/b&gt; (the action taken to get there): that is the scorecard. &lt;span class=&quot;src&quot;&gt;slide 14&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Click an arrow to read its hypothesis and test.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;align-items:start&quot;&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;
&lt;svg class=&quot;mb&quot; viewBox=&quot;0 0 400 378&quot; role=&quot;group&quot; aria-label=&quot;Strategy map with four levels and three clickable arrows&quot;&gt;
&lt;text class=&quot;ts&quot; x=&quot;0&quot; y=&quot;13&quot;&gt;Financial&lt;/text&gt;
&lt;rect class=&quot;r4r&quot; x=&quot;0&quot; y=&quot;20&quot; width=&quot;195&quot; height=&quot;50&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r4x&quot; x=&quot;97&quot; y=&quot;50&quot;&gt;Grow revenue&lt;/text&gt;
&lt;rect class=&quot;r4r&quot; x=&quot;205&quot; y=&quot;20&quot; width=&quot;195&quot; height=&quot;50&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r4x&quot; x=&quot;302&quot; y=&quot;50&quot;&gt;Improve productivity&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;0&quot; y=&quot;113&quot;&gt;Customer&lt;/text&gt;
&lt;rect class=&quot;r3r&quot; x=&quot;0&quot; y=&quot;120&quot; width=&quot;400&quot; height=&quot;50&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r3x&quot; x=&quot;200&quot; y=&quot;150&quot;&gt;Win and keep the right customers&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;0&quot; y=&quot;213&quot;&gt;Processes&lt;/text&gt;
&lt;rect class=&quot;r2r&quot; x=&quot;0&quot; y=&quot;220&quot; width=&quot;400&quot; height=&quot;50&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r2x&quot; x=&quot;200&quot; y=&quot;250&quot;&gt;Excel at the processes customers value&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;0&quot; y=&quot;313&quot;&gt;Learning and growth&lt;/text&gt;
&lt;rect class=&quot;r1r&quot; x=&quot;0&quot; y=&quot;320&quot; width=&quot;195&quot; height=&quot;50&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r1x&quot; x=&quot;97&quot; y=&quot;350&quot;&gt;Skilled, motivated people&lt;/text&gt;
&lt;rect class=&quot;r1r&quot; x=&quot;205&quot; y=&quot;320&quot; width=&quot;195&quot; height=&quot;50&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc r1x&quot; x=&quot;302&quot; y=&quot;350&quot;&gt;Useful information&lt;/text&gt;
&lt;g class=&quot;hp&quot; data-k=&quot;c&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;Arrow from customer to financial&quot;&gt;&lt;circle cx=&quot;200&quot; cy=&quot;95&quot; r=&quot;17&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;100&quot;&gt;↑&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;hp&quot; data-k=&quot;b&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;Arrow from processes to customer&quot;&gt;&lt;circle cx=&quot;200&quot; cy=&quot;195&quot; r=&quot;17&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;200&quot;&gt;↑&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;hp&quot; data-k=&quot;a&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;Arrow from learning and growth to processes&quot;&gt;&lt;circle cx=&quot;200&quot; cy=&quot;295&quot; r=&quot;17&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;300&quot;&gt;↑&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Diagram from slide 14.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;out&quot; id=&quot;hyp-out&quot; aria-live=&quot;polite&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;From which perspective does one start reading the chain, and why?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;From learning and growth: everything above it depends on the people who run the processes (slides 12 and 16).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Training hours rise, but errors do not fall. What can be concluded?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The hypothesis is not confirmed: either the training is poorly delivered, or the errors have another cause (slide 13).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What does a strategy map lack in order to become a scorecard?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;For each objective: a measure, a target and an initiative (slide 14).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-oc&quot; id=&quot;s3&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Section III&lt;/span&gt;&lt;h2&gt;People, processes and customers&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slides 15–20, plus the financial perspective from slide 22.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;p&gt;Every measure has a desired direction: ↑ means it should rise, ↓ that it should fall. Without a direction, a figure does not show whether performance is improving. Choose a level of the chain.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tabs persp&quot; data-tabs data-start=&quot;3&quot;&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;The four perspectives&quot; aria-orientation=&quot;vertical&quot;&gt;
&lt;button type=&quot;button&quot; role=&quot;tab&quot; class=&quot;r4&quot;&gt;Financial&lt;/button&gt;
&lt;button type=&quot;button&quot; role=&quot;tab&quot; class=&quot;r3&quot;&gt;Customer&lt;/button&gt;
&lt;button type=&quot;button&quot; role=&quot;tab&quot; class=&quot;r2&quot;&gt;Internal processes&lt;/button&gt;
&lt;button type=&quot;button&quot; role=&quot;tab&quot; class=&quot;r1&quot;&gt;Learning and growth&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p class=&quot;q-g&quot;&gt;Has our financial performance improved?&lt;/p&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:0&quot;&gt;&lt;div&gt;&lt;p&gt;The results of interest to shareholders. This is the final check: if better people, processes and customers never show up here, the strategy itself may be wrong.&lt;/p&gt;&lt;/div&gt;
&lt;ul class=&quot;ms&quot;&gt;&lt;li&gt;Sales growth rate&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Net operating income&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Residual income&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Return on assets&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Net cash flow from operations&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Earnings per share&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;p class=&quot;next&quot;&gt;There is no level above: the details are in &lt;a href=&quot;#s4&quot;&gt;section IV&lt;/a&gt;. &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p class=&quot;q-g&quot;&gt;Do customers recognise that we are delivering more value?&lt;/p&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:0&quot;&gt;&lt;div&gt;&lt;p&gt;Whether customers notice the improvements and change their behaviour: they buy again, buy more, recommend the company. The key word is &lt;b&gt;recognise&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;ul class=&quot;ms&quot;&gt;&lt;li&gt;Market share&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Customer defection rate&lt;b&gt;↓&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Customer referrals&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Share of wallet&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Orders delivered on time, as customers see it&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;p class=&quot;next&quot;&gt;&lt;b&gt;Next level up:&lt;/b&gt; customers who buy more and stay longer should produce &lt;b&gt;better financial results&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;note int&quot;&gt;&lt;span class=&quot;tag i&quot;&gt;addition&lt;/span&gt;&lt;p&gt;&lt;b&gt;Defection rate&lt;/b&gt;: the share of customers lost. &lt;b&gt;Referrals&lt;/b&gt;: new customers brought in by existing customers. &lt;b&gt;Share of wallet&lt;/b&gt;: the share of a customer&#x27;s spending in this category that comes to the company; unlike market share, it looks at the individual customer.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p class=&quot;q-g&quot;&gt;Have we improved key processes so that we deliver more value to customers?&lt;/p&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:0&quot;&gt;&lt;div&gt;&lt;p&gt;How well, how quickly and at what cost the company performs the activities that serve customers, such as assembling a product or handling baggage.&lt;/p&gt;&lt;/div&gt;
&lt;ul class=&quot;ms&quot;&gt;&lt;li&gt;New products designed&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Warranty claims&lt;b&gt;↓&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Cost of quality&lt;b&gt;↓&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Delivery cycle time&lt;b&gt;↓&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Manufacturing cycle efficiency&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Overall equipment effectiveness&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;p class=&quot;next&quot;&gt;&lt;b&gt;Next level up:&lt;/b&gt; better processes should give &lt;b&gt;customers&lt;/b&gt; something they notice and value. &lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;&lt;/p&gt;
&lt;p style=&quot;margin-top:.8rem&quot;&gt;&lt;b&gt;Warranty claims&lt;/b&gt; are requests for repair or replacement under warranty. The three more technical measures have their own sections: &lt;a href=&quot;#s5&quot;&gt;cost of quality&lt;/a&gt;, &lt;a href=&quot;#s7&quot;&gt;delivery cycle time and MCE&lt;/a&gt;, &lt;a href=&quot;#s8&quot;&gt;OEE&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p class=&quot;q-g&quot;&gt;Are we maintaining our ability to change and improve?&lt;/p&gt;
&lt;div class=&quot;grid g2&quot; style=&quot;margin-top:0&quot;&gt;&lt;div&gt;&lt;p&gt;The skills, motivation, health and stability of the people who run the processes. This is the foundation: everything above depends on it.&lt;/p&gt;&lt;/div&gt;
&lt;ul class=&quot;ms&quot;&gt;&lt;li&gt;Training hours per employee&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Employee turnover&lt;b&gt;↓&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Absenteeism rate&lt;b&gt;↓&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Improvement suggestions per employee&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Leadership roles filled internally&lt;b&gt;↑&lt;/b&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;p class=&quot;next&quot;&gt;&lt;b&gt;Next level up:&lt;/b&gt; better trained and more stable staff should run &lt;b&gt;better processes&lt;/b&gt;. These measures move slowly. &lt;span class=&quot;src&quot;&gt;slide 16&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;h3&gt;Six dimensions of process performance&lt;/h3&gt;
&lt;p&gt;Process measures answer six questions. The strategy decides which matter most: “every company watches all three, but the strategy decides which one comes first on a short scorecard”. Choose a value proposition and see what lights up. &lt;span class=&quot;src&quot;&gt;slides 18 and 19&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs id=&quot;dims&quot;&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Value proposition&quot;&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Product leadership&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Operational excellence&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Customer intimacy&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;“Is it new and better?”&lt;/b&gt; The focus is on innovation and quality: New products designed ↑, Patents approved ↑, Defects ↓.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;“Is it cheap and fast?”&lt;/b&gt; The focus is on cost and time: Cost per unit ↓, Delivery cycle time ↓, Waste ↓.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;“Is it made for me?”&lt;/b&gt; The focus is on service and flexibility: Complaints solved at first contact ↑, Custom orders on time ↑, Small batch sizes ↓. Service is not among the six boxes: below, only the box closest to flexibility lights up, namely agility. &lt;span class=&quot;tag i&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;grid g3&quot; style=&quot;margin-top:.85rem&quot;&gt;
&lt;div class=&quot;card line dim&quot; data-d=&quot;Innovation&quot;&gt;&lt;h4&gt;Innovation&lt;/h4&gt;&lt;p&gt;How many new products and patents do we create?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line dim&quot; data-d=&quot;Quality&quot;&gt;&lt;h4&gt;Quality&lt;/h4&gt;&lt;p&gt;How often do products and services work properly the first time?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line dim&quot; data-d=&quot;Agility&quot;&gt;&lt;h4&gt;Agility&lt;/h4&gt;&lt;p&gt;How quickly can we adapt or change?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line dim&quot; data-d=&quot;Cost&quot;&gt;&lt;h4&gt;Cost&lt;/h4&gt;&lt;p&gt;How much do we spend on things that add no value?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line dim&quot; data-d=&quot;Time&quot;&gt;&lt;h4&gt;Time&lt;/h4&gt;&lt;p&gt;How long does it take from order to shipment, and how much of that time is actual work?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line dim&quot; data-d=&quot;Lean&quot;&gt;&lt;h4&gt;Lean resources&lt;/h4&gt;&lt;p&gt;Are plant, inventory and space used without waste?&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Self-check: which perspective does the measure belong to?&lt;/h3&gt;
&lt;div class=&quot;sorter&quot; data-opts=&quot;Learning|Processes|Customer|Financial&quot;&gt;
&lt;p class=&quot;score&quot;&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li data-a=&quot;0&quot; data-w=&quot;It concerns the stability of people (slide 16).&quot;&gt;Employee turnover&lt;/li&gt;
&lt;li data-a=&quot;1&quot; data-w=&quot;It measures a consequence of process quality (slide 17).&quot;&gt;Warranty claims&lt;/li&gt;
&lt;li data-a=&quot;2&quot; data-w=&quot;How much of the customer&#x27;s spending comes to the company (slide 20).&quot;&gt;Share of wallet&lt;/li&gt;
&lt;li data-a=&quot;3&quot; data-w=&quot;It appears among the results for shareholders (slide 22).&quot;&gt;Net cash flow from operations&lt;/li&gt;
&lt;li data-a=&quot;1&quot; data-w=&quot;Time from order to shipment, measured from the inside (slide 17).&quot;&gt;Delivery cycle time&lt;/li&gt;
&lt;li data-a=&quot;2&quot; data-w=&quot;It is the same punctuality, but seen by the customer: slide 20 specifies “as customers see it”.&quot;&gt;Orders delivered on time, as customers see it&lt;/li&gt;
&lt;li data-a=&quot;0&quot; data-w=&quot;How many improvement ideas come from people (slide 16).&quot;&gt;Improvement suggestions per employee&lt;/li&gt;
&lt;li data-a=&quot;2&quot; data-w=&quot;It is found in the customer perspective (slide 20), even though it is an outcome that has already occurred.&quot;&gt;Market share&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-oc&quot; id=&quot;s4&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Section IV&lt;/span&gt;&lt;h2&gt;Financial measures&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slides 21–23. The final check of the chain.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;p&gt;Managers calculate many ratios. In the balanced scorecard they appear under three headings. The slide lists the items without formulas: the formulas and figures below are an addition. &lt;span class=&quot;src&quot;&gt;slide 23&lt;/span&gt; &lt;span class=&quot;tag i&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Invented company, in k€: sales 2,000; cost of goods sold 1,200; selling and administrative expenses 500; variable expenses 1,100; interest and taxes 100; average operating assets 2,000; equity 1,000; 100,000 shares at €30 each; minimum required return 10%.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Three groups of measures&quot;&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Profitability ratios&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Profits&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Market performance&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; class=&quot;acc&quot;&gt;
&lt;details open&gt;&lt;summary&gt;Gross margin percentage&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Gross margin ÷ Sales&lt;/div&gt;&lt;p&gt;How much of sales remains after the cost of goods sold. (2,000 − 1,200) ÷ 2,000 = &lt;b&gt;40%&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Net profit margin percentage&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Net income ÷ Sales&lt;/div&gt;&lt;p&gt;Net operating income 300 − interest and taxes 100 = net income 200. 200 ÷ 2,000 = &lt;b&gt;10%&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Return on assets (ROA)&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Net income ÷ Average total assets&lt;/div&gt;&lt;p&gt;The return on total assets. Assuming total assets equal operating assets: 200 ÷ 2,000 = &lt;b&gt;10%&lt;/b&gt;. Some textbooks add after-tax interest to the numerator: check the version used in the course.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Return on equity (ROE)&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Net income ÷ Average equity&lt;/div&gt;&lt;p&gt;The return on shareholders&#x27; capital. 200 ÷ 1,000 = &lt;b&gt;20%&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; class=&quot;acc&quot;&gt;
&lt;details open&gt;&lt;summary&gt;Contribution margin ↑&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Sales − Variable expenses&lt;/div&gt;&lt;p&gt;How much remains to cover fixed costs and generate profit. 2,000 − 1,100 = &lt;b&gt;900&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Net operating income ↑&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Gross margin − Selling and administrative expenses&lt;/div&gt;&lt;p&gt;The result of operations, before interest and taxes. 800 − 500 = &lt;b&gt;300&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Residual income ↑&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Net operating income − (Average operating assets × Minimum required rate of return)&lt;/div&gt;&lt;p&gt;Profit above the minimum required return on assets. 300 − (2,000 × 10%) = &lt;b&gt;100&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; class=&quot;acc&quot;&gt;
&lt;details open&gt;&lt;summary&gt;Stock price ↑&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The share price: here €30. It reflects market expectations, and therefore also factors beyond managers&#x27; control.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Earnings per share (EPS) ↑&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Net income ÷ Number of shares&lt;/div&gt;&lt;p&gt;€200,000 ÷ 100,000 = &lt;b&gt;€2&lt;/b&gt; per share. Any preferred dividends are subtracted from the numerator.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Price earnings ratio ↑&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;f&quot;&gt;Share price ÷ EPS&lt;/div&gt;&lt;p&gt;How many euros the market pays for each euro of earnings. 30 ÷ 2 = &lt;b&gt;15&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note int read&quot;&gt;&lt;span class=&quot;tag i&quot;&gt;addition&lt;/span&gt;&lt;p&gt;These items reflect the reason given on slide 5: the warehouse supervisor cannot move them directly. This is why they sit at the top of the chain, above measures that staff can influence.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Under which heading does residual income fall? And the price earnings ratio?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Residual income falls under &lt;b&gt;profits&lt;/b&gt;, the price earnings ratio under &lt;b&gt;market performance&lt;/b&gt; (slide 23).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Operating assets 500, minimum required return 12%, net operating income 80. What is the residual income?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;80 − (500 × 12%) = 80 − 60 = &lt;b&gt;20&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;The underlying measures have been improving for years, but the financial ones have not. What can be said?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The strategy itself may be wrong: the financial perspective is the final check (slide 22).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-ar&quot; id=&quot;s5&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Section V&lt;/span&gt;&lt;h2&gt;The cost of quality&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slides 24–28. Spending a little more beforehand to lose much less afterwards.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;p&gt;&lt;b&gt;Quality costs&lt;/b&gt; are the costs incurred to prevent defects or resulting from defects. They are often large and scattered across many departments, which is why many companies work to reduce them. Those that succeed achieve a high &lt;b&gt;quality of conformance&lt;/b&gt;: the great majority of products conform to design specifications and are free of defects. &lt;span class=&quot;src&quot;&gt;slide 25&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 420 186&quot; role=&quot;img&quot; aria-label=&quot;The four types of quality cost along the product&#x27;s path: prevention and appraisal before defects, internal and external failure because of defects, with shipment to the customer between internal and external&quot;&gt;
&lt;path class=&quot;ln&quot; d=&quot;M5 26H205&quot;/&gt;&lt;text class=&quot;ts tc&quot; x=&quot;105&quot; y=&quot;18&quot;&gt;before defects&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M215 26H415&quot;/&gt;&lt;text class=&quot;ts tc&quot; x=&quot;315&quot; y=&quot;18&quot;&gt;because of defects&lt;/text&gt;
&lt;g class=&quot;n h-ar&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;36&quot; width=&quot;95&quot; height=&quot;84&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;52&quot; y=&quot;66&quot; style=&quot;font-size:13px&quot;&gt;Prevention&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;52&quot; y=&quot;86&quot;&gt;avoid&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;52&quot; y=&quot;102&quot;&gt;defects&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;n h-ar&quot;&gt;&lt;rect x=&quot;110&quot; y=&quot;36&quot; width=&quot;95&quot; height=&quot;84&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;157&quot; y=&quot;66&quot; style=&quot;font-size:13px&quot;&gt;Appraisal&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;157&quot; y=&quot;86&quot;&gt;find them&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;157&quot; y=&quot;102&quot;&gt;by inspection&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;n h-ma&quot;&gt;&lt;rect x=&quot;215&quot; y=&quot;36&quot; width=&quot;95&quot; height=&quot;84&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;262&quot; y=&quot;56&quot; style=&quot;font-size:13px&quot;&gt;Internal&lt;/text&gt;&lt;text class=&quot;t tc&quot; x=&quot;262&quot; y=&quot;72&quot; style=&quot;font-size:13px&quot;&gt;failure&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;262&quot; y=&quot;92&quot;&gt;scrap, rework,&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;262&quot; y=&quot;108&quot;&gt;downtime&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;n h-ma&quot;&gt;&lt;rect x=&quot;320&quot; y=&quot;36&quot; width=&quot;95&quot; height=&quot;84&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;367&quot; y=&quot;56&quot; style=&quot;font-size:13px&quot;&gt;External&lt;/text&gt;&lt;text class=&quot;t tc&quot; x=&quot;367&quot; y=&quot;72&quot; style=&quot;font-size:13px&quot;&gt;failure&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;367&quot; y=&quot;88&quot;&gt;warranty,&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;367&quot; y=&quot;101&quot;&gt;recalls,&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;367&quot; y=&quot;114&quot;&gt;lost sales&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M315 30V150&quot; stroke-dasharray=&quot;4 3&quot;/&gt;
&lt;path class=&quot;ln&quot; d=&quot;M5 140H415&quot; marker-end=&quot;url(#ah)&quot;/&gt;
&lt;text class=&quot;ts tc&quot; x=&quot;315&quot; y=&quot;170&quot;&gt;shipment to customer&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;5&quot; y=&quot;160&quot;&gt;time and damage grow&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Diagram based on slide 26. The earlier a defect is intercepted, the less it costs. &lt;span class=&quot;tag i&quot;&gt;the reading over time is an addition&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;f&quot;&gt;Cost of quality = Prevention + Appraisal + Internal failure + External failure&lt;/div&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card line&quot;&gt;&lt;h4&gt;Prevention costs&lt;/h4&gt;&lt;p&gt;Support activities that aim to stop the defect from arising.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line&quot;&gt;&lt;h4&gt;Appraisal costs&lt;/h4&gt;&lt;p&gt;Inspection costs: incurred to find defective products before they reach customers.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line&quot;&gt;&lt;h4&gt;Internal failure costs&lt;/h4&gt;&lt;p&gt;From defects found &lt;b&gt;before&lt;/b&gt; shipment: scrap, rework, downtime.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card line&quot;&gt;&lt;h4&gt;External failure costs&lt;/h4&gt;&lt;p&gt;When the defect reaches the customer: warranty, recalls, lost sales.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note ext read&quot;&gt;&lt;span class=&quot;tag e&quot;&gt;external source&lt;/span&gt;&lt;p&gt;ASQ, the American Society for Quality, uses the same four categories and often groups them: prevention and appraisal as the cost of good quality, internal and external failure as the cost of poor quality. &lt;a href=&quot;https://www.asq.org/quality-resources/cost-of-quality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ASQ, Cost of quality&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3&gt;Spend a little more before, lose much less after&lt;/h3&gt;
&lt;p&gt;A good quality programme makes extra investments in prevention and appraisal that are &lt;b&gt;more than offset&lt;/b&gt; by the fall in failure costs: the total declines. Over time appraisal should decline too, because if defects are prevented at source there is less to inspect. &lt;span class=&quot;src&quot;&gt;slide 27&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Try moving the slider.&lt;/p&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;div class=&quot;lab&quot;&gt;&lt;label class=&quot;sl-r&quot; for=&quot;coq-r&quot;&gt;&lt;span&gt;Prevention + appraisal&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;coq-r&quot; min=&quot;0&quot; max=&quot;300&quot; step=&quot;5&quot; value=&quot;50&quot;&gt;&lt;output id=&quot;coq-o&quot; for=&quot;coq-r&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 480 272&quot; role=&quot;img&quot; aria-label=&quot;Chart: as spending on prevention and appraisal increases, failure costs fall and the total declines to a minimum&quot;&gt;
&lt;g class=&quot;ln&quot; style=&quot;stroke:var(--rule);stroke-width:1&quot;&gt;&lt;path d=&quot;M50 166.7H450M50 93.3H450M50 20H450&quot;/&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M50 20V240H450&quot;/&gt;
&lt;text class=&quot;ts&quot; x=&quot;44&quot; y=&quot;244&quot; text-anchor=&quot;end&quot;&gt;0&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;44&quot; y=&quot;171&quot; text-anchor=&quot;end&quot;&gt;300&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;44&quot; y=&quot;97&quot; text-anchor=&quot;end&quot;&gt;600&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;44&quot; y=&quot;24&quot; text-anchor=&quot;end&quot;&gt;900&lt;/text&gt;
&lt;text class=&quot;ts tc&quot; x=&quot;50&quot; y=&quot;257&quot;&gt;0&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;183.3&quot; y=&quot;257&quot;&gt;100&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;316.7&quot; y=&quot;257&quot;&gt;200&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;450&quot; y=&quot;257&quot;&gt;300&lt;/text&gt;
&lt;polyline id=&quot;c-i&quot; fill=&quot;none&quot; stroke=&quot;oklch(58% .12 250)&quot; stroke-width=&quot;2.2&quot;/&gt;
&lt;polyline id=&quot;c-f&quot; fill=&quot;none&quot; stroke=&quot;oklch(58% .16 25)&quot; stroke-width=&quot;2.2&quot;/&gt;
&lt;polyline id=&quot;c-t&quot; fill=&quot;none&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;3&quot;/&gt;
&lt;line id=&quot;c-v&quot; y1=&quot;20&quot; y2=&quot;240&quot; stroke=&quot;var(--mut)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;
&lt;circle id=&quot;c-df&quot; r=&quot;5&quot; fill=&quot;oklch(58% .16 25)&quot;/&gt;&lt;circle id=&quot;c-dt&quot; r=&quot;5.5&quot; fill=&quot;var(--ink)&quot;/&gt;
&lt;/svg&gt;
&lt;div class=&quot;keys&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--ink)&quot;&gt;&lt;/i&gt;Total cost of quality&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:oklch(58% .16 25)&quot;&gt;&lt;/i&gt;Failure costs&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:oklch(58% .12 250)&quot;&gt;&lt;/i&gt;Prevention + appraisal&lt;/span&gt;&lt;span&gt;axis: k€&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ko&quot;&gt;
&lt;div&gt;&lt;b id=&quot;k-i&quot;&gt;&lt;/b&gt;&lt;span&gt;Prevention + appraisal&lt;/span&gt;&lt;/div&gt;
&lt;div&gt;&lt;b id=&quot;k-f&quot;&gt;&lt;/b&gt;&lt;span&gt;Failure costs&lt;/span&gt;&lt;/div&gt;
&lt;div&gt;&lt;b id=&quot;k-t&quot;&gt;&lt;/b&gt;&lt;span&gt;Total cost of quality&lt;/span&gt;&lt;/div&gt;
&lt;div&gt;&lt;b id=&quot;k-d&quot;&gt;&lt;/b&gt;&lt;span&gt;Compared with the start&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;out&quot; id=&quot;coq-msg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;figcaption&gt;&lt;span class=&quot;tag i&quot;&gt;addition&lt;/span&gt; Invented model to show the mechanism: failure costs = 900 × e&lt;sup&gt;−x/90&lt;/sup&gt;. The slides give neither curves nor a minimum point. The only rule in the slides is that the total should fall over time.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;p class=&quot;quote&quot;&gt;“Preventing defects is better than detecting them after they have occurred.”&lt;/p&gt;
&lt;p&gt;Every euro shifted from failures to prevention is a sign that the quality system is maturing. &lt;span class=&quot;src&quot;&gt;slide 28&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Self-check: what type of quality cost is it?&lt;/h3&gt;
&lt;div class=&quot;sorter&quot; data-opts=&quot;Prevention|Appraisal|Internal failure|External failure&quot;&gt;
&lt;p class=&quot;score&quot;&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li data-a=&quot;2&quot; data-w=&quot;Defect found before shipment (slide 26).&quot;&gt;Scrap of 200 units found defective on the shop floor&lt;/li&gt;
&lt;li data-a=&quot;3&quot; data-w=&quot;The defective product has already reached the customer (slide 26).&quot;&gt;Repairs under warranty&lt;/li&gt;
&lt;li data-a=&quot;1&quot; data-w=&quot;It serves to find defective items before the customer does (slide 26).&quot;&gt;Final product inspection&lt;/li&gt;
&lt;li data-a=&quot;0&quot; data-w=&quot;It serves to prevent the defect. Added example, consistent with slide 26.&quot;&gt;Quality course for operators&lt;/li&gt;
&lt;li data-a=&quot;3&quot; data-w=&quot;The disappointed customer does not buy again (slide 26). In practice it is an estimate.&quot;&gt;Lost sales due to poor reputation&lt;/li&gt;
&lt;li data-a=&quot;2&quot; data-w=&quot;Slide 26 lists downtime among internal failures: the line stops because of a defect.&quot;&gt;Downtime caused by a defective batch&lt;/li&gt;
&lt;li data-a=&quot;0&quot; data-w=&quot;It removes the cause at source. Added example.&quot;&gt;Redesigning a part so that it cannot be assembled incorrectly&lt;/li&gt;
&lt;li data-a=&quot;3&quot; data-w=&quot;The defect has left the company (slide 26).&quot;&gt;Recall of a model already sold&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-ar&quot; id=&quot;s6&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Section VI&lt;/span&gt;&lt;h2&gt;Quality cost reports&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slides 29–30. Showing where the quality money goes.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;p&gt;A &lt;b&gt;quality cost report&lt;/b&gt; details the company&#x27;s prevention, appraisal, internal and external failure costs. It is used to monitor progress in reducing the cost of quality, usually by comparing two or more periods. The structure has four points. &lt;span class=&quot;src&quot;&gt;slide 30&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;steps&quot; data-steps&gt;&lt;ol&gt;
&lt;li&gt;The &lt;b&gt;four categories&lt;/b&gt;, each with detail lines and a subtotal.&lt;/li&gt;
&lt;li&gt;A &lt;b&gt;grand total&lt;/b&gt;: the cost of quality.&lt;/li&gt;
&lt;li&gt;Each amount also as a &lt;b&gt;percentage&lt;/b&gt; of a base, usually total sales.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;One column per year&lt;/b&gt;, side by side.&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;h3&gt;A sample report&lt;/h3&gt;
&lt;p&gt;Invented data, in k€. Sales: 10,000 in year 1, 12,500 in year 2. &lt;span class=&quot;tag i&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;div class=&quot;ctl&quot; id=&quot;rep-tg&quot; role=&quot;group&quot; aria-label=&quot;Level of detail&quot; style=&quot;margin:0 0 .5rem&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;tog&quot; aria-pressed=&quot;true&quot;&gt;All rows&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;tog&quot; aria-pressed=&quot;false&quot;&gt;Subtotals only&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tw&quot; style=&quot;margin:.4rem 0&quot;&gt;&lt;table id=&quot;rep-t&quot;&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Year 1&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;% sales&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Year 2&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;% sales&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody id=&quot;rep-b&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;sb-r&quot;&gt;&lt;span&gt;Year 1&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;sb&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sb-r&quot;&gt;&lt;span&gt;Year 2&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;sb&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;keys&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:oklch(43% .1 250)&quot;&gt;&lt;/i&gt;Prevention&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:oklch(66% .09 250)&quot;&gt;&lt;/i&gt;Appraisal&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:oklch(62% .12 35)&quot;&gt;&lt;/i&gt;Internal failure&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:oklch(38% .1 28)&quot;&gt;&lt;/i&gt;External failure&lt;/span&gt;&lt;/div&gt;
&lt;/figure&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3&gt;How to read it&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;The mix has shifted.&lt;/b&gt; Prevention and appraisal rise from 150 to 230 (+80). Failures fall from 670 to 380 (−290).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;The investment is more than offset.&lt;/b&gt; +80 against −290: the total falls by 210, from 820 to 610.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;The percentage matters.&lt;/b&gt; Sales have grown, so the comparison in euros understates the progress: from 8.20% to 4.88% of sales.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;note int read&quot;&gt;&lt;span class=&quot;tag i&quot;&gt;addition&lt;/span&gt;&lt;p&gt;Some items must be estimated, such as lost sales, for which no invoice exists. A report may therefore understate the real cost of external failures.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Prevention 60, appraisal 90, internal 150, external 200, sales 5,000. What is the cost of quality, in absolute and percentage terms?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;60 + 90 + 150 + 200 = &lt;b&gt;500&lt;/b&gt;; 500 ÷ 5,000 = &lt;b&gt;10%&lt;/b&gt; of sales.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why use percentages when the amounts are already given?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;To compare periods with different volumes: a cost can rise in euros and fall relative to sales (slide 30).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In year 2 prevention rises. Is this bad news?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Not on its own. It is positive if failures fall by more and the total declines (slides 27 and 28).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-ar&quot; id=&quot;s7&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Section VII&lt;/span&gt;&lt;h2&gt;Time is a performance measure&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slides 31–35. The life of an order, measured.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;p&gt;An order passes through five phases. Only one adds value: &lt;b&gt;process time&lt;/b&gt;, when work is actually being done on the product (&lt;b&gt;value-added&lt;/b&gt;). Wait, inspection, move and queue are &lt;b&gt;non-value-added&lt;/b&gt;: they should be reduced as far as possible. &lt;span class=&quot;src&quot;&gt;slide 32&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Move the sliders. The initial values are invented and the calculation is the same as in the exercise below.&lt;/p&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;label class=&quot;sl-r&quot; for=&quot;t-wait&quot;&gt;&lt;span&gt;Wait&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;t-wait&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;9&quot;&gt;&lt;output id=&quot;o-wait&quot; for=&quot;t-wait&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;sl-r&quot; for=&quot;t-proc&quot;&gt;&lt;span&gt;Process&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;t-proc&quot; min=&quot;0.5&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;o-proc&quot; for=&quot;t-proc&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;sl-r&quot; for=&quot;t-insp&quot;&gt;&lt;span&gt;Inspection&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;t-insp&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.1&quot; value=&quot;0.4&quot;&gt;&lt;output id=&quot;o-insp&quot; for=&quot;t-insp&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;sl-r&quot; for=&quot;t-move&quot;&gt;&lt;span&gt;Move&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;t-move&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.1&quot; value=&quot;0.6&quot;&gt;&lt;output id=&quot;o-move&quot; for=&quot;t-move&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;sl-r&quot; for=&quot;t-queue&quot;&gt;&lt;span&gt;Queue&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;t-queue&quot; min=&quot;0&quot; max=&quot;20&quot; step=&quot;0.5&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;o-queue&quot; for=&quot;t-queue&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;tbar&quot; id=&quot;t-bar&quot; aria-hidden=&quot;true&quot;&gt;&lt;i class=&quot;seg0&quot;&gt;&lt;/i&gt;&lt;i class=&quot;seg1&quot;&gt;&lt;/i&gt;&lt;i class=&quot;seg2&quot;&gt;&lt;/i&gt;&lt;i class=&quot;seg3&quot;&gt;&lt;/i&gt;&lt;i class=&quot;seg4&quot;&gt;&lt;/i&gt;&lt;/div&gt;
&lt;div class=&quot;brk&quot; id=&quot;b-th&quot;&gt;Throughput time&lt;/div&gt;
&lt;div class=&quot;brk&quot; style=&quot;margin-top:0&quot;&gt;Delivery cycle time&lt;/div&gt;
&lt;div class=&quot;keys&quot;&gt;&lt;span&gt;&lt;i class=&quot;seg0&quot;&gt;&lt;/i&gt;Wait: order received, production not started&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;seg1&quot;&gt;&lt;/i&gt;Process: value-added&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;seg2&quot;&gt;&lt;/i&gt;Inspection&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;seg3&quot;&gt;&lt;/i&gt;Move&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;seg4&quot;&gt;&lt;/i&gt;Queue&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ko&quot;&gt;
&lt;div&gt;&lt;b id=&quot;k-th&quot;&gt;&lt;/b&gt;&lt;span&gt;Throughput time ↓&lt;/span&gt;&lt;/div&gt;
&lt;div&gt;&lt;b id=&quot;k-dc&quot;&gt;&lt;/b&gt;&lt;span&gt;Delivery cycle time ↓&lt;/span&gt;&lt;/div&gt;
&lt;div&gt;&lt;b id=&quot;k-mce&quot;&gt;&lt;/b&gt;&lt;span&gt;MCE ↑ (maximum 1)&lt;/span&gt;&lt;/div&gt;
&lt;div&gt;&lt;b id=&quot;k-nva&quot;&gt;&lt;/b&gt;&lt;span&gt;Non-value-added production&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;out&quot; id=&quot;t-msg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;/figure&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Throughput time&lt;/h4&gt;&lt;p&gt;Also called manufacturing cycle time: from the start of production until finished products are shipped. &lt;span class=&quot;src&quot;&gt;slide 33&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;f&quot; style=&quot;font-size:1.05rem;background:var(--paper)&quot;&gt;Process + Inspection + Move + Queue&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Delivery cycle time&lt;/h4&gt;&lt;p&gt;From order &lt;b&gt;received&lt;/b&gt; to products &lt;b&gt;shipped&lt;/b&gt;: this is the time the customer actually experiences. &lt;span class=&quot;src&quot;&gt;slide 34&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;f&quot; style=&quot;font-size:1.05rem;background:var(--paper)&quot;&gt;Wait time + Throughput time&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Manufacturing cycle efficiency&lt;/h4&gt;&lt;p&gt;MCE shows what share of throughput time is actual work. Maximum 1. &lt;span class=&quot;src&quot;&gt;slide 35&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;f&quot; style=&quot;font-size:1.05rem;background:var(--paper)&quot;&gt;Value-added time ÷ Throughput time&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;p&gt;The four components: &lt;b&gt;process&lt;/b&gt;, actual work; &lt;b&gt;inspection&lt;/b&gt;, checking that the product is not defective; &lt;b&gt;move&lt;/b&gt;, transporting materials or partly finished goods between workstations; &lt;b&gt;queue&lt;/b&gt;, waiting to be worked on, moved, inspected or shipped. &lt;b&gt;Wait time&lt;/b&gt; runs from receipt of the order to the start of production. It adds no value. &lt;span class=&quot;src&quot;&gt;slides 33 and 34&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;An MCE of 0.5 means that half of production time goes on inspections, moves and waiting. In many manufacturing companies MCE is &lt;b&gt;below 0.10&lt;/b&gt;: over 90% of the time in process adds no value. Companies that drastically cut wait time and non-value-added activities can raise customer satisfaction and profit together. &lt;span class=&quot;src&quot;&gt;slides 34 and 35&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;note warn read&quot;&gt;&lt;p&gt;&lt;b&gt;Exam trap.&lt;/b&gt; Wait time is part of delivery cycle time, but &lt;b&gt;not&lt;/b&gt; of throughput time, and therefore not of MCE. Reducing wait time improves what the customer experiences and leaves MCE unchanged.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3&gt;Worked example&lt;/h3&gt;
&lt;p&gt;Wait 9 days, process 2, inspection 0.4, move 0.6, queue 5. &lt;span class=&quot;tag i&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;steps&quot; data-steps&gt;&lt;ol&gt;
&lt;li&gt;&lt;b&gt;Throughput time&lt;/b&gt; = 2 + 0.4 + 0.6 + 5 = &lt;b&gt;8 days&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Delivery cycle time&lt;/b&gt; = 9 + 8 = &lt;b&gt;17 days&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;MCE&lt;/b&gt; = 2 ÷ 8 = &lt;b&gt;0.25&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Interpretation&lt;/b&gt;: 75% of throughput time adds no value. The longest block is wait, followed by queue: starting there yields more than speeding up the process.&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Process 1 day, inspection 0.5, move 0.5, queue 3, wait 5. Calculate the three values.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Throughput = 1 + 0.5 + 0.5 + 3 = &lt;b&gt;5 days&lt;/b&gt;. Delivery cycle = 5 + 5 = &lt;b&gt;10 days&lt;/b&gt;. MCE = 1 ÷ 5 = &lt;b&gt;0.20&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;The company eliminates wait time. What changes?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Delivery cycle time falls, while throughput time and MCE remain the same.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Can MCE reach 1? What would that mean?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In theory, yes: it would mean no inspection, move or queue time. Any non-value-added time keeps it below 1 (slide 35).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Inspection serves quality: why is it non-value-added?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because it does not transform the product: it only checks it. This is consistent with section V: if defects are prevented at source, there is less to inspect (slides 27 and 32).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-ar&quot; id=&quot;s8&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Section VIII&lt;/span&gt;&lt;h2&gt;Overall equipment effectiveness&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slides 36–38. Three ways in which a machine can disappoint.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;p&gt;&lt;b&gt;Overall equipment effectiveness&lt;/b&gt; (OEE) measures the productivity of a machine along three dimensions. It is widely used by lean manufacturers, producers that aim to eliminate waste. Goal: ↑. &lt;span class=&quot;src&quot;&gt;slide 37&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Utilisation&lt;/h4&gt;&lt;p&gt;Does the machine run when it could? Breakdowns and long setups leave it idle.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Actual run time ÷ Machine time available&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Efficiency&lt;/h4&gt;&lt;p&gt;When it runs, does it run at full speed? Minor stoppages slow it down.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Actual run rate ÷ Ideal run rate&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Quality&lt;/h4&gt;&lt;p&gt;Of what it produces, how much is free of defects?&lt;/p&gt;&lt;p&gt;&lt;b&gt;Defect free output ÷ Total output&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;f&quot;&gt;OEE = Utilisation rate × Efficiency rate × Quality rate&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;label class=&quot;sl-r&quot; for=&quot;oee-u&quot;&gt;&lt;span&gt;Utilisation&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;oee-u&quot; min=&quot;10&quot; max=&quot;100&quot; value=&quot;90&quot;&gt;&lt;output id=&quot;ov-u&quot; for=&quot;oee-u&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;sl-r&quot; for=&quot;oee-e&quot;&gt;&lt;span&gt;Efficiency&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;oee-e&quot; min=&quot;10&quot; max=&quot;100&quot; value=&quot;90&quot;&gt;&lt;output id=&quot;ov-e&quot; for=&quot;oee-e&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;sl-r&quot; for=&quot;oee-q&quot;&gt;&lt;span&gt;Quality&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;oee-q&quot; min=&quot;10&quot; max=&quot;100&quot; value=&quot;90&quot;&gt;&lt;output id=&quot;ov-q&quot; for=&quot;oee-q&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;nx&quot; data-oee=&quot;90,90,90&quot;&gt;90 / 90 / 90&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;nx&quot; data-oee=&quot;60,100,100&quot;&gt;60 / 100 / 100&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;nx&quot; data-oee=&quot;83,90,95&quot;&gt;83 / 90 / 95&lt;/button&gt;&lt;/div&gt;
&lt;svg class=&quot;narrow&quot; viewBox=&quot;0 0 460 236&quot; role=&quot;img&quot; aria-label=&quot;Four bars: available time at 100%, then what remains after utilisation, efficiency and quality&quot; style=&quot;margin-top:.7rem&quot;&gt;
&lt;path class=&quot;ln&quot; d=&quot;M15 205H445&quot;/&gt;
&lt;rect id=&quot;b0&quot; x=&quot;30&quot; width=&quot;80&quot; fill=&quot;var(--seg-wait)&quot;/&gt;&lt;rect id=&quot;b1&quot; x=&quot;140&quot; width=&quot;80&quot; fill=&quot;oklch(66% .09 250)&quot;/&gt;&lt;rect id=&quot;b2&quot; x=&quot;250&quot; width=&quot;80&quot; fill=&quot;oklch(54% .1 250)&quot;/&gt;&lt;rect id=&quot;b3&quot; x=&quot;360&quot; width=&quot;80&quot; fill=&quot;oklch(42% .1 250)&quot;/&gt;
&lt;text id=&quot;v0&quot; class=&quot;t tc num&quot; x=&quot;70&quot;&gt;&lt;/text&gt;&lt;text id=&quot;v1&quot; class=&quot;t tc num&quot; x=&quot;180&quot;&gt;&lt;/text&gt;&lt;text id=&quot;v2&quot; class=&quot;t tc num&quot; x=&quot;290&quot;&gt;&lt;/text&gt;&lt;text id=&quot;v3&quot; class=&quot;t tc num&quot; x=&quot;400&quot;&gt;&lt;/text&gt;
&lt;text class=&quot;ts tc&quot; x=&quot;70&quot; y=&quot;224&quot;&gt;Time available&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;180&quot; y=&quot;224&quot;&gt;× Utilisation&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;290&quot; y=&quot;224&quot;&gt;× Efficiency&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;400&quot; y=&quot;224&quot;&gt;× Quality = OEE&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;ko&quot;&gt;&lt;div&gt;&lt;b id=&quot;k-oee&quot;&gt;&lt;/b&gt;&lt;span&gt;OEE&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;k-weak&quot; style=&quot;font-size:1.2rem&quot;&gt;&lt;/b&gt;&lt;span&gt;Weakest rate&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;out&quot; id=&quot;oee-msg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;figcaption&gt;With three rates at 90%, OEE is 72.9%: slide 38 rounds it to 73%.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;note warn read&quot;&gt;&lt;p&gt;&lt;b&gt;A refinement.&lt;/b&gt; Slide 38 states that OEE is &lt;i&gt;always smaller&lt;/i&gt; than the weakest rate. Strictly speaking, it is less than &lt;b&gt;or equal to&lt;/b&gt; it: with 60 / 100 / 100, OEE is 60%. Try it with the second button.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3&gt;From raw data to OEE&lt;/h3&gt;
&lt;p&gt;A 480-minute shift. The machine runs for 400 minutes. Ideal speed is 1 unit per minute, actual speed 0.9. Output is 360 units, of which 342 are free of defects. &lt;span class=&quot;tag i&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;steps&quot; data-steps&gt;&lt;ol&gt;
&lt;li&gt;&lt;b&gt;Utilisation&lt;/b&gt; = 400 ÷ 480 = 0.833.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Efficiency&lt;/b&gt; = 0.9 ÷ 1 = 0.90.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Quality&lt;/b&gt; = 342 ÷ 360 = 0.95.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;OEE&lt;/b&gt; = 0.833 × 0.90 × 0.95 = &lt;b&gt;0.7125&lt;/b&gt;, that is, 71.25%.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Check&lt;/b&gt;: in 480 minutes the ideal machine would make 480 good units. It made 342, and 342 ÷ 480 = 71.25%. OEE is the share of good output relative to the theoretical maximum.&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;note ext read&quot;&gt;&lt;span class=&quot;tag e&quot;&gt;external source&lt;/span&gt;&lt;p&gt;OEE is associated with Seiichi Nakajima and Total Productive Maintenance (TPM). Outside the course, the same three components are often called availability, performance and quality. The frequently cited “world class” value is 85% (90% × 95% × 99%), but the same literature warns that OEE is not valid for comparing different plants. &lt;a href=&quot;https://mdpi.com/2076-3417/10/18/6469/htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Review in Applied Sciences, 2020&lt;/a&gt; · &lt;a href=&quot;https://www.emerson.com/is/content/emerson/en/corporate/shared-assets/documents/introduction-to-overall-equipment-effectiveness.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Introduction by Emerson (PDF)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Utilisation 80%, efficiency 75%, quality 100%. What is the OEE?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;0.80 × 0.75 × 1 = &lt;b&gt;60%&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Which rate does a long setup affect? And a series of minor stoppages?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The setup affects &lt;b&gt;utilisation&lt;/b&gt;, the minor stoppages affect &lt;b&gt;efficiency&lt;/b&gt; (slide 37).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why do three “good” rates give a disappointing OEE?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because they multiply: each loss acts on what remains after the others. Three rates at 90% give 0.9 × 0.9 × 0.9 = 72.9% (slide 38).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between MCE and OEE?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;MCE measures the time of a unit across the whole process, OEE the productivity of a single machine. Both are measures of the internal processes perspective (slide 17).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-ma&quot; id=&quot;s9&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Section IX&lt;/span&gt;&lt;h2&gt;Building a scorecard&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slides 39–41. Define the strategy, translate it into measures, link the measures by cause and effect.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Four steps&lt;/h3&gt;
&lt;div class=&quot;steps&quot; data-steps&gt;&lt;ol&gt;
&lt;li&gt;&lt;b&gt;Define the strategy.&lt;/b&gt; Name the target customers and the value proposition.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Choose measures.&lt;/b&gt; A few per perspective, each with a direction.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Link them in a strategy map.&lt;/b&gt; Draw the arrows and write each one as an if/then statement.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Test and reward.&lt;/b&gt; Collect the data, check the links and only later tie pay to the measures.&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;&lt;p class=&quot;cap&quot;&gt;Slide 40.&lt;/p&gt;
&lt;h3&gt;One company, three scorecards&lt;/h3&gt;
&lt;p&gt;An invented bicycle manufacturer. The measures come from slides 16–23. Objectives, targets and initiatives are examples. Changing the value proposition changes almost everything. &lt;span class=&quot;tag i&quot;&gt;addition&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Scorecard by value proposition&quot;&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Product leadership&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Operational excellence&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Customer intimacy&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;div data-sc=&quot;0&quot; class=&quot;tw&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;&lt;p class=&quot;next&quot; style=&quot;margin-top:.8rem&quot;&gt;&lt;b&gt;If/then:&lt;/b&gt; if training hours ↑, then defects ↓; if defects ↓ and new products ↑, then market share ↑; if market share ↑, then sales growth rate ↑.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;div data-sc=&quot;1&quot; class=&quot;tw&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;&lt;p class=&quot;next&quot; style=&quot;margin-top:.8rem&quot;&gt;&lt;b&gt;If/then:&lt;/b&gt; if improvement suggestions ↑, then waste ↓; if delivery cycle time ↓, then orders on time ↑; if orders on time ↑ and cost per unit ↓, then net operating income ↑.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;div data-sc=&quot;2&quot; class=&quot;tw&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;&lt;p class=&quot;next&quot; style=&quot;margin-top:.8rem&quot;&gt;&lt;b&gt;If/then:&lt;/b&gt; if employee turnover ↓, then complaints solved at first contact ↑; if these ↑, then defection rate ↓; if defection rate ↓ and share of wallet ↑, then contribution margin ↑.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3&gt;What makes a good if/then statement&lt;/h3&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;--tint:var(--acc-t)&quot;&gt;&lt;h4&gt;Weak&lt;/h4&gt;&lt;p class=&quot;quote&quot; style=&quot;margin:.2rem 0 .5rem;font-size:1.2rem;color:inherit&quot;&gt;“If employees are happier, the company will do better”.&lt;/p&gt;&lt;p&gt;Neither side is a measure, there is no direction, and nothing can be verified.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Strong&lt;/h4&gt;&lt;p class=&quot;quote&quot; style=&quot;margin:.2rem 0 .5rem;font-size:1.2rem;color:inherit&quot;&gt;“If employee turnover ↓, then the number of warranty claims ↓”.&lt;/p&gt;&lt;p&gt;Two named measures, a direction for each, an explainable mechanism: experienced staff make fewer mistakes.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;p&gt;&lt;b&gt;Checklist&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;slide 41&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Two specific measures.&lt;/li&gt;&lt;li&gt;A direction for each.&lt;/li&gt;&lt;li&gt;Usually from one perspective to the next.&lt;/li&gt;&lt;li&gt;A plausible reason.&lt;/li&gt;&lt;li&gt;Data that can actually be collected.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3&gt;Using the scorecard to evaluate the strategy&lt;/h3&gt;&lt;p&gt;This is the last learning objective. Indicate what is moving and read where the chain breaks. &lt;span class=&quot;tag i&quot;&gt;the tool is an addition; the criteria come from the cited slides&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;div class=&quot;diag&quot; id=&quot;diag&quot; role=&quot;group&quot; aria-label=&quot;Which levels are improving&quot;&gt;
&lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;&lt;b&gt;Financial&lt;/b&gt;&lt;span&gt;&lt;/span&gt;&lt;/button&gt;
&lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;&lt;b&gt;Customer&lt;/b&gt;&lt;span&gt;&lt;/span&gt;&lt;/button&gt;
&lt;button type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;&lt;b&gt;Internal processes&lt;/b&gt;&lt;span&gt;&lt;/span&gt;&lt;/button&gt;
&lt;button type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;&lt;b&gt;Learning and growth&lt;/b&gt;&lt;span&gt;&lt;/span&gt;&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;out&quot; id=&quot;diag-o&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/figure&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Self-check: weak or strong?&lt;/h3&gt;
&lt;div class=&quot;sorter&quot; data-opts=&quot;Weak|Strong&quot;&gt;
&lt;p class=&quot;score&quot;&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li data-a=&quot;1&quot; data-w=&quot;Two measures, two directions, a clear mechanism (slide 13).&quot;&gt;If training hours per employee ↑, then errors per order ↓&lt;/li&gt;
&lt;li data-a=&quot;0&quot; data-w=&quot;“Quality” and “love” are not measures and cannot be verified (slide 41).&quot;&gt;If we care about quality, customers will love us&lt;/li&gt;
&lt;li data-a=&quot;1&quot; data-w=&quot;From processes to customer, collectable measures, a plausible reason.&quot;&gt;If delivery cycle time ↓, then customer defection rate ↓&lt;/li&gt;
&lt;li data-a=&quot;0&quot; data-w=&quot;The measures are there, but it skips two perspectives and the mechanism is vague. The checklist usually requires one step at a time.&quot;&gt;If training hours per employee ↑, then earnings per share ↑&lt;/li&gt;
&lt;li data-a=&quot;0&quot; data-w=&quot;Morale is not specified as a measure and “the strategy works” cannot be verified.&quot;&gt;If morale rises, the strategy will work&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-ma&quot; id=&quot;s10&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;Section X&lt;/span&gt;&lt;h2&gt;Using the scorecard&lt;/h2&gt;&lt;p class=&quot;sl&quot;&gt;Slides 42–45. The link with pay, and the other stakeholders.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Tie pay to the scorecard, but not on day one&lt;/h3&gt;
&lt;p&gt;Bonuses can, and probably should, be tied to scorecard measures: otherwise the measures are likely to be ignored. This should happen, however, only after the organisation has been managed with the scorecard for some time, &lt;b&gt;perhaps a year or more&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 43&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 420 96&quot; role=&quot;img&quot; aria-label=&quot;Timeline: from day one the company is managed with the scorecard without bonuses; after about a year or more, bonuses are tied to it&quot;&gt;
&lt;rect class=&quot;n&quot; x=&quot;6&quot; y=&quot;30&quot; width=&quot;260&quot; height=&quot;30&quot; fill=&quot;var(--tint)&quot;/&gt;&lt;rect x=&quot;266&quot; y=&quot;30&quot; width=&quot;148&quot; height=&quot;30&quot; fill=&quot;var(--c)&quot;/&gt;
&lt;text class=&quot;ts tc&quot; x=&quot;136&quot; y=&quot;50&quot; style=&quot;fill:var(--ink)&quot;&gt;manage and test the links&lt;/text&gt;
&lt;text class=&quot;ts tc&quot; x=&quot;340&quot; y=&quot;50&quot; style=&quot;fill:var(--on)&quot;&gt;bonuses tied&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;6&quot; y=&quot;20&quot;&gt;day one&lt;/text&gt;&lt;text class=&quot;ts tc&quot; x=&quot;266&quot; y=&quot;20&quot;&gt;perhaps a year or more&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;6&quot; y=&quot;82&quot;&gt;first: reliable? sensible? understood? not manipulable?&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;read&quot;&gt;&lt;p&gt;First it is necessary to be sure that the measures are: &lt;b&gt;reliable&lt;/b&gt;, &lt;b&gt;sensible&lt;/b&gt;, &lt;b&gt;understood&lt;/b&gt; by the people being evaluated, and &lt;b&gt;not easily manipulated&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 43&lt;/span&gt;&lt;/p&gt;
&lt;h3&gt;Beyond shareholders&lt;/h3&gt;
&lt;p&gt;Companies must deliver financial results to shareholders, but they are also accountable to other &lt;b&gt;stakeholders&lt;/b&gt;, the parties with an interest in their performance. &lt;b&gt;Corporate social responsibility&lt;/b&gt; (CSR) means considering the needs of all stakeholders in decision-making. It goes beyond legal compliance and includes voluntary actions. &lt;span class=&quot;src&quot;&gt;slide 44&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;figure class=&quot;fig narrow&quot;&gt;
&lt;svg viewBox=&quot;0 0 420 256&quot; role=&quot;img&quot; aria-label=&quot;The company at the centre, connected to shareholders, customers, employees, suppliers, communities, environmental advocates and human rights advocates&quot;&gt;
&lt;path class=&quot;ln&quot; d=&quot;M210 160V40M210 160L152 87M210 160L152 157M210 160L152 227M210 160L268 87M210 160L268 157M210 160L268 227&quot;/&gt;
