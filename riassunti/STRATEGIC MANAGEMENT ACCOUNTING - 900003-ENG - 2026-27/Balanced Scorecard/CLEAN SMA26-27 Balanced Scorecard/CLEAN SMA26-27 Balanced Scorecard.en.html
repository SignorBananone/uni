&lt;g class=&quot;n&quot;&gt;&lt;rect x=&quot;135&quot; y=&quot;6&quot; width=&quot;150&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;210&quot; y=&quot;28&quot; style=&quot;font-size:12.5px&quot;&gt;Shareholders&lt;/text&gt;
&lt;rect x=&quot;2&quot; y=&quot;70&quot; width=&quot;150&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;77&quot; y=&quot;92&quot; style=&quot;font-size:12.5px&quot;&gt;Customers&lt;/text&gt;
&lt;rect x=&quot;2&quot; y=&quot;140&quot; width=&quot;150&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;77&quot; y=&quot;162&quot; style=&quot;font-size:12.5px&quot;&gt;Employees&lt;/text&gt;
&lt;rect x=&quot;2&quot; y=&quot;210&quot; width=&quot;150&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;77&quot; y=&quot;232&quot; style=&quot;font-size:12.5px&quot;&gt;Suppliers&lt;/text&gt;
&lt;rect x=&quot;268&quot; y=&quot;70&quot; width=&quot;150&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;343&quot; y=&quot;92&quot; style=&quot;font-size:12.5px&quot;&gt;Communities&lt;/text&gt;
&lt;rect x=&quot;268&quot; y=&quot;140&quot; width=&quot;150&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;343&quot; y=&quot;162&quot; style=&quot;font-size:11.5px&quot;&gt;Environmental advocates&lt;/text&gt;
&lt;rect x=&quot;268&quot; y=&quot;210&quot; width=&quot;150&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;343&quot; y=&quot;232&quot; style=&quot;font-size:11.5px&quot;&gt;Human rights advocates&lt;/text&gt;&lt;/g&gt;
&lt;circle cx=&quot;210&quot; cy=&quot;160&quot; r=&quot;42&quot; fill=&quot;var(--c)&quot;/&gt;&lt;text class=&quot;t tc&quot; x=&quot;210&quot; y=&quot;165&quot; style=&quot;fill:var(--on);font-size:13px&quot;&gt;Company&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;read&quot;&gt;&lt;h3&gt;Three ways of bringing CSR into the scorecard&lt;/h3&gt;&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;CSR formats&quot;&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;Inside the four boxes&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;A fifth perspective&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot;&gt;A separate scorecard&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Social and environmental measures are added to the existing perspectives.&lt;/p&gt;
&lt;svg class=&quot;narrow&quot; viewBox=&quot;0 0 300 50&quot; aria-hidden=&quot;true&quot;&gt;&lt;g fill=&quot;var(--tint2)&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;5&quot; width=&quot;70&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;76&quot; y=&quot;5&quot; width=&quot;70&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;152&quot; y=&quot;5&quot; width=&quot;70&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;228&quot; y=&quot;5&quot; width=&quot;70&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;/g&gt;&lt;g fill=&quot;var(--c)&quot;&gt;&lt;circle cx=&quot;35&quot; cy=&quot;25&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;111&quot; cy=&quot;25&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;187&quot; cy=&quot;25&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;263&quot; cy=&quot;25&quot; r=&quot;6&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;A category dedicated to a broader set of stakeholders is added.&lt;/p&gt;
&lt;svg class=&quot;narrow&quot; viewBox=&quot;0 0 300 50&quot; aria-hidden=&quot;true&quot;&gt;&lt;g fill=&quot;var(--tint2)&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;5&quot; width=&quot;54&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;60&quot; y=&quot;5&quot; width=&quot;54&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;120&quot; y=&quot;5&quot; width=&quot;54&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;180&quot; y=&quot;5&quot; width=&quot;54&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;/g&gt;&lt;rect x=&quot;240&quot; y=&quot;5&quot; width=&quot;58&quot; height=&quot;40&quot; rx=&quot;4&quot; fill=&quot;var(--c)&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;A dedicated scorecard is built for the social and environmental performance of the company or its suppliers.&lt;/p&gt;
&lt;svg class=&quot;narrow&quot; viewBox=&quot;0 0 300 50&quot; aria-hidden=&quot;true&quot;&gt;&lt;g fill=&quot;var(--tint2)&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;34&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;68&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;102&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;/g&gt;&lt;g fill=&quot;var(--c)&quot;&gt;&lt;rect x=&quot;168&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;202&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;236&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;270&quot; y=&quot;5&quot; width=&quot;30&quot; height=&quot;40&quot; rx=&quot;4&quot;/&gt;&lt;/g&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;p&gt;Whatever the format, two rules apply: link the measures with if/then statements and tie them to how senior managers are evaluated and rewarded. &lt;b&gt;Otherwise a proclaimed commitment may not lead to action&lt;/b&gt;: the stated commitment may remain a mere declaration. &lt;span class=&quot;src&quot;&gt;slide 45&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;note ext read&quot;&gt;&lt;span class=&quot;tag e&quot;&gt;external source&lt;/span&gt;&lt;p&gt;The European Commission defines CSR as “the responsibility of enterprises for their impacts on society”: a broader approach than voluntary action alone. &lt;a href=&quot;https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=celex%3A52011DC0681&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;COM(2011) 681&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa-b&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why not tie bonuses to the scorecard immediately?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because it is first necessary to know whether the measures are reliable, sensible, understood and not easily manipulated. Otherwise the wrong figure is rewarded (slide 43).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;And why tie them at all, sooner or later?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because otherwise the measures risk being ignored (slide 43).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What distinguishes CSR from compliance?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Compliance means obeying the law. CSR goes beyond it and includes voluntary actions, taking all stakeholders into account (slide 44).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;A company adds “CO₂ per unit ↓” to the internal processes perspective. Which format is this? What is missing for it to work?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It is &lt;i&gt;inside the four boxes&lt;/i&gt;. What is missing is an if/then statement linking the measure and a link to the evaluation of senior managers (slide 45).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part h-te&quot; id=&quot;formule&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;For revision&lt;/span&gt;&lt;h2&gt;All the formulas&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Measure&lt;/th&gt;&lt;th&gt;Formula&lt;/th&gt;&lt;th&gt;Goal&lt;/th&gt;&lt;th&gt;Origin&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Cost of quality&lt;/td&gt;&lt;td&gt;Prevention + Appraisal + Internal failure + External failure&lt;/td&gt;&lt;td&gt;↓&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 26&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Throughput time&lt;/td&gt;&lt;td&gt;Process + Inspection + Move + Queue&lt;/td&gt;&lt;td&gt;↓&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 33&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Delivery cycle time&lt;/td&gt;&lt;td&gt;Wait time + Throughput time&lt;/td&gt;&lt;td&gt;↓&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 34&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;MCE&lt;/td&gt;&lt;td&gt;Value-added time (process time) ÷ Throughput time&lt;/td&gt;&lt;td&gt;↑, max 1&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 35&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Utilisation rate&lt;/td&gt;&lt;td&gt;Actual run time ÷ Machine time available&lt;/td&gt;&lt;td&gt;↑&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 38&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Efficiency rate&lt;/td&gt;&lt;td&gt;Actual run rate ÷ Ideal run rate&lt;/td&gt;&lt;td&gt;↑&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 38&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Quality rate&lt;/td&gt;&lt;td&gt;Defect free output ÷ Total output&lt;/td&gt;&lt;td&gt;↑&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 38&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;OEE&lt;/td&gt;&lt;td&gt;Utilisation rate × Efficiency rate × Quality rate&lt;/td&gt;&lt;td&gt;↑&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 38&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Residual income&lt;/td&gt;&lt;td&gt;Net operating income − (Average operating assets × Minimum required rate of return)&lt;/td&gt;&lt;td&gt;↑&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag i&quot;&gt;addition&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;ROA · ROE&lt;/td&gt;&lt;td&gt;Net income ÷ Average total assets · Net income ÷ Average equity&lt;/td&gt;&lt;td&gt;↑&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag i&quot;&gt;addition&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EPS · P/E&lt;/td&gt;&lt;td&gt;Net income ÷ Number of shares · Share price ÷ EPS&lt;/td&gt;&lt;td&gt;↑&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag i&quot;&gt;addition&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;The formulas marked as additions are standard definitions with no source in the slides. Check for variants in the course textbook.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;part h-te&quot; id=&quot;fonti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-h&quot;&gt;&lt;span class=&quot;k&quot;&gt;End of lecture&lt;/span&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;
&lt;p&gt;&lt;b&gt;The slides cite only one explicit source&lt;/b&gt;, Treacy and Wiersema. The other titles are not in the slides: I searched for them because they address the ideas of the lecture. This entire section is &lt;span class=&quot;tag e&quot;&gt;external source&lt;/span&gt;. The searches returned catalogue entries and summaries, not the full texts, so the descriptions below should be checked against the originals.&lt;/p&gt;
&lt;/div&gt;
&lt;h3&gt;Cited in the slides&lt;/h3&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Treacy and Wiersema, “Customer Intimacy and Other Value Disciplines”&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;Harvard Business Review, January–February 1993, vol. 71 no. 1, pp. 84–93. Cited on slide 9.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; a study of more than 40 companies. Leaders such as Dell, Home Depot and Nike narrow their focus to one of the three value disciplines. The idea was later expanded in the book &lt;i&gt;The Discipline of Market Leaders&lt;/i&gt; (1995).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the origin of the three value propositions from which the whole scorecard starts.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://hbr.org/1993/01/customer-intimacy-and-other-value-disciplines&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Article page on HBR&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Not cited in the slides: origin of the concepts&lt;/h3&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Kaplan and Norton, “The Balanced Scorecard: Measures That Drive Performance”&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;Harvard Business Review, January–February 1992, pp. 71–79. Republished in 2005.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; financial measures complemented by three groups of operational measures. Here the fourth perspective is still called “innovation and learning”.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the article that launched the tool (sections I and II).&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://hbr.org/2005/07/the-balanced-scorecard-measures-that-drive-performance&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Reprint on HBR&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Kaplan and Norton, “Having Trouble with Your Strategy? Then Map It”&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;Harvard Business Review, September 2000. Later the book &lt;i&gt;Strategy Maps&lt;/i&gt; (2004).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; the adaptation of the scorecard into a strategy map, with the case of Mobil North American Marketing and Refining.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it expands on slide 14.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://store.hbr.org/product/having-trouble-with-your-strategy-then-map-it/R00509&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Listing on HBR Store&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Ittner and Larcker, “Coming Up Short on Nonfinancial Performance Measurement”&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;Harvard Business Review, 2003, vol. 81 no. 11, pp. 88–95. The link leads to a third-party summary.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; according to the summary, only 23% of the companies studied had built and verified causal models of performance, and these had a higher average ROA.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it gives substance to the idea that every arrow should be tested (slides 13 and 40).&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumIttnerLarcker03.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Summary on Management And Accounting Web&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;Nørreklit, “The balance on the balanced scorecard: a critical analysis of some of its assumptions”&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;Management Accounting Research, 2000, vol. 11 no. 1, pp. 65–88.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; a critical examination of the tool&#x27;s assumptions. Other authors cite it for the claim that the relationships between perspectives are not causal. I have not read the full text.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the counterweight to the chain presented as cause and effect, useful for a critical discussion.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://doi.org/10.1006/mare.1999.0121&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Article DOI&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;ASQ, “Cost of Quality”&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;American Society for Quality, reference page.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; definitions and examples of the four categories.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; useful for classifying the items of a quality cost report (sections V and VI).&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.asq.org/quality-resources/cost-of-quality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ASQ page&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;OEE: literature review and ISO 22400-2&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;Applied Sciences 2020, 10(18), 6469. ISO 22400-2:2014, under revision.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; the review compares the different approaches to OEE, whose origins are associated with Nakajima and TPM; the sources disagree on the exact date. The ISO standard lists manufacturing KPIs with formulas and units of measurement.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; OEE has no single definition: a study by Schiraldi and Varisco reports divergences between the ISO versions and Nakajima&#x27;s formulation. For the exam, use the one on slide 38.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://mdpi.com/2076-3417/10/18/6469/htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Review on MDPI&lt;/a&gt; · &lt;a href=&quot;https://www.iso.org/standard/54497.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ISO 22400-2&lt;/a&gt; · &lt;a href=&quot;https://art.torvergata.it/handle/2108/280082&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Schiraldi and Varisco&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;European Commission, COM(2011) 681&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;“A renewed EU strategy 2011-14 for Corporate Social Responsibility”, 25 October 2011. Also available in Italian.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; the definition of CSR as the responsibility of enterprises for their impacts on society, and the reference to international frameworks. The strategy covers the period 2011–14: it is a historical reference, not the current regulatory framework.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it provides an institutional definition to compare with the one on slide 44.&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=celex%3A52011DC0681&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex (English)&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/LexUriServ/LexUriServ.do?uri=COM%3A2011%3A0681%3AFIN%3AIT%3APDF&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF in Italian&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-item&quot;&gt;&lt;h4&gt;ISO 26000:2010, Guidance on social responsibility&lt;/h4&gt;&lt;p class=&quot;meta&quot;&gt;International Organization for Standardization.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Contents:&lt;/b&gt; guidelines on the concepts and core subjects of social responsibility. It contains no requirements and is not certifiable.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is a reference for choosing the CSR measures to include in a scorecard (slide 45).&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://www.iso.org/standard/42546.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ISO page&lt;/a&gt; &lt;span class=&quot;tag e&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Other course materials&lt;/h3&gt;
&lt;div class=&quot;note int read&quot;&gt;&lt;p&gt;This entire summary comes from the file &lt;i&gt;CLEAN SMA26-27 Balanced Scorecard.pdf&lt;/i&gt;. The folder &lt;i&gt;corso/&lt;/i&gt; also contains the subfolders &lt;i&gt;Budgeting&lt;/i&gt; and &lt;i&gt;Activity-Based Costing&lt;/i&gt;, but I was unable to open their files. Nothing here comes from them, and there may be other materials, such as the syllabus or exercises, that I have not seen. The connections with the other lectures therefore remain to be made.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;
&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;&lt;/div&gt;&lt;/footer&gt;
