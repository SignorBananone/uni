&lt;!-- ============ 1 ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;cos-e&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;01&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Definition and objectives&lt;/div&gt;&lt;h2&gt;What bibliographic research is&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;Before searching, you need to know &lt;em&gt;what&lt;/em&gt; you are doing: not “finding a few articles”, but collecting and critically evaluating what the literature has already said about a specific topic.&lt;/p&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;lbl&quot;&gt;Definition (slide 3)&lt;/b&gt;&lt;strong&gt;Bibliographic research&lt;/strong&gt; = the &lt;em&gt;collection&lt;/em&gt; and &lt;em&gt;critical analysis&lt;/em&gt; of publications — articles, books, &lt;span class=&quot;term&quot;&gt;conference proceedings&lt;/span&gt;, theses — in order to gather and evaluate the information already published in the literature on a specific topic.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;lbl&quot;&gt;Academic literature&lt;/b&gt;= &lt;span class=&quot;term&quot;&gt;peer-reviewed&lt;/span&gt; scholarly publications: before publication they have been anonymously assessed by other experts in the field (the “peers”), who check their methods and results. This filter is what distinguishes academic literature from blogs, newspapers or general websites.&lt;/div&gt;

&lt;div class=&quot;grid g2&quot;&gt;
&lt;div&gt;
&lt;h3 style=&quot;margin-top:.4em&quot;&gt;The four objectives&lt;/h3&gt;
&lt;details open&gt;&lt;summary&gt;Overview of existing knowledge &amp;amp; research trends&lt;/summary&gt;&lt;div&gt;Provide a picture of what is already known and of how the topic is evolving (which research streams are growing and which are fading).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Support arguments&lt;/summary&gt;&lt;div&gt;Provide evidence supporting the claims made in academic writing: every non-obvious statement must be backed by a source.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Identify gaps, controversies, open questions&lt;/summary&gt;&lt;div&gt;A &lt;span class=&quot;term&quot;&gt;research gap&lt;/span&gt; is a question the literature has not yet answered: this is where a new piece of work adds value.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Reduce the risk of duplication&lt;/summary&gt;&lt;div&gt;Avoid redoing what has already been done and ensure the originality of your own contribution.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;figure class=&quot;figure&quot; style=&quot;margin-top:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 420 230&quot; role=&quot;img&quot; aria-label=&quot;Three phases: finding, collection, evaluation&quot;&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
&lt;circle cx=&quot;70&quot; cy=&quot;95&quot; r=&quot;52&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot;/&gt;

&lt;circle cx=&quot;350&quot; cy=&quot;95&quot; r=&quot;52&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot;/&gt;

&lt;path d=&quot;M334,96 L345,107 L366,82&quot;/&gt;
&lt;/g&gt;
&lt;text x=&quot;70&quot; y=&quot;175&quot; font-weight=&quot;600&quot;&gt;FINDING&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;194&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;locating&lt;/text&gt;
&lt;text x=&quot;210&quot; y=&quot;175&quot; font-weight=&quot;600&quot;&gt;COLLECTION&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;194&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;gathering and organising&lt;/text&gt;
&lt;text x=&quot;350&quot; y=&quot;175&quot; font-weight=&quot;600&quot;&gt;EVALUATION&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;194&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;critical appraisal&lt;/text&gt;
&lt;path d=&quot;M124,95 L154,95M264,95 L294,95&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;The three actions of slide 3: bibliographic research does not end when you “find” something, but when you have evaluated it.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between “finding articles” and doing bibliographic research?&lt;/summary&gt;&lt;div&gt;Bibliographic research also includes the orderly collection and, above all, the &lt;em&gt;critical analysis&lt;/em&gt; of publications: assessing their relevance and quality with respect to a specific topic.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What makes a publication “academic” in the sense used in the lecture?&lt;/summary&gt;&lt;div&gt;The fact that it is &lt;strong&gt;peer-reviewed&lt;/strong&gt;, i.e. assessed by independent experts before publication.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is identifying gaps one of the objectives?&lt;/summary&gt;&lt;div&gt;Because the original contribution of a piece of work arises precisely from the open questions, controversies or gaps in the existing literature; without mapping them you also risk duplication.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;workflow&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;02&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;The process&lt;/div&gt;&lt;h2&gt;The steps of bibliographic research&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;Slides 4–6 describe a seven-stage process. Step through them: for each one you will find what to do and the typical mistake to avoid.&lt;/p&gt;

&lt;div class=&quot;figure stepper&quot; id=&quot;steps&quot; data-c&gt;
&lt;svg viewBox=&quot;0 0 980 120&quot; role=&quot;img&quot; aria-label=&quot;Seven steps in sequence&quot; id=&quot;stepsSvg&quot;&gt;
&lt;g id=&quot;stepNodes&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;stage card tint&quot; id=&quot;stepStage&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;stPrev&quot; aria-label=&quot;Previous step&quot;&gt;←&lt;/button&gt;&lt;div class=&quot;dots&quot; id=&quot;stDots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; id=&quot;stNext&quot; aria-label=&quot;Next step&quot;&gt;→&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Getting started: three cogs&lt;/h3&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;1 · Define the topic&lt;/h4&gt;Delimit the &lt;strong&gt;topic and scope&lt;/strong&gt;: what you are dealing with and what you are not (time period, sector, geographical area, type of organisation).&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;2 · Research question&lt;/h4&gt;A &lt;strong&gt;precise research question&lt;/strong&gt; guides the whole inquiry and becomes the criterion for deciding what is relevant.&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;3 · Relevant keywords&lt;/h4&gt;Key words and phrases to use &lt;strong&gt;in bibliographic databases&lt;/strong&gt;: main concepts, synonyms, variants.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;lbl&quot;&gt;Hint (slide 5)&lt;/b&gt;The more specific the keywords, the more focused and relevant the results, reducing &lt;span class=&quot;term&quot;&gt;noise&lt;/span&gt; (off-topic publications). Try the slider in section 3 to see the other side of the coin.&lt;/div&gt;

&lt;h3&gt;Exploration and exploitation&lt;/h3&gt;
&lt;p&gt;A practical strategy (slide 6): start with an &lt;strong&gt;exploratory search&lt;/strong&gt; to find a few highly relevant articles, then “exploit” them (&lt;span class=&quot;term&quot;&gt;exploitation&lt;/span&gt;) in two directions.&lt;/p&gt;
&lt;figure class=&quot;figure&quot;&gt;
&lt;svg viewBox=&quot;0 0 900 260&quot; role=&quot;img&quot; aria-label=&quot;Backward and forward citation searching around a seed article&quot;&gt;
&lt;line x1=&quot;40&quot; y1=&quot;215&quot; x2=&quot;860&quot; y2=&quot;215&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;2&quot;/&gt;

&lt;g fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;&gt;
&lt;rect x=&quot;70&quot; y=&quot;40&quot; width=&quot;110&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;rect x=&quot;90&quot; y=&quot;100&quot; width=&quot;110&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;rect x=&quot;60&quot; y=&quot;160&quot; width=&quot;110&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;
&lt;rect x=&quot;720&quot; y=&quot;40&quot; width=&quot;110&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;rect x=&quot;700&quot; y=&quot;100&quot; width=&quot;110&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;&lt;rect x=&quot;730&quot; y=&quot;160&quot; width=&quot;110&quot; height=&quot;34&quot; rx=&quot;6&quot;/&gt;
&lt;/g&gt;
&lt;rect x=&quot;380&quot; y=&quot;85&quot; width=&quot;140&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot;/&gt;
&lt;text x=&quot;450&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Seed article&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;exploratory search&lt;/text&gt;
&lt;g stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.6&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;&gt;
&lt;path d=&quot;M380,105 C300,80 240,60 182,57&quot;/&gt;&lt;path d=&quot;M380,117 L202,117&quot;/&gt;&lt;path d=&quot;M380,130 C300,160 240,175 172,177&quot;/&gt;
&lt;path d=&quot;M718,57 C640,60 580,80 522,105&quot;/&gt;&lt;path d=&quot;M698,117 L522,117&quot;/&gt;&lt;path d=&quot;M728,177 C640,175 580,160 522,130&quot;/&gt;
&lt;/g&gt;

&lt;text x=&quot;260&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;backward: works it cites&lt;/text&gt;
&lt;text x=&quot;640&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot; fill=&quot;var(--sage)&quot;&gt;→ Check the citations&lt;/text&gt;
&lt;text x=&quot;640&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;forward: later works citing it&lt;/text&gt;

&lt;figcaption&gt;&lt;span class=&quot;src sl&quot;&gt;explainer&lt;/span&gt; The technical terms are &lt;em&gt;backward&lt;/em&gt; and &lt;em&gt;forward citation searching&lt;/em&gt; (or “snowballing”). References lead to earlier publications; the citations received — visible in citation databases such as Scopus — show how the topic has evolved. Together they &lt;strong&gt;map the development and current landscape&lt;/strong&gt; of the research area. Years in the drawing are purely illustrative.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;What are the seven steps of slide 4, in order?&lt;/summary&gt;&lt;div&gt;Formulate a research question → identify relevant keywords → search academic databases and other reliable resources → refine the results → review abstracts to assess relevance → access the full-texts → save and organize citations.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why do you read abstracts before full-texts?&lt;/summary&gt;&lt;div&gt;Because the abstract lets you quickly judge the relevance of each publication: you only access the full text (which may take time and require subscriptions) for the ones that are truly relevant.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;I have found a perfect article from 2015. How do I apply exploration/exploitation?&lt;/summary&gt;&lt;div&gt;I read its references to discover earlier work (backward) and check who has cited it since 2015 (forward, in a citation database) to follow the evolution of the topic up to today.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;query&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;03&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Search strategies&lt;/div&gt;&lt;h2&gt;Building a search query&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;&lt;span class=&quot;term&quot;&gt;Boolean operators&lt;/span&gt; (named after the logician George Boole) are &lt;strong&gt;logical connectors&lt;/strong&gt; that combine or exclude keywords in databases: they make results more relevant and precise, save time and raise the quality of the search (slide 7).&lt;/p&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;lbl&quot;&gt;Hint (slide 7)&lt;/b&gt;Mastering the operators helps you balance two opposite risks: &lt;strong&gt;reducing irrelevant results&lt;/strong&gt; and &lt;strong&gt;not excluding something important&lt;/strong&gt;.&lt;/div&gt;

&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;figure&quot; style=&quot;margin:0&quot;&gt;
&lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; id=&quot;vennTabs&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-op=&quot;and&quot;&gt;AND&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-op=&quot;or&quot;&gt;OR&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-op=&quot;not&quot;&gt;NOT&lt;/button&gt;
&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 360 200&quot; role=&quot;img&quot; aria-label=&quot;Venn diagram of the selected operator&quot; style=&quot;margin-top:8px&quot;&gt;
&lt;defs&gt;

&lt;tr&gt;&lt;td&gt;&lt;strong&gt;OR&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;at least one → &lt;em&gt;broadens&lt;/em&gt; (synonyms)&lt;/td&gt;&lt;td&gt;&lt;code&gt;GDP OR gross domestic product&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;NOT&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;excludes a term&lt;/td&gt;&lt;td&gt;&lt;code&gt;investment NOT real estate&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;&quot; &quot;&lt;/strong&gt; quotes&lt;/td&gt;&lt;td&gt;exact phrase&lt;/td&gt;&lt;td&gt;&lt;code&gt;&quot;monetary policy&quot;&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;*&lt;/strong&gt; truncation&lt;/td&gt;&lt;td&gt;variants of the word stem&lt;/td&gt;&lt;td&gt;&lt;code&gt;econom*&lt;/code&gt; → economy, economic, economics&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;( )&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;groups terms, sets the order of evaluation&lt;/td&gt;&lt;td&gt;&lt;code&gt;(inflation OR deflation) AND GDP&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;src sl&quot;&gt;explainer&lt;/span&gt; In the slide&#x27;s OR example it is better to write &lt;code&gt;GDP OR &quot;gross domestic product&quot;&lt;/code&gt;: without quotation marks many databases read the three words separately. And use NOT with caution: it also excludes documents that mention the term only in passing.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Precision vs recall: how specific should you be?&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;src sl&quot;&gt;explainer&lt;/span&gt; The trade-off in the hint is measured by two classic information retrieval indicators:&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;def&quot; style=&quot;margin:0&quot;&gt;&lt;b class=&quot;lbl&quot;&gt;Precision&lt;/b&gt;= relevant records retrieved ÷ records retrieved. High precision = little &lt;em&gt;noise&lt;/em&gt;.&lt;/div&gt;
&lt;div class=&quot;def&quot; style=&quot;margin:0&quot;&gt;&lt;b class=&quot;lbl&quot;&gt;Recall&lt;/b&gt;= relevant records retrieved ÷ all relevant records that exist. High recall = nothing important is missed.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;figure&quot;&gt;
&lt;div class=&quot;slider-row&quot;&gt;&lt;label for=&quot;spec&quot;&gt;Query specificity&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;spec&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;specOut&quot;&gt;4&lt;/output&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;Chart of precision, recall and number of results as specificity varies&quot;&gt;
&lt;g stroke=&quot;var(--rule)&quot;&gt;&lt;line x1=&quot;60&quot; y1=&quot;20&quot; x2=&quot;60&quot; y2=&quot;220&quot;/&gt;&lt;line x1=&quot;60&quot; y1=&quot;220&quot; x2=&quot;620&quot; y2=&quot;220&quot;/&gt;&lt;/g&gt;
&lt;g font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;&lt;text x=&quot;60&quot; y=&quot;240&quot;&gt;generic (OR only, broad terms)&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;240&quot; text-anchor=&quot;end&quot;&gt;very specific (AND, &quot; &quot;, NOT)&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;24&quot; text-anchor=&quot;end&quot;&gt;100%&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;224&quot; text-anchor=&quot;end&quot;&gt;0&lt;/text&gt;&lt;/g&gt;
&lt;path id=&quot;cPrec&quot; fill=&quot;none&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;3&quot;/&gt;
&lt;path id=&quot;cRec&quot; fill=&quot;none&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;3&quot;/&gt;
&lt;path id=&quot;cN&quot; fill=&quot;none&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;5 4&quot;/&gt;
&lt;line id=&quot;cLine&quot; y1=&quot;20&quot; y2=&quot;220&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;
&lt;circle id=&quot;dPrec&quot; r=&quot;5&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;circle id=&quot;dRec&quot; r=&quot;5&quot; fill=&quot;var(--brick)&quot;/&gt;
&lt;g font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;&lt;text id=&quot;lP&quot; fill=&quot;var(--sage)&quot;&gt;precision&lt;/text&gt;&lt;text id=&quot;lR&quot; fill=&quot;var(--brick)&quot;&gt;recall&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;

&lt;p class=&quot;cap&quot;&gt;Stylised curves for teaching purposes (not real data); the dashed line is the number of results.&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Which operator do you use to include synonyms, and why?&lt;/summary&gt;&lt;div&gt;&lt;strong&gt;OR&lt;/strong&gt;: it returns documents containing at least one of the terms, so it broadens the search and avoids missing studies that use a different vocabulary.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Write a query for studies on the “balanced scorecard” in small and medium-sized enterprises, excluding the public sector.&lt;/summary&gt;&lt;div&gt;For example: &lt;code&gt;&quot;balanced scorecard&quot; AND (SME* OR &quot;small and medium&quot;) NOT &quot;public sector&quot;&lt;/code&gt;. The quotation marks keep the phrase together, truncation captures SME/SMEs, and the parentheses make the OR be evaluated before the AND.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What does &lt;code&gt;econom*&lt;/code&gt; find that &lt;code&gt;economy&lt;/code&gt; does not?&lt;/summary&gt;&lt;div&gt;All words sharing the same stem: economic, economics, economies, economist…&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;I make the query more specific: what happens to precision and recall?&lt;/summary&gt;&lt;div&gt;Precision usually rises (less noise) and recall falls (risk of excluding relevant studies). The goal is the balance indicated in the hint of slide 7.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;fonti&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;04&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Evaluating the sources&lt;/div&gt;&lt;h2&gt;Primary, secondary, tertiary&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;Not all sources carry the same weight. The hierarchy in slide 9 helps you &lt;strong&gt;prioritise the most relevant and original sources&lt;/strong&gt;.&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;figure class=&quot;figure&quot; style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 380 290&quot; role=&quot;img&quot; aria-label=&quot;Pyramid of sources&quot; id=&quot;pyr&quot;&gt;
&lt;a href=&quot;#&quot; data-lv=&quot;0&quot;&gt;&lt;path d=&quot;M190,20 L290,120 L90,120 Z&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--paper)&quot; style=&quot;fill:var(--paper)&quot;&gt;Primary&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#&quot; data-lv=&quot;1&quot;&gt;&lt;path d=&quot;M90,128 L290,128 L340,190 L40,190 Z&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.55&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Secondary&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#&quot; data-lv=&quot;2&quot;&gt;&lt;path d=&quot;M40,198 L340,198 L370,250 L10,250 Z&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.28&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;230&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Tertiary&lt;/text&gt;&lt;/a&gt;
&lt;text x=&quot;190&quot; y=&quot;278&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;most original at the top · most synthetic at the bottom&lt;/text&gt;
&lt;/svg&gt;
&lt;p class=&quot;cap&quot;&gt;Click a level.&lt;/p&gt;
&lt;/figure&gt;
&lt;div class=&quot;card tint&quot; id=&quot;pyrBox&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;&lt;span class=&quot;src sl&quot;&gt;explainer&lt;/span&gt; How to judge an individual source&lt;/summary&gt;&lt;div&gt;The final slide (take home) asks you to pay attention to &lt;strong&gt;publication dates, author and journal reputation&lt;/strong&gt;. In practice: is it recent, or a classic that is still cited? Who are the authors and where do they work? Is the journal peer-reviewed and indexed (Scopus, Web of Science)? Does it have indicators such as the Impact Factor in the Journal Citation Reports (see section 7)?&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Is a Eurostat dataset a primary, secondary or tertiary source?&lt;/summary&gt;&lt;div&gt;&lt;strong&gt;Primary&lt;/strong&gt;: it provides original data (the slide explicitly mentions datasets and official documents).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;A literature review published in a journal?&lt;/summary&gt;&lt;div&gt;&lt;strong&gt;Secondary&lt;/strong&gt;: it interprets, reviews and analyses primary sources.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why should you not cite a textbook as the main evidence in a thesis?&lt;/summary&gt;&lt;div&gt;It is a &lt;strong&gt;tertiary&lt;/strong&gt; source (a synthesis): useful for orientation, but evidence should be drawn from the original sources.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;prisma&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;05&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Systematic literature review&lt;/div&gt;&lt;h2&gt;PRISMA&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;When a literature review has to be &lt;span class=&quot;term&quot;&gt;systematic&lt;/span&gt; — that is, comprehensive, based on explicit rules and replicable by others — you need a standard way of reporting how it was carried out. This is what PRISMA provides.&lt;/p&gt;

&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;What is it?&lt;/h4&gt;
&lt;ul style=&quot;margin:.3em 0;padding-left:1.1em&quot;&gt;
&lt;li&gt;&lt;strong&gt;P&lt;/strong&gt;referred &lt;strong&gt;R&lt;/strong&gt;eporting &lt;strong&gt;I&lt;/strong&gt;tems for &lt;strong&gt;S&lt;/strong&gt;ystematic Reviews and &lt;strong&gt;M&lt;/strong&gt;eta-&lt;strong&gt;A&lt;/strong&gt;nalyses.&lt;/li&gt;
&lt;li&gt;A &lt;em&gt;reporting&lt;/em&gt; &lt;strong&gt;guideline framework&lt;/strong&gt; with a &lt;strong&gt;flow diagram&lt;/strong&gt; and a &lt;strong&gt;checklist&lt;/strong&gt;.&lt;/li&gt;
&lt;li&gt;First version in 2009, updated in 2021 with the &lt;em&gt;PRISMA 2020 Statement&lt;/em&gt;.&lt;/li&gt;
&lt;li&gt;Originating in the health sciences, now used in many disciplines (including management).&lt;/li&gt;
&lt;li&gt;Describes &lt;em&gt;how&lt;/em&gt; the review was planned and conducted.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Why use it?&lt;/h4&gt;
&lt;ul style=&quot;margin:.3em 0;padding-left:1.1em&quot;&gt;
&lt;li&gt;Helps &lt;strong&gt;define the scope&lt;/strong&gt; of the review for a comprehensive search.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Keeps track of the&lt;/strong&gt; inclusion and exclusion &lt;strong&gt;criteria&lt;/strong&gt;.&lt;/li&gt;
&lt;li&gt;Reports the process &lt;strong&gt;transparently&lt;/strong&gt;.&lt;/li&gt;
&lt;li&gt;Improves &lt;strong&gt;reproducibility&lt;/strong&gt; (another researcher can repeat the same search and obtain the same set of studies).&lt;/li&gt;
&lt;li&gt;Tracks the &lt;strong&gt;screening&lt;/strong&gt; and evaluation of sources.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Glossary: systematic review, meta-analysis, reporting guideline&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Systematic review&lt;/span&gt;: a review that follows an explicit protocol (question, sources, queries, criteria) to identify, select and appraise &lt;em&gt;all&lt;/em&gt; relevant studies. It differs from a &lt;em&gt;narrative review&lt;/em&gt;, where the choice of sources is discretionary.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Meta-analysis&lt;/span&gt;: the statistical combination of the results of several quantitative studies into a single estimate. Not all systematic reviews include one (the review in slide 12 ends with a &lt;em&gt;qualitative synthesis&lt;/em&gt;).&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Reporting guideline&lt;/span&gt;: PRISMA does not tell you how to &lt;em&gt;conduct&lt;/em&gt; the search, but what to &lt;em&gt;report&lt;/em&gt; so that it can be assessed and replicated.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;src sl&quot;&gt;explainer&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Interactive flow diagram&lt;/h3&gt;

&lt;rect x=&quot;0&quot; y=&quot;10&quot; width=&quot;34&quot; height=&quot;100&quot; rx=&quot;6&quot; fill=&quot;#d24fa7&quot; opacity=&quot;.85&quot;/&gt;&lt;rect x=&quot;0&quot; y=&quot;120&quot; width=&quot;34&quot; height=&quot;140&quot; rx=&quot;6&quot; fill=&quot;#86b832&quot; opacity=&quot;.9&quot;/&gt;&lt;rect x=&quot;0&quot; y=&quot;270&quot; width=&quot;34&quot; height=&quot;90&quot; rx=&quot;6&quot; fill=&quot;#e2a90c&quot; opacity=&quot;.9&quot;/&gt;&lt;rect x=&quot;0&quot; y=&quot;370&quot; width=&quot;34&quot; height=&quot;90&quot; rx=&quot;6&quot; fill=&quot;#3aa6b6&quot; opacity=&quot;.9&quot;/&gt;

&lt;/g&gt;

&lt;text x=&quot;505&quot; y=&quot;48&quot;&gt;Additional records identified&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;64&quot;&gt;through other sources&lt;/text&gt;&lt;text x=&quot;505&quot; y=&quot;82&quot; font-weight=&quot;700&quot; id=&quot;tOt&quot;&gt;&lt;/text&gt;

&lt;text x=&quot;300&quot; y=&quot;305&quot;&gt;Full-text articles assessed&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;320&quot;&gt;for eligibility&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;337&quot; font-weight=&quot;700&quot; id=&quot;tFa&quot;&gt;&lt;/text&gt;

&lt;div class=&quot;grid g4&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid #d24fa7&quot;&gt;&lt;h4&gt;Identification&lt;/h4&gt;Record the total number of records found across the different databases (and from other sources).&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid #86b832&quot;&gt;&lt;h4&gt;Screening&lt;/h4&gt;Track the duplicates removed and the records excluded on the basis of title, abstract, language, &lt;abbr title=&quot;Year Of Publication&quot;&gt;YOP&lt;/abbr&gt; (year of publication)…&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid #e2a90c&quot;&gt;&lt;h4&gt;Eligibility&lt;/h4&gt;Assess the full-texts and report the &lt;em&gt;reason&lt;/em&gt; for each exclusion (out of scope, insufficient detail, limited rigor).&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid #3aa6b6&quot;&gt;&lt;h4&gt;Included studies&lt;/h4&gt;Record the final number of included publications.&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The four phases of the diagram in the slide are those of the 2009 model. In the PRISMA 2020 template the “Eligibility” phase is merged into “Screening”, and the diagram distinguishes between “databases and registers” and “other methods” as sources; the official templates (new reviews and updates) are available at &lt;a href=&quot;https://www.prisma-statement.org/prisma-2020-flow-diagram&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;prisma-statement.org&lt;/a&gt;.&lt;/p&gt;

&lt;h3&gt;The 27-item checklist&lt;/h3&gt;
&lt;p&gt;Slide 13: use it as a &lt;strong&gt;step-by-step guide&lt;/strong&gt; to writing; it ensures that &lt;strong&gt;no important element is omitted&lt;/strong&gt; and covers every part of the report. The slide highlights &lt;strong&gt;item 7, Search strategy&lt;/strong&gt;: present the full queries for all databases, registers and websites, including filters and limits — exactly what you build in section 3.&lt;/p&gt;
&lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-group=&quot;ck&quot; style=&quot;--c:var(--slate)&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;ck1&quot;&gt;Title &amp;amp; Abstract&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;ck2&quot;&gt;Introduction&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;ck3&quot;&gt;Methods&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;ck4&quot;&gt;Results&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;ck5&quot;&gt;Discussion&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;ck6&quot;&gt;Other information&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;panel on&quot; id=&quot;ck1&quot;&gt;&lt;ol start=&quot;1&quot;&gt;&lt;li&gt;&lt;strong&gt;Title&lt;/strong&gt; — identify the report as a systematic review.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Abstract&lt;/strong&gt; — follow the PRISMA 2020 for Abstracts checklist.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;ck2&quot;&gt;&lt;ol start=&quot;3&quot;&gt;&lt;li&gt;&lt;strong&gt;Rationale&lt;/strong&gt; — justify the review in the context of existing knowledge.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Objectives&lt;/strong&gt; — state the objectives or questions explicitly.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;ck3&quot;&gt;&lt;ol start=&quot;5&quot;&gt;&lt;li&gt;&lt;strong&gt;Eligibility criteria&lt;/strong&gt; — inclusion/exclusion criteria.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Information sources&lt;/strong&gt; — all databases and sources consulted, with the date of the last search.&lt;/li&gt;&lt;li style=&quot;background:var(--slate-bg);border-radius:6px;padding:2px 6px&quot;&gt;&lt;strong&gt;Search strategy&lt;/strong&gt; — full queries, filters and limits (highlighted in the slide).&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Selection process&lt;/strong&gt; — who performed the screening, whether independently, and any automation tools used.&lt;/li&gt;&lt;li&gt;Data collection process&lt;/li&gt;&lt;li&gt;Data items&lt;/li&gt;&lt;li&gt;Study risk of bias assessment&lt;/li&gt;&lt;li&gt;Effect measures&lt;/li&gt;&lt;li&gt;Synthesis methods&lt;/li&gt;&lt;li&gt;Reporting bias assessment&lt;/li&gt;&lt;li&gt;Certainty assessment&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;ck4&quot;&gt;&lt;ol start=&quot;16&quot;&gt;&lt;li&gt;Study selection (this is where the flow diagram goes)&lt;/li&gt;&lt;li&gt;Study characteristics&lt;/li&gt;&lt;li&gt;Risk of bias in studies&lt;/li&gt;&lt;li&gt;Results of individual studies&lt;/li&gt;&lt;li&gt;Results of syntheses&lt;/li&gt;&lt;li&gt;Reporting biases&lt;/li&gt;&lt;li&gt;Certainty of evidence&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;ck5&quot;&gt;&lt;ol start=&quot;23&quot;&gt;&lt;li&gt;&lt;strong&gt;Discussion&lt;/strong&gt; — interpretation, limitations of the evidence and of the process, implications.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;ck6&quot;&gt;&lt;ol start=&quot;24&quot;&gt;&lt;li&gt;Registration and protocol&lt;/li&gt;&lt;li&gt;Support (funding)&lt;/li&gt;&lt;li&gt;Competing interests&lt;/li&gt;&lt;li&gt;Availability of data, code and other materials&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src sl&quot;&gt;from the slides&lt;/span&gt; items 1–8 (image in slide 13). &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; titles of items 9–27, from the &lt;a href=&quot;https://www.prisma-statement.org/prisma-2020-checklist&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PRISMA 2020 checklist&lt;/a&gt;; some items have sub-items. Check the exact wording in the official document.&lt;/p&gt;

&lt;h3&gt;Takeaways (slide 14)&lt;/h3&gt;
&lt;figure class=&quot;figure&quot;&gt;&lt;svg viewBox=&quot;0 0 760 210&quot; role=&quot;img&quot; aria-label=&quot;Funnel: from studies to the systematic review&quot;&gt;
&lt;path d=&quot;M40,30 L360,30 L250,140 L250,185 L150,185 L150,140 Z&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot;/&gt;
&lt;g fill=&quot;var(--slate)&quot;&gt;&lt;circle cx=&quot;90&quot; cy=&quot;18&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;140&quot; cy=&quot;10&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;200&quot; cy=&quot;16&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;260&quot; cy=&quot;9&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;310&quot; cy=&quot;17&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;170&quot; cy=&quot;52&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;230&quot; cy=&quot;60&quot; r=&quot;4&quot;/&gt;&lt;circle cx=&quot;200&quot; cy=&quot;200&quot; r=&quot;5&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;200&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Systematic review process&lt;/text&gt;
&lt;g font-size=&quot;13&quot;&gt;&lt;text x=&quot;400&quot; y=&quot;50&quot;&gt;&lt;tspan font-weight=&quot;700&quot;&gt;Flow diagram&lt;/tspan&gt;: visually maps the selection&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;68&quot; fill=&quot;var(--ink2)&quot;&gt;how many records collected, screened, excluded, included&lt;/text&gt;
&lt;text x=&quot;400&quot; y=&quot;108&quot;&gt;&lt;tspan font-weight=&quot;700&quot;&gt;27-item checklist&lt;/tspan&gt;: complete&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;126&quot; fill=&quot;var(--ink2)&quot;&gt;and standardised reporting&lt;/text&gt;
&lt;text x=&quot;400&quot; y=&quot;166&quot;&gt;&lt;tspan font-weight=&quot;700&quot;&gt;Outcome&lt;/tspan&gt;: transparency, efficiency&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;184&quot; fill=&quot;var(--ink2)&quot;&gt;and reproducibility of the review&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/figure&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;What does the acronym PRISMA stand for?&lt;/summary&gt;&lt;div&gt;Preferred Reporting Items for Systematic Reviews and Meta-Analyses.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In the example in slide 12: how many duplicates were removed and how many studies were included?&lt;/summary&gt;&lt;div&gt;1,965 + 23 = 1,988 records identified; after duplicate removal 1,981 remain, hence &lt;strong&gt;7 duplicates&lt;/strong&gt;. 1,981 − 1,935 excluded = 46 full-texts; 46 − 29 = &lt;strong&gt;17 included studies&lt;/strong&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;At which stage are the reasons for exclusion reported, and why there?&lt;/summary&gt;&lt;div&gt;At the &lt;strong&gt;Eligibility&lt;/strong&gt; stage, after reading the full-text: at that point exclusion is a substantive judgement (out of scope, insufficient detail, limited rigor) and must be justified for transparency.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Does PRISMA tell you which databases to use?&lt;/summary&gt;&lt;div&gt;No: it is a &lt;em&gt;reporting&lt;/em&gt; framework. It asks you to declare which sources and queries you used (items 6 and 7); it does not prescribe them.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6 ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;ai&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;06&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;AI for literary review&lt;/div&gt;&lt;h2&gt;AI assists, the human decides&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;Slide 15 divides the tasks: AI can speed up many stages, but control remains with the researcher — the &lt;span class=&quot;term&quot;&gt;human-in-the-loop&lt;/span&gt; principle (the human stays “in the loop” and validates every step).&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;AI can support&lt;/h4&gt;&lt;ul style=&quot;margin:.3em 0;padding-left:1.1em&quot;&gt;&lt;li&gt;turning a topic into &lt;strong&gt;searchable concepts&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;expanding keywords&lt;/strong&gt;, synonyms and &lt;span class=&quot;term&quot;&gt;controlled vocabulary&lt;/span&gt; (the standard terms a database uses to index subjects)&lt;/li&gt;&lt;li&gt;refining &lt;strong&gt;Boolean search strings&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;assisting with &lt;strong&gt;deduplication and screening&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;summarising&lt;/strong&gt; full-texts or extracting data to be checked&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Human in-the-loop&lt;/h4&gt;&lt;ul style=&quot;margin:.3em 0;padding-left:1.1em&quot;&gt;&lt;li&gt;&lt;strong&gt;defining the question&lt;/strong&gt; and checking the records&lt;/li&gt;&lt;li&gt;setting the inclusion and exclusion &lt;strong&gt;criteria&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;deciding eligibility&lt;/strong&gt; and resolving disagreements&lt;/li&gt;&lt;li&gt;assessing quality and &lt;span class=&quot;term&quot;&gt;risk of bias&lt;/span&gt; (the risk that a study&#x27;s design distorts its results)&lt;/li&gt;&lt;li&gt;&lt;strong&gt;verifying every citation&lt;/strong&gt;, every number and the PRISMA counts&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;lbl&quot;&gt;Transparency matters&lt;/b&gt;Always record &lt;strong&gt;how&lt;/strong&gt; you used AI, verify its output, and never upload confidential or sensitive research data without authorisation.&lt;/div&gt;

&lt;h3&gt;Game: AI or human?&lt;/h3&gt;
&lt;p&gt;For each task, choose who should be responsible for it according to the slide.&lt;/p&gt;
&lt;div class=&quot;sort&quot; id=&quot;sorter&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot; id=&quot;sortScore&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;An AI assistant suggests 40 references for your review. What must you do before using them?&lt;/summary&gt;&lt;div&gt;Verify &lt;strong&gt;every citation&lt;/strong&gt; (that it exists and says what is attributed to it) and track them in the PRISMA count; document how the AI was used.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why are inclusion criteria not delegated to AI?&lt;/summary&gt;&lt;div&gt;Because they define the question and the validity of the review: they are substantive choices for which the researcher is accountable, like the eligibility decision and the risk of bias assessment.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7 ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;database&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;07&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Finding resources&lt;/div&gt;&lt;h2&gt;Academic databases&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;Where should you search? Not in a general-purpose search engine, but in academic databases with different functions (slide 16). Click a branch of the tree.&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;figure class=&quot;figure&quot; style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 420 300&quot; role=&quot;img&quot; aria-label=&quot;Tree of database types&quot; id=&quot;dbTree&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;125&quot; width=&quot;110&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;65&quot; y=&quot;155&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--paper)&quot;&gt;Databases&lt;/text&gt;
&lt;g stroke=&quot;var(--brick)&quot; stroke-width=&quot;1.6&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M120,150 L150,150 L150,40 L180,40M150,110 L180,110M150,150 L150,180 L180,180M150,180 L150,255 L180,255&quot;/&gt;&lt;/g&gt;
&lt;a href=&quot;#&quot; data-db=&quot;0&quot;&gt;&lt;rect x=&quot;180&quot; y=&quot;18&quot; width=&quot;225&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;292&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Bibliographic&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#&quot; data-db=&quot;1&quot;&gt;&lt;rect x=&quot;180&quot; y=&quot;88&quot; width=&quot;225&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;292&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Citation&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#&quot; data-db=&quot;2&quot;&gt;&lt;rect x=&quot;180&quot; y=&quot;158&quot; width=&quot;225&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;292&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Full-text*&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#&quot; data-db=&quot;3&quot;&gt;&lt;rect x=&quot;180&quot; y=&quot;233&quot; width=&quot;225&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;292&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Factual&lt;/text&gt;&lt;/a&gt;
&lt;/svg&gt;

&lt;/figure&gt;
&lt;div class=&quot;card tint&quot; id=&quot;dbBox&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Database Search and bibliometric indicators&lt;/h3&gt;
&lt;p&gt;From the library catalogue, the &lt;strong&gt;Database Search&lt;/strong&gt; function (slide 17) lets you search for a database by name (e.g. “Scopus”) or browse databases &lt;em&gt;by category&lt;/em&gt; (Business &amp;amp; Economics, Social Sciences…). In the &lt;em&gt;Bibliometric indicators &amp;amp; Rankings&lt;/em&gt; category you will find, besides Scopus, the &lt;strong&gt;Journal Citation Reports&lt;/strong&gt; (Clarivate), which provides relevance indicators for over 7,500 journals:&lt;/p&gt;
&lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-group=&quot;jcr&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;j1&quot;&gt;Impact Factor&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;j2&quot;&gt;Immediacy Index&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;j3&quot;&gt;Cited Half-Life&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel on&quot; id=&quot;j1&quot;&gt;&lt;p&gt;Measures how frequently a journal&#x27;s articles are cited. &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; Formula (JCR, year &lt;em&gt;Y&lt;/em&gt;):&lt;/p&gt;
&lt;div class=&quot;qbox&quot; style=&quot;text-align:center&quot;&gt;IF&lt;sub&gt;Y&lt;/sub&gt; = citations received in year Y by items published in Y−1 and Y−2 ÷ number of citable items published in Y−1 and Y−2&lt;/div&gt;
&lt;p&gt;Example: 600 citations in 2025 to articles from 2023–2024, of which there were 200 → IF&lt;sub&gt;2025&lt;/sub&gt; = 3.0. Do not compare IFs across different disciplines.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;j2&quot;&gt;&lt;p&gt;Measures how frequently a journal&#x27;s articles are cited &lt;strong&gt;in the same year&lt;/strong&gt; as their publication: how “quickly” a journal is taken up.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;j3&quot;&gt;&lt;p&gt;The number of years, counting back from the current year, that account for &lt;strong&gt;50% of the total citations&lt;/strong&gt; received by a journal in that year. A high value = articles cited over a long period (“long-lived” literature).&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between a citation database and a full-text database?&lt;/summary&gt;&lt;div&gt;A citation database tracks the &lt;strong&gt;references between publications&lt;/strong&gt; (who cites whom), like Scopus and Web of Science; a full-text database provides access to the &lt;strong&gt;complete text&lt;/strong&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;You need time series on the GDP of EU countries: what type of database do you look for?&lt;/summary&gt;&lt;div&gt;A &lt;strong&gt;factual database&lt;/strong&gt;: it collects primary data (economic, financial, statistical).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;A journal has IF = 4 in 2025. What does that mean?&lt;/summary&gt;&lt;div&gt;On average, the articles it published in 2023 and 2024 each received about 4 citations during 2025.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 8 ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;scopus&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;08&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Focus on&lt;/div&gt;&lt;h2&gt;Scopus&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;Elsevier&#x27;s abstract and citation database, presented in the catalogue as “the largest abstract and citation database of peer-reviewed literature” (slides 17–19).&lt;/p&gt;
&lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-group=&quot;sc&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;s1&quot;&gt;What is it&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;s2&quot;&gt;Coverage&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;s3&quot;&gt;Fields&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;s4&quot;&gt;Features&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;s5&quot;&gt;Update&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel on&quot; id=&quot;s1&quot;&gt;The largest &lt;strong&gt;multidisciplinary&lt;/strong&gt; database of peer-reviewed literature; it is also a tool for measuring scientific productivity and research impact.&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;s2&quot;&gt;Journals, books and conference proceedings. &lt;strong&gt;Note&lt;/strong&gt;: not all publications are indexed in Scopus — which is why the take home message asks you to use multiple databases.&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;s3&quot;&gt;Science, Technology, Medicine, Economy, Arts &amp;amp; Humanities.&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;s4&quot;&gt;Advanced search (Boolean operators, fields), &lt;strong&gt;citation tracking&lt;/strong&gt; (the forward citations of section 2), research analytics and &lt;strong&gt;alerts&lt;/strong&gt; (notifications when new documents matching a saved query are published: useful to “regularly review and update your search strategy”).&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;s5&quot;&gt;&lt;strong&gt;Daily&lt;/strong&gt; updates with new publications.&lt;/div&gt;

&lt;h3&gt;Scopus and Web of Science compared&lt;/h3&gt;
&lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Scopus&lt;/th&gt;&lt;th&gt;Web of Science&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Publisher&lt;/td&gt;&lt;td&gt;Elsevier&lt;/td&gt;&lt;td&gt;Clarivate&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Type (slide 16)&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;citation database: tracks the references between publications&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Title selection &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Independent Content Selection &amp;amp; Advisory Board; content from over 5,000 publishers&lt;/td&gt;&lt;td&gt;Core Collection organised into several citation indexes (sciences, social sciences, arts &amp;amp; humanities, emerging sources, books, proceedings)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Associated journal metrics &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Scopus&#x27;s own metrics&lt;/td&gt;&lt;td&gt;Journal Citation Reports / Impact Factor (calculated on WoS data)&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;External sources: &lt;a href=&quot;https://www.elsevier.com/products/scopus/content&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Elsevier – Scopus content&lt;/a&gt;; &lt;a href=&quot;https://webofscience.help.clarivate.com/Content/wos-core-collection/wos-core-collection.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Clarivate – Web of Science Core Collection&lt;/a&gt;.&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why is searching Scopus alone not enough?&lt;/summary&gt;&lt;div&gt;Because not all publications are indexed in it: comprehensive coverage requires multiple databases (e.g. Web of Science as well), and in a systematic review all of them must be declared (PRISMA item 6).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Which Scopus feature lets you follow the evolution of a topic after the seed article?&lt;/summary&gt;&lt;div&gt;&lt;strong&gt;Citation tracking&lt;/strong&gt; (“cited by”), i.e. forward citation searching; &lt;strong&gt;alerts&lt;/strong&gt; help you stay up to date.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 9 ============ --&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;lbl&quot;&gt;Hint (slide 18)&lt;/b&gt;Always access resources &lt;strong&gt;starting from the library services page&lt;/strong&gt;: this way you are recognised as an &lt;em&gt;authorized user&lt;/em&gt; even outside the university network.&lt;/div&gt;

&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Finding resources&lt;/h4&gt;Use &lt;strong&gt;BigSearch&lt;/strong&gt; to explore all the resources available through the library.&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Interlibrary services&lt;/h4&gt;&lt;span class=&quot;term&quot;&gt;ILL – Interlibrary Loan&lt;/span&gt; for books; &lt;span class=&quot;term&quot;&gt;DD – Document Delivery&lt;/span&gt; for chapters, articles and proceedings not held by the library.&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;You are at home and an article asks you to pay. What did you probably do wrong?&lt;/summary&gt;&lt;div&gt;You did not start from the library services page: by going through it and authenticating with your university credentials you gain access as an authorized user (if the university holds a subscription).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;The article is not covered by the university&#x27;s subscriptions. Which service do you use?&lt;/summary&gt;&lt;div&gt;&lt;strong&gt;Document Delivery&lt;/strong&gt; (for an entire book: Interlibrary Loan).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;p class=&quot;lede&quot;&gt;Slide 20 sums everything up as a path. Click the stages to link them to the sections.&lt;/p&gt;
&lt;figure class=&quot;figure&quot;&gt;

&lt;details&gt;&lt;summary&gt;&lt;span class=&quot;src sl&quot;&gt;course link&lt;/span&gt; Why is this lecture in the “Balanced Scorecard” folder?&lt;/summary&gt;&lt;div&gt;The file is located in &lt;code&gt;corso/Balanced Scorecard/25. SMA26-27 Bibliographic research and PRISMA/&lt;/code&gt;: the lecture provides the method for building the literature component on that topic (for example a review of balanced scorecard adoption), with documented queries and a PRISMA flow diagram. The other course materials could not be accessed from here, so this link is based solely on the folder name: check it against the syllabus.&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Final self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Put in order: refine results · formulate question · save citations · review abstracts · access full-text · keywords · search databases.&lt;/summary&gt;&lt;div&gt;Formulate question → keywords → search databases → refine results → review abstracts → access full-text → save citations.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Which three aspects of a source does the take home message ask you to keep an eye on?&lt;/summary&gt;&lt;div&gt;Publication date, author reputation and journal reputation.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What does PRISMA do that an ordinary search does not?&lt;/summary&gt;&lt;div&gt;It tracks and makes public every step of the screening (numbers and reasons), so that the review is transparent and reproducible.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;

&lt;!-- ============ Further reading ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;approfondire&quot; style=&quot;--c:var(--acc);--cb:var(--acc-bg)&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;→&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Further reading&lt;/div&gt;&lt;h2&gt;Texts, standards and websites cited&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;Each card concerns a resource mentioned in the slides. Details and links come from web research: they are &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;grid g2 refs&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;span class=&quot;src sl&quot;&gt;standard&lt;/span&gt;&lt;/span&gt;&lt;a href=&quot;https://doi.org/10.1136/bmj.n71&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Page M.J. et al. (2021), “The PRISMA 2020 statement: an updated guideline for reporting systematic reviews”, BMJ 372:n71&lt;/a&gt;&lt;p class=&quot;what&quot;&gt;This is the “PRISMA 2020 Statement paper” linked in slide 10. It replaces the 2009 version and includes the 27-item checklist, an expanded checklist, the checklist for abstracts and revised flow diagrams for new and updated reviews. Also published in PLoS Medicine 18(3): e1003583.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the reference to cite when you state that you follow PRISMA.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;span class=&quot;src sl&quot;&gt;guide&lt;/span&gt;&lt;/span&gt;&lt;a href=&quot;https://doi.org/10.1136/bmj.n160&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Page M.J. et al. (2021), “PRISMA 2020 explanation and elaboration”, BMJ 372:n160&lt;/a&gt;&lt;p class=&quot;what&quot;&gt;Companion document: explains each checklist item with examples of good reporting.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the practical user manual when you write the Methods section.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;span class=&quot;src sl&quot;&gt;historical standard&lt;/span&gt;&lt;/span&gt;&lt;a href=&quot;https://doi.org/10.1371/journal.pmed.1000097&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Moher D., Liberati A., Tetzlaff J., Altman D.G. &amp;amp; PRISMA Group (2009), PLoS Medicine 6(7): e1000097&lt;/a&gt;&lt;p class=&quot;what&quot;&gt;The first version of PRISMA (“first published in 2009”, slide 10): a 27-item checklist and a four-phase flow diagram — Identification, Screening, Eligibility, Included — the scheme shown in slide 12. It evolved from the QUOROM Statement (1999).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explains the origin of the diagram found in many reviews published before 2021.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;span class=&quot;src sl&quot;&gt;official website&lt;/span&gt;&lt;/span&gt;&lt;a href=&quot;https://www.prisma-statement.org/prisma-2020&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PRISMA Statement – prisma-statement.org&lt;/a&gt;&lt;p class=&quot;what&quot;&gt;Official website: papers, downloadable &lt;a href=&quot;https://www.prisma-statement.org/prisma-2020-checklist&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;checklists&lt;/a&gt; and &lt;a href=&quot;https://www.prisma-statement.org/prisma-2020-flow-diagram&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;flow diagrams&lt;/a&gt; (Word, PDF and a Shiny App) — these correspond to the “Flow diagram” and “Checklist” links in slide 11.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: this is where you download the templates to fill in for your review.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;span class=&quot;src sl&quot;&gt;database&lt;/span&gt;&lt;/span&gt;&lt;a href=&quot;https://www.elsevier.com/products/scopus/content&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scopus (Elsevier) – Content coverage&lt;/a&gt;&lt;p class=&quot;what&quot;&gt;Elsevier describes Scopus as a “source-neutral” abstract and citation database, with titles selected by an independent advisory board, content from over 5,000 publishers and daily updates. The Content Coverage Guide details what is indexed.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: knowing what is &lt;em&gt;not&lt;/em&gt; covered tells you when to use other databases alongside it.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;span class=&quot;src sl&quot;&gt;database&lt;/span&gt;&lt;/span&gt;&lt;a href=&quot;https://webofscience.help.clarivate.com/Content/wos-core-collection/wos-core-collection.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Web of Science Core Collection (Clarivate)&lt;/a&gt;&lt;p class=&quot;what&quot;&gt;The other citation database in slide 16. The Core Collection indexes journals, books and conference proceedings in several citation indexes; the number of indexes varies across sources, so the Clarivate page and the university licence are authoritative.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the data source from which the JCR and the Impact Factor are calculated.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;span class=&quot;src sl&quot;&gt;indicators&lt;/span&gt;&lt;/span&gt;&lt;a href=&quot;https://clarivate.libguides.com/jcr/basics&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Journal Citation Reports – Clarivate guide&lt;/a&gt;&lt;p class=&quot;what&quot;&gt;Explains the Journal Impact Factor (citations in the year to items from the two previous years ÷ citable items), category quartiles (Q1 = better than at least 75% of journals in the category) and the 5-year IF.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it helps assess the “journal reputation” of the take home message — bearing in mind that Clarivate itself advises against cross-disciplinary comparisons, and that DORA and the Leiden Manifesto advise against using journal metrics to evaluate individual articles.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;span class=&quot;src sl&quot;&gt;university services&lt;/span&gt;&lt;/span&gt;&lt;a href=&quot;https://servizibibliotecari.unibg.it/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Library services – University of Bergamo&lt;/a&gt;&lt;p class=&quot;what&quot;&gt;The starting point recommended in slide 18: BiGsearch (a single catalogue of books, journals, theses and electronic resources), access to electronic resources from home, ILL/DD, reference. See also the &lt;a href=&quot;https://servizibibliotecari.unibg.it/sites/biblio/files/libguide_ita.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;library guide (PDF)&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the only way to access resources as an authorized user off campus.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;

/* ---- stepper ---- */
var steps=[
 [&quot;Formulate a research question&quot;,&quot;Turn the topic into a precise, answerable question. It is the criterion against which you will judge everything else.&quot;,&quot;Typical mistake: starting from a vague topic (“the balanced scorecard”) instead of a question (“how is the BSC adapted in manufacturing SMEs?”).&quot;],
 [&quot;Identify relevant keywords&quot;,&quot;Extract the key concepts of the question and, for each one, the synonyms, variants and English terms used in the literature.&quot;,&quot;Typical mistake: using a single word per concept and missing studies that use a different vocabulary.&quot;],
 [&quot;Search academic databases and other reliable resources&quot;,&quot;Query several databases (bibliographic, citation, full-text) and reliable sources, always going through the library services page.&quot;,&quot;Typical mistake: stopping at a general-purpose search engine or a single database (the take home message asks for “multiple databases”).&quot;],
