&lt;!-- ============ 1 ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;cos-e&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;01&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Definizione e obiettivi&lt;/div&gt;&lt;h2&gt;Che cos&#x27;è la bibliographic research&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;Prima di cercare bisogna sapere &lt;em&gt;che cosa&lt;/em&gt; si sta facendo: non “trovare qualche articolo”, ma raccogliere e valutare criticamente ciò che la letteratura ha già detto su un tema preciso.&lt;/p&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;lbl&quot;&gt;Definizione (slide 3)&lt;/b&gt;&lt;strong&gt;Bibliographic research&lt;/strong&gt; (ricerca bibliografica) = &lt;em&gt;collection&lt;/em&gt; e &lt;em&gt;critical analysis&lt;/em&gt; di pubblicazioni — articoli, libri, &lt;span class=&quot;term&quot;&gt;conference proceedings&lt;/span&gt; (atti di convegno), tesi — per raccogliere e valutare l&#x27;informazione già pubblicata nella letteratura su un argomento specifico.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;lbl&quot;&gt;Academic literature&lt;/b&gt;= pubblicazioni scientifiche &lt;span class=&quot;term&quot;&gt;peer-reviewed&lt;/span&gt;: prima di essere pubblicate sono state valutate in forma anonima da altri esperti del settore (i “pari”), che ne verificano metodo e risultati. È questo filtro che distingue la letteratura accademica da blog, giornali o siti generici.&lt;/div&gt;

&lt;div class=&quot;grid g2&quot;&gt;
&lt;div&gt;
&lt;h3 style=&quot;margin-top:.4em&quot;&gt;I quattro obiettivi&lt;/h3&gt;
&lt;details open&gt;&lt;summary&gt;Overview of existing knowledge &amp;amp; research trends&lt;/summary&gt;&lt;div&gt;Dare un quadro di ciò che si sa già e di come il tema si sta muovendo (quali filoni crescono, quali si esauriscono).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Support arguments&lt;/summary&gt;&lt;div&gt;Fornire evidenze a sostegno delle tesi nella scrittura accademica: ogni affermazione non ovvia va appoggiata a una fonte.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Identify gaps, controversies, open questions&lt;/summary&gt;&lt;div&gt;Un &lt;span class=&quot;term&quot;&gt;research gap&lt;/span&gt; è una domanda a cui la letteratura non ha ancora risposto: è lì che un nuovo lavoro porta valore.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Reduce the risk of duplication&lt;/summary&gt;&lt;div&gt;Evitare di rifare ciò che è già stato fatto e garantire l&#x27;originalità del proprio contributo.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;figure class=&quot;figure&quot; style=&quot;margin-top:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 420 230&quot; role=&quot;img&quot; aria-label=&quot;Tre fasi: finding, collection, evaluation&quot;&gt;

&lt;text x=&quot;210&quot; y=&quot;175&quot; font-weight=&quot;600&quot;&gt;COLLECTION&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;194&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;raccogliere e organizzare&lt;/text&gt;
&lt;text x=&quot;350&quot; y=&quot;175&quot; font-weight=&quot;600&quot;&gt;EVALUATION&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;194&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;valutare criticamente&lt;/text&gt;

&lt;figcaption&gt;Le tre azioni della slide 3: la ricerca bibliografica non finisce quando si “trova”, ma quando si è valutato.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra “trovare articoli” e fare bibliographic research?&lt;/summary&gt;&lt;div&gt;La bibliographic research comprende anche la raccolta ordinata e soprattutto la &lt;em&gt;critical analysis&lt;/em&gt;: valutare pertinenza e qualità delle pubblicazioni rispetto a un tema specifico.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa rende “accademica” una pubblicazione nel senso della lezione?&lt;/summary&gt;&lt;div&gt;Il fatto di essere &lt;strong&gt;peer-reviewed&lt;/strong&gt;, cioè valutata da esperti indipendenti prima della pubblicazione.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché identificare i gap è uno degli obiettivi?&lt;/summary&gt;&lt;div&gt;Perché il contributo originale di un lavoro nasce proprio dalle domande aperte, dalle controversie o dalle lacune della letteratura esistente; senza mapparle si rischia anche la duplicazione.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;workflow&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;02&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Il processo&lt;/div&gt;&lt;h2&gt;I passi della ricerca bibliografica&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;Le slide 4–6 descrivono un percorso in sette tappe. Scorri i passi: per ciascuno trovi che cosa fare e l&#x27;errore tipico da evitare.&lt;/p&gt;

&lt;div class=&quot;figure stepper&quot; id=&quot;steps&quot; data-c&gt;
&lt;svg viewBox=&quot;0 0 980 120&quot; role=&quot;img&quot; aria-label=&quot;Sette passi in sequenza&quot; id=&quot;stepsSvg&quot;&gt;

&lt;/div&gt;

&lt;h3&gt;Getting started: tre ingranaggi&lt;/h3&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;1 · Define the topic&lt;/h4&gt;Delimita &lt;strong&gt;topic and scope&lt;/strong&gt;: di che cosa ti occupi e di che cosa no (periodo, settore, area geografica, tipo di organizzazione).&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;2 · Research question&lt;/h4&gt;Una &lt;strong&gt;precise research question&lt;/strong&gt; guida tutta l&#x27;indagine e diventa il criterio per decidere che cosa è pertinente.&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;3 · Relevant keywords&lt;/h4&gt;Parole e frasi chiave da usare &lt;strong&gt;nei bibliographic database&lt;/strong&gt;: concetti principali, sinonimi, varianti.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;lbl&quot;&gt;Hint (slide 5)&lt;/b&gt;Più le keyword sono specifiche, più i risultati sono focalizzati e pertinenti, riducendo il &lt;span class=&quot;term&quot;&gt;noise&lt;/span&gt; (“rumore”: pubblicazioni fuori tema). Prova il cursore nella sezione 3 per vedere il rovescio della medaglia.&lt;/div&gt;

&lt;h3&gt;Exploration and exploitation&lt;/h3&gt;
&lt;p&gt;Una strategia pratica (slide 6): parti da una &lt;strong&gt;exploratory search&lt;/strong&gt; per trovare pochi articoli molto pertinenti, poi “sfruttali” (&lt;span class=&quot;term&quot;&gt;exploitation&lt;/span&gt;) in due direzioni.&lt;/p&gt;
&lt;figure class=&quot;figure&quot;&gt;

&lt;text x=&quot;640&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;forward: chi ha citato lui dopo&lt;/text&gt;

&lt;figcaption&gt;&lt;span class=&quot;src sl&quot;&gt;approfondimento&lt;/span&gt; In gergo si parla di &lt;em&gt;backward&lt;/em&gt; e &lt;em&gt;forward citation searching&lt;/em&gt; (o “snowballing”). Le references portano a pubblicazioni precedenti; le citazioni ricevute — visibili nei citation database come Scopus — mostrano come il tema si è evoluto. Insieme &lt;strong&gt;mappano lo sviluppo e il panorama attuale&lt;/strong&gt; dell&#x27;area di ricerca. Anni nel disegno puramente illustrativi.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Quali sono, in ordine, i sette passi della slide 4?&lt;/summary&gt;&lt;div&gt;Formulate a research question → identify relevant keywords → search academic databases and other reliable resources → refine the results → review abstracts to assess relevance → access the full-texts → save and organize citations.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché si leggono gli abstract prima dei full-text?&lt;/summary&gt;&lt;div&gt;Perché l&#x27;abstract permette di giudicare rapidamente la pertinenza di ogni pubblicazione: si accede al testo completo (che può richiedere tempo e abbonamenti) solo per quelle davvero rilevanti.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Ho trovato un articolo perfetto del 2015. Come uso exploration/exploitation?&lt;/summary&gt;&lt;div&gt;Ne leggo le references per scoprire i lavori precedenti (backward) e controllo chi lo ha citato dopo il 2015 (forward, in un citation database) per seguire l&#x27;evoluzione del tema fino a oggi.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;query&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;03&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Search strategies&lt;/div&gt;&lt;h2&gt;Costruire una search query&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;I &lt;span class=&quot;term&quot;&gt;Boolean operators&lt;/span&gt; (operatori booleani, dal logico George Boole) sono &lt;strong&gt;logical connectors&lt;/strong&gt; che combinano o escludono keyword nei database: rendono i risultati più pertinenti e precisi, fanno risparmiare tempo e alzano la qualità della ricerca (slide 7).&lt;/p&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;lbl&quot;&gt;Hint (slide 7)&lt;/b&gt;Padroneggiare gli operatori aiuta a bilanciare due rischi opposti: &lt;strong&gt;ridurre i risultati irrilevanti&lt;/strong&gt; e &lt;strong&gt;non escludere qualcosa di importante&lt;/strong&gt;.&lt;/div&gt;

&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;figure&quot; style=&quot;margin:0&quot;&gt;

&lt;mask id=&quot;mNoB&quot;&gt;&lt;rect width=&quot;360&quot; height=&quot;200&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;210&quot; cy=&quot;100&quot; r=&quot;72&quot; fill=&quot;#000&quot;/&gt;&lt;/mask&gt;
&lt;mask id=&quot;mNoA&quot;&gt;&lt;rect width=&quot;360&quot; height=&quot;200&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;150&quot; cy=&quot;100&quot; r=&quot;72&quot; fill=&quot;#000&quot;/&gt;&lt;/mask&gt;

&lt;p class=&quot;cap&quot; id=&quot;vennCap&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;

&lt;div&gt;
&lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Strumento&lt;/th&gt;&lt;th&gt;A cosa serve&lt;/th&gt;&lt;th&gt;Esempio (slide 8)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;AND&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;tutti i termini → &lt;em&gt;restringe&lt;/em&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;inflation AND unemployment&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;OR&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;almeno uno → &lt;em&gt;allarga&lt;/em&gt; (sinonimi)&lt;/td&gt;&lt;td&gt;&lt;code&gt;GDP OR gross domestic product&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;NOT&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;esclude un termine&lt;/td&gt;&lt;td&gt;&lt;code&gt;investment NOT real estate&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;&quot; &quot;&lt;/strong&gt; quotes&lt;/td&gt;&lt;td&gt;frase esatta&lt;/td&gt;&lt;td&gt;&lt;code&gt;&quot;monetary policy&quot;&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;*&lt;/strong&gt; truncation&lt;/td&gt;&lt;td&gt;varianti della radice&lt;/td&gt;&lt;td&gt;&lt;code&gt;econom*&lt;/code&gt; → economy, economic, economics&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;( )&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;raggruppa, decide l&#x27;ordine&lt;/td&gt;&lt;td&gt;&lt;code&gt;(inflation OR deflation) AND GDP&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;src sl&quot;&gt;approfondimento&lt;/span&gt; Nell&#x27;esempio di OR della slide conviene scrivere &lt;code&gt;GDP OR &quot;gross domestic product&quot;&lt;/code&gt;: senza virgolette molti database leggono le tre parole separatamente. E usa NOT con prudenza: esclude anche i documenti che citano il termine solo di passaggio.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Laboratorio: prova le query su un mini-database&lt;/h3&gt;
&lt;p&gt;Dodici record &lt;em&gt;inventati&lt;/em&gt; a scopo didattico. Scegli una query: i record che soddisfano la condizione si accendono.&lt;/p&gt;

&lt;div id=&quot;qList&quot;&gt;&lt;/div&gt;

&lt;h3&gt;Precision vs recall: quanto essere specifici?&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;src sl&quot;&gt;approfondimento&lt;/span&gt; Il compromesso dell&#x27;hint si misura con due indicatori classici dell&#x27;information retrieval:&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;def&quot; style=&quot;margin:0&quot;&gt;&lt;b class=&quot;lbl&quot;&gt;Precision&lt;/b&gt;= record pertinenti trovati ÷ record trovati. Alta precision = poco &lt;em&gt;noise&lt;/em&gt;.&lt;/div&gt;
&lt;div class=&quot;def&quot; style=&quot;margin:0&quot;&gt;&lt;b class=&quot;lbl&quot;&gt;Recall&lt;/b&gt;= record pertinenti trovati ÷ tutti i record pertinenti esistenti. Alta recall = non perdo nulla di importante.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;figure&quot;&gt;
&lt;div class=&quot;slider-row&quot;&gt;&lt;label for=&quot;spec&quot;&gt;Specificità della query&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;spec&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;specOut&quot;&gt;4&lt;/output&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;Grafico di precision, recall e numero di risultati al variare della specificità&quot;&gt;
&lt;g stroke=&quot;var(--rule)&quot;&gt;&lt;line x1=&quot;60&quot; y1=&quot;20&quot; x2=&quot;60&quot; y2=&quot;220&quot;/&gt;&lt;line x1=&quot;60&quot; y1=&quot;220&quot; x2=&quot;620&quot; y2=&quot;220&quot;/&gt;&lt;/g&gt;
&lt;g font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;&lt;text x=&quot;60&quot; y=&quot;240&quot;&gt;generica (solo OR, termini ampi)&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;240&quot; text-anchor=&quot;end&quot;&gt;molto specifica (AND, &quot; &quot;, NOT)&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;24&quot; text-anchor=&quot;end&quot;&gt;100%&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;224&quot; text-anchor=&quot;end&quot;&gt;0&lt;/text&gt;&lt;/g&gt;
&lt;path id=&quot;cPrec&quot; fill=&quot;none&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;3&quot;/&gt;
&lt;path id=&quot;cRec&quot; fill=&quot;none&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;3&quot;/&gt;
&lt;path id=&quot;cN&quot; fill=&quot;none&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;5 4&quot;/&gt;
&lt;line id=&quot;cLine&quot; y1=&quot;20&quot; y2=&quot;220&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;
&lt;circle id=&quot;dPrec&quot; r=&quot;5&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;circle id=&quot;dRec&quot; r=&quot;5&quot; fill=&quot;var(--brick)&quot;/&gt;
&lt;g font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;&lt;text id=&quot;lP&quot; fill=&quot;var(--sage)&quot;&gt;precision&lt;/text&gt;&lt;text id=&quot;lR&quot; fill=&quot;var(--brick)&quot;&gt;recall&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;p class=&quot;cap&quot; id=&quot;specCap&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;cap&quot;&gt;Curve stilizzate a scopo didattico (non dati reali); la linea tratteggiata è il numero di risultati.&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Quale operatore usi per includere sinonimi, e perché?&lt;/summary&gt;&lt;div&gt;&lt;strong&gt;OR&lt;/strong&gt;: restituisce i documenti che contengono almeno uno dei termini, quindi allarga la ricerca evitando di perdere studi che usano un vocabolario diverso.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Scrivi una query per studi su “balanced scorecard” nelle piccole e medie imprese, escludendo il settore pubblico.&lt;/summary&gt;&lt;div&gt;Ad esempio: &lt;code&gt;&quot;balanced scorecard&quot; AND (SME* OR &quot;small and medium&quot;) NOT &quot;public sector&quot;&lt;/code&gt;. Le virgolette tengono insieme la frase, la truncation cattura SME/SMEs, le parentesi fanno valutare l&#x27;OR prima dell&#x27;AND.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Cosa trova &lt;code&gt;econom*&lt;/code&gt; che &lt;code&gt;economy&lt;/code&gt; non trova?&lt;/summary&gt;&lt;div&gt;Tutte le parole con la stessa radice: economic, economics, economies, economist…&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Rendo la query più specifica: cosa succede a precision e recall?&lt;/summary&gt;&lt;div&gt;Di solito la precision sale (meno noise) e la recall scende (rischio di escludere studi pertinenti). L&#x27;obiettivo è il bilanciamento indicato nell&#x27;hint della slide 7.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;fonti&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;04&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Evaluating the sources&lt;/div&gt;&lt;h2&gt;Primary, secondary, tertiary&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;Non tutte le fonti hanno lo stesso peso. La gerarchia della slide 9 aiuta a &lt;strong&gt;dare priorità alle fonti più rilevanti e originali&lt;/strong&gt;.&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;figure class=&quot;figure&quot; style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 380 290&quot; role=&quot;img&quot; aria-label=&quot;Piramide delle fonti&quot; id=&quot;pyr&quot;&gt;
&lt;a href=&quot;#&quot; data-lv=&quot;0&quot;&gt;&lt;path d=&quot;M190,20 L290,120 L90,120 Z&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; fill=&quot;var(--paper)&quot; style=&quot;fill:var(--paper)&quot;&gt;Primary&lt;/text&gt;&lt;/a&gt;

&lt;a href=&quot;#&quot; data-lv=&quot;2&quot;&gt;&lt;path d=&quot;M40,198 L340,198 L370,250 L10,250 Z&quot; fill=&quot;var(--ochre)&quot; opacity=&quot;.28&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;230&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Tertiary&lt;/text&gt;&lt;/a&gt;
&lt;text x=&quot;190&quot; y=&quot;278&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;più originale in alto · più sintetico in basso&lt;/text&gt;
&lt;/svg&gt;
&lt;p class=&quot;cap&quot;&gt;Clicca un livello.&lt;/p&gt;
&lt;/figure&gt;
&lt;div class=&quot;card tint&quot; id=&quot;pyrBox&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;&lt;span class=&quot;src sl&quot;&gt;approfondimento&lt;/span&gt; Come giudicare una singola fonte&lt;/summary&gt;&lt;div&gt;La slide finale (take home) chiede di essere attenti a &lt;strong&gt;publication dates, author and journal reputation&lt;/strong&gt;. In pratica: è recente o è un classico ancora citato? Chi sono gli autori e dove lavorano? La rivista è peer-reviewed e indicizzata (Scopus, Web of Science)? Ha indicatori come l&#x27;Impact Factor nel Journal Citation Reports (vedi sezione 7)?&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Un dataset Eurostat è una fonte primaria, secondaria o terziaria?&lt;/summary&gt;&lt;div&gt;&lt;strong&gt;Primaria&lt;/strong&gt;: fornisce dati originali (la slide cita esplicitamente datasets e official documents).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Una literature review pubblicata su rivista?&lt;/summary&gt;&lt;div&gt;&lt;strong&gt;Secondaria&lt;/strong&gt;: interpreta, rivede e analizza fonti primarie.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché non citare un manuale come prova principale in una tesi?&lt;/summary&gt;&lt;div&gt;È una fonte &lt;strong&gt;terziaria&lt;/strong&gt; (sintesi): utile per orientarsi, ma l&#x27;evidenza va presa dalle fonti originali.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;prisma&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;05&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Systematic literature review&lt;/div&gt;&lt;h2&gt;PRISMA&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;Quando la rassegna della letteratura deve essere &lt;span class=&quot;term&quot;&gt;systematic&lt;/span&gt; — cioè completa, con regole esplicite e ripetibile da altri — serve un modo standard per raccontare come è stata fatta. È ciò che offre PRISMA.&lt;/p&gt;

&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;What is it?&lt;/h4&gt;
&lt;ul style=&quot;margin:.3em 0;padding-left:1.1em&quot;&gt;
&lt;li&gt;&lt;strong&gt;P&lt;/strong&gt;referred &lt;strong&gt;R&lt;/strong&gt;eporting &lt;strong&gt;I&lt;/strong&gt;tems for &lt;strong&gt;S&lt;/strong&gt;ystematic Reviews and &lt;strong&gt;M&lt;/strong&gt;eta-&lt;strong&gt;A&lt;/strong&gt;nalyses.&lt;/li&gt;
&lt;li&gt;Un &lt;strong&gt;guideline framework&lt;/strong&gt; di &lt;em&gt;reporting&lt;/em&gt; con un &lt;strong&gt;flow diagram&lt;/strong&gt; e una &lt;strong&gt;checklist&lt;/strong&gt;.&lt;/li&gt;
&lt;li&gt;Prima versione 2009, aggiornata nel 2021 con il &lt;em&gt;PRISMA 2020 Statement&lt;/em&gt;.&lt;/li&gt;
&lt;li&gt;Nato nelle scienze della salute, oggi usato in molte discipline (anche management).&lt;/li&gt;
&lt;li&gt;Descrive &lt;em&gt;come&lt;/em&gt; la review è stata pianificata e condotta.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Why use it?&lt;/h4&gt;
&lt;ul style=&quot;margin:.3em 0;padding-left:1.1em&quot;&gt;
&lt;li&gt;Aiuta a &lt;strong&gt;definire lo scopo&lt;/strong&gt; della review per una ricerca completa.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Tiene traccia dei criteri&lt;/strong&gt; di inclusione ed esclusione.&lt;/li&gt;
&lt;li&gt;Riporta il processo in modo &lt;strong&gt;trasparente&lt;/strong&gt;.&lt;/li&gt;
&lt;li&gt;Migliora la &lt;strong&gt;reproducibility&lt;/strong&gt; (riproducibilità: un altro ricercatore può rifare la stessa ricerca e ottenere lo stesso insieme di studi).&lt;/li&gt;
&lt;li&gt;Traccia lo &lt;strong&gt;screening&lt;/strong&gt; e la valutazione delle fonti.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Glossario: systematic review, meta-analysis, reporting guideline&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Systematic review&lt;/span&gt;: rassegna che segue un protocollo esplicito (domanda, fonti, query, criteri) per identificare, selezionare e valutare &lt;em&gt;tutti&lt;/em&gt; gli studi pertinenti. Diversa dalla &lt;em&gt;narrative review&lt;/em&gt;, dove la scelta delle fonti è discrezionale.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Meta-analysis&lt;/span&gt;: combinazione statistica dei risultati di più studi quantitativi in una stima unica. Non tutte le systematic review la includono (quella della slide 12 termina con una &lt;em&gt;qualitative synthesis&lt;/em&gt;).&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Reporting guideline&lt;/span&gt;: PRISMA non dice come &lt;em&gt;fare&lt;/em&gt; la ricerca, ma cosa &lt;em&gt;riportare&lt;/em&gt; perché sia valutabile e ripetibile.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;src sl&quot;&gt;approfondimento&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Flow diagram interattivo&lt;/h3&gt;
&lt;p&gt;Il flow diagram “imbuto” registra quanti record entrano e quanti escono a ogni fase. I valori iniziali sono quelli dell&#x27;esempio della slide 12; muovi i cursori per vedere come i numeri si propagano.&lt;/p&gt;
&lt;div class=&quot;figure&quot; id=&quot;pf&quot;&gt;
&lt;div class=&quot;slider-row&quot;&gt;&lt;label for=&quot;pDb&quot;&gt;Record dai database&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pDb&quot; min=&quot;100&quot; max=&quot;4000&quot; step=&quot;5&quot; value=&quot;1965&quot;&gt;&lt;output id=&quot;oDb&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;slider-row&quot;&gt;&lt;label for=&quot;pOt&quot;&gt;Record da altre fonti&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pOt&quot; min=&quot;0&quot; max=&quot;200&quot; value=&quot;23&quot;&gt;&lt;output id=&quot;oOt&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;slider-row&quot;&gt;&lt;label for=&quot;pDu&quot;&gt;Duplicati rimossi&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pDu&quot; min=&quot;0&quot; max=&quot;800&quot; value=&quot;7&quot;&gt;&lt;output id=&quot;oDu&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;slider-row&quot;&gt;&lt;label for=&quot;pEx&quot;&gt;Esclusi da titolo/abstract&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pEx&quot; min=&quot;0&quot; max=&quot;4000&quot; value=&quot;1935&quot;&gt;&lt;output id=&quot;oEx&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;slider-row&quot;&gt;&lt;label for=&quot;pFt&quot;&gt;Esclusi al full-text&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pFt&quot; min=&quot;0&quot; max=&quot;200&quot; value=&quot;29&quot;&gt;&lt;output id=&quot;oFt&quot;&gt;&lt;/output&gt;&lt;/div&gt;

&lt;div class=&quot;grid g4&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid #d24fa7&quot;&gt;&lt;h4&gt;Identification&lt;/h4&gt;Annota il totale dei record trovati nei diversi database (e da altre fonti).&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid #86b832&quot;&gt;&lt;h4&gt;Screening&lt;/h4&gt;Traccia i duplicati rimossi e i record esclusi per titolo, abstract, lingua, &lt;abbr title=&quot;Year Of Publication&quot;&gt;YOP&lt;/abbr&gt; (anno di pubblicazione)…&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid #e2a90c&quot;&gt;&lt;h4&gt;Eligibility&lt;/h4&gt;Valuta i full-text e riporta il &lt;em&gt;motivo&lt;/em&gt; di ogni esclusione (out of scope, insufficient detail, limited rigor).&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid #3aa6b6&quot;&gt;&lt;h4&gt;Included studies&lt;/h4&gt;Registra il numero finale delle pubblicazioni incluse.&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Le quattro fasi del diagramma della slide sono quelle del modello 2009. Nel template PRISMA 2020 la fase “Eligibility” confluisce nello “Screening” e il diagramma distingue tra fonti “databases and registers” e “other methods”; i template ufficiali (nuove review e aggiornamenti) sono su &lt;a href=&quot;https://www.prisma-statement.org/prisma-2020-flow-diagram&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;prisma-statement.org&lt;/a&gt;.&lt;/p&gt;

&lt;h3&gt;La checklist da 27 item&lt;/h3&gt;
&lt;p&gt;Slide 13: usala come &lt;strong&gt;guida passo-passo&lt;/strong&gt; alla scrittura; garantisce che &lt;strong&gt;nessun elemento importante sia omesso&lt;/strong&gt; e copre ogni parte del report. La slide evidenzia l&#x27;&lt;strong&gt;item 7, Search strategy&lt;/strong&gt;: presentare le query complete per tutti i database, registri e siti, inclusi filtri e limiti — esattamente ciò che si costruisce nella sezione 3.&lt;/p&gt;
&lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-group=&quot;ck&quot; style=&quot;--c:var(--slate)&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;ck1&quot;&gt;Title &amp;amp; Abstract&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;ck2&quot;&gt;Introduction&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;ck3&quot;&gt;Methods&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;ck4&quot;&gt;Results&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;ck5&quot;&gt;Discussion&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;ck6&quot;&gt;Other information&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;panel on&quot; id=&quot;ck1&quot;&gt;&lt;ol start=&quot;1&quot;&gt;&lt;li&gt;&lt;strong&gt;Title&lt;/strong&gt; — identificare il report come systematic review.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Abstract&lt;/strong&gt; — seguire la checklist PRISMA 2020 for Abstracts.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;ck2&quot;&gt;&lt;ol start=&quot;3&quot;&gt;&lt;li&gt;&lt;strong&gt;Rationale&lt;/strong&gt; — motivare la review rispetto alle conoscenze esistenti.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Objectives&lt;/strong&gt; — dichiarare esplicitamente obiettivi o domande.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;ck3&quot;&gt;&lt;ol start=&quot;5&quot;&gt;&lt;li&gt;&lt;strong&gt;Eligibility criteria&lt;/strong&gt; — criteri di inclusione/esclusione.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Information sources&lt;/strong&gt; — tutti i database e le fonti consultate, con la data dell&#x27;ultima ricerca.&lt;/li&gt;&lt;li style=&quot;background:var(--slate-bg);border-radius:6px;padding:2px 6px&quot;&gt;&lt;strong&gt;Search strategy&lt;/strong&gt; — query complete, filtri e limiti (evidenziato nella slide).&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Selection process&lt;/strong&gt; — chi ha fatto lo screening, se in modo indipendente, eventuali strumenti di automazione.&lt;/li&gt;&lt;li&gt;Data collection process&lt;/li&gt;&lt;li&gt;Data items&lt;/li&gt;&lt;li&gt;Study risk of bias assessment&lt;/li&gt;&lt;li&gt;Effect measures&lt;/li&gt;&lt;li&gt;Synthesis methods&lt;/li&gt;&lt;li&gt;Reporting bias assessment&lt;/li&gt;&lt;li&gt;Certainty assessment&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;ck4&quot;&gt;&lt;ol start=&quot;16&quot;&gt;&lt;li&gt;Study selection (qui va il flow diagram)&lt;/li&gt;&lt;li&gt;Study characteristics&lt;/li&gt;&lt;li&gt;Risk of bias in studies&lt;/li&gt;&lt;li&gt;Results of individual studies&lt;/li&gt;&lt;li&gt;Results of syntheses&lt;/li&gt;&lt;li&gt;Reporting biases&lt;/li&gt;&lt;li&gt;Certainty of evidence&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;ck5&quot;&gt;&lt;ol start=&quot;23&quot;&gt;&lt;li&gt;&lt;strong&gt;Discussion&lt;/strong&gt; — interpretazione, limiti delle evidenze e del processo, implicazioni.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;ck6&quot;&gt;&lt;ol start=&quot;24&quot;&gt;&lt;li&gt;Registration and protocol&lt;/li&gt;&lt;li&gt;Support (finanziamenti)&lt;/li&gt;&lt;li&gt;Competing interests&lt;/li&gt;&lt;li&gt;Availability of data, code and other materials&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src sl&quot;&gt;dalle slide&lt;/span&gt; item 1–8 (immagine della slide 13). &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; titoli degli item 9–27, dalla &lt;a href=&quot;https://www.prisma-statement.org/prisma-2020-checklist&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PRISMA 2020 checklist&lt;/a&gt;; alcuni item hanno sotto-voci. Verifica la formulazione esatta sul documento ufficiale.&lt;/p&gt;

&lt;h3&gt;Takeaways (slide 14)&lt;/h3&gt;
&lt;figure class=&quot;figure&quot;&gt;&lt;svg viewBox=&quot;0 0 760 210&quot; role=&quot;img&quot; aria-label=&quot;Imbuto: dagli studi alla systematic review&quot;&gt;

&lt;text x=&quot;400&quot; y=&quot;166&quot;&gt;&lt;tspan font-weight=&quot;700&quot;&gt;Risultato&lt;/tspan&gt;: transparency, efficiency&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;184&quot; fill=&quot;var(--ink2)&quot;&gt;e reproducibility della review&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/figure&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Che cosa significa l&#x27;acronimo PRISMA?&lt;/summary&gt;&lt;div&gt;Preferred Reporting Items for Systematic Reviews and Meta-Analyses.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Nell&#x27;esempio della slide 12: quanti duplicati sono stati rimossi e quanti studi inclusi?&lt;/summary&gt;&lt;div&gt;1.965 + 23 = 1.988 record identificati; dopo i duplicati ne restano 1.981, quindi &lt;strong&gt;7 duplicati&lt;/strong&gt;. 1.981 − 1.935 esclusi = 46 full-text; 46 − 29 = &lt;strong&gt;17 studi inclusi&lt;/strong&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In quale fase si riportano le ragioni delle esclusioni, e perché proprio lì?&lt;/summary&gt;&lt;div&gt;Nella fase &lt;strong&gt;Eligibility&lt;/strong&gt;, dopo la lettura del full-text: a quel punto l&#x27;esclusione è una scelta di merito (out of scope, insufficient detail, limited rigor) e va giustificata per trasparenza.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;PRISMA ti dice quali database usare?&lt;/summary&gt;&lt;div&gt;No: è un framework di &lt;em&gt;reporting&lt;/em&gt;. Chiede di dichiarare quali fonti e quali query hai usato (item 6 e 7), non te le impone.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6 ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;ai&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;06&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;AI for literary review&lt;/div&gt;&lt;h2&gt;L&#x27;AI aiuta, l&#x27;umano decide&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;La slide 15 divide i compiti: l&#x27;AI può accelerare molte fasi, ma il controllo resta a chi fa la ricerca — il principio dello &lt;span class=&quot;term&quot;&gt;human-in-the-loop&lt;/span&gt; (l&#x27;umano resta “nel circuito” e valida ogni passaggio).&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;AI can support&lt;/h4&gt;&lt;ul style=&quot;margin:.3em 0;padding-left:1.1em&quot;&gt;&lt;li&gt;trasformare un topic in &lt;strong&gt;concetti ricercabili&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;espandere le keyword&lt;/strong&gt;, sinonimi e &lt;span class=&quot;term&quot;&gt;controlled vocabulary&lt;/span&gt; (i termini standard con cui un database indicizza gli argomenti)&lt;/li&gt;&lt;li&gt;raffinare le &lt;strong&gt;Boolean search strings&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;assistere &lt;strong&gt;deduplication e screening&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;riassumere&lt;/strong&gt; full-text o estrarre dati da controllare&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Human in-the-loop&lt;/h4&gt;&lt;ul style=&quot;margin:.3em 0;padding-left:1.1em&quot;&gt;&lt;li&gt;&lt;strong&gt;definire la domanda&lt;/strong&gt; e controllare i record&lt;/li&gt;&lt;li&gt;fissare i &lt;strong&gt;criteri&lt;/strong&gt; di inclusione ed esclusione&lt;/li&gt;&lt;li&gt;&lt;strong&gt;decidere l&#x27;eligibility&lt;/strong&gt; e risolvere i disaccordi&lt;/li&gt;&lt;li&gt;verificare qualità e &lt;span class=&quot;term&quot;&gt;risk of bias&lt;/span&gt; (rischio che il disegno di uno studio distorca i risultati)&lt;/li&gt;&lt;li&gt;&lt;strong&gt;verificare ogni citazione&lt;/strong&gt;, ogni numero e i conteggi PRISMA&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;lbl&quot;&gt;Transparency matters&lt;/b&gt;Registra sempre &lt;strong&gt;come&lt;/strong&gt; hai usato l&#x27;AI, verifica il suo output e non caricare mai dati di ricerca riservati o sensibili senza autorizzazione.&lt;/div&gt;

&lt;h3&gt;Gioco: AI o umano?&lt;/h3&gt;
&lt;p&gt;Per ogni attività, scegli chi deve averne la responsabilità secondo la slide.&lt;/p&gt;
&lt;div class=&quot;sort&quot; id=&quot;sorter&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot; id=&quot;sortScore&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Un assistente AI ti propone 40 riferimenti per la tua review. Cosa devi fare prima di usarli?&lt;/summary&gt;&lt;div&gt;Verificare &lt;strong&gt;ogni citazione&lt;/strong&gt; (che esista, che dica ciò che viene attribuito) e tracciarli nel conteggio PRISMA; documentare come l&#x27;AI è stata usata.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché i criteri di inclusione non si delegano all&#x27;AI?&lt;/summary&gt;&lt;div&gt;Perché definiscono la domanda e la validità della review: sono scelte di merito di cui il ricercatore risponde, come la decisione sull&#x27;eligibility e la valutazione del risk of bias.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7 ============ --&gt;

&lt;p class=&quot;lede&quot;&gt;Dove si cerca? Non su un motore generalista, ma in database accademici con funzioni diverse (slide 16). Clicca un ramo dell&#x27;albero.&lt;/p&gt;

&lt;a href=&quot;#&quot; data-db=&quot;1&quot;&gt;&lt;rect x=&quot;180&quot; y=&quot;88&quot; width=&quot;225&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;292&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Citation&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#&quot; data-db=&quot;2&quot;&gt;&lt;rect x=&quot;180&quot; y=&quot;158&quot; width=&quot;225&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;292&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Full-text*&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#&quot; data-db=&quot;3&quot;&gt;&lt;rect x=&quot;180&quot; y=&quot;233&quot; width=&quot;225&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;292&quot; y=&quot;260&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Factual&lt;/text&gt;&lt;/a&gt;
&lt;/svg&gt;
&lt;p class=&quot;cap&quot;&gt;* l&#x27;accesso al full-text dipende dagli abbonamenti dell&#x27;università.&lt;/p&gt;
&lt;/figure&gt;
&lt;div class=&quot;card tint&quot; id=&quot;dbBox&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Database Search e indicatori bibliometrici&lt;/h3&gt;
&lt;p&gt;Dal catalogo della biblioteca, la funzione &lt;strong&gt;Database Search&lt;/strong&gt; (slide 17) permette di cercare un database per nome (es. “Scopus”) o di sfogliarli &lt;em&gt;by category&lt;/em&gt; (Business &amp;amp; Economics, Social Sciences…). Nella categoria &lt;em&gt;Bibliometric indicators &amp;amp; Rankings&lt;/em&gt; compare, oltre a Scopus, il &lt;strong&gt;Journal Citation Reports&lt;/strong&gt; (Clarivate), che fornisce indicatori di rilevanza per oltre 7.500 riviste:&lt;/p&gt;
&lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-group=&quot;jcr&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;j1&quot;&gt;Impact Factor&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;j2&quot;&gt;Immediacy Index&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;j3&quot;&gt;Cited Half-Life&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel on&quot; id=&quot;j1&quot;&gt;&lt;p&gt;Misura la frequenza con cui gli articoli di una rivista ottengono citazioni. &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Formula (JCR, anno &lt;em&gt;Y&lt;/em&gt;):&lt;/p&gt;
&lt;div class=&quot;qbox&quot; style=&quot;text-align:center&quot;&gt;IF&lt;sub&gt;Y&lt;/sub&gt; = citazioni ricevute nell&#x27;anno Y dagli item pubblicati in Y−1 e Y−2 ÷ numero di citable items pubblicati in Y−1 e Y−2&lt;/div&gt;
&lt;p&gt;Esempio: 600 citazioni nel 2025 ad articoli del 2023–2024, che erano 200 → IF&lt;sub&gt;2025&lt;/sub&gt; = 3,0. Non confrontare IF di discipline diverse.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;j2&quot;&gt;&lt;p&gt;Misura la frequenza con cui gli articoli di una rivista vengono citati &lt;strong&gt;nello stesso anno&lt;/strong&gt; di pubblicazione: quanto “in fretta” una rivista viene recepita.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;j3&quot;&gt;&lt;p&gt;Il numero di anni, a ritroso dall&#x27;anno corrente, entro cui una rivista ottiene il &lt;strong&gt;50% delle citazioni&lt;/strong&gt; complessive di quell&#x27;anno. Valore alto = articoli citati a lungo (letteratura “longeva”).&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra un citation database e un full-text database?&lt;/summary&gt;&lt;div&gt;Il citation database traccia le &lt;strong&gt;references tra pubblicazioni&lt;/strong&gt; (chi cita chi), come Scopus e Web of Science; il full-text database dà accesso al &lt;strong&gt;testo integrale&lt;/strong&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Ti servono serie storiche sul PIL dei paesi UE: che tipo di database cerchi?&lt;/summary&gt;&lt;div&gt;Un &lt;strong&gt;factual database&lt;/strong&gt;: raccoglie dati primari (economici, finanziari, statistici).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Una rivista ha IF = 4 nel 2025. Cosa significa?&lt;/summary&gt;&lt;div&gt;In media, gli articoli pubblicati nel 2023 e nel 2024 hanno ricevuto circa 4 citazioni ciascuno nel corso del 2025.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 8 ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;scopus&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;08&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Focus on&lt;/div&gt;&lt;h2&gt;Scopus&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;Il database di abstract e citazioni di Elsevier, presentato nel catalogo come “il più grande database di abstract e citazioni di letteratura peer-reviewed” (slide 17–19).&lt;/p&gt;
&lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-group=&quot;sc&quot; style=&quot;--c:var(--brick)&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-p=&quot;s1&quot;&gt;What is it&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;s2&quot;&gt;Coverage&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;s3&quot;&gt;Fields&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;s4&quot;&gt;Features&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-p=&quot;s5&quot;&gt;Update&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel on&quot; id=&quot;s1&quot;&gt;Il più grande database &lt;strong&gt;multidisciplinare&lt;/strong&gt; di letteratura peer-reviewed; è anche uno strumento per misurare la produttività scientifica e l&#x27;impatto della ricerca.&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;s2&quot;&gt;Riviste, libri e conference proceedings. &lt;strong&gt;Attenzione&lt;/strong&gt;: non tutte le pubblicazioni sono indicizzate in Scopus — per questo la take home chiede di usare più database.&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;s3&quot;&gt;Science, Technology, Medicine, Economy, Arts &amp;amp; Humanities.&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;s4&quot;&gt;Ricerca avanzata (operatori booleani, campi), &lt;strong&gt;citation tracking&lt;/strong&gt; (le citazioni forward della sezione 2), analisi della ricerca e &lt;strong&gt;alert&lt;/strong&gt; (notifiche quando escono nuovi documenti che soddisfano una query salvata: utile per “regularly review and update your search strategy”).&lt;/div&gt;
&lt;div class=&quot;panel&quot; id=&quot;s5&quot;&gt;Aggiornamento &lt;strong&gt;giornaliero&lt;/strong&gt; con le nuove pubblicazioni.&lt;/div&gt;

&lt;h3&gt;Scopus e Web of Science a confronto&lt;/h3&gt;
&lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Scopus&lt;/th&gt;&lt;th&gt;Web of Science&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Editore&lt;/td&gt;&lt;td&gt;Elsevier&lt;/td&gt;&lt;td&gt;Clarivate&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Tipo (slide 16)&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;citation database: tracciano le references tra pubblicazioni&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Selezione dei titoli &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Content Selection &amp;amp; Advisory Board indipendente; contenuti da oltre 5.000 editori&lt;/td&gt;&lt;td&gt;Core Collection organizzata in più citation index (scienze, scienze sociali, arts &amp;amp; humanities, emerging sources, libri, proceedings)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Metriche di rivista collegate &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/td&gt;&lt;td&gt;metriche proprie di Scopus&lt;/td&gt;&lt;td&gt;Journal Citation Reports / Impact Factor (calcolati sui dati WoS)&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Fonti esterne: &lt;a href=&quot;https://www.elsevier.com/products/scopus/content&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Elsevier – Scopus content&lt;/a&gt;; &lt;a href=&quot;https://webofscience.help.clarivate.com/Content/wos-core-collection/wos-core-collection.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Clarivate – Web of Science Core Collection&lt;/a&gt;.&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché non basta cercare solo su Scopus?&lt;/summary&gt;&lt;div&gt;Perché non tutte le pubblicazioni vi sono indicizzate: per una copertura completa servono più database (es. anche Web of Science), e in una systematic review vanno tutti dichiarati (PRISMA item 6).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quale funzione di Scopus serve per seguire l&#x27;evoluzione di un tema dopo l&#x27;articolo seme?&lt;/summary&gt;&lt;div&gt;Il &lt;strong&gt;citation tracking&lt;/strong&gt; (“cited by”), cioè il forward citation searching; gli &lt;strong&gt;alert&lt;/strong&gt; servono a restare aggiornati.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 9 ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;biblioteca&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;09&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Accessing resources&lt;/div&gt;&lt;h2&gt;Accesso e servizi della biblioteca&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b class=&quot;lbl&quot;&gt;Hint (slide 18)&lt;/b&gt;Accedi sempre alle risorse &lt;strong&gt;partendo dalla pagina dei servizi bibliotecari&lt;/strong&gt;: così sei riconosciuto come &lt;em&gt;authorized user&lt;/em&gt; anche fuori dalla rete universitaria.&lt;/div&gt;
&lt;figure class=&quot;figure&quot;&gt;
&lt;svg viewBox=&quot;0 0 820 230&quot; role=&quot;img&quot; aria-label=&quot;Percorso di accesso in campus e off campus&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;85&quot; width=&quot;170&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Pagina servizi&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;bibliotecari&lt;/text&gt;
&lt;rect x=&quot;260&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;In campus&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;nessuna autenticazione (salvo eccezioni)&lt;/text&gt;
&lt;rect x=&quot;260&quot; y=&quot;150&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Off campus&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot;&gt;login con credenziali istituzionali&lt;/text&gt;
&lt;rect x=&quot;560&quot; y=&quot;85&quot; width=&quot;240&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;680&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Database e full-text&lt;/text&gt;&lt;text x=&quot;680&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; style=&quot;fill:var(--paper)&quot;&gt;come authorized user&lt;/text&gt;
&lt;g stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M180,105 L258,55&quot;/&gt;&lt;path d=&quot;M180,125 L258,175&quot;/&gt;&lt;path d=&quot;M460,50 L558,105&quot;/&gt;&lt;path d=&quot;M460,180 L558,125&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Slide 18. Fuori sede viene chiesto di autenticarsi con le credenziali di ateneo per entrare nel database o aprire il full-text.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;h3&gt;Quattro servizi (slide 21)&lt;/h3&gt;
&lt;div class=&quot;grid g4&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Finding resources&lt;/h4&gt;Usa &lt;strong&gt;BigSearch&lt;/strong&gt; per esplorare tutte le risorse accessibili tramite la biblioteca.&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Interlibrary services&lt;/h4&gt;&lt;span class=&quot;term&quot;&gt;ILL – Interlibrary Loan&lt;/span&gt; (prestito interbibliotecario) per i libri; &lt;span class=&quot;term&quot;&gt;DD – Document Delivery&lt;/span&gt; per capitoli, articoli, proceedings non posseduti.&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Reference service&lt;/h4&gt;Appuntamento con il bibliotecario per aiuto nella ricerca o nell&#x27;uso dei database.&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Moodle&lt;/h4&gt;Corso sulle basi della ricerca bibliografica, su come evitare il &lt;strong&gt;plagiarism&lt;/strong&gt; e costruire references e bibliografia.&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;lede&quot; style=&quot;text-align:center;margin-top:24px;font-size:1.4rem&quot;&gt;Keep calm and &lt;em&gt;ask your librarian&lt;/em&gt;.&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Sei a casa e un articolo ti chiede di pagare. Cosa hai sbagliato, probabilmente?&lt;/summary&gt;&lt;div&gt;Non sei partito dalla pagina dei servizi bibliotecari: passando da lì e autenticandoti con le credenziali di ateneo accedi come authorized user (se l&#x27;ateneo ha l&#x27;abbonamento).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;L&#x27;articolo non è negli abbonamenti dell&#x27;ateneo. Quale servizio usi?&lt;/summary&gt;&lt;div&gt;&lt;strong&gt;Document Delivery&lt;/strong&gt; (per un libro intero: Interlibrary Loan).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 10 ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;take&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;10&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Take home message&lt;/div&gt;&lt;h2&gt;Otto regole d&#x27;oro&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;La slide 20 riassume tutto in un percorso. Clicca le tappe per collegarle alle sezioni.&lt;/p&gt;
&lt;figure class=&quot;figure&quot;&gt;
&lt;svg viewBox=&quot;0 0 900 120&quot; role=&quot;img&quot; aria-label=&quot;Freccia con otto tappe&quot; id=&quot;thm&quot;&gt;
&lt;path d=&quot;M10,35 L820,35 L820,10 L890,60 L820,110 L820,85 L10,85 L40,60 Z&quot; fill=&quot;var(--sage-bg)&quot;/&gt;
&lt;/svg&gt;
&lt;div class=&quot;card tint&quot; id=&quot;thmBox&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;&lt;span class=&quot;src sl&quot;&gt;collegamento al corso&lt;/span&gt; Perché questa lezione sta nella cartella “Balanced Scorecard”?&lt;/summary&gt;&lt;div&gt;Il file si trova in &lt;code&gt;corso/Balanced Scorecard/25. SMA26-27 Bibliographic research and PRISMA/&lt;/code&gt;: la lezione fornisce il metodo per costruire la parte di letteratura su quel tema (ad esempio una review sull&#x27;adozione della balanced scorecard), con query documentate e un flow diagram PRISMA. Gli altri materiali del corso non erano consultabili da qui, quindi questo collegamento si basa solo sul nome della cartella: verificalo sul programma.&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica finale&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Metti in ordine: refine results · formulate question · save citations · review abstracts · access full-text · keywords · search databases.&lt;/summary&gt;&lt;div&gt;Formulate question → keywords → search databases → refine results → review abstracts → access full-text → save citations.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quali tre elementi della fonte la take home chiede di tenere d&#x27;occhio?&lt;/summary&gt;&lt;div&gt;Publication date, author reputation e journal reputation.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Cosa fa PRISMA che una normale ricerca non fa?&lt;/summary&gt;&lt;div&gt;Traccia e rende pubblico ogni passaggio dello screening (numeri e motivi), così la review è trasparente e riproducibile.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ Per approfondire ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;approfondire&quot; style=&quot;--c:var(--acc);--cb:var(--acc-bg)&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;→&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Per approfondire&lt;/div&gt;&lt;h2&gt;Testi, standard e siti citati&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lede&quot;&gt;Ogni scheda riguarda una risorsa nominata nelle slide. Dati e link vengono dalla ricerca web: sono &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;grid g2 refs&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;span class=&quot;src sl&quot;&gt;standard&lt;/span&gt;&lt;/span&gt;&lt;a href=&quot;https://doi.org/10.1136/bmj.n71&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Page M.J. et al. (2021), “The PRISMA 2020 statement: an updated guideline for reporting systematic reviews”, BMJ 372:n71&lt;/a&gt;&lt;p class=&quot;what&quot;&gt;È il “PRISMA 2020 Statement paper” linkato nella slide 10. Sostituisce la versione 2009; comprende la checklist da 27 item, una checklist estesa, la checklist per gli abstract e i flow diagram rivisti per review nuove e aggiornate. Pubblicato anche su PLoS Medicine 18(3): e1003583.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il riferimento da citare quando dichiari di seguire PRISMA.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;span class=&quot;src sl&quot;&gt;guida&lt;/span&gt;&lt;/span&gt;&lt;a href=&quot;https://doi.org/10.1136/bmj.n160&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Page M.J. et al. (2021), “PRISMA 2020 explanation and elaboration”, BMJ 372:n160&lt;/a&gt;&lt;p class=&quot;what&quot;&gt;Documento di accompagnamento: spiega ogni item della checklist con esempi di buon reporting.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il manuale d&#x27;uso pratico quando scrivi la sezione Methods.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;span class=&quot;src sl&quot;&gt;standard storico&lt;/span&gt;&lt;/span&gt;&lt;a href=&quot;https://doi.org/10.1371/journal.pmed.1000097&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Moher D., Liberati A., Tetzlaff J., Altman D.G. &amp;amp; PRISMA Group (2009), PLoS Medicine 6(7): e1000097&lt;/a&gt;&lt;p class=&quot;what&quot;&gt;La prima versione di PRISMA (“first published in 2009”, slide 10): checklist da 27 item e flow diagram in quattro fasi — Identification, Screening, Eligibility, Included — lo schema mostrato nella slide 12. Nasce come evoluzione del QUOROM Statement (1999).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: spiega l&#x27;origine del diagramma che trovi in molte review pubblicate prima del 2021.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;span class=&quot;src sl&quot;&gt;sito ufficiale&lt;/span&gt;&lt;/span&gt;&lt;a href=&quot;https://www.prisma-statement.org/prisma-2020&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PRISMA Statement – prisma-statement.org&lt;/a&gt;&lt;p class=&quot;what&quot;&gt;Sito ufficiale: articoli, &lt;a href=&quot;https://www.prisma-statement.org/prisma-2020-checklist&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;checklist&lt;/a&gt; e &lt;a href=&quot;https://www.prisma-statement.org/prisma-2020-flow-diagram&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;flow diagram&lt;/a&gt; scaricabili (Word, PDF e uno Shiny App) — corrispondono ai link “Flow diagram” e “Checklist” della slide 11.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: da qui scarichi i template da compilare per la tua review.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;span class=&quot;src sl&quot;&gt;database&lt;/span&gt;&lt;/span&gt;&lt;a href=&quot;https://www.elsevier.com/products/scopus/content&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scopus (Elsevier) – Content coverage&lt;/a&gt;&lt;p class=&quot;what&quot;&gt;Elsevier descrive Scopus come database di abstract e citazioni “source-neutral”, con titoli selezionati da un advisory board indipendente, contenuti da oltre 5.000 editori e aggiornamento giornaliero. Il Content Coverage Guide dettaglia cosa è indicizzato.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: sapere cosa &lt;em&gt;non&lt;/em&gt; è coperto ti dice quando affiancare altri database.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;span class=&quot;src sl&quot;&gt;database&lt;/span&gt;&lt;/span&gt;&lt;a href=&quot;https://webofscience.help.clarivate.com/Content/wos-core-collection/wos-core-collection.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Web of Science Core Collection (Clarivate)&lt;/a&gt;&lt;p class=&quot;what&quot;&gt;L&#x27;altro citation database della slide 16. La Core Collection indicizza riviste, libri e atti di convegno in diversi citation index; il numero di indici varia tra le fonti, quindi fa fede la pagina Clarivate e la licenza di ateneo.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la base dati da cui si calcolano JCR e Impact Factor.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;span class=&quot;src sl&quot;&gt;indicatori&lt;/span&gt;&lt;/span&gt;&lt;a href=&quot;https://clarivate.libguides.com/jcr/basics&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Journal Citation Reports – guida Clarivate&lt;/a&gt;&lt;p class=&quot;what&quot;&gt;Spiega Journal Impact Factor (citazioni dell&#x27;anno agli item dei due anni precedenti ÷ citable items), quartili di categoria (Q1 = meglio di almeno il 75% delle riviste della categoria) e IF a 5 anni.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: aiuta a valutare la “journal reputation” della take home — ricordando che Clarivate stessa sconsiglia confronti tra discipline e che DORA e il Leiden Manifesto sconsigliano di usare metriche di rivista per valutare singoli articoli.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;span class=&quot;src sl&quot;&gt;servizi d&#x27;ateneo&lt;/span&gt;&lt;/span&gt;&lt;a href=&quot;https://servizibibliotecari.unibg.it/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Servizi bibliotecari – Università di Bergamo&lt;/a&gt;&lt;p class=&quot;what&quot;&gt;Il punto di partenza raccomandato dalla slide 18: BiGsearch (catalogo unico di libri, riviste, tesi e risorse elettroniche), accesso alle risorse elettroniche anche da casa, ILL/DD, reference. Vedi anche la &lt;a href=&quot;https://servizibibliotecari.unibg.it/sites/biblio/files/libguide_ita.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;guida della biblioteca (PDF)&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è l&#x27;unico modo per accedere alle risorse come authorized user fuori campus.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
&lt;div&gt;Le parti marcate “fonte esterna” provengono dalla ricerca web e riportano il link alla fonte.&lt;/div&gt;
&lt;/div&gt;&lt;/footer&gt;

(function(){

/* ---- stepper ---- */
var steps=[
 [&quot;Formulate a research question&quot;,&quot;Trasforma il tema in una domanda precisa e rispondibile. È il criterio con cui giudicherai tutto il resto.&quot;,&quot;Errore tipico: partire con un argomento vago (“la balanced scorecard”) invece di una domanda (“come viene adattata la BSC nelle PMI manifatturiere?”).&quot;],
 [&quot;Identify relevant keywords&quot;,&quot;Estrai i concetti chiave della domanda e, per ciascuno, sinonimi, varianti, termini in inglese usati in letteratura.&quot;,&quot;Errore tipico: usare una sola parola per concetto e perdere gli studi che usano un vocabolario diverso.&quot;],
 [&quot;Search academic databases and other reliable resources&quot;,&quot;Interroga più database (bibliographic, citation, full-text) e fonti affidabili, sempre passando dalla pagina dei servizi bibliotecari.&quot;,&quot;Errore tipico: fermarsi a un motore generalista o a un solo database (la take home chiede “multiple databases”).&quot;],
 [&quot;Refine the results&quot;,&quot;Usa operatori booleani e filtri (anno, lingua, tipo di documento, area disciplinare) per ridurre il noise.&quot;,&quot;Errore tipico: restringere troppo e tagliare studi pertinenti.&quot;],
 [&quot;Review abstracts&quot;,&quot;Leggi gli abstract per valutare la pertinenza di ciascuna pubblicazione rispetto alla research question.&quot;,&quot;Errore tipico: scaricare e leggere decine di full-text senza una prima selezione.&quot;],
 [&quot;Access the full-texts&quot;,&quot;Recupera il testo integrale degli studi selezionati: l&#x27;accesso dipende dagli abbonamenti dell&#x27;ateneo; se manca, Interlibrary Loan / Document Delivery.&quot;,&quot;Errore tipico: pagare un articolo o rinunciarci senza chiedere alla biblioteca.&quot;],
 [&quot;Save and organize citations&quot;,&quot;Salva i riferimenti in modo ordinato per citarli correttamente e costruire la bibliografia.&quot;,&quot;Errore tipico: annotare i riferimenti a mano e non ritrovarli più al momento di scrivere.&quot;]
];
var short=[&quot;Question&quot;,&quot;Keywords&quot;,&quot;Search DBs&quot;,&quot;Refine&quot;,&quot;Abstracts&quot;,&quot;Full-texts&quot;,&quot;Citations&quot;];
var si=0,nodes=$(&#x27;#stepNodes&#x27;),dots=$(&#x27;#stDots&#x27;),stage=$(&#x27;#stepStage&#x27;);

steps.forEach(function(s,i){
  var x=20+i*137,g=document.createElementNS(svgNS,&#x27;g&#x27;);

  g.innerHTML=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;20&quot; width=&quot;120&quot; height=&quot;70&quot; rx=&quot;10&quot; stroke-width=&quot;1.5&quot;&gt;&lt;/rect&gt;&lt;text x=&quot;&#x27;+(x+60)+&#x27;&quot; y=&quot;50&quot; font-weight=&quot;600&quot;&gt;&#x27;+(i+1)+&#x27;&lt;/text&gt;&lt;text x=&quot;&#x27;+(x+60)+&#x27;&quot; y=&quot;70&quot; font-size=&quot;10.5&quot;&gt;&#x27;+short[i]+&#x27;&lt;/text&gt;&#x27;+(i&lt;6?&#x27;&lt;path d=&quot;M&#x27;+(x+122)+&#x27;,55 L&#x27;+(x+134)+&#x27;,55&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;/path&gt;&#x27;:&#x27;&#x27;);

  var b=document.createElement(&#x27;button&#x27;);b.textContent=i+1;b.setAttribute(&#x27;aria-label&#x27;,&#x27;Passo &#x27;+(i+1));b.addEventListener(&#x27;click&#x27;,function(){go(i)});dots.appendChild(b);

  $$(&#x27;rect&#x27;,nodes).forEach(function(r,k){r.setAttribute(&#x27;fill&#x27;,k===si?&#x27;var(--sage)&#x27;:k&lt;si?&#x27;var(--sage-bg)&#x27;:&#x27;var(--card)&#x27;);r.setAttribute(&#x27;stroke&#x27;,&#x27;var(--sage)&#x27;)});

}
$(&#x27;#stPrev&#x27;).addEventListener(&#x27;click&#x27;,function(){go(si-1)});$(&#x27;#stNext&#x27;).addEventListener(&#x27;click&#x27;,function(){go(si+1)});

var venn={and:[0,.8,0,&#x27;inflation&#x27;,&#x27;unemployment&#x27;,&#x27;&lt;strong&gt;inflation AND unemployment&lt;/strong&gt;: solo l\&#x27;intersezione, cioè gli studi che parlano di entrambi. Più termini in AND = meno risultati.&#x27;],
 or:[.8,.8,.8,&#x27;GDP&#x27;,&#x27;gross dom. product&#x27;,&#x27;&lt;strong&gt;GDP OR &quot;gross domestic product&quot;&lt;/strong&gt;: l\&#x27;unione dei due insiemi. Utile per sinonimi e acronimi. Più termini in OR = più risultati.&#x27;],
 not:[.8,0,0,&#x27;investment&#x27;,&#x27;real estate&#x27;,&#x27;&lt;strong&gt;investment NOT &quot;real estate&quot;&lt;/strong&gt;: il primo insieme meno la parte che contiene il secondo termine.&#x27;]};

  $$(&#x27;#vennTabs button&#x27;).forEach(function(x){x.setAttribute(&#x27;aria-selected&#x27;,x===b?&#x27;true&#x27;:&#x27;false&#x27;)});
  var v=venn[b.dataset.op];$(&#x27;#vA&#x27;).setAttribute(&#x27;opacity&#x27;,v[0]);$(&#x27;#vAB&#x27;).setAttribute(&#x27;opacity&#x27;,v[1]);$(&#x27;#vB&#x27;).setAttribute(&#x27;opacity&#x27;,v[2]);

})});

/* ---- query lab ---- */
var recs=[&quot;Inflation and unemployment in the euro area: a Phillips curve study&quot;,&quot;Monetary policy transmission and inflation expectations&quot;,&quot;Gross domestic product forecasting with machine learning&quot;,&quot;GDP growth and deflation risk in Japan&quot;,&quot;Artificial intelligence in supply chain management: a review&quot;,&quot;AI applications in healthcare supply chain&quot;,&quot;Investment decisions in real estate markets&quot;,&quot;Venture capital investment and innovation&quot;,&quot;Economic policy uncertainty and unemployment&quot;,&quot;Monetary unions and the policy mix: the economics of the euro&quot;,&quot;Inflation or deflation? Price dynamics and GDP&quot;,&quot;Circular economy business models in manufacturing&quot;];
function has(t,w){return new RegExp(&#x27;\\b&#x27;+w+&#x27;\\b&#x27;,&#x27;i&#x27;).test(t)}
function pre(t,w){return new RegExp(&#x27;\\b&#x27;+w,&#x27;i&#x27;).test(t)}
var qs=[
 [&quot;AND&quot;,&quot;inflation AND unemployment&quot;,function(t){return has(t,&#x27;inflation&#x27;)&amp;&amp;has(t,&#x27;unemployment&#x27;)},&quot;Solo il record che contiene entrambe le parole. Il n. 9 parla di unemployment ma non di inflation.&quot;],
 [&quot;OR&quot;,&#x27;GDP OR &quot;gross domestic product&quot;&#x27;,function(t){return has(t,&#x27;GDP&#x27;)||has(t,&#x27;gross domestic product&#x27;)},&quot;Acronimo e forma estesa insieme: senza OR avresti perso uno dei due gruppi.&quot;],
 [&quot;NOT&quot;,&#x27;investment NOT &quot;real estate&quot;&#x27;,function(t){return has(t,&#x27;investment&#x27;)&amp;&amp;!has(t,&#x27;real estate&#x27;)},&quot;Il n. 7 è escluso perché contiene real estate.&quot;],
 [&#x27;&quot; &quot;&#x27;,&#x27;&quot;monetary policy&quot;&#x27;,function(t){return has(t,&#x27;monetary policy&#x27;)},&quot;Il n. 10 contiene sia monetary sia policy, ma non come frase esatta: escluso.&quot;],
 [&quot;*&quot;,&quot;econom*&quot;,function(t){return pre(t,&#x27;econom&#x27;)},&quot;Trova economic, economics, economy con una sola radice.&quot;],
 [&quot;( )&quot;,&quot;(inflation OR deflation) AND GDP&quot;,function(t){return (has(t,&#x27;inflation&#x27;)||has(t,&#x27;deflation&#x27;))&amp;&amp;has(t,&#x27;GDP&#x27;)},&quot;Le parentesi fanno calcolare prima l&#x27;OR e poi l&#x27;AND. Il n. 1 (inflation senza GDP) resta fuori.&quot;],
 [&quot;Combine&quot;,&#x27;(&quot;artificial intelligence&quot; OR AI) AND &quot;supply chain&quot; NOT healthcare&#x27;,function(t){return (has(t,&#x27;artificial intelligence&#x27;)||has(t,&#x27;AI&#x27;))&amp;&amp;has(t,&#x27;supply chain&#x27;)&amp;&amp;!has(t,&#x27;healthcare&#x27;)},&quot;L&#x27;esempio combinato della slide 8: il n. 6 è eliminato dal NOT.&quot;]
];
var qB=$(&#x27;#qBtns&#x27;),qL=$(&#x27;#qList&#x27;);qB.style.setProperty(&#x27;--c&#x27;,&#x27;var(--ochre)&#x27;);
recs.forEach(function(r,i){var d=document.createElement(&#x27;div&#x27;);d.className=&#x27;rec&#x27;;d.innerHTML=&#x27;&lt;span class=&quot;id&quot;&gt;#&#x27;+(i+1)+&#x27;&lt;/span&gt;&lt;span&gt;&#x27;+r+&#x27;&lt;/span&gt;&#x27;;qL.appendChild(d)});
qs.forEach(function(q,i){var b=document.createElement(&#x27;button&#x27;);b.textContent=q[0];b.setAttribute(&#x27;aria-selected&#x27;,i?&#x27;false&#x27;:&#x27;true&#x27;);b.addEventListener(&#x27;click&#x27;,function(){runQ(i)});qB.appendChild(b)});
function runQ(i){var q=qs[i],n=0;
  $$(&#x27;button&#x27;,qB).forEach(function(b,k){b.setAttribute(&#x27;aria-selected&#x27;,k===i?&#x27;true&#x27;:&#x27;false&#x27;)});
  $$(&#x27;.rec&#x27;,qL).forEach(function(d,k){var ok=q[2](recs[k]);if(ok)n++;d.classList.toggle(&#x27;hit&#x27;,ok);d.classList.toggle(&#x27;miss&#x27;,!ok)});
  $(&#x27;#qShow&#x27;).textContent=q[1];$(&#x27;#qExplain&#x27;).innerHTML=&#x27;&lt;strong&gt;&#x27;+n+&#x27; risultat&#x27;+(n===1?&#x27;o&#x27;:&#x27;i&#x27;)+&#x27;&lt;/strong&gt; su 12. &#x27;+q[3];
}

/* ---- precision / recall ---- */
var X=function(s){return 60+s*56},Y=function(v){return 220-v*200};
function P(s){return .12+.8/(1+Math.exp(-(s-4.5)*.9))}
function R(s){return .97-.85/(1+Math.exp(-(s-6.2)*.95))}
function N(s){return .95*Math.exp(-s*.38)+.02}
function path(f){var d=&#x27;&#x27;;for(var s=0;s&lt;=10.01;s+=.25)d+=(s?&#x27;L&#x27;:&#x27;M&#x27;)+X(s).toFixed(1)+&#x27;,&#x27;+Y(f(s)).toFixed(1);return d}
$(&#x27;#cPrec&#x27;).setAttribute(&#x27;d&#x27;,path(P));$(&#x27;#cRec&#x27;).setAttribute(&#x27;d&#x27;,path(R));$(&#x27;#cN&#x27;).setAttribute(&#x27;d&#x27;,path(N));
function upd(){var s=+$(&#x27;#spec&#x27;).value;$(&#x27;#specOut&#x27;).textContent=s;
  $(&#x27;#cLine&#x27;).setAttribute(&#x27;x1&#x27;,X(s));$(&#x27;#cLine&#x27;).setAttribute(&#x27;x2&#x27;,X(s));
  $(&#x27;#dPrec&#x27;).setAttribute(&#x27;cx&#x27;,X(s));$(&#x27;#dPrec&#x27;).setAttribute(&#x27;cy&#x27;,Y(P(s)));$(&#x27;#dRec&#x27;).setAttribute(&#x27;cx&#x27;,X(s));$(&#x27;#dRec&#x27;).setAttribute(&#x27;cy&#x27;,Y(R(s)));
  var lx=Math.min(X(s)+8,560);$(&#x27;#lP&#x27;).setAttribute(&#x27;x&#x27;,lx);$(&#x27;#lP&#x27;).setAttribute(&#x27;y&#x27;,Y(P(s))-8);$(&#x27;#lR&#x27;).setAttribute(&#x27;x&#x27;,lx);$(&#x27;#lR&#x27;).setAttribute(&#x27;y&#x27;,Y(R(s))+18);
  var p=Math.round(P(s)*100),r=Math.round(R(s)*100),msg=s&lt;3?&#x27;Query molto generica: trovi quasi tutto ciò che serve, ma sommerso dal noise.&#x27;:s&gt;7?&#x27;Query molto stretta: risultati pulitissimi, ma rischi di escludere studi importanti.&#x27;:&#x27;Zona di equilibrio: buon compromesso tra pertinenza e completezza.&#x27;;
  $(&#x27;#specCap&#x27;).innerHTML=&#x27;Precision ≈ &lt;strong&gt;&#x27;+p+&#x27;%&lt;/strong&gt; · Recall ≈ &lt;strong&gt;&#x27;+r+&#x27;%&lt;/strong&gt;. &#x27;+msg;}
$(&#x27;#spec&#x27;).addEventListener(&#x27;input&#x27;,upd);upd();

/* ---- pyramid ---- */
var lv=[[&quot;Primary sources&quot;,&quot;Forniscono &lt;strong&gt;dati, risultati o evidenze originali&lt;/strong&gt;: studi empirici, ricerca originale, documenti ufficiali, dataset.&quot;,&quot;Es.: un articolo che presenta un&#x27;indagine su 200 imprese; un bilancio; un dataset ISTAT.&quot;],
[&quot;Secondary sources&quot;,&quot;Forniscono &lt;strong&gt;interpretazioni, review e analisi&lt;/strong&gt; delle fonti primarie.&quot;,&quot;Es.: una literature review o una systematic review (come quelle costruite con PRISMA).&quot;],
[&quot;Tertiary sources&quot;,&quot;Forniscono &lt;strong&gt;sintesi&lt;/strong&gt;: enciclopedie, manuali (textbooks).&quot;,&quot;Es.: il manuale del corso, una voce di enciclopedia: ottimi per orientarsi, non come prova principale.&quot;]];
