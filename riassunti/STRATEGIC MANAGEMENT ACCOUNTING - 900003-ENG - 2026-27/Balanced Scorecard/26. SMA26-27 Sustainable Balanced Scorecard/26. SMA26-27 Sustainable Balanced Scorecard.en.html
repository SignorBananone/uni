&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Option 3&lt;/div&gt;&lt;h4&gt;Useful addition&lt;/h4&gt;&lt;p&gt;A detailed climate adaptation plan, linked to the main map.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;Conclusions:&lt;/b&gt; the architecture follows the aspects, and a &lt;em&gt;single&lt;/em&gt; relevant non-market aspect is enough to justify option 2. The options can be combined: option 2 for the hotel, option 3 for the climate plan. Choice 2: &lt;b&gt;business case&lt;/b&gt;; profit stays at the top and sustainability is part of the product.&lt;/div&gt;

&lt;h3&gt;Case: Caffè Lago &lt;span class=&quot;tag slide&quot;&gt;fictitious case from the slides&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;A &lt;em&gt;specialty&lt;/em&gt; coffee roaster near Bergamo, 80 employees.&lt;/li&gt;&lt;li&gt;Customers: bars and restaurants, offices, online consumers.&lt;/li&gt;&lt;li&gt;Buys green coffee from farmer cooperatives in Latin America and East Africa.&lt;/li&gt;&lt;li&gt;Competes with large roasters that sell at lower prices.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--m-fin);color:#fff;border-color:transparent&quot;&gt;&lt;h4&gt;Strategy&lt;/h4&gt;&lt;p&gt;High-quality coffee &lt;b&gt;traceable to the farm&lt;/b&gt;, bought at a &lt;b&gt;fair price&lt;/b&gt; from long-term partners, roasted with &lt;b&gt;low impact&lt;/b&gt;.&lt;/p&gt;&lt;p style=&quot;color:oklch(85% 0.08 35);margin:0&quot;&gt;Value proposition: &lt;dfn style=&quot;border-color:currentColor&quot;&gt;product leadership&lt;/dfn&gt;, with sustainability as part of quality.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Caffè Lago: the three options&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;cl1&quot;&gt;Option 1&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;cl2&quot;&gt;Option 2&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;cl3&quot;&gt;Option 3&lt;/button&gt;
&lt;/div&gt;
&lt;div id=&quot;cl1&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot;&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;caffe1&quot;&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;Farmers inside purchasing.&lt;/b&gt; Farmer income and deforestation become details of the purchasing process (“Price above living income”). Simple, but farming communities and NGOs remain invisible. The &lt;dfn&gt;living income&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(the income a household needs for a decent standard of living)&lt;/span&gt; is the reference benchmark.&lt;/p&gt;&lt;/div&gt;
&lt;div id=&quot;cl2&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;caffe2&quot;&gt;&lt;/div&gt;&lt;p&gt;Farmers and NGOs have their own perspective, with arrows towards reputation and sourcing.&lt;/p&gt;&lt;/div&gt;
&lt;div id=&quot;cl3&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;duo&quot;&gt;&lt;div&gt;&lt;h4&gt;Main scorecard&lt;/h4&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;caffe3a&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;arr&quot; aria-hidden=&quot;true&quot;&gt;➜&lt;/div&gt;&lt;div&gt;&lt;h4&gt;Derived: farmer partnership&lt;/h4&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;caffe3b&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The derived scorecard details &lt;b&gt;Direct trade coffee&lt;/b&gt; and remains linked to it. Note that at the top, in the Financial row, is the &lt;em&gt;farmers&#x27;&lt;/em&gt; income: in a derived programme the “result” can be the partner&#x27;s.&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Three types of arrow towards profit&lt;/h3&gt;
&lt;p&gt;Every sustainability measure on Caffè Lago&#x27;s map needs an arrow towards the financial perspective. That arrow can be of three types:&lt;/p&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--sage)&quot;&gt;Win win&lt;/div&gt;&lt;h4&gt;Good for both&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Less energy per kg roasted:&lt;/b&gt; lower emissions and lower costs at the same time.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;Trade-off&lt;/div&gt;&lt;h4&gt;Good for one, costly for the other&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Paying farmers above the benchmark:&lt;/b&gt; better lives and better beans, but higher purchasing costs.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--slate)&quot;&gt;Mandatory&lt;/div&gt;&lt;h4&gt;Required regardless&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Packaging or reporting rules:&lt;/b&gt; the question is how to comply at the lowest cost.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Caffè Lago is betting that its trade-off will become a &lt;b&gt;win win&lt;/b&gt;: bars will pay more for a responsibly sourced coffee. On any of the three maps, this bet is an if/then arrow that &lt;b&gt;the data must confirm&lt;/b&gt;. Put it to the test:&lt;/p&gt;
&lt;div class=&quot;card&quot; id=&quot;ww&quot;&gt;
&lt;div class=&quot;k&quot;&gt;Simulator &lt;span class=&quot;tag ill&quot;&gt;illustrative figures&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;Premium paid to farmers (€/kg green coffee) &lt;input type=&quot;range&quot; id=&quot;ww-fp&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;0.05&quot; value=&quot;1.5&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;ww-fp-o&quot;&gt;&lt;/span&gt;&lt;/label&gt;
&lt;label&gt;Price premium accepted by bars (€/kg roasted) &lt;input type=&quot;range&quot; id=&quot;ww-pp&quot; min=&quot;0&quot; max=&quot;4&quot; step=&quot;0.05&quot; value=&quot;1&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;ww-pp-o&quot;&gt;&lt;/span&gt;&lt;/label&gt;
&lt;label&gt;Energy savings (€/kg roasted) &lt;input type=&quot;range&quot; id=&quot;ww-en&quot; min=&quot;0&quot; max=&quot;0.6&quot; step=&quot;0.05&quot; value=&quot;0.2&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;ww-en-o&quot;&gt;&lt;/span&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div id=&quot;ww-svg&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;verdict&quot; id=&quot;ww-v&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot; style=&quot;margin-top:8px&quot;&gt;Simplifying assumption: about 1.2 kg of green coffee is needed for 1 kg of roasted coffee (roasting causes weight loss), so the extra cost per kg roasted = premium × 1.2. The figures are invented: they serve only to show how a trade-off becomes a win win when the market recognises the value.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Option 1&lt;/div&gt;&lt;h4&gt;Too narrow&lt;/h4&gt;&lt;p&gt;Farmers become a purchasing detail; NGOs and communities have no place.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--m-fin);color:#fff;border-color:transparent&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:oklch(85% 0.08 35)&quot;&gt;Option 2&lt;/div&gt;&lt;h4&gt;Best fit&lt;/h4&gt;&lt;p&gt;Farmers and NGOs have their own perspective, with arrows to reputation and supply.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Option 3&lt;/div&gt;&lt;h4&gt;Also needed&lt;/h4&gt;&lt;p&gt;The farmer partnership needs a detailed scorecard, linked to the main one.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;Conclusions:&lt;/b&gt; best design = &lt;b&gt;option 2 + option 3&lt;/b&gt; for the farmer partnership. Choice 2: &lt;b&gt;business case&lt;/b&gt; (sustainability is part of quality, and quality sells). Same answer as Alpe Verde, for a different reason: here the non-market actors are &lt;em&gt;distant&lt;/em&gt;, in the supply chain, not in the valley next door.&lt;/div&gt;

&lt;h3 id=&quot;s4-tool&quot;&gt;Tool or symbol?&lt;/h3&gt;
&lt;p&gt;A scorecard can be a management tool or a symbol for display. Tick the conditions your scorecard meets:&lt;/p&gt;
&lt;div class=&quot;check&quot; id=&quot;tos&quot;&gt;
&lt;label&gt;&lt;input type=&quot;checkbox&quot;&gt; &lt;span&gt;&lt;b&gt;Linked to strategy&lt;/b&gt;: arrows connect sustainability measures to the value proposition (otherwise: &lt;em&gt;no link to strategy&lt;/em&gt;).&lt;/span&gt;&lt;/label&gt;
&lt;label&gt;&lt;input type=&quot;checkbox&quot;&gt; &lt;span&gt;&lt;b&gt;With targets&lt;/b&gt;: every number has a direction, a target and a deadline (otherwise: &lt;em&gt;no targets&lt;/em&gt;).&lt;/span&gt;&lt;/label&gt;
&lt;label&gt;&lt;input type=&quot;checkbox&quot;&gt; &lt;span&gt;&lt;b&gt;Reviewed&lt;/b&gt;: measures are discussed in management meetings and change plans (otherwise: &lt;em&gt;never reviewed&lt;/em&gt;).&lt;/span&gt;&lt;/label&gt;
&lt;label&gt;&lt;input type=&quot;checkbox&quot;&gt; &lt;span&gt;&lt;b&gt;Bad news too&lt;/b&gt;: measures that worsen stay in the report (otherwise: &lt;em&gt;only good news&lt;/em&gt;).&lt;/span&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;verdict&quot; id=&quot;tos-v&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;p style=&quot;margin-top:10px&quot;&gt;The lecture&#x27;s conclusions add two more ingredients: an &lt;b&gt;owner&lt;/b&gt; for each measure and a link to &lt;b&gt;incentives&lt;/b&gt;.&lt;/p&gt;

&lt;h3&gt;Symbol or substance? Microsoft&#x27;s commitment&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;The case&lt;/div&gt;&lt;p&gt;In 2020 Microsoft committed to being &lt;b&gt;carbon negative by 2030&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(removing more CO₂ than it emits)&lt;/span&gt; and, by 2050, to removing all the carbon it has emitted since its founding in 1975.&lt;/p&gt;&lt;p&gt;Critics point to the use of its software to extract fossil fuels and to its membership of trade associations that oppose climate policies.&lt;/p&gt;&lt;/div&gt;
&lt;div&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;1. Why might a company exaggerate its environmental performance?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;To win customers, investors and talent cheaply, without paying the price of real change.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;2. Why is it risky?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;When it is discovered, the reputational damage outweighs the gain, and regulators sanction misleading claims. It also violates the IMA&#x27;s &lt;b&gt;Statement of Ethical Professional Practice&lt;/b&gt;: the principles of honesty, fairness, objectivity and responsibility, and the standards of &lt;b&gt;integrity&lt;/b&gt; and &lt;b&gt;credibility&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;3. How could Microsoft respond to its critics?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Publish a &lt;b&gt;measure and a target&lt;/b&gt; for each part of the commitment; have them &lt;b&gt;verified&lt;/b&gt; by third parties; report on the points raised by critics as well; tie &lt;b&gt;executive compensation&lt;/b&gt; to those targets.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;callout&quot;&gt;A credible commitment avoids the &lt;b&gt;four signs of a symbol&lt;/b&gt;: it is linked to the strategy, has targets, is reviewed by management and reports bad news as well.&lt;/div&gt;

&lt;div class=&quot;selfcheck&quot;&gt;
&lt;h3&gt;Self-check · Part IV&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What are the three design steps and the two questions of step 3?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;1) Choose the business unit; 2) identify the exposure; 3) determine the relevance. Questions: is it relevant to the strategy? If so, does it reach us through markets (→ four perspectives) or outside them (→ non-market)? If not, it stays out of the scorecard.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why is option 2 the best fit for Alpe Verde even though only one aspect out of six is non-market?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Because that aspect (the residents) is a real risk to the licence to operate: a single relevant non-market aspect is enough to justify a fifth perspective.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Alpe Verde and Caffè Lago arrive at the same architecture. How does the rationale differ?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;At Alpe Verde the non-market actors are close by (the valley, the municipality); for Caffè Lago they are distant, in the supply chain (farmers, NGOs). Caffè Lago also adds an option 3 for the farmer partnership.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Distinguish win win, trade-off and mandatory with one example each.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Win win: less energy per kg (lower emissions and lower costs). Trade-off: paying farmers above the benchmark (social benefit, higher cost). Mandatory: packaging or reporting rules (what matters is complying at the lowest cost).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What are the four signs that a scorecard is a “symbol”?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;No link to strategy; no targets; never reviewed; only good news.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p5&quot; id=&quot;s5&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;V&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Part five · objective 4&lt;/div&gt;&lt;h2&gt;A real case: Novo Nordisk&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Novo Nordisk, a Danish pharmaceutical group, is an example of how a real company links sustainability to its strategy and cascades it down to the factory floor.&lt;/p&gt;

&lt;h3&gt;Why sustainability? Two triggering events&lt;/h3&gt;
&lt;div class=&quot;svgbox&quot;&gt;
&lt;svg viewBox=&quot;0 0 700 170&quot; role=&quot;img&quot; aria-label=&quot;From stakeholder criticism to lost profits&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;nna&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;0&quot; y=&quot;5&quot; width=&quot;250&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--acc-bg)&quot;/&gt;&lt;text x=&quot;14&quot; y=&quot;32&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;Genetic engineering&lt;/text&gt;&lt;text x=&quot;14&quot; y=&quot;52&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;genetically modified&lt;/text&gt;&lt;text x=&quot;14&quot; y=&quot;66&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;microorganisms; health concerns&lt;/text&gt;
&lt;rect x=&quot;0&quot; y=&quot;95&quot; width=&quot;250&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--acc-bg)&quot;/&gt;&lt;text x=&quot;14&quot; y=&quot;122&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;Access to medicines, 2001&lt;/text&gt;&lt;text x=&quot;14&quot; y=&quot;142&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;affordability of medicines&lt;/text&gt;&lt;text x=&quot;14&quot; y=&quot;156&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;in developing countries&lt;/text&gt;
&lt;rect x=&quot;300&quot; y=&quot;50&quot; width=&quot;160&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;Effects on financial&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;performance?&lt;/text&gt;
&lt;rect x=&quot;510&quot; y=&quot;50&quot; width=&quot;185&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--m-fin)&quot;/&gt;&lt;text x=&quot;602&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;Lost profits:&lt;/text&gt;&lt;text x=&quot;602&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;action is needed&lt;/text&gt;
&lt;g stroke=&quot;var(--acc)&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#nna)&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M252 40 L295 75&quot;/&gt;&lt;path d=&quot;M252 130 L295 95&quot;/&gt;&lt;path d=&quot;M462 85 H505&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/div&gt;
&lt;p&gt;Novo Nordisk responds to stakeholder criticism: a &lt;b&gt;non-market&lt;/b&gt; issue that becomes a &lt;b&gt;financial&lt;/b&gt; issue (the same pattern as the Volkswagen case).&lt;/p&gt;

&lt;h3&gt;Novo Nordisk&#x27;s triple bottom line&lt;/h3&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--brick)&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--brick)&quot;&gt;Social goals · People&lt;/div&gt;&lt;p&gt;Access to affordable medicines, prevention projects with patients, better diagnosis.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--sage)&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--sage)&quot;&gt;Environmental goals · Planet&lt;/div&gt;&lt;p&gt;Lower environmental impact of processes and finished products; careful use of natural resources.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--slate)&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--slate)&quot;&gt;Economic goals · Profit&lt;/div&gt;&lt;p&gt;Financial performance, with ethical and transparent growth.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Every year Novo Nordisk reports not only on its financial performance but also on its &lt;b&gt;sustainable development&lt;/b&gt; performance, as a long-term survival strategy. The triple bottom line principle is &lt;b&gt;anchored in the company&#x27;s Articles of Association&lt;/b&gt; and in its way of doing business: decisions must balance financial, social and environmental performance.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Which architecture suits a company with this principle in its Articles of Association?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;The following slides answer this: option 1, &lt;b&gt;integration&lt;/b&gt; (social and environmental objectives within four headings, with the customer perspective broadened to society rather than adding a fifth one) and, for choice 2, a &lt;b&gt;balanced&lt;/b&gt; top: the triple bottom line.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What changes for managers when sustainability is a duty rather than a choice?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;A discussion question; the slides give no written answer. Pointers: sustainability is no longer negotiable in trade-offs, it must have targets and owners at every level, and it enters managers&#x27; performance evaluation; the risk to watch is that it remains declared at the top but gets lost on the way down (see below).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;

&lt;h3&gt;The balanced scorecard as a management tool&lt;/h3&gt;
&lt;div class=&quot;quote&quot;&gt;“Rather than assessing each division with a Triple Bottom Line performance report, Novo Nordisk relies on the balanced scorecard […]. The Balanced Scorecard is the management tool for embedding and cascading the Triple Bottom Line approach throughout the organization.”&lt;small&gt;Morsing and Oswald (2005), cited in the slides&lt;/small&gt;&lt;/div&gt;
&lt;p&gt;&lt;b&gt;Twenty-four objectives&lt;/b&gt; under four headings:&lt;/p&gt;
&lt;div class=&quot;grid4&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--m-cus);color:#fff;border-color:transparent&quot;&gt;&lt;h4&gt;Customers and Society&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;customer, broadened to society&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--m-fin);color:#fff;border-color:transparent&quot;&gt;&lt;h4&gt;Finance&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;financial&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--m-pro);color:#fff;border-color:transparent&quot;&gt;&lt;h4&gt;Business Processes&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;internal processes&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--m-lea);color:var(--m-lea-t);border-color:transparent&quot;&gt;&lt;h4&gt;People and Organisation&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;learning and growth&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;A cascading balanced scorecard&lt;/h3&gt;
&lt;p&gt;&lt;dfn&gt;Cascading&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(translating the corporate scorecard into increasingly specific scorecards, level by level)&lt;/span&gt; carries the strategy all the way down to individuals. The figure follows one branch: operations, product supply, down to a factory.&lt;/p&gt;
&lt;div class=&quot;svgbox&quot; id=&quot;cascade&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Novo Nordisk&#x27;s scorecard cascade&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;csa&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;5&quot; markerHeight=&quot;5&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;g font-size=&quot;13.5&quot; font-weight=&quot;700&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect data-lv=&quot;0&quot; x=&quot;10&quot; y=&quot;8&quot; width=&quot;210&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--m-fin)&quot;/&gt;&lt;text x=&quot;115&quot; y=&quot;36&quot; fill=&quot;#fff&quot;&gt;Corporate BSC&lt;/text&gt;
&lt;rect data-lv=&quot;1&quot; x=&quot;110&quot; y=&quot;66&quot; width=&quot;210&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--m-pro)&quot;/&gt;&lt;text x=&quot;215&quot; y=&quot;94&quot; fill=&quot;#fff&quot;&gt;Operations BSC&lt;/text&gt;
&lt;rect data-lv=&quot;2&quot; x=&quot;210&quot; y=&quot;124&quot; width=&quot;210&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--m-pro)&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;152&quot; fill=&quot;#fff&quot;&gt;Product Supply BSC&lt;/text&gt;
&lt;rect data-lv=&quot;3&quot; x=&quot;310&quot; y=&quot;182&quot; width=&quot;240&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--m-cus)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;210&quot; fill=&quot;#fff&quot;&gt;Diabetes Finished Products&lt;/text&gt;

&lt;h3&gt;Down to the factory: Diabetes Finished Products&lt;/h3&gt;
&lt;p&gt;A production unit. Two terms: &lt;dfn&gt;critical success factor&lt;/dfn&gt; (CSF, &lt;span class=&quot;gl&quot;&gt;what must be done well in order to succeed&lt;/span&gt;) and &lt;dfn&gt;KPI&lt;/dfn&gt; (&lt;span class=&quot;gl&quot;&gt;key performance indicator, the indicator that measures it&lt;/span&gt;).&lt;/p&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Perspective&lt;/th&gt;&lt;th&gt;Critical success factor&lt;/th&gt;&lt;th&gt;Rationale&lt;/th&gt;&lt;th&gt;KPI&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Finance&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Realise growth in operating profit&lt;/td&gt;&lt;td&gt;Secure growth in line with the industry&lt;/td&gt;&lt;td&gt;Operating profit&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Customers and Society&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Ensure superior customer satisfaction&lt;/td&gt;&lt;td&gt;Product quality is critical for customer satisfaction&lt;/td&gt;&lt;td&gt;Customer complaints&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Business Processes&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Improve productivity&lt;/td&gt;&lt;td&gt;Secure cost efficiency in production&lt;/td&gt;&lt;td&gt;Output versus cost (unit costs); fewer non conformities&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;People and Organisation&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Support diversity and social responsibility&lt;/td&gt;&lt;td&gt;Enhance innovation, attraction and reputation&lt;/td&gt;&lt;td&gt;Equal opportunity initiatives undertaken&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;

&lt;h4&gt;Try it yourself: what is missing at factory level? &lt;span class=&quot;tag slide&quot;&gt;exercise from the slides&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;The company has an &lt;b&gt;absolute CO₂ target&lt;/b&gt; (Annual Report 2004). &lt;em&gt;Absolute&lt;/em&gt; means on total emissions, not per unit produced: if production grows, efficiency alone may not be enough.&lt;/p&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Question 1 · Which of the four KPIs are social or environmental?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Only one: &lt;b&gt;equal opportunity initiatives&lt;/b&gt;, a social KPI. No environmental KPI in the part shown: the CO₂ target does not reach the factory.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Question 2 · Propose an environmental CSF and KPI for processes, with the if/then link.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;CSF:&lt;/b&gt; reduce energy use in production. &lt;b&gt;KPI:&lt;/b&gt; energy per unit produced &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt; and total site CO₂ &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;. &lt;b&gt;If/then:&lt;/b&gt; if the factory uses less energy per unit and in total, then unit costs fall and the company meets its absolute CO₂ target. Note the dual KPI: the per-unit one links to costs (win win), the total one links to the absolute target.&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;Key message:&lt;/b&gt; cascading is the point at which sustainability can &lt;b&gt;quietly disappear&lt;/b&gt;. You need to check that every target reaches the unit that actually generates the impact.&lt;/div&gt;

&lt;div class=&quot;selfcheck&quot;&gt;
&lt;h3&gt;Self-check · Part V&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Which architecture does Novo Nordisk use, in terms of Hansen and Schaltegger&#x27;s two choices?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Choice 1: option 1, integration, with the customer perspective broadened to “Customers and Society”. Choice 2: a balanced top, the triple bottom line.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why does Novo Nordisk use the BSC instead of a TBL report for each division?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Because the BSC is the management tool for embedding and cascading the TBL throughout the organisation: it assigns objectives, measures and owners at every level, whereas a report would merely describe.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;How many levels does the cascade have, and which one is optional?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Five: company, five executive vice presidents, twenty senior vice presidents (business units), sub-units such as a factory (optional, often KPIs only), people (objectives reviewed twice a year).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What is the difference between an absolute CO₂ target and a per-unit one?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;The former concerns total emissions, the latter intensity (per unit produced). With growing production, intensity can fall while the total rises: meeting an absolute target requires both KPIs.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;fine&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;✦&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Summary&lt;/div&gt;&lt;h2&gt;Conclusions in five words&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;1 · Why&lt;/div&gt;&lt;p&gt;Stakeholders, regulation and markets make environmental, social and governance aspects strategic. Double materiality tells us which ones matter.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;2 · What&lt;/div&gt;&lt;p&gt;The sustainable balanced scorecard is not a new tool: it applies the scorecard logic (derive, link, measure, test) to environmental and social aspects.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;3 · Where&lt;/div&gt;&lt;p&gt;An aspect is placed according to its path: market aspects in the four perspectives, non-market aspects in a fifth one, details in derived scorecards. The options can be combined.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;4 · What for&lt;/div&gt;&lt;p&gt;What sits at the top of the map (profit, sustainability or both) reflects the company&#x27;s values.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;5 · How&lt;/div&gt;&lt;p&gt;A scorecard is a tool only with &lt;b&gt;targets, owners, review and reward&lt;/b&gt;. Otherwise it is a symbol, close to greenwashing.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Links to the rest of the course: the lecture builds on the strategy map and the if/then relationships from the previous lecture on the balanced scorecard (recap slide “a strategy map in four rows”). The other files in the &lt;code&gt;corso/&lt;/code&gt; folder were not accessible when this summary was written, so they were not used.&lt;/p&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;approfondire&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;↗&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;External sources&lt;/div&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Authors, studies, regulations, standards and cases cited in the slides. Every entry is an &lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;: the information comes from web searches (November 2026), not from the slides. Where external sources differ from the slides, this is flagged.&lt;/p&gt;

&lt;h3&gt;Authors and studies&lt;/h3&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Milton Friedman, “The Social Responsibility of Business Is to Increase Its Profits” (1970)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;The New York Times Magazine, 13 September 1970&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the thesis that the only social responsibility of business is to use its resources to increase profits, “so long as it stays within the rules of the game”. &lt;b&gt;Why it matters:&lt;/b&gt; it is the founding text of the shareholder view, the starting point from which the lecture moves away.&lt;/p&gt;&lt;a href=&quot;https://www.pagecentertraining.psu.edu/assets/images/course-content/Lesson_One_Reading_Friedman_(1970)_The_Social_Responsibility_of_Business_is_to_Increase_its_Profits.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Text (course reading, Penn State)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;R. Edward Freeman, &lt;em&gt;Strategic Management: A Stakeholder Approach&lt;/em&gt; (1984)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Pitman, Boston, 1984; reissued by Cambridge University Press, 2010&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the definition of stakeholder and the idea that strategy must take into account all groups that affect or are affected by the firm. &lt;b&gt;Why it matters:&lt;/b&gt; it is the book that launched stakeholder theory, the basis of the whole of Part I.&lt;/p&gt;&lt;a href=&quot;https://cleo.rutgers.edu/articles/strategic-management-a-stakeholder-approach/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Book overview (Rutgers CLEO)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;John Elkington, &lt;em&gt;Cannibals with Forks&lt;/em&gt; (1997)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Capstone, Oxford, 1997&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the presentation to a general audience of the triple bottom line, a term Elkington coined in 1994. &lt;b&gt;Why it matters:&lt;/b&gt; it is the origin of “people, planet, profit” and of the question of how to manage the three lines together.&lt;/p&gt;&lt;a href=&quot;https://www.taylorfrancis.com/chapters/edit/10.4324/9781351279086-27/cannibals-forks-john-elkington-1997&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Excerpt (Taylor &amp;amp; Francis)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Erik G. Hansen and Stefan Schaltegger, “The Sustainability Balanced Scorecard: A Systematic Review of Architectures” (2016)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Journal of Business Ethics, DOI 10.1007/s10551-014-2340-3&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; a systematic literature review of the sustainability balanced scorecard and a typology of generic architectures; changes to the architecture are motivated by instrumental, socio-political or normative perspectives. In 2017 the authors replied to Hahn and Figge&#x27;s criticism in the same journal. &lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the “two choices” in Part III.&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.1007/s10551-014-2340-3&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Article (DOI)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Robert S. Kaplan and David McMillan, “Reimagining the Balanced Scorecard for the ESG Era” (2021)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Harvard Business Review, February 2021 (date from secondary sources)&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the proposal to update the perspectives (Outcomes, Stakeholders, Internal processes, Enablers) for multi-stakeholder and triple bottom line strategies. Some commentators note that it remains an adaptation of the original four perspectives. &lt;b&gt;Why it matters:&lt;/b&gt; it is the “balanced” model of Part III.&lt;/p&gt;&lt;a href=&quot;https://www.icaew.com/technical/business/business-performance-management/balanced-scorecard&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW overview of the balanced scorecard&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Mette Morsing and Dorte Oswald, on the Novo Nordisk case&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;The slides cite “Morsing and Oswald (2005)”; searches find a 2006 Palgrave chapter and the article “Sustainable leadership: management control systems and organizational culture in Novo Nordisk A/S”, Corporate Governance 9(1), 2009, pp. 83–99&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; a case study of how top management uses control systems (including the BSC) and culture to operationalise sustainability. &lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the quotation on the BSC as the tool for cascading the TBL. Check the exact date against the course bibliography.&lt;/p&gt;&lt;a href=&quot;https://research.cbs.dk/en/publications/sustainable-leadership-management-control-systems-and-organizatio/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Record of the 2009 article (Copenhagen Business School)&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Regulations and standards&lt;/h3&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Directive (EU) 2026/470, “Omnibus I”&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Published in the Official Journal of the EU on 26 February 2026, in force since 18 March 2026&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; it amends the CSRD and the CSDDD. CSRD scope: EU companies exceeding &lt;em&gt;both&lt;/em&gt; thresholds of 1,000 employees and €450 million in net turnover, mandatory from FY2027; transposition by 19 March 2027. One source estimates that the scope shrinks from about 50,000 to about 5,000 companies. &lt;b&gt;Why it matters:&lt;/b&gt; it defines who must measure, and therefore who needs a scorecard that assigns targets and owners.&lt;/p&gt;&lt;a href=&quot;https://sustainablefutures.linklaters.com/post/102mkjf/eu-omnibus-i-directive-published-in-the-official-journal-of-the-eu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Linklaters note on the publication&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Simplified ESRS (EFRAG)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;EFRAG technical advice to the Commission, 3 December 2025&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; a 61% reduction in mandatory “if material” data points and the removal of voluntary disclosures; the Commission will adopt them by delegated act (expected in mid-2026, possibly with amendments). &lt;b&gt;Why it matters:&lt;/b&gt; they are the standards that apply double materiality in the EU.&lt;/p&gt;&lt;a href=&quot;https://www.efrag.org/en/news-and-calendar/news/efrag-provides-its-technical-advice-on-draft-simplified-esrs-to-the-european-commission&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EFRAG press release&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;GRI Standards (Global Reporting Initiative)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Global standards for impact reporting&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; standards based on impact materiality: actual and potential, positive and negative impacts on the economy, the environment and people, regardless of financial materiality. &lt;b&gt;Why it matters:&lt;/b&gt; it is the inside-out pole of the spectrum of standards.&lt;/p&gt;&lt;a href=&quot;https://sustainablefutures.linklaters.com/post/102l3df/esg-quick-guide-gri-standards&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Linklaters quick guide to the GRI Standards&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;SASB Standards and ISSB (IFRS Foundation)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Industry-specific standards, now maintained by the International Sustainability Standards Board&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; financially material topics for 77 industries; a financial materiality perspective aimed at investors. GRI and the IFRS Foundation are working to align disclosures (joint statement of May 2026) without erasing the difference between the two materialities. &lt;b&gt;Why it matters:&lt;/b&gt; it is the outside-in pole of the spectrum.&lt;/p&gt;&lt;a href=&quot;https://www.globalreporting.org/media/4vvjc22m/joint-statement-from-gri-and-ifrs-foundation-may-2026.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Joint statement GRI–IFRS Foundation (PDF)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;UN Principles for Responsible Investment (PRI)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;UN-supported initiative, launched in 2006&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; six voluntary principles for investors, including incorporating ESG into analysis and decision-making, being active owners and reporting on progress. &lt;b&gt;Why it matters:&lt;/b&gt; it explains the “investors and banks” pressure in Part I.&lt;/p&gt;&lt;a href=&quot;https://www.dechert.com/knowledge/onpoint/2020/3/overview-of-united-nations--principles-for-responsible-investmen.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Overview (Dechert)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;WEF–IBC, &lt;em&gt;Measuring Stakeholder Capitalism&lt;/em&gt; (2020)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;World Economic Forum, International Business Council, with Deloitte, EY, KPMG, PwC; September 2020&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; 21 “core” and 34 “expanded” metrics, linked to the SDGs, as a common core of ESG measures. &lt;b&gt;Why it matters:&lt;/b&gt; a concrete example of a catalogue of measures; remember, however, that in the scorecard measures are &lt;em&gt;derived&lt;/em&gt; from the strategy, not picked from a list.&lt;/p&gt;&lt;a href=&quot;https://www.weforum.org/publications/measuring-stakeholder-capitalism-towards-common-metrics-and-consistent-reporting-of-sustainable-value-creation/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WEF publication&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Impact-Weighted Accounts (Harvard Business School)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Project launched in 2019, led by George Serafeim; spun off as IFVI in 2022&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; methods for turning positive and negative impacts on employees, customers, the environment and society into monetary line items. &lt;b&gt;Why it matters:&lt;/b&gt; it is the attempt mentioned in the slides to assign a monetary value to ESG impacts.&lt;/p&gt;&lt;a href=&quot;https://www.sir.advancedleadership.harvard.edu/articles/measure-what-really-matters-accounting-for-company-esg-impacts&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Harvard Advanced Leadership Initiative article&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;SEC climate disclosure rules (2024)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Adopted in March 2024, stayed by the SEC itself in April 2024&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; on 27 March 2025 the SEC voted to end its defence of the rules before the Eighth Circuit. &lt;b&gt;Why it matters:&lt;/b&gt; it confirms that the US has no federal requirement equivalent to the CSRD. I have not verified the status as of November 2026.&lt;/p&gt;&lt;a href=&quot;https://www.sec.gov/newsroom/press-releases/2025-58&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SEC press release 2025-58&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;The 2030 Agenda and the Sustainable Development Goals&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;UN Resolution A/RES/70/1, adopted on 25 September 2015&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; 17 goals and 169 targets, integrated and indivisible, balancing economic, social and environmental development. &lt;b&gt;Why it matters:&lt;/b&gt; it is the blueprint used as a benchmark.&lt;/p&gt;&lt;a href=&quot;https://social.desa.un.org/2030agenda-sdgs&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN DESA, Transforming our world&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;IMA Statement of Ethical Professional Practice&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Institute of Management Accountants, version in force since 1 July 2017&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; principles (honesty, fairness, objectivity, responsibility) and four standards: competence, confidentiality, integrity, credibility. It binds IMA members and CMA candidates. &lt;b&gt;Why it matters:&lt;/b&gt; it is the code of ethics invoked in the Microsoft case against greenwashing.&lt;/p&gt;&lt;a href=&quot;https://eu.imanet.org/career-resources/ethics-center/statement&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMA page&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Società Benefit, Law no. 208 of 28 December 2015, paragraphs 376–384&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;2016 Stability Law&lt;/div&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the legal form that writes one or more common benefits into the articles of association alongside profit, with the obligation to attach an annual impact report to the financial statements, prepared according to an external standard (Annex 4). &lt;b&gt;Why it matters:&lt;/b&gt; it is the Italian example of mission first.&lt;/p&gt;&lt;a href=&quot;https://www.assolombarda.it/servizi/credito-finanza-e-incentivi/informazioni/le-societa-benefit-fare-impresa-misurando-e-comunicando-il-proprio-valore-ambientale-e-sociale&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Assolombarda fact sheet&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Company cases cited&lt;/h3&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Novo Nordisk: the triple bottom line in the Articles of Association&lt;/h4&gt;&lt;p&gt;The principle was written into the Articles of Association at the 2004 general meeting; since 2004 the company has published an integrated report, and the 2025 report still describes it as fundamental to its identity.&lt;/p&gt;&lt;a href=&quot;https://www.novonordisk.com/about/corporate-governance.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Novo Nordisk, corporate governance&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Patagonia, “Earth is now our only shareholder” (September 2022)&lt;/h4&gt;&lt;p&gt;The Patagonia Purpose Trust holds 2% (all voting shares), the Holdfast Collective (a 501(c)(4) non-profit) holds 98% (non-voting shares); expected dividend of about $100 million a year.&lt;/p&gt;&lt;a href=&quot;https://www.patagonia.com/ownership/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Patagonia, ownership page&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Chiesi, Società Benefit and B Corp&lt;/h4&gt;&lt;p&gt;Chiesi prepares the impact report required by Law 208/2015 and is a certified B Corp (recertified in 2022). Searches did not independently confirm the claim in the slides that in 2019 it became “the largest B Corp pharmaceutical group”.&lt;/p&gt;&lt;a href=&quot;https://www.chiesi.it/pdf/relazione_di_impatto2024.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Chiesi 2024 impact report (PDF)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Volkswagen, 2016 US settlement&lt;/h4&gt;&lt;p&gt;Up to $14.7 billion for about 475,000 2.0-litre diesel vehicles: about $10 billion for buybacks and repairs, $2.7 billion for a NOx mitigation fund, $2 billion over 10 years for zero-emission vehicles. The 3.0-litre vehicles and criminal liability were excluded.&lt;/p&gt;&lt;a href=&quot;https://dieselnet.com/news/2016/06vw.php&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DieselNet, June 2016&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Microsoft, “carbon negative by 2030” (16 January 2020)&lt;/h4&gt;&lt;p&gt;A commitment to halve emissions by 2030 (including value-chain emissions), a $1 billion Climate Innovation Fund and an annual environmental report.&lt;/p&gt;&lt;a href=&quot;https://blogs.microsoft.com/blog/2020/01/16/microsoft-will-be-carbon-negative-by-2030/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Official Microsoft blog&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Starbucks, C.A.F.E. Practices&lt;/h4&gt;&lt;p&gt;Guidelines developed with Conservation International, in place since 2004, with environmental, social and economic principles and third-party verification.&lt;/p&gt;&lt;a href=&quot;https://www.conservation.org/coffee&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Conservation International, Starbucks&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Summary written by Claude from the slides: always check against the material.&lt;/div&gt;&lt;/footer&gt;

    s+=&#x27;&lt;rect x=&quot;&#x27;+X(tf)+&#x27;&quot; y=&quot;20&quot; width=&quot;&#x27;+(390-X(tf))+&#x27;&quot; height=&quot;300&quot; fill=&quot;var(--ochre-bg)&quot; opacity=&quot;.8&quot;/&gt;&lt;rect x=&quot;50&quot; y=&quot;20&quot; width=&quot;&#x27;+(X(tf)-50)+&#x27;&quot; height=&quot;&#x27;+(Y(ti)-20)+&#x27;&quot; fill=&quot;var(--ochre-bg)&quot; opacity=&quot;.8&quot;/&gt;&#x27;;

    var inL=[],outL=[];

    mat.innerHTML=s+&#x27;&lt;/svg&gt;&#x27;;
    li.innerHTML=&#x27;&lt;b&gt;Material (&#x27;+inL.length+&#x27;):&lt;/b&gt; &#x27;+inL.join(&quot;, &quot;)+&#x27;.&lt;br&gt;&lt;span class=&quot;note&quot;&gt;&lt;b&gt;Non material:&lt;/b&gt; &#x27;+(outL.join(&quot;, &quot;)||&quot;none&quot;)+&#x27;.&lt;/span&gt;&#x27;;
  }

/* ---------- top of map toggle ---------- */

   mf:{boxes:[[[&quot;Environmental and social goals&quot;,&quot;var(--sage)&quot;]],[[&quot;Profit&quot;,&quot;var(--m-fin)&quot;]]],t:&quot;&lt;b&gt;Mission first.&lt;/b&gt; Profit is a means, or a constraint to be respected; the mission sits at the top. Examples from the slides: Patagonia, Società Benefit companies such as Chiesi.&quot;},
   ba:{boxes:[[[&quot;Profit&quot;,&quot;var(--m-fin)&quot;],[&quot;Planet and people&quot;,&quot;var(--sage)&quot;]],[[&quot;Processes and people&quot;,&quot;var(--m-pro)&quot;]]],t:&quot;&lt;b&gt;Balanced.&lt;/b&gt; Economic, environmental and social results carry equal weight and sit together at the top. Example from the slides: Novo Nordisk, with its triple bottom line.&quot;}
  };
  function dt(k){var v=V[k],s=&#x27;&lt;svg viewBox=&quot;0 0 420 170&quot; role=&quot;img&quot; aria-label=&quot;What sits at the top of the map&quot;&gt;&lt;defs&gt;&lt;marker id=&quot;tma&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;5&quot; markerHeight=&quot;5&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;&#x27;;
    v.boxes.forEach(function(row,i){var y=i?108:10,n=row.length,w=(380-(n-1)*12)/n;row.forEach(function(b,j){var x=20+j*(w+12);s+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;&#x27;+w+&#x27;&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;&#x27;+b[1]+&#x27;&quot;/&gt;&lt;text x=&quot;&#x27;+(x+w/2)+&#x27;&quot; y=&quot;&#x27;+(y+31)+&#x27;&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot; fill=&quot;#fff&quot;&gt;&#x27;+esc(b[0])+&#x27;&lt;/text&gt;&#x27;})});
    s+=&#x27;&lt;line x1=&quot;210&quot; y1=&quot;104&quot; x2=&quot;210&quot; y2=&quot;68&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;6&quot; marker-end=&quot;url(#tma)&quot;/&gt;&lt;/svg&gt;&#x27;;
    $(&quot;#topmap-svg&quot;).innerHTML=s;$(&quot;#topmap-txt&quot;).innerHTML=v.t;

  }
  $$(&quot;button&quot;,top).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){dt(b.getAttribute(&quot;data-k&quot;))})});dt(&quot;bc&quot;);
}

    $$(&quot;.hl-path,.hl-node&quot;,tree).forEach(function(e){e.classList.remove(&quot;hl-path&quot;,&quot;hl-node&quot;)});

/* ---------- win-win slider ---------- */
var ww=$(&quot;#ww&quot;);
if(ww){
  var fp=$(&quot;#ww-fp&quot;),pp=$(&quot;#ww-pp&quot;),en=$(&quot;#ww-en&quot;);
  function wdraw(){
    var f=+fp.value,p=+pp.value,e=+en.value;
    $(&quot;#ww-fp-o&quot;).textContent=f.toFixed(2);$(&quot;#ww-pp-o&quot;).textContent=p.toFixed(2);$(&quot;#ww-en-o&quot;).textContent=e.toFixed(2);
    var cost=f*1.2,gain=p+e,net=gain-cost,sc=60;
    var bar=function(y,v,lab,col){var w=Math.abs(v)*sc;return&#x27;&lt;text x=&quot;0&quot; y=&quot;&#x27;+(y+17)+&#x27;&quot; font-size=&quot;12.5&quot; fill=&quot;var(--ink)&quot;&gt;&#x27;+lab+&#x27;&lt;/text&gt;&lt;rect x=&quot;190&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;&#x27;+Math.max(w,1)+&#x27;&quot; height=&quot;24&quot; rx=&quot;5&quot; fill=&quot;&#x27;+col+&#x27;&quot;/&gt;&lt;text x=&quot;&#x27;+(196+w)+&#x27;&quot; y=&quot;&#x27;+(y+17)+&#x27;&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;&#x27;+(v&gt;=0?&quot;+&quot;:&quot;−&quot;)+Math.abs(v).toFixed(2)+&#x27; €/kg&lt;/text&gt;&#x27;};
    var s=&#x27;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;Effect on margin per kg&quot;&gt;&#x27;+bar(8,-cost,&quot;Extra cost paid to farmers&quot;,&quot;var(--ko)&quot;)+bar(44,p,&quot;Price premium from bars&quot;,&quot;var(--ok)&quot;)+bar(80,e,&quot;Energy savings&quot;,&quot;var(--sage)&quot;)+&#x27;&lt;line x1=&quot;0&quot; y1=&quot;116&quot; x2=&quot;560&quot; y2=&quot;116&quot; stroke=&quot;var(--rule)&quot;/&gt;&#x27;+bar(122,net,&quot;Net effect on margin&quot;,net&gt;=0?&quot;var(--ok)&quot;:&quot;var(--ko)&quot;)+&#x27;&lt;/svg&gt;&#x27;;
    $(&quot;#ww-svg&quot;).innerHTML=s;
    var v=$(&quot;#ww-v&quot;);
    if(net&gt;=0.005){v.style.background=&quot;var(--sage-bg)&quot;;v.innerHTML=&quot;&lt;b&gt;Win win.&lt;/b&gt; The margin per kg rises by €&quot;+net.toFixed(2)+&quot;: Caffè Lago&#x27;s bet (if we pay farmers more, then bars pay more for a responsibly sourced coffee) is confirmed by the data.&quot;;}
    else if(net&gt;-0.005){v.style.background=&quot;var(--ochre-bg)&quot;;v.innerHTML=&quot;&lt;b&gt;Break-even.&lt;/b&gt; The social benefit costs the margin nothing: we are on the boundary between trade-off and win win.&quot;;}
    else{v.style.background=&quot;var(--brick-bg)&quot;;v.innerHTML=&quot;&lt;b&gt;Trade-off.&lt;/b&gt; The margin falls by €&quot;+Math.abs(net).toFixed(2)+&quot; per kg: good for the farmers, costly for the company. The if/then hypothesis is not (yet) confirmed: the strategy or the price needs to be revisited.&quot;;}
  }
  [fp,pp,en].forEach(function(i){i.addEventListener(&quot;input&quot;,wdraw)});wdraw();
}

/* ---------- tool or symbol ---------- */
var ck=$(&quot;#tos&quot;);
if(ck){var cb=$$(&quot;input&quot;,ck);function tv(){var n=cb.filter(function(c){return c.checked}).length,v=$(&quot;#tos-v&quot;);

/* ---------- cascade stepper ---------- */
var cs=$(&quot;#cascade&quot;);
if(cs){var CT=[
 &quot;&lt;b&gt;1 · Company.&lt;/b&gt; One scorecard for Novo Nordisk as a whole: this is where the triple bottom line lives, with the 24 objectives under four headings.&quot;,
 &quot;&lt;b&gt;2 · Executive vice presidents.&lt;/b&gt; One scorecard for each of the five executive areas (in the figure: Operations).&quot;,
 &quot;&lt;b&gt;3 · Senior vice presidents.&lt;/b&gt; Twenty business unit scorecards (in the figure: Product Supply).&quot;,
 &quot;&lt;b&gt;4 · Sub-units.&lt;/b&gt; For example a factory such as Diabetes Finished Products: often just a set of KPIs rather than the four perspectives. An optional level. This is where the CO₂ target risks disappearing.&quot;,
 &quot;&lt;b&gt;5 · People.&lt;/b&gt; Personal objectives, set and reviewed twice a year: cascading reaches all the way down to the individual.&quot;],ci=0;
 function cdraw(){$$(&quot;[data-lv]&quot;,cs).forEach(function(r){var on=+r.getAttribute(&quot;data-lv&quot;)===ci;r.setAttribute(&quot;stroke&quot;,on?&quot;var(--acc)&quot;:&quot;none&quot;);r.setAttribute(&quot;stroke-width&quot;,on?4:0)});
  $(&quot;#cascade-t&quot;).innerHTML=CT[ci];$(&quot;#cs-prev&quot;).disabled=ci===0;$(&quot;#cs-next&quot;).disabled=ci===4;$(&quot;#cs-n&quot;).textContent=(ci+1)+&quot; / 5&quot;;}
 $(&quot;#cs-prev&quot;).addEventListener(&quot;click&quot;,function(){if(ci&gt;0){ci--;cdraw()}});$(&quot;#cs-next&quot;).addEventListener(&quot;click&quot;,function(){if(ci&lt;4){ci++;cdraw()}});cdraw();}

$$(&quot;.stepper&quot;).forEach(function(st){var b=$$(&quot;.steps button&quot;,st),p=$$(&quot;.stepbody &gt; div&quot;,st);
  b.forEach(function(x,i){x.addEventListener(&quot;click&quot;,function(){b.forEach(function(o,j){o.setAttribute(&quot;aria-pressed&quot;,i===j)});p.forEach(function(q,j){q.hidden=i!==j})})});});
})();
