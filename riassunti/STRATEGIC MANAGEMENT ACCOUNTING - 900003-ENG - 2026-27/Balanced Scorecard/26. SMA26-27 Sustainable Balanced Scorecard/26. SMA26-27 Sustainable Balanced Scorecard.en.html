&lt;a href=&quot;#s2-def&quot;&gt;&lt;rect x=&quot;320&quot; y=&quot;220&quot; width=&quot;260&quot; height=&quot;96&quot; rx=&quot;18&quot; fill=&quot;var(--acc)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;256&quot; font-family=&quot;Newsreader,Georgia,serif&quot; font-size=&quot;21&quot; fill=&quot;var(--paper)&quot;&gt;Sustainable&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;282&quot; font-family=&quot;Newsreader,Georgia,serif&quot; font-size=&quot;21&quot; fill=&quot;var(--paper)&quot;&gt;Balanced Scorecard&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;304&quot; font-size=&quot;11.5&quot; fill=&quot;var(--paper)&quot;&gt;definition&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s3&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;335&quot; width=&quot;225&quot; height=&quot;60&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;152&quot; y=&quot;361&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;Market vs&lt;/text&gt;&lt;text x=&quot;152&quot; y=&quot;381&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;non-market aspects&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s3-opt&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;435&quot; width=&quot;225&quot; height=&quot;70&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;152&quot; y=&quot;462&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;3 architectures +&lt;/text&gt;&lt;text x=&quot;152&quot; y=&quot;482&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;what sits at the top&lt;/text&gt;&lt;text x=&quot;152&quot; y=&quot;498&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;Hansen &amp;amp; Schaltegger&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s4&quot;&gt;&lt;rect x=&quot;635&quot; y=&quot;335&quot; width=&quot;225&quot; height=&quot;60&quot; rx=&quot;14&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;747&quot; y=&quot;361&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;Designing in 3 steps&lt;/text&gt;&lt;text x=&quot;747&quot; y=&quot;381&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;Alpe Verde · Caffè Lago&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s4-tool&quot;&gt;&lt;rect x=&quot;635&quot; y=&quot;435&quot; width=&quot;225&quot; height=&quot;70&quot; rx=&quot;14&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;747&quot; y=&quot;462&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;Tool or symbol?&lt;/text&gt;&lt;text x=&quot;747&quot; y=&quot;482&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;Greenwashing&lt;/text&gt;&lt;text x=&quot;747&quot; y=&quot;498&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;Microsoft case&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s5&quot;&gt;&lt;rect x=&quot;335&quot; y=&quot;440&quot; width=&quot;230&quot; height=&quot;64&quot; rx=&quot;14&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;467&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;Real case: Novo Nordisk&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;487&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;cascading scorecard&lt;/text&gt;&lt;/a&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;p class=&quot;cap&quot;&gt;Click a node to jump to the section. Dashed lines connect related concepts: stakeholders explain why non-market aspects exist; double materiality feeds the choice of aspects in the 3 steps.&lt;/p&gt;
&lt;/div&gt;
&lt;/header&gt;
&lt;/div&gt;

&lt;main class=&quot;wrap&quot;&gt;
&lt;section class=&quot;part p1&quot; id=&quot;s1&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;I&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Part one · learning objective 1&lt;/div&gt;&lt;h2&gt;Why sustainability enters the scorecard&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;The lecture starts from a simple question: if the balanced scorecard serves to translate strategy into measures, &lt;strong&gt;where do environmental and social objectives belong&lt;/strong&gt;? The lecture&#x27;s answer: within the same logic, not alongside it. First, however, we need to understand why these objectives have become &lt;em&gt;strategic&lt;/em&gt;.&lt;/p&gt;

&lt;h3&gt;Recap: a strategy map in four lines&lt;/h3&gt;
&lt;p&gt;A &lt;dfn&gt;strategy map&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(the diagram that links objectives through cause-and-effect arrows)&lt;/span&gt; arranges objectives into four &lt;dfn&gt;perspectives&lt;/dfn&gt;: Financial, Customer, Internal processes, Learning and growth. The recap example is a low-cost airline, already seen in the previous lecture on the balanced scorecard.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;svgbox&quot; data-map=&quot;airline&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;
&lt;div&gt;
&lt;ul class=&quot;tight&quot;&gt;
&lt;li&gt;Measures are &lt;strong&gt;derived from the strategy&lt;/strong&gt;, not picked from a list.&lt;/li&gt;
&lt;li&gt;Each arrow is an &lt;dfn&gt;if/then hypothesis&lt;/dfn&gt;: &lt;em&gt;if&lt;/em&gt; crews work as a team, &lt;em&gt;then&lt;/em&gt; the aircraft turns around in 25 minutes; &lt;em&gt;if&lt;/em&gt; it turns around quickly, &lt;em&gt;then&lt;/em&gt; the airline can offer low fares and punctuality… The data can confirm or refute it.&lt;/li&gt;
&lt;li&gt;The financial perspective is the &lt;strong&gt;final test&lt;/strong&gt;: if nothing reaches the economic result, the strategy must be called into question.&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;Lecture question:&lt;/b&gt; where do environmental and social objectives fit into this logic?&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;h3&gt;From shareholders to stakeholders&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Friedman, 1970&lt;/div&gt;&lt;h4&gt;Shareholder view&lt;/h4&gt;&lt;p&gt;The responsibility of business is to increase its profits. What matters is the &lt;strong&gt;financial result&lt;/strong&gt; for the owners (&lt;dfn&gt;shareholders&lt;/dfn&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;Freeman, 1984&lt;/div&gt;&lt;h4&gt;Stakeholder view&lt;/h4&gt;&lt;p&gt;A &lt;dfn&gt;stakeholder&lt;/dfn&gt; is any group or individual who &lt;strong&gt;can affect or is affected by&lt;/strong&gt; the firm&#x27;s activities. What matters are the results for &lt;strong&gt;all&lt;/strong&gt; stakeholders.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Stakeholders of different kinds: employees, consumers, suppliers, local communities, institutions and authorities, NGOs. The firm is an &lt;dfn&gt;open system&lt;/dfn&gt;: &lt;em&gt;accountability&lt;/em&gt;, competitive advantage and long-term survival depend on its relationships with the internal and external environment.&lt;/p&gt;

&lt;h3&gt;The triple bottom line: people, planet, profit&lt;/h3&gt;
&lt;p&gt;The &lt;dfn&gt;bottom line&lt;/dfn&gt; is literally the last line of the income statement: net profit. In the 1990s, John Elkington proposed judging a company on &lt;strong&gt;three&lt;/strong&gt; bottom lines rather than one: the &lt;dfn&gt;triple bottom line&lt;/dfn&gt; (TBL).&lt;/p&gt;
&lt;div class=&quot;svgbox&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Triple bottom line diagram: three overlapping circles&quot;&gt;
&lt;g opacity=&quot;.88&quot;&gt;&lt;circle cx=&quot;250&quot; cy=&quot;120&quot; r=&quot;100&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;390&quot; cy=&quot;120&quot; r=&quot;100&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;320&quot; cy=&quot;200&quot; r=&quot;100&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot;/&gt;&lt;/g&gt;
&lt;g text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;
&lt;text x=&quot;215&quot; y=&quot;85&quot; font-weight=&quot;700&quot; fill=&quot;var(--brick)&quot;&gt;PEOPLE&lt;/text&gt;&lt;text x=&quot;215&quot; y=&quot;103&quot; fill=&quot;var(--ink)&quot;&gt;social performance&lt;/text&gt;
&lt;text x=&quot;425&quot; y=&quot;85&quot; font-weight=&quot;700&quot; fill=&quot;var(--sage)&quot;&gt;PLANET&lt;/text&gt;&lt;text x=&quot;425&quot; y=&quot;103&quot; fill=&quot;var(--ink)&quot;&gt;environmental performance&lt;/text&gt;
&lt;text x=&quot;320&quot; y=&quot;262&quot; font-weight=&quot;700&quot; fill=&quot;var(--slate)&quot;&gt;PROFIT&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;280&quot; fill=&quot;var(--ink)&quot;&gt;economic performance&lt;/text&gt;
&lt;text x=&quot;320&quot; y=&quot;158&quot; font-weight=&quot;700&quot; fill=&quot;var(--acc)&quot; font-size=&quot;12&quot;&gt;managed&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;173&quot; font-weight=&quot;700&quot; fill=&quot;var(--acc)&quot; font-size=&quot;12&quot;&gt;together?&lt;/text&gt;
&lt;/g&gt;
&lt;g font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;&lt;text x=&quot;10&quot; y=&quot;40&quot;&gt;employees, supply chain, customer&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;55&quot;&gt;health, communities, rights&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;40&quot; text-anchor=&quot;end&quot;&gt;emissions, energy, water,&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;55&quot; text-anchor=&quot;end&quot;&gt;materials, waste, biodiversity&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;270&quot;&gt;sales, margins, returns,&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;285&quot;&gt;jobs, taxes&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/div&gt;
&lt;p&gt;The open question, the slide says, is not &lt;em&gt;whether&lt;/em&gt; to measure the three lines but &lt;strong&gt;how to manage them together&lt;/strong&gt;. The whole lecture is an answer to this question.&lt;/p&gt;

&lt;h3&gt;ESG: three sets of responsibilities&lt;/h3&gt;
&lt;p&gt;Today investors, customers, employees, suppliers, regulators and communities judge a company on three criteria, summarised by the acronym &lt;dfn&gt;ESG&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(Environmental, Social, Governance)&lt;/span&gt;. What is new compared with the TBL is &lt;strong&gt;Governance&lt;/strong&gt;: without it, environmental and social performance does not improve.&lt;/p&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--sage)&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--sage)&quot;&gt;E · Environmental&lt;/div&gt;&lt;p class=&quot;gl&quot;&gt;How processes, policies, products and packaging improve environmental sustainability.&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Less packaging waste, fewer emissions, less water&lt;/li&gt;&lt;li&gt;Renewable energy, green buildings, responsible sourcing&lt;/li&gt;&lt;li&gt;Recycling and biodiversity&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--brick)&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--brick)&quot;&gt;S · Social&lt;/div&gt;&lt;p class=&quot;gl&quot;&gt;How the company improves the health, well-being and rights of its stakeholders.&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Employees: training, fair wages, safety&lt;/li&gt;&lt;li&gt;Suppliers: no child labour&lt;/li&gt;&lt;li&gt;Customers: privacy, safe products&lt;/li&gt;&lt;li&gt;Communities: local hiring, education&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--slate)&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--slate)&quot;&gt;G · Governance&lt;/div&gt;&lt;p class=&quot;gl&quot;&gt;Policies and practices used to direct and control the company.&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;A diverse and qualified board&lt;/li&gt;&lt;li&gt;ESG culture and ethical decision-making&lt;/li&gt;&lt;li&gt;Transparent reporting&lt;/li&gt;&lt;li&gt;Executive compensation linked to ESG&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Try it yourself: E, S or G? &lt;span class=&quot;tag slide&quot;&gt;exercise from the slides&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;Continental Dynamics&lt;/b&gt;, a manufacturer of jet engine components, must demonstrate a strong ESG profile to take part in a public tender. Classify each item; after answering you will also see the direction (↑ better if it increases, ↓ better if it decreases).&lt;/p&gt;
&lt;div class=&quot;quiz&quot; id=&quot;quiz-esg&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;score&quot; aria-live=&quot;polite&quot;&gt;Choose a letter for each item.&lt;/p&gt;
&lt;p class=&quot;note&quot;&gt;Solution from the slides: five social items, four governance items, three environmental items; only packaging waste is better when it falls. Note that “fair pricing” and “policies against harassment” are S, not G: they concern how customers and employees are treated, not how the company is directed.&lt;/p&gt;

&lt;h3&gt;Four pressures that make ESG strategic&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Regulation&lt;/h4&gt;&lt;p&gt;EU rules on sustainability reporting and &lt;dfn&gt;due diligence&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(the preventive assessment of risks along the value chain)&lt;/span&gt;; carbon pricing; product regulations.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Investors and banks&lt;/h4&gt;&lt;p&gt;ESG ratings, sustainable finance, loan terms linked to sustainability targets.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Customers and supply chains&lt;/h4&gt;&lt;p&gt;Large customers require suppliers to provide emissions data, certifications and codes of conduct.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;People&lt;/h4&gt;&lt;p&gt;Graduates and employees look at a company&#x27;s &lt;em&gt;purpose&lt;/em&gt; and practices when choosing where to work.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Risks and opportunities&lt;/h3&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Risks and opportunities&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;ro1&quot; id=&quot;ro1t&quot;&gt;Risk&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;ro2&quot; id=&quot;ro2t&quot;&gt;Opportunity&lt;/button&gt;
&lt;/div&gt;
&lt;div id=&quot;ro1&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel card&quot;&gt;
&lt;h4&gt;Ignoring ESG: the damage spreads&lt;/h4&gt;
&lt;p&gt;A company discharges pollutants into a river. What follows: negative press, boycotts and lost customers; fewer talented applicants and higher &lt;em&gt;turnover&lt;/em&gt;; disillusioned investors; lawsuits and fines from the authorities. The damage starts from an environmental aspect and reaches all four perspectives.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;In practice:&lt;/b&gt; through its Coffee and Farmer Equity (C.A.F.E.) Practices, Starbucks monitors the economic, social and environmental impact of more than &lt;b&gt;400,000 farmers in 30 countries&lt;/b&gt;: a way of keeping supply-chain risk under control.&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;ro2&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel card&quot; hidden&gt;
&lt;h4&gt;Using ESG to innovate and grow&lt;/h4&gt;
&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;New products that customers want&lt;/li&gt;&lt;li&gt;Sustainable branding that sells&lt;/li&gt;&lt;li&gt;Better planning under uncertainty&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;&lt;b&gt;In practice:&lt;/b&gt; Timberland makes its Earthkeepers footwear with plastic recycled from millions of water bottles; Allbirds and MUD Jeans follow the same idea.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;When the risk becomes real: Volkswagen&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;United States, 2015 · the facts&lt;/div&gt;
&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Software in Volkswagen, Audi and Porsche diesel cars (model years 2009–2015) detected emissions tests and reduced emissions &lt;em&gt;only during the test&lt;/em&gt;.&lt;/li&gt;
&lt;li&gt;On the road, the cars emitted up to &lt;b&gt;40 times&lt;/b&gt; the US limit for toxic emissions.&lt;/li&gt;
&lt;li&gt;Volkswagen held almost &lt;b&gt;70%&lt;/b&gt; of the US diesel car market.&lt;/li&gt;
&lt;li&gt;It agreed to pay &lt;b&gt;$14.7 billion&lt;/b&gt; in the US and could no longer sell most of its diesel stock.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;1. What would happen if all manufacturers cheated on the tests?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Emission limits would become meaningless, air quality would deteriorate and regulators would stop trusting any test.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;2. Effect on the industry&#x27;s environmental performance?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;It would worsen, followed by stricter and costlier controls for everyone, including those who had not cheated.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;3. How are customers affected?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;They paid for a “clean” car they did not receive; resale value fell and trust in the brand was lost.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;4. Which costs are financial and which are intangible?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Financial:&lt;/b&gt; fines, vehicle buybacks, repairs. &lt;b&gt;Intangible:&lt;/b&gt; reputation, loss of the US diesel market, management time, employee morale.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;The lesson of the case:&lt;/b&gt; a &lt;em&gt;non-market&lt;/em&gt; aspect (emissions controlled by regulators) turned into one of the largest financial losses in the automotive industry. It is the same pattern we will find at Novo Nordisk: an issue outside the market that becomes an income-statement issue.&lt;/div&gt;

&lt;div class=&quot;selfcheck&quot;&gt;
&lt;h3&gt;Self-check · Part I&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What is the essential difference between Friedman&#x27;s view and Freeman&#x27;s?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Friedman (1970): the only responsibility of business is to increase profits; what matters are the results for shareholders. Freeman (1984): what matters are the results for everyone who affects or is affected by the company (stakeholders).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What does the ESG acronym add to the triple bottom line?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Governance: the policies and practices through which the company is directed and controlled (board, ethics, transparency, ESG-linked compensation). Without governance, environmental and social performance does not improve.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why does “packaging material waste” have the ↓ arrow while “responsible materials sourcing” has ↑?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;The arrow shows the desirable direction of the measure: waste is better when it decreases, the share of responsibly sourced materials is better when it increases. Every measure in a scorecard must have an explicit direction.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;List the four pressures that make ESG strategic.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Regulation; investors and banks; customers and supply chains; people (talent and employees).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;In the Volkswagen case, why do we speak of a “non-market” aspect that became financial?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Emissions are governed by regulators, not by the market; yet the violation generated $14.7 billion in costs in the US and the loss of the diesel market, i.e. direct effects on the economic result.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p2&quot; id=&quot;s2&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;II&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Part two · objectives 1 and 2&lt;/div&gt;&lt;h2&gt;Rules, standards and double materiality&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Having clarified &lt;em&gt;why&lt;/em&gt; ESG matters, the lecture turns to &lt;em&gt;what&lt;/em&gt; companies must report and &lt;em&gt;how&lt;/em&gt; they choose what to measure. The bridge to the scorecard is a sentence from the slides: &lt;strong&gt;what a company must report, it must first measure; the scorecard gives every measure a target and an owner&lt;/strong&gt;.&lt;/p&gt;

&lt;h3&gt;EU rules: who must report, and what&lt;/h3&gt;
&lt;p&gt;The &lt;dfn&gt;CSRD&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(Corporate Sustainability Reporting Directive, the EU directive on sustainability reporting)&lt;/span&gt; was simplified in 2026 by the &lt;dfn&gt;Omnibus I&lt;/dfn&gt; directive. In brief:&lt;/p&gt;
&lt;div class=&quot;grid4&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;Who&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;1,000+&lt;/div&gt;&lt;p&gt;employees &lt;b&gt;and&lt;/b&gt; more than €450 million in turnover (both thresholds)&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;When&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;2027&lt;/div&gt;&lt;p&gt;first financial year covered; first reports in 2028&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;What&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;ESRS&lt;/div&gt;&lt;p&gt;European Sustainability Reporting Standards, simplified, with fewer &lt;em&gt;data points&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;Checked by&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;Auditor&lt;/div&gt;&lt;p&gt;&lt;dfn&gt;limited assurance&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(the auditor states that nothing has come to their attention indicating material misstatement, without a full examination)&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;&lt;b&gt;How topics are chosen:&lt;/b&gt; through double materiality (below), i.e. impacts on people and the planet &lt;em&gt;and&lt;/em&gt; financial risks and opportunities. &lt;span class=&quot;note&quot;&gt;Directive (EU) 2026/470 (Omnibus I), published on 26 February 2026; transposition by 19 March 2027.&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Many standards, one direction&lt;/h3&gt;
&lt;p&gt;Outside the EU, companies choose among several &lt;dfn&gt;standard setters&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(bodies that issue standards)&lt;/span&gt;. The simplest way to tell them apart: ask &lt;strong&gt;which direction of materiality&lt;/strong&gt; each one looks in.&lt;/p&gt;
&lt;div class=&quot;svgbox&quot;&gt;
&lt;svg viewBox=&quot;0 0 700 190&quot; role=&quot;img&quot; aria-label=&quot;Spectrum of standards from inside-out to outside-in&quot;&gt;
&lt;defs&gt;&lt;linearGradient id=&quot;spg&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;var(--sage)&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;var(--slate)&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;
&lt;text x=&quot;20&quot; y=&quot;22&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;var(--sage)&quot;&gt;INSIDE-OUT&lt;/text&gt;&lt;text x=&quot;20&quot; y=&quot;40&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;the company&#x27;s impact on people and planet&lt;/text&gt;
&lt;text x=&quot;680&quot; y=&quot;22&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;var(--slate)&quot; text-anchor=&quot;end&quot;&gt;OUTSIDE-IN&lt;/text&gt;&lt;text x=&quot;680&quot; y=&quot;40&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot; text-anchor=&quot;end&quot;&gt;effects on the company&#x27;s results&lt;/text&gt;
&lt;rect x=&quot;30&quot; y=&quot;64&quot; width=&quot;640&quot; height=&quot;6&quot; rx=&quot;3&quot; fill=&quot;url(#spg)&quot;/&gt;
&lt;circle cx=&quot;140&quot; cy=&quot;67&quot; r=&quot;13&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;circle cx=&quot;350&quot; cy=&quot;67&quot; r=&quot;13&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;circle cx=&quot;560&quot; cy=&quot;67&quot; r=&quot;13&quot; fill=&quot;var(--slate)&quot;/&gt;
&lt;g text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;140&quot; y=&quot;106&quot; font-size=&quot;17&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;GRI&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;126&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;impacts on the economy,&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;141&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;environment and people;&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;156&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;for all stakeholders&lt;/text&gt;
&lt;text x=&quot;350&quot; y=&quot;106&quot; font-size=&quot;17&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;ESRS&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;126&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;EU standards: both&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;141&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;directions together =&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;156&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;double materiality&lt;/text&gt;
&lt;text x=&quot;560&quot; y=&quot;106&quot; font-size=&quot;17&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;SASB&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;126&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;financially material topics,&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;141&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;industry by industry; for&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;156&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;investors; now overseen by the ISSB&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Also used&lt;/h4&gt;&lt;p&gt;&lt;b&gt;UN PRI&lt;/b&gt;: Principles for Responsible Investment. &lt;b&gt;WEF and IBC&lt;/b&gt;: the &lt;em&gt;Stakeholder Capitalism Metrics&lt;/em&gt;, a common core set of measures.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Why it is still difficult&lt;/h4&gt;&lt;p&gt;There is still no single standard; &lt;em&gt;assurance&lt;/em&gt; practice varies; assigning a &lt;b&gt;monetary value&lt;/b&gt; to ESG impacts is difficult (&lt;dfn&gt;impact weighted accounting&lt;/dfn&gt; attempts it, &lt;span class=&quot;gl&quot;&gt;accounting that translates impacts into monetary terms&lt;/span&gt;). In the US, the SEC&#x27;s 2024 climate rules are &lt;b&gt;not in force&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The UN Sustainable Development Goals&lt;/h3&gt;
&lt;p&gt;The &lt;dfn&gt;SDGs&lt;/dfn&gt; are not a reporting standard but a &lt;dfn&gt;blueprint&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(a reference framework)&lt;/span&gt;: the 17 goals of the UN 2030 Agenda, each with targets that companies and governments use as a &lt;em&gt;benchmark&lt;/em&gt;.&lt;/p&gt;
&lt;div class=&quot;sdg&quot;&gt;
&lt;div&gt;&lt;b&gt;1&lt;/b&gt;No poverty&lt;/div&gt;&lt;div&gt;&lt;b&gt;2&lt;/b&gt;Zero hunger&lt;/div&gt;&lt;div&gt;&lt;b&gt;3&lt;/b&gt;Good health and wellbeing&lt;/div&gt;&lt;div&gt;&lt;b&gt;4&lt;/b&gt;Quality education&lt;/div&gt;&lt;div&gt;&lt;b&gt;5&lt;/b&gt;Gender equality&lt;/div&gt;&lt;div&gt;&lt;b&gt;6&lt;/b&gt;Clean water and sanitation&lt;/div&gt;&lt;div&gt;&lt;b&gt;7&lt;/b&gt;Affordable and clean energy&lt;/div&gt;&lt;div&gt;&lt;b&gt;8&lt;/b&gt;Decent work and economic growth&lt;/div&gt;&lt;div&gt;&lt;b&gt;9&lt;/b&gt;Industry, innovation and infrastructure&lt;/div&gt;&lt;div&gt;&lt;b&gt;10&lt;/b&gt;Reduced inequalities&lt;/div&gt;&lt;div&gt;&lt;b&gt;11&lt;/b&gt;Sustainable cities and communities&lt;/div&gt;&lt;div&gt;&lt;b&gt;12&lt;/b&gt;Responsible consumption and production&lt;/div&gt;&lt;div&gt;&lt;b&gt;13&lt;/b&gt;Climate action&lt;/div&gt;&lt;div&gt;&lt;b&gt;14&lt;/b&gt;Life below water&lt;/div&gt;&lt;div&gt;&lt;b&gt;15&lt;/b&gt;Life on land&lt;/div&gt;&lt;div&gt;&lt;b&gt;16&lt;/b&gt;Peace, justice and strong institutions&lt;/div&gt;&lt;div&gt;&lt;b&gt;17&lt;/b&gt;Partnerships for the goals&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;s2-mat&quot;&gt;Double materiality: two directions of view&lt;/h3&gt;
&lt;p&gt;A topic is &lt;dfn&gt;material&lt;/dfn&gt; when it matters enough to influence decisions. &lt;dfn&gt;Double materiality&lt;/dfn&gt; looks in two directions:&lt;/p&gt;
&lt;div class=&quot;svgbox&quot;&gt;
&lt;svg viewBox=&quot;0 0 700 200&quot; role=&quot;img&quot; aria-label=&quot;The two directions of double materiality&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;dma&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;/marker&gt;&lt;marker id=&quot;dmb&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;40&quot; y=&quot;55&quot; width=&quot;170&quot; height=&quot;90&quot; rx=&quot;16&quot; fill=&quot;var(--m-fin)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-size=&quot;16&quot; font-weight=&quot;700&quot;&gt;Company&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-size=&quot;12&quot;&gt;e.g. a pasta maker&lt;/text&gt;
&lt;rect x=&quot;490&quot; y=&quot;55&quot; width=&quot;180&quot; height=&quot;90&quot; rx=&quot;16&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;580&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot; font-size=&quot;16&quot; font-weight=&quot;700&quot;&gt;People and environment&lt;/text&gt;&lt;text x=&quot;580&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot; font-size=&quot;12&quot;&gt;valley, climate, farmers&lt;/text&gt;
&lt;path d=&quot;M215 78 H482&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;4&quot; marker-end=&quot;url(#dma)&quot;/&gt;&lt;path d=&quot;M485 122 H218&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;4&quot; marker-end=&quot;url(#dmb)&quot;/&gt;
&lt;text x=&quot;350&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot; fill=&quot;var(--brick)&quot;&gt;INSIDE-OUT · impact materiality&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;water, energy, trucks and emissions in the valley&lt;/text&gt;
&lt;text x=&quot;350&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot; fill=&quot;var(--slate)&quot;&gt;OUTSIDE-IN · financial materiality&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;drought in the South cuts the durum wheat harvest&lt;/text&gt;
&lt;/svg&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--brick)&quot;&gt;Inside-out&lt;/div&gt;&lt;h4&gt;Impact materiality&lt;/h4&gt;&lt;p&gt;How does the company affect people and the environment? &lt;b&gt;Example:&lt;/b&gt; a pasta maker uses a great deal of water and energy, and its trucks bring traffic and emissions into the valley.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--slate)&quot;&gt;Outside-in&lt;/div&gt;&lt;h4&gt;Financial materiality&lt;/h4&gt;&lt;p&gt;How do environmental and social issues affect the company&#x27;s results and risks? &lt;b&gt;Example:&lt;/b&gt; a drought in southern Italy reduces the durum wheat harvest, and the pasta maker pays more for its main raw material.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;Key rule:&lt;/b&gt; a topic is material if it matters in &lt;strong&gt;at least one&lt;/strong&gt; of the two directions (“OR” logic, not “AND”). For the scorecard, material topics are the &lt;em&gt;candidates&lt;/em&gt; to become measures.&lt;/div&gt;

&lt;h4&gt;Lab: the materiality matrix &lt;span class=&quot;tag ill&quot;&gt;illustrative example&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;The scores (0–10) of the pasta maker&#x27;s topics are invented to show the mechanism. Move the thresholds: a topic becomes material (filled) as soon as it exceeds &lt;em&gt;one&lt;/em&gt; of the two. The shaded area is the material zone.&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;Impact materiality threshold &lt;input type=&quot;range&quot; id=&quot;thi&quot; min=&quot;1&quot; max=&quot;9&quot; step=&quot;0.5&quot; value=&quot;6&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;thi-o&quot;&gt;&lt;/span&gt;&lt;/label&gt;
&lt;label&gt;Financial materiality threshold &lt;input type=&quot;range&quot; id=&quot;thf&quot; min=&quot;1&quot; max=&quot;9&quot; step=&quot;0.5&quot; value=&quot;6&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;thf-o&quot;&gt;&lt;/span&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;grid2&quot; style=&quot;align-items:start&quot;&gt;
&lt;div class=&quot;svgbox&quot; id=&quot;matchart&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;
&lt;div&gt;&lt;p id=&quot;matlist&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;p class=&quot;note&quot; id=&quot;matlegend&quot;&gt;&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Note: “paper used in the offices” stays out at any reasonable threshold. You will find it again in Part IV as an example of an aspect to leave &lt;em&gt;out&lt;/em&gt; of the scorecard.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The usual problem: sustainability “on the side”&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;A separate report&lt;/h4&gt;&lt;p&gt;Written once a year for external readers, not used in monthly management.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;A separate office&lt;/h4&gt;&lt;p&gt;The sustainability team “owns” the topic; the &lt;em&gt;line managers&lt;/em&gt; (operational managers) do not.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;No link to strategy&lt;/h4&gt;&lt;p&gt;Targets are not derived from the &lt;dfn&gt;value proposition&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(the value offered to customers)&lt;/span&gt;, so they compete with it.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;No link to incentives&lt;/h4&gt;&lt;p&gt;Managers are paid only on financial results: sustainability loses every &lt;dfn&gt;trade-off&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(a choice in which gaining on one front costs on the other)&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Result: good intentions, few changes in decisions, and the risk of &lt;dfn&gt;greenwashing&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(environmental claims that are more symbolic than substantive)&lt;/span&gt;.&lt;/p&gt;

&lt;div id=&quot;s2-def&quot; class=&quot;quote&quot;&gt;“A sustainable balanced scorecard links environmental and social aspects to the company&#x27;s strategy, so that they are managed inside the core business.”&lt;small&gt;Definition from the slides. It is not a new tool: it uses the logic of the balanced scorecard — &lt;b&gt;derive, link, measure, test&lt;/b&gt;.&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;grid4&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Derive&lt;/div&gt;&lt;p&gt;Environmental and social objectives follow from the strategy.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Link&lt;/div&gt;&lt;p&gt;Each has an if/then arrow towards the other objectives.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Measure&lt;/div&gt;&lt;p&gt;Each objective has a measure, a direction and a target.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Test&lt;/div&gt;&lt;p&gt;The data confirm or refute the arrows.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;selfcheck&quot;&gt;
&lt;h3&gt;Self-check · Part II&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;After Omnibus I, which EU companies fall within the CSRD, and from which financial year?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Those with more than 1,000 employees &lt;b&gt;and&lt;/b&gt; more than €450 million in turnover; the first financial year covered is 2027, with the first reports in 2028, subject to limited assurance.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Place GRI, ESRS and SASB on the inside-out / outside-in line.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;GRI: inside-out (impacts, for all stakeholders). SASB: outside-in (financial materiality, for investors, now under the ISSB). ESRS: both directions, i.e. double materiality.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;A topic has a high environmental impact but no financial effect. Is it material under double materiality?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Yes: it is enough for it to be material in one of the two directions. It therefore becomes a candidate measure for the scorecard.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Are the SDGs a reporting standard?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;No: they are a blueprint, the 17 goals of the UN 2030 Agenda, with targets used as benchmarks by companies and governments.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Which four symptoms indicate that sustainability is “on the side”?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Separate report, separate office, no link to strategy, no link to incentives. Consequence: few decisions change and the risk of greenwashing grows.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Restate the definition of the sustainable balanced scorecard and the four words of its logic.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;It links environmental and social aspects to the strategy, so that they are managed inside the core business. Logic: derive, link, measure, test.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p3&quot; id=&quot;s3&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;III&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Part three · objectives 2 and 3&lt;/div&gt;&lt;h2&gt;Where does each aspect go? The three architectures&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;The definition requires each environmental or social aspect to be &lt;strong&gt;linked&lt;/strong&gt; to the strategy. The first question is therefore: &lt;em&gt;by which path does the aspect reach the company?&lt;/em&gt;&lt;/p&gt;

&lt;h3&gt;Follow the aspect&#x27;s path&lt;/h3&gt;
&lt;div class=&quot;svgbox&quot;&gt;
&lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-label=&quot;An aspect reaches results through markets or outside markets&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;pa&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;10&quot; y=&quot;85&quot; width=&quot;170&quot; height=&quot;80&quot; rx=&quot;14&quot; fill=&quot;var(--m-fin)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;An environmental&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;139&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;or social aspect&lt;/text&gt;
&lt;rect x=&quot;250&quot; y=&quot;10&quot; width=&quot;270&quot; height=&quot;100&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;268&quot; y=&quot;38&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot; fill=&quot;var(--ink)&quot;&gt;Through markets&lt;/text&gt;&lt;text x=&quot;268&quot; y=&quot;60&quot; font-size=&quot;12.5&quot; fill=&quot;var(--ink)&quot;&gt;customers, suppliers, prices, costs&lt;/text&gt;&lt;text x=&quot;268&quot; y=&quot;84&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; fill=&quot;var(--muted)&quot;&gt;Supermarkets ask the pasta maker&lt;/text&gt;&lt;text x=&quot;268&quot; y=&quot;99&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; fill=&quot;var(--muted)&quot;&gt;for recyclable packaging.&lt;/text&gt;
&lt;rect x=&quot;250&quot; y=&quot;140&quot; width=&quot;270&quot; height=&quot;100&quot; rx=&quot;14&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;268&quot; y=&quot;168&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot; fill=&quot;var(--brick)&quot;&gt;Outside markets&lt;/text&gt;&lt;text x=&quot;268&quot; y=&quot;190&quot; font-size=&quot;12.5&quot; fill=&quot;var(--ink)&quot;&gt;laws, local communities, NGOs, media&lt;/text&gt;&lt;text x=&quot;268&quot; y=&quot;214&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; fill=&quot;var(--muted)&quot;&gt;Residents oppose a new silo&lt;/text&gt;&lt;text x=&quot;268&quot; y=&quot;229&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; fill=&quot;var(--muted)&quot;&gt;next to the plant.&lt;/text&gt;
&lt;rect x=&quot;590&quot; y=&quot;85&quot; width=&quot;160&quot; height=&quot;80&quot; rx=&quot;14&quot; fill=&quot;var(--m-pro)&quot;/&gt;&lt;text x=&quot;670&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Results&lt;/text&gt;&lt;text x=&quot;670&quot; y=&quot;134&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-size=&quot;11.5&quot;&gt;sales, costs,&lt;/text&gt;&lt;text x=&quot;670&quot; y=&quot;149&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-size=&quot;11.5&quot;&gt;licence to operate&lt;/text&gt;
&lt;g stroke=&quot;var(--acc)&quot; stroke-width=&quot;2.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#pa)&quot;&gt;&lt;path d=&quot;M182 110 L245 70&quot;/&gt;&lt;path d=&quot;M182 140 L245 180&quot;/&gt;&lt;path d=&quot;M522 70 L585 110&quot;/&gt;&lt;path d=&quot;M522 180 L585 140&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/div&gt;
&lt;p&gt;The &lt;dfn&gt;licence to operate&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(the social and formal consent to operate: permits, community acceptance)&lt;/span&gt; is the result most exposed to aspects outside markets.&lt;/p&gt;

&lt;h3&gt;Market and non-market aspects&lt;/h3&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Market aspects&lt;/th&gt;&lt;th&gt;Non-market aspects&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;How they act&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Through markets: customers, suppliers, prices, costs&lt;/td&gt;&lt;td&gt;Outside markets: laws, public opinion, communities, NGOs&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Examples&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Energy costs, demand for green products, scarce raw materials&lt;/td&gt;&lt;td&gt;Licence to operate, NGO campaigns, new regulation, reputation&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;In the scorecard&lt;/b&gt;&lt;/td&gt;&lt;td&gt;They fit into the four classic perspectives&lt;/td&gt;&lt;td&gt;They may require a perspective of their own&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;b&gt;Example from the slides:&lt;/b&gt; Enel&#x27;s share of renewables acts through &lt;b&gt;investors&lt;/b&gt; (market); residents protesting against a new plant act through the &lt;b&gt;community&lt;/b&gt; (non-market).&lt;/p&gt;

&lt;h4&gt;Try it yourself: market or non-market? &lt;span class=&quot;tag slide&quot;&gt;exercise from the slides&lt;/span&gt;&lt;/h4&gt;
&lt;div class=&quot;quiz&quot; id=&quot;quiz-mkt&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;score&quot; aria-live=&quot;polite&quot;&gt;Choose an answer for each case.&lt;/p&gt;
&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;Borderline cases:&lt;/b&gt; what matters is &lt;em&gt;where&lt;/em&gt; the effect starts. An EU rule raises costs (a market effect) but originates in a law: it is non-market. Water scarcity at a supplier is market, but it becomes non-market if the conflict over water becomes political.&lt;/div&gt;

&lt;h3 id=&quot;s3-opt&quot;&gt;Three options for a sustainable scorecard&lt;/h3&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;big&quot;&gt;1&lt;/div&gt;&lt;h4&gt;Integrate&lt;/h4&gt;&lt;p&gt;Place environmental and social measures &lt;b&gt;within&lt;/b&gt; the four existing perspectives.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;big&quot;&gt;2&lt;/div&gt;&lt;h4&gt;Add&lt;/h4&gt;&lt;p&gt;Create a &lt;b&gt;fifth&lt;/b&gt;, non-market perspective for aspects that act through society and politics.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;big&quot;&gt;3&lt;/div&gt;&lt;h4&gt;Derive&lt;/h4&gt;&lt;p&gt;Build a &lt;b&gt;dedicated&lt;/b&gt; environmental and social scorecard, derived from the main one.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;The options can be &lt;strong&gt;combined&lt;/strong&gt;. Explore them on the guiding case from the slides: a pasta maker producing quality pasta from Italian durum wheat, sold to supermarkets.&lt;/p&gt;

&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;The three options applied to the pasta maker&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;op1&quot;&gt;1 · Integrate&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;op2&quot;&gt;2 · Add a perspective&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;op3&quot;&gt;3 · Derive&lt;/button&gt;
&lt;/div&gt;
&lt;div id=&quot;op1&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot;&gt;
&lt;div class=&quot;svgbox&quot; data-map=&quot;pasta1&quot;&gt;&lt;/div&gt;
&lt;p&gt;Everything in four rows: environmental and social measures sit in the usual perspectives, and each has an arrow towards financial results. &lt;b&gt;Missing&lt;/b&gt;: residents&#x27; complaints about the trucks, which act outside markets.&lt;/p&gt;
&lt;h4&gt;Example measures by perspective&lt;/h4&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Perspective&lt;/th&gt;&lt;th&gt;Environmental measure&lt;/th&gt;&lt;th&gt;Social measure&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Financial&lt;/td&gt;&lt;td&gt;Revenue from low impact products &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Cost of workplace accidents &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Customer&lt;/td&gt;&lt;td&gt;Customers who see us as environmentally responsible &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Customers who trust our product safety &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Internal processes&lt;/td&gt;&lt;td&gt;Energy per unit produced &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Suppliers audited on labour standards &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Learning and growth&lt;/td&gt;&lt;td&gt;Employees trained on environmental practices &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Female to male average pay &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Strength&lt;/div&gt;&lt;p&gt;Sustainability sits &lt;b&gt;within the main chain&lt;/b&gt; of cause and effect and is managed by line managers like any other measure.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;Limitation&lt;/div&gt;&lt;p&gt;The four boxes only capture what arrives &lt;b&gt;through markets&lt;/b&gt;. Residents opposing a plant act through permits and public opinion: they have no natural place here. Option 2 solves the problem.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div id=&quot;op2&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot; hidden&gt;
&lt;div class=&quot;svgbox&quot; data-map=&quot;pasta2&quot;&gt;&lt;/div&gt;
&lt;p&gt;The &lt;b&gt;non-market perspective&lt;/b&gt; brings together society, regulators, NGOs, local communities and the media. Typical measures: community complaints &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;, open issues with regulators &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;, stakeholder trust &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;. Arrows run from the fifth perspective to &lt;em&gt;all&lt;/em&gt; the others: the community can block a process and affect customers and costs.&lt;/p&gt;
&lt;p&gt;It is used when non-market aspects are &lt;b&gt;strategically relevant&lt;/b&gt; and cannot be placed elsewhere.&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;op3&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot; hidden&gt;
&lt;div class=&quot;duo&quot;&gt;&lt;div&gt;&lt;h4&gt;Main scorecard&lt;/h4&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;pasta3a&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;arr&quot; aria-hidden=&quot;true&quot;&gt;➜&lt;/div&gt;&lt;div&gt;&lt;h4&gt;Derived: durum wheat programme&lt;/h4&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;pasta3b&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;A dedicated scorecard, for example for the &lt;b&gt;sustainability unit&lt;/b&gt; or for a &lt;b&gt;supplier programme&lt;/b&gt;. It is &lt;b&gt;derived&lt;/b&gt;: it details an objective already present in the main map (here &lt;em&gt;Wheat under contract&lt;/em&gt;, highlighted) and remains linked to it. Note how the Customer row becomes “Farmers”: in the programme, the “customers” to be satisfied are the farmers.&lt;/p&gt;
&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;Caution:&lt;/b&gt; used &lt;em&gt;on its own&lt;/em&gt;, the derived scorecard brings back the silo problem: a separate world with separate objectives.&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;ESG measures in the four perspectives&lt;/h3&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th style=&quot;color:var(--sage)&quot;&gt;Environmental&lt;/th&gt;&lt;th style=&quot;color:var(--brick)&quot;&gt;Social&lt;/th&gt;&lt;th style=&quot;color:var(--slate)&quot;&gt;Governance&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Financial&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Revenue from eco products &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Workers&#x27; compensation costs &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;td&gt;CEO pay ÷ average employee pay &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Customer&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Customers buying eco products &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Customers who say we care about local communities &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Customers who say we behave ethically &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Internal processes&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Water and carbon per unit produced &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Warranty claims ÷ sales &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Suppliers with verified child labour compliance &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Learning and growth&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Engineers trained in eco design &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Occupational injuries &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Board members with ESG training &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;Two formulas worth reading carefully: &lt;b&gt;CEO pay ÷ average employee pay&lt;/b&gt; (the &lt;em&gt;pay ratio&lt;/em&gt;: how many times CEO compensation exceeds average pay; lower = fairer) and &lt;b&gt;warranty claims ÷ sales&lt;/b&gt; (warranty claims per unit of sales, a proxy for product safety and quality). Caveat from the slides: they must be &lt;b&gt;linked&lt;/b&gt; through if/then statements and &lt;b&gt;tied to incentives&lt;/b&gt;, otherwise a stated commitment may not translate into action.&lt;/p&gt;

&lt;h3&gt;Comparing the three options&lt;/h3&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;1 · Integrate&lt;/th&gt;&lt;th&gt;2 · Add a perspective&lt;/th&gt;&lt;th&gt;3 · Derive&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Suitable when&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Most aspects act through markets&lt;/td&gt;&lt;td&gt;Licence to operate and public pressure matter&lt;/td&gt;&lt;td&gt;A unit or programme needs detail&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Strength&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Within the core cause-and-effect logic&lt;/td&gt;&lt;td&gt;Gives society a visible place&lt;/td&gt;&lt;td&gt;Operational focus&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Risk&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Non-market aspects are left out&lt;/td&gt;&lt;td&gt;Treated as an add-on rather than a driver&lt;/td&gt;&lt;td&gt;Becomes a silo if not linked&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;

&lt;h3&gt;Two choices define every sustainable scorecard&lt;/h3&gt;
&lt;p&gt;According to &lt;b&gt;Hansen and Schaltegger (2016)&lt;/b&gt;, a sustainable scorecard is described by &lt;strong&gt;two choices&lt;/strong&gt;: the rows indicate &lt;em&gt;where&lt;/em&gt; sustainability goes (the three options just discussed); the columns indicate &lt;em&gt;what the map is for&lt;/em&gt;, i.e. what sits at the top. Click the filled cells.&lt;/p&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table id=&quot;hsm&quot;&gt;
&lt;tr&gt;&lt;th&gt;Choice 1: where? ↓ · Choice 2: what at the top? →&lt;/th&gt;&lt;th&gt;Business case&lt;br&gt;&lt;span class=&quot;note&quot;&gt;profit at the top&lt;/span&gt;&lt;/th&gt;&lt;th&gt;Mission first&lt;br&gt;&lt;span class=&quot;note&quot;&gt;sustainability at the top&lt;/span&gt;&lt;/th&gt;&lt;th&gt;Balanced&lt;br&gt;&lt;span class=&quot;note&quot;&gt;several goals at the top&lt;/span&gt;&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;1. Integrate&lt;/b&gt;&lt;/td&gt;&lt;td data-x=&quot;&lt;b&gt;Pasta maker:&lt;/b&gt; sustainability within the four perspectives, profit at the top. Green objectives serve to sell premium lines and reduce costs.&quot; style=&quot;cursor:pointer;background:var(--cbg)&quot;&gt;Pasta maker&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td data-x=&quot;&lt;b&gt;Novo Nordisk&lt;/b&gt; (Part V): social and environmental objectives within four headings, with the customer perspective broadened to society; the triple bottom line at the top.&quot; style=&quot;cursor:pointer;background:var(--cbg)&quot;&gt;Novo Nordisk&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;2. Add a perspective&lt;/b&gt;&lt;/td&gt;&lt;td data-x=&quot;&lt;b&gt;Caffè Lago and Alpe Verde&lt;/b&gt; (Part IV): a fifth, non-market perspective, but profit stays at the top. Sustainability is part of the product.&quot; style=&quot;cursor:pointer;background:var(--cbg)&quot;&gt;Caffè Lago, Alpe Verde&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;3. Derive&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p id=&quot;hsm-out&quot; class=&quot;callout&quot; aria-live=&quot;polite&quot;&gt;The empty cells are not “impossible”: the lecture simply gives no examples of them. Try to imagine a company for each one.&lt;/p&gt;

&lt;h3&gt;Second choice: what sits at the top of the map?&lt;/h3&gt;
&lt;p&gt;In the traditional balanced scorecard, profit was &lt;em&gt;always&lt;/em&gt; at the top. Here it becomes a choice that reflects the company&#x27;s &lt;strong&gt;values&lt;/strong&gt; (Hansen and Schaltegger, 2016).&lt;/p&gt;
&lt;div id=&quot;topmap&quot;&gt;
&lt;div class=&quot;steps&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-k=&quot;bc&quot;&gt;Business case&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-k=&quot;mf&quot;&gt;Mission first&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-k=&quot;ba&quot;&gt;Balanced&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;&lt;div class=&quot;svgbox&quot; id=&quot;topmap-svg&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;&lt;p id=&quot;topmap-txt&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Mission first: two examples&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Patagonia, 2022&lt;/div&gt;&lt;h4&gt;“Earth is now our only shareholder”&lt;/h4&gt;&lt;p&gt;The founder gave the company away: the voting shares to a &lt;em&gt;trust&lt;/em&gt; that protects its values, the other 98% to a non-profit organisation fighting climate change. Profits not reinvested, about &lt;b&gt;$100 million a year&lt;/b&gt;, go to the environment.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;In Italy&lt;/div&gt;&lt;h4&gt;The Società Benefit (benefit corporation)&lt;/h4&gt;&lt;p&gt;Since 2016, Italian companies can write a &lt;b&gt;common benefit&lt;/b&gt; into their articles of association alongside profit. Chiesi, a pharmaceutical group based in Parma, chose this form and in 2019 became the world&#x27;s largest pharmaceutical group with &lt;b&gt;B Corp&lt;/b&gt; certification &lt;span class=&quot;gl&quot;&gt;(a private certification by B Lab of social and environmental performance; distinct from the Società Benefit, which is a legal form)&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;In both cases sustainability sits &lt;strong&gt;at the top of the map&lt;/strong&gt;; profit is a means of achieving it, not the end.&lt;/p&gt;

&lt;h4&gt;Balanced: the Kaplan and McMillan proposal&lt;/h4&gt;
&lt;div class=&quot;svgbox&quot;&gt;
&lt;svg viewBox=&quot;0 0 700 250&quot; role=&quot;img&quot; aria-label=&quot;From the four classic perspectives to those of Kaplan and McMillan&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;km&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;5&quot; markerHeight=&quot;5&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;g font-size=&quot;14&quot; font-weight=&quot;700&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;0&quot; y=&quot;5&quot; width=&quot;190&quot; height=&quot;48&quot; rx=&quot;9&quot; fill=&quot;var(--m-fin)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;34&quot; fill=&quot;#fff&quot;&gt;Financial&lt;/text&gt;
&lt;rect x=&quot;0&quot; y=&quot;67&quot; width=&quot;190&quot; height=&quot;48&quot; rx=&quot;9&quot; fill=&quot;var(--m-cus)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;96&quot; fill=&quot;#fff&quot;&gt;Customer&lt;/text&gt;
&lt;rect x=&quot;0&quot; y=&quot;129&quot; width=&quot;190&quot; height=&quot;48&quot; rx=&quot;9&quot; fill=&quot;var(--m-pro)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;158&quot; fill=&quot;#fff&quot;&gt;Internal processes&lt;/text&gt;
&lt;rect x=&quot;0&quot; y=&quot;191&quot; width=&quot;190&quot; height=&quot;48&quot; rx=&quot;9&quot; fill=&quot;var(--m-lea)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;220&quot; fill=&quot;var(--m-lea-t)&quot;&gt;Learning and growth&lt;/text&gt;
&lt;g fill=&quot;none&quot; stroke-width=&quot;2&quot;&gt;&lt;rect x=&quot;250&quot; y=&quot;5&quot; width=&quot;170&quot; height=&quot;48&quot; rx=&quot;9&quot; stroke=&quot;var(--m-fin)&quot;/&gt;&lt;rect x=&quot;250&quot; y=&quot;67&quot; width=&quot;170&quot; height=&quot;48&quot; rx=&quot;9&quot; stroke=&quot;var(--m-cus)&quot;/&gt;&lt;rect x=&quot;250&quot; y=&quot;129&quot; width=&quot;170&quot; height=&quot;48&quot; rx=&quot;9&quot; stroke=&quot;var(--m-pro)&quot;/&gt;&lt;rect x=&quot;250&quot; y=&quot;191&quot; width=&quot;170&quot; height=&quot;48&quot; rx=&quot;9&quot; stroke=&quot;var(--muted)&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;335&quot; y=&quot;34&quot; fill=&quot;var(--ink)&quot;&gt;Outcomes&lt;/text&gt;&lt;text x=&quot;335&quot; y=&quot;96&quot; fill=&quot;var(--ink)&quot;&gt;Stakeholders&lt;/text&gt;&lt;text x=&quot;335&quot; y=&quot;158&quot; fill=&quot;var(--ink)&quot;&gt;Internal processes&lt;/text&gt;&lt;text x=&quot;335&quot; y=&quot;220&quot; fill=&quot;var(--ink)&quot;&gt;Enablers&lt;/text&gt;
&lt;/g&gt;
&lt;g stroke=&quot;var(--acc)&quot; stroke-width=&quot;5&quot; marker-end=&quot;url(#km)&quot;&gt;&lt;line x1=&quot;198&quot; y1=&quot;29&quot; x2=&quot;240&quot; y2=&quot;29&quot;/&gt;&lt;line x1=&quot;198&quot; y1=&quot;91&quot; x2=&quot;240&quot; y2=&quot;91&quot;/&gt;&lt;line x1=&quot;198&quot; y1=&quot;153&quot; x2=&quot;240&quot; y2=&quot;153&quot;/&gt;&lt;line x1=&quot;198&quot; y1=&quot;215&quot; x2=&quot;240&quot; y2=&quot;215&quot;/&gt;&lt;/g&gt;
&lt;g font-size=&quot;12.5&quot; fill=&quot;var(--ink)&quot;&gt;&lt;text x=&quot;436&quot; y=&quot;25&quot;&gt;Financial, environmental and&lt;/text&gt;&lt;text x=&quot;436&quot; y=&quot;41&quot;&gt;social results together&lt;/text&gt;&lt;text x=&quot;436&quot; y=&quot;87&quot;&gt;Customers plus the other&lt;/text&gt;&lt;text x=&quot;436&quot; y=&quot;103&quot;&gt;actors in the ecosystem&lt;/text&gt;&lt;text x=&quot;436&quot; y=&quot;158&quot;&gt;Unchanged&lt;/text&gt;&lt;text x=&quot;436&quot; y=&quot;211&quot;&gt;Adds collaboration and&lt;/text&gt;&lt;text x=&quot;436&quot; y=&quot;227&quot;&gt;alignment capabilities&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/div&gt;
&lt;p&gt;The top becomes &lt;b&gt;Outcomes&lt;/b&gt;: financial, environmental and social results together. This is the &lt;em&gt;balanced&lt;/em&gt; column of the previous matrix, as in Novo Nordisk.&lt;/p&gt;

&lt;div class=&quot;selfcheck&quot;&gt;
&lt;h3&gt;Self-check · Part III&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What criterion decides whether an aspect is market or non-market?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;The path, i.e. the route by which it reaches results: through markets (customers, suppliers, prices, costs) or outside them (laws, public opinion, communities, NGOs). The starting point is what counts: a law that raises costs remains non-market.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why is option 1 insufficient for residents&#x27; complaints about the trucks?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;The four perspectives only capture what arrives through markets; residents act through permits and public opinion, so they have no natural place. A non-market perspective is needed (option 2).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What is the main risk of a derived scorecard (option 3)?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;If used on its own, or not linked to an objective of the main map, it becomes a silo: a separate world with separate objectives, i.e. sustainability “on the side” once again.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What are the two choices of Hansen and Schaltegger (2016)?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;1) Where sustainability goes: integrate, add, derive. 2) What sits at the top of the map: business case (profit), mission first (sustainability), balanced (several goals together).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;How do the perspectives change in the Kaplan and McMillan proposal?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Financial → Outcomes (financial, environmental, social results); Customer → Stakeholders; Internal processes unchanged; Learning and growth → Enablers, with collaboration and alignment capabilities.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Patagonia and a Società Benefit such as Chiesi: which column of the matrix?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Mission first: sustainability sits at the top; profit is a means or a constraint.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p4&quot; id=&quot;s4&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;IV&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Part four · objectives 3 and 4&lt;/div&gt;&lt;h2&gt;Designing and using a sustainable scorecard&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

&lt;h3&gt;Designing in three steps&lt;/h3&gt;
&lt;div class=&quot;stepper&quot;&gt;
&lt;div class=&quot;steps&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; aria-pressed=&quot;true&quot;&gt;1 · Choose the business unit&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; aria-pressed=&quot;false&quot;&gt;2 · Identify the exposure&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; aria-pressed=&quot;false&quot;&gt;3 · Determine the relevance&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;stepbody&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;p&gt;&lt;b&gt;Choose the business unit.&lt;/b&gt; A scorecard is built for a &lt;dfn&gt;strategic business unit&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(a unit with its own strategy, customers and competitors)&lt;/span&gt;. Without a defined strategy there is nothing from which to derive measures.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Identify the exposure.&lt;/b&gt; List the environmental and social aspects that the unit &lt;em&gt;affects&lt;/em&gt; (inside-out) or &lt;em&gt;is affected by&lt;/em&gt; (outside-in). This is the starting inventory: here the double materiality of Part II comes into play.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Determine the relevance.&lt;/b&gt; Decide which aspects matter for the strategy and &lt;em&gt;where&lt;/em&gt; they go in the scorecard. Two questions guide the choice (below).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;h3&gt;Step 3: two questions decide where an aspect goes&lt;/h3&gt;
&lt;p&gt;Choose one of the pasta maker&#x27;s aspects and follow its route through the tree.&lt;/p&gt;
&lt;div class=&quot;steps&quot; id=&quot;tree-btns&quot;&gt;
&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-p=&quot;e-yes,n-q2,e-mkt,n-o1&quot; data-t=&quot;&lt;b&gt;Durum wheat price.&lt;/b&gt; Relevant (it is the raw material) and arrives through the supplier market → one of the four perspectives.&quot;&gt;Durum wheat price&lt;/button&gt;
&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-p=&quot;e-yes,n-q2,e-mkt,n-o1&quot; data-t=&quot;&lt;b&gt;Recyclable packaging requested by supermarkets.&lt;/b&gt; Relevant and arrives through customers → one of the four perspectives (Processes: Recyclable packs ↑).&quot;&gt;Packaging requested by supermarkets&lt;/button&gt;
&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-p=&quot;e-yes,n-q2,e-non,n-o2&quot; data-t=&quot;&lt;b&gt;Residents complaining about the trucks.&lt;/b&gt; Relevant (licence to operate) but acts outside markets → non-market perspective.&quot;&gt;Residents and trucks&lt;/button&gt;
&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-p=&quot;e-no,n-o3&quot; data-t=&quot;&lt;b&gt;Paper used in the offices.&lt;/b&gt; Not relevant to the strategy → left out of the scorecard; it is monitored through routine management. Keep the scorecard &lt;em&gt;short&lt;/em&gt;.&quot;&gt;Office paper&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;svgbox&quot; id=&quot;tree&quot;&gt;
&lt;svg viewBox=&quot;0 0 760 320&quot; role=&quot;img&quot; aria-label=&quot;Decision tree: relevance and path&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;tra&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;g fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#tra)&quot;&gt;
&lt;path id=&quot;e-yes&quot; d=&quot;M200 145 L268 88&quot;/&gt;&lt;path id=&quot;e-no&quot; d=&quot;M200 175 L535 272&quot;/&gt;&lt;path id=&quot;e-mkt&quot; d=&quot;M470 55 L535 36&quot;/&gt;&lt;path id=&quot;e-non&quot; d=&quot;M470 88 L535 140&quot;/&gt;
&lt;/g&gt;
&lt;g font-size=&quot;12&quot; font-weight=&quot;700&quot;&gt;&lt;text x=&quot;216&quot; y=&quot;104&quot; fill=&quot;var(--slate)&quot;&gt;Yes&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;242&quot; fill=&quot;var(--brick)&quot;&gt;No&lt;/text&gt;&lt;text x=&quot;474&quot; y=&quot;34&quot; fill=&quot;var(--slate)&quot;&gt;Markets&lt;/text&gt;&lt;text x=&quot;476&quot; y=&quot;134&quot; fill=&quot;var(--brick)&quot;&gt;Outside&lt;/text&gt;&lt;/g&gt;
&lt;rect id=&quot;n-q1&quot; x=&quot;10&quot; y=&quot;125&quot; width=&quot;190&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--m-fin)&quot; stroke=&quot;none&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;155&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-size=&quot;13.5&quot; font-weight=&quot;700&quot;&gt;1. Relevant to&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;173&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-size=&quot;13.5&quot; font-weight=&quot;700&quot;&gt;our strategy?&lt;/text&gt;
&lt;rect id=&quot;n-q2&quot; x=&quot;270&quot; y=&quot;40&quot; width=&quot;200&quot; height=&quot;66&quot; rx=&quot;12&quot; fill=&quot;var(--m-pro)&quot; stroke=&quot;none&quot;/&gt;&lt;text x=&quot;370&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-size=&quot;13.5&quot; font-weight=&quot;700&quot;&gt;2. Does it reach us&lt;/text&gt;&lt;text x=&quot;370&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-size=&quot;13.5&quot; font-weight=&quot;700&quot;&gt;through markets?&lt;/text&gt;
&lt;rect id=&quot;n-o1&quot; x=&quot;540&quot; y=&quot;5&quot; width=&quot;212&quot; height=&quot;62&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;552&quot; y=&quot;31&quot; font-size=&quot;13.5&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;One of the 4 perspectives&lt;/text&gt;&lt;text x=&quot;552&quot; y=&quot;51&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;durum wheat, packaging&lt;/text&gt;
&lt;rect id=&quot;n-o2&quot; x=&quot;540&quot; y=&quot;112&quot; width=&quot;212&quot; height=&quot;62&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;552&quot; y=&quot;138&quot; font-size=&quot;13.5&quot; font-weight=&quot;700&quot; fill=&quot;var(--brick)&quot;&gt;Non-market perspective&lt;/text&gt;&lt;text x=&quot;552&quot; y=&quot;158&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;residents and trucks&lt;/text&gt;
&lt;rect id=&quot;n-o3&quot; x=&quot;540&quot; y=&quot;245&quot; width=&quot;212&quot; height=&quot;62&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;552&quot; y=&quot;271&quot; font-size=&quot;13.5&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;Out of the scorecard&lt;/text&gt;&lt;text x=&quot;552&quot; y=&quot;291&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;routine management: paper&lt;/text&gt;
&lt;/svg&gt;&lt;/div&gt;
&lt;p id=&quot;tree-out&quot; class=&quot;callout&quot; aria-live=&quot;polite&quot;&gt;Golden rule: keep the scorecard &lt;b&gt;short&lt;/b&gt;; only what matters for the strategy gets in.&lt;/p&gt;

&lt;h3&gt;Exercise: Hotel Alpe Verde &lt;span class=&quot;tag slide&quot;&gt;fictitious case from the slides&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;An imaginary four-star hotel in the Alps. Strategy: a &lt;b&gt;premium eco experience&lt;/b&gt; for guests seeking nature, local food and low-impact holidays. For each aspect: 1. is it relevant? 2. does it pass through markets or not? 3. which perspective and which measure? &lt;em&gt;Click the hatched cells to reveal the solution.&lt;/em&gt;&lt;/p&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table class=&quot;reveal&quot; id=&quot;alpe-t&quot;&gt;
&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Aspect&lt;/th&gt;&lt;th&gt;Relevant&lt;/th&gt;&lt;th&gt;Path&lt;/th&gt;&lt;th&gt;Perspective&lt;/th&gt;&lt;th&gt;Measure&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Energy for heating and the spa&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Yes&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Markets: cost&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Internal processes&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;kWh per guest night ↓&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Share of food bought from local farms&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Yes&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Markets: guests&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Internal processes&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;% food from local farms ↑&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Housing for seasonal staff&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Yes&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Markets: labour&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Learning and growth&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Staff returning next season ↑&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;Less natural snow because of climate change&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Yes&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Markets: demand&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Financial&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Revenue from non ski activities ↑&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;Residents&#x27; complaints about tourist traffic&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Yes&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Outside markets&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Non-market&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Complaints per season ↓&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;Guests&#x27; rating of the hotel&#x27;s environmental practices&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Yes&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Markets: guests&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Customer&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Guests rating ≥ 4 of 5 ↑&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-reveal-all=&quot;alpe-t&quot;&gt;Reveal the full solution&lt;/button&gt;
&lt;p style=&quot;margin-top:10px&quot;&gt;All six aspects are relevant to this strategy. It is the &lt;b&gt;path&lt;/b&gt; that decides the perspective: only residents&#x27; complaints need a non-market place. Note aspect 4: the lack of snow is an environmental phenomenon, but it hits the hotel through &lt;em&gt;demand&lt;/em&gt; (fewer skiers), so the response belongs in the financial perspective as revenue diversification.&lt;/p&gt;

&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Alpe Verde: the three options&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;av1&quot;&gt;Option 1&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;av2&quot;&gt;Option 2&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;av3&quot;&gt;Option 3&lt;/button&gt;
&lt;/div&gt;
&lt;div id=&quot;av1&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot;&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;alpe1&quot;&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;Five aspects out of six.&lt;/b&gt; Energy, local food, staff, snow and guest ratings fit into the four rows. Residents&#x27; complaints about traffic &lt;b&gt;have no place&lt;/b&gt;: they act outside markets.&lt;/p&gt;&lt;/div&gt;
&lt;div id=&quot;av2&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;alpe2&quot;&gt;&lt;/div&gt;&lt;p&gt;The valley gets a visible place, with arrows towards guests and revenue: fewer complaints, more guests arriving without a car, more projects agreed with the municipality.&lt;/p&gt;&lt;/div&gt;
&lt;div id=&quot;av3&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;duo&quot;&gt;&lt;div&gt;&lt;h4&gt;Main scorecard&lt;/h4&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;alpe3a&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;arr&quot; aria-hidden=&quot;true&quot;&gt;➜&lt;/div&gt;&lt;div&gt;&lt;h4&gt;Derived: climate adaptation plan&lt;/h4&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;alpe3b&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The derived scorecard details an objective of the main map, &lt;b&gt;Revenue from non ski activities&lt;/b&gt;, and remains linked to it.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Option 1&lt;/div&gt;&lt;h4&gt;Almost sufficient&lt;/h4&gt;&lt;p&gt;It leaves out the residents, a real risk to the licence to operate.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--m-fin);color:#fff;border-color:transparent&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:oklch(85% 0.08 35)&quot;&gt;Option 2&lt;/div&gt;&lt;h4&gt;Best fit&lt;/h4&gt;&lt;p&gt;The valley has a visible place, linked to guests and revenue.&lt;/p&gt;&lt;/div&gt;
