&lt;rect id=&quot;n-o2&quot; x=&quot;540&quot; y=&quot;112&quot; width=&quot;212&quot; height=&quot;62&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;552&quot; y=&quot;138&quot; font-size=&quot;13.5&quot; font-weight=&quot;700&quot; fill=&quot;var(--brick)&quot;&gt;Non-market perspective&lt;/text&gt;&lt;text x=&quot;552&quot; y=&quot;158&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;residenti e camion&lt;/text&gt;
&lt;rect id=&quot;n-o3&quot; x=&quot;540&quot; y=&quot;245&quot; width=&quot;212&quot; height=&quot;62&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;552&quot; y=&quot;271&quot; font-size=&quot;13.5&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;Fuori dalla scorecard&lt;/text&gt;&lt;text x=&quot;552&quot; y=&quot;291&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;gestione ordinaria: carta&lt;/text&gt;
&lt;/svg&gt;&lt;/div&gt;
&lt;p id=&quot;tree-out&quot; class=&quot;callout&quot; aria-live=&quot;polite&quot;&gt;Regola d&#x27;oro: tieni la scorecard &lt;b&gt;corta&lt;/b&gt;, entra solo ciò che conta per la strategia.&lt;/p&gt;

&lt;h3&gt;Esercizio: Hotel Alpe Verde &lt;span class=&quot;tag slide&quot;&gt;caso fittizio delle slide&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Un hotel quattro stelle immaginario nelle Alpi. Strategia: una &lt;b&gt;premium eco experience&lt;/b&gt; per ospiti che cercano natura, cibo locale e vacanze a basso impatto. Per ogni aspetto: 1. è rilevante? 2. passa dai mercati o no? 3. quale perspective e quale misura? &lt;em&gt;Clicca le celle tratteggiate per scoprire la soluzione.&lt;/em&gt;&lt;/p&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table class=&quot;reveal&quot; id=&quot;alpe-t&quot;&gt;
&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Aspetto&lt;/th&gt;&lt;th&gt;Rilevante&lt;/th&gt;&lt;th&gt;Path&lt;/th&gt;&lt;th&gt;Perspective&lt;/th&gt;&lt;th&gt;Misura&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Energy for heating and the spa&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Yes&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Markets: cost&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Internal processes&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;kWh per guest night ↓&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Share of food bought from local farms&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Yes&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Markets: guests&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Internal processes&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;% food from local farms ↑&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Housing for seasonal staff&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Yes&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Markets: labour&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Learning and growth&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Staff returning next season ↑&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;Less natural snow because of climate change&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Yes&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Markets: demand&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Financial&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Revenue from non ski activities ↑&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;Residents&#x27; complaints about tourist traffic&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Yes&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Outside markets&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Non-market&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Complaints per season ↓&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;Guests&#x27; rating of the hotel&#x27;s environmental practices&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Yes&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Markets: guests&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Customer&lt;/td&gt;&lt;td class=&quot;h&quot;&gt;Guests rating ≥ 4 of 5 ↑&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-reveal-all=&quot;alpe-t&quot;&gt;Rivela tutta la soluzione&lt;/button&gt;
&lt;p style=&quot;margin-top:10px&quot;&gt;Tutti e sei gli aspetti sono rilevanti per questa strategia. È il &lt;b&gt;path&lt;/b&gt; a decidere la perspective: solo le lamentele dei residenti hanno bisogno di un posto non-market. Nota l&#x27;aspetto 4: la neve che manca è un fenomeno ambientale, ma colpisce l&#x27;hotel attraverso la &lt;em&gt;domanda&lt;/em&gt; (meno sciatori), quindi la risposta va nella prospettiva finanziaria come diversificazione dei ricavi.&lt;/p&gt;

&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Alpe Verde: le tre opzioni&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;av1&quot;&gt;Opzione 1&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;av2&quot;&gt;Opzione 2&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;av3&quot;&gt;Opzione 3&lt;/button&gt;
&lt;/div&gt;
&lt;div id=&quot;av1&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot;&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;alpe1&quot;&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cinque aspetti su sei.&lt;/b&gt; Energia, cibo locale, staff, neve e rating degli ospiti entrano nelle quattro righe. Le lamentele dei residenti per il traffico &lt;b&gt;non hanno posto&lt;/b&gt;: agiscono fuori dai mercati.&lt;/p&gt;&lt;/div&gt;
&lt;div id=&quot;av2&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;alpe2&quot;&gt;&lt;/div&gt;&lt;p&gt;La valle ottiene un posto visibile, con frecce verso ospiti e ricavi: meno lamentele, più ospiti che arrivano senza auto, più progetti concordati con il comune.&lt;/p&gt;&lt;/div&gt;
&lt;div id=&quot;av3&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;duo&quot;&gt;&lt;div&gt;&lt;h4&gt;Main scorecard&lt;/h4&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;alpe3a&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;arr&quot; aria-hidden=&quot;true&quot;&gt;➜&lt;/div&gt;&lt;div&gt;&lt;h4&gt;Derived: climate adaptation plan&lt;/h4&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;alpe3b&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;La scorecard derivata dettaglia un obiettivo della mappa principale, &lt;b&gt;Revenue from non ski activities&lt;/b&gt;, e resta collegata a esso.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Opzione 1&lt;/div&gt;&lt;h4&gt;Quasi sufficiente&lt;/h4&gt;&lt;p&gt;Lascia fuori i residenti, un rischio reale per la licence to operate.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--m-fin);color:#fff;border-color:transparent&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:oklch(85% 0.08 35)&quot;&gt;Opzione 2&lt;/div&gt;&lt;h4&gt;Best fit&lt;/h4&gt;&lt;p&gt;La valle ha un posto visibile, collegato a ospiti e ricavi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Opzione 3&lt;/div&gt;&lt;h4&gt;Utile aggiunta&lt;/h4&gt;&lt;p&gt;Un piano dettagliato di adattamento climatico, collegato alla mappa principale.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;Conclusioni:&lt;/b&gt; l&#x27;architettura segue gli aspetti, e &lt;em&gt;un solo&lt;/em&gt; aspetto non-market rilevante basta a giustificare l&#x27;opzione 2. Le opzioni si combinano: opzione 2 per l&#x27;hotel, opzione 3 per il piano clima. Scelta 2: &lt;b&gt;business case&lt;/b&gt;, il profitto resta in cima e la sostenibilità è parte del prodotto.&lt;/div&gt;

&lt;h3&gt;Caso: Caffè Lago &lt;span class=&quot;tag slide&quot;&gt;caso fittizio delle slide&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Torrefazione di caffè &lt;em&gt;specialty&lt;/em&gt; vicino a Bergamo, 80 dipendenti.&lt;/li&gt;&lt;li&gt;Clienti: bar e ristoranti, uffici, consumatori online.&lt;/li&gt;&lt;li&gt;Compra caffè verde da cooperative di agricoltori in America Latina e Africa orientale.&lt;/li&gt;&lt;li&gt;Compete con grandi torrefattori che vendono a prezzi più bassi.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--m-fin);color:#fff;border-color:transparent&quot;&gt;&lt;h4&gt;Strategia&lt;/h4&gt;&lt;p&gt;Caffè di alta qualità &lt;b&gt;tracciabile fino alla piantagione&lt;/b&gt;, comprato a un &lt;b&gt;prezzo equo&lt;/b&gt; da partner di lungo periodo, tostato con &lt;b&gt;basso impatto&lt;/b&gt;.&lt;/p&gt;&lt;p style=&quot;color:oklch(85% 0.08 35);margin:0&quot;&gt;Value proposition: &lt;dfn style=&quot;border-color:currentColor&quot;&gt;product leadership&lt;/dfn&gt;, con la sostenibilità come parte della qualità.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Caffè Lago: le tre opzioni&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;cl1&quot;&gt;Opzione 1&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;cl2&quot;&gt;Opzione 2&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;cl3&quot;&gt;Opzione 3&lt;/button&gt;
&lt;/div&gt;
&lt;div id=&quot;cl1&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot;&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;caffe1&quot;&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;Agricoltori dentro l&#x27;acquisto.&lt;/b&gt; Reddito degli agricoltori e deforestazione diventano dettagli del processo di acquisto (“Price above living income”). Semplice, ma comunità dei coltivatori e ONG restano invisibili. Il &lt;dfn&gt;living income&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(reddito dignitoso: quanto serve a una famiglia per un tenore di vita decente)&lt;/span&gt; è il benchmark di riferimento.&lt;/p&gt;&lt;/div&gt;
&lt;div id=&quot;cl2&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;caffe2&quot;&gt;&lt;/div&gt;&lt;p&gt;Coltivatori e ONG hanno la loro perspective, con frecce verso reputazione e approvvigionamento.&lt;/p&gt;&lt;/div&gt;
&lt;div id=&quot;cl3&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;duo&quot;&gt;&lt;div&gt;&lt;h4&gt;Main scorecard&lt;/h4&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;caffe3a&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;arr&quot; aria-hidden=&quot;true&quot;&gt;➜&lt;/div&gt;&lt;div&gt;&lt;h4&gt;Derived: farmer partnership&lt;/h4&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;caffe3b&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;La scorecard derivata dettaglia &lt;b&gt;Direct trade coffee&lt;/b&gt; e resta collegata. Nota che in cima, nella riga Financial, c&#x27;è il reddito degli &lt;em&gt;agricoltori&lt;/em&gt;: in un programma derivato il “risultato” può essere quello del partner.&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Tre tipi di freccia verso il profitto&lt;/h3&gt;
&lt;p&gt;Ogni misura di sostenibilità sulla mappa di Caffè Lago ha bisogno di una freccia verso la prospettiva finanziaria. Quella freccia può essere di tre tipi:&lt;/p&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--sage)&quot;&gt;Win win&lt;/div&gt;&lt;h4&gt;Buona per entrambi&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Meno energia per kg tostato:&lt;/b&gt; meno emissioni e meno costi insieme.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;Trade-off&lt;/div&gt;&lt;h4&gt;Buona per uno, costosa per l&#x27;altro&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Pagare gli agricoltori sopra il benchmark:&lt;/b&gt; vite migliori e chicchi migliori, ma costi d&#x27;acquisto più alti.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--slate)&quot;&gt;Mandatory&lt;/div&gt;&lt;h4&gt;Obbligatoria comunque&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Regole su packaging o reporting:&lt;/b&gt; la domanda è come adeguarsi al minor costo.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Caffè Lago scommette che il suo trade-off diventi un &lt;b&gt;win win&lt;/b&gt;: i bar pagheranno di più un caffè responsabile. Su qualunque delle tre mappe questa scommessa è una freccia if/then che &lt;b&gt;i dati devono confermare&lt;/b&gt;. Mettila alla prova:&lt;/p&gt;
&lt;div class=&quot;card&quot; id=&quot;ww&quot;&gt;
&lt;div class=&quot;k&quot;&gt;Simulatore &lt;span class=&quot;tag ill&quot;&gt;numeri illustrativi&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;Premio pagato agli agricoltori (€/kg caffè verde) &lt;input type=&quot;range&quot; id=&quot;ww-fp&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;0.05&quot; value=&quot;1.5&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;ww-fp-o&quot;&gt;&lt;/span&gt;&lt;/label&gt;
&lt;label&gt;Premio di prezzo accettato dai bar (€/kg tostato) &lt;input type=&quot;range&quot; id=&quot;ww-pp&quot; min=&quot;0&quot; max=&quot;4&quot; step=&quot;0.05&quot; value=&quot;1&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;ww-pp-o&quot;&gt;&lt;/span&gt;&lt;/label&gt;
&lt;label&gt;Risparmio energetico (€/kg tostato) &lt;input type=&quot;range&quot; id=&quot;ww-en&quot; min=&quot;0&quot; max=&quot;0.6&quot; step=&quot;0.05&quot; value=&quot;0.2&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;ww-en-o&quot;&gt;&lt;/span&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div id=&quot;ww-svg&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;verdict&quot; id=&quot;ww-v&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot; style=&quot;margin-top:8px&quot;&gt;Ipotesi semplificatrice: servono circa 1,2 kg di caffè verde per 1 kg di tostato (la tostatura fa perdere peso), quindi il costo extra per kg tostato = premio × 1,2. I valori sono inventati: servono solo a mostrare come un trade-off diventa win win quando il mercato riconosce il valore.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Opzione 1&lt;/div&gt;&lt;h4&gt;Troppo stretta&lt;/h4&gt;&lt;p&gt;I coltivatori diventano un dettaglio d&#x27;acquisto; ONG e comunità non hanno posto.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--m-fin);color:#fff;border-color:transparent&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:oklch(85% 0.08 35)&quot;&gt;Opzione 2&lt;/div&gt;&lt;h4&gt;Best fit&lt;/h4&gt;&lt;p&gt;Coltivatori e ONG hanno la loro perspective, con frecce a reputazione e forniture.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Opzione 3&lt;/div&gt;&lt;h4&gt;Serve anche questa&lt;/h4&gt;&lt;p&gt;La partnership con gli agricoltori ha bisogno di una scorecard dettagliata, collegata alla principale.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;Conclusioni:&lt;/b&gt; design migliore = &lt;b&gt;opzione 2 + opzione 3&lt;/b&gt; per la farmer partnership. Scelta 2: &lt;b&gt;business case&lt;/b&gt; (la sostenibilità è parte della qualità, e la qualità vende). Stessa risposta di Alpe Verde, per un motivo diverso: qui gli attori non-market sono &lt;em&gt;lontani&lt;/em&gt;, nella filiera, non nella valle accanto.&lt;/div&gt;

&lt;h3 id=&quot;s4-tool&quot;&gt;Tool o symbol?&lt;/h3&gt;
&lt;p&gt;Una scorecard può essere uno strumento di gestione o un simbolo da mostrare. Spunta le condizioni che la tua scorecard soddisfa:&lt;/p&gt;
&lt;div class=&quot;check&quot; id=&quot;tos&quot;&gt;
&lt;label&gt;&lt;input type=&quot;checkbox&quot;&gt; &lt;span&gt;&lt;b&gt;Collegata alla strategia&lt;/b&gt;: le frecce collegano le misure di sostenibilità alla value proposition (altrimenti: &lt;em&gt;no link to strategy&lt;/em&gt;).&lt;/span&gt;&lt;/label&gt;
&lt;label&gt;&lt;input type=&quot;checkbox&quot;&gt; &lt;span&gt;&lt;b&gt;Con target&lt;/b&gt;: ogni numero ha direzione, target e scadenza (altrimenti: &lt;em&gt;no targets&lt;/em&gt;).&lt;/span&gt;&lt;/label&gt;
&lt;label&gt;&lt;input type=&quot;checkbox&quot;&gt; &lt;span&gt;&lt;b&gt;Rivista&lt;/b&gt;: le misure si discutono nelle riunioni di management e cambiano i piani (altrimenti: &lt;em&gt;never reviewed&lt;/em&gt;).&lt;/span&gt;&lt;/label&gt;
&lt;label&gt;&lt;input type=&quot;checkbox&quot;&gt; &lt;span&gt;&lt;b&gt;Anche le cattive notizie&lt;/b&gt;: le misure che peggiorano restano nel report (altrimenti: &lt;em&gt;only good news&lt;/em&gt;).&lt;/span&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;verdict&quot; id=&quot;tos-v&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;p style=&quot;margin-top:10px&quot;&gt;Le conclusioni della lezione aggiungono altri due ingredienti: un &lt;b&gt;owner&lt;/b&gt; (responsabile) per ogni misura e un legame con gli &lt;b&gt;incentivi&lt;/b&gt;.&lt;/p&gt;

&lt;h3&gt;Symbol o substance? L&#x27;impegno di Microsoft&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Il caso&lt;/div&gt;&lt;p&gt;Nel 2020 Microsoft si è impegnata a essere &lt;b&gt;carbon negative entro il 2030&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(rimuovere più CO₂ di quanta ne emette)&lt;/span&gt; e, entro il 2050, a rimuovere tutto il carbonio emesso dalla fondazione nel 1975.&lt;/p&gt;&lt;p&gt;I critici indicano l&#x27;uso del suo software per estrarre combustibili fossili e l&#x27;adesione ad associazioni di categoria che si oppongono alle politiche climatiche.&lt;/p&gt;&lt;/div&gt;
&lt;div&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;1. Perché un&#x27;impresa potrebbe esagerare la sua performance ambientale?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Per conquistare clienti, investitori e talenti a basso costo, senza pagare il prezzo di un cambiamento reale.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;2. Perché è rischioso?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Quando viene scoperto, il danno reputazionale supera il guadagno e i regolatori sanzionano le dichiarazioni ingannevoli. Viola inoltre lo &lt;b&gt;Statement of Ethical Professional Practice&lt;/b&gt; dell&#x27;IMA: i principi di onestà, equità, obiettività e responsabilità, e gli standard di &lt;b&gt;integrity&lt;/b&gt; e &lt;b&gt;credibility&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;3. Come potrebbe rispondere Microsoft ai critici?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Pubblicare una &lt;b&gt;misura e un target&lt;/b&gt; per ogni parte dell&#x27;impegno; farli &lt;b&gt;verificare&lt;/b&gt; da terzi; rendicontare anche sui punti sollevati dai critici; legare la &lt;b&gt;retribuzione dei manager&lt;/b&gt; a quei target.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;callout&quot;&gt;Un impegno credibile evita i &lt;b&gt;quattro segnali del simbolo&lt;/b&gt;: è collegato alla strategia, ha target, è rivisto dal management e riporta anche le cattive notizie.&lt;/div&gt;

&lt;div class=&quot;selfcheck&quot;&gt;
&lt;h3&gt;Autoverifica · Parte IV&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quali sono i tre passi di progettazione e le due domande del passo 3?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;1) Scegliere la business unit; 2) identificare l&#x27;esposizione; 3) determinare la rilevanza. Domande: è rilevante per la strategia? Se sì, ci raggiunge tramite i mercati (→ quattro perspective) o fuori (→ non-market)? Se no, resta fuori dalla scorecard.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché per Alpe Verde l&#x27;opzione 2 è il best fit anche se solo un aspetto su sei è non-market?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Perché quell&#x27;aspetto (i residenti) è un rischio reale per la licence to operate: un solo aspetto non-market rilevante basta a giustificare una quinta perspective.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Alpe Verde e Caffè Lago arrivano alla stessa architettura. Qual è la differenza di motivazione?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Ad Alpe Verde gli attori non-market sono vicini (la valle, il comune); per Caffè Lago sono lontani, nella filiera (coltivatori, ONG). Caffè Lago aggiunge anche un&#x27;opzione 3 per la farmer partnership.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Distingui win win, trade-off e mandatory con un esempio ciascuno.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Win win: meno energia per kg (meno emissioni e meno costi). Trade-off: pagare gli agricoltori sopra il benchmark (beneficio sociale, costo più alto). Mandatory: regole su packaging o reporting (conta adeguarsi al minor costo).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quali sono i quattro segnali che una scorecard è un “symbol”?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Nessun legame con la strategia; nessun target; mai rivista; solo buone notizie.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p5&quot; id=&quot;s5&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;V&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Parte quinta · obiettivo 4&lt;/div&gt;&lt;h2&gt;Un caso reale: Novo Nordisk&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Novo Nordisk, gruppo farmaceutico danese, è l&#x27;esempio di come un&#x27;impresa reale collega la sostenibilità alla strategia e la porta giù fino alla fabbrica.&lt;/p&gt;

&lt;h3&gt;Perché la sostenibilità? Due eventi scatenanti&lt;/h3&gt;
&lt;div class=&quot;svgbox&quot;&gt;
&lt;svg viewBox=&quot;0 0 700 170&quot; role=&quot;img&quot; aria-label=&quot;Dalle critiche degli stakeholder alla perdita di profitti&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;nna&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;0&quot; y=&quot;5&quot; width=&quot;250&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--acc-bg)&quot;/&gt;&lt;text x=&quot;14&quot; y=&quot;32&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;Genetic engineering&lt;/text&gt;&lt;text x=&quot;14&quot; y=&quot;52&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;microrganismi geneticamente&lt;/text&gt;&lt;text x=&quot;14&quot; y=&quot;66&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;modificati; timori per la salute&lt;/text&gt;
&lt;rect x=&quot;0&quot; y=&quot;95&quot; width=&quot;250&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--acc-bg)&quot;/&gt;&lt;text x=&quot;14&quot; y=&quot;122&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;Access to medicines, 2001&lt;/text&gt;&lt;text x=&quot;14&quot; y=&quot;142&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;accessibilità dei farmaci&lt;/text&gt;&lt;text x=&quot;14&quot; y=&quot;156&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;nei paesi in via di sviluppo&lt;/text&gt;
&lt;rect x=&quot;300&quot; y=&quot;50&quot; width=&quot;160&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;Effetti sulla&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;performance finanziaria?&lt;/text&gt;
&lt;rect x=&quot;510&quot; y=&quot;50&quot; width=&quot;185&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--m-fin)&quot;/&gt;&lt;text x=&quot;602&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;Perdita di profitti:&lt;/text&gt;&lt;text x=&quot;602&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;serve agire&lt;/text&gt;
&lt;g stroke=&quot;var(--acc)&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#nna)&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M252 40 L295 75&quot;/&gt;&lt;path d=&quot;M252 130 L295 95&quot;/&gt;&lt;path d=&quot;M462 85 H505&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/div&gt;
&lt;p&gt;Novo Nordisk reagisce alle critiche degli stakeholder: un problema &lt;b&gt;non-market&lt;/b&gt; che diventa un problema &lt;b&gt;finanziario&lt;/b&gt; (lo stesso schema del caso Volkswagen).&lt;/p&gt;

&lt;h3&gt;La triple bottom line di Novo Nordisk&lt;/h3&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--brick)&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--brick)&quot;&gt;Social goals · People&lt;/div&gt;&lt;p&gt;Accesso a farmaci accessibili, progetti di prevenzione con i pazienti, diagnosi migliori.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--sage)&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--sage)&quot;&gt;Environmental goals · Planet&lt;/div&gt;&lt;p&gt;Minore impatto ambientale di processi e prodotti finiti; uso attento delle risorse naturali.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--slate)&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--slate)&quot;&gt;Economic goals · Profit&lt;/div&gt;&lt;p&gt;Performance finanziaria, con una crescita etica e trasparente.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Ogni anno Novo Nordisk rendiconta non solo la performance finanziaria ma anche quella di &lt;b&gt;sviluppo sostenibile&lt;/b&gt;, come strategia di sopravvivenza di lungo periodo. Il principio della triple bottom line è &lt;b&gt;ancorato nello statuto&lt;/b&gt; (&lt;em&gt;Articles of Association&lt;/em&gt;) e nel modo di fare impresa: le decisioni devono bilanciare performance finanziaria, sociale e ambientale.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quale architettura per un&#x27;impresa con questo principio nello statuto?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Lo dicono le slide successive: opzione 1, &lt;b&gt;integrazione&lt;/b&gt; (obiettivi sociali e ambientali dentro quattro intestazioni, con la customer perspective allargata alla società invece di aggiungerne una quinta) e, per la scelta 2, una cima &lt;b&gt;balanced&lt;/b&gt;: la triple bottom line.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Cosa cambia per i manager quando la sostenibilità è un dovere e non una scelta?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Domanda di discussione, le slide non danno una risposta scritta. Spunti: la sostenibilità non è più negoziabile nei trade-off, deve avere target e owner a ogni livello, entra nella valutazione dei manager; il rischio da sorvegliare è che resti dichiarata in cima ma si perda scendendo (vedi sotto).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;

&lt;h3&gt;La balanced scorecard come strumento di gestione&lt;/h3&gt;
&lt;div class=&quot;quote&quot;&gt;“Rather than assessing each division with a Triple Bottom Line performance report, Novo Nordisk relies on the balanced scorecard […]. The Balanced Scorecard is the management tool for embedding and cascading the Triple Bottom Line approach throughout the organization.”&lt;small&gt;Morsing e Oswald (2005), citati nelle slide&lt;/small&gt;&lt;/div&gt;
&lt;p&gt;&lt;b&gt;Ventiquattro obiettivi&lt;/b&gt; sotto quattro intestazioni:&lt;/p&gt;
&lt;div class=&quot;grid4&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--m-cus);color:#fff;border-color:transparent&quot;&gt;&lt;h4&gt;Customers and Society&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;customer, allargata alla società&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--m-fin);color:#fff;border-color:transparent&quot;&gt;&lt;h4&gt;Finance&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;financial&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--m-pro);color:#fff;border-color:transparent&quot;&gt;&lt;h4&gt;Business Processes&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;internal processes&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;background:var(--m-lea);color:var(--m-lea-t);border-color:transparent&quot;&gt;&lt;h4&gt;People and Organisation&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;learning and growth&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Una cascading balanced scorecard&lt;/h3&gt;
&lt;p&gt;Il &lt;dfn&gt;cascading&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(“a cascata”: declinare la scorecard aziendale in scorecard sempre più specifiche, livello per livello)&lt;/span&gt; fa arrivare la strategia fino alle persone. La figura segue un ramo: operations, product supply, fino a una fabbrica.&lt;/p&gt;
&lt;div class=&quot;svgbox&quot; id=&quot;cascade&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Cascata delle scorecard di Novo Nordisk&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;csa&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;5&quot; markerHeight=&quot;5&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;g font-size=&quot;13.5&quot; font-weight=&quot;700&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect data-lv=&quot;0&quot; x=&quot;10&quot; y=&quot;8&quot; width=&quot;210&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--m-fin)&quot;/&gt;&lt;text x=&quot;115&quot; y=&quot;36&quot; fill=&quot;#fff&quot;&gt;Corporate BSC&lt;/text&gt;
&lt;rect data-lv=&quot;1&quot; x=&quot;110&quot; y=&quot;66&quot; width=&quot;210&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--m-pro)&quot;/&gt;&lt;text x=&quot;215&quot; y=&quot;94&quot; fill=&quot;#fff&quot;&gt;Operations BSC&lt;/text&gt;
&lt;rect data-lv=&quot;2&quot; x=&quot;210&quot; y=&quot;124&quot; width=&quot;210&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--m-pro)&quot;/&gt;&lt;text x=&quot;315&quot; y=&quot;152&quot; fill=&quot;#fff&quot;&gt;Product Supply BSC&lt;/text&gt;
&lt;rect data-lv=&quot;3&quot; x=&quot;310&quot; y=&quot;182&quot; width=&quot;240&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--m-cus)&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;210&quot; fill=&quot;#fff&quot;&gt;Diabetes Finished Products&lt;/text&gt;
&lt;rect data-lv=&quot;4&quot; x=&quot;410&quot; y=&quot;240&quot; width=&quot;220&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--m-lea)&quot;/&gt;&lt;text x=&quot;520&quot; y=&quot;268&quot; fill=&quot;var(--m-lea-t)&quot;&gt;Personal targets&lt;/text&gt;
&lt;/g&gt;
&lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;2.5&quot; marker-end=&quot;url(#csa)&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M115 56 V86 H105&quot;/&gt;&lt;path d=&quot;M215 114 V144 H205&quot;/&gt;&lt;path d=&quot;M315 172 V202 H305&quot;/&gt;&lt;path d=&quot;M430 230 V260 H405&quot;/&gt;&lt;/g&gt;
&lt;g font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;&lt;text x=&quot;10&quot; y=&quot;130&quot;&gt;1 azienda&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;146&quot;&gt;5 aree esecutive&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;162&quot;&gt;20 business unit&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;178&quot;&gt;sub-unit (facoltativo)&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;194&quot;&gt;persone (2 volte l&#x27;anno)&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;steps&quot; style=&quot;align-items:center&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;cs-prev&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;note&quot; id=&quot;cs-n&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;cs-next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
&lt;p id=&quot;cascade-t&quot; aria-live=&quot;polite&quot; style=&quot;margin:0&quot;&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Giù fino alla fabbrica: Diabetes Finished Products&lt;/h3&gt;
&lt;p&gt;Una unità produttiva. Due termini: &lt;dfn&gt;critical success factor&lt;/dfn&gt; (CSF, &lt;span class=&quot;gl&quot;&gt;ciò che bisogna fare bene per riuscire&lt;/span&gt;) e &lt;dfn&gt;KPI&lt;/dfn&gt; (&lt;span class=&quot;gl&quot;&gt;key performance indicator, l&#x27;indicatore che lo misura&lt;/span&gt;).&lt;/p&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Perspective&lt;/th&gt;&lt;th&gt;Critical success factor&lt;/th&gt;&lt;th&gt;Rationale&lt;/th&gt;&lt;th&gt;KPI&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Finance&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Realise growth in operating profit&lt;/td&gt;&lt;td&gt;Secure growth in line with the industry&lt;/td&gt;&lt;td&gt;Operating profit&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Customers and Society&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Ensure superior customer satisfaction&lt;/td&gt;&lt;td&gt;Product quality is critical for customer satisfaction&lt;/td&gt;&lt;td&gt;Customer complaints&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Business Processes&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Improve productivity&lt;/td&gt;&lt;td&gt;Secure cost efficiency in production&lt;/td&gt;&lt;td&gt;Output versus cost (unit costs); fewer non conformities&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;People and Organisation&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Support diversity and social responsibility&lt;/td&gt;&lt;td&gt;Enhance innovation, attraction and reputation&lt;/td&gt;&lt;td&gt;Equal opportunity initiatives undertaken&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;

&lt;h4&gt;Prova tu: cosa manca a livello di fabbrica? &lt;span class=&quot;tag slide&quot;&gt;esercizio delle slide&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;L&#x27;azienda ha un &lt;b&gt;target assoluto di CO₂&lt;/b&gt; (Annual Report 2004). &lt;em&gt;Assoluto&lt;/em&gt; significa sulle emissioni totali, non per unità prodotta: se la produzione cresce, l&#x27;efficienza da sola può non bastare.&lt;/p&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Domanda 1 · Quali dei quattro KPI sono sociali o ambientali?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Uno solo: &lt;b&gt;equal opportunity initiatives&lt;/b&gt;, un KPI sociale. Nessun KPI ambientale nella parte mostrata: il target di CO₂ non arriva alla fabbrica.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Domanda 2 · Proponi un CSF e un KPI ambientali per i processi, con il legame if/then.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;CSF:&lt;/b&gt; ridurre l&#x27;uso di energia in produzione. &lt;b&gt;KPI:&lt;/b&gt; energia per unità prodotta &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt; e CO₂ totale del sito &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;. &lt;b&gt;If/then:&lt;/b&gt; se la fabbrica usa meno energia per unità e in totale, allora i costi unitari scendono e l&#x27;azienda rispetta il suo target assoluto di CO₂. Nota il doppio KPI: quello per unità collega ai costi (win win), quello totale collega al target assoluto.&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;Messaggio chiave:&lt;/b&gt; il cascading è il punto in cui la sostenibilità può &lt;b&gt;sparire in silenzio&lt;/b&gt;. Bisogna controllare che ogni target arrivi all&#x27;unità che genera davvero l&#x27;impatto.&lt;/div&gt;

&lt;div class=&quot;selfcheck&quot;&gt;
&lt;h3&gt;Autoverifica · Parte V&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quale architettura usa Novo Nordisk, nelle due scelte di Hansen e Schaltegger?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Scelta 1: opzione 1, integrazione, con la customer perspective allargata a “Customers and Society”. Scelta 2: cima balanced, la triple bottom line.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché Novo Nordisk usa la BSC invece di un report TBL per ogni divisione?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Perché la BSC è lo strumento di gestione per incorporare e declinare a cascata la TBL in tutta l&#x27;organizzazione: dà obiettivi, misure e responsabili a ogni livello, mentre un report si limiterebbe a descrivere.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quanti livelli ha la cascata e quale è facoltativo?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Cinque: azienda, cinque executive vice presidents, venti senior vice presidents (business unit), sub-unit come una fabbrica (facoltativo, spesso solo KPI), persone (obiettivi rivisti due volte l&#x27;anno).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Che differenza c&#x27;è tra un target di CO₂ assoluto e uno per unità?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Il primo riguarda le emissioni totali, il secondo l&#x27;intensità (per unità prodotta). Con produzione in crescita, l&#x27;intensità può scendere mentre il totale sale: per rispettare un target assoluto servono entrambi i KPI.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;fine&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;✦&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Sintesi&lt;/div&gt;&lt;h2&gt;Conclusioni in cinque parole&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;1 · Why&lt;/div&gt;&lt;p&gt;Stakeholder, regole e mercati rendono strategici gli aspetti ambientali, sociali e di governance. La double materiality dice quali contano.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;2 · What&lt;/div&gt;&lt;p&gt;La sustainable balanced scorecard non è un nuovo strumento: applica la logica della scorecard (derive, link, measure, test) agli aspetti ambientali e sociali.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;3 · Where&lt;/div&gt;&lt;p&gt;Un aspetto si colloca secondo il suo path: market nelle quattro perspective, non-market in una quinta, dettagli in scorecard derivate. Le opzioni si combinano.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;4 · What for&lt;/div&gt;&lt;p&gt;Ciò che sta in cima alla mappa (profitto, sostenibilità o entrambi) riflette i valori dell&#x27;impresa.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;5 · How&lt;/div&gt;&lt;p&gt;Una scorecard è uno strumento solo con &lt;b&gt;target, owner, review e reward&lt;/b&gt;. Altrimenti è un simbolo, vicino al greenwashing.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Collegamenti con il resto del corso: la lezione riprende la strategy map e le relazioni if/then della lezione precedente sulla balanced scorecard (slide di ripasso “a strategy map in four rows”). Gli altri file della cartella &lt;code&gt;corso/&lt;/code&gt; non erano accessibili durante la stesura di questo riassunto, quindi non sono stati usati.&lt;/p&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;approfondire&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;↗&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Fonti esterne&lt;/div&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Autori, studi, norme, standard e casi citati nelle slide. Ogni scheda è &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;: i dati vengono da ricerche web (novembre 2026) e non dalle slide. Dove le fonti esterne non coincidono con le slide, lo segnalo.&lt;/p&gt;

&lt;h3&gt;Autori e studi&lt;/h3&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Milton Friedman, “The Social Responsibility of Business Is to Increase Its Profits” (1970)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;The New York Times Magazine, 13 settembre 1970&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; la tesi che l&#x27;unica responsabilità sociale dell&#x27;impresa sia usare le risorse per aumentare i profitti, “so long as it stays within the rules of the game”. &lt;b&gt;Perché conta:&lt;/b&gt; è il testo fondativo della shareholder view, il punto di partenza da cui la lezione si allontana.&lt;/p&gt;&lt;a href=&quot;https://www.pagecentertraining.psu.edu/assets/images/course-content/Lesson_One_Reading_Friedman_(1970)_The_Social_Responsibility_of_Business_is_to_Increase_its_Profits.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo (lettura di corso, Penn State)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;R. Edward Freeman, &lt;em&gt;Strategic Management: A Stakeholder Approach&lt;/em&gt; (1984)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Pitman, Boston, 1984; ristampa Cambridge University Press 2010&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; la definizione di stakeholder e l&#x27;idea che la strategia debba considerare tutti i gruppi che influenzano o sono influenzati dall&#x27;impresa. &lt;b&gt;Perché conta:&lt;/b&gt; è il libro che ha avviato la stakeholder theory, base dell&#x27;intera parte I.&lt;/p&gt;&lt;a href=&quot;https://cleo.rutgers.edu/articles/strategic-management-a-stakeholder-approach/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda del libro (Rutgers CLEO)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;John Elkington, &lt;em&gt;Cannibals with Forks&lt;/em&gt; (1997)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Capstone, Oxford, 1997&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; la presentazione al grande pubblico della triple bottom line, termine coniato da Elkington nel 1994. &lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;origine del “people, planet, profit” e della domanda su come gestire insieme le tre linee.&lt;/p&gt;&lt;a href=&quot;https://www.taylorfrancis.com/chapters/edit/10.4324/9781351279086-27/cannibals-forks-john-elkington-1997&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Estratto (Taylor &amp;amp; Francis)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Erik G. Hansen e Stefan Schaltegger, “The Sustainability Balanced Scorecard: A Systematic Review of Architectures” (2016)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Journal of Business Ethics, DOI 10.1007/s10551-014-2340-3&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; una revisione sistematica della letteratura sulla sustainability balanced scorecard e una tipologia di architetture generiche; le modifiche all&#x27;architettura sono motivate da prospettive strumentali, socio-politiche o normative. Nel 2017 gli autori hanno risposto alle critiche di Hahn e Figge sulla stessa rivista. &lt;b&gt;Perché conta:&lt;/b&gt; è la fonte delle “due scelte” della Parte III.&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.1007/s10551-014-2340-3&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Articolo (DOI)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Robert S. Kaplan e David McMillan, “Reimagining the Balanced Scorecard for the ESG Era” (2021)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Harvard Business Review, febbraio 2021 (data da fonti secondarie)&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; la proposta di aggiornare le perspective (Outcomes, Stakeholders, Internal processes, Enablers) per strategie multi-stakeholder e di triple bottom line. Alcuni commentatori osservano che resta un adattamento delle quattro perspective originali. &lt;b&gt;Perché conta:&lt;/b&gt; è il modello “balanced” della Parte III.&lt;/p&gt;&lt;a href=&quot;https://www.icaew.com/technical/business/business-performance-management/balanced-scorecard&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sintesi ICAEW sulla balanced scorecard&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Mette Morsing e Dorte Oswald, sul caso Novo Nordisk&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Le slide citano “Morsing and Oswald (2005)”; le ricerche trovano un capitolo Palgrave del 2006 e l&#x27;articolo “Sustainable leadership: management control systems and organizational culture in Novo Nordisk A/S”, Corporate Governance 9(1), 2009, pp. 83–99&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; uno studio di caso su come il top management usa i sistemi di controllo (BSC inclusa) e la cultura per rendere operativa la sostenibilità. &lt;b&gt;Perché conta:&lt;/b&gt; è la fonte della citazione sulla BSC come strumento per il cascading della TBL. Verifica la data esatta sulla bibliografia del corso.&lt;/p&gt;&lt;a href=&quot;https://research.cbs.dk/en/publications/sustainable-leadership-management-control-systems-and-organizatio/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda dell&#x27;articolo 2009 (Copenhagen Business School)&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Norme e standard&lt;/h3&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Directive (EU) 2026/470, “Omnibus I”&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Pubblicata in Gazzetta Ufficiale UE il 26 febbraio 2026, in vigore dal 18 marzo 2026&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; modifica CSRD e CSDDD. Ambito CSRD: imprese UE oltre &lt;em&gt;entrambe&lt;/em&gt; le soglie di 1.000 dipendenti e 450 milioni € di fatturato netto, obbligo dal FY2027; recepimento entro il 19 marzo 2027. Una fonte stima che il perimetro passi da circa 50.000 a circa 5.000 imprese. &lt;b&gt;Perché conta:&lt;/b&gt; definisce chi deve misurare, e quindi chi ha bisogno di una scorecard che assegni target e owner.&lt;/p&gt;&lt;a href=&quot;https://sustainablefutures.linklaters.com/post/102mkjf/eu-omnibus-i-directive-published-in-the-official-journal-of-the-eu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Nota Linklaters sulla pubblicazione&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;ESRS semplificati (EFRAG)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Advice tecnico di EFRAG alla Commissione, 3 dicembre 2025&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; riduzione del 61% dei data point obbligatori “se material” ed eliminazione delle informative volontarie; la Commissione li adotterà con atto delegato (previsto per metà 2026, con possibili modifiche). &lt;b&gt;Perché conta:&lt;/b&gt; sono gli standard che applicano la double materiality nell&#x27;UE.&lt;/p&gt;&lt;a href=&quot;https://www.efrag.org/en/news-and-calendar/news/efrag-provides-its-technical-advice-on-draft-simplified-esrs-to-the-european-commission&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Comunicato EFRAG&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;GRI Standards (Global Reporting Initiative)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Standard globali di rendicontazione degli impatti&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; standard basati sulla impact materiality: impatti effettivi e potenziali, positivi e negativi, su economia, ambiente e persone, indipendentemente dalla rilevanza finanziaria. &lt;b&gt;Perché conta:&lt;/b&gt; è il polo inside-out dello spettro degli standard.&lt;/p&gt;&lt;a href=&quot;https://sustainablefutures.linklaters.com/post/102l3df/esg-quick-guide-gri-standards&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Guida rapida Linklaters ai GRI Standards&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;SASB Standards e ISSB (IFRS Foundation)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Standard settoriali, oggi mantenuti dall&#x27;International Sustainability Standards Board&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; temi finanziariamente rilevanti per 77 settori; prospettiva della financial materiality, rivolta agli investitori. GRI e IFRS Foundation stanno lavorando ad allineare le informative (dichiarazione congiunta di maggio 2026), senza annullare la differenza tra le due materialità. &lt;b&gt;Perché conta:&lt;/b&gt; è il polo outside-in dello spettro.&lt;/p&gt;&lt;a href=&quot;https://www.globalreporting.org/media/4vvjc22m/joint-statement-from-gri-and-ifrs-foundation-may-2026.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Dichiarazione congiunta GRI–IFRS Foundation (PDF)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;UN Principles for Responsible Investment (PRI)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Iniziativa promossa dall&#x27;ONU, lanciata nel 2006&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; sei principi volontari per investitori, tra cui integrare l&#x27;ESG nell&#x27;analisi e nelle decisioni, essere azionisti attivi, rendicontare i progressi. &lt;b&gt;Perché conta:&lt;/b&gt; spiega la pressione “investors and banks” della Parte I.&lt;/p&gt;&lt;a href=&quot;https://www.dechert.com/knowledge/onpoint/2020/3/overview-of-united-nations--principles-for-responsible-investmen.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Panoramica (Dechert)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;WEF–IBC, &lt;em&gt;Measuring Stakeholder Capitalism&lt;/em&gt; (2020)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;World Economic Forum, International Business Council, con Deloitte, EY, KPMG, PwC; settembre 2020&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; 21 metriche “core” e 34 “expanded”, collegate agli SDGs, come nucleo comune di misure ESG. &lt;b&gt;Perché conta:&lt;/b&gt; un esempio concreto di catalogo di misure; ricorda però che nella scorecard le misure si &lt;em&gt;derivano&lt;/em&gt; dalla strategia, non si scelgono da una lista.&lt;/p&gt;&lt;a href=&quot;https://www.weforum.org/publications/measuring-stakeholder-capitalism-towards-common-metrics-and-consistent-reporting-of-sustainable-value-creation/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pubblicazione WEF&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Impact-Weighted Accounts (Harvard Business School)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Progetto avviato nel 2019, guidato da George Serafeim; spin-off IFVI nel 2022&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; metodi per trasformare in voci monetarie gli impatti positivi e negativi su dipendenti, clienti, ambiente e società. &lt;b&gt;Perché conta:&lt;/b&gt; è il tentativo citato nelle slide di dare un valore monetario agli impatti ESG.&lt;/p&gt;&lt;a href=&quot;https://www.sir.advancedleadership.harvard.edu/articles/measure-what-really-matters-accounting-for-company-esg-impacts&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Articolo Harvard Advanced Leadership Initiative&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;SEC, regole sulla disclosure climatica (2024)&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Adottate a marzo 2024, sospese dalla stessa SEC ad aprile 2024&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; il 27 marzo 2025 la SEC ha votato di non difendere più le regole davanti all&#x27;Ottavo Circuito. &lt;b&gt;Perché conta:&lt;/b&gt; conferma che negli USA non c&#x27;è un obbligo federale equivalente alla CSRD. Non ho verificato lo stato al novembre 2026.&lt;/p&gt;&lt;a href=&quot;https://www.sec.gov/newsroom/press-releases/2025-58&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Comunicato SEC 2025-58&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Agenda 2030 e Sustainable Development Goals&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Risoluzione ONU A/RES/70/1, adottata il 25 settembre 2015&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; 17 obiettivi e 169 target, integrati e indivisibili, che bilanciano sviluppo economico, sociale e ambientale. &lt;b&gt;Perché conta:&lt;/b&gt; è il blueprint usato come benchmark.&lt;/p&gt;&lt;a href=&quot;https://social.desa.un.org/2030agenda-sdgs&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN DESA, Transforming our world&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;IMA Statement of Ethical Professional Practice&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Institute of Management Accountants, versione in vigore dal 1° luglio 2017&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; principi (onestà, equità, obiettività, responsabilità) e quattro standard: competence, confidentiality, integrity, credibility. Vincola i membri IMA e i candidati CMA. &lt;b&gt;Perché conta:&lt;/b&gt; è il codice etico richiamato nel caso Microsoft contro il greenwashing.&lt;/p&gt;&lt;a href=&quot;https://eu.imanet.org/career-resources/ethics-center/statement&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina IMA&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Società Benefit, Legge 28 dicembre 2015 n. 208, commi 376–384&lt;/h4&gt;&lt;div class=&quot;who&quot;&gt;Legge di stabilità 2016&lt;/div&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; la forma giuridica che affianca al profitto uno o più benefici comuni nello statuto, con obbligo di una relazione d&#x27;impatto annuale allegata al bilancio, redatta secondo uno standard esterno (Allegato 4). &lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;esempio italiano di mission first.&lt;/p&gt;&lt;a href=&quot;https://www.assolombarda.it/servizi/credito-finanza-e-incentivi/informazioni/le-societa-benefit-fare-impresa-misurando-e-comunicando-il-proprio-valore-ambientale-e-sociale&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda Assolombarda&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Casi aziendali citati&lt;/h3&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Novo Nordisk: triple bottom line nello statuto&lt;/h4&gt;&lt;p&gt;Il principio è stato inserito negli Articles of Association all&#x27;assemblea del 2004; dal 2004 l&#x27;azienda pubblica un report integrato e il report 2025 lo definisce ancora fondamentale per la sua identità.&lt;/p&gt;&lt;a href=&quot;https://www.novonordisk.com/about/corporate-governance.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Novo Nordisk, corporate governance&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Patagonia, “Earth is now our only shareholder” (settembre 2022)&lt;/h4&gt;&lt;p&gt;Il Patagonia Purpose Trust detiene il 2% (tutte le azioni con voto), l&#x27;Holdfast Collective (non profit 501(c)(4)) il 98% (azioni senza voto); dividendo atteso circa 100 milioni $ l&#x27;anno.&lt;/p&gt;&lt;a href=&quot;https://www.patagonia.com/ownership/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Patagonia, pagina sulla proprietà&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Chiesi, Società Benefit e B Corp&lt;/h4&gt;&lt;p&gt;Chiesi redige la relazione d&#x27;impatto prevista dalla L. 208/2015 ed è certificata B Corp (ricertificata nel 2022). Le ricerche non hanno confermato in modo indipendente il primato “2019, più grande gruppo farmaceutico B Corp” riportato nelle slide.&lt;/p&gt;&lt;a href=&quot;https://www.chiesi.it/pdf/relazione_di_impatto2024.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Relazione d&#x27;impatto Chiesi 2024 (PDF)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Volkswagen, accordo USA del 2016&lt;/h4&gt;&lt;p&gt;Fino a 14,7 miliardi $ per circa 475.000 diesel 2.0 litri: circa 10 miliardi per riacquisti e riparazioni, 2,7 miliardi per un fondo di mitigazione NOx, 2 miliardi in 10 anni per veicoli a zero emissioni. Esclusi i 3.0 litri e la responsabilità penale.&lt;/p&gt;&lt;a href=&quot;https://dieselnet.com/news/2016/06vw.php&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DieselNet, giugno 2016&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Microsoft, “carbon negative by 2030” (16 gennaio 2020)&lt;/h4&gt;&lt;p&gt;Impegno a dimezzare le emissioni entro il 2030 (incluse quelle della catena del valore), un Climate Innovation Fund da 1 miliardo $ e un report ambientale annuale.&lt;/p&gt;&lt;a href=&quot;https://blogs.microsoft.com/blog/2020/01/16/microsoft-will-be-carbon-negative-by-2030/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Blog ufficiale Microsoft&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Starbucks, C.A.F.E. Practices&lt;/h4&gt;&lt;p&gt;Linee guida sviluppate con Conservation International, attive dal 2004, con principi ambientali, sociali ed economici e verifica da parte di terzi.&lt;/p&gt;&lt;a href=&quot;https://www.conservation.org/coffee&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Conservation International, Starbucks&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(t){return String(t).replace(/&amp;/g,&quot;&amp;amp;&quot;).replace(/&lt;/g,&quot;&amp;lt;&quot;).replace(/&gt;/g,&quot;&amp;gt;&quot;)}

  });});

/* ---------- strategy map renderer ---------- */
var uid=0;
function wrap(t,max){var w=t.split(&quot; &quot;),l=[],c=&quot;&quot;;w.forEach(function(x){if((c+&quot; &quot;+x).trim().length&gt;max&amp;&amp;c){l.push(c);c=x}else c=(c+&quot; &quot;+x).trim()});if(c)l.push(c);return l}
function mapSVG(cfg){
  uid++;var id=&quot;ah&quot;+uid,L=96,BW=470,rh=56,gap=26,top=6,n=cfg.rows.length,H=top+n*rh+(n-1)*gap+6;

    $(&quot;#tree-out&quot;).innerHTML=b.getAttribute(&quot;data-t&quot;);
  })});
}

$$(&quot;[data-reveal-all]&quot;).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){$$(&quot;#&quot;+b.getAttribute(&quot;data-reveal-all&quot;)+&quot; td.h&quot;).forEach(function(td){td.classList.remove(&quot;h&quot;)})})});

/* ---------- win-win slider ---------- */
var ww=$(&quot;#ww&quot;);
if(ww){
  var fp=$(&quot;#ww-fp&quot;),pp=$(&quot;#ww-pp&quot;),en=$(&quot;#ww-en&quot;);
  function wdraw(){
    var f=+fp.value,p=+pp.value,e=+en.value;
    $(&quot;#ww-fp-o&quot;).textContent=f.toFixed(2);$(&quot;#ww-pp-o&quot;).textContent=p.toFixed(2);$(&quot;#ww-en-o&quot;).textContent=e.toFixed(2);
    var cost=f*1.2,gain=p+e,net=gain-cost,sc=60;
    var bar=function(y,v,lab,col){var w=Math.abs(v)*sc;return&#x27;&lt;text x=&quot;0&quot; y=&quot;&#x27;+(y+17)+&#x27;&quot; font-size=&quot;12.5&quot; fill=&quot;var(--ink)&quot;&gt;&#x27;+lab+&#x27;&lt;/text&gt;&lt;rect x=&quot;190&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;&#x27;+Math.max(w,1)+&#x27;&quot; height=&quot;24&quot; rx=&quot;5&quot; fill=&quot;&#x27;+col+&#x27;&quot;/&gt;&lt;text x=&quot;&#x27;+(196+w)+&#x27;&quot; y=&quot;&#x27;+(y+17)+&#x27;&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;&#x27;+(v&gt;=0?&quot;+&quot;:&quot;−&quot;)+Math.abs(v).toFixed(2)+&#x27; €/kg&lt;/text&gt;&#x27;};
    var s=&#x27;&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;Effetto sul margine per kg&quot;&gt;&#x27;+bar(8,-cost,&quot;Costo extra agli agricoltori&quot;,&quot;var(--ko)&quot;)+bar(44,p,&quot;Premio di prezzo dai bar&quot;,&quot;var(--ok)&quot;)+bar(80,e,&quot;Risparmio energetico&quot;,&quot;var(--sage)&quot;)+&#x27;&lt;line x1=&quot;0&quot; y1=&quot;116&quot; x2=&quot;560&quot; y2=&quot;116&quot; stroke=&quot;var(--rule)&quot;/&gt;&#x27;+bar(122,net,&quot;Effetto netto sul margine&quot;,net&gt;=0?&quot;var(--ok)&quot;:&quot;var(--ko)&quot;)+&#x27;&lt;/svg&gt;&#x27;;
    $(&quot;#ww-svg&quot;).innerHTML=s;
    var v=$(&quot;#ww-v&quot;);
    if(net&gt;=0.005){v.style.background=&quot;var(--sage-bg)&quot;;v.innerHTML=&quot;&lt;b&gt;Win win.&lt;/b&gt; Il margine per kg cresce di &quot;+net.toFixed(2)+&quot; €: la scommessa di Caffè Lago (if paghiamo di più gli agricoltori, then i bar pagano di più per un caffè responsabile) è confermata dai dati.&quot;;}
    else if(net&gt;-0.005){v.style.background=&quot;var(--ochre-bg)&quot;;v.innerHTML=&quot;&lt;b&gt;Pareggio.&lt;/b&gt; Il beneficio sociale non costa nulla al margine: siamo sul confine tra trade-off e win win.&quot;;}
    else{v.style.background=&quot;var(--brick-bg)&quot;;v.innerHTML=&quot;&lt;b&gt;Trade-off.&lt;/b&gt; Il margine scende di &quot;+Math.abs(net).toFixed(2)+&quot; € per kg: buono per gli agricoltori, costoso per l&#x27;azienda. L&#x27;ipotesi if/then non è (ancora) confermata: va rivista la strategia o il prezzo.&quot;;}
  }
  [fp,pp,en].forEach(function(i){i.addEventListener(&quot;input&quot;,wdraw)});wdraw();
}

/* ---------- tool or symbol ---------- */
var ck=$(&quot;#tos&quot;);
if(ck){var cb=$$(&quot;input&quot;,ck);function tv(){var n=cb.filter(function(c){return c.checked}).length,v=$(&quot;#tos-v&quot;);
  if(n===4){v.style.background=&quot;var(--sage-bg)&quot;;v.innerHTML=&quot;&lt;b&gt;Tool.&lt;/b&gt; Collegata alla strategia, con target, rivista dal management e onesta anche sulle cattive notizie: è uno strumento di gestione.&quot;;}

  cb.forEach(function(c){c.addEventListener(&quot;change&quot;,tv)});tv();}

/* ---------- cascade stepper ---------- */
var cs=$(&quot;#cascade&quot;);
if(cs){var CT=[
 &quot;&lt;b&gt;1 · Company.&lt;/b&gt; Una scorecard per Novo Nordisk nel suo insieme: qui vive la triple bottom line, con i 24 obiettivi sotto quattro intestazioni.&quot;,
 &quot;&lt;b&gt;2 · Executive vice presidents.&lt;/b&gt; Una scorecard per ciascuna delle cinque aree esecutive (nella figura: Operations).&quot;,
 &quot;&lt;b&gt;3 · Senior vice presidents.&lt;/b&gt; Venti scorecard di business unit (nella figura: Product Supply).&quot;,

 &quot;&lt;b&gt;5 · People.&lt;/b&gt; Obiettivi personali, fissati e rivisti due volte l&#x27;anno: il cascading arriva fino al singolo.&quot;],ci=0;
 function cdraw(){$$(&quot;[data-lv]&quot;,cs).forEach(function(r){var on=+r.getAttribute(&quot;data-lv&quot;)===ci;r.setAttribute(&quot;stroke&quot;,on?&quot;var(--acc)&quot;:&quot;none&quot;);r.setAttribute(&quot;stroke-width&quot;,on?4:0)});
  $(&quot;#cascade-t&quot;).innerHTML=CT[ci];$(&quot;#cs-prev&quot;).disabled=ci===0;$(&quot;#cs-next&quot;).disabled=ci===4;$(&quot;#cs-n&quot;).textContent=(ci+1)+&quot; / 5&quot;;}
 $(&quot;#cs-prev&quot;).addEventListener(&quot;click&quot;,function(){if(ci&gt;0){ci--;cdraw()}});$(&quot;#cs-next&quot;).addEventListener(&quot;click&quot;,function(){if(ci&lt;4){ci++;cdraw()}});cdraw();}
