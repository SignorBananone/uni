&lt;a href=&quot;#s2-def&quot;&gt;&lt;rect x=&quot;320&quot; y=&quot;220&quot; width=&quot;260&quot; height=&quot;96&quot; rx=&quot;18&quot; fill=&quot;var(--acc)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;256&quot; font-family=&quot;Newsreader,Georgia,serif&quot; font-size=&quot;21&quot; fill=&quot;var(--paper)&quot;&gt;Sustainable&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;282&quot; font-family=&quot;Newsreader,Georgia,serif&quot; font-size=&quot;21&quot; fill=&quot;var(--paper)&quot;&gt;Balanced Scorecard&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;304&quot; font-size=&quot;11.5&quot; fill=&quot;var(--paper)&quot;&gt;definizione&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s3&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;335&quot; width=&quot;225&quot; height=&quot;60&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;152&quot; y=&quot;361&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;Market vs&lt;/text&gt;&lt;text x=&quot;152&quot; y=&quot;381&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;non-market aspects&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s3-opt&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;435&quot; width=&quot;225&quot; height=&quot;70&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;152&quot; y=&quot;462&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;3 architetture +&lt;/text&gt;&lt;text x=&quot;152&quot; y=&quot;482&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;cosa sta in cima&lt;/text&gt;&lt;text x=&quot;152&quot; y=&quot;498&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;Hansen &amp;amp; Schaltegger&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s4&quot;&gt;&lt;rect x=&quot;635&quot; y=&quot;335&quot; width=&quot;225&quot; height=&quot;60&quot; rx=&quot;14&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;747&quot; y=&quot;361&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;Progettare in 3 passi&lt;/text&gt;&lt;text x=&quot;747&quot; y=&quot;381&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;Alpe Verde · Caffè Lago&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s4-tool&quot;&gt;&lt;rect x=&quot;635&quot; y=&quot;435&quot; width=&quot;225&quot; height=&quot;70&quot; rx=&quot;14&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;747&quot; y=&quot;462&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;Tool o symbol?&lt;/text&gt;&lt;text x=&quot;747&quot; y=&quot;482&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;Greenwashing&lt;/text&gt;&lt;text x=&quot;747&quot; y=&quot;498&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;caso Microsoft&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s5&quot;&gt;&lt;rect x=&quot;335&quot; y=&quot;440&quot; width=&quot;230&quot; height=&quot;64&quot; rx=&quot;14&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;467&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;Caso reale: Novo Nordisk&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;487&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;cascading scorecard&lt;/text&gt;&lt;/a&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;p class=&quot;cap&quot;&gt;Clicca un nodo per saltare alla sezione. Le linee tratteggiate collegano concetti vicini: gli stakeholder spiegano perché esistono aspetti non-market; la double materiality alimenta la scelta degli aspetti nei 3 passi.&lt;/p&gt;
&lt;/div&gt;
&lt;/header&gt;
&lt;/div&gt;

&lt;main class=&quot;wrap&quot;&gt;
&lt;section class=&quot;part p1&quot; id=&quot;s1&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;I&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Parte prima · obiettivo di apprendimento 1&lt;/div&gt;&lt;h2&gt;Perché la sostenibilità entra nella scorecard&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;La lezione parte da una domanda semplice: se la balanced scorecard serve a tradurre la strategia in misure, &lt;strong&gt;dove si collocano gli obiettivi ambientali e sociali&lt;/strong&gt;? La risposta della lezione: dentro la stessa logica, non accanto. Prima però bisogna capire perché questi obiettivi sono diventati &lt;em&gt;strategici&lt;/em&gt;.&lt;/p&gt;

&lt;h3&gt;Ripasso: una strategy map in quattro righe&lt;/h3&gt;
&lt;p&gt;Una &lt;dfn&gt;strategy map&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(mappa strategica: lo schema che collega gli obiettivi con frecce di causa ed effetto)&lt;/span&gt; ordina gli obiettivi in quattro &lt;dfn&gt;perspectives&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(prospettive)&lt;/span&gt;: Financial, Customer, Internal processes, Learning and growth. L&#x27;esempio di ripasso è una compagnia aerea low cost, già vista nella lezione precedente sulla balanced scorecard.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;svgbox&quot; data-map=&quot;airline&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;
&lt;div&gt;
&lt;ul class=&quot;tight&quot;&gt;
&lt;li&gt;Le misure sono &lt;strong&gt;derivate dalla strategia&lt;/strong&gt;, non scelte da una lista.&lt;/li&gt;
&lt;li&gt;Ogni freccia è un&#x27;&lt;dfn&gt;if/then hypothesis&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(ipotesi “se… allora…”)&lt;/span&gt;: &lt;em&gt;se&lt;/em&gt; gli equipaggi lavorano in squadra, &lt;em&gt;allora&lt;/em&gt; l&#x27;aereo riparte in 25 minuti; &lt;em&gt;se&lt;/em&gt; riparte in fretta, &lt;em&gt;allora&lt;/em&gt; si possono offrire tariffe basse e puntualità… I dati possono confermarla o smentirla.&lt;/li&gt;
&lt;li&gt;La prospettiva finanziaria è il &lt;strong&gt;controllo finale&lt;/strong&gt;: se nulla arriva al risultato economico, la strategia va messa in discussione.&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;Domanda della lezione:&lt;/b&gt; dove entrano gli obiettivi ambientali e sociali in questa logica?&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;h3&gt;Dagli shareholder agli stakeholder&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Friedman, 1970&lt;/div&gt;&lt;h4&gt;Shareholder view&lt;/h4&gt;&lt;p&gt;La responsabilità dell&#x27;impresa è aumentare i profitti. Conta il &lt;strong&gt;risultato finanziario&lt;/strong&gt; per i proprietari (&lt;dfn&gt;shareholders&lt;/dfn&gt;, &lt;span class=&quot;gl&quot;&gt;gli azionisti&lt;/span&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;Freeman, 1984&lt;/div&gt;&lt;h4&gt;Stakeholder view&lt;/h4&gt;&lt;p&gt;Uno &lt;dfn&gt;stakeholder&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(portatore di interesse)&lt;/span&gt; è qualunque gruppo o individuo che &lt;strong&gt;può influenzare o è influenzato&lt;/strong&gt; dall&#x27;attività dell&#x27;impresa. Contano i risultati per &lt;strong&gt;tutti&lt;/strong&gt; gli stakeholder.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Stakeholder di natura diversa: dipendenti, consumatori, fornitori, comunità locali, istituzioni e autorità, ONG. L&#x27;impresa è un &lt;dfn&gt;open system&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(sistema aperto)&lt;/span&gt;: &lt;em&gt;accountability&lt;/em&gt; (dover rendere conto), vantaggio competitivo e sopravvivenza di lungo periodo dipendono dalle relazioni con l&#x27;ambiente interno ed esterno.&lt;/p&gt;

&lt;h3&gt;La triple bottom line: people, planet, profit&lt;/h3&gt;
&lt;p&gt;La &lt;dfn&gt;bottom line&lt;/dfn&gt; è letteralmente “l&#x27;ultima riga” del conto economico, l&#x27;utile. John Elkington, negli anni Novanta, propone di giudicare un&#x27;impresa su &lt;strong&gt;tre&lt;/strong&gt; ultime righe, non una: è la &lt;dfn&gt;triple bottom line&lt;/dfn&gt; (TBL).&lt;/p&gt;
&lt;div class=&quot;svgbox&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Diagramma della triple bottom line: tre cerchi sovrapposti&quot;&gt;
&lt;g opacity=&quot;.88&quot;&gt;&lt;circle cx=&quot;250&quot; cy=&quot;120&quot; r=&quot;100&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;390&quot; cy=&quot;120&quot; r=&quot;100&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;320&quot; cy=&quot;200&quot; r=&quot;100&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot;/&gt;&lt;/g&gt;
&lt;g text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;
&lt;text x=&quot;215&quot; y=&quot;85&quot; font-weight=&quot;700&quot; fill=&quot;var(--brick)&quot;&gt;PEOPLE&lt;/text&gt;&lt;text x=&quot;215&quot; y=&quot;103&quot; fill=&quot;var(--ink)&quot;&gt;performance sociale&lt;/text&gt;
&lt;text x=&quot;425&quot; y=&quot;85&quot; font-weight=&quot;700&quot; fill=&quot;var(--sage)&quot;&gt;PLANET&lt;/text&gt;&lt;text x=&quot;425&quot; y=&quot;103&quot; fill=&quot;var(--ink)&quot;&gt;performance ambientale&lt;/text&gt;
&lt;text x=&quot;320&quot; y=&quot;262&quot; font-weight=&quot;700&quot; fill=&quot;var(--slate)&quot;&gt;PROFIT&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;280&quot; fill=&quot;var(--ink)&quot;&gt;performance economica&lt;/text&gt;
&lt;text x=&quot;320&quot; y=&quot;158&quot; font-weight=&quot;700&quot; fill=&quot;var(--acc)&quot; font-size=&quot;12&quot;&gt;gestite&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;173&quot; font-weight=&quot;700&quot; fill=&quot;var(--acc)&quot; font-size=&quot;12&quot;&gt;insieme?&lt;/text&gt;
&lt;/g&gt;
&lt;g font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;&lt;text x=&quot;10&quot; y=&quot;40&quot;&gt;dipendenti, filiera, salute&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;55&quot;&gt;dei clienti, comunità, diritti&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;40&quot; text-anchor=&quot;end&quot;&gt;emissioni, energia, acqua,&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;55&quot; text-anchor=&quot;end&quot;&gt;materiali, rifiuti, biodiversità&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;270&quot;&gt;vendite, margini, rendimenti,&lt;/text&gt;&lt;text x=&quot;10&quot; y=&quot;285&quot;&gt;posti di lavoro, tasse&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/div&gt;
&lt;p&gt;La domanda aperta, dice la slide, non è &lt;em&gt;se&lt;/em&gt; misurare le tre linee ma &lt;strong&gt;come gestirle insieme&lt;/strong&gt;. Tutta la lezione è una risposta a questa domanda.&lt;/p&gt;

&lt;h3&gt;ESG: tre insiemi di responsabilità&lt;/h3&gt;
&lt;p&gt;Oggi investitori, clienti, dipendenti, fornitori, regolatori e comunità giudicano un&#x27;impresa su tre criteri, sintetizzati nella sigla &lt;dfn&gt;ESG&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(Environmental, Social, Governance)&lt;/span&gt;. La novità rispetto alla TBL è la &lt;strong&gt;Governance&lt;/strong&gt;: senza di essa, la performance ambientale e sociale non migliora.&lt;/p&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--sage)&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--sage)&quot;&gt;E · Environmental&lt;/div&gt;&lt;p class=&quot;gl&quot;&gt;Come processi, politiche, prodotti e imballaggi migliorano la sostenibilità ambientale.&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Meno rifiuti da imballaggio, emissioni, acqua&lt;/li&gt;&lt;li&gt;Energia rinnovabile, green buildings, approvvigionamento responsabile&lt;/li&gt;&lt;li&gt;Riciclo e biodiversità&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--brick)&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--brick)&quot;&gt;S · Social&lt;/div&gt;&lt;p class=&quot;gl&quot;&gt;Come l&#x27;impresa migliora salute, benessere e diritti dei suoi stakeholder.&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Dipendenti: formazione, salari equi, sicurezza&lt;/li&gt;&lt;li&gt;Fornitori: niente lavoro minorile&lt;/li&gt;&lt;li&gt;Clienti: privacy, prodotti sicuri&lt;/li&gt;&lt;li&gt;Comunità: assunzioni locali, istruzione&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--slate)&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--slate)&quot;&gt;G · Governance&lt;/div&gt;&lt;p class=&quot;gl&quot;&gt;Politiche e pratiche usate per dirigere e controllare l&#x27;impresa.&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Un board diversificato e qualificato&lt;/li&gt;&lt;li&gt;Cultura ESG e decisioni etiche&lt;/li&gt;&lt;li&gt;Reporting trasparente&lt;/li&gt;&lt;li&gt;Retribuzione dei manager legata all&#x27;ESG&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Prova tu: E, S o G? &lt;span class=&quot;tag slide&quot;&gt;esercizio delle slide&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;Continental Dynamics&lt;/b&gt;, produttore di componenti per motori a reazione, deve dimostrare un buon profilo ESG per partecipare a una gara pubblica. Classifica ogni voce; dopo la risposta vedrai anche la direzione (↑ meglio se aumenta, ↓ meglio se diminuisce).&lt;/p&gt;
&lt;div class=&quot;quiz&quot; id=&quot;quiz-esg&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;score&quot; aria-live=&quot;polite&quot;&gt;Scegli una lettera per ogni voce.&lt;/p&gt;
&lt;p class=&quot;note&quot;&gt;Soluzione delle slide: cinque voci sociali, quattro di governance, tre ambientali; solo il packaging waste è migliore quando scende. Nota che “fair pricing” e “policies against harassment” sono S, non G: riguardano il trattamento di clienti e dipendenti, non il modo in cui l&#x27;impresa è diretta.&lt;/p&gt;

&lt;h3&gt;Quattro pressioni che rendono l&#x27;ESG strategico&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Regulation&lt;/h4&gt;&lt;p&gt;Regole UE su rendicontazione di sostenibilità e &lt;dfn&gt;due diligence&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(verifica preventiva dei rischi lungo la catena del valore)&lt;/span&gt;; carbon pricing; regole di prodotto.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Investors and banks&lt;/h4&gt;&lt;p&gt;ESG ratings, finanza sostenibile, condizioni dei prestiti legate a obiettivi di sostenibilità.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Customers and supply chains&lt;/h4&gt;&lt;p&gt;I grandi clienti chiedono ai fornitori dati sulle emissioni, certificazioni e codici di condotta.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;People&lt;/h4&gt;&lt;p&gt;Laureati e dipendenti guardano allo scopo (&lt;em&gt;purpose&lt;/em&gt;) e alle pratiche di un&#x27;impresa quando scelgono dove lavorare.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Rischi e opportunità&lt;/h3&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Rischi e opportunità&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;ro1&quot; id=&quot;ro1t&quot;&gt;Rischio&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;ro2&quot; id=&quot;ro2t&quot;&gt;Opportunità&lt;/button&gt;
&lt;/div&gt;
&lt;div id=&quot;ro1&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel card&quot;&gt;
&lt;h4&gt;Ignorare l&#x27;ESG: il danno si propaga&lt;/h4&gt;
&lt;p&gt;Un&#x27;impresa scarica inquinanti in un fiume. Ne seguono: stampa negativa, boicottaggi e clienti persi; meno candidati di talento e più &lt;em&gt;turnover&lt;/em&gt;; investitori disillusi; cause e multe delle autorità. Il danno parte da un aspetto ambientale e arriva a tutte e quattro le perspective.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Nella realtà:&lt;/b&gt; Starbucks, con le sue Coffee and Farmer Equity (C.A.F.E.) Practices, monitora l&#x27;impatto economico, sociale e ambientale di oltre &lt;b&gt;400.000 coltivatori in 30 paesi&lt;/b&gt;: un modo per tenere sotto controllo il rischio nella filiera.&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;ro2&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel card&quot; hidden&gt;
&lt;h4&gt;Usare l&#x27;ESG per innovare e crescere&lt;/h4&gt;
&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Nuovi prodotti che i clienti vogliono&lt;/li&gt;&lt;li&gt;Un branding sostenibile che vende&lt;/li&gt;&lt;li&gt;Pianificazione migliore in condizioni di incertezza&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;&lt;b&gt;Nella realtà:&lt;/b&gt; Timberland produce le calzature Earthkeepers con plastica riciclata da milioni di bottiglie d&#x27;acqua; Allbirds e MUD Jeans seguono la stessa idea.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Quando il rischio diventa reale: Volkswagen&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Stati Uniti, 2015 · i fatti&lt;/div&gt;
&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Un software nei diesel di Volkswagen, Audi e Porsche (model year 2009–2015) riconosceva i test sulle emissioni e le riduceva &lt;em&gt;solo durante il test&lt;/em&gt;.&lt;/li&gt;
&lt;li&gt;Su strada le auto emettevano fino a &lt;b&gt;40 volte&lt;/b&gt; il limite USA di emissioni tossiche.&lt;/li&gt;
&lt;li&gt;Volkswagen aveva quasi il &lt;b&gt;70%&lt;/b&gt; del mercato USA delle auto diesel.&lt;/li&gt;
&lt;li&gt;Ha accettato di pagare &lt;b&gt;14,7 miliardi di dollari&lt;/b&gt; negli USA e non ha più potuto vendere gran parte dello stock diesel.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;1. Cosa succederebbe se tutti i costruttori aggirassero i test?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;I limiti di emissione diventerebbero inutili, la qualità dell&#x27;aria peggiorerebbe e i regolatori smetterebbero di fidarsi di qualsiasi test.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;2. Effetto sulla performance ambientale del settore?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Peggiorerebbe, e seguirebbero controlli più severi e costosi per tutti, anche per chi non ha imbrogliato.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;3. Come vengono colpiti i clienti?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Hanno pagato un&#x27;auto “pulita” che non hanno ricevuto; il valore di rivendita è sceso e la fiducia nel marchio è andata persa.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;4. Quali costi sono finanziari e quali intangibili?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Finanziari:&lt;/b&gt; multe, riacquisti delle auto, riparazioni. &lt;b&gt;Intangibili:&lt;/b&gt; reputazione, perdita del mercato diesel USA, tempo del management, morale dei dipendenti.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;La lezione del caso:&lt;/b&gt; un aspetto &lt;em&gt;non-market&lt;/em&gt; (emissioni controllate dai regolatori) è diventato una delle più grandi perdite finanziarie dell&#x27;industria automobilistica. È lo stesso schema che ritroveremo in Novo Nordisk: un problema fuori dal mercato che diventa un problema di conto economico.&lt;/div&gt;

&lt;div class=&quot;selfcheck&quot;&gt;
&lt;h3&gt;Autoverifica · Parte I&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Qual è la differenza essenziale tra la visione di Friedman e quella di Freeman?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Friedman (1970): l&#x27;unica responsabilità dell&#x27;impresa è aumentare i profitti, contano i risultati per gli azionisti. Freeman (1984): contano i risultati per tutti coloro che influenzano o sono influenzati dall&#x27;impresa (stakeholder).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Cosa aggiunge la sigla ESG rispetto alla triple bottom line?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;La Governance: politiche e pratiche con cui l&#x27;impresa è diretta e controllata (board, etica, trasparenza, retribuzione legata all&#x27;ESG). Senza governance, le performance ambientale e sociale non migliorano.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché “packaging material waste” ha la freccia ↓ mentre “responsible materials sourcing” ha ↑?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;La freccia indica la direzione desiderabile della misura: i rifiuti sono meglio quando diminuiscono, la quota di materiali responsabili è meglio quando aumenta. Ogni misura in una scorecard deve avere una direzione esplicita.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Elenca le quattro pressioni che rendono strategico l&#x27;ESG.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Regolazione; investitori e banche; clienti e catene di fornitura; persone (talenti e dipendenti).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Nel caso Volkswagen, perché si parla di aspetto “non-market” diventato finanziario?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Le emissioni sono governate dai regolatori, non dal mercato; ma la violazione ha generato 14,7 miliardi di dollari di costi negli USA e la perdita del mercato diesel, cioè effetti diretti sul risultato economico.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p2&quot; id=&quot;s2&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;II&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Parte seconda · obiettivi 1 e 2&lt;/div&gt;&lt;h2&gt;Regole, standard e double materiality&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Una volta chiarito &lt;em&gt;perché&lt;/em&gt; l&#x27;ESG conta, la lezione guarda a &lt;em&gt;cosa&lt;/em&gt; le imprese devono rendicontare e a &lt;em&gt;come&lt;/em&gt; si sceglie cosa misurare. Il ponte con la scorecard è una frase delle slide: &lt;strong&gt;ciò che un&#x27;impresa deve rendicontare, deve prima misurarlo; la scorecard dà a ogni misura un target e un responsabile&lt;/strong&gt;.&lt;/p&gt;

&lt;h3&gt;Regole UE: chi deve rendicontare, e cosa&lt;/h3&gt;
&lt;p&gt;La &lt;dfn&gt;CSRD&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(Corporate Sustainability Reporting Directive, la direttiva UE sulla rendicontazione di sostenibilità)&lt;/span&gt; è stata semplificata nel 2026 dalla direttiva &lt;dfn&gt;Omnibus I&lt;/dfn&gt;. In sintesi:&lt;/p&gt;
&lt;div class=&quot;grid4&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;Chi&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;1.000+&lt;/div&gt;&lt;p&gt;dipendenti &lt;b&gt;e&lt;/b&gt; più di 450 milioni € di fatturato (entrambe le soglie)&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;Quando&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;2027&lt;/div&gt;&lt;p&gt;primo esercizio coperto; primi report nel 2028&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;Cosa&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;ESRS&lt;/div&gt;&lt;p&gt;European Sustainability Reporting Standards, semplificati, con meno &lt;em&gt;data points&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;Controllato da&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;Auditor&lt;/div&gt;&lt;p&gt;&lt;dfn&gt;limited assurance&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(verifica “limitata”: il revisore dice di non aver trovato errori rilevanti, senza un esame completo)&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;&lt;b&gt;Come si scelgono i temi:&lt;/b&gt; con la double materiality (sotto), cioè impatti su persone e pianeta &lt;em&gt;e&lt;/em&gt; rischi e opportunità finanziari. &lt;span class=&quot;note&quot;&gt;Directive (EU) 2026/470 (Omnibus I), pubblicata il 26 febbraio 2026; recepimento entro il 19 marzo 2027.&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Tanti standard, una direzione&lt;/h3&gt;
&lt;p&gt;Fuori dall&#x27;UE le imprese scelgono tra diversi &lt;dfn&gt;standard setters&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(enti che emanano standard)&lt;/span&gt;. Il modo più semplice per distinguerli: chiedersi &lt;strong&gt;in quale direzione di materialità&lt;/strong&gt; guarda ciascuno.&lt;/p&gt;
&lt;div class=&quot;svgbox&quot;&gt;
&lt;svg viewBox=&quot;0 0 700 190&quot; role=&quot;img&quot; aria-label=&quot;Spettro degli standard dall&#x27;inside-out all&#x27;outside-in&quot;&gt;
&lt;defs&gt;&lt;linearGradient id=&quot;spg&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;var(--sage)&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;var(--slate)&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;
&lt;text x=&quot;20&quot; y=&quot;22&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;var(--sage)&quot;&gt;INSIDE-OUT&lt;/text&gt;&lt;text x=&quot;20&quot; y=&quot;40&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;impatto dell&#x27;impresa su persone e pianeta&lt;/text&gt;
&lt;text x=&quot;680&quot; y=&quot;22&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;var(--slate)&quot; text-anchor=&quot;end&quot;&gt;OUTSIDE-IN&lt;/text&gt;&lt;text x=&quot;680&quot; y=&quot;40&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot; text-anchor=&quot;end&quot;&gt;effetti sui risultati dell&#x27;impresa&lt;/text&gt;
&lt;rect x=&quot;30&quot; y=&quot;64&quot; width=&quot;640&quot; height=&quot;6&quot; rx=&quot;3&quot; fill=&quot;url(#spg)&quot;/&gt;
&lt;circle cx=&quot;140&quot; cy=&quot;67&quot; r=&quot;13&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;circle cx=&quot;350&quot; cy=&quot;67&quot; r=&quot;13&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;circle cx=&quot;560&quot; cy=&quot;67&quot; r=&quot;13&quot; fill=&quot;var(--slate)&quot;/&gt;
&lt;g text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;140&quot; y=&quot;106&quot; font-size=&quot;17&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;GRI&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;126&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;impatti su economia,&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;141&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;ambiente e persone;&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;156&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;per tutti gli stakeholder&lt;/text&gt;
&lt;text x=&quot;350&quot; y=&quot;106&quot; font-size=&quot;17&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;ESRS&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;126&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;standard UE: entrambe&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;141&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;le direzioni insieme =&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;156&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;double materiality&lt;/text&gt;
&lt;text x=&quot;560&quot; y=&quot;106&quot; font-size=&quot;17&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;SASB&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;126&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;temi finanziariamente rilevanti,&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;141&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;settore per settore; per gli&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;156&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;investitori; oggi gestiti dall&#x27;ISSB&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Anche usati&lt;/h4&gt;&lt;p&gt;&lt;b&gt;UN PRI&lt;/b&gt;: principi per gli investitori responsabili. &lt;b&gt;WEF e IBC&lt;/b&gt;: le &lt;em&gt;Stakeholder Capitalism Metrics&lt;/em&gt;, un nucleo comune di misure.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Perché è ancora difficile&lt;/h4&gt;&lt;p&gt;Non esiste ancora un unico standard; la pratica di &lt;em&gt;assurance&lt;/em&gt; varia; dare un &lt;b&gt;valore monetario&lt;/b&gt; agli impatti ESG è difficile (ci prova l&#x27;&lt;dfn&gt;impact weighted accounting&lt;/dfn&gt;, &lt;span class=&quot;gl&quot;&gt;contabilità che traduce gli impatti in euro&lt;/span&gt;). Negli USA le regole climatiche della SEC del 2024 &lt;b&gt;non sono in vigore&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Gli UN Sustainable Development Goals&lt;/h3&gt;
&lt;p&gt;Gli &lt;dfn&gt;SDGs&lt;/dfn&gt; non sono uno standard di rendicontazione ma un &lt;dfn&gt;blueprint&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(un progetto di riferimento)&lt;/span&gt;: 17 obiettivi dell&#x27;Agenda ONU 2030, ciascuno con target che imprese e governi usano come &lt;em&gt;benchmark&lt;/em&gt;.&lt;/p&gt;
&lt;div class=&quot;sdg&quot;&gt;
&lt;div&gt;&lt;b&gt;1&lt;/b&gt;No poverty&lt;/div&gt;&lt;div&gt;&lt;b&gt;2&lt;/b&gt;Zero hunger&lt;/div&gt;&lt;div&gt;&lt;b&gt;3&lt;/b&gt;Good health and wellbeing&lt;/div&gt;&lt;div&gt;&lt;b&gt;4&lt;/b&gt;Quality education&lt;/div&gt;&lt;div&gt;&lt;b&gt;5&lt;/b&gt;Gender equality&lt;/div&gt;&lt;div&gt;&lt;b&gt;6&lt;/b&gt;Clean water and sanitation&lt;/div&gt;&lt;div&gt;&lt;b&gt;7&lt;/b&gt;Affordable and clean energy&lt;/div&gt;&lt;div&gt;&lt;b&gt;8&lt;/b&gt;Decent work and economic growth&lt;/div&gt;&lt;div&gt;&lt;b&gt;9&lt;/b&gt;Industry, innovation and infrastructure&lt;/div&gt;&lt;div&gt;&lt;b&gt;10&lt;/b&gt;Reduced inequalities&lt;/div&gt;&lt;div&gt;&lt;b&gt;11&lt;/b&gt;Sustainable cities and communities&lt;/div&gt;&lt;div&gt;&lt;b&gt;12&lt;/b&gt;Responsible consumption and production&lt;/div&gt;&lt;div&gt;&lt;b&gt;13&lt;/b&gt;Climate action&lt;/div&gt;&lt;div&gt;&lt;b&gt;14&lt;/b&gt;Life below water&lt;/div&gt;&lt;div&gt;&lt;b&gt;15&lt;/b&gt;Life on land&lt;/div&gt;&lt;div&gt;&lt;b&gt;16&lt;/b&gt;Peace, justice and strong institutions&lt;/div&gt;&lt;div&gt;&lt;b&gt;17&lt;/b&gt;Partnerships for the goals&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;s2-mat&quot;&gt;Double materiality: due direzioni dello sguardo&lt;/h3&gt;
&lt;p&gt;Un tema è &lt;dfn&gt;material&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(rilevante)&lt;/span&gt; quando conta abbastanza da influenzare le decisioni. La &lt;dfn&gt;double materiality&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(doppia rilevanza)&lt;/span&gt; guarda in due direzioni:&lt;/p&gt;
&lt;div class=&quot;svgbox&quot;&gt;
&lt;svg viewBox=&quot;0 0 700 200&quot; role=&quot;img&quot; aria-label=&quot;Le due direzioni della double materiality&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;dma&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;/marker&gt;&lt;marker id=&quot;dmb&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;40&quot; y=&quot;55&quot; width=&quot;170&quot; height=&quot;90&quot; rx=&quot;16&quot; fill=&quot;var(--m-fin)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-size=&quot;16&quot; font-weight=&quot;700&quot;&gt;Impresa&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-size=&quot;12&quot;&gt;es. un pastificio&lt;/text&gt;
&lt;rect x=&quot;490&quot; y=&quot;55&quot; width=&quot;180&quot; height=&quot;90&quot; rx=&quot;16&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;580&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot; font-size=&quot;16&quot; font-weight=&quot;700&quot;&gt;Persone e ambiente&lt;/text&gt;&lt;text x=&quot;580&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted)&quot; font-size=&quot;12&quot;&gt;valle, clima, agricoltori&lt;/text&gt;
&lt;path d=&quot;M215 78 H482&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;4&quot; marker-end=&quot;url(#dma)&quot;/&gt;&lt;path d=&quot;M485 122 H218&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;4&quot; marker-end=&quot;url(#dmb)&quot;/&gt;
&lt;text x=&quot;350&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot; fill=&quot;var(--brick)&quot;&gt;INSIDE-OUT · impact materiality&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;acqua, energia, camion e emissioni nella valle&lt;/text&gt;
&lt;text x=&quot;350&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot; fill=&quot;var(--slate)&quot;&gt;OUTSIDE-IN · financial materiality&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--muted)&quot;&gt;la siccità al Sud taglia il raccolto di grano duro&lt;/text&gt;
&lt;/svg&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--brick)&quot;&gt;Inside-out&lt;/div&gt;&lt;h4&gt;Impact materiality&lt;/h4&gt;&lt;p&gt;Come l&#x27;impresa influisce su persone e ambiente? &lt;b&gt;Esempio:&lt;/b&gt; un pastificio usa molta acqua ed energia, e i suoi camion portano traffico ed emissioni nella valle.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot; style=&quot;color:var(--slate)&quot;&gt;Outside-in&lt;/div&gt;&lt;h4&gt;Financial materiality&lt;/h4&gt;&lt;p&gt;Come i temi ambientali e sociali influiscono su risultati e rischi dell&#x27;impresa? &lt;b&gt;Esempio:&lt;/b&gt; una siccità nel Sud Italia riduce il raccolto di grano duro e il pastificio paga di più la materia prima principale.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;Regola chiave:&lt;/b&gt; un tema è material se conta in &lt;strong&gt;almeno una&lt;/strong&gt; delle due direzioni (logica “OR”, non “AND”). Per la scorecard, i temi material sono i &lt;em&gt;candidati&lt;/em&gt; a diventare misure.&lt;/div&gt;

&lt;h4&gt;Laboratorio: la matrice di materialità &lt;span class=&quot;tag ill&quot;&gt;esempio illustrativo&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;I punteggi (0–10) dei temi del pastificio sono inventati per far vedere il meccanismo. Sposta le soglie: un tema diventa material (pieno) appena supera &lt;em&gt;una&lt;/em&gt; delle due. L&#x27;area colorata è la zona material.&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;Soglia impact materiality &lt;input type=&quot;range&quot; id=&quot;thi&quot; min=&quot;1&quot; max=&quot;9&quot; step=&quot;0.5&quot; value=&quot;6&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;thi-o&quot;&gt;&lt;/span&gt;&lt;/label&gt;
&lt;label&gt;Soglia financial materiality &lt;input type=&quot;range&quot; id=&quot;thf&quot; min=&quot;1&quot; max=&quot;9&quot; step=&quot;0.5&quot; value=&quot;6&quot;&gt;&lt;span class=&quot;out&quot; id=&quot;thf-o&quot;&gt;&lt;/span&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;grid2&quot; style=&quot;align-items:start&quot;&gt;
&lt;div class=&quot;svgbox&quot; id=&quot;matchart&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;
&lt;div&gt;&lt;p id=&quot;matlist&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;p class=&quot;note&quot; id=&quot;matlegend&quot;&gt;&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Osserva: la “carta usata negli uffici” resta fuori con qualunque soglia ragionevole. La ritroverai nella Parte IV come esempio di aspetto da lasciare &lt;em&gt;fuori&lt;/em&gt; dalla scorecard.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Il problema abituale: la sostenibilità “a lato”&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Un report separato&lt;/h4&gt;&lt;p&gt;Scritto una volta l&#x27;anno per lettori esterni, non usato nella gestione mensile.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Un ufficio separato&lt;/h4&gt;&lt;p&gt;Il team sostenibilità “possiede” il tema; i &lt;em&gt;line managers&lt;/em&gt; (i responsabili operativi) no.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Nessun legame con la strategia&lt;/h4&gt;&lt;p&gt;I target non derivano dalla &lt;dfn&gt;value proposition&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(la proposta di valore ai clienti)&lt;/span&gt;, quindi competono con essa.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Nessun legame con gli incentivi&lt;/h4&gt;&lt;p&gt;I manager sono pagati solo sui risultati finanziari: la sostenibilità perde ogni &lt;dfn&gt;trade-off&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(scelta in cui guadagnare su un fronte costa sull&#x27;altro)&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Risultato: buone intenzioni, pochi cambiamenti nelle decisioni e il rischio di &lt;dfn&gt;greenwashing&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(dichiarazioni ambientali più simboliche che sostanziali)&lt;/span&gt;.&lt;/p&gt;

&lt;div id=&quot;s2-def&quot; class=&quot;quote&quot;&gt;“A sustainable balanced scorecard links environmental and social aspects to the company&#x27;s strategy, so that they are managed inside the core business.”&lt;small&gt;Definizione delle slide. Non è un nuovo strumento: usa la logica della balanced scorecard — &lt;b&gt;derive, link, measure, test&lt;/b&gt; (derivare, collegare, misurare, verificare).&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;grid4&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Derive&lt;/div&gt;&lt;p&gt;Gli obiettivi ambientali e sociali discendono dalla strategia.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Link&lt;/div&gt;&lt;p&gt;Ognuno ha una freccia if/then verso gli altri obiettivi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Measure&lt;/div&gt;&lt;p&gt;Ogni obiettivo ha una misura, una direzione, un target.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Test&lt;/div&gt;&lt;p&gt;I dati confermano o smentiscono le frecce.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;selfcheck&quot;&gt;
&lt;h3&gt;Autoverifica · Parte II&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Dopo Omnibus I, quali imprese UE rientrano nella CSRD e da quale esercizio?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Quelle con più di 1.000 dipendenti &lt;b&gt;e&lt;/b&gt; più di 450 milioni € di fatturato; il primo esercizio coperto è il 2027, con i primi report nel 2028, sottoposti a limited assurance.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Colloca GRI, ESRS e SASB sulla linea inside-out / outside-in.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;GRI: inside-out (impatti, per tutti gli stakeholder). SASB: outside-in (rilevanza finanziaria, per gli investitori, oggi presso l&#x27;ISSB). ESRS: entrambe le direzioni, cioè double materiality.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Un tema ha alto impatto sull&#x27;ambiente ma nessun effetto finanziario. È material secondo la double materiality?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Sì: basta che sia rilevante in una delle due direzioni. Diventa quindi un candidato a misura nella scorecard.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Gli SDGs sono uno standard di rendicontazione?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;No: sono un blueprint, 17 obiettivi dell&#x27;Agenda ONU 2030 con target usati come benchmark da imprese e governi.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quali quattro sintomi indicano che la sostenibilità è “on the side”?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Report separato, ufficio separato, nessun legame con la strategia, nessun legame con gli incentivi. Conseguenza: poche decisioni cambiano e cresce il rischio di greenwashing.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Ripeti la definizione di sustainable balanced scorecard e le quattro parole della sua logica.&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Collega gli aspetti ambientali e sociali alla strategia, così che siano gestiti dentro il core business. Logica: derive, link, measure, test.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p3&quot; id=&quot;s3&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;III&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Parte terza · obiettivi 2 e 3&lt;/div&gt;&lt;h2&gt;Dove va ogni aspetto? Le tre architetture&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;La definizione chiede di &lt;strong&gt;collegare&lt;/strong&gt; ogni aspetto ambientale o sociale alla strategia. La prima domanda è quindi: &lt;em&gt;per quale strada l&#x27;aspetto raggiunge l&#x27;impresa?&lt;/em&gt;&lt;/p&gt;

&lt;h3&gt;Segui il path dell&#x27;aspetto&lt;/h3&gt;
&lt;div class=&quot;svgbox&quot;&gt;
&lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-label=&quot;Un aspetto raggiunge i risultati attraverso i mercati o fuori dai mercati&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;pa&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;10&quot; y=&quot;85&quot; width=&quot;170&quot; height=&quot;80&quot; rx=&quot;14&quot; fill=&quot;var(--m-fin)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Un aspetto&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;139&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;ambientale o sociale&lt;/text&gt;
&lt;rect x=&quot;250&quot; y=&quot;10&quot; width=&quot;270&quot; height=&quot;100&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;268&quot; y=&quot;38&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot; fill=&quot;var(--ink)&quot;&gt;Through markets&lt;/text&gt;&lt;text x=&quot;268&quot; y=&quot;60&quot; font-size=&quot;12.5&quot; fill=&quot;var(--ink)&quot;&gt;clienti, fornitori, prezzi, costi&lt;/text&gt;&lt;text x=&quot;268&quot; y=&quot;84&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; fill=&quot;var(--muted)&quot;&gt;I supermercati chiedono al pastificio&lt;/text&gt;&lt;text x=&quot;268&quot; y=&quot;99&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; fill=&quot;var(--muted)&quot;&gt;imballaggi riciclabili.&lt;/text&gt;
&lt;rect x=&quot;250&quot; y=&quot;140&quot; width=&quot;270&quot; height=&quot;100&quot; rx=&quot;14&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;268&quot; y=&quot;168&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot; fill=&quot;var(--brick)&quot;&gt;Outside markets&lt;/text&gt;&lt;text x=&quot;268&quot; y=&quot;190&quot; font-size=&quot;12.5&quot; fill=&quot;var(--ink)&quot;&gt;leggi, comunità locali, ONG, media&lt;/text&gt;&lt;text x=&quot;268&quot; y=&quot;214&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; fill=&quot;var(--muted)&quot;&gt;I residenti si oppongono a un nuovo&lt;/text&gt;&lt;text x=&quot;268&quot; y=&quot;229&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; fill=&quot;var(--muted)&quot;&gt;silo accanto allo stabilimento.&lt;/text&gt;
&lt;rect x=&quot;590&quot; y=&quot;85&quot; width=&quot;160&quot; height=&quot;80&quot; rx=&quot;14&quot; fill=&quot;var(--m-pro)&quot;/&gt;&lt;text x=&quot;670&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-weight=&quot;700&quot; font-size=&quot;14&quot;&gt;Risultati&lt;/text&gt;&lt;text x=&quot;670&quot; y=&quot;134&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-size=&quot;11.5&quot;&gt;vendite, costi,&lt;/text&gt;&lt;text x=&quot;670&quot; y=&quot;149&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-size=&quot;11.5&quot;&gt;licence to operate&lt;/text&gt;
&lt;g stroke=&quot;var(--acc)&quot; stroke-width=&quot;2.5&quot; fill=&quot;none&quot; marker-end=&quot;url(#pa)&quot;&gt;&lt;path d=&quot;M182 110 L245 70&quot;/&gt;&lt;path d=&quot;M182 140 L245 180&quot;/&gt;&lt;path d=&quot;M522 70 L585 110&quot;/&gt;&lt;path d=&quot;M522 180 L585 140&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/div&gt;
&lt;p&gt;La &lt;dfn&gt;licence to operate&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(il consenso sociale e formale a operare: permessi, accettazione della comunità)&lt;/span&gt; è il risultato più esposto agli aspetti fuori dai mercati.&lt;/p&gt;

&lt;h3&gt;Market e non-market aspects&lt;/h3&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Market aspects&lt;/th&gt;&lt;th&gt;Non-market aspects&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Come agiscono&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Attraverso i mercati: clienti, fornitori, prezzi, costi&lt;/td&gt;&lt;td&gt;Fuori dai mercati: leggi, opinione pubblica, comunità, ONG&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Esempi&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Costo dell&#x27;energia, domanda di prodotti green, materie prime scarse&lt;/td&gt;&lt;td&gt;Licence to operate, campagne di ONG, nuova regolazione, reputazione&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Nella scorecard&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Entrano nelle quattro perspective classiche&lt;/td&gt;&lt;td&gt;Possono richiedere una perspective propria&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;b&gt;Esempio delle slide:&lt;/b&gt; la quota di rinnovabili di Enel agisce attraverso gli &lt;b&gt;investitori&lt;/b&gt; (market); i residenti che protestano contro un nuovo impianto agiscono attraverso la &lt;b&gt;comunità&lt;/b&gt; (non-market).&lt;/p&gt;

&lt;h4&gt;Prova tu: market o non-market? &lt;span class=&quot;tag slide&quot;&gt;esercizio delle slide&lt;/span&gt;&lt;/h4&gt;
&lt;div class=&quot;quiz&quot; id=&quot;quiz-mkt&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;score&quot; aria-live=&quot;polite&quot;&gt;Scegli una risposta per ogni caso.&lt;/p&gt;
&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;Casi di confine:&lt;/b&gt; conta &lt;em&gt;da dove parte&lt;/em&gt; l&#x27;effetto. Una regola UE alza i costi (effetto di mercato) ma nasce da una legge: è non-market. La scarsità d&#x27;acqua presso un fornitore è market, ma diventa non-market se il conflitto sull&#x27;acqua diventa politico.&lt;/div&gt;

&lt;h3 id=&quot;s3-opt&quot;&gt;Tre opzioni per una sustainable scorecard&lt;/h3&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;big&quot;&gt;1&lt;/div&gt;&lt;h4&gt;Integrate&lt;/h4&gt;&lt;p&gt;Mettere le misure ambientali e sociali &lt;b&gt;dentro&lt;/b&gt; le quattro perspective esistenti.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;big&quot;&gt;2&lt;/div&gt;&lt;h4&gt;Add&lt;/h4&gt;&lt;p&gt;Creare una &lt;b&gt;quinta&lt;/b&gt; perspective, non-market, per gli aspetti che agiscono tramite società e politica.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;big&quot;&gt;3&lt;/div&gt;&lt;h4&gt;Derive&lt;/h4&gt;&lt;p&gt;Costruire una scorecard ambientale e sociale &lt;b&gt;specifica&lt;/b&gt;, derivata da quella principale.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Le opzioni si possono &lt;strong&gt;combinare&lt;/strong&gt;. Esplorale sul caso guida delle slide: un pastificio che produce pasta di qualità da grano duro italiano, venduta ai supermercati.&lt;/p&gt;

&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Le tre opzioni sul pastificio&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;op1&quot;&gt;1 · Integrate&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;op2&quot;&gt;2 · Add a perspective&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;op3&quot;&gt;3 · Derive&lt;/button&gt;
&lt;/div&gt;
&lt;div id=&quot;op1&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot;&gt;
&lt;div class=&quot;svgbox&quot; data-map=&quot;pasta1&quot;&gt;&lt;/div&gt;
&lt;p&gt;Tutto in quattro righe: le misure ambientali e sociali stanno nelle perspective usuali e ciascuna ha una freccia verso i risultati finanziari. &lt;b&gt;Manca&lt;/b&gt;: le lamentele dei residenti per i camion, che agiscono fuori dai mercati.&lt;/p&gt;
&lt;h4&gt;Esempi di misure per perspective&lt;/h4&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Perspective&lt;/th&gt;&lt;th&gt;Misura ambientale&lt;/th&gt;&lt;th&gt;Misura sociale&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Financial&lt;/td&gt;&lt;td&gt;Revenue from low impact products &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Cost of workplace accidents &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Customer&lt;/td&gt;&lt;td&gt;Customers who see us as environmentally responsible &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Customers who trust our product safety &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Internal processes&lt;/td&gt;&lt;td&gt;Energy per unit produced &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Suppliers audited on labour standards &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Learning and growth&lt;/td&gt;&lt;td&gt;Employees trained on environmental practices &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Female to male average pay &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Punto di forza&lt;/div&gt;&lt;p&gt;La sostenibilità sta &lt;b&gt;dentro la catena principale&lt;/b&gt; di causa ed effetto ed è gestita dai line manager come ogni altra misura.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;Limite&lt;/div&gt;&lt;p&gt;Le quattro caselle vedono solo ciò che arriva &lt;b&gt;tramite i mercati&lt;/b&gt;. I residenti che si oppongono a un impianto agiscono con permessi e opinione pubblica: qui non hanno un posto naturale. L&#x27;opzione 2 risolve il problema.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div id=&quot;op2&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot; hidden&gt;
&lt;div class=&quot;svgbox&quot; data-map=&quot;pasta2&quot;&gt;&lt;/div&gt;
&lt;p&gt;La &lt;b&gt;non-market perspective&lt;/b&gt; raccoglie società, regolatori, ONG, comunità locali, media. Misure tipiche: lamentele della comunità &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;, questioni aperte con i regolatori &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;, fiducia degli stakeholder &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;. Le frecce partono dalla quinta perspective verso &lt;em&gt;tutte&lt;/em&gt; le altre: la comunità può bloccare un processo, influire sui clienti, sui costi.&lt;/p&gt;
&lt;p&gt;Si usa quando gli aspetti non-market sono &lt;b&gt;strategicamente rilevanti&lt;/b&gt; e non possono essere collocati altrove.&lt;/p&gt;
&lt;/div&gt;
&lt;div id=&quot;op3&quot; role=&quot;tabpanel&quot; class=&quot;tabpanel&quot; hidden&gt;
&lt;div class=&quot;duo&quot;&gt;&lt;div&gt;&lt;h4&gt;Main scorecard&lt;/h4&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;pasta3a&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;arr&quot; aria-hidden=&quot;true&quot;&gt;➜&lt;/div&gt;&lt;div&gt;&lt;h4&gt;Derived: durum wheat programme&lt;/h4&gt;&lt;div class=&quot;svgbox&quot; data-map=&quot;pasta3b&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Una scorecard dedicata, per esempio per l&#x27;&lt;b&gt;unità sostenibilità&lt;/b&gt; o per un &lt;b&gt;programma fornitori&lt;/b&gt;. È &lt;b&gt;derivata&lt;/b&gt;: dettaglia un obiettivo già presente nella mappa principale (qui &lt;em&gt;Wheat under contract&lt;/em&gt;, evidenziato) e resta collegata a esso. Nota come la riga Customer diventi “Farmers”: nel programma, i “clienti” da soddisfare sono gli agricoltori.&lt;/p&gt;
&lt;div class=&quot;callout&quot;&gt;&lt;b&gt;Attenzione:&lt;/b&gt; usata &lt;em&gt;da sola&lt;/em&gt;, la scorecard derivata riporta il problema dei silos: un mondo separato con obiettivi separati.&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Le misure ESG nelle quattro perspective&lt;/h3&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th style=&quot;color:var(--sage)&quot;&gt;Environmental&lt;/th&gt;&lt;th style=&quot;color:var(--brick)&quot;&gt;Social&lt;/th&gt;&lt;th style=&quot;color:var(--slate)&quot;&gt;Governance&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Financial&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Revenue from eco products &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Workers&#x27; compensation costs &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;td&gt;CEO pay ÷ average employee pay &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Customer&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Customers buying eco products &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Customers who say we care about local communities &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Customers who say we behave ethically &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Internal processes&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Water and carbon per unit produced &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Warranty claims ÷ sales &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Suppliers with verified child labour compliance &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Learning and growth&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Engineers trained in eco design &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Occupational injuries &lt;span class=&quot;down&quot;&gt;↓&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Board members with ESG training &lt;span class=&quot;up&quot;&gt;↑&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;Due formule utili da leggere bene: &lt;b&gt;CEO pay ÷ average employee pay&lt;/b&gt; (il &lt;em&gt;pay ratio&lt;/em&gt;: quante volte il compenso del CEO supera quello medio; più basso = più equo) e &lt;b&gt;warranty claims ÷ sales&lt;/b&gt; (reclami in garanzia per unità di vendite, una proxy della sicurezza e qualità del prodotto). Avvertenza delle slide: vanno &lt;b&gt;collegate&lt;/b&gt; con frasi if/then e &lt;b&gt;legate agli incentivi&lt;/b&gt;, altrimenti un impegno dichiarato può non tradursi in azione.&lt;/p&gt;

&lt;h3&gt;Confronto tra le tre opzioni&lt;/h3&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;1 · Integrate&lt;/th&gt;&lt;th&gt;2 · Add a perspective&lt;/th&gt;&lt;th&gt;3 · Derive&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Adatta quando&lt;/b&gt;&lt;/td&gt;&lt;td&gt;La maggior parte degli aspetti agisce tramite i mercati&lt;/td&gt;&lt;td&gt;Contano licence to operate e pressione pubblica&lt;/td&gt;&lt;td&gt;Un&#x27;unità o un programma ha bisogno di dettaglio&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Punto di forza&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Dentro la logica centrale di causa ed effetto&lt;/td&gt;&lt;td&gt;Dà alla società un posto visibile&lt;/td&gt;&lt;td&gt;Focus operativo&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Rischio&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Gli aspetti non-market restano fuori&lt;/td&gt;&lt;td&gt;Trattata come un&#x27;aggiunta, non come un driver&lt;/td&gt;&lt;td&gt;Diventa un silo se non è collegata&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;

&lt;h3&gt;Due scelte definiscono ogni sustainable scorecard&lt;/h3&gt;
&lt;p&gt;Secondo &lt;b&gt;Hansen e Schaltegger (2016)&lt;/b&gt; una sustainable scorecard si descrive con &lt;strong&gt;due scelte&lt;/strong&gt;: le righe dicono &lt;em&gt;dove&lt;/em&gt; va la sostenibilità (le tre opzioni appena viste); le colonne dicono &lt;em&gt;a cosa serve la mappa&lt;/em&gt;, cioè cosa sta in cima. Clicca le celle piene.&lt;/p&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table id=&quot;hsm&quot;&gt;
&lt;tr&gt;&lt;th&gt;Scelta 1: dove? ↓ · Scelta 2: cosa in cima? →&lt;/th&gt;&lt;th&gt;Business case&lt;br&gt;&lt;span class=&quot;note&quot;&gt;profit at the top&lt;/span&gt;&lt;/th&gt;&lt;th&gt;Mission first&lt;br&gt;&lt;span class=&quot;note&quot;&gt;sustainability at the top&lt;/span&gt;&lt;/th&gt;&lt;th&gt;Balanced&lt;br&gt;&lt;span class=&quot;note&quot;&gt;several goals at the top&lt;/span&gt;&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;1. Integrate&lt;/b&gt;&lt;/td&gt;&lt;td data-x=&quot;&lt;b&gt;Pastificio:&lt;/b&gt; sostenibilità nelle quattro perspective, profitto in cima. Gli obiettivi green servono a vendere linee premium e ridurre i costi.&quot; style=&quot;cursor:pointer;background:var(--cbg)&quot;&gt;Pasta maker&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td data-x=&quot;&lt;b&gt;Novo Nordisk&lt;/b&gt; (Parte V): obiettivi sociali e ambientali dentro quattro intestazioni, con la customer perspective allargata alla società; in cima la triple bottom line.&quot; style=&quot;cursor:pointer;background:var(--cbg)&quot;&gt;Novo Nordisk&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;2. Add a perspective&lt;/b&gt;&lt;/td&gt;&lt;td data-x=&quot;&lt;b&gt;Caffè Lago e Alpe Verde&lt;/b&gt; (Parte IV): una quinta perspective non-market, ma il profitto resta in cima. La sostenibilità è parte del prodotto.&quot; style=&quot;cursor:pointer;background:var(--cbg)&quot;&gt;Caffè Lago, Alpe Verde&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;3. Derive&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p id=&quot;hsm-out&quot; class=&quot;callout&quot; aria-live=&quot;polite&quot;&gt;Le celle vuote non sono “impossibili”: la lezione non le esemplifica. Prova a immaginare un&#x27;impresa per ciascuna.&lt;/p&gt;

&lt;h3&gt;Seconda scelta: cosa sta in cima alla mappa?&lt;/h3&gt;
&lt;p&gt;Nella balanced scorecard tradizionale il profitto stava &lt;em&gt;sempre&lt;/em&gt; in cima. Qui diventa una scelta che riflette i &lt;strong&gt;valori&lt;/strong&gt; dell&#x27;impresa (Hansen e Schaltegger, 2016).&lt;/p&gt;
&lt;div id=&quot;topmap&quot;&gt;
&lt;div class=&quot;steps&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-k=&quot;bc&quot;&gt;Business case&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-k=&quot;mf&quot;&gt;Mission first&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-k=&quot;ba&quot;&gt;Balanced&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;&lt;div class=&quot;svgbox&quot; id=&quot;topmap-svg&quot; style=&quot;margin:0&quot;&gt;&lt;/div&gt;&lt;p id=&quot;topmap-txt&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Mission first: due esempi&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;k&quot;&gt;Patagonia, 2022&lt;/div&gt;&lt;h4&gt;“Earth is now our only shareholder”&lt;/h4&gt;&lt;p&gt;Il fondatore ha ceduto l&#x27;impresa: le azioni con diritto di voto a un &lt;em&gt;trust&lt;/em&gt; che ne protegge i valori, l&#x27;altro 98% a un&#x27;organizzazione non profit che combatte il cambiamento climatico. I profitti non reinvestiti, circa &lt;b&gt;100 milioni di dollari l&#x27;anno&lt;/b&gt;, vanno all&#x27;ambiente.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;k&quot;&gt;In Italia&lt;/div&gt;&lt;h4&gt;La Società Benefit&lt;/h4&gt;&lt;p&gt;Dal 2016 le imprese italiane possono scrivere nello statuto un &lt;b&gt;beneficio comune&lt;/b&gt; accanto al profitto. Chiesi, gruppo farmaceutico di Parma, ha scelto questa forma e nel 2019 è diventato il più grande gruppo farmaceutico al mondo con certificazione &lt;b&gt;B Corp&lt;/b&gt; &lt;span class=&quot;gl&quot;&gt;(certificazione privata di B Lab sulle performance sociali e ambientali; diversa dalla Società Benefit, che è una forma giuridica)&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;In entrambi i casi la sostenibilità sta &lt;strong&gt;in cima alla mappa&lt;/strong&gt;; il profitto è un mezzo per raggiungerla, non il fine.&lt;/p&gt;

&lt;h4&gt;Balanced: la proposta di Kaplan e McMillan&lt;/h4&gt;

&lt;p&gt;La cima diventa &lt;b&gt;Outcomes&lt;/b&gt;: risultati finanziari, ambientali e sociali insieme. È la colonna &lt;em&gt;balanced&lt;/em&gt; della matrice precedente, come in Novo Nordisk.&lt;/p&gt;

&lt;div class=&quot;selfcheck&quot;&gt;
&lt;h3&gt;Autoverifica · Parte III&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Qual è il criterio che decide se un aspetto è market o non-market?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Il path, cioè la strada con cui raggiunge i risultati: attraverso i mercati (clienti, fornitori, prezzi, costi) o fuori (leggi, opinione pubblica, comunità, ONG). Conta il punto di partenza: una legge che alza i costi resta non-market.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché l&#x27;opzione 1 non basta per le lamentele dei residenti sui camion?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Le quattro perspective vedono solo ciò che arriva tramite i mercati; i residenti agiscono tramite permessi e opinione pubblica, quindi non hanno un posto naturale. Serve una non-market perspective (opzione 2).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Qual è il rischio principale di una scorecard derivata (opzione 3)?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Se usata da sola, o non collegata a un obiettivo della mappa principale, diventa un silo: un mondo separato con obiettivi separati, cioè di nuovo la sostenibilità “on the side”.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quali sono le due scelte di Hansen e Schaltegger (2016)?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;1) Dove va la sostenibilità: integrate, add, derive. 2) Cosa sta in cima alla mappa: business case (profitto), mission first (sostenibilità), balanced (più obiettivi insieme).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Come cambiano le perspective nella proposta di Kaplan e McMillan?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Financial → Outcomes (risultati finanziari, ambientali, sociali); Customer → Stakeholders; Internal processes invariata; Learning and growth → Enablers, con capacità di collaborazione e allineamento.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Patagonia e una Società Benefit come Chiesi: quale colonna della matrice?&lt;/summary&gt;&lt;div class=&quot;ans&quot;&gt;Mission first: la sostenibilità sta in cima, il profitto è un mezzo o un vincolo.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p4&quot; id=&quot;s4&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;IV&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Parte quarta · obiettivi 3 e 4&lt;/div&gt;&lt;h2&gt;Progettare e usare una sustainable scorecard&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

&lt;h3&gt;Progettare in tre passi&lt;/h3&gt;
&lt;div class=&quot;stepper&quot;&gt;
&lt;div class=&quot;steps&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; aria-pressed=&quot;true&quot;&gt;1 · Choose the business unit&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; aria-pressed=&quot;false&quot;&gt;2 · Identify the exposure&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; aria-pressed=&quot;false&quot;&gt;3 · Determine the relevance&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;stepbody&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;p&gt;&lt;b&gt;Scegliere la business unit.&lt;/b&gt; Una scorecard si costruisce per una &lt;dfn&gt;strategic business unit&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(unità con una propria strategia, propri clienti e concorrenti)&lt;/span&gt;. Senza una strategia definita non c&#x27;è nulla da cui derivare le misure.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Identificare l&#x27;esposizione.&lt;/b&gt; Elencare gli aspetti ambientali e sociali che l&#x27;unità &lt;em&gt;influenza&lt;/em&gt; (inside-out) o da cui &lt;em&gt;è influenzata&lt;/em&gt; (outside-in). È l&#x27;inventario di partenza: qui entra in gioco la double materiality della Parte II.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Determinare la rilevanza.&lt;/b&gt; Decidere quali aspetti contano per la strategia e &lt;em&gt;dove&lt;/em&gt; vanno nella scorecard. Due domande guidano la scelta (sotto).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;h3&gt;Passo 3: due domande decidono dove va un aspetto&lt;/h3&gt;
&lt;p&gt;Scegli un aspetto del pastificio e guarda il percorso nell&#x27;albero.&lt;/p&gt;
&lt;div class=&quot;steps&quot; id=&quot;tree-btns&quot;&gt;
&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-p=&quot;e-yes,n-q2,e-mkt,n-o1&quot; data-t=&quot;&lt;b&gt;Prezzo del grano duro.&lt;/b&gt; Rilevante (è la materia prima) e arriva tramite il mercato dei fornitori → una delle quattro perspective.&quot;&gt;Prezzo del grano duro&lt;/button&gt;
&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-p=&quot;e-yes,n-q2,e-mkt,n-o1&quot; data-t=&quot;&lt;b&gt;Packaging riciclabile chiesto dai supermercati.&lt;/b&gt; Rilevante e arriva tramite i clienti → una delle quattro perspective (Processes: Recyclable packs ↑).&quot;&gt;Packaging chiesto dai supermercati&lt;/button&gt;
&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-p=&quot;e-yes,n-q2,e-non,n-o2&quot; data-t=&quot;&lt;b&gt;Residenti che si lamentano dei camion.&lt;/b&gt; Rilevante (licence to operate) ma agisce fuori dai mercati → non-market perspective.&quot;&gt;Residenti e camion&lt;/button&gt;
&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-p=&quot;e-no,n-o3&quot; data-t=&quot;&lt;b&gt;Carta usata negli uffici.&lt;/b&gt; Non rilevante per la strategia → fuori dalla scorecard; la si monitora con la gestione ordinaria. Tieni la scorecard &lt;em&gt;corta&lt;/em&gt;.&quot;&gt;Carta negli uffici&lt;/button&gt;
&lt;/div&gt;

&lt;rect id=&quot;n-q1&quot; x=&quot;10&quot; y=&quot;125&quot; width=&quot;190&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--m-fin)&quot; stroke=&quot;none&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;155&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-size=&quot;13.5&quot; font-weight=&quot;700&quot;&gt;1. Rilevante per&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;173&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-size=&quot;13.5&quot; font-weight=&quot;700&quot;&gt;la nostra strategia?&lt;/text&gt;
