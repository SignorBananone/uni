    &lt;a href=&quot;#consegna&quot;&gt;&lt;rect x=&quot;675&quot; y=&quot;382&quot; width=&quot;175&quot; height=&quot;58&quot; rx=&quot;12&quot; class=&quot;s-slate&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;762&quot; y=&quot;408&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Submission and grading&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;762&quot; y=&quot;426&quot; text-anchor=&quot;middle&quot;&gt;5 blocks, rubric, 8 mistakes&lt;/text&gt;&lt;/a&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;brief&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 1 · &lt;span class=&quot;badge b-slide&quot;&gt;from slides 2–5, 13&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;The group work at a glance&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;Each group analyses &lt;b&gt;one&lt;/b&gt; company case and designs a &lt;span class=&quot;term&quot;&gt;Balanced Scorecard&lt;/span&gt; for it (BSC: a performance measurement system that translates strategy into objectives and indicators across four perspectives): strategy map, objectives, measures, targets and initiatives. In addition, the group searches &lt;b&gt;Scopus&lt;/b&gt; for studies on the BSC in the case&#x27;s industry; the search goes in the slides but is &lt;b&gt;not presented&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid g4&quot;&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;big&quot;&gt;3&lt;/div&gt;students per group (group 7 has two)&lt;/div&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;big&quot;&gt;7&lt;/div&gt;cases, one per group&lt;/div&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;big&quot;&gt;20&#x27;&lt;/div&gt;of presentation: it ends when time is up, finished or not&lt;/div&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;big&quot;&gt;0–3&lt;/div&gt;points added to each member&#x27;s exam grade, the same for everyone&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:34px&quot;&gt;Four dates&lt;/h3&gt;
  &lt;figure&gt;
   &lt;svg viewBox=&quot;0 0 900 170&quot; role=&quot;img&quot; aria-label=&quot;Timeline of the four dates&quot;&gt;
    &lt;line x1=&quot;60&quot; y1=&quot;70&quot; x2=&quot;850&quot; y2=&quot;70&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;4&quot;/&gt;
    &lt;g&gt;&lt;circle cx=&quot;110&quot; cy=&quot;70&quot; r=&quot;13&quot; class=&quot;s-slate&quot; stroke-width=&quot;3&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;110&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot;&gt;10 November&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;110&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;Lecture&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;110&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot;&gt;groups and cases introduced&lt;/text&gt;&lt;/g&gt;
    &lt;g&gt;&lt;circle cx=&quot;340&quot; cy=&quot;70&quot; r=&quot;16&quot; class=&quot;s-acc&quot; stroke-width=&quot;4&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;340&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--acc)&quot; style=&quot;fill:var(--acc)&quot;&gt;29 Nov., 23:59&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;340&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Deadline&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;340&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot;&gt;the .pptx file goes to the lecturers&lt;/text&gt;&lt;/g&gt;
    &lt;g&gt;&lt;circle cx=&quot;570&quot; cy=&quot;70&quot; r=&quot;13&quot; class=&quot;s-slate&quot; stroke-width=&quot;3&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;570&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot;&gt;1 December&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;570&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;Discussion&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;570&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot;&gt;groups 1, 2 and 3&lt;/text&gt;&lt;/g&gt;
    &lt;g&gt;&lt;circle cx=&quot;800&quot; cy=&quot;70&quot; r=&quot;13&quot; class=&quot;s-slate&quot; stroke-width=&quot;3&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;800&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot;&gt;2 December&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;800&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;Discussion&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;800&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot;&gt;groups 4, 5, 6 and 7&lt;/text&gt;&lt;/g&gt;
    &lt;text class=&quot;t-m&quot; x=&quot;455&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot;&gt;All members of every group attend both discussion sessions.&lt;/text&gt;
   &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;h3&gt;The presentation in five blocks&lt;/h3&gt;
  &lt;p class=&quot;muted small&quot;&gt;Step through: this is the order in which to present the work in the 20 minutes.&lt;/p&gt;
  &lt;div class=&quot;steps card&quot; data-steps&gt;
   &lt;div class=&quot;step on&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Block 1&lt;/div&gt;&lt;h4&gt;The company and its strategy&lt;/h4&gt;&lt;p&gt;Mission, vision and strategic choice &lt;b&gt;in your own words&lt;/b&gt;; the &lt;span class=&quot;term&quot;&gt;value proposition&lt;/span&gt; (the value promise to the customer: why they should choose you); the two or three problems that matter most in the numbers.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Explanation: do not copy the case&#x27;s slogan. Show that you have understood &lt;i&gt;which&lt;/i&gt; strategic problem the data reveal: this is the first rubric criterion (&quot;the value proposition and key problems are derived from the facts of the case&quot;).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Block 2&lt;/div&gt;&lt;h4&gt;The strategy map&lt;/h4&gt;&lt;p&gt;Between &lt;b&gt;10 and 16 objectives&lt;/b&gt;, each with at least one cause-and-effect link. The story is told &lt;b&gt;from the bottom up&lt;/b&gt;: from learning and growth to the top.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Block 3&lt;/div&gt;&lt;h4&gt;The scorecard&lt;/h4&gt;&lt;p&gt;A table with one row per objective: measure, calculation, lag or lead, current value, target, initiative, owner (the person accountable).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Block 4&lt;/div&gt;&lt;h4&gt;Implementation&lt;/h4&gt;&lt;p&gt;Who is involved, &lt;span class=&quot;term&quot;&gt;cascading&lt;/span&gt; (translating the corporate scorecard into unit scorecards aligned with the higher-level one) to at least one unit, reporting frequency, main risk of the design.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Block 5&lt;/div&gt;&lt;h4&gt;The case questions&lt;/h4&gt;&lt;p&gt;Short answers to the four questions at the end of your case (you will find them in the section &lt;a href=&quot;#casi&quot;&gt;The seven cases&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:30px&quot;&gt;What the work must show&lt;/h3&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Four perspectives&lt;/h4&gt;Learning and growth, internal processes, customer, financial, and the logic that links them.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Value proposition&lt;/h4&gt;Operational excellence, customer intimacy or product leadership: which one, and why.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Strategy map&lt;/h4&gt;Every arrow is a testable cause-and-effect hypothesis.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Lag and lead&lt;/h4&gt;Outcome measures and the &lt;i&gt;drivers&lt;/i&gt; that anticipate them.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Targets and initiatives&lt;/h4&gt;Numbers with a date, and actions with an owner.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Sustainability&lt;/h4&gt;Where relevant: aspects with double materiality, placed according to their pathway (integration, non-market perspective or derived scorecard), and what sits at the top.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Does the group have to present the Scopus search in class?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;No. The search goes in the file (two slides + PRISMA, after the presentation) and is assessed, but it takes none of the 20 minutes.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Group 2 presents on 1 December: do they also have to attend on the 2nd?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Yes: all members of every group attend both discussion sessions.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;In which block does cascading belong?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;In block 4, Implementation: at least one unit (for example a Nove Lune hotel or an LPI warehouse) with its own scorecard derived from the corporate one.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;bsc&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 2 · &lt;span class=&quot;badge b-add&quot;&gt;explanation&lt;/span&gt; &lt;span class=&quot;badge b-slide&quot;&gt;slide 4&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;The fundamentals the brief takes for granted&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;The brief lists what the work must show, but does not re-explain the concepts: you covered them in the earlier lectures on the Balanced Scorecard. They are briefly reviewed here, because the rubric assesses all of them.&lt;/p&gt;
  &lt;p class=&quot;note small&quot;&gt;Note on the course material: in this session it was not possible to list the files in the &lt;i&gt;corso/&lt;/i&gt; folder, so the references to other lectures below are inferred from cross-references in the slides (for example &quot;the three options&quot;, &quot;quality cost categories&quot;, &quot;ROI and residual income&quot;) and are not attributed to a specific file. Check them against the corresponding lectures.&lt;/p&gt;

  &lt;h3&gt;The four perspectives&lt;/h3&gt;
  &lt;p&gt;The BSC (Kaplan and Norton, 1992) complements financial measures with three further perspectives. The key idea: financial figures tell you &lt;i&gt;what has happened&lt;/i&gt;; the other perspectives measure what will make it happen.&lt;/p&gt;
  &lt;figure&gt;
   &lt;svg viewBox=&quot;0 0 900 300&quot; role=&quot;img&quot; aria-label=&quot;The four perspectives stacked from the bottom up&quot;&gt;
    &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
    &lt;rect x=&quot;40&quot; y=&quot;10&quot; width=&quot;560&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s-brick&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;60&quot; y=&quot;38&quot;&gt;Financial&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;60&quot; y=&quot;56&quot;&gt;How shareholders see us (or: how we use resources for the mission)&lt;/text&gt;
    &lt;rect x=&quot;40&quot; y=&quot;80&quot; width=&quot;560&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s-ochre&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;60&quot; y=&quot;108&quot;&gt;Customer&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;60&quot; y=&quot;126&quot;&gt;How customers see us: the value proposition delivered&lt;/text&gt;
    &lt;rect x=&quot;40&quot; y=&quot;150&quot; width=&quot;560&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s-slate&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;60&quot; y=&quot;178&quot;&gt;Internal processes&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;60&quot; y=&quot;196&quot;&gt;Which processes we must excel at to keep the promise&lt;/text&gt;
    &lt;rect x=&quot;40&quot; y=&quot;220&quot; width=&quot;560&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s-sage&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;60&quot; y=&quot;248&quot;&gt;Learning and growth&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;60&quot; y=&quot;266&quot;&gt;People, information systems and culture that enable the processes&lt;/text&gt;
    &lt;path class=&quot;ln-acc&quot; d=&quot;M640 270 L640 20&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
    &lt;text class=&quot;t&quot; x=&quot;660&quot; y=&quot;150&quot; font-weight=&quot;600&quot;&gt;the story reads&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;660&quot; y=&quot;168&quot; font-weight=&quot;600&quot;&gt;from the bottom up&lt;/text&gt;
    &lt;text class=&quot;t-m&quot; x=&quot;660&quot; y=&quot;196&quot;&gt;each level is a cause&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;660&quot; y=&quot;212&quot;&gt;of the level above&lt;/text&gt;
    &lt;text class=&quot;t-m&quot; x=&quot;660&quot; y=&quot;40&quot;&gt;lag: outcomes&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;660&quot; y=&quot;262&quot;&gt;lead: drivers&lt;/text&gt;
   &lt;/svg&gt;
   &lt;figcaption&gt;In the group work the map should be told exactly like this: &quot;we start from learning and growth and work our way up to the top&quot; (slide 6).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;The value proposition: three disciplines&lt;/h3&gt;
  &lt;p&gt;The brief asks you to choose &lt;b&gt;one&lt;/b&gt; of Treacy and Wiersema&#x27;s three &lt;span class=&quot;term&quot;&gt;value disciplines&lt;/span&gt; and to explain why. The idea is that a firm excels in one and maintains &quot;industry parity&quot; in the other two. The choice determines which internal processes become critical.&lt;/p&gt;
  &lt;div data-tabs class=&quot;p-ochre&quot;&gt;
   &lt;div class=&quot;tabbar&quot;&gt;&lt;button&gt;Operational excellence&lt;/button&gt;&lt;button&gt;Customer intimacy&lt;/button&gt;&lt;button&gt;Product leadership&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;&lt;h4&gt;Operational excellence &lt;small class=&quot;muted&quot;&gt;lowest total cost&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Promise:&lt;/b&gt; the lowest price or total cost, with reliability and no hassle.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Critical processes:&lt;/b&gt; operations management, logistics, quality, standardisation. &lt;b&gt;Typical measures:&lt;/b&gt; cost per unit, errors, on-time delivery, productivity.&lt;/p&gt;&lt;p&gt;&lt;b&gt;In the cases:&lt;/b&gt; LPI states it openly (&quot;the most reliable and the cheapest&quot;).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;&lt;h4&gt;Customer intimacy &lt;small class=&quot;muted&quot;&gt;closeness to the customer&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Promise:&lt;/b&gt; a tailored solution and a lasting relationship; the firm earns on customer lifetime value, not on the single sale.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Critical processes:&lt;/b&gt; relationship management, customer knowledge, service. &lt;b&gt;Typical measures:&lt;/b&gt; retention, share of revenue from existing customers, satisfaction, response times.&lt;/p&gt;&lt;p&gt;&lt;b&gt;In the cases (an interpretation to be argued):&lt;/b&gt; Nove Lune (&quot;every guest is known by name&quot;), Contabilis (&quot;the accountant&#x27;s best colleague&quot;), Torrenti moving to selling a network &quot;that never stops&quot;.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;&lt;h4&gt;Product leadership &lt;small class=&quot;muted&quot;&gt;best product&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Promise:&lt;/b&gt; the best and newest product; customers pay a premium for novelty.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Critical processes:&lt;/b&gt; innovation, product development, time-to-market. &lt;b&gt;Typical measures:&lt;/b&gt; revenue from new products, concept-to-launch time, on-time launches.&lt;/p&gt;&lt;p&gt;&lt;b&gt;In the cases:&lt;/b&gt; Ardesia wants to be &quot;the first brand&quot; to bring each new technology to market.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:30px&quot;&gt;Lag and lead indicators&lt;/h3&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Lag indicator&lt;/b&gt; (outcome indicator, &quot;lagging&quot;): measures a result that has already occurred. Examples: ROI, revenue, repeat-purchase rate. It tells you whether the strategy &lt;i&gt;has&lt;/i&gt; worked.&lt;/div&gt;
   &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Lead indicator&lt;/b&gt; (leading indicator, &lt;i&gt;driver&lt;/i&gt;): measures what produces the outcome, and moves first. Examples: training hours, first-response time. It tells you whether the strategy &lt;i&gt;is about to&lt;/i&gt; work.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;The same measure can be a lag with respect to the objective below it and a lead with respect to the one above: it depends on its position in the causal chain. The brief requires &lt;b&gt;at least one lead per perspective&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;card game&quot; id=&quot;game&quot;&gt;
   &lt;h4&gt;Game: lag or lead?&lt;/h4&gt;
   &lt;p class=&quot;small muted&quot;&gt;Measures taken from the cases. Choose, then read the reasoning.&lt;/p&gt;
   &lt;ul&gt;&lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Why can&#x27;t you choose all three value disciplines?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Because they require different processes, people and measures, often in tension with each other (cutting cost per order versus customising the service). A firm excels in one and stays &quot;at parity&quot; in the others; the choice shapes the internal process perspective.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What is the problem with a scorecard containing only lag measures?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;It tells you what has happened, not what will happen: management notices when it is too late. It is one of the eight common mistakes (slide 15).&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;In what order is the map presented, and why?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;From the bottom (learning and growth) up, because the arrows run from causes to effects: people and systems → processes → customers → financial results (or mission).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;map&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 3 · &lt;span class=&quot;badge b-slide&quot;&gt;slides 4–6&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;The strategy map&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;The &lt;span class=&quot;term&quot;&gt;strategy map&lt;/span&gt; is the diagram of strategic objectives across the four perspectives, connected by arrows. Every arrow is a &lt;b&gt;cause-and-effect hypothesis&lt;/b&gt; (&quot;if we improve X, then Y improves&quot;) that can be tested with data.&lt;/p&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Size&lt;/h4&gt;Between &lt;b&gt;10 and 16&lt;/b&gt; objectives across the perspectives. Objectives &lt;b&gt;specific to the company&lt;/b&gt;, not generic.&lt;/div&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Links&lt;/h4&gt;Every objective has &lt;b&gt;at least one&lt;/b&gt; cause-and-effect link with another. The story runs from learning and growth to the top.&lt;/div&gt;
   &lt;div class=&quot;card&quot; style=&quot;background:var(--acc-bg);border:0&quot;&gt;&lt;h4 style=&quot;color:var(--acc)&quot;&gt;Special cases&lt;/h4&gt;&lt;b&gt;What sits at the top:&lt;/b&gt; business case, mission first or balanced (TVO and Valfonda: what replaces profit?). &lt;b&gt;Sustainability:&lt;/b&gt; is the aspect material? Does it reach the company through markets? Then choose one of the three options, and say why.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:30px&quot;&gt;Interactive example &lt;span class=&quot;badge b-add&quot;&gt;invented example&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;A small chain of bookshops that competes on customer intimacy (not one of the seven cases). &lt;b&gt;Tap an objective&lt;/b&gt;: its causes and effects light up, and the hypothesis with its measure appears below.&lt;/p&gt;
  &lt;figure class=&quot;sm&quot; id=&quot;sm&quot;&gt;&lt;svg viewBox=&quot;0 0 900 440&quot; role=&quot;img&quot; aria-label=&quot;Example strategy map&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
  &lt;div class=&quot;card&quot; id=&quot;sm-info&quot; aria-live=&quot;polite&quot;&gt;&lt;span class=&quot;muted&quot;&gt;No objective selected.&lt;/span&gt;&lt;/div&gt;

  &lt;h3 style=&quot;margin-top:30px&quot;&gt;What sits at the top of the map&lt;/h3&gt;
  &lt;p&gt;In for-profit firms the top of the map is financial. But two cases (TVO, a non-profit public company, and Valfonda, a cooperative that does not maximise profit) force you to ask what replaces profit. The slides name three architectures:&lt;/p&gt;
  &lt;figure&gt;
   &lt;svg viewBox=&quot;0 0 900 210&quot; role=&quot;img&quot; aria-label=&quot;Three architectures for the top of the map&quot;&gt;
    &lt;g transform=&quot;translate(20,10)&quot;&gt;&lt;text class=&quot;t-h&quot; x=&quot;125&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;Business case&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;s-brick&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;125&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot;&gt;Financial&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;74&quot; width=&quot;170&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-ochre&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;93&quot; text-anchor=&quot;middle&quot;&gt;Customer&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;110&quot; width=&quot;170&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-slate&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot;&gt;Processes&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;146&quot; width=&quot;170&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-sage&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot;&gt;Learning&lt;/text&gt;
     &lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot;&gt;everything (sustainability too) serves profit&lt;/text&gt;&lt;/g&gt;
    &lt;g transform=&quot;translate(320,10)&quot;&gt;&lt;text class=&quot;t-h&quot; x=&quot;125&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;Mission first&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;s-acc&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;125&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot;&gt;Mission&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;74&quot; width=&quot;80&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-ochre&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;80&quot; y=&quot;93&quot; text-anchor=&quot;middle&quot;&gt;Customer&lt;/text&gt;
     &lt;rect x=&quot;130&quot; y=&quot;74&quot; width=&quot;80&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-brick&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;170&quot; y=&quot;93&quot; text-anchor=&quot;middle&quot;&gt;Financial&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;110&quot; width=&quot;170&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-slate&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot;&gt;Processes&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;146&quot; width=&quot;170&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-sage&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot;&gt;Learning&lt;/text&gt;
     &lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot;&gt;money is a means or a constraint&lt;/text&gt;&lt;/g&gt;
    &lt;g transform=&quot;translate(620,10)&quot;&gt;&lt;text class=&quot;t-h&quot; x=&quot;125&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;Balanced&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;30&quot; width=&quot;80&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;s-acc&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;80&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot;&gt;Mission&lt;/text&gt;
     &lt;rect x=&quot;130&quot; y=&quot;30&quot; width=&quot;80&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;s-brick&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;170&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot;&gt;Financial&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;74&quot; width=&quot;170&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-ochre&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;93&quot; text-anchor=&quot;middle&quot;&gt;Customer&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;110&quot; width=&quot;170&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-slate&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot;&gt;Processes&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;146&quot; width=&quot;170&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-sage&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot;&gt;Learning&lt;/text&gt;
     &lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot;&gt;two tops of equal rank&lt;/text&gt;&lt;/g&gt;
   &lt;/svg&gt;
   &lt;figcaption&gt;Explanation: under &lt;i&gt;mission first&lt;/i&gt; the financial perspective does not disappear; it moves down next to the customer perspective as a condition of financial sustainability (for TVO: cost per km, penalties; for Valfonda: the milk price paid to members). This is Kaplan&#x27;s (2001) approach for non-profit organisations; see &lt;a href=&quot;#approfondire&quot;&gt;Further reading&lt;/a&gt;.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Is &quot;improve quality&quot; a good objective for the map?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;No: it is generic and could belong to any company. It needs to be made specific: for Ardesia, &quot;reliable batteries in the first year&quot; (measure: battery failures per 1,000 bikes ↓).&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;How do you &quot;test&quot; an arrow?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;You check whether, over time, movements in the cause measure precede those in the effect measure (for example: when technician turnover rises, do contract renewals fall the following year?). If the relationship does not hold, the strategic hypothesis must be revised.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;TVO: where does the financial perspective go?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;With a mission-first top (accessible, reliable, sustainable mobility), the financial perspective moves down as a constraint/means: a competitive cost per vehicle km for the tender, lower penalties, funding for electric buses. This is question 1 of the case: it must be argued.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;sost&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 4 · &lt;span class=&quot;badge b-slide&quot;&gt;slides 4, 6, case questions&lt;/span&gt; &lt;span class=&quot;badge b-add&quot;&gt;explanation&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Sustainability in the scorecard&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;The brief asks you to address sustainability &quot;where relevant&quot; in three steps: select the aspects with &lt;span class=&quot;term&quot;&gt;double materiality&lt;/span&gt;, place them according to their &lt;span class=&quot;term&quot;&gt;path&lt;/span&gt;, and state what sits at the top. The mistake to avoid is &quot;sustainability on the side&quot;: measures that are listed but not linked to the strategy, &quot;a symbol, not a tool&quot;.&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div&gt;
    &lt;h3&gt;Double materiality&lt;/h3&gt;
    &lt;p&gt;An aspect is material if it is material in at least one of two directions:&lt;/p&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Impact materiality&lt;/b&gt; (inside-out): the company&#x27;s impact on people and the environment. E.g. the emissions of Valfonda&#x27;s dairies, workplace injuries at LPI.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Financial materiality&lt;/b&gt; (outside-in): the effect of the issue on the company&#x27;s performance, cash flows and access to capital. E.g. the German retailers that will drop suppliers without emission reductions.&lt;/div&gt;
    &lt;p class=&quot;small muted&quot;&gt;The concept is the one used in the European ESRS standards (external source, see &lt;a href=&quot;#approfondire&quot;&gt;Further reading&lt;/a&gt;).&lt;/p&gt;
   &lt;/div&gt;
   &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 420 260&quot; role=&quot;img&quot; aria-label=&quot;The two directions of double materiality&quot;&gt;
     &lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;/marker&gt;&lt;marker id=&quot;ar4&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
     &lt;circle cx=&quot;110&quot; cy=&quot;130&quot; r=&quot;75&quot; class=&quot;s-slate&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;110&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot;&gt;Company&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;110&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot;&gt;value, risks&lt;/text&gt;
     &lt;circle cx=&quot;320&quot; cy=&quot;130&quot; r=&quot;75&quot; class=&quot;s-sage&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;320&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot;&gt;People and&lt;/text&gt;&lt;text class=&quot;t-h&quot; x=&quot;320&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot;&gt;environment&lt;/text&gt;
     &lt;path d=&quot;M170 95 Q215 60 258 95&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;215&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot;&gt;impact&lt;/text&gt;
     &lt;path d=&quot;M258 165 Q215 200 170 165&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar4)&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;215&quot; y=&quot;222&quot; text-anchor=&quot;middle&quot;&gt;financial&lt;/text&gt;
    &lt;/svg&gt;
   &lt;/figure&gt;
  &lt;/div&gt;

  &lt;h3&gt;The three options: where to place an aspect&lt;/h3&gt;
  &lt;p&gt;The &quot;three options&quot; referred to in the slides are those of the &lt;span class=&quot;term&quot;&gt;Sustainability Balanced Scorecard&lt;/span&gt; (Figge, Hahn, Schaltegger and Wagner, 2002). The decisive question is the path: does the aspect reach the company &lt;b&gt;through markets&lt;/b&gt; (customers, prices, suppliers, costs) or &lt;b&gt;outside markets&lt;/b&gt; (regulation, communities, public opinion, trade unions)?&lt;/p&gt;
  &lt;div class=&quot;card steps&quot; data-steps id=&quot;flow&quot;&gt;
   &lt;div class=&quot;step on&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Question 1&lt;/div&gt;&lt;h4&gt;Is the aspect material (double materiality)?&lt;/h4&gt;&lt;p&gt;If not, it stays out of the scorecard and is managed with other tools (compliance, sustainability reporting). If so, go to question 2.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Question 2&lt;/div&gt;&lt;h4&gt;Does it reach the company through markets?&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Yes →&lt;/b&gt; &lt;b&gt;Integration&lt;/b&gt;: the aspect becomes an objective within the four existing perspectives. E.g. at Valfonda, emissions per kg are a requirement of the retailers, i.e. of the &lt;i&gt;customers&lt;/i&gt;: they are integrated into the customer perspective and into processes.&lt;/p&gt;&lt;p&gt;&lt;b&gt;No →&lt;/b&gt; &lt;b&gt;Non-market perspective&lt;/b&gt;: a fifth perspective is added for aspects that operate outside the market. E.g. Ardesia&#x27;s responsibility for collecting used batteries stems from an EU regulation.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Option 3&lt;/div&gt;&lt;h4&gt;Derived scorecard&lt;/h4&gt;&lt;p&gt;An environmental or social scorecard &lt;b&gt;derived&lt;/b&gt; from the main one, to coordinate and manage in detail the aspects already identified (for example for the quality and sustainability function). It does not replace the first two options: it follows from them.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Finally&lt;/div&gt;&lt;h4&gt;What sits at the top?&lt;/h4&gt;&lt;p&gt;Business case, mission first or balanced. Once the aspects have been placed, state whether sustainability serves profit or sits alongside (or above) financial performance.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:28px&quot;&gt;Per-unit target or total target? &lt;span class=&quot;badge b-slide&quot;&gt;TVO q.4, Valfonda q.3&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;An &lt;b&gt;intensity&lt;/b&gt; target (emissions per kg or per vehicle km) measures &lt;i&gt;efficiency&lt;/i&gt;; an &lt;b&gt;absolute&lt;/b&gt; target (total tonnes) measures &lt;i&gt;actual reduction&lt;/i&gt;. If volume changes, the two tell different stories. Move the sliders:&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;intens&quot;&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;iv&quot;&gt;Output volume (index, base year = 100)&lt;/label&gt;&lt;input id=&quot;iv&quot; type=&quot;range&quot; min=&quot;60&quot; max=&quot;140&quot; value=&quot;100&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;ii&quot;&gt;Change in intensity (per unit)&lt;/label&gt;&lt;input id=&quot;ii&quot; type=&quot;range&quot; min=&quot;-40&quot; max=&quot;10&quot; value=&quot;-30&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;p style=&quot;margin:10px 0 0&quot; aria-live=&quot;polite&quot; id=&quot;intens-out&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Injuries and agency work at LPI: just an &quot;S&quot; issue in ESG?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;It is strategic too: poorly trained agency workers make errors during the peak (the four customers lost &quot;after Black Friday&quot;), penalties rise, and the insurer has raised the premium by 30%. The aspect passes through markets (customers, costs), so it lends itself to integration into processes and learning and growth.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What does &quot;sustainability on the side&quot; mean?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Sustainability measures added at the end, with no arrows towards the strategy: a symbol, not a tool (slide 15).&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;When is a non-market perspective needed?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;When the aspect is material but does not pass through customers, prices or costs: it operates through laws, public bodies, communities, the media. In that case it does not fit well into any of the four market perspectives.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-ochre&quot; id=&quot;score&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 5 · &lt;span class=&quot;badge b-slide&quot;&gt;slides 5, 7, 15&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;The scorecard table&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;One row for each objective on the map, with eight mandatory columns. Here is the example row from the slide (not related to the cases):&lt;/p&gt;
  &lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
   &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Objective&lt;/th&gt;&lt;th&gt;Measure&lt;/th&gt;&lt;th&gt;How it is calculated&lt;/th&gt;&lt;th&gt;Lag / lead&lt;/th&gt;&lt;th&gt;Current value&lt;/th&gt;&lt;th&gt;Target&lt;/th&gt;&lt;th&gt;Initiative&lt;/th&gt;&lt;th&gt;Owner&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
   &lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Keep our loyal customers&lt;/td&gt;&lt;td&gt;Repeat customer rate ↑&lt;/td&gt;&lt;td&gt;Customers with 2+ purchases in the year ÷ all customers; loyalty card data&lt;/td&gt;&lt;td&gt;Lag&lt;/td&gt;&lt;td&gt;35%&lt;/td&gt;&lt;td&gt;45% by 2028&lt;/td&gt;&lt;td&gt;Loyalty programme for regular customers&lt;/td&gt;&lt;td&gt;Marketing manager&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Tap a column to see its role:&lt;/p&gt;
  &lt;div data-tabs&gt;
   &lt;div class=&quot;tabbar&quot;&gt;&lt;button&gt;Objective&lt;/button&gt;&lt;button&gt;Measure&lt;/button&gt;&lt;button&gt;Calculation&lt;/button&gt;&lt;button&gt;Lag/lead&lt;/button&gt;&lt;button&gt;Current value&lt;/button&gt;&lt;button&gt;Target&lt;/button&gt;&lt;button&gt;Initiative&lt;/button&gt;&lt;button&gt;Owner&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;What we want to achieve, phrased with a verb and specific to the company. It must match a box on the strategy map.&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;How we will know whether we are succeeding. &lt;b&gt;One&lt;/b&gt; per objective, &lt;b&gt;two at most&lt;/b&gt;, each with the desired direction &lt;b&gt;↑ or ↓&lt;/b&gt;: &quot;a number without ↑ or ↓ is information, not an objective&quot;.&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;Formula and data source (numerator ÷ denominator; where it comes from). It makes the measure precise and replicable, one of the rubric criteria.&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;Whether it measures an outcome or a driver. &lt;b&gt;Every perspective&lt;/b&gt; must have at least one lead indicator.&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;The value from the case, or &lt;b&gt;&quot;not measured yet&quot;&lt;/b&gt; if the company does not measure it (in many cases this is precisely the problem: at Torrenti nobody measures how long a sensor stays offline). Every assumed number goes in the &lt;b&gt;Assumptions&lt;/b&gt; slide.&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;A &lt;b&gt;number&lt;/b&gt; and a &lt;b&gt;time horizon&lt;/b&gt; (&quot;45% by 2028&quot;). Realistic: the rubric rewards targets that are &quot;realistic and dated&quot;.&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;The concrete action that moves the measure. It must not repeat the measure: &quot;increase retention&quot; is &lt;b&gt;not&lt;/b&gt; an initiative; &quot;loyalty programme&quot; is.&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;A responsible person/function (from the roles in the case: CEO, head of service, HR manager…). Without an owner, nobody is accountable for the target.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:30px&quot;&gt;Eight common mistakes &lt;small class=&quot;muted&quot;&gt;· tap a card for the remedy&lt;/small&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid g4&quot; id=&quot;flips&quot;&gt;
   &lt;div class=&quot;card flip p-brick&quot;&gt;&lt;div class=&quot;front&quot;&gt;&lt;h4&gt;Too many measures&lt;/h4&gt;40 indicators are a list, not a strategy.&lt;/div&gt;&lt;div class=&quot;back&quot;&gt;&lt;h4&gt;Remedy&lt;/h4&gt;10–16 objectives, 1 measure each (max 2). The others stay in operational reports.&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;card flip&quot;&gt;&lt;div class=&quot;front&quot;&gt;&lt;h4&gt;Generic objectives&lt;/h4&gt;&quot;Improve quality&quot; could belong to anyone.&lt;/div&gt;&lt;div class=&quot;back&quot;&gt;&lt;h4&gt;Remedy&lt;/h4&gt;Use the facts of the case: &quot;respond within 4 hours, even in tax-deadline weeks&quot;.&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;card flip&quot;&gt;&lt;div class=&quot;front&quot;&gt;&lt;h4&gt;Boxes without arrows&lt;/h4&gt;Or arrows nobody can explain.&lt;/div&gt;&lt;div class=&quot;back&quot;&gt;&lt;h4&gt;Remedy&lt;/h4&gt;For every arrow, be able to say &quot;if… then…&quot; and how you would test it.&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;card flip&quot;&gt;&lt;div class=&quot;front&quot;&gt;&lt;h4&gt;Only lag indicators&lt;/h4&gt;They tell you what happened, not what will happen.&lt;/div&gt;&lt;div class=&quot;back&quot;&gt;&lt;h4&gt;Remedy&lt;/h4&gt;At least one lead per perspective: training, turnover, lead times, vacancies.&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;card flip&quot;&gt;&lt;div class=&quot;front&quot;&gt;&lt;h4&gt;Targets without a date&lt;/h4&gt;A target needs a number and a horizon.&lt;/div&gt;&lt;div class=&quot;back&quot;&gt;&lt;h4&gt;Remedy&lt;/h4&gt;&quot;Technician turnover ≤ 10% by December 2027&quot;, not &quot;reduce turnover&quot;.&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;card flip&quot;&gt;&lt;div class=&quot;front&quot;&gt;&lt;h4&gt;Initiatives that repeat the measure&lt;/h4&gt;&quot;Increase customer retention&quot; is not an initiative.&lt;/div&gt;&lt;div class=&quot;back&quot;&gt;&lt;h4&gt;Remedy&lt;/h4&gt;A project with an owner and a budget: &quot;analysis of cancellation reasons, with an interview of every customer who leaves&quot;.&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;card flip&quot;&gt;&lt;div class=&quot;front&quot;&gt;&lt;h4&gt;Measures without a direction&lt;/h4&gt;Without ↑ or ↓ it is information, not an objective.&lt;/div&gt;&lt;div class=&quot;back&quot;&gt;&lt;h4&gt;Remedy&lt;/h4&gt;Put the arrow next to every measure.&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;card flip&quot;&gt;&lt;div class=&quot;front&quot;&gt;&lt;h4&gt;Sustainability on the side&lt;/h4&gt;Measures listed but not linked to the strategy.&lt;/div&gt;&lt;div class=&quot;back&quot;&gt;&lt;h4&gt;Remedy&lt;/h4&gt;Place the aspect using one of the three options and connect it with arrows.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:30px&quot;&gt;Implementation &lt;span class=&quot;badge b-add&quot;&gt;explanation&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid g4&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Who is involved&lt;/h4&gt;Who designs it, who feeds in the data, who discusses the results (board, directors, units).&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cascading&lt;/h4&gt;At least one unit with its own scorecard: objectives aligned with the corporate ones, measures the unit actually controls.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Reporting&lt;/h4&gt;Frequency suited to the measure: leads are reviewed often (weekly, monthly), lags less often.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Main risk&lt;/h4&gt;E.g. incentives pushing in the opposite direction (Torrenti&#x27;s bonus on orders), data that do not exist, resistance to change.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;What do I write as current value if the case does not provide it?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&quot;Not measured yet&quot;. If you estimate a number instead, it goes in the &lt;b&gt;Assumptions&lt;/b&gt; slide.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Is &quot;reduce shipping errors&quot; an initiative?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;No, it repeats the measure. An initiative would be, for example, &quot;4-day training and on-the-job shadowing for peak-season agency workers&quot;.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What is the maximum number of measures per objective?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Two; one is better. Each with ↑ or ↓.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;lit&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 6 · &lt;span class=&quot;badge b-slide&quot;&gt;slides 8–11&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Scopus search and PRISMA diagram&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;Search &lt;b&gt;Scopus&lt;/b&gt; (Elsevier&#x27;s abstract and citation database) for studies on how the BSC is applied in &lt;b&gt;your case&#x27;s industry&lt;/b&gt;. You read only &lt;b&gt;titles and abstracts&lt;/b&gt;: no full-text reading, no discussion of the content.&lt;/p&gt;

  &lt;h3&gt;Build the search string&lt;/h3&gt;
  &lt;p class=&quot;small muted&quot;&gt;The industry keywords are those suggested in the slides (&quot;starting points only: choose and justify yours&quot;). The syntax for the combined title-abstract-keyword field is the one documented by Elsevier &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;qb&quot;&gt;
   &lt;div class=&quot;chips&quot; id=&quot;qb-case&quot;&gt;&lt;/div&gt;
   &lt;div class=&quot;chips&quot; id=&quot;qb-kw&quot;&gt;&lt;/div&gt;
   &lt;div class=&quot;chips&quot; id=&quot;qb-opt&quot;&gt;&lt;button class=&quot;btn on&quot; data-o=&quot;year&quot;&gt;2000–2026&lt;/button&gt;&lt;button class=&quot;btn on&quot; data-o=&quot;type&quot;&gt;Articles + reviews&lt;/button&gt;&lt;button class=&quot;btn on&quot; data-o=&quot;lang&quot;&gt;English only&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;code&quot; id=&quot;qb-out&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid g2&quot; style=&quot;margin-top:22px&quot;&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Slide 1&lt;/div&gt;&lt;h4&gt;The method&lt;/h4&gt;&lt;ol&gt;&lt;li&gt;&lt;b&gt;Keywords&lt;/b&gt; and how you combined them (e.g. &quot;balanced scorecard&quot; AND (hotel OR hospitality), searched in title, abstract, keywords).&lt;/li&gt;&lt;li&gt;&lt;b&gt;Time span&lt;/b&gt; (e.g. 2000–2026).&lt;/li&gt;&lt;li&gt;&lt;b&gt;Source types&lt;/b&gt;: articles, reviews, conference papers, professional reports.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Language&lt;/b&gt; (e.g. English only).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot; style=&quot;background:var(--acc-bg);border:0&quot;&gt;&lt;div class=&quot;kicker&quot; style=&quot;color:var(--acc)&quot;&gt;Slide 2&lt;/div&gt;&lt;h4&gt;The results&lt;/h4&gt;&lt;ol&gt;&lt;li&gt;&lt;b&gt;Total results&lt;/b&gt; with string and filters.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Potentially relevant sources&lt;/b&gt; and those excluded as not pertinent, with the reason.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Valid sources&lt;/b&gt;: the number only, without comment; the full list goes at the end.&lt;/li&gt;&lt;li&gt;&lt;b&gt;PRISMA diagram&lt;/b&gt; up to the records eligible for full text screening.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:30px&quot;&gt;The PRISMA diagram, up to full text screening&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;PRISMA&lt;/span&gt; (Preferred Reporting Items for Systematic reviews and Meta-Analyses) is a standard for documenting literature reviews; its &lt;i&gt;flow diagram&lt;/i&gt; shows how many records enter and leave at each stage. Here you stop before full-text reading: the records &lt;b&gt;eligible for full text screening&lt;/b&gt; are your valid sources. Try it with made-up numbers: the figures must add up.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;pr&quot;&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;pr1&quot;&gt;Records identified in Scopus&lt;/label&gt;&lt;input id=&quot;pr1&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;300&quot; value=&quot;120&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;pr2&quot;&gt;Removed before screening&lt;/label&gt;&lt;input id=&quot;pr2&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;25&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;pr3&quot;&gt;Excluded on title/abstract&lt;/label&gt;&lt;input id=&quot;pr3&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;60&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;figure style=&quot;margin:10px 0 0&quot;&gt;&lt;svg viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;PRISMA diagram&quot;&gt;
    &lt;defs&gt;&lt;marker id=&quot;ar5&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
    &lt;rect x=&quot;0&quot; y=&quot;10&quot; width=&quot;32&quot; height=&quot;120&quot; rx=&quot;6&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;16&quot; y=&quot;70&quot; fill=&quot;var(--paper)&quot; font-size=&quot;12&quot; font-family=&quot;var(--sans)&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 16 70)&quot;&gt;Identification&lt;/text&gt;
    &lt;rect x=&quot;0&quot; y=&quot;140&quot; width=&quot;32&quot; height=&quot;150&quot; rx=&quot;6&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;16&quot; y=&quot;215&quot; fill=&quot;var(--paper)&quot; font-size=&quot;12&quot; font-family=&quot;var(--sans)&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 16 215)&quot;&gt;Screening&lt;/text&gt;
    &lt;rect x=&quot;50&quot; y=&quot;20&quot; width=&quot;380&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s-slate&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;240&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Records identified in Scopus&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;240&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; id=&quot;pa&quot;&gt;n =&lt;/text&gt;
    &lt;rect x=&quot;490&quot; y=&quot;10&quot; width=&quot;360&quot; height=&quot;80&quot; rx=&quot;10&quot; class=&quot;s-card&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;670&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Records removed before screening&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;670&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot;&gt;outside time span, wrong type or language, duplicates&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;670&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; id=&quot;pb&quot;&gt;n =&lt;/text&gt;
    &lt;rect x=&quot;50&quot; y=&quot;150&quot; width=&quot;380&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s-slate&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;240&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Records screened on title and abstract&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;240&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot; id=&quot;pc&quot;&gt;n =&lt;/text&gt;
    &lt;rect x=&quot;490&quot; y=&quot;150&quot; width=&quot;360&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s-card&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;670&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Records excluded, with reasons&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;670&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot; id=&quot;pd&quot;&gt;n =&lt;/text&gt;
    &lt;rect x=&quot;50&quot; y=&quot;230&quot; width=&quot;380&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;255&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-family=&quot;var(--sans)&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Records eligible for full text screening&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;276&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-family=&quot;var(--sans)&quot; font-size=&quot;13&quot; id=&quot;pe&quot;&gt;n =&lt;/text&gt;
    &lt;path class=&quot;ln-acc&quot; d=&quot;M240 80 L240 146&quot; marker-end=&quot;url(#ar5)&quot;/&gt;&lt;path class=&quot;ln-acc&quot; d=&quot;M430 50 L486 50&quot; marker-end=&quot;url(#ar5)&quot;/&gt;
    &lt;path class=&quot;ln-acc&quot; d=&quot;M240 210 L240 226&quot; marker-end=&quot;url(#ar5)&quot;/&gt;&lt;path class=&quot;ln-acc&quot; d=&quot;M430 180 L486 180&quot; marker-end=&quot;url(#ar5)&quot;/&gt;
    &lt;text class=&quot;t-m&quot; x=&quot;490&quot; y=&quot;265&quot;&gt;Stop here: full-text reading is not required.&lt;/text&gt;
   &lt;/svg&gt;&lt;/figure&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:30px&quot;&gt;In the slides, not in the 20 minutes&lt;/h3&gt;
  &lt;figure&gt;
   &lt;svg viewBox=&quot;0 0 900 120&quot; role=&quot;img&quot; aria-label=&quot;Structure of the file to submit&quot;&gt;
    &lt;rect x=&quot;0&quot; y=&quot;30&quot; width=&quot;400&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;Presentation&lt;/text&gt;&lt;text x=&quot;200&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-family=&quot;var(--sans)&quot; font-size=&quot;12&quot;&gt;20 slides at most · presented in class&lt;/text&gt;
    &lt;rect x=&quot;410&quot; y=&quot;30&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;510&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;Search&lt;/text&gt;&lt;text x=&quot;510&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-family=&quot;var(--sans)&quot; font-size=&quot;12&quot;&gt;2 slides + PRISMA&lt;/text&gt;
    &lt;rect x=&quot;620&quot; y=&quot;30&quot; width=&quot;160&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s-acc&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;700&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;References&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;700&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot;&gt;valid sources first&lt;/text&gt;
    &lt;rect x=&quot;790&quot; y=&quot;30&quot; width=&quot;110&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s-slate&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;845&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Appendix&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;845&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot;&gt;if any&lt;/text&gt;
    &lt;text class=&quot;t-m&quot; x=&quot;200&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot;&gt;presented: 20 minutes&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;655&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot;&gt;file only: not presented, but assessed&lt;/text&gt;
    &lt;line x1=&quot;405&quot; y1=&quot;10&quot; x2=&quot;405&quot; y2=&quot;110&quot; stroke=&quot;var(--ink)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
   &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;I have 140 records, 30 removed before screening and 82 excluded on title and abstract. How many valid sources?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;140 − 30 = 110 screened; 110 − 82 = &lt;b&gt;28&lt;/b&gt; eligible for full text screening, i.e. the valid sources.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;In the results slide, do I comment on the content of the valid sources?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;No: only their number. The full list goes in the references, before the other sources used.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What do the lecturers assess in the search?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;A clear and replicable method, consistent numbers, a correct PRISMA diagram, a complete reference list.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;consegna&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 7 · &lt;span class=&quot;badge b-slide&quot;&gt;slides 12–14&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Format, submission, presentation, grading&lt;/h2&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;One PowerPoint file&lt;/h4&gt;20 slides at most (.pptx); after them come the search, references and any appendix: &lt;b&gt;in the file&lt;/b&gt; but not presented.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;First slide&lt;/h4&gt;Group number, case number and company, names and student ID numbers of all members.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Assumptions&lt;/h4&gt;A slide with this title: every number you had to assume.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;References&lt;/h4&gt;Final slides: the valid sources from the Scopus search, then every other source used.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;File name&lt;/h4&gt;Group and case, for example &lt;b&gt;SMA_Group3_Case5.pptx&lt;/b&gt;.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Submission&lt;/h4&gt;One member emails both lecturers, with the others in copy, by &lt;b&gt;29 November, 23:59&lt;/b&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3 style=&quot;margin-top:26px&quot;&gt;In class&lt;/h3&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Everyone presents&lt;/h4&gt;Three members in groups 1–6, two in group 7.&lt;/div&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Time is respected&lt;/h4&gt;You stop at 20 minutes, finished or not. The search takes no minutes.&lt;/div&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Questions follow&lt;/h4&gt;From lecturers and classmates; any member may be asked about any part.&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3 style=&quot;margin-top:26px&quot;&gt;The rubric: from 0 to 3 points&lt;/h3&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Criterion&lt;/th&gt;&lt;th&gt;What is assessed&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
     &lt;tr&gt;&lt;td&gt;Strategy&lt;/td&gt;&lt;td&gt;Value proposition and key problems derived from the facts of the case&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Strategy map&lt;/td&gt;&lt;td&gt;Specific objectives; plausible, explained links; sustainability placed where it operates&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Measures and targets&lt;/td&gt;&lt;td&gt;Precise measures with a direction; balanced leads and lags; realistic, dated targets&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Implementation and judgement&lt;/td&gt;&lt;td&gt;Well-thought-out cascading and reporting; risks and limitations acknowledged&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Literature search&lt;/td&gt;&lt;td&gt;Clear, replicable method; consistent numbers; correct PRISMA; complete list&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Presentation and discussion&lt;/td&gt;&lt;td&gt;Clear slides, time respected, convincing answers from everyone&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
   &lt;div&gt;
    &lt;div class=&quot;card&quot; style=&quot;display:flex;gap:14px;align-items:center;margin-bottom:8px&quot;&gt;&lt;span class=&quot;big&quot;&gt;3&lt;/span&gt;A coherent scorecard that management could start using, well defended.&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;display:flex;gap:14px;align-items:center;margin-bottom:8px&quot;&gt;&lt;span class=&quot;big&quot;&gt;2&lt;/span&gt;Solid work with some weak links or vague measures.&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;display:flex;gap:14px;align-items:center;margin-bottom:8px&quot;&gt;&lt;span class=&quot;big&quot;&gt;1&lt;/span&gt;Basic structure, but generic or disconnected from the case.&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;display:flex;gap:14px;align-items:center&quot;&gt;&lt;span class=&quot;big&quot;&gt;0&lt;/span&gt;Not submitted on time, or a scorecard that does not use the case.&lt;/div&gt;
   &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;The file is called &quot;BSC_finale_v3.pptx&quot;. Is that acceptable?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;No: the name must contain group and case, as in SMA_Group3_Case5.pptx.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What takes you from 2 to 3 points?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Overall coherence and usability: explained links, precise measures, and a convincing defence in the discussion, from everyone.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-ochre&quot; id=&quot;attrezzi&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 8 · &lt;span class=&quot;badge b-add&quot;&gt;explanation&lt;/span&gt; · formulas required by the case questions&lt;/div&gt;
  &lt;h2&gt;Toolkit: the formulas&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;The case questions require calculations that the slides do not re-explain. Here are the definitions, with the case in which each is needed.&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;details open&gt;&lt;summary&gt;ROI and residual income · Torrenti&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;ROI = operating income ÷ average invested capital&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;RI (residual income) = operating income − required rate of return × invested capital&lt;/div&gt;
    &lt;p&gt;ROI is a ratio; RI is an amount in euros: it shows how much value is created &lt;i&gt;over and above&lt;/i&gt; the cost of capital. With the Torrenti board&#x27;s 9%, an ROI below 9% means a negative RI.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details open&gt;&lt;summary&gt;RevPAR, ADR, occupancy · Nove Lune&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;RevPAR = occupancy × ADR&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Occupancy&lt;/b&gt;: rooms sold ÷ rooms available. &lt;b&gt;ADR&lt;/b&gt; (average daily rate): average revenue per room sold. &lt;b&gt;RevPAR&lt;/b&gt; (revenue per available room): room revenue per available room. Check: 2023, 71% × €148 ≈ €105. &lt;b&gt;GOP&lt;/b&gt; (gross operating profit): the hotel&#x27;s gross operating margin.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quality costs · LPI, Ardesia&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;COQ = prevention + appraisal + internal failure + external failure&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Prevention&lt;/b&gt;: avoiding defects (training, design, supplier qualification). &lt;b&gt;Appraisal&lt;/b&gt;: detecting them (inspections, testing, audits). &lt;b&gt;Internal failure&lt;/b&gt;: defects found before delivery (rework, scrap). &lt;b&gt;External failure&lt;/b&gt;: defects found by the customer (returns, warranties, penalties, lost customers). Key idea: spending on prevention reduces failure costs by more.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Churn, acquisition cost, ARR · Contabilis&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;Churn rate = customers lost during the year ÷ customers at the start of the year&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;Recurring revenue lost = customers lost × €4,100&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;Acquisition spend = new customers × sales spend per new customer&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;ARR&lt;/b&gt; (annual recurring revenue): subscription revenue on an annual basis.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Net promoter score · Contabilis&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;NPS = % promoters − % detractors&lt;/div&gt;
    &lt;p&gt;From the question &quot;how likely are you to recommend us?&quot; (0–10): promoters 9–10, detractors 0–6. It ranges from −100 to +100. &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; Reichheld (2003).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Total and per-unit emissions · Valfonda, TVO&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;Total emissions = intensity (kg CO₂e per kg) × quantity produced&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;CO₂e&lt;/b&gt;: CO₂ equivalent, a unit that aggregates different greenhouse gases by weighting them according to their climate impact. Valfonda 2025: 13.4 × 5,500,000 kg ≈ 73,700 t CO₂e.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:26px&quot;&gt;Calculator: Torrenti&#x27;s ROI and RI&lt;/h3&gt;
  &lt;p&gt;Change the required rate of return and see when residual income turns negative. &lt;span class=&quot;badge b-slide&quot;&gt;data from slide 19&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;ri&quot;&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;rr&quot;&gt;Required rate of return&lt;/label&gt;&lt;input id=&quot;rr&quot; type=&quot;range&quot; min=&quot;4&quot; max=&quot;14&quot; step=&quot;0.5&quot; value=&quot;9&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg viewBox=&quot;0 0 600 220&quot; role=&quot;img&quot; aria-label=&quot;ROI and residual income chart&quot; id=&quot;ri-svg&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;tscroll&quot; id=&quot;ri-tab&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Why are ROI and RI not enough to judge the &quot;From valves to flow&quot; strategy?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;They are lagging and short-term: they record the fall in product margin and the investment in services, but do not tell you whether the foundations of the new model (renewals, response times, well-trained and stable technicians) are improving or deteriorating. Moreover, they reward those who postpone investment.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;LPI 2023: 6.1 million orders, 99.62% error-free. Cost of incorrect orders?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Incorrect orders = 6,100,000 × 0.38% ≈ 23,180; × €18 ≈ &lt;b&gt;€417,000&lt;/b&gt;; with €40,000 in penalties ≈ €457,000. These are external failure costs.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;casi&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 9 · &lt;span class=&quot;badge b-slide&quot;&gt;slides 16–51&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Seven cases, seven strategic problems&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;The seven companies and all the people are &lt;b&gt;fictitious&lt;/b&gt;; the numbers are realistic but invented for teaching purposes. Each case has the same structure: company and strategy, key figures 2023–2025, what management sees today, four questions. Quotations are given in English.&lt;/p&gt;
  &lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
   &lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Company&lt;/th&gt;&lt;th&gt;Industry&lt;/th&gt;&lt;th&gt;Size&lt;/th&gt;&lt;th&gt;The core issue, in one line &lt;span class=&quot;badge b-add&quot;&gt;interpretation&lt;/span&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
   &lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Torrenti Valvole S.p.A.&lt;/td&gt;&lt;td&gt;Industrial valves for water utilities and chemicals&lt;/td&gt;&lt;td&gt;410 empl. · €84M&lt;/td&gt;&lt;td&gt;Servitization: services are growing, but reports and incentives still focus on valves&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Nove Lune Hotels&lt;/td&gt;&lt;td&gt;Four boutique hotels in Northern Italy&lt;/td&gt;&lt;td&gt;180 empl. at peak · €13.6M&lt;/td&gt;&lt;td&gt;Revenue is growing, but the promise &quot;we know you by name&quot; is fading&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Trasporti Valli Orobiche S.p.A.&lt;/td&gt;&lt;td&gt;Public bus transport, city and valleys&lt;/td&gt;&lt;td&gt;640 empl. · 260 buses&lt;/td&gt;&lt;td&gt;A non-profit facing a tender: driver shortages, declining quality&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;Cooperativa Casearia Valfonda&lt;/td&gt;&lt;td&gt;PDO cheese cooperative&lt;/td&gt;&lt;td&gt;140 member farms · €99M&lt;/td&gt;&lt;td&gt;Customers demand −30% emissions, which originate on members&#x27; farms&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;Logistica Padana Integrata S.r.l.&lt;/td&gt;&lt;td&gt;Third-party logistics for e-commerce and fashion&lt;/td&gt;&lt;td&gt;480 empl. · €58M&lt;/td&gt;&lt;td&gt;Operational excellence undermined by errors, agency work and injuries&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;Ardesia Bikes S.p.A.&lt;/td&gt;&lt;td&gt;Premium mountain and city e-bikes&lt;/td&gt;&lt;td&gt;520 empl. · €109M&lt;/td&gt;&lt;td&gt;A product leadership that always comes second&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;Contabilis Cloud S.r.l.&lt;/td&gt;&lt;td&gt;Cloud software for small accounting firms&lt;/td&gt;&lt;td&gt;120 empl. · €18.4M&lt;/td&gt;&lt;td&gt;Customers are acquired, but more and more are lost&lt;/td&gt;&lt;/tr&gt;
   &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;In the key figures table, the sparkline is &lt;span class=&quot;ok&quot;&gt;green&lt;/span&gt; if the trend moves in the desired direction, &lt;span class=&quot;ko&quot;&gt;brick&lt;/span&gt; if it moves in the wrong one, grey if neutral.&lt;/p&gt;
  &lt;div data-tabs id=&quot;cases&quot;&gt;&lt;div class=&quot;tabbar&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Self-check on the cases&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Valfonda: emissions per kg fall by 2.9% from 2023 to 2025, total emissions by 7.9%. What actually happened?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;The total decrease comes mainly from lower volume (5,800 → 5,500 t of cheese), not from efficiency. A per-kg target alone would hide the fact that the actual reduction depends on producing less; a total target alone would reward the decline in members. This is question 3: it must be justified.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Contabilis 2025: how much recurring revenue is lost with the customers who leave?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;468 × €4,100 ≈ €1.92M, while acquiring 1,168 new customers costs 1,168 × €1,900 ≈ €2.22M. The company pays more and more to fill a bucket that leaks more and more.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Which Ardesia measures are innovation inputs and which are outputs?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Inputs: R&amp;amp;D spend, engineers, patents. Outputs: revenue from models launched in the last two years, months from concept to launch, models launched on time. For a product leadership strategy, outputs are what matter.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Nove Lune: why is the GOP bonus a risk for the strategy?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;It rewards the hotel&#x27;s short-term profit, not training or the completion of guest profiles, which are the drivers of the &quot;known by name&quot; promise. It is an incentive that works against the value proposition.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-acc&quot; id=&quot;approfondire&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Part 10 · &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Further reading&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;The slides explicitly name Scopus and the PRISMA diagram; the other concepts (the four perspectives, the value disciplines, the strategy map, the three options for sustainability, double materiality, quality costs, the net promoter score, the EU battery rules) are used without citing their authors. Below are the original sources, found through a web search: &lt;b&gt;all content in this section is external&lt;/b&gt; and should be checked against the link.&lt;/p&gt;
  &lt;div class=&quot;grid g2 ext-list&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Kaplan, R. S. and Norton, D. P. (1992), &quot;The Balanced Scorecard — Measures That Drive Performance&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Harvard Business Review&lt;/i&gt;, January–February 1992.&lt;/p&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the article that introduced the BSC, which grew out of a year-long research project with 12 companies; the four perspectives (financial, customer, internal business processes, innovation and learning). &lt;b&gt;Why it matters:&lt;/b&gt; it is the origin of the entire group work.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://fenix.iseg.ulisboa.pt/downloadFile/281608120752631/Kaplan%20%20Norton%20(1992).PDF&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF hosted by ISEG, Universidade de Lisboa&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Kaplan and Norton (1996), &quot;Using the Balanced Scorecard as a Strategic Management System&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Harvard Business Review&lt;/i&gt;, 74(1), pp. 75–85.&lt;/p&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the BSC moves from a measurement system to a strategic management system, with processes linking long-term objectives to short-term actions; strategy as a set of hypotheses to be tested through feedback. &lt;b&gt;Why it matters:&lt;/b&gt; it explains why the brief says every arrow is &quot;a hypothesis that can be tested&quot; and why cascading and reporting are needed.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumKaplanNorton96.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Summary on Management And Accounting Web (maaw.info)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Kaplan and Norton (2000), &quot;Having Trouble with Your Strategy? Then Map It&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Harvard Business Review&lt;/i&gt;, September–October 2000, pp. 167–176; later the book &lt;i&gt;Strategy Maps&lt;/i&gt; (2004).&lt;/p&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the strategy map as a standard template for making the link between strategy and day-to-day work visible, with the Mobil example. &lt;b&gt;Why it matters:&lt;/b&gt; it is the format of block 2 of the presentation.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://store.hbr.org/product/having-trouble-with-your-strategy-then-map-it/R00509&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Listing on HBR Store&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Treacy, M. and Wiersema, F. (1993), &quot;Customer Intimacy and Other Value Disciplines&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Harvard Business Review&lt;/i&gt;, 71(1), pp. 84–93; later the book &lt;i&gt;The Discipline of Market Leaders&lt;/i&gt; (1995).&lt;/p&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the three value disciplines (operational excellence, customer intimacy, product leadership): market leaders excel in one and meet industry standards in the others. &lt;b&gt;Why it matters:&lt;/b&gt; the brief asks you to choose one and explain why.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://edisciplinas.usp.br/pluginfile.php/4623221/mod_resource/content/1/Customer%20Intimacy%20and%20Other%20Value%20Discuplines%20%28Michael%20Treacy%20and%20Fred%20Wiersema%29.PDF&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF reprint hosted by Universidade de São Paulo&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
