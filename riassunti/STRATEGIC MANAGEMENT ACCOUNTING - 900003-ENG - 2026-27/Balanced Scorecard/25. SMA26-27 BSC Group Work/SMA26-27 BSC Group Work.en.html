   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Kaplan, R. S. (2001), &quot;Strategic Performance Measurement and Management in Nonprofit Organizations&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Nonprofit Management and Leadership&lt;/i&gt;, 11(3), pp. 353–370.&lt;/p&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the adaptation of the BSC to non-profit organisations, with implementation examples: the mission, not financial objectives, sits at the top. &lt;b&gt;Why it matters:&lt;/b&gt; it underpins the &quot;mission first&quot; approach for TVO and Valfonda.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://doi.org/10.1002/nml.11308&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;doi.org/10.1002/nml.11308&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Figge, F., Hahn, T., Schaltegger, S. and Wagner, M. (2002), &quot;The Sustainability Balanced Scorecard — Linking Sustainability Management to Business Strategy&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Business Strategy and the Environment&lt;/i&gt;, 11(5), pp. 269–284.&lt;/p&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; how to integrate environmental and social aspects into a business unit&#x27;s BSC; the distinction between market and non-market aspects and the options of integration, an additional perspective and a derived scorecard. It is described as the most cited article in the sustainability BSC literature. &lt;b&gt;Why it matters:&lt;/b&gt; these are the &quot;three options&quot; in the brief.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://doi.org/10.1002/bse.339&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;doi.org/10.1002/bse.339&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;EFRAG, ESRS 1 &quot;General Requirements&quot; (2023) — double materiality&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;European Sustainability Reporting Standards, Commission Delegated Regulation (EU) 2023/2772; under revision by EFRAG in 2025.&lt;/p&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the definition of impact materiality and financial materiality: a matter is material if it meets at least one of the two tests. &lt;b&gt;Why it matters:&lt;/b&gt; the brief asks you to select the aspects &quot;with double materiality&quot;.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://knowledgehub.efrag.org/eng/interactive/esrs-set-1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EFRAG Knowledge Hub, ESRS Set 1&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Regulation (EU) 2023/1542 concerning batteries and waste batteries&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;EU legislation, consolidated text on EUR-Lex.&lt;/p&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; requirements for all batteries, including those for &quot;light means of transport&quot; (e-bikes, e-scooters); extended producer responsibility for collection and recycling, with specific collection targets for these batteries. &lt;b&gt;Why it matters:&lt;/b&gt; these are the &quot;new EU rules&quot; in the Ardesia case (question 4).&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2023/1542/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex, Regulation (EU) 2023/1542&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Page, M. J. et al. (2021), &quot;The PRISMA 2020 statement: an updated guideline for reporting systematic reviews&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;BMJ&lt;/i&gt; 2021;372:n71 (also in &lt;i&gt;PLOS Medicine&lt;/i&gt;).&lt;/p&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; a 27-item checklist and updated flow diagrams for systematic reviews; it replaces PRISMA 2009. &lt;b&gt;Why it matters:&lt;/b&gt; it is the diagram the brief requires, stopping however at the records eligible for full text screening.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://doi.org/10.1136/bmj.n71&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;doi.org/10.1136/bmj.n71&lt;/a&gt; · &lt;a href=&quot;https://www.prisma-statement.org/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;prisma-statement.org&lt;/a&gt; (diagram templates)&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Scopus (Elsevier): advanced search&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Elsevier support pages.&lt;/p&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; how to use the combined TITLE-ABS-KEY field (title, abstract, keywords), quotation marks for phrases and the precedence rules for Boolean operators. &lt;b&gt;Why it matters:&lt;/b&gt; the search must be &quot;clear and replicable&quot;: the exact string goes in the method slide.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://www.elsevier.support/scopus/answer/how-can-i-best-use-the-advanced-search&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Elsevier Support, Advanced search&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;ASQ, &quot;Cost of Quality&quot; (prevention–appraisal–failure model)&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;American Society for Quality; the model dates back to Feigenbaum (HBR, 1956).&lt;/p&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the four categories of quality costs: prevention, appraisal, internal failure, external failure. &lt;b&gt;Why it matters:&lt;/b&gt; these are the &quot;quality cost categories&quot; in LPI question 2 and Ardesia question 3.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://www.asq.org/quality-resources/cost-of-quality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;asq.org, Cost of Quality&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Reichheld, F. F. (2003), &quot;The One Number You Need to Grow&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Harvard Business Review&lt;/i&gt;, 81(12), pp. 46–54.&lt;/p&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the origin of the net promoter score (promoters − detractors). The claim that a single number is enough has been criticised in the literature. &lt;b&gt;Why it matters:&lt;/b&gt; Contabilis&#x27;s NPS falls from 41 to 18.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://www.proquest.com/docview/204699007&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Record on ProQuest&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Vandermerwe, S. and Rada, J. (1988), &quot;Servitization of Business: Adding Value by Adding Services&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;European Management Journal&lt;/i&gt;, 6(4), pp. 314–324.&lt;/p&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the article that coined &quot;servitization&quot;: firms add services to their product offering, in customer-focused bundles. &lt;b&gt;Why it matters:&lt;/b&gt; it is Torrenti&#x27;s strategy and one of the suggested keywords for the case 1 search.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://doi.org/10.1016/0263-2373(88)90033-3&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;doi.org/10.1016/0263-2373(88)90033-3&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;GHG Protocol, Corporate Accounting and Reporting Standard&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;WRI and WBCSD.&lt;/p&gt;&lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; how to build an organisation&#x27;s emissions inventory, divided into scopes 1, 2 and 3. &lt;b&gt;Why it matters:&lt;/b&gt; for Valfonda, 80% of emissions originate on members&#x27; farms, outside the direct boundary: this is the problem of &quot;how the scorecard reaches the farms&quot; (question 4).&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://ghgprotocol.org/corporate-standard&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ghgprotocol.org/corporate-standard&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

 e:[[&quot;F2&quot;,&quot;F1&quot;],[&quot;C1&quot;,&quot;F2&quot;],[&quot;C2&quot;,&quot;C1&quot;],[&quot;P1&quot;,&quot;C2&quot;],[&quot;P2&quot;,&quot;C1&quot;],[&quot;L1&quot;,&quot;P1&quot;],[&quot;L2&quot;,&quot;P1&quot;],[&quot;L3&quot;,&quot;P2&quot;],[&quot;L3&quot;,&quot;P1&quot;]]};

{t:&quot;Torrenti Valvole S.p.A.&quot;,s:&quot;Industrial valves · 410 employees · €84M&quot;,st:&quot;“From valves to flow”&quot;,
 co:&quot;Founded in 1971, it manufactures ball, butterfly and control valves for water utilities, chemical plants and contractors in Italy, Germany and North Africa. For forty years it competed on technical quality and reliable delivery. Since 2020 Asian manufacturers have been offering standard valves at prices 25–30% lower; in 2024 Torrenti lost two major tenders on price alone. The board does not believe it can win a price war.&quot;,
 sx:&quot;Launched in 2023 by CEO Marta Bonaldi: no longer selling a valve and walking away, but valves with sensors, a remote monitoring platform and multi-year maintenance contracts. The customer pays for a network that never stops. &lt;b&gt;2028 targets:&lt;/b&gt; services at 20% of revenue, at least 150 customers with a service contract, ROI back above 12%.&quot;,

 nt:&quot;Minimum required rate of return set by the board: 9%.&quot;,
 rp:&quot;The monthly board report is four pages long: orders by product line, revenue, gross margin, days of inventory. Services are a single line, “other revenue”. Nobody measures how long a sensor stays offline or how long a technician takes to reach the customer. Salespeople receive a bonus of 1.5% on order value: in its first year, a five-year service contract is worth less than a single valve order.&quot;,
 q:[[&quot;Marta Bonaldi, CEO&quot;,&quot;Customers say they love the monitoring. But I can&#x27;t see in the numbers whether the plan is working: all I see is the margin going down.&quot;],[&quot;Paolo Rinaldi, sales director&quot;,&quot;My people are paid on orders. When a customer hesitates, they give away the service contract to close the valve order. What else can they do?&quot;],[&quot;Giulia Sala, head of service&quot;,&quot;Last year I lost four technicians to a competitor. They drive 40,000 km a year and nobody trains them on the new sensors. At renewal time, the customer remembers the day we arrived late.&quot;],[&quot;Luca Ferri, CFO&quot;,&quot;Services are growing, but ROI has fallen from 12% to below 8%. Investors are asking when the plan will pay off. I need something better than a promise.&quot;]],
 d:[&quot;Calculate ROI and residual income for 2023, 2024 and 2025. What do the two measures tell you about the new strategy, and what do they not tell you?&quot;,&quot;Which value proposition is Torrenti moving towards? Which measures in the current report support it and which work against it?&quot;,&quot;Find in the numbers a cause-and-effect chain from learning and growth to the financial perspective. How could management test whether it really holds?&quot;,&quot;The monthly report shows services as a single line, “other revenue”. Which measures should replace it to show whether the new strategy is working?&quot;],
 k:[[&quot;ROI (op. income ÷ capital)&quot;,&quot;12.42%&quot;,&quot;9.53%&quot;,&quot;7.58%&quot;],[&quot;Residual income at 9% (€M)&quot;,&quot;+2.12&quot;,&quot;+0.34&quot;,&quot;−0.94&quot;],[&quot;Services share of revenue&quot;,&quot;5.0%&quot;,&quot;7.0%&quot;,&quot;9.0%&quot;],[&quot;Services gross margin (€M)&quot;,&quot;1.98&quot;,&quot;2.60&quot;,&quot;3.42&quot;],[&quot;Product revenue (€M)&quot;,&quot;81.7&quot;,&quot;78.6&quot;,&quot;76.4&quot;]],
 h:[&quot;RI turns negative in 2025: with a 9% cost of capital, Torrenti is currently destroying value. But both measures are lags and cannot see whether renewals and service quality are holding up.&quot;,&quot;A possible chain: training hours ↓ (32→18) and technician turnover ↑ (8%→21%) → on-time delivery ↓ and complaints ↑ → renewals ↓ (72%→64%) → service revenue below potential → ROI ↓.&quot;,&quot;The 1.5% bonus on orders and the “other revenue” report work against a service strategy: incentives and measures need to be realigned.&quot;,&quot;For 2028 the company needs 150 customers (79 today) and services at 20% (9% today): measures such as sensor uptime, response time and renewal rate become leads.&quot;]},
{t:&quot;Nove Lune Hotels&quot;,s:&quot;Four boutique hotels · 180 employees at peak · €13.6M&quot;,st:&quot;“Every guest is known by name”&quot;,
 co:&quot;Founded in 2009 by Chiara and Andrea Moroni, who turned a family palazzo in Bergamo&#x27;s Città Alta into a 38-room hotel. Today: Bergamo, Verona, Mantua and Lake Como; the Como hotel is seasonal and closes from November to February. Guests are mainly couples and small groups from Germany, Switzerland, the United States and Italy. Restaurants, a small spa and private tours add about 30% to room revenue.&quot;,
 sx:&quot;Staff remember preferences, suggest a wine bar that is not in the guidebooks and treat returning guests like friends: the promise is a personal stay, not the cheapest room. In 2023 the group hired a revenue manager from an international chain: prices are set daily by software and more rooms are sold through &lt;i&gt;online travel agencies&lt;/i&gt;, which charge a commission of &lt;b&gt;18%&lt;/b&gt; on each booking.&quot;,
 r:[[&quot;Occupancy&quot;,71,74,76,1,&quot;%&quot;],[&quot;ADR, average daily rate (€)&quot;,148,156,162,1,&quot;&quot;],[&quot;RevPAR (€)&quot;,105,115,123,1,&quot;&quot;],[&quot;Total revenue (€M)&quot;,11.6,12.8,13.6,1,&quot;&quot;],[&quot;GOP (% of revenue)&quot;,33,31,29,1,&quot;%&quot;],[&quot;Agency commissions (€M)&quot;,1.01,1.17,1.30,-1,&quot;&quot;],[&quot;Rooms booked directly&quot;,31,27,24,1,&quot;%&quot;],[&quot;Returning guests&quot;,22,19,17,1,&quot;%&quot;],[&quot;Online reviews (out of 10)&quot;,8.9,8.7,8.6,1,&quot;&quot;],[&quot;Complaints per 1,000 stays&quot;,6.1,7.4,8.3,-1,&quot;&quot;],[&quot;Staff turnover&quot;,34,41,45,-1,&quot;%&quot;],[&quot;Seasonal staff&quot;,28,35,39,-1,&quot;%&quot;],[&quot;Guests with a profile in the database&quot;,18,21,23,1,&quot;%&quot;]],

{t:&quot;Trasporti Valli Orobiche S.p.A. (TVO)&quot;,s:&quot;Public bus transport · 640 employees · 260 buses&quot;,st:&quot;The challenge: the 2028 tender&quot;,
 co:&quot;TVO operates the buses of a medium-sized city and the surrounding valleys: 58 routes, 2,100 stops, about 23 million passengers a year. All shares are held by public bodies. It is not profit-seeking: its articles of association call for “accessible, reliable and sustainable mobility for the community”. A service contract with the Region sets 14.3 million vehicle km a year: the Region pays a fixed amount per km and a penalty for every km not operated. Fares cover about one third of costs.&quot;,
 sx:&quot;The contract expires in 2027. In 2028 the Region will award the service through a &lt;b&gt;public tender&lt;/b&gt;, in which private operators are expected to bid: the criteria give 60% of the points to quality (punctuality, reliability, satisfaction, emissions) and 40% to price. TVO cannot find drivers: young people do not want shifts starting at 5 a.m., and a bus licence costs about €4,000. When drivers are missing, trips are cancelled.&quot;,

 k:[[&quot;Km short of the 14.3M in the contract&quot;,&quot;0.1M&quot;,&quot;0.3M&quot;,&quot;0.5M&quot;],[&quot;Penalty per missing km (approx.)&quot;,&quot;€1.20&quot;,&quot;€1.03&quot;,&quot;€1.08&quot;],[&quot;Share of zero-emission buses&quot;,&quot;3.5%&quot;,&quot;5.4%&quot;,&quot;8.5%&quot;],[&quot;Total revenue (fares + Region + other, €M)&quot;,&quot;58.8&quot;,&quot;61.2&quot;,&quot;62.8&quot;],[&quot;Passengers per vehicle km&quot;,&quot;1.51&quot;,&quot;1.63&quot;,&quot;1.67&quot;]],

{t:&quot;Cooperativa Casearia Valfonda&quot;,s:&quot;PDO cheese cooperative · 140 member farms · €99M&quot;,st:&quot;The challenge: −30% emissions per kg by 2030&quot;,
 co:&quot;Founded in 1957 by 23 dairy farmers. Today 140 farms deliver their milk to two dairies that produce Taleggio PDO (protected designation of origin), other soft cheeses and a mountain cheese aged up to two years, sold in Italy and increasingly abroad. The farmers are at the same time &lt;b&gt;owners&lt;/b&gt; and the only &lt;b&gt;suppliers&lt;/b&gt; of milk. The aim is not to maximise profit but to pay members the best possible milk price, year after year: whatever remains after costs goes back to members through the milk price.&quot;,
 sx:&quot;Three retailers in Germany and Switzerland buy 38% of the cheese. In 2025 two of them asked all dairy suppliers to cut emissions per kg by &lt;b&gt;30% by 2030&lt;/b&gt; compared with 2025, with an annual report: those who fail will be delisted. About 80% of the emissions of a kg of cheese originate on the farms. A biogas plant for the member farms&#x27; slurry would cost €6M and cut emissions by about 15%. Meanwhile the number of farms falls every year: many farmers are over 55 and their children do not want to carry on.&quot;,

 nt:&quot;&quot;,
 rp:&quot;The board, made up of nine farmers, meets every month: sales by customer, stocks of ageing cheese and the milk price payable the following month. Emissions are estimated once a year by the quality manager using a spreadsheet and average values from the literature, not each farm&#x27;s data. Animal welfare certification is voluntary: certified farms receive €1 more per 100 litres.&quot;,

{t:&quot;Logistica Padana Integrata S.r.l. (LPI)&quot;,s:&quot;Third-party logistics · 480 employees · €58M&quot;,st:&quot;“The most reliable and the cheapest”&quot;,
 co:&quot;LPI runs the warehouses of 25 customers that sell online: fashion, cosmetics, sporting goods and books. It receives and stores goods, picks and packs each order, ships it and handles returns. Customers pay a price per order, set in three-year contracts with service levels: at least &lt;b&gt;99.5%&lt;/b&gt; error-free orders and at least &lt;b&gt;95%&lt;/b&gt; of orders received by 3 p.m. shipped the same day. Below these thresholds LPI pays penalties.&quot;,
 sx:&quot;Customers compare prices to the cent. The CEO, Alberto Cattaneo, wants LPI to ship at the lowest cost per order and with fewer errors than anyone else in Northern Italy: “We won&#x27;t be the most creative. We will be the most reliable and the cheapest”. In 2025 the board approved &lt;b&gt;€9M&lt;/b&gt; for an automated sorter and picking robots in the second warehouse, to go live in 2027; the supplier promises a 20% cut in cost per order. The system needs fewer operatives but more technicians.&quot;,
 r:[[&quot;Orders shipped (millions)&quot;,6.1,7.4,8.0,1,&quot;&quot;],[&quot;Revenue (€M)&quot;,48.0,55.0,58.0,1,&quot;&quot;],[&quot;Operating margin&quot;,6.1,4.9,3.8,1,&quot;%&quot;],[&quot;Orders shipped error-free&quot;,99.62,99.55,99.41,1,&quot;%&quot;],[&quot;Orders by 3 p.m. shipped same day&quot;,97,95,92,1,&quot;%&quot;],[&quot;Penalties paid to customers (€k)&quot;,40,180,420,-1,&quot;&quot;],[&quot;Customers at year end&quot;,22,24,25,1,&quot;&quot;],[&quot;Customers lost during the year&quot;,1,3,4,-1,&quot;&quot;],[&quot;Hours worked by agency staff&quot;,38,46,52,-1,&quot;%&quot;],[&quot;Injuries per million hours&quot;,21,26,31,-1,&quot;&quot;],[&quot;Employee absenteeism&quot;,6.2,7.0,7.9,-1,&quot;%&quot;],[&quot;Technicians for automated equipment&quot;,3,3,4,1,&quot;&quot;]],
 nt:&quot;Correcting an incorrect order (return, reshipment, credit note) costs LPI €18 on average.&quot;,
 rp:&quot;Each warehouse manager receives a weekly report with orders shipped, hours worked and cost per order. Errors and same-day shipments are counted only at month end, when the customers&#x27; reports arrive. Injuries are recorded by the safety manager for the statutory register and are not part of the management report. In November and December volumes triple: LPI hires up to 300 agency workers for six weeks, with two days of training.&quot;,
 q:[[&quot;Alberto Cattaneo, CEO&quot;,&quot;We earn cents per order. Our only advantage can be doing the same job at lower cost and with fewer errors than anyone else.&quot;],[&quot;Francesca Moretti, operations director&quot;,&quot;During the peak I fill the warehouse with people who have never seen one. Cost per order looks fine in the weekly report, then the errors show up a month later.&quot;],[&quot;Nicola Testa, key account manager&quot;,&quot;The four customers we lost last year didn&#x27;t leave over price. They left after Black Friday, when their customers received the wrong parcels.&quot;],[&quot;Laura Pellegrini, HR and safety&quot;,&quot;Behind every injury there is a person. The insurer has also raised the premium by 30%. And next year I need ten technicians I can&#x27;t find.&quot;]],
 d:[&quot;Which value proposition does LPI pursue? Which internal processes are critical to it, and which are less important?&quot;,&quot;Calculate the cost of incorrect orders in each year (€18 per order) and add the penalties. Classify these costs into the quality cost categories. Which prevention and appraisal activities would you measure?&quot;,&quot;Injuries and agency work: just a social (S) issue from an ESG perspective, or also strategic for LPI? Place them on your map.&quot;,&quot;Which measures would show whether the automation project is on track before financial results appear? Which measures would change once it goes live?&quot;],
 k:[[&quot;Incorrect orders (n)&quot;,&quot;23,180&quot;,&quot;33,300&quot;,&quot;47,200&quot;],[&quot;Correction cost at €18 (€k)&quot;,&quot;417&quot;,&quot;599&quot;,&quot;850&quot;],[&quot;+ penalties = failure costs (€k)&quot;,&quot;457&quot;,&quot;779&quot;,&quot;1,270&quot;],[&quot;Operating income (€M)&quot;,&quot;2.93&quot;,&quot;2.70&quot;,&quot;2.20&quot;],[&quot;Failure costs / operating income&quot;,&quot;16%&quot;,&quot;29%&quot;,&quot;58%&quot;],[&quot;Revenue per order (€)&quot;,&quot;7.87&quot;,&quot;7.43&quot;,&quot;7.25&quot;]],
 h:[&quot;Value proposition: operational excellence. Critical: error-free picking and packing, same-day shipping, peak management; less critical: service innovation and customisation.&quot;,&quot;Corrections and penalties are external failure costs (defects discovered by the customer); lost customers are their hidden cost. Prevention: training of agency staff, procedures; appraisal: sample checks before shipping.&quot;,&quot;The weekly report does not see errors and injuries: they are lags that arrive at month end or remain in the statutory register.&quot;,&quot;Automation: leads such as technicians hired and trained, project progress, sorter testing; after go-live, cost per order, the mix of agency hours and error types change.&quot;]},
{t:&quot;Ardesia Bikes S.p.A.&quot;,s:&quot;Premium e-bikes · 520 employees · €109M&quot;,st:&quot;Being the first brand&quot;,
 co:&quot;Founded in 2008 by Tommaso Ardesi, a former mountain bike racer, and his engineer partner. Ardesia designs its own frames and integrates motor and battery inside the frame, so that an e-bike looks and rides like a conventional one. The bikes cost from €3,500 to €9,000 and are sold through specialist dealers, who also provide after-sales service. During the pandemic Ardesia sold everything it produced; since 2023 the European bike market has been declining: shops full of unsold stock and many brands cutting prices.&quot;,
 sx:&quot;Ardesia does not compete on price: it wants to be the &lt;b&gt;first brand&lt;/b&gt; to bring every new technology to market, with lighter frames, longer-range batteries, smarter motors. Cyclists pay more because it is the bike the others will copy the following year. In 2024 a German competitor launched a lighter integrated frame six months before Ardesia&#x27;s model. In 2025 both of the year&#x27;s new models were late.&quot;,
 r:[[&quot;Bikes sold&quot;,31000,25400,22800,1,&quot;&quot;],[&quot;Average selling price (€)&quot;,4580,4650,4780,1,&quot;&quot;],[&quot;Revenue (€M)&quot;,142.0,118.1,109.0,1,&quot;&quot;],[&quot;Operating margin&quot;,11.2,4.5,1.8,1,&quot;%&quot;],[&quot;R&amp;D (% of revenue)&quot;,5.8,7.2,8.1,0,&quot;%&quot;],[&quot;Engineers&quot;,64,78,81,0,&quot;&quot;],[&quot;Patents filed&quot;,6,9,11,0,&quot;&quot;],[&quot;Revenue from models of the last two years&quot;,46,38,29,1,&quot;%&quot;],[&quot;Average months from concept to launch&quot;,22,26,29,-1,&quot;&quot;],[&quot;New models launched on time&quot;,75,33,0,1,&quot;&quot;,[&quot;3 of 4&quot;,&quot;1 of 3&quot;,&quot;0 of 2&quot;]],[&quot;First-year battery failures (per 1,000 bikes)&quot;,8,14,19,-1,&quot;&quot;],[&quot;Warranty costs (% of revenue)&quot;,1.9,2.6,3.4,-1,&quot;%&quot;],[&quot;Dealer inventory (weeks)&quot;,14,23,19,-1,&quot;&quot;],[&quot;Dealer satisfaction (out of 10)&quot;,7.8,7.1,6.8,1,&quot;&quot;]],
 nt:&quot;In 2024 Ardesia changed battery cell supplier, saving €22 per battery.&quot;,
 rp:&quot;The monthly report shows sales by country and model, margin by model and the budget of each R&amp;D project. The board assesses R&amp;D with two numbers: total spend and patents filed. Every project has a target launch date, but delays are not reported until the date has passed. The new EU battery rules make producers responsible for collecting and recycling used e-bike batteries; Ardesia has not yet decided how to organise this with its dealers.&quot;,
 q:[[&quot;Tommaso Ardesi, founder and CEO&quot;,&quot;We have more engineers and more patents than ever. So why do we always come second?&quot;],[&quot;Valentina Ghisleni, R&amp;D director&quot;,&quot;My engineers work on three or four projects at a time. Marketing changes the specifications halfway through, and every change costs us months.&quot;],[&quot;Matteo Ravasio, sales director&quot;,&quot;The dealers are full of last year&#x27;s bikes. To clear them we offer discounts, and the brand suffers. A dealer waiting for a model that never arrives starts selling another brand.&quot;],[&quot;Silvia Mazzoleni, quality manager&quot;,&quot;The new cells saved money on paper. Then the batteries started failing, and every failure means a dealer, a cyclist and a replacement battery.&quot;]],
 d:[&quot;R&amp;D spend and patents are rising, while revenue from new models is falling. What does this say about input and output measures of innovation? Which would you put in the scorecard?&quot;,&quot;Who is Ardesia&#x27;s customer: the cyclist or the dealer? Design a customer perspective that takes both into account.&quot;,&quot;Calculate warranty costs from 2023 to 2025 and compare them with the savings from the new cells. Which quality cost category do they fall into? Which prevention measures belong in the internal process perspective?&quot;,&quot;Should the collection of used batteries enter the scorecard now? Is it material, does it reach Ardesia through markets, and which of the three options fits?&quot;],
 k:[[&quot;Warranty costs (€M)&quot;,&quot;2.70&quot;,&quot;3.07&quot;,&quot;3.71&quot;],[&quot;Cell savings (€22 × bikes, €M)&quot;,&quot;—&quot;,&quot;0.56&quot;,&quot;0.50&quot;],[&quot;Warranty above the 2023 rate (€M)&quot;,&quot;—&quot;,&quot;+0.83&quot;,&quot;+1.64&quot;],[&quot;Revenue from recent models (€M)&quot;,&quot;65.3&quot;,&quot;44.9&quot;,&quot;31.6&quot;]],
 h:[&quot;The savings on cells (about €0.5M a year) are more than wiped out by the increase in warranty costs: a classic external failure cost.&quot;,&quot;Inputs (spend, engineers, patents) are growing, outputs (revenue from new models, on-time launches, development times) are deteriorating: for product leadership, outputs are what matter.&quot;,&quot;The cyclist pays the premium, the dealer sells and services: the customer perspective can have objectives for both (dealer satisfaction, inventory, failures experienced by the cyclist).&quot;,&quot;Prevention: qualification of cell suppliers, durability testing before launch, a cap on parallel projects and a specification freeze.&quot;]},
{t:&quot;Contabilis Cloud S.r.l.&quot;,s:&quot;Cloud software for accounting firms · 120 employees · €18.4M&quot;,st:&quot;“The accountant&#x27;s best colleague”&quot;,
 co:&quot;Founded in 2012 in Brescia by Federica Bonetti, a chartered accountant, and a software engineer. Contabilis sells cloud software to small accounting firms: bookkeeping, payroll, tax returns and e-invoicing. Firms pay a monthly subscription per user (the &lt;i&gt;SaaS&lt;/i&gt; model, software as a service): there is no licence to buy. When e-invoicing between Italian businesses became mandatory in 2019, many small firms moved to the cloud and Contabilis grew quickly. Today it serves 4,300 firms with 120 employees.&quot;,
 sx:&quot;Contabilis is not the cheapest software. It promises two things: every new tax rule is in the software &lt;b&gt;before the deadline&lt;/b&gt;, and a support team of former accountants responds quickly, even in the busiest weeks of the year. The large software groups now offer bundles at lower prices, and several are adding artificial intelligence features. Contabilis wants to retain its customers by being closer to them than anyone else.&quot;,
 r:[[&quot;Customers at start of year&quot;,2200,2900,3600,1,&quot;&quot;],[&quot;New customers during the year&quot;,870,961,1168,1,&quot;&quot;],[&quot;Customers lost during the year&quot;,170,261,468,-1,&quot;&quot;],[&quot;Annual recurring revenue at year end (€M)&quot;,11.8,14.9,17.6,1,&quot;&quot;],[&quot;Total revenue (€M)&quot;,15.2,17.0,18.4,1,&quot;&quot;],[&quot;Operating margin&quot;,14.0,9.1,4.2,1,&quot;%&quot;],[&quot;Sales spend per new customer (€)&quot;,1100,1450,1900,-1,&quot;&quot;],[&quot;Support requests per customer&quot;,2.2,2.6,3.3,-1,&quot;&quot;],[&quot;Average time to first response (hours)&quot;,4,9,17,-1,&quot;&quot;],[&quot;Releases with a critical bug&quot;,10,27,50,-1,&quot;&quot;,[&quot;1 of 10&quot;,&quot;3 of 11&quot;,&quot;6 of 12&quot;]],[&quot;Developers at year end&quot;,38,41,40,0,&quot;&quot;],[&quot;Developers who left during the year&quot;,9,17,24,-1,&quot;%&quot;],[&quot;Training hours per support agent&quot;,30,18,12,1,&quot;&quot;],[&quot;Net promoter score (−100 to +100)&quot;,41,29,18,1,&quot;&quot;]],
 nt:&quot;On average a customer pays about €4,100 a year.&quot;,
 rp:&quot;Every month the founders review new customers, recurring revenue and costs. Support is measured by the number of requests closed by each agent per day; developers by the number of new features released. Nobody analyses why customers leave: a firm that cancels fills in a form with a free-text field that nobody reads. The satisfaction survey is sent once a year, in September.&quot;,
 q:[[&quot;Federica Bonetti, founder and CEO&quot;,&quot;We are signing more firms than ever. So why does the margin fall every year?&quot;],[&quot;Luca Locatelli, head of customer support&quot;,&quot;In the two weeks before a tax deadline, requests triple. My agents close them quickly, but the same customer calls back three times.&quot;],[&quot;Davide Rota, chief technology officer&quot;,&quot;Every month we release new features to keep up with the big groups, and we have no time to fix what we released the month before. My best developers are leaving for the banks.&quot;],[&quot;Elena Carminati, sales director&quot;,&quot;New customers come easily: our name is good. But it is hard to sell to a firm whose colleague next door has just left us.&quot;]],
 d:[&quot;Customers and recurring revenue are growing, while margin and net promoter score are falling. For each year, calculate the share of customers lost, the recurring revenue lost with them (€4,100 each) and the spend on acquiring new customers. Is the strategy working?&quot;,&quot;Which value proposition does Contabilis pursue? Which internal processes are critical, and which of the current measures (requests closed per agent, features released) work against them?&quot;,&quot;Build the chain from developers leaving and training hours to bugs, response times, lost customers and recurring revenue. Which lead indicators would have warned management in 2024?&quot;,&quot;Data security and team workload before tax deadlines: just ESG issues, or strategic for Contabilis? Is each one material, does it reach the company through markets, and which of the three options fits?&quot;],
 k:[[&quot;Share of customers lost (churn)&quot;,&quot;7.7%&quot;,&quot;9.0%&quot;,&quot;13.0%&quot;],[&quot;Recurring revenue lost (€M)&quot;,&quot;0.70&quot;,&quot;1.07&quot;,&quot;1.92&quot;],[&quot;Spend on acquiring new customers (€M)&quot;,&quot;0.96&quot;,&quot;1.39&quot;,&quot;2.22&quot;],[&quot;Customers at year end (check)&quot;,&quot;2,900&quot;,&quot;3,600&quot;,&quot;4,300&quot;]],
 h:[&quot;The bucket leaks more and more: churn has almost doubled, cost per new customer is up 73%, because word of mouth is turning negative (Elena Carminati).&quot;,&quot;Measures such as “requests closed per agent” and “features released” reward speed at the expense of quality: the same customer calls back three times, half of the releases have critical bugs.&quot;,&quot;Already in 2024: developer attrition 17%, training 18 hours, first response 9 hours, NPS 29. These were lead indicators visible before the 2025 collapse.&quot;,&quot;Workload before deadlines goes to the heart of the promise (responding even in busy weeks): it is not just an S issue.&quot;]}
