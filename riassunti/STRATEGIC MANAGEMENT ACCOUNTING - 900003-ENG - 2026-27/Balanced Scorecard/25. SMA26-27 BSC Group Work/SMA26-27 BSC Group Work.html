    &lt;a href=&quot;#casi&quot;&gt;&lt;rect x=&quot;110&quot; y=&quot;382&quot; width=&quot;180&quot; height=&quot;58&quot; rx=&quot;12&quot; class=&quot;s-brick&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;200&quot; y=&quot;408&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;I sette casi&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;200&quot; y=&quot;426&quot; text-anchor=&quot;middle&quot;&gt;7 problemi strategici&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#lit&quot;&gt;&lt;rect x=&quot;395&quot; y=&quot;392&quot; width=&quot;170&quot; height=&quot;58&quot; rx=&quot;12&quot; class=&quot;s-slate&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;480&quot; y=&quot;418&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Scopus + PRISMA&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;480&quot; y=&quot;436&quot; text-anchor=&quot;middle&quot;&gt;nel file, non nei 20&#x27;&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#consegna&quot;&gt;&lt;rect x=&quot;675&quot; y=&quot;382&quot; width=&quot;175&quot; height=&quot;58&quot; rx=&quot;12&quot; class=&quot;s-slate&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;762&quot; y=&quot;408&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Consegna e voto&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;762&quot; y=&quot;426&quot; text-anchor=&quot;middle&quot;&gt;5 blocchi, rubrica, 8 errori&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#brief&quot;&gt;&lt;rect x=&quot;395&quot; y=&quot;470&quot; width=&quot;170&quot; height=&quot;40&quot; rx=&quot;20&quot; class=&quot;s-card&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;480&quot; y=&quot;495&quot; text-anchor=&quot;middle&quot;&gt;Date e regole del lavoro&lt;/text&gt;&lt;/a&gt;
    &lt;path class=&quot;ln&quot; d=&quot;M480 285 L480 392&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
   &lt;/svg&gt;
   &lt;figcaption&gt;Le frecce grigie partono dal lavoro di gruppo verso i suoi componenti; quelle in terracotta mostrano come i concetti si passano il testimone: la value proposition orienta gli obiettivi, ogni freccia della mappa è un&#x27;ipotesi, le misure la mettono alla prova.&lt;/figcaption&gt;
  &lt;/figure&gt;
 &lt;/div&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;brief&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 1 · &lt;span class=&quot;badge b-slide&quot;&gt;dalle slide 2–5, 13&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Il lavoro di gruppo in breve&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;Ogni gruppo analizza &lt;b&gt;un&lt;/b&gt; caso aziendale e progetta per esso una &lt;span class=&quot;term&quot;&gt;Balanced Scorecard&lt;/span&gt; (BSC: sistema di misurazione che traduce la strategia in obiettivi e indicatori su quattro prospettive): strategy map, obiettivi, misure, target e iniziative. In più cerca su &lt;b&gt;Scopus&lt;/b&gt; gli studi sulla BSC nel settore del caso; la ricerca va nelle slide ma &lt;b&gt;non si presenta&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid g4&quot;&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;big&quot;&gt;3&lt;/div&gt;studenti per gruppo (il gruppo 7 ne ha due)&lt;/div&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;big&quot;&gt;7&lt;/div&gt;casi, uno per gruppo&lt;/div&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;big&quot;&gt;20&#x27;&lt;/div&gt;di presentazione: si chiude allo scadere, finita o no&lt;/div&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;big&quot;&gt;0–3&lt;/div&gt;punti aggiunti al voto d&#x27;esame di ciascun membro, uguali per tutti&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:34px&quot;&gt;Quattro date&lt;/h3&gt;
  &lt;figure&gt;
   &lt;svg viewBox=&quot;0 0 900 170&quot; role=&quot;img&quot; aria-label=&quot;Linea del tempo delle quattro date&quot;&gt;
    &lt;line x1=&quot;60&quot; y1=&quot;70&quot; x2=&quot;850&quot; y2=&quot;70&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;4&quot;/&gt;
    &lt;g&gt;&lt;circle cx=&quot;110&quot; cy=&quot;70&quot; r=&quot;13&quot; class=&quot;s-slate&quot; stroke-width=&quot;3&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;110&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot;&gt;10 novembre&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;110&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;Lezione&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;110&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot;&gt;presentazione di gruppi e casi&lt;/text&gt;&lt;/g&gt;
    &lt;g&gt;&lt;circle cx=&quot;340&quot; cy=&quot;70&quot; r=&quot;16&quot; class=&quot;s-acc&quot; stroke-width=&quot;4&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;340&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--acc)&quot; style=&quot;fill:var(--acc)&quot;&gt;29 nov., 23:59&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;340&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Scadenza&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;340&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot;&gt;il file .pptx va ai docenti&lt;/text&gt;&lt;/g&gt;
    &lt;g&gt;&lt;circle cx=&quot;570&quot; cy=&quot;70&quot; r=&quot;13&quot; class=&quot;s-slate&quot; stroke-width=&quot;3&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;570&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot;&gt;1 dicembre&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;570&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;Discussione&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;570&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot;&gt;gruppi 1, 2 e 3&lt;/text&gt;&lt;/g&gt;
    &lt;g&gt;&lt;circle cx=&quot;800&quot; cy=&quot;70&quot; r=&quot;13&quot; class=&quot;s-slate&quot; stroke-width=&quot;3&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;800&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot;&gt;2 dicembre&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;800&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;Discussione&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;800&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot;&gt;gruppi 4, 5, 6 e 7&lt;/text&gt;&lt;/g&gt;
    &lt;text class=&quot;t-m&quot; x=&quot;455&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot;&gt;Tutti i membri di ogni gruppo partecipano a entrambe le lezioni di discussione.&lt;/text&gt;
   &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;h3&gt;La presentazione in cinque blocchi&lt;/h3&gt;
  &lt;p class=&quot;muted small&quot;&gt;Scorri i passi: è l&#x27;ordine in cui raccontare il lavoro nei 20 minuti.&lt;/p&gt;
  &lt;div class=&quot;steps card&quot; data-steps&gt;
   &lt;div class=&quot;step on&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Blocco 1&lt;/div&gt;&lt;h4&gt;L&#x27;azienda e la sua strategia&lt;/h4&gt;&lt;p&gt;Mission, vision e scelta strategica &lt;b&gt;con parole vostre&lt;/b&gt;; la &lt;span class=&quot;term&quot;&gt;value proposition&lt;/span&gt; (la promessa di valore al cliente: perché dovrebbe scegliere voi); i due o tre problemi che contano di più nei numeri.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Spiegazione: non copiate lo slogan del caso. Dimostrate di aver capito &lt;i&gt;quale&lt;/i&gt; problema strategico i dati rivelano: è il primo criterio della rubrica (&quot;la value proposition e i problemi chiave derivano dai fatti del caso&quot;).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Blocco 2&lt;/div&gt;&lt;h4&gt;La strategy map&lt;/h4&gt;&lt;p&gt;Tra &lt;b&gt;10 e 16 obiettivi&lt;/b&gt;, ciascuno con almeno un legame di causa ed effetto. La storia si racconta &lt;b&gt;dal basso verso l&#x27;alto&lt;/b&gt;: da learning and growth fino al vertice.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Blocco 3&lt;/div&gt;&lt;h4&gt;La scorecard&lt;/h4&gt;&lt;p&gt;Una tabella con una riga per obiettivo: misura, calcolo, lag o lead, valore attuale, target, iniziativa, owner (il responsabile).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Blocco 4&lt;/div&gt;&lt;h4&gt;Implementazione&lt;/h4&gt;&lt;p&gt;Chi è coinvolto, &lt;span class=&quot;term&quot;&gt;cascading&lt;/span&gt; (declinazione della scorecard aziendale in scorecard di unità, coerenti con quella di livello superiore) ad almeno un&#x27;unità, frequenza del reporting, principale rischio del disegno.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Blocco 5&lt;/div&gt;&lt;h4&gt;Le domande del caso&lt;/h4&gt;&lt;p&gt;Risposte brevi alle quattro domande in fondo al vostro caso (le trovate nella sezione &lt;a href=&quot;#casi&quot;&gt;I sette casi&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:30px&quot;&gt;Cosa deve mostrare il lavoro&lt;/h3&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Quattro prospettive&lt;/h4&gt;Learning and growth, internal processes, customer, financial, e la logica che le lega.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Value proposition&lt;/h4&gt;Operational excellence, customer intimacy o product leadership: quale, e perché.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Strategy map&lt;/h4&gt;Ogni freccia è un&#x27;ipotesi di causa ed effetto che si può verificare.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Lag e lead&lt;/h4&gt;Misure di risultato e i &lt;i&gt;driver&lt;/i&gt; che le anticipano.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Target e iniziative&lt;/h4&gt;Numeri con una data, e azioni con un owner.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Sostenibilità&lt;/h4&gt;Dove rilevante: aspetti con double materiality, collocati secondo il loro percorso (integrazione, non-market perspective o derived scorecard), e cosa sta in cima.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Il gruppo deve presentare in classe la ricerca su Scopus?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;No. La ricerca sta nel file (due slide + PRISMA, dopo la presentazione), viene valutata, ma non usa nessuno dei 20 minuti.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Il gruppo 2 presenta il 1° dicembre: deve venire anche il 2?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Sì: tutti i membri di ogni gruppo partecipano a entrambe le lezioni di discussione.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;In quale blocco va il cascading?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Nel blocco 4, Implementazione: almeno un&#x27;unità (per esempio un hotel di Nove Lune o un magazzino di LPI) con la propria scorecard derivata da quella aziendale.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;bsc&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 2 · &lt;span class=&quot;badge b-add&quot;&gt;spiegazione&lt;/span&gt; &lt;span class=&quot;badge b-slide&quot;&gt;slide 4&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Le basi che il brief dà per scontate&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;Il brief elenca cosa il lavoro deve mostrare, ma non rispiega i concetti: li avete visti nelle lezioni precedenti sulla Balanced Scorecard. Qui li riprendiamo in breve, perché la rubrica li valuta tutti.&lt;/p&gt;
  &lt;p class=&quot;note small&quot;&gt;Nota sul materiale del corso: in questa sessione non è stato possibile elencare i file della cartella &lt;i&gt;corso/&lt;/i&gt;, quindi i richiami alle altre lezioni qui sotto sono dedotti dai riferimenti presenti nelle slide (per esempio &quot;the three options&quot;, &quot;quality cost categories&quot;, &quot;ROI and residual income&quot;) e non attribuiti a un file preciso. Verificali sulle lezioni corrispondenti.&lt;/p&gt;

  &lt;h3&gt;Le quattro prospettive&lt;/h3&gt;
  &lt;p&gt;La BSC (Kaplan e Norton, 1992) affianca alle misure finanziarie altre tre prospettive. L&#x27;idea chiave: i numeri finanziari dicono &lt;i&gt;cosa è successo&lt;/i&gt;; le altre prospettive misurano ciò che lo farà succedere.&lt;/p&gt;
  &lt;figure&gt;
   &lt;svg viewBox=&quot;0 0 900 300&quot; role=&quot;img&quot; aria-label=&quot;Le quattro prospettive impilate dal basso verso l&#x27;alto&quot;&gt;
    &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
    &lt;rect x=&quot;40&quot; y=&quot;10&quot; width=&quot;560&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s-brick&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;60&quot; y=&quot;38&quot;&gt;Financial&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;60&quot; y=&quot;56&quot;&gt;Come ci vedono gli azionisti (o: come usiamo le risorse per la missione)&lt;/text&gt;
    &lt;rect x=&quot;40&quot; y=&quot;80&quot; width=&quot;560&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s-ochre&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;60&quot; y=&quot;108&quot;&gt;Customer&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;60&quot; y=&quot;126&quot;&gt;Come ci vedono i clienti: la value proposition mantenuta&lt;/text&gt;
    &lt;rect x=&quot;40&quot; y=&quot;150&quot; width=&quot;560&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s-slate&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;60&quot; y=&quot;178&quot;&gt;Internal processes&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;60&quot; y=&quot;196&quot;&gt;In quali processi dobbiamo eccellere per mantenere la promessa&lt;/text&gt;
    &lt;rect x=&quot;40&quot; y=&quot;220&quot; width=&quot;560&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s-sage&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;60&quot; y=&quot;248&quot;&gt;Learning and growth&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;60&quot; y=&quot;266&quot;&gt;Persone, sistemi informativi, cultura che rendono possibili i processi&lt;/text&gt;
    &lt;path class=&quot;ln-acc&quot; d=&quot;M640 270 L640 20&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
    &lt;text class=&quot;t&quot; x=&quot;660&quot; y=&quot;150&quot; font-weight=&quot;600&quot;&gt;la storia si legge&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;660&quot; y=&quot;168&quot; font-weight=&quot;600&quot;&gt;dal basso verso l&#x27;alto&lt;/text&gt;
    &lt;text class=&quot;t-m&quot; x=&quot;660&quot; y=&quot;196&quot;&gt;ogni livello è causa&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;660&quot; y=&quot;212&quot;&gt;del livello sopra&lt;/text&gt;
    &lt;text class=&quot;t-m&quot; x=&quot;660&quot; y=&quot;40&quot;&gt;lag: risultati&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;660&quot; y=&quot;262&quot;&gt;lead: driver&lt;/text&gt;
   &lt;/svg&gt;
   &lt;figcaption&gt;Nel lavoro di gruppo la mappa va raccontata proprio così: &quot;partiamo da learning and growth e risaliamo fino al vertice&quot; (slide 6).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;La value proposition: tre discipline&lt;/h3&gt;
  &lt;p&gt;Il brief chiede di scegliere &lt;b&gt;una&lt;/b&gt; delle tre &lt;span class=&quot;term&quot;&gt;value disciplines&lt;/span&gt; (discipline di valore) di Treacy e Wiersema, e di dire perché. L&#x27;idea è che un&#x27;impresa eccelle in una e si tiene &quot;a livello di settore&quot; nelle altre due. La scelta decide quali processi interni diventano critici.&lt;/p&gt;
  &lt;div data-tabs class=&quot;p-ochre&quot;&gt;
   &lt;div class=&quot;tabbar&quot;&gt;&lt;button&gt;Operational excellence&lt;/button&gt;&lt;button&gt;Customer intimacy&lt;/button&gt;&lt;button&gt;Product leadership&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;&lt;h4&gt;Operational excellence &lt;small class=&quot;muted&quot;&gt;eccellenza operativa&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Promessa:&lt;/b&gt; il prezzo o il costo totale più basso, con affidabilità e senza seccature.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Processi critici:&lt;/b&gt; gestione operativa, logistica, qualità, standardizzazione. &lt;b&gt;Misure tipiche:&lt;/b&gt; costo per unità, errori, puntualità, produttività.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Nei casi:&lt;/b&gt; LPI lo dichiara apertamente (&quot;the most reliable and the cheapest&quot;).&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;&lt;h4&gt;Customer intimacy &lt;small class=&quot;muted&quot;&gt;vicinanza al cliente&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Promessa:&lt;/b&gt; una soluzione su misura e una relazione che dura; si guadagna sul valore di lungo periodo del cliente, non sulla singola vendita.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Processi critici:&lt;/b&gt; gestione della relazione, conoscenza del cliente, servizio. &lt;b&gt;Misure tipiche:&lt;/b&gt; retention, quota di ricavi dai clienti esistenti, soddisfazione, tempi di risposta.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Nei casi (lettura da argomentare):&lt;/b&gt; Nove Lune (&quot;every guest is known by name&quot;), Contabilis (&quot;the accountant&#x27;s best colleague&quot;), Torrenti che passa a vendere una rete &quot;che non si ferma&quot;.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;&lt;h4&gt;Product leadership &lt;small class=&quot;muted&quot;&gt;leadership di prodotto&lt;/small&gt;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Promessa:&lt;/b&gt; il prodotto migliore e più nuovo; i clienti pagano un premio per la novità.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Processi critici:&lt;/b&gt; innovazione, sviluppo prodotto, time-to-market. &lt;b&gt;Misure tipiche:&lt;/b&gt; ricavi da prodotti nuovi, tempi dal concept al lancio, lanci nei tempi.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Nei casi:&lt;/b&gt; Ardesia vuole essere &quot;the first brand&quot; a portare ogni nuova tecnologia.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:30px&quot;&gt;Lag e lead indicators&lt;/h3&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Lag indicator&lt;/b&gt; (indicatore di risultato, &quot;in ritardo&quot;): misura un esito già avvenuto. Esempi: ROI, ricavi, tasso di clienti che riacquistano. Dice se la strategia &lt;i&gt;ha&lt;/i&gt; funzionato.&lt;/div&gt;
   &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Lead indicator&lt;/b&gt; (indicatore anticipatore, &lt;i&gt;driver&lt;/i&gt;): misura ciò che produce l&#x27;esito, e si muove prima. Esempi: ore di formazione, tempo di prima risposta. Dice se la strategia &lt;i&gt;sta per&lt;/i&gt; funzionare.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Una stessa misura può essere lag rispetto all&#x27;obiettivo sotto e lead rispetto a quello sopra: dipende dalla posizione nella catena causale. Il brief chiede &lt;b&gt;almeno un lead per ogni prospettiva&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;card game&quot; id=&quot;game&quot;&gt;
   &lt;h4&gt;Gioco: lag o lead?&lt;/h4&gt;
   &lt;p class=&quot;small muted&quot;&gt;Misure prese dai casi. Scegli e leggi il perché.&lt;/p&gt;
   &lt;ul&gt;&lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Perché non si possono scegliere tutte e tre le value disciplines?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Perché richiedono processi, persone e misure diversi, spesso in tensione (ridurre il costo per ordine contro personalizzare il servizio). Si eccelle in una e si sta &quot;a livello&quot; nelle altre; la scelta orienta la prospettiva dei processi interni.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Una scorecard con sole misure lag che problema ha?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Dice cosa è successo, non cosa succederà: il management se ne accorge quando è tardi. È uno degli otto errori comuni (slide 15).&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;In che ordine si racconta la mappa e perché?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Dal basso (learning and growth) verso l&#x27;alto, perché le frecce vanno dalle cause agli effetti: persone e sistemi → processi → clienti → risultati finanziari (o missione).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;map&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 3 · &lt;span class=&quot;badge b-slide&quot;&gt;slide 4–6&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;La strategy map&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;La &lt;span class=&quot;term&quot;&gt;strategy map&lt;/span&gt; (mappa strategica) è il disegno degli obiettivi strategici nelle quattro prospettive, collegati da frecce. Ogni freccia è un&#x27;&lt;b&gt;ipotesi di causa ed effetto&lt;/b&gt; (&quot;se miglioriamo X, allora migliora Y&quot;) che si può verificare con i dati.&lt;/p&gt;
  &lt;div class=&quot;grid g3&quot;&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Dimensione&lt;/h4&gt;Tra &lt;b&gt;10 e 16&lt;/b&gt; obiettivi nelle prospettive. Obiettivi &lt;b&gt;specifici dell&#x27;azienda&lt;/b&gt;, non generici.&lt;/div&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Legami&lt;/h4&gt;Ogni obiettivo ha &lt;b&gt;almeno un&lt;/b&gt; legame di causa ed effetto con un altro. Storia da learning and growth fino in cima.&lt;/div&gt;
   &lt;div class=&quot;card&quot; style=&quot;background:var(--acc-bg);border:0&quot;&gt;&lt;h4 style=&quot;color:var(--acc)&quot;&gt;Casi speciali&lt;/h4&gt;&lt;b&gt;Cosa sta in cima:&lt;/b&gt; business case, mission first o balanced (TVO e Valfonda: cosa sostituisce il profitto?). &lt;b&gt;Sostenibilità:&lt;/b&gt; l&#x27;aspetto è rilevante? Arriva all&#x27;azienda attraverso i mercati? Poi scegliete una delle tre opzioni, e dite perché.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:30px&quot;&gt;Esempio interattivo &lt;span class=&quot;badge b-add&quot;&gt;esempio inventato&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Una piccola catena di librerie che punta sulla customer intimacy (non è uno dei sette casi). &lt;b&gt;Tocca un obiettivo&lt;/b&gt;: si accendono le sue cause e i suoi effetti, e sotto compare l&#x27;ipotesi con la misura.&lt;/p&gt;
  &lt;figure class=&quot;sm&quot; id=&quot;sm&quot;&gt;&lt;svg viewBox=&quot;0 0 900 440&quot; role=&quot;img&quot; aria-label=&quot;Strategy map d&#x27;esempio&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
  &lt;div class=&quot;card&quot; id=&quot;sm-info&quot; aria-live=&quot;polite&quot;&gt;&lt;span class=&quot;muted&quot;&gt;Nessun obiettivo selezionato.&lt;/span&gt;&lt;/div&gt;

  &lt;h3 style=&quot;margin-top:30px&quot;&gt;Cosa sta in cima alla mappa&lt;/h3&gt;
  &lt;p&gt;Nelle imprese for-profit il vertice è finanziario. Ma due casi (TVO, azienda pubblica senza scopo di lucro, e Valfonda, cooperativa che non massimizza il profitto) obbligano a chiedersi cosa sostituisce il profitto. Le slide nominano tre architetture:&lt;/p&gt;
  &lt;figure&gt;
   &lt;svg viewBox=&quot;0 0 900 210&quot; role=&quot;img&quot; aria-label=&quot;Tre architetture del vertice della mappa&quot;&gt;
    &lt;g transform=&quot;translate(20,10)&quot;&gt;&lt;text class=&quot;t-h&quot; x=&quot;125&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;Business case&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;s-brick&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;125&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot;&gt;Financial&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;74&quot; width=&quot;170&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-ochre&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;93&quot; text-anchor=&quot;middle&quot;&gt;Customer&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;110&quot; width=&quot;170&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-slate&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot;&gt;Processes&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;146&quot; width=&quot;170&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-sage&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot;&gt;Learning&lt;/text&gt;
     &lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot;&gt;tutto (anche la sostenibilità) serve al profitto&lt;/text&gt;&lt;/g&gt;
    &lt;g transform=&quot;translate(320,10)&quot;&gt;&lt;text class=&quot;t-h&quot; x=&quot;125&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;Mission first&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;s-acc&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;125&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot;&gt;Missione&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;74&quot; width=&quot;80&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-ochre&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;80&quot; y=&quot;93&quot; text-anchor=&quot;middle&quot;&gt;Customer&lt;/text&gt;
     &lt;rect x=&quot;130&quot; y=&quot;74&quot; width=&quot;80&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-brick&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;170&quot; y=&quot;93&quot; text-anchor=&quot;middle&quot;&gt;Financial&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;110&quot; width=&quot;170&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-slate&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot;&gt;Processes&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;146&quot; width=&quot;170&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-sage&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot;&gt;Learning&lt;/text&gt;
     &lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot;&gt;il denaro è un mezzo o un vincolo&lt;/text&gt;&lt;/g&gt;
    &lt;g transform=&quot;translate(620,10)&quot;&gt;&lt;text class=&quot;t-h&quot; x=&quot;125&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;Balanced&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;30&quot; width=&quot;80&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;s-acc&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;80&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot;&gt;Missione&lt;/text&gt;
     &lt;rect x=&quot;130&quot; y=&quot;30&quot; width=&quot;80&quot; height=&quot;34&quot; rx=&quot;8&quot; class=&quot;s-brick&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;170&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot;&gt;Financial&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;74&quot; width=&quot;170&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-ochre&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;93&quot; text-anchor=&quot;middle&quot;&gt;Customer&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;110&quot; width=&quot;170&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-slate&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot;&gt;Processes&lt;/text&gt;
     &lt;rect x=&quot;40&quot; y=&quot;146&quot; width=&quot;170&quot; height=&quot;30&quot; rx=&quot;8&quot; class=&quot;s-sage&quot;/&gt;&lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot;&gt;Learning&lt;/text&gt;
     &lt;text class=&quot;t-m&quot; x=&quot;125&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot;&gt;due vertici di pari rango&lt;/text&gt;&lt;/g&gt;
   &lt;/svg&gt;
   &lt;figcaption&gt;Spiegazione: nel &lt;i&gt;mission first&lt;/i&gt; la prospettiva finanziaria non scompare, scende accanto a quella dei clienti come condizione di sostenibilità economica (per TVO: costo per km, penali; per Valfonda: il prezzo del latte pagato ai soci). È l&#x27;impostazione di Kaplan (2001) per il non-profit, vedi &lt;a href=&quot;#approfondire&quot;&gt;Per approfondire&lt;/a&gt;.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;&quot;Migliorare la qualità&quot; è un buon obiettivo per la mappa?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;No: è generico, potrebbe appartenere a qualsiasi azienda. Va reso specifico: per Ardesia, &quot;batterie affidabili nel primo anno&quot; (misura: guasti batteria per 1.000 bici ↓).&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Come si &quot;verifica&quot; una freccia?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Si guarda se, nel tempo, i movimenti della misura causa precedono quelli della misura effetto (per esempio: quando il turnover dei tecnici sale, i rinnovi dei contratti calano l&#x27;anno dopo?). Se la relazione non regge, l&#x27;ipotesi strategica va rivista.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;TVO: dove va la prospettiva finanziaria?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Con un vertice mission first (mobilità accessibile, affidabile, sostenibile) la prospettiva finanziaria scende come vincolo/mezzo: costo per vehicle km competitivo per la gara, penali ridotte, finanziamento dei bus elettrici. È la domanda 1 del caso: va argomentata.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-sage&quot; id=&quot;sost&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 4 · &lt;span class=&quot;badge b-slide&quot;&gt;slide 4, 6, domande dei casi&lt;/span&gt; &lt;span class=&quot;badge b-add&quot;&gt;spiegazione&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Sostenibilità nella scorecard&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;Il brief chiede di trattare la sostenibilità &quot;dove rilevante&quot; con tre passaggi: scegliere gli aspetti con &lt;span class=&quot;term&quot;&gt;double materiality&lt;/span&gt;, collocarli secondo il loro &lt;span class=&quot;term&quot;&gt;path&lt;/span&gt; (percorso), dire cosa sta in cima. L&#x27;errore da evitare è la &quot;sostenibilità di lato&quot;: misure elencate ma non legate alla strategia, &quot;un simbolo, non uno strumento&quot;.&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;div&gt;
    &lt;h3&gt;Double materiality&lt;/h3&gt;
    &lt;p&gt;Un aspetto è rilevante se lo è in almeno una di due direzioni:&lt;/p&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Impact materiality&lt;/b&gt; (inside-out): l&#x27;impatto dell&#x27;azienda su persone e ambiente. Es.: le emissioni dei caseifici Valfonda, gli infortuni in LPI.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Financial materiality&lt;/b&gt; (outside-in): l&#x27;effetto della questione su risultati, flussi di cassa, accesso al capitale dell&#x27;azienda. Es.: i retailer tedeschi che escluderanno i fornitori senza riduzione delle emissioni.&lt;/div&gt;
    &lt;p class=&quot;small muted&quot;&gt;Il concetto è quello degli standard europei ESRS (fonte esterna, vedi &lt;a href=&quot;#approfondire&quot;&gt;Per approfondire&lt;/a&gt;).&lt;/p&gt;
   &lt;/div&gt;
   &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 420 260&quot; role=&quot;img&quot; aria-label=&quot;Le due direzioni della double materiality&quot;&gt;
     &lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;/marker&gt;&lt;marker id=&quot;ar4&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
     &lt;circle cx=&quot;110&quot; cy=&quot;130&quot; r=&quot;75&quot; class=&quot;s-slate&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;110&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot;&gt;Azienda&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;110&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot;&gt;valore, rischi&lt;/text&gt;
     &lt;circle cx=&quot;320&quot; cy=&quot;130&quot; r=&quot;75&quot; class=&quot;s-sage&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text class=&quot;t-h&quot; x=&quot;320&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot;&gt;Persone e&lt;/text&gt;&lt;text class=&quot;t-h&quot; x=&quot;320&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot;&gt;ambiente&lt;/text&gt;
     &lt;path d=&quot;M170 95 Q215 60 258 95&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;215&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot;&gt;impact&lt;/text&gt;
     &lt;path d=&quot;M258 165 Q215 200 170 165&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar4)&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;215&quot; y=&quot;222&quot; text-anchor=&quot;middle&quot;&gt;financial&lt;/text&gt;
    &lt;/svg&gt;
   &lt;/figure&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le tre opzioni: dove collocare un aspetto&lt;/h3&gt;
  &lt;p&gt;Le &quot;tre opzioni&quot; a cui rimandano le slide sono quelle della &lt;span class=&quot;term&quot;&gt;Sustainability Balanced Scorecard&lt;/span&gt; (Figge, Hahn, Schaltegger e Wagner, 2002). La domanda decisiva è il percorso: l&#x27;aspetto arriva all&#x27;azienda &lt;b&gt;attraverso i mercati&lt;/b&gt; (clienti, prezzi, fornitori, costi) o &lt;b&gt;fuori dai mercati&lt;/b&gt; (regole, comunità, opinione pubblica, sindacati)?&lt;/p&gt;
  &lt;div class=&quot;card steps&quot; data-steps id=&quot;flow&quot;&gt;
   &lt;div class=&quot;step on&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Domanda 1&lt;/div&gt;&lt;h4&gt;L&#x27;aspetto è rilevante (double materiality)?&lt;/h4&gt;&lt;p&gt;Se no, resta fuori dalla scorecard: si gestisce con altri strumenti (compliance, report di sostenibilità). Se sì, passa alla domanda 2.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Domanda 2&lt;/div&gt;&lt;h4&gt;Arriva all&#x27;azienda attraverso i mercati?&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Sì →&lt;/b&gt; &lt;b&gt;Integrazione&lt;/b&gt;: l&#x27;aspetto diventa un obiettivo dentro le quattro prospettive esistenti. Es.: Valfonda, le emissioni per kg sono una richiesta dei retailer, cioè dei &lt;i&gt;clienti&lt;/i&gt;: si integrano nella prospettiva customer e nei processi.&lt;/p&gt;&lt;p&gt;&lt;b&gt;No →&lt;/b&gt; &lt;b&gt;Non-market perspective&lt;/b&gt;: si aggiunge una quinta prospettiva per gli aspetti che agiscono fuori dal mercato. Es.: la responsabilità per la raccolta delle batterie usate di Ardesia nasce da una norma UE.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Opzione 3&lt;/div&gt;&lt;h4&gt;Derived scorecard&lt;/h4&gt;&lt;p&gt;Una scorecard ambientale o sociale &lt;b&gt;derivata&lt;/b&gt; da quella principale, per coordinare e gestire in dettaglio gli aspetti già individuati (per esempio per la funzione qualità e sostenibilità). Non sostituisce le prime due: ne discende.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Infine&lt;/div&gt;&lt;h4&gt;Cosa sta in cima?&lt;/h4&gt;&lt;p&gt;Business case, mission first o balanced. Una volta collocati gli aspetti, dite se la sostenibilità serve al profitto o se sta accanto (o sopra) al risultato economico.&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:28px&quot;&gt;Target per unità o target totale? &lt;span class=&quot;badge b-slide&quot;&gt;TVO q.4, Valfonda q.3&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Un target di &lt;b&gt;intensità&lt;/b&gt; (emissioni per kg o per vehicle km) misura l&#x27;&lt;i&gt;efficienza&lt;/i&gt;; un target &lt;b&gt;assoluto&lt;/b&gt; (tonnellate totali) misura la &lt;i&gt;riduzione reale&lt;/i&gt;. Se il volume cambia, i due raccontano storie diverse. Muovi i cursori:&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;intens&quot;&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;iv&quot;&gt;Volume prodotto (indice, anno base = 100)&lt;/label&gt;&lt;input id=&quot;iv&quot; type=&quot;range&quot; min=&quot;60&quot; max=&quot;140&quot; value=&quot;100&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;ii&quot;&gt;Variazione dell&#x27;intensità (per unità)&lt;/label&gt;&lt;input id=&quot;ii&quot; type=&quot;range&quot; min=&quot;-40&quot; max=&quot;10&quot; value=&quot;-30&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;p style=&quot;margin:10px 0 0&quot; aria-live=&quot;polite&quot; id=&quot;intens-out&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Infortuni e lavoro interinale in LPI: solo tema &quot;S&quot; di ESG?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Anche strategico: gli interinali poco formati producono errori nel picco (i quattro clienti persi &quot;after Black Friday&quot;), le penali salgono, l&#x27;assicurazione ha alzato il premio del 30%. L&#x27;aspetto passa dai mercati (clienti, costi), quindi si presta all&#x27;integrazione nei processi e in learning and growth.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Che cosa significa &quot;sustainability on the side&quot;?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Misure di sostenibilità aggiunte in fondo, senza frecce verso la strategia: un simbolo, non uno strumento (slide 15).&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quando serve una non-market perspective?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Quando l&#x27;aspetto è rilevante ma non passa per clienti, prezzi o costi: agisce tramite leggi, enti pubblici, comunità, media. Allora non entra bene in nessuna delle quattro prospettive di mercato.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-ochre&quot; id=&quot;score&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 5 · &lt;span class=&quot;badge b-slide&quot;&gt;slide 5, 7, 15&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;La tabella della scorecard&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;Una riga per ogni obiettivo della mappa, con otto colonne obbligatorie. Ecco la riga d&#x27;esempio della slide (non legata ai casi):&lt;/p&gt;
  &lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
   &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Objective&lt;/th&gt;&lt;th&gt;Measure&lt;/th&gt;&lt;th&gt;How it is calculated&lt;/th&gt;&lt;th&gt;Lag / lead&lt;/th&gt;&lt;th&gt;Current value&lt;/th&gt;&lt;th&gt;Target&lt;/th&gt;&lt;th&gt;Initiative&lt;/th&gt;&lt;th&gt;Owner&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
   &lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Keep our loyal customers&lt;/td&gt;&lt;td&gt;Repeat customer rate ↑&lt;/td&gt;&lt;td&gt;Clienti con 2+ acquisti nell&#x27;anno ÷ tutti i clienti; dati della carta fedeltà&lt;/td&gt;&lt;td&gt;Lag&lt;/td&gt;&lt;td&gt;35%&lt;/td&gt;&lt;td&gt;45% entro 2028&lt;/td&gt;&lt;td&gt;Programma fedeltà per i clienti abituali&lt;/td&gt;&lt;td&gt;Marketing manager&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Tocca una colonna per capirne il ruolo:&lt;/p&gt;
  &lt;div data-tabs&gt;
   &lt;div class=&quot;tabbar&quot;&gt;&lt;button&gt;Objective&lt;/button&gt;&lt;button&gt;Measure&lt;/button&gt;&lt;button&gt;Calcolo&lt;/button&gt;&lt;button&gt;Lag/lead&lt;/button&gt;&lt;button&gt;Current value&lt;/button&gt;&lt;button&gt;Target&lt;/button&gt;&lt;button&gt;Initiative&lt;/button&gt;&lt;button&gt;Owner&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;Cosa vogliamo ottenere, con un verbo e specifico per l&#x27;azienda. Deve coincidere con un riquadro della strategy map.&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;Come sapremo se ci stiamo riuscendo. &lt;b&gt;Una&lt;/b&gt; per obiettivo, &lt;b&gt;due al massimo&lt;/b&gt;, ciascuna con la direzione desiderata &lt;b&gt;↑ o ↓&lt;/b&gt;: &quot;un numero senza ↑ o ↓ è un&#x27;informazione, non un obiettivo&quot;.&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;Formula e fonte del dato (numeratore ÷ denominatore; da dove viene). Rende la misura precisa e replicabile, uno dei criteri della rubrica.&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;Se misura un esito o un driver. &lt;b&gt;Ogni prospettiva&lt;/b&gt; deve avere almeno un lead indicator.&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;Il valore dal caso, oppure &lt;b&gt;&quot;not measured yet&quot;&lt;/b&gt; se l&#x27;azienda non lo misura (in molti casi è proprio questo il problema: per Torrenti nessuno misura quanto resta offline un sensore). Ogni numero ipotizzato va nella slide &lt;b&gt;Assumptions&lt;/b&gt;.&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;Un &lt;b&gt;numero&lt;/b&gt; e un &lt;b&gt;orizzonte temporale&lt;/b&gt; (&quot;45% entro il 2028&quot;). Realistico: la rubrica premia target &quot;realistic and dated&quot;.&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;L&#x27;azione concreta che sposta la misura. Non deve ripetere la misura: &quot;aumentare la retention&quot; &lt;b&gt;non&lt;/b&gt; è un&#x27;iniziativa; &quot;programma fedeltà&quot; sì.&lt;/div&gt;
   &lt;div class=&quot;panel card tint&quot;&gt;Una persona/funzione responsabile (dai ruoli del caso: CEO, head of service, HR manager…). Senza owner, nessuno risponde del target.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:30px&quot;&gt;Otto errori comuni &lt;small class=&quot;muted&quot;&gt;· tocca una carta per il rimedio&lt;/small&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid g4&quot; id=&quot;flips&quot;&gt;
   &lt;div class=&quot;card flip p-brick&quot;&gt;&lt;div class=&quot;front&quot;&gt;&lt;h4&gt;Too many measures&lt;/h4&gt;40 indicatori sono una lista, non una strategia.&lt;/div&gt;&lt;div class=&quot;back&quot;&gt;&lt;h4&gt;Rimedio&lt;/h4&gt;10–16 obiettivi, 1 misura ciascuno (max 2). Le altre restano nei report operativi.&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;card flip&quot;&gt;&lt;div class=&quot;front&quot;&gt;&lt;h4&gt;Generic objectives&lt;/h4&gt;&quot;Improve quality&quot; potrebbe appartenere a chiunque.&lt;/div&gt;&lt;div class=&quot;back&quot;&gt;&lt;h4&gt;Rimedio&lt;/h4&gt;Usate i fatti del caso: &quot;rispondere entro 4 ore anche nelle settimane delle scadenze fiscali&quot;.&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;card flip&quot;&gt;&lt;div class=&quot;front&quot;&gt;&lt;h4&gt;Boxes without arrows&lt;/h4&gt;O frecce che nessuno sa spiegare.&lt;/div&gt;&lt;div class=&quot;back&quot;&gt;&lt;h4&gt;Rimedio&lt;/h4&gt;Per ogni freccia sappiate dire &quot;se… allora…&quot; e come la verifichereste.&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;card flip&quot;&gt;&lt;div class=&quot;front&quot;&gt;&lt;h4&gt;Only lag indicators&lt;/h4&gt;Dice cosa è successo, non cosa succederà.&lt;/div&gt;&lt;div class=&quot;back&quot;&gt;&lt;h4&gt;Rimedio&lt;/h4&gt;Almeno un lead per prospettiva: formazione, turnover, tempi, posti vacanti.&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;card flip&quot;&gt;&lt;div class=&quot;front&quot;&gt;&lt;h4&gt;Targets without a date&lt;/h4&gt;Un target vuole numero e orizzonte.&lt;/div&gt;&lt;div class=&quot;back&quot;&gt;&lt;h4&gt;Rimedio&lt;/h4&gt;&quot;Turnover tecnici ≤ 10% entro dicembre 2027&quot;, non &quot;ridurre il turnover&quot;.&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;card flip&quot;&gt;&lt;div class=&quot;front&quot;&gt;&lt;h4&gt;Initiatives that repeat the measure&lt;/h4&gt;&quot;Increase customer retention&quot; non è un&#x27;iniziativa.&lt;/div&gt;&lt;div class=&quot;back&quot;&gt;&lt;h4&gt;Rimedio&lt;/h4&gt;Un progetto con owner e budget: &quot;analisi dei motivi di disdetta con intervista a ogni cliente che lascia&quot;.&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;card flip&quot;&gt;&lt;div class=&quot;front&quot;&gt;&lt;h4&gt;Measures without a direction&lt;/h4&gt;Senza ↑ o ↓ è informazione, non obiettivo.&lt;/div&gt;&lt;div class=&quot;back&quot;&gt;&lt;h4&gt;Rimedio&lt;/h4&gt;Mettete la freccia accanto a ogni misura.&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;card flip&quot;&gt;&lt;div class=&quot;front&quot;&gt;&lt;h4&gt;Sustainability on the side&lt;/h4&gt;Misure elencate ma non legate alla strategia.&lt;/div&gt;&lt;div class=&quot;back&quot;&gt;&lt;h4&gt;Rimedio&lt;/h4&gt;Collocate l&#x27;aspetto con una delle tre opzioni e collegatelo con frecce.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:30px&quot;&gt;Implementazione &lt;span class=&quot;badge b-add&quot;&gt;spiegazione&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid g4&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Chi è coinvolto&lt;/h4&gt;Chi disegna, chi alimenta i dati, chi discute i risultati (board, direttori, unità).&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cascading&lt;/h4&gt;Almeno un&#x27;unità con la sua scorecard: obiettivi coerenti con quelli aziendali, misure che l&#x27;unità controlla davvero.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Reporting&lt;/h4&gt;Frequenza adatta alla misura: i lead si guardano spesso (settimana, mese), i lag meno.&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Rischio principale&lt;/h4&gt;Es.: incentivi che spingono nella direzione opposta (il bonus sugli ordini di Torrenti), dati che non esistono, resistenze.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Cosa scrivo come current value se il caso non lo dà?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&quot;Not measured yet&quot;. Se invece stimate un numero, va nella slide &lt;b&gt;Assumptions&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;&quot;Ridurre gli errori di spedizione&quot; è un&#x27;iniziativa?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;No, ripete la misura. Un&#x27;iniziativa è per esempio &quot;formazione di 4 giorni e affiancamento per gli interinali del picco&quot;.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quante misure al massimo per obiettivo?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Due; meglio una. Ognuna con ↑ o ↓.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-slate&quot; id=&quot;lit&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 6 · &lt;span class=&quot;badge b-slide&quot;&gt;slide 8–11&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Ricerca su Scopus e diagramma PRISMA&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;Cercate su &lt;b&gt;Scopus&lt;/b&gt; (banca dati di abstract e citazioni di Elsevier) gli studi su come la BSC è applicata nel &lt;b&gt;settore del vostro caso&lt;/b&gt;. Si leggono solo &lt;b&gt;titoli e abstract&lt;/b&gt;: niente lettura dei full text, niente commento ai contenuti.&lt;/p&gt;

  &lt;h3&gt;Costruisci la stringa di ricerca&lt;/h3&gt;
  &lt;p class=&quot;small muted&quot;&gt;Le parole chiave per settore sono quelle suggerite dalle slide (&quot;starting points only: choose and justify yours&quot;). La sintassi del campo combinato titolo-abstract-keyword è quella documentata da Elsevier &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;qb&quot;&gt;
   &lt;div class=&quot;chips&quot; id=&quot;qb-case&quot;&gt;&lt;/div&gt;
   &lt;div class=&quot;chips&quot; id=&quot;qb-kw&quot;&gt;&lt;/div&gt;
   &lt;div class=&quot;chips&quot; id=&quot;qb-opt&quot;&gt;&lt;button class=&quot;btn on&quot; data-o=&quot;year&quot;&gt;2000–2026&lt;/button&gt;&lt;button class=&quot;btn on&quot; data-o=&quot;type&quot;&gt;Articoli + review&lt;/button&gt;&lt;button class=&quot;btn on&quot; data-o=&quot;lang&quot;&gt;Solo inglese&lt;/button&gt;&lt;/div&gt;
   &lt;div class=&quot;code&quot; id=&quot;qb-out&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;grid g2&quot; style=&quot;margin-top:22px&quot;&gt;
   &lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Slide 1&lt;/div&gt;&lt;h4&gt;Il metodo&lt;/h4&gt;&lt;ol&gt;&lt;li&gt;&lt;b&gt;Keywords&lt;/b&gt; e come le avete combinate (es. &quot;balanced scorecard&quot; AND (hotel OR hospitality), cercate in title, abstract, keywords).&lt;/li&gt;&lt;li&gt;&lt;b&gt;Periodo&lt;/b&gt; (es. 2000–2026).&lt;/li&gt;&lt;li&gt;&lt;b&gt;Tipo di fonti&lt;/b&gt;: articoli, review, conference paper, report professionali.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Lingua&lt;/b&gt; (es. solo inglese).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot; style=&quot;background:var(--acc-bg);border:0&quot;&gt;&lt;div class=&quot;kicker&quot; style=&quot;color:var(--acc)&quot;&gt;Slide 2&lt;/div&gt;&lt;h4&gt;I risultati&lt;/h4&gt;&lt;ol&gt;&lt;li&gt;&lt;b&gt;Risultati totali&lt;/b&gt; con stringa e filtri.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Fonti potenzialmente rilevanti&lt;/b&gt; e quelle escluse perché non pertinenti, con il motivo.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Fonti valide&lt;/b&gt;: solo il numero, senza commento; l&#x27;elenco completo va in fondo.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Diagramma PRISMA&lt;/b&gt; fino ai record eleggibili per il full text screening.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:30px&quot;&gt;Il diagramma PRISMA, fino al full text screening&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;PRISMA&lt;/span&gt; (Preferred Reporting Items for Systematic reviews and Meta-Analyses) è uno standard per documentare le revisioni della letteratura; il suo &lt;i&gt;flow diagram&lt;/i&gt; mostra quanti record entrano ed escono a ogni fase. Qui vi fermate prima della lettura integrale: i record &lt;b&gt;eligible for full text screening&lt;/b&gt; sono le vostre fonti valide. Prova con numeri inventati: i conti devono tornare.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;pr&quot;&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;pr1&quot;&gt;Records identified in Scopus&lt;/label&gt;&lt;input id=&quot;pr1&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;300&quot; value=&quot;120&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;pr2&quot;&gt;Removed before screening&lt;/label&gt;&lt;input id=&quot;pr2&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;25&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;pr3&quot;&gt;Excluded on title/abstract&lt;/label&gt;&lt;input id=&quot;pr3&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;60&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;figure style=&quot;margin:10px 0 0&quot;&gt;&lt;svg viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;Diagramma PRISMA&quot;&gt;
    &lt;defs&gt;&lt;marker id=&quot;ar5&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
    &lt;rect x=&quot;0&quot; y=&quot;10&quot; width=&quot;32&quot; height=&quot;120&quot; rx=&quot;6&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;16&quot; y=&quot;70&quot; fill=&quot;var(--paper)&quot; font-size=&quot;12&quot; font-family=&quot;var(--sans)&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 16 70)&quot;&gt;Identification&lt;/text&gt;
    &lt;rect x=&quot;0&quot; y=&quot;140&quot; width=&quot;32&quot; height=&quot;150&quot; rx=&quot;6&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;16&quot; y=&quot;215&quot; fill=&quot;var(--paper)&quot; font-size=&quot;12&quot; font-family=&quot;var(--sans)&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 16 215)&quot;&gt;Screening&lt;/text&gt;
    &lt;rect x=&quot;50&quot; y=&quot;20&quot; width=&quot;380&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s-slate&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;240&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Records identified in Scopus&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;240&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; id=&quot;pa&quot;&gt;n =&lt;/text&gt;
    &lt;rect x=&quot;490&quot; y=&quot;10&quot; width=&quot;360&quot; height=&quot;80&quot; rx=&quot;10&quot; class=&quot;s-card&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;670&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Records removed before screening&lt;/text&gt;&lt;text class=&quot;t-m&quot; x=&quot;670&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot;&gt;fuori periodo, tipo o lingua errati, duplicati&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;670&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; id=&quot;pb&quot;&gt;n =&lt;/text&gt;
    &lt;rect x=&quot;50&quot; y=&quot;150&quot; width=&quot;380&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s-slate&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;240&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Records screened on title and abstract&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;240&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot; id=&quot;pc&quot;&gt;n =&lt;/text&gt;
    &lt;rect x=&quot;490&quot; y=&quot;150&quot; width=&quot;360&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;s-card&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;670&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Records excluded, with reasons&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;670&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot; id=&quot;pd&quot;&gt;n =&lt;/text&gt;
    &lt;rect x=&quot;50&quot; y=&quot;230&quot; width=&quot;380&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;255&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-family=&quot;var(--sans)&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Records eligible for full text screening&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;276&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-family=&quot;var(--sans)&quot; font-size=&quot;13&quot; id=&quot;pe&quot;&gt;n =&lt;/text&gt;
    &lt;path class=&quot;ln-acc&quot; d=&quot;M240 80 L240 146&quot; marker-end=&quot;url(#ar5)&quot;/&gt;&lt;path class=&quot;ln-acc&quot; d=&quot;M430 50 L486 50&quot; marker-end=&quot;url(#ar5)&quot;/&gt;
    &lt;path class=&quot;ln-acc&quot; d=&quot;M240 210 L240 226&quot; marker-end=&quot;url(#ar5)&quot;/&gt;&lt;path class=&quot;ln-acc&quot; d=&quot;M430 180 L486 180&quot; marker-end=&quot;url(#ar5)&quot;/&gt;
    &lt;text class=&quot;t-m&quot; x=&quot;490&quot; y=&quot;265&quot;&gt;Stop qui: la lettura integrale non è richiesta.&lt;/text&gt;
   &lt;/svg&gt;&lt;/figure&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:30px&quot;&gt;Nelle slide, non nei 20 minuti&lt;/h3&gt;
  &lt;figure&gt;
   &lt;svg viewBox=&quot;0 0 900 120&quot; role=&quot;img&quot; aria-label=&quot;Struttura del file da consegnare&quot;&gt;
    &lt;rect x=&quot;0&quot; y=&quot;30&quot; width=&quot;400&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;Presentazione&lt;/text&gt;&lt;text x=&quot;200&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--paper)&quot; font-family=&quot;var(--sans)&quot; font-size=&quot;12&quot;&gt;al massimo 20 slide · presentata in classe&lt;/text&gt;
