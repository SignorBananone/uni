&lt;section class=&quot;part p-ochre&quot; id=&quot;attrezzi&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 8 · &lt;span class=&quot;badge b-add&quot;&gt;spiegazione&lt;/span&gt; · formule richieste dalle domande dei casi&lt;/div&gt;
  &lt;h2&gt;Cassetta degli attrezzi: le formule&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;Le domande dei casi chiedono calcoli che le slide non rispiegano. Ecco le definizioni, con il caso in cui servono.&lt;/p&gt;
  &lt;div class=&quot;grid g2&quot;&gt;
   &lt;details open&gt;&lt;summary&gt;ROI e residual income · Torrenti&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;ROI = utile operativo ÷ capitale investito medio&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;RI (residual income) = utile operativo − tasso minimo richiesto × capitale investito&lt;/div&gt;
    &lt;p&gt;Il ROI è un rapporto; il RI è un importo in euro: dice quanto valore si crea &lt;i&gt;oltre&lt;/i&gt; il costo del capitale. Con il 9% del board di Torrenti, un ROI sotto il 9% significa RI negativo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details open&gt;&lt;summary&gt;RevPAR, ADR, occupancy · Nove Lune&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;RevPAR = occupancy × ADR&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Occupancy&lt;/b&gt;: camere vendute ÷ camere disponibili. &lt;b&gt;ADR&lt;/b&gt; (average daily rate): ricavo medio per camera venduta. &lt;b&gt;RevPAR&lt;/b&gt; (revenue per available room): ricavo camere per camera disponibile. Verifica: 2023, 71% × 148 € ≈ 105 €. &lt;b&gt;GOP&lt;/b&gt; (gross operating profit): margine operativo lordo dell&#x27;hotel.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quality costs (costi della qualità) · LPI, Ardesia&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;COQ = prevention + appraisal + internal failure + external failure&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Prevention&lt;/b&gt;: evitare i difetti (formazione, progettazione, qualifica fornitori). &lt;b&gt;Appraisal&lt;/b&gt;: controllarli (ispezioni, test, audit). &lt;b&gt;Internal failure&lt;/b&gt;: difetti trovati prima della consegna (rilavorazioni, scarti). &lt;b&gt;External failure&lt;/b&gt;: difetti trovati dal cliente (resi, garanzie, penali, clienti persi). Idea chiave: spendere in prevention riduce di più i costi di failure.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Churn, costo di acquisizione, ARR · Contabilis&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;Churn rate = clienti persi nell&#x27;anno ÷ clienti a inizio anno&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;Ricavo ricorrente perso = clienti persi × 4.100 €&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;Spesa di acquisizione = nuovi clienti × spesa commerciale per nuovo cliente&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;ARR&lt;/b&gt; (annual recurring revenue): ricavi da abbonamento su base annua.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Net promoter score · Contabilis&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;NPS = % promotori − % detrattori&lt;/div&gt;
    &lt;p&gt;Dalla domanda &quot;con che probabilità ci raccomanderebbe?&quot; (0–10): promotori 9–10, detrattori 0–6. Va da −100 a +100. &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; Reichheld (2003).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Emissioni totali e per unità · Valfonda, TVO&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;formula&quot;&gt;Emissioni totali = intensità (kg CO₂e per kg) × quantità prodotta&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;CO₂e&lt;/b&gt;: CO₂ equivalente, unità che somma gas serra diversi pesandoli per il loro effetto sul clima. Valfonda 2025: 13,4 × 5.500.000 kg ≈ 73.700 t CO₂e.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;

  &lt;h3 style=&quot;margin-top:26px&quot;&gt;Calcolatore: ROI e RI di Torrenti&lt;/h3&gt;
  &lt;p&gt;Cambia il tasso minimo richiesto e guarda quando il residual income diventa negativo. &lt;span class=&quot;badge b-slide&quot;&gt;dati slide 19&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;ri&quot;&gt;
   &lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;rr&quot;&gt;Tasso minimo richiesto&lt;/label&gt;&lt;input id=&quot;rr&quot; type=&quot;range&quot; min=&quot;4&quot; max=&quot;14&quot; step=&quot;0.5&quot; value=&quot;9&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
   &lt;svg viewBox=&quot;0 0 600 220&quot; role=&quot;img&quot; aria-label=&quot;Grafico ROI e residual income&quot; id=&quot;ri-svg&quot;&gt;&lt;/svg&gt;
   &lt;div class=&quot;tscroll&quot; id=&quot;ri-tab&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Perché ROI e RI non bastano a giudicare la strategia &quot;From valves to flow&quot;?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Sono lag e di breve periodo: registrano il calo del margine prodotti e gli investimenti nei servizi, ma non dicono se le basi del nuovo modello (rinnovi, tempi d&#x27;intervento, tecnici formati e stabili) stanno migliorando o peggiorando. In più premiano chi rinvia investimenti.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;LPI 2023: 6,1 milioni di ordini, 99,62% senza errori. Costo degli ordini sbagliati?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Ordini errati = 6.100.000 × 0,38% ≈ 23.180; × 18 € ≈ &lt;b&gt;417.000 €&lt;/b&gt;; con 40.000 € di penali ≈ 457.000 €. Sono costi di external failure.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-brick&quot; id=&quot;casi&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 9 · &lt;span class=&quot;badge b-slide&quot;&gt;slide 16–51&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Sette casi, sette problemi strategici&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;Le sette aziende e tutte le persone sono &lt;b&gt;di fantasia&lt;/b&gt;; i numeri sono realistici ma inventati a scopo didattico. Ogni caso ha la stessa struttura: azienda e strategia, numeri chiave 2023–2025, cosa vede oggi il management, quattro domande. Le citazioni sono rese in italiano.&lt;/p&gt;
  &lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
   &lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Azienda&lt;/th&gt;&lt;th&gt;Settore&lt;/th&gt;&lt;th&gt;Dimensione&lt;/th&gt;&lt;th&gt;Il nodo, in una riga &lt;span class=&quot;badge b-add&quot;&gt;lettura&lt;/span&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
   &lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Torrenti Valvole S.p.A.&lt;/td&gt;&lt;td&gt;Valvole industriali per utility idriche e chimica&lt;/td&gt;&lt;td&gt;410 dip. · 84 M€&lt;/td&gt;&lt;td&gt;Servitization: i servizi crescono, ma report e incentivi guardano ancora alle valvole&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Nove Lune Hotels&lt;/td&gt;&lt;td&gt;Quattro boutique hotel nel Nord Italia&lt;/td&gt;&lt;td&gt;180 dip. al picco · 13,6 M€&lt;/td&gt;&lt;td&gt;Ricavi in crescita, ma la promessa &quot;ti conosciamo per nome&quot; si sta perdendo&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Trasporti Valli Orobiche S.p.A.&lt;/td&gt;&lt;td&gt;Trasporto pubblico su bus, città e valli&lt;/td&gt;&lt;td&gt;640 dip. · 260 bus&lt;/td&gt;&lt;td&gt;Non-profit verso una gara: mancano autisti, cala la qualità&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;Cooperativa Casearia Valfonda&lt;/td&gt;&lt;td&gt;Cooperativa di formaggi DOP&lt;/td&gt;&lt;td&gt;140 aziende socie · 99 M€&lt;/td&gt;&lt;td&gt;I clienti chiedono −30% di emissioni, che nascono nelle aziende dei soci&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;Logistica Padana Integrata S.r.l.&lt;/td&gt;&lt;td&gt;Logistica conto terzi per e-commerce e moda&lt;/td&gt;&lt;td&gt;480 dip. · 58 M€&lt;/td&gt;&lt;td&gt;Operational excellence minata da errori, interinali e infortuni&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;Ardesia Bikes S.p.A.&lt;/td&gt;&lt;td&gt;E-bike premium da montagna e città&lt;/td&gt;&lt;td&gt;520 dip. · 109 M€&lt;/td&gt;&lt;td&gt;Product leadership che arriva sempre seconda&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;Contabilis Cloud S.r.l.&lt;/td&gt;&lt;td&gt;Software cloud per piccoli studi contabili&lt;/td&gt;&lt;td&gt;120 dip. · 18,4 M€&lt;/td&gt;&lt;td&gt;Si acquisiscono clienti, se ne perdono sempre di più&lt;/td&gt;&lt;/tr&gt;
   &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Nella tabella dei numeri, la mini-linea è &lt;span class=&quot;ok&quot;&gt;verde&lt;/span&gt; se l&#x27;andamento va nella direzione buona, &lt;span class=&quot;ko&quot;&gt;mattone&lt;/span&gt; se va in quella sbagliata, grigia se neutra.&lt;/p&gt;
  &lt;div data-tabs id=&quot;cases&quot;&gt;&lt;div class=&quot;tabbar&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica sui casi&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Valfonda: le emissioni per kg calano del 2,9% dal 2023 al 2025, quelle totali del 7,9%. Che cosa è successo davvero?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Il calo totale viene soprattutto dal minor volume (5.800 → 5.500 t di formaggio), non dall&#x27;efficienza. Un target solo per kg nasconderebbe che la riduzione reale dipende dal produrre meno; uno solo totale premierebbe il calo dei soci. È la domanda 3: va motivata.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Contabilis 2025: quanta parte dei ricavi ricorrenti si perde con i clienti che lasciano?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;468 × 4.100 € ≈ 1,92 M€, mentre per acquisire 1.168 nuovi clienti si spendono 1.168 × 1.900 € ≈ 2,22 M€. Si paga sempre di più per riempire un secchio che perde sempre di più.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quale misura di Ardesia è di input e quale di output dell&#x27;innovazione?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Input: spesa R&amp;D, ingegneri, brevetti. Output: ricavi da modelli lanciati negli ultimi due anni, mesi dal concept al lancio, modelli lanciati nei tempi. Per una strategia di product leadership contano gli output.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Nove Lune: perché il bonus sul GOP è un rischio per la strategia?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Premia il profitto di breve dell&#x27;hotel, non la formazione né la compilazione dei profili ospiti, che sono i driver della promessa &quot;known by name&quot;. È un incentivo che lavora contro la value proposition.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part p-acc&quot; id=&quot;approfondire&quot;&gt;
 &lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Parte 10 · &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;Per approfondire&lt;/h2&gt;
  &lt;p class=&quot;intro&quot;&gt;Le slide nominano esplicitamente Scopus e il diagramma PRISMA; gli altri concetti (le quattro prospettive, le value disciplines, la strategy map, le tre opzioni per la sostenibilità, la double materiality, i quality costs, il net promoter score, le norme UE sulle batterie) sono usati senza citare gli autori. Qui sotto le fonti originali, trovate con la ricerca web: &lt;b&gt;tutto il contenuto di questa sezione è fonte esterna&lt;/b&gt;, da verificare sul link.&lt;/p&gt;
  &lt;div class=&quot;grid g2 ext-list&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Kaplan, R. S. e Norton, D. P. (1992), &quot;The Balanced Scorecard — Measures That Drive Performance&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Harvard Business Review&lt;/i&gt;, gennaio–febbraio 1992.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; l&#x27;articolo che introduce la BSC, nata da un progetto di ricerca di un anno con 12 aziende; le quattro prospettive (finanziaria, cliente, processi interni, innovazione e apprendimento). &lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;origine di tutto il lavoro di gruppo.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://fenix.iseg.ulisboa.pt/downloadFile/281608120752631/Kaplan%20%20Norton%20(1992).PDF&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF ospitato da ISEG, Universidade de Lisboa&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Kaplan e Norton (1996), &quot;Using the Balanced Scorecard as a Strategic Management System&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Harvard Business Review&lt;/i&gt;, 74(1), pp. 75–85.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; la BSC da sistema di misure a sistema di gestione della strategia, con processi che collegano obiettivi di lungo periodo e azioni di breve; la strategia come insieme di ipotesi da testare con il feedback. &lt;b&gt;Perché conta:&lt;/b&gt; spiega perché il brief dice che ogni freccia è &quot;un&#x27;ipotesi che si può verificare&quot; e perché servono cascading e reporting.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://maaw.info/ArticleSummaries/ArtSumKaplanNorton96.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sintesi su Management And Accounting Web (maaw.info)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Kaplan e Norton (2000), &quot;Having Trouble with Your Strategy? Then Map It&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Harvard Business Review&lt;/i&gt;, settembre–ottobre 2000, pp. 167–176; poi il libro &lt;i&gt;Strategy Maps&lt;/i&gt; (2004).&lt;/p&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; la strategy map come modello standard per rendere visibile il legame tra strategia e lavoro quotidiano, con l&#x27;esempio di Mobil. &lt;b&gt;Perché conta:&lt;/b&gt; è il formato del blocco 2 della presentazione.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://store.hbr.org/product/having-trouble-with-your-strategy-then-map-it/R00509&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda su HBR Store&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Treacy, M. e Wiersema, F. (1993), &quot;Customer Intimacy and Other Value Disciplines&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Harvard Business Review&lt;/i&gt;, 71(1), pp. 84–93; poi il libro &lt;i&gt;The Discipline of Market Leaders&lt;/i&gt; (1995).&lt;/p&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; le tre value disciplines (operational excellence, customer intimacy, product leadership): i leader eccellono in una e restano allo standard di settore nelle altre. &lt;b&gt;Perché conta:&lt;/b&gt; il brief chiede di sceglierne una e dire perché.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://edisciplinas.usp.br/pluginfile.php/4623221/mod_resource/content/1/Customer%20Intimacy%20and%20Other%20Value%20Discuplines%20%28Michael%20Treacy%20and%20Fred%20Wiersema%29.PDF&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Ristampa PDF ospitata dall&#x27;Universidade de São Paulo&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Kaplan, R. S. (2001), &quot;Strategic Performance Measurement and Management in Nonprofit Organizations&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Nonprofit Management and Leadership&lt;/i&gt;, 11(3), pp. 353–370.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; l&#x27;adattamento della BSC al non-profit, con esempi di implementazione: in cima va la missione, non gli obiettivi finanziari. &lt;b&gt;Perché conta:&lt;/b&gt; è la base del &quot;mission first&quot; per TVO e Valfonda.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://doi.org/10.1002/nml.11308&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;doi.org/10.1002/nml.11308&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Figge, F., Hahn, T., Schaltegger, S. e Wagner, M. (2002), &quot;The Sustainability Balanced Scorecard — Linking Sustainability Management to Business Strategy&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Business Strategy and the Environment&lt;/i&gt;, 11(5), pp. 269–284.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; come integrare aspetti ambientali e sociali nella BSC di una business unit; la distinzione tra aspetti di mercato e non di mercato e le opzioni di integrazione, prospettiva aggiuntiva e scorecard derivata. È indicato come l&#x27;articolo più citato della letteratura sulla sustainability BSC. &lt;b&gt;Perché conta:&lt;/b&gt; sono le &quot;three options&quot; del brief.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://doi.org/10.1002/bse.339&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;doi.org/10.1002/bse.339&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;EFRAG, ESRS 1 &quot;General Requirements&quot; (2023) — double materiality&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;European Sustainability Reporting Standards, Regolamento delegato (UE) 2023/2772; in revisione da parte di EFRAG nel 2025.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; la definizione di impact materiality e financial materiality: un tema è materiale se supera almeno uno dei due test. &lt;b&gt;Perché conta:&lt;/b&gt; il brief chiede di scegliere gli aspetti &quot;with double materiality&quot;.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://knowledgehub.efrag.org/eng/interactive/esrs-set-1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EFRAG Knowledge Hub, ESRS Set 1&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Regolamento (UE) 2023/1542 sulle batterie e i rifiuti di batterie&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Norma UE, testo consolidato su EUR-Lex.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; requisiti per tutte le batterie, comprese quelle per i &quot;light means of transport&quot; (e-bike, monopattini); responsabilità estesa del produttore per raccolta e riciclo, con obiettivi di raccolta specifici per queste batterie. &lt;b&gt;Perché conta:&lt;/b&gt; sono le &quot;nuove regole UE&quot; del caso Ardesia (domanda 4).&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2023/1542/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex, Regulation (EU) 2023/1542&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Page, M. J. et al. (2021), &quot;The PRISMA 2020 statement: an updated guideline for reporting systematic reviews&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;BMJ&lt;/i&gt; 2021;372:n71 (anche in &lt;i&gt;PLOS Medicine&lt;/i&gt;).&lt;/p&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; checklist di 27 voci e i flow diagram aggiornati per le revisioni sistematiche; sostituisce PRISMA 2009. &lt;b&gt;Perché conta:&lt;/b&gt; il diagramma che il brief chiede, fermandosi però ai record eleggibili per il full text screening.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://doi.org/10.1136/bmj.n71&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;doi.org/10.1136/bmj.n71&lt;/a&gt; · &lt;a href=&quot;https://www.prisma-statement.org/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;prisma-statement.org&lt;/a&gt; (modelli del diagramma)&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Scopus (Elsevier): ricerca avanzata&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Pagine di supporto Elsevier.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; l&#x27;uso del campo combinato TITLE-ABS-KEY (titolo, abstract, keyword), delle virgolette per le frasi e delle regole di precedenza degli operatori booleani. &lt;b&gt;Perché conta:&lt;/b&gt; la ricerca deve essere &quot;chiara e replicabile&quot;: la stringa esatta va nella slide del metodo.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://www.elsevier.support/scopus/answer/how-can-i-best-use-the-advanced-search&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Elsevier Support, Advanced search&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;ASQ, &quot;Cost of Quality&quot; (modello prevention–appraisal–failure)&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;American Society for Quality; il modello risale a Feigenbaum (HBR, 1956).&lt;/p&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; le quattro categorie di costi della qualità: prevention, appraisal, internal failure, external failure. &lt;b&gt;Perché conta:&lt;/b&gt; le &quot;quality cost categories&quot; delle domande LPI 2 e Ardesia 3.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://www.asq.org/quality-resources/cost-of-quality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;asq.org, Cost of Quality&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Reichheld, F. F. (2003), &quot;The One Number You Need to Grow&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Harvard Business Review&lt;/i&gt;, 81(12), pp. 46–54.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; l&#x27;origine del net promoter score (promotori − detrattori). La tesi che basti un solo numero è stata criticata in letteratura. &lt;b&gt;Perché conta:&lt;/b&gt; l&#x27;NPS di Contabilis scende da 41 a 18.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://www.proquest.com/docview/204699007&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Record su ProQuest&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Vandermerwe, S. e Rada, J. (1988), &quot;Servitization of Business: Adding Value by Adding Services&quot;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;i&gt;European Management Journal&lt;/i&gt;, 6(4), pp. 314–324.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; l&#x27;articolo che conia &quot;servitization&quot;: le imprese aggiungono servizi all&#x27;offerta di prodotto, in pacchetti orientati al cliente. &lt;b&gt;Perché conta:&lt;/b&gt; è la strategia di Torrenti ed è una delle parole chiave suggerite per la ricerca del caso 1.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://doi.org/10.1016/0263-2373(88)90033-3&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;doi.org/10.1016/0263-2373(88)90033-3&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;GHG Protocol, Corporate Accounting and Reporting Standard&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;WRI e WBCSD.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; come si costruisce l&#x27;inventario delle emissioni di un&#x27;organizzazione, divise in scope 1, 2 e 3. &lt;b&gt;Perché conta:&lt;/b&gt; per Valfonda l&#x27;80% delle emissioni nasce nelle aziende dei soci, fuori dal perimetro diretto: è il problema di &quot;come la scorecard arriva alle aziende&quot; (domanda 4).&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;a href=&quot;https://ghgprotocol.org/corporate-standard&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ghgprotocol.org/corporate-standard&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;
   &lt;h3&gt;Autoverifica&lt;/h3&gt;
   &lt;details&gt;&lt;summary&gt;Da quale articolo vengono le &quot;three options&quot; per la sostenibilità?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Da Figge, Hahn, Schaltegger e Wagner (2002), la Sustainability Balanced Scorecard.&lt;/div&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Quale fonte giustifica il vertice &quot;mission first&quot; per un ente non-profit?&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;Kaplan (2001), sulla BSC nelle organizzazioni non-profit.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;footer&gt;
 &lt;div class=&quot;wrap&quot;&gt;

  &lt;p class=&quot;small&quot;&gt;Fonte principale: &lt;i&gt;corso/Balanced Scorecard/25. SMA26-27 BSC Group Work/SMA26-27 BSC Group Work.pdf&lt;/i&gt;. Le aziende e le persone dei casi sono di fantasia, come dichiarano le slide.&lt;/p&gt;

 [&quot;Repeat customer rate (esempio della slide 7)&quot;,&quot;lag&quot;,&quot;Nella slide è indicato proprio come Lag: misura la fedeltà già ottenuta.&quot;],

/* strategy map */
var SM={rows:[[&quot;Financial&quot;,&quot;s-brick&quot;,20],[&quot;Customer&quot;,&quot;s-ochre&quot;,125],[&quot;Internal processes&quot;,&quot;s-slate&quot;,230],[&quot;Learning and growth&quot;,&quot;s-sage&quot;,335]],
 n:{F1:[0,610,&quot;Utile operativo in crescita&quot;,&quot;Utile operativo ↑ · lag&quot;,&quot;È il vertice: per un&#x27;impresa for-profit tutto converge qui.&quot;],
  F2:[0,330,&quot;Più ricavi dai clienti fedeli&quot;,&quot;Ricavi da clienti con 2+ acquisti ÷ ricavi totali ↑ · lag&quot;,&quot;Se i clienti fedeli comprano di più, crescono i ricavi a margine più alto.&quot;],

  C2:[1,610,&quot;Consigli che sorprendono&quot;,&quot;Quota di clienti che compra un libro consigliato ↑ · lead&quot;,&quot;Se il consiglio è azzeccato, il cliente torna: è la promessa della customer intimacy.&quot;],
  P1:[2,610,&quot;Conoscere ogni lettore&quot;,&quot;Clienti con profilo di lettura completo ↑ · lead&quot;,&quot;Se conosciamo i gusti, i consigli migliorano.&quot;],

 nt:&quot;&quot;,
 rp:&quot;Ogni mattina i quattro general manager ricevono occupancy, ADR e RevPAR del giorno prima; ogni mese i fondatori guardano il GOP per hotel. Un general manager prende un bonus del 10% dello stipendio se l&#x27;hotel raggiunge il GOP di budget. Il database ospiti esiste, ma il front desk compila un profilo solo quando c&#x27;è tempo. Le recensioni le legge l&#x27;assistente marketing e non si discutono nelle riunioni di direzione.&quot;,
 q:[[&quot;Chiara Moroni, cofondatrice&quot;,&quot;I ricavi sono saliti del 17% in due anni e la banca è contenta. Allora perché sento che stiamo diventando un hotel come tutti gli altri?&quot;],[&quot;Stefano Galli, revenue manager&quot;,&quot;Le camere sono deperibili: una camera vuota stanotte è persa per sempre. Le agenzie riempiono camere che altrimenti non venderemmo, e la tariffa media continua a salire.&quot;],[&quot;Elena Conti, general manager a Verona&quot;,&quot;Ogni primavera ho persone nuove al front desk. Quando hanno imparato a conoscere gli ospiti abituali, la stagione è finita. Nessuno mi paga per formarle: sono pagata sul profitto.&quot;],[&quot;Andrea Moroni, cofondatore&quot;,&quot;I nostri ospiti migliori tornavano ogni anno e lo raccontavano agli amici. Voglio sapere quanti ne abbiamo ancora.&quot;]],
 d:[&quot;I ricavi sono cresciuti del 17% in due anni. La strategia funziona? Argomentate con almeno quattro numeri della tabella.&quot;,&quot;Cosa richiede la value proposition di Nove Lune ai processi interni e alle persone? Progettate la prospettiva learning and growth per una forza lavoro con il 45% di turnover.&quot;,&quot;Progettate la scorecard di gruppo e quella di un singolo hotel. Quali obiettivi restano uguali e quali devono cambiare per l&#x27;hotel stagionale di Como?&quot;,&quot;Il punteggio delle recensioni online è un lead o un lag indicator? Argomentate entrambe le tesi e decidete dove va nella vostra mappa.&quot;],
 k:[[&quot;Crescita ricavi rispetto al 2023&quot;,&quot;—&quot;,&quot;+10,3%&quot;,&quot;+17,2%&quot;],[&quot;GOP in euro (M€)&quot;,&quot;3,83&quot;,&quot;3,97&quot;,&quot;3,94&quot;],[&quot;Commissioni / ricavi&quot;,&quot;8,7%&quot;,&quot;9,1%&quot;,&quot;9,6%&quot;],[&quot;RevPAR verificato (occ. × ADR)&quot;,&quot;105,1&quot;,&quot;115,4&quot;,&quot;123,1&quot;]],
 h:[&quot;Le misure di volume e prezzo (occupancy, ADR, RevPAR) salgono; quelle della promessa (ospiti di ritorno 22%→17%, prenotazioni dirette 31%→24%, recensioni, reclami) scendono.&quot;,&quot;Il GOP in euro è piatto dal 2024: la crescita dei ricavi va in commissioni e costi.&quot;,&quot;Il bonus sul GOP e il report quotidiano su RevPAR guardano solo al breve; nessuno misura ritorni né profili ospiti.&quot;,&quot;Per Como, stagionale, contano riassunzione dello stesso personale da un anno all&#x27;altro e passaggio di consegne sulle preferenze degli ospiti.&quot;]},
{t:&quot;Trasporti Valli Orobiche S.p.A. (TVO)&quot;,s:&quot;Trasporto pubblico su bus · 640 dipendenti · 260 bus&quot;,st:&quot;La sfida: la gara del 2028&quot;,
 co:&quot;TVO gestisce i bus di una città di medie dimensioni e delle valli intorno: 58 linee, 2.100 fermate, circa 23 milioni di passeggeri l&#x27;anno. Tutte le azioni sono di enti pubblici. Non mira al profitto: lo statuto chiede «mobilità accessibile, affidabile e sostenibile per la comunità». Un contratto di servizio con la Regione fissa 14,3 milioni di vehicle km l&#x27;anno: la Regione paga un importo fisso per km e una penale per ogni km non effettuato. Le tariffe coprono circa un terzo dei costi.&quot;,
 sx:&quot;Il contratto scade nel 2027. Nel 2028 la Regione assegnerà il servizio con una &lt;b&gt;gara pubblica&lt;/b&gt;, a cui si attendono operatori privati: i criteri danno il 60% dei punti alla qualità (puntualità, affidabilità, soddisfazione, emissioni) e il 40% al prezzo. TVO non trova autisti: i giovani non vogliono turni che iniziano alle 5 del mattino e la patente per bus costa circa 4.000 €. Quando mancano autisti, le corse si cancellano.&quot;,
 r:[[&quot;Passeggeri (milioni)&quot;,21.4,22.8,23.1,1,&quot;&quot;],[&quot;Vehicle km effettuati (milioni)&quot;,14.2,14.0,13.8,1,&quot;&quot;],[&quot;Corse cancellate&quot;,0.7,2.1,3.5,-1,&quot;%&quot;],[&quot;Bus entro 3 minuti dall&#x27;orario&quot;,86,83,81,1,&quot;%&quot;],[&quot;Soddisfazione clienti (su 10)&quot;,6.9,6.7,6.5,1,&quot;&quot;],[&quot;Ricavi da tariffe (M€)&quot;,18.6,19.5,19.9,1,&quot;&quot;],[&quot;Pagamenti dalla Regione (M€)&quot;,38.5,40.0,41.2,0,&quot;&quot;],[&quot;Penali per km non effettuati (k€)&quot;,120,310,540,-1,&quot;&quot;],[&quot;Costi operativi (M€)&quot;,58.2,61.0,62.4,-1,&quot;&quot;],[&quot;Costo operativo per vehicle km (€)&quot;,4.10,4.36,4.52,-1,&quot;&quot;],[&quot;Autisti in servizio&quot;,412,398,385,1,&quot;&quot;],[&quot;Posti di autista vacanti&quot;,18,31,44,-1,&quot;&quot;],[&quot;Giorni di malattia per autista&quot;,11,13,15,-1,&quot;&quot;],[&quot;Bus a zero emissioni (su 260)&quot;,9,14,22,1,&quot;&quot;]],
 nt:&quot;Altri ricavi (pubblicità, servizi scolastici): circa 1,7 M€ l&#x27;anno. Il risultato d&#x27;esercizio è vicino allo zero in tutti e tre gli anni.&quot;,
 rp:&quot;Il board riceve un report trimestrale preparato per la Regione: km effettuati, penali, passeggeri e budget. La puntualità è misurata dal GPS su ogni bus, ma i dati non sono analizzati per linea né per fascia oraria. La soddisfazione è rilevata una volta l&#x27;anno da una società esterna. Nel 2024 TVO ha approvato un piano per 80 bus elettrici entro il 2030, finanziato in parte con fondi pubblici; un bus elettrico costa circa il doppio di un diesel.&quot;,
 q:[[&quot;Roberto Pesenti, general manager&quot;,&quot;Nel 2028 competiamo con aziende che gestiscono bus in dieci paesi. Se non sappiamo mostrare alla Regione la nostra qualità in numeri, perdiamo il contratto, e la comunità perde la sua azienda.&quot;],[&quot;Anna Locatelli, head of operations&quot;,&quot;Pianifico i turni ogni settimana con 44 autisti in meno. Di solito cancello le corse serali nelle valli, dove viaggia poca gente. Ma per quei pochi è l&#x27;unico bus.&quot;],[&quot;Davide Brembilla, HR manager&quot;,&quot;Paghiamo lo stesso stipendio di tutti. Potremmo offrire turni migliori e un aiuto per la patente. Nessuno ha mai misurato cosa trattiene un autista da noi.&quot;],[&quot;Sara Gritti, per i comuni&quot;,&quot;Per noi la domanda è semplice: uno studente dell&#x27;alta valle arriva a scuola in orario?&quot;]],
 d:[&quot;TVO non mira al profitto. Cosa sta in cima alla sua strategy map (business case, mission first o balanced) e dove va la prospettiva finanziaria?&quot;,&quot;Chi è il cliente: il passeggero, la Regione che paga il contratto o i comuni proprietari dell&#x27;azienda? Mostrate come la vostra prospettiva customer gestisce la questione.&quot;,&quot;Costruite la catena dalla carenza di autisti alle penali e alla soddisfazione. Quali lead indicators avrebbero avvisato il management un anno prima?&quot;,&quot;Elettrificazione: nelle quattro prospettive o in una non-market perspective? Target di emissioni per vehicle km (misura l&#x27;efficienza) o totale (misura la riduzione reale)?&quot;],
 k:[[&quot;Km mancanti rispetto ai 14,3 M del contratto&quot;,&quot;0,1 M&quot;,&quot;0,3 M&quot;,&quot;0,5 M&quot;],[&quot;Penale per km mancante (circa)&quot;,&quot;1,20 €&quot;,&quot;1,03 €&quot;,&quot;1,08 €&quot;],[&quot;Quota bus a zero emissioni&quot;,&quot;3,5%&quot;,&quot;5,4%&quot;,&quot;8,5%&quot;],[&quot;Ricavi totali (tariffe + Regione + altri, M€)&quot;,&quot;58,8&quot;,&quot;61,2&quot;,&quot;62,8&quot;],[&quot;Passeggeri per vehicle km&quot;,&quot;1,51&quot;,&quot;1,63&quot;,&quot;1,67&quot;]],
 h:[&quot;Catena: posti vacanti ↑ (18→44) e malattia ↑ → corse cancellate ↑ (0,7%→3,5%) e puntualità ↓ → km persi e penali ↑ (120→540 k€) → soddisfazione ↓, cioè proprio i criteri di qualità della gara.&quot;,&quot;I posti vacanti e i giorni di malattia erano già in salita nel 2024: sono candidati naturali a lead indicators.&quot;,&quot;La gara pesa la qualità al 60%: i dati GPS esistono già, ma vanno analizzati per linea e fascia oraria.&quot;,&quot;Le cancellazioni serali nelle valli colpiscono pochi passeggeri ma la missione (accessibilità): un obiettivo solo sui passeggeri totali lo nasconderebbe.&quot;]},
{t:&quot;Cooperativa Casearia Valfonda&quot;,s:&quot;Cooperativa di formaggi DOP · 140 aziende socie · 99 M€&quot;,st:&quot;La sfida: −30% di emissioni per kg entro il 2030&quot;,
 co:&quot;Fondata nel 1957 da 23 allevatori. Oggi 140 aziende agricole conferiscono il latte a due caseifici che producono Taleggio DOP (in inglese PDO, denominazione di origine protetta), altri formaggi molli e un formaggio di montagna stagionato fino a due anni, venduti in Italia e sempre più all&#x27;estero. Gli allevatori sono allo stesso tempo &lt;b&gt;proprietari&lt;/b&gt; e unici &lt;b&gt;fornitori&lt;/b&gt; di latte. Lo scopo non è massimizzare il profitto, ma pagare ai soci il miglior prezzo del latte possibile, anno dopo anno: ciò che resta dopo i costi torna ai soci attraverso il prezzo del latte.&quot;,
 sx:&quot;Tre retailer in Germania e Svizzera comprano il 38% del formaggio. Nel 2025 due di loro hanno chiesto a tutti i fornitori di latticini di ridurre le emissioni per kg del &lt;b&gt;30% entro il 2030&lt;/b&gt; rispetto al 2025, con un report annuale: chi non lo farà sarà escluso. Circa l&#x27;80% delle emissioni di un kg di formaggio nasce nelle aziende agricole. Un impianto di biogas per i reflui delle aziende socie costerebbe 6 M€ e taglierebbe le emissioni di circa il 15%. Intanto le aziende calano ogni anno: molti allevatori hanno più di 55 anni e i figli non vogliono continuare.&quot;,
 r:[[&quot;Aziende socie&quot;,152,146,140,1,&quot;&quot;],[&quot;Latte raccolto (milioni di litri)&quot;,58,57,55,1,&quot;&quot;],[&quot;Formaggio prodotto (t)&quot;,5800,5700,5500,1,&quot;&quot;],[&quot;Ricavi (M€)&quot;,96,101,99,1,&quot;&quot;],[&quot;Quota di ricavi da export&quot;,28,31,34,1,&quot;%&quot;],[&quot;Prezzo pagato ai soci (€/100 l)&quot;,52.0,54.5,53.0,1,&quot;&quot;],[&quot;Prezzo medio degli altri caseifici (€/100 l)&quot;,49.5,51.0,50.5,0,&quot;&quot;],[&quot;Aziende senza successore&quot;,31,34,37,-1,&quot;%&quot;],[&quot;Latte da aziende certificate benessere animale&quot;,22,35,41,1,&quot;%&quot;],[&quot;Emissioni per kg di formaggio (kg CO₂e, stima)&quot;,13.8,13.5,13.4,-1,&quot;&quot;],[&quot;Costi energetici dei caseifici (M€)&quot;,3.1,4.6,3.9,-1,&quot;&quot;]],
 nt:&quot;&quot;,
 rp:&quot;Il consiglio, composto da nove allevatori, si riunisce ogni mese: vendite per cliente, scorte di formaggio in stagionatura e prezzo del latte pagabile il mese successivo. Le emissioni sono stimate una volta l&#x27;anno dal responsabile qualità con un foglio di calcolo e valori medi di letteratura, non con i dati di ciascuna azienda. La certificazione di benessere animale è volontaria: le aziende certificate ricevono 1 € in più ogni 100 litri.&quot;,
 q:[[&quot;Giacomo Arnoldi, presidente e allevatore&quot;,&quot;I soci mi chiedono una cosa a ogni riunione: il prezzo del latte. Se parlo di carbonio, mi chiedono chi paga.&quot;],[&quot;Ilaria Fumagalli, export manager&quot;,&quot;In Germania ogni riunione comincia con la CO₂. Il nostro formaggio è eccellente, ma un buyer non può mettere il gusto in un report di sostenibilità.&quot;],[&quot;Marco Bianchi, qualità e sostenibilità&quot;,&quot;Diciamo che le emissioni sono scese. In realtà la nostra stima si è mossa appena, e produciamo meno formaggio di prima. Non sono sicuro di cosa stiamo dicendo al cliente.&quot;],[&quot;Federica Rota, giovane socia&quot;,&quot;Voglio rilevare l&#x27;azienda di mio padre. Ma la stalla nuova costa 400.000 €. Mi serve conoscere il prezzo del latte per i prossimi dieci anni, non per il mese prossimo.&quot;]],
 d:[&quot;Valfonda non massimizza il profitto. Cosa sta in cima alla sua strategy map (mission first o balanced) e cosa misura la sua prospettiva finanziaria?&quot;,&quot;Analizzate il percorso di mercato e non di mercato dei principali temi di sostenibilità. Su questa base scegliete una delle tre opzioni per una sustainability balanced scorecard.&quot;,&quot;Calcolate le emissioni totali del 2023, 2024 e 2025. Un target per kg misura l&#x27;efficienza, un target totale la riduzione reale: quale dovrebbero chiedere i retailer, e perché?&quot;,&quot;La maggior parte delle emissioni nasce nelle aziende socie, che Valfonda non gestisce. Come può la scorecard arrivare alle aziende? Dove va il ricambio generazionale nella vostra mappa?&quot;],
 k:[[&quot;Emissioni totali (t CO₂e)&quot;,&quot;80.040&quot;,&quot;76.950&quot;,&quot;73.700&quot;],[&quot;Variazione vs 2023: per kg / totale&quot;,&quot;—&quot;,&quot;−2,2% / −3,9%&quot;,&quot;−2,9% / −7,9%&quot;],[&quot;Premio di prezzo vs altri caseifici (€/100 l)&quot;,&quot;2,5&quot;,&quot;3,5&quot;,&quot;2,5&quot;],[&quot;Target 2030 richiesto (kg CO₂e per kg)&quot;,&quot;&quot;,&quot;&quot;,&quot;9,38 (= 13,4 × 0,7)&quot;],[&quot;Solo biogas (−15% circa)&quot;,&quot;&quot;,&quot;&quot;,&quot;≈ 11,4: non basta&quot;]],
 h:[&quot;Il calo totale viene più dal volume (meno latte, meno formaggio) che dall&#x27;efficienza: è ciò che preoccupa Marco Bianchi.&quot;,&quot;La richiesta dei retailer passa dal mercato (clienti che comprano il 38%): un buon candidato all&#x27;integrazione nelle quattro prospettive.&quot;,&quot;Il ricambio generazionale tocca la missione (pagare i soci nel lungo periodo) e i volumi di latte: può stare in learning and growth o accanto al vertice in un&#x27;architettura balanced.&quot;,&quot;Per raggiungere le aziende: misure e incentivi a livello di socio (dati di emissione per azienda, premio di prezzo come per il benessere animale), cioè una forma di cascading verso i fornitori-proprietari.&quot;]},
{t:&quot;Logistica Padana Integrata S.r.l. (LPI)&quot;,s:&quot;Logistica conto terzi · 480 dipendenti · 58 M€&quot;,st:&quot;«I più affidabili e i più economici»&quot;,
 co:&quot;LPI gestisce i magazzini di 25 clienti che vendono online: moda, cosmetica, articoli sportivi e libri. Riceve e stocca la merce, prepara e imballa ogni ordine, lo spedisce e gestisce i resi. I clienti pagano un prezzo per ordine, fissato in contratti triennali, con livelli di servizio: almeno il &lt;b&gt;99,5%&lt;/b&gt; di ordini senza errori e almeno il &lt;b&gt;95%&lt;/b&gt; degli ordini ricevuti entro le 15 spediti in giornata. Sotto queste soglie LPI paga penali.&quot;,
 sx:&quot;I clienti confrontano i prezzi al centesimo. Il CEO, Alberto Cattaneo, vuole che LPI spedisca al costo per ordine più basso e con meno errori di tutto il Nord Italia: «Non saremo i più creativi. Saremo i più affidabili e i più economici». Nel 2025 il board ha approvato &lt;b&gt;9 M€&lt;/b&gt; per un sorter automatico e robot di picking nel secondo magazzino, da avviare nel 2027; il fornitore promette un taglio del 20% del costo per ordine. Il sistema richiede meno operai, ma più tecnici.&quot;,
 r:[[&quot;Ordini spediti (milioni)&quot;,6.1,7.4,8.0,1,&quot;&quot;],[&quot;Ricavi (M€)&quot;,48.0,55.0,58.0,1,&quot;&quot;],[&quot;Margine operativo&quot;,6.1,4.9,3.8,1,&quot;%&quot;],[&quot;Ordini spediti senza errori&quot;,99.62,99.55,99.41,1,&quot;%&quot;],[&quot;Ordini entro le 15 spediti in giornata&quot;,97,95,92,1,&quot;%&quot;],[&quot;Penali pagate ai clienti (k€)&quot;,40,180,420,-1,&quot;&quot;],[&quot;Clienti a fine anno&quot;,22,24,25,1,&quot;&quot;],[&quot;Clienti persi nell&#x27;anno&quot;,1,3,4,-1,&quot;&quot;],[&quot;Ore lavorate da interinali&quot;,38,46,52,-1,&quot;%&quot;],[&quot;Infortuni per milione di ore&quot;,21,26,31,-1,&quot;&quot;],[&quot;Assenteismo dei dipendenti&quot;,6.2,7.0,7.9,-1,&quot;%&quot;],[&quot;Tecnici per gli impianti automatici&quot;,3,3,4,1,&quot;&quot;]],
 nt:&quot;Correggere un ordine sbagliato (reso, nuova spedizione, nota di credito) costa a LPI in media 18 €.&quot;,
 rp:&quot;Ogni responsabile di magazzino riceve un report settimanale con ordini spediti, ore lavorate e costo per ordine. Errori e spedizioni in giornata si contano solo a fine mese, quando arrivano i report dei clienti. Gli infortuni li registra il responsabile della sicurezza per il registro legale e non fanno parte del report di gestione. A novembre e dicembre i volumi triplicano: LPI assume fino a 300 interinali per sei settimane, con due giorni di formazione.&quot;,
 q:[[&quot;Alberto Cattaneo, CEO&quot;,&quot;Guadagniamo centesimi per ordine. Il nostro unico vantaggio può essere fare lo stesso lavoro a costo più basso e con meno errori di chiunque altro.&quot;],[&quot;Francesca Moretti, operations director&quot;,&quot;Nel picco riempio il magazzino di persone che non ne hanno mai visto uno. Il costo per ordine sembra a posto nel report settimanale, poi gli errori arrivano un mese dopo.&quot;],[&quot;Nicola Testa, key account manager&quot;,&quot;I quattro clienti persi l&#x27;anno scorso non se ne sono andati per il prezzo. Se ne sono andati dopo il Black Friday, quando i loro clienti hanno ricevuto i pacchi sbagliati.&quot;],[&quot;Laura Pellegrini, HR e sicurezza&quot;,&quot;Dietro ogni infortunio c&#x27;è una persona. L&#x27;assicurazione ha anche alzato il premio del 30%. E l&#x27;anno prossimo mi servono dieci tecnici che non riesco a trovare.&quot;]],
 d:[&quot;Quale value proposition persegue LPI? Quali processi interni sono critici per essa, e quali meno importanti?&quot;,&quot;Calcolate il costo degli ordini sbagliati in ogni anno (18 € a ordine) e aggiungete le penali. Classificate questi costi nelle categorie dei quality costs. Quali attività di prevention e appraisal misurereste?&quot;,&quot;Infortuni e lavoro interinale: solo un tema sociale (S) in ottica ESG, o anche strategico per LPI? Collocateli nella vostra mappa.&quot;,&quot;Quali misure mostrerebbero se il progetto di automazione è in linea prima che compaiano i risultati finanziari? Quali misure cambierebbero una volta avviato?&quot;],
 k:[[&quot;Ordini sbagliati (n)&quot;,&quot;23.180&quot;,&quot;33.300&quot;,&quot;47.200&quot;],[&quot;Costo correzione a 18 € (k€)&quot;,&quot;417&quot;,&quot;599&quot;,&quot;850&quot;],[&quot;+ penali = costi di failure (k€)&quot;,&quot;457&quot;,&quot;779&quot;,&quot;1.270&quot;],[&quot;Utile operativo (M€)&quot;,&quot;2,93&quot;,&quot;2,70&quot;,&quot;2,20&quot;],[&quot;Costi di failure / utile operativo&quot;,&quot;16%&quot;,&quot;29%&quot;,&quot;58%&quot;],[&quot;Ricavo per ordine (€)&quot;,&quot;7,87&quot;,&quot;7,43&quot;,&quot;7,25&quot;]],
 h:[&quot;Value proposition: operational excellence. Critici: picking e packing senza errori, spedizione in giornata, gestione del picco; meno critici: innovazione di servizio e personalizzazione.&quot;,&quot;Correzioni e penali sono external failure (difetti scoperti dal cliente); i clienti persi ne sono il costo nascosto. Prevention: formazione degli interinali, procedure; appraisal: controlli a campione prima della spedizione.&quot;,&quot;Il report settimanale non vede errori e infortuni: sono lag che arrivano a fine mese o restano nel registro legale.&quot;,&quot;Automazione: lead come tecnici assunti e formati, avanzamento del progetto, test del sorter; dopo l&#x27;avvio cambiano costo per ordine, mix di ore interinali, tipi di errore.&quot;]},
{t:&quot;Ardesia Bikes S.p.A.&quot;,s:&quot;E-bike premium · 520 dipendenti · 109 M€&quot;,st:&quot;Essere il primo marchio&quot;,
 co:&quot;Fondata nel 2008 da Tommaso Ardesi, ex corridore di mountain bike, e dal suo socio ingegnere. Ardesia progetta i propri telai e integra motore e batteria dentro il telaio, così che una bici elettrica sembri e si guidi come una normale. Le bici costano da 3.500 a 9.000 € e si vendono tramite rivenditori specializzati, che fanno anche l&#x27;assistenza. Durante la pandemia Ardesia ha venduto tutto ciò che produceva; dal 2023 il mercato europeo della bici è in calo: negozi pieni di invenduto e molti marchi che tagliano i prezzi.&quot;,
 sx:&quot;Ardesia non compete sul prezzo: vuole essere il &lt;b&gt;primo marchio&lt;/b&gt; a portare sul mercato ogni nuova tecnologia, con telai più leggeri, batterie con più autonomia, motori più intelligenti. I ciclisti pagano di più perché è la bici che gli altri copieranno l&#x27;anno dopo. Nel 2024 un concorrente tedesco ha lanciato un telaio integrato più leggero sei mesi prima del modello Ardesia. Nel 2025 entrambi i nuovi modelli dell&#x27;anno sono arrivati in ritardo.&quot;,
 r:[[&quot;Bici vendute&quot;,31000,25400,22800,1,&quot;&quot;],[&quot;Prezzo medio di vendita (€)&quot;,4580,4650,4780,1,&quot;&quot;],[&quot;Ricavi (M€)&quot;,142.0,118.1,109.0,1,&quot;&quot;],[&quot;Margine operativo&quot;,11.2,4.5,1.8,1,&quot;%&quot;],[&quot;R&amp;D (% dei ricavi)&quot;,5.8,7.2,8.1,0,&quot;%&quot;],[&quot;Ingegneri&quot;,64,78,81,0,&quot;&quot;],[&quot;Brevetti depositati&quot;,6,9,11,0,&quot;&quot;],[&quot;Ricavi da modelli degli ultimi due anni&quot;,46,38,29,1,&quot;%&quot;],[&quot;Mesi medi dal concept al lancio&quot;,22,26,29,-1,&quot;&quot;],[&quot;Nuovi modelli lanciati nei tempi&quot;,75,33,0,1,&quot;&quot;,[&quot;3 su 4&quot;,&quot;1 su 3&quot;,&quot;0 su 2&quot;]],[&quot;Guasti batteria nel primo anno (per 1.000 bici)&quot;,8,14,19,-1,&quot;&quot;],[&quot;Costi di garanzia (% dei ricavi)&quot;,1.9,2.6,3.4,-1,&quot;%&quot;],[&quot;Scorte presso i rivenditori (settimane)&quot;,14,23,19,-1,&quot;&quot;],[&quot;Soddisfazione dei rivenditori (su 10)&quot;,7.8,7.1,6.8,1,&quot;&quot;]],
 nt:&quot;Nel 2024 Ardesia ha cambiato fornitore di celle per batterie, risparmiando 22 € a batteria.&quot;,
 rp:&quot;Il report mensile mostra vendite per paese e modello, margine per modello e budget di ciascun progetto R&amp;D. Il board valuta l&#x27;R&amp;D con due numeri: spesa totale e brevetti depositati. Ogni progetto ha una data obiettivo di lancio, ma i ritardi non vengono segnalati finché la data non è passata. Le nuove regole UE sulle batterie rendono i produttori responsabili della raccolta e del riciclo delle batterie usate delle e-bike; Ardesia non ha ancora deciso come organizzarla con i rivenditori.&quot;,
 q:[[&quot;Tommaso Ardesi, fondatore e CEO&quot;,&quot;Abbiamo più ingegneri e più brevetti che mai. Allora perché arriviamo sempre secondi?&quot;],[&quot;Valentina Ghisleni, R&amp;D director&quot;,&quot;I miei ingegneri lavorano su tre o quattro progetti alla volta. Il marketing cambia le specifiche a metà strada, e ogni cambio ci costa mesi.&quot;],[&quot;Matteo Ravasio, sales director&quot;,&quot;I rivenditori sono pieni delle bici dell&#x27;anno scorso. Per smaltirle facciamo sconti, e il marchio ne soffre. Un rivenditore che aspetta un modello che non arriva mai comincia a vendere un altro marchio.&quot;],[&quot;Silvia Mazzoleni, quality manager&quot;,&quot;Le nuove celle facevano risparmiare sulla carta. Poi le batterie hanno cominciato a guastarsi, e ogni guasto significa un rivenditore, un ciclista e una batteria di ricambio.&quot;]],
 d:[&quot;Spesa R&amp;D e brevetti salgono, mentre i ricavi dai nuovi modelli scendono. Cosa dice questo sulle misure di input e di output dell&#x27;innovazione? Quali mettereste nella scorecard?&quot;,&quot;Chi è il cliente di Ardesia: il ciclista o il rivenditore? Progettate una prospettiva customer che tenga conto di entrambi.&quot;,&quot;Calcolate i costi di garanzia dal 2023 al 2025 e confrontateli con i risparmi delle nuove celle. In quale categoria dei quality costs rientrano? Quali misure di prevention vanno nella prospettiva dei processi interni?&quot;,&quot;La raccolta delle batterie usate deve entrare ora nella scorecard? È rilevante, arriva ad Ardesia attraverso i mercati, e quale delle tre opzioni si adatta?&quot;],
 k:[[&quot;Costi di garanzia (M€)&quot;,&quot;2,70&quot;,&quot;3,07&quot;,&quot;3,71&quot;],[&quot;Risparmio celle (22 € × bici, M€)&quot;,&quot;—&quot;,&quot;0,56&quot;,&quot;0,50&quot;],[&quot;Garanzia oltre il tasso 2023 (M€)&quot;,&quot;—&quot;,&quot;+0,83&quot;,&quot;+1,64&quot;],[&quot;Ricavi da modelli recenti (M€)&quot;,&quot;65,3&quot;,&quot;44,9&quot;,&quot;31,6&quot;]],
 h:[&quot;Il risparmio sulle celle (circa 0,5 M€ l&#x27;anno) è più che annullato dall&#x27;aumento dei costi di garanzia: un classico costo di external failure.&quot;,&quot;Input (spesa, ingegneri, brevetti) crescono, output (ricavi da modelli nuovi, lanci nei tempi, tempi di sviluppo) peggiorano: per la product leadership contano gli output.&quot;,&quot;Il ciclista paga il premio, il rivenditore vende e assiste: la prospettiva customer può avere obiettivi per entrambi (soddisfazione rivenditori, scorte, guasti percepiti dal ciclista).&quot;,&quot;Prevention: qualifica dei fornitori di celle, test di durata prima del lancio, limite ai progetti in parallelo e congelamento delle specifiche.&quot;]},
{t:&quot;Contabilis Cloud S.r.l.&quot;,s:&quot;Software cloud per studi contabili · 120 dipendenti · 18,4 M€&quot;,st:&quot;«The accountant&#x27;s best colleague»&quot;,
 co:&quot;Fondata nel 2012 a Brescia da Federica Bonetti, commercialista, e da un ingegnere del software. Contabilis vende software cloud a piccoli studi contabili: contabilità, paghe, dichiarazioni dei redditi e fatturazione elettronica. Gli studi pagano un abbonamento mensile per utente (modello &lt;i&gt;SaaS&lt;/i&gt;, software as a service): non c&#x27;è una licenza da comprare. Quando nel 2019 la fatturazione elettronica è diventata obbligatoria tra le imprese italiane, molti piccoli studi sono passati al cloud e Contabilis è cresciuta in fretta. Oggi serve 4.300 studi con 120 dipendenti.&quot;,
 sx:&quot;Contabilis non è il software più economico. Promette due cose: ogni nuova norma fiscale è nel software &lt;b&gt;prima della scadenza&lt;/b&gt;, e un team di supporto di ex commercialisti risponde in fretta, anche nelle settimane più intense dell&#x27;anno. I grandi gruppi del software offrono ora pacchetti a prezzi più bassi, e diversi stanno aggiungendo funzioni di intelligenza artificiale. Contabilis vuole tenersi i clienti essendo più vicina a loro di chiunque altro.&quot;,
 r:[[&quot;Clienti a inizio anno&quot;,2200,2900,3600,1,&quot;&quot;],[&quot;Nuovi clienti nell&#x27;anno&quot;,870,961,1168,1,&quot;&quot;],[&quot;Clienti persi nell&#x27;anno&quot;,170,261,468,-1,&quot;&quot;],[&quot;Ricavi ricorrenti annui a fine anno (M€)&quot;,11.8,14.9,17.6,1,&quot;&quot;],[&quot;Ricavi totali (M€)&quot;,15.2,17.0,18.4,1,&quot;&quot;],[&quot;Margine operativo&quot;,14.0,9.1,4.2,1,&quot;%&quot;],[&quot;Spesa commerciale per nuovo cliente (€)&quot;,1100,1450,1900,-1,&quot;&quot;],[&quot;Richieste di supporto per cliente&quot;,2.2,2.6,3.3,-1,&quot;&quot;],[&quot;Tempo medio alla prima risposta (ore)&quot;,4,9,17,-1,&quot;&quot;],[&quot;Rilasci con un errore critico&quot;,10,27,50,-1,&quot;&quot;,[&quot;1 su 10&quot;,&quot;3 su 11&quot;,&quot;6 su 12&quot;]],[&quot;Sviluppatori a fine anno&quot;,38,41,40,0,&quot;&quot;],[&quot;Sviluppatori usciti nell&#x27;anno&quot;,9,17,24,-1,&quot;%&quot;],[&quot;Ore di formazione per operatore di supporto&quot;,30,18,12,1,&quot;&quot;],[&quot;Net promoter score (da −100 a +100)&quot;,41,29,18,1,&quot;&quot;]],
 nt:&quot;In media un cliente paga circa 4.100 € l&#x27;anno.&quot;,
 rp:&quot;Ogni mese i fondatori guardano nuovi clienti, ricavi ricorrenti e costi. Il supporto è misurato con il numero di richieste chiuse da ogni operatore al giorno; gli sviluppatori con il numero di nuove funzioni rilasciate. Nessuno analizza perché i clienti se ne vanno: lo studio che disdice compila un modulo con un campo di testo libero, che nessuno legge. Il questionario di soddisfazione si invia una volta l&#x27;anno, a settembre.&quot;,
 q:[[&quot;Federica Bonetti, fondatrice e CEO&quot;,&quot;Firmiamo più studi che mai. Allora perché il margine scende ogni anno?&quot;],[&quot;Luca Locatelli, head of customer support&quot;,&quot;Nelle due settimane prima di una scadenza fiscale le richieste triplicano. I miei operatori le chiudono in fretta, ma lo stesso cliente richiama tre volte.&quot;],[&quot;Davide Rota, chief technology officer&quot;,&quot;Ogni mese rilasciamo nuove funzioni per stare al passo con i grandi gruppi, e non abbiamo tempo di correggere quello che abbiamo rilasciato il mese prima. I miei sviluppatori migliori se ne vanno nelle banche.&quot;],[&quot;Elena Carminati, sales director&quot;,&quot;I nuovi clienti arrivano facilmente: il nostro nome è buono. Ma è difficile vendere a uno studio il cui collega della porta accanto ci ha appena lasciati.&quot;]],
 d:[&quot;Clienti e ricavi ricorrenti crescono, mentre margine e net promoter score calano. Calcolate per ogni anno la quota di clienti persi, il ricavo ricorrente perso con loro (4.100 € ciascuno) e la spesa per acquisire nuovi clienti. La strategia funziona?&quot;,&quot;Quale value proposition persegue Contabilis? Quali processi interni sono critici, e quali delle misure attuali (richieste chiuse per operatore, funzioni rilasciate) le remano contro?&quot;,&quot;Costruite la catena da sviluppatori che lasciano e ore di formazione a errori, tempi di risposta, clienti persi e ricavi ricorrenti. Quali lead indicators avrebbero avvisato il management nel 2024?&quot;,&quot;Sicurezza dei dati e carico di lavoro del team prima delle scadenze fiscali: solo temi ESG, o strategici per Contabilis? Ciascuno è rilevante, arriva all&#x27;azienda attraverso i mercati, e quale delle tre opzioni si adatta?&quot;],
 k:[[&quot;Quota clienti persi (churn)&quot;,&quot;7,7%&quot;,&quot;9,0%&quot;,&quot;13,0%&quot;],[&quot;Ricavo ricorrente perso (M€)&quot;,&quot;0,70&quot;,&quot;1,07&quot;,&quot;1,92&quot;],[&quot;Spesa per acquisire nuovi clienti (M€)&quot;,&quot;0,96&quot;,&quot;1,39&quot;,&quot;2,22&quot;],[&quot;Clienti a fine anno (verifica)&quot;,&quot;2.900&quot;,&quot;3.600&quot;,&quot;4.300&quot;]],
 h:[&quot;Il secchio perde sempre di più: churn quasi raddoppiato, costo per nuovo cliente +73%, perché il passaparola diventa negativo (Elena Carminati).&quot;,&quot;Misure come «richieste chiuse per operatore» e «funzioni rilasciate» premiano la velocità a scapito della qualità: lo stesso cliente richiama tre volte, metà dei rilasci ha errori critici.&quot;,&quot;Già nel 2024: sviluppatori usciti 17%, formazione 18 ore, prima risposta 9 ore, NPS 29. Erano lead indicators visibili prima del crollo del 2025.&quot;,&quot;Il carico di lavoro prima delle scadenze tocca il cuore della promessa (rispondere anche nelle settimane intense): non è solo un tema S.&quot;]}
