&lt;li&gt;&lt;span class=&quot;tag w&quot;&gt;Fonte esterna&lt;/span&gt; Viene dal web, con il suo link.&lt;/li&gt;
&lt;/ul&gt;
&lt;p class=&quot;quirk ochre&quot;&gt;&lt;b&gt;Altri file di &lt;code&gt;corso/&lt;/code&gt;: non consultati.&lt;/b&gt; In questa sessione non ho potuto elencare la cartella e i percorsi provati a tentativi non esistevano. Quindi nessun contenuto qui viene dalle lezioni di teoria o dal programma, e i collegamenti con le altre lezioni restano da fare.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/div&gt;

&lt;main&gt;
&lt;section class=&quot;part sage&quot; aria-labelledby=&quot;contesto&quot;&gt;
&lt;div class=&quot;band&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;p class=&quot;n&quot;&gt;Parte 1&lt;/p&gt;&lt;h2 id=&quot;contesto&quot; tabindex=&quot;-1&quot;&gt;Il contesto che le slide danno per scontato&lt;/h2&gt;&lt;p&gt;Se un&#x27;azienda delega le decisioni alle divisioni, deve poter giudicare chi le guida.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;prose&quot;&gt;
&lt;p&gt;Il titolo delle slide è &lt;span class=&quot;t&quot;&gt;Responsibility Accounting Systems&lt;/span&gt;, ma nessuna slide lo definisce. Il termine indica un sistema contabile che raccoglie i risultati per area di responsabilità, in modo che ogni manager sia valutato su ciò che può davvero controllare. &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Ogni area si chiama &lt;span class=&quot;t&quot;&gt;responsibility centre&lt;/span&gt; (centro di responsabilità). Il suo tipo dipende da quali grandezze il manager governa, e questo decide con quale misura va giudicato.&lt;/p&gt;
&lt;/div&gt;

&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Tipi di responsibility centre&quot;&gt;
&lt;button role=&quot;tab&quot; id=&quot;tab-cost&quot; aria-controls=&quot;p-cost&quot;&gt;Cost centre&lt;/button&gt;
&lt;button role=&quot;tab&quot; id=&quot;tab-profit&quot; aria-controls=&quot;p-profit&quot;&gt;Profit centre&lt;/button&gt;
&lt;button role=&quot;tab&quot; id=&quot;tab-inv&quot; aria-controls=&quot;p-inv&quot;&gt;Investment centre&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;p-cost&quot; aria-labelledby=&quot;tab-cost&quot; class=&quot;prose&quot;&gt;&lt;p&gt;&lt;b&gt;Cost centre&lt;/b&gt; (centro di costo): il manager controlla i costi, non i ricavi né gli investimenti. Esempio: un reparto amministrativo. Si giudica confrontando i costi con il budget. &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;p-profit&quot; aria-labelledby=&quot;tab-profit&quot; class=&quot;prose&quot;&gt;&lt;p&gt;&lt;b&gt;Profit centre&lt;/b&gt; (centro di profitto): il manager controlla costi e ricavi. Si giudica sul profitto. È la situazione descritta nell&#x27;Ex 3, dove i manager «are evaluated based on their divisional profits» &lt;span class=&quot;tag s&quot;&gt;Slide 7&lt;/span&gt;: per questo un transfer price basso o alto fa la differenza per loro.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;p-inv&quot; aria-labelledby=&quot;tab-inv&quot; class=&quot;prose&quot;&gt;&lt;p&gt;&lt;b&gt;Investment centre&lt;/b&gt; (centro di investimento): il manager controlla costi, ricavi e capitale investito. Si giudica con misure che mettono il profitto in rapporto agli asset: ROI e residual income. Le divisioni di Ex 1 e Ex 2 si leggono così, perché per loro sono dati gli &lt;span class=&quot;t&quot;&gt;operating assets&lt;/span&gt;. &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;figure style=&quot;max-width:44rem&quot;&gt;
&lt;svg viewBox=&quot;0 0 520 190&quot; role=&quot;img&quot; aria-label=&quot;Tabella visiva: il cost centre controlla i costi; il profit centre costi e ricavi; l&#x27;investment centre costi, ricavi e asset.&quot;&gt;
  &lt;g class=&quot;lab&quot;&gt;&lt;text x=&quot;240&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;Costi&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;Ricavi&lt;/text&gt;&lt;text x=&quot;440&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;Asset&lt;/text&gt;&lt;/g&gt;
  &lt;g class=&quot;val&quot;&gt;&lt;text x=&quot;0&quot; y=&quot;58&quot;&gt;Cost centre&lt;/text&gt;&lt;text x=&quot;0&quot; y=&quot;110&quot;&gt;Profit centre&lt;/text&gt;&lt;text x=&quot;0&quot; y=&quot;162&quot;&gt;Investment centre&lt;/text&gt;&lt;/g&gt;
  &lt;g class=&quot;bgf cs&quot; stroke-width=&quot;1.5&quot;&gt;&lt;rect x=&quot;195&quot; y=&quot;34&quot; width=&quot;90&quot; height=&quot;38&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;195&quot; y=&quot;86&quot; width=&quot;90&quot; height=&quot;38&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;295&quot; y=&quot;86&quot; width=&quot;90&quot; height=&quot;38&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;195&quot; y=&quot;138&quot; width=&quot;90&quot; height=&quot;38&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;295&quot; y=&quot;138&quot; width=&quot;90&quot; height=&quot;38&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;395&quot; y=&quot;138&quot; width=&quot;90&quot; height=&quot;38&quot; rx=&quot;4&quot;/&gt;&lt;/g&gt;
  &lt;g fill=&quot;none&quot; class=&quot;grid&quot; stroke-dasharray=&quot;3 4&quot;&gt;&lt;rect x=&quot;295&quot; y=&quot;34&quot; width=&quot;90&quot; height=&quot;38&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;395&quot; y=&quot;34&quot; width=&quot;90&quot; height=&quot;38&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;395&quot; y=&quot;86&quot; width=&quot;90&quot; height=&quot;38&quot; rx=&quot;4&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Riquadri pieni: ciò che il manager controlla e di cui risponde. &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;section class=&quot;check&quot; aria-label=&quot;Autoverifica parte 1&quot;&gt;
&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Il responsabile di uno stabilimento decide come produrre, ma prezzi e investimenti sono decisi altrove. Che centro guida?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Un cost centre: risponde solo dei costi. Giudicarlo sul profitto significherebbe valutarlo su prezzi che non controlla.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché ROI e residual income non si possono usare per un cost centre?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Entrambi richiedono il profitto e gli asset della divisione. Un cost centre non ha ricavi propri e il suo manager non decide sul capitale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché nell&#x27;Ex 3 conta che i manager siano valutati sul profitto di divisione?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché ciascuno accetta un trasferimento interno solo se non riduce il proprio profitto. Da lì nascono il prezzo minimo del venditore e il prezzo massimo del compratore.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part ochre&quot; aria-labelledby=&quot;roi&quot;&gt;
&lt;div class=&quot;band&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;p class=&quot;n&quot;&gt;Parte 2 · Slide 2, 3, 5&lt;/p&gt;&lt;h2 id=&quot;roi&quot; tabindex=&quot;-1&quot;&gt;ROI: margin × turnover&lt;/h2&gt;&lt;p&gt;Lo stesso rendimento si può ottenere guadagnando molto su ogni vendita, oppure vendendo molto con pochi asset.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;prose&quot;&gt;
&lt;p&gt;&lt;span class=&quot;t&quot;&gt;Return on investment&lt;/span&gt; (ROI, rendimento del capitale investito) dice quanti dollari di profitto operativo genera ogni dollaro di asset. La slide 5 lo scrive come prodotto di due rapporti:&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;formula&quot; role=&quot;math&quot; aria-label=&quot;ROI uguale net operating income su sales, per sales su average operating assets&quot;&gt;
&lt;b&gt;ROI&lt;/b&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Net operating income&lt;/span&gt;&lt;span&gt;Sales&lt;/span&gt;&lt;/span&gt; × &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Sales&lt;/span&gt;&lt;span&gt;Average operating assets&lt;/span&gt;&lt;/span&gt; = &lt;b&gt;margin × turnover&lt;/b&gt;
&lt;/div&gt;
&lt;div class=&quot;split&quot;&gt;
&lt;div&gt;
&lt;h4&gt;Le quattro grandezze&lt;/h4&gt;
&lt;p&gt;&lt;span class=&quot;t&quot;&gt;Sales&lt;/span&gt;: i ricavi di vendita della divisione.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;t&quot;&gt;Net operating income&lt;/span&gt; (NOI, reddito operativo): il profitto prima di interessi e imposte. &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;t&quot;&gt;Average operating assets&lt;/span&gt; (asset operativi medi): gli asset usati nella gestione, come cassa, crediti, scorte e impianti. È una media perché il profitto matura lungo tutto il periodo: di solito (inizio + fine periodo) ÷ 2. &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;t&quot;&gt;Margin&lt;/span&gt; (margine sulle vendite) = NOI ÷ sales. &lt;span class=&quot;t&quot;&gt;Turnover&lt;/span&gt; (rotazione degli asset) = sales ÷ average operating assets. &lt;span class=&quot;tag s&quot;&gt;Slide 3&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;h4&gt;Perché scomporlo&lt;/h4&gt;
&lt;p&gt;Le sales si elidono, quindi il prodotto equivale a NOI ÷ asset. La scomposizione non cambia il risultato: mostra &lt;em&gt;da dove&lt;/em&gt; viene.&lt;/p&gt;
&lt;p&gt;Di conseguenza indica tre leve: aumentare le sales, ridurre i costi (entrambe alzano NOI), ridurre gli asset impiegati. &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Se conosci due delle tre grandezze margin, turnover e ROI, trovi sempre la terza. L&#x27;Ex 1 si regge tutto su questo.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;lab-panel&quot;&gt;
&lt;h4&gt;Laboratorio: margin e turnover&lt;/h4&gt;
&lt;p&gt;Sposta il punto. Ogni curva unisce le combinazioni con lo stesso ROI, e le divisioni dell&#x27;Ex 1 sono già segnate.&lt;/p&gt;
&lt;div class=&quot;split&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;
&lt;svg id=&quot;roiChart&quot; viewBox=&quot;0 0 520 350&quot; role=&quot;img&quot; aria-label=&quot;Grafico con turnover in ascissa e margin in ordinata. Alpha e Bravo stanno sulla curva ROI 20%, Charlie sulla curva ROI 14%.&quot;&gt;&lt;/svg&gt;
&lt;/figure&gt;
&lt;div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;mSl&quot;&gt;Margin&lt;/label&gt;&lt;output id=&quot;mOut&quot; for=&quot;mSl&quot;&gt;6%&lt;/output&gt;&lt;input id=&quot;mSl&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;12&quot; step=&quot;0.5&quot; value=&quot;6&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;tSl&quot;&gt;Turnover&lt;/label&gt;&lt;output id=&quot;tOut&quot; for=&quot;tSl&quot;&gt;3&lt;/output&gt;&lt;input id=&quot;tSl&quot; type=&quot;range&quot; min=&quot;0.5&quot; max=&quot;6&quot; step=&quot;0.25&quot; value=&quot;3&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;readout&quot; aria-live=&quot;polite&quot;&gt;
&lt;div&gt;ROI&lt;b id=&quot;rOut&quot;&gt;18%&lt;/b&gt;&lt;/div&gt;
&lt;div&gt;Sales con asset di $1,000,000&lt;b id=&quot;sOut&quot;&gt;$3,000,000&lt;/b&gt;&lt;/div&gt;
&lt;div&gt;NOI risultante&lt;b id=&quot;nOut&quot;&gt;$180,000&lt;/b&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;verdict&quot; id=&quot;roiMsg&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;ex1&quot; tabindex=&quot;-1&quot;&gt;Ex 1: ricostruire la tabella&lt;/h3&gt;
&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Un distributore di martial arts products ha tre divisioni e una tabella con dei buchi: il compito è completarla. &lt;span class=&quot;tag s&quot;&gt;Slide 2–3&lt;/span&gt; Scorri i passi: l&#x27;ordine conta, perché ogni cella si ricava da quelle già note. Prima di premere Avanti, prova a dire tu quale formula serve.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tbl&quot; tabindex=&quot;0&quot; role=&quot;region&quot; aria-label=&quot;Tabella dell&#x27;esercizio 1&quot;&gt;
&lt;table id=&quot;ex1t&quot;&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Alpha&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Bravo&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Charlie&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Sales&lt;/th&gt;&lt;td data-c=&quot;as&quot; class=&quot;miss&quot;&gt;?&lt;/td&gt;&lt;td class=&quot;given&quot;&gt;$11,500,000&lt;/td&gt;&lt;td data-c=&quot;cs&quot; class=&quot;miss&quot;&gt;?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Net operating income&lt;/th&gt;&lt;td data-c=&quot;an&quot; class=&quot;miss&quot;&gt;?&lt;/td&gt;&lt;td class=&quot;given&quot;&gt;$920,000&lt;/td&gt;&lt;td class=&quot;given&quot;&gt;$210,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Average operating assets&lt;/th&gt;&lt;td class=&quot;given&quot;&gt;$800,000&lt;/td&gt;&lt;td data-c=&quot;ba&quot; class=&quot;miss&quot;&gt;?&lt;/td&gt;&lt;td data-c=&quot;ca&quot; class=&quot;miss&quot;&gt;?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Margin&lt;/th&gt;&lt;td class=&quot;given&quot;&gt;4%&lt;/td&gt;&lt;td data-c=&quot;bm&quot; class=&quot;miss&quot;&gt;?&lt;/td&gt;&lt;td class=&quot;given&quot;&gt;7%&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Turnover&lt;/th&gt;&lt;td class=&quot;given&quot;&gt;5&lt;/td&gt;&lt;td data-c=&quot;bt&quot; class=&quot;miss&quot;&gt;?&lt;/td&gt;&lt;td data-c=&quot;ct&quot; class=&quot;miss&quot;&gt;?&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;key&quot;&gt;&lt;th scope=&quot;row&quot;&gt;ROI&lt;/th&gt;&lt;td data-c=&quot;ar&quot; class=&quot;miss&quot;&gt;?&lt;/td&gt;&lt;td class=&quot;given&quot;&gt;20%&lt;/td&gt;&lt;td class=&quot;given&quot;&gt;14%&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;/div&gt;
&lt;div class=&quot;stepnote&quot; id=&quot;ex1n&quot; aria-live=&quot;polite&quot;&gt;&lt;p&gt;Premi Avanti per risolvere la prima cella. In grigio i dati, in tinta le celle trovate.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;btns&quot;&gt;&lt;button id=&quot;ex1p&quot; type=&quot;button&quot; disabled&gt;Indietro&lt;/button&gt;&lt;button id=&quot;ex1f&quot; type=&quot;button&quot;&gt;Avanti&lt;/button&gt;&lt;button id=&quot;ex1a&quot; type=&quot;button&quot;&gt;Mostra tutto&lt;/button&gt;&lt;span class=&quot;count&quot; id=&quot;ex1c&quot;&gt;Passo 0 di 9&lt;/span&gt;&lt;/div&gt;

&lt;div class=&quot;prose&quot;&gt;
&lt;h4&gt;Che cosa ricavarne&lt;/h4&gt;
&lt;p&gt;Alpha e Bravo hanno lo stesso ROI del 20% con strategie opposte: Alpha ha low margin e high turnover, Bravo il contrario. &lt;span class=&quot;tag s&quot;&gt;Slide 3&lt;/span&gt; Il ROI da solo non basta a capire come una divisione lavora: un calo di margin in Alpha pesa molto, perché è moltiplicato per 5.&lt;/p&gt;
&lt;/div&gt;

&lt;section class=&quot;check&quot; aria-label=&quot;Autoverifica parte 2&quot;&gt;
&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Sales $2,000,000, NOI $150,000, asset medi $1,000,000. Quanto valgono margin, turnover e ROI?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Margin 150,000 ÷ 2,000,000 = 7.5%. Turnover 2,000,000 ÷ 1,000,000 = 2. ROI 7.5% × 2 = 15%.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;ROI 18%, margin 6%, sales $3,000,000. Trova turnover, asset e NOI.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Turnover 18% ÷ 6% = 3. Asset 3,000,000 ÷ 3 = $1,000,000. NOI 6% × 3,000,000 = $180,000. Controllo: 180,000 ÷ 1,000,000 = 18%.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Charlie vuole un ROI del 20% tenendo fermi sales e margin. Di quanto deve ridurre gli asset?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Servono asset di 210,000 ÷ 20% = $1,050,000. Sono $450,000 in meno rispetto a $1,500,000, con turnover che sale a circa 2.86.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Alpha e Bravo hanno lo stesso ROI. Sono quindi uguali?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Hanno lo stesso risultato con modelli diversi, e anche la dimensione differisce: asset di $800,000 contro $4,600,000.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part slate&quot; aria-labelledby=&quot;ri&quot;&gt;
&lt;div class=&quot;band&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;p class=&quot;n&quot;&gt;Parte 3 · Slide 4–6&lt;/p&gt;&lt;h2 id=&quot;ri&quot; tabindex=&quot;-1&quot;&gt;Residual income: il profitto oltre il minimo&lt;/h2&gt;&lt;p&gt;Il ROI è una percentuale, il residual income è un importo. Sugli stessi dati possono dare classifiche opposte.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;prose&quot;&gt;
&lt;p&gt;&lt;span class=&quot;t&quot;&gt;Residual income&lt;/span&gt; (RI, reddito residuo) è il NOI che resta dopo aver coperto il rendimento minimo che l&#x27;azienda pretende sugli asset. Quel rendimento è la &lt;span class=&quot;t&quot;&gt;minimum required rate of return&lt;/span&gt; (tasso minimo richiesto). &lt;span class=&quot;tag s&quot;&gt;Slide 6&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;formula&quot; role=&quot;math&quot; aria-label=&quot;Residual income uguale net operating income meno tasso minimo per average operating assets&quot;&gt;
&lt;b&gt;Residual income&lt;/b&gt; = Net operating income − (minimum required rate × average operating assets)
&lt;/div&gt;
&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Una forma equivalente rende chiaro il legame con il ROI: &lt;b&gt;RI = (ROI − tasso minimo) × asset&lt;/b&gt;. Il RI è positivo solo se il ROI supera il minimo, e pesa quello scarto per la dimensione della divisione. &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3 id=&quot;ex2&quot; tabindex=&quot;-1&quot;&gt;Ex 2: Tan Corporation, Osaka contro Yokohama&lt;/h3&gt;
&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Tan Corporation of Japan ha due divisioni regionali. Si chiede margin, turnover e ROI di ciascuna, poi il RI con tasso minimo del 15%. &lt;span class=&quot;tag s&quot;&gt;Slide 4–6&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tbl&quot; tabindex=&quot;0&quot; role=&quot;region&quot; aria-label=&quot;Dati e soluzione dell&#x27;esercizio 2&quot;&gt;
&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Osaka&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Yokohama&lt;/th&gt;&lt;th scope=&quot;col&quot; class=&quot;wrap-cell&quot;&gt;Come si calcola&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Sales&lt;/th&gt;&lt;td class=&quot;given&quot;&gt;$3,000,000&lt;/td&gt;&lt;td class=&quot;given&quot;&gt;$9,000,000&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;dato&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Net operating income&lt;/th&gt;&lt;td class=&quot;given&quot;&gt;$210,000&lt;/td&gt;&lt;td class=&quot;given&quot;&gt;$720,000&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;dato&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Average operating assets&lt;/th&gt;&lt;td class=&quot;given&quot;&gt;$1,000,000&lt;/td&gt;&lt;td class=&quot;given&quot;&gt;$4,000,000&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;dato&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Margin&lt;/th&gt;&lt;td&gt;7%&lt;/td&gt;&lt;td&gt;8%&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;NOI ÷ sales&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Turnover&lt;/th&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;2.25&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;sales ÷ asset&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;key&quot;&gt;&lt;th scope=&quot;row&quot;&gt;ROI&lt;/th&gt;&lt;td class=&quot;done&quot;&gt;21%&lt;/td&gt;&lt;td&gt;18%&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;margin × turnover&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Rendimento minimo&lt;/th&gt;&lt;td&gt;$150,000&lt;/td&gt;&lt;td&gt;$600,000&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;15% × asset&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;key&quot;&gt;&lt;th scope=&quot;row&quot;&gt;Residual income&lt;/th&gt;&lt;td&gt;$60,000&lt;/td&gt;&lt;td class=&quot;done&quot;&gt;$120,000&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;NOI − rendimento minimo&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;/div&gt;
&lt;div class=&quot;prose&quot;&gt;
&lt;h4&gt;Il punto che la soluzione lascia a te&lt;/h4&gt;
&lt;p&gt;Le slide fermano i calcoli qui, ma il risultato è la vera lezione: &lt;b&gt;il ROI premia Osaka, il RI premia Yokohama&lt;/b&gt;. &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt; Non è una contraddizione, perché le due misure rispondono a domande diverse. Osaka è più efficiente su ogni dollaro; Yokohama crea più dollari sopra il minimo, ma ha quattro volte gli asset. Il RI doppio non prova quindi che sia gestita meglio. &lt;a class=&quot;tag w&quot; href=&quot;https://contabilidad.uprrp.edu/wp-content/uploads/2019/01/Cap%c3%adtulo-13-Performance-Measurement-on-Decentralized-Organizations.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fonte esterna: dispensa UPR&lt;/a&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;lab-panel&quot;&gt;
&lt;h4&gt;Laboratorio: quanto dipende dal tasso minimo?&lt;/h4&gt;
&lt;p&gt;Il sorpasso tra le due divisioni dipende dal tasso scelto. Il 15% viene dalle slide; gli altri valori sono una variazione didattica.&lt;/p&gt;
&lt;div class=&quot;split&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg id=&quot;riChart&quot; viewBox=&quot;0 0 520 350&quot; role=&quot;img&quot; aria-label=&quot;Residual income di Osaka e Yokohama in funzione del tasso minimo. Le rette si incrociano al 17%; Yokohama si azzera al 18%, Osaka al 21%.&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
&lt;div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;rSl&quot;&gt;Minimum required rate&lt;/label&gt;&lt;output id=&quot;rrOut&quot; for=&quot;rSl&quot;&gt;15%&lt;/output&gt;&lt;input id=&quot;rSl&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;25&quot; step=&quot;0.5&quot; value=&quot;15&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;readout&quot; aria-live=&quot;polite&quot;&gt;
&lt;div&gt;RI Osaka&lt;b id=&quot;oOut&quot;&gt;$60,000&lt;/b&gt;&lt;/div&gt;
&lt;div&gt;RI Yokohama&lt;b id=&quot;yOut&quot;&gt;$120,000&lt;/b&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;verdict&quot; id=&quot;riMsg&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;prose&quot;&gt;
&lt;h4&gt;Perché esiste il RI: il problema del manager giudicato sul ROI&lt;/h4&gt;
&lt;p&gt;Un manager giudicato sul ROI tende a rifiutare un progetto che abbasserebbe il suo ROI, anche se il progetto supera il minimo richiesto dall&#x27;azienda. Giudicato sul RI, lo accetta, perché ogni dollaro sopra il minimo fa salire la sua misura. &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt; &lt;a class=&quot;tag w&quot; href=&quot;https://www.accaglobal.com/gb/en/student/exam-support-resources/professional-exams-study-resources/p5/technical-articles/divisional-performance-management.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fonte esterna: ACCA&lt;/a&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;lab-panel&quot;&gt;
&lt;h4&gt;Laboratorio: arriva un progetto a Osaka&lt;/h4&gt;
&lt;p&gt;Esempio inventato per lo studio, non nelle slide: Osaka può investire altri $200,000. Scegli il rendimento del progetto.&lt;/p&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;pSl&quot;&gt;Rendimento del progetto&lt;/label&gt;&lt;output id=&quot;pOut&quot; for=&quot;pSl&quot;&gt;17%&lt;/output&gt;&lt;input id=&quot;pSl&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;17&quot;&gt;&lt;/div&gt;
&lt;figure style=&quot;margin:.5rem 0&quot;&gt;&lt;svg id=&quot;pStrip&quot; viewBox=&quot;0 0 520 74&quot; role=&quot;img&quot; aria-label=&quot;Fasce di rendimento: sotto il 15% rifiutano tutti, tra 15% e 21% l&#x27;azienda lo vorrebbe ma il manager giudicato sul ROI lo rifiuta, sopra il 21% accettano tutti.&quot;&gt;
  &lt;rect x=&quot;10&quot; y=&quot;26&quot; width=&quot;208&quot; height=&quot;22&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;rect x=&quot;218&quot; y=&quot;26&quot; width=&quot;125&quot; height=&quot;22&quot; class=&quot;cc&quot; opacity=&quot;.45&quot;/&gt;&lt;rect x=&quot;343&quot; y=&quot;26&quot; width=&quot;167&quot; height=&quot;22&quot; fill=&quot;var(--rule)&quot;/&gt;
  &lt;text class=&quot;lab&quot; x=&quot;218&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;15%&lt;/text&gt;&lt;text class=&quot;lab&quot; x=&quot;343&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;21%&lt;/text&gt;
  &lt;text class=&quot;lab&quot; x=&quot;114&quot; y=&quot;17&quot; text-anchor=&quot;middle&quot;&gt;tutti no&lt;/text&gt;&lt;text class=&quot;lab&quot; x=&quot;280&quot; y=&quot;17&quot; text-anchor=&quot;middle&quot;&gt;conflitto&lt;/text&gt;&lt;text class=&quot;lab&quot; x=&quot;426&quot; y=&quot;17&quot; text-anchor=&quot;middle&quot;&gt;tutti sì&lt;/text&gt;
  &lt;path id=&quot;pMark&quot; d=&quot;M0 22V52&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;3&quot;/&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;readout&quot; aria-live=&quot;polite&quot;&gt;
&lt;div&gt;ROI Osaka con il progetto (ora 21%)&lt;b id=&quot;pRoi&quot;&gt;&lt;/b&gt;&lt;/div&gt;
&lt;div&gt;RI Osaka con il progetto (ora $60,000)&lt;b id=&quot;pRi&quot;&gt;&lt;/b&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;verdict&quot; id=&quot;pMsg&quot;&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;tbl&quot; tabindex=&quot;0&quot; role=&quot;region&quot; aria-label=&quot;Confronto ROI e residual income&quot;&gt;
&lt;table&gt;
&lt;caption&gt;Confronto &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt;&lt;/caption&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;&lt;/th&gt;&lt;th scope=&quot;col&quot; class=&quot;wrap-cell&quot;&gt;ROI&lt;/th&gt;&lt;th scope=&quot;col&quot; class=&quot;wrap-cell&quot;&gt;Residual income&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Unità&lt;/th&gt;&lt;td class=&quot;wrap-cell&quot;&gt;percentuale&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;importo in dollari&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Confronta divisioni di taglia diversa?&lt;/th&gt;&lt;td class=&quot;wrap-cell&quot;&gt;sì, è un rapporto&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;male, favorisce le più grandi&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Allinea il manager all&#x27;azienda?&lt;/th&gt;&lt;td class=&quot;wrap-cell&quot;&gt;non sempre: rifiuta progetti sopra il minimo ma sotto il suo ROI&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;sì, accetta tutto ciò che supera il minimo&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Serve un tasso minimo?&lt;/th&gt;&lt;td class=&quot;wrap-cell&quot;&gt;no per calcolarlo&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;sì, e il risultato ne dipende&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;/div&gt;

&lt;section class=&quot;check&quot; aria-label=&quot;Autoverifica parte 3&quot;&gt;
&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Rifai il RI di Ex 2 con un tasso minimo del 20%.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Osaka: 210,000 − 20% × 1,000,000 = $10,000. Yokohama: 720,000 − 20% × 4,000,000 = −$80,000. La classifica si inverte.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Verifica il RI di Osaka con la forma (ROI − tasso minimo) × asset.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;(21% − 15%) × 1,000,000 = $60,000, come a slide 6. Per Yokohama: (18% − 15%) × 4,000,000 = $120,000.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Yokohama può investire in un progetto che rende il 17%, con minimo al 15%. Cosa fa il manager giudicato sul ROI? E quello giudicato sul RI?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il primo rifiuta: 17% è sotto il suo 18% e abbasserebbe il ROI. Il secondo accetta: 17% supera il 15% e il RI sale. L&#x27;azienda, che chiede il 15%, preferisce il secondo comportamento.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quale divisione è gestita meglio, in base ai soli dati di Ex 2?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;I dati non bastano per dirlo. Osaka ha il ROI più alto, Yokohama il RI più alto ma con asset quadrupli. Una conclusione richiederebbe confronti con budget, settore e storia della divisione.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part brick&quot; aria-labelledby=&quot;tp&quot;&gt;
&lt;div class=&quot;band&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;p class=&quot;n&quot;&gt;Parte 4 · Slide 7–12&lt;/p&gt;&lt;h2 id=&quot;tp&quot; tabindex=&quot;-1&quot;&gt;Transfer pricing: il prezzo tra divisioni&lt;/h2&gt;&lt;p&gt;Un accordo è possibile solo se il minimo del venditore non supera il massimo del compratore.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;split&quot;&gt;
&lt;div&gt;
&lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;transfer price&lt;/span&gt; (prezzo di trasferimento) è il prezzo a cui una divisione vende a un&#x27;altra della stessa azienda. Per l&#x27;azienda nel suo insieme è una partita di giro: ciò che una divisione guadagna, l&#x27;altra lo spende. Però sposta il profitto di ciascuna, e quindi il giudizio sui due manager. &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Nell&#x27;Ex 3 la Division X può vendere fuori o alla Division Y, che ora compra da un &lt;span class=&quot;t&quot;&gt;outside supplier&lt;/span&gt; (fornitore esterno). &lt;span class=&quot;tag s&quot;&gt;Slide 7&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;figure style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 520 210&quot; role=&quot;img&quot; aria-label=&quot;Division X vende a outside customers o a Division Y al transfer price; Division Y può comprare invece da un outside supplier.&quot;&gt;
  &lt;defs&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0 0 10 5 0 10z&quot; fill=&quot;var(--mut)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
  &lt;g class=&quot;bgf cs&quot; stroke-width=&quot;1.5&quot;&gt;&lt;rect x=&quot;20&quot; y=&quot;82&quot; width=&quot;140&quot; height=&quot;60&quot; rx=&quot;6&quot;/&gt;&lt;rect x=&quot;360&quot; y=&quot;82&quot; width=&quot;140&quot; height=&quot;60&quot; rx=&quot;6&quot;/&gt;&lt;/g&gt;
  &lt;g fill=&quot;none&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;rect x=&quot;20&quot; y=&quot;4&quot; width=&quot;140&quot; height=&quot;44&quot; rx=&quot;6&quot;/&gt;&lt;rect x=&quot;360&quot; y=&quot;4&quot; width=&quot;140&quot; height=&quot;44&quot; rx=&quot;6&quot;/&gt;&lt;/g&gt;
  &lt;g class=&quot;edge&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M90 82V50&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M430 50V80&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M162 112H358&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;/g&gt;
  &lt;text class=&quot;val&quot; x=&quot;90&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot;&gt;Division X&lt;/text&gt;&lt;text class=&quot;val&quot; x=&quot;430&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot;&gt;Division Y&lt;/text&gt;
  &lt;text class=&quot;lab&quot; x=&quot;90&quot; y=&quot;31&quot; text-anchor=&quot;middle&quot;&gt;outside customers&lt;/text&gt;&lt;text class=&quot;lab&quot; x=&quot;430&quot; y=&quot;31&quot; text-anchor=&quot;middle&quot;&gt;outside supplier&lt;/text&gt;
  &lt;text class=&quot;val cc&quot; x=&quot;260&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot;&gt;transfer price&lt;/text&gt;
  &lt;text class=&quot;lab&quot; x=&quot;260&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot;&gt;40,000 unità&lt;/text&gt;
  &lt;text class=&quot;lab&quot; x=&quot;90&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot;&gt;vende, capacity&lt;/text&gt;&lt;text class=&quot;lab&quot; x=&quot;90&quot; y=&quot;188&quot; text-anchor=&quot;middle&quot;&gt;200,000 unità&lt;/text&gt;
  &lt;text class=&quot;lab&quot; x=&quot;430&quot; y=&quot;170&quot; text-anchor=&quot;middle&quot;&gt;compra e usa&lt;/text&gt;&lt;text class=&quot;lab&quot; x=&quot;430&quot; y=&quot;188&quot; text-anchor=&quot;middle&quot;&gt;in produzione&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;/div&gt;

&lt;h4&gt;La formula: il minimo del venditore&lt;/h4&gt;
&lt;div class=&quot;formula&quot; role=&quot;math&quot; aria-label=&quot;Transfer price maggiore o uguale al costo variabile unitario più il contribution margin totale sulle vendite perse diviso le unità trasferite&quot;&gt;
Transfer price ≥ &lt;b&gt;Variable cost per unit&lt;/b&gt; + &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Total contribution margin on lost sales&lt;/span&gt;&lt;span&gt;Number of units transferred&lt;/span&gt;&lt;/span&gt;
&lt;/div&gt;
&lt;div class=&quot;prose&quot;&gt;
&lt;p&gt;X deve coprire ciò che paga in più per produrre, più ciò che perde togliendo unità ai clienti esterni. &lt;span class=&quot;tag s&quot;&gt;Slide 8&lt;/span&gt; Il &lt;span class=&quot;t&quot;&gt;contribution margin&lt;/span&gt; (margine di contribuzione) è prezzo di vendita meno variable cost.&lt;/p&gt;
&lt;p&gt;Le vendite perse dipendono dalla &lt;span class=&quot;t&quot;&gt;idle capacity&lt;/span&gt; (capacità produttiva inutilizzata): se X ne ha abbastanza, non rinuncia a nessun cliente e il secondo termine vale zero. &lt;span class=&quot;tag s&quot;&gt;Slide 10&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h4&gt;Il tetto: il massimo del compratore&lt;/h4&gt;
&lt;div class=&quot;formula&quot; role=&quot;math&quot; aria-label=&quot;Transfer price minore o uguale al costo di acquisto dal fornitore esterno&quot;&gt;
Transfer price ≤ &lt;b&gt;Cost of buying from outside supplier&lt;/b&gt;
&lt;/div&gt;
&lt;div class=&quot;quirk&quot;&gt;&lt;b&gt;Attenzione ai refusi nelle slide.&lt;/b&gt; Alle slide 9 e 11 la formula mostra «£» al posto di «≤»: sembra un problema di carattere del file, non una sterlina. La slide 12 dice «as shown below», ma sotto non c&#x27;è nulla: il range si ricava dalle slide 10 e 11. Il grafico del caso B qui sotto è una mia ricostruzione.&lt;/div&gt;

&lt;h3 id=&quot;ex3&quot; tabindex=&quot;-1&quot;&gt;Ex 3: due casi, due esiti&lt;/h3&gt;
&lt;div class=&quot;tbl&quot; tabindex=&quot;0&quot; role=&quot;region&quot; aria-label=&quot;Dati dell&#x27;esercizio 3&quot;&gt;
&lt;table&gt;
&lt;caption&gt;Dati &lt;span class=&quot;tag s&quot;&gt;Slide 7&lt;/span&gt;&lt;/caption&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Caso A&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Caso B&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;X: capacity (unità)&lt;/th&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;X: unità vendute all&#x27;esterno&lt;/th&gt;&lt;td&gt;200,000&lt;/td&gt;&lt;td&gt;160,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;X: prezzo di vendita esterno&lt;/th&gt;&lt;td&gt;$90&lt;/td&gt;&lt;td&gt;$75&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;X: variable cost per unit&lt;/th&gt;&lt;td&gt;$70&lt;/td&gt;&lt;td&gt;$60&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;X: fixed cost per unit (su capacity)&lt;/th&gt;&lt;td&gt;$13&lt;/td&gt;&lt;td&gt;$8&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Y: unità necessarie&lt;/th&gt;&lt;td&gt;40,000&lt;/td&gt;&lt;td&gt;40,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Y: prezzo dell&#x27;outside supplier&lt;/th&gt;&lt;td&gt;$86&lt;/td&gt;&lt;td&gt;$74&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Variable selling cost evitabile sulle vendite interne&lt;/th&gt;&lt;td&gt;$3&lt;/td&gt;&lt;td&gt;$0&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;/div&gt;

&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Casi dell&#x27;esercizio 3&quot;&gt;
&lt;button role=&quot;tab&quot; id=&quot;tab-a&quot; aria-controls=&quot;p-a&quot;&gt;Caso A: nessuna idle capacity&lt;/button&gt;
&lt;button role=&quot;tab&quot; id=&quot;tab-b&quot; aria-controls=&quot;p-b&quot;&gt;Caso B: idle capacity&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;p-a&quot; aria-labelledby=&quot;tab-a&quot;&gt;
&lt;div class=&quot;split&quot;&gt;
&lt;div&gt;
&lt;p&gt;&lt;b&gt;1a. Minimo di X.&lt;/b&gt; &lt;span class=&quot;tag s&quot;&gt;Slide 8&lt;/span&gt; X lavora a piena capacity: ognuna delle 40,000 unità trasferite toglie una vendita esterna. Il contribution margin perso è $90 − $70 = $20 per unità, e sulle vendite interne X risparmia $3.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;TP ≥ ($70 − $3) + &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;$20 × 40,000&lt;/span&gt;&lt;span&gt;40,000&lt;/span&gt;&lt;/span&gt; = $67 + $20 = &lt;b&gt;$87&lt;/b&gt;&lt;/div&gt;
&lt;p&gt;&lt;b&gt;1b. Massimo di Y.&lt;/b&gt; &lt;span class=&quot;tag s&quot;&gt;Slide 9&lt;/span&gt; Y compra fuori a $86, quindi non pagherà di più: TP ≤ &lt;b&gt;$86&lt;/b&gt;.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;1c. Range.&lt;/b&gt; &lt;span class=&quot;tag s&quot;&gt;Slide 9&lt;/span&gt; Non esiste: $87 supera $86, le richieste sono incompatibili e il trasferimento non avviene.&lt;/p&gt;
&lt;/div&gt;
&lt;figure style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 520 150&quot; role=&quot;img&quot; aria-label=&quot;Linea dei prezzi: Y accetta fino a 86 dollari, X accetta da 87 dollari. Tra le due zone resta un buco di un dollaro.&quot;&gt;
  &lt;path class=&quot;ax&quot; d=&quot;M20 125H500&quot;/&gt;
  &lt;rect x=&quot;20&quot; y=&quot;62&quot; width=&quot;310&quot; height=&quot;18&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;rect x=&quot;346&quot; y=&quot;32&quot; width=&quot;154&quot; height=&quot;18&quot; class=&quot;cc&quot; opacity=&quot;.5&quot;/&gt;
  &lt;text class=&quot;lab&quot; x=&quot;330&quot; y=&quot;74&quot; text-anchor=&quot;end&quot; dx=&quot;-6&quot;&gt;Y accetta fino a $86&lt;/text&gt;&lt;text class=&quot;lab&quot; x=&quot;346&quot; y=&quot;24&quot;&gt;X accetta da $87&lt;/text&gt;
  &lt;path class=&quot;cs&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;3 3&quot; d=&quot;M330 62V125M346 50V125&quot;/&gt;
  &lt;text class=&quot;val&quot; x=&quot;326&quot; y=&quot;144&quot; text-anchor=&quot;end&quot;&gt;$86&lt;/text&gt;&lt;text class=&quot;val&quot; x=&quot;350&quot; y=&quot;144&quot;&gt;$87&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Il buco è di $1, ma basta a bloccare l&#x27;accordo. Il buco è ingrandito per renderlo visibile. &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;/div&gt;
&lt;div class=&quot;added&quot;&gt;&lt;p&gt;&lt;b&gt;E per l&#x27;azienda è un bene?&lt;/b&gt; &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt; Sì. Senza trasferimento, per ogni unità X incassa un contribution margin di $20 e Y spende $86: netto −$66. Con il trasferimento, l&#x27;azienda spende solo il costo interno di $67: netto −$67. Il mancato accordo le fa risparmiare $1 × 40,000 = $40,000.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;p-b&quot; aria-labelledby=&quot;tab-b&quot;&gt;
&lt;div class=&quot;split&quot;&gt;
&lt;div&gt;
&lt;p&gt;&lt;b&gt;2a. Minimo di X.&lt;/b&gt; &lt;span class=&quot;tag s&quot;&gt;Slide 10&lt;/span&gt; X vende 160,000 unità su 200,000: la idle capacity di 40,000 copre esattamente Y. Nessuna vendita persa, nessun risparmio sui costi.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;TP ≥ $60 + &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;$0&lt;/span&gt;&lt;span&gt;40,000&lt;/span&gt;&lt;/span&gt; = &lt;b&gt;$60&lt;/b&gt;&lt;/div&gt;
&lt;p&gt;&lt;b&gt;2b. Massimo di Y.&lt;/b&gt; &lt;span class=&quot;tag s&quot;&gt;Slide 11&lt;/span&gt; Y compra fuori a $74, quindi TP ≤ &lt;b&gt;$74&lt;/b&gt;.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;2c. Range.&lt;/b&gt; &lt;span class=&quot;tag s&quot;&gt;Slide 12&lt;/span&gt; Da $60 a $74: le richieste sono compatibili e un trasferimento «hopefully will take place». La parola è prudente perché un range rende possibile l&#x27;accordo, non lo garantisce: restano negoziazione e rapporti tra manager. &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;figure style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 520 150&quot; role=&quot;img&quot; aria-label=&quot;Linea dei prezzi: X accetta da 60 dollari, Y accetta fino a 74 dollari. Tra 60 e 74 le due zone si sovrappongono.&quot;&gt;
  &lt;path class=&quot;ax&quot; d=&quot;M20 125H500&quot;/&gt;
  &lt;rect x=&quot;116&quot; y=&quot;20&quot; width=&quot;168&quot; height=&quot;105&quot; class=&quot;cc&quot; opacity=&quot;.14&quot;/&gt;
  &lt;rect x=&quot;116&quot; y=&quot;32&quot; width=&quot;384&quot; height=&quot;18&quot; class=&quot;cc&quot; opacity=&quot;.5&quot;/&gt;&lt;rect x=&quot;20&quot; y=&quot;62&quot; width=&quot;264&quot; height=&quot;18&quot; fill=&quot;var(--rule)&quot;/&gt;
  &lt;text class=&quot;lab&quot; x=&quot;124&quot; y=&quot;24&quot;&gt;X accetta da $60&lt;/text&gt;&lt;text class=&quot;lab&quot; x=&quot;30&quot; y=&quot;98&quot;&gt;Y accetta fino a $74&lt;/text&gt;
  &lt;text class=&quot;val&quot; x=&quot;116&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot;&gt;$60&lt;/text&gt;&lt;text class=&quot;val&quot; x=&quot;284&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot;&gt;$74&lt;/text&gt;
  &lt;text class=&quot;val cc&quot; x=&quot;200&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot;&gt;range&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;La fascia colorata è il range acceptable. Slide 12 lo annuncia ma non lo disegna: ricostruzione mia.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;/div&gt;
&lt;div class=&quot;added&quot;&gt;&lt;p&gt;&lt;b&gt;Quanto vale l&#x27;accordo?&lt;/b&gt; &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt; Ogni unità costa all&#x27;azienda $60 anziché $74: risparmio di $14 × 40,000 = $560,000. Il transfer price non cambia questa cifra, decide solo come si divide tra X e Y.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;added&quot;&gt;&lt;p&gt;&lt;b&gt;La trappola dei fixed costs.&lt;/b&gt; &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt; I $13 e gli $8 di fixed cost per unit sono nei dati ma nessuna soluzione li usa. I costi fissi restano uguali che il trasferimento avvenga o no, quindi non sono rilevanti per la decisione.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;lab-panel&quot;&gt;
&lt;h4&gt;Simulatore di negoziazione&lt;/h4&gt;
&lt;p&gt;Parti da un caso delle slide, poi cambia i dati. Capacity 200,000 e fabbisogno di Y 40,000 restano fissi. &lt;span class=&quot;tag a&quot;&gt;Variazione didattica&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;btns&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;preA&quot;&gt;Carica caso A&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;preB&quot;&gt;Carica caso B&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;split&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;sU&quot;&gt;Unità vendute all&#x27;esterno&lt;/label&gt;&lt;output id=&quot;oU&quot; for=&quot;sU&quot;&gt;&lt;/output&gt;&lt;input id=&quot;sU&quot; type=&quot;range&quot; min=&quot;160000&quot; max=&quot;200000&quot; step=&quot;5000&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;sP&quot;&gt;Prezzo esterno di X&lt;/label&gt;&lt;output id=&quot;oP&quot; for=&quot;sP&quot;&gt;&lt;/output&gt;&lt;input id=&quot;sP&quot; type=&quot;range&quot; min=&quot;60&quot; max=&quot;110&quot; step=&quot;1&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;sV&quot;&gt;Variable cost per unit&lt;/label&gt;&lt;output id=&quot;oV&quot; for=&quot;sV&quot;&gt;&lt;/output&gt;&lt;input id=&quot;sV&quot; type=&quot;range&quot; min=&quot;40&quot; max=&quot;90&quot; step=&quot;1&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;sS&quot;&gt;Costo evitabile sulle vendite interne&lt;/label&gt;&lt;output id=&quot;oS&quot; for=&quot;sS&quot;&gt;&lt;/output&gt;&lt;input id=&quot;sS&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;1&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;sB&quot;&gt;Prezzo dell&#x27;outside supplier&lt;/label&gt;&lt;output id=&quot;oB&quot; for=&quot;sB&quot;&gt;&lt;/output&gt;&lt;input id=&quot;sB&quot; type=&quot;range&quot; min=&quot;50&quot; max=&quot;110&quot; step=&quot;1&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;sT&quot;&gt;&lt;b&gt;Transfer price proposto&lt;/b&gt;&lt;/label&gt;&lt;output id=&quot;oT&quot; for=&quot;sT&quot;&gt;&lt;/output&gt;&lt;input id=&quot;sT&quot; type=&quot;range&quot; min=&quot;30&quot; max=&quot;120&quot; step=&quot;0.5&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg id=&quot;tpLine&quot; viewBox=&quot;0 0 520 140&quot; role=&quot;img&quot; aria-label=&quot;Linea dei prezzi con il minimo di X, il massimo di Y e il transfer price proposto. I valori sono riportati anche nel testo accanto.&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
&lt;p class=&quot;num&quot; id=&quot;tpTrace&quot; style=&quot;font-size:.92rem&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;readout&quot; aria-live=&quot;polite&quot;&gt;
&lt;div&gt;Se si trasferisce: X&lt;b id=&quot;dX&quot;&gt;&lt;/b&gt;&lt;/div&gt;
&lt;div&gt;Se si trasferisce: Y&lt;b id=&quot;dY&quot;&gt;&lt;/b&gt;&lt;/div&gt;
&lt;div&gt;Se si trasferisce: azienda&lt;b id=&quot;dC&quot;&gt;&lt;/b&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;verdict&quot; id=&quot;tpMsg&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;section class=&quot;check&quot; aria-label=&quot;Autoverifica parte 4&quot;&gt;
&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Caso A, ma X vende 190,000 unità fuori. Qual è il range?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Idle capacity 10,000, quindi vendite perse 30,000. Minimo: $67 + ($20 × 30,000) ÷ 40,000 = $67 + $15 = $82. Massimo: $86. Range da $82 a $86: l&#x27;accordo diventa possibile.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Caso B, con transfer price di $70. Quanto guadagna ciascuno?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;X: ($70 − $60) × 40,000 = $400,000. Y: ($74 − $70) × 40,000 = $160,000. Totale $560,000, il risparmio complessivo dell&#x27;azienda.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Caso B, ma l&#x27;outside supplier scende a $58. Che cosa succede?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Minimo $60, massimo $58: nessun range. Y compra fuori, ed è giusto anche per l&#x27;azienda, che spende $2 in meno per unità.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Nel caso A, il direttore generale dovrebbe imporre il trasferimento?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Costerebbe all&#x27;azienda $40,000 in più. Qui il mancato accordo tra i manager coincide con l&#x27;interesse dell&#x27;azienda.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Nel caso B, il prezzo esterno di X è $75 e Y paga fuori $74. Perché X accetta meno di $75?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché quelle 40,000 unità non toglierebbero nessuna vendita a $75: senza Y quella capacity resterebbe ferma. Conta il costo incrementale, $60, non il prezzo di listino.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part terra&quot; aria-labelledby=&quot;ripasso&quot;&gt;
&lt;div class=&quot;band&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;p class=&quot;n&quot;&gt;Parte 5&lt;/p&gt;&lt;h2 id=&quot;ripasso&quot; tabindex=&quot;-1&quot;&gt;Ripasso prima della prova&lt;/h2&gt;&lt;p&gt;Le formule in una schermata, e gli errori più facili da fare con questi esercizi.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;tbl&quot; tabindex=&quot;0&quot; role=&quot;region&quot; aria-label=&quot;Formulario&quot;&gt;
&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Grandezza&lt;/th&gt;&lt;th scope=&quot;col&quot; class=&quot;wrap-cell&quot;&gt;Formula&lt;/th&gt;&lt;th scope=&quot;col&quot; class=&quot;wrap-cell&quot;&gt;Dove&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Margin&lt;/th&gt;&lt;td class=&quot;wrap-cell&quot;&gt;NOI ÷ sales&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;Slide 3&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Turnover&lt;/th&gt;&lt;td class=&quot;wrap-cell&quot;&gt;sales ÷ average operating assets&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;Slide 3&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;ROI&lt;/th&gt;&lt;td class=&quot;wrap-cell&quot;&gt;margin × turnover = NOI ÷ average operating assets&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;Slide 5&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Residual income&lt;/th&gt;&lt;td class=&quot;wrap-cell&quot;&gt;NOI − (tasso minimo × average operating assets)&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;Slide 6&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;TP minimo del venditore&lt;/th&gt;&lt;td class=&quot;wrap-cell&quot;&gt;variable cost + (contribution margin sulle vendite perse ÷ unità trasferite)&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;Slide 8&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;TP massimo del compratore&lt;/th&gt;&lt;td class=&quot;wrap-cell&quot;&gt;costo di acquisto dall&#x27;esterno&lt;/td&gt;&lt;td class=&quot;wrap-cell&quot;&gt;Slide 9&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;/div&gt;
&lt;h4&gt;Errori tipici &lt;span class=&quot;tag a&quot;&gt;Aggiunta&lt;/span&gt;&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;Usare gli asset di fine periodo invece della media&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il denominatore è average operating assets. Negli esercizi di queste slide la media è già data: non va calcolata.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Dedurre il risparmio di $3 dal contribution margin perso&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Nel caso A il margine perso resta $90 − $70 = $20, perché sulle vendite esterne il costo intero si paga. I $3 si tolgono solo dal variable cost dell&#x27;unità trasferita.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Includere i fixed costs nel prezzo minimo&lt;/summary&gt;&lt;div&gt;&lt;p&gt;$13 e $8 non cambiano con il trasferimento, quindi restano fuori dalla formula.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Dividere per le vendite perse anziché per le unità trasferite&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il denominatore è sempre il numero di unità trasferite. Conta quando la idle capacity è solo parziale: le vendite perse sono meno delle unità trasferite.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Concludere dal RI che la divisione più ricca è la migliore&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il RI è un importo e cresce con la dimensione. Tra divisioni di taglia diversa va letto insieme al ROI.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;section class=&quot;check&quot; aria-label=&quot;Autoverifica parte 5&quot;&gt;
&lt;h3&gt;Autoverifica finale&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Sales $5,000,000, NOI $400,000, asset medi $2,000,000, tasso minimo 12%. Calcola margin, turnover, ROI e RI.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Margin 8%, turnover 2.5, ROI 20%. RI = 400,000 − 12% × 2,000,000 = $160,000.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;X ha 10,000 unità di idle capacity e Y ne chiede 20,000. Variable cost $30, prezzo esterno $50, outside supplier $42. Qual è il range?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Vendite perse 10,000, contribution margin $20. Minimo: $30 + ($20 × 10,000) ÷ 20,000 = $40. Massimo: $42. Range da $40 a $42, quindi il trasferimento può avvenire.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part slate&quot; aria-labelledby=&quot;fonti&quot;&gt;
&lt;div class=&quot;band&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;p class=&quot;n&quot;&gt;Fonti esterne&lt;/p&gt;&lt;h2 id=&quot;fonti&quot; tabindex=&quot;-1&quot;&gt;Per approfondire&lt;/h2&gt;&lt;p&gt;Tutto ciò che segue viene dal web, non dalle slide.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;prose&quot;&gt;
&lt;p&gt;&lt;b&gt;Le slide non citano autori, studi, norme o siti.&lt;/b&gt; L&#x27;unico rimando è il riquadro «Page 524» a slide 7, che fa pensare a un manuale senza nominarlo. Le voci qui sotto sono quindi una mia selezione sui temi delle slide, non una bibliografia del docente. Le descrizioni si basano su ciò che è emerso dalle ricerche: non ho letto i testi per intero.&lt;/p&gt;
&lt;/div&gt;
&lt;ul class=&quot;refs&quot;&gt;
&lt;li&gt;&lt;h4&gt;Il manuale probabile: &lt;i&gt;Managerial Accounting&lt;/i&gt;&lt;/h4&gt;
&lt;p class=&quot;bib&quot;&gt;Garrison, Noreen, Brewer. McGraw-Hill. Ultima edizione trovata: 18ª, 2024.&lt;/p&gt;
&lt;p&gt;Manuale diffuso di contabilità direzionale, che tratta ROI, residual income e transfer pricing nel capitolo sulle organizzazioni decentrate. Il riquadro «Page 524» e la traccia di Tan Corporation, che circola online come esercizio di manuale, mi fanno pensare a questo testo, ma &lt;b&gt;nessuna fonte lo conferma: è una mia ipotesi&lt;/b&gt;. Chiedi conferma al docente o guarda il programma.&lt;/p&gt;
&lt;p&gt;&lt;a class=&quot;tag w&quot; href=&quot;https://bookstore.uu.edu/ebook/9781265618520&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fonte esterna: scheda 18ª ed.&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Outline dell&#x27;editore sulla decentralizzazione&lt;/h4&gt;
&lt;p class=&quot;bib&quot;&gt;McGraw-Hill, &lt;i&gt;Introduction to Managerial Accounting&lt;/i&gt; (Folk, Garrison, Noreen), capitolo 10.&lt;/p&gt;
&lt;p&gt;Scaletta di un capitolo che copre ROI, residual income e transfer prices. Utile come sommario della teoria che queste slide danno per scontata, anche se riguarda un&#x27;edizione vecchia.&lt;/p&gt;
&lt;p&gt;&lt;a class=&quot;tag w&quot; href=&quot;https://highered.mheducation.com/sites/0072422246/student_view0/chapter10/chapter_outline.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fonte esterna: McGraw-Hill&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Donaldson Brown, «padre» del ROI&lt;/h4&gt;
&lt;p class=&quot;bib&quot;&gt;Hagley Museum and Library, &lt;i&gt;The Father of ROI: Donaldson Brown&lt;/i&gt;.&lt;/p&gt;
&lt;p&gt;Racconta come Brown, alla DuPont, combinò utili, capitale circolante e investimenti in un&#x27;unica misura che chiamò return on investment. Conta perché spiega da dove viene la scomposizione usata in Ex 1 e Ex 2. Le date dell&#x27;invenzione variano tra le fonti (1912 o 1914).&lt;/p&gt;
&lt;p&gt;&lt;a class=&quot;tag w&quot; href=&quot;https://www.hagley.org/librarynews/father-roi-donaldson-brown&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fonte esterna: Hagley&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;David Solomons e il residual income&lt;/h4&gt;
&lt;p class=&quot;bib&quot;&gt;Solomons, &lt;i&gt;Divisional Performance: Measurement and Control&lt;/i&gt;, citato come Irwin, 1968, in un capitolo Springer.&lt;/p&gt;
&lt;p&gt;Solomons propose il residual income per valutare separatamente il centro di investimento e il suo manager. La data della prima edizione non è confermata dalle ricerche: controllala prima di citarla.&lt;/p&gt;
&lt;p&gt;&lt;a class=&quot;tag w&quot; href=&quot;https://link.springer.com/chapter/10.1007/978-1-4899-7138-8_17&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fonte esterna: Springer&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Articoli tecnici ACCA&lt;/h4&gt;
&lt;p class=&quot;bib&quot;&gt;ACCA: &lt;i&gt;Decentralisation and the need for performance measurement&lt;/i&gt;, &lt;i&gt;Divisional performance management&lt;/i&gt;, &lt;i&gt;Transfer pricing&lt;/i&gt;.&lt;/p&gt;
&lt;p&gt;Materiale per gli esami ACCA, un&#x27;associazione professionale di contabili. Spiega che ROI e RI possono incoraggiare decisioni dysfunctional (che danneggiano l&#x27;azienda) e che, con asset a net book value (valore contabile netto), migliorano man mano che gli asset invecchiano. Conta perché aggiunge limiti che queste slide non toccano.&lt;/p&gt;
&lt;p&gt;&lt;a class=&quot;tag w&quot; href=&quot;https://www.accaglobal.com/gb/en/student/exam-support-resources/fundamentals-exams-study-resources/f5/technical-articles/performance-measurement.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fonte esterna: decentralisation&lt;/a&gt; &lt;a class=&quot;tag w&quot; href=&quot;https://www.accaglobal.com/gb/en/student/exam-support-resources/professional-exams-study-resources/p5/technical-articles/divisional-performance-management.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fonte esterna: divisional&lt;/a&gt; &lt;a class=&quot;tag w&quot; href=&quot;https://www.accaglobal.com/gb/en/student/exam-support-resources/fundamentals-exams-study-resources/f5/technical-articles/trans-pricing.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fonte esterna: transfer pricing&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Dispensa universitaria sul capitolo&lt;/h4&gt;
&lt;p class=&quot;bib&quot;&gt;Universidad de Puerto Rico (dominio uprrp.edu), &lt;i&gt;Capítulo 13: Performance Measurement on Decentralized Organizations&lt;/i&gt;, PDF in spagnolo.&lt;/p&gt;
&lt;p&gt;Esercizi svolti con la stessa scomposizione ROI = margin × turnover. Avverte che il residual income non serve a confrontare divisioni di dimensione diversa, cioè il punto chiave di Ex 2.&lt;/p&gt;
&lt;p&gt;&lt;a class=&quot;tag w&quot; href=&quot;https://contabilidad.uprrp.edu/wp-content/uploads/2019/01/Cap%c3%adtulo-13-Performance-Measurement-on-Decentralized-Organizations.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fonte esterna: PDF&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Manuale aperto sul residual income&lt;/h4&gt;
&lt;p class=&quot;bib&quot;&gt;&lt;i&gt;Managerial Accounting&lt;/i&gt; (Saylor), sezione 11.5.&lt;/p&gt;
&lt;p&gt;Spiegazione gratuita del RI come misura per valutare le divisioni, dentro un capitolo sulle organizzazioni decentrate. Utile per altri esempi da svolgere.&lt;/p&gt;
&lt;p&gt;&lt;a class=&quot;tag w&quot; href=&quot;https://saylordotorg.github.io/text_managerial-accounting/s15-05-using-residual-income-ri-to-ev.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fonte esterna: Saylor&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Hirshleifer, 1956&lt;/h4&gt;
&lt;p class=&quot;bib&quot;&gt;J. Hirshleifer, «On the Economics of Transfer Pricing», &lt;i&gt;Journal of Business&lt;/i&gt;, 29(3), pp. 172–184.&lt;/p&gt;
&lt;p&gt;La prima formalizzazione economica del problema: il prezzo ottimo è legato al costo marginale del venditore. Conta perché è la radice teorica di una formula che parte dal variable cost.&lt;/p&gt;
&lt;p&gt;&lt;a class=&quot;tag w&quot; href=&quot;https://econpapers.repec.org/RePEc:ucp:jnlbus:v:29:y:1956:p:172&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fonte esterna: EconPapers&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Rassegna sul transfer pricing&lt;/h4&gt;
&lt;p class=&quot;bib&quot;&gt;A. Gavious, &lt;i&gt;Transfer Pricing: A Review&lt;/i&gt;.&lt;/p&gt;
&lt;p&gt;Ripercorre gli sviluppi del tema a partire da Hirshleifer. Da leggere per vedere quanto il problema si complica rispetto al caso dell&#x27;Ex 3.&lt;/p&gt;
&lt;p&gt;&lt;a class=&quot;tag w&quot; href=&quot;https://tzin.bgu.ac.il/~ariehg/review.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fonte esterna: review&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;OECD Transfer Pricing Guidelines&lt;/h4&gt;
&lt;p class=&quot;bib&quot;&gt;OECD, edizione 2022, pubblicata il 20 gennaio 2022. Prima versione approvata nel 1995.&lt;/p&gt;
&lt;p&gt;La guida internazionale sull&#x27;&lt;span class=&quot;t&quot;&gt;arm&#x27;s length principle&lt;/span&gt; (le transazioni tra imprese associate vanno valutate come tra parti indipendenti). Conta perché mostra l&#x27;altra faccia del tema: l&#x27;Ex 3 guarda agli incentivi interni, mentre tra Paesi diversi il transfer price ha anche rilievo fiscale.&lt;/p&gt;
&lt;p&gt;&lt;a class=&quot;tag w&quot; href=&quot;https://www.oecd-ilibrary.org/taxation/oecd-transfer-pricing-guidelines-for-multinational-enterprises-and-tax-administrations-2022_02d2274c-en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Fonte esterna: OECD&lt;/a&gt;&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

function drawTp(){
  var U=+$(&#x27;sU&#x27;).value,P=+$(&#x27;sP&#x27;).value,V=+$(&#x27;sV&#x27;).value,Sv=+$(&#x27;sS&#x27;).value,B=+$(&#x27;sB&#x27;).value,T=+$(&#x27;sT&#x27;).value;
  $(&#x27;oU&#x27;).textContent=U.toLocaleString(&#x27;en-US&#x27;);$(&#x27;oP&#x27;).textContent=&#x27;$&#x27;+P;$(&#x27;oV&#x27;).textContent=&#x27;$&#x27;+V;$(&#x27;oS&#x27;).textContent=&#x27;$&#x27;+Sv;$(&#x27;oB&#x27;).textContent=&#x27;$&#x27;+B;$(&#x27;oT&#x27;).textContent=price(T);

  bY.setAttribute(&#x27;x&#x27;,20);bY.setAttribute(&#x27;width&#x27;,Math.max(0,xMax-20));
  var ok=min&lt;=max;
  band.setAttribute(&#x27;x&#x27;,xMin);band.setAttribute(&#x27;width&#x27;,ok?xMax-xMin:0);
  tX.textContent=&#x27;X accetta da &#x27;+price(min);
  tX.setAttribute(&#x27;x&#x27;,xMin&gt;320?500:xMin);tX.setAttribute(&#x27;text-anchor&#x27;,xMin&gt;320?&#x27;end&#x27;:&#x27;start&#x27;);

  var dX=(T-min)*NEED,dY=(max-T)*NEED,dC=(max-min)*NEED;
  $(&#x27;dX&#x27;).textContent=sgn(dX);$(&#x27;dY&#x27;).textContent=sgn(dY);$(&#x27;dC&#x27;).textContent=sgn(dC);
