&lt;section id=&quot;fonti&quot; class=&quot;ochre&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;External sources&lt;/p&gt;&lt;h2&gt;Further reading&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;The slides do not cite any authors, studies, regulations or websites by name.&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;They do, however, mention concepts that point to specific texts and regulations, and a reference for each is given below. Norton, Regal, Zephyr, Redmond Awnings, Grocery Storehouse and Alpha appear to be teaching cases: they were not researched. Everything that follows is &lt;span class=&quot;tag fe&quot;&gt;external source&lt;/span&gt; material, distinct from the content of the slides. The details come from web search results: the pages were not read in full, so verify them before citing.&lt;/p&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;The Balanced Scorecard: Measures That Drive Performance&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;R. S. Kaplan, D. P. Norton, &lt;em&gt;Harvard Business Review&lt;/em&gt;, January–February 1992&lt;/p&gt;&lt;p&gt;Complements financial measures with operational measures of customers, internal processes, and the capacity to learn and improve. &lt;b&gt;Why it matters:&lt;/b&gt; it is the reference for the criticism on slide 30; it argues that measures such as ROI can give misleading signals when used alone.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://hbr.org/1992/01/the-balanced-scorecard-measures-that-drive-performance-2&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;hbr.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Divisional Performance: Measurement and Control&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;D. Solomons, Irwin, Homewood (Illinois), 1965&lt;/p&gt;&lt;p&gt;A pioneering study on measuring divisions. A Springer source credits Solomons with proposing residual income for evaluating an investment center and its manager. &lt;b&gt;Why it matters:&lt;/b&gt; it lies at the origin of the topic of slides 32–36.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://ci.nii.ac.jp/ncid/BA01277273&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CiNii record&lt;/a&gt; · &lt;a href=&quot;https://link.springer.com/chapter/10.1007/978-1-4899-7138-8_17&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Springer chapter&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;On the Economics of Transfer Pricing&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;J. Hirshleifer, &lt;em&gt;Journal of Business&lt;/em&gt;, 29(3), 1956, pp. 172–184&lt;/p&gt;&lt;p&gt;The first economic formalization of the problem: the optimal solution is reached when the seller’s marginal cost equals the buyer’s marginal margin. &lt;b&gt;Why it matters:&lt;/b&gt; it is the theoretical basis of slides 48–55.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://econpapers.repec.org/RePEc:ucp:jnlbus:v:29:y:1956:p:172&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers&lt;/a&gt; · &lt;a href=&quot;https://tzin.bgu.ac.il/~ariehg/review.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;review of transfer pricing&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Theory of the Firm&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;M. C. Jensen, W. H. Meckling, &lt;em&gt;Journal of Financial Economics&lt;/em&gt;, 3(4), 1976, pp. 305–360&lt;/p&gt;&lt;p&gt;Defines agency costs and links them to the separation of ownership and control. &lt;b&gt;Why it matters:&lt;/b&gt; it provides the theory behind the risk on slide 5, that a manager’s objectives may differ from those of the organization.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://papers.ssrn.com/abstract=94043&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SSRN&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Management Control Systems&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;K. A. Merchant, W. A. Van der Stede, Pearson, 4th ed., 2017&lt;/p&gt;&lt;p&gt;A textbook with a section on financial results control and a chapter on uncontrollable factors, which opens with the controllability principle. &lt;b&gt;Why it matters:&lt;/b&gt; it expands on slide 6.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.lehmanns.ch/media/113163808&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;table of contents&lt;/a&gt; · &lt;a href=&quot;https://akademika.no/okonomi-administrasjon-og-ledelse/management-control-systems/9781292110554&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;book page&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Managerial Accounting, chapter on decentralized performance&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;Garrison, Noreen, Brewer et al., McGraw-Hill, multiple editions&lt;/p&gt;&lt;p&gt;The chapter “Performance Measurement in Decentralized Organizations” covers ROI, residual income and transfer prices; its number varies by edition. &lt;b&gt;Why it matters:&lt;/b&gt; the structure and 11-xx numbering of the slides resemble this family of textbooks, but this is a hypothesis: the slides do not state it.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://highered.mheducation.com/sites/0072422246/student_view0/chapter10/chapter_outline.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;McGraw-Hill outline&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;OECD Transfer Pricing Guidelines&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;OECD, 2022 edition, published on 20 January 2022&lt;/p&gt;&lt;p&gt;A guide to the &lt;em&gt;arm’s length principle&lt;/em&gt; (assessing transactions as if between independent parties) for cross-border transactions between associated enterprises, for tax purposes. &lt;b&gt;Why it matters:&lt;/b&gt; it shows the other side of the topic; the slides focus on manager motivation, the OECD on taxation. Check whether a more recent edition exists.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.oecd-ilibrary.org/taxation/oecd-transfer-pricing-guidelines-for-multinational-enterprises-and-tax-administrations-2022_02d2274c-en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OECD iLibrary&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Directive 2013/34/EU&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;European Union Accounting Directive, 26 June 2013&lt;/p&gt;&lt;p&gt;Establishes that the financial statements comprise at least the balance sheet, the profit and loss account and the notes, as a single whole. &lt;b&gt;Why it matters:&lt;/b&gt; it is a European legal basis for the “mandatory set of documents” on slide 12.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2013/34/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2013/34/2026-03-18/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2026 consolidated text&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Italian Civil Code, arts. 2423 et seq.&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;Section IX, “Del bilancio” (On financial statements)&lt;/p&gt;&lt;p&gt;The financial statements consist of the balance sheet (art. 2424), the income statement (art. 2425), the cash flow statement and the notes. &lt;b&gt;Why it matters:&lt;/b&gt; the slides speak of two &lt;em&gt;main&lt;/em&gt; documents; the Italian provision lists more.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi.it&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 18 Presentation and Disclosure in Financial Statements&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;IASB, effective for annual periods beginning on or after 1 January 2027&lt;/p&gt;&lt;p&gt;Replaces IAS 1 and introduces two defined subtotals: operating profit and profit before financing and income taxes. &lt;b&gt;Why it matters:&lt;/b&gt; it directly affects the item in the ROI numerator. The status of its adoption in the EU has not been verified.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;&lt;/div&gt;&lt;/footer&gt;
