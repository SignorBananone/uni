&lt;p class=&quot;kick&quot;&gt;Study canvas · 18-19 SMA · 67 slides&lt;/p&gt;
&lt;h1&gt;Responsibility Accounting Systems&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;Delegating decisions, then measuring those who make them.&lt;/p&gt;
&lt;p class=&quot;lede&quot;&gt;As soon as a company grows, those who run it can no longer decide everything. They must delegate, and those who delegate need figures to know whether delegation is working. The lecture follows this thread in six stages.&lt;/p&gt;
&lt;p&gt;It begins with &lt;dfn lang=&quot;en&quot;&gt;decentralization&lt;/dfn&gt; (the distribution of decision-making authority across the organization). Next, &lt;dfn lang=&quot;en&quot;&gt;responsibility accounting&lt;/dfn&gt; (the accounting that assigns to each manager only what that manager controls) defines what each person is responsible for. The financial statements then provide the inputs for the two performance measures: &lt;dfn lang=&quot;en&quot;&gt;ROI&lt;/dfn&gt; (return on investment, the percentage return on the assets used in operations) and &lt;dfn lang=&quot;en&quot;&gt;residual income&lt;/dfn&gt; (the income remaining above the required minimum). Finally, the lecture addresses the &lt;dfn lang=&quot;en&quot;&gt;transfer price&lt;/dfn&gt;: the price at which two parts of the same company sell goods to each other.&lt;/p&gt;

&lt;span&gt;Figures keep the format used in the slides: $30,000 and 21.8%.&lt;/span&gt;

&lt;section id=&quot;p1&quot; class=&quot;sage&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Part 1 · slides 2–5&lt;/p&gt;&lt;h2&gt;Why delegate, and what is at risk&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;Except in very small organizations, owners and top management cannot make every decision themselves.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;
&lt;p&gt;The slides describe a chain with two stages of delegation &lt;span class=&quot;tag&quot;&gt;slide 2&lt;/span&gt;. The first runs from the &lt;em&gt;owners&lt;/em&gt; (for example the &lt;em&gt;stockholders&lt;/em&gt;, i.e. the shareholders) to the top managers. The second runs from the top managers to their subordinates. Each stage has its own control instrument.&lt;/p&gt;
&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Corporate governance systems&lt;/dfn&gt;: the rules and mechanisms through which owners direct and oversee top management. The slide refers to lecture #4.&lt;/p&gt;
&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Management control systems&lt;/dfn&gt;: the tools through which top managers direct and control the actions of their subordinates. This lecture studies one part of them: responsibility centers and their measures.&lt;/p&gt;
&lt;p&gt;In a &lt;dfn lang=&quot;en&quot;&gt;decentralized organization&lt;/dfn&gt;, decision-making authority is spread throughout the organization rather than confined to a few top executives.&lt;/p&gt;
&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 460 300&quot; role=&quot;img&quot; aria-label=&quot;Chain of delegation: owners, top managers, subordinates, with the control systems between one level and the next&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;10&quot; y=&quot;8&quot; width=&quot;250&quot; height=&quot;52&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;24&quot; y=&quot;39&quot; class=&quot;ser&quot;&gt;Owners (stockholders)&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;10&quot; y=&quot;124&quot; width=&quot;250&quot; height=&quot;52&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;24&quot; y=&quot;155&quot; class=&quot;ser&quot;&gt;Top managers&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;10&quot; y=&quot;240&quot; width=&quot;250&quot; height=&quot;52&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;24&quot; y=&quot;271&quot; class=&quot;ser&quot;&gt;Subordinates&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M48 60V122&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M48 176V238&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;text x=&quot;62&quot; y=&quot;88&quot; class=&quot;b&quot;&gt;corporate governance systems&lt;/text&gt;&lt;text x=&quot;62&quot; y=&quot;108&quot; class=&quot;mu&quot;&gt;the subject of lecture #4&lt;/text&gt;
&lt;text x=&quot;62&quot; y=&quot;204&quot; class=&quot;b&quot;&gt;management control systems&lt;/text&gt;&lt;text x=&quot;62&quot; y=&quot;224&quot; class=&quot;mu&quot;&gt;the subject of this lecture&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Two cascading delegations, two control systems. Diagram built from slide 2.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;/div&gt;

&lt;h3&gt;The pros and cons of decentralization&lt;/h3&gt;
&lt;p&gt;The slides list five benefits and four disadvantages &lt;span class=&quot;tag&quot;&gt;slides 3–5&lt;/span&gt;. Open each item: the headings come from the slides, while the explanations are added here &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;
&lt;h4&gt;Benefits&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;Top management freed to concentrate on strategy&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Top management is relieved of day-to-day decisions and can devote itself to long-term choices.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Lower-level decisions often based on better information&lt;/summary&gt;&lt;div&gt;&lt;p&gt;People working close to the market or the plant see details that reach headquarters late or filtered. A store manager knows which product remains unsold.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Lower-level managers can respond quickly to customers&lt;/summary&gt;&lt;div&gt;&lt;p&gt;If a request does not have to travel up the hierarchy and back down again, the response arrives sooner.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Lower-level managers gain experience in decision-making&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Making decisions is also training: in this way the company prepares its future executives.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Decision-making authority leads to job satisfaction&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Having autonomy makes work more motivating.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;h4&gt;Disadvantages&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;Decisions without seeing the “big picture”&lt;/summary&gt;&lt;div&gt;&lt;p&gt;A local manager knows their own area well but may overlook the effects on the rest of the company or on its strategy.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Lack of coordination among autonomous managers&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Each unit optimizes on its own. This is precisely where transfer pricing (Part 6) arises: two autonomous divisions that must reach an agreement.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Lower-level manager’s objectives may not be those of the organization&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Managers respond to the measure on which they are evaluated. The classic case is rejecting a worthwhile investment to avoid lowering one’s own ROI (Part 5).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Difficult to spread innovative ideas&lt;/summary&gt;&lt;div&gt;&lt;p&gt;A good idea born in one division may stay there if there is no channel for circulating it or if units see one another as rivals.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;p&gt;&lt;b&gt;The thread of the lecture.&lt;/b&gt; The disadvantages explain everything that follows: measures are needed to align managers with the company (Parts 4 and 5), and rules are needed for internal exchanges (Part 6). &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;chk&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between corporate governance systems and management control systems?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The level of delegation differs. The former enable owners to delegate to top managers. The latter enable top managers to delegate to subordinates.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Is a company whose founder approves every purchase decentralized?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Decision-making authority is confined to the top: the opposite of the definition on slide 2.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Which disadvantage of decentralization can be seen in the rejection of an investment that would benefit the company?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Lower-level manager’s objectives may not be those of the organization: the manager’s objectives, in this case defending their own ROI, do not coincide with those of the company.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;p2&quot; class=&quot;ochre&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Part 2 · slides 6–10&lt;/p&gt;&lt;h2&gt;What each manager is responsible for&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;Managers answer only for what they truly control. This rule gives rise to three types of center.&lt;/p&gt;&lt;/div&gt;
&lt;blockquote&gt;Managers are held responsible for those items, and &lt;em&gt;only&lt;/em&gt; those items, that they can actually control to a significant extent. &lt;span class=&quot;tag&quot;&gt;slide 6&lt;/span&gt;&lt;/blockquote&gt;
&lt;p&gt;This is the core of responsibility accounting. If a manager were judged on items they cannot influence, the measure would say nothing about their work and would not guide their choices &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;. Textbooks call this rule the &lt;em&gt;controllability principle&lt;/em&gt; &lt;a class=&quot;tag fe&quot; href=&quot;https://www.lehmanns.ch/media/113163808&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;A &lt;dfn lang=&quot;en&quot;&gt;responsibility center&lt;/dfn&gt; (RC) is any part of the organization whose manager controls, and is held responsible for, cost, profit or investments &lt;span class=&quot;tag&quot;&gt;slide 6&lt;/span&gt;. Profit is the difference between &lt;em&gt;revenues&lt;/em&gt; and costs. There are three main types &lt;span class=&quot;tag&quot;&gt;slide 7&lt;/span&gt;, and each adds one lever to the previous type.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 460 290&quot; role=&quot;img&quot; aria-label=&quot;Three nested rectangles: the cost center controls costs, the profit center adds revenues, the investment center adds investments&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;6&quot; y=&quot;6&quot; width=&quot;448&quot; height=&quot;278&quot; rx=&quot;4&quot; style=&quot;fill-opacity:.35&quot;/&gt;&lt;rect class=&quot;bx&quot; x=&quot;30&quot; y=&quot;66&quot; width=&quot;400&quot; height=&quot;200&quot; rx=&quot;4&quot; style=&quot;fill-opacity:.7&quot;/&gt;&lt;rect class=&quot;bx&quot; x=&quot;54&quot; y=&quot;126&quot; width=&quot;352&quot; height=&quot;122&quot; rx=&quot;4&quot;/&gt;
&lt;text x=&quot;22&quot; y=&quot;34&quot; class=&quot;ser&quot;&gt;Investment center&lt;/text&gt;&lt;text x=&quot;22&quot; y=&quot;55&quot; class=&quot;mu&quot;&gt;+ investments in operating assets&lt;/text&gt;
&lt;text x=&quot;46&quot; y=&quot;94&quot; class=&quot;ser&quot;&gt;Profit center&lt;/text&gt;&lt;text x=&quot;46&quot; y=&quot;115&quot; class=&quot;mu&quot;&gt;+ revenues&lt;/text&gt;
&lt;text x=&quot;70&quot; y=&quot;172&quot; class=&quot;ser&quot;&gt;Cost center&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;196&quot;&gt;costs only&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;220&quot; class=&quot;mu&quot;&gt;no revenues or investment funds&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Each level contains the levers of the previous one and adds another. Diagram built from slides 8–10.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Types of responsibility center&quot;&gt;
&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tc1&quot; aria-controls=&quot;pc1&quot;&gt;Cost&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tc2&quot; aria-controls=&quot;pc2&quot;&gt;Profit&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tc3&quot; aria-controls=&quot;pc3&quot;&gt;Investment&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pc1&quot; aria-labelledby=&quot;tc1&quot;&gt;&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Cost center&lt;/dfn&gt;: the manager controls costs, but neither revenues nor investment funds &lt;span class=&quot;tag&quot;&gt;slide 8&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Example&lt;/b&gt; &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;: the payroll office or the maintenance department of a plant. They sell nothing; the assessment is whether they do the work at the expected cost.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pc2&quot; aria-labelledby=&quot;tc2&quot;&gt;&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Profit center&lt;/dfn&gt;: the manager controls both costs and revenues, but not investment funds &lt;span class=&quot;tag&quot;&gt;slide 9&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Revenues&lt;/b&gt;: sales, interest, other. &lt;b&gt;Costs&lt;/b&gt;: mfg. costs (manufacturing costs), commissions, salaries, other.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Example&lt;/b&gt; &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;: a store that decides its prices and staffing, while the opening of new premises is up to headquarters.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pc3&quot; aria-labelledby=&quot;tc3&quot;&gt;&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Investment center&lt;/dfn&gt;: the manager controls costs, revenues and investments in &lt;dfn lang=&quot;en&quot;&gt;operating assets&lt;/dfn&gt; (the assets used in core operations: operating cash, receivables, inventory, plant) &lt;span class=&quot;tag&quot;&gt;slide 10&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Measures&lt;/b&gt;: ROI and residual income, Parts 4 and 5.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Example&lt;/b&gt; &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;: a division that can also decide on the purchase of new plant.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;caption&gt;Who controls what&lt;/caption&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Responsibility center&lt;/th&gt;&lt;th&gt;Costs&lt;/th&gt;&lt;th&gt;Revenues&lt;/th&gt;&lt;th&gt;Investments&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Cost center&lt;/td&gt;&lt;td&gt;yes&lt;/td&gt;&lt;td&gt;no&lt;/td&gt;&lt;td&gt;no&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Profit center&lt;/td&gt;&lt;td&gt;yes&lt;/td&gt;&lt;td&gt;yes&lt;/td&gt;&lt;td&gt;no&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Investment center&lt;/td&gt;&lt;td&gt;yes&lt;/td&gt;&lt;td&gt;yes&lt;/td&gt;&lt;td&gt;yes&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

&lt;div class=&quot;chk&quot;&gt;&lt;h3&gt;Self-check: which center is it?&lt;/h3&gt;
&lt;p&gt;Cases invented for practice &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;. Choose one answer.&lt;/p&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;0&quot;&gt;&lt;p&gt;The department that assembles the products has a spending budget. It does not set prices or decide on new machinery.&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Cost center&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Profit center&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Investment center&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;Cost center: it controls costs only.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;2&quot;&gt;&lt;p&gt;The Europe division decides on price lists, selling expenses and the construction of a new warehouse.&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Cost center&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Profit center&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Investment center&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;Investment center: all three levers are present, including investment in operating assets.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;1&quot;&gt;&lt;p&gt;The manager of a restaurant in a chain chooses menus, prices and shifts. Premises and furnishings are decided by headquarters.&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Cost center&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Profit center&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Investment center&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;Profit center: costs and revenues yes, investments no.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Why would it be inappropriate to evaluate the manager of a profit center on ROI?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;ROI has operating assets in the denominator, and that manager does not control them. The manager would be judged on an item outside their control, contrary to the principle on slide 6.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;p3&quot; class=&quot;slate&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Part 3 · slides 12–20&lt;/p&gt;&lt;h2&gt;Where the figures come from&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;ROI and residual income are calculated from financial statement items: before using them, one must know how to read them.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;
&lt;p&gt;The &lt;dfn lang=&quot;en&quot;&gt;financial statement&lt;/dfn&gt; (FS) is a mandatory set of documents that companies prepare every year. It includes two main documents &lt;span class=&quot;tag&quot;&gt;slides 12–13&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Income statement&lt;/dfn&gt; (IS): compares positive and negative items of income. The difference is the &lt;dfn lang=&quot;en&quot;&gt;net income&lt;/dfn&gt; (profit or loss) realized during the year.&lt;/p&gt;
&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Balance sheet&lt;/dfn&gt; (BS): shows &lt;dfn lang=&quot;en&quot;&gt;assets&lt;/dfn&gt;, &lt;dfn lang=&quot;en&quot;&gt;liabilities&lt;/dfn&gt; and &lt;dfn lang=&quot;en&quot;&gt;equity&lt;/dfn&gt; at year-end. The two sides are equal: assets = liabilities + equity.&lt;/p&gt;
&lt;p&gt;Net income does not stand alone: it flows into equity &lt;span class=&quot;tag&quot;&gt;slide 13&lt;/span&gt;. The income statement is the film of the year; the balance sheet is the snapshot of its last day &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;To assess financial health, the financial statement is “analysed”: BS and IS items are repositioned to extract more information from them &lt;span class=&quot;tag&quot;&gt;slide 14&lt;/span&gt;. This is what the net operating income subtotal does, for example.&lt;/p&gt;
&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 480 310&quot; role=&quot;img&quot; aria-label=&quot;Income statement on the left, balance sheet on the right. Net income from the income statement flows into equity on the balance sheet&quot;&gt;
&lt;text x=&quot;10&quot; y=&quot;20&quot; class=&quot;ser&quot;&gt;Income statement&lt;/text&gt;&lt;text x=&quot;270&quot; y=&quot;20&quot; class=&quot;ser&quot;&gt;Balance sheet&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;10&quot; y=&quot;34&quot; width=&quot;100&quot; height=&quot;136&quot; style=&quot;fill-opacity:.6&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot;&gt;Negative&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot;&gt;items&lt;/text&gt;
&lt;rect x=&quot;10&quot; y=&quot;170&quot; width=&quot;100&quot; height=&quot;70&quot; style=&quot;fill:none;stroke:var(--p);stroke-width:1.5;stroke-dasharray:4 3&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;201&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Net&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;219&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;income&lt;/text&gt;
&lt;rect x=&quot;110&quot; y=&quot;34&quot; width=&quot;100&quot; height=&quot;206&quot; style=&quot;fill:var(--p)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot;&gt;Positive&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot;&gt;items&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;270&quot; y=&quot;34&quot; width=&quot;100&quot; height=&quot;206&quot; style=&quot;fill-opacity:.6&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;142&quot; text-anchor=&quot;middle&quot;&gt;Assets&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;370&quot; y=&quot;34&quot; width=&quot;100&quot; height=&quot;136&quot;/&gt;&lt;text x=&quot;420&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot;&gt;Liabilities&lt;/text&gt;
&lt;rect x=&quot;370&quot; y=&quot;170&quot; width=&quot;100&quot; height=&quot;70&quot; style=&quot;fill:var(--p)&quot;/&gt;&lt;text x=&quot;420&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper)&quot;&gt;Equity&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M60 240V270H420V242&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;292&quot; text-anchor=&quot;middle&quot; class=&quot;mu&quot;&gt;net income flows into equity&lt;/text&gt;

&lt;h3&gt;The items, one by one&lt;/h3&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Balance sheet items&quot;&gt;
&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tb1&quot; aria-controls=&quot;pb1&quot;&gt;Assets&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tb2&quot; aria-controls=&quot;pb2&quot;&gt;Liabilities&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tb3&quot; aria-controls=&quot;pb3&quot;&gt;Equity&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pb1&quot; aria-labelledby=&quot;tb1&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Slide 15&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Cash and cash equivalent&lt;/b&gt;: amounts in checking and savings accounts, plus cash on hand.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Account receivables&lt;/b&gt; (or trade receivables): amounts owed by customers for goods or services already delivered or sold.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Inventories&lt;/b&gt;: goods in stock, available for sale.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Property, plant and equipment&lt;/b&gt;: assets not quickly convertible into cash, such as computers, cars and plant.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Securities&lt;/b&gt;: bonds, shares or stakes in other companies purchased for investment purposes.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pb2&quot; aria-labelledby=&quot;tb2&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Slide 17&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Bank overdraft&lt;/b&gt;: funds withdrawn in excess of the account balance, generally to pay suppliers.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Account payable&lt;/b&gt; (or trade payable): amounts owed to suppliers for goods or services already received.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Note payable&lt;/b&gt;: an obligation to repay a borrowed sum by a future date.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Severance provisions&lt;/b&gt; (employee benefit liabilities): an obligation to employees, paid at the end of the employment relationship.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Long term borrowings&lt;/b&gt;: debts owed to lenders, for example a bank mortgage. &lt;em&gt;Long term&lt;/em&gt; means repayment beyond 12 months.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pb3&quot; aria-labelledby=&quot;tb3&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Slides 18–19&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Share capital&lt;/b&gt;: amounts invested by the owners.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Retained earnings&lt;/b&gt; (or reserves): the sum of the profits over the company’s life not distributed to owners as dividends (dividends are distributions of profit).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Net income&lt;/b&gt;: the difference between positive and negative items, a profit or a loss.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Par value&lt;/b&gt;: the nominal value of a share. &lt;b&gt;APIC&lt;/b&gt; (additional paid-in capital): the amount an investor pays above par value.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The Norton Corporation case&lt;/h3&gt;
&lt;p&gt;The statements from slides 16, 19 and 20, with the same items used for ROI.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;caption&gt;Assets, December 31 &lt;span class=&quot;tag&quot;&gt;slide 16&lt;/span&gt;&lt;/caption&gt;

&lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$30,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$20,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Accounts receivable, net&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;17,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Inventory&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;12,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Prepaid expenses&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Total current assets&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;65,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;49,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Land&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;165,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;123,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Buildings and equipment, net&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;116,390&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;128,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Total property and equipment&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;281,390&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;251,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total assets&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$346,390&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$300,000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;caption&gt;Liabilities and equity &lt;span class=&quot;tag&quot;&gt;slide 19&lt;/span&gt;&lt;/caption&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;This Year&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Last Year&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Accounts payable&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$39,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$40,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Notes payable, short-term&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Total current liabilities&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;42,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;42,000&lt;/td&gt;&lt;/tr&gt;

&lt;tr&gt;&lt;td&gt;&lt;b&gt;Total liabilities&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;112,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;120,000&lt;/td&gt;&lt;/tr&gt;

&lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Additional paid-in capital&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;158,100&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;113,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;ind&quot;&gt;&lt;td&gt;Retained earnings&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;48,890&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;50,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Total stockholders’ equity&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;234,390&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;180,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total liabilities and equity&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$346,390&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$300,000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure&gt;
&lt;h4&gt;Income statement: from sales to net income &lt;span class=&quot;tag&quot;&gt;slide 20&lt;/span&gt;&lt;/h4&gt;
&lt;div class=&quot;btns needjs&quot; role=&quot;group&quot; aria-label=&quot;Year&quot;&gt;&lt;button type=&quot;button&quot; data-yr=&quot;t&quot; aria-pressed=&quot;true&quot;&gt;This Year&lt;/button&gt;&lt;button type=&quot;button&quot; data-yr=&quot;l&quot; aria-pressed=&quot;false&quot;&gt;Last Year&lt;/button&gt;&lt;/div&gt;
&lt;svg id=&quot;wf&quot; viewBox=&quot;0 0 480 296&quot; role=&quot;img&quot; aria-label=&quot;Waterfall from sales to net income for Norton Corporation&quot;&gt;&lt;/svg&gt;
&lt;figcaption id=&quot;wfnote&quot; aria-live=&quot;polite&quot;&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Gross margin&lt;/dfn&gt; = revenues − cost of goods sold: it considers only the cost of the product, not selling and administrative expenses. &lt;dfn lang=&quot;en&quot;&gt;Interest expense&lt;/dfn&gt; is the cost of financial resources &lt;span class=&quot;tag&quot;&gt;slide 20&lt;/span&gt;. &lt;dfn lang=&quot;en&quot;&gt;Net operating income&lt;/dfn&gt; is the result of core operations, before interest and taxes.&lt;/p&gt;

&lt;div class=&quot;chk&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Does Norton’s balance sheet balance in both years?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Yes. This Year: 112,000 + 234,390 = 346,390. Last Year: 120,000 + 180,000 = 300,000. Check added here. &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Norton has a net income of $53,690, but retained earnings fall from 50,000 to 48,890. How is this possible?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;More profit was distributed than was generated: 50,000 + 53,690 − dividends = 48,890, so dividends = $54,800. This is an inference that assumes no other movements: the slide does not report dividends. &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is Norton’s ROI This Year, if all assets are treated as operating?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Average operating assets = (346,390 + 300,000) ÷ 2 = $323,195. ROI = 84,000 ÷ 323,195 = 26.0%. Margin 17.0%, turnover 1.53. The slides do not perform this calculation, and the assumption about all assets is a simplification. &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Where is the line between long term and short term?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;At 12 months: beyond that, the debt is long term (slide 17).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;p4&quot; class=&quot;brick&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Part 4 · slides 11, 21–30 · Learning Objective 1&lt;/p&gt;&lt;h2&gt;Return on investment&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;How much operating income does each dollar of operating assets generate? In short: is the core business doing well?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;span&gt;ROI =&lt;/span&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Net operating income&lt;/span&gt;&lt;span&gt;Average operating assets&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;
&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;ROI&lt;/dfn&gt; compares operating income with operating assets and is a measure of profitability &lt;span class=&quot;tag&quot;&gt;slide 21&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;In the numerator&lt;/b&gt;, net operating income coincides with &lt;dfn lang=&quot;en&quot;&gt;EBIT&lt;/dfn&gt; (earnings before interest and taxes) &lt;span class=&quot;tag&quot;&gt;slide 22&lt;/span&gt;. Excluding interest and taxes isolates operations from the way they are financed and from taxation &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;In the denominator&lt;/b&gt; are cash, accounts receivable, inventory, plant and equipment, and other productive assets &lt;span class=&quot;tag&quot;&gt;slide 22&lt;/span&gt;. The average is used because income accrues throughout the year, whereas the balance sheet is a snapshot. Usually: (beginning assets + ending assets) ÷ 2 &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;Breaking ROI down shows &lt;em&gt;where&lt;/em&gt; it comes from &lt;span class=&quot;tag&quot;&gt;slides 23–25&lt;/span&gt;:&lt;/p&gt;
&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Margin&lt;/dfn&gt;: the ability to generate operating income from sales. &lt;dfn lang=&quot;en&quot;&gt;Turnover&lt;/dfn&gt;: efficiency in the use of assets, that is, how many times in a year assets are “used” to produce sales.&lt;/p&gt;
&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 470 280&quot; role=&quot;img&quot; aria-label=&quot;ROI tree: ROI equals margin times turnover. Margin is net operating income over sales. Turnover is sales over average operating assets. Net operating income is sales minus operating expenses&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;165&quot; y=&quot;6&quot; width=&quot;140&quot; height=&quot;44&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; class=&quot;ser&quot;&gt;ROI&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M205 50 110 86&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M265 50 360 86&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot; class=&quot;ser&quot;&gt;×&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;20&quot; y=&quot;88&quot; width=&quot;180&quot; height=&quot;62&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; class=&quot;ser&quot;&gt;Margin&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; class=&quot;sm&quot;&gt;NOI ÷ Sales&lt;/text&gt;

&lt;div class=&quot;formula&quot;&gt;&lt;span&gt;ROI = Margin × Turnover =&lt;/span&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Net operating income&lt;/span&gt;&lt;span&gt;Sales&lt;/span&gt;&lt;/span&gt;&lt;span&gt;×&lt;/span&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Sales&lt;/span&gt;&lt;span&gt;Average operating assets&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;

&lt;h3&gt;The Regal Company case, step by step&lt;/h3&gt;
&lt;div class=&quot;steps&quot; data-steps aria-live=&quot;polite&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;The data &lt;span class=&quot;tag&quot;&gt;slide 26&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Net operating income $30,000, average operating assets $200,000, sales $500,000, operating expenses $470,000.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Margin&lt;/h4&gt;&lt;p&gt;$30,000 ÷ $500,000 = &lt;b&gt;6%&lt;/b&gt;. Each dollar of sales leaves 6 cents of operating income.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Turnover&lt;/h4&gt;&lt;p&gt;$500,000 ÷ $200,000 = &lt;b&gt;2.5&lt;/b&gt;. Assets “turn over” two and a half times a year.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;ROI &lt;span class=&quot;tag&quot;&gt;slide 27&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;6% × 2.5 = &lt;b&gt;15%&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;The manager invests &lt;span class=&quot;tag&quot;&gt;slide 28&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;A $30,000 machine increases sales by $35,000 and operating expenses by $15,000. New data: NOI $50,000, assets $230,000, sales $535,000, expenses $485,000.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;New ROI &lt;span class=&quot;tag&quot;&gt;slide 29&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;9.35% × 2.33 = &lt;b&gt;21.8%&lt;/b&gt;. ROI rises from 15% to 21.8%: margin improves far more than turnover worsens.&lt;/p&gt;&lt;p&gt;Calculated without rounding, $50,000 ÷ $230,000 = 21.74%. The slide’s 21.8% results from multiplying factors that have already been rounded &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;prev&quot;&gt;Back&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;next&quot;&gt;Next&lt;/button&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;Move the ROI levers&lt;/h4&gt;
&lt;p&gt;The objective of slide 11: to see how sales, expenses and assets change ROI. Start from Regal.&lt;/p&gt;
&lt;div class=&quot;btns&quot; role=&quot;group&quot; aria-label=&quot;Scenarios&quot;&gt;
&lt;button type=&quot;button&quot; data-roi=&quot;500000,470000,200000&quot;&gt;Regal baseline&lt;/button&gt;&lt;button type=&quot;button&quot; data-roi=&quot;535000,485000,230000&quot;&gt;After the investment&lt;/button&gt;&lt;button type=&quot;button&quot; data-roi=&quot;500000,460000,200000&quot;&gt;Expenses −$10,000&lt;/button&gt;&lt;button type=&quot;button&quot; data-roi=&quot;500000,470000,180000&quot;&gt;Assets −$20,000&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span&gt;Sales &lt;output id=&quot;r-so&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;r-s&quot; type=&quot;range&quot; min=&quot;200000&quot; max=&quot;800000&quot; step=&quot;5000&quot; value=&quot;500000&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span&gt;Operating expenses &lt;output id=&quot;r-eo&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;r-e&quot; type=&quot;range&quot; min=&quot;150000&quot; max=&quot;800000&quot; step=&quot;5000&quot; value=&quot;470000&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span&gt;Average operating assets &lt;output id=&quot;r-ao&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;r-a&quot; type=&quot;range&quot; min=&quot;100000&quot; max=&quot;400000&quot; step=&quot;5000&quot; value=&quot;200000&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;reads&quot;&gt;&lt;div class=&quot;read&quot;&gt;&lt;small&gt;NOI&lt;/small&gt;&lt;b id=&quot;r-n&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;read&quot;&gt;&lt;small&gt;Margin&lt;/small&gt;&lt;b id=&quot;r-m&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;read&quot;&gt;&lt;small&gt;Turnover&lt;/small&gt;&lt;b id=&quot;r-t&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;read&quot;&gt;&lt;small&gt;ROI&lt;/small&gt;&lt;b id=&quot;r-r&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;msg&quot; id=&quot;r-msg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;figure style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 480 330&quot; role=&quot;img&quot; aria-label=&quot;Chart with turnover on the horizontal axis and margin on the vertical axis. The curves join combinations with the same ROI; the dot shows the current scenario&quot;&gt;
&lt;path class=&quot;ax&quot; d=&quot;M50 30V285H465&quot;/&gt;

&lt;text class=&quot;sm mu&quot; x=&quot;154&quot; y=&quot;304&quot; text-anchor=&quot;middle&quot;&gt;1&lt;/text&gt;&lt;text class=&quot;sm mu&quot; x=&quot;257&quot; y=&quot;304&quot; text-anchor=&quot;middle&quot;&gt;2&lt;/text&gt;&lt;text class=&quot;sm mu&quot; x=&quot;361&quot; y=&quot;304&quot; text-anchor=&quot;middle&quot;&gt;3&lt;/text&gt;&lt;text class=&quot;sm mu&quot; x=&quot;465&quot; y=&quot;304&quot; text-anchor=&quot;end&quot;&gt;4&lt;/text&gt;&lt;/g&gt;
&lt;text x=&quot;257&quot; y=&quot;324&quot; text-anchor=&quot;middle&quot; class=&quot;sm mu&quot;&gt;turnover (horizontal axis), margin (vertical axis)&lt;/text&gt;

&lt;/svg&gt;

&lt;/div&gt;

&lt;h3&gt;Three criticisms of ROI &lt;span class=&quot;tag&quot;&gt;slide 30&lt;/span&gt;&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Without a balanced scorecard, management may not know how to increase it&lt;/summary&gt;&lt;div&gt;&lt;p&gt;ROI tells &lt;em&gt;how much&lt;/em&gt;, not &lt;em&gt;how&lt;/em&gt;. The &lt;dfn lang=&quot;en&quot;&gt;balanced scorecard&lt;/dfn&gt; (a system that complements financial measures with measures of customers, internal processes and learning) serves to link the figures to actions &lt;a class=&quot;tag fe&quot; href=&quot;https://hbr.org/1992/01/the-balanced-scorecard-measures-that-drive-performance-2&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Managers inherit committed costs that they do not control&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Committed costs&lt;/dfn&gt; are costs fixed by past decisions, such as multi-year contracts or plant already purchased &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;. They weigh on the ROI of whoever arrives later: a tension with the principle on slide 6.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Managers evaluated on ROI may reject profitable investments&lt;/summary&gt;&lt;div&gt;&lt;p&gt;If a project returns more than the company minimum but less than the division’s current ROI, accepting it lowers the average. The manager rejects it even though the company would benefit. This is the origin of residual income.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;note trap&quot; style=&quot;margin-top:1.6rem&quot;&gt;&lt;h4&gt;Three terminology traps&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;Margin ≠ gross margin.&lt;/b&gt; The margin in ROI is NOI ÷ sales, a percentage. Gross margin is sales − cost of goods sold, an amount.&lt;br&gt;&lt;b&gt;Net operating income ≠ net income.&lt;/b&gt; The former is before interest and taxes, the latter after. Norton: $84,000 versus $53,690.&lt;br&gt;&lt;b&gt;Turnover&lt;/b&gt; here is a number of times, not revenue, as it can mean in other contexts. &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;chk&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;If sales increase while expenses and assets stay the same, what happens to margin and turnover?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Both rise: NOI grows proportionally more than sales, and sales grow on the same assets. Try it in the simulator.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Regal reduces assets by $20,000, leaving everything else unchanged. New ROI?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;$30,000 ÷ $180,000 = 16.67%. Margin stays at 6%, turnover rises to 2.78.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is net income not used in the numerator?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because net income is already net of interest and taxes, which reflect financing and tax choices. The ROI on slide 21 aims to answer a different question: is the core business doing well?&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;p5&quot; class=&quot;brick&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Part 5 · slides 31–46 · Learning Objective 2&lt;/p&gt;&lt;h2&gt;Residual income&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;Not how much assets return in percentage terms, but how many dollars are earned above the required minimum.&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Residual income&lt;/dfn&gt; (RI) is the net operating income in excess of a minimum return on operating assets &lt;span class=&quot;tag&quot;&gt;slide 32&lt;/span&gt;. The &lt;dfn lang=&quot;en&quot;&gt;minimum required rate of return&lt;/dfn&gt; is the lowest return the company accepts on invested capital.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;span&gt;Residual income = Net operating income − (&lt;/span&gt;&lt;span&gt;Average operating assets × Minimum required rate of return&lt;/span&gt;&lt;span&gt;)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;ROI&lt;/th&gt;&lt;th&gt;Residual income&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Question&lt;/b&gt;&lt;/td&gt;&lt;td&gt;How much does each dollar of assets return?&lt;/td&gt;&lt;td&gt;How much remains above the required minimum?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Result&lt;/b&gt;&lt;/td&gt;&lt;td&gt;A percentage&lt;/td&gt;&lt;td&gt;A dollar amount&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Calculation&lt;/b&gt; &lt;span class=&quot;tag&quot;&gt;slide 33&lt;/span&gt;&lt;/td&gt;&lt;td&gt;NOI relative to assets&lt;/td&gt;&lt;td&gt;NOI minus the minimum return on assets&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Investments&lt;/b&gt; &lt;span class=&quot;tag&quot;&gt;slide 36&lt;/span&gt;&lt;/td&gt;&lt;td&gt;May lead to rejecting profitable projects&lt;/td&gt;&lt;td&gt;Encourages undertaking them&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

&lt;div class=&quot;steps&quot; data-steps aria-live=&quot;polite&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;The Zephyr case, Retail Division &lt;span class=&quot;tag&quot;&gt;slide 34&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Average operating assets $100,000, required return 20%, income for the period $30,000.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Minimum required return &lt;span class=&quot;tag&quot;&gt;slide 35&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;$100,000 × 20% = &lt;b&gt;$20,000&lt;/b&gt;. This is what the division must earn to meet expectations.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Residual income&lt;/h4&gt;&lt;p&gt;$30,000 − $20,000 = &lt;b&gt;$10,000&lt;/b&gt;. The division beat the minimum by $10,000.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;prev&quot;&gt;Back&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;next&quot;&gt;Next&lt;/button&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;Does the manager sign or not?&lt;/h4&gt;
&lt;p&gt;Starting values: Redmond Awnings division, NOI $60,000 and assets $300,000, ROI 20% &lt;span class=&quot;tag&quot;&gt;slides 37–46&lt;/span&gt;. Change the project and the minimum return: see when the three answers diverge.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span&gt;Investment &lt;output id=&quot;d-io&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;d-i&quot; type=&quot;range&quot; min=&quot;20000&quot; max=&quot;300000&quot; step=&quot;10000&quot; value=&quot;100000&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span&gt;Additional NOI per year &lt;output id=&quot;d-xo&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;d-x&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;80000&quot; step=&quot;1000&quot; value=&quot;18000&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span&gt;Minimum required rate &lt;output id=&quot;d-ro&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;d-r&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;15&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;figure style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 480 130&quot; role=&quot;img&quot; aria-label=&quot;Axis of the project’s return from 0 to 40 percent, divided into zones according to the required minimum and the current ROI&quot;&gt;
&lt;rect id=&quot;d-z1&quot; y=&quot;46&quot; height=&quot;28&quot; style=&quot;fill:var(--bad);opacity:.28&quot;/&gt;&lt;rect id=&quot;d-z2&quot; y=&quot;46&quot; height=&quot;28&quot; style=&quot;fill:var(--acc);opacity:.8&quot;/&gt;&lt;rect id=&quot;d-z3&quot; y=&quot;46&quot; height=&quot;28&quot; style=&quot;fill:var(--good);opacity:.3&quot;/&gt;
&lt;text id=&quot;d-lr&quot; y=&quot;36&quot; class=&quot;sm&quot;&gt;&lt;/text&gt;&lt;text id=&quot;d-lc&quot; y=&quot;36&quot; class=&quot;sm&quot;&gt;&lt;/text&gt;
&lt;g id=&quot;d-m&quot;&gt;&lt;path d=&quot;M0 40V82&quot; style=&quot;stroke:var(--ink);stroke-width:2.5&quot;/&gt;&lt;text id=&quot;d-mt&quot; y=&quot;102&quot; class=&quot;b&quot;&gt;&lt;/text&gt;&lt;/g&gt;
&lt;text x=&quot;10&quot; y=&quot;124&quot; class=&quot;sm mu&quot;&gt;0%&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;124&quot; class=&quot;sm mu&quot; text-anchor=&quot;end&quot;&gt;40% or more&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--bad);opacity:.5&quot;&gt;&lt;/i&gt;all no&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--acc)&quot;&gt;&lt;/i&gt;conflict zone&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--good);opacity:.5&quot;&gt;&lt;/i&gt;all yes&lt;/span&gt;&lt;/div&gt;
&lt;/figure&gt;
&lt;/div&gt;
&lt;div class=&quot;verd&quot; aria-live=&quot;polite&quot;&gt;&lt;div class=&quot;vc&quot; id=&quot;d-a&quot;&gt;&lt;/div&gt;&lt;div class=&quot;vc&quot; id=&quot;d-b&quot;&gt;&lt;/div&gt;&lt;div class=&quot;vc&quot; id=&quot;d-c&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;msg&quot; id=&quot;d-msg&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;The simulator shows a general rule: RI increases when the project’s return exceeds the required minimum, which is the company’s own criterion. ROI, by contrast, compares the project with the division’s average. The conflict arises in the gap between the two values &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;.&lt;/p&gt;

&lt;div class=&quot;note&quot;&gt;&lt;h4&gt;What about the limitations?&lt;/h4&gt;&lt;p&gt;The objective on slide 31 asks for strengths and weaknesses, but the slides show only the strength. The limitation that textbooks usually cite is size &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;: RI is an amount, so it favors large divisions. With a 20% minimum and the same 25% ROI, a division with $100,000 of assets has an RI of $5,000, while one with $1,000,000 has an RI of $50,000. Same efficiency, a result ten times larger. For comparisons between different divisions, ROI remains useful.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;chk&quot;&gt;&lt;h3&gt;Self-check: the Quick Checks from the slides&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;3&quot;&gt;&lt;p&gt;1. Redmond Awnings has NOI of $60,000, average operating assets of $300,000 and a required rate of 15%. What is the ROI? &lt;span class=&quot;tag&quot;&gt;slide 37&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;25%&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;5%&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;15%&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;20%&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;Answer d: $60,000 ÷ $300,000 = 20%. The 15% is a figure not needed here.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;1&quot;&gt;&lt;p&gt;2. If evaluated on ROI, does the manager accept a $100,000 investment that generates an additional $18,000 per year? &lt;span class=&quot;tag&quot;&gt;slide 39&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Yes&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;No: $78,000 ÷ $400,000 = 19.5%, so the division’s ROI falls from 20.0%.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;0&quot;&gt;&lt;p&gt;3. With a required rate of 15%, does the company want that investment? &lt;span class=&quot;tag&quot;&gt;slide 41&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Yes&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;Yes: $18,000 ÷ $100,000 = 18%, above the 15% minimum. The company and the manager want different things.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;2&quot;&gt;&lt;p&gt;4. What is the division’s residual income? &lt;span class=&quot;tag&quot;&gt;slide 43&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;$240,000&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;$45,000&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;$15,000&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;$51,000&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;Answer c: $60,000 − (15% × $300,000) = $60,000 − $45,000 = $15,000.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;0&quot;&gt;&lt;p&gt;5. If evaluated on residual income, does the manager accept the same investment? &lt;span class=&quot;tag&quot;&gt;slide 45&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Yes&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;Yes: $78,000 − (15% × $400,000) = $18,000, that is, $3,000 more than before. Manager and company are now aligned.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;On its own, how much additional RI does the project yield? Would calculating that have been enough?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Yes: $18,000 − 15% × $100,000 = $3,000. RI is additive, so the project’s effect can be read on its own. &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;p6&quot; class=&quot;ochre&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Part 6 · slides 47–67 · Learning Objective 3&lt;/p&gt;&lt;h2&gt;Transfer pricing&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;When one division sells to another, at what price? The answer shifts profit between managers and can change their decisions.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;
&lt;p&gt;A &lt;dfn lang=&quot;en&quot;&gt;transfer price&lt;/dfn&gt; is the price charged when one segment of a company provides goods or services to another segment &lt;span class=&quot;tag&quot;&gt;slide 48&lt;/span&gt;.&lt;/p&gt;
&lt;blockquote style=&quot;font-size:1.25rem&quot;&gt;The fundamental objective is to motivate managers to act in the interest of the company as a whole. &lt;span class=&quot;tag&quot;&gt;slide 48&lt;/span&gt;&lt;/blockquote&gt;
&lt;p&gt;For the company, the internal price itself is a wash: what is revenue for the seller is a cost for the buyer. It matters, however, because each manager is evaluated on &lt;em&gt;their own&lt;/em&gt; profit, and it can derail a worthwhile exchange &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 470 210&quot; role=&quot;img&quot; aria-label=&quot;The selling division receives the transfer price, the buying division pays it. In the company total the two items cancel out&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;6&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;82&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;91&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; class=&quot;ser&quot;&gt;Selling division&lt;/text&gt;&lt;text x=&quot;91&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;+ internal revenue&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;294&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;82&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;379&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; class=&quot;ser&quot;&gt;Buying division&lt;/text&gt;&lt;text x=&quot;379&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;− internal cost&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M176 62H292&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; class=&quot;sm mu&quot;&gt;goods&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M294 88H178&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; class=&quot;sm mu&quot;&gt;transfer price&lt;/text&gt;
&lt;path class=&quot;ax&quot; d=&quot;M6 142H464&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; class=&quot;ser&quot;&gt;Company: + price − price = 0&lt;/text&gt;&lt;text x=&quot;235&quot; y=&quot;197&quot; text-anchor=&quot;middle&quot; class=&quot;mu&quot;&gt;only real costs and lost sales remain&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;/div&gt;

&lt;h3&gt;Three approaches &lt;span class=&quot;tag&quot;&gt;slide 49&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Approaches to transfer pricing&quot;&gt;
&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tt1&quot; aria-controls=&quot;pt1&quot;&gt;Negotiated&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tt2&quot; aria-controls=&quot;pt2&quot;&gt;At cost&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tt3&quot; aria-controls=&quot;pt3&quot;&gt;Market price&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pt1&quot; aria-labelledby=&quot;tt1&quot;&gt;&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Negotiated transfer price&lt;/dfn&gt;: arises from discussion between the divisions &lt;span class=&quot;tag&quot;&gt;slide 50&lt;/span&gt;. It preserves autonomy, in keeping with the spirit of decentralization, and relies on those with the best information about the costs and benefits of the exchange.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Limitations&lt;/b&gt; &lt;span class=&quot;tag&quot;&gt;slide 56&lt;/span&gt;: if a transfer increases total profits, there is &lt;em&gt;always&lt;/em&gt; a range in which both divisions gain. But if managers are pitted against each other, rather than against their own past results or reasonable benchmarks, the atmosphere becomes noncooperative. Because of the resulting disputes, most companies use other methods.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pt2&quot; aria-labelledby=&quot;tt2&quot;&gt;&lt;p&gt;&lt;b&gt;Transfer at cost&lt;/b&gt;: many companies set the price at the selling division’s &lt;dfn lang=&quot;en&quot;&gt;variable cost&lt;/dfn&gt; (a cost that varies with volume) or &lt;dfn lang=&quot;en&quot;&gt;full cost&lt;/dfn&gt; (variable cost plus a share of fixed costs) &lt;span class=&quot;tag&quot;&gt;slide 58&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Drawbacks&lt;/b&gt;: 1) full cost can lead to &lt;dfn lang=&quot;en&quot;&gt;suboptimization&lt;/dfn&gt; (choices that are good for one division but bad for the company); 2) the seller never shows a profit on internal transfers; 3) there is no incentive to control costs.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Example of suboptimization&lt;/b&gt; &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;: West Coast (below) has a full cost of $10 + $100,000 ÷ 10,000 = $20 per crate, the same price as the outside supplier. If full cost exceeded $20, Grocery Mart would buy outside even with idle capacity available, whereas for the company the real cost of an internal crate would be only $10.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pt3&quot; aria-labelledby=&quot;tt3&quot;&gt;&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Market price&lt;/dfn&gt;: the price charged on the open market, often regarded as the best approach &lt;span class=&quot;tag&quot;&gt;slide 60&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Works best&lt;/b&gt; when the product is sold as is to external customers &lt;em&gt;and&lt;/em&gt; the seller has no &lt;dfn lang=&quot;en&quot;&gt;idle capacity&lt;/dfn&gt; (unused production capacity).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Works poorly&lt;/b&gt; when there is idle capacity: the real cost of transferring internally is lower than the market price, and an excessively high price can derail the exchange. The Alpha exercise shows this: €80 against a maximum of €75.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The two formulas for the range &lt;span class=&quot;tag&quot;&gt;slides 50–52&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;The lower limit is set by the seller, the upper limit by the buyer.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;span&gt;Transfer price ≥ Variable cost per unit +&lt;/span&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Total contribution margin on lost sales&lt;/span&gt;&lt;span&gt;Number of units transferred&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;span&gt;Transfer price ≤ Cost of buying from outside supplier&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;The &lt;dfn lang=&quot;en&quot;&gt;contribution margin&lt;/dfn&gt; is the selling price minus variable cost per unit. The fraction is an &lt;dfn lang=&quot;en&quot;&gt;opportunity cost&lt;/dfn&gt; (what is given up): the external sales lost in order to serve the internal division, spread over the units transferred.&lt;/p&gt;
&lt;p&gt;If there is no outside supplier: Transfer price ≤ profit to be earned per unit sold (not including the transfer price) &lt;span class=&quot;tag&quot;&gt;slide 52&lt;/span&gt;. That is, how much the division earns per unit by reselling the product, before paying the transfer price.&lt;/p&gt;
&lt;p&gt;Fixed costs do not appear in the formula: they do not change with the transfer. In the Grocery case, the $100,000 per month is incurred regardless &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;.&lt;/p&gt;

&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;Find the range&lt;/h4&gt;
&lt;div class=&quot;btns&quot; role=&quot;group&quot; aria-label=&quot;Case&quot;&gt;&lt;button type=&quot;button&quot; data-case=&quot;g&quot;&gt;Grocery Storehouse&lt;/button&gt;&lt;button type=&quot;button&quot; data-case=&quot;a&quot;&gt;Alpha Manufacturing&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;btns&quot; id=&quot;t-pre&quot; role=&quot;group&quot; aria-label=&quot;Scenarios from the slides&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span&gt;Idle capacity &lt;output id=&quot;t-io&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;t-i&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;3000&quot; step=&quot;100&quot; value=&quot;3000&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span&gt;Proposed transfer price &lt;output id=&quot;t-po&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;t-p&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;30&quot; step=&quot;0.25&quot; value=&quot;15&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;reads&quot;&gt;&lt;div class=&quot;read&quot;&gt;&lt;small&gt;Units of lost sales&lt;/small&gt;&lt;b id=&quot;t-lost&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;read&quot;&gt;&lt;small&gt;Minimum (seller)&lt;/small&gt;&lt;b id=&quot;t-min&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;read&quot;&gt;&lt;small&gt;Maximum (buyer)&lt;/small&gt;&lt;b id=&quot;t-max&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p style=&quot;font-size:.9rem;font-variant-numeric:tabular-nums&quot;&gt;Minimum: &lt;span id=&quot;t-calc&quot;&gt;&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;figure style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 480 140&quot; role=&quot;img&quot; aria-label=&quot;Price axis with the range between the seller’s minimum and the buyer’s maximum, and the proposed price&quot;&gt;
&lt;rect id=&quot;t-band&quot; y=&quot;50&quot; height=&quot;22&quot; style=&quot;opacity:.55&quot;/&gt;
&lt;path class=&quot;ln&quot; d=&quot;M20 72H460&quot;/&gt;
&lt;line id=&quot;t-tkv&quot; y1=&quot;66&quot; y2=&quot;78&quot; class=&quot;ln&quot;/&gt;&lt;line id=&quot;t-tke&quot; y1=&quot;66&quot; y2=&quot;78&quot; class=&quot;ln&quot;/&gt;
&lt;text id=&quot;t-lmin&quot; y=&quot;40&quot; class=&quot;sm b&quot;&gt;&lt;/text&gt;&lt;text id=&quot;t-lmax&quot; y=&quot;40&quot; class=&quot;sm b&quot;&gt;&lt;/text&gt;
&lt;text id=&quot;t-tv&quot; y=&quot;130&quot; class=&quot;sm mu&quot; text-anchor=&quot;middle&quot;&gt;&lt;/text&gt;&lt;text id=&quot;t-te&quot; y=&quot;130&quot; class=&quot;sm mu&quot; text-anchor=&quot;middle&quot;&gt;&lt;/text&gt;
&lt;g id=&quot;t-mk&quot;&gt;&lt;path d=&quot;M0 46V90&quot; style=&quot;stroke:var(--ink);stroke-width:2.5&quot;/&gt;&lt;text id=&quot;t-mkt&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; class=&quot;sm b&quot;&gt;&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Green: acceptable range. Red: the limits cross, so there is no range. The dollar value below is added here &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;/div&gt;
&lt;div class=&quot;verd&quot; aria-live=&quot;polite&quot;&gt;&lt;div class=&quot;vc&quot; id=&quot;t-s&quot;&gt;&lt;/div&gt;&lt;div class=&quot;vc&quot; id=&quot;t-b&quot;&gt;&lt;/div&gt;&lt;div class=&quot;vc&quot; id=&quot;t-c&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;msg&quot; id=&quot;t-msg&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;caption&gt;Grocery Storehouse &lt;span class=&quot;tag&quot;&gt;slides 51–55&lt;/span&gt;&lt;/caption&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Idle capacity&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Lost sales&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Minimum&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Maximum&lt;/th&gt;&lt;th&gt;Range&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;3,000 crates&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$10&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$20&lt;/td&gt;&lt;td&gt;$10 – $20&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;0 crates&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$25&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$20&lt;/td&gt;&lt;td&gt;None&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;500 crates&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$17.50&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$20&lt;/td&gt;&lt;td&gt;$17.50 – $20&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;West Coast Plantations: capacity 10,000 crates per month, variable cost $10, fixed costs $100,000, external price $25. Grocery Mart: buys from outside at $20, 1,000 crates per month. Both belong to Grocery Storehouse. The threshold above which a range exists is about 334 crates of idle capacity &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;.&lt;/p&gt;

&lt;h3&gt;Exercise: Alpha Manufacturing &lt;span class=&quot;tag&quot;&gt;slides 61–67&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Components Division sells externally at €80, variable cost €45. Assembly Division needs 2,000 components and can buy them from outside at €75. Components has sufficient idle capacity and no additional fixed cost. The head of Components proposes €80, the head of Assembly will not go above €75: no agreement. Try to answer before opening each item.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;1. What is the minimum transfer price for Components?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;With sufficient idle capacity no sales are lost, so the opportunity cost is zero: €45 + €0 = &lt;b&gt;€45&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;2. Why does Components want €80 while Assembly will not exceed €75?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Components wants a high price because it increases its operating income. Assembly will not pay more than €75 because it can find identical components at that price. Each maximizes its own result, not the company’s.&lt;/p&gt;&lt;p&gt;The failure to agree costs the company 2,000 × (€75 − €45) = €60,000. &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;3. Range with idle capacity of 500 units?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Units taken from external sales: 2,000 − 500 = 1,500. Opportunity cost: (80 − 45) × 1,500 = €52,500. Minimum: €45 + €52,500 ÷ 2,000 = €45 + €26.25 = €71.25. &lt;b&gt;Range: €71.25 – €75.00.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;4. Range with idle capacity of 200 units?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Units taken: 1,800. Opportunity cost: (80 − 45) × 1,800 = €63,000. Minimum: €45 + €31.50 = €76.50, above €75. &lt;b&gt;No range.&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Buying from outside costs €150,000; producing internally costs €90,000 plus €63,000 of lost margin, i.e. €153,000. Buying from outside is better by €3,000. &lt;span class=&quot;tag ox&quot;&gt;beyond the slides&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;chk&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;1&quot;&gt;&lt;p&gt;A division with no idle capacity sells externally at $40, variable cost $25. What is the minimum for an internal transfer?&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;$25&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;$40&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;$32.50&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;$25 + ($40 − $25) = $40: each unit transferred is a lost external sale. Case invented here.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;When there is no range, did the two divisions negotiate badly?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. If the minimum exceeds the maximum, the exchange destroys value: the disagreement leads to the right decision. This is the converse of slide 56.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why does the minimum on slide 53 not depend on fixed costs?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because they exist anyway, with or without the transfer: they are not an incremental cost of the exchange.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In which situation is the market price the soundest choice?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;When the product is sold as is to external customers and there is no idle capacity (slide 60). There, the seller’s minimum coincides with the market price: variable cost + lost contribution margin.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;formule&quot; class=&quot;slate&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Review&lt;/p&gt;&lt;h2&gt;All the formulas on one page&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Measure&lt;/th&gt;&lt;th&gt;Formula&lt;/th&gt;&lt;th&gt;Answers&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;ROI&lt;/b&gt;&lt;/td&gt;&lt;td&gt;NOI ÷ average operating assets&lt;/td&gt;&lt;td&gt;Is the core business profitable?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Margin&lt;/b&gt;&lt;/td&gt;&lt;td&gt;NOI ÷ sales&lt;/td&gt;&lt;td&gt;How much of each sale remains?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Turnover&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Sales ÷ average operating assets&lt;/td&gt;&lt;td&gt;How hard are the assets working?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Decomposition&lt;/b&gt;&lt;/td&gt;&lt;td&gt;ROI = margin × turnover&lt;/td&gt;&lt;td&gt;Where does ROI come from?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Residual income&lt;/b&gt;&lt;/td&gt;&lt;td&gt;NOI − (average operating assets × minimum required rate)&lt;/td&gt;&lt;td&gt;How much is earned above the minimum?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Minimum transfer price&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Variable cost per unit + total contribution margin on lost sales ÷ units transferred&lt;/td&gt;&lt;td&gt;What does the seller need?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Maximum transfer price&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Cost of buying from outside supplier (or profit per unit, if there is no supplier)&lt;/td&gt;&lt;td&gt;What can the buyer pay?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Balance sheet&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Assets = liabilities + equity&lt;/td&gt;&lt;td&gt;Do sources and uses balance?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Gross margin&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Revenues − cost of goods sold&lt;/td&gt;&lt;td&gt;How much remains after the cost of the product?&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;h4&gt;To check against the slides&lt;/h4&gt;
&lt;ul style=&quot;margin:0&quot;&gt;&lt;li&gt;Slide 29: 21.8% results from rounded factors; the exact value is 21.74%.&lt;/li&gt;
&lt;li&gt;Slide 51: the table says “naval oranges” where &lt;em&gt;navel&lt;/em&gt; is meant.&lt;/li&gt;
&lt;li&gt;Slides 62 and 66–67 use different assumptions about idle capacity: the exercise first treats it as sufficient, then reduces it to 500 and 200 units.&lt;/li&gt;
&lt;li&gt;Slides 66–67 say that the transfer “would reduce external sales”: this refers to the portion exceeding idle capacity.&lt;/li&gt;
&lt;li&gt;Slide 31: the objective also mentions the weaknesses of RI, but the slides list none.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/section&gt;
