&lt;/figure&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Tre critiche al ROI &lt;span class=&quot;tag&quot;&gt;slide 30&lt;/span&gt;&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Senza balanced scorecard, il management può non sapere come aumentarlo&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il ROI dice &lt;em&gt;quanto&lt;/em&gt;, non &lt;em&gt;come&lt;/em&gt;. La &lt;dfn lang=&quot;en&quot;&gt;balanced scorecard&lt;/dfn&gt; (un sistema che affianca alle misure finanziarie misure su clienti, processi interni, apprendimento) serve a collegare i numeri alle azioni &lt;a class=&quot;tag fe&quot; href=&quot;https://hbr.org/1992/01/the-balanced-scorecard-measures-that-drive-performance-2&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;I manager ereditano committed costs che non controllano&lt;/summary&gt;&lt;div&gt;&lt;p&gt;I &lt;dfn lang=&quot;en&quot;&gt;committed costs&lt;/dfn&gt; sono costi fissati da decisioni passate, come contratti pluriennali o impianti già comprati &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;. Pesano sul ROI di chi arriva dopo: una frizione con il principio di slide 6.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;I manager valutati sul ROI possono rifiutare investimenti redditizi&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Se un progetto rende più del minimo aziendale ma meno del ROI attuale della divisione, accettarlo abbassa la media. Il manager lo rifiuta anche se l’azienda ci guadagnerebbe. Da qui nasce il residual income.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;note trap&quot; style=&quot;margin-top:1.6rem&quot;&gt;&lt;h4&gt;Tre trappole di lessico&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;Margin ≠ gross margin.&lt;/b&gt; Il margin del ROI è NOI ÷ sales, una percentuale. Il gross margin è sales − cost of goods sold, un importo.&lt;br&gt;&lt;b&gt;Net operating income ≠ net income.&lt;/b&gt; Il primo è prima di interessi e imposte, il secondo dopo. Norton: $84,000 contro $53,690.&lt;br&gt;&lt;b&gt;Turnover&lt;/b&gt; qui è un numero di volte, non il fatturato, come può significare in altri contesti. &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;chk&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Se le sales aumentano ma expenses e assets restano fermi, cosa succede a margin e turnover?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Salgono entrambi: NOI cresce più in proporzione delle sales, e le sales crescono sugli stessi assets. Provalo nel simulatore.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Regal riduce gli assets di $20,000 lasciando fermo il resto. Nuovo ROI?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;$30,000 ÷ $180,000 = 16.67%. Il margin resta 6%, il turnover sale a 2.78.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché a numeratore non si usa il net income?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché il net income è già al netto di interessi e imposte, che riflettono le scelte finanziarie e fiscali. Il ROI di slide 21 vuole rispondere a un’altra domanda: il core business sta andando bene?&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;p5&quot; class=&quot;brick&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Parte 5 · slide 31–46 · Learning Objective 2&lt;/p&gt;&lt;h2&gt;Residual income&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;Non quanto rendono gli assets in percentuale, ma quanti dollari si guadagnano oltre il minimo richiesto.&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Residual income&lt;/dfn&gt; (RI) è il net operating income che eccede un rendimento minimo sugli operating assets &lt;span class=&quot;tag&quot;&gt;slide 32&lt;/span&gt;. Il &lt;dfn lang=&quot;en&quot;&gt;minimum required rate of return&lt;/dfn&gt; è il rendimento più basso che l’azienda accetta sul capitale investito.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;span&gt;Residual income = Net operating income − (&lt;/span&gt;&lt;span&gt;Average operating assets × Minimum required rate of return&lt;/span&gt;&lt;span&gt;)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;ROI&lt;/th&gt;&lt;th&gt;Residual income&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Domanda&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Quanto rende ogni dollaro di assets?&lt;/td&gt;&lt;td&gt;Quanto resta oltre il minimo richiesto?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Risultato&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Una percentuale&lt;/td&gt;&lt;td&gt;Un importo in dollari&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Calcolo&lt;/b&gt; &lt;span class=&quot;tag&quot;&gt;slide 33&lt;/span&gt;&lt;/td&gt;&lt;td&gt;NOI relativo agli assets&lt;/td&gt;&lt;td&gt;NOI meno il rendimento minimo sugli assets&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Investimenti&lt;/b&gt; &lt;span class=&quot;tag&quot;&gt;slide 36&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Può far rifiutare progetti redditizi&lt;/td&gt;&lt;td&gt;Incoraggia a farli&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

&lt;div class=&quot;steps&quot; data-steps aria-live=&quot;polite&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Il caso Zephyr, Retail Division &lt;span class=&quot;tag&quot;&gt;slide 34&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Average operating assets $100,000, rendimento richiesto 20%, reddito del periodo $30,000.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Minimum required return &lt;span class=&quot;tag&quot;&gt;slide 35&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;$100,000 × 20% = &lt;b&gt;$20,000&lt;/b&gt;. È ciò che la divisione deve guadagnare per non deludere.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Residual income&lt;/h4&gt;&lt;p&gt;$30,000 − $20,000 = &lt;b&gt;$10,000&lt;/b&gt;. La divisione ha fatto meglio del minimo per $10,000.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;prev&quot;&gt;Indietro&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;next&quot;&gt;Avanti&lt;/button&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;Il manager firma o no?&lt;/h4&gt;
&lt;p&gt;Valori di partenza: divisione Redmond Awnings, NOI $60,000 e assets $300,000, ROI 20% &lt;span class=&quot;tag&quot;&gt;slide 37–46&lt;/span&gt;. Cambia il progetto e il rendimento minimo: guarda quando le tre risposte divergono.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span&gt;Investimento &lt;output id=&quot;d-io&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;d-i&quot; type=&quot;range&quot; min=&quot;20000&quot; max=&quot;300000&quot; step=&quot;10000&quot; value=&quot;100000&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span&gt;NOI aggiuntivo all’anno &lt;output id=&quot;d-xo&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;d-x&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;80000&quot; step=&quot;1000&quot; value=&quot;18000&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span&gt;Minimum required rate &lt;output id=&quot;d-ro&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;d-r&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;15&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;figure style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 480 130&quot; role=&quot;img&quot; aria-label=&quot;Asse del rendimento del progetto da 0 a 40 percento, diviso in zone in base al minimo richiesto e al ROI attuale&quot;&gt;
&lt;rect id=&quot;d-z1&quot; y=&quot;46&quot; height=&quot;28&quot; style=&quot;fill:var(--bad);opacity:.28&quot;/&gt;&lt;rect id=&quot;d-z2&quot; y=&quot;46&quot; height=&quot;28&quot; style=&quot;fill:var(--acc);opacity:.8&quot;/&gt;&lt;rect id=&quot;d-z3&quot; y=&quot;46&quot; height=&quot;28&quot; style=&quot;fill:var(--good);opacity:.3&quot;/&gt;
&lt;text id=&quot;d-lr&quot; y=&quot;36&quot; class=&quot;sm&quot;&gt;&lt;/text&gt;&lt;text id=&quot;d-lc&quot; y=&quot;36&quot; class=&quot;sm&quot;&gt;&lt;/text&gt;
&lt;g id=&quot;d-m&quot;&gt;&lt;path d=&quot;M0 40V82&quot; style=&quot;stroke:var(--ink);stroke-width:2.5&quot;/&gt;&lt;text id=&quot;d-mt&quot; y=&quot;102&quot; class=&quot;b&quot;&gt;&lt;/text&gt;&lt;/g&gt;
&lt;text x=&quot;10&quot; y=&quot;124&quot; class=&quot;sm mu&quot;&gt;0%&lt;/text&gt;&lt;text x=&quot;470&quot; y=&quot;124&quot; class=&quot;sm mu&quot; text-anchor=&quot;end&quot;&gt;40% o più&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;lg&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--bad);opacity:.5&quot;&gt;&lt;/i&gt;tutti no&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--acc)&quot;&gt;&lt;/i&gt;zona di conflitto&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--good);opacity:.5&quot;&gt;&lt;/i&gt;tutti sì&lt;/span&gt;&lt;/div&gt;
&lt;/figure&gt;
&lt;/div&gt;
&lt;div class=&quot;verd&quot; aria-live=&quot;polite&quot;&gt;&lt;div class=&quot;vc&quot; id=&quot;d-a&quot;&gt;&lt;/div&gt;&lt;div class=&quot;vc&quot; id=&quot;d-b&quot;&gt;&lt;/div&gt;&lt;div class=&quot;vc&quot; id=&quot;d-c&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;msg&quot; id=&quot;d-msg&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;Il simulatore mostra una regola generale: il RI aumenta quando il rendimento del progetto supera il minimo richiesto, che è lo stesso criterio dell’azienda. Il ROI invece confronta il progetto con la media della divisione. Il conflitto nasce nello spazio tra i due valori &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;.&lt;/p&gt;

&lt;div class=&quot;note&quot;&gt;&lt;h4&gt;E i limiti?&lt;/h4&gt;&lt;p&gt;L’obiettivo di slide 31 chiede strengths e weaknesses, ma le slide mostrano solo il punto di forza. Il limite che i manuali citano di solito è la dimensione &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;: il RI è un importo, quindi favorisce le divisioni grandi. Con minimo 20% e stesso ROI del 25%, una divisione con assets da $100,000 ha RI $5,000, una da $1,000,000 ha RI $50,000. Stessa efficienza, risultato dieci volte maggiore. Per confronti tra divisioni diverse il ROI resta utile.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;chk&quot;&gt;&lt;h3&gt;Autoverifica: i Quick Check delle slide&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;3&quot;&gt;&lt;p&gt;1. Redmond Awnings ha NOI $60,000, average operating assets $300,000, required rate 15%. Qual è il ROI? &lt;span class=&quot;tag&quot;&gt;slide 37&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;25%&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;5%&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;15%&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;20%&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;Risposta d: $60,000 ÷ $300,000 = 20%. Il 15% è un dato che qui non serve.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;1&quot;&gt;&lt;p&gt;2. Se è valutato sul ROI, il manager accetta un investimento di $100,000 che genera $18,000 in più all’anno? &lt;span class=&quot;tag&quot;&gt;slide 39&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Yes&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;No: $78,000 ÷ $400,000 = 19.5%, il ROI della divisione scende dal 20.0%.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;0&quot;&gt;&lt;p&gt;3. Con un required rate del 15%, l’azienda vuole quell’investimento? &lt;span class=&quot;tag&quot;&gt;slide 41&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Yes&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;Sì: $18,000 ÷ $100,000 = 18%, sopra il minimo del 15%. Azienda e manager vogliono cose diverse.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;2&quot;&gt;&lt;p&gt;4. Qual è il residual income della divisione? &lt;span class=&quot;tag&quot;&gt;slide 43&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;$240,000&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;$45,000&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;$15,000&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;$51,000&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;Risposta c: $60,000 − (15% × $300,000) = $60,000 − $45,000 = $15,000.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;0&quot;&gt;&lt;p&gt;5. Se è valutato sul residual income, il manager accetta lo stesso investimento? &lt;span class=&quot;tag&quot;&gt;slide 45&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Yes&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;Sì: $78,000 − (15% × $400,000) = $18,000, cioè $3,000 più di prima. Ora manager e azienda sono allineati.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Sul progetto, quanto vale da solo il RI aggiuntivo? Bastava calcolare quello?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sì: $18,000 − 15% × $100,000 = $3,000. Il RI è additivo, quindi l’effetto del progetto si legge da solo. &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;p6&quot; class=&quot;ochre&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Parte 6 · slide 47–67 · Learning Objective 3&lt;/p&gt;&lt;h2&gt;Transfer pricing&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;Quando una divisione vende all’altra, a che prezzo? La risposta sposta profitti tra manager e può cambiare le loro decisioni.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;
&lt;p&gt;Un &lt;dfn lang=&quot;en&quot;&gt;transfer price&lt;/dfn&gt; è il prezzo applicato quando un segmento dell’azienda fornisce beni o servizi a un altro segmento &lt;span class=&quot;tag&quot;&gt;slide 48&lt;/span&gt;.&lt;/p&gt;
&lt;blockquote style=&quot;font-size:1.25rem&quot;&gt;L’obiettivo fondamentale è motivare i manager ad agire nell’interesse dell’azienda nel suo insieme. &lt;span class=&quot;tag&quot;&gt;slide 48&lt;/span&gt;&lt;/blockquote&gt;
&lt;p&gt;Per l’azienda il prezzo interno in sé è una partita di giro: ciò che è ricavo per chi vende è costo per chi compra. Conta però perché ogni manager è valutato sul &lt;em&gt;proprio&lt;/em&gt; profitto, e può far saltare uno scambio conveniente &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 470 210&quot; role=&quot;img&quot; aria-label=&quot;La divisione che vende incassa il transfer price, la divisione che compra lo paga. Nel totale aziendale le due voci si annullano&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;6&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;82&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;91&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; class=&quot;ser&quot;&gt;Selling division&lt;/text&gt;&lt;text x=&quot;91&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;+ ricavo interno&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;294&quot; y=&quot;30&quot; width=&quot;170&quot; height=&quot;82&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;379&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; class=&quot;ser&quot;&gt;Buying division&lt;/text&gt;&lt;text x=&quot;379&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;− costo interno&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M176 62H292&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; class=&quot;sm mu&quot;&gt;beni&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M294 88H178&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; class=&quot;sm mu&quot;&gt;transfer price&lt;/text&gt;
&lt;path class=&quot;ax&quot; d=&quot;M6 142H464&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; class=&quot;ser&quot;&gt;Azienda: + prezzo − prezzo = 0&lt;/text&gt;&lt;text x=&quot;235&quot; y=&quot;197&quot; text-anchor=&quot;middle&quot; class=&quot;mu&quot;&gt;restano solo i costi reali e le vendite perse&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;/div&gt;

&lt;h3&gt;Tre approcci &lt;span class=&quot;tag&quot;&gt;slide 49&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Approcci al transfer pricing&quot;&gt;
&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tt1&quot; aria-controls=&quot;pt1&quot;&gt;Negotiated&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tt2&quot; aria-controls=&quot;pt2&quot;&gt;At cost&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tt3&quot; aria-controls=&quot;pt3&quot;&gt;Market price&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pt1&quot; aria-labelledby=&quot;tt1&quot;&gt;&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Negotiated transfer price&lt;/dfn&gt;: nasce dalla discussione tra le divisioni &lt;span class=&quot;tag&quot;&gt;slide 50&lt;/span&gt;. Preserva l’autonomia, in linea con lo spirito della decentralization, e usa chi ha le informazioni migliori su costi e benefici dello scambio.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Limiti&lt;/b&gt; &lt;span class=&quot;tag&quot;&gt;slide 56&lt;/span&gt;: se una transfer aumenta i profitti totali esiste &lt;em&gt;sempre&lt;/em&gt; un range in cui entrambe guadagnano. Ma se i manager sono messi l’uno contro l’altro, invece che contro i propri risultati passati o benchmark ragionevoli, l’atmosfera diventa noncooperative. Per le dispute che ne seguono, la maggior parte delle aziende usa altri metodi.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pt2&quot; aria-labelledby=&quot;tt2&quot;&gt;&lt;p&gt;&lt;b&gt;Transfer at cost&lt;/b&gt;: molte aziende fissano il prezzo al &lt;dfn lang=&quot;en&quot;&gt;variable cost&lt;/dfn&gt; (costo che varia con il volume) o al &lt;dfn lang=&quot;en&quot;&gt;full cost&lt;/dfn&gt; (variabile più quota di costi fissi) della divisione che vende &lt;span class=&quot;tag&quot;&gt;slide 58&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Drawbacks&lt;/b&gt;: 1) il full cost può portare a &lt;dfn lang=&quot;en&quot;&gt;suboptimization&lt;/dfn&gt; (scelte buone per una divisione, cattive per l’azienda); 2) chi vende non mostra mai un profitto sulle cessioni interne; 3) non c’è incentivo a controllare i costi.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Esempio di suboptimization&lt;/b&gt; &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;: West Coast (sotto) ha un full cost di $10 + $100,000 ÷ 10,000 = $20 per crate, lo stesso prezzo del fornitore esterno. Se il full cost superasse $20, Grocery Mart comprerebbe fuori anche con capacità inutilizzata, mentre per l’azienda il costo reale della cassa interna sarebbe solo $10.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pt3&quot; aria-labelledby=&quot;tt3&quot;&gt;&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Market price&lt;/dfn&gt;: il prezzo praticato sul mercato aperto, spesso considerato il miglior approccio &lt;span class=&quot;tag&quot;&gt;slide 60&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Funziona meglio&lt;/b&gt; quando il prodotto è venduto così com’è a clienti esterni &lt;em&gt;e&lt;/em&gt; chi vende non ha &lt;dfn lang=&quot;en&quot;&gt;idle capacity&lt;/dfn&gt; (capacità produttiva inutilizzata).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Funziona male&lt;/b&gt; quando c’è idle capacity: il costo reale di cedere internamente è più basso del prezzo di mercato, e un prezzo troppo alto può far saltare lo scambio. L’esercizio Alpha lo mostra: €80 contro un massimo di €75.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Le due formule del range &lt;span class=&quot;tag&quot;&gt;slide 50–52&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Il limite inferiore lo fissa chi vende, quello superiore chi compra.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;span&gt;Transfer price ≥ Variable cost per unit +&lt;/span&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Total contribution margin on lost sales&lt;/span&gt;&lt;span&gt;Number of units transferred&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;span&gt;Transfer price ≤ Cost of buying from outside supplier&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;Il &lt;dfn lang=&quot;en&quot;&gt;contribution margin&lt;/dfn&gt; è prezzo di vendita meno variable cost per unità. La frazione è un &lt;dfn lang=&quot;en&quot;&gt;opportunity cost&lt;/dfn&gt; (ciò che si rinuncia a guadagnare): le vendite esterne perse per servire la divisione interna, spalmate sulle unità trasferite.&lt;/p&gt;
&lt;p&gt;Se non esiste un fornitore esterno: Transfer price ≤ profit to be earned per unit sold (not including the transfer price) &lt;span class=&quot;tag&quot;&gt;slide 52&lt;/span&gt;. Cioè quanto la divisione guadagna per unità rivendendo il prodotto, prima di pagare il transfer price.&lt;/p&gt;
&lt;p&gt;I fixed costs non compaiono nella formula: non cambiano con la transfer. Nel caso Grocery i $100,000 mensili ci sono comunque &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;.&lt;/p&gt;

&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;Trova il range&lt;/h4&gt;
&lt;div class=&quot;btns&quot; role=&quot;group&quot; aria-label=&quot;Caso&quot;&gt;&lt;button type=&quot;button&quot; data-case=&quot;g&quot;&gt;Grocery Storehouse&lt;/button&gt;&lt;button type=&quot;button&quot; data-case=&quot;a&quot;&gt;Alpha Manufacturing&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;btns&quot; id=&quot;t-pre&quot; role=&quot;group&quot; aria-label=&quot;Scenari delle slide&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span&gt;Idle capacity &lt;output id=&quot;t-io&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;t-i&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;3000&quot; step=&quot;100&quot; value=&quot;3000&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span&gt;Transfer price proposto &lt;output id=&quot;t-po&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;t-p&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;30&quot; step=&quot;0.25&quot; value=&quot;15&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;reads&quot;&gt;&lt;div class=&quot;read&quot;&gt;&lt;small&gt;Unità di vendite perse&lt;/small&gt;&lt;b id=&quot;t-lost&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;read&quot;&gt;&lt;small&gt;Minimo (seller)&lt;/small&gt;&lt;b id=&quot;t-min&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;read&quot;&gt;&lt;small&gt;Massimo (buyer)&lt;/small&gt;&lt;b id=&quot;t-max&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p style=&quot;font-size:.9rem;font-variant-numeric:tabular-nums&quot;&gt;Minimo: &lt;span id=&quot;t-calc&quot;&gt;&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;figure style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 480 140&quot; role=&quot;img&quot; aria-label=&quot;Asse dei prezzi con il range tra il minimo del venditore e il massimo del compratore, e il prezzo proposto&quot;&gt;
&lt;rect id=&quot;t-band&quot; y=&quot;50&quot; height=&quot;22&quot; style=&quot;opacity:.55&quot;/&gt;
&lt;path class=&quot;ln&quot; d=&quot;M20 72H460&quot;/&gt;
&lt;line id=&quot;t-tkv&quot; y1=&quot;66&quot; y2=&quot;78&quot; class=&quot;ln&quot;/&gt;&lt;line id=&quot;t-tke&quot; y1=&quot;66&quot; y2=&quot;78&quot; class=&quot;ln&quot;/&gt;
&lt;text id=&quot;t-lmin&quot; y=&quot;40&quot; class=&quot;sm b&quot;&gt;&lt;/text&gt;&lt;text id=&quot;t-lmax&quot; y=&quot;40&quot; class=&quot;sm b&quot;&gt;&lt;/text&gt;
&lt;text id=&quot;t-tv&quot; y=&quot;130&quot; class=&quot;sm mu&quot; text-anchor=&quot;middle&quot;&gt;&lt;/text&gt;&lt;text id=&quot;t-te&quot; y=&quot;130&quot; class=&quot;sm mu&quot; text-anchor=&quot;middle&quot;&gt;&lt;/text&gt;
&lt;g id=&quot;t-mk&quot;&gt;&lt;path d=&quot;M0 46V90&quot; style=&quot;stroke:var(--ink);stroke-width:2.5&quot;/&gt;&lt;text id=&quot;t-mkt&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; class=&quot;sm b&quot;&gt;&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Verde: range accettabile. Rosso: i limiti si incrociano, nessun range. Il valore in dollari sotto è aggiunto qui &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;/div&gt;
&lt;div class=&quot;verd&quot; aria-live=&quot;polite&quot;&gt;&lt;div class=&quot;vc&quot; id=&quot;t-s&quot;&gt;&lt;/div&gt;&lt;div class=&quot;vc&quot; id=&quot;t-b&quot;&gt;&lt;/div&gt;&lt;div class=&quot;vc&quot; id=&quot;t-c&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;msg&quot; id=&quot;t-msg&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;caption&gt;Grocery Storehouse &lt;span class=&quot;tag&quot;&gt;slide 51–55&lt;/span&gt;&lt;/caption&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Idle capacity&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Vendite perse&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Minimo&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Massimo&lt;/th&gt;&lt;th&gt;Range&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;3,000 crates&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;0&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$10&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$20&lt;/td&gt;&lt;td&gt;$10 – $20&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;0 crates&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$25&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$20&lt;/td&gt;&lt;td&gt;Nessuno&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;500 crates&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$17.50&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;$20&lt;/td&gt;&lt;td&gt;$17.50 – $20&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;West Coast Plantations: capacità 10,000 crates al mese, variable cost $10, fixed costs $100,000, prezzo esterno $25. Grocery Mart: compra a $20 da fuori, 1,000 crates al mese. Entrambe sono di Grocery Storehouse. La soglia oltre cui esiste un range è circa 334 crates di idle capacity &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;.&lt;/p&gt;

&lt;h3&gt;Esercizio: Alpha Manufacturing &lt;span class=&quot;tag&quot;&gt;slide 61–67&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Components Division vende all’esterno a €80, variable cost €45. Assembly Division ha bisogno di 2,000 componenti e può comprarli fuori a €75. Components ha idle capacity sufficiente e nessun costo fisso aggiuntivo. Chi guida Components propone €80, chi guida Assembly non va oltre €75: nessun accordo. Prova a rispondere prima di aprire.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;1. Qual è il minimum transfer price per Components?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Con idle capacity sufficiente non si perdono vendite, l’opportunity cost è zero: €45 + €0 = &lt;b&gt;€45&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;2. Perché Components vuole €80 e Assembly non supera €75?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Components vuole un prezzo alto perché fa crescere il suo operating income. Assembly non paga più di €75 perché trova componenti identici a quel prezzo. Ognuno massimizza il proprio risultato, non quello dell’azienda.&lt;/p&gt;&lt;p&gt;Il mancato accordo costa all’azienda 2,000 × (€75 − €45) = €60,000. &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;3. Range con idle capacity di 500 unità?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Unità sottratte alle vendite esterne: 2,000 − 500 = 1,500. Opportunity cost: (80 − 45) × 1,500 = €52,500. Minimo: €45 + €52,500 ÷ 2,000 = €45 + €26.25 = €71.25. &lt;b&gt;Range: €71.25 – €75.00.&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;4. Range con idle capacity di 200 unità?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Unità sottratte: 1,800. Opportunity cost: (80 − 45) × 1,800 = €63,000. Minimo: €45 + €31.50 = €76.50, sopra €75. &lt;b&gt;Nessun range.&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Comprare fuori costa €150,000; produrre internamente costa €90,000 più €63,000 di margine perso, cioè €153,000. Comprare fuori conviene di €3,000. &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;chk&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;1&quot;&gt;&lt;p&gt;Una divisione senza idle capacity vende all’esterno a $40, variable cost $25. Qual è il minimo per una transfer interna?&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;$25&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;$40&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;$32.50&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;$25 + ($40 − $25) = $40: ogni unità ceduta è una vendita esterna persa. Caso inventato qui.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Quando manca il range, le due divisioni hanno negoziato male?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Se il minimo supera il massimo, lo scambio distrugge valore: il disaccordo porta alla decisione giusta. Vale il contrario di slide 56.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché a slide 53 il minimo non dipende dai fixed costs?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché esistono comunque, con o senza transfer: non sono un costo incrementale dello scambio.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In quale situazione il market price è la scelta più solida?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Prodotto venduto così com’è a clienti esterni e nessuna idle capacity (slide 60). Lì il minimo del venditore coincide con il prezzo di mercato: variable cost + contribution margin perso.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;formule&quot; class=&quot;slate&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Ripasso&lt;/p&gt;&lt;h2&gt;Tutte le formule in una pagina&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Misura&lt;/th&gt;&lt;th&gt;Formula&lt;/th&gt;&lt;th&gt;Risponde a&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;ROI&lt;/b&gt;&lt;/td&gt;&lt;td&gt;NOI ÷ average operating assets&lt;/td&gt;&lt;td&gt;Il core business rende?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Margin&lt;/b&gt;&lt;/td&gt;&lt;td&gt;NOI ÷ sales&lt;/td&gt;&lt;td&gt;Quanto resta di ogni vendita?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Turnover&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Sales ÷ average operating assets&lt;/td&gt;&lt;td&gt;Quanto lavorano gli assets?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Scomposizione&lt;/b&gt;&lt;/td&gt;&lt;td&gt;ROI = margin × turnover&lt;/td&gt;&lt;td&gt;Da dove viene il ROI?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Residual income&lt;/b&gt;&lt;/td&gt;&lt;td&gt;NOI − (average operating assets × minimum required rate)&lt;/td&gt;&lt;td&gt;Quanto si guadagna oltre il minimo?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Minimo del transfer price&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Variable cost per unit + total contribution margin on lost sales ÷ units transferred&lt;/td&gt;&lt;td&gt;Quanto serve a chi vende?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Massimo del transfer price&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Cost of buying from outside supplier (o profit per unit, se il fornitore non c’è)&lt;/td&gt;&lt;td&gt;Quanto può pagare chi compra?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Balance sheet&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Assets = liabilities + equity&lt;/td&gt;&lt;td&gt;Fonti e impieghi quadrano?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Gross margin&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Revenues − cost of goods sold&lt;/td&gt;&lt;td&gt;Quanto resta dopo il costo del prodotto?&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;h4&gt;Da controllare sulle slide&lt;/h4&gt;
&lt;ul style=&quot;margin:0&quot;&gt;&lt;li&gt;Slide 29: 21.8% nasce da fattori arrotondati; il valore esatto è 21.74%.&lt;/li&gt;
&lt;li&gt;Slide 51: la tabella scrive «naval oranges» dove si intende &lt;em&gt;navel&lt;/em&gt;.&lt;/li&gt;
&lt;li&gt;Slide 62 e slide 66–67 usano ipotesi diverse sull’idle capacity: l’esercizio prima la dà sufficiente, poi la riduce a 500 e 200 unità.&lt;/li&gt;
&lt;li&gt;Slide 66–67 dicono che la transfer «would reduce external sales»: si intende per la parte eccedente l’idle capacity.&lt;/li&gt;
&lt;li&gt;Slide 31: l’obiettivo cita anche le weaknesses del RI, ma le slide non ne elencano.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;corso&quot; class=&quot;sage&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Collegamenti&lt;/p&gt;&lt;h2&gt;Questa lezione nel corso&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;&lt;b&gt;Lecture #4 (corporate governance).&lt;/b&gt; Slide 2 la cita come riferimento per la delega dai proprietari ai top manager. Il file non è stato trovato.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Balanced scorecard.&lt;/b&gt; Slide 30 la cita come rimedio a un limite del ROI. La cartella &lt;code&gt;corso/Balanced Scorecard/&lt;/code&gt; esiste, ma i suoi file non sono stati letti.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;p&gt;&lt;b&gt;Limite di questa stesura.&lt;/b&gt; L’ambiente di lavoro non permetteva di elencare le cartelle e i nomi dei file sono stati cercati a tentativi. Nessun contenuto di questa pagina viene quindi da altri file di &lt;code&gt;corso/&lt;/code&gt;: viene tutto da &lt;code&gt;corso/Responsibility systems/18-19 SMA Respons System updated/18-19_SMA_Respons System_updated.pdf&lt;/code&gt;, oltre alle aggiunte segnalate.&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;fonti&quot; class=&quot;ochre&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Fonti esterne&lt;/p&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;Le slide non citano per nome autori, studi, norme o siti.&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;Citano però concetti che rimandano a testi e norme precisi, e qui sotto c’è un riferimento per ciascuno. Norton, Regal, Zephyr, Redmond Awnings, Grocery Storehouse e Alpha sembrano casi didattici: non sono stati cercati. Tutto ciò che segue è &lt;span class=&quot;tag fe&quot;&gt;fonte esterna&lt;/span&gt;, distinto dal contenuto delle slide. I dati vengono dai risultati di ricerca web: le pagine non sono state lette per intero, quindi verifica prima di citare.&lt;/p&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;The Balanced Scorecard: Measures That Drive Performance&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;R. S. Kaplan, D. P. Norton, &lt;em&gt;Harvard Business Review&lt;/em&gt;, gennaio–febbraio 1992&lt;/p&gt;&lt;p&gt;Affianca alle misure finanziarie misure operative su clienti, processi interni, capacità di apprendere e migliorare. &lt;b&gt;Perché conta:&lt;/b&gt; è il riferimento per la critica di slide 30; sostiene che misure come il ROI da sole possono dare segnali fuorvianti.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://hbr.org/1992/01/the-balanced-scorecard-measures-that-drive-performance-2&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;hbr.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Divisional Performance: Measurement and Control&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;D. Solomons, Irwin, Homewood (Illinois), 1965&lt;/p&gt;&lt;p&gt;Studio pionieristico sulla misura delle divisioni. Una fonte Springer riconduce a Solomons la proposta del residual income per valutare un investment center e chi lo guida. &lt;b&gt;Perché conta:&lt;/b&gt; è all’origine del tema di slide 32–36.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://ci.nii.ac.jp/ncid/BA01277273&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda CiNii&lt;/a&gt; · &lt;a href=&quot;https://link.springer.com/chapter/10.1007/978-1-4899-7138-8_17&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;capitolo Springer&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;On the Economics of Transfer Pricing&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;J. Hirshleifer, &lt;em&gt;Journal of Business&lt;/em&gt;, 29(3), 1956, pp. 172–184&lt;/p&gt;&lt;p&gt;Prima formalizzazione economica del problema: la soluzione ottima si ha quando il costo marginale di chi vende uguaglia il margine marginale di chi compra. &lt;b&gt;Perché conta:&lt;/b&gt; è la base teorica delle slide 48–55.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://econpapers.repec.org/RePEc:ucp:jnlbus:v:29:y:1956:p:172&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers&lt;/a&gt; · &lt;a href=&quot;https://tzin.bgu.ac.il/~ariehg/review.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;rassegna sul transfer pricing&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Theory of the Firm&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;M. C. Jensen, W. H. Meckling, &lt;em&gt;Journal of Financial Economics&lt;/em&gt;, 3(4), 1976, pp. 305–360&lt;/p&gt;&lt;p&gt;Definisce gli agency cost e li lega alla separazione tra proprietà e controllo. &lt;b&gt;Perché conta:&lt;/b&gt; dà la teoria dietro il rischio di slide 5, gli obiettivi del manager diversi da quelli dell’organizzazione.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://papers.ssrn.com/abstract=94043&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SSRN&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Management Control Systems&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;K. A. Merchant, W. A. Van der Stede, Pearson, 4ª ed., 2017&lt;/p&gt;&lt;p&gt;Manuale con una sezione sui financial results control e un capitolo sui fattori non controllabili, che si apre con il controllability principle. &lt;b&gt;Perché conta:&lt;/b&gt; approfondisce slide 6.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.lehmanns.ch/media/113163808&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;indice&lt;/a&gt; · &lt;a href=&quot;https://akademika.no/okonomi-administrasjon-og-ledelse/management-control-systems/9781292110554&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda libro&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Managerial Accounting, capitolo sulla performance decentrata&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;Garrison, Noreen, Brewer e altri, McGraw-Hill, più edizioni&lt;/p&gt;&lt;p&gt;Il capitolo «Performance Measurement in Decentralized Organizations» copre ROI, residual income e transfer prices; il numero cambia con l’edizione. &lt;b&gt;Perché conta:&lt;/b&gt; struttura e numerazione 11-xx delle slide ricordano questa famiglia di manuali, ma è un’ipotesi: le slide non lo dichiarano.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://highered.mheducation.com/sites/0072422246/student_view0/chapter10/chapter_outline.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;outline McGraw-Hill&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;OECD Transfer Pricing Guidelines&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;OCSE, edizione 2022, pubblicata il 20 gennaio 2022&lt;/p&gt;&lt;p&gt;Guida all’&lt;em&gt;arm’s length principle&lt;/em&gt; (valutare le operazioni come tra parti indipendenti) per le operazioni transfrontaliere tra imprese associate, a fini fiscali. &lt;b&gt;Perché conta:&lt;/b&gt; mostra l’altra faccia del tema; le slide guardano alla motivazione dei manager, l’OCSE alle imposte. Controlla se esiste un’edizione più recente.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.oecd-ilibrary.org/taxation/oecd-transfer-pricing-guidelines-for-multinational-enterprises-and-tax-administrations-2022_02d2274c-en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OECD iLibrary&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Direttiva 2013/34/UE&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;Direttiva contabile dell’Unione europea, 26 giugno 2013&lt;/p&gt;&lt;p&gt;Stabilisce che il bilancio comprende almeno balance sheet, profit and loss account e notes, come un insieme unico. &lt;b&gt;Perché conta:&lt;/b&gt; è una base normativa europea del «mandatory set of documents» di slide 12.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2013/34/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2013/34/2026-03-18/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo consolidato 2026&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Codice civile, artt. 2423 e seguenti&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;Sezione IX, «Del bilancio»&lt;/p&gt;&lt;p&gt;Il bilancio è composto da stato patrimoniale (art. 2424), conto economico (art. 2425), rendiconto finanziario e nota integrativa. &lt;b&gt;Perché conta:&lt;/b&gt; le slide parlano di due documenti &lt;em&gt;principali&lt;/em&gt;; la norma italiana ne elenca di più.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.brocardi.it/codice-civile/libro-quinto/titolo-v/capo-v/sezione-ix/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Brocardi.it&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 18 Presentation and Disclosure in Financial Statements&lt;/h4&gt;&lt;p class=&quot;ci&quot;&gt;IASB, in vigore dagli esercizi che iniziano dal 1° gennaio 2027&lt;/p&gt;&lt;p&gt;Sostituisce lo IAS 1 e introduce due subtotali definiti: operating profit e profit before financing and income taxes. &lt;b&gt;Perché conta:&lt;/b&gt; tocca proprio la voce al numeratore del ROI. Lo stato di adozione nell’UE non è stato verificato.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag fe&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;
