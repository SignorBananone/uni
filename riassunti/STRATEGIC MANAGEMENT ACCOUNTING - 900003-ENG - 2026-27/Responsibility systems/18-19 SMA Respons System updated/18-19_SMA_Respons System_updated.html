&lt;h1&gt;Responsibility Accounting Systems&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;Delegare le decisioni, poi misurare chi le prende.&lt;/p&gt;
&lt;p class=&quot;lede&quot;&gt;Appena un’azienda cresce, chi la guida non può più decidere tutto. Deve delegare, e chi delega ha bisogno di numeri per sapere se la delega funziona. La lezione segue questo filo in sei tappe.&lt;/p&gt;
&lt;p&gt;Si parte dalla &lt;dfn lang=&quot;en&quot;&gt;decentralization&lt;/dfn&gt; (la distribuzione del potere decisionale nell’organizzazione). Poi il &lt;dfn lang=&quot;en&quot;&gt;responsibility accounting&lt;/dfn&gt; (la contabilità che attribuisce a ogni manager solo ciò che controlla) definisce di cosa risponde ciascuno. Con i documenti di bilancio si calcolano le due misure di performance: &lt;dfn lang=&quot;en&quot;&gt;ROI&lt;/dfn&gt; (return on investment, il rendimento percentuale dei beni usati nell’attività) e &lt;dfn lang=&quot;en&quot;&gt;residual income&lt;/dfn&gt; (il reddito che resta oltre il minimo richiesto). Infine si affronta il &lt;dfn lang=&quot;en&quot;&gt;transfer price&lt;/dfn&gt;: il prezzo a cui due parti della stessa azienda si vendono beni tra loro.&lt;/p&gt;
&lt;div class=&quot;legend&quot;&gt;
&lt;span&gt;&lt;span class=&quot;tag&quot;&gt;slide 12&lt;/span&gt; viene dalle slide&lt;/span&gt;
&lt;span&gt;&lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt; spiegazione o calcolo aggiunto qui&lt;/span&gt;
&lt;span&gt;&lt;span class=&quot;tag fe&quot;&gt;fonte esterna&lt;/span&gt; viene dal web, con link&lt;/span&gt;
&lt;span&gt;I numeri restano nel formato delle slide: $30,000 e 21.8%.&lt;/span&gt;
&lt;/div&gt;

&lt;noscript&gt;&lt;p class=&quot;note&quot;&gt;Senza JavaScript schede e passi restano tutti aperti, ma i grafici con cursori non funzionano.&lt;/p&gt;&lt;/noscript&gt;
&lt;section id=&quot;p1&quot; class=&quot;sage&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Parte 1 · slide 2–5&lt;/p&gt;&lt;h2&gt;Perché delegare, e cosa si rischia&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;Tranne che nelle organizzazioni molto piccole, proprietà e vertice non possono decidere tutto da soli.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;
&lt;p&gt;Le slide descrivono una catena con due passaggi di delega &lt;span class=&quot;tag&quot;&gt;slide 2&lt;/span&gt;. Il primo va dagli &lt;em&gt;owners&lt;/em&gt; (i proprietari, per esempio gli &lt;em&gt;stockholders&lt;/em&gt;, cioè gli azionisti) ai top manager. Il secondo va dai top manager ai loro subordinati. Ogni passaggio ha il suo strumento di controllo.&lt;/p&gt;
&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Corporate governance systems&lt;/dfn&gt;: le regole e i meccanismi con cui i proprietari indirizzano e sorvegliano il vertice. La slide rimanda alla lecture #4.&lt;/p&gt;
&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Management control systems&lt;/dfn&gt;: gli strumenti con cui i top manager dirigono e controllano le azioni dei subordinati. Questa lezione ne studia una parte: i responsibility center e le loro misure.&lt;/p&gt;
&lt;p&gt;In una &lt;dfn lang=&quot;en&quot;&gt;decentralized organization&lt;/dfn&gt; il potere decisionale è diffuso in tutta l’organizzazione invece che confinato a pochi dirigenti di vertice.&lt;/p&gt;
&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 460 300&quot; role=&quot;img&quot; aria-label=&quot;Catena della delega: owners, top managers, subordinates, con i sistemi di controllo tra un livello e l&#x27;altro&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;10&quot; y=&quot;8&quot; width=&quot;250&quot; height=&quot;52&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;24&quot; y=&quot;39&quot; class=&quot;ser&quot;&gt;Owners (stockholders)&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;10&quot; y=&quot;124&quot; width=&quot;250&quot; height=&quot;52&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;24&quot; y=&quot;155&quot; class=&quot;ser&quot;&gt;Top managers&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;10&quot; y=&quot;240&quot; width=&quot;250&quot; height=&quot;52&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;24&quot; y=&quot;271&quot; class=&quot;ser&quot;&gt;Subordinates&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M48 60V122&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M48 176V238&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;text x=&quot;62&quot; y=&quot;88&quot; class=&quot;b&quot;&gt;corporate governance systems&lt;/text&gt;&lt;text x=&quot;62&quot; y=&quot;108&quot; class=&quot;mu&quot;&gt;governo societario (lecture #4)&lt;/text&gt;
&lt;text x=&quot;62&quot; y=&quot;204&quot; class=&quot;b&quot;&gt;management control systems&lt;/text&gt;&lt;text x=&quot;62&quot; y=&quot;224&quot; class=&quot;mu&quot;&gt;il tema di questa lezione&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Due deleghe in cascata, due sistemi di controllo. Schema costruito da slide 2.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;/div&gt;

&lt;h3&gt;Il bilancio della decentralization&lt;/h3&gt;
&lt;p&gt;Le slide elencano cinque benefici e quattro svantaggi &lt;span class=&quot;tag&quot;&gt;slide 3–5&lt;/span&gt;. Apri ogni voce: i titoli vengono dalle slide, le spiegazioni sono aggiunte qui &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;
&lt;h4&gt;Benefits&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;Top management freed to concentrate on strategy&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il vertice si libera delle decisioni quotidiane e può dedicarsi alle scelte di lungo periodo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Lower-level decisions often based on better information&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Chi lavora vicino al mercato o all’impianto vede dettagli che a livello centrale arrivano tardi o filtrati. Un responsabile di negozio sa quale prodotto resta invenduto.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Lower-level managers can respond quickly to customers&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Se una richiesta non deve risalire la gerarchia e poi tornare indietro, la risposta arriva prima.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Lower-level managers gain experience in decision-making&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Decidere è anche formazione: l’azienda prepara così i dirigenti di domani.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Decision-making authority leads to job satisfaction&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Avere autonomia rende il lavoro più motivante.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;h4&gt;Disadvantages&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;Decisions without seeing the “big picture”&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il manager locale conosce bene la sua parte ma può ignorare gli effetti sul resto dell’azienda o sulla strategia.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Lack of coordination among autonomous managers&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Ogni unità ottimizza per conto suo. Il transfer pricing (parte 6) nasce proprio qui: due divisioni autonome che devono mettersi d’accordo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Lower-level manager’s objectives may not be those of the organization&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il manager reagisce alla misura su cui è valutato. Il caso classico è il rifiuto di un investimento conveniente per non abbassare il proprio ROI (parte 5).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Difficult to spread innovative ideas&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Una buona idea nata in una divisione può restarci, se manca un canale per farla circolare o se le unità si vedono come rivali.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;p&gt;&lt;b&gt;Il filo della lezione.&lt;/b&gt; Gli svantaggi spiegano il resto: servono misure che allineino i manager all’azienda (parti 4 e 5) e regole per gli scambi interni (parte 6). &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;chk&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Che differenza c’è tra corporate governance systems e management control systems?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Cambia il livello della delega. I primi servono ai proprietari per delegare ai top manager. I secondi servono ai top manager per delegare ai subordinati.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un’azienda con un fondatore che approva ogni acquisto è decentralized?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Il potere decisionale è confinato al vertice: è il contrario della definizione di slide 2.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quale svantaggio della decentralization si riconosce nel rifiuto di un investimento conveniente per l’azienda?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Lower-level manager’s objectives may not be those of the organization: gli obiettivi del manager, in quel caso difendere il proprio ROI, non coincidono con quelli dell’azienda.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;p2&quot; class=&quot;ochre&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Parte 2 · slide 6–10&lt;/p&gt;&lt;h2&gt;Di cosa risponde ogni manager&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;Si risponde solo di ciò che si controlla davvero. Da questa regola nascono tre tipi di centro.&lt;/p&gt;&lt;/div&gt;
&lt;blockquote&gt;Managers are held responsible for those items, and &lt;em&gt;only&lt;/em&gt; those items, that they can actually control to a significant extent. &lt;span class=&quot;tag&quot;&gt;slide 6&lt;/span&gt;&lt;/blockquote&gt;
&lt;p&gt;È il cuore del responsibility accounting. Se un manager venisse giudicato su voci che non può influenzare, la misura non direbbe nulla sul suo lavoro e non lo guiderebbe nelle scelte &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;. Nei manuali questa regola prende il nome di &lt;em&gt;controllability principle&lt;/em&gt; &lt;a class=&quot;tag fe&quot; href=&quot;https://www.lehmanns.ch/media/113163808&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;Un &lt;dfn lang=&quot;en&quot;&gt;responsibility center&lt;/dfn&gt; (RC) è qualsiasi parte dell’organizzazione il cui manager controlla, e di cui risponde, cost (costi), profit (profitto) o investments (investimenti) &lt;span class=&quot;tag&quot;&gt;slide 6&lt;/span&gt;. Il profitto è la differenza tra &lt;em&gt;revenues&lt;/em&gt; (ricavi) e costi. I tipi principali sono tre &lt;span class=&quot;tag&quot;&gt;slide 7&lt;/span&gt;, e ognuno aggiunge una leva al precedente.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 460 290&quot; role=&quot;img&quot; aria-label=&quot;Tre rettangoli uno dentro l&#x27;altro: il cost center controlla i costi, il profit center aggiunge i ricavi, l&#x27;investment center aggiunge gli investimenti&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;6&quot; y=&quot;6&quot; width=&quot;448&quot; height=&quot;278&quot; rx=&quot;4&quot; style=&quot;fill-opacity:.35&quot;/&gt;&lt;rect class=&quot;bx&quot; x=&quot;30&quot; y=&quot;66&quot; width=&quot;400&quot; height=&quot;200&quot; rx=&quot;4&quot; style=&quot;fill-opacity:.7&quot;/&gt;&lt;rect class=&quot;bx&quot; x=&quot;54&quot; y=&quot;126&quot; width=&quot;352&quot; height=&quot;122&quot; rx=&quot;4&quot;/&gt;
&lt;text x=&quot;22&quot; y=&quot;34&quot; class=&quot;ser&quot;&gt;Investment center&lt;/text&gt;&lt;text x=&quot;22&quot; y=&quot;55&quot; class=&quot;mu&quot;&gt;+ investments in operating assets&lt;/text&gt;
&lt;text x=&quot;46&quot; y=&quot;94&quot; class=&quot;ser&quot;&gt;Profit center&lt;/text&gt;&lt;text x=&quot;46&quot; y=&quot;115&quot; class=&quot;mu&quot;&gt;+ revenues&lt;/text&gt;
&lt;text x=&quot;70&quot; y=&quot;172&quot; class=&quot;ser&quot;&gt;Cost center&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;196&quot;&gt;solo costs&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;220&quot; class=&quot;mu&quot;&gt;niente revenues né investment funds&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Ogni livello contiene le leve del precedente e ne aggiunge una. Schema costruito da slide 8–10.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Tipi di responsibility center&quot;&gt;
&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tc1&quot; aria-controls=&quot;pc1&quot;&gt;Cost&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tc2&quot; aria-controls=&quot;pc2&quot;&gt;Profit&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tc3&quot; aria-controls=&quot;pc3&quot;&gt;Investment&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pc1&quot; aria-labelledby=&quot;tc1&quot;&gt;&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Cost center&lt;/dfn&gt;: il manager controlla i costi, non i ricavi né i fondi per investire &lt;span class=&quot;tag&quot;&gt;slide 8&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Esempio&lt;/b&gt; &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;: l’ufficio paghe o la manutenzione di uno stabilimento. Non vendono nulla; si giudica se fanno il lavoro al costo previsto.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pc2&quot; aria-labelledby=&quot;tc2&quot;&gt;&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Profit center&lt;/dfn&gt;: il manager controlla sia i costi sia i ricavi, ma non i fondi per investire &lt;span class=&quot;tag&quot;&gt;slide 9&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Revenues&lt;/b&gt;: sales, interest, other. &lt;b&gt;Costs&lt;/b&gt;: mfg. costs (costi di produzione), commissions, salaries, other.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Esempio&lt;/b&gt; &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;: un punto vendita che decide prezzi e personale, mentre l’apertura di nuovi locali spetta alla sede.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pc3&quot; aria-labelledby=&quot;tc3&quot;&gt;&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Investment center&lt;/dfn&gt;: il manager controlla costi, ricavi e investimenti in &lt;dfn lang=&quot;en&quot;&gt;operating assets&lt;/dfn&gt; (i beni usati nell’attività caratteristica: cassa operativa, crediti, scorte, impianti) &lt;span class=&quot;tag&quot;&gt;slide 10&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Misure&lt;/b&gt;: ROI e residual income, parti 4 e 5.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Esempio&lt;/b&gt; &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;: una divisione che può decidere anche l’acquisto di nuovi impianti.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;caption&gt;Chi controlla cosa&lt;/caption&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Responsibility center&lt;/th&gt;&lt;th&gt;Costs&lt;/th&gt;&lt;th&gt;Revenues&lt;/th&gt;&lt;th&gt;Investments&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Cost center&lt;/td&gt;&lt;td&gt;sì&lt;/td&gt;&lt;td&gt;no&lt;/td&gt;&lt;td&gt;no&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Profit center&lt;/td&gt;&lt;td&gt;sì&lt;/td&gt;&lt;td&gt;sì&lt;/td&gt;&lt;td&gt;no&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Investment center&lt;/td&gt;&lt;td&gt;sì&lt;/td&gt;&lt;td&gt;sì&lt;/td&gt;&lt;td&gt;sì&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

&lt;div class=&quot;chk&quot;&gt;&lt;h3&gt;Autoverifica: che centro è?&lt;/h3&gt;
&lt;p&gt;Casi inventati per esercizio &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;. Scegli una risposta.&lt;/p&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;0&quot;&gt;&lt;p&gt;Il reparto che assembla i prodotti ha un budget di spesa. Non fissa i prezzi e non decide nuovi macchinari.&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Cost center&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Profit center&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Investment center&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;Cost center: controlla solo i costi.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;2&quot;&gt;&lt;p&gt;La divisione Europa decide listini, spese commerciali e la costruzione di un nuovo magazzino.&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Cost center&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Profit center&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Investment center&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;Investment center: ci sono tutte e tre le leve, compreso l’investimento in operating assets.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-ok=&quot;1&quot;&gt;&lt;p&gt;Il direttore di un ristorante di una catena sceglie menu, prezzi e turni. I locali e gli arredi li decide la sede.&lt;/p&gt;&lt;div class=&quot;opts needjs&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Cost center&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Profit center&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;opt&quot;&gt;Investment center&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;why&quot;&gt;&lt;p&gt;&lt;span class=&quot;vd&quot;&gt;&lt;/span&gt;Profit center: costi e ricavi sì, investimenti no.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Perché sarebbe scorretto valutare su ROI il manager di un profit center?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il ROI mette al denominatore gli operating assets, che quel manager non controlla. Verrebbe giudicato su una voce fuori dal suo controllo, contro il principio di slide 6.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;p3&quot; class=&quot;slate&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Parte 3 · slide 12–20&lt;/p&gt;&lt;h2&gt;Da dove vengono i numeri&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;ROI e residual income si calcolano con voci di bilancio: prima di usarle bisogna saperle leggere.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;
&lt;p&gt;Il &lt;dfn lang=&quot;en&quot;&gt;financial statement&lt;/dfn&gt; (FS, il bilancio d’esercizio) è un insieme obbligatorio di documenti che le imprese preparano ogni anno. Ne include due principali &lt;span class=&quot;tag&quot;&gt;slide 12–13&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Income statement&lt;/dfn&gt; (IS, conto economico): mette a confronto positive e negative items of income. La differenza è il &lt;dfn lang=&quot;en&quot;&gt;net income&lt;/dfn&gt; (utile o perdita) realizzato nell’anno.&lt;/p&gt;
&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Balance sheet&lt;/dfn&gt; (BS, stato patrimoniale): mostra &lt;dfn lang=&quot;en&quot;&gt;assets&lt;/dfn&gt; (attività), &lt;dfn lang=&quot;en&quot;&gt;liabilities&lt;/dfn&gt; (debiti) ed &lt;dfn lang=&quot;en&quot;&gt;equity&lt;/dfn&gt; (patrimonio netto) a fine anno. I due lati si eguagliano: assets = liabilities + equity.&lt;/p&gt;
&lt;p&gt;Il net income non resta isolato: confluisce nell’equity &lt;span class=&quot;tag&quot;&gt;slide 13&lt;/span&gt;. L’income statement è il film dell’anno, il balance sheet la fotografia dell’ultimo giorno &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;Per giudicare la salute finanziaria, il bilancio viene «analysed»: le voci di BS e IS vengono riposizionate per ricavarne più informazioni &lt;span class=&quot;tag&quot;&gt;slide 14&lt;/span&gt;. È quello che fa, per esempio, il subtotal net operating income.&lt;/p&gt;
&lt;/div&gt;
&lt;figure&gt;

&lt;rect class=&quot;bx&quot; x=&quot;270&quot; y=&quot;34&quot; width=&quot;100&quot; height=&quot;206&quot; style=&quot;fill-opacity:.6&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;142&quot; text-anchor=&quot;middle&quot;&gt;Assets&lt;/text&gt;

&lt;h3&gt;Le voci, una per una&lt;/h3&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Voci del balance sheet&quot;&gt;
&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tb1&quot; aria-controls=&quot;pb1&quot;&gt;Assets&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tb2&quot; aria-controls=&quot;pb2&quot;&gt;Liabilities&lt;/button&gt;&lt;button type=&quot;button&quot; role=&quot;tab&quot; id=&quot;tb3&quot; aria-controls=&quot;pb3&quot;&gt;Equity&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pb1&quot; aria-labelledby=&quot;tb1&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Slide 15&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Cash and cash equivalent&lt;/b&gt;: somme nei conti correnti e di risparmio, più il denaro contante.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Account receivables&lt;/b&gt; (o trade receivables): crediti verso clienti per beni o servizi già consegnati o venduti.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Inventories&lt;/b&gt;: merci in magazzino, disponibili per la vendita.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Property, plant and equipment&lt;/b&gt;: beni non convertibili rapidamente in cash, come computer, auto, impianti.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Securities&lt;/b&gt;: obbligazioni, azioni o quote di altre imprese acquistate a scopo di investimento.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pb2&quot; aria-labelledby=&quot;tb2&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Slide 17&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Bank overdraft&lt;/b&gt;: scoperto di conto, cioè fondi prelevati oltre il saldo, in genere per pagare i fornitori.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Account payable&lt;/b&gt; (o trade payable): debiti verso fornitori per beni o servizi già ricevuti.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Note payable&lt;/b&gt;: obbligo di restituire una somma presa a prestito entro una data futura.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Severance provisions&lt;/b&gt; (employee benefit liabilities): obbligo verso i dipendenti, pagato alla fine del rapporto di lavoro.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Long term borrowings&lt;/b&gt;: debiti verso finanziatori, per esempio un mutuo bancario. &lt;em&gt;Long term&lt;/em&gt; significa rimborso oltre i 12 mesi.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;pb3&quot; aria-labelledby=&quot;tb3&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Slide 18–19&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Share capital&lt;/b&gt;: somme investite dai proprietari.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Retained earnings&lt;/b&gt; (o reserves): somma degli utili della vita dell’azienda non distribuiti ai proprietari come dividend (i dividend sono distribuzioni di utile).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Net income&lt;/b&gt;: differenza tra positive e negative items, utile o perdita.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Par value&lt;/b&gt;: valore nominale di un’azione. &lt;b&gt;APIC&lt;/b&gt; (additional paid-in capital): quanto l’investitore paga oltre il par value.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Il caso Norton Corporation&lt;/h3&gt;

&lt;div class=&quot;btns needjs&quot; role=&quot;group&quot; aria-label=&quot;Anno&quot;&gt;&lt;button type=&quot;button&quot; data-yr=&quot;t&quot; aria-pressed=&quot;true&quot;&gt;This Year&lt;/button&gt;&lt;button type=&quot;button&quot; data-yr=&quot;l&quot; aria-pressed=&quot;false&quot;&gt;Last Year&lt;/button&gt;&lt;/div&gt;

&lt;/figure&gt;
&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Gross margin&lt;/dfn&gt; = revenues − cost of goods sold: considera solo il costo del prodotto, non le spese di vendita e amministrazione. &lt;dfn lang=&quot;en&quot;&gt;Interest expense&lt;/dfn&gt; è il costo delle risorse finanziarie &lt;span class=&quot;tag&quot;&gt;slide 20&lt;/span&gt;. &lt;dfn lang=&quot;en&quot;&gt;Net operating income&lt;/dfn&gt; è il risultato dell’attività caratteristica, prima di interessi e imposte.&lt;/p&gt;

&lt;div class=&quot;chk&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Il balance sheet di Norton quadra in entrambi gli anni?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sì. This Year: 112,000 + 234,390 = 346,390. Last Year: 120,000 + 180,000 = 300,000. Controllo aggiunto qui. &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Norton ha un net income di $53,690, ma i retained earnings scendono da 50,000 a 48,890. Com’è possibile?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sono stati distribuiti più utili di quanti ne siano stati prodotti: 50,000 + 53,690 − dividend = 48,890, quindi dividend = $54,800. È una deduzione che assume nessun altro movimento: la slide non riporta i dividend. &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quanto vale il ROI di Norton This Year, se si considerano operating tutti gli assets?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Average operating assets = (346,390 + 300,000) ÷ 2 = $323,195. ROI = 84,000 ÷ 323,195 = 26.0%. Margin 17.0%, turnover 1.53. Le slide non fanno questo calcolo, e l’ipotesi su tutti gli assets è una semplificazione. &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Dove si ferma il long term rispetto al breve?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;A 12 mesi: oltre, il debito è long term (slide 17).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;p4&quot; class=&quot;brick&quot; tabindex=&quot;-1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;p class=&quot;kick&quot;&gt;Parte 4 · slide 11, 21–30 · Learning Objective 1&lt;/p&gt;&lt;h2&gt;Return on investment&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;Quanto reddito operativo genera ogni dollaro di operating assets? In breve: il core business sta andando bene?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;span&gt;ROI =&lt;/span&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Net operating income&lt;/span&gt;&lt;span&gt;Average operating assets&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;
&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;ROI&lt;/dfn&gt; confronta il reddito operativo con gli operating assets ed è una misura di profitability &lt;span class=&quot;tag&quot;&gt;slide 21&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Al numeratore&lt;/b&gt;, il net operating income coincide con l’&lt;dfn lang=&quot;en&quot;&gt;EBIT&lt;/dfn&gt; (earnings before interest and taxes), il reddito prima di interessi e imposte &lt;span class=&quot;tag&quot;&gt;slide 22&lt;/span&gt;. Togliere interessi e imposte serve a isolare l’attività dal modo in cui è finanziata e dal fisco &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Al denominatore&lt;/b&gt; ci sono cash, accounts receivable, inventory, plant and equipment e altri productive assets &lt;span class=&quot;tag&quot;&gt;slide 22&lt;/span&gt;. Si usa la media perché il reddito matura in tutto l’anno, mentre il balance sheet è una foto. Di solito: (assets iniziali + finali) ÷ 2 &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;Scomponendo il ROI si vede &lt;em&gt;da dove&lt;/em&gt; viene &lt;span class=&quot;tag&quot;&gt;slide 23–25&lt;/span&gt;:&lt;/p&gt;
&lt;p&gt;&lt;dfn lang=&quot;en&quot;&gt;Margin&lt;/dfn&gt;: capacità di ricavare reddito operativo dalle vendite. &lt;dfn lang=&quot;en&quot;&gt;Turnover&lt;/dfn&gt;: efficienza nell’uso degli assets, cioè quante volte in un anno gli assets «vengono usati» per produrre vendite.&lt;/p&gt;
&lt;/div&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 470 280&quot; role=&quot;img&quot; aria-label=&quot;Albero del ROI: ROI uguale margin per turnover. Margin è net operating income su sales. Turnover è sales su average operating assets. Net operating income è sales meno operating expenses&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;165&quot; y=&quot;6&quot; width=&quot;140&quot; height=&quot;44&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; class=&quot;ser&quot;&gt;ROI&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M205 50 110 86&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M265 50 360 86&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot; class=&quot;ser&quot;&gt;×&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;20&quot; y=&quot;88&quot; width=&quot;180&quot; height=&quot;62&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; class=&quot;ser&quot;&gt;Margin&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; class=&quot;sm&quot;&gt;NOI ÷ Sales&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;270&quot; y=&quot;88&quot; width=&quot;180&quot; height=&quot;62&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; class=&quot;ser&quot;&gt;Turnover&lt;/text&gt;&lt;text x=&quot;360&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; class=&quot;sm&quot;&gt;Sales ÷ Avg op. assets&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M60 150V200&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M150 150V200&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M300 150V200&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M385 150V200&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;text x=&quot;6&quot; y=&quot;222&quot;&gt;Sales&lt;/text&gt;&lt;text x=&quot;6&quot; y=&quot;244&quot;&gt;− Op. expenses&lt;/text&gt;&lt;text x=&quot;6&quot; y=&quot;266&quot; class=&quot;mu sm&quot;&gt;= NOI&lt;/text&gt;
&lt;text x=&quot;132&quot; y=&quot;222&quot;&gt;Sales&lt;/text&gt;
&lt;text x=&quot;282&quot; y=&quot;222&quot;&gt;Sales&lt;/text&gt;&lt;text x=&quot;348&quot; y=&quot;222&quot;&gt;Avg assets&lt;/text&gt;&lt;text x=&quot;348&quot; y=&quot;244&quot; class=&quot;mu sm&quot;&gt;cash, A/R,&lt;/text&gt;&lt;text x=&quot;348&quot; y=&quot;262&quot; class=&quot;mu sm&quot;&gt;inventory, plant…&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;NOI = net operating income. Le vendite compaiono in entrambi i fattori e si semplificano: margin × turnover ridà NOI ÷ assets. Schema da slide 23–24.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;span&gt;ROI = Margin × Turnover =&lt;/span&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Net operating income&lt;/span&gt;&lt;span&gt;Sales&lt;/span&gt;&lt;/span&gt;&lt;span&gt;×&lt;/span&gt;&lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Sales&lt;/span&gt;&lt;span&gt;Average operating assets&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;

&lt;h3&gt;Il caso Regal Company, passo dopo passo&lt;/h3&gt;
&lt;div class=&quot;steps&quot; data-steps aria-live=&quot;polite&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;I dati &lt;span class=&quot;tag&quot;&gt;slide 26&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Net operating income $30,000, average operating assets $200,000, sales (vendite) $500,000, operating expenses (spese operative) $470,000.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Margin&lt;/h4&gt;&lt;p&gt;$30,000 ÷ $500,000 = &lt;b&gt;6%&lt;/b&gt;. Su ogni dollaro venduto restano 6 centesimi di reddito operativo.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Turnover&lt;/h4&gt;&lt;p&gt;$500,000 ÷ $200,000 = &lt;b&gt;2.5&lt;/b&gt;. Gli assets «girano» due volte e mezza all’anno.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;ROI &lt;span class=&quot;tag&quot;&gt;slide 27&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;6% × 2.5 = &lt;b&gt;15%&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Il manager investe &lt;span class=&quot;tag&quot;&gt;slide 28&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Un macchinario da $30,000 aumenta le sales di $35,000 e le operating expenses di $15,000. Nuovi dati: NOI $50,000, assets $230,000, sales $535,000, expenses $485,000.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Nuovo ROI &lt;span class=&quot;tag&quot;&gt;slide 29&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;9.35% × 2.33 = &lt;b&gt;21.8%&lt;/b&gt;. Il ROI sale dal 15% al 21.8%: il margin migliora molto più di quanto peggiori il turnover.&lt;/p&gt;&lt;p&gt;Calcolando senza arrotondare, $50,000 ÷ $230,000 = 21.74%. Il 21.8% della slide nasce dal prodotto di fattori già arrotondati &lt;span class=&quot;tag ox&quot;&gt;oltre le slide&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;prev&quot;&gt;Indietro&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;next&quot;&gt;Avanti&lt;/button&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;Muovi le leve del ROI&lt;/h4&gt;
&lt;p&gt;L’obiettivo di slide 11: vedere come sales, expenses e assets cambiano il ROI. Parti da Regal.&lt;/p&gt;
&lt;div class=&quot;btns&quot; role=&quot;group&quot; aria-label=&quot;Scenari&quot;&gt;
&lt;button type=&quot;button&quot; data-roi=&quot;500000,470000,200000&quot;&gt;Regal di partenza&lt;/button&gt;&lt;button type=&quot;button&quot; data-roi=&quot;535000,485000,230000&quot;&gt;Dopo l’investimento&lt;/button&gt;&lt;button type=&quot;button&quot; data-roi=&quot;500000,460000,200000&quot;&gt;Expenses −$10,000&lt;/button&gt;&lt;button type=&quot;button&quot; data-roi=&quot;500000,470000,180000&quot;&gt;Assets −$20,000&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span&gt;Sales &lt;output id=&quot;r-so&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;r-s&quot; type=&quot;range&quot; min=&quot;200000&quot; max=&quot;800000&quot; step=&quot;5000&quot; value=&quot;500000&quot;&gt;&lt;/label&gt;

&lt;label class=&quot;ctl&quot;&gt;&lt;span&gt;Average operating assets &lt;output id=&quot;r-ao&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input id=&quot;r-a&quot; type=&quot;range&quot; min=&quot;100000&quot; max=&quot;400000&quot; step=&quot;5000&quot; value=&quot;200000&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;reads&quot;&gt;&lt;div class=&quot;read&quot;&gt;&lt;small&gt;NOI&lt;/small&gt;&lt;b id=&quot;r-n&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;read&quot;&gt;&lt;small&gt;Margin&lt;/small&gt;&lt;b id=&quot;r-m&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;read&quot;&gt;&lt;small&gt;Turnover&lt;/small&gt;&lt;b id=&quot;r-t&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;read&quot;&gt;&lt;small&gt;ROI&lt;/small&gt;&lt;b id=&quot;r-r&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;msg&quot; id=&quot;r-msg&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;figure style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 480 330&quot; role=&quot;img&quot; aria-label=&quot;Grafico con turnover in orizzontale e margin in verticale. Le curve uniscono le combinazioni con lo stesso ROI; il punto mostra lo scenario corrente&quot;&gt;
&lt;path class=&quot;ax&quot; d=&quot;M50 30V285H465&quot;/&gt;

&lt;text class=&quot;sm mu&quot; x=&quot;154&quot; y=&quot;304&quot; text-anchor=&quot;middle&quot;&gt;1&lt;/text&gt;&lt;text class=&quot;sm mu&quot; x=&quot;257&quot; y=&quot;304&quot; text-anchor=&quot;middle&quot;&gt;2&lt;/text&gt;&lt;text class=&quot;sm mu&quot; x=&quot;361&quot; y=&quot;304&quot; text-anchor=&quot;middle&quot;&gt;3&lt;/text&gt;&lt;text class=&quot;sm mu&quot; x=&quot;465&quot; y=&quot;304&quot; text-anchor=&quot;end&quot;&gt;4&lt;/text&gt;&lt;/g&gt;
