&lt;tr data-t=&quot;prod E S&quot;&gt;&lt;td&gt;&lt;strong&gt;Rainforest Alliance&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Rainforest Alliance&lt;/td&gt;&lt;td&gt;Sostenibilità agricola e forestale&lt;/td&gt;&lt;td&gt;Standard su ambiente, condizioni sociali, mezzi di sussistenza&lt;/td&gt;&lt;td&gt;Riconosciuto nel food &amp;amp; beverage globale&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;src&quot;&gt;Sl. 46-47. &lt;em&gt;Chain-of-custody&lt;/em&gt;: la tracciabilità del materiale certificato in ogni passaggio fino al prodotto finito.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;B Corp: il requisito degli 80 punti sta cambiando&lt;/span&gt;&lt;p&gt;B Lab ha rivisto gli standard: per le nuove certificazioni dal 2026 non si sommano più punti fino a 80, ma bisogna rispettare &lt;strong&gt;requisiti minimi in ogni Impact Topic&lt;/strong&gt;, differenziati per dimensione e settore. Non si può più compensare un&#x27;area debole con una forte. &lt;a href=&quot;https://www.bcorporation.net/en-us/news/press/preliminary-consultation-suggests-new-b-corp-standards-are-ambitious-yet-attainable/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bcorporation.net&lt;/a&gt; · &lt;a href=&quot;https://bcorporation.uk/b-corp-certification/the-certification-process/improving-your-score/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bcorporation.uk&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3 id=&quot;s-iso&quot;&gt;&lt;span class=&quot;n&quot;&gt;3.5&lt;/span&gt;ISO 14001, EMAS e SA8000&lt;/h3&gt;
&lt;h4&gt;ISO 14001 ed EMAS a confronto (sl. 48-52)&lt;/h4&gt;
&lt;p&gt;&lt;strong&gt;EMAS&lt;/strong&gt; (Eco-Management and Audit Scheme) è un &lt;strong&gt;regolamento UE volontario&lt;/strong&gt; (Reg. CE 1221/2009) che permette a organizzazioni private e pubbliche di valutare, rendicontare e migliorare la performance ambientale &lt;strong&gt;oltre i requisiti ISO 14001&lt;/strong&gt;. Richiede una &lt;strong&gt;dichiarazione ambientale convalidata&lt;/strong&gt;, verificata da verificatori accreditati, e la piena conformità legale.&lt;/p&gt;
&lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 420 260&quot; role=&quot;img&quot; aria-label=&quot;EMAS include ISO 14001 e aggiunge requisiti&quot;&gt;
&lt;ellipse cx=&quot;210&quot; cy=&quot;130&quot; rx=&quot;205&quot; ry=&quot;122&quot; class=&quot;f-cbg s-c&quot; stroke-width=&quot;1.5&quot;/&gt;
&lt;ellipse cx=&quot;210&quot; cy=&quot;130&quot; rx=&quot;78&quot; ry=&quot;44&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; class=&quot;hl&quot; font-size=&quot;13&quot;&gt;ISO 14001&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;143&quot; text-anchor=&quot;middle&quot; class=&quot;hl&quot; font-size=&quot;11&quot;&gt;approccio EMS&lt;/text&gt;
&lt;text x=&quot;210&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;15&quot;&gt;EMAS&lt;/text&gt;
&lt;g font-size=&quot;11.5&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;105&quot; y=&quot;62&quot;&gt;Registrazione&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;76&quot;&gt;da autorità pubblica&lt;/text&gt;&lt;text x=&quot;318&quot; y=&quot;62&quot;&gt;Coinvolgimento dei&lt;/text&gt;&lt;text x=&quot;318&quot; y=&quot;76&quot;&gt;dipendenti dall&#x27;inizio&lt;/text&gt;&lt;text x=&quot;62&quot; y=&quot;126&quot;&gt;Dichiarazione&lt;/text&gt;&lt;text x=&quot;62&quot; y=&quot;140&quot;&gt;pubblica&lt;/text&gt;&lt;text x=&quot;356&quot; y=&quot;126&quot;&gt;Verifica completa&lt;/text&gt;&lt;text x=&quot;356&quot; y=&quot;140&quot;&gt;conformità legale&lt;/text&gt;&lt;text x=&quot;112&quot; y=&quot;196&quot;&gt;Dati ed EMS verificati&lt;/text&gt;&lt;text x=&quot;112&quot; y=&quot;210&quot;&gt;da verificatore indip.&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;196&quot;&gt;Core indicators&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;210&quot;&gt;per il benchmark&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;tbl&quot; style=&quot;margin:0&quot;&gt;&lt;table style=&quot;min-width:0&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;ISO 14001&lt;/th&gt;&lt;th&gt;EMAS&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Ente&lt;/td&gt;&lt;td&gt;ISO&lt;/td&gt;&lt;td&gt;Commissione europea&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Metodo&lt;/td&gt;&lt;td&gt;PDCA&lt;/td&gt;&lt;td&gt;PDCA&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Reporting&lt;/td&gt;&lt;td&gt;comunicazione alle parti interessate&lt;/td&gt;&lt;td&gt;dichiarazione ambientale pubblica con core indicators&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Audit&lt;/td&gt;&lt;td&gt;audit interni + audit esterno annuale&lt;/td&gt;&lt;td&gt;idem + verificatore accreditato prima della pubblicazione&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Registrazione&lt;/td&gt;&lt;td&gt;certificato dell&#x27;ente&lt;/td&gt;&lt;td&gt;registro pubblico dell&#x27;autorità&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Diffusione&lt;/td&gt;&lt;td&gt;≈ 350.000 organizzazioni nel mondo&lt;/td&gt;&lt;td&gt;≈ 14.000 registrazioni (UE, 2014)&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;Sintesi della tabella della sl. 52 (adattata da Iatridis e Schroeder, 2016, e Crane et al., 2020).&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;Versioni e date: cosa è cambiato&lt;/span&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;La tabella della sl. 52 indica ISO 14001 «2004 (versione 1), 2015 (versione 2)». Sul sito ISO la 2015 risulta la terza edizione, e il &lt;strong&gt;15 aprile 2026 è uscita ISO 14001:2026&lt;/strong&gt; (quarta edizione), che sostituisce la 2015 e include l&#x27;emendamento sul clima del 2024; i certificati 2015 devono passare alla nuova edizione entro maggio 2029. &lt;a href=&quot;https://www.iso.org/news/2026/04/iso-14001-2026-published&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;iso.org&lt;/a&gt; · &lt;a href=&quot;https://www.dnv.com/news/2026/new-edition-of-iso-14001-published/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;dnv.com&lt;/a&gt;&lt;/li&gt;&lt;li&gt;Il Reg. (CE) 1221/2009 è stato adottato il 25 novembre 2009 e ha abrogato il precedente Reg. 761/2001: è in genere chiamato «EMAS III». &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2009/1221/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt; · &lt;a href=&quot;https://legislation.gov.uk/eur/2009/1221/introduction/adopted&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;legislation.gov.uk&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;

&lt;h4&gt;SA8000 (sl. 53)&lt;/h4&gt;
&lt;p&gt;Lo standard di certificazione sociale di riferimento per &lt;strong&gt;fabbriche e organizzazioni&lt;/strong&gt;, creato nel 1997 da Social Accountability International come iniziativa &lt;em&gt;multi-stakeholder&lt;/em&gt;. Misura la performance sociale in &lt;strong&gt;otto aree&lt;/strong&gt; dei luoghi di lavoro, ancorate a un elemento di &lt;strong&gt;sistema di gestione&lt;/strong&gt; che spinge al miglioramento continuo. Riflette le norme sul lavoro della Dichiarazione universale dei diritti umani e delle convenzioni ILO e rispetta le leggi nazionali. Secondo la slide tutela condizioni di lavoro etiche per circa due milioni di lavoratori.&lt;/p&gt;
&lt;p class=&quot;gloss&quot;&gt;Nota: il titolo della sl. 53 dice «SA 8001», ma il testo e i loghi si riferiscono a SA8000. Le otto aree, per conoscenza generale (non nelle slide): lavoro minorile, lavoro forzato, salute e sicurezza, libertà di associazione e contrattazione collettiva, discriminazione, pratiche disciplinari, orario di lavoro, retribuzione.&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;SA8000:2026&lt;/span&gt;&lt;p&gt;Il sito di SAI presenta ora &lt;strong&gt;SA8000:2026&lt;/strong&gt; come versione corrente (la precedente era del 2014). SAI sottolinea l&#x27;approccio di sistema di gestione e il miglioramento continuo, non l&#x27;audit a checklist. &lt;a href=&quot;https://sa-intl.org/resources/sa8000-standard/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sa-intl.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h4&gt;Le sfide delle certificazioni di sostenibilità (sl. 55-56)&lt;/h4&gt;
&lt;div data-tabs&gt;&lt;div role=&quot;tablist&quot; aria-label=&quot;Sfide&quot;&gt;&lt;button role=&quot;tab&quot;&gt;1 · Costi&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;2 · Sovrapposizioni&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;3 · Greenwashing&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;4 · Riconoscimento&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;5 · Conformità continua&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Ottenere e mantenere la certificazione è &lt;strong&gt;costoso e lungo&lt;/strong&gt;: audit, formazione, documentazione. Le PMI faticano di più, in proporzione alla loro dimensione. Es.: una ISO 14001 completa può richiedere consulenti esterni, audit su più siti e costi annuali di sorveglianza.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;La moltiplicazione degli schemi ESG genera &lt;strong&gt;confusione e ridondanza&lt;/strong&gt;. Molti framework si sovrappongono (GRI, SASB, CDP, ISO 26000, B Corp) e l&#x27;impresa deve allineare sistemi e metriche diverse. Es.: un gruppo con ISO 14001, SA8000 e reporting GRI deve integrarli in un unico sistema di gestione.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Il &lt;span class=&quot;term&quot;&gt;greenwashing&lt;/span&gt; è il presentarsi più sostenibili di quanto si è. Alcune imprese usano la certificazione &lt;strong&gt;in modo superficiale&lt;/strong&gt;, per l&#x27;immagine. Senza verifiche rigorose e misurazione degli impatti, le certificazioni perdono credibilità. Es.: eco-label di prodotto criticati quando gli enti certificatori non avevano pratiche di audit rigorose.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Non tutte le certificazioni sono &lt;strong&gt;riconosciute ovunque&lt;/strong&gt;, e questo crea barriere nei mercati internazionali. Es.: EMAS è rispettato in UE ma poco noto altrove, mentre ISO 14001 è accettata a livello internazionale.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;La certificazione non è un traguardo una tantum: richiede &lt;strong&gt;audit continui e prove&lt;/strong&gt; di miglioramento. Se gli standard non sono mantenuti, il certificato può essere sospeso o revocato.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;s-audit&quot;&gt;&lt;span class=&quot;n&quot;&gt;3.6&lt;/span&gt;Internal and external auditing&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Internal auditors&lt;/span&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Valutano l&#x27;efficacia di &lt;strong&gt;governance, risk management e controlli interni&lt;/strong&gt;, inclusi i programmi etici e i meccanismi di &lt;em&gt;whistleblowing&lt;/em&gt; (segnalazione degli illeciti).&lt;/li&gt;&lt;li&gt;Riferiscono risultati e raccomandazioni al management e al board o all&#x27;&lt;em&gt;audit committee&lt;/em&gt;.&lt;/li&gt;&lt;li&gt;Possono essere interni o esternalizzati, ma mantengono indipendenza e obiettività.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;External auditors&lt;/span&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Esaminano in modo indipendente il &lt;strong&gt;bilancio&lt;/strong&gt; ed esprimono un giudizio sull&#x27;assenza di &lt;em&gt;material misstatement&lt;/em&gt; (errori significativi).&lt;/li&gt;&lt;li&gt;Considerano i rischi di frode rilevanti per il bilancio e comunicano i problemi significativi.&lt;/li&gt;&lt;li&gt;Possono dare &lt;em&gt;assurance&lt;/em&gt; anche sulle informazioni di sostenibilità, con un incarico separato.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;IMP (sl. 58).&lt;/b&gt; Gli auditor sostengono l&#x27;accountability, ma &lt;strong&gt;la responsabilità della condotta etica resta a management e board&lt;/strong&gt;. Un audit non garantisce che ogni illecito sia scoperto.&lt;/div&gt;
&lt;h4&gt;Auditing ethics across the supply chain (sl. 59)&lt;/h4&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Cosa&lt;/span&gt;&lt;p&gt;Condizioni di lavoro, salute e sicurezza, diritti umani, pratiche ambientali, rischi di corruzione presso fornitori e subfornitori.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Chi&lt;/span&gt;&lt;p&gt;Team aziendali o terze parti indipendenti: esaminano documenti, visitano gli impianti, intervistano i lavoratori.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Ruolo delle ONG&lt;/span&gt;&lt;p&gt;Conoscenza locale, segnalazioni, sostegno alle comunità, scrutinio delle pratiche aziendali. Anche sindacati e lavoratori sono fonti essenziali.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Limiti&lt;/span&gt;&lt;p&gt;L&#x27;audit è una &lt;strong&gt;fotografia&lt;/strong&gt;: può non vedere abusi nascosti, subfornitori o lavoratori che temono ritorsioni. Non tutte le attività e i fornitori vengono controllati.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Oltre l&#x27;audit&lt;/span&gt;&lt;p&gt;Audit basati sul rischio + coinvolgimento dei lavoratori, meccanismi di reclamo, azioni correttive e follow-up. E chiedersi se le proprie &lt;strong&gt;pratiche di acquisto&lt;/strong&gt; (prezzi, tempi) creano rischi nei fornitori.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;IMP&lt;/span&gt;&lt;p&gt;L&#x27;audit è uno strumento della due diligence, &lt;strong&gt;non la prova&lt;/strong&gt; che una filiera sia etica. Verifica chi, quanti e quale parte della filiera è stata controllata (&lt;strong&gt;% di fornitori auditati&lt;/strong&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Simulatore · che cosa significa «% di fornitori auditati»&lt;/span&gt;
&lt;p class=&quot;gloss&quot;&gt;Modello illustrativo con numeri inventati, non nelle slide: una filiera con 12 fornitori Tier 1, 36 Tier 2 e 72 Tier 3.&lt;/p&gt;
&lt;label for=&quot;audDepth&quot;&gt;Gli audit arrivano fino al: &lt;strong id=&quot;audDepthL&quot;&gt;Tier 1&lt;/strong&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;audDepth&quot; min=&quot;1&quot; max=&quot;3&quot; value=&quot;1&quot;&gt;
&lt;label for=&quot;audPct&quot;&gt;Quota di fornitori auditati nei livelli coperti: &lt;strong id=&quot;audPctL&quot;&gt;80%&lt;/strong&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;audPct&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;80&quot;&gt;
&lt;svg id=&quot;audSvg&quot; viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;Fornitori auditati per livello&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;out&quot; id=&quot;audOut&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;s-acc&quot;&gt;&lt;span class=&quot;n&quot;&gt;3.7&lt;/span&gt;Accounting, accountability and reporting&lt;/h3&gt;
&lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 360 230&quot; role=&quot;img&quot; aria-label=&quot;Triangolo ethics, responsibility, accountability&quot;&gt;
&lt;g class=&quot;s-c&quot; stroke-width=&quot;2.5&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M180 58L72 170M180 58L288 170M120 192H240&quot;/&gt;&lt;/g&gt;
&lt;g text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;&lt;rect x=&quot;115&quot; y=&quot;16&quot; width=&quot;130&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;44&quot; class=&quot;hl&quot;&gt;Ethics&lt;/text&gt;&lt;rect x=&quot;10&quot; y=&quot;170&quot; width=&quot;130&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;198&quot;&gt;Responsibility&lt;/text&gt;&lt;rect x=&quot;220&quot; y=&quot;170&quot; width=&quot;130&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;285&quot; y=&quot;198&quot;&gt;Accountability&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;figcaption&gt;Sl. 61: tre concetti che si richiamano a vicenda.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div&gt;&lt;p&gt;L&#x27;&lt;strong&gt;etica&lt;/strong&gt; dice cosa è giusto; la &lt;strong&gt;responsibility&lt;/strong&gt; individua di cosa si risponde; l&#x27;&lt;strong&gt;accountability&lt;/strong&gt; è il dovere di &lt;em&gt;rendere conto&lt;/em&gt; di ciò di cui si è responsabili. Senza accountability la responsabilità resta una dichiarazione.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;blockquote&gt;«the duty to provide an account (by no means necessarily a financial account) or reckoning of those actions for which one is held responsible»&lt;cite&gt;Gray, Owen e Adams (1996, p. 38), sl. 62&lt;/cite&gt;&lt;/blockquote&gt;
&lt;blockquote&gt;«the means through which individuals and organizations are held externally to account for their actions and as the means by which they take internal responsibility for continuously shaping and scrutinizing organizational mission, goals, and performance»&lt;cite&gt;Ebrahim (2003b, p. 194), sl. 62&lt;/cite&gt;&lt;/blockquote&gt;
&lt;/div&gt;
&lt;p&gt;Ebrahim aggiunge una doppia dimensione: &lt;strong&gt;esterna&lt;/strong&gt; (essere chiamati a rispondere) e &lt;strong&gt;interna&lt;/strong&gt; (assumersi la responsabilità di rivedere continuamente mission, obiettivi e performance).&lt;/p&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Definizione · sl. 63&lt;/span&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Social e/o sustainability accounting&lt;/span&gt; è il processo volontario di valutare e comunicare attività e impatti dell&#x27;organizzazione su temi sociali, etici e ambientali rilevanti per gli stakeholder.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Molti nomi per un&#x27;unica idea, essere accountable: social accounting, corporate social reporting, corporate social disclosure, social &amp;amp; environmental reporting, social responsibility disclosure, sustainability reporting…&lt;/p&gt;&lt;/div&gt;
&lt;blockquote&gt;«… is the &lt;strong&gt;process of communicating&lt;/strong&gt; the social and environmental effects of organizations&#x27; economic actions to particular interest groups within society and to society at large. As such, it involves &lt;strong&gt;extending the accountability of organizations&lt;/strong&gt; (particularly companies), beyond the traditional role of providing a financial account to the owners of capital, in particular, shareholders. Such an extension is predicated upon the assumption that &lt;strong&gt;companies do have wider responsibilities&lt;/strong&gt; than simply to make money for their shareholders.»&lt;cite&gt;Gray, Owen e Adams (1996, p. 3), sl. 64&lt;/cite&gt;&lt;/blockquote&gt;
&lt;p&gt;Qui torna la stakeholder theory: se l&#x27;impresa ha responsabilità verso più soggetti, deve rendere conto a più soggetti, non solo agli azionisti.&lt;/p&gt;
&lt;h4&gt;Il processo di sustainability accounting (sl. 65)&lt;/h4&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;svg viewBox=&quot;0 0 420 300&quot; role=&quot;img&quot; aria-label=&quot;Ciclo in otto fasi con il dialogo con gli stakeholder al centro&quot;&gt;&lt;circle cx=&quot;210&quot; cy=&quot;150&quot; r=&quot;112&quot; fill=&quot;none&quot; class=&quot;s-rule&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;4 5&quot;/&gt;
&lt;circle cx=&quot;210&quot; cy=&quot;150&quot; r=&quot;52&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; class=&quot;hl&quot; font-size=&quot;13&quot;&gt;Stakeholder&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;163&quot; text-anchor=&quot;middle&quot; class=&quot;hl&quot; font-size=&quot;13&quot;&gt;dialogue&lt;/text&gt;
&lt;g font-size=&quot;17&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;
&lt;g data-si=&quot;0&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;210&quot; cy=&quot;38&quot; r=&quot;22&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;44&quot;&gt;1&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;1&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;289&quot; cy=&quot;71&quot; r=&quot;22&quot;/&gt;&lt;text x=&quot;289&quot; y=&quot;77&quot;&gt;2&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;2&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;322&quot; cy=&quot;150&quot; r=&quot;22&quot;/&gt;&lt;text x=&quot;322&quot; y=&quot;156&quot;&gt;3&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;3&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;289&quot; cy=&quot;229&quot; r=&quot;22&quot;/&gt;&lt;text x=&quot;289&quot; y=&quot;235&quot;&gt;4&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;4&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;210&quot; cy=&quot;262&quot; r=&quot;22&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;268&quot;&gt;5&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;5&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;131&quot; cy=&quot;229&quot; r=&quot;22&quot;/&gt;&lt;text x=&quot;131&quot; y=&quot;235&quot;&gt;6&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;6&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;98&quot; cy=&quot;150&quot; r=&quot;22&quot;/&gt;&lt;text x=&quot;98&quot; y=&quot;156&quot;&gt;7&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;7&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;131&quot; cy=&quot;71&quot; r=&quot;22&quot;/&gt;&lt;text x=&quot;131&quot; y=&quot;77&quot;&gt;8&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;&lt;/svg&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Determine aims and strategy&lt;/h4&gt;&lt;p&gt;Perché facciamo reporting e per chi? Si definiscono obiettivi e strategia del processo.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Conduct materiality assessment&lt;/h4&gt;&lt;p&gt;L&#x27;&lt;span class=&quot;term&quot;&gt;analisi di materialità&lt;/span&gt; seleziona i temi &lt;strong&gt;rilevanti&lt;/strong&gt; (material), cioè quelli che contano davvero per l&#x27;impresa e per i suoi stakeholder. Con la CSRD diventa &lt;em&gt;double materiality&lt;/em&gt; (vedi sotto).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Select performance indicators&lt;/h4&gt;&lt;p&gt;Per ogni tema materiale si scelgono indicatori misurabili (es. emissioni, infortuni, % fornitori auditati), spesso presi da standard come GRI.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Collect and analyse data&lt;/h4&gt;&lt;p&gt;Raccolta dei dati da funzioni, siti e fornitori; controllo di qualità e analisi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Prepare report&lt;/h4&gt;&lt;p&gt;Redazione del report: dati, narrazione, obiettivi, risultati raggiunti e mancati.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;6 · Provide verification and assurance&lt;/h4&gt;&lt;p&gt;Un soggetto indipendente verifica le informazioni e rilascia un&#x27;&lt;em&gt;assurance&lt;/em&gt;. Il legame con l&#x27;external auditing di §3.6.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;7 · Publish report&lt;/h4&gt;&lt;p&gt;Il report è reso pubblico e comunicato agli stakeholder.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;8 · Evaluate effectiveness&lt;/h4&gt;&lt;p&gt;Il processo ha funzionato? Gli stakeholder l&#x27;hanno trovato utile? Le lezioni apprese alimentano il ciclo successivo. Per tutto il ciclo, il &lt;strong&gt;dialogo con gli stakeholder&lt;/strong&gt; sta al centro.&lt;/p&gt;&lt;/div&gt;
&lt;nav&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/nav&gt;
&lt;/div&gt;

&lt;h4&gt;Dalla NFRD alla CSRD (sl. 66-67)&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Directive 2014/95/EU · NFRD&lt;/span&gt;&lt;p&gt;La &lt;em&gt;Non-Financial Reporting Directive&lt;/em&gt; obbligava le grandi imprese &lt;span class=&quot;term&quot;&gt;public-interest entities&lt;/span&gt; (enti di interesse pubblico: quotate, banche, assicurazioni) con &lt;strong&gt;più di 500 dipendenti&lt;/strong&gt; in media a includere nella relazione sulla gestione una &lt;strong&gt;dichiarazione non finanziaria&lt;/strong&gt; utile a capire sviluppo, performance, posizione e &lt;strong&gt;impatto&lt;/strong&gt; dell&#x27;attività.&lt;/p&gt;&lt;p&gt;Contenuti minimi: &lt;strong&gt;ambiente&lt;/strong&gt;; &lt;strong&gt;temi sociali e del personale&lt;/strong&gt;; &lt;strong&gt;diritti umani&lt;/strong&gt;; &lt;strong&gt;lotta alla corruzione&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;CSRD · Corporate Sustainability Reporting Directive&lt;/span&gt;&lt;p&gt;La nuova direttiva sul reporting di sostenibilità introduce la &lt;span class=&quot;term&quot;&gt;double materiality&lt;/span&gt; (doppia materialità): un tema va rendicontato se è rilevante sotto almeno una di due prospettive.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div data-hot=&quot;dm&quot; class=&quot;grid2&quot; style=&quot;align-items:start&quot;&gt;
&lt;div&gt;&lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn&quot; data-k=&quot;fin&quot; aria-pressed=&quot;false&quot;&gt;Financial materiality&lt;/button&gt;&lt;button class=&quot;btn&quot; data-k=&quot;imp&quot; aria-pressed=&quot;false&quot;&gt;Impact materiality&lt;/button&gt;&lt;button class=&quot;btn&quot; data-k=&quot;dm&quot; aria-pressed=&quot;false&quot;&gt;Double materiality&lt;/button&gt;&lt;/div&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 440 200&quot; role=&quot;img&quot; aria-label=&quot;Doppia materialità: impresa e clima&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;f-acc&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;20&quot; y=&quot;70&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Company&lt;/text&gt;
&lt;rect x=&quot;300&quot; y=&quot;70&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Climate / society&lt;/text&gt;
&lt;g class=&quot;dmA&quot;&gt;&lt;path d=&quot;M298 82Q220 40 142 82&quot; fill=&quot;none&quot; class=&quot;s-acc&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;outside-in: il clima incide sull&#x27;impresa&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;dmB&quot;&gt;&lt;path d=&quot;M142 118Q220 160 298 118&quot; fill=&quot;none&quot; class=&quot;s-acc&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;inside-out: l&#x27;impresa incide sul clima&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;
&lt;div class=&quot;hbox&quot;&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;fin&quot;&gt;&lt;h4&gt;Financial materiality&lt;/h4&gt;&lt;p&gt;Prospettiva &lt;strong&gt;outside-in&lt;/strong&gt;: informazioni necessarie per capire sviluppo, performance e posizione dell&#x27;impresa, cioè come il cambiamento climatico (e altri temi ESG) incide sull&#x27;impresa. Pubblico principale: &lt;strong&gt;investitori&lt;/strong&gt;. Collegata alle raccomandazioni della TCFD (Task Force on Climate-related Financial Disclosures).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;imp&quot;&gt;&lt;h4&gt;Environmental &amp;amp; social (impact) materiality&lt;/h4&gt;&lt;p&gt;Prospettiva &lt;strong&gt;inside-out&lt;/strong&gt;: l&#x27;impatto delle attività dell&#x27;impresa su ambiente e società. Pubblico: &lt;strong&gt;consumatori, società civile, dipendenti, investitori&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;dm&quot;&gt;&lt;h4&gt;Double materiality&lt;/h4&gt;&lt;p&gt;Si considerano &lt;strong&gt;entrambe le direzioni&lt;/strong&gt;. Le due si toccano: l&#x27;impatto dell&#x27;impresa sul clima può diventare finanziariamente rilevante (regole, reputazione, costi futuri). La NFRD le menzionava già entrambe, ma la CSRD le rende il criterio centrale, rappresentato con una &lt;em&gt;double materiality matrix&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;Riferimenti normativi aggiornati&lt;/span&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;NFRD: Direttiva 2014/95/UE, GU L 330 del 15.11.2014, che modifica la Direttiva contabile 2013/34/UE; primo reporting nel 2018 sull&#x27;esercizio 2017. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2014/95/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/li&gt;&lt;li&gt;CSRD: Direttiva (UE) 2022/2464; i contenuti sono dettagliati negli &lt;strong&gt;ESRS&lt;/strong&gt; (European Sustainability Reporting Standards), adottati dalla Commissione il 31 luglio 2023, che distinguono &lt;em&gt;impact&lt;/em&gt; e &lt;em&gt;financial materiality&lt;/em&gt;. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2022/2464/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt; · &lt;a href=&quot;https://dart.deloitte.com/USDART/home/publications/deloitte/heads-up/2024/csrd-esrs-double-materiality-assessment&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Deloitte&lt;/a&gt;&lt;/li&gt;&lt;li&gt;Con la Direttiva «Omnibus» (UE) 2026/470, secondo fonti professionali, l&#x27;ambito CSRD è stato ristretto alle imprese con &lt;strong&gt;oltre 1.000 dipendenti e oltre 450 milioni di euro&lt;/strong&gt; di fatturato. Da verificare sul testo ufficiale. &lt;a href=&quot;https://www.cov.com/en/news-and-insights/insights/2026/02/eu-csddd-csrd-omnibus-published-in-official-journal-transposition-delegated-acts-and-guidelines-are-next&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Covington&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;

&lt;h4&gt;Accounting for sustainability (sl. 69)&lt;/h4&gt;
&lt;p&gt;Usa i metodi della contabilità convenzionale per &lt;strong&gt;registrare, documentare e analizzare&lt;/strong&gt; gli impatti ecologici e sociali dell&#x27;impresa. La contabilità tradizionale si è differenziata ed estesa (es. &lt;em&gt;environmental cost accounting&lt;/em&gt;, valutazione degli investimenti in protezione ambientale) per individuare tre tipi di costo:&lt;/p&gt;
&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;A&lt;/span&gt;&lt;p&gt;Costi &lt;strong&gt;causati dalle misure&lt;/strong&gt; di protezione ambientale.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;B&lt;/span&gt;&lt;p&gt;Costi &lt;strong&gt;causati dalla mancanza&lt;/strong&gt; di misure di protezione.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;C&lt;/span&gt;&lt;p&gt;Costi che &lt;strong&gt;si potrebbero evitare&lt;/strong&gt; adottando quelle misure.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Grafico interattivo · modello illustrativo, non nelle slide&lt;/span&gt;
&lt;p class=&quot;gloss&quot;&gt;Ipotesi: senza protezione i danni attesi (sanzioni, bonifiche, perdita di reputazione) valgono 120; ogni euro speso in protezione li riduce, con rendimenti decrescenti.&lt;/p&gt;
&lt;label for=&quot;accP&quot;&gt;Spesa in protezione ambientale: &lt;strong id=&quot;accPL&quot;&gt;30&lt;/strong&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;accP&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;30&quot;&gt;
&lt;svg id=&quot;accSvg&quot; viewBox=&quot;0 0 560 230&quot; role=&quot;img&quot; aria-label=&quot;Costi di protezione, di mancata protezione ed evitati&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;out&quot; id=&quot;accOut&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;s-csddd&quot;&gt;&lt;span class=&quot;n&quot;&gt;3.8&lt;/span&gt;Corporate sustainability due diligence: la CSDDD&lt;/h3&gt;
&lt;p&gt;La Direttiva sulla &lt;span class=&quot;term&quot;&gt;corporate sustainability due diligence&lt;/span&gt; (Direttiva 2024/1760, &lt;strong&gt;CSDDD&lt;/strong&gt;) è entrata in vigore il 25 luglio 2024. Mira a promuovere comportamenti d&#x27;impresa sostenibili e responsabili nelle operazioni e lungo le &lt;strong&gt;catene globali del valore&lt;/strong&gt;: le imprese incluse devono identificare e affrontare gli impatti negativi su diritti umani e ambiente, dentro e fuori l&#x27;Europa (sl. 70).&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;What it is&lt;/span&gt;&lt;p&gt;Un quadro UE che impone alle grandi imprese di affrontare gli impatti negativi su diritti umani e ambiente legati alle loro attività.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Why it matters&lt;/span&gt;&lt;p&gt;Proteggere persone e ambiente e fissare aspettative comuni di condotta responsabile in tutta l&#x27;UE.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 760 90&quot; role=&quot;img&quot; aria-label=&quot;Fasi della due diligence&quot;&gt;&lt;defs&gt;&lt;marker id=&quot;ar4&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;f-mut&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;

&lt;rect x=&quot;196&quot; y=&quot;16&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;281&quot; y=&quot;40&quot; font-weight=&quot;600&quot;&gt;Prevent / mitigate&lt;/text&gt;&lt;text x=&quot;281&quot; y=&quot;58&quot;&gt;impatti potenziali&lt;/text&gt;
&lt;rect x=&quot;388&quot; y=&quot;16&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;473&quot; y=&quot;40&quot; font-weight=&quot;600&quot;&gt;Bring to an end&lt;/text&gt;&lt;text x=&quot;473&quot; y=&quot;58&quot;&gt;o minimizzare quelli attuali&lt;/text&gt;
&lt;rect x=&quot;580&quot; y=&quot;16&quot; width=&quot;176&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;668&quot; y=&quot;40&quot; class=&quot;hl&quot;&gt;Remediation&lt;/text&gt;&lt;text x=&quot;668&quot; y=&quot;58&quot; class=&quot;hl&quot; font-size=&quot;12&quot;&gt;dove richiesto&lt;/text&gt;&lt;/g&gt;

&lt;figure&gt;&lt;svg viewBox=&quot;0 0 760 110&quot; role=&quot;img&quot; aria-label=&quot;Cronologia CSDDD&quot;&gt;&lt;line x1=&quot;30&quot; y1=&quot;40&quot; x2=&quot;730&quot; y2=&quot;40&quot; class=&quot;s-c&quot; stroke-width=&quot;3&quot;/&gt;

&lt;circle cx=&quot;60&quot; cy=&quot;40&quot; r=&quot;8&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;20&quot; font-weight=&quot;600&quot;&gt;25 lug 2024&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;66&quot;&gt;entra in vigore&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;82&quot;&gt;Dir. 2024/1760&lt;/text&gt;

&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;Prima e dopo l&#x27;Omnibus&lt;/span&gt;&lt;p&gt;Nel testo originario del 2024 le soglie per le imprese UE erano &lt;strong&gt;1.000 dipendenti e 450 milioni di euro&lt;/strong&gt; di fatturato mondiale; la Direttiva (UE) 2026/470 («Omnibus I») le ha alzate a 5.000 dipendenti e 1,5 miliardi, come indicato nella slide. Le fonti consultate sono studi legali e consulenti; il testo consolidato è su EUR-Lex. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2024/1760/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex 2024/1760&lt;/a&gt; · &lt;a href=&quot;https://www.noerr.com/en/insights/csddd-amending-directive-published-in-the-official-journal-of-the-european-union&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Noerr&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;h4&gt;Le imprese sono pronte? (sl. 73)&lt;/h4&gt;
&lt;p&gt;Il rapporto della &lt;strong&gt;World Benchmarking Alliance&lt;/strong&gt; (Gardiner, luglio 2024) valuta la preparazione alla CSDDD sulla base del suo Social Benchmark. Molte imprese globali sono carenti nella &lt;span class=&quot;term&quot;&gt;HRDD&lt;/span&gt; (human rights due diligence, due diligence sui diritti umani):&lt;/p&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;Dati World Benchmarking Alliance&quot;&gt;
&lt;g font-size=&quot;13&quot;&gt;
&lt;text x=&quot;0&quot; y=&quot;30&quot;&gt;Punteggio zero nei primi passi della HRDD&lt;/text&gt;&lt;rect x=&quot;0&quot; y=&quot;38&quot; width=&quot;600&quot; height=&quot;16&quot; rx=&quot;4&quot; class=&quot;f-rule&quot;/&gt;&lt;rect x=&quot;0&quot; y=&quot;38&quot; width=&quot;480&quot; height=&quot;16&quot; rx=&quot;4&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;51&quot; font-weight=&quot;700&quot;&gt;80%&lt;/text&gt;
&lt;text x=&quot;0&quot; y=&quot;84&quot;&gt;Dimostrano di coinvolgere gli stakeholder colpiti&lt;/text&gt;&lt;rect x=&quot;0&quot; y=&quot;92&quot; width=&quot;600&quot; height=&quot;16&quot; rx=&quot;4&quot; class=&quot;f-rule&quot;/&gt;&lt;rect x=&quot;0&quot; y=&quot;92&quot; width=&quot;54&quot; height=&quot;16&quot; rx=&quot;4&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;62&quot; y=&quot;105&quot; font-weight=&quot;700&quot;&gt;9%&lt;/text&gt;

&lt;/g&gt;&lt;/svg&gt;&lt;figcaption&gt;Dati della sl. 73. Rapporto: &lt;a href=&quot;https://www.worldbenchmarkingalliance.org/news/are-companies-ready-for-the-eu-supply-chain-law&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;«Are companies ready for the EU supply chain law?»&lt;/a&gt;.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;div class=&quot;quiz pO&quot;&gt;&lt;h3&gt;Autoverifica · Parte III&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;Una certificazione di processo attesta il sistema di gestione, non le caratteristiche di ogni prodotto.&quot;&gt;&lt;p&gt;Un&#x27;azienda certificata ISO 14001 scrive su tutte le confezioni «prodotto sostenibile». Cosa c&#x27;è di sbagliato?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Niente: ISO 14001 certifica i prodotti&lt;/button&gt;&lt;button data-ok&gt;ISO 14001 è una process certification: attesta il sistema di gestione, non che ogni prodotto sia sostenibile&lt;/button&gt;&lt;button&gt;ISO 14001 vale solo nell&#x27;UE&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;EMAS = ISO 14001 + dichiarazione ambientale pubblica convalidata, registrazione pubblica, verifica legale completa, coinvolgimento dei dipendenti, core indicators.&quot;&gt;&lt;p&gt;Che cosa aggiunge EMAS rispetto a ISO 14001?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Un ciclo diverso dal PDCA&lt;/button&gt;&lt;button&gt;Niente, sono equivalenti&lt;/button&gt;&lt;button data-ok&gt;Dichiarazione ambientale pubblica convalidata, registrazione da un&#x27;autorità pubblica, verifica completa della conformità legale, coinvolgimento dei dipendenti&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;Per i non UE conta solo il fatturato generato nell&#x27;UE (oltre 1,5 miliardi), senza soglia di dipendenti.&quot;&gt;&lt;p&gt;Un&#x27;impresa extra-UE con 800 dipendenti e 2 miliardi di fatturato nell&#x27;UE rientra nella CSDDD (sl. 72)?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button data-ok&gt;Sì&lt;/button&gt;&lt;button&gt;No, ha troppo pochi dipendenti&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Quali sono le tre domande per interpretare una certificazione?&lt;/summary&gt;&lt;div&gt;Che cosa viene valutato? Rispetto a quale standard? Da chi? (sl. 39)&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Elenca le cinque fasi del processo di certificazione.&lt;/summary&gt;&lt;div&gt;Preparation/application; gap analysis/documentation review; implementation; certification audit &amp;amp; decision (Stage 1 e Stage 2); surveillance/recertification (di norma audit annuali, ricertificazione dopo circa tre anni).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quali sono le cinque sfide delle certificazioni di sostenibilità?&lt;/summary&gt;&lt;div&gt;Costi e risorse; complessità e sovrapposizione degli standard; rischio di greenwashing; riconoscimento limitato o mancata equivalenza globale; pressione della conformità continua.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa distingue internal ed external auditor? Chi resta responsabile della condotta etica?&lt;/summary&gt;&lt;div&gt;Gli interni valutano governance, risk management e controlli (anche programmi etici e whistleblowing) e riferiscono a management e board/audit committee; gli esterni giudicano in modo indipendente se il bilancio è privo di errori significativi e possono dare assurance sulla sostenibilità con un incarico separato. La responsabilità della condotta etica resta a management e board.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Spiega la double materiality con un esempio.&lt;/summary&gt;&lt;div&gt;Financial materiality (outside-in): come i temi di sostenibilità incidono sull&#x27;impresa, es. il rischio climatico sui suoi impianti; pubblico: investitori. Impact materiality (inside-out): come l&#x27;impresa incide su persone e ambiente, es. le sue emissioni; pubblico: consumatori, società civile, dipendenti, investitori. La CSRD chiede di considerarle entrambe.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Definisci l&#x27;accountability secondo Gray, Owen e Adams.&lt;/summary&gt;&lt;div&gt;Il dovere di fornire un resoconto (non necessariamente finanziario) delle azioni di cui si è ritenuti responsabili (1996, p. 38).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quali erano i quattro ambiti minimi della NFRD?&lt;/summary&gt;&lt;div&gt;Ambiente; temi sociali e relativi al personale; rispetto dei diritti umani; lotta alla corruzione.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part pM&quot; id=&quot;p4&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Parte IV · sl. 82–111&lt;/div&gt;&lt;h2&gt;Ethical issues in supply chain&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Si torna alla &lt;em&gt;upstream responsibility&lt;/em&gt; della Parte I, ora con un caso concreto (Nike) e un modello per leggerlo (Yawar e Seuring, 2017). Tutti gli strumenti visti finora (codici, audit, reporting, due diligence) qui si applicano ai fornitori.&lt;/p&gt;

&lt;h3 id=&quot;s-sc&quot;&gt;&lt;span class=&quot;n&quot;&gt;4.1&lt;/span&gt;Caso Nike: accusa, risposta, strumenti&lt;/h3&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · L&#x27;accusa (sl. 83)&lt;/h4&gt;&lt;p&gt;Luglio 2023 (BBC News): il Canada apre un&#x27;indagine su Nike e Dynasty Gold per il presunto uso di &lt;strong&gt;lavoro forzato uiguro&lt;/strong&gt;. Le accuse riguardano la regione cinese dello &lt;strong&gt;Xinjiang&lt;/strong&gt;, da cui proviene una quota importante del cotone mondiale. La slide segnala anche il ruolo degli &lt;strong&gt;azionisti&lt;/strong&gt; nel fare pressione sull&#x27;azienda.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Il Congresso USA (sl. 85)&lt;/h4&gt;&lt;p&gt;Il &lt;em&gt;Select Committee on the Chinese Communist Party&lt;/em&gt; della Camera scrive al CEO di Nike (maggio 2023) chiedendo conto della conformità all&#x27;&lt;span class=&quot;term&quot;&gt;UFLPA&lt;/span&gt; (Uyghur Forced Labor Prevention Act): se i capi importati contengono input dello Xinjiang, quali passi Nike ha fatto per esaminare la filiera, quali audit, quali fornitori, quali obblighi contrattuali, quali prove documentali.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;È un esempio di stakeholder pubblico che chiede &lt;em&gt;accountability&lt;/em&gt;: le domande sono quasi una checklist di due diligence.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · La risposta di Nike (sl. 86)&lt;/h4&gt;&lt;blockquote&gt;«Nike is committed to ethical and responsible manufacturing and we uphold international labor standards… Nike does not source products from the XUAR and we have confirmed with our contract suppliers that they are not using textiles or spun yarn from the region.»&lt;cite&gt;Nike, statement on forced labor&lt;/cite&gt;&lt;/blockquote&gt;&lt;p&gt;Accompagnata dallo &lt;em&gt;Statement on Forced Labor, Human Trafficking and Modern Slavery&lt;/em&gt; (FY2022) e da un documento specifico sulla XUAR (Xinjiang Uyghur Autonomous Region).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · I codici (sl. 87)&lt;/h4&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;&lt;strong&gt;Nike Code of Conduct&lt;/strong&gt;: le aspettative verso i fornitori;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Code Leadership Standards&lt;/strong&gt;: i requisiti dettagliati di attuazione (lavoro &lt;em&gt;safe, sustainable, respected, fair&lt;/em&gt;);&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Inside the Lines&lt;/strong&gt;: il codice di condotta per i dipendenti.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Lo statement FY2025 (sl. 90)&lt;/h4&gt;&lt;p&gt;Il &lt;em&gt;Statement on Modern Slavery and Child Labor&lt;/em&gt; per l&#x27;anno fiscale 2025 è pubblicato per rispettare più leggi: UK Modern Slavery Act, Australian Modern Slavery Act, California Transparency in Supply Chains Act, la legge canadese Fighting Against Forced Labour and Child Labour in Supply Chains Act. Il «lavoro forzato» include schiavitù moderna, lavoro carcerario, servitù per debiti, tratta.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Mostra come gli obblighi di &lt;em&gt;disclosure&lt;/em&gt; nazionali spingano le imprese a rendicontare sulla filiera.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;6 · Manufacturing Map (sl. 91)&lt;/h4&gt;&lt;p&gt;Una mappa pubblica delle fabbriche indipendenti che producono per Nike, con dati sui lavoratori. È &lt;strong&gt;trasparenza sulla filiera&lt;/strong&gt;: permette a ONG, sindacati e giornalisti di verificare.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;7 · Worker Voice (sl. 92)&lt;/h4&gt;&lt;p&gt;Il programma &lt;strong&gt;Engagement and Wellbeing (EWB)&lt;/strong&gt; ha due fasi. Fase 1: i fornitori con un service provider approvato somministrano un questionario &lt;strong&gt;anonimo&lt;/strong&gt; a un campione statisticamente significativo di lavoratori (76 domande, 7 categorie: skill building, communication, health &amp;amp; safety, compensation, social connection, stress, respectful workplace). Fase 2: i fornitori usano i risultati per un &lt;strong&gt;piano d&#x27;azione&lt;/strong&gt; e devono comunicarli ai lavoratori entro 20 giorni. A fine FY25 il 100% dei fornitori strategici aveva partecipato.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;8 · Human Rights and Labor Compliance Standards (sl. 93)&lt;/h4&gt;&lt;p&gt;Nike dichiara di ispirarsi a Dichiarazione universale dei diritti umani, Dichiarazione ILO, &lt;strong&gt;UN Guiding Principles on Business and Human Rights&lt;/strong&gt; e &lt;strong&gt;OECD Guidelines&lt;/strong&gt;, e offre lo &lt;strong&gt;Speak Up Portal&lt;/strong&gt; per segnalazioni riservate, senza ritorsioni. Riconosce che «non c&#x27;è un traguardo finale» nel rispetto dei diritti umani.&lt;/p&gt;&lt;/div&gt;
&lt;nav&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/nav&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Collegamento.&lt;/b&gt; Gli strumenti di Nike corrispondono alle tre strategie di Yawar e Seuring (&lt;a href=&quot;#s-fw&quot;&gt;§4.4&lt;/a&gt;): statement, report e mappa sono &lt;em&gt;communication strategies&lt;/em&gt;; Code of Conduct, Code Leadership Standards e audit sono &lt;em&gt;compliance strategies&lt;/em&gt;; Worker Voice e piani d&#x27;azione con i fornitori sono &lt;em&gt;supplier development&lt;/em&gt;.&lt;/div&gt;

&lt;h3 id=&quot;s-scdef&quot;&gt;&lt;span class=&quot;n&quot;&gt;4.2&lt;/span&gt;Supply chain e supply chain management&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Supply chain · Christopher, 1992&lt;/span&gt;&lt;p&gt;La rete di organizzazioni coinvolte, tramite legami &lt;strong&gt;upstream e downstream&lt;/strong&gt;, nei diversi processi e attività che producono valore sotto forma di prodotti e servizi consegnati al consumatore finale.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Supply chain management · Mentzer et al., 2001&lt;/span&gt;&lt;p&gt;Il coordinamento &lt;strong&gt;sistemico e strategico&lt;/strong&gt; delle funzioni aziendali tradizionali e delle tattiche tra queste funzioni, dentro l&#x27;impresa e tra le imprese della filiera, per migliorare la performance di lungo periodo delle singole imprese e della filiera nel suo insieme.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn&quot; data-toggle=&quot;chainFig&quot; aria-pressed=&quot;false&quot;&gt;Mostra la extended supply chain&lt;/button&gt;&lt;/div&gt;
&lt;figure id=&quot;chainFig&quot;&gt;&lt;svg viewBox=&quot;0 0 800 120&quot; role=&quot;img&quot; aria-label=&quot;Supply chain diretta ed estesa&quot;&gt;

&lt;h3 id=&quot;s-sc2&quot;&gt;&lt;span class=&quot;n&quot;&gt;4.3&lt;/span&gt;I social issues nella supply chain&lt;/h3&gt;
&lt;p&gt;Yawar e Seuring (2017) classificano i temi sociali della filiera. Ogni linguetta riporta la definizione e il caso di cronaca che la slide accosta.&lt;/p&gt;
&lt;div data-tabs&gt;&lt;div role=&quot;tablist&quot; aria-label=&quot;Social issues&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Labour conditions&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Child labour&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Human rights&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Health &amp;amp; safety&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Minority development&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Marginalised inclusion&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Gender&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Le condizioni di lavoro dei dipendenti: &lt;strong&gt;salari bassi, orari prolungati, diritto di formare sindacati, lavoro a contratto e sfruttamento&lt;/strong&gt;.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Caso: Shein ha indagato sulle proprie fabbriche dopo un report sulle condizioni di lavoro, con costi stimati di 15 milioni di dollari (Fortune, 2022).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Lavoro di bambini &lt;strong&gt;sotto i 15 anni&lt;/strong&gt; che impedisce la frequenza scolastica, e lavoro di &lt;strong&gt;under 18&lt;/strong&gt; pericoloso per la salute fisica o mentale.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Caso: Mars, Nestlé e Hershey citate negli USA per lavoro minorile forzato nelle piantagioni di cacao in Costa d&#x27;Avorio (The Guardian, 2021).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Diritti inerenti a tutti gli esseri umani, a prescindere da nazionalità, residenza, sesso, origine nazionale o etnica, colore, religione, lingua o altro status. Al centro c&#x27;è la &lt;strong&gt;parità di diritti senza discriminazione&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Salute fisica e mentale legata a sicurezza e igiene sul lavoro; include le &lt;strong&gt;condizioni pericolose&lt;/strong&gt; che possono avere effetti di lungo periodo.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Caso: Amazon sanzionata dal Department of Labor USA per aver esposto i lavoratori dei magazzini a rischi per la sicurezza (CNBC, 2023).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Lo sviluppo delle popolazioni considerate &lt;strong&gt;minoranze&lt;/strong&gt; per religione, razza o etnia.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;L&#x27;inclusione di gruppi trascurati per disabilità fisica o lasciati ai margini dalla società o dallo Stato; chi vive sotto la soglia di povertà è considerato marginale.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Caso: secondo un esperto ONU, Amazon, DoorDash e Walmart intrappolerebbero i lavoratori in povertà (UN, 2023).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Parità di trattamento di &lt;strong&gt;donne e persone transgender&lt;/strong&gt;, con attenzione ai loro bisogni specifici e pari diritti sul lavoro.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Caso: causa collettiva secondo cui Disney dovrebbe oltre 150 milioni di dollari di salari alle dipendenti per un divario retributivo (The Guardian, 2023).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Gestire i social issues · Yawar e Seuring, 2017 · sl. 100&lt;/span&gt;&lt;p&gt;Comprende le decisioni che &lt;strong&gt;impediscono&lt;/strong&gt; all&#x27;impresa di adottare pratiche non etiche o socialmente inaccettabili. Ma ciò che costituisce un «social issue» &lt;strong&gt;varia tra gli stakeholder&lt;/strong&gt;, cambia nel tempo e dipende dalle condizioni in cui l&#x27;impresa opera.&lt;/p&gt;&lt;/div&gt;
&lt;h4&gt;Perché le imprese agiscono (sl. 101)&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Stakeholder esterni&lt;/span&gt;&lt;p&gt;Media, ONG e società civile hanno messo in luce i comportamenti non etici, spingendo le imprese ad adottare strategie efficaci.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Consumatori&lt;/span&gt;&lt;p&gt;Una cattiva gestione può causare una &lt;em&gt;consumer backlash&lt;/em&gt; (reazione negativa dei consumatori) se le aspettative non sono rispettate.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Rischio&lt;/span&gt;&lt;p&gt;Gestire i temi sociali e ambientali è un modo per &lt;strong&gt;ridurre il rischio&lt;/strong&gt; (Klassen e Vereecke, 2012).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Regolazione&lt;/span&gt;&lt;p&gt;Nuove leggi su salute e sicurezza (e oggi due diligence) spingono a guardare ai temi sociali nella filiera.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Responsible supply chain actions · sl. 102&lt;/span&gt;&lt;p&gt;Azioni avviate da un&#x27;impresa per affrontare temi sociali che vengono poi &lt;strong&gt;accettate, adottate e attuate dagli altri membri della filiera&lt;/strong&gt;. Stakeholder diversi avanzano richieste diverse, e l&#x27;impresa deve decidere per soddisfare le aspettative degli attori della filiera.&lt;/p&gt;&lt;/div&gt;

&lt;h3 id=&quot;s-fw&quot;&gt;&lt;span class=&quot;n&quot;&gt;4.4&lt;/span&gt;Il framework di Yawar e Seuring (2017)&lt;/h3&gt;
