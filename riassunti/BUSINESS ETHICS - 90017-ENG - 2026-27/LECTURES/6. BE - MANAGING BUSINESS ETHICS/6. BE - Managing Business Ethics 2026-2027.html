&lt;section class=&quot;part pA&quot; id=&quot;p1&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Parte I · sl. 2–9&lt;/div&gt;&lt;h2&gt;Responsabilità diffusa e gestione dell&#x27;etica&lt;/h2&gt;&lt;/div&gt;

&lt;h3 id=&quot;s-recap&quot;&gt;&lt;span class=&quot;n&quot;&gt;1.1&lt;/span&gt;Dove siamo nel corso&lt;/h3&gt;
&lt;p&gt;La slide di &lt;em&gt;Recap&lt;/em&gt; (sl. 2) riassume il percorso fatto finora e mostra il passaggio di questa lezione: dalle teorie agli &lt;strong&gt;strumenti&lt;/strong&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 860 120&quot; role=&quot;img&quot; aria-label=&quot;Percorso del corso&quot;&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;5&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;66&quot; rx=&quot;10&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;100&quot; y=&quot;48&quot;&gt;Introduction of&lt;/text&gt;&lt;text x=&quot;100&quot; y=&quot;66&quot;&gt;business ethics&lt;/text&gt;
&lt;rect x=&quot;215&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;66&quot; rx=&quot;10&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;42&quot;&gt;Evaluating: normative&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;60&quot;&gt;ethical theories&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;78&quot; class=&quot;f-mut&quot; font-size=&quot;11&quot;&gt;(perché è giusto?)&lt;/text&gt;
&lt;rect x=&quot;425&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;66&quot; rx=&quot;10&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;525&quot; y=&quot;40&quot;&gt;Framing: stakeholder&lt;/text&gt;&lt;text x=&quot;525&quot; y=&quot;57&quot;&gt;theories, purpose, CSR,&lt;/text&gt;&lt;text x=&quot;525&quot; y=&quot;74&quot;&gt;social connection resp.&lt;/text&gt;
&lt;rect x=&quot;650&quot; y=&quot;12&quot; width=&quot;205&quot; height=&quot;82&quot; rx=&quot;12&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;752&quot; y=&quot;42&quot; class=&quot;hl&quot; font-size=&quot;15&quot;&gt;Managing&lt;/text&gt;&lt;text x=&quot;752&quot; y=&quot;61&quot; class=&quot;hl&quot; font-size=&quot;15&quot;&gt;business ethics&lt;/text&gt;&lt;text x=&quot;752&quot; y=&quot;80&quot; class=&quot;hl&quot; font-size=&quot;12&quot;&gt;tools &amp;amp; techniques&lt;/text&gt;
&lt;/g&gt;
&lt;g class=&quot;s-mut&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M195 53h20M405 53h20M625 53h25&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Le tre tappe precedenti (sl. 2) e la lezione di oggi. I titoli delle altre lezioni vengono da questa slide: gli altri file della cartella &lt;code&gt;corso/&lt;/code&gt; non erano consultabili in questa sessione, quindi i collegamenti alle altre lezioni si basano solo su quanto riportato nel Recap.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;In pratica: le teorie etiche dicono &lt;em&gt;cosa&lt;/em&gt; è giusto, la stakeholder theory e la CSR (&lt;span class=&quot;gloss&quot;&gt;Corporate Social Responsibility, responsabilità sociale d&#x27;impresa&lt;/span&gt;) dicono &lt;em&gt;verso chi&lt;/em&gt; l&#x27;impresa è responsabile. Ora la domanda è: &lt;strong&gt;come si organizza un&#x27;impresa per comportarsi eticamente in modo sistematico e dimostrabile?&lt;/strong&gt;&lt;/p&gt;

&lt;h3 id=&quot;s-diff&quot;&gt;&lt;span class=&quot;n&quot;&gt;1.2&lt;/span&gt;Diffusion of responsibility&lt;/h3&gt;
&lt;p&gt;La &lt;span class=&quot;term&quot;&gt;diffusion of responsibility&lt;/span&gt; (diffusione della responsabilità) indica che la responsabilità di un&#x27;impresa non si ferma ai cancelli della fabbrica: si estende &lt;strong&gt;a monte&lt;/strong&gt; verso i fornitori, &lt;strong&gt;a valle&lt;/strong&gt; verso l&#x27;uso dei prodotti, &lt;strong&gt;indietro nel tempo&lt;/strong&gt; verso fatti passati e &lt;strong&gt;in avanti&lt;/strong&gt; verso il cambiamento del sistema (sl. 3).&lt;/p&gt;
&lt;div data-hot=&quot;up&quot; class=&quot;grid2&quot; style=&quot;align-items:start&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 360&quot; role=&quot;img&quot; aria-label=&quot;Quattro direzioni della responsabilità&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;f-c&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;

&lt;g data-k=&quot;soc&quot;&gt;&lt;rect class=&quot;hit f-cbg s-c&quot; x=&quot;450&quot; y=&quot;155&quot; width=&quot;184&quot; height=&quot;50&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;542&quot; y=&quot;177&quot;&gt;Social connection&lt;/text&gt;&lt;text x=&quot;542&quot; y=&quot;195&quot; font-size=&quot;12&quot;&gt;cambiare il sistema&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;p class=&quot;hint&quot;&gt;Tocca le quattro direzioni.&lt;/p&gt;
&lt;/figure&gt;
&lt;div class=&quot;hbox&quot;&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;up&quot;&gt;&lt;h4&gt;Upstream responsibility&lt;/h4&gt;&lt;p&gt;Responsabilità per ciò che accade &lt;strong&gt;a monte&lt;/strong&gt;, presso fornitori e subfornitori. Il caso tipico sono le &lt;span class=&quot;term&quot;&gt;sweatshops&lt;/span&gt;: fabbriche con salari bassissimi, orari eccessivi e condizioni insicure.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Esempi dalle slide:&lt;/strong&gt; Starbucks e il caffè Fair trade; Nike e i lavoratori dei subfornitori; l&#x27;industria dell&#x27;abbigliamento.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Ripreso nella Parte IV (caso Nike, Yawar &amp;amp; Seuring).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;down&quot;&gt;&lt;h4&gt;Downstream responsibility&lt;/h4&gt;&lt;p&gt;Responsabilità per ciò che accade &lt;strong&gt;a valle&lt;/strong&gt;, cioè per come i prodotti vengono usati da clienti e consumatori: sicurezza del prodotto, armi, gaming.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Esempi dalle slide:&lt;/strong&gt; IBM e il regime nazista; Ford e Iveco e le esecuzioni in Cina. In entrambi i casi la domanda è fin dove arriva la responsabilità di chi &lt;em&gt;vende&lt;/em&gt; una tecnologia per l&#x27;uso che altri ne fanno.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;hist&quot;&gt;&lt;h4&gt;Historical responsibility&lt;/h4&gt;&lt;p&gt;Responsabilità per &lt;strong&gt;eventi passati&lt;/strong&gt;, anche lontani, che l&#x27;impresa (o i suoi predecessori) ha causato o da cui ha tratto beneficio.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Esempio dalle slide:&lt;/strong&gt; Ikea e la Germania Est (DDR). &lt;span class=&quot;gloss&quot;&gt;Contesto non presente nelle slide: il caso riguarda l&#x27;uso, negli anni &#x27;70-&#x27;80, di lavoro di detenuti nella produzione di mobili per Ikea, ammesso dall&#x27;azienda nel 2012.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;soc&quot;&gt;&lt;h4&gt;Social connection responsibility&lt;/h4&gt;&lt;p&gt;Prospettiva &lt;strong&gt;forward-looking&lt;/strong&gt; (rivolta al futuro): non si tratta di trovare il colpevole di un danno, ma di contribuire a &lt;strong&gt;cambiare il sistema&lt;/strong&gt; che produce ingiustizie strutturali, perché si è collegati a esso.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Esempi dalle slide:&lt;/strong&gt; fair trade, slow food.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Concetto introdotto nella lezione precedente su CSR e social connection responsibility (sl. 2).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;figcaption&gt;Più ci si allontana dall&#x27;impresa (Tier 2, Tier 3: i fornitori dei fornitori), più la visibilità diminuisce e più è difficile controllare. Il «tier» (livello) indica la distanza dal compratore finale.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h4&gt;Attività in aula: come rispondono le aziende di fast fashion alle critiche? (sl. 5-6)&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Consegna&lt;/span&gt;&lt;ol class=&quot;tight&quot;&gt;&lt;li&gt;In piccoli gruppi scegliete un&#x27;azienda di fast fashion.&lt;/li&gt;&lt;li&gt;Cercate sul sito aziendale e in fonti online affidabili.&lt;/li&gt;&lt;li&gt;Trovate documenti o dichiarazioni sui temi sollevati dal documentario &lt;em&gt;The True Cost&lt;/em&gt;: sfruttamento, salari bassi, condizioni di lavoro insicure, inquinamento.&lt;/li&gt;&lt;li&gt;Presentate i documenti: &lt;em&gt;che tipo di documento è? chi l&#x27;ha prodotto? a che scopo? che informazioni dà?&lt;/em&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Discussione&lt;/span&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Avete trovato tutte le informazioni cercate?&lt;/li&gt;&lt;li&gt;Gli argomenti dell&#x27;azienda vi hanno convinto?&lt;/li&gt;&lt;li&gt;Quali informazioni o prove mancavano?&lt;/li&gt;&lt;li&gt;Cosa potrebbe fare l&#x27;azienda per migliorare risposta e pratiche?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Suggerimento: che documenti potreste trovare (e dove sono spiegati in questa pagina)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Questa traccia non è nelle slide: collega l&#x27;attività agli strumenti della lezione.&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;&lt;strong&gt;Code of conduct&lt;/strong&gt; per dipendenti e &lt;strong&gt;supplier code of conduct&lt;/strong&gt; → &lt;a href=&quot;#s-codes&quot;&gt;§2.2&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Certificazioni&lt;/strong&gt; di processo o prodotto → &lt;a href=&quot;#s-cert&quot;&gt;§3.2&lt;/a&gt;&lt;/li&gt;&lt;li&gt;Risultati di &lt;strong&gt;audit&lt;/strong&gt; sui fornitori, % di fornitori controllati → &lt;a href=&quot;#s-audit&quot;&gt;§3.6&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Sustainability report&lt;/strong&gt; o dichiarazione di sostenibilità → &lt;a href=&quot;#s-acc&quot;&gt;§3.7&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Modern slavery statement&lt;/strong&gt;, elenco delle fabbriche (es. una manufacturing map) → &lt;a href=&quot;#s-sc&quot;&gt;§4.1&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3 id=&quot;s-gov&quot;&gt;&lt;span class=&quot;n&quot;&gt;1.3&lt;/span&gt;Che cos&#x27;è il business ethics management&lt;/h3&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Definizione · sl. 7&lt;/span&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Business ethics management&lt;/span&gt; è il tentativo diretto di gestire, in modo formale o informale, questioni o problemi etici attraverso &lt;strong&gt;policy, pratiche e programmi specifici&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;Non basta avere buone intenzioni: servono strumenti concreti, e servono in ciclo continuo. Le slide accostano la definizione al ciclo &lt;span class=&quot;term&quot;&gt;PDCA&lt;/span&gt; (Plan–Do–Check–Act): pianificare, attuare, verificare, correggere, e ricominciare. Lo ritroverai nei sistemi di gestione ambientale (&lt;a href=&quot;#s-ems&quot;&gt;§3.1&lt;/a&gt;).&lt;/p&gt;
&lt;div data-hot=&quot;m&quot; class=&quot;grid2&quot; style=&quot;align-items:start&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;

&lt;p class=&quot;hint&quot;&gt;Componenti tipici (sl. 7): tocca un elemento.&lt;/p&gt;
&lt;/figure&gt;
&lt;div class=&quot;hbox&quot;&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;m&quot;&gt;&lt;h4&gt;Mission or values statements&lt;/h4&gt;&lt;p&gt;Dichiarazioni sintetiche di cosa l&#x27;impresa è e in cosa crede. Fissano la direzione per tutti gli altri strumenti. → &lt;a href=&quot;#s-pmv&quot;&gt;§2.1&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;c&quot;&gt;&lt;h4&gt;Codes of ethics&lt;/h4&gt;&lt;p&gt;Dichiarazioni volontarie che impegnano l&#x27;organizzazione su valori e comportamenti. Lo strumento più diffuso. → &lt;a href=&quot;#s-codes&quot;&gt;§2.2&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;r&quot;&gt;&lt;h4&gt;Risk analysis and management&lt;/h4&gt;&lt;p&gt;Individuare dove l&#x27;impresa rischia di causare danni (o di subirli) per ragioni etiche, sociali, ambientali, e decidere come ridurre quei rischi. Gestire bene i temi sociali riduce il rischio (Klassen e Vereecke, 2012, &lt;a href=&quot;#s-sc2&quot;&gt;§4.3&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;dd&quot;&gt;&lt;h4&gt;Due diligence&lt;/h4&gt;&lt;p&gt;Processo continuo con cui l&#x27;impresa &lt;strong&gt;identifica, previene, mitiga e rimedia&lt;/strong&gt; gli impatti negativi su diritti umani e ambiente, anche nella catena di fornitura. Oggi è anche un obbligo di legge UE (CSDDD). → &lt;a href=&quot;#s-csddd&quot;&gt;§3.8&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;o&quot;&gt;&lt;h4&gt;Ethics managers, officers and committees&lt;/h4&gt;&lt;p&gt;Persone e organi con il compito esplicito di presidiare l&#x27;etica: un &lt;em&gt;ethics officer&lt;/em&gt;, un comitato etico del board. Danno al programma qualcuno che ne risponde.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;ce&quot;&gt;&lt;h4&gt;Certifications&lt;/h4&gt;&lt;p&gt;Attestazioni formali, rilasciate da un ente terzo, di conformità a uno standard (ISO 14001, SA8000, Fairtrade…). → &lt;a href=&quot;#s-cert&quot;&gt;§3.2&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;ea&quot;&gt;&lt;h4&gt;External audit&lt;/h4&gt;&lt;p&gt;Verifica indipendente da parte di soggetti esterni: bilancio, informazioni di sostenibilità, fornitori. → &lt;a href=&quot;#s-audit&quot;&gt;§3.6&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;tr&quot;&gt;&lt;h4&gt;Ethics education and training&lt;/h4&gt;&lt;p&gt;Formazione perché le persone conoscano il codice e sappiano riconoscere un dilemma etico. Secondo Schwartz (2004) è uno dei pilastri dell&#x27;efficacia dei codici. → &lt;a href=&quot;#s-eff&quot;&gt;§2.3&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;st&quot;&gt;&lt;h4&gt;Stakeholder consultation, dialogue and partnership programs&lt;/h4&gt;&lt;p&gt;Ascoltare e coinvolgere chi è toccato dalle decisioni dell&#x27;impresa. Al centro del processo di sustainability accounting. → &lt;a href=&quot;#s-acc&quot;&gt;§3.7&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;ar&quot;&gt;&lt;h4&gt;Accounting and reporting&lt;/h4&gt;&lt;p&gt;Misurare e comunicare gli impatti sociali e ambientali: è lo strumento dell&#x27;&lt;em&gt;accountability&lt;/em&gt; (rendere conto). → &lt;a href=&quot;#s-acc&quot;&gt;§3.7&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Una governance per l&#x27;impegno etico (sl. 8-9)&lt;/h4&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Definizione · sl. 8&lt;/span&gt;&lt;p&gt;Una buona &lt;span class=&quot;term&quot;&gt;corporate governance&lt;/span&gt; (il sistema con cui l&#x27;impresa è diretta e controllata) significa che i processi di &lt;strong&gt;disclosure&lt;/strong&gt; (comunicazione delle informazioni) e &lt;strong&gt;transparency&lt;/strong&gt; sono seguiti in modo da fornire a tutti gli stakeholder informazioni precise e accurate sull&#x27;impresa.&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;Nella ruota della corporate governance (sl. 8) attorno al centro stanno: board of directors e comitati; quadro legale e regolamentare; gerarchia organizzativa; monitoring e controllo interno; transparency e accountability; policies e procedures. All&#x27;interno gira il ciclo &lt;em&gt;vision → mission → strategy → objectives → SMART goals&lt;/em&gt; (obiettivi specifici, misurabili, raggiungibili, rilevanti, con scadenza).&lt;/p&gt;
&lt;p&gt;La sl. 9 è la &lt;strong&gt;chiave di lettura dell&#x27;intera lezione&lt;/strong&gt;: raggruppa gli strumenti in due obiettivi, che insieme servono a gestire le relazioni con gli stakeholder.&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 820 260&quot; role=&quot;img&quot; aria-label=&quot;Strumenti raggruppati per obiettivo&quot;&gt;
&lt;g font-size=&quot;14&quot;&gt;

&lt;/g&gt;

&lt;rect x=&quot;636&quot; y=&quot;88&quot; width=&quot;178&quot; height=&quot;64&quot; rx=&quot;12&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;725&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; class=&quot;hl&quot; font-size=&quot;15&quot;&gt;Managing&lt;/text&gt;&lt;text x=&quot;725&quot; y=&quot;135&quot; text-anchor=&quot;middle&quot; class=&quot;hl&quot; font-size=&quot;15&quot;&gt;stakeholder relations&lt;/text&gt;
&lt;text x=&quot;5&quot; y=&quot;248&quot; font-size=&quot;12&quot; class=&quot;f-mut&quot;&gt;EMS/SMS = environmental / social management system. Parte II = verde salvia, Parte III = ocra.&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;

&lt;div class=&quot;quiz pA&quot;&gt;&lt;h3&gt;Autoverifica · Parte I&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;Il caso è a valle: riguarda l&#x27;uso del prodotto venduto, non la sua produzione.&quot;&gt;&lt;p&gt;Un produttore di veicoli scopre che i suoi furgoni sono usati da un governo per eseguire condanne a morte. Che tipo di responsabilità è in gioco?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Upstream responsibility&lt;/button&gt;&lt;button data-ok&gt;Downstream responsibility&lt;/button&gt;&lt;button&gt;Historical responsibility&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;La social connection responsibility guarda avanti e mira a cambiare le strutture, non a trovare colpevoli.&quot;&gt;&lt;p&gt;Quale prospettiva è «forward-looking»?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Historical responsibility&lt;/button&gt;&lt;button&gt;Downstream responsibility&lt;/button&gt;&lt;button data-ok&gt;Social connection responsibility&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Dai la definizione di business ethics management.&lt;/summary&gt;&lt;div&gt;Il tentativo diretto di gestire, formalmente o informalmente, questioni o problemi etici tramite policy, pratiche e programmi specifici (sl. 7).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quali sono i due obiettivi in cui la sl. 9 raggruppa gli strumenti, e a cosa servono insieme?&lt;/summary&gt;&lt;div&gt;&lt;em&gt;Setting values and standards of ethical behaviour&lt;/em&gt; (mission/values statements, codes of ethics) e &lt;em&gt;Assessing ethical performance&lt;/em&gt; (policies e procedure / EMS, certificazioni e audit, transparency e accountability). Insieme servono a &lt;em&gt;managing stakeholder relations&lt;/em&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché i fornitori Tier 2 e Tier 3 sono un problema per la gestione etica?&lt;/summary&gt;&lt;div&gt;Sono lontani dall&#x27;impresa: non hanno un contratto diretto con lei, sono meno visibili e meno controllabili, ma i loro abusi (es. lavoro forzato nella filatura del cotone) ricadono comunque sull&#x27;impresa come upstream responsibility.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part pS&quot; id=&quot;p2&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Parte II · sl. 10–31&lt;/div&gt;&lt;h2&gt;Setting values and standards of ethical behaviour&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Prima di misurare qualcosa bisogna dire &lt;em&gt;che cosa&lt;/em&gt; si vuole essere e &lt;em&gt;come&lt;/em&gt; ci si vuole comportare. Gli strumenti di questa parte sono le dichiarazioni di purpose, mission e vision e i codici etici, fino ai codici globali per le multinazionali.&lt;/p&gt;

&lt;h3 id=&quot;s-pmv&quot;&gt;&lt;span class=&quot;n&quot;&gt;2.1&lt;/span&gt;Purpose, mission e vision&lt;/h3&gt;
&lt;div data-hot=&quot;pu&quot; class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 360 360&quot; role=&quot;img&quot; aria-label=&quot;Cerchi concentrici: purpose, vision, mission, goals, activities&quot;&gt;
&lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
&lt;g data-k=&quot;ac&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;180&quot; cy=&quot;180&quot; r=&quot;172&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;32&quot;&gt;Activities / Projects&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;go&quot;&gt;&lt;circle class=&quot;hit f-card s-c&quot; cx=&quot;180&quot; cy=&quot;215&quot; r=&quot;136&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;104&quot;&gt;Goals&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;mi&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;180&quot; cy=&quot;250&quot; r=&quot;101&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;174&quot;&gt;Mission&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;vi&quot;&gt;&lt;circle class=&quot;hit f-card s-c&quot; cx=&quot;180&quot; cy=&quot;282&quot; r=&quot;69&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;240&quot;&gt;Vision&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;pu&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;180&quot; cy=&quot;312&quot; r=&quot;40&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;317&quot; font-weight=&quot;600&quot;&gt;Purpose&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;&lt;/svg&gt;
&lt;p class=&quot;hint&quot;&gt;Dal nucleo (purpose) al comportamento quotidiano (activities). Tocca un cerchio.&lt;/p&gt;
&lt;/figure&gt;
&lt;div class=&quot;hbox&quot;&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;pu&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Purpose&lt;/span&gt;&lt;p&gt;La &lt;strong&gt;convinzione di fondo sul ruolo dell&#x27;impresa nella società&lt;/strong&gt; (sl. 11). È il nucleo: perché esistiamo &lt;em&gt;per la società&lt;/em&gt;, oltre il profitto. Si collega al dibattito sul &lt;em&gt;purpose of corporations&lt;/em&gt; della lezione precedente.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;vi&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Vision&lt;/span&gt;&lt;p&gt;Un&#x27;&lt;strong&gt;immagine condivisa di un futuro desiderato&lt;/strong&gt;. Domanda guida: &lt;em&gt;what is our picture of the future?&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;mi&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Mission&lt;/span&gt;&lt;p&gt;La &lt;strong&gt;ragione per cui l&#x27;impresa esiste&lt;/strong&gt;: cosa fa, per chi. Domanda guida: &lt;em&gt;what do we exist to do?&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;go&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Goals&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Obiettivi che sostengono mission e vision&lt;/strong&gt; (i risultati desiderati). Nella piramide: strategic goals, objectives, performance measures e targets.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;ac&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Activities / Projects&lt;/span&gt;&lt;p&gt;Il &lt;strong&gt;comportamento&lt;/strong&gt; concreto. È qui che si vede se i valori dichiarati sono reali: un purpose senza attività coerenti è solo comunicazione.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;La piramide strategica: una domanda per ogni livello (sl. 11)&lt;/summary&gt;&lt;div&gt;
&lt;ol class=&quot;tight&quot;&gt;&lt;li&gt;&lt;strong&gt;Mission&lt;/strong&gt;: what do we exist to do?&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Vision&lt;/strong&gt;: what is our picture of the future?&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Strategic goals &amp;amp; results&lt;/strong&gt;: quali sono le aree di focus? quali risultati servono per soddisfare gli stakeholder?&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Strategic objectives &amp;amp; desired outcomes&lt;/strong&gt;: quali miglioramenti continui servono per ottenere i risultati?&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Performance measures &amp;amp; targets&lt;/strong&gt;: come sapremo se stiamo raggiungendo i risultati?&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Strategic initiatives&lt;/strong&gt;: quali azioni possono contribuire?&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Projects&lt;/strong&gt;: quali attività, a breve e lungo termine, sostengono le iniziative?&lt;/li&gt;&lt;/ol&gt;
&lt;p&gt;Si scende dal «perché» al «come»: ogni livello deve poter essere ricondotto a quello sopra.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;h4&gt;Esempi di statements (sl. 12)&lt;/h4&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Ben &amp;amp; Jerry&#x27;s&lt;/span&gt;&lt;p&gt;&lt;em&gt;«We believe that ice cream can change the world. We have a progressive, nonpartisan social mission that seeks to meet human needs and eliminate injustices…»&lt;/em&gt;&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Mission sociale esplicita, integrata nelle attività quotidiane, con un registro da attivismo.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Southwest Airlines&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Purpose:&lt;/strong&gt; &lt;em&gt;«To connect People to what&#x27;s important in their lives through friendly, reliable, and low-cost air travel.»&lt;/em&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Vision:&lt;/strong&gt; &lt;em&gt;«To be the world&#x27;s most loved, most efficient, and most profitable airline.»&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Gewiss&lt;/span&gt;&lt;p&gt;&lt;em&gt;«In every home, facility, city, we put intelligent connections at the service of people. We do it with passion, with method, with responsibility. Our every action looks further: towards a safer, more efficient and sustainable future.»&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;s-codes&quot;&gt;&lt;span class=&quot;n&quot;&gt;2.2&lt;/span&gt;Codes of ethics&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Definizione · Crane et al., 2019 · sl. 13&lt;/span&gt;&lt;p&gt;I &lt;span class=&quot;term&quot;&gt;codes of ethics&lt;/span&gt; sono &lt;strong&gt;dichiarazioni volontarie&lt;/strong&gt; che impegnano organizzazioni, settori o professioni su specifiche convinzioni, valori e azioni e/o stabiliscono il comportamento etico appropriato per i dipendenti.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot; style=&quot;display:flex;gap:16px;align-items:center&quot;&gt;&lt;div class=&quot;num&quot;&gt;93%&lt;/div&gt;&lt;div&gt;delle società del &lt;strong&gt;FTSE 350&lt;/strong&gt; (le 350 maggiori quotate a Londra) ha un programma etico dichiarato, di cui il codice è l&#x27;elemento più visibile; anche la grande maggioranza delle grandi imprese USA ha un codice (Institute of Business Ethics, 2016, sl. 13).&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;I termini &lt;em&gt;code of ethics&lt;/em&gt; e &lt;em&gt;code of conduct&lt;/em&gt; nelle slide sono usati quasi come sinonimi (GE e Nvidia parlano di «Code of Conduct», Eni di «Code of Ethics»). In generale il codice etico tende a essere più centrato sui valori, quello di condotta su regole specifiche: è la distinzione aspirational / rules-based di &lt;a href=&quot;#s-eff&quot;&gt;§2.3&lt;/a&gt;.&lt;/p&gt;
&lt;h4&gt;Le critiche ai codici (sl. 14)&lt;/h4&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Rigidità&lt;/h4&gt;&lt;p&gt;Prescrizioni chiare per i dipendenti significano &lt;strong&gt;poca flessibilità&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Situazioni nuove&lt;/h4&gt;&lt;p&gt;Difficoltà con situazioni molteplici o inedite, soprattutto &lt;strong&gt;cross-cultural&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Vaghezza&lt;/h4&gt;&lt;p&gt;Affermazioni generiche di obbligo, che non aiutano a decidere.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;PR device&lt;/h4&gt;&lt;p&gt;Strumento di &lt;strong&gt;pubbliche relazioni&lt;/strong&gt;: utile all&#x27;immagine più che al comportamento.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Controllo&lt;/h4&gt;&lt;p&gt;Meccanismi di controllo discutibili, che cercano di influenzare convinzioni, valori e comportamenti dei dipendenti.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Conformismo&lt;/h4&gt;&lt;p&gt;«Sopprimono» istinti morali ed emozioni individuali per garantire conformità e coerenza burocratica.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Tre codici reali&lt;/h4&gt;
&lt;div data-tabs&gt;&lt;div role=&quot;tablist&quot; aria-label=&quot;Codici aziendali&quot;&gt;&lt;button role=&quot;tab&quot;&gt;GE · The Spirit &amp;amp; The Letter&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Eni&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p&gt;Il manuale di compliance di GE si chiama &lt;strong&gt;&lt;em&gt;The Spirit &amp;amp; The Letter&lt;/em&gt;&lt;/strong&gt; (sl. 15-17): i dipendenti devono rispettare non solo la &lt;em&gt;lettera&lt;/em&gt; delle policy (la regola scritta) ma anche il loro &lt;em&gt;spirito&lt;/em&gt; (lo scopo). Il codice vale &lt;em&gt;everywhere, every day, for everyone&lt;/em&gt;.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;&lt;span class=&quot;lab&quot;&gt;Impegni del GE Code of Conduct&lt;/span&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;rispettare le leggi ovunque si opera;&lt;/li&gt;&lt;li&gt;essere onesti, corretti e affidabili;&lt;/li&gt;&lt;li&gt;evitare conflitti di interesse tra lavoro e affari personali;&lt;/li&gt;&lt;li&gt;pratiche di lavoro eque e inclusione;&lt;/li&gt;&lt;li&gt;luogo di lavoro sicuro, tutela dell&#x27;ambiente;&lt;/li&gt;&lt;li&gt;leadership che sostiene una cultura etica.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div&gt;&lt;span class=&quot;lab&quot;&gt;Key questions per le zone grigie&lt;/span&gt;&lt;p&gt;Il codice «non sostituisce il buon giudizio» e non copre ogni situazione. Se hai dubbi, chiediti:&lt;/p&gt;&lt;ol class=&quot;tight&quot;&gt;&lt;li&gt;Come apparirebbe questa decisione a chi è dentro e fuori GE?&lt;/li&gt;&lt;li&gt;Sono disposto a risponderne personalmente?&lt;/li&gt;&lt;li&gt;È coerente con il Code of Conduct?&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;&lt;strong&gt;Act if you see an issue. Ask if you are unsure.&lt;/strong&gt; Uno dei principi è essere la &lt;em&gt;Voice of Integrity&lt;/em&gt;: segnalare subito i dubbi di compliance.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Eni pubblica un &lt;strong&gt;Code of Ethics&lt;/strong&gt; e un &lt;strong&gt;Supplier Code of Conduct&lt;/strong&gt; («Creating sustainable value together», sl. 18). Il secondo estende le aspettative etiche ai &lt;strong&gt;fornitori&lt;/strong&gt;: è il ponte tra il codice interno e la gestione della supply chain, dove i codici diventano una &lt;em&gt;compliance strategy&lt;/em&gt; (&lt;a href=&quot;#s-fw&quot;&gt;§4.4&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Caso: Nvidia. Relazione privata o questione pubblica? (sl. 19-24)&lt;/h4&gt;
&lt;p&gt;Il caso, presentato nelle slide su fonti di novembre 2026, serve a discutere &lt;strong&gt;quando la condotta privata di un CEO diventa un tema di business ethics&lt;/strong&gt;. Qui si riporta solo quanto è nelle slide.&lt;/p&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · I fatti riportati&lt;/h4&gt;&lt;p&gt;All&#x27;inizio di novembre 2026 il CEO di Nvidia, Jensen Huang, ha ammesso di essere stato infedele alla moglie e si è scusato con famiglia e colleghi. Le notizie collegavano la relazione a una dirigente di un cliente di Nvidia che l&#x27;intelligence USA avrebbe sospettato di raccogliere informazioni per la Cina (sl. 20).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Le scuse ai dipendenti&lt;/h4&gt;&lt;p&gt;Nel messaggio ai dipendenti («A Message to Our Company», 8 novembre 2026) Huang dice di non essere stato all&#x27;altezza della responsabilità di meritare la fiducia dei colleghi. Le slide osservano: dal punto di vista etico la condotta personale di un CEO può sollevare questioni di &lt;em&gt;leadership, judgement and trust&lt;/em&gt;, soprattutto se coinvolge un partner commerciale e possibili rischi di sicurezza. Le scuse riconoscono l&#x27;impatto sull&#x27;organizzazione, ma &lt;strong&gt;non stabiliscono&lt;/strong&gt; che siano state violate regole aziendali (sl. 21).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · La reazione del board&lt;/h4&gt;&lt;p&gt;Il board ha avviato un&#x27;&lt;strong&gt;indagine indipendente&lt;/strong&gt;, guidata da un comitato di amministratori indipendenti con consulenti legali esterni. Ha dichiarato di non avere motivo di ritenere compromessi la sicurezza nazionale o i segreti aziendali, e ha confermato fiducia nel CEO (sl. 22). È la governance in azione: un organo indipendente verifica, invece del diretto interessato.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Cosa dice il Code of Conduct&lt;/h4&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Esisteva un codice pubblico prima dei fatti; vale per dipendenti e &lt;strong&gt;membri del board&lt;/strong&gt; e descrive i manager come &lt;em&gt;role models&lt;/em&gt;.&lt;/li&gt;&lt;li&gt;La versione 2023 indica le &lt;strong&gt;relazioni personali&lt;/strong&gt; come possibile fonte di &lt;span class=&quot;term&quot;&gt;conflict of interest&lt;/span&gt; (conflitto di interessi): chi ha un conflitto reale o percepito deve chiedere indicazioni e astenersi dalle decisioni rilevanti.&lt;/li&gt;&lt;li&gt;Tratta la protezione delle informazioni non pubbliche e il rispetto delle regole sul commercio internazionale.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Non vieta&lt;/strong&gt; le relazioni sentimentali in generale: se ci sia stato un conflitto o una violazione è materia dell&#x27;indagine (sl. 24).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Domanda per la discussione&lt;/h4&gt;&lt;blockquote&gt;When does a CEO&#x27;s private relationship become a legitimate concern for the company and its stakeholders?&lt;/blockquote&gt;&lt;p class=&quot;gloss&quot;&gt;Una traccia per ragionare (non nelle slide): la sfera privata diventa rilevante quando tocca &lt;em&gt;(a)&lt;/em&gt; un conflitto di interessi con un partner d&#x27;affari, &lt;em&gt;(b)&lt;/em&gt; la sicurezza di informazioni aziendali, &lt;em&gt;(c)&lt;/em&gt; la credibilità del leader come role model e la fiducia degli stakeholder. Distinguere sempre tra ciò che è eticamente discutibile e ciò che viola una regola accertata.&lt;/p&gt;&lt;/div&gt;
&lt;nav&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/nav&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;s-eff&quot;&gt;&lt;span class=&quot;n&quot;&gt;2.3&lt;/span&gt;Far funzionare un codice&lt;/h3&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Ethical dilemma 5 · Getting explicit about the code of conduct · sl. 25&lt;/span&gt;&lt;p&gt;Sei il responsabile IT di una piccola società di servizi finanziari. Faye, responsabile hardware, ti dice che nel portatile «di pool» usato nel weekend da Paul, il principale analista che ha lavorato da casa per preparare le previsioni, la cronologia mostra accessi a siti pornografici negli ultimi due giorni. Che cosa fai? Il codice di condotta dice qualcosa? E se lo dice, lo applichi?&lt;/p&gt;&lt;/div&gt;
&lt;blockquote&gt;«… in order for codes to have credibility, companies must be willing to discipline employees found in breach of them. Similarly, Treviño et al.&#x27;s (1999) survey revealed that follow-through (such as detection of violations, follow-up on notification of violations, and consistency between the policy and action) tended to be much more influential on employee behaviour than the mere presence of a code.»&lt;cite&gt;Citazione nella sl. 25&lt;/cite&gt;&lt;/blockquote&gt;
&lt;p&gt;Il messaggio: &lt;strong&gt;un codice conta per come viene applicato, non perché esiste&lt;/strong&gt;. Schwartz (2004) lo traduce in tre condizioni (sl. 26).&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 760 210&quot; role=&quot;img&quot; aria-label=&quot;Tre pilastri dell&#x27;efficacia di un codice&quot;&gt;
&lt;rect x=&quot;30&quot; y=&quot;10&quot; width=&quot;700&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; class=&quot;hl&quot; font-size=&quot;16&quot;&gt;Effective code = implementation + administration&lt;/text&gt;
&lt;g font-size=&quot;13.5&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;50&quot; y=&quot;62&quot; width=&quot;200&quot; height=&quot;110&quot; rx=&quot;8&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;88&quot; font-weight=&quot;600&quot;&gt;How codes are&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;106&quot; font-weight=&quot;600&quot;&gt;written &amp;amp; accessible&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;132&quot; font-size=&quot;12&quot;&gt;su misura per&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;148&quot; font-size=&quot;12&quot;&gt;l&#x27;organizzazione, tono adatto&lt;/text&gt;
&lt;rect x=&quot;280&quot; y=&quot;62&quot; width=&quot;200&quot; height=&quot;110&quot; rx=&quot;8&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;88&quot; font-weight=&quot;600&quot;&gt;How codes are&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;106&quot; font-weight=&quot;600&quot;&gt;supported&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;132&quot; font-size=&quot;12&quot;&gt;dal management,&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;148&quot; font-size=&quot;12&quot;&gt;con formazione&lt;/text&gt;
&lt;rect x=&quot;510&quot; y=&quot;62&quot; width=&quot;200&quot; height=&quot;110&quot; rx=&quot;8&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;610&quot; y=&quot;88&quot; font-weight=&quot;600&quot;&gt;How codes are&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;106&quot; font-weight=&quot;600&quot;&gt;enforced&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;132&quot; font-size=&quot;12&quot;&gt;canali di segnalazione, violazioni&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;148&quot; font-size=&quot;12&quot;&gt;comunicate, incentivi ±&lt;/text&gt;
&lt;/g&gt;
&lt;rect x=&quot;30&quot; y=&quot;180&quot; width=&quot;700&quot; height=&quot;10&quot; rx=&quot;3&quot; class=&quot;f-c&quot;/&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Schwartz (2004), sl. 26. Gli incentivi sono sia positivi (premi) sia negativi (sanzioni).&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;h4&gt;Aspirational e rules-based&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Aspirational (generale)&lt;/span&gt;&lt;p&gt;Valori e ideali: il &lt;em&gt;credo&lt;/em&gt;. Dà senso e scopo. Da solo è troppo vago.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Rules-based (specifico)&lt;/span&gt;&lt;p&gt;Regole di condotta precise. Dicono cosa fare. Da sole non spiegano perché.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;blockquote&gt;«rules of conduct without a general values statement lack a framework of meaning and purpose; credos without rules of conduct lack specific content»&lt;cite&gt;Hoffman, Driscoll e Painter-Morland (2001), sl. 27&lt;/cite&gt;&lt;/blockquote&gt;

&lt;h3 id=&quot;s-global&quot;&gt;&lt;span class=&quot;n&quot;&gt;2.4&lt;/span&gt;Global codes of ethics&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;Può una multinazionale avere un unico insieme di principi in tutti i paesi in cui opera?&lt;/strong&gt; (sl. 28). Esempi: lo scambio di regali in Giappone rispetto al Regno Unito; gli impegni di pari opportunità in India e Arabia Saudita rispetto al Regno Unito.&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;label for=&quot;rel&quot;&gt;&lt;strong&gt;Sposta il cursore tra i due estremi&lt;/strong&gt; e osserva come cambia una policy sui regali d&#x27;affari.&lt;/label&gt;
&lt;div style=&quot;display:flex;justify-content:space-between;font-size:.85rem;margin-top:8px&quot;&gt;&lt;span&gt;&lt;strong&gt;Relativism&lt;/strong&gt;: ≠ codes for ≠ contexts&lt;/span&gt;&lt;span&gt;&lt;strong&gt;Absolutism&lt;/strong&gt;: 1 code fits all&lt;/span&gt;&lt;/div&gt;
&lt;input type=&quot;range&quot; id=&quot;rel&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;50&quot; aria-describedby=&quot;relout&quot;&gt;
&lt;div class=&quot;out&quot; id=&quot;relout&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;La soluzione proposta da &lt;strong&gt;Donaldson (1996)&lt;/strong&gt; sta nel mezzo (sl. 29). Le multinazionali (&lt;span class=&quot;term&quot;&gt;MNEs&lt;/span&gt;, multinational enterprises) dovrebbero seguire tre principi:&lt;/p&gt;
&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;&lt;p&gt;Rispetto per i &lt;strong&gt;core human values&lt;/strong&gt;, valori umani fondamentali e non negoziabili.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;num&quot;&gt;2&lt;/div&gt;&lt;p&gt;Rispetto per le &lt;strong&gt;tradizioni locali&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;&lt;p&gt;Convinzione che il &lt;strong&gt;contesto conta&lt;/strong&gt; nel decidere cosa è giusto e sbagliato.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Per questo i codici globali dovrebbero fissare &lt;strong&gt;standard etici minimi&lt;/strong&gt;, come le &lt;em&gt;OECD Guidelines for Multinational Enterprises&lt;/em&gt; e lo &lt;em&gt;UN Global Compact&lt;/em&gt;.&lt;/p&gt;

&lt;h4&gt;UN Global Compact (sl. 30-31)&lt;/h4&gt;
&lt;p&gt;Iniziativa ONU per la sostenibilità d&#x27;impresa basata su principi. La sostenibilità parte dal sistema di valori dell&#x27;impresa: operare in modo da rispettare almeno le responsabilità fondamentali su diritti umani, lavoro, ambiente e anticorruzione, &lt;strong&gt;con gli stessi valori ovunque&lt;/strong&gt;, sapendo che le buone pratiche in un&#x27;area &lt;strong&gt;non compensano&lt;/strong&gt; i danni in un&#x27;altra. I dieci principi derivano da: Dichiarazione universale dei diritti umani, Dichiarazione ILO sui principi e diritti fondamentali nel lavoro, Dichiarazione di Rio su ambiente e sviluppo, Convenzione ONU contro la corruzione.&lt;/p&gt;
&lt;div data-tabs&gt;&lt;div role=&quot;tablist&quot; aria-label=&quot;Aree dei dieci principi&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Human rights · 1-2&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Labour · 3-6&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Environment · 7-9&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Anti-corruption · 10&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;ol class=&quot;tight&quot;&gt;&lt;li&gt;Sostenere e rispettare i diritti umani proclamati a livello internazionale;&lt;/li&gt;&lt;li&gt;assicurarsi di non essere &lt;strong&gt;complici&lt;/strong&gt; di abusi dei diritti umani.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;ol class=&quot;tight&quot; start=&quot;3&quot;&gt;&lt;li&gt;Libertà di associazione e riconoscimento effettivo del diritto alla contrattazione collettiva;&lt;/li&gt;&lt;li&gt;eliminazione di ogni forma di lavoro forzato e obbligatorio;&lt;/li&gt;&lt;li&gt;abolizione effettiva del lavoro minorile;&lt;/li&gt;&lt;li&gt;eliminazione della discriminazione in materia di impiego e professione.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;ol class=&quot;tight&quot; start=&quot;7&quot;&gt;&lt;li&gt;Approccio &lt;strong&gt;precauzionale&lt;/strong&gt; alle sfide ambientali;&lt;/li&gt;&lt;li&gt;iniziative per una maggiore responsabilità ambientale;&lt;/li&gt;&lt;li&gt;sviluppo e diffusione di tecnologie rispettose dell&#x27;ambiente.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;ol class=&quot;tight&quot; start=&quot;10&quot;&gt;&lt;li&gt;Lavorare contro la corruzione in tutte le sue forme, incluse estorsione e concussione/tangenti (&lt;em&gt;extortion and bribery&lt;/em&gt;).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;Il principio 2 (complicità) è il gancio con la upstream e downstream responsibility della Parte I: si può essere responsabili anche di abusi commessi da altri, se si contribuisce o se ne trae beneficio.&lt;/p&gt;

&lt;div class=&quot;quiz pS&quot;&gt;&lt;h3&gt;Autoverifica · Parte II&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;È un&#x27;immagine di futuro desiderato: vision.&quot;&gt;&lt;p&gt;«To be the world&#x27;s most loved, most efficient, and most profitable airline» è…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Purpose&lt;/button&gt;&lt;button data-ok&gt;Vision&lt;/button&gt;&lt;button&gt;Mission&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;Treviño et al. (1999): il follow-through conta più della mera presenza del codice.&quot;&gt;&lt;p&gt;Secondo lo studio citato nella sl. 25, che cosa influenza di più il comportamento dei dipendenti?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;La lunghezza e il dettaglio del codice&lt;/button&gt;&lt;button data-ok&gt;Il follow-through: scoprire le violazioni, dar seguito alle segnalazioni, coerenza tra policy e azioni&lt;/button&gt;&lt;button&gt;La semplice esistenza di un codice pubblicato&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Elenca almeno quattro critiche ai codici etici.&lt;/summary&gt;&lt;div&gt;Mancanza di flessibilità; difficoltà con situazioni nuove o cross-cultural; affermazioni vaghe e generiche; uso come strumento di PR; meccanismi di controllo discutibili su convinzioni e valori; soppressione degli istinti morali individuali a favore della conformità burocratica (sl. 14).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quali sono le tre condizioni di efficacia di Schwartz (2004)?&lt;/summary&gt;&lt;div&gt;Come il codice è &lt;em&gt;scritto e accessibile&lt;/em&gt; (su misura, tono adatto), come è &lt;em&gt;supportato&lt;/em&gt; (dal management, con formazione), come è &lt;em&gt;applicato&lt;/em&gt; (canali di segnalazione, comunicazione delle violazioni, incentivi positivi e negativi).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché un codice dovrebbe essere sia aspirational sia rules-based?&lt;/summary&gt;&lt;div&gt;Perché le regole senza valori mancano di significato e scopo, e i valori senza regole mancano di contenuto specifico (Hoffman, Driscoll e Painter-Morland, 2001).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa propone Donaldson (1996) tra relativismo e assolutismo?&lt;/summary&gt;&lt;div&gt;Tre principi: rispetto dei core human values, rispetto delle tradizioni locali, consapevolezza che il contesto conta. Ne deriva un codice globale che fissa standard minimi non negoziabili lasciando spazio all&#x27;adattamento locale.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Nel caso Nvidia, perché il board avvia un&#x27;indagine «indipendente»?&lt;/summary&gt;&lt;div&gt;Perché il soggetto coinvolto è il vertice: solo amministratori indipendenti con consulenti esterni possono valutare in modo credibile se c&#x27;è stato un conflitto di interessi o un rischio per informazioni riservate. Le scuse del CEO riconoscono l&#x27;impatto ma non accertano violazioni.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part pO&quot; id=&quot;p3&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Parte III · sl. 32–73&lt;/div&gt;&lt;h2&gt;Assessing ethical performance&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Dichiarare valori non basta: bisogna &lt;strong&gt;verificare e dimostrare&lt;/strong&gt; di rispettarli. Questa parte segue la catena: sistemi di gestione → certificazioni → audit → accounting e reporting → obblighi di due diligence.&lt;/p&gt;

&lt;h3 id=&quot;s-ems&quot;&gt;&lt;span class=&quot;n&quot;&gt;3.1&lt;/span&gt;Policies and processes: i sistemi di gestione&lt;/h3&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Definizione · sl. 34&lt;/span&gt;&lt;p&gt;Gli &lt;span class=&quot;term&quot;&gt;environmental and social management systems&lt;/span&gt; sono i processi con cui le organizzazioni attuano obiettivi, policy e responsabilità ambientali o sociali e garantiscono audit e reporting regolari di questi approcci, &lt;strong&gt;oltre la semplice conformità alla legge&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Certificate vs self-determined&lt;/span&gt;&lt;p&gt;Il sistema può seguire uno standard esterno ed essere &lt;strong&gt;certificato&lt;/strong&gt; da un ente terzo (es. ISO 14001), oppure essere &lt;strong&gt;definito autonomamente&lt;/strong&gt; dall&#x27;impresa, senza certificazione.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Internal vs external auditing&lt;/span&gt;&lt;p&gt;La verifica può essere fatta da &lt;strong&gt;auditor interni&lt;/strong&gt; (la funzione di internal audit) o da &lt;strong&gt;auditor esterni&lt;/strong&gt; indipendenti. Vedi &lt;a href=&quot;#s-audit&quot;&gt;§3.6&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Il motore dei sistemi di gestione è il ciclo &lt;strong&gt;PDCA&lt;/strong&gt;. Ecco come lo declina la norma &lt;span class=&quot;term&quot;&gt;ISO 14001&lt;/span&gt; (sl. 48), lo standard internazionale per l&#x27;&lt;span class=&quot;term&quot;&gt;EMS&lt;/span&gt; (environmental management system, sistema di gestione ambientale):&lt;/p&gt;
&lt;div data-hot=&quot;P&quot; class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 360 360&quot; role=&quot;img&quot; aria-label=&quot;Ciclo PDCA di ISO 14001&quot;&gt;
&lt;g font-size=&quot;40&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot;&gt;
&lt;g data-k=&quot;P&quot;&gt;&lt;path class=&quot;hit f-cbg s-c&quot; d=&quot;M180 180V20A160 160 0 0 1 340 180Z&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;125&quot;&gt;P&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;150&quot; font-size=&quot;14&quot; font-family=&quot;sans-serif&quot;&gt;Plan&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;D&quot;&gt;&lt;path class=&quot;hit f-cbg s-c&quot; d=&quot;M180 180H340A160 160 0 0 1 180 340Z&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;255&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;280&quot; font-size=&quot;14&quot; font-family=&quot;sans-serif&quot;&gt;Do&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;C&quot;&gt;&lt;path class=&quot;hit f-cbg s-c&quot; d=&quot;M180 180V340A160 160 0 0 1 20 180Z&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;255&quot;&gt;C&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;280&quot; font-size=&quot;14&quot; font-family=&quot;sans-serif&quot;&gt;Check&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;A&quot;&gt;&lt;path class=&quot;hit f-cbg s-c&quot; d=&quot;M180 180H20A160 160 0 0 1 180 20Z&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;125&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;150&quot; font-size=&quot;14&quot; font-family=&quot;sans-serif&quot;&gt;Act&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;
&lt;circle cx=&quot;180&quot; cy=&quot;180&quot; r=&quot;44&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; class=&quot;hl&quot; font-size=&quot;13&quot;&gt;Leadership&lt;/text&gt;
&lt;/svg&gt;&lt;p class=&quot;hint&quot;&gt;Tocca un quadrante.&lt;/p&gt;&lt;/figure&gt;
&lt;div class=&quot;hbox&quot;&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;P&quot;&gt;&lt;h4&gt;Plan&lt;/h4&gt;&lt;p&gt;Analisi del &lt;strong&gt;contesto e dei temi rilevanti&lt;/strong&gt;, definizione dei &lt;strong&gt;processi&lt;/strong&gt;, fissazione degli &lt;strong&gt;obiettivi ambientali&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;D&quot;&gt;&lt;h4&gt;Do&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Support&lt;/strong&gt; (risorse, competenze, comunicazione), &lt;strong&gt;operational control&lt;/strong&gt; (controllo operativo dei processi), gestione delle &lt;strong&gt;emergency situations&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;C&quot;&gt;&lt;h4&gt;Check&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Internal audit&lt;/strong&gt;, &lt;strong&gt;evaluation of compliance&lt;/strong&gt; (verifica del rispetto della legge), &lt;strong&gt;management review&lt;/strong&gt; (riesame della direzione).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;A&quot;&gt;&lt;h4&gt;Act&lt;/h4&gt;&lt;p&gt;Gestione delle &lt;strong&gt;nonconformities&lt;/strong&gt; (scostamenti dai requisiti), &lt;strong&gt;corrective action&lt;/strong&gt;, &lt;strong&gt;continual improvement&lt;/strong&gt;. Poi si riparte da Plan.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Al centro c&#x27;è la leadership: senza l&#x27;impegno del vertice il ciclo non gira.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;h3 id=&quot;s-cert&quot;&gt;&lt;span class=&quot;n&quot;&gt;3.2&lt;/span&gt;Process and product certifications&lt;/h3&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Definizione · sl. 36&lt;/span&gt;&lt;p&gt;Le &lt;span class=&quot;term&quot;&gt;certifications&lt;/span&gt; sono &lt;strong&gt;attestazioni formali rilasciate da un ente autorevole&lt;/strong&gt; che confermano che una persona, organizzazione, prodotto, processo o sistema rispetta un insieme di standard, criteri o competenze predefiniti. Funzionano come &lt;strong&gt;validazioni oggettive di terza parte&lt;/strong&gt; che danno fiducia e garanzia (&lt;em&gt;assurance&lt;/em&gt;) a clienti, consumatori, regolatori e altri stakeholder.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;&lt;h4&gt;Standardized criteria&lt;/h4&gt;&lt;p&gt;Basate su norme, framework o regole riconosciute (ISO, standard professionali nazionali).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;num&quot;&gt;2&lt;/div&gt;&lt;h4&gt;Independent verification&lt;/h4&gt;&lt;p&gt;Un ente esterno neutrale valuta se i criteri sono rispettati.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;&lt;h4&gt;Periodic renewal&lt;/h4&gt;&lt;p&gt;Audit o rivalutazioni regolari per restare validi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;num&quot;&gt;4&lt;/div&gt;&lt;h4&gt;Transparency and credibility&lt;/h4&gt;&lt;p&gt;Garanzia esterna che distingue chi è certificato dai concorrenti non certificati.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div data-tabs&gt;&lt;div role=&quot;tablist&quot; aria-label=&quot;Tipi di certificazione&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Process&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Product&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Esempi (sl. 38)&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Process certifications&lt;/strong&gt; guardano a &lt;em&gt;come&lt;/em&gt; l&#x27;organizzazione gestisce le sue attività: valutano se un sistema di gestione rispetta requisiti specifici (ambiente, qualità, salute e sicurezza sul lavoro). &lt;strong&gt;Non garantiscono automaticamente&lt;/strong&gt; che ogni prodotto sia sostenibile né che ogni impatto negativo sia stato eliminato (sl. 39).&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Esempi: ISO 14001, EMAS, SA8000, ISO 45001, ISO 50001.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Product certifications&lt;/strong&gt; guardano alle caratteristiche o agli impatti di uno &lt;em&gt;specifico prodotto o servizio&lt;/em&gt;: origine dei materiali, prestazione ambientale, sicurezza, condizioni sociali di produzione. Valgono &lt;strong&gt;solo&lt;/strong&gt; per il prodotto certificato e per i criteri coperti dallo schema (sl. 39).&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Esempi: Fairtrade, EU Ecolabel, FSC, PEFC, Rainforest Alliance, Cradle to Cradle, EPD, marchi vegan.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div&gt;&lt;span class=&quot;lab&quot;&gt;Professional&lt;/span&gt;&lt;p&gt;&lt;em&gt;PMP&lt;/em&gt; (PMI, project management); &lt;em&gt;CFA&lt;/em&gt; (finanza e investimenti).&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;lab&quot;&gt;Product&lt;/span&gt;&lt;p&gt;&lt;em&gt;CE marking&lt;/em&gt; (conformità UE a requisiti di sicurezza e ambiente); &lt;em&gt;UL&lt;/em&gt; (Underwriters Laboratories, sicurezza dei prodotti di consumo).&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;lab&quot;&gt;System&lt;/span&gt;&lt;p&gt;&lt;em&gt;ISO 9001&lt;/em&gt; (qualità); &lt;em&gt;ISO/IEC 27001&lt;/em&gt; (sicurezza delle informazioni).&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Regola d&#x27;oro (sl. 39).&lt;/b&gt; Per interpretare una certificazione chiediti sempre: &lt;strong&gt;che cosa&lt;/strong&gt; viene valutato? &lt;strong&gt;rispetto a quale standard&lt;/strong&gt;? &lt;strong&gt;da chi&lt;/strong&gt;? Un&#x27;etichetta «green» su un&#x27;azienda certificata ISO 14001 dice che il &lt;em&gt;sistema&lt;/em&gt; è gestito secondo la norma, non che il &lt;em&gt;prodotto&lt;/em&gt; sia ecologico.&lt;/div&gt;

&lt;h4&gt;Sustainability certifications (sl. 40-42)&lt;/h4&gt;
&lt;p&gt;Sono &lt;strong&gt;validazioni di terza parte&lt;/strong&gt; che confermano che un&#x27;impresa o un prodotto rispetta criteri ambientali, sociali o di governance (&lt;span class=&quot;term&quot;&gt;ESG&lt;/span&gt;: environmental, social, governance). Possono essere &lt;strong&gt;volontarie&lt;/strong&gt; (B Corp, LEED) o &lt;strong&gt;obbligatorie&lt;/strong&gt; in certi contesti istituzionali.&lt;/p&gt;
&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;card pS tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Environmental&lt;/span&gt;&lt;p&gt;Riduzione della carbon footprint, efficienza energetica, gestione dei rifiuti, economia circolare.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card pM tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Social&lt;/span&gt;&lt;p&gt;Pratiche di lavoro eque, diritti umani, salute e sicurezza, diversità.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card pA tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Governance&lt;/span&gt;&lt;p&gt;Condotta etica, trasparenza, meccanismi di accountability.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Esistono &lt;strong&gt;oltre 600 schemi&lt;/strong&gt; riconosciuti nel mondo (Ecolabel Index, 2024, secondo la sl. 41), con sforzi crescenti di armonizzazione. Le certificazioni aiutano a strutturare i sistemi di gestione della sostenibilità, spesso collegati agli standard di reporting &lt;span class=&quot;term&quot;&gt;GRI&lt;/span&gt; (Global Reporting Initiative) o &lt;span class=&quot;term&quot;&gt;SASB&lt;/span&gt; (Sustainability Accounting Standards Board). &lt;strong&gt;Esempio:&lt;/strong&gt; un&#x27;impresa manifatturiera può avere ISO 14001 (ambiente), SA8000 (responsabilità sociale) e ISO 50001 (energia), creando un quadro integrato.&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;&lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;Quanti sono gli ecolabel?&lt;/span&gt;&lt;p&gt;Sul sito di Ecolabel Index (gestito da Big Room Inc. dal 2007) non è comparso un conteggio aggiornato; il dato più recente trovato è di &lt;strong&gt;457 ecolabel in 199 paesi e 25 settori&lt;/strong&gt; (profilo del 2020). Il numero «oltre 600» della slide non è stato verificato. &lt;a href=&quot;https://www.ecolabelindex.com/about/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ecolabelindex.com/about&lt;/a&gt; · &lt;a href=&quot;https://theindexproject.org/post/ecolabel-index&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;theindexproject.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3 id=&quot;s-proc&quot;&gt;&lt;span class=&quot;n&quot;&gt;3.3&lt;/span&gt;Il processo di certificazione&lt;/h3&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;svg viewBox=&quot;0 0 700 64&quot; role=&quot;img&quot; aria-label=&quot;Cinque fasi&quot;&gt;&lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;&lt;line x1=&quot;70&quot; y1=&quot;24&quot; x2=&quot;630&quot; y2=&quot;24&quot; class=&quot;s-rule&quot; stroke-width=&quot;3&quot;/&gt;
&lt;g data-si=&quot;0&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;70&quot; cy=&quot;24&quot; r=&quot;18&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;29&quot;&gt;1&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;58&quot; class=&quot;f-mut&quot;&gt;Preparation&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;1&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;210&quot; cy=&quot;24&quot; r=&quot;18&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;29&quot;&gt;2&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;58&quot; class=&quot;f-mut&quot;&gt;Gap analysis&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;2&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;350&quot; cy=&quot;24&quot; r=&quot;18&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;29&quot;&gt;3&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;58&quot; class=&quot;f-mut&quot;&gt;Implementation&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;3&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;490&quot; cy=&quot;24&quot; r=&quot;18&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;29&quot;&gt;4&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;58&quot; class=&quot;f-mut&quot;&gt;Audit &amp;amp; decision&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;4&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;630&quot; cy=&quot;24&quot; r=&quot;18&quot;/&gt;&lt;text x=&quot;630&quot; y=&quot;29&quot;&gt;5&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;58&quot; class=&quot;f-mut&quot;&gt;Surveillance&lt;/text&gt;&lt;/g&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Preparation / application&lt;/h4&gt;&lt;p&gt;L&#x27;organizzazione si rivolge a un ente di certificazione e definisce &lt;strong&gt;perimetro, confini, siti&lt;/strong&gt; e documentazione esistente.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Esempio: un produttore che chiede la ISO 14001 fornisce mappe dei processi, registri ambientali ed elenchi di conformità legale.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Gap analysis / documentation review&lt;/h4&gt;&lt;p&gt;La documentazione esistente viene confrontata con lo standard; l&#x27;organizzazione aggiorna policy, procedure, istruzioni operative e registrazioni.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Esempio: definisce il processo di audit interno e introduce il tracciamento delle azioni correttive.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Implementation&lt;/h4&gt;&lt;p&gt;Il sistema entra in funzione: formazione del personale, audit interni, management review, azioni correttive, raccolta di dati di performance.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Esempio: per sei mesi monitora i consumi energetici e fissa obiettivi di riduzione.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Certification audit &amp;amp; decision&lt;/h4&gt;&lt;p&gt;Gli auditor esterni valutano di solito in due tempi: &lt;strong&gt;Stage 1&lt;/strong&gt; preparazione e documentazione, &lt;strong&gt;Stage 2&lt;/strong&gt; attuazione sul posto. Con esito positivo l&#x27;ente rilascia il certificato.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Esempio: visitano lo stabilimento, intervistano il personale, controllano le registrazioni.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Surveillance / recertification&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Audit di sorveglianza&lt;/strong&gt;, spesso annuali, verificano che il sistema resti efficace e conforme. Un audit completo di &lt;strong&gt;ricertificazione&lt;/strong&gt; arriva di norma dopo tre anni, secondo lo schema.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Esempio: al secondo anno si controllano audit interni e management review; al terzo è previsto l&#x27;audit completo.&lt;/p&gt;&lt;/div&gt;
&lt;nav&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/nav&gt;
&lt;/div&gt;
&lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Il percorso EMAS in 10 passi (sl. 44)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Processo interno, ripetuto ogni anno secondo ISO 14001 ed EMAS, più un processo esterno:&lt;/p&gt;&lt;ol class=&quot;tight&quot;&gt;&lt;li&gt;&lt;strong&gt;Contact&lt;/strong&gt; l&#x27;organismo competente;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Conduct&lt;/strong&gt; un&#x27;analisi ambientale iniziale;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Plan&lt;/strong&gt;: politica e programma ambientale;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Do&lt;/strong&gt;: attuare l&#x27;EMS;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Check&lt;/strong&gt;: audit ambientale interno;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Act&lt;/strong&gt;: miglioramento continuo della performance;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Environmental report&lt;/strong&gt; (dichiarazione ambientale);&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Verification and validation&lt;/strong&gt; da parte del verificatore ambientale;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Registration&lt;/strong&gt; presso l&#x27;organismo competente;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Promote&lt;/strong&gt;: comunicare le proprie credenziali ambientali.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/details&gt;
&lt;h4&gt;Perché le certificazioni contano (sl. 45)&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Mercati e finanza&lt;/span&gt;&lt;p&gt;Aprono &lt;strong&gt;nuovi mercati e opportunità di finanziamento&lt;/strong&gt;: &lt;em&gt;green loans&lt;/em&gt; (prestiti verdi), &lt;em&gt;sustainability-linked bonds&lt;/em&gt; (obbligazioni con cedola legata a obiettivi di sostenibilità), partnership di filiera che richiedono conformità ESG.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Performance interna&lt;/span&gt;&lt;p&gt;Spingono a &lt;strong&gt;migliorare&lt;/strong&gt;: aiutano a individuare inefficienze e ridurre costi grazie a una migliore gestione delle risorse.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Nel settore alimentare, marchi come &lt;strong&gt;Fairtrade&lt;/strong&gt; e &lt;strong&gt;Rainforest Alliance&lt;/strong&gt; hanno cambiato le preferenze dei consumatori: i prodotti certificati godono di più fiducia e fedeltà grazie a standard etici e ambientali trasparenti.&lt;/p&gt;

&lt;h3 id=&quot;s-ex&quot;&gt;&lt;span class=&quot;n&quot;&gt;3.4&lt;/span&gt;Panoramica degli schemi&lt;/h3&gt;
&lt;div data-filter&gt;

&lt;tr data-t=&quot;E&quot;&gt;&lt;td&gt;&lt;strong&gt;ISO 14001&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;ISO&lt;/td&gt;&lt;td&gt;Environmental Management System&lt;/td&gt;&lt;td&gt;EMS, ciclo PDCA, conformità legale, audit esterno&lt;/td&gt;&lt;td&gt;Lo standard ambientale più riconosciuto, per tutti i settori&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-t=&quot;E&quot;&gt;&lt;td&gt;&lt;strong&gt;EMAS&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Commissione europea&lt;/td&gt;&lt;td&gt;Gestione e reporting ambientale (UE)&lt;/td&gt;&lt;td&gt;EMS + dichiarazione ambientale convalidata + conformità legale&lt;/td&gt;&lt;td&gt;Più trasparenza e credibilità di ISO 14001 nell&#x27;UE&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-t=&quot;S&quot;&gt;&lt;td&gt;&lt;strong&gt;SA8000&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Social Accountability International&lt;/td&gt;&lt;td&gt;Responsabilità sociale, diritti dei lavoratori, condizioni di lavoro&lt;/td&gt;&lt;td&gt;Convenzioni ILO, audit regolari, supervisione dei fornitori&lt;/td&gt;&lt;td&gt;Focus forte sui diritti umani; diffuso nella manifattura&lt;/td&gt;&lt;/tr&gt;
