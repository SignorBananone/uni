&lt;/g&gt;&lt;/svg&gt;&lt;p class=&quot;hint&quot;&gt;Yawar e Seuring (2017, p. 624), sl. 103. Tocca un riquadro.&lt;/p&gt;&lt;/figure&gt;
&lt;div class=&quot;hbox&quot;&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;ext&quot;&gt;&lt;h4&gt;External stakeholders&lt;/h4&gt;&lt;p&gt;Media, ONG, società civile, consumatori, regolatori: sollevano i temi e chiedono &lt;em&gt;legittimità&lt;/em&gt; e &lt;em&gt;accountability&lt;/em&gt; sulle pratiche dei fornitori.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;int&quot;&gt;&lt;h4&gt;Internal stakeholders&lt;/h4&gt;&lt;p&gt;Dipendenti, management, azionisti: chiedono che le soluzioni siano praticabili ed efficienti. Le pressioni esterne aumentano la pressione sugli interni (sl. 107).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;si&quot;&gt;&lt;h4&gt;Social issues&lt;/h4&gt;&lt;p&gt;Lavoro, lavoro minorile, diritti umani, salute e sicurezza, minoranze, inclusione, genere (&lt;a href=&quot;#s-sc2&quot;&gt;§4.3&lt;/a&gt;). Sono il punto di partenza: le richieste degli stakeholder li trasformano in azioni.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;comm&quot;&gt;&lt;h4&gt;(1) Communication strategies&lt;/h4&gt;&lt;p&gt;Servono a trasmettere &lt;strong&gt;legittimità e accountability&lt;/strong&gt; sul comportamento responsabile: rispondere alle preoccupazioni degli stakeholder, creare una clientela fedele, attrarre investimenti responsabili e trarre benefici dalle iniziative CSR.&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;&lt;strong&gt;Corporate responsibility documents&lt;/strong&gt; (CRD) o &lt;strong&gt;sustainability reporting&lt;/strong&gt;: informazioni su performance economica, ambientale e sociale. Il CRD è una presa di posizione &lt;em&gt;proattiva&lt;/em&gt; su come le richieste degli stakeholder sono integrate nelle operazioni; il report incoraggia anche fornitori e altri ad agire eticamente.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Labelling&lt;/strong&gt;: modo diretto di comunicare le caratteristiche del prodotto, guadagna legittimità, aumenta la trasparenza, permette di valorizzare aspetti etici in nicchie di mercato.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;comp&quot;&gt;&lt;h4&gt;(2) Compliance strategies&lt;/h4&gt;&lt;p&gt;Meccanismi con cui l&#x27;impresa &lt;strong&gt;assicura&lt;/strong&gt; che i partner della filiera attuino le aspettative degli stakeholder.&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;&lt;strong&gt;Codes of conduct&lt;/strong&gt;: iniziative per costruire partnership con valori e impegni condivisi.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Auditing&lt;/strong&gt;: verifica l&#x27;attuazione e misura il grado di conformità ai codici e agli standard; aiuta a creare meccanismi di monitoraggio soprattutto presso i fornitori più deboli.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Monitoring&lt;/strong&gt;: il &lt;em&gt;controllo del comportamento dei fornitori&lt;/em&gt; rispetto alle aspettative dell&#x27;impresa, comunicato agli stakeholder.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Codici e standard sono gli strumenti; audit e monitoring ne garantiscono l&#x27;attuazione e misurano la performance dei fornitori.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;sds&quot;&gt;&lt;h4&gt;(3) Supplier development strategies (SDS)&lt;/h4&gt;&lt;p&gt;Azioni per &lt;strong&gt;migliorare, aiutare e formare&lt;/strong&gt; i fornitori, direttamente o indirettamente: collaborazioni, formazione, investimenti specifici, assistenza tecnica e finanziaria, educazione.&lt;/p&gt;&lt;p&gt;Il valore nasce se la relazione cresce nella &lt;strong&gt;fiducia e nell&#x27;impegno&lt;/strong&gt;: più condivisione di informazioni, migliore performance economica, meno costi di cambio e selezione dei fornitori, meno costi di monitoraggio e audit.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;perf&quot;&gt;&lt;h4&gt;Performance outcomes&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Economic performance&lt;/strong&gt;: aumento del valore netto per gli azionisti grazie a migliori risultati di mercato. In una filiera convenzionale si misura in &lt;em&gt;quality, dependability, flexibility, costs&lt;/em&gt;.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Social performance&lt;/strong&gt;: misura dei temi sociali; indicatori per lo più indiretti e non economici (trattamento equo, salute e sicurezza) che generano reputazione e fedeltà. È &lt;strong&gt;difficile da misurare&lt;/strong&gt;: temi dinamici, mancanza di indicatori compositi applicabili a tutta la filiera, molte imprese con strategie diverse, ruolo cruciale di fiducia, trasparenza e cultura.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Integrating strategies · sl. 109&lt;/span&gt;&lt;p&gt;Le tre strategie &lt;strong&gt;non si escludono&lt;/strong&gt; e si applicano in modi molto diversi (alcune compliance strategies richiedono una certificazione di terza parte). Tutte servono a gestire il rischio e la prosperità finanziaria della filiera rispondendo agli stakeholder, e sono legate tra loro: lo sviluppo dei fornitori favorisce l&#x27;attuazione di codici e standard e gli audit; reporting e labelling diffondono le informazioni sui codici. &lt;strong&gt;Ogni dimensione è distinguibile ma incompleta senza le altre.&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;quiz pM&quot;&gt;&lt;h3&gt;Autoverifica · Parte IV&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;Il programma lavora con i fornitori per migliorare le condizioni: supplier development.&quot;&gt;&lt;p&gt;Il programma Worker Voice di Nike (questionari ai lavoratori e piani d&#x27;azione dei fornitori) è soprattutto una…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Communication strategy&lt;/button&gt;&lt;button&gt;Compliance strategy&lt;/button&gt;&lt;button data-ok&gt;Supplier development strategy&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;L&#x27;extended supply chain include i fornitori del fornitore e i clienti del cliente.&quot;&gt;&lt;p&gt;Il filatore che vende il filato al produttore di tessuti che rifornisce il laboratorio di Nike fa parte della…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Direct supply chain&lt;/button&gt;&lt;button data-ok&gt;Extended supply chain&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Definisci la supply chain (Christopher) e il supply chain management (Mentzer et al.).&lt;/summary&gt;&lt;div&gt;Supply chain: rete di organizzazioni coinvolte, con legami upstream e downstream, nei processi e attività che producono valore per il consumatore finale. SCM: coordinamento sistemico e strategico delle funzioni aziendali dentro e tra le imprese della filiera per migliorare la performance di lungo periodo delle singole imprese e della filiera.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quali sono le tre famiglie di responsible supply chain actions e i loro strumenti?&lt;/summary&gt;&lt;div&gt;Communication (reporting/CRD, labelling); compliance (codes of conduct/standards, auditing, monitoring); supplier development (SDS diretto e indiretto, trust, relazioni collaborative).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché la social performance è difficile da misurare?&lt;/summary&gt;&lt;div&gt;Perché i temi sociali sono dinamici, mancano indicatori compositi applicabili lungo tutta la filiera, la filiera comprende molte imprese con strategie diverse, e fiducia, trasparenza e differenze culturali contano molto.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa rende il caso Nike un esempio di upstream responsibility e di accountability?&lt;/summary&gt;&lt;div&gt;Gli abusi presunti (lavoro forzato nello Xinjiang) avverrebbero presso fornitori di livelli lontani, non in Nike; eppure stakeholder pubblici (governo canadese, Congresso USA, azionisti) chiedono a Nike di rendere conto. Nike risponde con statement, codici, audit, trasparenza sulle fabbriche e programmi con i lavoratori.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part pT&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Fonti citate nelle slide&lt;/div&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Per ogni autore, testo, norma o standard citato nelle slide ho cercato sul web i dati bibliografici e un link affidabile. &lt;strong&gt;Tutte le schede qui sotto sono &lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;&lt;/strong&gt;, tranne l&#x27;ultimo gruppo, che riporta i link già presenti nelle slide. Dove la ricerca non ha confermato qualcosa, è scritto.&lt;/p&gt;

&lt;h3&gt;Testi e studi&lt;/h3&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Crane, Matten, Glozer, Spence: &lt;em&gt;Business Ethics&lt;/em&gt;, 5ª ed.&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Oxford University Press, 2019 · ISBN 978-0-19-881007-0 · citato alle sl. 13 e 52&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; manuale su teorie etiche e loro applicazione agli stakeholder (azionisti, dipendenti, consumatori, fornitori, società civile, governo), sottotitolo &lt;em&gt;Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/em&gt;. &lt;strong&gt;Perché conta:&lt;/strong&gt; è la fonte della definizione di code of ethics e del dilemma etico della sl. 25. &lt;a href=&quot;https://www.oup.com.au/books/higher-education/business-marketing/9780198810070&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;oup.com.au&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Treviño, Weaver, Gibson, Toffler: «Managing Ethics and Legal Compliance: What Works and What Hurts»&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;California Management Review, 41(2), 1999, pp. 131–151 · sl. 25&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; indagine sui dipendenti di sei grandi imprese USA. Funziona meglio un approccio culturale basato sui valori; contano impegno dei leader, trattamento equo, premi per la condotta etica e coerenza tra policy e azioni. Danneggia un programma percepito come scudo per il vertice. &lt;strong&gt;Perché conta:&lt;/strong&gt; è la base empirica dell&#x27;idea che il follow-through conti più del codice in sé. &lt;a href=&quot;https://cmr.berkeley.edu/1999/02/41-2-managing-ethics-and-legal-compliance-what-works-and-what-hurts&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cmr.berkeley.edu&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Schwartz: «Effective Corporate Codes of Ethics: Perceptions of Code Users»&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Journal of Business Ethics, 55(4), 2004, pp. 321–341 (alcune fonti indicano 323–343) · sl. 26&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; studio su come dipendenti, manager ed ethics officer percepiscono i codici delle loro imprese. &lt;strong&gt;Perché conta:&lt;/strong&gt; da qui vengono le tre condizioni di efficacia (scrittura, supporto, applicazione). &lt;a href=&quot;https://profiles.laps.yorku.ca/publications/effective-corporate-codes-of-ethics-perceptions-of-code-users/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;York University&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Hoffman, Driscoll, Painter-Morland (2001)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;sl. 27&lt;/div&gt;&lt;p&gt;La ricerca &lt;strong&gt;non ha trovato&lt;/strong&gt; il testo originale né confermato la citazione. Il tema (codici che uniscono valori e regole) è trattato nel libro di Driscoll e Hoffman &lt;em&gt;Ethics Matters: How to Implement Values-Driven Management&lt;/em&gt; (2000), citato in una guida dell&#x27;Ethics Resource Center. Per la fonte esatta conviene controllare la bibliografia del manuale di Crane et al. &lt;a href=&quot;https://www.ethics.org/wp-content/uploads/resources/Creating-A-Workable-Company-Code-of-Ethics.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ethics.org (guida ERC)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Donaldson: «Values in Tension: Ethics Away from Home»&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Harvard Business Review, 74(5), set.-ott. 1996, pp. 48–62 · sl. 29&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; come devono comportarsi i manager all&#x27;estero davanti a pratiche locali che sembrano non etiche; rifiuta sia il relativismo sia l&#x27;assolutismo; esempi del regalo d&#x27;affari in Giappone e dei salari nei paesi in via di sviluppo. &lt;strong&gt;Perché conta:&lt;/strong&gt; è la «possible solution» per i codici globali. &lt;a href=&quot;https://hbr.org/1996/09/values-in-tension-ethics-away-from-home&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;hbr.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Gray, Owen, Adams: &lt;em&gt;Accounting &amp;amp; Accountability&lt;/em&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Prentice Hall, 1996 · ISBN 9780131758605 · sl. 62, 64&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; testo classico sul ruolo e la valutazione critica del reporting sociale e ambientale d&#x27;impresa (&lt;em&gt;Changes and Challenges in Corporate Social and Environmental Reporting&lt;/em&gt;). &lt;strong&gt;Perché conta:&lt;/strong&gt; da qui le definizioni di accountability e di social accounting. &lt;a href=&quot;https://eprints.gla.ac.uk/95486&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Glasgow&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Ebrahim (2003): accountability nelle organizzazioni non profit&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Due articoli del 2003: «Making Sense of Accountability», &lt;em&gt;Nonprofit Management and Leadership&lt;/em&gt; 14(2), pp. 191–212; «Accountability in Practice: Mechanisms for NGOs», &lt;em&gt;World Development&lt;/em&gt; 31(5), pp. 813–829 · sl. 62&lt;/div&gt;&lt;p&gt;La citazione della slide (p. 194) cade nelle pagine del primo articolo, che è quindi probabilmente il «2003b». &lt;strong&gt;Contiene:&lt;/strong&gt; il primo analizza l&#x27;accountability delle non profit del Nord e del Sud del mondo; il secondo esamina cinque meccanismi (report, valutazioni, partecipazione, autoregolazione, social audit) e mostra che prevale l&#x27;accountability verso i finanziatori. &lt;strong&gt;Perché conta:&lt;/strong&gt; aggiunge la dimensione interna dell&#x27;accountability. &lt;a href=&quot;https://www.scilit.net/publications/c42560a71524aba44ad7b04f1c4187dd&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scilit (NML)&lt;/a&gt; · &lt;a href=&quot;https://fletcher.tufts.edu/research/research-publications/accountability-practice-mechanisms-ngos&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Tufts (World Development)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Christopher: &lt;em&gt;Logistics and Supply Chain Management&lt;/em&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;1ª ed. 1992 (Financial Times/Pitman), edizioni successive Pearson · sl. 95&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; manuale di riferimento su logistica e supply chain come reti che creano valore. &lt;strong&gt;Perché conta:&lt;/strong&gt; fonte della definizione di supply chain. La ricerca conferma l&#x27;anno 1992; l&#x27;editore della prima edizione risulta da un solo record di catalogo. &lt;a href=&quot;https://www.oreilly.com/library/view/logistics-and-supply/9780273731139/chapter-01.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;O&#x27;Reilly (ed. Pearson)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Mentzer et al.: «Defining Supply Chain Management»&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Journal of Business Logistics, 22(2), 2001, pp. 1–25 · sl. 96-97&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; rassegna e sintesi delle definizioni di SCM, con un modello concettuale e una definizione unificata; tra gli articoli più citati del settore. &lt;strong&gt;Perché conta:&lt;/strong&gt; definizione di SCM e distinzione tra direct ed extended supply chain. &lt;a href=&quot;https://doi.org/10.1002/j.2158-1592.2001.tb00001.x&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Yawar, Seuring: «Management of Social Issues in Supply Chains: A Literature Review…»&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Journal of Business Ethics, 141(3), 2017, pp. 621–643 · online dal 2015 · sl. 98-111&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; rassegna strutturata della letteratura che collega CSR e supply chain management; classifica i social issues e le azioni in communication, compliance e supplier development, con un framework concettuale. &lt;strong&gt;Perché conta:&lt;/strong&gt; è il riferimento principale della Parte IV, indicato nella sl. 111 come lettura. &lt;a href=&quot;https://doi.org/10.1007/s10551-015-2719-9&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI&lt;/a&gt; · &lt;a href=&quot;https://ideas.repec.org/a/kap/jbuset/v141y2017i3d10.1007_s10551-015-2719-9.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Klassen, Vereecke: «Social issues in supply chains: Capabilities link responsibility, risk (opportunity), and performance»&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;International Journal of Production Economics, 140(1), 2012, pp. 103–115 · sl. 101&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; casi di cinque multinazionali; individua tre capacità di gestione sociale (monitoring, collaboration, innovation) e i legami con rischio, opportunità e performance. &lt;strong&gt;Perché conta:&lt;/strong&gt; sostiene l&#x27;idea che gestire i temi sociali riduca il rischio. &lt;a href=&quot;https://ideas.repec.org/a/eee/proeco/v140y2012i1p103-115.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Sardà, Pogutz: &lt;em&gt;Corporate Sustainability in the 21st Century&lt;/em&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Routledge, 2019 (copyright; in vendita da dicembre 2018) · sl. 4&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; strategie di sostenibilità e catena del valore, con il framework «Business In Nature»; capitoli su supply chain sostenibili e prodotti e servizi sostenibili. &lt;strong&gt;Perché conta:&lt;/strong&gt; fonte della figura upstream/downstream. &lt;a href=&quot;https://www.routledge.com/products/9781138744592&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;routledge.com&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Iatridis, Schroeder: &lt;em&gt;Responsible Research and Innovation in Industry: The Case for Corporate Responsibility Tools&lt;/em&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Springer (SpringerBriefs), © 2016, pubblicato a settembre 2015 · sl. 52&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; come usare gli strumenti di corporate responsibility già esistenti (da ISO 9001 in poi) per attuare la ricerca e innovazione responsabile. &lt;strong&gt;Perché conta:&lt;/strong&gt; fonte del confronto ISO 14001 / EMAS. &lt;a href=&quot;https://www.springer.com/us/book/9783319216928&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;springer.com&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Norme e direttive&lt;/h3&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Direttiva 2014/95/UE (NFRD)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;GU L 330, 15.11.2014 · sl. 66&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; obbligo di dichiarazione non finanziaria per i grandi enti di interesse pubblico con più di 500 dipendenti; modifica la Direttiva 2013/34/UE. &lt;strong&gt;Perché conta:&lt;/strong&gt; prima tappa del reporting di sostenibilità obbligatorio in UE. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2014/95/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Direttiva (UE) 2022/2464 (CSRD) ed ESRS&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;sl. 67&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; la direttiva sul reporting di sostenibilità con il principio di double materiality; gli ESRS (regolamento delegato del 31 luglio 2023) ne dettagliano i contenuti. &lt;strong&gt;Perché conta:&lt;/strong&gt; sostituisce e amplia la NFRD. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2022/2464/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt; · &lt;a href=&quot;https://www.wu.ac.at/reporting/sure/legislation/csrd&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WU Vienna&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Direttiva (UE) 2024/1760 (CSDDD) e Direttiva (UE) 2026/470 (Omnibus I)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;2024/1760 firmata il 13.6.2024, pubblicata il 5.7.2024 · sl. 70-72&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; obblighi di due diligence su diritti umani e ambiente per le grandi imprese UE ed extra-UE; l&#x27;Omnibus del 2026 ha alzato le soglie e spostato le scadenze (recepimento 26.7.2028, applicazione 26.7.2029). &lt;strong&gt;Perché conta:&lt;/strong&gt; trasforma la due diligence da buona pratica a obbligo. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2024/1760/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt; · &lt;a href=&quot;https://www.cov.com/en/news-and-insights/insights/2026/02/eu-csddd-csrd-omnibus-published-in-official-journal-transposition-delegated-acts-and-guidelines-are-next&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Covington (sintesi Omnibus)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Regolamento (CE) 1221/2009 (EMAS)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;adottato il 25.11.2009 · sl. 50&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; sistema comunitario volontario di ecogestione e audit, aperto anche a organizzazioni extra-UE, con regole su accreditamento e verificatori. &lt;strong&gt;Perché conta:&lt;/strong&gt; base giuridica di EMAS. &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2009/1221/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Uyghur Forced Labor Prevention Act (UFLPA, USA)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;applicato dal 21 giugno 2022 · sl. 85&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; presunzione relativa (&lt;em&gt;rebuttable presumption&lt;/em&gt;) che le merci prodotte in tutto o in parte nello Xinjiang, o da entità in una lista, siano fatte con lavoro forzato e quindi vietate all&#x27;importazione; l&#x27;importatore può superarla solo con prove «chiare e convincenti» e una due diligence adeguata. &lt;strong&gt;Perché conta:&lt;/strong&gt; spiega la pressione del Congresso su Nike. &lt;a href=&quot;https://www.cbp.gov/sites/default/files/assets/documents/2022-Jun/CBP_Guidance_for_Importers_for_UFLPA_13_June_2022.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CBP (guida per importatori)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Standard, certificazioni, linee guida&lt;/h3&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;UN Global Compact: i dieci principi&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;sl. 29-31&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; dieci principi su diritti umani (1-2), lavoro (3-6), ambiente (7-9) e anticorruzione (10); i partecipanti pubblicano ogni anno una &lt;em&gt;Communication on Progress&lt;/em&gt;. &lt;strong&gt;Perché conta:&lt;/strong&gt; esempio di standard etico minimo globale. &lt;a href=&quot;https://unglobalcompact.org/what-is-gc/mission/principles&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;unglobalcompact.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;OECD Guidelines for Multinational Enterprises on Responsible Business Conduct&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;aggiornamento dell&#x27;8 giugno 2023 · sl. 29&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; raccomandazioni dei governi alle multinazionali; l&#x27;aggiornamento 2023 (primo dal 2011) rafforza la due diligence, aggiunge clima e biodiversità, estende la tutela ai lavoratori dell&#x27;intera catena del valore e rafforza i National Contact Points. &lt;strong&gt;Perché conta:&lt;/strong&gt; l&#x27;altro esempio di standard minimo globale, richiamato anche da Nike. &lt;a href=&quot;https://www.business-humanrights.org/en/latest-news/2023-update-of-the-oecd-guidelines-for-multinational-enterprises-on-responsible-business-conduct&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Business &amp;amp; Human Rights Resource Centre&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;ISO 14001&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;edizione corrente ISO 14001:2026 (aprile 2026) · sl. 48, 52&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; requisiti per un sistema di gestione ambientale; la nuova edizione aggiunge una clausola sulla pianificazione dei cambiamenti e rafforza la prospettiva del ciclo di vita. &lt;strong&gt;Perché conta:&lt;/strong&gt; lo standard ambientale più diffuso. &lt;a href=&quot;https://www.iso.org/news/2026/04/iso-14001-2026-published&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;iso.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;SA8000&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Social Accountability International, dal 1997; versione corrente SA8000:2026 · sl. 53&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; standard certificabile sui diritti dei lavoratori basato su norme ILO e Dichiarazione universale, con approccio di sistema di gestione; supervisione di SAAS sugli enti di certificazione. &lt;a href=&quot;https://sa-intl.org/resources/sa8000-standard/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sa-intl.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;B Corp (B Lab)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;sl. 40, 46&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; certificazione dell&#x27;intera impresa; dal 2026 nuovi standard con requisiti minimi per Impact Topic al posto della soglia di 80 punti. &lt;a href=&quot;https://www.bcorporation.net/en-us/news/press/preliminary-consultation-suggests-new-b-corp-standards-are-ambitious-yet-attainable/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bcorporation.net&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;GRI Standards&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Universal Standards rivisti, in vigore dal 1° gennaio 2023 · sl. 41, 55&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; standard di reporting di sostenibilità in tre serie (Universal, Sector, Topic); i Universal (GRI 1, 2, 3) definiscono concetti, informazioni generali e il processo per individuare i temi materiali in base agli impatti. &lt;strong&gt;Perché conta:&lt;/strong&gt; lo standard più usato per i sustainability report. &lt;a href=&quot;https://www.globalreporting.org/standards/standards-development/universal-standards/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;globalreporting.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;SASB Standards&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;oggi gestiti dall&#x27;ISSB della IFRS Foundation (dal 2022) · sl. 41, 55&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; standard per 77 settori (in 11 comparti) sui temi di sostenibilità più rilevanti per gli investitori. &lt;strong&gt;Perché conta:&lt;/strong&gt; rappresenta la prospettiva della financial materiality. &lt;a href=&quot;https://sasb.ifrs.org/standards/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sasb.ifrs.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Ecolabel Index&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;sl. 41&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; directory globale degli ecolabel, gestita da Big Room Inc. dal 2007. Vedi la nota in §3.2 sul numero di schemi. &lt;a href=&quot;https://www.ecolabelindex.com/about/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ecolabelindex.com&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Rapporti, iniziative e documentari&lt;/h3&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;World Benchmarking Alliance: «Are companies ready for the EU supply chain law?»&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Richard Gardiner, luglio 2024 · sl. 73&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; valutazione della preparazione alla CSDDD basata sul Social Benchmark di circa 2.000 imprese. &lt;strong&gt;Perché conta:&lt;/strong&gt; fonte dei dati 80% / 9% / 87%. &lt;a href=&quot;https://www.worldbenchmarkingalliance.org/news/are-companies-ready-for-the-eu-supply-chain-law&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;worldbenchmarkingalliance.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Institute of Business Ethics: &lt;em&gt;Corporate Ethics Policies and Programmes: 2016 UK and Continental Europe survey&lt;/em&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;pubblicato il 26 gennaio 2017 · sl. 13&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; indagine triennale sui programmi etici delle società FTSE 350 e dell&#x27;Europa continentale (formazione, codici, ruolo del board). &lt;strong&gt;Perché conta:&lt;/strong&gt; fonte del dato sulla diffusione dei codici. &lt;a href=&quot;https://www.ibe.org.uk/resource/ibe-survey-report-corporate-ethics-policies-and-programmes-2016-uk-and-continental-europe-survey-pdf.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ibe.org.uk&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;em&gt;The True Cost&lt;/em&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;documentario di Andrew Morgan, 2015 · sl. 5&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contiene:&lt;/strong&gt; il costo umano e ambientale del fast fashion; nato dopo il crollo del Rana Plaza in Bangladesh (2013), che uccise oltre mille lavoratori. &lt;strong&gt;Perché conta:&lt;/strong&gt; è il punto di partenza dell&#x27;attività in aula. &lt;a href=&quot;https://en.wikipedia.org/wiki/The_True_Cost&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Documenti aziendali e fonti già linkate nelle slide&lt;/h3&gt;
&lt;p class=&quot;gloss&quot;&gt;Questi link sono riportati nelle slide e non sono stati riverificati: alcuni potrebbero essere cambiati.&lt;/p&gt;
&lt;ul class=&quot;tight&quot; style=&quot;font-size:.92rem&quot;&gt;
&lt;li&gt;GE, &lt;em&gt;The Spirit &amp;amp; The Letter&lt;/em&gt;: &lt;a href=&quot;https://www.ge.com/sites/default/files/S&amp;amp;L_Booklet_English_0.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ge.com&lt;/a&gt; (sl. 15-17)&lt;/li&gt;
&lt;li&gt;Eni, Code of Ethics: &lt;a href=&quot;https://www.eni.com/en-IT/governance/rules/code-of-ethics.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;eni.com&lt;/a&gt; (sl. 18)&lt;/li&gt;
&lt;li&gt;Nvidia, Code of Conduct: &lt;a href=&quot;https://images.nvidia.com/aem-dam/en-zz/Solutions/about-us/NVIDIA-Code-of-Conduct-External.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;nvidia.com&lt;/a&gt;; dichiarazione del board: &lt;a href=&quot;https://investor.nvidia.com/news/press-release-details/2026/Statement-from-NVIDIA-Board-of-Directors/default.aspx&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;investor.nvidia.com&lt;/a&gt; (sl. 22-23)&lt;/li&gt;
&lt;li&gt;Commissione europea, corporate sustainability due diligence: &lt;a href=&quot;https://commission.europa.eu/business-economy-euro/doing-business-eu/sustainability-due-diligence-responsible-business/corporate-sustainability-due-diligence_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;commission.europa.eu&lt;/a&gt; (sl. 70)&lt;/li&gt;
&lt;li&gt;Nike, statement on forced labor: &lt;a href=&quot;https://about.nike.com/en/newsroom/statements/statement-on-forced-labor&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;about.nike.com&lt;/a&gt;; Manufacturing Map: &lt;a href=&quot;https://manufacturingmap.nikeinc.com/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;manufacturingmap.nikeinc.com&lt;/a&gt;; Worker Voice: &lt;a href=&quot;https://about.nike.com/en/mission/initiatives/worker-voice&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;about.nike.com&lt;/a&gt;; Human Rights and Labor Compliance Standards: &lt;a href=&quot;https://about.nike.com/en/resources/human-rights-and-labor-compliance-standards&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;about.nike.com&lt;/a&gt; (sl. 86-93)&lt;/li&gt;
&lt;li&gt;BBC, Canada probes Nike (2023): &lt;a href=&quot;https://www.bbc.com/news/world-us-canada-66171702&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bbc.com&lt;/a&gt; (sl. 83)&lt;/li&gt;
&lt;li&gt;Video sul sustainable procurement indicato nella sl. 111: &lt;a href=&quot;https://www.youtube.com/watch?v=t1P3lXP7iXY&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com&lt;/a&gt;&lt;/li&gt;
&lt;/ul&gt;
