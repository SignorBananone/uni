&lt;g font-size=&quot;11.5&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;105&quot; y=&quot;62&quot;&gt;Registration&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;76&quot;&gt;by public authority&lt;/text&gt;&lt;text x=&quot;318&quot; y=&quot;62&quot;&gt;Employee involvement&lt;/text&gt;&lt;text x=&quot;318&quot; y=&quot;76&quot;&gt;from the outset&lt;/text&gt;&lt;text x=&quot;62&quot; y=&quot;126&quot;&gt;Public&lt;/text&gt;&lt;text x=&quot;62&quot; y=&quot;140&quot;&gt;statement&lt;/text&gt;&lt;text x=&quot;356&quot; y=&quot;126&quot;&gt;Full verification of&lt;/text&gt;&lt;text x=&quot;356&quot; y=&quot;140&quot;&gt;legal compliance&lt;/text&gt;&lt;text x=&quot;112&quot; y=&quot;196&quot;&gt;Data and EMS verified&lt;/text&gt;&lt;text x=&quot;112&quot; y=&quot;210&quot;&gt;by indep. verifier&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;196&quot;&gt;Core indicators&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;210&quot;&gt;for benchmarking&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;tbl&quot; style=&quot;margin:0&quot;&gt;&lt;table style=&quot;min-width:0&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;ISO 14001&lt;/th&gt;&lt;th&gt;EMAS&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Body&lt;/td&gt;&lt;td&gt;ISO&lt;/td&gt;&lt;td&gt;European Commission&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Method&lt;/td&gt;&lt;td&gt;PDCA&lt;/td&gt;&lt;td&gt;PDCA&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Reporting&lt;/td&gt;&lt;td&gt;communication to interested parties&lt;/td&gt;&lt;td&gt;public environmental statement with core indicators&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Audit&lt;/td&gt;&lt;td&gt;internal audits + annual external audit&lt;/td&gt;&lt;td&gt;same + accredited verifier before publication&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Registration&lt;/td&gt;&lt;td&gt;certificate from the body&lt;/td&gt;&lt;td&gt;public register held by the authority&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Uptake&lt;/td&gt;&lt;td&gt;≈ 350,000 organisations worldwide&lt;/td&gt;&lt;td&gt;≈ 14,000 registrations (EU, 2014)&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;Summary of the table in sl. 52 (adapted from Iatridis and Schroeder, 2016, and Crane et al., 2020).&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;Versions and dates: what has changed&lt;/span&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;The table in sl. 52 gives ISO 14001 as “2004 (version 1), 2015 (version 2)”. On the ISO website, the 2015 version is listed as the third edition, and &lt;strong&gt;ISO 14001:2026 was published on 15 April 2026&lt;/strong&gt; (fourth edition), replacing the 2015 version and incorporating the 2024 climate amendment; 2015 certificates must transition to the new edition by May 2029. &lt;a href=&quot;https://www.iso.org/news/2026/04/iso-14001-2026-published&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;iso.org&lt;/a&gt; · &lt;a href=&quot;https://www.dnv.com/news/2026/new-edition-of-iso-14001-published/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;dnv.com&lt;/a&gt;&lt;/li&gt;&lt;li&gt;Reg. (EC) 1221/2009 was adopted on 25 November 2009 and repealed the previous Reg. 761/2001: it is commonly referred to as “EMAS III”. &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2009/1221/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt; · &lt;a href=&quot;https://legislation.gov.uk/eur/2009/1221/introduction/adopted&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;legislation.gov.uk&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;

&lt;h4&gt;SA8000 (sl. 53)&lt;/h4&gt;
&lt;p&gt;The benchmark social certification standard for &lt;strong&gt;factories and organisations&lt;/strong&gt;, created in 1997 by Social Accountability International as a &lt;em&gt;multi-stakeholder&lt;/em&gt; initiative. It measures social performance in &lt;strong&gt;eight areas&lt;/strong&gt; relevant to workplaces, anchored by a &lt;strong&gt;management system&lt;/strong&gt; element that drives continual improvement. It reflects the labour provisions of the Universal Declaration of Human Rights and ILO conventions and respects national law. According to the slide, it safeguards ethical working conditions for around two million workers.&lt;/p&gt;
&lt;p class=&quot;gloss&quot;&gt;Note: the title of sl. 53 reads “SA 8001”, but the text and logos refer to SA8000. The eight areas, for general reference (not in the slides): child labour, forced labour, health and safety, freedom of association and collective bargaining, discrimination, disciplinary practices, working hours, remuneration.&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;SA8000:2026&lt;/span&gt;&lt;p&gt;The SAI website now presents &lt;strong&gt;SA8000:2026&lt;/strong&gt; as the current version (the previous one dated from 2014). SAI emphasises the management system approach and continual improvement, rather than checklist auditing. &lt;a href=&quot;https://sa-intl.org/resources/sa8000-standard/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sa-intl.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h4&gt;Challenges of sustainability certifications (sl. 55-56)&lt;/h4&gt;
&lt;div data-tabs&gt;&lt;div role=&quot;tablist&quot; aria-label=&quot;Challenges&quot;&gt;&lt;button role=&quot;tab&quot;&gt;1 · Costs&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;2 · Overlaps&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;3 · Greenwashing&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;4 · Recognition&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;5 · Ongoing compliance&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Obtaining and maintaining certification is &lt;strong&gt;costly and time-consuming&lt;/strong&gt;: audits, training, documentation. SMEs struggle more, in proportion to their size. E.g. full ISO 14001 certification may require external consultants, multi-site audits and annual surveillance costs.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;The proliferation of ESG schemes creates &lt;strong&gt;confusion and redundancy&lt;/strong&gt;. Many frameworks overlap (GRI, SASB, CDP, ISO 26000, B Corp) and the company must align different systems and metrics. E.g. a group with ISO 14001, SA8000 and GRI reporting must integrate them into a single management system.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Greenwashing&lt;/span&gt; means presenting oneself as more sustainable than one actually is. Some companies use certification &lt;strong&gt;superficially&lt;/strong&gt;, for image purposes. Without rigorous verification and impact measurement, certifications lose credibility. E.g. product eco-labels have been criticised when certification bodies lacked rigorous auditing practices.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Not all certifications are &lt;strong&gt;recognised everywhere&lt;/strong&gt;, which creates barriers in international markets. E.g. EMAS is respected in the EU but little known elsewhere, whereas ISO 14001 is accepted internationally.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Certification is not a one-off achievement: it requires &lt;strong&gt;ongoing audits and evidence&lt;/strong&gt; of improvement. If standards are not maintained, the certificate may be suspended or withdrawn.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;s-audit&quot;&gt;&lt;span class=&quot;n&quot;&gt;3.6&lt;/span&gt;Internal and external auditing&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Internal auditors&lt;/span&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Assess the effectiveness of &lt;strong&gt;governance, risk management and internal controls&lt;/strong&gt;, including ethics programmes and &lt;em&gt;whistleblowing&lt;/em&gt; mechanisms.&lt;/li&gt;&lt;li&gt;Report findings and recommendations to management and to the board or &lt;em&gt;audit committee&lt;/em&gt;.&lt;/li&gt;&lt;li&gt;May be in-house or outsourced, but maintain independence and objectivity.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;External auditors&lt;/span&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Independently examine the &lt;strong&gt;financial statements&lt;/strong&gt; and express an opinion on whether they are free from &lt;em&gt;material misstatement&lt;/em&gt;.&lt;/li&gt;&lt;li&gt;Consider fraud risks relevant to the financial statements and communicate significant issues.&lt;/li&gt;&lt;li&gt;May also provide &lt;em&gt;assurance&lt;/em&gt; on sustainability information, under a separate engagement.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;IMP (sl. 58).&lt;/b&gt; Auditors support accountability, but &lt;strong&gt;responsibility for ethical conduct remains with management and the board&lt;/strong&gt;. An audit does not guarantee that every wrongdoing will be detected.&lt;/div&gt;
&lt;h4&gt;Auditing ethics across the supply chain (sl. 59)&lt;/h4&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;What&lt;/span&gt;&lt;p&gt;Working conditions, health and safety, human rights, environmental practices, corruption risks at suppliers and sub-suppliers.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Who&lt;/span&gt;&lt;p&gt;Company teams or independent third parties: they review documents, visit facilities and interview workers.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Role of NGOs&lt;/span&gt;&lt;p&gt;Local knowledge, reporting of abuses, support for communities, scrutiny of corporate practices. Trade unions and workers are also essential sources.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Limitations&lt;/span&gt;&lt;p&gt;An audit is a &lt;strong&gt;snapshot&lt;/strong&gt;: it may miss hidden abuses, sub-suppliers or workers who fear retaliation. Not all activities and suppliers are checked.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Beyond auditing&lt;/span&gt;&lt;p&gt;Risk-based audits + worker engagement, grievance mechanisms, corrective action and follow-up. And asking whether one&#x27;s own &lt;strong&gt;purchasing practices&lt;/strong&gt; (prices, lead times) create risks at suppliers.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;IMP&lt;/span&gt;&lt;p&gt;Auditing is a due diligence tool, &lt;strong&gt;not proof&lt;/strong&gt; that a supply chain is ethical. Check who, how many and which part of the supply chain has been audited (&lt;strong&gt;% of suppliers audited&lt;/strong&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Simulator · what “% of suppliers audited” means&lt;/span&gt;
&lt;p class=&quot;gloss&quot;&gt;Illustrative model with made-up numbers, not in the slides: a supply chain with 12 Tier 1, 36 Tier 2 and 72 Tier 3 suppliers.&lt;/p&gt;
&lt;label for=&quot;audDepth&quot;&gt;Audits reach down to: &lt;strong id=&quot;audDepthL&quot;&gt;Tier 1&lt;/strong&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;audDepth&quot; min=&quot;1&quot; max=&quot;3&quot; value=&quot;1&quot;&gt;
&lt;label for=&quot;audPct&quot;&gt;Share of suppliers audited in the tiers covered: &lt;strong id=&quot;audPctL&quot;&gt;80%&lt;/strong&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;audPct&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;80&quot;&gt;
&lt;svg id=&quot;audSvg&quot; viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;Suppliers audited by tier&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;out&quot; id=&quot;audOut&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;s-acc&quot;&gt;&lt;span class=&quot;n&quot;&gt;3.7&lt;/span&gt;Accounting, accountability and reporting&lt;/h3&gt;
&lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 360 230&quot; role=&quot;img&quot; aria-label=&quot;Triangle of ethics, responsibility, accountability&quot;&gt;
&lt;g class=&quot;s-c&quot; stroke-width=&quot;2.5&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M180 58L72 170M180 58L288 170M120 192H240&quot;/&gt;&lt;/g&gt;
&lt;g text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;&lt;rect x=&quot;115&quot; y=&quot;16&quot; width=&quot;130&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;44&quot; class=&quot;hl&quot;&gt;Ethics&lt;/text&gt;&lt;rect x=&quot;10&quot; y=&quot;170&quot; width=&quot;130&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;198&quot;&gt;Responsibility&lt;/text&gt;&lt;rect x=&quot;220&quot; y=&quot;170&quot; width=&quot;130&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;285&quot; y=&quot;198&quot;&gt;Accountability&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;figcaption&gt;Sl. 61: three mutually reinforcing concepts.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div&gt;&lt;p&gt;&lt;strong&gt;Ethics&lt;/strong&gt; tells us what is right; &lt;strong&gt;responsibility&lt;/strong&gt; identifies what one must answer for; &lt;strong&gt;accountability&lt;/strong&gt; is the duty to &lt;em&gt;give an account&lt;/em&gt; of what one is responsible for. Without accountability, responsibility remains a mere declaration.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;blockquote&gt;“the duty to provide an account (by no means necessarily a financial account) or reckoning of those actions for which one is held responsible”&lt;cite&gt;Gray, Owen and Adams (1996, p. 38), sl. 62&lt;/cite&gt;&lt;/blockquote&gt;
&lt;blockquote&gt;“the means through which individuals and organizations are held externally to account for their actions and as the means by which they take internal responsibility for continuously shaping and scrutinizing organizational mission, goals, and performance”&lt;cite&gt;Ebrahim (2003b, p. 194), sl. 62&lt;/cite&gt;&lt;/blockquote&gt;
&lt;/div&gt;
&lt;p&gt;Ebrahim adds a dual dimension: &lt;strong&gt;external&lt;/strong&gt; (being held to account) and &lt;strong&gt;internal&lt;/strong&gt; (taking responsibility for continuously reviewing mission, goals and performance).&lt;/p&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Definition · sl. 63&lt;/span&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Social and/or sustainability accounting&lt;/span&gt; is the voluntary process of assessing and communicating the organisation&#x27;s activities and impacts on social, ethical and environmental issues relevant to stakeholders.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Many names for a single idea, being accountable: social accounting, corporate social reporting, corporate social disclosure, social &amp;amp; environmental reporting, social responsibility disclosure, sustainability reporting…&lt;/p&gt;&lt;/div&gt;
&lt;blockquote&gt;“… is the &lt;strong&gt;process of communicating&lt;/strong&gt; the social and environmental effects of organizations&#x27; economic actions to particular interest groups within society and to society at large. As such, it involves &lt;strong&gt;extending the accountability of organizations&lt;/strong&gt; (particularly companies), beyond the traditional role of providing a financial account to the owners of capital, in particular, shareholders. Such an extension is predicated upon the assumption that &lt;strong&gt;companies do have wider responsibilities&lt;/strong&gt; than simply to make money for their shareholders.”&lt;cite&gt;Gray, Owen and Adams (1996, p. 3), sl. 64&lt;/cite&gt;&lt;/blockquote&gt;
&lt;p&gt;Stakeholder theory returns here: if the company has responsibilities towards multiple parties, it must be accountable to multiple parties, not just to shareholders.&lt;/p&gt;
&lt;h4&gt;The sustainability accounting process (sl. 65)&lt;/h4&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;svg viewBox=&quot;0 0 420 300&quot; role=&quot;img&quot; aria-label=&quot;Eight-stage cycle with stakeholder dialogue at the centre&quot;&gt;&lt;circle cx=&quot;210&quot; cy=&quot;150&quot; r=&quot;112&quot; fill=&quot;none&quot; class=&quot;s-rule&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;4 5&quot;/&gt;
&lt;circle cx=&quot;210&quot; cy=&quot;150&quot; r=&quot;52&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; class=&quot;hl&quot; font-size=&quot;13&quot;&gt;Stakeholder&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;163&quot; text-anchor=&quot;middle&quot; class=&quot;hl&quot; font-size=&quot;13&quot;&gt;dialogue&lt;/text&gt;
&lt;g font-size=&quot;17&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;
&lt;g data-si=&quot;0&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;210&quot; cy=&quot;38&quot; r=&quot;22&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;44&quot;&gt;1&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;1&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;289&quot; cy=&quot;71&quot; r=&quot;22&quot;/&gt;&lt;text x=&quot;289&quot; y=&quot;77&quot;&gt;2&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;2&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;322&quot; cy=&quot;150&quot; r=&quot;22&quot;/&gt;&lt;text x=&quot;322&quot; y=&quot;156&quot;&gt;3&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;3&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;289&quot; cy=&quot;229&quot; r=&quot;22&quot;/&gt;&lt;text x=&quot;289&quot; y=&quot;235&quot;&gt;4&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;4&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;210&quot; cy=&quot;262&quot; r=&quot;22&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;268&quot;&gt;5&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;5&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;131&quot; cy=&quot;229&quot; r=&quot;22&quot;/&gt;&lt;text x=&quot;131&quot; y=&quot;235&quot;&gt;6&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;6&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;98&quot; cy=&quot;150&quot; r=&quot;22&quot;/&gt;&lt;text x=&quot;98&quot; y=&quot;156&quot;&gt;7&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;7&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;131&quot; cy=&quot;71&quot; r=&quot;22&quot;/&gt;&lt;text x=&quot;131&quot; y=&quot;77&quot;&gt;8&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;&lt;/svg&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Determine aims and strategy&lt;/h4&gt;&lt;p&gt;Why are we reporting, and for whom? The aims and strategy of the process are defined.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Conduct materiality assessment&lt;/h4&gt;&lt;p&gt;The &lt;span class=&quot;term&quot;&gt;materiality assessment&lt;/span&gt; selects the &lt;strong&gt;material&lt;/strong&gt; issues, i.e. those that genuinely matter to the company and its stakeholders. Under the CSRD this becomes &lt;em&gt;double materiality&lt;/em&gt; (see below).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Select performance indicators&lt;/h4&gt;&lt;p&gt;For each material issue, measurable indicators are chosen (e.g. emissions, injuries, % of suppliers audited), often taken from standards such as GRI.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Collect and analyse data&lt;/h4&gt;&lt;p&gt;Data are collected from functions, sites and suppliers; quality control and analysis follow.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Prepare report&lt;/h4&gt;&lt;p&gt;Drafting the report: data, narrative, targets, results achieved and missed.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;6 · Provide verification and assurance&lt;/h4&gt;&lt;p&gt;An independent party verifies the information and provides &lt;em&gt;assurance&lt;/em&gt;. This is the link with the external auditing of §3.6.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;7 · Publish report&lt;/h4&gt;&lt;p&gt;The report is made public and communicated to stakeholders.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;8 · Evaluate effectiveness&lt;/h4&gt;&lt;p&gt;Did the process work? Did stakeholders find it useful? Lessons learned feed into the next cycle. Throughout the cycle, &lt;strong&gt;stakeholder dialogue&lt;/strong&gt; sits at the centre.&lt;/p&gt;&lt;/div&gt;
&lt;nav&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/nav&gt;
&lt;/div&gt;

&lt;h4&gt;From the NFRD to the CSRD (sl. 66-67)&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Directive 2014/95/EU · NFRD&lt;/span&gt;&lt;p&gt;The &lt;em&gt;Non-Financial Reporting Directive&lt;/em&gt; required large &lt;span class=&quot;term&quot;&gt;public-interest entities&lt;/span&gt; (listed companies, banks, insurers) with an average of &lt;strong&gt;more than 500 employees&lt;/strong&gt; to include in their management report a &lt;strong&gt;non-financial statement&lt;/strong&gt; enabling an understanding of the development, performance, position and &lt;strong&gt;impact&lt;/strong&gt; of their activity.&lt;/p&gt;&lt;p&gt;Minimum content: &lt;strong&gt;environmental matters&lt;/strong&gt;; &lt;strong&gt;social and employee matters&lt;/strong&gt;; &lt;strong&gt;human rights&lt;/strong&gt;; &lt;strong&gt;anti-corruption and bribery&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;CSRD · Corporate Sustainability Reporting Directive&lt;/span&gt;&lt;p&gt;The new sustainability reporting directive introduces &lt;span class=&quot;term&quot;&gt;double materiality&lt;/span&gt;: an issue must be reported if it is material from at least one of two perspectives.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div data-hot=&quot;dm&quot; class=&quot;grid2&quot; style=&quot;align-items:start&quot;&gt;
&lt;div&gt;&lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn&quot; data-k=&quot;fin&quot; aria-pressed=&quot;false&quot;&gt;Financial materiality&lt;/button&gt;&lt;button class=&quot;btn&quot; data-k=&quot;imp&quot; aria-pressed=&quot;false&quot;&gt;Impact materiality&lt;/button&gt;&lt;button class=&quot;btn&quot; data-k=&quot;dm&quot; aria-pressed=&quot;false&quot;&gt;Double materiality&lt;/button&gt;&lt;/div&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 440 200&quot; role=&quot;img&quot; aria-label=&quot;Double materiality: company and climate&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar3&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;f-acc&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect x=&quot;20&quot; y=&quot;70&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Company&lt;/text&gt;
&lt;rect x=&quot;300&quot; y=&quot;70&quot; width=&quot;120&quot; height=&quot;60&quot; rx=&quot;10&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;360&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Climate / society&lt;/text&gt;
&lt;g class=&quot;dmA&quot;&gt;&lt;path d=&quot;M298 82Q220 40 142 82&quot; fill=&quot;none&quot; class=&quot;s-acc&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;outside-in: climate affects the company&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;dmB&quot;&gt;&lt;path d=&quot;M142 118Q220 160 298 118&quot; fill=&quot;none&quot; class=&quot;s-acc&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar3)&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;inside-out: the company affects the climate&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/figure&gt;&lt;/div&gt;
&lt;div class=&quot;hbox&quot;&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;fin&quot;&gt;&lt;h4&gt;Financial materiality&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Outside-in&lt;/strong&gt; perspective: information needed to understand the company&#x27;s development, performance and position, i.e. how climate change (and other ESG issues) affects the company. Primary audience: &lt;strong&gt;investors&lt;/strong&gt;. Linked to the recommendations of the TCFD (Task Force on Climate-related Financial Disclosures).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;imp&quot;&gt;&lt;h4&gt;Environmental &amp;amp; social (impact) materiality&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Inside-out&lt;/strong&gt; perspective: the impact of the company&#x27;s activities on the environment and society. Audience: &lt;strong&gt;consumers, civil society, employees, investors&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;dm&quot;&gt;&lt;h4&gt;Double materiality&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Both directions&lt;/strong&gt; are considered. The two interact: the company&#x27;s impact on the climate can become financially material (regulation, reputation, future costs). The NFRD already mentioned both, but the CSRD makes them the central criterion, represented through a &lt;em&gt;double materiality matrix&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;Updated legal references&lt;/span&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;NFRD: Directive 2014/95/EU, OJ L 330 of 15.11.2014, amending Accounting Directive 2013/34/EU; first reporting in 2018 on the 2017 financial year. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2014/95/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/li&gt;&lt;li&gt;CSRD: Directive (EU) 2022/2464; the content is specified in the &lt;strong&gt;ESRS&lt;/strong&gt; (European Sustainability Reporting Standards), adopted by the Commission on 31 July 2023, which distinguish between &lt;em&gt;impact&lt;/em&gt; and &lt;em&gt;financial materiality&lt;/em&gt;. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2022/2464/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt; · &lt;a href=&quot;https://dart.deloitte.com/USDART/home/publications/deloitte/heads-up/2024/csrd-esrs-double-materiality-assessment&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Deloitte&lt;/a&gt;&lt;/li&gt;&lt;li&gt;According to professional sources, the “Omnibus” Directive (EU) 2026/470 narrowed the scope of the CSRD to companies with &lt;strong&gt;more than 1,000 employees and more than €450 million&lt;/strong&gt; in turnover. To be checked against the official text. &lt;a href=&quot;https://www.cov.com/en/news-and-insights/insights/2026/02/eu-csddd-csrd-omnibus-published-in-official-journal-transposition-delegated-acts-and-guidelines-are-next&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Covington&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;

&lt;h4&gt;Accounting for sustainability (sl. 69)&lt;/h4&gt;
&lt;p&gt;It uses the methods of conventional accounting to &lt;strong&gt;record, document and analyse&lt;/strong&gt; the company&#x27;s ecological and social impacts. Traditional accounting has diversified and expanded (e.g. &lt;em&gt;environmental cost accounting&lt;/em&gt;, appraisal of investments in environmental protection) to identify three types of cost:&lt;/p&gt;
&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;A&lt;/span&gt;&lt;p&gt;Costs &lt;strong&gt;caused by&lt;/strong&gt; environmental protection &lt;strong&gt;measures&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;B&lt;/span&gt;&lt;p&gt;Costs &lt;strong&gt;caused by the absence&lt;/strong&gt; of protection measures.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;C&lt;/span&gt;&lt;p&gt;Costs that &lt;strong&gt;could be avoided&lt;/strong&gt; by adopting those measures.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin-top:12px&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Interactive chart · illustrative model, not in the slides&lt;/span&gt;
&lt;p class=&quot;gloss&quot;&gt;Assumption: without protection, expected damages (fines, remediation, reputational loss) amount to 120; each euro spent on protection reduces them, with diminishing returns.&lt;/p&gt;
&lt;label for=&quot;accP&quot;&gt;Spending on environmental protection: &lt;strong id=&quot;accPL&quot;&gt;30&lt;/strong&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;accP&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;30&quot;&gt;
&lt;svg id=&quot;accSvg&quot; viewBox=&quot;0 0 560 230&quot; role=&quot;img&quot; aria-label=&quot;Protection costs, costs of non-protection and avoided costs&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;out&quot; id=&quot;accOut&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;s-csddd&quot;&gt;&lt;span class=&quot;n&quot;&gt;3.8&lt;/span&gt;Corporate sustainability due diligence: the CSDDD&lt;/h3&gt;
&lt;p&gt;The &lt;span class=&quot;term&quot;&gt;Corporate Sustainability Due Diligence&lt;/span&gt; Directive (Directive 2024/1760, &lt;strong&gt;CSDDD&lt;/strong&gt;) entered into force on 25 July 2024. It aims to foster sustainable and responsible corporate behaviour in companies&#x27; operations and across &lt;strong&gt;global value chains&lt;/strong&gt;: in-scope companies must identify and address adverse impacts on human rights and the environment, both inside and outside Europe (sl. 70).&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;What it is&lt;/span&gt;&lt;p&gt;An EU framework requiring large companies to address adverse human rights and environmental impacts linked to their activities.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Why it matters&lt;/span&gt;&lt;p&gt;To protect people and the environment and set common expectations of responsible conduct across the EU.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 760 90&quot; role=&quot;img&quot; aria-label=&quot;Stages of due diligence&quot;&gt;&lt;defs&gt;&lt;marker id=&quot;ar4&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;f-mut&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;16&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;89&quot; y=&quot;40&quot; font-weight=&quot;600&quot;&gt;Identify &amp;amp; assess&lt;/text&gt;&lt;text x=&quot;89&quot; y=&quot;58&quot;&gt;risks&lt;/text&gt;
&lt;rect x=&quot;196&quot; y=&quot;16&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;281&quot; y=&quot;40&quot; font-weight=&quot;600&quot;&gt;Prevent / mitigate&lt;/text&gt;&lt;text x=&quot;281&quot; y=&quot;58&quot;&gt;potential impacts&lt;/text&gt;
&lt;rect x=&quot;388&quot; y=&quot;16&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;473&quot; y=&quot;40&quot; font-weight=&quot;600&quot;&gt;Bring to an end&lt;/text&gt;&lt;text x=&quot;473&quot; y=&quot;58&quot;&gt;or minimise actual ones&lt;/text&gt;
&lt;rect x=&quot;580&quot; y=&quot;16&quot; width=&quot;176&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;668&quot; y=&quot;40&quot; class=&quot;hl&quot;&gt;Remediation&lt;/text&gt;&lt;text x=&quot;668&quot; y=&quot;58&quot; class=&quot;hl&quot; font-size=&quot;12&quot;&gt;where required&lt;/text&gt;&lt;/g&gt;

&lt;h4&gt;Who is in scope and when (sl. 72)&lt;/h4&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Interactive scope check · rules from sl. 72&lt;/span&gt;
&lt;div class=&quot;btnrow&quot; id=&quot;csSeat&quot;&gt;&lt;button class=&quot;btn on&quot; data-v=&quot;eu&quot; aria-pressed=&quot;true&quot;&gt;EU company&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;non&quot; aria-pressed=&quot;false&quot;&gt;Non-EU company&lt;/button&gt;&lt;/div&gt;

&lt;circle cx=&quot;520&quot; cy=&quot;40&quot; r=&quot;8&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;520&quot; y=&quot;20&quot; font-weight=&quot;600&quot;&gt;26 Jul 2028&lt;/text&gt;&lt;text x=&quot;520&quot; y=&quot;66&quot;&gt;transposition by&lt;/text&gt;&lt;text x=&quot;520&quot; y=&quot;82&quot;&gt;Member States&lt;/text&gt;
&lt;circle cx=&quot;700&quot; cy=&quot;40&quot; r=&quot;10&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;700&quot; y=&quot;20&quot; font-weight=&quot;600&quot;&gt;26 Jul 2029&lt;/text&gt;&lt;text x=&quot;700&quot; y=&quot;66&quot;&gt;companies&lt;/text&gt;&lt;text x=&quot;700&quot; y=&quot;82&quot;&gt;must comply&lt;/text&gt;&lt;/g&gt;&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;Before and after the Omnibus&lt;/span&gt;&lt;p&gt;In the original 2024 text, the thresholds for EU companies were &lt;strong&gt;1,000 employees and €450 million&lt;/strong&gt; in worldwide turnover; Directive (EU) 2026/470 (“Omnibus I”) raised them to 5,000 employees and €1.5 billion, as shown in the slide. The sources consulted are law firms and consultancies; the consolidated text is on EUR-Lex. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2024/1760/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex 2024/1760&lt;/a&gt; · &lt;a href=&quot;https://www.noerr.com/en/insights/csddd-amending-directive-published-in-the-official-journal-of-the-european-union&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Noerr&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;h4&gt;Are companies ready? (sl. 73)&lt;/h4&gt;
&lt;p&gt;The &lt;strong&gt;World Benchmarking Alliance&lt;/strong&gt; report (Gardiner, July 2024) assesses readiness for the CSDDD on the basis of its Social Benchmark. Many global companies fall short on &lt;span class=&quot;term&quot;&gt;HRDD&lt;/span&gt; (human rights due diligence):&lt;/p&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;World Benchmarking Alliance data&quot;&gt;
&lt;g font-size=&quot;13&quot;&gt;
&lt;text x=&quot;0&quot; y=&quot;30&quot;&gt;Score zero on the first steps of HRDD&lt;/text&gt;&lt;rect x=&quot;0&quot; y=&quot;38&quot; width=&quot;600&quot; height=&quot;16&quot; rx=&quot;4&quot; class=&quot;f-rule&quot;/&gt;&lt;rect x=&quot;0&quot; y=&quot;38&quot; width=&quot;480&quot; height=&quot;16&quot; rx=&quot;4&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;51&quot; font-weight=&quot;700&quot;&gt;80%&lt;/text&gt;
&lt;text x=&quot;0&quot; y=&quot;84&quot;&gt;Demonstrate engagement with affected stakeholders&lt;/text&gt;&lt;rect x=&quot;0&quot; y=&quot;92&quot; width=&quot;600&quot; height=&quot;16&quot; rx=&quot;4&quot; class=&quot;f-rule&quot;/&gt;&lt;rect x=&quot;0&quot; y=&quot;92&quot; width=&quot;54&quot; height=&quot;16&quot; rx=&quot;4&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;62&quot; y=&quot;105&quot; font-weight=&quot;700&quot;&gt;9%&lt;/text&gt;
&lt;text x=&quot;0&quot; y=&quot;138&quot;&gt;Financial sector: no evidence of HRDD (average)&lt;/text&gt;&lt;rect x=&quot;0&quot; y=&quot;146&quot; width=&quot;600&quot; height=&quot;16&quot; rx=&quot;4&quot; class=&quot;f-rule&quot;/&gt;&lt;rect x=&quot;0&quot; y=&quot;146&quot; width=&quot;522&quot; height=&quot;16&quot; rx=&quot;4&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;530&quot; y=&quot;159&quot; font-weight=&quot;700&quot;&gt;87%&lt;/text&gt;
&lt;/g&gt;&lt;/svg&gt;&lt;figcaption&gt;Data from sl. 73. Report: &lt;a href=&quot;https://www.worldbenchmarkingalliance.org/news/are-companies-ready-for-the-eu-supply-chain-law&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;“Are companies ready for the EU supply chain law?”&lt;/a&gt;.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;div class=&quot;quiz pO&quot;&gt;&lt;h3&gt;Self-check · Part III&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;A process certification attests to the management system, not to the characteristics of each product.&quot;&gt;&lt;p&gt;An ISO 14001-certified company prints “sustainable product” on all its packaging. What is wrong with this?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Nothing: ISO 14001 certifies products&lt;/button&gt;&lt;button data-ok&gt;ISO 14001 is a process certification: it attests to the management system, not that every product is sustainable&lt;/button&gt;&lt;button&gt;ISO 14001 is only valid in the EU&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;EMAS = ISO 14001 + validated public environmental statement, public registration, full legal compliance verification, employee involvement, core indicators.&quot;&gt;&lt;p&gt;What does EMAS add to ISO 14001?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;A cycle other than PDCA&lt;/button&gt;&lt;button&gt;Nothing, they are equivalent&lt;/button&gt;&lt;button data-ok&gt;A validated public environmental statement, registration by a public authority, full verification of legal compliance, employee involvement&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;For non-EU companies only turnover generated in the EU counts (over €1.5 billion), with no employee threshold.&quot;&gt;&lt;p&gt;Is a non-EU company with 800 employees and €2 billion of turnover in the EU within the scope of the CSDDD (sl. 72)?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button data-ok&gt;Yes&lt;/button&gt;&lt;button&gt;No, it has too few employees&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;What are the three questions for interpreting a certification?&lt;/summary&gt;&lt;div&gt;What is being assessed? Against which standard? By whom? (sl. 39)&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;List the five stages of the certification process.&lt;/summary&gt;&lt;div&gt;Preparation/application; gap analysis/documentation review; implementation; certification audit &amp;amp; decision (Stage 1 and Stage 2); surveillance/recertification (usually annual audits, recertification after about three years).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What are the five challenges of sustainability certifications?&lt;/summary&gt;&lt;div&gt;Costs and resources; complexity and overlap of standards; risk of greenwashing; limited recognition or lack of global equivalence; pressure of ongoing compliance.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What distinguishes internal from external auditors? Who remains responsible for ethical conduct?&lt;/summary&gt;&lt;div&gt;Internal auditors assess governance, risk management and controls (including ethics programmes and whistleblowing) and report to management and the board/audit committee; external auditors independently assess whether the financial statements are free from material misstatement and may provide assurance on sustainability information under a separate engagement. Responsibility for ethical conduct remains with management and the board.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Explain double materiality with an example.&lt;/summary&gt;&lt;div&gt;Financial materiality (outside-in): how sustainability issues affect the company, e.g. climate risk to its plants; audience: investors. Impact materiality (inside-out): how the company affects people and the environment, e.g. its emissions; audience: consumers, civil society, employees, investors. The CSRD requires both to be considered.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Define accountability according to Gray, Owen and Adams.&lt;/summary&gt;&lt;div&gt;The duty to provide an account (not necessarily a financial one) of the actions for which one is held responsible (1996, p. 38).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What were the four minimum areas of the NFRD?&lt;/summary&gt;&lt;div&gt;Environmental matters; social and employee matters; respect for human rights; anti-corruption and bribery.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part pM&quot; id=&quot;p4&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Part IV · sl. 82–111&lt;/div&gt;&lt;h2&gt;Ethical issues in supply chain&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;We return to the &lt;em&gt;upstream responsibility&lt;/em&gt; of Part I, now with a concrete case (Nike) and a model for interpreting it (Yawar and Seuring, 2017). All the tools seen so far (codes, audits, reporting, due diligence) are applied here to suppliers.&lt;/p&gt;

&lt;h3 id=&quot;s-sc&quot;&gt;&lt;span class=&quot;n&quot;&gt;4.1&lt;/span&gt;The Nike case: allegation, response, tools&lt;/h3&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · The allegation (sl. 83)&lt;/h4&gt;&lt;p&gt;July 2023 (BBC News): Canada opens an investigation into Nike and Dynasty Gold over the alleged use of &lt;strong&gt;Uyghur forced labour&lt;/strong&gt;. The allegations concern China&#x27;s &lt;strong&gt;Xinjiang&lt;/strong&gt; region, which supplies a significant share of the world&#x27;s cotton. The slide also highlights the role of &lt;strong&gt;shareholders&lt;/strong&gt; in putting pressure on the company.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · The US Congress (sl. 85)&lt;/h4&gt;&lt;p&gt;The House &lt;em&gt;Select Committee on the Chinese Communist Party&lt;/em&gt; writes to Nike&#x27;s CEO (May 2023) asking for an account of compliance with the &lt;span class=&quot;term&quot;&gt;UFLPA&lt;/span&gt; (Uyghur Forced Labor Prevention Act): whether imported garments contain inputs from Xinjiang, what steps Nike has taken to examine its supply chain, which audits, which suppliers, which contractual obligations, what documentary evidence.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;This is an example of a public stakeholder demanding &lt;em&gt;accountability&lt;/em&gt;: the questions amount almost to a due diligence checklist.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Nike&#x27;s response (sl. 86)&lt;/h4&gt;&lt;blockquote&gt;“Nike is committed to ethical and responsible manufacturing and we uphold international labor standards… Nike does not source products from the XUAR and we have confirmed with our contract suppliers that they are not using textiles or spun yarn from the region.”&lt;cite&gt;Nike, statement on forced labor&lt;/cite&gt;&lt;/blockquote&gt;&lt;p&gt;Accompanied by the &lt;em&gt;Statement on Forced Labor, Human Trafficking and Modern Slavery&lt;/em&gt; (FY2022) and a specific document on the XUAR (Xinjiang Uyghur Autonomous Region).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · The codes (sl. 87)&lt;/h4&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;&lt;strong&gt;Nike Code of Conduct&lt;/strong&gt;: expectations of suppliers;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Code Leadership Standards&lt;/strong&gt;: detailed implementation requirements (work that is &lt;em&gt;safe, sustainable, respected, fair&lt;/em&gt;);&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Inside the Lines&lt;/strong&gt;: the code of conduct for employees.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · The FY2025 statement (sl. 90)&lt;/h4&gt;&lt;p&gt;The &lt;em&gt;Statement on Modern Slavery and Child Labor&lt;/em&gt; for fiscal year 2025 is published to comply with several laws: the UK Modern Slavery Act, the Australian Modern Slavery Act, the California Transparency in Supply Chains Act, and Canada&#x27;s Fighting Against Forced Labour and Child Labour in Supply Chains Act. “Forced labour” includes modern slavery, prison labour, debt bondage and trafficking.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;It shows how national &lt;em&gt;disclosure&lt;/em&gt; obligations push companies to report on their supply chain.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;6 · Manufacturing Map (sl. 91)&lt;/h4&gt;&lt;p&gt;A public map of the independent factories producing for Nike, with data on workers. This is &lt;strong&gt;supply chain transparency&lt;/strong&gt;: it allows NGOs, trade unions and journalists to verify.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;7 · Worker Voice (sl. 92)&lt;/h4&gt;&lt;p&gt;The &lt;strong&gt;Engagement and Wellbeing (EWB)&lt;/strong&gt; programme has two phases. Phase 1: suppliers, with an approved service provider, administer an &lt;strong&gt;anonymous&lt;/strong&gt; survey to a statistically significant sample of workers (76 questions, 7 categories: skill building, communication, health &amp;amp; safety, compensation, social connection, stress, respectful workplace). Phase 2: suppliers use the results to draw up an &lt;strong&gt;action plan&lt;/strong&gt; and must communicate them to workers within 20 days. By the end of FY25, 100% of strategic suppliers had taken part.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;8 · Human Rights and Labor Compliance Standards (sl. 93)&lt;/h4&gt;&lt;p&gt;Nike states that it draws on the Universal Declaration of Human Rights, the ILO Declaration, the &lt;strong&gt;UN Guiding Principles on Business and Human Rights&lt;/strong&gt; and the &lt;strong&gt;OECD Guidelines&lt;/strong&gt;, and offers the &lt;strong&gt;Speak Up Portal&lt;/strong&gt; for confidential reporting without retaliation. It acknowledges that “there is no finish line” in respecting human rights.&lt;/p&gt;&lt;/div&gt;
&lt;nav&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/nav&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Connection.&lt;/b&gt; Nike&#x27;s tools correspond to Yawar and Seuring&#x27;s three strategies (&lt;a href=&quot;#s-fw&quot;&gt;§4.4&lt;/a&gt;): statements, reports and the map are &lt;em&gt;communication strategies&lt;/em&gt;; the Code of Conduct, Code Leadership Standards and audits are &lt;em&gt;compliance strategies&lt;/em&gt;; Worker Voice and action plans with suppliers are &lt;em&gt;supplier development&lt;/em&gt;.&lt;/div&gt;

&lt;h3 id=&quot;s-scdef&quot;&gt;&lt;span class=&quot;n&quot;&gt;4.2&lt;/span&gt;Supply chain and supply chain management&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Supply chain · Christopher, 1992&lt;/span&gt;&lt;p&gt;The network of organisations involved, through &lt;strong&gt;upstream and downstream&lt;/strong&gt; linkages, in the different processes and activities that produce value in the form of products and services delivered to the ultimate consumer.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Supply chain management · Mentzer et al., 2001&lt;/span&gt;&lt;p&gt;The &lt;strong&gt;systemic, strategic&lt;/strong&gt; coordination of the traditional business functions and the tactics across these functions within a particular company and across businesses within the supply chain, for the purposes of improving the long-term performance of the individual companies and the supply chain as a whole.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn&quot; data-toggle=&quot;chainFig&quot; aria-pressed=&quot;false&quot;&gt;Show the extended supply chain&lt;/button&gt;&lt;/div&gt;
&lt;figure id=&quot;chainFig&quot;&gt;&lt;svg viewBox=&quot;0 0 800 120&quot; role=&quot;img&quot; aria-label=&quot;Direct and extended supply chain&quot;&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
&lt;g class=&quot;xn&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;30&quot; width=&quot;120&quot; height=&quot;50&quot; rx=&quot;9&quot; class=&quot;f-cbg s-c&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;64&quot; y=&quot;52&quot;&gt;Supplier&#x27;s&lt;/text&gt;&lt;text x=&quot;64&quot; y=&quot;68&quot;&gt;supplier&lt;/text&gt;&lt;/g&gt;
&lt;rect x=&quot;170&quot; y=&quot;30&quot; width=&quot;120&quot; height=&quot;50&quot; rx=&quot;9&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;230&quot; y=&quot;60&quot;&gt;Supplier&lt;/text&gt;
&lt;rect x=&quot;340&quot; y=&quot;26&quot; width=&quot;120&quot; height=&quot;58&quot; rx=&quot;9&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;60&quot; class=&quot;hl&quot;&gt;Organization&lt;/text&gt;
&lt;rect x=&quot;510&quot; y=&quot;30&quot; width=&quot;120&quot; height=&quot;50&quot; rx=&quot;9&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;60&quot;&gt;Customer&lt;/text&gt;
&lt;g class=&quot;xn&quot;&gt;&lt;rect x=&quot;676&quot; y=&quot;30&quot; width=&quot;120&quot; height=&quot;50&quot; rx=&quot;9&quot; class=&quot;f-cbg s-c&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;736&quot; y=&quot;52&quot;&gt;Customer&#x27;s&lt;/text&gt;&lt;text x=&quot;736&quot; y=&quot;68&quot;&gt;customer&lt;/text&gt;&lt;/g&gt;

&lt;h3 id=&quot;s-sc2&quot;&gt;&lt;span class=&quot;n&quot;&gt;4.3&lt;/span&gt;Social issues in the supply chain&lt;/h3&gt;
&lt;p&gt;Yawar and Seuring (2017) classify the social issues of the supply chain. Each tab gives the definition and the news case that the slide pairs with it.&lt;/p&gt;
&lt;div data-tabs&gt;&lt;div role=&quot;tablist&quot; aria-label=&quot;Social issues&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Labour conditions&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Child labour&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Human rights&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Health &amp;amp; safety&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Minority development&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Marginalised inclusion&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Gender&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Employees&#x27; working conditions: &lt;strong&gt;low wages, long working hours, the right to form trade unions, contract labour and exploitation&lt;/strong&gt;.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Case: Shein investigated its own factories after a report on working conditions, at an estimated cost of $15 million (Fortune, 2022).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Work by children &lt;strong&gt;under 15&lt;/strong&gt; that prevents school attendance, and work by &lt;strong&gt;under-18s&lt;/strong&gt; that is hazardous to physical or mental health.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Case: Mars, Nestlé and Hershey sued in the US over forced child labour on cocoa plantations in Côte d&#x27;Ivoire (The Guardian, 2021).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Rights inherent to all human beings, regardless of nationality, place of residence, sex, national or ethnic origin, colour, religion, language or any other status. At the core is &lt;strong&gt;equal rights without discrimination&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Physical and mental health related to occupational safety and hygiene; includes &lt;strong&gt;hazardous conditions&lt;/strong&gt; that may have long-term effects.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Case: Amazon cited by the US Department of Labor for exposing warehouse workers to safety hazards (CNBC, 2023).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;The development of populations regarded as &lt;strong&gt;minorities&lt;/strong&gt; on grounds of religion, race or ethnicity.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;The inclusion of groups neglected because of physical disability or left on the margins by society or the state; people living below the poverty line are considered marginalised.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Case: according to a UN expert, Amazon, DoorDash and Walmart trap workers in poverty (UN, 2023).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Equal treatment of &lt;strong&gt;women and transgender people&lt;/strong&gt;, with attention to their specific needs and equal rights at work.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Case: class action claiming that Disney owes female employees over $150 million in wages because of a pay gap (The Guardian, 2023).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Managing social issues · Yawar and Seuring, 2017 · sl. 100&lt;/span&gt;&lt;p&gt;It encompasses the decisions that &lt;strong&gt;prevent&lt;/strong&gt; the company from adopting unethical or socially unacceptable practices. However, what constitutes a “social issue” &lt;strong&gt;varies across stakeholders&lt;/strong&gt;, changes over time and depends on the conditions in which the company operates.&lt;/p&gt;&lt;/div&gt;
&lt;h4&gt;Why companies act (sl. 101)&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;External stakeholders&lt;/span&gt;&lt;p&gt;The media, NGOs and civil society have exposed unethical behaviour, pushing companies to adopt effective strategies.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Consumers&lt;/span&gt;&lt;p&gt;Poor management can trigger a &lt;em&gt;consumer backlash&lt;/em&gt; if expectations are not met.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Risk&lt;/span&gt;&lt;p&gt;Managing social and environmental issues is a way of &lt;strong&gt;reducing risk&lt;/strong&gt; (Klassen and Vereecke, 2012).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Regulation&lt;/span&gt;&lt;p&gt;New laws on health and safety (and today on due diligence) push companies to look at social issues in the supply chain.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Responsible supply chain actions · sl. 102&lt;/span&gt;&lt;p&gt;Actions initiated by a company to address social issues that are then &lt;strong&gt;accepted, adopted and implemented by the other members of the supply chain&lt;/strong&gt;. Different stakeholders make different demands, and the company must make decisions that meet the expectations of supply chain actors.&lt;/p&gt;&lt;/div&gt;

&lt;h3 id=&quot;s-fw&quot;&gt;&lt;span class=&quot;n&quot;&gt;4.4&lt;/span&gt;The Yawar and Seuring (2017) framework&lt;/h3&gt;
&lt;div data-hot=&quot;comm&quot; class=&quot;grid2&quot; style=&quot;align-items:start&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 520 430&quot; role=&quot;img&quot; aria-label=&quot;Conceptual framework for managing social issues in the supply chain&quot;&gt;
