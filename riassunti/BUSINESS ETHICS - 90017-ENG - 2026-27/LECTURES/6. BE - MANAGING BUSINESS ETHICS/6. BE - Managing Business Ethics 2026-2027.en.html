&lt;g data-k=&quot;perf&quot;&gt;&lt;rect class=&quot;hit f-card s-c&quot; x=&quot;150&quot; y=&quot;350&quot; width=&quot;220&quot; height=&quot;70&quot; rx=&quot;8&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;260&quot; y=&quot;374&quot; font-weight=&quot;600&quot;&gt;Performance outcomes&lt;/text&gt;&lt;text x=&quot;260&quot; y=&quot;394&quot;&gt;social · economic&lt;/text&gt;&lt;text x=&quot;260&quot; y=&quot;411&quot;&gt;buyer · supplier&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;&lt;/svg&gt;&lt;p class=&quot;hint&quot;&gt;Yawar and Seuring (2017, p. 624), sl. 103. Tap a box.&lt;/p&gt;&lt;/figure&gt;
&lt;div class=&quot;hbox&quot;&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;ext&quot;&gt;&lt;h4&gt;External stakeholders&lt;/h4&gt;&lt;p&gt;The media, NGOs, civil society, consumers, regulators: they raise issues and demand &lt;em&gt;legitimacy&lt;/em&gt; and &lt;em&gt;accountability&lt;/em&gt; regarding suppliers&#x27; practices.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;int&quot;&gt;&lt;h4&gt;Internal stakeholders&lt;/h4&gt;&lt;p&gt;Employees, management, shareholders: they require solutions to be feasible and efficient. External pressures increase the pressure on internal stakeholders (sl. 107).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;si&quot;&gt;&lt;h4&gt;Social issues&lt;/h4&gt;&lt;p&gt;Labour, child labour, human rights, health and safety, minorities, inclusion, gender (&lt;a href=&quot;#s-sc2&quot;&gt;§4.3&lt;/a&gt;). They are the starting point: stakeholder demands turn them into actions.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;comm&quot;&gt;&lt;h4&gt;(1) Communication strategies&lt;/h4&gt;&lt;p&gt;They serve to convey &lt;strong&gt;legitimacy and accountability&lt;/strong&gt; for responsible behaviour: responding to stakeholder concerns, building a loyal customer base, attracting responsible investment and reaping the benefits of CSR initiatives.&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;&lt;strong&gt;Corporate responsibility documents&lt;/strong&gt; (CRD) or &lt;strong&gt;sustainability reporting&lt;/strong&gt;: information on economic, environmental and social performance. The CRD is a &lt;em&gt;proactive&lt;/em&gt; statement of how stakeholder demands are integrated into operations; the report also encourages suppliers and others to act ethically.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Labelling&lt;/strong&gt;: a direct way of communicating product characteristics; it gains legitimacy, increases transparency and makes it possible to capitalise on ethical attributes in market niches.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;comp&quot;&gt;&lt;h4&gt;(2) Compliance strategies&lt;/h4&gt;&lt;p&gt;Mechanisms through which the company &lt;strong&gt;ensures&lt;/strong&gt; that supply chain partners implement stakeholder expectations.&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;&lt;strong&gt;Codes of conduct&lt;/strong&gt;: initiatives to build partnerships based on shared values and commitments.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Auditing&lt;/strong&gt;: verifies implementation and measures the degree of compliance with codes and standards; helps establish monitoring mechanisms, especially at weaker suppliers.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Monitoring&lt;/strong&gt;: the &lt;em&gt;control of suppliers&#x27; behaviour&lt;/em&gt; against the company&#x27;s expectations, communicated to stakeholders.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Codes and standards are the tools; auditing and monitoring ensure their implementation and measure supplier performance.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;sds&quot;&gt;&lt;h4&gt;(3) Supplier development strategies (SDS)&lt;/h4&gt;&lt;p&gt;Actions to &lt;strong&gt;improve, assist and train&lt;/strong&gt; suppliers, directly or indirectly: collaboration, training, specific investments, technical and financial assistance, education.&lt;/p&gt;&lt;p&gt;Value arises if the relationship grows in &lt;strong&gt;trust and commitment&lt;/strong&gt;: more information sharing, better economic performance, lower supplier switching and selection costs, lower monitoring and auditing costs.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;perf&quot;&gt;&lt;h4&gt;Performance outcomes&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Economic performance&lt;/strong&gt;: an increase in net value for shareholders through better market results. In a conventional supply chain it is measured in terms of &lt;em&gt;quality, dependability, flexibility, costs&lt;/em&gt;.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Social performance&lt;/strong&gt;: the measurement of social issues; mostly indirect, non-economic indicators (fair treatment, health and safety) that generate reputation and loyalty. It is &lt;strong&gt;difficult to measure&lt;/strong&gt;: issues are dynamic, there is a lack of composite indicators applicable across the whole supply chain, many companies pursue different strategies, and trust, transparency and culture play a crucial role.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Integrating strategies · sl. 109&lt;/span&gt;&lt;p&gt;The three strategies are &lt;strong&gt;not mutually exclusive&lt;/strong&gt; and are applied in very different ways (some compliance strategies require third-party certification). All of them serve to manage risk and the financial prosperity of the supply chain while responding to stakeholders, and they are interlinked: supplier development facilitates the implementation of codes and standards and auditing; reporting and labelling disseminate information about the codes. &lt;strong&gt;Each dimension is distinct but incomplete without the others.&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;quiz pM&quot;&gt;&lt;h3&gt;Self-check · Part IV&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;The programme works with suppliers to improve conditions: supplier development.&quot;&gt;&lt;p&gt;Nike&#x27;s Worker Voice programme (worker surveys and supplier action plans) is primarily a…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Communication strategy&lt;/button&gt;&lt;button&gt;Compliance strategy&lt;/button&gt;&lt;button data-ok&gt;Supplier development strategy&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;The extended supply chain includes the supplier&#x27;s suppliers and the customer&#x27;s customers.&quot;&gt;&lt;p&gt;The spinner who sells yarn to the fabric manufacturer that supplies Nike&#x27;s factory is part of the…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Direct supply chain&lt;/button&gt;&lt;button data-ok&gt;Extended supply chain&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Define the supply chain (Christopher) and supply chain management (Mentzer et al.).&lt;/summary&gt;&lt;div&gt;Supply chain: the network of organisations involved, through upstream and downstream linkages, in the processes and activities that produce value for the ultimate consumer. SCM: the systemic, strategic coordination of business functions within and across the companies in the supply chain to improve the long-term performance of the individual companies and of the supply chain as a whole.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What are the three families of responsible supply chain actions and their tools?&lt;/summary&gt;&lt;div&gt;Communication (reporting/CRD, labelling); compliance (codes of conduct/standards, auditing, monitoring); supplier development (direct and indirect SDS, trust, collaborative relationships).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is social performance difficult to measure?&lt;/summary&gt;&lt;div&gt;Because social issues are dynamic, composite indicators applicable across the whole supply chain are lacking, the supply chain comprises many companies with different strategies, and trust, transparency and cultural differences matter a great deal.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What makes the Nike case an example of upstream responsibility and accountability?&lt;/summary&gt;&lt;div&gt;The alleged abuses (forced labour in Xinjiang) would take place at distant-tier suppliers, not at Nike itself; yet public stakeholders (the Canadian government, the US Congress, shareholders) call on Nike to give an account. Nike responds with statements, codes, audits, factory transparency and worker programmes.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part pT&quot; id=&quot;approfondire&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Sources cited in the slides&lt;/div&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;For every author, text, law or standard cited in the slides, I searched the web for bibliographic details and a reliable link. &lt;strong&gt;All the entries below are &lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;&lt;/strong&gt;, except for the last group, which lists links already included in the slides. Where the search did not confirm something, this is stated.&lt;/p&gt;

&lt;h3&gt;Texts and studies&lt;/h3&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Crane, Matten, Glozer, Spence: &lt;em&gt;Business Ethics&lt;/em&gt;, 5th ed.&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Oxford University Press, 2019 · ISBN 978-0-19-881007-0 · cited in sl. 13 and 52&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; textbook on ethical theories and their application to stakeholders (shareholders, employees, consumers, suppliers, civil society, government), subtitled &lt;em&gt;Managing Corporate Citizenship and Sustainability in the Age of Globalization&lt;/em&gt;. &lt;strong&gt;Why it matters:&lt;/strong&gt; it is the source of the definition of a code of ethics and of the ethical dilemma in sl. 25. &lt;a href=&quot;https://www.oup.com.au/books/higher-education/business-marketing/9780198810070&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;oup.com.au&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Treviño, Weaver, Gibson, Toffler: “Managing Ethics and Legal Compliance: What Works and What Hurts”&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;California Management Review, 41(2), 1999, pp. 131–151 · sl. 25&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; a survey of employees at six large US companies. A values-based cultural approach works best; leadership commitment, fair treatment, rewards for ethical conduct and consistency between policy and action all matter. A programme perceived as a shield for top management is harmful. &lt;strong&gt;Why it matters:&lt;/strong&gt; it is the empirical basis for the idea that follow-through matters more than the code itself. &lt;a href=&quot;https://cmr.berkeley.edu/1999/02/41-2-managing-ethics-and-legal-compliance-what-works-and-what-hurts&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cmr.berkeley.edu&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Schwartz: “Effective Corporate Codes of Ethics: Perceptions of Code Users”&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Journal of Business Ethics, 55(4), 2004, pp. 321–341 (some sources give 323–343) · sl. 26&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; a study of how employees, managers and ethics officers perceive their companies&#x27; codes. &lt;strong&gt;Why it matters:&lt;/strong&gt; it is the source of the three conditions for effectiveness (writing, support, enforcement). &lt;a href=&quot;https://profiles.laps.yorku.ca/publications/effective-corporate-codes-of-ethics-perceptions-of-code-users/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;York University&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Hoffman, Driscoll, Painter-Morland (2001)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;sl. 27&lt;/div&gt;&lt;p&gt;The search &lt;strong&gt;did not find&lt;/strong&gt; the original text or confirm the quotation. The topic (codes combining values and rules) is discussed in Driscoll and Hoffman&#x27;s book &lt;em&gt;Ethics Matters: How to Implement Values-Driven Management&lt;/em&gt; (2000), cited in an Ethics Resource Center guide. For the exact source, check the bibliography of Crane et al.&#x27;s textbook. &lt;a href=&quot;https://www.ethics.org/wp-content/uploads/resources/Creating-A-Workable-Company-Code-of-Ethics.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ethics.org (ERC guide)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Donaldson: “Values in Tension: Ethics Away from Home”&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Harvard Business Review, 74(5), Sept.–Oct. 1996, pp. 48–62 · sl. 29&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; how managers abroad should behave when faced with local practices that seem unethical; rejects both relativism and absolutism; examples of business gift-giving in Japan and wages in developing countries. &lt;strong&gt;Why it matters:&lt;/strong&gt; it is the “possible solution” for global codes. &lt;a href=&quot;https://hbr.org/1996/09/values-in-tension-ethics-away-from-home&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;hbr.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Gray, Owen, Adams: &lt;em&gt;Accounting &amp;amp; Accountability&lt;/em&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Prentice Hall, 1996 · ISBN 9780131758605 · sl. 62, 64&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; a classic text on the role and critical evaluation of corporate social and environmental reporting (&lt;em&gt;Changes and Challenges in Corporate Social and Environmental Reporting&lt;/em&gt;). &lt;strong&gt;Why it matters:&lt;/strong&gt; it is the source of the definitions of accountability and social accounting. &lt;a href=&quot;https://eprints.gla.ac.uk/95486&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Glasgow&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Ebrahim (2003): accountability in non-profit organisations&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Two articles from 2003: “Making Sense of Accountability”, &lt;em&gt;Nonprofit Management and Leadership&lt;/em&gt; 14(2), pp. 191–212; “Accountability in Practice: Mechanisms for NGOs”, &lt;em&gt;World Development&lt;/em&gt; 31(5), pp. 813–829 · sl. 62&lt;/div&gt;&lt;p&gt;The quotation in the slide (p. 194) falls within the page range of the first article, which is therefore probably “2003b”. &lt;strong&gt;Contents:&lt;/strong&gt; the first analyses the accountability of non-profits in the Global North and South; the second examines five mechanisms (reports, evaluations, participation, self-regulation, social audits) and shows that accountability to funders predominates. &lt;strong&gt;Why it matters:&lt;/strong&gt; it adds the internal dimension of accountability. &lt;a href=&quot;https://www.scilit.net/publications/c42560a71524aba44ad7b04f1c4187dd&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scilit (NML)&lt;/a&gt; · &lt;a href=&quot;https://fletcher.tufts.edu/research/research-publications/accountability-practice-mechanisms-ngos&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Tufts (World Development)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Christopher: &lt;em&gt;Logistics and Supply Chain Management&lt;/em&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;1st ed. 1992 (Financial Times/Pitman), later editions Pearson · sl. 95&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; a reference textbook on logistics and supply chains as value-creating networks. &lt;strong&gt;Why it matters:&lt;/strong&gt; source of the definition of supply chain. The search confirms the year 1992; the publisher of the first edition comes from a single catalogue record. &lt;a href=&quot;https://www.oreilly.com/library/view/logistics-and-supply/9780273731139/chapter-01.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;O&#x27;Reilly (Pearson ed.)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Mentzer et al.: “Defining Supply Chain Management”&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Journal of Business Logistics, 22(2), 2001, pp. 1–25 · sl. 96-97&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; a review and synthesis of definitions of SCM, with a conceptual model and a unified definition; among the most cited articles in the field. &lt;strong&gt;Why it matters:&lt;/strong&gt; definition of SCM and the distinction between direct and extended supply chains. &lt;a href=&quot;https://doi.org/10.1002/j.2158-1592.2001.tb00001.x&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Yawar, Seuring: “Management of Social Issues in Supply Chains: A Literature Review…”&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Journal of Business Ethics, 141(3), 2017, pp. 621–643 · online since 2015 · sl. 98-111&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; a structured literature review linking CSR and supply chain management; classifies social issues and actions into communication, compliance and supplier development, with a conceptual framework. &lt;strong&gt;Why it matters:&lt;/strong&gt; it is the main reference for Part IV, listed in sl. 111 as a reading. &lt;a href=&quot;https://doi.org/10.1007/s10551-015-2719-9&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI&lt;/a&gt; · &lt;a href=&quot;https://ideas.repec.org/a/kap/jbuset/v141y2017i3d10.1007_s10551-015-2719-9.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Klassen, Vereecke: “Social issues in supply chains: Capabilities link responsibility, risk (opportunity), and performance”&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;International Journal of Production Economics, 140(1), 2012, pp. 103–115 · sl. 101&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; case studies of five multinationals; identifies three social management capabilities (monitoring, collaboration, innovation) and their links with risk, opportunity and performance. &lt;strong&gt;Why it matters:&lt;/strong&gt; it supports the idea that managing social issues reduces risk. &lt;a href=&quot;https://ideas.repec.org/a/eee/proeco/v140y2012i1p103-115.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Sardà, Pogutz: &lt;em&gt;Corporate Sustainability in the 21st Century&lt;/em&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Routledge, 2019 (copyright; on sale from December 2018) · sl. 4&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; sustainability strategies and the value chain, with the “Business In Nature” framework; chapters on sustainable supply chains and sustainable products and services. &lt;strong&gt;Why it matters:&lt;/strong&gt; source of the upstream/downstream figure. &lt;a href=&quot;https://www.routledge.com/products/9781138744592&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;routledge.com&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Iatridis, Schroeder: &lt;em&gt;Responsible Research and Innovation in Industry: The Case for Corporate Responsibility Tools&lt;/em&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Springer (SpringerBriefs), © 2016, published September 2015 · sl. 52&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; how to use existing corporate responsibility tools (from ISO 9001 onwards) to implement responsible research and innovation. &lt;strong&gt;Why it matters:&lt;/strong&gt; source of the ISO 14001 / EMAS comparison. &lt;a href=&quot;https://www.springer.com/us/book/9783319216928&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;springer.com&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Laws and directives&lt;/h3&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Directive 2014/95/EU (NFRD)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;OJ L 330, 15.11.2014 · sl. 66&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; requirement for a non-financial statement for large public-interest entities with more than 500 employees; amends Directive 2013/34/EU. &lt;strong&gt;Why it matters:&lt;/strong&gt; the first step towards mandatory sustainability reporting in the EU. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2014/95/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Directive (EU) 2022/2464 (CSRD) and ESRS&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;sl. 67&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; the sustainability reporting directive with the principle of double materiality; the ESRS (delegated regulation of 31 July 2023) specify its content. &lt;strong&gt;Why it matters:&lt;/strong&gt; it replaces and extends the NFRD. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2022/2464/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt; · &lt;a href=&quot;https://www.wu.ac.at/reporting/sure/legislation/csrd&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WU Vienna&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Directive (EU) 2024/1760 (CSDDD) and Directive (EU) 2026/470 (Omnibus I)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;2024/1760 signed on 13.6.2024, published on 5.7.2024 · sl. 70-72&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; human rights and environmental due diligence obligations for large EU and non-EU companies; the 2026 Omnibus raised the thresholds and postponed the deadlines (transposition 26.7.2028, application 26.7.2029). &lt;strong&gt;Why it matters:&lt;/strong&gt; it turns due diligence from good practice into a legal obligation. &lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2024/1760/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt; · &lt;a href=&quot;https://www.cov.com/en/news-and-insights/insights/2026/02/eu-csddd-csrd-omnibus-published-in-official-journal-transposition-delegated-acts-and-guidelines-are-next&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Covington (Omnibus summary)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Regulation (EC) 1221/2009 (EMAS)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;adopted on 25.11.2009 · sl. 50&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; voluntary Community eco-management and audit scheme, also open to non-EU organisations, with rules on accreditation and verifiers. &lt;strong&gt;Why it matters:&lt;/strong&gt; the legal basis of EMAS. &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2009/1221/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Uyghur Forced Labor Prevention Act (UFLPA, USA)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;in force since 21 June 2022 · sl. 85&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; a &lt;em&gt;rebuttable presumption&lt;/em&gt; that goods produced wholly or in part in Xinjiang, or by listed entities, are made with forced labour and are therefore barred from import; the importer can overcome it only with “clear and convincing” evidence and adequate due diligence. &lt;strong&gt;Why it matters:&lt;/strong&gt; it explains the congressional pressure on Nike. &lt;a href=&quot;https://www.cbp.gov/sites/default/files/assets/documents/2022-Jun/CBP_Guidance_for_Importers_for_UFLPA_13_June_2022.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CBP (guidance for importers)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Standards, certifications, guidelines&lt;/h3&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;UN Global Compact: the ten principles&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;sl. 29-31&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; ten principles on human rights (1-2), labour (3-6), environment (7-9) and anti-corruption (10); participants publish an annual &lt;em&gt;Communication on Progress&lt;/em&gt;. &lt;strong&gt;Why it matters:&lt;/strong&gt; an example of a global minimum ethical standard. &lt;a href=&quot;https://unglobalcompact.org/what-is-gc/mission/principles&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;unglobalcompact.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;OECD Guidelines for Multinational Enterprises on Responsible Business Conduct&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;update of 8 June 2023 · sl. 29&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; recommendations from governments to multinationals; the 2023 update (the first since 2011) strengthens due diligence, adds climate and biodiversity, extends protection to workers across the entire value chain and strengthens the National Contact Points. &lt;strong&gt;Why it matters:&lt;/strong&gt; the other example of a global minimum standard, also referenced by Nike. &lt;a href=&quot;https://www.business-humanrights.org/en/latest-news/2023-update-of-the-oecd-guidelines-for-multinational-enterprises-on-responsible-business-conduct&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Business &amp;amp; Human Rights Resource Centre&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;ISO 14001&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;current edition ISO 14001:2026 (April 2026) · sl. 48, 52&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; requirements for an environmental management system; the new edition adds a clause on planning of changes and strengthens the life-cycle perspective. &lt;strong&gt;Why it matters:&lt;/strong&gt; the most widespread environmental standard. &lt;a href=&quot;https://www.iso.org/news/2026/04/iso-14001-2026-published&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;iso.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;SA8000&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Social Accountability International, since 1997; current version SA8000:2026 · sl. 53&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; a certifiable standard on workers&#x27; rights based on ILO norms and the Universal Declaration, with a management system approach; SAAS oversees the certification bodies. &lt;a href=&quot;https://sa-intl.org/resources/sa8000-standard/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sa-intl.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;B Corp (B Lab)&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;sl. 40, 46&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; whole-company certification; from 2026, new standards with minimum requirements per Impact Topic replace the 80-point threshold. &lt;a href=&quot;https://www.bcorporation.net/en-us/news/press/preliminary-consultation-suggests-new-b-corp-standards-are-ambitious-yet-attainable/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bcorporation.net&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;GRI Standards&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;revised Universal Standards, effective from 1 January 2023 · sl. 41, 55&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; sustainability reporting standards in three series (Universal, Sector, Topic); the Universal Standards (GRI 1, 2, 3) set out concepts, general disclosures and the process for identifying material topics based on impacts. &lt;strong&gt;Why it matters:&lt;/strong&gt; the most widely used standard for sustainability reports. &lt;a href=&quot;https://www.globalreporting.org/standards/standards-development/universal-standards/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;globalreporting.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;SASB Standards&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;now overseen by the ISSB of the IFRS Foundation (since 2022) · sl. 41, 55&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; standards for 77 industries (in 11 sectors) on the sustainability issues most relevant to investors. &lt;strong&gt;Why it matters:&lt;/strong&gt; it represents the financial materiality perspective. &lt;a href=&quot;https://sasb.ifrs.org/standards/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sasb.ifrs.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Ecolabel Index&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;sl. 41&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; a global directory of ecolabels, run by Big Room Inc. since 2007. See the note in §3.2 on the number of schemes. &lt;a href=&quot;https://www.ecolabelindex.com/about/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ecolabelindex.com&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Reports, initiatives and documentaries&lt;/h3&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;World Benchmarking Alliance: “Are companies ready for the EU supply chain law?”&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Richard Gardiner, July 2024 · sl. 73&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; an assessment of readiness for the CSDDD based on the Social Benchmark of around 2,000 companies. &lt;strong&gt;Why it matters:&lt;/strong&gt; source of the 80% / 9% / 87% figures. &lt;a href=&quot;https://www.worldbenchmarkingalliance.org/news/are-companies-ready-for-the-eu-supply-chain-law&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;worldbenchmarkingalliance.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Institute of Business Ethics: &lt;em&gt;Corporate Ethics Policies and Programmes: 2016 UK and Continental Europe survey&lt;/em&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;published on 26 January 2017 · sl. 13&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; a triennial survey of the ethics programmes of FTSE 350 and continental European companies (training, codes, role of the board). &lt;strong&gt;Why it matters:&lt;/strong&gt; source of the figure on the prevalence of codes. &lt;a href=&quot;https://www.ibe.org.uk/resource/ibe-survey-report-corporate-ethics-policies-and-programmes-2016-uk-and-continental-europe-survey-pdf.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ibe.org.uk&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;em&gt;The True Cost&lt;/em&gt;&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;documentary by Andrew Morgan, 2015 · sl. 5&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Contents:&lt;/strong&gt; the human and environmental cost of fast fashion; made after the collapse of Rana Plaza in Bangladesh (2013), which killed more than a thousand workers. &lt;strong&gt;Why it matters:&lt;/strong&gt; it is the starting point for the class activity. &lt;a href=&quot;https://en.wikipedia.org/wiki/The_True_Cost&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Company documents and sources already linked in the slides&lt;/h3&gt;
&lt;p class=&quot;gloss&quot;&gt;These links are given in the slides and have not been re-checked: some may have changed.&lt;/p&gt;
&lt;ul class=&quot;tight&quot; style=&quot;font-size:.92rem&quot;&gt;
&lt;li&gt;GE, &lt;em&gt;The Spirit &amp;amp; The Letter&lt;/em&gt;: &lt;a href=&quot;https://www.ge.com/sites/default/files/S&amp;amp;L_Booklet_English_0.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ge.com&lt;/a&gt; (sl. 15-17)&lt;/li&gt;
&lt;li&gt;Eni, Code of Ethics: &lt;a href=&quot;https://www.eni.com/en-IT/governance/rules/code-of-ethics.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;eni.com&lt;/a&gt; (sl. 18)&lt;/li&gt;
&lt;li&gt;Nvidia, Code of Conduct: &lt;a href=&quot;https://images.nvidia.com/aem-dam/en-zz/Solutions/about-us/NVIDIA-Code-of-Conduct-External.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;nvidia.com&lt;/a&gt;; board statement: &lt;a href=&quot;https://investor.nvidia.com/news/press-release-details/2026/Statement-from-NVIDIA-Board-of-Directors/default.aspx&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;investor.nvidia.com&lt;/a&gt; (sl. 22-23)&lt;/li&gt;
&lt;li&gt;European Commission, corporate sustainability due diligence: &lt;a href=&quot;https://commission.europa.eu/business-economy-euro/doing-business-eu/sustainability-due-diligence-responsible-business/corporate-sustainability-due-diligence_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;commission.europa.eu&lt;/a&gt; (sl. 70)&lt;/li&gt;
&lt;li&gt;Nike, statement on forced labor: &lt;a href=&quot;https://about.nike.com/en/newsroom/statements/statement-on-forced-labor&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;about.nike.com&lt;/a&gt;; Manufacturing Map: &lt;a href=&quot;https://manufacturingmap.nikeinc.com/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;manufacturingmap.nikeinc.com&lt;/a&gt;; Worker Voice: &lt;a href=&quot;https://about.nike.com/en/mission/initiatives/worker-voice&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;about.nike.com&lt;/a&gt;; Human Rights and Labor Compliance Standards: &lt;a href=&quot;https://about.nike.com/en/resources/human-rights-and-labor-compliance-standards&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;about.nike.com&lt;/a&gt; (sl. 86-93)&lt;/li&gt;

&lt;li&gt;Video on sustainable procurement listed in sl. 111: &lt;a href=&quot;https://www.youtube.com/watch?v=t1P3lXP7iXY&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com&lt;/a&gt;&lt;/li&gt;
