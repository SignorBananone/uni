&lt;section class=&quot;part pA&quot; id=&quot;p1&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Part I · sl. 2–9&lt;/div&gt;&lt;h2&gt;Diffused responsibility and the management of ethics&lt;/h2&gt;&lt;/div&gt;

&lt;h3 id=&quot;s-recap&quot;&gt;&lt;span class=&quot;n&quot;&gt;1.1&lt;/span&gt;Where we are in the course&lt;/h3&gt;
&lt;p&gt;The &lt;em&gt;Recap&lt;/em&gt; slide (sl. 2) summarises the path covered so far and shows the shift made in this lecture: from theories to &lt;strong&gt;tools&lt;/strong&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 860 120&quot; role=&quot;img&quot; aria-label=&quot;Course pathway&quot;&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;5&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;66&quot; rx=&quot;10&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;100&quot; y=&quot;48&quot;&gt;Introduction of&lt;/text&gt;&lt;text x=&quot;100&quot; y=&quot;66&quot;&gt;business ethics&lt;/text&gt;
&lt;rect x=&quot;215&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;66&quot; rx=&quot;10&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;42&quot;&gt;Evaluating: normative&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;60&quot;&gt;ethical theories&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;78&quot; class=&quot;f-mut&quot; font-size=&quot;11&quot;&gt;(why is it right?)&lt;/text&gt;
&lt;rect x=&quot;425&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;66&quot; rx=&quot;10&quot; class=&quot;f-card s-rule&quot;/&gt;&lt;text x=&quot;525&quot; y=&quot;40&quot;&gt;Framing: stakeholder&lt;/text&gt;&lt;text x=&quot;525&quot; y=&quot;57&quot;&gt;theories, purpose, CSR,&lt;/text&gt;&lt;text x=&quot;525&quot; y=&quot;74&quot;&gt;social connection resp.&lt;/text&gt;
&lt;rect x=&quot;650&quot; y=&quot;12&quot; width=&quot;205&quot; height=&quot;82&quot; rx=&quot;12&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;752&quot; y=&quot;42&quot; class=&quot;hl&quot; font-size=&quot;15&quot;&gt;Managing&lt;/text&gt;&lt;text x=&quot;752&quot; y=&quot;61&quot; class=&quot;hl&quot; font-size=&quot;15&quot;&gt;business ethics&lt;/text&gt;&lt;text x=&quot;752&quot; y=&quot;80&quot; class=&quot;hl&quot; font-size=&quot;12&quot;&gt;tools &amp;amp; techniques&lt;/text&gt;
&lt;/g&gt;
&lt;g class=&quot;s-mut&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M195 53h20M405 53h20M625 53h25&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;The three previous stages (sl. 2) and today&#x27;s lecture. The titles of the other lectures come from this slide: the other files in the &lt;code&gt;corso/&lt;/code&gt; folder could not be accessed in this session, so links to other lectures are based solely on what is shown in the Recap.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;In practice: ethical theories tell us &lt;em&gt;what&lt;/em&gt; is right, while stakeholder theory and CSR (&lt;span class=&quot;gloss&quot;&gt;Corporate Social Responsibility&lt;/span&gt;) tell us &lt;em&gt;to whom&lt;/em&gt; the company is responsible. The question now is: &lt;strong&gt;how does a company organise itself to behave ethically in a systematic and demonstrable way?&lt;/strong&gt;&lt;/p&gt;

&lt;h3 id=&quot;s-diff&quot;&gt;&lt;span class=&quot;n&quot;&gt;1.2&lt;/span&gt;Diffusion of responsibility&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Diffusion of responsibility&lt;/span&gt; means that a company&#x27;s responsibility does not stop at the factory gates: it extends &lt;strong&gt;upstream&lt;/strong&gt; to suppliers, &lt;strong&gt;downstream&lt;/strong&gt; to the use of products, &lt;strong&gt;back in time&lt;/strong&gt; to past events and &lt;strong&gt;forward&lt;/strong&gt; to changing the system (sl. 3).&lt;/p&gt;
&lt;div data-hot=&quot;up&quot; class=&quot;grid2&quot; style=&quot;align-items:start&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 360&quot; role=&quot;img&quot; aria-label=&quot;Four directions of responsibility&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; class=&quot;f-c&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;g class=&quot;s-c&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;line x1=&quot;320&quot; y1=&quot;66&quot; x2=&quot;320&quot; y2=&quot;145&quot;/&gt;&lt;line x1=&quot;320&quot; y1=&quot;294&quot; x2=&quot;320&quot; y2=&quot;215&quot;/&gt;&lt;line x1=&quot;192&quot; y1=&quot;180&quot; x2=&quot;245&quot; y2=&quot;180&quot;/&gt;&lt;line x1=&quot;392&quot; y1=&quot;180&quot; x2=&quot;446&quot; y2=&quot;180&quot;/&gt;&lt;/g&gt;
&lt;rect x=&quot;250&quot; y=&quot;150&quot; width=&quot;140&quot; height=&quot;60&quot; rx=&quot;12&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;187&quot; text-anchor=&quot;middle&quot; class=&quot;serif hl&quot; font-size=&quot;22&quot;&gt;Company&lt;/text&gt;
&lt;g font-size=&quot;15&quot; text-anchor=&quot;middle&quot;&gt;
&lt;g data-k=&quot;up&quot;&gt;&lt;rect class=&quot;hit f-cbg s-c&quot; x=&quot;210&quot; y=&quot;12&quot; width=&quot;220&quot; height=&quot;50&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;34&quot;&gt;Upstream&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;52&quot; font-size=&quot;12&quot;&gt;suppliers, sweatshops&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;down&quot;&gt;&lt;rect class=&quot;hit f-cbg s-c&quot; x=&quot;210&quot; y=&quot;298&quot; width=&quot;220&quot; height=&quot;50&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;320&quot;&gt;Downstream&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;338&quot; font-size=&quot;12&quot;&gt;product use&lt;/text&gt;&lt;/g&gt;

&lt;g data-k=&quot;soc&quot;&gt;&lt;rect class=&quot;hit f-cbg s-c&quot; x=&quot;450&quot; y=&quot;155&quot; width=&quot;184&quot; height=&quot;50&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;542&quot; y=&quot;177&quot;&gt;Social connection&lt;/text&gt;&lt;text x=&quot;542&quot; y=&quot;195&quot; font-size=&quot;12&quot;&gt;changing the system&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;p class=&quot;hint&quot;&gt;Tap the four directions.&lt;/p&gt;
&lt;/figure&gt;
&lt;div class=&quot;hbox&quot;&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;up&quot;&gt;&lt;h4&gt;Upstream responsibility&lt;/h4&gt;&lt;p&gt;Responsibility for what happens &lt;strong&gt;upstream&lt;/strong&gt;, at suppliers and sub-suppliers. The typical case is &lt;span class=&quot;term&quot;&gt;sweatshops&lt;/span&gt;: factories with extremely low wages, excessive working hours and unsafe conditions.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Examples from the slides:&lt;/strong&gt; Starbucks and Fair Trade coffee; Nike and sub-contractors&#x27; workers; the apparel industry.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Revisited in Part IV (Nike case, Yawar &amp;amp; Seuring).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;down&quot;&gt;&lt;h4&gt;Downstream responsibility&lt;/h4&gt;&lt;p&gt;Responsibility for what happens &lt;strong&gt;downstream&lt;/strong&gt;, i.e. for how products are used by customers and consumers: product safety, weapons, gaming.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Examples from the slides:&lt;/strong&gt; IBM and the Nazi regime; Ford and Iveco and executions in China. In both cases the question is how far the responsibility of those who &lt;em&gt;sell&lt;/em&gt; a technology extends to the use others make of it.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;hist&quot;&gt;&lt;h4&gt;Historical responsibility&lt;/h4&gt;&lt;p&gt;Responsibility for &lt;strong&gt;past events&lt;/strong&gt;, even distant ones, that the company (or its predecessors) caused or benefited from.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Example from the slides:&lt;/strong&gt; Ikea and East Germany (GDR). &lt;span class=&quot;gloss&quot;&gt;Context not included in the slides: the case concerns the use, in the 1970s–80s, of prison labour in the production of furniture for Ikea, admitted by the company in 2012.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;soc&quot;&gt;&lt;h4&gt;Social connection responsibility&lt;/h4&gt;&lt;p&gt;A &lt;strong&gt;forward-looking&lt;/strong&gt; perspective: the point is not to identify who is to blame for a harm, but to help &lt;strong&gt;change the system&lt;/strong&gt; that produces structural injustice, because one is connected to it.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Examples from the slides:&lt;/strong&gt; fair trade, slow food.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;Concept introduced in the previous lecture on CSR and social connection responsibility (sl. 2).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Class activity: how do fast fashion companies respond to criticism? (sl. 5-6)&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Task&lt;/span&gt;&lt;ol class=&quot;tight&quot;&gt;&lt;li&gt;In small groups, choose a fast fashion company.&lt;/li&gt;&lt;li&gt;Search the company website and reliable online sources.&lt;/li&gt;&lt;li&gt;Find documents or statements on the issues raised by the documentary &lt;em&gt;The True Cost&lt;/em&gt;: exploitation, low wages, unsafe working conditions, pollution.&lt;/li&gt;&lt;li&gt;Present the documents: &lt;em&gt;what type of document is it? who produced it? for what purpose? what information does it provide?&lt;/em&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Discussion&lt;/span&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Did you find all the information you were looking for?&lt;/li&gt;&lt;li&gt;Were you convinced by the company&#x27;s arguments?&lt;/li&gt;&lt;li&gt;What information or evidence was missing?&lt;/li&gt;&lt;li&gt;What could the company do to improve its response and practices?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Hint: documents you might find (and where they are explained on this page)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;This guide is not in the slides: it links the activity to the tools covered in the lecture.&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Employee &lt;strong&gt;code of conduct&lt;/strong&gt; and &lt;strong&gt;supplier code of conduct&lt;/strong&gt; → &lt;a href=&quot;#s-codes&quot;&gt;§2.2&lt;/a&gt;&lt;/li&gt;&lt;li&gt;Process or product &lt;strong&gt;certifications&lt;/strong&gt; → &lt;a href=&quot;#s-cert&quot;&gt;§3.2&lt;/a&gt;&lt;/li&gt;&lt;li&gt;Supplier &lt;strong&gt;audit&lt;/strong&gt; results, % of suppliers audited → &lt;a href=&quot;#s-audit&quot;&gt;§3.6&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Sustainability report&lt;/strong&gt; or sustainability statement → &lt;a href=&quot;#s-acc&quot;&gt;§3.7&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Modern slavery statement&lt;/strong&gt;, list of factories (e.g. a manufacturing map) → &lt;a href=&quot;#s-sc&quot;&gt;§4.1&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3 id=&quot;s-gov&quot;&gt;&lt;span class=&quot;n&quot;&gt;1.3&lt;/span&gt;What is business ethics management?&lt;/h3&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Definition · sl. 7&lt;/span&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Business ethics management&lt;/span&gt; is the direct attempt to formally or informally manage ethical issues or problems through &lt;strong&gt;specific policies, practices and programmes&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;Good intentions are not enough: concrete tools are needed, and they need to operate in a continuous cycle. The slides pair the definition with the &lt;span class=&quot;term&quot;&gt;PDCA&lt;/span&gt; cycle (Plan–Do–Check–Act): plan, implement, check, correct, and start again. You will meet it again in environmental management systems (&lt;a href=&quot;#s-ems&quot;&gt;§3.1&lt;/a&gt;).&lt;/p&gt;
&lt;div data-hot=&quot;m&quot; class=&quot;grid2&quot; style=&quot;align-items:start&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 420&quot; role=&quot;img&quot; aria-label=&quot;Typical components of business ethics management&quot;&gt;
&lt;ellipse cx=&quot;320&quot; cy=&quot;210&quot; rx=&quot;125&quot; ry=&quot;62&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; class=&quot;serif hl&quot; font-size=&quot;19&quot;&gt;Business ethics&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;228&quot; text-anchor=&quot;middle&quot; class=&quot;serif hl&quot; font-size=&quot;19&quot;&gt;management&lt;/text&gt;
&lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;

&lt;g data-k=&quot;c&quot;&gt;&lt;rect class=&quot;hit f-cbg s-c&quot; x=&quot;391&quot; y=&quot;61&quot; width=&quot;128&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;455&quot; y=&quot;86&quot;&gt;Codes of ethics&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;r&quot;&gt;&lt;rect class=&quot;hit f-cbg s-c&quot; x=&quot;475&quot; y=&quot;141&quot; width=&quot;128&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;539&quot; y=&quot;158&quot;&gt;Risk analysis&lt;/text&gt;&lt;text x=&quot;539&quot; y=&quot;173&quot;&gt;and management&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;dd&quot;&gt;&lt;rect class=&quot;hit f-cbg s-c&quot; x=&quot;475&quot; y=&quot;239&quot; width=&quot;128&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;539&quot; y=&quot;264&quot;&gt;Due diligence&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;o&quot;&gt;&lt;rect class=&quot;hit f-cbg s-c&quot; x=&quot;391&quot; y=&quot;319&quot; width=&quot;128&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;455&quot; y=&quot;336&quot;&gt;Ethics managers,&lt;/text&gt;&lt;text x=&quot;455&quot; y=&quot;351&quot;&gt;officers, committees&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;ce&quot;&gt;&lt;rect class=&quot;hit f-cbg s-c&quot; x=&quot;256&quot; y=&quot;350&quot; width=&quot;128&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;375&quot;&gt;Certifications&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;ea&quot;&gt;&lt;rect class=&quot;hit f-cbg s-c&quot; x=&quot;121&quot; y=&quot;319&quot; width=&quot;128&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;185&quot; y=&quot;344&quot;&gt;External audit&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;tr&quot;&gt;&lt;rect class=&quot;hit f-cbg s-c&quot; x=&quot;37&quot; y=&quot;239&quot; width=&quot;128&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;101&quot; y=&quot;256&quot;&gt;Ethics education&lt;/text&gt;&lt;text x=&quot;101&quot; y=&quot;271&quot;&gt;and training&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;st&quot;&gt;&lt;rect class=&quot;hit f-cbg s-c&quot; x=&quot;37&quot; y=&quot;141&quot; width=&quot;128&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;101&quot; y=&quot;158&quot;&gt;Stakeholder&lt;/text&gt;&lt;text x=&quot;101&quot; y=&quot;173&quot;&gt;dialogue, partnership&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;ar&quot;&gt;&lt;rect class=&quot;hit f-cbg s-c&quot; x=&quot;121&quot; y=&quot;61&quot; width=&quot;128&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;185&quot; y=&quot;78&quot;&gt;Accounting&lt;/text&gt;&lt;text x=&quot;185&quot; y=&quot;93&quot;&gt;and reporting&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;p class=&quot;hint&quot;&gt;Typical components (sl. 7): tap an element.&lt;/p&gt;
&lt;/figure&gt;
&lt;div class=&quot;hbox&quot;&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;m&quot;&gt;&lt;h4&gt;Mission or values statements&lt;/h4&gt;&lt;p&gt;Concise statements of what the company is and what it believes in. They set the direction for all the other tools. → &lt;a href=&quot;#s-pmv&quot;&gt;§2.1&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;c&quot;&gt;&lt;h4&gt;Codes of ethics&lt;/h4&gt;&lt;p&gt;Voluntary statements committing the organisation to values and behaviours. The most widespread tool. → &lt;a href=&quot;#s-codes&quot;&gt;§2.2&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;r&quot;&gt;&lt;h4&gt;Risk analysis and management&lt;/h4&gt;&lt;p&gt;Identifying where the company risks causing (or suffering) harm for ethical, social or environmental reasons, and deciding how to reduce those risks. Managing social issues well reduces risk (Klassen and Vereecke, 2012, &lt;a href=&quot;#s-sc2&quot;&gt;§4.3&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;dd&quot;&gt;&lt;h4&gt;Due diligence&lt;/h4&gt;&lt;p&gt;An ongoing process through which the company &lt;strong&gt;identifies, prevents, mitigates and remedies&lt;/strong&gt; adverse impacts on human rights and the environment, including in its supply chain. Today it is also a legal obligation under EU law (CSDDD). → &lt;a href=&quot;#s-csddd&quot;&gt;§3.8&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;o&quot;&gt;&lt;h4&gt;Ethics managers, officers and committees&lt;/h4&gt;&lt;p&gt;People and bodies explicitly tasked with overseeing ethics: an &lt;em&gt;ethics officer&lt;/em&gt;, a board ethics committee. They give the programme someone who is accountable for it.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;ce&quot;&gt;&lt;h4&gt;Certifications&lt;/h4&gt;&lt;p&gt;Formal attestations, issued by a third party, of conformity with a standard (ISO 14001, SA8000, Fairtrade…). → &lt;a href=&quot;#s-cert&quot;&gt;§3.2&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;ea&quot;&gt;&lt;h4&gt;External audit&lt;/h4&gt;&lt;p&gt;Independent verification by external parties: financial statements, sustainability information, suppliers. → &lt;a href=&quot;#s-audit&quot;&gt;§3.6&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;tr&quot;&gt;&lt;h4&gt;Ethics education and training&lt;/h4&gt;&lt;p&gt;Training so that people know the code and can recognise an ethical dilemma. According to Schwartz (2004) it is one of the pillars of code effectiveness. → &lt;a href=&quot;#s-eff&quot;&gt;§2.3&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;st&quot;&gt;&lt;h4&gt;Stakeholder consultation, dialogue and partnership programs&lt;/h4&gt;&lt;p&gt;Listening to and engaging those affected by the company&#x27;s decisions. Central to the sustainability accounting process. → &lt;a href=&quot;#s-acc&quot;&gt;§3.7&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;ar&quot;&gt;&lt;h4&gt;Accounting and reporting&lt;/h4&gt;&lt;p&gt;Measuring and communicating social and environmental impacts: the tool of &lt;em&gt;accountability&lt;/em&gt; (giving account). → &lt;a href=&quot;#s-acc&quot;&gt;§3.7&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Governance for ethical commitment (sl. 8-9)&lt;/h4&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Definition · sl. 8&lt;/span&gt;&lt;p&gt;Good &lt;span class=&quot;term&quot;&gt;corporate governance&lt;/span&gt; (the system by which a company is directed and controlled) means that &lt;strong&gt;disclosure&lt;/strong&gt; and &lt;strong&gt;transparency&lt;/strong&gt; processes are followed so as to provide all stakeholders with precise and accurate information about the company.&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;In the corporate governance wheel (sl. 8), arranged around the centre are: board of directors and committees; legal and regulatory framework; organisational hierarchy; monitoring and internal control; transparency and accountability; policies and procedures. Inside runs the cycle &lt;em&gt;vision → mission → strategy → objectives → SMART goals&lt;/em&gt; (specific, measurable, achievable, relevant, time-bound).&lt;/p&gt;
&lt;p&gt;Sl. 9 is the &lt;strong&gt;key to reading the whole lecture&lt;/strong&gt;: it groups the tools under two objectives, which together serve to manage stakeholder relations.&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 820 260&quot; role=&quot;img&quot; aria-label=&quot;Tools grouped by objective&quot;&gt;
&lt;g font-size=&quot;14&quot;&gt;

&lt;/g&gt;

&lt;div class=&quot;quiz pA&quot;&gt;&lt;h3&gt;Self-check · Part I&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;The case is downstream: it concerns the use of the product sold, not its production.&quot;&gt;&lt;p&gt;A vehicle manufacturer discovers that its vans are being used by a government to carry out death sentences. What type of responsibility is at stake?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Upstream responsibility&lt;/button&gt;&lt;button data-ok&gt;Downstream responsibility&lt;/button&gt;&lt;button&gt;Historical responsibility&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;Social connection responsibility looks forward and aims to change structures, not to find culprits.&quot;&gt;&lt;p&gt;Which perspective is “forward-looking”?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Historical responsibility&lt;/button&gt;&lt;button&gt;Downstream responsibility&lt;/button&gt;&lt;button data-ok&gt;Social connection responsibility&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Define business ethics management.&lt;/summary&gt;&lt;div&gt;The direct attempt to formally or informally manage ethical issues or problems through specific policies, practices and programmes (sl. 7).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What are the two objectives under which sl. 9 groups the tools, and what do they serve together?&lt;/summary&gt;&lt;div&gt;&lt;em&gt;Setting values and standards of ethical behaviour&lt;/em&gt; (mission/values statements, codes of ethics) and &lt;em&gt;Assessing ethical performance&lt;/em&gt; (policies and procedures / EMS, certifications and audits, transparency and accountability). Together they serve &lt;em&gt;managing stakeholder relations&lt;/em&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why are Tier 2 and Tier 3 suppliers a problem for ethics management?&lt;/summary&gt;&lt;div&gt;They are distant from the company: they have no direct contract with it and are less visible and less controllable, yet their abuses (e.g. forced labour in cotton spinning) still fall on the company as upstream responsibility.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part pS&quot; id=&quot;p2&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Part II · sl. 10–31&lt;/div&gt;&lt;h2&gt;Setting values and standards of ethical behaviour&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Before measuring anything, one must state &lt;em&gt;what&lt;/em&gt; one wants to be and &lt;em&gt;how&lt;/em&gt; one wants to behave. The tools in this part are purpose, mission and vision statements and codes of ethics, up to global codes for multinationals.&lt;/p&gt;

&lt;h3 id=&quot;s-pmv&quot;&gt;&lt;span class=&quot;n&quot;&gt;2.1&lt;/span&gt;Purpose, mission and vision&lt;/h3&gt;
&lt;div data-hot=&quot;pu&quot; class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 360 360&quot; role=&quot;img&quot; aria-label=&quot;Concentric circles: purpose, vision, mission, goals, activities&quot;&gt;
&lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;
&lt;g data-k=&quot;ac&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;180&quot; cy=&quot;180&quot; r=&quot;172&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;32&quot;&gt;Activities / Projects&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;go&quot;&gt;&lt;circle class=&quot;hit f-card s-c&quot; cx=&quot;180&quot; cy=&quot;215&quot; r=&quot;136&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;104&quot;&gt;Goals&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;mi&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;180&quot; cy=&quot;250&quot; r=&quot;101&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;174&quot;&gt;Mission&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;vi&quot;&gt;&lt;circle class=&quot;hit f-card s-c&quot; cx=&quot;180&quot; cy=&quot;282&quot; r=&quot;69&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;240&quot;&gt;Vision&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;pu&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;180&quot; cy=&quot;312&quot; r=&quot;40&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;317&quot; font-weight=&quot;600&quot;&gt;Purpose&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;&lt;/svg&gt;
&lt;p class=&quot;hint&quot;&gt;From the core (purpose) to everyday behaviour (activities). Tap a circle.&lt;/p&gt;
&lt;/figure&gt;
&lt;div class=&quot;hbox&quot;&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;pu&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Purpose&lt;/span&gt;&lt;p&gt;The &lt;strong&gt;underlying belief about the company&#x27;s role in society&lt;/strong&gt; (sl. 11). It is the core: why we exist &lt;em&gt;for society&lt;/em&gt;, beyond profit. It connects to the debate on the &lt;em&gt;purpose of corporations&lt;/em&gt; from the previous lecture.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;vi&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Vision&lt;/span&gt;&lt;p&gt;A &lt;strong&gt;shared image of a desired future&lt;/strong&gt;. Guiding question: &lt;em&gt;what is our picture of the future?&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;mi&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Mission&lt;/span&gt;&lt;p&gt;The &lt;strong&gt;reason the company exists&lt;/strong&gt;: what it does, and for whom. Guiding question: &lt;em&gt;what do we exist to do?&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;go&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Goals&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Objectives that support the mission and vision&lt;/strong&gt; (the desired results). In the pyramid: strategic goals, objectives, performance measures and targets.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;ac&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Activities / Projects&lt;/span&gt;&lt;p&gt;Concrete &lt;strong&gt;behaviour&lt;/strong&gt;. This is where it becomes clear whether the stated values are real: a purpose without consistent activities is mere communication.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;The strategic pyramid: one question for each level (sl. 11)&lt;/summary&gt;&lt;div&gt;
&lt;ol class=&quot;tight&quot;&gt;&lt;li&gt;&lt;strong&gt;Mission&lt;/strong&gt;: what do we exist to do?&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Vision&lt;/strong&gt;: what is our picture of the future?&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Strategic goals &amp;amp; results&lt;/strong&gt;: what are the areas of focus? what results are needed to satisfy stakeholders?&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Strategic objectives &amp;amp; desired outcomes&lt;/strong&gt;: what continuous improvements are needed to achieve the results?&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Performance measures &amp;amp; targets&lt;/strong&gt;: how will we know whether we are achieving the results?&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Strategic initiatives&lt;/strong&gt;: what actions can contribute?&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Projects&lt;/strong&gt;: what short- and long-term activities support the initiatives?&lt;/li&gt;&lt;/ol&gt;
&lt;p&gt;One moves down from the “why” to the “how”: each level must be traceable to the one above.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;h4&gt;Examples of statements (sl. 12)&lt;/h4&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Ben &amp;amp; Jerry&#x27;s&lt;/span&gt;&lt;p&gt;&lt;em&gt;“We believe that ice cream can change the world. We have a progressive, nonpartisan social mission that seeks to meet human needs and eliminate injustices…”&lt;/em&gt;&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;An explicit social mission, integrated into daily activities, in an activist register.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Southwest Airlines&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Purpose:&lt;/strong&gt; &lt;em&gt;“To connect People to what&#x27;s important in their lives through friendly, reliable, and low-cost air travel.”&lt;/em&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Vision:&lt;/strong&gt; &lt;em&gt;“To be the world&#x27;s most loved, most efficient, and most profitable airline.”&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Gewiss&lt;/span&gt;&lt;p&gt;&lt;em&gt;“In every home, facility, city, we put intelligent connections at the service of people. We do it with passion, with method, with responsibility. Our every action looks further: towards a safer, more efficient and sustainable future.”&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;s-codes&quot;&gt;&lt;span class=&quot;n&quot;&gt;2.2&lt;/span&gt;Codes of ethics&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Definition · Crane et al., 2019 · sl. 13&lt;/span&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Codes of ethics&lt;/span&gt; are &lt;strong&gt;voluntary statements&lt;/strong&gt; that commit organisations, industries or professions to specific beliefs, values and actions and/or that set out appropriate ethical behaviour for employees.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot; style=&quot;display:flex;gap:16px;align-items:center&quot;&gt;&lt;div class=&quot;num&quot;&gt;93%&lt;/div&gt;&lt;div&gt;of &lt;strong&gt;FTSE 350&lt;/strong&gt; companies (the 350 largest companies listed in London) have a stated ethics programme, of which the code is the most visible element; the vast majority of large US companies also have a code (Institute of Business Ethics, 2016, sl. 13).&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;In the slides the terms &lt;em&gt;code of ethics&lt;/em&gt; and &lt;em&gt;code of conduct&lt;/em&gt; are used almost interchangeably (GE and Nvidia refer to a “Code of Conduct”, Eni to a “Code of Ethics”). In general, a code of ethics tends to be more values-focused, while a code of conduct focuses on specific rules: this is the aspirational / rules-based distinction in &lt;a href=&quot;#s-eff&quot;&gt;§2.3&lt;/a&gt;.&lt;/p&gt;
&lt;h4&gt;Criticisms of codes (sl. 14)&lt;/h4&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Rigidity&lt;/h4&gt;&lt;p&gt;Clear prescriptions for employees mean &lt;strong&gt;little flexibility&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;New situations&lt;/h4&gt;&lt;p&gt;Difficulty with multiple or unprecedented situations, especially &lt;strong&gt;cross-cultural&lt;/strong&gt; ones.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Vagueness&lt;/h4&gt;&lt;p&gt;Generic statements of obligation that do not help decision-making.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;PR device&lt;/h4&gt;&lt;p&gt;A &lt;strong&gt;public relations&lt;/strong&gt; tool: more useful for image than for behaviour.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Control&lt;/h4&gt;&lt;p&gt;Questionable control mechanisms that seek to influence employees&#x27; beliefs, values and behaviour.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Conformism&lt;/h4&gt;&lt;p&gt;They “suppress” individual moral impulses and emotions to ensure conformity and bureaucratic consistency.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Three real codes&lt;/h4&gt;
&lt;div data-tabs&gt;&lt;div role=&quot;tablist&quot; aria-label=&quot;Company codes&quot;&gt;&lt;button role=&quot;tab&quot;&gt;GE · The Spirit &amp;amp; The Letter&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Eni&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p&gt;GE&#x27;s compliance handbook is called &lt;strong&gt;&lt;em&gt;The Spirit &amp;amp; The Letter&lt;/em&gt;&lt;/strong&gt; (sl. 15-17): employees must respect not only the &lt;em&gt;letter&lt;/em&gt; of the policies (the written rule) but also their &lt;em&gt;spirit&lt;/em&gt; (the purpose). The code applies &lt;em&gt;everywhere, every day, for everyone&lt;/em&gt;.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;&lt;span class=&quot;lab&quot;&gt;Commitments of the GE Code of Conduct&lt;/span&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;obey the law wherever the company operates;&lt;/li&gt;&lt;li&gt;be honest, fair and trustworthy;&lt;/li&gt;&lt;li&gt;avoid conflicts of interest between work and personal affairs;&lt;/li&gt;&lt;li&gt;fair employment practices and inclusion;&lt;/li&gt;&lt;li&gt;a safe workplace and protection of the environment;&lt;/li&gt;&lt;li&gt;leadership that sustains an ethical culture.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div&gt;&lt;span class=&quot;lab&quot;&gt;Key questions for grey areas&lt;/span&gt;&lt;p&gt;The code “is not a substitute for good judgement” and does not cover every situation. If in doubt, ask yourself:&lt;/p&gt;&lt;ol class=&quot;tight&quot;&gt;&lt;li&gt;How would this decision look to people inside and outside GE?&lt;/li&gt;&lt;li&gt;Am I willing to be personally accountable for it?&lt;/li&gt;&lt;li&gt;Is it consistent with the Code of Conduct?&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;&lt;strong&gt;Act if you see an issue. Ask if you are unsure.&lt;/strong&gt; One of the principles is to be the &lt;em&gt;Voice of Integrity&lt;/em&gt;: raise compliance concerns promptly.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Eni publishes a &lt;strong&gt;Code of Ethics&lt;/strong&gt; and a &lt;strong&gt;Supplier Code of Conduct&lt;/strong&gt; (“Creating sustainable value together”, sl. 18). The latter extends ethical expectations to &lt;strong&gt;suppliers&lt;/strong&gt;: it is the bridge between the internal code and supply chain management, where codes become a &lt;em&gt;compliance strategy&lt;/em&gt; (&lt;a href=&quot;#s-fw&quot;&gt;§4.4&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Case: Nvidia. Private relationship or public concern? (sl. 19-24)&lt;/h4&gt;
&lt;p&gt;The case, presented in the slides on the basis of November 2026 sources, is used to discuss &lt;strong&gt;when a CEO&#x27;s private conduct becomes a business ethics issue&lt;/strong&gt;. Only what is in the slides is reported here.&lt;/p&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · The reported facts&lt;/h4&gt;&lt;p&gt;In early November 2026, Nvidia CEO Jensen Huang admitted to having been unfaithful to his wife and apologised to his family and colleagues. Reports linked the relationship to an executive at an Nvidia customer whom US intelligence allegedly suspected of gathering information for China (sl. 20).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · The apology to employees&lt;/h4&gt;&lt;p&gt;In his message to employees (“A Message to Our Company”, 8 November 2026), Huang says he fell short of his responsibility to earn his colleagues&#x27; trust. The slides observe that, from an ethical standpoint, a CEO&#x27;s personal conduct can raise questions of &lt;em&gt;leadership, judgement and trust&lt;/em&gt;, especially if it involves a business partner and possible security risks. The apology acknowledges the impact on the organisation but &lt;strong&gt;does not establish&lt;/strong&gt; that company rules were breached (sl. 21).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · The board&#x27;s response&lt;/h4&gt;&lt;p&gt;The board launched an &lt;strong&gt;independent investigation&lt;/strong&gt;, led by a committee of independent directors with external legal counsel. It stated that it had no reason to believe that national security or trade secrets had been compromised, and confirmed its confidence in the CEO (sl. 22). This is governance in action: an independent body investigates, rather than the person concerned.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · What the Code of Conduct says&lt;/h4&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;A public code existed before the events; it applies to employees and &lt;strong&gt;board members&lt;/strong&gt; and describes managers as &lt;em&gt;role models&lt;/em&gt;.&lt;/li&gt;&lt;li&gt;The 2023 version identifies &lt;strong&gt;personal relationships&lt;/strong&gt; as a possible source of &lt;span class=&quot;term&quot;&gt;conflict of interest&lt;/span&gt;: anyone with an actual or perceived conflict must seek guidance and recuse themselves from relevant decisions.&lt;/li&gt;&lt;li&gt;It covers the protection of non-public information and compliance with international trade rules.&lt;/li&gt;&lt;li&gt;It &lt;strong&gt;does not prohibit&lt;/strong&gt; romantic relationships in general: whether there was a conflict or a breach is a matter for the investigation (sl. 24).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Discussion question&lt;/h4&gt;&lt;blockquote&gt;When does a CEO&#x27;s private relationship become a legitimate concern for the company and its stakeholders?&lt;/blockquote&gt;&lt;p class=&quot;gloss&quot;&gt;A framework for reasoning (not in the slides): the private sphere becomes relevant when it touches on &lt;em&gt;(a)&lt;/em&gt; a conflict of interest with a business partner, &lt;em&gt;(b)&lt;/em&gt; the security of company information, &lt;em&gt;(c)&lt;/em&gt; the leader&#x27;s credibility as a role model and stakeholder trust. Always distinguish between what is ethically questionable and what breaches an established rule.&lt;/p&gt;&lt;/div&gt;
&lt;nav&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/nav&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;s-eff&quot;&gt;&lt;span class=&quot;n&quot;&gt;2.3&lt;/span&gt;Making a code work&lt;/h3&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Ethical dilemma 5 · Getting explicit about the code of conduct · sl. 25&lt;/span&gt;&lt;p&gt;You are the IT manager of a small financial services firm. Faye, the hardware manager, tells you that on the “pool” laptop used over the weekend by Paul, the lead analyst who worked from home to prepare the forecasts, the browsing history shows visits to pornographic websites over the past two days. What do you do? Does the code of conduct say anything about it? And if it does, do you apply it?&lt;/p&gt;&lt;/div&gt;
&lt;blockquote&gt;“… in order for codes to have credibility, companies must be willing to discipline employees found in breach of them. Similarly, Treviño et al.&#x27;s (1999) survey revealed that follow-through (such as detection of violations, follow-up on notification of violations, and consistency between the policy and action) tended to be much more influential on employee behaviour than the mere presence of a code.”&lt;cite&gt;Quoted in sl. 25&lt;/cite&gt;&lt;/blockquote&gt;
&lt;p&gt;The message: &lt;strong&gt;a code matters for how it is applied, not because it exists&lt;/strong&gt;. Schwartz (2004) translates this into three conditions (sl. 26).&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 760 210&quot; role=&quot;img&quot; aria-label=&quot;Three pillars of code effectiveness&quot;&gt;
&lt;rect x=&quot;30&quot; y=&quot;10&quot; width=&quot;700&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; class=&quot;hl&quot; font-size=&quot;16&quot;&gt;Effective code = implementation + administration&lt;/text&gt;
&lt;g font-size=&quot;13.5&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;50&quot; y=&quot;62&quot; width=&quot;200&quot; height=&quot;110&quot; rx=&quot;8&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;88&quot; font-weight=&quot;600&quot;&gt;How codes are&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;106&quot; font-weight=&quot;600&quot;&gt;written &amp;amp; accessible&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;132&quot; font-size=&quot;12&quot;&gt;tailored to the&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;148&quot; font-size=&quot;12&quot;&gt;organisation, appropriate tone&lt;/text&gt;
&lt;rect x=&quot;280&quot; y=&quot;62&quot; width=&quot;200&quot; height=&quot;110&quot; rx=&quot;8&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;88&quot; font-weight=&quot;600&quot;&gt;How codes are&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;106&quot; font-weight=&quot;600&quot;&gt;supported&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;132&quot; font-size=&quot;12&quot;&gt;by management,&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;148&quot; font-size=&quot;12&quot;&gt;with training&lt;/text&gt;
&lt;rect x=&quot;510&quot; y=&quot;62&quot; width=&quot;200&quot; height=&quot;110&quot; rx=&quot;8&quot; class=&quot;f-cbg s-c&quot;/&gt;&lt;text x=&quot;610&quot; y=&quot;88&quot; font-weight=&quot;600&quot;&gt;How codes are&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;106&quot; font-weight=&quot;600&quot;&gt;enforced&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;132&quot; font-size=&quot;12&quot;&gt;reporting channels, violations&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;148&quot; font-size=&quot;12&quot;&gt;communicated, incentives ±&lt;/text&gt;
&lt;/g&gt;
&lt;rect x=&quot;30&quot; y=&quot;180&quot; width=&quot;700&quot; height=&quot;10&quot; rx=&quot;3&quot; class=&quot;f-c&quot;/&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Schwartz (2004), sl. 26. Incentives are both positive (rewards) and negative (sanctions).&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;h4&gt;Aspirational and rules-based&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Aspirational (general)&lt;/span&gt;&lt;p&gt;Values and ideals: the &lt;em&gt;credo&lt;/em&gt;. Provides meaning and purpose. On its own it is too vague.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Rules-based (specific)&lt;/span&gt;&lt;p&gt;Precise rules of conduct. They say what to do. On their own they do not explain why.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;blockquote&gt;“rules of conduct without a general values statement lack a framework of meaning and purpose; credos without rules of conduct lack specific content”&lt;cite&gt;Hoffman, Driscoll and Painter-Morland (2001), sl. 27&lt;/cite&gt;&lt;/blockquote&gt;

&lt;h3 id=&quot;s-global&quot;&gt;&lt;span class=&quot;n&quot;&gt;2.4&lt;/span&gt;Global codes of ethics&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;Can a multinational have a single set of principles across all the countries in which it operates?&lt;/strong&gt; (sl. 28). Examples: gift-giving in Japan compared with the United Kingdom; equal opportunity commitments in India and Saudi Arabia compared with the United Kingdom.&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;label for=&quot;rel&quot;&gt;&lt;strong&gt;Move the slider between the two extremes&lt;/strong&gt; and see how a business gift policy changes.&lt;/label&gt;
&lt;div style=&quot;display:flex;justify-content:space-between;font-size:.85rem;margin-top:8px&quot;&gt;&lt;span&gt;&lt;strong&gt;Relativism&lt;/strong&gt;: ≠ codes for ≠ contexts&lt;/span&gt;&lt;span&gt;&lt;strong&gt;Absolutism&lt;/strong&gt;: 1 code fits all&lt;/span&gt;&lt;/div&gt;
&lt;input type=&quot;range&quot; id=&quot;rel&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;50&quot; aria-describedby=&quot;relout&quot;&gt;
&lt;div class=&quot;out&quot; id=&quot;relout&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;The solution proposed by &lt;strong&gt;Donaldson (1996)&lt;/strong&gt; lies in between (sl. 29). Multinationals (&lt;span class=&quot;term&quot;&gt;MNEs&lt;/span&gt;, multinational enterprises) should follow three principles:&lt;/p&gt;
&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;&lt;p&gt;Respect for &lt;strong&gt;core human values&lt;/strong&gt;, fundamental and non-negotiable human values.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;num&quot;&gt;2&lt;/div&gt;&lt;p&gt;Respect for &lt;strong&gt;local traditions&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;&lt;p&gt;The belief that &lt;strong&gt;context matters&lt;/strong&gt; when deciding what is right and wrong.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;For this reason, global codes should set &lt;strong&gt;minimum ethical standards&lt;/strong&gt;, such as the &lt;em&gt;OECD Guidelines for Multinational Enterprises&lt;/em&gt; and the &lt;em&gt;UN Global Compact&lt;/em&gt;.&lt;/p&gt;

&lt;h4&gt;UN Global Compact (sl. 30-31)&lt;/h4&gt;
&lt;p&gt;A principles-based UN initiative for corporate sustainability. Sustainability starts from the company&#x27;s value system: operating in ways that, at a minimum, meet fundamental responsibilities in the areas of human rights, labour, environment and anti-corruption, &lt;strong&gt;with the same values everywhere&lt;/strong&gt;, knowing that good practices in one area &lt;strong&gt;do not offset&lt;/strong&gt; harm in another. The ten principles are derived from: the Universal Declaration of Human Rights, the ILO Declaration on Fundamental Principles and Rights at Work, the Rio Declaration on Environment and Development, and the UN Convention against Corruption.&lt;/p&gt;
&lt;div data-tabs&gt;&lt;div role=&quot;tablist&quot; aria-label=&quot;Areas of the ten principles&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Human rights · 1-2&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Labour · 3-6&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Environment · 7-9&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Anti-corruption · 10&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;ol class=&quot;tight&quot;&gt;&lt;li&gt;Support and respect the protection of internationally proclaimed human rights;&lt;/li&gt;&lt;li&gt;make sure that they are not &lt;strong&gt;complicit&lt;/strong&gt; in human rights abuses.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;ol class=&quot;tight&quot; start=&quot;3&quot;&gt;&lt;li&gt;Freedom of association and the effective recognition of the right to collective bargaining;&lt;/li&gt;&lt;li&gt;the elimination of all forms of forced and compulsory labour;&lt;/li&gt;&lt;li&gt;the effective abolition of child labour;&lt;/li&gt;&lt;li&gt;the elimination of discrimination in respect of employment and occupation.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;ol class=&quot;tight&quot; start=&quot;7&quot;&gt;&lt;li&gt;A &lt;strong&gt;precautionary&lt;/strong&gt; approach to environmental challenges;&lt;/li&gt;&lt;li&gt;initiatives to promote greater environmental responsibility;&lt;/li&gt;&lt;li&gt;the development and diffusion of environmentally friendly technologies.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;ol class=&quot;tight&quot; start=&quot;10&quot;&gt;&lt;li&gt;Work against corruption in all its forms, including &lt;em&gt;extortion and bribery&lt;/em&gt;.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;gloss&quot;&gt;Principle 2 (complicity) is the link with the upstream and downstream responsibility of Part I: one can be responsible even for abuses committed by others, if one contributes to them or benefits from them.&lt;/p&gt;

&lt;div class=&quot;quiz pS&quot;&gt;&lt;h3&gt;Self-check · Part II&lt;/h3&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;It is an image of a desired future: vision.&quot;&gt;&lt;p&gt;“To be the world&#x27;s most loved, most efficient, and most profitable airline” is…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Purpose&lt;/button&gt;&lt;button data-ok&gt;Vision&lt;/button&gt;&lt;button&gt;Mission&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;mcq&quot; data-why=&quot;Treviño et al. (1999): follow-through matters more than the mere presence of a code.&quot;&gt;&lt;p&gt;According to the study cited in sl. 25, what most influences employee behaviour?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;The length and level of detail of the code&lt;/button&gt;&lt;button data-ok&gt;Follow-through: detecting violations, following up on reports, consistency between policy and action&lt;/button&gt;&lt;button&gt;The mere existence of a published code&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;List at least four criticisms of codes of ethics.&lt;/summary&gt;&lt;div&gt;Lack of flexibility; difficulty with new or cross-cultural situations; vague and generic statements; use as a PR device; questionable control mechanisms over beliefs and values; suppression of individual moral impulses in favour of bureaucratic conformity (sl. 14).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What are Schwartz&#x27;s (2004) three conditions for effectiveness?&lt;/summary&gt;&lt;div&gt;How the code is &lt;em&gt;written and accessible&lt;/em&gt; (tailored, appropriate tone), how it is &lt;em&gt;supported&lt;/em&gt; (by management, with training), how it is &lt;em&gt;enforced&lt;/em&gt; (reporting channels, communication of violations, positive and negative incentives).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why should a code be both aspirational and rules-based?&lt;/summary&gt;&lt;div&gt;Because rules without values lack meaning and purpose, and values without rules lack specific content (Hoffman, Driscoll and Painter-Morland, 2001).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What does Donaldson (1996) propose between relativism and absolutism?&lt;/summary&gt;&lt;div&gt;Three principles: respect for core human values, respect for local traditions, awareness that context matters. The result is a global code that sets non-negotiable minimum standards while leaving room for local adaptation.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In the Nvidia case, why does the board launch an “independent” investigation?&lt;/summary&gt;&lt;div&gt;Because the person involved is the top executive: only independent directors with external advisers can credibly assess whether there was a conflict of interest or a risk to confidential information. The CEO&#x27;s apology acknowledges the impact but does not establish any breach.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part pO&quot; id=&quot;p3&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Part III · sl. 32–73&lt;/div&gt;&lt;h2&gt;Assessing ethical performance&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Stating values is not enough: one must &lt;strong&gt;verify and demonstrate&lt;/strong&gt; compliance with them. This part follows the chain: management systems → certifications → audits → accounting and reporting → due diligence obligations.&lt;/p&gt;

&lt;h3 id=&quot;s-ems&quot;&gt;&lt;span class=&quot;n&quot;&gt;3.1&lt;/span&gt;Policies and processes: management systems&lt;/h3&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Definition · sl. 34&lt;/span&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Environmental and social management systems&lt;/span&gt; are the processes through which organisations implement environmental or social objectives, policies and responsibilities and ensure regular auditing and reporting of these approaches, &lt;strong&gt;beyond mere legal compliance&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Certificate vs self-determined&lt;/span&gt;&lt;p&gt;The system may follow an external standard and be &lt;strong&gt;certified&lt;/strong&gt; by a third party (e.g. ISO 14001), or be &lt;strong&gt;self-determined&lt;/strong&gt; by the company, without certification.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Internal vs external auditing&lt;/span&gt;&lt;p&gt;Verification may be carried out by &lt;strong&gt;internal auditors&lt;/strong&gt; (the internal audit function) or by independent &lt;strong&gt;external auditors&lt;/strong&gt;. See &lt;a href=&quot;#s-audit&quot;&gt;§3.6&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;The engine of management systems is the &lt;strong&gt;PDCA&lt;/strong&gt; cycle. This is how it is applied in the &lt;span class=&quot;term&quot;&gt;ISO 14001&lt;/span&gt; standard (sl. 48), the international standard for an &lt;span class=&quot;term&quot;&gt;EMS&lt;/span&gt; (environmental management system):&lt;/p&gt;
&lt;div data-hot=&quot;P&quot; class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 360 360&quot; role=&quot;img&quot; aria-label=&quot;ISO 14001 PDCA cycle&quot;&gt;
&lt;g font-size=&quot;40&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot;&gt;
&lt;g data-k=&quot;P&quot;&gt;&lt;path class=&quot;hit f-cbg s-c&quot; d=&quot;M180 180V20A160 160 0 0 1 340 180Z&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;125&quot;&gt;P&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;150&quot; font-size=&quot;14&quot; font-family=&quot;sans-serif&quot;&gt;Plan&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;D&quot;&gt;&lt;path class=&quot;hit f-cbg s-c&quot; d=&quot;M180 180H340A160 160 0 0 1 180 340Z&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;250&quot; y=&quot;255&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;280&quot; font-size=&quot;14&quot; font-family=&quot;sans-serif&quot;&gt;Do&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;C&quot;&gt;&lt;path class=&quot;hit f-cbg s-c&quot; d=&quot;M180 180V340A160 160 0 0 1 20 180Z&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;255&quot;&gt;C&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;280&quot; font-size=&quot;14&quot; font-family=&quot;sans-serif&quot;&gt;Check&lt;/text&gt;&lt;/g&gt;
&lt;g data-k=&quot;A&quot;&gt;&lt;path class=&quot;hit f-cbg s-c&quot; d=&quot;M180 180H20A160 160 0 0 1 180 20Z&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;125&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;150&quot; font-size=&quot;14&quot; font-family=&quot;sans-serif&quot;&gt;Act&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;
&lt;circle cx=&quot;180&quot; cy=&quot;180&quot; r=&quot;44&quot; class=&quot;f-acc&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; class=&quot;hl&quot; font-size=&quot;13&quot;&gt;Leadership&lt;/text&gt;
&lt;/svg&gt;&lt;p class=&quot;hint&quot;&gt;Tap a quadrant.&lt;/p&gt;&lt;/figure&gt;
&lt;div class=&quot;hbox&quot;&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;P&quot;&gt;&lt;h4&gt;Plan&lt;/h4&gt;&lt;p&gt;Analysis of the &lt;strong&gt;context and relevant issues&lt;/strong&gt;, definition of &lt;strong&gt;processes&lt;/strong&gt;, setting of &lt;strong&gt;environmental objectives&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;D&quot;&gt;&lt;h4&gt;Do&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Support&lt;/strong&gt; (resources, competences, communication), &lt;strong&gt;operational control&lt;/strong&gt; of processes, management of &lt;strong&gt;emergency situations&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;C&quot;&gt;&lt;h4&gt;Check&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Internal audit&lt;/strong&gt;, &lt;strong&gt;evaluation of compliance&lt;/strong&gt; (verifying compliance with the law), &lt;strong&gt;management review&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;hpanel card tint&quot; data-p=&quot;A&quot;&gt;&lt;h4&gt;Act&lt;/h4&gt;&lt;p&gt;Management of &lt;strong&gt;nonconformities&lt;/strong&gt; (deviations from requirements), &lt;strong&gt;corrective action&lt;/strong&gt;, &lt;strong&gt;continual improvement&lt;/strong&gt;. Then the cycle restarts from Plan.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Leadership sits at the centre: without top management commitment, the cycle does not turn.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;h3 id=&quot;s-cert&quot;&gt;&lt;span class=&quot;n&quot;&gt;3.2&lt;/span&gt;Process and product certifications&lt;/h3&gt;
&lt;div class=&quot;defn&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Definition · sl. 36&lt;/span&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Certifications&lt;/span&gt; are &lt;strong&gt;formal attestations issued by an authoritative body&lt;/strong&gt; confirming that a person, organisation, product, process or system meets a set of predefined standards, criteria or competences. They act as &lt;strong&gt;objective third-party validations&lt;/strong&gt; that provide confidence and &lt;em&gt;assurance&lt;/em&gt; to customers, consumers, regulators and other stakeholders.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;&lt;h4&gt;Standardized criteria&lt;/h4&gt;&lt;p&gt;Based on recognised norms, frameworks or rules (ISO, national professional standards).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;num&quot;&gt;2&lt;/div&gt;&lt;h4&gt;Independent verification&lt;/h4&gt;&lt;p&gt;A neutral external body assesses whether the criteria are met.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;&lt;h4&gt;Periodic renewal&lt;/h4&gt;&lt;p&gt;Regular audits or reassessments are needed to remain valid.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;div class=&quot;num&quot;&gt;4&lt;/div&gt;&lt;h4&gt;Transparency and credibility&lt;/h4&gt;&lt;p&gt;External assurance that distinguishes certified organisations from non-certified competitors.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div data-tabs&gt;&lt;div role=&quot;tablist&quot; aria-label=&quot;Types of certification&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Process&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Product&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Examples (sl. 38)&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Process certifications&lt;/strong&gt; look at &lt;em&gt;how&lt;/em&gt; the organisation manages its activities: they assess whether a management system meets specific requirements (environment, quality, occupational health and safety). They &lt;strong&gt;do not automatically guarantee&lt;/strong&gt; that every product is sustainable or that every negative impact has been eliminated (sl. 39).&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Examples: ISO 14001, EMAS, SA8000, ISO 45001, ISO 50001.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Product certifications&lt;/strong&gt; look at the characteristics or impacts of a &lt;em&gt;specific product or service&lt;/em&gt;: origin of materials, environmental performance, safety, social conditions of production. They apply &lt;strong&gt;only&lt;/strong&gt; to the certified product and to the criteria covered by the scheme (sl. 39).&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Examples: Fairtrade, EU Ecolabel, FSC, PEFC, Rainforest Alliance, Cradle to Cradle, EPD, vegan labels.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div&gt;&lt;span class=&quot;lab&quot;&gt;Professional&lt;/span&gt;&lt;p&gt;&lt;em&gt;PMP&lt;/em&gt; (PMI, project management); &lt;em&gt;CFA&lt;/em&gt; (finance and investment).&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;lab&quot;&gt;Product&lt;/span&gt;&lt;p&gt;&lt;em&gt;CE marking&lt;/em&gt; (EU conformity with safety and environmental requirements); &lt;em&gt;UL&lt;/em&gt; (Underwriters Laboratories, consumer product safety).&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;lab&quot;&gt;System&lt;/span&gt;&lt;p&gt;&lt;em&gt;ISO 9001&lt;/em&gt; (quality); &lt;em&gt;ISO/IEC 27001&lt;/em&gt; (information security).&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Golden rule (sl. 39).&lt;/b&gt; To interpret a certification, always ask: &lt;strong&gt;what&lt;/strong&gt; is being assessed? &lt;strong&gt;against which standard&lt;/strong&gt;? &lt;strong&gt;by whom&lt;/strong&gt;? A “green” label on an ISO 14001-certified company means that the &lt;em&gt;system&lt;/em&gt; is managed according to the standard, not that the &lt;em&gt;product&lt;/em&gt; is environmentally friendly.&lt;/div&gt;

&lt;h4&gt;Sustainability certifications (sl. 40-42)&lt;/h4&gt;
&lt;p&gt;These are &lt;strong&gt;third-party validations&lt;/strong&gt; confirming that a company or product meets environmental, social or governance criteria (&lt;span class=&quot;term&quot;&gt;ESG&lt;/span&gt;: environmental, social, governance). They may be &lt;strong&gt;voluntary&lt;/strong&gt; (B Corp, LEED) or &lt;strong&gt;mandatory&lt;/strong&gt; in certain institutional contexts.&lt;/p&gt;
&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;card pS tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Environmental&lt;/span&gt;&lt;p&gt;Carbon footprint reduction, energy efficiency, waste management, circular economy.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card pM tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Social&lt;/span&gt;&lt;p&gt;Fair labour practices, human rights, health and safety, diversity.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card pA tint&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Governance&lt;/span&gt;&lt;p&gt;Ethical conduct, transparency, accountability mechanisms.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;There are &lt;strong&gt;over 600 schemes&lt;/strong&gt; recognised worldwide (Ecolabel Index, 2024, according to sl. 41), with growing harmonisation efforts. Certifications help structure sustainability management systems, often linked to the &lt;span class=&quot;term&quot;&gt;GRI&lt;/span&gt; (Global Reporting Initiative) or &lt;span class=&quot;term&quot;&gt;SASB&lt;/span&gt; (Sustainability Accounting Standards Board) reporting standards. &lt;strong&gt;Example:&lt;/strong&gt; a manufacturing company may hold ISO 14001 (environment), SA8000 (social responsibility) and ISO 50001 (energy), creating an integrated framework.&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;How many ecolabels are there?&lt;/span&gt;&lt;p&gt;No updated count appeared on the Ecolabel Index website (run by Big Room Inc. since 2007); the most recent figure found is &lt;strong&gt;457 ecolabels in 199 countries and 25 industry sectors&lt;/strong&gt; (2020 profile). The “over 600” figure in the slide has not been verified. &lt;a href=&quot;https://www.ecolabelindex.com/about/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ecolabelindex.com/about&lt;/a&gt; · &lt;a href=&quot;https://theindexproject.org/post/ecolabel-index&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;theindexproject.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3 id=&quot;s-proc&quot;&gt;&lt;span class=&quot;n&quot;&gt;3.3&lt;/span&gt;The certification process&lt;/h3&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;svg viewBox=&quot;0 0 700 64&quot; role=&quot;img&quot; aria-label=&quot;Five stages&quot;&gt;&lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;&lt;line x1=&quot;70&quot; y1=&quot;24&quot; x2=&quot;630&quot; y2=&quot;24&quot; class=&quot;s-rule&quot; stroke-width=&quot;3&quot;/&gt;
&lt;g data-si=&quot;0&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;70&quot; cy=&quot;24&quot; r=&quot;18&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;29&quot;&gt;1&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;58&quot; class=&quot;f-mut&quot;&gt;Preparation&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;1&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;210&quot; cy=&quot;24&quot; r=&quot;18&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;29&quot;&gt;2&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;58&quot; class=&quot;f-mut&quot;&gt;Gap analysis&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;2&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;350&quot; cy=&quot;24&quot; r=&quot;18&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;29&quot;&gt;3&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;58&quot; class=&quot;f-mut&quot;&gt;Implementation&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;3&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;490&quot; cy=&quot;24&quot; r=&quot;18&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;29&quot;&gt;4&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;58&quot; class=&quot;f-mut&quot;&gt;Audit &amp;amp; decision&lt;/text&gt;&lt;/g&gt;
&lt;g data-si=&quot;4&quot;&gt;&lt;circle class=&quot;hit f-cbg s-c&quot; cx=&quot;630&quot; cy=&quot;24&quot; r=&quot;18&quot;/&gt;&lt;text x=&quot;630&quot; y=&quot;29&quot;&gt;5&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;58&quot; class=&quot;f-mut&quot;&gt;Surveillance&lt;/text&gt;&lt;/g&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Preparation / application&lt;/h4&gt;&lt;p&gt;The organisation approaches a certification body and defines the &lt;strong&gt;scope, boundaries, sites&lt;/strong&gt; and existing documentation.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Example: a manufacturer applying for ISO 14001 provides process maps, environmental records and legal compliance lists.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;2 · Gap analysis / documentation review&lt;/h4&gt;&lt;p&gt;Existing documentation is compared against the standard; the organisation updates policies, procedures, work instructions and records.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Example: it defines the internal audit process and introduces tracking of corrective actions.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;3 · Implementation&lt;/h4&gt;&lt;p&gt;The system becomes operational: staff training, internal audits, management review, corrective actions, collection of performance data.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Example: for six months it monitors energy consumption and sets reduction targets.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;4 · Certification audit &amp;amp; decision&lt;/h4&gt;&lt;p&gt;External auditors usually assess in two stages: &lt;strong&gt;Stage 1&lt;/strong&gt; readiness and documentation, &lt;strong&gt;Stage 2&lt;/strong&gt; on-site implementation. If the outcome is positive, the body issues the certificate.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Example: they visit the plant, interview staff and check records.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;5 · Surveillance / recertification&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Surveillance audits&lt;/strong&gt;, often annual, verify that the system remains effective and compliant. A full &lt;strong&gt;recertification&lt;/strong&gt; audit normally takes place after three years, depending on the scheme.&lt;/p&gt;&lt;p class=&quot;gloss&quot;&gt;Example: in year two, internal audits and management review are checked; in year three the full audit is due.&lt;/p&gt;&lt;/div&gt;
&lt;nav&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;cnt&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/nav&gt;
&lt;/div&gt;
&lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;The EMAS pathway in 10 steps (sl. 44)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;An internal process, repeated every year in line with ISO 14001 and EMAS, plus an external process:&lt;/p&gt;&lt;ol class=&quot;tight&quot;&gt;&lt;li&gt;&lt;strong&gt;Contact&lt;/strong&gt; the competent body;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Conduct&lt;/strong&gt; an initial environmental review;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Plan&lt;/strong&gt;: environmental policy and programme;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Do&lt;/strong&gt;: implement the EMS;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Check&lt;/strong&gt;: internal environmental audit;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Act&lt;/strong&gt;: continual improvement of performance;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Environmental report&lt;/strong&gt; (environmental statement);&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Verification and validation&lt;/strong&gt; by the environmental verifier;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Registration&lt;/strong&gt; with the competent body;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Promote&lt;/strong&gt;: communicate your environmental credentials.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/details&gt;
&lt;h4&gt;Why certifications matter (sl. 45)&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Markets and finance&lt;/span&gt;&lt;p&gt;They open up &lt;strong&gt;new markets and financing opportunities&lt;/strong&gt;: &lt;em&gt;green loans&lt;/em&gt;, &lt;em&gt;sustainability-linked bonds&lt;/em&gt; (bonds whose coupon is tied to sustainability targets), supply chain partnerships requiring ESG compliance.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Internal performance&lt;/span&gt;&lt;p&gt;They drive &lt;strong&gt;improvement&lt;/strong&gt;: they help identify inefficiencies and reduce costs through better resource management.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;In the food sector, labels such as &lt;strong&gt;Fairtrade&lt;/strong&gt; and &lt;strong&gt;Rainforest Alliance&lt;/strong&gt; have changed consumer preferences: certified products enjoy greater trust and loyalty thanks to transparent ethical and environmental standards.&lt;/p&gt;

&lt;h3 id=&quot;s-ex&quot;&gt;&lt;span class=&quot;n&quot;&gt;3.4&lt;/span&gt;Overview of schemes&lt;/h3&gt;
&lt;div data-filter&gt;
&lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn on&quot; data-f=&quot;all&quot;&gt;All&lt;/button&gt;&lt;button class=&quot;btn&quot; data-f=&quot;E&quot;&gt;Environmental&lt;/button&gt;&lt;button class=&quot;btn&quot; data-f=&quot;S&quot;&gt;Social&lt;/button&gt;&lt;button class=&quot;btn&quot; data-f=&quot;G&quot;&gt;Whole company / ESG&lt;/button&gt;&lt;button class=&quot;btn&quot; data-f=&quot;prod&quot;&gt;Product&lt;/button&gt;&lt;button class=&quot;btn&quot; data-f=&quot;build&quot;&gt;Buildings&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Certification&lt;/th&gt;&lt;th&gt;Body&lt;/th&gt;&lt;th&gt;Scope&lt;/th&gt;&lt;th&gt;Key requirements&lt;/th&gt;&lt;th&gt;Strengths&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr data-t=&quot;G S E&quot;&gt;&lt;td&gt;&lt;strong&gt;B Corp&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;B Lab Global&lt;/td&gt;&lt;td&gt;ESG performance and governance of the whole company&lt;/td&gt;&lt;td&gt;B Impact Assessment (min. 80/200 points); legal commitment to stakeholders&lt;/td&gt;&lt;td&gt;Strong ESG integration, transparency, global recognition&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-t=&quot;E&quot;&gt;&lt;td&gt;&lt;strong&gt;ISO 14001&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;ISO&lt;/td&gt;&lt;td&gt;Environmental Management System&lt;/td&gt;&lt;td&gt;EMS, PDCA cycle, legal compliance, external audit&lt;/td&gt;&lt;td&gt;The most widely recognised environmental standard, for all sectors&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-t=&quot;E&quot;&gt;&lt;td&gt;&lt;strong&gt;EMAS&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;European Commission&lt;/td&gt;&lt;td&gt;Environmental management and reporting (EU)&lt;/td&gt;&lt;td&gt;EMS + validated environmental statement + legal compliance&lt;/td&gt;&lt;td&gt;Greater transparency and credibility than ISO 14001 in the EU&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-t=&quot;S&quot;&gt;&lt;td&gt;&lt;strong&gt;SA8000&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Social Accountability International&lt;/td&gt;&lt;td&gt;Social responsibility, workers&#x27; rights, working conditions&lt;/td&gt;&lt;td&gt;ILO conventions, regular audits, supplier oversight&lt;/td&gt;&lt;td&gt;Strong human rights focus; widespread in manufacturing&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-t=&quot;G S E&quot;&gt;&lt;td&gt;&lt;strong&gt;EcoVadis&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;EcoVadis&lt;/td&gt;&lt;td&gt;Supplier sustainability rating&lt;/td&gt;&lt;td&gt;4 themes: environment, labour and human rights, ethics, sustainable procurement&lt;/td&gt;&lt;td&gt;Widely used in global supply chains; quantifiable score&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-t=&quot;E&quot;&gt;&lt;td&gt;&lt;strong&gt;Carbon Trust&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Carbon Trust&lt;/td&gt;&lt;td&gt;Carbon and energy management&lt;/td&gt;&lt;td&gt;Measurement, reduction plan, verification (carbon neutrality)&lt;/td&gt;&lt;td&gt;Credible validation of reductions; strong in Europe&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-t=&quot;prod E&quot;&gt;&lt;td&gt;&lt;strong&gt;Cradle to Cradle&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;C2C Products Innovation Institute&lt;/td&gt;&lt;td&gt;Product, circular design&lt;/td&gt;&lt;td&gt;5 criteria: materials, reuse, renewable energy, water, social fairness&lt;/td&gt;&lt;td&gt;Innovation and circular economy&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-t=&quot;prod S&quot;&gt;&lt;td&gt;&lt;strong&gt;Fairtrade&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Fairtrade International (FLO)&lt;/td&gt;&lt;td&gt;Ethical sourcing and fair trade&lt;/td&gt;&lt;td&gt;Standards on prices, labour rights, environment&lt;/td&gt;&lt;td&gt;High awareness; fair wages and sustainable sourcing&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-t=&quot;prod E&quot;&gt;&lt;td&gt;&lt;strong&gt;FSC&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;FSC International&lt;/td&gt;&lt;td&gt;Forest management and wood products&lt;/td&gt;&lt;td&gt;Traceability, &lt;em&gt;chain-of-custody&lt;/em&gt;, third-party audits&lt;/td&gt;&lt;td&gt;Global credibility; protects forests and biodiversity&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-t=&quot;build E&quot;&gt;&lt;td&gt;&lt;strong&gt;LEED&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;U.S. Green Building Council&lt;/td&gt;&lt;td&gt;Sustainable building&lt;/td&gt;&lt;td&gt;Points system: energy, water, materials, indoor air, innovation&lt;/td&gt;&lt;td&gt;Internationally recognised&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-t=&quot;build E&quot;&gt;&lt;td&gt;&lt;strong&gt;BREEAM&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;BRE Group (UK)&lt;/td&gt;&lt;td&gt;Sustainable design and construction&lt;/td&gt;&lt;td&gt;Scores by category: energy, waste, water, transport, materials&lt;/td&gt;&lt;td&gt;Benchmark building certification in the EU; flexible&lt;/td&gt;&lt;/tr&gt;
&lt;tr data-t=&quot;prod E S&quot;&gt;&lt;td&gt;&lt;strong&gt;Rainforest Alliance&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Rainforest Alliance&lt;/td&gt;&lt;td&gt;Agricultural and forestry sustainability&lt;/td&gt;&lt;td&gt;Standards on environment, social conditions, livelihoods&lt;/td&gt;&lt;td&gt;Recognised in the global food &amp;amp; beverage sector&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;src&quot;&gt;Sl. 46-47. &lt;em&gt;Chain-of-custody&lt;/em&gt;: traceability of certified material at every stage through to the finished product.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;&lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;B Corp: the 80-point requirement is changing&lt;/span&gt;&lt;p&gt;B Lab has revised its standards: for new certifications from 2026, points are no longer added up to reach 80; instead, companies must meet &lt;strong&gt;minimum requirements in every Impact Topic&lt;/strong&gt;, differentiated by size and sector. A weak area can no longer be offset by a strong one. &lt;a href=&quot;https://www.bcorporation.net/en-us/news/press/preliminary-consultation-suggests-new-b-corp-standards-are-ambitious-yet-attainable/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bcorporation.net&lt;/a&gt; · &lt;a href=&quot;https://bcorporation.uk/b-corp-certification/the-certification-process/improving-your-score/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bcorporation.uk&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3 id=&quot;s-iso&quot;&gt;&lt;span class=&quot;n&quot;&gt;3.5&lt;/span&gt;ISO 14001, EMAS and SA8000&lt;/h3&gt;
&lt;h4&gt;ISO 14001 and EMAS compared (sl. 48-52)&lt;/h4&gt;
&lt;p&gt;&lt;strong&gt;EMAS&lt;/strong&gt; (Eco-Management and Audit Scheme) is a &lt;strong&gt;voluntary EU regulation&lt;/strong&gt; (Reg. (EC) 1221/2009) that enables private and public organisations to evaluate, report on and improve their environmental performance &lt;strong&gt;beyond the requirements of ISO 14001&lt;/strong&gt;. It requires a &lt;strong&gt;validated environmental statement&lt;/strong&gt;, checked by accredited verifiers, and full legal compliance.&lt;/p&gt;
&lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
&lt;figure style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 420 260&quot; role=&quot;img&quot; aria-label=&quot;EMAS includes ISO 14001 and adds requirements&quot;&gt;
&lt;ellipse cx=&quot;210&quot; cy=&quot;130&quot; rx=&quot;205&quot; ry=&quot;122&quot; class=&quot;f-cbg s-c&quot; stroke-width=&quot;1.5&quot;/&gt;
&lt;ellipse cx=&quot;210&quot; cy=&quot;130&quot; rx=&quot;78&quot; ry=&quot;44&quot; class=&quot;f-c&quot;/&gt;&lt;text x=&quot;210&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; class=&quot;hl&quot; font-size=&quot;13&quot;&gt;ISO 14001&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;143&quot; text-anchor=&quot;middle&quot; class=&quot;hl&quot; font-size=&quot;11&quot;&gt;EMS approach&lt;/text&gt;
&lt;text x=&quot;210&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;15&quot;&gt;EMAS&lt;/text&gt;
