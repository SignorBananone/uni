    &lt;a href=&quot;#issue&quot;&gt;&lt;g class=&quot;nb&quot;&gt;&lt;rect x=&quot;330&quot; y=&quot;290&quot; width=&quot;240&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--ochrebg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text class=&quot;lbl b&quot; x=&quot;450&quot; y=&quot;324&quot; text-anchor=&quot;middle&quot;&gt;8 · issue → Issue&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;450&quot; y=&quot;346&quot; text-anchor=&quot;middle&quot;&gt;Schrempf: diagramma a 7 segmenti&lt;/text&gt;&lt;/g&gt;&lt;/a&gt;

&lt;!-- ============ 1. THE TRUE COST ============ --&gt;
&lt;section class=&quot;part p-brick&quot; id=&quot;caso&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Il caso di partenza&lt;/div&gt;&lt;h2&gt;The True Cost: chi paga i nostri vestiti? &lt;span class=&quot;slides&quot;&gt;slide 2–15&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;La lezione parte da un documentario sul &lt;span class=&quot;en&quot;&gt;fast fashion&lt;/span&gt; (moda veloce: collezioni continue, prezzi bassissimi, produzione delocalizzata) per porre la domanda che regge tutto il resto: &lt;b&gt;quando un danno nasce da un intero sistema, di chi è la responsabilità?&lt;/b&gt;&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;The True Cost (2015)&lt;/b&gt; — documentario diretto da Andrew Morgan sull’industria dell’abbigliamento. Il prezzo dei vestiti è sceso per decenni, mentre i costi umani e ambientali sono cresciuti. Girato dalle passerelle agli slum, con interviste a Stella McCartney, Livia Firth, Vandana Shiva e altri. &lt;small&gt;(slide 2)&lt;/small&gt;&lt;br&gt;&lt;small&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Il regista avviò il progetto dopo il crollo del Rana Plaza in Bangladesh (24 aprile 2013, oltre 1.100 morti tra i lavoratori tessili) — vedi &lt;a href=&quot;#approfondire&quot;&gt;Per approfondire&lt;/a&gt;.&lt;/small&gt;&lt;/div&gt;

  &lt;h3&gt;Le domande di discussione&lt;/h3&gt;
  &lt;p&gt;La slide 3 propone sei domande; le slide successive riportano le risposte emerse in aula. Usa le linguette.&lt;/p&gt;
  &lt;div data-tabs&gt;
    &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
      &lt;button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;t1&quot;&gt;È sostenibile?&lt;/button&gt;
      &lt;button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;t2&quot;&gt;Chi è responsabile?&lt;/button&gt;
      &lt;button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;t3&quot;&gt;Cosa vuole il film?&lt;/button&gt;
      &lt;button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;t4&quot;&gt;Cosa possiamo fare?&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tpanel&quot; data-p=&quot;t1&quot;&gt;
      &lt;p&gt;&lt;b&gt;No.&lt;/b&gt; &lt;span class=&quot;small&quot;&gt;(slide 4)&lt;/span&gt; Ricorda la definizione: &lt;i&gt;sostenibilità = preservare le risorse per le generazioni future&lt;/i&gt;. Il modello del fast fashion non guarda al futuro. I problemi emersi, raggruppati:&lt;/p&gt;
      &lt;div class=&quot;grid&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Logica economica&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;attenzione solo al profitto, non alle conseguenze su persone e ambiente&lt;/li&gt;&lt;li&gt;imperativo di ridurre i costi a scapito di sicurezza (&lt;span class=&quot;en&quot;&gt;safety, security&lt;/span&gt;)&lt;/li&gt;&lt;li&gt;concentrazione del potere in poche imprese&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Persone e paesi&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;en&quot;&gt;outsourcing&lt;/span&gt; (esternalizzazione della produzione) verso paesi con lavoro a basso costo e regole ambientali deboli&lt;/li&gt;&lt;li&gt;i paesi produttori non si sviluppano davvero&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Ambiente e futuro&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;non si considerano gli impatti delle scelte (es. cotone OGM, pesticidi)&lt;/li&gt;&lt;li&gt;nessuna attenzione alle generazioni future&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cultura e trasparenza&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;comprare a poco diventa una “moda”, un imperativo culturale&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;en&quot;&gt;consumerism&lt;/span&gt; (consumismo)&lt;/li&gt;&lt;li&gt;scarsa trasparenza della &lt;span class=&quot;en&quot;&gt;supply chain&lt;/span&gt; (catena di fornitura)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tpanel&quot; data-p=&quot;t2&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;small&quot;&gt;(slide 6)&lt;/span&gt; La risposta della classe è già un indizio: non c’è &lt;i&gt;un&lt;/i&gt; colpevole, ma molti attori.&lt;/p&gt;
      &lt;div class=&quot;grid&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Noi&lt;/h4&gt;come persone, società, consumatori, investitori.&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Governi&lt;/h4&gt;dei paesi produttori (non proteggono i cittadini, agiscono anch’essi per profitto) e dei paesi dove hanno sede i brand (dovrebbero controllare le proprie imprese).&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Imprese&lt;/h4&gt;brand del fast fashion, aziende chimiche, imprese locali (fornitori e subfornitori).&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Lavoratori&lt;/h4&gt;anche loro parte del sistema, pur essendo i più deboli.&lt;/div&gt;
      &lt;/div&gt;
      &lt;p&gt;Questa lista è già, in germe, il &lt;a href=&quot;#young&quot;&gt;social connection model&lt;/a&gt;: la responsabilità è &lt;b&gt;distribuita&lt;/b&gt; lungo la rete.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tpanel&quot; data-p=&quot;t3&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;small&quot;&gt;(slide 8)&lt;/span&gt; Gli autori vogliono: aumentare la consapevolezza (&lt;span class=&quot;en&quot;&gt;awareness&lt;/span&gt;) e il senso di responsabilità; sostenere il discorso con dati, numeri, storie di persone reali; mostrare la realtà; indurre un cambiamento delle imprese e del sistema.&lt;/p&gt;
      &lt;blockquote&gt;“My God, we can do better than this!”&lt;cite&gt;Richard D. Wolff, economista, nel film&lt;/cite&gt;&lt;/blockquote&gt;
      &lt;p&gt;Nota il ruolo che il film si dà: &lt;b&gt;portare informazione dove qualcuno preferirebbe che non arrivasse&lt;/b&gt;. È esattamente ciò che più avanti si chiama &lt;a href=&quot;#reti&quot;&gt;&lt;span class=&quot;en&quot;&gt;tertius illuminans&lt;/span&gt;&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tpanel&quot; data-p=&quot;t4&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;small&quot;&gt;(slide 10)&lt;/span&gt; Pensare di più · pensare meno e fare di più · chiudere l’&lt;span class=&quot;en&quot;&gt;attitude-behaviour gap&lt;/span&gt; · aumentare consapevolezza ed &lt;span class=&quot;en&quot;&gt;empowerment&lt;/span&gt; (capacità di far valere i propri diritti) di chi soffre.&lt;/p&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Attitude-behaviour gap&lt;/b&gt; — lo scarto tra ciò che le persone dichiarano (atteggiamento: “mi importa delle condizioni dei lavoratori”) e ciò che fanno (comportamento: compro comunque la maglietta da 5 €). È uno dei motivi per cui la consapevolezza da sola non basta.&lt;/div&gt;
      &lt;p&gt;La slide chiude con una domanda aperta: &lt;b&gt;le persone vogliono davvero cambiare?&lt;/b&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le voci del film&lt;/h3&gt;
  &lt;p&gt;Le slide 12–15 raccolgono alcune frasi. Filtrale per tipo di voce: noterai che ognuna corrisponde a un pezzo della teoria che segue.&lt;/p&gt;
  &lt;div class=&quot;ctrl&quot; data-qfilter&gt;
    &lt;button class=&quot;btn on&quot; data-f=&quot;all&quot;&gt;Tutte&lt;/button&gt;&lt;button class=&quot;btn&quot; data-f=&quot;w&quot;&gt;Lavoratori e manager&lt;/button&gt;&lt;button class=&quot;btn&quot; data-f=&quot;b&quot;&gt;Imprese&lt;/button&gt;&lt;button class=&quot;btn&quot; data-f=&quot;x&quot;&gt;Esperti e attivisti&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qgrid&quot;&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;w&quot;&gt;&lt;p&gt;“It is not right. It’s 20th century, everybody knows. Everybody should take the responsibility for that!”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Arif Jebtik — manager di una fabbrica di abbigliamento&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;w&quot;&gt;&lt;p&gt;“We have no voice in the system.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Shima Akhter — lavoratrice, Bangladesh&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;w&quot;&gt;&lt;p&gt;“The Government should know how poor we are…”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Lavoratrice, Cambogia&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;x&quot;&gt;&lt;p&gt;“You can’t deny that the fashion industry is having a high impact.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Giornalista&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;b&quot;&gt;&lt;p&gt;“We look for customers that recognize that they are part of the problem! Consumers that recognize their responsibility. Think twice before buying … asking where the products came from.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Presidente di Patagonia&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;b&quot;&gt;&lt;p&gt;“This is the beginning of a turning point not just for […] a responsible way of doing fashion, but for a new way of doing capitalism […]. Whether it’s in time or not is another question.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Safia Minney — CEO di People Tree&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;x&quot;&gt;&lt;p&gt;“What we need is a revolution of values. […] It is needed to stop treating people like things […] but instead to treat people in a real and human way.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Tim Kasser — psicologo (cita Martin Luther King Jr.)&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;b&quot;&gt;&lt;p&gt;“It’s all about the profit and it doesn’t take into consideration […] the cost of polluting the water; the cost of labour; the cost of bars on the window that people die when a fire breaks out […]. We haven’t really factored in what the true cost is.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;LaRhea Pepper — produttrice di cotone biologico&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;x&quot;&gt;&lt;p&gt;“My God, we can do better than this. […] Let the benefits be shared globally. Then let’s do that in an orderly, reasonable, careful way.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Richard D. Wolff — economista&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;x&quot;&gt;&lt;p&gt;“Capital is just money. Money is a means, and people should be accountable for how it’s used. […] We must stop talking about labor […] look at the land […] as Mother Earth.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Vandana Shiva — attivista ambientale&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;x&quot;&gt;&lt;p&gt;“In the midst of all the challenges facing us today […] maybe we could start here with clothing.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Narratore&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Collegamento: LaRhea Pepper descrive le &lt;b&gt;esternalità&lt;/b&gt; (costi generati da un’attività ma pagati da altri: acqua inquinata, salute, sicurezza) che il prezzo non incorpora: è il “true cost”. Il manager e Patagonia parlano di &lt;b&gt;responsabilità condivisa&lt;/b&gt;; la lavoratrice cambogiana chiama in causa il governo. Le ritroverai come esempi di &lt;a href=&quot;#denial&quot;&gt;denial&lt;/a&gt; nella slide 19.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · parte 1&lt;/h3&gt;&lt;ol&gt;
    &lt;li&gt;Perché, secondo la discussione in aula, il fast fashion non è sostenibile? Cita almeno tre ragioni di natura diversa.
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Non guarda alle generazioni future (definizione di sostenibilità); si concentra solo sul profitto e sulla riduzione dei costi anche a scapito della sicurezza; delocalizza dove il lavoro costa poco e le regole ambientali sono deboli; spinge un consumismo culturale (“comprare a poco”); concentra il potere in poche imprese e manca di trasparenza nella supply chain.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Che cos’è l’attitude-behaviour gap e perché è rilevante per le “soluzioni”?
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;È lo scarto tra atteggiamenti dichiarati e comportamenti effettivi. Rende insufficiente la sola consapevolezza: anche chi sa e disapprova continua a comprare. Serve quindi agire anche su strutture e incentivi, non solo sull’informazione.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Che cosa significa “true cost” nella frase di LaRhea Pepper?
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Il costo pieno di un capo, comprensivo dei costi non pagati dal produttore né dal consumatore: inquinamento dell’acqua, salari insufficienti, insicurezza delle fabbriche, mancato accesso a istruzione e salute dei coltivatori.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
  &lt;/ol&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2. DIFFUSION ============ --&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;diffusione&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Il problema teorico&lt;/div&gt;&lt;h2&gt;Governare la sostenibilità in un mondo complesso &lt;span class=&quot;slides&quot;&gt;slide 16–18&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Il caso mostra un danno senza un unico autore. Tre trasformazioni rendono questo scenario normale, e mettono in crisi il modo tradizionale di attribuire la &lt;span class=&quot;en&quot;&gt;moral responsibility&lt;/span&gt; (responsabilità morale).&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Globalization&lt;/h4&gt;Produzione e consumo attraversano culture e ordinamenti diversi: problemi &lt;b&gt;culturali, legali e di accountability&lt;/b&gt; (dover rendere conto). Quale legge vale per la fabbrica in Bangladesh che produce per un brand europeo?&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Networked economy&lt;/h4&gt;L’impresa non è più un’unità che fa tutto “in casa”: è un nodo in una rete di fornitori, subfornitori, distributori, partner.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Information economy&lt;/h4&gt;Il valore e il potere dipendono dal controllo delle informazioni: chi sa cosa, chi lo fa sapere, chi preferisce non sapere.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;b&gt;Domanda guida (slide 16):&lt;/b&gt; quali implicazioni ha tutto ciò nell’attribuire responsabilità morale?&lt;/p&gt;

  &lt;h3&gt;Agenda della lezione &lt;small&gt;(slide 17)&lt;/small&gt;&lt;/h3&gt;
  &lt;ol&gt;&lt;li&gt;La &lt;span class=&quot;en&quot;&gt;diffusion of responsibility&lt;/span&gt; e il problema della &lt;span class=&quot;en&quot;&gt;denial of responsibility&lt;/span&gt;&lt;/li&gt;&lt;li&gt;Il &lt;span class=&quot;en&quot;&gt;social connection model&lt;/span&gt; della responsabilità&lt;/li&gt;&lt;li&gt;Quando un «issue» diventa un «Issue» per le imprese&lt;/li&gt;&lt;/ol&gt;

  &lt;h3&gt;Diffusion of responsibility &lt;small&gt;(slide 18)&lt;/small&gt;&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Diffusion of responsibility&lt;/b&gt; (diffusione della responsabilità) — quando un risultato è prodotto da molti attori che si dividono il lavoro, la responsabilità si “spalma” fino a sembrare di nessuno. Ognuno contribuisce con una piccola parte e nessuno si sente autore del danno complessivo.&lt;/div&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 760 210&quot; role=&quot;img&quot; aria-label=&quot;Divisione del lavoro e diffusione della responsabilità&quot;&gt;
    &lt;g font-family=&quot;var(--sans)&quot;&gt;
      &lt;text class=&quot;lbl b&quot; x=&quot;20&quot; y=&quot;28&quot;&gt;Divisione del lavoro&lt;/text&gt;
      &lt;text class=&quot;lbl b&quot; x=&quot;420&quot; y=&quot;28&quot;&gt;… e della responsabilità?&lt;/text&gt;
      &lt;g fill=&quot;var(--slatebg)&quot; stroke=&quot;var(--slate)&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;50&quot; width=&quot;80&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;rect x=&quot;110&quot; y=&quot;50&quot; width=&quot;80&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;rect x=&quot;200&quot; y=&quot;50&quot; width=&quot;80&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;rect x=&quot;290&quot; y=&quot;50&quot; width=&quot;80&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;
      &lt;/g&gt;
      &lt;text class=&quot;lbl s&quot; x=&quot;60&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot;&gt;cotone&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;150&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot;&gt;tintura&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;240&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot;&gt;cucitura&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;330&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot;&gt;brand&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;120&quot; width=&quot;350&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;var(--brickbg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
      &lt;text class=&quot;lbl&quot; x=&quot;195&quot; y=&quot;147&quot; text-anchor=&quot;middle&quot;&gt;risultato collettivo: capo da 5 € + danno&lt;/text&gt;
      &lt;path d=&quot;M60 94V120M150 94V120M240 94V120M330 94V120&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;circle cx=&quot;560&quot; cy=&quot;110&quot; r=&quot;70&quot; fill=&quot;none&quot; stroke=&quot;var(--slate)&quot; stroke-dasharray=&quot;4 5&quot;/&gt;
      &lt;g fill=&quot;var(--slate)&quot;&gt;&lt;circle cx=&quot;520&quot; cy=&quot;80&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;600&quot; cy=&quot;90&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;545&quot; cy=&quot;145&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;590&quot; cy=&quot;140&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;560&quot; cy=&quot;110&quot; r=&quot;5&quot;/&gt;&lt;/g&gt;
      &lt;text class=&quot;lbl s&quot; x=&quot;660&quot; y=&quot;70&quot;&gt;“non è colpa mia,&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;660&quot; y=&quot;88&quot;&gt;ho fatto solo&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;660&quot; y=&quot;106&quot;&gt;la mia parte”&lt;/text&gt;
      &lt;text class=&quot;lbl b&quot; x=&quot;560&quot; y=&quot;200&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--brick)&quot; style=&quot;fill:var(--brick)&quot;&gt;Risk of denial of responsibility&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Facciamo insieme cose che da soli non potremmo fare (o non così bene, o così in fretta). Ma &lt;i&gt;finché c’è divisione del lavoro ci saranno domande su come dividere i frutti (spoils) e la responsabilità&lt;/i&gt; (slide 18).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · parte 2&lt;/h3&gt;&lt;ol&gt;
    &lt;li&gt;Quali tre trasformazioni rendono complessa l’attribuzione della responsabilità morale?
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Globalization (problemi culturali, legali e di accountability), networked economy (l’impresa come nodo di una rete), information economy (il potere passa per il controllo dell’informazione).&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Perché la divisione del lavoro genera un “rischio di negazione della responsabilità”?
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Perché ciascun attore contribuisce solo a una parte del processo; il danno emerge dall’insieme, così ognuno può dire di non esserne l’autore e la responsabilità si diffonde fino a sparire.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
  &lt;/ol&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3. DENIAL ============ --&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;denial&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Phillips (2010)&lt;/div&gt;&lt;h2&gt;General sources of denial &lt;span class=&quot;slides&quot;&gt;slide 19&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Robert A. Phillips individua tre modi tipici con cui un’organizzazione nega la propria responsabilità. Ognuno ha una &lt;b&gt;domanda chiave&lt;/b&gt; che lo smonta.&lt;/p&gt;
  &lt;div data-tabs&gt;
    &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
      &lt;button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;d1&quot;&gt;Knowledge denial&lt;/button&gt;
      &lt;button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;d2&quot;&gt;Control denial&lt;/button&gt;
      &lt;button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;d3&quot;&gt;Connection denial&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tpanel&quot; data-p=&quot;d1&quot;&gt;
      &lt;blockquote&gt;“We didn’t know.”&lt;/blockquote&gt;
      &lt;p&gt;&lt;b&gt;Domanda chiave:&lt;/b&gt; che cosa &lt;i&gt;dovrebbero&lt;/i&gt; sapere le imprese?&lt;/p&gt;
      &lt;p&gt;Non basta dire “non sapevamo”: conta ciò che un’impresa ragionevole &lt;b&gt;avrebbe dovuto sapere&lt;/b&gt; (ad es. le condizioni nelle fabbriche dei propri fornitori). L’ignoranza può essere colpevole, soprattutto se è voluta.&lt;/p&gt;
      &lt;p&gt;&lt;small&gt;Voce dal film:&lt;/small&gt; &lt;i&gt;“The Government should know how poor we are…”&lt;/i&gt; (lavoratrice cambogiana) — chi governa non può dire di non sapere.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tpanel&quot; data-p=&quot;d2&quot; hidden&gt;
      &lt;blockquote&gt;“We knew, but couldn’t do anything about it.”&lt;/blockquote&gt;
      &lt;p&gt;&lt;b&gt;Domanda chiave:&lt;/b&gt; quando, se mai, il “&lt;span class=&quot;en&quot;&gt;can&lt;/span&gt;” implica l’“&lt;span class=&quot;en&quot;&gt;ought&lt;/span&gt;”?&lt;/p&gt;
      &lt;p&gt;Cioè: se ho la &lt;b&gt;capacità&lt;/b&gt; di intervenire, ho anche il &lt;b&gt;dovere&lt;/b&gt; di farlo? È il rovescio del principio classico “&lt;span class=&quot;en&quot;&gt;ought implies can&lt;/span&gt;” (non si può essere obbligati a fare l’impossibile). Un grande brand che decide prezzi e tempi di consegna difficilmente può sostenere di non avere alcuna leva.&lt;/p&gt;
      &lt;p&gt;&lt;small&gt;Voce dal film:&lt;/small&gt; &lt;i&gt;“It is not right. It’s 20th century, everybody knows. Everybody should take the responsibility for that!”&lt;/i&gt; (manager di fabbrica)&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tpanel&quot; data-p=&quot;d3&quot; hidden&gt;
      &lt;blockquote&gt;“Whether we knew or not, it’s another organization’s problem.”&lt;/blockquote&gt;
      &lt;p&gt;&lt;b&gt;Domanda chiave:&lt;/b&gt; che cosa stabilisce una &lt;i&gt;connessione&lt;/i&gt;?&lt;/p&gt;
      &lt;p&gt;È la negazione più tipica delle reti: “il fornitore è un’altra impresa, il problema è suo”. La risposta della lezione arriverà con il &lt;a href=&quot;#young&quot;&gt;social connection model&lt;/a&gt;: si è connessi a un’ingiustizia se si partecipa ai processi strutturali che la producono.&lt;/p&gt;
      &lt;p&gt;&lt;small&gt;Voce dal film:&lt;/small&gt; &lt;i&gt;“We look for customers that recognize that they are part of the problem!”&lt;/i&gt; (Presidente di Patagonia)&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · parte 3&lt;/h3&gt;&lt;ol&gt;
    &lt;li&gt;Un brand afferma: “Il crollo è avvenuto nella fabbrica di un subfornitore che non conoscevamo nemmeno”. Quali forme di denial sta usando?
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Knowledge denial (“non sapevamo”) e connection denial (“è un problema di un’altra organizzazione”). Le domande da porre: che cosa avrebbe dovuto sapere della propria catena? Che cosa lo connette a quella fabbrica (ordini, prezzi, tempi)?&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Che cosa significa chiedersi se “can implies ought”?
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Chiedersi se la capacità di cambiare una situazione generi un obbligo di farlo. È la domanda che smonta il control denial (“sapevamo ma non potevamo fare nulla”).&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
  &lt;/ol&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4. NETWORKS ============ --&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;reti&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Phillips (2009/2010)&lt;/div&gt;&lt;h2&gt;Deniability networks, tertius gaudens e tertius illuminans &lt;span class=&quot;slides&quot;&gt;slide 20–25&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Nella &lt;span class=&quot;en&quot;&gt;network analysis&lt;/span&gt; (analisi delle reti sociali) l’informazione è potere. Nelle &lt;span class=&quot;en&quot;&gt;deniability networks&lt;/span&gt; succede il contrario: c’è chi lavora per &lt;b&gt;non&lt;/b&gt; ricevere informazioni.&lt;/p&gt;
  &lt;blockquote&gt;“Deniability networks invert the typical role of information in networks. Typically in network analysis, access to information is a source of power and the ability to broker information or avoid brokerage by other is an additional source of power for any given actor. In deniability networks an actor seeks to actively prevent the flow of information – at least to themselves.”&lt;cite&gt;Phillips, 2009: 537 (slide 20)&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Deniability network&lt;/b&gt; (rete della negabilità) — una rete organizzata in modo che un attore centrale possa dire in buona fede “non sapevo”: tra lui e il danno ci sono abbastanza intermediari da bloccare il flusso di notizie scomode. Serve a rendere credibile il &lt;a href=&quot;#denial&quot;&gt;knowledge denial&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;Structural hole e tertius gaudens &lt;small&gt;(slide 21)&lt;/small&gt;&lt;/h3&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 520 210&quot; role=&quot;img&quot; aria-label=&quot;Due gruppi collegati solo da un intermediario&quot;&gt;
    &lt;g class=&quot;ln&quot;&gt;&lt;path class=&quot;ln&quot; d=&quot;M70 60L110 110L70 160M110 110L40 110M70 60L130 60M110 110L170 115&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M350 115L380 70L400 120L440 90L460 140L420 170M400 120L460 120M380 70L420 60&quot;/&gt;&lt;/g&gt;
    &lt;path d=&quot;M170 115L260 115L350 115&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;3&quot;/&gt;
    &lt;g fill=&quot;var(--ink2)&quot;&gt;&lt;circle cx=&quot;70&quot; cy=&quot;60&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;110&quot; cy=&quot;110&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;70&quot; cy=&quot;160&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;40&quot; cy=&quot;110&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;130&quot; cy=&quot;60&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;170&quot; cy=&quot;115&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;350&quot; cy=&quot;115&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;380&quot; cy=&quot;70&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;400&quot; cy=&quot;120&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;440&quot; cy=&quot;90&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;460&quot; cy=&quot;140&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;420&quot; cy=&quot;170&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;460&quot; cy=&quot;120&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;420&quot; cy=&quot;60&quot; r=&quot;5&quot;/&gt;&lt;/g&gt;
    &lt;circle cx=&quot;260&quot; cy=&quot;115&quot; r=&quot;11&quot; fill=&quot;var(--brick)&quot;/&gt;
    &lt;text class=&quot;lbl b&quot; x=&quot;260&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--brick)&quot;&gt;Tertius gaudens&lt;/text&gt;
    &lt;text class=&quot;lbl&quot; x=&quot;260&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot;&gt;Structural hole&lt;/text&gt;
    &lt;path d=&quot;M260 46V96&quot; stroke=&quot;var(--ink2)&quot; marker-end=&quot;url(#ar)&quot; style=&quot;color:var(--ink2)&quot;/&gt;
    &lt;text class=&quot;lbl s&quot; x=&quot;90&quot; y=&quot;200&quot; text-anchor=&quot;middle&quot;&gt;gruppo A&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;410&quot; y=&quot;200&quot; text-anchor=&quot;middle&quot;&gt;gruppo B&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Due gruppi densamente connessi al loro interno, ma non tra loro: il “vuoto” tra di essi è uno &lt;b&gt;structural hole&lt;/b&gt; (buco strutturale). Chi sta nel mezzo controlla ciò che passa.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Structural hole&lt;/h4&gt;Assenza di legami diretti tra due parti di una rete. Concetto di Ronald Burt (sociologo delle reti) &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Tertius gaudens&lt;/h4&gt;Latino: “il terzo che gode”. L’attore che sta sul buco strutturale e &lt;b&gt;trae vantaggio&lt;/b&gt; dal fatto che gli altri due non comunicano: controlla informazione e scambi.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Tertius illuminans&lt;/h4&gt;Latino: “il terzo che illumina”. Un attore esterno (media, attivisti, ONG, un documentario) che &lt;b&gt;crea nuovi collegamenti&lt;/b&gt; e fa circolare l’informazione, chiudendo il buco.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il caso Nike: prova la rete &lt;small&gt;(slide 22–23, figure da Phillips 2009: 538–539)&lt;/small&gt;&lt;/h3&gt;
  &lt;figure&gt;

    &lt;/div&gt;
