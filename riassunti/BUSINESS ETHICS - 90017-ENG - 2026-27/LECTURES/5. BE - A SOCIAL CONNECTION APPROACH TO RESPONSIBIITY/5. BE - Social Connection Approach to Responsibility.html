      &lt;g class=&quot;node&quot;&gt;&lt;circle cx=&quot;380&quot; cy=&quot;320&quot; r=&quot;7&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;345&quot; text-anchor=&quot;middle&quot;&gt;Shareholders&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;info&quot; id=&quot;netinfo&quot;&gt;&lt;/div&gt;
  &lt;/figure&gt;
  &lt;div hidden&gt;
    &lt;div data-net=&quot;base&quot;&gt;&lt;h4&gt;La rete&lt;/h4&gt;&lt;p&gt;A sinistra la produzione: lavoratori indonesiani e cinesi, legati a Nike solo attraverso catene di subfornitori. A destra i legami “visibili” di Nike: clienti, azionisti, testimonial (Michael Jordan), l’Università dell’Oregon con studenti e amministrazione. Lavoratori e clienti non hanno alcun legame diretto.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-net=&quot;gaud&quot;&gt;&lt;h4&gt;Nike come tertius gaudens&lt;/h4&gt;&lt;p&gt;Nike è l’unico ponte tra il lato della produzione e quello del consumo. La catena di subfornitori fa da &lt;b&gt;muro informativo&lt;/b&gt; (la linea rossa): Nike gode della separazione, può negoziare con entrambe le parti e, se qualcosa va male nelle fabbriche, può dire “non sapevamo, è un subfornitore”. È una deniability network.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-net=&quot;illu&quot;&gt;&lt;h4&gt;Tertius illuminans&lt;/h4&gt;&lt;p&gt;Media (New York Times, 60 Minutes), organizzazioni come la FLA (Fair Labor Association) e, oggi, documentari come The True Cost creano &lt;b&gt;collegamenti diretti&lt;/b&gt; tra lavoratori, clienti, studenti e università. Il muro cade: i clienti sanno, gli studenti protestano, l’università è chiamata in causa. Nike perde la posizione di intermediario esclusivo e la negabilità. Phillips nota che i terzi “illuminanti” cambiano la &lt;b&gt;densità&lt;/b&gt; della rete e la &lt;b&gt;centralità&lt;/b&gt; degli attori.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Nel 2000 gli studenti spinsero l’Università dell’Oregon ad aderire al Worker Rights Consortium; Phil Knight, fondatore di Nike, sospese in risposta le sue donazioni all’ateneo.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Tertius illuminans in azione &lt;small&gt;(slide 24–25)&lt;/small&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Zara, novembre 2017&lt;/h4&gt;&lt;p&gt;Nei negozi Zara di Istanbul i clienti trovano nei capi biglietti dei lavoratori: &lt;i&gt;“I made this item you are going to buy, but I didn’t get paid for it.”&lt;/i&gt; Gli stessi lavoratori diventano “illuminanti”: usano il prodotto come canale per saltare il buco strutturale e parlare direttamente al consumatore.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Erano ex dipendenti di Bravo Tekstil, fornitore di Zara, Mango e Next, chiuso improvvisamente con salari arretrati non pagati; Inditex dichiarò di aver pagato il fornitore e annunciò un fondo di sostegno.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;The True Cost&lt;/h4&gt;&lt;p&gt;Il documentario stesso è un tertius illuminans: collega spettatori e lavoratori del tessile, rendendo impossibile il “non sapevamo”.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Scioperi per il clima&lt;/h4&gt;&lt;p&gt;La slide mostra Greta Thunberg (“Skolstrejk för klimatet”) e le manifestazioni per il clima: movimenti che illuminano la connessione tra i nostri modelli di produzione e consumo e la crisi climatica.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · parte 4&lt;/h3&gt;&lt;ol&gt;
    &lt;li&gt;Perché le deniability networks “invertono” il ruolo dell’informazione?
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Normalmente nelle reti l’accesso all’informazione è fonte di potere; in una deniability network un attore cerca invece di impedire che l’informazione arrivi a sé, perché non sapere gli permette di negare la responsabilità.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Distingui tertius gaudens e tertius illuminans con un esempio ciascuno.
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Tertius gaudens: chi sta su un buco strutturale e ne trae vantaggio (Nike tra lavoratori dei subfornitori e clienti). Tertius illuminans: un terzo che crea collegamenti e fa circolare l’informazione chiudendo il buco (media, ONG, The True Cost, i biglietti dei lavoratori nei capi Zara).&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Che effetto ha un tertius illuminans sulla struttura della rete?
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Aumenta la densità (più legami) e riduce la centralità/esclusività dell’intermediario, che perde il controllo sul flusso di informazione e quindi la possibilità di negare.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
  &lt;/ol&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5. RELAZIONI ============ --&gt;
&lt;section class=&quot;part p-sage&quot; id=&quot;relazioni&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Reti e responsabilità&lt;/div&gt;&lt;h2&gt;Costruire relazioni e reti per condividere le responsabilità &lt;span class=&quot;slides&quot;&gt;slide 26–27&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Le reti non servono solo a nascondersi: le organizzazioni possono costruirle per &lt;b&gt;condividere&lt;/b&gt; responsabilità. Tre teorie spiegano perché nascono.&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Resource dependency theory&lt;/h4&gt;&lt;p&gt;Le reti nascono da &lt;b&gt;cooperazione e coordinamento&lt;/b&gt; per tenere sotto controllo l’incertezza dell’ambiente. Un’organizzazione dipende da risorse che controllano altri, quindi si lega a loro.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Reciprocity theory&lt;/h4&gt;&lt;p&gt;La rete si forma per ottenere &lt;b&gt;benefici reciproci&lt;/b&gt; o per &lt;b&gt;condividere valori&lt;/b&gt;: si collabora perché conviene a entrambi o perché si crede nelle stesse cose.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Institutional theory&lt;/h4&gt;&lt;p&gt;Le organizzazioni cercano rapporti con autorità di governo e controllo (anche “altre organizzazioni”) per ottenere autorizzazioni e conformarsi alle loro linee guida: così ottengono &lt;b&gt;legittimazione&lt;/b&gt; agli occhi della società.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Testi fondativi (non citati nelle slide): Pfeffer &amp;amp; Salancik (1978) per la resource dependence; DiMaggio &amp;amp; Powell (1983) per l’institutional theory. Vedi &lt;a href=&quot;#approfondire&quot;&gt;Per approfondire&lt;/a&gt;.&lt;/p&gt;

  &lt;h3&gt;Connection and responsibility &lt;small&gt;(slide 27)&lt;/small&gt;&lt;/h3&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 700 200&quot; role=&quot;img&quot; aria-label=&quot;Percezioni asimmetriche della relazione&quot;&gt;
    &lt;rect x=&quot;20&quot; y=&quot;40&quot; width=&quot;190&quot; height=&quot;110&quot; rx=&quot;14&quot; fill=&quot;var(--sagebg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
    &lt;rect x=&quot;490&quot; y=&quot;40&quot; width=&quot;190&quot; height=&quot;110&quot; rx=&quot;14&quot; fill=&quot;var(--sagebg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
    &lt;text class=&quot;lbl b&quot; x=&quot;115&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;Attore A&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;115&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot;&gt;“siamo parte della&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;115&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot;&gt;stessa rete”&lt;/text&gt;
    &lt;text class=&quot;lbl b&quot; x=&quot;585&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;Attore B&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;585&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot;&gt;“è solo un partner&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;585&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot;&gt;arm’s-length”&lt;/text&gt;
    &lt;path d=&quot;M210 80H490&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;3&quot;/&gt;
    &lt;path d=&quot;M210 115H490&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;3 8&quot;/&gt;
    &lt;text class=&quot;lbl s&quot; x=&quot;350&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot;&gt;legame forte (visto da A)&lt;/text&gt;
    &lt;text class=&quot;lbl s&quot; x=&quot;350&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot;&gt;rapporto di mercato (visto da B)&lt;/text&gt;
    &lt;text class=&quot;lbl b&quot; x=&quot;350&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--brick)&quot;&gt;→ percezioni diverse di obblighi → connection deniability&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Nelle fasi iniziali (e a volte più a lungo) le percezioni dell’appartenenza a una rete sono asimmetriche.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Arm’s-length&lt;/b&gt; (“a distanza di braccio”) — relazione puramente di mercato tra parti indipendenti, senza legami o obblighi oltre il contratto. Se B considera A un semplice fornitore arm’s-length, si sentirà libero da responsabilità per ciò che accade da A.&lt;/div&gt;
  &lt;p&gt;Queste percezioni divergenti alimentano una forma di &lt;b&gt;connection deniability&lt;/b&gt;. Per superarla serve un &lt;b&gt;criterio critico e indipendente&lt;/b&gt; per stabilire chi è membro della rete — non basta l’autopercezione degli attori. È proprio il criterio che offrirà Young.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · parte 5&lt;/h3&gt;&lt;ol&gt;
    &lt;li&gt;Associa ogni teoria al motivo per cui si formano le reti: resource dependency, reciprocity, institutional.
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Resource dependency: cooperazione e coordinamento per controllare l’incertezza ambientale. Reciprocity: benefici reciproci o valori condivisi. Institutional: relazioni con autorità per conformarsi e ottenere legittimazione.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Perché le percezioni asimmetriche dell’appartenenza a una rete sono un problema etico?
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Perché chi si percepisce solo come partner arm’s-length si sente esente dagli obblighi della rete: ne nasce una connection deniability. Serve quindi un criterio indipendente per stabilire chi fa parte della rete.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
  &lt;/ol&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6. YOUNG ============ --&gt;
&lt;section class=&quot;part p-terra&quot; id=&quot;young&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;6&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Iris Marion Young&lt;/div&gt;&lt;h2&gt;The social connection model &lt;span class=&quot;slides&quot;&gt;slide 28–30&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Iris Marion Young (filosofa politica, autrice di &lt;i&gt;Responsibility for Justice&lt;/i&gt;) propone di fondare la responsabilità non sulla colpa ma sull’&lt;b&gt;appartenenza a processi sociali condivisi&lt;/b&gt;.&lt;/p&gt;
  &lt;blockquote&gt;“Our responsibility derives from belonging together with others in a system of interdependent processes of cooperation and competition through which we seek benefits and aim to realize projects.”&lt;cite&gt;Young, 2006: 119 (slide 29)&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Social connection approach&lt;/b&gt; — l’idea centrale è incoraggiare gli attori a considerare le &lt;b&gt;conseguenze più ampie&lt;/b&gt; delle proprie attività. I problemi sociali e ambientali sono “sistemici”, cioè &lt;i&gt;“caused by a network of actors who contribute to, enforce, or mitigate harm through their actions and interactions”&lt;/i&gt; (Schrempf, 2014: 302). Quindi attori diversi connessi a un issue &lt;b&gt;condividono&lt;/b&gt; la responsabilità.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Structural injustice&lt;/b&gt; (ingiustizia strutturale) — termine chiave di Young, sottinteso nelle slide: un’ingiustizia che non deriva dall’azione illecita di un singolo, ma dall’effetto combinato di molte azioni “normali” e legittime (comprare, ordinare, produrre) svolte dentro regole e istituzioni accettate. Il crollo di una fabbrica tessile ne è l’esempio tipico.&lt;/div&gt;

  &lt;h3&gt;Le 5 caratteristiche essenziali &lt;small&gt;(slide 30)&lt;/small&gt;&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;button class=&quot;dot on&quot; aria-label=&quot;caratteristica 1&quot;&gt;1&lt;/button&gt;&lt;button class=&quot;dot&quot; aria-label=&quot;caratteristica 2&quot;&gt;2&lt;/button&gt;&lt;button class=&quot;dot&quot; aria-label=&quot;caratteristica 3&quot;&gt;3&lt;/button&gt;&lt;button class=&quot;dot&quot; aria-label=&quot;caratteristica 4&quot;&gt;4&lt;/button&gt;&lt;button class=&quot;dot&quot; aria-label=&quot;caratteristica 5&quot;&gt;5&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;card step on&quot;&gt;&lt;h4&gt;1 · Broad perspective&lt;/h4&gt;&lt;p&gt;Invece di cercare &lt;b&gt;un singolo colpevole&lt;/b&gt;, l’attenzione va a &lt;b&gt;tutte le parti&lt;/b&gt; legate, direttamente o indirettamente, all’ingiustizia o al danno.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Nel fast fashion: non solo il proprietario della fabbrica crollata, ma brand, subfornitori, governi, consumatori, investitori.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card step&quot;&gt;&lt;h4&gt;2 · Shared responsibility&lt;/h4&gt;&lt;p&gt;La responsabilità è attribuita a un &lt;b&gt;gruppo&lt;/b&gt;; ogni individuo risponde della &lt;b&gt;propria sfera di coinvolgimento&lt;/b&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Condivisa non significa uguale né diluita: ognuno risponde per la sua parte.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card step&quot;&gt;&lt;h4&gt;3 · Future-oriented approach&lt;/h4&gt;&lt;p&gt;Il &lt;span class=&quot;en&quot;&gt;liability model&lt;/span&gt; sanziona o punisce azioni passate; il social connection model (SCM) chiede un &lt;b&gt;processo collettivo&lt;/b&gt; per trasformare la situazione guardando al &lt;b&gt;futuro&lt;/b&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;La domanda non è “chi va punito?” ma “che cosa dobbiamo cambiare, insieme, da domani?”.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card step&quot;&gt;&lt;h4&gt;4 · Assessing the entire context&lt;/h4&gt;&lt;p&gt;Tutti gli agenti svolgono un ruolo di mediazione nelle ingiustizie sociali. Sono le &lt;b&gt;background conditions&lt;/b&gt; (le condizioni di sfondo: regole, prezzi, norme, abitudini) a essere messe in discussione.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Esempio: non solo “quella fabbrica era insicura”, ma “perché il sistema premia chi produce più veloce e a minor costo?”.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card step&quot;&gt;&lt;h4&gt;5 · Collective action&lt;/h4&gt;&lt;p&gt;I problemi strutturali si risolvono solo con l’&lt;b&gt;azione collettiva&lt;/b&gt; di più parti che si uniscono.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Esempi: iniziative multi-stakeholder, accordi tra brand e sindacati, campagne di consumatori e studenti.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← precedente&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;successiva →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7. LIABILITY vs SCM ============ --&gt;
&lt;section class=&quot;part p-terra&quot; id=&quot;liability&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;7&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Confronto e parametri&lt;/div&gt;&lt;h2&gt;From Liability to Social Connection Corporate Responsibility &lt;span class=&quot;slides&quot;&gt;slide 31–33&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;La &lt;span class=&quot;en&quot;&gt;Corporate Responsibility&lt;/span&gt; (CR, responsabilità d’impresa) può essere pensata in due modi. Clicca una riga per la spiegazione.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Liability model&lt;/b&gt; (modello della colpa/imputabilità) — il modello classico, giuridico: è responsabile chi ha &lt;b&gt;causato&lt;/b&gt; il danno, eventualmente con colpa, e va sanzionato o deve risarcire. Gli altri sono assolti.&lt;/div&gt;
  &lt;table id=&quot;ltab&quot;&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Liability CR&lt;/th&gt;&lt;th&gt;Social connection CR&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr class=&quot;row&quot; data-r=&quot;0&quot;&gt;&lt;td&gt;&lt;b&gt;Causality&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;Social connection&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;row&quot; data-r=&quot;1&quot;&gt;&lt;td&gt;&lt;b&gt;Absolution of others&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;Shared responsibility&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;row&quot; data-r=&quot;2&quot;&gt;&lt;td&gt;&lt;b&gt;Retrospective argumentation&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;Prospective perspective&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;row&quot; data-r=&quot;3&quot;&gt;&lt;td&gt;&lt;b&gt;Accept static background conditions&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;Question background conditions&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;row&quot; data-r=&quot;4&quot;&gt;&lt;td&gt;&lt;b&gt;Communitarian / cosmopolitan approach&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;Mainly cosmopolitan approach&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;
  &lt;div class=&quot;info&quot; id=&quot;linfo&quot;&gt;&lt;p class=&quot;small&quot;&gt;Seleziona una riga della tabella.&lt;/p&gt;&lt;/div&gt;
  &lt;div hidden&gt;
    &lt;div data-l=&quot;0&quot;&gt;&lt;h4&gt;Su cosa si fonda la responsabilità&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Liability:&lt;/b&gt; sei responsabile se c’è un nesso causale tra la tua azione e il danno. &lt;b&gt;Social connection:&lt;/b&gt; sei responsabile perché partecipi ai processi strutturali che producono il danno, anche senza esserne la causa diretta. Esempio (Schrempf 2014): le catene di fast food non “causano” l’obesità, ma vi sono connesse.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-l=&quot;1&quot;&gt;&lt;h4&gt;Chi altro è responsabile&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Liability:&lt;/b&gt; individuato il colpevole, tutti gli altri sono assolti. &lt;b&gt;Social connection:&lt;/b&gt; trovare un responsabile non libera gli altri; ognuno condivide la responsabilità per la propria parte.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-l=&quot;2&quot;&gt;&lt;h4&gt;Direzione nel tempo&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Liability:&lt;/b&gt; guarda indietro (chi ha sbagliato? quale pena o risarcimento?). &lt;b&gt;Social connection:&lt;/b&gt; guarda avanti (come trasformiamo il sistema perché non accada di nuovo?).&lt;/p&gt;&lt;/div&gt;
    &lt;div data-l=&quot;3&quot;&gt;&lt;h4&gt;Le condizioni di sfondo&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Liability:&lt;/b&gt; prende come normale il contesto (regole di mercato, prezzi, pratiche di acquisto) e cerca la deviazione. &lt;b&gt;Social connection:&lt;/b&gt; mette in discussione proprio quel contesto “normale” che genera l’ingiustizia.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-l=&quot;4&quot;&gt;&lt;h4&gt;Fin dove arriva la responsabilità&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Communitarian&lt;/b&gt; (comunitaria): gli obblighi valgono soprattutto verso la propria comunità politica o nazione. &lt;b&gt;Cosmopolitan&lt;/b&gt; (cosmopolita): gli obblighi valgono verso tutti gli esseri umani, oltre i confini. Il liability model può adottare entrambe; il social connection model è &lt;b&gt;soprattutto cosmopolita&lt;/b&gt;, perché le catene globali collegano persone di paesi diversi.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Attenzione: per Schrempf il modello di social connection &lt;b&gt;non sostituisce&lt;/b&gt; il liability model, ma ne è una dimensione aggiuntiva &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; (abstract di Schrempf 2014). Se un’impresa causa direttamente un danno, resta “liable”.&lt;/p&gt;

  &lt;h3 id=&quot;parametri&quot;&gt;Come ragionare sulla propria responsabilità: i parametri di Young &lt;small&gt;(slide 32–33)&lt;/small&gt;&lt;/h3&gt;
  &lt;p&gt;Se tutti sono connessi, quanto deve fare ciascuno? Young indica quattro parametri.&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Power&lt;/h4&gt;&lt;p&gt;La posizione nei processi strutturali dà un certo potere di influenza. Chi non ha energie per tutte le ingiustizie a cui è connesso dovrebbe concentrarsi dove ha &lt;b&gt;più capacità di influire&lt;/b&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Young 2006, p. 127; Young 2011, p. 144&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Privilege&lt;/h4&gt;&lt;p&gt;I privilegiati possono cambiare abitudini o fare sforzi extra &lt;b&gt;senza subire gravi privazioni&lt;/b&gt;: per questo devono di più.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Young 2011, p. 145&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Interest&lt;/h4&gt;&lt;p&gt;Spesso chi ha il maggiore interesse a &lt;b&gt;perpetuare&lt;/b&gt; la struttura ha anche il maggior potere di trasformarla.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Young 2006, p. 128&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Collective ability&lt;/h4&gt;&lt;p&gt;Gli agenti spesso devono &lt;i&gt;“reorganize their activities and relationships to coordinate their action or coordinate it differently”&lt;/i&gt;: chi può organizzarsi con altri ha più responsabilità.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Young 2011, p. 147&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;h4 style=&quot;margin-top:0&quot;&gt;Strumento didattico: la bussola dei parametri&lt;/h4&gt;
    &lt;p class=&quot;small&quot;&gt;Non è nelle slide né è una formula di Young: è un esercizio per ragionare. Scegli un attore o muovi i cursori (0–10) e osserva come cambiano intensità e tipo di responsabilità.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot; data-presets&gt;
      &lt;button class=&quot;btn&quot; data-v=&quot;9,8,8,9&quot;&gt;Brand globale&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;7,4,6,7&quot;&gt;Governo paese produttore&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;3,6,3,5&quot;&gt;Consumatore europeo&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;3,5,2,8&quot;&gt;Studenti universitari&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;1,0,2,4&quot;&gt;Lavoratrice tessile&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sP&quot;&gt;Power&lt;/label&gt;&lt;input id=&quot;sP&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;oP&quot;&gt;5&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sR&quot;&gt;Privilege&lt;/label&gt;&lt;input id=&quot;sR&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;oR&quot;&gt;5&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sI&quot;&gt;Interest&lt;/label&gt;&lt;input id=&quot;sI&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;oI&quot;&gt;5&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sC&quot;&gt;Collective ability&lt;/label&gt;&lt;input id=&quot;sC&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;oC&quot;&gt;5&lt;/output&gt;&lt;/div&gt;
    &lt;p style=&quot;margin-bottom:4px&quot;&gt;&lt;b&gt;Intensità della responsabilità d’azione&lt;/b&gt; &lt;span id=&quot;score&quot; class=&quot;small&quot;&gt;&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;bar&quot;&gt;&lt;i id=&quot;bar&quot;&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;info&quot; id=&quot;sinfo&quot;&gt;&lt;/div&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · parti 6–7&lt;/h3&gt;&lt;ol&gt;
    &lt;li&gt;Da dove deriva la responsabilità secondo Young?
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Dall’appartenenza, insieme ad altri, a un sistema di processi interdipendenti di cooperazione e competizione attraverso cui cerchiamo benefici e realizziamo progetti (Young 2006: 119). Non dalla causalità o dalla colpa.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Elenca le 5 caratteristiche del social connection model.
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Broad perspective; shared responsibility; future-oriented approach; assessing the entire context (mettere in discussione le background conditions); collective action.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Completa il confronto: Causality → ? ; Retrospective argumentation → ? ; Accept static background conditions → ?
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Social connection; prospective perspective; question background conditions. (Le altre coppie: absolution of others → shared responsibility; communitarian/cosmopolitan → mainly cosmopolitan.)&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Perché il parametro “privilege” attribuisce più responsabilità al consumatore europeo che alla lavoratrice tessile?
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Perché il privilegiato può cambiare abitudini o fare sforzi aggiuntivi senza subire gravi privazioni; per chi vive in povertà ogni cambiamento ha un costo molto più alto.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
  &lt;/ol&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 8. ISSUE ============ --&gt;
&lt;section class=&quot;part p-ochre&quot; id=&quot;issue&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;8&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Schrempf (2014)&lt;/div&gt;&lt;h2&gt;Quando un issue diventa un Issue? &lt;span class=&quot;slides&quot;&gt;slide 34–35, 38&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Un problema sociale (issue con la “i” minuscola) diventa una questione che l’impresa deve affrontare (&lt;b&gt;Issue&lt;/b&gt; con la maiuscola) dall’incrocio di tre elementi.&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Business connection&lt;/h4&gt;Esiste davvero un legame tra le attività o i prodotti dell’impresa e il problema.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Internal stakeholder cognition&lt;/h4&gt;Gli stakeholder interni (manager, dipendenti, proprietà) &lt;b&gt;riconoscono&lt;/b&gt; la connessione.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;External stakeholder pressure&lt;/h4&gt;Stakeholder esterni (ONG, media, consumatori, governi) &lt;b&gt;fanno pressione&lt;/b&gt; sull’impresa.&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;p class=&quot;small&quot; style=&quot;margin-top:0&quot;&gt;Clicca un’area del diagramma (o un numero sotto) per leggere il segmento. Diagramma ridisegnato da Schrempf, 2014, p. 312.&lt;/p&gt;
    &lt;svg id=&quot;venn&quot; viewBox=&quot;0 0 480 345&quot; role=&quot;img&quot; aria-label=&quot;Diagramma di Venn a tre insiemi con sette segmenti&quot; style=&quot;cursor:pointer;max-width:560px;margin:auto&quot;&gt;
      &lt;g id=&quot;vhl&quot;&gt;&lt;/g&gt;
      &lt;circle class=&quot;vc&quot; cx=&quot;240&quot; cy=&quot;120&quot; r=&quot;95&quot;/&gt;&lt;circle class=&quot;vc&quot; cx=&quot;190&quot; cy=&quot;205&quot; r=&quot;95&quot;/&gt;&lt;circle class=&quot;vc&quot; cx=&quot;290&quot; cy=&quot;205&quot; r=&quot;95&quot;/&gt;
      &lt;text class=&quot;vt&quot; x=&quot;240&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;Business connection&lt;/text&gt;
      &lt;text class=&quot;vt&quot; x=&quot;55&quot; y=&quot;312&quot; text-anchor=&quot;middle&quot;&gt;Internal stakeholder&lt;/text&gt;&lt;text class=&quot;vt&quot; x=&quot;55&quot; y=&quot;328&quot; text-anchor=&quot;middle&quot;&gt;cognition&lt;/text&gt;
      &lt;text class=&quot;vt&quot; x=&quot;425&quot; y=&quot;312&quot; text-anchor=&quot;middle&quot;&gt;External stakeholder&lt;/text&gt;&lt;text class=&quot;vt&quot; x=&quot;425&quot; y=&quot;328&quot; text-anchor=&quot;middle&quot;&gt;pressure&lt;/text&gt;
      &lt;text class=&quot;vn&quot; x=&quot;240&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot;&gt;1&lt;/text&gt;&lt;text class=&quot;vn&quot; x=&quot;302&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot;&gt;2&lt;/text&gt;&lt;text class=&quot;vn&quot; x=&quot;240&quot; y=&quot;183&quot; text-anchor=&quot;middle&quot;&gt;3&lt;/text&gt;&lt;text class=&quot;vn&quot; x=&quot;178&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot;&gt;4&lt;/text&gt;&lt;text class=&quot;vn&quot; x=&quot;340&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot;&gt;5&lt;/text&gt;&lt;text class=&quot;vn&quot; x=&quot;240&quot; y=&quot;272&quot; text-anchor=&quot;middle&quot;&gt;6&lt;/text&gt;&lt;text class=&quot;vn&quot; x=&quot;140&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot;&gt;7&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;ctrl&quot; data-vbtn style=&quot;justify-content:center&quot;&gt;&lt;button class=&quot;btn&quot; data-s=&quot;1&quot;&gt;1&lt;/button&gt;&lt;button class=&quot;btn&quot; data-s=&quot;2&quot;&gt;2&lt;/button&gt;&lt;button class=&quot;btn&quot; data-s=&quot;3&quot;&gt;3&lt;/button&gt;&lt;button class=&quot;btn&quot; data-s=&quot;4&quot;&gt;4&lt;/button&gt;&lt;button class=&quot;btn&quot; data-s=&quot;5&quot;&gt;5&lt;/button&gt;&lt;button class=&quot;btn&quot; data-s=&quot;6&quot;&gt;6&lt;/button&gt;&lt;button class=&quot;btn&quot; data-s=&quot;7&quot;&gt;7&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;info&quot; id=&quot;vinfo&quot;&gt;&lt;p class=&quot;small&quot;&gt;Nessun segmento selezionato.&lt;/p&gt;&lt;/div&gt;
  &lt;/figure&gt;
  &lt;div hidden&gt;
    &lt;div data-v=&quot;1&quot;&gt;&lt;h4&gt;1 · Dormant connection&lt;/h4&gt;&lt;p&gt;Solo business connection. La connessione esiste ma nessuno la vede né la contesta: è “dormiente”. &lt;b&gt;La responsabilità c’è comunque&lt;/b&gt;, anche se non è (ancora) attivata.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-v=&quot;2&quot;&gt;&lt;h4&gt;2 · Externally confirmed connection&lt;/h4&gt;&lt;p&gt;Connessione reale + pressione esterna, ma l’impresa al suo interno non la riconosce. Tipico terreno di scontro tra ONG/media e impresa in fase di &lt;a href=&quot;#denial&quot;&gt;denial&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-v=&quot;3&quot;&gt;&lt;h4&gt;3 · Accepted connection&lt;/h4&gt;&lt;p&gt;Tutti e tre: la connessione esiste, l’impresa la riconosce e gli stakeholder esterni la chiedono. Qui il problema è pienamente un &lt;b&gt;Issue&lt;/b&gt; e l’azione è più probabile.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-v=&quot;4&quot;&gt;&lt;h4&gt;4 · Internally confirmed connection&lt;/h4&gt;&lt;p&gt;Connessione reale riconosciuta internamente, senza pressione esterna. Spazio per un’azione &lt;b&gt;proattiva&lt;/b&gt;, prima che arrivi la pressione.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-v=&quot;5&quot;&gt;&lt;h4&gt;5 · External artificial connection&lt;/h4&gt;&lt;p&gt;Solo pressione esterna: gli stakeholder esterni attribuiscono all’impresa un problema con cui non c’è un vero legame. È “artificiale” (vedi slide 38: gli esterni possono collegare un’impresa a un issue anche senza connessione).&lt;/p&gt;&lt;/div&gt;
    &lt;div data-v=&quot;6&quot;&gt;&lt;h4&gt;6 · Confirmed artificial connection&lt;/h4&gt;&lt;p&gt;Interni ed esterni concordano sull’esistenza di un legame che, in realtà, non c’è. Una connessione “confermata” ma comunque artificiale.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-v=&quot;7&quot;&gt;&lt;h4&gt;7 · Internal artificial connection&lt;/h4&gt;&lt;p&gt;Solo cognizione interna: in azienda si crede di essere connessi a un issue, ma non esiste una vera business connection.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Logica del diagramma: il cerchio in alto distingue le connessioni &lt;b&gt;reali&lt;/b&gt; (segmenti 1–4) da quelle &lt;b&gt;artificiali&lt;/b&gt; (5–7). Gli altri due cerchi dicono &lt;b&gt;chi&lt;/b&gt; la conferma: dentro, fuori, entrambi o nessuno.&lt;/p&gt;

  &lt;h3&gt;Business connection: come si crea &lt;small&gt;(slide 35)&lt;/small&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Attività o effetti del prodotto&lt;/h4&gt;Esempi in slide: videogiochi violenti, armi, latte artificiale per neonati, Merkel e industria dell’auto, marketing, Tamoil in Libia, GM in Sudafrica.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Diretta o indiretta&lt;/h4&gt;Diretta: la mia attività tocca il problema. Indiretta: ci arrivo attraverso fornitori, clienti, partner.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Positiva o negativa&lt;/h4&gt;Esempi in slide: Colalife (connessione positiva), Nokia Siemens Networks in Iran, IBM e il nazismo (negative).&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Voluta o non voluta&lt;/h4&gt;La connessione può essere &lt;span class=&quot;en&quot;&gt;intended&lt;/span&gt; o &lt;span class=&quot;en&quot;&gt;unintended&lt;/span&gt;: anche l’effetto non voluto connette.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Le slide citano solo i nomi dei casi. &lt;span class=&quot;ext&quot;&gt;contesto generale&lt;/span&gt; Colalife è nota per aver sfruttato gli spazi delle casse di Coca-Cola per distribuire kit anti-diarrea; il caso Nokia Siemens riguarda la vendita di tecnologie di monitoraggio delle comunicazioni all’Iran. Verifica i dettagli sul materiale del corso.&lt;/p&gt;

  &lt;h3&gt;Stakeholder interni ed esterni &lt;small&gt;(slide 38)&lt;/small&gt;&lt;/h3&gt;
  &lt;blockquote&gt;“Internal stakeholders might be cognizant of the social connection between corporate activities/products and a societal issue. This cognizance might create dynamics and encourage companies to act upon their connection. The impact of external stakeholders is more complex. External stakeholders might connect corporations to issues, irrespective of whether there is a connection […]. Therefore, external stakeholders might assign an actor responsibility for an issue without any connection.”&lt;cite&gt;slide 38 (da Schrempf 2014)&lt;/cite&gt;&lt;/blockquote&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · parte 8&lt;/h3&gt;&lt;ol&gt;
    &lt;li&gt;Quali tre elementi determinano se un issue diventa un Issue?
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Business connection, internal stakeholder cognition, external stakeholder pressure.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Che differenza c’è tra il segmento 1 e il segmento 5?
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Segmento 1 (dormant): c’è una vera connessione ma nessuno la riconosce né fa pressione. Segmento 5 (external artificial): c’è solo pressione esterna, senza vera connessione né riconoscimento interno.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Un’impresa nel segmento 1 ha responsabilità?
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Sì: per Schrempf la responsabilità esiste appena l’impresa è connessa a un issue tramite il suo business; la pressione degli stakeholder è solo un catalizzatore dell’azione (slide 39).&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
  &lt;/ol&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 9. TIPI ============ --&gt;
&lt;section class=&quot;part p-ochre&quot; id=&quot;tipi&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;9&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Schrempf (2012) e stakeholder&lt;/div&gt;&lt;h2&gt;Upstream, downstream, historical e social connection responsibility &lt;span class=&quot;slides&quot;&gt;slide 35–36, 39&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Dove si estende la responsabilità di un’impresa? La slide 36 la colloca lungo quattro direzioni. Clicca le frecce.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg id=&quot;cmp&quot; class=&quot;cmp&quot; viewBox=&quot;0 0 700 360&quot; role=&quot;img&quot; aria-label=&quot;Quattro direzioni della responsabilità attorno all&#x27;impresa&quot;&gt;
      &lt;g class=&quot;arm&quot; data-a=&quot;up&quot; tabindex=&quot;0&quot;&gt;&lt;path d=&quot;M330 45H370V110H390L350 145L310 110H330Z&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;Upstream responsibility&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;arm&quot; data-a=&quot;down&quot; tabindex=&quot;0&quot;&gt;&lt;path d=&quot;M330 315H370V250H390L350 215L310 250H330Z&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;345&quot; text-anchor=&quot;middle&quot;&gt;Downstream responsibility&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;arm&quot; data-a=&quot;hist&quot; tabindex=&quot;0&quot;&gt;&lt;path d=&quot;M110 165H240V150L280 180L240 210V195H110Z&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot;&gt;Historical responsibility&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;arm&quot; data-a=&quot;soc&quot; tabindex=&quot;0&quot;&gt;&lt;path d=&quot;M420 165H550V150L590 180L550 210V195H420Z&quot;/&gt;&lt;text x=&quot;510&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot;&gt;Social connection responsibility&lt;/text&gt;&lt;/g&gt;
      &lt;rect x=&quot;285&quot; y=&quot;150&quot; width=&quot;130&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text class=&quot;lbl b&quot; x=&quot;350&quot; y=&quot;186&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:17px&quot;&gt;Company&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;info&quot; id=&quot;cinfo&quot;&gt;&lt;p class=&quot;small&quot;&gt;Seleziona una freccia.&lt;/p&gt;&lt;/div&gt;
  &lt;/figure&gt;
  &lt;div hidden&gt;
    &lt;div data-c=&quot;up&quot;&gt;&lt;h4&gt;Upstream responsibility (a monte)&lt;/h4&gt;&lt;p&gt;Responsabilità verso la &lt;b&gt;supply chain&lt;/b&gt;: condizioni di lavoro e ambientali presso fornitori e subfornitori. Temi tipici: &lt;span class=&quot;en&quot;&gt;sweatshops&lt;/span&gt; (fabbriche-sfruttamento).&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Esempi in slide: Starbucks e caffè fair trade; Nike e i lavoratori dei subfornitori; industria dell’abbigliamento.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-c=&quot;down&quot;&gt;&lt;h4&gt;Downstream responsibility (a valle)&lt;/h4&gt;&lt;p&gt;Responsabilità verso &lt;b&gt;consumatori e società&lt;/b&gt; per l’uso e gli effetti dei prodotti: sicurezza, armi, gioco d’azzardo e videogiochi.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Esempi in slide: IBM e il nazismo; Ford e Iveco e le esecuzioni in Cina (veicoli usati da terzi per fini contrari ai diritti umani).&lt;/p&gt;&lt;/div&gt;
    &lt;div data-c=&quot;hist&quot;&gt;&lt;h4&gt;Historical responsibility (storica)&lt;/h4&gt;&lt;p&gt;Responsabilità per &lt;b&gt;eventi passati&lt;/b&gt;, anche lontani nel tempo, in cui l’impresa è stata coinvolta.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Esempio in slide: Ikea e la Germania Est. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Nel 2012 Ikea, dopo un audit di Ernst &amp;amp; Young, ha ammesso che fornitori della DDR negli anni ’70–’80 usavano anche lavoro forzato di prigionieri politici, e se n’è detta “profondamente rammaricata”.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-c=&quot;soc&quot;&gt;&lt;h4&gt;Social connection responsibility&lt;/h4&gt;&lt;p&gt;L’unica freccia che &lt;b&gt;esce&lt;/b&gt; dall’impresa: prospettiva &lt;b&gt;forward-looking&lt;/b&gt;, provare a cambiare il sistema.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Esempi in slide: fair trade, slow food.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Tre forme di responsabilità da esercitare &lt;small&gt;(slide 35, 39)&lt;/small&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Action responsibility&lt;/h4&gt;Qualsiasi comportamento concreto di CR che sostiene il cambiamento e porta a condizioni favorevoli.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Information responsibility&lt;/h4&gt;Dare conto (&lt;span class=&quot;en&quot;&gt;to give an account&lt;/span&gt;): rendicontare, essere trasparenti su ciò che si fa. È l’antidoto alla deniability network.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Participation responsibility&lt;/h4&gt;Partecipare a iniziative collettive, es. &lt;span class=&quot;en&quot;&gt;Multistakeholder initiatives&lt;/span&gt; (MSI: iniziative che riuniscono imprese, ONG, sindacati, governi). È la traduzione pratica della &lt;a href=&quot;#young&quot;&gt;collective action&lt;/a&gt; di Young.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Quali stakeholder contano? &lt;small&gt;(slide 39)&lt;/small&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Tipo di stakeholder&lt;/h4&gt;Vedi Mitchell, Agle &amp;amp; Wood (1997). &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Il loro modello di &lt;span class=&quot;en&quot;&gt;stakeholder salience&lt;/span&gt; (rilevanza) si basa su tre attributi: &lt;b&gt;power, legitimacy, urgency&lt;/b&gt;; più attributi ha uno stakeholder, più i manager gli danno priorità.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Capacità di farsi sentire&lt;/h4&gt;Dipende dalla &lt;b&gt;dipendenza&lt;/b&gt; (Frooman, 1999). &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Frooman distingue strategie di &lt;span class=&quot;en&quot;&gt;withholding&lt;/span&gt; (negare risorse all’impresa) e di &lt;span class=&quot;en&quot;&gt;usage&lt;/span&gt; (darle con condizioni), dirette o indirette tramite alleati, a seconda di chi dipende da chi.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Il punto chiave della slide 39&lt;/b&gt; — la pressione degli stakeholder funziona da &lt;b&gt;catalizzatore&lt;/b&gt; che fa scattare l’azione. Ma &lt;b&gt;la responsabilità esiste indipendentemente dalla pressione&lt;/b&gt;: appena l’impresa è connessa a un issue tramite il suo business, ha una responsabilità.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · parte 9&lt;/h3&gt;&lt;ol&gt;
    &lt;li&gt;Classifica: (a) un’impresa produttrice di armi e l’uso dei suoi prodotti; (b) un brand e le condizioni nelle fabbriche dei fornitori; (c) un’impresa e il lavoro forzato usato dai suoi fornitori 40 anni fa; (d) un’impresa che aderisce al fair trade per cambiare il sistema.
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;(a) downstream; (b) upstream; (c) historical; (d) social connection responsibility (forward-looking).&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Che differenza c’è tra action, information e participation responsibility?
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Action: comportamenti concreti che producono cambiamento. Information: dare conto, essere trasparenti. Participation: prendere parte ad azioni collettive come le multistakeholder initiatives.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Vero o falso: “Se nessuno stakeholder fa pressione, l’impresa non ha responsabilità”.
      &lt;details&gt;&lt;summary&gt;Mostra risposta&lt;/summary&gt;&lt;p&gt;Falso. La pressione è un catalizzatore dell’azione, ma la responsabilità nasce dalla connessione tramite il business (segmento 1 del diagramma: dormant connection).&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
  &lt;/ol&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ APPROFONDIRE ============ --&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;approfondire&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;→&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Fonti&lt;/div&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Riferimenti citati nelle slide (slide 41 e nel testo). I dati bibliografici e le descrizioni sono stati verificati sul web: ogni voce è &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;.&lt;/p&gt;
  &lt;p class=&quot;note&quot;&gt;Nota sulle date: le slide citano “Phillips, 2009: 537” nel testo e “Phillips (2010)” in bibliografia. È lo stesso lavoro: il discorso presidenziale del 2009 alla Society for Business Ethics, pubblicato nel 2010.&lt;/p&gt;

  &lt;h3&gt;Riferimenti della lezione&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Phillips, R. A. (2010) — Ethics and Network Organizations&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Business Ethics Quarterly, 20(3): 533–543.&lt;/div&gt;&lt;p&gt;Applica la network analysis all’etica organizzativa: introduce le deniability networks e mostra come terzi “illuminanti” (tertius illuminans) cambino densità della rete e centralità degli attori. Conta perché è la base delle parti 3–4 (fonti di denial, Nike, tertius gaudens/illuminans).&lt;/p&gt;&lt;a href=&quot;https://econpapers.repec.org/RePEc:cup:buetqu:v:20:y:2010:i:03:p:533-543_00&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda su EconPapers (RePEc)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Schrempf(-Stirling), J. (2014) — A Social Connection Approach to Corporate Responsibility: The Case of the Fast-Food Industry and Obesity&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Business &amp;amp; Society, 53(2): 300–332 · doi:10.1177/0007650312449577.&lt;/div&gt;&lt;p&gt;Propone la social connection CR come dimensione aggiuntiva (non sostitutiva) della liability CR, applicandola al caso fast food e obesità. È la fonte della tabella liability vs social connection e del diagramma a 7 segmenti.&lt;/p&gt;&lt;a href=&quot;https://scholarship.richmond.edu/management-faculty-publications/27&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Repository University of Richmond (con testo)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Young, I. M. (2004) — Responsibility and Global Labor Justice&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;The Journal of Political Philosophy, 12(4): 365–388 · doi:10.1111/j.1467-9760.2004.00205.x.&lt;/div&gt;&lt;p&gt;Usa il movimento anti-sweatshop come caso: critica il modello della liability e propone il social connection model, in cui consumatori e altri attori condividono responsabilità per le strutture che sostengono l’ingiustizia nel lavoro.&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.1111/j.1467-9760.2004.00205.x&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI dell’articolo&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Young, I. M. (2006) — Responsibility and Global Justice: A Social Connection Model&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Social Philosophy and Policy, 23(1): 102–130 · doi:10.1017/S0265052506060043.&lt;/div&gt;&lt;p&gt;Distingue il social connection model dal liability model usando proprio le filiere globali dell’abbigliamento; elenca le caratteristiche che li separano. Fonte delle citazioni “Young 2006” delle slide 29, 32, 33.&lt;/p&gt;&lt;a href=&quot;https://www.doi.org/10.1017/S0265052506060043&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge University Press (DOI)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Young, I. M. (2011) — Responsibility for Justice&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Oxford University Press; pubblicato postumo (Young morì nel 2006), prefazione di Martha Nussbaum.&lt;/div&gt;&lt;p&gt;Il libro (in copertina nella slide 28) sviluppa la responsabilità per l’ingiustizia strutturale, con applicazioni al movimento anti-sweatshop e alle ingiustizie storiche. Fonte dei parametri power, privilege, collective ability (“Young 2011”).&lt;/p&gt;&lt;a href=&quot;https://ndpr.nd.edu/reviews/responsibility-for-justice/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Recensione su Notre Dame Philosophical Reviews&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Schrempf, J. (2012) — The Delimitation of Corporate Social Responsibility: Upstream, Downstream, and Historic CSR&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Business &amp;amp; Society, 51(4): 690–707 · doi:10.1177/0007650312446734.&lt;/div&gt;&lt;p&gt;Sostiene che le nuove richieste di CSR si spiegano meglio con la logica della social connection; definisce upstream CSR (verso la supply chain), downstream CSR (verso consumatori e società) e historic CSR. È la base della parte 9.&lt;/p&gt;&lt;a href=&quot;https://scholarship.richmond.edu/management-faculty-publications/38&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Repository University of Richmond&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Mitchell, R. K., Agle, B. R. &amp;amp; Wood, D. J. (1997) — Toward a Theory of Stakeholder Identification and Salience&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Academy of Management Review, 22(4): 853–886.&lt;/div&gt;&lt;p&gt;Definisce “chi e che cosa conta davvero” tra gli stakeholder tramite tre attributi: power, legitimacy, urgency. Citato nella slide 39 per il “tipo di stakeholder”.&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.5465/amr.1997.9711022105&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI dell’articolo&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Frooman, J. (1999) — Stakeholder Influence Strategies&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Academy of Management Review, 24(2): 191–205.&lt;/div&gt;&lt;p&gt;Spiega quali strategie di influenza hanno gli stakeholder (withholding vs usage, dirette vs indirette) e come la scelta dipenda dai rapporti di dipendenza tra stakeholder e impresa. Citato nella slide 39 per la “capacità di farsi sentire”.&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.5465/amr.1999.1893928&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI dell’articolo&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Teorie e concetti richiamati&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Burt, R. S. (1992) — Structural Holes: The Social Structure of Competition&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Harvard University Press.&lt;/div&gt;&lt;p&gt;Origine dei concetti di structural hole e tertius gaudens (“il terzo che gode”): chi colma il vuoto tra due parti ottiene vantaggi di informazione e controllo. Utile per capire la slide 21.&lt;/p&gt;&lt;a href=&quot;https://papers.ssrn.com/abstract=1496205&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda su SSRN&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Pfeffer, J. &amp;amp; Salancik, G. R. (1978) — The External Control of Organizations: A Resource Dependence Perspective&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Harper &amp;amp; Row; ristampa Stanford Business Classics 2003.&lt;/div&gt;&lt;p&gt;Testo fondativo della resource dependency theory (slide 26): le organizzazioni dipendono da risorse esterne e creano relazioni inter-organizzative per gestire l’incertezza.&lt;/p&gt;&lt;a href=&quot;https://papers.ssrn.com/abstract=1496213&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda su SSRN&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;DiMaggio, P. J. &amp;amp; Powell, W. W. (1983) — The Iron Cage Revisited&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;American Sociological Review, 48: 147–160.&lt;/div&gt;&lt;p&gt;Testo chiave dell’institutional theory (slide 26): spiega perché le organizzazioni si conformano (isomorfismo coercitivo, mimetico, normativo) per ottenere legittimazione.&lt;/p&gt;&lt;a href=&quot;https://www.gsb.stanford.edu/insights/unlocking-iron-cage-corporate-conformity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Approfondimento Stanford GSB&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Casi, film e voci&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;The True Cost (2015), regia di Andrew Morgan&lt;/h4&gt;&lt;p&gt;Documentario sul fast fashion (circa 92 minuti), presentato a Cannes nel 2015; il regista lo avviò dopo il crollo del Rana Plaza. È il caso di partenza della lezione.&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/The_True_Cost&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda su Wikipedia&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Crollo del Rana Plaza (Bangladesh, 24 aprile 2013)&lt;/h4&gt;&lt;p&gt;Il crollo di un edificio che ospitava fabbriche tessili causò oltre 1.100 morti (l’ILO indica 1.135). Ne nacque l’Accord on Fire and Building Safety, accordo vincolante tra brand e sindacati globali: un esempio di collective action e di multistakeholder initiative. Non è nominato nelle slide, ma è il contesto del film.&lt;/p&gt;&lt;a href=&quot;https://www.ilo.org/resource/chronology-recent-events-bangladesh-ready-made-garment-rmg-sector&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cronologia ILO&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Nike, University of Oregon e il movimento anti-sweatshop&lt;/h4&gt;&lt;p&gt;La Fair Labor Association (FLA, citata nella slide 23) nasce nel 1999 per monitorare le fabbriche; nel 2000 gli studenti fondano il Worker Rights Consortium. Quando l’Università dell’Oregon vi aderì, Phil Knight sospese le sue donazioni: un caso reale di tertius illuminans che riconfigura la rete.&lt;/p&gt;&lt;a href=&quot;https://www.gsb.stanford.edu/faculty-research/case-studies/monitoring-factories-around-globe-fair-labor-association-worker-rights&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Caso di studio Stanford GSB (FLA e WRC)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;I biglietti nei capi Zara (Istanbul, 2017)&lt;/h4&gt;&lt;p&gt;Ex lavoratori di Bravo Tekstil, fornitore di Zara, Mango e Next, chiuso con salari non pagati, inserirono messaggi nei capi in vendita. Inditex rispose di aver pagato il fornitore e annunciò un fondo di sostegno. Caso della slide 24.&lt;/p&gt;&lt;a href=&quot;https://business-humanrights.org/en/turkey-shoppers-at-zara-find-notes-from-unpaid-factory-workers-sewn-into-clothes-incl-company-comments&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Business &amp;amp; Human Rights Resource Centre&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Black, E. (2001) — IBM and the Holocaust&lt;/h4&gt;&lt;p&gt;Il libro sostiene che la tecnologia a schede perforate di IBM e della sua filiale tedesca abbia facilitato il censimento e la persecuzione nazista; IBM ne ha criticato metodo e conclusioni. Esempio di downstream e historical responsibility (slide 35–36).&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/IBM_and_the_Holocaust&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda su Wikipedia&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Ikea e il lavoro forzato nella Germania Est&lt;/h4&gt;&lt;p&gt;Nel novembre 2012 Ikea ha pubblicato un audit di Ernst &amp;amp; Young e ammesso che suoi fornitori nella DDR usavano anche prigionieri politici; le misure prese allora furono giudicate insufficienti. Esempio di historical responsibility (slide 36).&lt;/p&gt;&lt;a href=&quot;https://csmonitor.com/Business/2012/1116/IKEA-apologizes-for-using-forced-labor-to-make-furniture&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Christian Science Monitor&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Kasser, T. (2002) — The High Price of Materialism&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;MIT Press.&lt;/div&gt;&lt;p&gt;Lo psicologo intervistato nel film: la sua ricerca lega i valori materialisti a minore benessere (più ansia, bassa autostima, relazioni più deboli). Dà sostanza al tema del consumismo della slide 4 e alla “revolution of values”.&lt;/p&gt;&lt;a href=&quot;https://www.publishersweekly.com/9780262112680&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda su Publishers Weekly&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;script&gt;
(function(){
  // tabs
  document.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(function(box){
    var tabs=box.querySelectorAll(&#x27;.tab&#x27;);
    tabs.forEach(function(t){t.addEventListener(&#x27;click&#x27;,function(){
      tabs.forEach(function(x){x.setAttribute(&#x27;aria-selected&#x27;,x===t?&#x27;true&#x27;:&#x27;false&#x27;);});
      box.querySelectorAll(&#x27;.tpanel&#x27;).forEach(function(p){p.hidden=p.getAttribute(&#x27;data-p&#x27;)!==t.getAttribute(&#x27;data-t&#x27;);});
    });});
  });
  // quote filter
  document.querySelectorAll(&#x27;[data-qfilter]&#x27;).forEach(function(c){
    var bs=c.querySelectorAll(&#x27;button&#x27;);
    bs.forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      bs.forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===b);});
      var f=b.getAttribute(&#x27;data-f&#x27;);
      document.querySelectorAll(&#x27;.q&#x27;).forEach(function(q){q.hidden=!(f===&#x27;all&#x27;||q.getAttribute(&#x27;data-k&#x27;)===f);});
    });});
  });
  function $(s){return document.querySelector(s);}
  function copy(src,dst){var el=document.querySelector(src);dst.innerHTML=el?el.innerHTML:&#x27;&#x27;;}

  // network (Nike)
  var netBtns=document.querySelectorAll(&#x27;[data-netctrl] button&#x27;);
  function setNet(m){
    netBtns.forEach(function(b){b.classList.toggle(&#x27;on&#x27;,b.getAttribute(&#x27;data-m&#x27;)===m);});
    $(&#x27;#nike&#x27;).classList.toggle(&#x27;hl&#x27;,m===&#x27;gaud&#x27;);
    document.querySelectorAll(&#x27;#edges .nk&#x27;).forEach(function(e){e.classList.toggle(&#x27;hl&#x27;,m===&#x27;gaud&#x27;);});
    $(&#x27;#wall&#x27;).classList.toggle(&#x27;on&#x27;,m===&#x27;gaud&#x27;);
    $(&#x27;#ilg&#x27;).classList.toggle(&#x27;on&#x27;,m===&#x27;illu&#x27;);
    copy(&#x27;[data-net=&quot;&#x27;+m+&#x27;&quot;]&#x27;,$(&#x27;#netinfo&#x27;));
  }
  netBtns.forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){setNet(b.getAttribute(&#x27;data-m&#x27;));});});
  setNet(&#x27;base&#x27;);

  // stepper
  document.querySelectorAll(&#x27;[data-stepper]&#x27;).forEach(function(st){
    var steps=st.querySelectorAll(&#x27;.step&#x27;),dots=st.querySelectorAll(&#x27;.dot&#x27;),i=0;
    function go(n){i=(n+steps.length)%steps.length;steps.forEach(function(s,k){s.classList.toggle(&#x27;on&#x27;,k===i);});dots.forEach(function(d,k){d.classList.toggle(&#x27;on&#x27;,k===i);});}
    dots.forEach(function(d,k){d.addEventListener(&#x27;click&#x27;,function(){go(k);});});
    st.querySelector(&#x27;[data-prev]&#x27;).addEventListener(&#x27;click&#x27;,function(){go(i-1);});
    st.querySelector(&#x27;[data-next]&#x27;).addEventListener(&#x27;click&#x27;,function(){go(i+1);});
  });

  // liability table
  var rows=document.querySelectorAll(&#x27;#ltab tr.row&#x27;);
  rows.forEach(function(r){r.tabIndex=0;function act(){rows.forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===r);});copy(&#x27;[data-l=&quot;&#x27;+r.getAttribute(&#x27;data-r&#x27;)+&#x27;&quot;]&#x27;,$(&#x27;#linfo&#x27;));}
    r.addEventListener(&#x27;click&#x27;,act);r.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();act();}});});

  // sliders (strumento didattico)
  var ids=[&#x27;P&#x27;,&#x27;R&#x27;,&#x27;I&#x27;,&#x27;C&#x27;],names={P:&#x27;power&#x27;,R:&#x27;privilege&#x27;,I:&#x27;interest&#x27;,C:&#x27;collective ability&#x27;};
  var tips={
    P:&#x27;Il parametro dominante è il &lt;b&gt;power&lt;/b&gt;: concentrati dove la tua posizione ti dà più leva sui processi (es. per un brand: prezzi d’acquisto, tempi di consegna, scelta e controllo dei fornitori).&#x27;,
    R:&#x27;Il parametro dominante è il &lt;b&gt;privilege&lt;/b&gt;: puoi cambiare abitudini o fare sforzi extra senza gravi privazioni (comprare meno e meglio, informarti, sostenere chi chiede cambiamenti).&#x27;,
    I:&#x27;Il parametro dominante è l’&lt;b&gt;interest&lt;/b&gt;: se trai vantaggio dalla struttura così com’è, hai anche più motivi e mezzi per trasformarla; se ne sei vittima, il tuo interesse al cambiamento ti rende voce essenziale nell’azione collettiva.&#x27;,
    C:&#x27;Il parametro dominante è la &lt;b&gt;collective ability&lt;/b&gt;: puoi riorganizzare relazioni e coordinarti con altri (sindacati, campagne, multistakeholder initiatives, associazioni studentesche).&#x27;

            s&gt;=40?&#x27;&lt;h4&gt;Responsabilità significativa&lt;/h4&gt;&lt;p&gt;L’attore ha margini reali per contribuire al cambiamento, soprattutto insieme ad altri.&lt;/p&gt;&#x27;:
            &#x27;&lt;h4&gt;Responsabilità presente ma limitata&lt;/h4&gt;&lt;p&gt;Anche chi ha poco potere è connesso alla struttura: il suo contributo passa soprattutto dal far sentire la propria voce e dall’unirsi ad altri.&lt;/p&gt;&#x27;;
