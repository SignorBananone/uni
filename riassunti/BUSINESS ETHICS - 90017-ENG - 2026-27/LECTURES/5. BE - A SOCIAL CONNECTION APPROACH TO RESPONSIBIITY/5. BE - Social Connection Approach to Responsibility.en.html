  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Phillips, R. A. (2010) — Ethics and Network Organizations&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Business Ethics Quarterly, 20(3): 533–543.&lt;/div&gt;&lt;p&gt;Applies network analysis to organizational ethics: introduces deniability networks and shows how “illuminating” third parties (tertius illuminans) change network density and actor centrality. It matters because it underpins parts 3–4 (sources of denial, Nike, tertius gaudens/illuminans).&lt;/p&gt;&lt;a href=&quot;https://econpapers.repec.org/RePEc:cup:buetqu:v:20:y:2010:i:03:p:533-543_00&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers (RePEc) record&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Schrempf(-Stirling), J. (2014) — A Social Connection Approach to Corporate Responsibility: The Case of the Fast-Food Industry and Obesity&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Business &amp;amp; Society, 53(2): 300–332 · doi:10.1177/0007650312449577.&lt;/div&gt;&lt;p&gt;Proposes social connection CR as an additional (not a substitute) dimension of liability CR, applying it to the case of fast food and obesity. It is the source of the liability vs social connection table and of the 7-segment diagram.&lt;/p&gt;&lt;a href=&quot;https://scholarship.richmond.edu/management-faculty-publications/27&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Richmond repository (with full text)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Young, I. M. (2004) — Responsibility and Global Labor Justice&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;The Journal of Political Philosophy, 12(4): 365–388 · doi:10.1111/j.1467-9760.2004.00205.x.&lt;/div&gt;&lt;p&gt;Uses the anti-sweatshop movement as a case: criticizes the liability model and proposes the social connection model, in which consumers and other actors share responsibility for the structures that sustain labour injustice.&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.1111/j.1467-9760.2004.00205.x&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Article DOI&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Young, I. M. (2006) — Responsibility and Global Justice: A Social Connection Model&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Social Philosophy and Policy, 23(1): 102–130 · doi:10.1017/S0265052506060043.&lt;/div&gt;&lt;p&gt;Distinguishes the social connection model from the liability model using global apparel supply chains; lists the features that separate them. Source of the “Young 2006” quotations in slides 29, 32 and 33.&lt;/p&gt;&lt;a href=&quot;https://www.doi.org/10.1017/S0265052506060043&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge University Press (DOI)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Young, I. M. (2011) — Responsibility for Justice&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Oxford University Press; published posthumously (Young died in 2006), with a foreword by Martha Nussbaum.&lt;/div&gt;&lt;p&gt;The book (whose cover appears on slide 28) develops the idea of responsibility for structural injustice, with applications to the anti-sweatshop movement and historical injustices. Source of the parameters power, privilege and collective ability (“Young 2011”).&lt;/p&gt;&lt;a href=&quot;https://ndpr.nd.edu/reviews/responsibility-for-justice/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Review in Notre Dame Philosophical Reviews&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Schrempf, J. (2012) — The Delimitation of Corporate Social Responsibility: Upstream, Downstream, and Historic CSR&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Business &amp;amp; Society, 51(4): 690–707 · doi:10.1177/0007650312446734.&lt;/div&gt;&lt;p&gt;Argues that new CSR demands are best explained by the logic of social connection; defines upstream CSR (towards the supply chain), downstream CSR (towards consumers and society) and historic CSR. It underpins part 9.&lt;/p&gt;&lt;a href=&quot;https://scholarship.richmond.edu/management-faculty-publications/38&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Richmond repository&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Mitchell, R. K., Agle, B. R. &amp;amp; Wood, D. J. (1997) — Toward a Theory of Stakeholder Identification and Salience&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Academy of Management Review, 22(4): 853–886.&lt;/div&gt;&lt;p&gt;Defines “who and what really counts” among stakeholders through three attributes: power, legitimacy, urgency. Cited in slide 39 for the “type of stakeholder”.&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.5465/amr.1997.9711022105&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Article DOI&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Frooman, J. (1999) — Stakeholder Influence Strategies&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Academy of Management Review, 24(2): 191–205.&lt;/div&gt;&lt;p&gt;Explains which influence strategies stakeholders have (withholding vs usage, direct vs indirect) and how the choice depends on the dependence relationships between stakeholders and the firm. Cited in slide 39 for the “ability to make themselves heard”.&lt;/p&gt;&lt;a href=&quot;https://doi.org/10.5465/amr.1999.1893928&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Article DOI&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Theories and concepts referred to&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Burt, R. S. (1992) — Structural Holes: The Social Structure of Competition&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Harvard University Press.&lt;/div&gt;&lt;p&gt;Origin of the concepts of structural hole and tertius gaudens (“the third who rejoices”): whoever bridges the gap between two parties gains advantages of information and control. Useful for understanding slide 21.&lt;/p&gt;&lt;a href=&quot;https://papers.ssrn.com/abstract=1496205&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SSRN record&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Pfeffer, J. &amp;amp; Salancik, G. R. (1978) — The External Control of Organizations: A Resource Dependence Perspective&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;Harper &amp;amp; Row; reissued as a Stanford Business Classic, 2003.&lt;/div&gt;&lt;p&gt;The foundational text of resource dependency theory (slide 26): organizations depend on external resources and create inter-organizational relationships to manage uncertainty.&lt;/p&gt;&lt;a href=&quot;https://papers.ssrn.com/abstract=1496213&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SSRN record&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;DiMaggio, P. J. &amp;amp; Powell, W. W. (1983) — The Iron Cage Revisited&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;American Sociological Review, 48: 147–160.&lt;/div&gt;&lt;p&gt;A key text of institutional theory (slide 26): explains why organizations conform (coercive, mimetic and normative isomorphism) in order to gain legitimacy.&lt;/p&gt;&lt;a href=&quot;https://www.gsb.stanford.edu/insights/unlocking-iron-cage-corporate-conformity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Stanford GSB article&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Cases, films and voices&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;The True Cost (2015), directed by Andrew Morgan&lt;/h4&gt;&lt;p&gt;A documentary on fast fashion (about 92 minutes), premiered at Cannes in 2015; the director began it after the Rana Plaza collapse. It is the lecture’s starting case.&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/The_True_Cost&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia entry&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Rana Plaza collapse (Bangladesh, 24 April 2013)&lt;/h4&gt;&lt;p&gt;The collapse of a building housing garment factories killed more than 1,100 people (the ILO reports 1,135). It led to the Accord on Fire and Building Safety, a binding agreement between brands and global trade unions: an example of collective action and of a multistakeholder initiative. It is not named in the slides, but it is the context of the film.&lt;/p&gt;&lt;a href=&quot;https://www.ilo.org/resource/chronology-recent-events-bangladesh-ready-made-garment-rmg-sector&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ILO chronology&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Nike, the University of Oregon and the anti-sweatshop movement&lt;/h4&gt;&lt;p&gt;The Fair Labor Association (FLA, cited in slide 23) was founded in 1999 to monitor factories; in 2000 students founded the Worker Rights Consortium. When the University of Oregon joined it, Phil Knight suspended his donations: a real-world case of a tertius illuminans reconfiguring the network.&lt;/p&gt;&lt;a href=&quot;https://www.gsb.stanford.edu/faculty-research/case-studies/monitoring-factories-around-globe-fair-labor-association-worker-rights&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Stanford GSB case study (FLA and WRC)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;The notes in Zara garments (Istanbul, 2017)&lt;/h4&gt;&lt;p&gt;Former workers of Bravo Tekstil, a supplier to Zara, Mango and Next that closed with wages unpaid, slipped messages into garments on sale. Inditex replied that it had paid the supplier and announced a hardship fund. The case in slide 24.&lt;/p&gt;&lt;a href=&quot;https://business-humanrights.org/en/turkey-shoppers-at-zara-find-notes-from-unpaid-factory-workers-sewn-into-clothes-incl-company-comments&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Business &amp;amp; Human Rights Resource Centre&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Black, E. (2001) — IBM and the Holocaust&lt;/h4&gt;&lt;p&gt;The book argues that the punch-card technology of IBM and its German subsidiary facilitated the Nazi census and persecution; IBM has criticized its method and conclusions. An example of downstream and historical responsibility (slides 35–36).&lt;/p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/IBM_and_the_Holocaust&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia entry&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Ikea and forced labour in East Germany&lt;/h4&gt;&lt;p&gt;In November 2012 Ikea published an Ernst &amp;amp; Young audit and admitted that its suppliers in the GDR had also used political prisoners; the measures it took at the time were judged insufficient. An example of historical responsibility (slide 36).&lt;/p&gt;&lt;a href=&quot;https://csmonitor.com/Business/2012/1116/IKEA-apologizes-for-using-forced-labor-to-make-furniture&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Christian Science Monitor&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Kasser, T. (2002) — The High Price of Materialism&lt;/h4&gt;&lt;div class=&quot;bib&quot;&gt;MIT Press.&lt;/div&gt;&lt;p&gt;The psychologist interviewed in the film: his research links materialistic values to lower well-being (more anxiety, low self-esteem, weaker relationships). It gives substance to the theme of consumerism in slide 4 and to the “revolution of values”.&lt;/p&gt;&lt;a href=&quot;https://www.publishersweekly.com/9780262112680&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Publishers Weekly listing&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;



&lt;/main&gt;

&lt;footer&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;
&lt;/div&gt;
&lt;/footer&gt;

&lt;script&gt;
(function(){
  // tabs
  document.querySelectorAll(&#x27;[data-tabs]&#x27;).forEach(function(box){
    var tabs=box.querySelectorAll(&#x27;.tab&#x27;);
    tabs.forEach(function(t){t.addEventListener(&#x27;click&#x27;,function(){
      tabs.forEach(function(x){x.setAttribute(&#x27;aria-selected&#x27;,x===t?&#x27;true&#x27;:&#x27;false&#x27;);});
      box.querySelectorAll(&#x27;.tpanel&#x27;).forEach(function(p){p.hidden=p.getAttribute(&#x27;data-p&#x27;)!==t.getAttribute(&#x27;data-t&#x27;);});
    });});
  });
  // quote filter
  document.querySelectorAll(&#x27;[data-qfilter]&#x27;).forEach(function(c){
    var bs=c.querySelectorAll(&#x27;button&#x27;);
    bs.forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      bs.forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===b);});
      var f=b.getAttribute(&#x27;data-f&#x27;);
      document.querySelectorAll(&#x27;.q&#x27;).forEach(function(q){q.hidden=!(f===&#x27;all&#x27;||q.getAttribute(&#x27;data-k&#x27;)===f);});
    });});
  });
  function $(s){return document.querySelector(s);}
  function copy(src,dst){var el=document.querySelector(src);dst.innerHTML=el?el.innerHTML:&#x27;&#x27;;}

  // network (Nike)
  var netBtns=document.querySelectorAll(&#x27;[data-netctrl] button&#x27;);
  function setNet(m){
    netBtns.forEach(function(b){b.classList.toggle(&#x27;on&#x27;,b.getAttribute(&#x27;data-m&#x27;)===m);});
    $(&#x27;#nike&#x27;).classList.toggle(&#x27;hl&#x27;,m===&#x27;gaud&#x27;);
    document.querySelectorAll(&#x27;#edges .nk&#x27;).forEach(function(e){e.classList.toggle(&#x27;hl&#x27;,m===&#x27;gaud&#x27;);});
    $(&#x27;#wall&#x27;).classList.toggle(&#x27;on&#x27;,m===&#x27;gaud&#x27;);
    $(&#x27;#ilg&#x27;).classList.toggle(&#x27;on&#x27;,m===&#x27;illu&#x27;);
    copy(&#x27;[data-net=&quot;&#x27;+m+&#x27;&quot;]&#x27;,$(&#x27;#netinfo&#x27;));
  }
  netBtns.forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){setNet(b.getAttribute(&#x27;data-m&#x27;));});});
  setNet(&#x27;base&#x27;);

  // stepper
  document.querySelectorAll(&#x27;[data-stepper]&#x27;).forEach(function(st){
    var steps=st.querySelectorAll(&#x27;.step&#x27;),dots=st.querySelectorAll(&#x27;.dot&#x27;),i=0;
    function go(n){i=(n+steps.length)%steps.length;steps.forEach(function(s,k){s.classList.toggle(&#x27;on&#x27;,k===i);});dots.forEach(function(d,k){d.classList.toggle(&#x27;on&#x27;,k===i);});}
    dots.forEach(function(d,k){d.addEventListener(&#x27;click&#x27;,function(){go(k);});});
    st.querySelector(&#x27;[data-prev]&#x27;).addEventListener(&#x27;click&#x27;,function(){go(i-1);});
    st.querySelector(&#x27;[data-next]&#x27;).addEventListener(&#x27;click&#x27;,function(){go(i+1);});
  });

  // liability table
  var rows=document.querySelectorAll(&#x27;#ltab tr.row&#x27;);
  rows.forEach(function(r){r.tabIndex=0;function act(){rows.forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===r);});copy(&#x27;[data-l=&quot;&#x27;+r.getAttribute(&#x27;data-r&#x27;)+&#x27;&quot;]&#x27;,$(&#x27;#linfo&#x27;));}
    r.addEventListener(&#x27;click&#x27;,act);r.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();act();}});});

  // sliders (strumento didattico)
  var ids=[&#x27;P&#x27;,&#x27;R&#x27;,&#x27;I&#x27;,&#x27;C&#x27;],names={P:&#x27;power&#x27;,R:&#x27;privilege&#x27;,I:&#x27;interest&#x27;,C:&#x27;collective ability&#x27;};
  var tips={
    P:&#x27;The dominant parameter is &lt;b&gt;power&lt;/b&gt;: focus where your position gives you the most leverage over the processes (e.g. for a brand: purchase prices, delivery times, selection and oversight of suppliers).&#x27;,
    R:&#x27;The dominant parameter is &lt;b&gt;privilege&lt;/b&gt;: you can change habits or make extra efforts without serious deprivation (buying less and better, keeping informed, supporting those who demand change).&#x27;,
    I:&#x27;The dominant parameter is &lt;b&gt;interest&lt;/b&gt;: if you benefit from the structure as it stands, you also have more reasons and means to transform it; if you are its victim, your interest in change makes you an essential voice in collective action.&#x27;,
    C:&#x27;The dominant parameter is &lt;b&gt;collective ability&lt;/b&gt;: you can reorganize relationships and coordinate with others (trade unions, campaigns, multistakeholder initiatives, student associations).&#x27;
  };
  function upd(){
    var v={};ids.forEach(function(k){v[k]=+$(&#x27;#s&#x27;+k).value;$(&#x27;#o&#x27;+k).textContent=v[k];});
    var s=Math.round((v.P*0.35+v.R*0.25+v.I*0.2+v.C*0.2)*10);
    $(&#x27;#bar&#x27;).style.width=s+&#x27;%&#x27;;$(&#x27;#score&#x27;).textContent=&#x27;(&#x27;+s+&#x27;/100, indicative)&#x27;;
    var top=ids.slice().sort(function(a,b){return v[b]-v[a];})[0];
    var lvl=s&gt;=70?&#x27;&lt;h4&gt;Strong, priority responsibility&lt;/h4&gt;&lt;p&gt;An actor like this can shift the structure: for Young, it should concentrate its energy and resources precisely here.&lt;/p&gt;&#x27;:
            s&gt;=40?&#x27;&lt;h4&gt;Significant responsibility&lt;/h4&gt;&lt;p&gt;The actor has real scope to contribute to change, especially together with others.&lt;/p&gt;&#x27;:
            &#x27;&lt;h4&gt;Present but limited responsibility&lt;/h4&gt;&lt;p&gt;Even those with little power are connected to the structure: their contribution lies mainly in making their voice heard and joining with others.&lt;/p&gt;&#x27;;
    $(&#x27;#sinfo&#x27;).innerHTML=lvl+&#x27;&lt;p&gt;&#x27;+tips[top]+&#x27;&lt;/p&gt;&#x27;;
  }
  ids.forEach(function(k){$(&#x27;#s&#x27;+k).addEventListener(&#x27;input&#x27;,upd);});
  document.querySelectorAll(&#x27;[data-presets] button&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
    var a=b.getAttribute(&#x27;data-v&#x27;).split(&#x27;,&#x27;);ids.forEach(function(k,j){$(&#x27;#s&#x27;+k).value=a[j];});
    document.querySelectorAll(&#x27;[data-presets] button&#x27;).forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===b);});upd();});});
  upd();

  // Venn (Schrempf)
  var NS=&#x27;http://www.w3.org/2000/svg&#x27;,venn=$(&#x27;#venn&#x27;);
  var C=[{x:240,y:120},{x:190,y:205},{x:290,y:205}],R=95;
  var SEG={1:[1,0,0],2:[1,0,1],3:[1,1,1],4:[1,1,0],5:[0,0,1],6:[0,1,1],7:[0,1,0]};
  function mk(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}
  var defs=mk(&#x27;defs&#x27;,{});venn.insertBefore(defs,venn.firstChild);
  C.forEach(function(c,i){
    var cp=mk(&#x27;clipPath&#x27;,{id:&#x27;vc&#x27;+i});cp.appendChild(mk(&#x27;circle&#x27;,{cx:c.x,cy:c.y,r:R}));defs.appendChild(cp);
    var m=mk(&#x27;mask&#x27;,{id:&#x27;vm&#x27;+i,maskUnits:&#x27;userSpaceOnUse&#x27;,x:0,y:0,width:480,height:345});
    m.appendChild(mk(&#x27;rect&#x27;,{x:0,y:0,width:480,height:345,fill:&#x27;#fff&#x27;}));m.appendChild(mk(&#x27;circle&#x27;,{cx:c.x,cy:c.y,r:R,fill:&#x27;#000&#x27;}));defs.appendChild(m);
  });
  function showSeg(n){
    var hl=$(&#x27;#vhl&#x27;);hl.innerHTML=&#x27;&#x27;;
    var node=mk(&#x27;rect&#x27;,{x:0,y:0,width:480,height:345,fill:&#x27;var(--ochre)&#x27;,&#x27;fill-opacity&#x27;:&#x27;0.45&#x27;});
    SEG[n].forEach(function(inc,i){var g=mk(&#x27;g&#x27;,inc?{&#x27;clip-path&#x27;:&#x27;url(#vc&#x27;+i+&#x27;)&#x27;}:{mask:&#x27;url(#vm&#x27;+i+&#x27;)&#x27;});g.appendChild(node);node=g;});
    hl.appendChild(node);
    document.querySelectorAll(&#x27;[data-vbtn] button&#x27;).forEach(function(b){b.classList.toggle(&#x27;on&#x27;,+b.getAttribute(&#x27;data-s&#x27;)===n);});
    copy(&#x27;[data-v=&quot;&#x27;+n+&#x27;&quot;]&#x27;,$(&#x27;#vinfo&#x27;));
  }
  venn.addEventListener(&#x27;click&#x27;,function(e){
    var pt=venn.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;var p=pt.matrixTransform(venn.getScreenCTM().inverse());
    var k=C.map(function(c){return (p.x-c.x)*(p.x-c.x)+(p.y-c.y)*(p.y-c.y)&lt;=R*R?1:0;}).join(&#x27;&#x27;);
    for(var n in SEG){if(SEG[n].join(&#x27;&#x27;)===k){showSeg(+n);return;}}
  });
  document.querySelectorAll(&#x27;[data-vbtn] button&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){showSeg(+b.getAttribute(&#x27;data-s&#x27;));});});

  // compass (upstream/downstream…)
  var arms=document.querySelectorAll(&#x27;#cmp .arm&#x27;);
  arms.forEach(function(a){function act(){arms.forEach(function(x){x.classList.toggle(&#x27;on&#x27;,x===a);});copy(&#x27;[data-c=&quot;&#x27;+a.getAttribute(&#x27;data-a&#x27;)+&#x27;&quot;]&#x27;,$(&#x27;#cinfo&#x27;));}
    a.addEventListener(&#x27;click&#x27;,act);a.addEventListener(&#x27;keydown&#x27;,function(e){if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();act();}});});
})();
&lt;/script&gt;
