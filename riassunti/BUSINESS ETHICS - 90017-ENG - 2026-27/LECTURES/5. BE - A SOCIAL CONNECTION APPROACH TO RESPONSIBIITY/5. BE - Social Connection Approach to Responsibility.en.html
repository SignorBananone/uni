&lt;main class=&quot;wrap&quot;&gt;

&lt;!-- ============ 1. THE TRUE COST ============ --&gt;
&lt;section class=&quot;part p-brick&quot; id=&quot;caso&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;The starting case&lt;/div&gt;&lt;h2&gt;The True Cost: who pays for our clothes? &lt;span class=&quot;slides&quot;&gt;slides 2–15&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;The lecture opens with a documentary on &lt;span class=&quot;en&quot;&gt;fast fashion&lt;/span&gt; (continuous collections, rock-bottom prices, offshored production) to raise the question on which everything else rests: &lt;b&gt;when harm arises from an entire system, whose responsibility is it?&lt;/b&gt;&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;The True Cost (2015)&lt;/b&gt; — a documentary directed by Andrew Morgan about the clothing industry. The price of clothing has fallen for decades, while its human and environmental costs have risen. Filmed from the catwalks to the slums, with interviews with Stella McCartney, Livia Firth, Vandana Shiva and others. &lt;small&gt;(slide 2)&lt;/small&gt;&lt;br&gt;&lt;small&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The director started the project after the Rana Plaza collapse in Bangladesh (24 April 2013, more than 1,100 garment workers killed) — see &lt;a href=&quot;#approfondire&quot;&gt;Further reading&lt;/a&gt;.&lt;/small&gt;&lt;/div&gt;

  &lt;h3&gt;The discussion questions&lt;/h3&gt;
  &lt;p&gt;Slide 3 poses six questions; the following slides report the answers that emerged in class. Use the tabs.&lt;/p&gt;
  &lt;div data-tabs&gt;
    &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
      &lt;button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;t1&quot;&gt;Is it sustainable?&lt;/button&gt;
      &lt;button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;t2&quot;&gt;Who is responsible?&lt;/button&gt;
      &lt;button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;t3&quot;&gt;What does the film want?&lt;/button&gt;
      &lt;button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;t4&quot;&gt;What can we do?&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tpanel&quot; data-p=&quot;t1&quot;&gt;
      &lt;p&gt;&lt;b&gt;No.&lt;/b&gt; &lt;span class=&quot;small&quot;&gt;(slide 4)&lt;/span&gt; Recall the definition: &lt;i&gt;sustainability = preserving resources for future generations&lt;/i&gt;. The fast-fashion model does not look to the future. The problems identified, grouped:&lt;/p&gt;
      &lt;div class=&quot;grid&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Economic logic&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;focus on profit only, not on the consequences for people and the environment&lt;/li&gt;&lt;li&gt;the imperative to cut costs at the expense of &lt;span class=&quot;en&quot;&gt;safety and security&lt;/span&gt;&lt;/li&gt;&lt;li&gt;concentration of power in a few firms&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;People and countries&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;en&quot;&gt;outsourcing&lt;/span&gt; of production to countries with low-cost labour and weak environmental regulation&lt;/li&gt;&lt;li&gt;producing countries do not genuinely develop&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Environment and the future&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;the impacts of choices are ignored (e.g. GM cotton, pesticides)&lt;/li&gt;&lt;li&gt;no concern for future generations&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Culture and transparency&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;buying cheap becomes a “fashion”, a cultural imperative&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;en&quot;&gt;consumerism&lt;/span&gt;&lt;/li&gt;&lt;li&gt;lack of transparency in the &lt;span class=&quot;en&quot;&gt;supply chain&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tpanel&quot; data-p=&quot;t2&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;small&quot;&gt;(slide 6)&lt;/span&gt; The class’s answer is already a clue: there is not &lt;i&gt;one&lt;/i&gt; culprit, but many actors.&lt;/p&gt;
      &lt;div class=&quot;grid&quot;&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Us&lt;/h4&gt;as individuals, society, consumers, investors.&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Governments&lt;/h4&gt;of producing countries (they fail to protect citizens and also act for profit) and of the countries where brands are headquartered (they should oversee their own firms).&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Companies&lt;/h4&gt;fast-fashion brands, chemical companies, local firms (suppliers and sub-contractors).&lt;/div&gt;
        &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Workers&lt;/h4&gt;also part of the system, even though they are the weakest.&lt;/div&gt;
      &lt;/div&gt;
      &lt;p&gt;This list already contains, in embryo, the &lt;a href=&quot;#young&quot;&gt;social connection model&lt;/a&gt;: responsibility is &lt;b&gt;distributed&lt;/b&gt; across the network.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tpanel&quot; data-p=&quot;t3&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;small&quot;&gt;(slide 8)&lt;/span&gt; The filmmakers aim to: raise &lt;span class=&quot;en&quot;&gt;awareness&lt;/span&gt; and a sense of responsibility; support the argument with data, figures and the stories of real people; show reality; bring about change in companies and in the system.&lt;/p&gt;
      &lt;blockquote&gt;“My God, we can do better than this!”&lt;cite&gt;Richard D. Wolff, economist, in the film&lt;/cite&gt;&lt;/blockquote&gt;
      &lt;p&gt;Note the role the film assigns itself: &lt;b&gt;bringing information where someone would prefer it not to arrive&lt;/b&gt;. This is exactly what will later be called the &lt;a href=&quot;#reti&quot;&gt;&lt;span class=&quot;en&quot;&gt;tertius illuminans&lt;/span&gt;&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tpanel&quot; data-p=&quot;t4&quot; hidden&gt;
      &lt;p&gt;&lt;span class=&quot;small&quot;&gt;(slide 10)&lt;/span&gt; Think more · think less and do more · close the &lt;span class=&quot;en&quot;&gt;attitude-behaviour gap&lt;/span&gt; · increase the awareness and &lt;span class=&quot;en&quot;&gt;empowerment&lt;/span&gt; (the capacity to assert one’s rights) of those who suffer.&lt;/p&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Attitude-behaviour gap&lt;/b&gt; — the gap between what people state (attitude: “I care about workers’ conditions”) and what they do (behaviour: I buy the €5 T-shirt anyway). It is one of the reasons why awareness alone is not enough.&lt;/div&gt;
      &lt;p&gt;The slide closes with an open question: &lt;b&gt;do people really want to change?&lt;/b&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Voices from the film&lt;/h3&gt;
  &lt;p&gt;Slides 12–15 collect a number of quotations. Filter them by type of speaker: you will notice that each corresponds to a piece of the theory that follows.&lt;/p&gt;
  &lt;div class=&quot;ctrl&quot; data-qfilter&gt;
    &lt;button class=&quot;btn on&quot; data-f=&quot;all&quot;&gt;All&lt;/button&gt;&lt;button class=&quot;btn&quot; data-f=&quot;w&quot;&gt;Workers and managers&lt;/button&gt;&lt;button class=&quot;btn&quot; data-f=&quot;b&quot;&gt;Companies&lt;/button&gt;&lt;button class=&quot;btn&quot; data-f=&quot;x&quot;&gt;Experts and activists&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qgrid&quot;&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;w&quot;&gt;&lt;p&gt;“It is not right. It’s 20th century, everybody knows. Everybody should take the responsibility for that!”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Arif Jebtik — garment factory manager&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;w&quot;&gt;&lt;p&gt;“We have no voice in the system.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Shima Akhter — worker, Bangladesh&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;w&quot;&gt;&lt;p&gt;“The Government should know how poor we are…”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Worker, Cambodia&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;x&quot;&gt;&lt;p&gt;“You can’t deny that the fashion industry is having a high impact.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Journalist&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;b&quot;&gt;&lt;p&gt;“We look for customers that recognize that they are part of the problem! Consumers that recognize their responsibility. Think twice before buying … asking where the products came from.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;President of Patagonia&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;b&quot;&gt;&lt;p&gt;“This is the beginning of a turning point not just for […] a responsible way of doing fashion, but for a new way of doing capitalism […]. Whether it’s in time or not is another question.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Safia Minney — CEO of People Tree&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;x&quot;&gt;&lt;p&gt;“What we need is a revolution of values. […] It is needed to stop treating people like things […] but instead to treat people in a real and human way.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Tim Kasser — psychologist (quoting Martin Luther King Jr.)&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;b&quot;&gt;&lt;p&gt;“It’s all about the profit and it doesn’t take into consideration […] the cost of polluting the water; the cost of labour; the cost of bars on the window that people die when a fire breaks out […]. We haven’t really factored in what the true cost is.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;LaRhea Pepper — organic cotton farmer&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;x&quot;&gt;&lt;p&gt;“My God, we can do better than this. […] Let the benefits be shared globally. Then let’s do that in an orderly, reasonable, careful way.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Richard D. Wolff — economist&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;x&quot;&gt;&lt;p&gt;“Capital is just money. Money is a means, and people should be accountable for how it’s used. […] We must stop talking about labor […] look at the land […] as Mother Earth.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Vandana Shiva — environmental activist&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot; data-k=&quot;x&quot;&gt;&lt;p&gt;“In the midst of all the challenges facing us today […] maybe we could start here with clothing.”&lt;/p&gt;&lt;div class=&quot;who&quot;&gt;Narrator&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Connection: LaRhea Pepper describes the &lt;b&gt;externalities&lt;/b&gt; (costs generated by an activity but borne by others: polluted water, health, safety) that the price does not incorporate: this is the “true cost”. The manager and Patagonia speak of &lt;b&gt;shared responsibility&lt;/b&gt;; the Cambodian worker points to the government. You will meet them again as examples of &lt;a href=&quot;#denial&quot;&gt;denial&lt;/a&gt; in slide 19.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · part 1&lt;/h3&gt;&lt;ol&gt;
    &lt;li&gt;According to the class discussion, why is fast fashion not sustainable? Give at least three reasons of different kinds.
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;It disregards future generations (the definition of sustainability); it focuses solely on profit and cost reduction, even at the expense of safety; it relocates production to where labour is cheap and environmental rules are weak; it fosters a culture of consumerism (“buying cheap”); it concentrates power in a few firms and lacks supply-chain transparency.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;What is the attitude-behaviour gap, and why is it relevant to “solutions”?
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;It is the gap between stated attitudes and actual behaviour. It makes awareness alone insufficient: even those who know and disapprove keep buying. Action is therefore also needed on structures and incentives, not only on information.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;What does “true cost” mean in LaRhea Pepper’s statement?
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;The full cost of a garment, including the costs borne by neither the producer nor the consumer: water pollution, inadequate wages, unsafe factories, and farmers’ lack of access to education and healthcare.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
  &lt;/ol&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2. DIFFUSION ============ --&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;diffusione&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;The theoretical problem&lt;/div&gt;&lt;h2&gt;Governing sustainability in a complex world &lt;span class=&quot;slides&quot;&gt;slides 16–18&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;The case shows harm without a single author. Three transformations make this scenario commonplace and undermine the traditional way of attributing &lt;span class=&quot;en&quot;&gt;moral responsibility&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Globalization&lt;/h4&gt;Production and consumption cut across different cultures and legal systems, raising &lt;b&gt;cultural, legal and accountability&lt;/b&gt; problems. Which law applies to the factory in Bangladesh producing for a European brand?&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Networked economy&lt;/h4&gt;The firm is no longer a unit that does everything in-house: it is a node in a network of suppliers, sub-contractors, distributors and partners.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Information economy&lt;/h4&gt;Value and power depend on control over information: who knows what, who makes it known, who prefers not to know.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;b&gt;Guiding question (slide 16):&lt;/b&gt; what are the implications of all this for the attribution of moral responsibility?&lt;/p&gt;

  &lt;h3&gt;Lecture agenda &lt;small&gt;(slide 17)&lt;/small&gt;&lt;/h3&gt;
  &lt;ol&gt;&lt;li&gt;The &lt;span class=&quot;en&quot;&gt;diffusion of responsibility&lt;/span&gt; and the problem of the &lt;span class=&quot;en&quot;&gt;denial of responsibility&lt;/span&gt;&lt;/li&gt;&lt;li&gt;The &lt;span class=&quot;en&quot;&gt;social connection model&lt;/span&gt; of responsibility&lt;/li&gt;&lt;li&gt;When an «issue» becomes an «Issue» for companies&lt;/li&gt;&lt;/ol&gt;

  &lt;h3&gt;Diffusion of responsibility &lt;small&gt;(slide 18)&lt;/small&gt;&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Diffusion of responsibility&lt;/b&gt; — when an outcome is produced by many actors who divide the labour among themselves, responsibility is “spread” until it seems to belong to no one. Each contributes a small part, and no one feels they are the author of the overall harm.&lt;/div&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 760 210&quot; role=&quot;img&quot; aria-label=&quot;Division of labour and diffusion of responsibility&quot;&gt;

      &lt;text class=&quot;lbl b&quot; x=&quot;20&quot; y=&quot;28&quot;&gt;Division of labour&lt;/text&gt;
      &lt;text class=&quot;lbl b&quot; x=&quot;420&quot; y=&quot;28&quot;&gt;… and of responsibility?&lt;/text&gt;
      &lt;g fill=&quot;var(--slatebg)&quot; stroke=&quot;var(--slate)&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;50&quot; width=&quot;80&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;rect x=&quot;110&quot; y=&quot;50&quot; width=&quot;80&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;rect x=&quot;200&quot; y=&quot;50&quot; width=&quot;80&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;rect x=&quot;290&quot; y=&quot;50&quot; width=&quot;80&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;
      &lt;/g&gt;
      &lt;text class=&quot;lbl s&quot; x=&quot;60&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot;&gt;cotton&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;150&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot;&gt;dyeing&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;240&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot;&gt;sewing&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;330&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot;&gt;brand&lt;/text&gt;
      &lt;rect x=&quot;20&quot; y=&quot;120&quot; width=&quot;350&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;var(--brickbg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
      &lt;text class=&quot;lbl&quot; x=&quot;195&quot; y=&quot;147&quot; text-anchor=&quot;middle&quot;&gt;collective outcome: €5 garment + harm&lt;/text&gt;
      &lt;path d=&quot;M60 94V120M150 94V120M240 94V120M330 94V120&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot;/&gt;

      &lt;g fill=&quot;var(--slate)&quot;&gt;&lt;circle cx=&quot;520&quot; cy=&quot;80&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;600&quot; cy=&quot;90&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;545&quot; cy=&quot;145&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;590&quot; cy=&quot;140&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;560&quot; cy=&quot;110&quot; r=&quot;5&quot;/&gt;&lt;/g&gt;
      &lt;text class=&quot;lbl s&quot; x=&quot;660&quot; y=&quot;70&quot;&gt;“it’s not my fault,&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;660&quot; y=&quot;88&quot;&gt;I only did&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;660&quot; y=&quot;106&quot;&gt;my part”&lt;/text&gt;
      &lt;text class=&quot;lbl b&quot; x=&quot;560&quot; y=&quot;200&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--brick)&quot; style=&quot;fill:var(--brick)&quot;&gt;Risk of denial of responsibility&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Together we do things we could not do alone (or not as well, or not as quickly). But &lt;i&gt;as long as there is a division of labour, there will be questions about how to divide the spoils and the responsibility&lt;/i&gt; (slide 18).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · part 2&lt;/h3&gt;&lt;ol&gt;
    &lt;li&gt;Which three transformations make the attribution of moral responsibility complex?
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Globalization (cultural, legal and accountability problems), the networked economy (the firm as a node in a network), the information economy (power runs through control over information).&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Why does the division of labour create a “risk of denial of responsibility”?
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Because each actor contributes only part of the process; the harm emerges from the whole, so everyone can claim not to be its author, and responsibility diffuses until it disappears.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
  &lt;/ol&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3. DENIAL ============ --&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;denial&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Phillips (2010)&lt;/div&gt;&lt;h2&gt;General sources of denial &lt;span class=&quot;slides&quot;&gt;slide 19&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Robert A. Phillips identifies three typical ways in which an organization denies its responsibility. Each has a &lt;b&gt;key question&lt;/b&gt; that dismantles it.&lt;/p&gt;
  &lt;div data-tabs&gt;
    &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;
      &lt;button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; data-t=&quot;d1&quot;&gt;Knowledge denial&lt;/button&gt;
      &lt;button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;d2&quot;&gt;Control denial&lt;/button&gt;
      &lt;button class=&quot;tab&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; data-t=&quot;d3&quot;&gt;Connection denial&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tpanel&quot; data-p=&quot;d1&quot;&gt;
      &lt;blockquote&gt;“We didn’t know.”&lt;/blockquote&gt;
      &lt;p&gt;&lt;b&gt;Key question:&lt;/b&gt; what &lt;i&gt;should&lt;/i&gt; companies know?&lt;/p&gt;
      &lt;p&gt;Saying “we didn’t know” is not enough: what matters is what a reasonable company &lt;b&gt;should have known&lt;/b&gt; (e.g. conditions in its suppliers’ factories). Ignorance can be culpable, especially when it is wilful.&lt;/p&gt;
      &lt;p&gt;&lt;small&gt;Voice from the film:&lt;/small&gt; &lt;i&gt;“The Government should know how poor we are…”&lt;/i&gt; (Cambodian worker) — those who govern cannot claim not to know.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tpanel&quot; data-p=&quot;d2&quot; hidden&gt;
      &lt;blockquote&gt;“We knew, but couldn’t do anything about it.”&lt;/blockquote&gt;
      &lt;p&gt;&lt;b&gt;Key question:&lt;/b&gt; when, if ever, does “&lt;span class=&quot;en&quot;&gt;can&lt;/span&gt;” imply “&lt;span class=&quot;en&quot;&gt;ought&lt;/span&gt;”?&lt;/p&gt;
      &lt;p&gt;That is: if I have the &lt;b&gt;capacity&lt;/b&gt; to intervene, do I also have the &lt;b&gt;duty&lt;/b&gt; to do so? It is the reverse of the classic principle “&lt;span class=&quot;en&quot;&gt;ought implies can&lt;/span&gt;” (no one can be obliged to do the impossible). A major brand that sets prices and delivery times can hardly claim to have no leverage.&lt;/p&gt;
      &lt;p&gt;&lt;small&gt;Voice from the film:&lt;/small&gt; &lt;i&gt;“It is not right. It’s 20th century, everybody knows. Everybody should take the responsibility for that!”&lt;/i&gt; (factory manager)&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tpanel&quot; data-p=&quot;d3&quot; hidden&gt;
      &lt;blockquote&gt;“Whether we knew or not, it’s another organization’s problem.”&lt;/blockquote&gt;
      &lt;p&gt;&lt;b&gt;Key question:&lt;/b&gt; what establishes a &lt;i&gt;connection&lt;/i&gt;?&lt;/p&gt;
      &lt;p&gt;This is the most typical form of denial in networks: “the supplier is another company; the problem is theirs”. The lecture’s answer comes with the &lt;a href=&quot;#young&quot;&gt;social connection model&lt;/a&gt;: one is connected to an injustice if one participates in the structural processes that produce it.&lt;/p&gt;
      &lt;p&gt;&lt;small&gt;Voice from the film:&lt;/small&gt; &lt;i&gt;“We look for customers that recognize that they are part of the problem!”&lt;/i&gt; (President of Patagonia)&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · part 3&lt;/h3&gt;&lt;ol&gt;
    &lt;li&gt;A brand states: “The collapse happened at the factory of a sub-contractor we didn’t even know about”. Which forms of denial is it using?
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Knowledge denial (“we didn’t know”) and connection denial (“it’s another organization’s problem”). The questions to ask: what should it have known about its own supply chain? What connects it to that factory (orders, prices, lead times)?&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;What does it mean to ask whether “can implies ought”?
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;To ask whether the capacity to change a situation generates an obligation to do so. It is the question that dismantles control denial (“we knew but couldn’t do anything”).&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
  &lt;/ol&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4. NETWORKS ============ --&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;reti&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Phillips (2009/2010)&lt;/div&gt;&lt;h2&gt;Deniability networks, tertius gaudens and tertius illuminans &lt;span class=&quot;slides&quot;&gt;slides 20–25&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;In &lt;span class=&quot;en&quot;&gt;network analysis&lt;/span&gt;, information is power. In &lt;span class=&quot;en&quot;&gt;deniability networks&lt;/span&gt; the opposite happens: some actors work so as &lt;b&gt;not&lt;/b&gt; to receive information.&lt;/p&gt;
  &lt;blockquote&gt;“Deniability networks invert the typical role of information in networks. Typically in network analysis, access to information is a source of power and the ability to broker information or avoid brokerage by other is an additional source of power for any given actor. In deniability networks an actor seeks to actively prevent the flow of information – at least to themselves.”&lt;cite&gt;Phillips, 2009: 537 (slide 20)&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Deniability network&lt;/b&gt; — a network organized so that a central actor can say in good faith “I didn’t know”: between that actor and the harm there are enough intermediaries to block the flow of inconvenient news. It serves to make &lt;a href=&quot;#denial&quot;&gt;knowledge denial&lt;/a&gt; credible.&lt;/div&gt;

  &lt;h3&gt;Structural hole and tertius gaudens &lt;small&gt;(slide 21)&lt;/small&gt;&lt;/h3&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 520 210&quot; role=&quot;img&quot; aria-label=&quot;Two groups connected only through an intermediary&quot;&gt;
    &lt;g class=&quot;ln&quot;&gt;&lt;path class=&quot;ln&quot; d=&quot;M70 60L110 110L70 160M110 110L40 110M70 60L130 60M110 110L170 115&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M350 115L380 70L400 120L440 90L460 140L420 170M400 120L460 120M380 70L420 60&quot;/&gt;&lt;/g&gt;
    &lt;path d=&quot;M170 115L260 115L350 115&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;3&quot;/&gt;
    &lt;g fill=&quot;var(--ink2)&quot;&gt;&lt;circle cx=&quot;70&quot; cy=&quot;60&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;110&quot; cy=&quot;110&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;70&quot; cy=&quot;160&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;40&quot; cy=&quot;110&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;130&quot; cy=&quot;60&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;170&quot; cy=&quot;115&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;350&quot; cy=&quot;115&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;380&quot; cy=&quot;70&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;400&quot; cy=&quot;120&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;440&quot; cy=&quot;90&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;460&quot; cy=&quot;140&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;420&quot; cy=&quot;170&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;460&quot; cy=&quot;120&quot; r=&quot;5&quot;/&gt;&lt;circle cx=&quot;420&quot; cy=&quot;60&quot; r=&quot;5&quot;/&gt;&lt;/g&gt;
    &lt;circle cx=&quot;260&quot; cy=&quot;115&quot; r=&quot;11&quot; fill=&quot;var(--brick)&quot;/&gt;
    &lt;text class=&quot;lbl b&quot; x=&quot;260&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--brick)&quot;&gt;Tertius gaudens&lt;/text&gt;
    &lt;text class=&quot;lbl&quot; x=&quot;260&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot;&gt;Structural hole&lt;/text&gt;
    &lt;path d=&quot;M260 46V96&quot; stroke=&quot;var(--ink2)&quot; marker-end=&quot;url(#ar)&quot; style=&quot;color:var(--ink2)&quot;/&gt;
    &lt;text class=&quot;lbl s&quot; x=&quot;90&quot; y=&quot;200&quot; text-anchor=&quot;middle&quot;&gt;group A&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;410&quot; y=&quot;200&quot; text-anchor=&quot;middle&quot;&gt;group B&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Two groups densely connected internally but not to each other: the “gap” between them is a &lt;b&gt;structural hole&lt;/b&gt;. Whoever sits in the middle controls what passes through.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Structural hole&lt;/h4&gt;The absence of direct ties between two parts of a network. A concept developed by Ronald Burt (network sociologist) &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Tertius gaudens&lt;/h4&gt;Latin: “the third who rejoices”. The actor who spans the structural hole and &lt;b&gt;benefits&lt;/b&gt; from the fact that the other two do not communicate: it controls information and exchanges.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Tertius illuminans&lt;/h4&gt;Latin: “the third who illuminates”. An outside actor (media, activists, NGOs, a documentary) that &lt;b&gt;creates new ties&lt;/b&gt; and circulates information, closing the hole.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The Nike case: explore the network &lt;small&gt;(slides 22–23, figures from Phillips 2009: 538–539)&lt;/small&gt;&lt;/h3&gt;
  &lt;figure&gt;
    &lt;div class=&quot;ctrl&quot; data-netctrl&gt;
      &lt;button class=&quot;btn on&quot; data-m=&quot;base&quot;&gt;Network&lt;/button&gt;&lt;button class=&quot;btn&quot; data-m=&quot;gaud&quot;&gt;Nike as tertius gaudens&lt;/button&gt;&lt;button class=&quot;btn&quot; data-m=&quot;illu&quot;&gt;Enter the tertius illuminans&lt;/button&gt;
    &lt;/div&gt;
    &lt;svg id=&quot;net&quot; viewBox=&quot;0 0 680 370&quot; role=&quot;img&quot; aria-label=&quot;Nike’s network: workers, sub-contractors, customers, university&quot;&gt;
      &lt;g class=&quot;il-g&quot; id=&quot;ilg&quot;&gt;
        &lt;path class=&quot;ln il&quot; d=&quot;M340 40L80 130M340 40L80 300M340 40L380 215M340 40L480 130M340 40L510 215M340 40L620 165&quot;/&gt;
        &lt;g class=&quot;node hl&quot;&gt;&lt;circle cx=&quot;340&quot; cy=&quot;40&quot; r=&quot;12&quot;/&gt;&lt;/g&gt;
        &lt;text class=&quot;lbl b&quot; x=&quot;362&quot; y=&quot;36&quot; style=&quot;fill:var(--slate)&quot;&gt;NYT, 60 Minutes, FLA · The True Cost&lt;/text&gt;
      &lt;/g&gt;
      &lt;g id=&quot;edges&quot;&gt;
        &lt;path class=&quot;ln&quot; d=&quot;M80 130L190 165&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M190 165L270 215&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M190 265L270 215&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M80 300L190 265&quot;/&gt;
        &lt;path class=&quot;ln nk&quot; d=&quot;M270 215L380 215&quot;/&gt;&lt;path class=&quot;ln nk&quot; d=&quot;M380 215L480 130&quot;/&gt;&lt;path class=&quot;ln nk&quot; d=&quot;M380 215L510 215&quot;/&gt;&lt;path class=&quot;ln nk&quot; d=&quot;M380 215L480 300&quot;/&gt;&lt;path class=&quot;ln nk&quot; d=&quot;M380 215L380 320&quot;/&gt;
        &lt;path class=&quot;ln&quot; d=&quot;M510 215L620 165&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M510 215L620 270&quot;/&gt;
      &lt;/g&gt;
      &lt;path id=&quot;wall&quot; class=&quot;wall&quot; d=&quot;M325 185V245&quot;/&gt;
      &lt;g class=&quot;node&quot;&gt;&lt;circle cx=&quot;80&quot; cy=&quot;130&quot; r=&quot;8&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot;&gt;Indonesian workers&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node&quot;&gt;&lt;circle cx=&quot;190&quot; cy=&quot;165&quot; r=&quot;7&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot;&gt;Sub-contractor&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node&quot;&gt;&lt;circle cx=&quot;270&quot; cy=&quot;215&quot; r=&quot;7&quot;/&gt;&lt;text x=&quot;270&quot; y=&quot;242&quot; text-anchor=&quot;middle&quot;&gt;Sub-contractor&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node&quot;&gt;&lt;circle cx=&quot;190&quot; cy=&quot;265&quot; r=&quot;7&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;290&quot; text-anchor=&quot;middle&quot;&gt;Sub-contractor&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node&quot;&gt;&lt;circle cx=&quot;80&quot; cy=&quot;300&quot; r=&quot;8&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;325&quot; text-anchor=&quot;middle&quot;&gt;Chinese workers&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node&quot; id=&quot;nike&quot;&gt;&lt;circle cx=&quot;380&quot; cy=&quot;215&quot; r=&quot;14&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;190&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Nike&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node&quot;&gt;&lt;circle cx=&quot;480&quot; cy=&quot;130&quot; r=&quot;8&quot;/&gt;&lt;text x=&quot;480&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot;&gt;Customers&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node&quot;&gt;&lt;circle cx=&quot;510&quot; cy=&quot;215&quot; r=&quot;8&quot;/&gt;&lt;text x=&quot;510&quot; y=&quot;242&quot; text-anchor=&quot;middle&quot;&gt;U. of Oregon&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node&quot;&gt;&lt;circle cx=&quot;620&quot; cy=&quot;165&quot; r=&quot;7&quot;/&gt;&lt;text x=&quot;620&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot;&gt;Students&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node&quot;&gt;&lt;circle cx=&quot;620&quot; cy=&quot;270&quot; r=&quot;7&quot;/&gt;&lt;text x=&quot;620&quot; y=&quot;295&quot; text-anchor=&quot;middle&quot;&gt;Admin.&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node&quot;&gt;&lt;circle cx=&quot;480&quot; cy=&quot;300&quot; r=&quot;7&quot;/&gt;&lt;text x=&quot;480&quot; y=&quot;325&quot; text-anchor=&quot;middle&quot;&gt;M. Jordan&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;node&quot;&gt;&lt;circle cx=&quot;380&quot; cy=&quot;320&quot; r=&quot;7&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;345&quot; text-anchor=&quot;middle&quot;&gt;Shareholders&lt;/text&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;info&quot; id=&quot;netinfo&quot;&gt;&lt;/div&gt;
  &lt;/figure&gt;
  &lt;div hidden&gt;
    &lt;div data-net=&quot;base&quot;&gt;&lt;h4&gt;The network&lt;/h4&gt;&lt;p&gt;On the left, production: Indonesian and Chinese workers, linked to Nike only through chains of sub-contractors. On the right, Nike’s “visible” ties: customers, shareholders, endorsers (Michael Jordan), the University of Oregon with its students and administration. Workers and customers have no direct tie.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-net=&quot;gaud&quot;&gt;&lt;h4&gt;Nike as tertius gaudens&lt;/h4&gt;&lt;p&gt;Nike is the only bridge between the production side and the consumption side. The chain of sub-contractors acts as an &lt;b&gt;information wall&lt;/b&gt; (the red line): Nike benefits from the separation, can negotiate with both sides and, if something goes wrong in the factories, can say “we didn’t know, it’s a sub-contractor”. It is a deniability network.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-net=&quot;illu&quot;&gt;&lt;h4&gt;Tertius illuminans&lt;/h4&gt;&lt;p&gt;The media (the New York Times, 60 Minutes), organizations such as the FLA (Fair Labor Association) and, today, documentaries such as The True Cost create &lt;b&gt;direct ties&lt;/b&gt; between workers, customers, students and the university. The wall falls: customers know, students protest, the university is called to account. Nike loses its position as exclusive broker, and with it its deniability. Phillips notes that “illuminating” third parties change the network’s &lt;b&gt;density&lt;/b&gt; and the actors’ &lt;b&gt;centrality&lt;/b&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; In 2000, students pushed the University of Oregon to join the Worker Rights Consortium; in response, Nike founder Phil Knight suspended his donations to the university.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Tertius illuminans in action &lt;small&gt;(slides 24–25)&lt;/small&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Zara, November 2017&lt;/h4&gt;&lt;p&gt;In Zara stores in Istanbul, customers find notes from workers in the garments: &lt;i&gt;“I made this item you are going to buy, but I didn’t get paid for it.”&lt;/i&gt; The workers themselves become “illuminating”: they use the product as a channel to bridge the structural hole and speak directly to the consumer.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; They were former employees of Bravo Tekstil, a supplier to Zara, Mango and Next that closed suddenly with wage arrears unpaid; Inditex stated that it had paid the supplier and announced a hardship fund.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;The True Cost&lt;/h4&gt;&lt;p&gt;The documentary itself is a tertius illuminans: it connects viewers with garment workers, making “we didn’t know” impossible.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Climate strikes&lt;/h4&gt;&lt;p&gt;The slide shows Greta Thunberg (“Skolstrejk för klimatet”) and the climate protests: movements that illuminate the connection between our patterns of production and consumption and the climate crisis.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · part 4&lt;/h3&gt;&lt;ol&gt;
    &lt;li&gt;Why do deniability networks “invert” the role of information?
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Normally, access to information in networks is a source of power; in a deniability network, by contrast, an actor tries to prevent information from reaching it, because not knowing allows it to deny responsibility.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Distinguish between tertius gaudens and tertius illuminans, with one example each.
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Tertius gaudens: the actor who spans a structural hole and benefits from it (Nike between sub-contractors’ workers and customers). Tertius illuminans: a third party that creates ties and circulates information, closing the hole (media, NGOs, The True Cost, the workers’ notes in Zara garments).&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;What effect does a tertius illuminans have on the structure of the network?
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;It increases density (more ties) and reduces the centrality/exclusivity of the broker, which loses control over the flow of information and hence the ability to deny.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
  &lt;/ol&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5. RELAZIONI ============ --&gt;
&lt;section class=&quot;part p-sage&quot; id=&quot;relazioni&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Networks and responsibility&lt;/div&gt;&lt;h2&gt;Building relationships and networks to share responsibilities &lt;span class=&quot;slides&quot;&gt;slides 26–27&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Networks are not only a place to hide: organizations can build them to &lt;b&gt;share&lt;/b&gt; responsibilities. Three theories explain why they emerge.&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Resource dependency theory&lt;/h4&gt;&lt;p&gt;Networks arise from &lt;b&gt;cooperation and coordination&lt;/b&gt; aimed at controlling environmental uncertainty. An organization depends on resources controlled by others, so it ties itself to them.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Reciprocity theory&lt;/h4&gt;&lt;p&gt;The network forms to obtain &lt;b&gt;mutual benefits&lt;/b&gt; or to &lt;b&gt;share values&lt;/b&gt;: actors collaborate because it benefits both, or because they believe in the same things.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Institutional theory&lt;/h4&gt;&lt;p&gt;Organizations seek relationships with governing and regulatory authorities (including “other organizations”) to obtain authorizations and conform to their guidelines: in this way they gain &lt;b&gt;legitimacy&lt;/b&gt; in the eyes of society.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Foundational texts (not cited in the slides): Pfeffer &amp;amp; Salancik (1978) for resource dependence; DiMaggio &amp;amp; Powell (1983) for institutional theory. See &lt;a href=&quot;#approfondire&quot;&gt;Further reading&lt;/a&gt;.&lt;/p&gt;

  &lt;h3&gt;Connection and responsibility &lt;small&gt;(slide 27)&lt;/small&gt;&lt;/h3&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 700 200&quot; role=&quot;img&quot; aria-label=&quot;Asymmetric perceptions of the relationship&quot;&gt;
    &lt;rect x=&quot;20&quot; y=&quot;40&quot; width=&quot;190&quot; height=&quot;110&quot; rx=&quot;14&quot; fill=&quot;var(--sagebg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
    &lt;rect x=&quot;490&quot; y=&quot;40&quot; width=&quot;190&quot; height=&quot;110&quot; rx=&quot;14&quot; fill=&quot;var(--sagebg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
    &lt;text class=&quot;lbl b&quot; x=&quot;115&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;Actor A&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;115&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot;&gt;“we are part of the&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;115&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot;&gt;same network”&lt;/text&gt;
    &lt;text class=&quot;lbl b&quot; x=&quot;585&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;Actor B&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;585&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot;&gt;“it’s just an&lt;/text&gt;&lt;text class=&quot;lbl s&quot; x=&quot;585&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot;&gt;arm’s-length partner”&lt;/text&gt;
    &lt;path d=&quot;M210 80H490&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;3&quot;/&gt;
    &lt;path d=&quot;M210 115H490&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;3 8&quot;/&gt;
    &lt;text class=&quot;lbl s&quot; x=&quot;350&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot;&gt;strong tie (as seen by A)&lt;/text&gt;
    &lt;text class=&quot;lbl s&quot; x=&quot;350&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot;&gt;market relationship (as seen by B)&lt;/text&gt;
    &lt;text class=&quot;lbl b&quot; x=&quot;350&quot; y=&quot;185&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--brick)&quot;&gt;→ differing perceptions of obligations → connection deniability&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;In the early stages (and sometimes for longer), perceptions of network membership are asymmetric.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Arm’s-length&lt;/b&gt; — a purely market-based relationship between independent parties, with no ties or obligations beyond the contract. If B regards A as a mere arm’s-length supplier, B will feel free of responsibility for what happens at A.&lt;/div&gt;
  &lt;p&gt;These divergent perceptions feed a form of &lt;b&gt;connection deniability&lt;/b&gt;. Overcoming it requires a &lt;b&gt;critical and independent criterion&lt;/b&gt; for determining who is a member of the network — the actors’ self-perception is not enough. This is precisely the criterion Young will provide.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · part 5&lt;/h3&gt;&lt;ol&gt;
    &lt;li&gt;Match each theory to the reason networks form: resource dependency, reciprocity, institutional.
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Resource dependency: cooperation and coordination to control environmental uncertainty. Reciprocity: mutual benefits or shared values. Institutional: relationships with authorities in order to conform and gain legitimacy.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Why are asymmetric perceptions of network membership an ethical problem?
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Because those who see themselves merely as arm’s-length partners feel exempt from the network’s obligations: this gives rise to connection deniability. An independent criterion is therefore needed to establish who belongs to the network.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
  &lt;/ol&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6. YOUNG ============ --&gt;
&lt;section class=&quot;part p-terra&quot; id=&quot;young&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;6&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Iris Marion Young&lt;/div&gt;&lt;h2&gt;The social connection model &lt;span class=&quot;slides&quot;&gt;slides 28–30&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;Iris Marion Young (political philosopher, author of &lt;i&gt;Responsibility for Justice&lt;/i&gt;) proposes grounding responsibility not in fault but in &lt;b&gt;membership in shared social processes&lt;/b&gt;.&lt;/p&gt;
  &lt;blockquote&gt;“Our responsibility derives from belonging together with others in a system of interdependent processes of cooperation and competition through which we seek benefits and aim to realize projects.”&lt;cite&gt;Young, 2006: 119 (slide 29)&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Social connection approach&lt;/b&gt; — the core idea is to encourage actors to consider the &lt;b&gt;wider consequences&lt;/b&gt; of their activities. Social and environmental problems are “systemic”, i.e. &lt;i&gt;“caused by a network of actors who contribute to, enforce, or mitigate harm through their actions and interactions”&lt;/i&gt; (Schrempf, 2014: 302). Hence different actors connected to an issue &lt;b&gt;share&lt;/b&gt; responsibility.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Structural injustice&lt;/b&gt; — a key term in Young’s work, implicit in the slides: an injustice that does not stem from the wrongful action of a single agent, but from the combined effect of many “normal”, legitimate actions (buying, ordering, producing) carried out within accepted rules and institutions. The collapse of a garment factory is the paradigmatic example.&lt;/div&gt;

  &lt;h3&gt;The 5 essential features &lt;small&gt;(slide 30)&lt;/small&gt;&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;dots&quot;&gt;&lt;button class=&quot;dot on&quot; aria-label=&quot;feature 1&quot;&gt;1&lt;/button&gt;&lt;button class=&quot;dot&quot; aria-label=&quot;feature 2&quot;&gt;2&lt;/button&gt;&lt;button class=&quot;dot&quot; aria-label=&quot;feature 3&quot;&gt;3&lt;/button&gt;&lt;button class=&quot;dot&quot; aria-label=&quot;feature 4&quot;&gt;4&lt;/button&gt;&lt;button class=&quot;dot&quot; aria-label=&quot;feature 5&quot;&gt;5&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;card step on&quot;&gt;&lt;h4&gt;1 · Broad perspective&lt;/h4&gt;&lt;p&gt;Instead of looking for &lt;b&gt;a single culprit&lt;/b&gt;, attention turns to &lt;b&gt;all the parties&lt;/b&gt; linked, directly or indirectly, to the injustice or harm.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;In fast fashion: not only the owner of the collapsed factory, but brands, sub-contractors, governments, consumers, investors.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card step&quot;&gt;&lt;h4&gt;2 · Shared responsibility&lt;/h4&gt;&lt;p&gt;Responsibility is attributed to a &lt;b&gt;group&lt;/b&gt;; each individual is accountable for their &lt;b&gt;own sphere of involvement&lt;/b&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Shared does not mean equal or diluted: each is accountable for their own part.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card step&quot;&gt;&lt;h4&gt;3 · Future-oriented approach&lt;/h4&gt;&lt;p&gt;The &lt;span class=&quot;en&quot;&gt;liability model&lt;/span&gt; sanctions or punishes past actions; the social connection model (SCM) calls for a &lt;b&gt;collective process&lt;/b&gt; to transform the situation, looking to the &lt;b&gt;future&lt;/b&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;The question is not “who should be punished?” but “what must we change, together, from tomorrow?”.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card step&quot;&gt;&lt;h4&gt;4 · Assessing the entire context&lt;/h4&gt;&lt;p&gt;All agents play a mediating role in social injustices. It is the &lt;b&gt;background conditions&lt;/b&gt; (rules, prices, norms, habits) that are called into question.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Example: not only “that factory was unsafe”, but “why does the system reward whoever produces fastest and cheapest?”.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card step&quot;&gt;&lt;h4&gt;5 · Collective action&lt;/h4&gt;&lt;p&gt;Structural problems can only be solved through the &lt;b&gt;collective action&lt;/b&gt; of multiple parties joining forces.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Examples: multi-stakeholder initiatives, agreements between brands and trade unions, consumer and student campaigns.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← previous&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7. LIABILITY vs SCM ============ --&gt;
&lt;section class=&quot;part p-terra&quot; id=&quot;liability&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;7&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Comparison and parameters&lt;/div&gt;&lt;h2&gt;From Liability to Social Connection Corporate Responsibility &lt;span class=&quot;slides&quot;&gt;slides 31–33&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;&lt;span class=&quot;en&quot;&gt;Corporate Responsibility&lt;/span&gt; (CR) can be conceived in two ways. Click a row for an explanation.&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Liability model&lt;/b&gt; — the classic, legal model: the party that &lt;b&gt;caused&lt;/b&gt; the harm, possibly through fault, is responsible and must be sanctioned or pay compensation. Everyone else is absolved.&lt;/div&gt;
  &lt;table id=&quot;ltab&quot;&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Liability CR&lt;/th&gt;&lt;th&gt;Social connection CR&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr class=&quot;row&quot; data-r=&quot;0&quot;&gt;&lt;td&gt;&lt;b&gt;Causality&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;Social connection&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;row&quot; data-r=&quot;1&quot;&gt;&lt;td&gt;&lt;b&gt;Absolution of others&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;Shared responsibility&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;row&quot; data-r=&quot;2&quot;&gt;&lt;td&gt;&lt;b&gt;Retrospective argumentation&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;Prospective perspective&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;row&quot; data-r=&quot;3&quot;&gt;&lt;td&gt;&lt;b&gt;Accept static background conditions&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;Question background conditions&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;row&quot; data-r=&quot;4&quot;&gt;&lt;td&gt;&lt;b&gt;Communitarian / cosmopolitan approach&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;Mainly cosmopolitan approach&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;
  &lt;div class=&quot;info&quot; id=&quot;linfo&quot;&gt;&lt;p class=&quot;small&quot;&gt;Select a row of the table.&lt;/p&gt;&lt;/div&gt;
  &lt;div hidden&gt;
    &lt;div data-l=&quot;0&quot;&gt;&lt;h4&gt;What responsibility is based on&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Liability:&lt;/b&gt; you are responsible if there is a causal link between your action and the harm. &lt;b&gt;Social connection:&lt;/b&gt; you are responsible because you participate in the structural processes that produce the harm, even without being its direct cause. Example (Schrempf 2014): fast-food chains do not “cause” obesity, but they are connected to it.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-l=&quot;1&quot;&gt;&lt;h4&gt;Who else is responsible&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Liability:&lt;/b&gt; once the culprit is identified, everyone else is absolved. &lt;b&gt;Social connection:&lt;/b&gt; finding one responsible party does not release the others; each shares responsibility for their own part.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-l=&quot;2&quot;&gt;&lt;h4&gt;Temporal orientation&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Liability:&lt;/b&gt; looks backward (who did wrong? what penalty or compensation?). &lt;b&gt;Social connection:&lt;/b&gt; looks forward (how do we transform the system so that it does not happen again?).&lt;/p&gt;&lt;/div&gt;
    &lt;div data-l=&quot;3&quot;&gt;&lt;h4&gt;Background conditions&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Liability:&lt;/b&gt; takes the context (market rules, prices, purchasing practices) as normal and looks for the deviation. &lt;b&gt;Social connection:&lt;/b&gt; questions precisely the “normal” context that generates the injustice.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-l=&quot;4&quot;&gt;&lt;h4&gt;How far responsibility extends&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Communitarian:&lt;/b&gt; obligations apply chiefly towards one’s own political community or nation. &lt;b&gt;Cosmopolitan:&lt;/b&gt; obligations apply towards all human beings, across borders. The liability model can adopt either; the social connection model is &lt;b&gt;mainly cosmopolitan&lt;/b&gt;, because global supply chains connect people in different countries.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Note: for Schrempf, the social connection model &lt;b&gt;does not replace&lt;/b&gt; the liability model but is an additional dimension of it &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; (abstract of Schrempf 2014). If a company directly causes harm, it remains “liable”.&lt;/p&gt;

  &lt;h3 id=&quot;parametri&quot;&gt;Reasoning about one’s own responsibility: Young’s parameters &lt;small&gt;(slides 32–33)&lt;/small&gt;&lt;/h3&gt;
  &lt;p&gt;If everyone is connected, how much should each actor do? Young identifies four parameters.&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Power&lt;/h4&gt;&lt;p&gt;One’s position in structural processes confers a certain power of influence. Those who lack the energy to address every injustice they are connected to should focus where they have &lt;b&gt;the greatest capacity to make a difference&lt;/b&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Young 2006, p. 127; Young 2011, p. 144&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Privilege&lt;/h4&gt;&lt;p&gt;The privileged can change their habits or make extra efforts &lt;b&gt;without suffering serious deprivation&lt;/b&gt;: this is why they owe more.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Young 2011, p. 145&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Interest&lt;/h4&gt;&lt;p&gt;Those with the greatest interest in &lt;b&gt;perpetuating&lt;/b&gt; the structure often also have the greatest power to transform it.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Young 2006, p. 128&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Collective ability&lt;/h4&gt;&lt;p&gt;Agents often need to &lt;i&gt;“reorganize their activities and relationships to coordinate their action or coordinate it differently”&lt;/i&gt;: those able to organize with others bear more responsibility.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Young 2011, p. 147&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;figure&gt;
    &lt;h4 style=&quot;margin-top:0&quot;&gt;Learning tool: the parameter compass&lt;/h4&gt;
    &lt;p class=&quot;small&quot;&gt;This is neither in the slides nor a formula of Young’s: it is an exercise to support reasoning. Choose an actor or move the sliders (0–10) and observe how the intensity and type of responsibility change.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot; data-presets&gt;
      &lt;button class=&quot;btn&quot; data-v=&quot;9,8,8,9&quot;&gt;Global brand&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;7,4,6,7&quot;&gt;Producing-country government&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;3,6,3,5&quot;&gt;European consumer&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;3,5,2,8&quot;&gt;University students&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;1,0,2,4&quot;&gt;Garment worker&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sP&quot;&gt;Power&lt;/label&gt;&lt;input id=&quot;sP&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;oP&quot;&gt;5&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sR&quot;&gt;Privilege&lt;/label&gt;&lt;input id=&quot;sR&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;oR&quot;&gt;5&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sI&quot;&gt;Interest&lt;/label&gt;&lt;input id=&quot;sI&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;oI&quot;&gt;5&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sC&quot;&gt;Collective ability&lt;/label&gt;&lt;input id=&quot;sC&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;oC&quot;&gt;5&lt;/output&gt;&lt;/div&gt;
    &lt;p style=&quot;margin-bottom:4px&quot;&gt;&lt;b&gt;Intensity of action responsibility&lt;/b&gt; &lt;span id=&quot;score&quot; class=&quot;small&quot;&gt;&lt;/span&gt;&lt;/p&gt;
    &lt;div class=&quot;bar&quot;&gt;&lt;i id=&quot;bar&quot;&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;info&quot; id=&quot;sinfo&quot;&gt;&lt;/div&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · parts 6–7&lt;/h3&gt;&lt;ol&gt;
    &lt;li&gt;According to Young, where does responsibility derive from?
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;From belonging, together with others, to a system of interdependent processes of cooperation and competition through which we seek benefits and realize projects (Young 2006: 119). Not from causality or fault.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;List the 5 features of the social connection model.
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Broad perspective; shared responsibility; future-oriented approach; assessing the entire context (questioning background conditions); collective action.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Complete the comparison: Causality → ? ; Retrospective argumentation → ? ; Accept static background conditions → ?
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Social connection; prospective perspective; question background conditions. (The other pairs: absolution of others → shared responsibility; communitarian/cosmopolitan → mainly cosmopolitan.)&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Why does the “privilege” parameter assign more responsibility to the European consumer than to the garment worker?
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Because the privileged can change habits or make additional efforts without suffering serious deprivation; for those living in poverty, any change comes at a much higher cost.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
  &lt;/ol&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 8. ISSUE ============ --&gt;
&lt;section class=&quot;part p-ochre&quot; id=&quot;issue&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;8&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Schrempf (2014)&lt;/div&gt;&lt;h2&gt;When does an issue become an Issue? &lt;span class=&quot;slides&quot;&gt;slides 34–35, 38&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;A social problem (an issue with a lower-case “i”) becomes a matter the company must address (an &lt;b&gt;Issue&lt;/b&gt; with a capital “I”) through the intersection of three elements.&lt;/p&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Business connection&lt;/h4&gt;There is a genuine link between the company’s activities or products and the problem.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Internal stakeholder cognition&lt;/h4&gt;Internal stakeholders (managers, employees, owners) &lt;b&gt;recognize&lt;/b&gt; the connection.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;External stakeholder pressure&lt;/h4&gt;External stakeholders (NGOs, media, consumers, governments) &lt;b&gt;put pressure&lt;/b&gt; on the company.&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;p class=&quot;small&quot; style=&quot;margin-top:0&quot;&gt;Click an area of the diagram (or a number below) to read about the segment. Diagram redrawn from Schrempf, 2014, p. 312.&lt;/p&gt;
    &lt;svg id=&quot;venn&quot; viewBox=&quot;0 0 480 345&quot; role=&quot;img&quot; aria-label=&quot;Three-set Venn diagram with seven segments&quot; style=&quot;cursor:pointer;max-width:560px;margin:auto&quot;&gt;
      &lt;g id=&quot;vhl&quot;&gt;&lt;/g&gt;
      &lt;circle class=&quot;vc&quot; cx=&quot;240&quot; cy=&quot;120&quot; r=&quot;95&quot;/&gt;&lt;circle class=&quot;vc&quot; cx=&quot;190&quot; cy=&quot;205&quot; r=&quot;95&quot;/&gt;&lt;circle class=&quot;vc&quot; cx=&quot;290&quot; cy=&quot;205&quot; r=&quot;95&quot;/&gt;
      &lt;text class=&quot;vt&quot; x=&quot;240&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot;&gt;Business connection&lt;/text&gt;
      &lt;text class=&quot;vt&quot; x=&quot;55&quot; y=&quot;312&quot; text-anchor=&quot;middle&quot;&gt;Internal stakeholder&lt;/text&gt;&lt;text class=&quot;vt&quot; x=&quot;55&quot; y=&quot;328&quot; text-anchor=&quot;middle&quot;&gt;cognition&lt;/text&gt;
      &lt;text class=&quot;vt&quot; x=&quot;425&quot; y=&quot;312&quot; text-anchor=&quot;middle&quot;&gt;External stakeholder&lt;/text&gt;&lt;text class=&quot;vt&quot; x=&quot;425&quot; y=&quot;328&quot; text-anchor=&quot;middle&quot;&gt;pressure&lt;/text&gt;
      &lt;text class=&quot;vn&quot; x=&quot;240&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot;&gt;1&lt;/text&gt;&lt;text class=&quot;vn&quot; x=&quot;302&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot;&gt;2&lt;/text&gt;&lt;text class=&quot;vn&quot; x=&quot;240&quot; y=&quot;183&quot; text-anchor=&quot;middle&quot;&gt;3&lt;/text&gt;&lt;text class=&quot;vn&quot; x=&quot;178&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot;&gt;4&lt;/text&gt;&lt;text class=&quot;vn&quot; x=&quot;340&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot;&gt;5&lt;/text&gt;&lt;text class=&quot;vn&quot; x=&quot;240&quot; y=&quot;272&quot; text-anchor=&quot;middle&quot;&gt;6&lt;/text&gt;&lt;text class=&quot;vn&quot; x=&quot;140&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot;&gt;7&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;ctrl&quot; data-vbtn style=&quot;justify-content:center&quot;&gt;&lt;button class=&quot;btn&quot; data-s=&quot;1&quot;&gt;1&lt;/button&gt;&lt;button class=&quot;btn&quot; data-s=&quot;2&quot;&gt;2&lt;/button&gt;&lt;button class=&quot;btn&quot; data-s=&quot;3&quot;&gt;3&lt;/button&gt;&lt;button class=&quot;btn&quot; data-s=&quot;4&quot;&gt;4&lt;/button&gt;&lt;button class=&quot;btn&quot; data-s=&quot;5&quot;&gt;5&lt;/button&gt;&lt;button class=&quot;btn&quot; data-s=&quot;6&quot;&gt;6&lt;/button&gt;&lt;button class=&quot;btn&quot; data-s=&quot;7&quot;&gt;7&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;info&quot; id=&quot;vinfo&quot;&gt;&lt;p class=&quot;small&quot;&gt;No segment selected.&lt;/p&gt;&lt;/div&gt;
  &lt;/figure&gt;
  &lt;div hidden&gt;
    &lt;div data-v=&quot;1&quot;&gt;&lt;h4&gt;1 · Dormant connection&lt;/h4&gt;&lt;p&gt;Business connection only. The connection exists, but no one sees or challenges it: it is “dormant”. &lt;b&gt;Responsibility exists nonetheless&lt;/b&gt;, even if it has not (yet) been activated.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-v=&quot;2&quot;&gt;&lt;h4&gt;2 · Externally confirmed connection&lt;/h4&gt;&lt;p&gt;A real connection + external pressure, but the company does not acknowledge it internally. Typical battleground between NGOs/media and a company in the &lt;a href=&quot;#denial&quot;&gt;denial&lt;/a&gt; phase.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-v=&quot;3&quot;&gt;&lt;h4&gt;3 · Accepted connection&lt;/h4&gt;&lt;p&gt;All three: the connection exists, the company acknowledges it and external stakeholders demand action. Here the problem is fully an &lt;b&gt;Issue&lt;/b&gt; and action is most likely.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-v=&quot;4&quot;&gt;&lt;h4&gt;4 · Internally confirmed connection&lt;/h4&gt;&lt;p&gt;A real connection acknowledged internally, without external pressure. Room for &lt;b&gt;proactive&lt;/b&gt; action, before the pressure arrives.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-v=&quot;5&quot;&gt;&lt;h4&gt;5 · External artificial connection&lt;/h4&gt;&lt;p&gt;External pressure only: external stakeholders attribute to the company a problem with which it has no real link. It is “artificial” (see slide 38: outsiders may connect a company to an issue even where no connection exists).&lt;/p&gt;&lt;/div&gt;
    &lt;div data-v=&quot;6&quot;&gt;&lt;h4&gt;6 · Confirmed artificial connection&lt;/h4&gt;&lt;p&gt;Insiders and outsiders agree on the existence of a link that does not in fact exist. A “confirmed” but nonetheless artificial connection.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-v=&quot;7&quot;&gt;&lt;h4&gt;7 · Internal artificial connection&lt;/h4&gt;&lt;p&gt;Internal cognition only: people within the company believe it is connected to an issue, but no real business connection exists.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;The logic of the diagram: the top circle separates &lt;b&gt;real&lt;/b&gt; connections (segments 1–4) from &lt;b&gt;artificial&lt;/b&gt; ones (5–7). The other two circles indicate &lt;b&gt;who&lt;/b&gt; confirms it: insiders, outsiders, both or neither.&lt;/p&gt;

  &lt;h3&gt;Business connection: how it arises &lt;small&gt;(slide 35)&lt;/small&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Activities or product effects&lt;/h4&gt;Examples in the slides: violent video games, weapons, infant formula, Merkel and the car industry, marketing, Tamoil in Libya, GM in South Africa.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Direct or indirect&lt;/h4&gt;Direct: my activity touches the problem. Indirect: I reach it through suppliers, customers, partners.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Positive or negative&lt;/h4&gt;Examples in the slides: Colalife (positive connection), Nokia Siemens Networks in Iran, IBM and Nazism (negative).&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Intended or unintended&lt;/h4&gt;The connection may be &lt;span class=&quot;en&quot;&gt;intended&lt;/span&gt; or &lt;span class=&quot;en&quot;&gt;unintended&lt;/span&gt;: an unintended effect also connects.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;The slides only name the cases. &lt;span class=&quot;ext&quot;&gt;general context&lt;/span&gt; Colalife is known for using spare space in Coca-Cola crates to distribute anti-diarrhoea kits; the Nokia Siemens case concerns the sale of communications-monitoring technology to Iran. Check the details against the course material.&lt;/p&gt;

  &lt;h3&gt;Internal and external stakeholders &lt;small&gt;(slide 38)&lt;/small&gt;&lt;/h3&gt;
  &lt;blockquote&gt;“Internal stakeholders might be cognizant of the social connection between corporate activities/products and a societal issue. This cognizance might create dynamics and encourage companies to act upon their connection. The impact of external stakeholders is more complex. External stakeholders might connect corporations to issues, irrespective of whether there is a connection […]. Therefore, external stakeholders might assign an actor responsibility for an issue without any connection.”&lt;cite&gt;slide 38 (from Schrempf 2014)&lt;/cite&gt;&lt;/blockquote&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · part 8&lt;/h3&gt;&lt;ol&gt;
    &lt;li&gt;Which three elements determine whether an issue becomes an Issue?
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Business connection, internal stakeholder cognition, external stakeholder pressure.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;What is the difference between segment 1 and segment 5?
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Segment 1 (dormant): there is a real connection, but no one recognizes it or exerts pressure. Segment 5 (external artificial): there is only external pressure, with neither a real connection nor internal recognition.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;Does a company in segment 1 bear responsibility?
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Yes: for Schrempf, responsibility exists as soon as the company is connected to an issue through its business; stakeholder pressure is merely a catalyst for action (slide 39).&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
  &lt;/ol&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 9. TIPI ============ --&gt;
&lt;section class=&quot;part p-ochre&quot; id=&quot;tipi&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;9&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Schrempf (2012) and stakeholders&lt;/div&gt;&lt;h2&gt;Upstream, downstream, historical and social connection responsibility &lt;span class=&quot;slides&quot;&gt;slides 35–36, 39&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;How far does a company’s responsibility extend? Slide 36 maps it along four directions. Click the arrows.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg id=&quot;cmp&quot; class=&quot;cmp&quot; viewBox=&quot;0 0 700 360&quot; role=&quot;img&quot; aria-label=&quot;Four directions of responsibility around the company&quot;&gt;
      &lt;g class=&quot;arm&quot; data-a=&quot;up&quot; tabindex=&quot;0&quot;&gt;&lt;path d=&quot;M330 45H370V110H390L350 145L310 110H330Z&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;Upstream responsibility&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;arm&quot; data-a=&quot;down&quot; tabindex=&quot;0&quot;&gt;&lt;path d=&quot;M330 315H370V250H390L350 215L310 250H330Z&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;345&quot; text-anchor=&quot;middle&quot;&gt;Downstream responsibility&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;arm&quot; data-a=&quot;hist&quot; tabindex=&quot;0&quot;&gt;&lt;path d=&quot;M110 165H240V150L280 180L240 210V195H110Z&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot;&gt;Historical responsibility&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;arm&quot; data-a=&quot;soc&quot; tabindex=&quot;0&quot;&gt;&lt;path d=&quot;M420 165H550V150L590 180L550 210V195H420Z&quot;/&gt;&lt;text x=&quot;510&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot;&gt;Social connection responsibility&lt;/text&gt;&lt;/g&gt;
      &lt;rect x=&quot;285&quot; y=&quot;150&quot; width=&quot;130&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--paper)&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text class=&quot;lbl b&quot; x=&quot;350&quot; y=&quot;186&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:17px&quot;&gt;Company&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;info&quot; id=&quot;cinfo&quot;&gt;&lt;p class=&quot;small&quot;&gt;Select an arrow.&lt;/p&gt;&lt;/div&gt;
  &lt;/figure&gt;
  &lt;div hidden&gt;
    &lt;div data-c=&quot;up&quot;&gt;&lt;h4&gt;Upstream responsibility&lt;/h4&gt;&lt;p&gt;Responsibility towards the &lt;b&gt;supply chain&lt;/b&gt;: labour and environmental conditions at suppliers and sub-contractors. Typical topics: &lt;span class=&quot;en&quot;&gt;sweatshops&lt;/span&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Examples in the slides: Starbucks and fair-trade coffee; Nike and sub-contractors’ workers; the clothing industry.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-c=&quot;down&quot;&gt;&lt;h4&gt;Downstream responsibility&lt;/h4&gt;&lt;p&gt;Responsibility towards &lt;b&gt;consumers and society&lt;/b&gt; for the use and effects of products: safety, weapons, gambling and video games.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Examples in the slides: IBM and Nazism; Ford, Iveco and executions in China (vehicles used by third parties for purposes contrary to human rights).&lt;/p&gt;&lt;/div&gt;
    &lt;div data-c=&quot;hist&quot;&gt;&lt;h4&gt;Historical responsibility&lt;/h4&gt;&lt;p&gt;Responsibility for &lt;b&gt;past events&lt;/b&gt;, even distant ones, in which the company was involved.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Example in the slides: Ikea and East Germany. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; In 2012, following an Ernst &amp;amp; Young audit, Ikea admitted that its suppliers in the GDR in the 1970s–80s had also used the forced labour of political prisoners, and said it “deeply regretted” this.&lt;/p&gt;&lt;/div&gt;
    &lt;div data-c=&quot;soc&quot;&gt;&lt;h4&gt;Social connection responsibility&lt;/h4&gt;&lt;p&gt;The only arrow pointing &lt;b&gt;outward&lt;/b&gt; from the company: a &lt;b&gt;forward-looking&lt;/b&gt; perspective, trying to change the system.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Examples in the slides: fair trade, slow food.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Three forms of responsibility to exercise &lt;small&gt;(slides 35, 39)&lt;/small&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Action responsibility&lt;/h4&gt;Any concrete CR behaviour that supports change and leads to favourable conditions.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Information responsibility&lt;/h4&gt;Giving an account (&lt;span class=&quot;en&quot;&gt;to give an account&lt;/span&gt;): reporting and being transparent about what one does. It is the antidote to the deniability network.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Participation responsibility&lt;/h4&gt;Taking part in collective initiatives, e.g. &lt;span class=&quot;en&quot;&gt;Multistakeholder initiatives&lt;/span&gt; (MSIs: initiatives bringing together companies, NGOs, trade unions, governments). It is the practical translation of Young’s &lt;a href=&quot;#young&quot;&gt;collective action&lt;/a&gt;.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Which stakeholders matter? &lt;small&gt;(slide 39)&lt;/small&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Type of stakeholder&lt;/h4&gt;See Mitchell, Agle &amp;amp; Wood (1997). &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Their model of &lt;span class=&quot;en&quot;&gt;stakeholder salience&lt;/span&gt; rests on three attributes: &lt;b&gt;power, legitimacy, urgency&lt;/b&gt;; the more attributes a stakeholder has, the more priority managers give it.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Ability to make themselves heard&lt;/h4&gt;Depends on &lt;b&gt;dependence&lt;/b&gt; (Frooman, 1999). &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; Frooman distinguishes &lt;span class=&quot;en&quot;&gt;withholding&lt;/span&gt; strategies (denying resources to the firm) from &lt;span class=&quot;en&quot;&gt;usage&lt;/span&gt; strategies (providing them with conditions attached), either direct or indirect through allies, depending on who depends on whom.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;The key point of slide 39&lt;/b&gt; — stakeholder pressure acts as a &lt;b&gt;catalyst&lt;/b&gt; that triggers action. But &lt;b&gt;responsibility exists independently of pressure&lt;/b&gt;: as soon as the company is connected to an issue through its business, it bears responsibility.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · part 9&lt;/h3&gt;&lt;ol&gt;
    &lt;li&gt;Classify: (a) an arms manufacturer and the use of its products; (b) a brand and conditions in its suppliers’ factories; (c) a company and the forced labour used by its suppliers 40 years ago; (d) a company joining fair trade to change the system.
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;(a) downstream; (b) upstream; (c) historical; (d) social connection responsibility (forward-looking).&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;What is the difference between action, information and participation responsibility?
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;Action: concrete behaviours that bring about change. Information: giving an account, being transparent. Participation: taking part in collective action such as multistakeholder initiatives.&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
    &lt;li&gt;True or false: “If no stakeholder exerts pressure, the company has no responsibility”.
      &lt;details&gt;&lt;summary&gt;Show answer&lt;/summary&gt;&lt;p&gt;False. Pressure is a catalyst for action, but responsibility arises from the connection through the business (segment 1 of the diagram: dormant connection).&lt;/p&gt;&lt;/details&gt;&lt;/li&gt;
  &lt;/ol&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ APPROFONDIRE ============ --&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;approfondire&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;pnum&quot;&gt;→&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Sources&lt;/div&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;lead&quot;&gt;References cited in the slides (slide 41 and in the text). Bibliographic details and descriptions were checked on the web: every entry is an &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;.&lt;/p&gt;
  &lt;p class=&quot;note&quot;&gt;A note on dates: the slides cite “Phillips, 2009: 537” in the text and “Phillips (2010)” in the bibliography. It is the same work: the 2009 presidential address to the Society for Business Ethics, published in 2010.&lt;/p&gt;

  &lt;h3&gt;Lecture references&lt;/h3&gt;
