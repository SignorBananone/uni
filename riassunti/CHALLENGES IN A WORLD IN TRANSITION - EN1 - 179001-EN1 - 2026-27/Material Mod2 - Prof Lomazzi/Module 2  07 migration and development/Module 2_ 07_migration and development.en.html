    &lt;path d=&quot;M340 385 C300 385 270 385 240 385&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.4&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;text x=&quot;290&quot; y=&quot;376&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot; text-anchor=&quot;middle&quot;&gt;policy&lt;/text&gt;
  &lt;/svg&gt;
&lt;/section&gt;

&lt;!-- ============ 1 ============ --&gt;
&lt;section class=&quot;part salvia&quot; id=&quot;s1&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Part 1&lt;/div&gt;
  &lt;h2&gt;Where we left off, and why people migrate&lt;/h2&gt;

  &lt;h3&gt;Bridging from the previous lecture &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The previous lecture dealt with &lt;span class=&quot;term&quot;&gt;intersectionality&lt;/span&gt;: the idea that inequalities do not simply add up but &lt;b&gt;intersect&lt;/b&gt;, producing specific disadvantages when several conditions overlap. The four dimensions recalled are &lt;i&gt;poverty&lt;/i&gt;, &lt;i&gt;gender&lt;/i&gt;, &lt;i&gt;age&lt;/i&gt; and &lt;i&gt;migration background&lt;/i&gt; (having a personal or family history of migration).&lt;/p&gt;
  &lt;svg viewBox=&quot;0 0 600 250&quot; role=&quot;img&quot; aria-label=&quot;Four overlapping circles: poverty, gender, age, migration background&quot;&gt;
    &lt;g fill-opacity=&quot;.28&quot; stroke-width=&quot;1.5&quot;&gt;
      &lt;circle cx=&quot;240&quot; cy=&quot;105&quot; r=&quot;80&quot; fill=&quot;var(--salvia)&quot; stroke=&quot;var(--salvia)&quot;/&gt;
      &lt;circle cx=&quot;360&quot; cy=&quot;105&quot; r=&quot;80&quot; fill=&quot;var(--ocra)&quot; stroke=&quot;var(--ocra)&quot;/&gt;
      &lt;circle cx=&quot;240&quot; cy=&quot;160&quot; r=&quot;80&quot; fill=&quot;var(--ardesia)&quot; stroke=&quot;var(--ardesia)&quot;/&gt;
      &lt;circle cx=&quot;360&quot; cy=&quot;160&quot; r=&quot;80&quot; fill=&quot;var(--mattone)&quot; stroke=&quot;var(--mattone)&quot;/&gt;
    &lt;/g&gt;
    &lt;g font-size=&quot;14&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;text x=&quot;185&quot; y=&quot;70&quot;&gt;Poverty&lt;/text&gt;&lt;text x=&quot;415&quot; y=&quot;70&quot;&gt;Gender&lt;/text&gt;&lt;text x=&quot;185&quot; y=&quot;210&quot;&gt;Age&lt;/text&gt;&lt;text x=&quot;415&quot; y=&quot;205&quot;&gt;Migration&lt;/text&gt;&lt;text x=&quot;415&quot; y=&quot;222&quot;&gt;background&lt;/text&gt;
    &lt;/g&gt;
    &lt;text x=&quot;300&quot; y=&quot;137&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;intersecting&lt;/text&gt;
    &lt;text x=&quot;300&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;disadvantage&lt;/text&gt;
  &lt;/svg&gt;
  &lt;p&gt;Why does it matter here? Because in environment-related migration, &lt;b&gt;those with fewer resources&lt;/b&gt; (often women, older people, the poor) are also those least able to move: we will meet them again as &lt;a href=&quot;#s6&quot;&gt;&lt;i&gt;trapped populations&lt;/i&gt;&lt;/a&gt;. Note also that official statistics (&lt;a href=&quot;#s2&quot;&gt;Part 2&lt;/a&gt;) disaggregate migrants precisely by sex and age.&lt;/p&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Note:&lt;/b&gt; the term &lt;i&gt;intersectionality&lt;/i&gt; was coined by legal scholar Kimberlé Crenshaw (1989); this is contextual information not found in the slides. The other files in the &lt;code&gt;corso/&lt;/code&gt; folder could not be opened in this session, so the link to the previous lecture is based solely on slide 2, “Last time”.&lt;/p&gt;

  &lt;h3&gt;“Why?” — the flamingo question &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The slide shows a flock of flamingos and simply asks &lt;i&gt;Why?&lt;/i&gt;. Animals migrate to follow food, water, favourable climate and breeding grounds: they move when &lt;b&gt;their current environment is no longer sufficient&lt;/b&gt; or another place offers more. For humans too, moving is a response to living conditions, but with a crucial difference: people decide within economic, political, legal and social constraints.&lt;/p&gt;
  &lt;p&gt;Migration studies speak of &lt;span class=&quot;term&quot;&gt;drivers&lt;/span&gt; (factors that push or pull). A classic way of framing them is the pair &lt;span class=&quot;gloss&quot;&gt;push factors&lt;/span&gt; (what drives people away from their place of origin) and &lt;span class=&quot;gloss&quot;&gt;pull factors&lt;/span&gt; (what attracts them to the destination). Explore the five families of drivers:&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Economic&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Political&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Social&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Demographic&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Environmental&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;b&gt;Push:&lt;/b&gt; unemployment, low wages, poverty. &lt;b&gt;Pull:&lt;/b&gt; jobs, higher wages, opportunities. This is the most studied driver and the one that directly links migration and &lt;i&gt;development&lt;/i&gt;.&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;b&gt;Push:&lt;/b&gt; conflict, persecution, instability. &lt;b&gt;Pull:&lt;/b&gt; security, rights, institutional stability. This is the origin of &lt;i&gt;forced&lt;/i&gt; migration and of the legal category of &lt;i&gt;refugee&lt;/i&gt;.&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;b&gt;Push/Pull:&lt;/b&gt; family, networks of compatriots who have already emigrated, education, discrimination (here intersectionality comes back in).&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;b&gt;Push/Pull:&lt;/b&gt; young and growing populations on one side, ageing societies seeking labour on the other.&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;b&gt;Push:&lt;/b&gt; sudden disasters (floods, cyclones, earthquakes) or slow changes (drought, desertification, sea-level rise). This is the central topic of this lecture: see &lt;a href=&quot;#s3&quot;&gt;Part 3&lt;/a&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box tint&quot;&gt;&lt;b&gt;Key idea:&lt;/b&gt; drivers rarely act alone. A drought (environmental) reduces the harvest (economic), heightens tensions (political), and those who leave go where they have relatives (social). This is why the IOM definitions say the environment is the cause &lt;i&gt;“predominantly”&lt;/i&gt; or &lt;i&gt;“a major cause… although not necessarily the sole one”&lt;/i&gt;.&lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Note:&lt;/b&gt; the push/pull taxonomy and the five families of drivers are contextual explanation added here to answer the “Why?” question; the slides do not list them.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Self-check · Part 1&lt;/h4&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;1. Which four dimensions of intersectionality are recalled at the start of the lecture?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Poverty, gender, age, migration background.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;2. Why is it hard to say that someone migrates “solely” for environmental reasons?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Because drivers intersect: an environmental problem operates through the economy, politics and social networks. Indeed, the IOM definitions speak of a “predominant” cause or a “major but not necessarily the sole” cause.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 ============ --&gt;
&lt;section class=&quot;part ocra&quot; id=&quot;s2&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Part 2&lt;/div&gt;
  &lt;h2&gt;Measuring migration&lt;/h2&gt;

  &lt;h3&gt;The Migration Data Portal &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The tool used throughout the lecture is the &lt;span class=&quot;term&quot;&gt;Migration Data Portal&lt;/span&gt; (“The bigger picture”), run by the Global Migration Data Analysis Centre (&lt;b&gt;GMDAC&lt;/b&gt;) of the &lt;b&gt;IOM&lt;/b&gt; (International Organization for Migration, the UN migration agency). It brings together data from other international sources (UN DESA, UNHCR, IDMC…) in interactive dashboards, thematic pages, sections on the international frameworks (&lt;i&gt;SDGs and GCM&lt;/i&gt;) and governance indicators (MGI).&lt;/p&gt;
  &lt;p&gt;The landing page shown in the slide stresses one point: &lt;i&gt;“Migration is a cross-cutting issue in the 2030 Agenda, relevant to all of the Sustainable Development Goals (SDGs)”&lt;/i&gt;. &lt;span class=&quot;gloss&quot;&gt;Cross-cutting&lt;/span&gt; means that migration has no goal of its own but touches on poverty (SDG 1), health, education, work, inequalities (SDG 10), climate (SDG 13)… Hence the &lt;b&gt;migration ↔ development&lt;/b&gt; link in the title.&lt;/p&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Acronyms:&lt;/b&gt; &lt;b&gt;SDGs&lt;/b&gt; = the 17 Sustainable Development Goals of the UN 2030 Agenda (2015). &lt;b&gt;GCM&lt;/b&gt; = &lt;i&gt;Global Compact for Safe, Orderly and Regular Migration&lt;/i&gt; (2018), the first global, non-binding intergovernmental agreement on migration. See &lt;a href=&quot;#fonti&quot;&gt;Further reading&lt;/a&gt;.&lt;/p&gt;

  &lt;h3&gt;General figures (mid-2020) &lt;span class=&quot;src&quot;&gt;slide 5 · UN DESA 2020&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid g4&quot;&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;n&quot;&gt;280.6 m&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;international migrants worldwide&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;n&quot;&gt;48.1%&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;women in the migrant &lt;i&gt;stock&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;n&quot;&gt;14.6%&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;migrants aged 19 or under&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;n&quot;&gt;12.2%&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;migrants aged 65 or over&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;In UN statistics, an &lt;span class=&quot;term&quot;&gt;international migrant&lt;/span&gt; is a person living in a country other than their country of birth (or of citizenship). The figure is a &lt;span class=&quot;term&quot;&gt;stock&lt;/span&gt;: a “snapshot” of how many people are in that condition at a given moment (mid-2020), not how many moved during the year.&lt;/p&gt;
  &lt;figure class=&quot;box&quot; style=&quot;margin:1rem 0&quot;&gt;
    &lt;svg id=&quot;waffle&quot; viewBox=&quot;0 0 600 175&quot; role=&quot;img&quot; aria-label=&quot;Age composition of the 2020 migrant stock&quot;&gt;&lt;/svg&gt;
    &lt;figcaption class=&quot;muted&quot; style=&quot;font-size:.88rem&quot;&gt;Age composition per 100 migrants (slide 5 data): aged ≤19 ≈ 15, aged 20–64 ≈ 73 (derived by subtraction), aged ≥65 ≈ 12. Hover over or tap the squares.&lt;/figcaption&gt;
    &lt;div id=&quot;waffleOut&quot; class=&quot;fb&quot; style=&quot;margin-top:.4rem&quot;&gt;&lt;/div&gt;
  &lt;/figure&gt;
  &lt;p&gt;Proportions worth noting: women make up almost half (48.1%), so migration is &lt;b&gt;not&lt;/b&gt; an exclusively male phenomenon; the vast majority are of working age (about 73%, by subtraction), which explains why migration is tied to economic development. For scale: 281 million is about &lt;b&gt;3.6%&lt;/b&gt; of the world population &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://www.pewresearch.org/short-reads/2022/12/16/key-facts-about-recent-trends-in-global-migration/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: Pew Research on UN DESA data&lt;/a&gt;&lt;/span&gt; — up from 173 million in 2000 and 221 million in 2010 &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://namibia.un.org/sites/default/files/2021-01/International_Migration_2020_Highlights_Ten_key_messages.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: UN DESA, Highlights 2020&lt;/a&gt;&lt;/span&gt;.&lt;/p&gt;

  &lt;h3&gt;How migration is observed: four indicators &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Indicator&lt;/th&gt;&lt;th&gt;What it measures&lt;/th&gt;&lt;th&gt;Type&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Net migration rate&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Balance between those entering and those leaving, relative to the population (per 1,000 inhabitants)&lt;/td&gt;&lt;td&gt;net flow (balance)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Migration inflow&lt;/b&gt;&lt;/td&gt;&lt;td&gt;How many people enter a country over a period&lt;/td&gt;&lt;td&gt;gross flow&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Types of migration&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Breakdown by reason, in particular &lt;i&gt;forced migration&lt;/i&gt; (conflict, persecution, disasters)&lt;/td&gt;&lt;td&gt;classification&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Refugees in host country&lt;/b&gt;&lt;/td&gt;&lt;td&gt;How many refugees each country hosts&lt;/td&gt;&lt;td&gt;stock&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p&gt;Distinguishing &lt;span class=&quot;term&quot;&gt;stock&lt;/span&gt; (how many there are, at a given date) from &lt;span class=&quot;term&quot;&gt;flow&lt;/span&gt; (how many move, over a period) is essential: we will come back to it with the disaster data, where the two figures differ greatly.&lt;/p&gt;

  &lt;h4&gt;The net migration rate: try it yourself&lt;/h4&gt;
  &lt;div class=&quot;formula&quot;&gt;NMR = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;Immigrants − Emigrants&lt;/span&gt;&lt;span&gt;Population&lt;/span&gt;&lt;/span&gt; × 1000&lt;/div&gt;
  &lt;p&gt;The result reads as “net migrants per 1,000 inhabitants” (usually as an annual average). Positive = the country &lt;b&gt;gains&lt;/b&gt; population through migration; negative = it &lt;b&gt;loses&lt;/b&gt; population. Move the sliders (imaginary country):&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;label class=&quot;rng&quot;&gt;Immigrants in the year: &lt;output id=&quot;oI&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rI&quot; min=&quot;0&quot; max=&quot;500000&quot; step=&quot;5000&quot; value=&quot;180000&quot;&gt;
    &lt;label class=&quot;rng&quot;&gt;Emigrants in the year: &lt;output id=&quot;oE&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rE&quot; min=&quot;0&quot; max=&quot;500000&quot; step=&quot;5000&quot; value=&quot;120000&quot;&gt;
    &lt;label class=&quot;rng&quot;&gt;Population: &lt;output id=&quot;oP&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rP&quot; min=&quot;1000000&quot; max=&quot;60000000&quot; step=&quot;500000&quot; value=&quot;10000000&quot;&gt;
    &lt;svg id=&quot;nmrBar&quot; viewBox=&quot;0 0 600 70&quot; aria-hidden=&quot;true&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;outcome&quot; id=&quot;nmrOut&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;muted&quot; id=&quot;nmrTxt&quot; style=&quot;font-size:.9rem&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Caution:&lt;/b&gt; an NMR close to zero does &lt;b&gt;not&lt;/b&gt; mean nobody is moving: large inflows and outflows can offset each other. This is why the portal also reports &lt;i&gt;inflow&lt;/i&gt;. The UN definition used in the datasets (annual average over periods, per 1,000 inhabitants) is described by Our World in Data &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://ourworldindata.org/grapher/net-migration&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/span&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Self-check · Part 2&lt;/h4&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;1. Is 280.6 million a stock or a flow? Why does it matter?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;A stock: how many people were living outside their country of birth in mid-2020. It does not tell us how many moved during the year (flow), so it should not be compared directly with flow data.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;2. A country has 50,000 immigrants, 70,000 emigrants and 4 million inhabitants. What is its NMR?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;(50,000 − 70,000) / 4,000,000 × 1000 = &lt;b&gt;−5 per thousand&lt;/b&gt;: the country loses population through migration.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;3. What does it mean that migration is “cross-cutting” in the 2030 Agenda?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;That it cuts across all the SDGs (poverty, work, health, inequalities, climate…) rather than being a stand-alone goal.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 ============ --&gt;
&lt;section class=&quot;part ardesia&quot; id=&quot;s3&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Part 3&lt;/div&gt;
  &lt;h2&gt;The right words: environmental and climate migration&lt;/h2&gt;
  &lt;p&gt;The core of the lecture is &lt;b&gt;terminological&lt;/b&gt;. All definitions come from the IOM, in particular its &lt;i&gt;Glossary on Migration&lt;/i&gt; (2019). Words matter because &lt;b&gt;rights, protection and data&lt;/b&gt; depend on them: if a category does not exist in law, nobody is obliged to protect it, and if it is not defined, it cannot be counted.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Environmental migration&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Climate migration&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Environmentally displaced person&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Disaster displacement&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;div class=&quot;lab&quot;&gt;Definition · IOM 2019 · slide 7&lt;/div&gt;&lt;q&gt;Movement of persons or groups of persons [&lt;b&gt;environmental migrants&lt;/b&gt;] who, predominantly for reasons of sudden or progressive changes in the environment that adversely affect their lives or living conditions, are forced to leave their places of habitual residence, or choose to do so, either temporarily or permanently, and who move within or outside their country of origin or habitual residence.&lt;/q&gt;&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Environmental migration&lt;/span&gt;. Key elements to remember:&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;predominantly&lt;/b&gt;: the environment is the prevailing cause, not necessarily the only one;&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;sudden or progressive&lt;/b&gt;: abrupt changes (&lt;i&gt;sudden-onset&lt;/i&gt;, e.g. a flood) or gradual ones (&lt;i&gt;slow-onset&lt;/i&gt;, e.g. desertification);&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;forced … or choose to do so&lt;/b&gt;: covers both those who are compelled and those who choose;&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;temporarily or permanently&lt;/b&gt;; &lt;b&gt;within or outside&lt;/b&gt; the country: internal migration is covered too.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;div class=&quot;lab&quot;&gt;Definition · IOM 2019 · slide 8&lt;/div&gt;&lt;q&gt;The movement of a person or groups of persons who, predominantly for reasons of sudden or progressive change in the environment &lt;b&gt;due to climate change&lt;/b&gt;, are obliged to leave their habitual place of residence, or choose to do so, either temporarily or permanently, within a State or across an international border.&lt;/q&gt;&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Climate migration&lt;/span&gt; is a &lt;b&gt;subcategory&lt;/b&gt; of environmental migration: same structure, but the environmental change is due to &lt;i&gt;climate change&lt;/i&gt;. An earthquake or a volcanic eruption can cause environmental migration, but &lt;b&gt;not&lt;/b&gt; climate migration.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;div class=&quot;lab&quot;&gt;Definition · IOM 2011:34 in IOM 2014:13 · slide 10&lt;/div&gt;&lt;q&gt;Persons who are displaced within their country of habitual residence or who have crossed an international border and for whom environmental degradation, deterioration or destruction is a major cause of their displacement, although not necessarily the sole one.&lt;/q&gt;&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Environmentally displaced person&lt;/span&gt;. Here we move from &lt;i&gt;migration&lt;/i&gt; to &lt;span class=&quot;term&quot;&gt;displacement&lt;/span&gt;: the emphasis is on the &lt;b&gt;forced&lt;/b&gt; nature of the movement. The idea of multiple causation returns: &lt;i&gt;“major cause … not necessarily the sole one”&lt;/i&gt;.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;div class=&quot;lab&quot;&gt;Definition · The Nansen Protection Agenda 2015 · slide 10&lt;/div&gt;&lt;q&gt;Situations where people are forced or obliged to leave their homes or places of habitual residence, in particular as a result of or in order to avoid the effects of disasters triggered by natural hazards. Such displacement may take the form of spontaneous flight or an evacuation ordered or enforced by authorities. Such displacement can occur within a country, or across international borders.&lt;/q&gt;&lt;/div&gt;
      &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Disaster displacement&lt;/span&gt;. Three new elements: (1) it also counts those who leave &lt;b&gt;to avoid&lt;/b&gt; the effects (pre-emptive evacuation); (2) the disaster is triggered by &lt;span class=&quot;gloss&quot;&gt;natural hazards&lt;/span&gt; (a &lt;i&gt;hazard&lt;/i&gt; becomes a &lt;i&gt;disaster&lt;/i&gt; when it strikes vulnerable people); (3) it may take the form of &lt;i&gt;spontaneous flight&lt;/i&gt; or an evacuation ordered by the authorities.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;How the terms fit together&lt;/h3&gt;
  &lt;svg viewBox=&quot;0 0 700 330&quot; role=&quot;img&quot; aria-label=&quot;Set diagram: environmental migration contains climate migration; displacement is the forced part&quot;&gt;
    &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;680&quot; height=&quot;310&quot; rx=&quot;18&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;
    &lt;text x=&quot;30&quot; y=&quot;38&quot; font-size=&quot;13&quot; fill=&quot;var(--ink2)&quot;&gt;All human mobility&lt;/text&gt;
    &lt;ellipse cx=&quot;350&quot; cy=&quot;175&quot; rx=&quot;300&quot; ry=&quot;130&quot; fill=&quot;var(--ardesia-bg)&quot; stroke=&quot;var(--ardesia)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;text x=&quot;110&quot; y=&quot;100&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; fill=&quot;var(--ardesia)&quot;&gt;Environmental migration&lt;/text&gt;
    &lt;text x=&quot;110&quot; y=&quot;118&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;prevailing cause: environmental change&lt;/text&gt;
    &lt;ellipse cx=&quot;420&quot; cy=&quot;195&quot; rx=&quot;170&quot; ry=&quot;90&quot; fill=&quot;var(--ocra-bg)&quot; stroke=&quot;var(--ocra)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;text x=&quot;340&quot; y=&quot;150&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; fill=&quot;var(--ocra)&quot;&gt;Climate migration&lt;/text&gt;
    &lt;text x=&quot;340&quot; y=&quot;167&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;subcategory: due to climate change&lt;/text&gt;
    &lt;path d=&quot;M110 175 L640 175&quot; stroke=&quot;var(--mattone)&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;6 4&quot;/&gt;
    &lt;text x=&quot;120&quot; y=&quot;200&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot; fill=&quot;var(--mattone)&quot;&gt;↓ “forced” part = displacement&lt;/text&gt;
    &lt;text x=&quot;120&quot; y=&quot;218&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;environmentally displaced persons,&lt;/text&gt;
    &lt;text x=&quot;120&quot; y=&quot;234&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;disaster displacement&lt;/text&gt;
    &lt;text x=&quot;120&quot; y=&quot;160&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot; fill=&quot;var(--salvia)&quot;&gt;↑ “by choice” part&lt;/text&gt;
    &lt;text x=&quot;420&quot; y=&quot;250&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot; text-anchor=&quot;middle&quot;&gt;e.g. people displaced by a cyclone&lt;/text&gt;
    &lt;text x=&quot;420&quot; y=&quot;265&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot; text-anchor=&quot;middle&quot;&gt;intensified by global warming&lt;/text&gt;
    &lt;text x=&quot;180&quot; y=&quot;290&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;e.g. people displaced by an earthquake (not climate-related)&lt;/text&gt;
  &lt;/svg&gt;
  &lt;p class=&quot;muted&quot; style=&quot;font-size:.88rem&quot;&gt;Teaching diagram: the forced/choice line is in reality a &lt;b&gt;continuum&lt;/b&gt;, not a sharp boundary. Moreover, &lt;i&gt;disaster displacement&lt;/i&gt; includes natural disasters unrelated to environmental “degradation” (e.g. earthquakes).&lt;/p&gt;

  &lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Term&lt;/th&gt;&lt;th&gt;Cause&lt;/th&gt;&lt;th&gt;Forced?&lt;/th&gt;&lt;th&gt;Where&lt;/th&gt;&lt;th&gt;Source&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Environmental migration&lt;/td&gt;&lt;td&gt;sudden or gradual environmental change (prevailing cause)&lt;/td&gt;&lt;td&gt;forced &lt;b&gt;or&lt;/b&gt; chosen&lt;/td&gt;&lt;td&gt;internal or international&lt;/td&gt;&lt;td&gt;IOM 2019&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Climate migration&lt;/td&gt;&lt;td&gt;as above, but &lt;b&gt;due to climate change&lt;/b&gt;&lt;/td&gt;&lt;td&gt;obliged &lt;b&gt;or&lt;/b&gt; chosen&lt;/td&gt;&lt;td&gt;internal or international&lt;/td&gt;&lt;td&gt;IOM 2019&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Environmentally displaced person&lt;/td&gt;&lt;td&gt;environmental degradation/destruction as a &lt;b&gt;major&lt;/b&gt; cause&lt;/td&gt;&lt;td&gt;yes (displaced)&lt;/td&gt;&lt;td&gt;internal or international&lt;/td&gt;&lt;td&gt;IOM 2011/2014&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Disaster displacement&lt;/td&gt;&lt;td&gt;disasters triggered by &lt;b&gt;natural hazards&lt;/b&gt; (including to avoid them)&lt;/td&gt;&lt;td&gt;yes (forced/obliged)&lt;/td&gt;&lt;td&gt;internal or international&lt;/td&gt;&lt;td&gt;Nansen 2015&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;h3&gt;Classify the case&lt;/h3&gt;
  &lt;p&gt;For each scenario, choose the &lt;b&gt;most precise&lt;/b&gt; term.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;b&gt;A.&lt;/b&gt; After years of increasingly frequent droughts linked to global warming, a farming family decides to move to their country’s capital.&lt;/p&gt;
    &lt;div class=&quot;choice&quot; data-choice&gt;&lt;button data-ok data-fb=&quot;A chosen, internal move linked to a gradual change caused by the climate: climate migration (and therefore also environmental migration).&quot;&gt;Climate migration&lt;/button&gt;&lt;button data-fb=&quot;There is no sudden disaster and no evacuation: it is a choice in the face of slow change.&quot;&gt;Disaster displacement&lt;/button&gt;&lt;button data-fb=&quot;A term to avoid (Part 4) — and in any case the family crosses no border and is not persecuted.&quot;&gt;Climate refugee&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;b&gt;B.&lt;/b&gt; The authorities order the evacuation of a valley before a cyclone arrives; residents return two weeks later.&lt;/p&gt;
    &lt;div class=&quot;choice&quot; data-choice&gt;&lt;button data-fb=&quot;The IOM definition covers this too, but it does not capture the forced, pre-emptive nature of the move.&quot;&gt;Environmental migration&lt;/button&gt;&lt;button data-ok data-fb=&quot;Correct: an evacuation ordered by the authorities “in order to avoid the effects of disasters” — even if temporary.&quot;&gt;Disaster displacement&lt;/button&gt;&lt;button data-fb=&quot;There is no planned permanent relocation: they go back home.&quot;&gt;Planned relocation&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;box&quot;&gt;&lt;p&gt;&lt;b&gt;C.&lt;/b&gt; An earthquake destroys a city; many residents seek refuge across the border in the neighbouring country.&lt;/p&gt;
    &lt;div class=&quot;choice&quot; data-choice&gt;&lt;button data-fb=&quot;An earthquake is not caused by climate change.&quot;&gt;Climate migration&lt;/button&gt;&lt;button data-ok data-fb=&quot;Yes: a disaster triggered by a natural hazard, with displacement across an international border (cross-border).&quot;&gt;Disaster displacement&lt;/button&gt;&lt;button data-fb=&quot;An earthquake is not persecution: the 1951 Convention does not automatically apply.&quot;&gt;Refugees (1951 Convention)&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;fb&quot;&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Self-check · Part 3&lt;/h4&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;1. What is the only difference between environmental and climate migration?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;The cause of the environmental change: in climate migration it is climate change. That is why it is a subcategory.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;2. The IOM definitions also include those who “choose” to leave. Why is this important?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Because much environmental mobility is not clearly forced: it is a response (including an adaptive one) to deteriorating conditions. Excluding it would make most of the phenomenon invisible.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;3. What does the Nansen Protection Agenda’s definition of disaster displacement add?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;That movement to &lt;i&gt;avoid&lt;/i&gt; the effects of a disaster also counts, and that it can be spontaneous flight or an evacuation ordered by the authorities, within a country or across borders.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 ============ --&gt;
&lt;section class=&quot;part mattone&quot; id=&quot;s4&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Part 4&lt;/div&gt;
  &lt;h2&gt;“Climate refugees”: why not to use the term&lt;/h2&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;div class=&quot;lab&quot;&gt;Slide 9&lt;/div&gt;On &lt;b&gt;climate refugees&lt;/b&gt; or &lt;b&gt;environmental refugees&lt;/b&gt; there is a &lt;i&gt;“growing consensus among concerned agencies, including IOM and UNHCR, that the use of these terms is to be avoided”&lt;/i&gt;. They are &lt;b&gt;misleading&lt;/b&gt; terms.&lt;/div&gt;
  &lt;p&gt;The term is widespread in the media, yet UN agencies avoid it. Step through the three reasons given in the slide:&lt;/p&gt;

  &lt;div class=&quot;steps&quot; data-steps&gt;
    &lt;div class=&quot;step box&quot;&gt;&lt;h4&gt;① Environmental migration is mainly &lt;i&gt;internal&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Most people who move for environmental reasons stay within their own country. A &lt;i&gt;refugee&lt;/i&gt;, by legal definition, has &lt;b&gt;crossed a border&lt;/b&gt;. Calling them “refugees” shifts attention to international arrivals and conceals the bulk of the phenomenon (see the data on &lt;i&gt;internal displacements&lt;/i&gt; in &lt;a href=&quot;#s5&quot;&gt;Part 5&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step box&quot;&gt;&lt;h4&gt;② It is not necessarily &lt;i&gt;forced&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;As seen in the IOM definitions, many people choose to leave (“or choose to do so”), often in advance, as an adaptation strategy. “Refugee” evokes only forced flight.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step box&quot;&gt;&lt;h4&gt;③ It could undermine the refugee protection regime&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Refugee&lt;/span&gt; status is defined by the &lt;b&gt;1951 Geneva Convention&lt;/b&gt;: a person outside their country owing to a well-founded fear of &lt;b&gt;persecution&lt;/b&gt; on grounds of race, religion, nationality, membership of a particular social group or political opinion. The climate does not “persecute”. Broadening the term without a legal basis risks diluting an already fragile form of protection, or prompting its renegotiation downwards.&lt;/p&gt;
      &lt;p class=&quot;muted&quot; style=&quot;font-size:.9rem&quot;&gt;The five grounds of persecution and the reference to the Convention are added context &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://www.unhcr.org/about-unhcr/overview/1951-refugee-convention&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: UNHCR&lt;/a&gt;&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step box&quot;&gt;&lt;h4&gt;So what should we say?&lt;/h4&gt;&lt;p&gt;UNHCR suggests &lt;i&gt;“persons displaced in the context of disasters and climate change”&lt;/i&gt; &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://www.unhcr.org/en-ie/climate-change-and-disasters.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: UNHCR&lt;/a&gt;&lt;/span&gt;. UNHCR itself acknowledges that in some cases an asylum claim may be valid, for example when climate impacts &lt;b&gt;intersect with conflict and violence&lt;/b&gt;. In practice: use the terms from &lt;a href=&quot;#s3&quot;&gt;Part 3&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn ghost&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;svg viewBox=&quot;0 0 700 170&quot; role=&quot;img&quot; aria-label=&quot;Comparison between a refugee and an environmentally displaced person&quot;&gt;
    &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;330&quot; height=&quot;150&quot; rx=&quot;14&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--mattone)&quot;/&gt;
    &lt;rect x=&quot;360&quot; y=&quot;10&quot; width=&quot;330&quot; height=&quot;150&quot; rx=&quot;14&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ardesia)&quot;/&gt;
    &lt;text x=&quot;30&quot; y=&quot;40&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; fill=&quot;var(--mattone)&quot;&gt;Refugee (1951 Conv.)&lt;/text&gt;
    &lt;g font-size=&quot;13&quot;&gt;&lt;text x=&quot;30&quot; y=&quot;68&quot;&gt;• cause: persecution (5 grounds)&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;92&quot;&gt;• has crossed a border&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;116&quot;&gt;• binding legal status&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;140&quot;&gt;• right to non-refoulement&lt;/text&gt;&lt;/g&gt;
    &lt;text x=&quot;380&quot; y=&quot;40&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; fill=&quot;var(--ardesia)&quot;&gt;Environmental migrant / displaced&lt;/text&gt;
    &lt;g font-size=&quot;13&quot;&gt;&lt;text x=&quot;380&quot; y=&quot;68&quot;&gt;• cause: environment / climate / disasters&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;92&quot;&gt;• mostly internal&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;116&quot;&gt;• forced or chosen&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;140&quot;&gt;• no dedicated international status&lt;/text&gt;&lt;/g&gt;
  &lt;/svg&gt;
  &lt;p class=&quot;muted&quot; style=&quot;font-size:.88rem&quot;&gt;&lt;i&gt;Non-refoulement&lt;/i&gt; (the prohibition on returning someone to a country where they face persecution) is added context, not found in the slides.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Self-check · Part 4&lt;/h4&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;1. List the three reasons why IOM and UNHCR avoid “climate refugee”.&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;(1) environmental migration is mostly internal; (2) it is not necessarily forced; (3) the term could undermine the international legal regime for refugee protection.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;2. A person crosses a border after a flood: are they a refugee under the 1951 Convention?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;As a rule, no: a flood is not persecution. They are a person in &lt;i&gt;cross-border disaster displacement&lt;/i&gt;. They might qualify if, for example, the disaster intersects with persecution or conflict.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 ============ --&gt;
&lt;section class=&quot;part ocra&quot; id=&quot;s5&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Part 5&lt;/div&gt;
  &lt;h2&gt;How many? Data on disaster displacement&lt;/h2&gt;

  &lt;h3&gt;Internal displacements due to disaster, 2013–2022 &lt;span class=&quot;src&quot;&gt;slide 11 · IDMC 2023&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The chart (source: &lt;b&gt;IDMC&lt;/b&gt;, Internal Displacement Monitoring Centre, as reworked by IOM GMDAC) counts &lt;span class=&quot;term&quot;&gt;new internal displacements&lt;/span&gt;: new forced movements &lt;b&gt;within&lt;/b&gt; countries caused by disasters, year by year. It is a &lt;b&gt;flow&lt;/b&gt;. Move the slider to explore it.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;svg id=&quot;disChart&quot; viewBox=&quot;0 0 640 300&quot; role=&quot;img&quot; aria-label=&quot;Bar chart of internal displacements due to disasters, 2013-2022&quot;&gt;&lt;/svg&gt;
    &lt;label class=&quot;rng&quot;&gt;Year: &lt;output id=&quot;oY&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;rY&quot; min=&quot;0&quot; max=&quot;9&quot; value=&quot;9&quot; step=&quot;1&quot;&gt;
    &lt;p style=&quot;margin:.6rem 0 .2rem&quot;&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;cAvg&quot;&gt; show the 2013–2022 average&lt;/label&gt;&lt;/p&gt;
    &lt;p class=&quot;outcome&quot; id=&quot;yOut&quot;&gt;&lt;/p&gt;&lt;p class=&quot;muted&quot; id=&quot;yTxt&quot; style=&quot;font-size:.92rem&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;How to read it: the figure fluctuates (depending on how many major events occur in a given year), but the recent trend is &lt;b&gt;upward&lt;/b&gt;: 2019, 2020 and 2022 are the three highest years, with a peak of &lt;b&gt;32.6 million&lt;/b&gt; in 2022. According to IDMC, the 2022 increase was driven mainly by the third consecutive year of &lt;i&gt;La Niña&lt;/i&gt; (e.g. the floods in Pakistan) &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://www.weforum.org/agenda/2023/06/internally-displaced-people-conflict-disasters&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: WEF on GRID 2023&lt;/a&gt;&lt;/span&gt;.&lt;/p&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;b&gt;Caution:&lt;/b&gt; a &lt;i&gt;displacement&lt;/i&gt; is not a person. The same person displaced twice in the same year is counted twice; and flows do not tell us how many people are &lt;i&gt;still&lt;/i&gt; displaced at the end of the year (the stock: about 8.7 million people at the end of 2022 due to disasters, according to IDMC &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://www.downtoearth.org.in/climate-change/unusually-long-la-ni-a-displaced-record-number-of-people-in-2022-89247&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: Down To Earth on GRID 2023&lt;/a&gt;&lt;/span&gt;). Moreover, displacement caused by slow-onset events (drought, sea-level rise) largely goes uncounted.&lt;/p&gt;

  &lt;h3&gt;Internally displaced persons due to disasters &lt;span class=&quot;src&quot;&gt;slide 12 · IDMC 2023&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;An &lt;span class=&quot;term&quot;&gt;IDP&lt;/span&gt; (&lt;i&gt;internally displaced person&lt;/i&gt;) is someone who has been forced to leave their home but &lt;b&gt;has not crossed a border&lt;/b&gt;. The map in the slide shows the &lt;b&gt;stock&lt;/b&gt; of disaster IDPs in 2022: larger circles = more people. The countries with the highest values:&lt;/p&gt;
  &lt;svg viewBox=&quot;0 0 600 210&quot; role=&quot;img&quot; aria-label=&quot;Countries with the most people internally displaced by disasters, 2022&quot;&gt;
    &lt;g font-size=&quot;13&quot;&gt;
      &lt;text x=&quot;10&quot; y=&quot;35&quot;&gt;Afghanistan&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;20&quot; width=&quot;440&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--ocra)&quot;/&gt;&lt;text x=&quot;565&quot; y=&quot;36&quot; text-anchor=&quot;end&quot; fill=&quot;var(--paper)&quot; font-weight=&quot;600&quot;&gt;2.2 m&lt;/text&gt;
      &lt;text x=&quot;10&quot; y=&quot;75&quot;&gt;Pakistan&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;60&quot; width=&quot;230&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--ocra)&quot; fill-opacity=&quot;.75&quot;/&gt;&lt;text x=&quot;358&quot; y=&quot;76&quot;&gt;≈ 1.1 m&lt;/text&gt;
      &lt;text x=&quot;10&quot; y=&quot;115&quot;&gt;Nigeria&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;100&quot; width=&quot;190&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--ocra)&quot; fill-opacity=&quot;.65&quot;/&gt;&lt;text x=&quot;318&quot; y=&quot;116&quot;&gt;≈ 0.9 m&lt;/text&gt;
      &lt;text x=&quot;10&quot; y=&quot;155&quot;&gt;Ethiopia&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;140&quot; width=&quot;155&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--ocra)&quot; fill-opacity=&quot;.55&quot;/&gt;&lt;text x=&quot;283&quot; y=&quot;156&quot;&gt;≈ 0.75 m&lt;/text&gt;
      &lt;text x=&quot;10&quot; y=&quot;195&quot;&gt;South Sudan&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;180&quot; width=&quot;140&quot; height=&quot;22&quot; rx=&quot;4&quot; fill=&quot;var(--ocra)&quot; fill-opacity=&quot;.45&quot;/&gt;&lt;text x=&quot;268&quot; y=&quot;196&quot;&gt;≈ 0.7 m&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;p class=&quot;muted&quot; style=&quot;font-size:.88rem&quot;&gt;Only the value for Afghanistan (2.2 million) is given in the slide; the others are estimates read by eye from the bar lengths. Many of the large circles are in the Global South (South Asia, East and West Africa, Southeast Asia): these are countries highly exposed to hazards and with fewer resources to prevent them — the link with &lt;i&gt;development&lt;/i&gt;. Interactive data: &lt;a href=&quot;https://www.migrationdataportal.org/international-data?i=idp_stock_disaster&amp;amp;t=2022&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Migration Data Portal (link in the slide)&lt;/a&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Self-check · Part 5&lt;/h4&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;1. Do 32.6 million “internal displacements” in 2022 mean 32.6 million people displaced at the end of the year?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;No. It is a flow of displacement events during the year (one person can be counted several times; many return quickly). The stock of people displaced at year-end is much lower.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;2. What is the difference between an IDP and a refugee?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;An IDP remains in their own country (no border crossed) and is under the protection of their own State; a refugee has crossed a border to escape persecution and enjoys international status.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;3. Why are data on environmental migration probably underestimated?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Because movements due to slow-onset processes (drought, degradation, sea-level rise) are hard to attribute to a single cause and hard to count; IDMC data mainly cover sudden-onset disasters.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6 ============ --&gt;
&lt;section class=&quot;part salvia&quot; id=&quot;s6&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Part 6&lt;/div&gt;
  &lt;h2&gt;Relocation (or not?)&lt;/h2&gt;
  &lt;p&gt;Two opposite situations: people who are &lt;b&gt;moved in an organised way&lt;/b&gt; by the State, and people who &lt;b&gt;are unable to move&lt;/b&gt;.&lt;/p&gt;

  &lt;h3&gt;Planned relocation &lt;span class=&quot;src&quot;&gt;slide 13 · IOM 2019; Georgetown, UNHCR, IOM 2017&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;div class=&quot;lab&quot;&gt;Definition&lt;/div&gt;In the context of disasters or environmental degradation (including when due to climate change), a &lt;q&gt;planned process in which persons or groups of persons move or are assisted to move away from their homes …, are settled in a new location, and provided with the conditions for rebuilding their lives.&lt;/q&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Planned relocation&lt;/span&gt; usually takes place &lt;b&gt;within national borders&lt;/b&gt;, under the &lt;b&gt;authority of the State&lt;/b&gt;, and is a &lt;b&gt;long&lt;/b&gt; process. Step through the phases:&lt;/p&gt;
  &lt;div class=&quot;steps&quot; data-steps&gt;
    &lt;div class=&quot;step box&quot;&gt;&lt;h4&gt;1 · Deciding&lt;/h4&gt;&lt;p&gt;The State assesses that staying is too risky (e.g. a coastal zone that will be submerged, a landslide-prone area). Relocation is a measure of last resort, because it uproots communities.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step box&quot;&gt;&lt;h4&gt;2 · Moving (or being assisted to move)&lt;/h4&gt;&lt;p&gt;People &lt;i&gt;“move or are assisted to move”&lt;/i&gt;: they leave their homes or places of temporary residence.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step box&quot;&gt;&lt;h4&gt;3 · Settling&lt;/h4&gt;&lt;p&gt;&lt;i&gt;“Settled in a new location”&lt;/i&gt;: land, housing and services at the new site.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step box&quot;&gt;&lt;h4&gt;4 · Rebuilding&lt;/h4&gt;&lt;p&gt;&lt;i&gt;“Provided with the conditions for rebuilding their lives”&lt;/i&gt;: jobs, schools, social networks — a roof alone is not enough.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step box&quot;&gt;&lt;h4&gt;5 · End of the process&lt;/h4&gt;&lt;p&gt;The process lasts until relocated people &lt;i&gt;“are incorporated into all aspects of life in the new setting and no longer have needs or vulnerabilities stemming from the Planned Relocation”&lt;/i&gt;. This is the exit criterion: not the move itself, but the absence of residual vulnerabilities.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn ghost&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Trapped populations &lt;span class=&quot;src&quot;&gt;slide 13 · IOM 2019&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;div class=&quot;lab&quot;&gt;Definition&lt;/div&gt;Populations &lt;q&gt;who do not migrate, yet are situated in areas under threat, […] at risk of becoming ‘trapped’ or having to stay behind, where they will be more vulnerable to environmental shocks and impoverishment.&lt;/q&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Trapped populations&lt;/span&gt; are the flip side of the migration debate: &lt;b&gt;moving is costly&lt;/b&gt; (money, information, networks, documents, health). The environmental crisis itself erodes these resources, so the poorest and most vulnerable — intersectionality again: older people, women with care responsibilities, persons with disabilities — risk &lt;b&gt;being unable to leave&lt;/b&gt;. The concept was popularised by the UK &lt;i&gt;Foresight&lt;/i&gt; report (2011) &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://assets.publishing.service.gov.uk/media/5a7cda5240f0b65b3de0b8e0/11-1115-migration-and-global-environmental-change-summary.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/span&gt;.&lt;/p&gt;

  &lt;h4&gt;Explore: resources and environmental pressure&lt;/h4&gt;
  &lt;p&gt;Simplified teaching model (not in the slides): move the sliders to see which mobility outcome is most likely.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;label class=&quot;rng&quot;&gt;Environmental pressure: &lt;output id=&quot;oPr&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rPr&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;70&quot;&gt;
    &lt;label class=&quot;rng&quot;&gt;Household resources (income, networks, information): &lt;output id=&quot;oRe&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rRe&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;20&quot;&gt;
    &lt;svg id=&quot;mob&quot; viewBox=&quot;0 0 600 300&quot; role=&quot;img&quot; aria-label=&quot;Environmental pressure versus resources plane with four outcomes&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;outcome&quot; id=&quot;mobOut&quot;&gt;&lt;/p&gt;&lt;p id=&quot;mobTxt&quot; class=&quot;muted&quot; style=&quot;font-size:.92rem&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Self-check · Part 6&lt;/h4&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;1. When is a planned relocation process considered complete?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;When people are integrated into all aspects of life in the new location and no longer have needs or vulnerabilities stemming from the relocation.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;2. Why may the poorest be “trapped” rather than migrate?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Because migrating requires resources (money, networks, information, health) that environmental stress itself depletes; those who lack them remain in threatened areas, increasingly exposed to shocks and impoverishment.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;3. The slide is titled “Relocation (or not?)”. What dilemma does it express?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Relocation protects against hazards but uproots communities and requires long-term planning; not relocating may leave populations trapped in dangerous areas. Both choices have costs.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7 ============ --&gt;
&lt;section class=&quot;part ardesia&quot; id=&quot;s7&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Part 7&lt;/div&gt;
  &lt;h2&gt;Climate migrants: what to do?&lt;/h2&gt;
  &lt;p&gt;The lecture closes with a video by &lt;i&gt;The Economist&lt;/i&gt;, &lt;b&gt;“Climate migrants: what to do?”&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;slide 14&lt;/span&gt;: &lt;a href=&quot;https://www.youtube.com/watch?v=A3AuCQml7IQ&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=A3AuCQml7IQ&lt;/a&gt;. The video’s content is not summarised in the slides; below are guiding questions for watching it in connection with the lecture.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;Using the correct terms, who are the people shown?&lt;/summary&gt;&lt;div&gt;Try to classify them: climate migration (chosen), disaster displacement (forced), trapped populations (those who stay). Note whether the video uses “refugees” and whether that usage is accurate.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Where do they go? Within or outside the country?&lt;/summary&gt;&lt;div&gt;Remember that environmental mobility is predominantly internal (often towards cities), contrary to the media image of international “waves”.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Is migration a problem or a solution?&lt;/summary&gt;&lt;div&gt;A widely held argument in the literature (e.g. Foresight 2011, Nansen Protection Agenda) is that migration can be a form of &lt;span class=&quot;term&quot;&gt;adaptation&lt;/span&gt; to climate change: it diversifies incomes, reduces exposure and sends remittances to those who stay. The problem arises when it is forced, irregular or impossible. &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://disasterdisplacement.org/wp-content/uploads/2023/09/FINAL_PROTECTION_AGENDA_c.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;What policies are possible?&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;b&gt;Reduce the drivers&lt;/b&gt;: disaster prevention, early warning, adaptation in places of origin (GCM, Objective 2) &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://www.preventionweb.net/quick/55169&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/span&gt;;&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Protect those who move&lt;/b&gt;, including across borders, through humanitarian measures (Nansen Protection Agenda);&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Plan relocations&lt;/b&gt; when staying is untenable (planned relocation);&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Support those who cannot leave&lt;/b&gt; (trapped populations), including by opening regular migration pathways.&lt;/li&gt;
    &lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Migration &amp;amp; development: the common thread&lt;/h3&gt;
  &lt;svg viewBox=&quot;0 0 700 220&quot; role=&quot;img&quot; aria-label=&quot;Cycle linking environment, development and migration&quot;&gt;
    &lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10z&quot; fill=&quot;var(--ardesia)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
    &lt;g stroke=&quot;var(--ardesia)&quot; stroke-width=&quot;1.6&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar2)&quot;&gt;
      &lt;path d=&quot;M200 70 C280 30 400 30 480 70&quot;/&gt;&lt;path d=&quot;M540 140 C470 200 300 200 190 150&quot;/&gt;&lt;path d=&quot;M110 150 C80 130 80 100 110 85&quot;/&gt;
    &lt;/g&gt;
    &lt;g font-size=&quot;14&quot; font-weight=&quot;600&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;rect x=&quot;40&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--salvia-bg)&quot; stroke=&quot;var(--salvia)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;100&quot;&gt;Low development&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;120&quot; font-size=&quot;12&quot; font-weight=&quot;400&quot;&gt;+ exposure to hazards&lt;/text&gt;
      &lt;rect x=&quot;490&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--mattone-bg)&quot; stroke=&quot;var(--mattone)&quot;/&gt;&lt;text x=&quot;575&quot; y=&quot;100&quot;&gt;Environmental shock&lt;/text&gt;&lt;text x=&quot;575&quot; y=&quot;120&quot; font-size=&quot;12&quot; font-weight=&quot;400&quot;&gt;disaster / slow-onset&lt;/text&gt;
    &lt;/g&gt;
    &lt;g font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot; text-anchor=&quot;middle&quot;&gt;
      &lt;text x=&quot;340&quot; y=&quot;30&quot;&gt;vulnerability: disasters hit harder&lt;/text&gt;
      &lt;text x=&quot;360&quot; y=&quot;212&quot;&gt;mobility: displacement, migration, or trapped&lt;/text&gt;
      &lt;text x=&quot;40&quot; y=&quot;190&quot; text-anchor=&quot;start&quot;&gt;mobility can reduce or increase&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;205&quot; text-anchor=&quot;start&quot;&gt;vulnerability (adaptation vs impoverishment)&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;p class=&quot;muted&quot; style=&quot;font-size:.88rem&quot;&gt;Summary diagram drawn up for this summary on the basis of the topics in the slides.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Final self-check&lt;/h4&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;1. In two lines: why is this lecture titled “Migration &amp;amp; Development”?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;Because migration cuts across all the SDGs, and because less developed countries are the most exposed to disasters and environmental change: mobility is a consequence of this (displacement), a possible adaptation strategy, or absent altogether (trapped).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;qa&quot;&gt;&lt;p&gt;2. A newspaper headline reads: “Millions of climate refugees heading for Europe”. What errors does it contain, according to the lecture?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot;&gt;“Climate refugees” is a misleading term (no legal basis; mobility is not necessarily forced); environmental mobility is mainly internal and not directed towards Europe; it also confuses flows and stocks.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ FONTI ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;fonti&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Further reading&lt;/div&gt;
  &lt;h2&gt;Authors, reports and websites cited in the slides&lt;/h2&gt;
  &lt;p&gt;For each reference in the slides: what it is and why it matters. All descriptions are &lt;span class=&quot;src ext&quot; style=&quot;margin:0&quot;&gt;external source&lt;/span&gt; material found via web search (November 2026): always check against the original page.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IOM (2019), &lt;i&gt;Glossary on Migration&lt;/i&gt;, International Migration Law No. 34&lt;/h4&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:0&quot;&gt;Cited in slides 7, 8, 13&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Third edition (June 2019, edited by A. Sironi, C. Bauloz and M. Emmanuel) of the IOM glossary, first published in 2004 and updated in 2011; about 250 pages. Among other things, it introduces “climate migration” and “disaster displacement” and clarifies that “migrant” is an umbrella term not defined in international law. &lt;b&gt;Why it matters:&lt;/b&gt; it is the source of almost all the definitions in the lecture and the common reference for a shared vocabulary. &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://publications.iom.int/system/files/pdf/iml_34_glossary.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IOM PDF&lt;/a&gt;&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://iran.un.org/en/node/87697&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN page&lt;/a&gt;&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IOM (2011, 2014) — glossary and &lt;i&gt;IOM Outlook on Migration, Environment and Climate Change&lt;/i&gt;&lt;/h4&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:0&quot;&gt;Cited in slide 10 (“IOM, 2011:34 in IOM, 2014:13”)&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;The 2014 report takes stock of migration, environment and climate, notes that there is no agreed legal definition of “environmental migrants”, and warns against assuming that environmental mobility is always forced. It is the source of the definition of “environmentally displaced person” (taken from the 2011 IOM glossary). &lt;b&gt;Why it matters:&lt;/b&gt; it shows how the IOM built its “working” categories without creating new legal statuses. &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://www.un-ilibrary.org/environment-and-climate-change/iom-outlook-on-migration-environment-and-climate-change_14b2ac9d-en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN iLibrary&lt;/a&gt;&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;UN DESA (2020), &lt;i&gt;International Migrant Stock&lt;/i&gt; / &lt;i&gt;International Migration 2020 Highlights&lt;/i&gt;&lt;/h4&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:0&quot;&gt;Cited in slide 5&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;UN estimates of the international migrant stock: 281 million in 2020 (280,598,105 according to the portal), compared with 173 million in 2000 and 221 million in 2010; about 3.6% of the world population. COVID-19 slowed growth by about 2 million. &lt;b&gt;Why it matters:&lt;/b&gt; it is the official source of the “general figures” and of the breakdown by sex and age. &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://namibia.un.org/sites/default/files/2021-01/International_Migration_2020_Highlights_Ten_key_messages.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Highlights 2020 (PDF)&lt;/a&gt;&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://migrationdataportal.org/themes/international-migrant-stock&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;topic page on the portal&lt;/a&gt;&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Migration Data Portal (IOM GMDAC)&lt;/h4&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:0&quot;&gt;Slides 4, 6, 11, 12&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Portal launched in December 2017 and run by the IOM’s Global Migration Data Analysis Centre; it aggregates data from UN DESA, UNICEF, IDMC, etc. Its page on environmental migration stresses that quantifying it is difficult (multiple causes, methodological problems, lack of standards) and that for slow-onset phenomena the evidence comes mainly from case studies. &lt;b&gt;Why it matters:&lt;/b&gt; it is the tool for exploring the lecture’s indicators yourself (net migration rate, refugees, IDPs). &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://www.migrationdataportal.org/about&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;About&lt;/a&gt;&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://migrationdataportal.org/themes/environmental_migration&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Environmental migration&lt;/a&gt;&lt;/span&gt; · links from the slides: &lt;a href=&quot;https://www.migrationdataportal.org/international-data?i=netmigrate&amp;amp;t=2021&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;net migration rate&lt;/a&gt;, &lt;a href=&quot;https://www.migrationdataportal.org/international-data?i=refug_host&amp;amp;t=2022&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;refugees in host country&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IDMC (2023), &lt;i&gt;Global Report on Internal Displacement&lt;/i&gt; (GRID 2023)&lt;/h4&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:0&quot;&gt;Slides 11, 12&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Annual report of the Internal Displacement Monitoring Centre, published in May 2023: 32.6 million new internal displacements due to disasters in 2022 (about 41% above the average of the previous decade), driven by the third year of La Niña; a stock of about 8.7 million people still displaced by disasters at the end of 2022. It notes that displacement from slow-onset events remains largely uncounted. &lt;b&gt;Why it matters:&lt;/b&gt; it is the primary source of data on disaster displacement. &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://www.internal-displacement.org/global-report/grid2023/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDMC GRID 2023&lt;/a&gt;&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://www.weforum.org/agenda/2023/06/internally-displaced-people-conflict-disasters&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WEF summary&lt;/a&gt;&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;The Nansen Initiative (2015), &lt;i&gt;Agenda for the Protection of Cross-Border Displaced Persons in the Context of Disasters and Climate Change&lt;/i&gt;&lt;/h4&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:0&quot;&gt;Slide 10 (“The Nansen Protection Agenda, 2015”)&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;An initiative launched by Norway and Switzerland in 2012; the non-binding Protection Agenda was endorsed by 109 government delegations in Geneva in October 2015. It compiles effective practices on humanitarian protection for cross-border displaced persons, disaster risk management in countries of origin, and migration as adaptation. Since 2016 it has been taken forward by the Platform on Disaster Displacement. &lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the definition of disaster displacement and the main framework for people who cross borders because of disasters. &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://disasterdisplacement.org/wp-content/uploads/2023/09/FINAL_PROTECTION_AGENDA_c.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Protection Agenda (PDF)&lt;/a&gt;&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Georgetown University, UNHCR, IOM (2017), &lt;i&gt;A Toolbox: Planning Relocations to Protect People from Disasters and Environmental Change&lt;/i&gt;&lt;/h4&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:0&quot;&gt;Slide 13&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;A practical guide (July 2017) for States and other actors considering relocation; it complements the 2015 &lt;i&gt;Guidance&lt;/i&gt; and identifies five cross-cutting elements: legal framework, needs of and impacts on people, information and consultation, land issues, and monitoring and accountability. &lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the definition of planned relocation and of the “end of process” criterion. &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://www.refworld.org/node/118118&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Refworld&lt;/a&gt;&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;UNHCR — &lt;i&gt;Climate change and disaster displacement&lt;/i&gt;; 1951 Geneva Convention&lt;/h4&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:0&quot;&gt;Slide 9 (UNHCR cited as an agency)&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;UNHCR does not use “climate refugee” and prefers “persons displaced in the context of disasters and climate change”, because the term has no basis in international law; it does, however, recognise that asylum claims may be valid where climate and conflict intersect (Legal Considerations, 2020). The 1951 Convention (with its 1967 Protocol) contains the universal definition of a refugee in Art. 1(A)(2). &lt;b&gt;Why it matters:&lt;/b&gt; it explains the third reason on slide 9. &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://www.unhcr.org/en-ie/climate-change-and-disasters.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNHCR on climate&lt;/a&gt;&lt;/span&gt; &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://www.unhcr.org/about-unhcr/overview/1951-refugee-convention&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1951 Convention&lt;/a&gt;&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Global Compact for Safe, Orderly and Regular Migration (GCM, 2018)&lt;/h4&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:0&quot;&gt;Slide 4 (“SDGs and GCM”)&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Adopted in December 2018 (A/RES/73/195). Objective 2, “Minimize the adverse drivers and structural factors that compel people to leave their country of origin”, includes disasters and climate change (early warning, evacuation plans) and refers to the Nansen Protection Agenda. &lt;b&gt;Why it matters:&lt;/b&gt; it is the global policy framework within which the portal places its data. &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://www.preventionweb.net/quick/55169&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PreventionWeb&lt;/a&gt;&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;UK Government Office for Science, Foresight (2011), &lt;i&gt;Migration and Global Environmental Change&lt;/i&gt;&lt;/h4&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:0&quot;&gt;Not cited in the slides: added because it is the origin of the concept of trapped populations&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;A report led by Richard Black: it argues that environmental change can prevent migration, not only compel it, because migrating requires capital; and that migration can be part of the solution as a form of adaptation. &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://assets.publishing.service.gov.uk/media/5a7cda5240f0b65b3de0b8e0/11-1115-migration-and-global-environmental-change-summary.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Summary (gov.uk PDF)&lt;/a&gt;&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;The Economist, video “Climate migrants: what to do?”&lt;/h4&gt;&lt;p class=&quot;muted&quot; style=&quot;margin:0&quot;&gt;Slide 14&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;Link provided in the slides: &lt;a href=&quot;https://www.youtube.com/watch?v=A3AuCQml7IQ&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;YouTube&lt;/a&gt;. The web search did not return a description of a video with this title, so its content is not summarised here; related themes appear in The Economist’s briefing &lt;i&gt;“The surprising upside of climate migration”&lt;/i&gt; (July 2023) &lt;span class=&quot;src ext&quot;&gt;&lt;a href=&quot;https://shows.acast.com/theintelligencepodcast/episodes/hot-to-trot-the-up-sides-of-climate-migration&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;related podcast&lt;/a&gt;&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;/main&gt;

&lt;script&gt;
(function(){

  // self-check
  $$(&#x27;.qa&#x27;).forEach(function(q){var b=$(&#x27;button&#x27;,q);if(b)b.addEventListener(&#x27;click&#x27;,function(){

  // multiple choice
  $$(&#x27;[data-choice]&#x27;).forEach(function(c){
    var fb=c.parentNode.querySelector(&#x27;.fb&#x27;);

    function show(){st.forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j===i)});$$(&#x27;i&#x27;,dots).forEach(function(x,j){x.classList.toggle(&#x27;on&#x27;,j===i)});prev.disabled=i===0;next.disabled=i===st.length-1}
    prev.addEventListener(&#x27;click&#x27;,function(){if(i&gt;0){i--;show()}});

    w.appendChild(el(&#x27;text&#x27;,{x:10,y:160,&#x27;font-size&#x27;:12,fill:&#x27;var(--ink2)&#x27;},&#x27;Each square ≈ 1% of the 280.6 million stock ≈ 2.8 million people&#x27;));

      $(&#x27;#nmrTxt&#x27;).textContent=n&gt;0.05?&#x27;Positive balance: for every 1,000 inhabitants the country gains about &#x27;+n.toFixed(1)+&#x27; people through migration (net immigration country).&#x27;:n&lt;-0.05?&#x27;Negative balance: for every 1,000 inhabitants the country loses about &#x27;+Math.abs(n).toFixed(1)+&#x27; people (net emigration country).&#x27;:&#x27;Near-zero balance: inflows and outflows offset each other, but gross movements may be large.&#x27;;
      while(bar.firstChild)bar.removeChild(bar.firstChild);
      var cap=Math.max(-50,Math.min(50,n)),cx=300,wd=cap/50*280;
      bar.appendChild(el(&#x27;line&#x27;,{x1:20,x2:580,y1:30,y2:30,stroke:&#x27;var(--rule)&#x27;,&#x27;stroke-width&#x27;:2}));

      bar.appendChild(el(&#x27;rect&#x27;,{x:wd&lt;0?cx+wd:cx,y:20,width:Math.abs(wd),height:20,rx:4,fill:n&lt;0?&#x27;var(--mattone)&#x27;:&#x27;var(--salvia)&#x27;}));
      bar.appendChild(el(&#x27;text&#x27;,{x:20,y:64,&#x27;font-size&#x27;:11,fill:&#x27;var(--ink2)&#x27;},&#x27;−50 ‰  net emigration&#x27;));
      bar.appendChild(el(&#x27;text&#x27;,{x:580,y:64,&#x27;font-size&#x27;:11,&#x27;text-anchor&#x27;:&#x27;end&#x27;,fill:&#x27;var(--ink2)&#x27;},&#x27;net immigration  +50 ‰&#x27;));
    }

  }

  // disaster chart
  var dc=$(&#x27;#disChart&#x27;);
  if(dc){
    var yrs=[2013,2014,2015,2016,2017,2018,2019,2020,2021,2022],vals=[22.1,19.1,19.2,24.4,18.6,17.5,25.3,31,23.7,32.6];
    var avg=vals.reduce(function(a,b){return a+b},0)/vals.length;
    var rY=$(&#x27;#rY&#x27;),cAvg=$(&#x27;#cAvg&#x27;),X0=50,Y0=250,H=220,MAX=40,bw=40,gap=57;
    var Y=function(v){return Y0-v/MAX*H};

      while(dc.firstChild)dc.removeChild(dc.firstChild);
      var s=+rY.value;
      [0,10,20,30,40].forEach(function(t){dc.appendChild(el(&#x27;line&#x27;,{x1:X0,x2:625,y1:Y(t),y2:Y(t),stroke:&#x27;var(--rule)&#x27;}));dc.appendChild(el(&#x27;text&#x27;,{x:X0-8,y:Y(t)+4,&#x27;font-size&#x27;:11,&#x27;text-anchor&#x27;:&#x27;end&#x27;,fill:&#x27;var(--ink2)&#x27;},t))});
      dc.appendChild(el(&#x27;text&#x27;,{x:X0-8,y:14,&#x27;font-size&#x27;:11,&#x27;text-anchor&#x27;:&#x27;end&#x27;,fill:&#x27;var(--ink2)&#x27;},&#x27;m&#x27;));
      yrs.forEach(function(y,i){
        var x=X0+12+i*gap,on=i===s;
        var r=el(&#x27;rect&#x27;,{x:x,y:Y(vals[i]),width:bw,height:Y0-Y(vals[i]),rx:3,fill:on?&#x27;var(--accent)&#x27;:&#x27;var(--ocra)&#x27;,&#x27;fill-opacity&#x27;:on?1:.55,style:&#x27;cursor:pointer&#x27;});
        r.addEventListener(&#x27;click&#x27;,function(){rY.value=i;draw()});

        dc.appendChild(el(&#x27;text&#x27;,{x:x+bw/2,y:Y0+18,&#x27;font-size&#x27;:11,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,fill:&#x27;var(--ink2)&#x27;},y));

    var txt=[&#x27;Pressure is limited: people stay by choice (voluntary immobility). Adaptation takes place in situ.&#x27;,
