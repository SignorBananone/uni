&lt;h2&gt;The starting point&lt;/h2&gt;
&lt;p class=&quot;big&quot;&gt;The previous lecture defined &lt;em&gt;gender equality&lt;/em&gt; and presented its measures. This one adds the missing piece: the values of a society, and the international rules that seek to change it.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Last time &lt;span class=&quot;src&quot;&gt;slide p. 2&lt;/span&gt;&lt;/h4&gt;&lt;ul style=&quot;margin:0&quot;&gt;&lt;li&gt;Definition of gender equality&lt;/li&gt;&lt;li&gt;Measures from statistical offices&lt;/li&gt;&lt;li&gt;Measures from population surveys&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Today &lt;span class=&quot;src&quot;&gt;slide p. 3&lt;/span&gt;&lt;/h4&gt;&lt;ul style=&quot;margin:0&quot;&gt;&lt;li&gt;Information from population surveys&lt;/li&gt;&lt;li&gt;International platforms&lt;/li&gt;&lt;li&gt;SDG5&lt;/li&gt;&lt;li&gt;Intersectionality: poverty, migration background&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;&lt;dfn class=&quot;t&quot;&gt;Gender equality&lt;/dfn&gt; means, in brief, equal rights, responsibilities and opportunities for women and men, regardless of sex at birth. It does not mean that all people must make the same choices, but that gender must not limit those choices. The full definition is in the previous lecture, which I could not consult here.&lt;/p&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;strong&gt;Other course files.&lt;/strong&gt; In this session I had no tool for listing the &lt;code&gt;corso/&lt;/code&gt; folder: I tried a few plausible file names and found none. Everything therefore comes from this PDF or from the web, and no connection is drawn from other course materials.&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p-sage&quot; id=&quot;s1&quot;&gt;
&lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;
&lt;h2&gt;The Gender Equality Index&lt;/h2&gt;
&lt;p class=&quot;big&quot;&gt;A single number from 0 to 100 summarizes six areas of life. Italy is close to the EU average overall, but last in the Work domain.&lt;/p&gt;

&lt;h3&gt;What it is&lt;/h3&gt;
&lt;p&gt;The &lt;dfn class=&quot;t&quot;&gt;Gender Equality Index&lt;/dfn&gt; (a composite index of gender equality) is produced by &lt;dfn class=&quot;t&quot;&gt;EIGE&lt;/dfn&gt;, the European Institute for Gender Equality. A composite index combines many indicators into a single score: here, 100 means full equality &lt;span class=&quot;src&quot;&gt;slide p. 5&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;outs&quot;&gt;
&lt;div class=&quot;out&quot;&gt;&lt;b&gt;63.4&lt;/b&gt;EU, Index 2025 &lt;span class=&quot;src&quot;&gt;p. 4&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;out&quot;&gt;&lt;b&gt;61.9&lt;/b&gt;Italy, Index 2025 &lt;span class=&quot;src&quot;&gt;p. 4&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;out&quot;&gt;&lt;b&gt;+3.5 / +3.9&lt;/b&gt;change over 5 years, EU / Italy &lt;span class=&quot;src&quot;&gt;p. 4&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Italy ranks 12th in the EU, and since 2020 its gain has come mainly from the Power domain &lt;a class=&quot;ext&quot; href=&quot;https://eige.europa.eu/modules/custom/eige_gei/app/content/downloads/factsheets/IT_2025_factsheet.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;. Be careful with historical comparisons: the methodology changed in 2025, and scores from earlier editions are no longer comparable. EIGE recalculated 2020 so that change could be measured &lt;a class=&quot;ext&quot; href=&quot;https://eige.europa.eu/about/projects/gender-equality-index-2025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;

&lt;figure&gt;
&lt;div class=&quot;seg&quot; id=&quot;rankbtn&quot; role=&quot;group&quot; aria-label=&quot;Ranking to display&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;chips&quot; id=&quot;rankchips&quot;&gt;&lt;/div&gt;
&lt;figcaption id=&quot;rankcap&quot;&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;How it is calculated, and why the geometric mean matters&lt;/h3&gt;
&lt;p&gt;Indicators are aggregated into sub-domains, and these into the six domains. The 2025 version has 27 indicators and 13 sub-domains &lt;a class=&quot;ext&quot; href=&quot;https://www.idescat.cat/novetats/?id=5730&amp;amp;lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;. At the final level, the domains are combined using a weighted geometric mean, with weights set by experts &lt;a class=&quot;ext&quot; href=&quot;https://arxiv.org/pdf/2509.17140&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Index = D&lt;sub&gt;1&lt;/sub&gt;&lt;sup&gt;w₁&lt;/sup&gt; × D&lt;sub&gt;2&lt;/sub&gt;&lt;sup&gt;w₂&lt;/sup&gt; × … × D&lt;sub&gt;6&lt;/sub&gt;&lt;sup&gt;w₆&lt;/sup&gt; &amp;nbsp; with &amp;nbsp; w₁ + … + w₆ = 1&lt;/div&gt;
&lt;p&gt;The geometric mean is stricter than the arithmetic mean: a very low domain cannot be fully offset by a very high one. Try it below, starting from the Italian values &lt;span class=&quot;src&quot;&gt;slide p. 5&lt;/span&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;div id=&quot;geisl&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;outs&quot;&gt;
&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;geiA&quot;&gt;–&lt;/b&gt;arithmetic mean&lt;/div&gt;
&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;geiG&quot;&gt;–&lt;/b&gt;geometric mean&lt;/div&gt;
&lt;div class=&quot;out&quot;&gt;&lt;b&gt;61.9&lt;/b&gt;official Index, Italy&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;seg&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;geireset&quot; type=&quot;button&quot;&gt;Italy 2025 values&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;geipow&quot; type=&quot;button&quot;&gt;Power +20&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;geihea&quot; type=&quot;button&quot;&gt;Health +13.1 (to 100)&lt;/button&gt;&lt;/div&gt;
&lt;figcaption&gt;Lab with &lt;strong&gt;equal weights&lt;/strong&gt;, so this is not the official formula: the actual weights are not reported here. The geometric value nevertheless comes very close to 61.9. &lt;span class=&quot;calc&quot;&gt;calculation&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;The six domains, one by one&lt;/summary&gt;&lt;div&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Work (61.0)&lt;/strong&gt;: participation in work and quality of employment.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Money (67.0)&lt;/strong&gt;: economic resources, income and poverty risk.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Knowledge (56.8)&lt;/strong&gt;: education and its segregation by field of study.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Time (59.4)&lt;/strong&gt;: time for care, domestic work and social activities.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Power (47.9)&lt;/strong&gt;: presence in political, economic and social decision-making. This is the lowest value.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Health (86.9)&lt;/strong&gt;: health status, behavior and access to care. This is the highest value.&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;The scores come from &lt;span class=&quot;src&quot;&gt;slide p. 5&lt;/span&gt;. The descriptions are didactic summaries: the exact details are in the EIGE methodological report.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Work versus Time&lt;/h3&gt;
&lt;p&gt;The slide compares two series &lt;span class=&quot;src&quot;&gt;slide p. 6&lt;/span&gt;: paid work and time, which includes unpaid care work. They are two sides of the same problem: whoever takes on more care work has less time and less scope for paid work.&lt;/p&gt;
&lt;figure&gt;
&lt;div class=&quot;seg&quot; id=&quot;wtbtn&quot; role=&quot;group&quot; aria-label=&quot;Domain&quot;&gt;&lt;/div&gt;
&lt;div id=&quot;wtchart&quot;&gt;&lt;/div&gt;
&lt;figcaption id=&quot;wtcap&quot;&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;strong&gt;A flat line does not prove stagnation.&lt;/strong&gt; Italy stays at 59.4 in all four years. This may also depend on the data: the Time domain uses the 2024 EIGE CARE survey &lt;a class=&quot;ext&quot; href=&quot;https://eige.europa.eu/modules/custom/eige_gei/app/content/downloads/factsheets/IT_2025_factsheet.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;. This is my own tentative interpretation, to be verified in the methodological report.&lt;/div&gt;

&lt;h3&gt;Inside the Work domain&lt;/h3&gt;
&lt;p&gt;Italy 61, EU 69.3 &lt;span class=&quot;src&quot;&gt;slide p. 7&lt;/span&gt;. The slide lists the indicators of the sub-index:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Participation&lt;/h4&gt;&lt;ul style=&quot;margin:0&quot;&gt;&lt;li&gt;&lt;dfn class=&quot;t&quot;&gt;FTE employment rate&lt;/dfn&gt; (%): full-time equivalent employment rate. Two half-time part-time workers count as one full-time job, so part-time work does not inflate the figure.&lt;/li&gt;&lt;li&gt;Length of working life (years): expected duration of working life.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Segregation&lt;/h4&gt;&lt;ul style=&quot;margin:0&quot;&gt;&lt;li&gt;People employed in education, health and social work (%).&lt;/li&gt;&lt;li&gt;Ability to take an hour or two off during working hours for personal or family reasons (%).&lt;/li&gt;&lt;li&gt;Index of career prospects (points, 0-100).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why can Italy be just below the EU average overall and yet last in Work?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because the index aggregates six domains: high values, such as Health at 86.9, support the total. A composite index summarizes, but it can conceal a specific weakness. This is why the domains must also be examined.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What happens to the geometric mean if one domain falls sharply?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It falls more than the arithmetic mean, other values being equal. In practice it penalizes imbalances: excelling in one area is not enough to offset a serious lag in another.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Can we say that Italy went from 69.2 to 61.9 between the 2024 and 2025 editions?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. The 69.2 of the 2024 edition &lt;a class=&quot;ext&quot; href=&quot;https://unipd-centrodirittiumani.it/en/news/eige-how-italy-fared-in-the-gender-equality-index-for-2024&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt; uses the old methodology, so the two figures are not comparable. The correct comparison uses the recalculated series: +3.9 over five years.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In the Work chart, what is the Italy-EU gap in 2010 and in 2025?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In 2010 it is 67.2 − 62.4 = 4.8 points. In 2025 it is 69.3 − 61 = 8.3 points. The gap has widened, and Italy is below its own 2010 value.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p-ochre&quot; id=&quot;s2&quot;&gt;
&lt;div class=&quot;num&quot;&gt;2&lt;/div&gt;
&lt;h2&gt;Gender inequalities in the labor market&lt;/h2&gt;
&lt;p class=&quot;big&quot;&gt;Discriminatory laws explain less and less. In most societies, what matters most are invisible barriers, which produce three measurable effects.&lt;/p&gt;

&lt;h3&gt;The barriers: from visible to invisible&lt;/h3&gt;
&lt;p&gt;According to &lt;span class=&quot;src&quot;&gt;slide p. 8&lt;/span&gt;, inequalities today rest mainly on cultural barriers, invisible because no written rule declares them:&lt;/p&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Types of barrier&quot;&gt;
&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Gender role expectations&lt;/button&gt;
&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Social norms&lt;/button&gt;
&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Legal laws&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;dfn class=&quot;t&quot;&gt;Gender role expectations&lt;/dfn&gt; are expectations about what women and men “should” do. Example: taking it for granted that the mother will be the one to request part-time work after a birth.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;dfn class=&quot;t&quot;&gt;Social norms&lt;/dfn&gt; are unwritten rules, sustained by &lt;em&gt;conformity&lt;/em&gt; (people adapt to what others do and expect) and &lt;em&gt;social control&lt;/em&gt; (those who deviate face judgment or informal sanctions). Example: comments about a father who takes parental leave.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;In some societies, differential treatment is still legitimized by law: inheritance shares, freedom of movement, driving, travel. In this case the barrier is visible. This connects to the topic of reservations to CEDAW (&lt;a href=&quot;#cedaw&quot;&gt;part 4&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The three effects&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide p. 9&lt;/span&gt; identifies horizontal segregation, vertical segregation and the gender pay gap. The diagram shows the difference.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;chart&quot; viewBox=&quot;0 0 480 300&quot; role=&quot;img&quot; aria-label=&quot;Diagram: horizontal segregation separates women and men across sectors; vertical segregation holds women below the glass ceiling or on the sticky floor; together they contribute to the gender pay gap.&quot;&gt;
&lt;g font-size=&quot;13&quot;&gt;
&lt;rect x=&quot;20&quot; y=&quot;30&quot; width=&quot;130&quot; height=&quot;222&quot; rx=&quot;6&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--rule)&quot;/&gt;
&lt;rect x=&quot;165&quot; y=&quot;30&quot; width=&quot;130&quot; height=&quot;222&quot; rx=&quot;6&quot; style=&quot;fill:var(--slate-bg);stroke:var(--rule)&quot;/&gt;
&lt;text x=&quot;85&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;Education, care&lt;/text&gt;&lt;text x=&quot;230&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;Manufacturing&lt;/text&gt;
&lt;path d=&quot;M12 84H304&quot; style=&quot;stroke:var(--accent);stroke-width:3;stroke-dasharray:7 5&quot;/&gt;
&lt;text x=&quot;310&quot; y=&quot;80&quot; font-weight=&quot;600&quot;&gt;Glass ceiling&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;97&quot;&gt;invisible upper limit&lt;/text&gt;
&lt;path d=&quot;M12 226H304&quot; style=&quot;stroke:var(--ochre);stroke-width:5&quot;/&gt;
&lt;text x=&quot;310&quot; y=&quot;222&quot; font-weight=&quot;600&quot;&gt;Sticky floor&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;239&quot;&gt;stuck at the bottom&lt;/text&gt;
&lt;g style=&quot;fill:var(--accent)&quot;&gt;&lt;circle cx=&quot;50&quot; cy=&quot;240&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;70&quot; cy=&quot;240&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;90&quot; cy=&quot;240&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;110&quot; cy=&quot;240&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;60&quot; cy=&quot;205&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;85&quot; cy=&quot;205&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;110&quot; cy=&quot;205&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;72&quot; cy=&quot;155&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;100&quot; cy=&quot;155&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;85&quot; cy=&quot;105&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;205&quot; cy=&quot;205&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;240&quot; cy=&quot;155&quot; r=&quot;6&quot;/&gt;&lt;/g&gt;
&lt;g style=&quot;fill:var(--slate)&quot;&gt;&lt;rect x=&quot;57&quot; y=&quot;52&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;102&quot; y=&quot;52&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;190&quot; y=&quot;52&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;225&quot; y=&quot;52&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;258&quot; y=&quot;52&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;190&quot; y=&quot;100&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;225&quot; y=&quot;100&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;258&quot; y=&quot;100&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;190&quot; y=&quot;150&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;258&quot; y=&quot;150&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;225&quot; y=&quot;199&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;258&quot; y=&quot;199&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;160&quot; y=&quot;278&quot; text-anchor=&quot;middle&quot;&gt;← horizontal: across sectors →&lt;/text&gt;
&lt;path d=&quot;M455 110V205&quot; marker-start=&quot;url(#ar)&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke:var(--muted);stroke-width:1.5;fill:none&quot;/&gt;
&lt;text x=&quot;402&quot; y=&quot;162&quot;&gt;vertical&lt;/text&gt;
&lt;circle cx=&quot;340&quot; cy=&quot;278&quot; r=&quot;6&quot; style=&quot;fill:var(--accent)&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;283&quot;&gt;women&lt;/text&gt;&lt;rect x=&quot;402&quot; y=&quot;272&quot; width=&quot;12&quot; height=&quot;12&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;418&quot; y=&quot;283&quot;&gt;men&lt;/text&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Illustrative diagram: the symbols do not correspond to data.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Horizontal segregation&lt;/h3&gt;
&lt;p&gt;&lt;dfn class=&quot;t&quot;&gt;Horizontal segregation&lt;/dfn&gt; is the concentration of women and men in different sectors and occupations. In 2020, in the EU, women made up &lt;strong&gt;93%&lt;/strong&gt; of education and care professionals, &lt;strong&gt;86%&lt;/strong&gt; of health care workers and &lt;strong&gt;95%&lt;/strong&gt; of cleaners and helpers &lt;span class=&quot;src&quot;&gt;slide p. 10&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;The Italian table on the same slide must be read differently: “12.7%” is not the share of women in education, but the share of employed women who work in education. The denominator changes. Switch from one view to the other.&lt;/p&gt;
&lt;figure&gt;
&lt;div class=&quot;seg&quot; id=&quot;secbtn&quot; role=&quot;group&quot; aria-label=&quot;View&quot;&gt;&lt;/div&gt;
&lt;div id=&quot;secchart&quot;&gt;&lt;/div&gt;
&lt;figcaption id=&quot;seccap&quot;&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;How I derived the share of women from the table&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;The total figure is a mean of the two groups, weighted by the share of women &lt;em&gt;w&lt;/em&gt; among the employed:&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;total = w · women + (1 − w) · men &amp;nbsp;⇒&amp;nbsp; w = (total − men) / (women − men)&lt;/div&gt;
&lt;p&gt;For education: (7.2 − 3.1) / (12.7 − 3.1) ≈ 0.43. Manufacturing and services give about 0.42. With w ≈ 0.42, the share of women in education is 0.42 × 12.7 / 7.2 ≈ 74%. The percentages are estimates from rounded data. &lt;span class=&quot;calc&quot;&gt;calculation&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Vertical segregation&lt;/h3&gt;
&lt;p&gt;&lt;dfn class=&quot;t&quot;&gt;Vertical segregation&lt;/dfn&gt; is the declining presence of women at higher levels of the hierarchy. The slide illustrates it with two images &lt;span class=&quot;src&quot;&gt;slide p. 11&lt;/span&gt;, which have the following meaning:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;dfn class=&quot;t&quot;&gt;Glass ceiling&lt;/dfn&gt;: top positions are visible, but undeclared obstacles prevent access to them.&lt;/li&gt;
&lt;li&gt;&lt;dfn class=&quot;t&quot;&gt;Sticky floor&lt;/dfn&gt;: many women remain stuck on the lower rungs, with modest pay and few opportunities to advance. The problem therefore also lies at the bottom, not only at the top.&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;The data come from the World Economic Forum&#x27;s &lt;em&gt;Global Gender Gap Report 2021&lt;/em&gt;. The key indicator is the &lt;strong&gt;f/m&lt;/strong&gt; ratio: 1.00 is parity, and lower values indicate that women lag behind. The slide presents it as &lt;dfn class=&quot;t&quot;&gt;distance to parity&lt;/dfn&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;weft&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Indicator&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;F&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;M&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;f/m&lt;/th&gt;&lt;th style=&quot;min-width:80px&quot;&gt;towards 1.00&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;figcaption&gt;&lt;span class=&quot;src&quot;&gt;slide p. 11&lt;/span&gt; The slide does not say which country this refers to. The rank of 114 for economic participation matches the one reported for Italy in this &lt;a class=&quot;ext&quot; href=&quot;https://apiwp.thelocal.com/?p=257167&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;, so it is probably Italy: check against the report.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Points to note in this table&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;The core of vertical segregation:&lt;/strong&gt; among professional and technical workers the ratio is 0.91; among legislators, senior officials and managers it collapses to 0.39.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Rank and score say different things:&lt;/strong&gt; political empowerment has rank 41 but a score of 0.313, while economic participation has rank 114 and a score of 0.609. Politics does better in the global comparison, yet is further from parity: the world average is only 0.218.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;figure&gt;
&lt;div class=&quot;slid&quot;&gt;&lt;label for=&quot;par&quot;&gt;Share of women&lt;/label&gt;&lt;input id=&quot;par&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;50&quot; value=&quot;28&quot;&gt;&lt;output id=&quot;parv&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;outs&quot;&gt;&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;parr&quot;&gt;–&lt;/b&gt;f/m ratio&lt;/div&gt;&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;pard&quot;&gt;–&lt;/b&gt;distance from 1.00&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;The ratio falls faster than the percentage suggests: with 28% women, f/m is already around 0.39. &lt;span class=&quot;calc&quot;&gt;calculation&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Gender Pay Gap&lt;/h3&gt;
&lt;p&gt;The &lt;dfn class=&quot;t&quot;&gt;gender pay gap (GPG)&lt;/dfn&gt; is the difference between the mean hourly wages of men and women, expressed as a percentage of the mean male wage &lt;span class=&quot;src&quot;&gt;slide p. 12&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;GPG = (mean hourly wage M − mean hourly wage F) / mean hourly wage M × 100&lt;/div&gt;
&lt;p&gt;The slide gives &lt;strong&gt;5% in Italy and 15% in the EU&lt;/strong&gt;. On an annual basis the Italian gap rises to as much as &lt;strong&gt;12%&lt;/strong&gt;, because women work fewer hours &lt;span class=&quot;src&quot;&gt;slide p. 12&lt;/span&gt;. The calculator shows this.&lt;/p&gt;
&lt;figure&gt;
&lt;div class=&quot;slid&quot;&gt;&lt;label for=&quot;gm&quot;&gt;Hourly wage M&lt;/label&gt;&lt;input id=&quot;gm&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;40&quot; step=&quot;.5&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;gmv&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;slid&quot;&gt;&lt;label for=&quot;gf&quot;&gt;Hourly wage F&lt;/label&gt;&lt;input id=&quot;gf&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;40&quot; step=&quot;.1&quot; value=&quot;19&quot;&gt;&lt;output id=&quot;gfv&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;slid&quot;&gt;&lt;label for=&quot;hm&quot;&gt;Hours/week M&lt;/label&gt;&lt;input id=&quot;hm&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;48&quot; step=&quot;.5&quot; value=&quot;38&quot;&gt;&lt;output id=&quot;hmv&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;slid&quot;&gt;&lt;label for=&quot;hf&quot;&gt;Hours/week F&lt;/label&gt;&lt;input id=&quot;hf&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;48&quot; step=&quot;.5&quot; value=&quot;35&quot;&gt;&lt;output id=&quot;hfv&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;outs&quot;&gt;&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;gh&quot;&gt;–&lt;/b&gt;hourly GPG&lt;/div&gt;&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;ga&quot;&gt;–&lt;/b&gt;annual GPG&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;Hypothetical values, chosen to give about 5% hourly and about 12% annually. &lt;span class=&quot;calc&quot;&gt;calculation&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;Why a low GPG does not necessarily mean greater parity&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;The GPG is calculated only on those who are in work. If relatively few women work, and especially those with more education, the observed mean female wage is higher than it would be if all women were in work. This is called the &lt;dfn class=&quot;t&quot;&gt;selection effect&lt;/dfn&gt;.&lt;/p&gt;
&lt;p&gt;Olivetti and Petrongolo (2008) find that correcting for selection explains almost half of the negative correlation between the wage gap and the employment gap, with sizeable effects in Southern European countries &lt;a class=&quot;ext&quot; href=&quot;https://econpapers.repec.org/RePEc:ucp:jlabec:v:26:y:2008:i:4:p:621-654&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;. The source consulted gives no specific figure for Italy.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;More recent data and Italian law&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;The slide&#x27;s 15% EU figure is not the latest: for 2023 Eurostat reports about 12.0% in the EU, considering enterprises with at least 10 employees &lt;a class=&quot;ext&quot; href=&quot;https://ec.europa.eu/eurostat/statistics-explained/index.php/Gender_pay_gap_statistics&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;. Check there for the updated Italian figure as well, which I did not find.&lt;/p&gt;
&lt;p&gt;The slide mentions a new law from autumn 2021 without naming it. This should be &lt;strong&gt;Law 162/2021&lt;/strong&gt;, which amends the Italian Equal Opportunities Code and creates gender equality certification for companies &lt;a class=&quot;ext&quot; href=&quot;https://ntplusdiritto.ilsole24ore.com/art/in-gazzetta-legge-parita-salariale-uomo-donna-AEKzGAy&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Women are 93% of education professionals, but only 12.7% of employed women work in education. Is this a contradiction?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. The first percentage describes who makes up an occupation. The second describes where women work. They have different denominators, and they also cover different areas: the first the EU, the second Italy.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Glass ceiling and sticky floor: how do they differ?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The glass ceiling blocks access to the top. The sticky floor holds women at the bottom, in low-paid jobs with little mobility. The first mainly concerns women who have already moved up, the second those who cannot move up.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Hourly GPG 5%: what happens to the annual gap if women work fewer hours?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It increases. The ratio of annual wages is (hourly F/M) × (hours F/hours M). With 0.95 × 35/38 ≈ 0.875, the annual gap is about 12.5%.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;How is the score for the “women in parliament” indicator calculated from 35.7 and 64.3?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;35.7 / 64.3 ≈ 0.555, which is the score in the table.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;s3&quot;&gt;
&lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;
&lt;h2&gt;Beyond statistics: values surveys&lt;/h2&gt;
&lt;p class=&quot;big&quot;&gt;Indices measure the structure of a society. Surveys bring out the culture that sustains or changes it, and the two dimensions influence each other.&lt;/p&gt;

&lt;h3&gt;Structural aspects and cultural orientations&lt;/h3&gt;
&lt;p&gt;Progress is often monitored with indices based on objective statistics concerning &lt;dfn class=&quot;t&quot;&gt;structural aspects&lt;/dfn&gt; (laws, employment, income). &lt;dfn class=&quot;t&quot;&gt;Cultural orientations&lt;/dfn&gt; (the prevailing set of values, norms and beliefs), by contrast, are often neglected, even though they stand in an interactive relationship with structural contexts and shape individual beliefs and behaviors &lt;span class=&quot;src&quot;&gt;slide p. 14&lt;/span&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;chart&quot; viewBox=&quot;0 0 480 210&quot; role=&quot;img&quot; aria-label=&quot;Cycle: structural contexts influence cultural orientations and vice versa; indices measure the former, values surveys the latter.&quot;&gt;
&lt;rect x=&quot;14&quot; y=&quot;52&quot; width=&quot;176&quot; height=&quot;96&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage);stroke-width:1.5&quot;/&gt;
&lt;rect x=&quot;290&quot; y=&quot;52&quot; width=&quot;176&quot; height=&quot;96&quot; rx=&quot;10&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate);stroke-width:1.5&quot;/&gt;
&lt;g text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;
&lt;text class=&quot;serif&quot; x=&quot;102&quot; y=&quot;88&quot; font-size=&quot;19&quot;&gt;Structure&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;110&quot;&gt;laws, work, income,&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;128&quot;&gt;care services&lt;/text&gt;
&lt;text class=&quot;serif&quot; x=&quot;378&quot; y=&quot;88&quot; font-size=&quot;19&quot;&gt;Culture&lt;/text&gt;&lt;text x=&quot;378&quot; y=&quot;110&quot;&gt;values, norms,&lt;/text&gt;&lt;text x=&quot;378&quot; y=&quot;128&quot;&gt;beliefs&lt;/text&gt;
&lt;text x=&quot;240&quot; y=&quot;44&quot;&gt;policies shape&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;60&quot;&gt;expectations&lt;/text&gt;
&lt;text x=&quot;240&quot; y=&quot;162&quot;&gt;values enable&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;178&quot;&gt;(or hinder) reforms&lt;/text&gt;
&lt;text x=&quot;102&quot; y=&quot;34&quot; style=&quot;fill:var(--sage)&quot; font-weight=&quot;600&quot;&gt;measured with indices&lt;/text&gt;
&lt;text x=&quot;378&quot; y=&quot;34&quot; style=&quot;fill:var(--slate)&quot; font-weight=&quot;600&quot;&gt;measured with surveys&lt;/text&gt;
&lt;/g&gt;
&lt;path d=&quot;M194 76Q240 62 286 76&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke:var(--muted);stroke-width:1.7;fill:none&quot;/&gt;
&lt;path d=&quot;M286 124Q240 138 194 124&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke:var(--muted);stroke-width:1.7;fill:none&quot;/&gt;
&lt;/svg&gt;
&lt;figcaption&gt;The examples inside the boxes and on the arrows are didactic. The interactive relationship is on slide p. 14.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;Examples of &lt;dfn class=&quot;t&quot;&gt;population representative surveys&lt;/dfn&gt; mentioned on the slide: &lt;strong&gt;Eurobarometer&lt;/strong&gt;, &lt;strong&gt;International Social Survey Programme (ISSP)&lt;/strong&gt;, &lt;strong&gt;European Values Study (EVS)&lt;/strong&gt; and &lt;strong&gt;World Values Survey (WVS)&lt;/strong&gt; &lt;span class=&quot;src&quot;&gt;slide p. 14&lt;/span&gt;.&lt;/p&gt;

&lt;h3&gt;Two levels of analysis&lt;/h3&gt;
&lt;p&gt;The same questionnaire provides information on two levels &lt;span class=&quot;src&quot;&gt;slide p. 15&lt;/span&gt;:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Individual level&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Individual gender equality values&lt;/em&gt; motivate the pursuit of equality in everyday life. They are the most relevant explanatory factor for the unequal distribution of paid and unpaid work (Davis &amp;amp; Greenstein, 2009).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Aggregate level&lt;/h4&gt;&lt;p&gt;Aggregated responses make it possible to study &lt;dfn class=&quot;t&quot;&gt;gender cultures&lt;/dfn&gt; (the ideas about gender and roles shared within a society) and to complement macro-indicators (Lomazzi &amp;amp; Crespi, 2019; Pfau-Effinger, 1998).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The instruments in EVS/WVS&lt;/h3&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Instruments&quot;&gt;
&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Principle&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Gender role attitudes&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Moral norms&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Principle of gender equality&lt;/strong&gt; &lt;span class=&quot;src&quot;&gt;slide p. 16&lt;/span&gt;. Three items observe the principle in different contexts:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Democracy:&lt;/strong&gt; the extent to which “women have the same rights as men” is an essential characteristic of democracy.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Work:&lt;/strong&gt; “When jobs are scarce, men have more right to a job than women”.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Couple:&lt;/strong&gt; “share the household chores” among the important elements of a successful marriage or relationship.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Gender role attitudes (GRA)&lt;/strong&gt; &lt;span class=&quot;src&quot;&gt;slide p. 16&lt;/span&gt;: beliefs about which social roles are appropriate for men and women, especially in the division of paid labor, childcare and housework, based on a gendered separation of tasks (Davis &amp;amp; Greenstein, 2009; Grunow et al., 2018; Lee et al., 2010).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Moral norms&lt;/strong&gt; &lt;span class=&quot;src&quot;&gt;slide p. 16&lt;/span&gt;: here the focus is on the justification of domestic violence against women.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;How GRA are measured&lt;/h3&gt;
&lt;p&gt;The items use a 4-point scale (1 agree strongly, 2 agree, 3 disagree, 4 strongly disagree). Since they all express a traditional position, the score is reverse-coded: higher values indicate greater traditionalism &lt;span class=&quot;src&quot;&gt;slide p. 17&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;reversed score = 5 − response &amp;nbsp;&amp;nbsp;(1→4, 2→3, 3→2, 4→1)&lt;/div&gt;
&lt;p&gt;The lab below uses a &lt;strong&gt;fictitious respondent&lt;/strong&gt;: it does not ask for your opinion and does not save anything.&lt;/p&gt;
&lt;figure&gt;
&lt;div class=&quot;seg&quot; id=&quot;grapre&quot; role=&quot;group&quot; aria-label=&quot;Fictitious profiles&quot;&gt;&lt;/div&gt;
&lt;div id=&quot;graitems&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;outs&quot;&gt;&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;graD&quot;&gt;–&lt;/b&gt;GRA domestic&lt;/div&gt;&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;graP&quot;&gt;–&lt;/b&gt;GRA public (mean)&lt;/div&gt;&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;graL&quot;&gt;–&lt;/b&gt;labor market&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;Scale from 1 (egalitarian) to 4 (traditional) after reverse-coding. The grouping of items is the one on slide p. 17. &lt;span class=&quot;calc&quot;&gt;calculation&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;The “mixed” profile illustrates a point debated in the literature: Grunow, Begall and Buchler (2018) argue that a single scale from traditional to egalitarian is problematic, and with EVS 2008 data they find five profiles, including &lt;em&gt;egalitarian essentialism&lt;/em&gt; and &lt;em&gt;intensive parenting&lt;/em&gt; &lt;a class=&quot;ext&quot; href=&quot;https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5817238/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;

&lt;h3&gt;The justification of violence against women&lt;/h3&gt;
&lt;p&gt;&lt;dfn class=&quot;t&quot;&gt;Moral norms&lt;/dfn&gt; are standards used to evaluate personal behavior and therefore guide conduct; they rest on the ideas of fairness and justice (De Waal and de Waal, 1996) &lt;span class=&quot;src&quot;&gt;slide p. 18&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;The WVS question asks whether “a man beating his wife” can always be justified, never, or something in between, on a scale from &lt;strong&gt;1 (never justifiable)&lt;/strong&gt; to &lt;strong&gt;10 (always justifiable)&lt;/strong&gt; &lt;span class=&quot;src&quot;&gt;slide p. 18&lt;/span&gt;. VAW stands for &lt;em&gt;violence against women&lt;/em&gt;.&lt;/p&gt;
&lt;p&gt;The cross-country comparison comes from the study by Lomazzi (2023), which analyzes individual and institutional norms in 12 countries &lt;a class=&quot;ext&quot; href=&quot;https://www.mdpi.com/2076-0760/12/3/117&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;. On the &lt;dfn class=&quot;t&quot;&gt;SIGI&lt;/dfn&gt; scale (Social Institutions and Gender Index, OECD), 100 means maximum discrimination &lt;span class=&quot;src&quot;&gt;slide p. 19&lt;/span&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;div class=&quot;seg&quot; id=&quot;scbtn&quot; role=&quot;group&quot; aria-label=&quot;Variable on the horizontal axis&quot;&gt;&lt;/div&gt;
&lt;div id=&quot;scchart&quot;&gt;&lt;/div&gt;
&lt;figcaption id=&quot;sccap&quot;&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;details open&gt;&lt;summary&gt;The table of 12 countries (tap a header to sort)&lt;/summary&gt;&lt;div&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;vt&quot;&gt;&lt;thead&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p style=&quot;font-size:.85rem;color:var(--muted);margin-top:.6rem&quot;&gt;&lt;span class=&quot;src&quot;&gt;slide p. 19&lt;/span&gt; Istanbul Convention: s = signature, r = ratification, e = entry into force, w = withdrawal. “Gap” is %F − %M: a positive value indicates that women reject violence more than men do. “IPV” is lifetime physical and/or sexual intimate partner violence (%).&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;How to read these data correctly&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;The gap is positive in all 12 countries: condemnation is more widespread among women.&lt;/li&gt;
&lt;li&gt;Strong condemnation does not imply little reported violence: Germany has 95.7% and IPV of 22%.&lt;/li&gt;
&lt;li&gt;Reported violence also depends on the willingness to recognize and report it, and 11 countries with data are not enough for causal conclusions.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why are structural indices not enough?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because they do not capture the values that guide behavior. A law can exist without being socially accepted, and cultural norms can hinder or support structural change.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;A respondent chooses 2 (agree) on “Men make better political leaders”. What score do they get, and what does it mean?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;5 − 2 = 3. This is above the scale midpoint of 2.5: it indicates a broadly traditional orientation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between the individual level and the aggregate level?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The first explains people&#x27;s behavior, for example the division of care work. The second describes the gender culture of a society and complements macro-indicators.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why does the item “When jobs are scarce” appear in a separate block?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because it concerns a principle of equal rights in the labor market, as well as roles. Slide p. 17 keeps it distinct from the domestic and public domains.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p-brick&quot; id=&quot;s4&quot;&gt;
&lt;div class=&quot;num&quot;&gt;4&lt;/div&gt;
&lt;h2&gt;International platforms&lt;/h2&gt;
&lt;p class=&quot;big&quot;&gt;Gender equality is a global goal, built over decades of treaties and strategies. A text, however, only has effects if states genuinely accept it and apply it.&lt;/p&gt;

&lt;h3&gt;How far there is to go, at the current pace&lt;/h3&gt;
&lt;div class=&quot;yrs&quot; aria-label=&quot;Estimated years to reach each goal&quot;&gt;
&lt;div class=&quot;yr&quot;&gt;&lt;span&gt;Ending child marriage&lt;/span&gt;&lt;b&gt;300&lt;/b&gt;&lt;div class=&quot;bar&quot; style=&quot;width:100%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;yr&quot;&gt;&lt;span&gt;Closing gaps in legal protection and removing discriminatory laws&lt;/span&gt;&lt;b&gt;286&lt;/b&gt;&lt;div class=&quot;bar&quot; style=&quot;width:95.3%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;yr&quot;&gt;&lt;span&gt;Equal representation in positions of power and leadership at work&lt;/span&gt;&lt;b&gt;140&lt;/b&gt;&lt;div class=&quot;bar&quot; style=&quot;width:46.7%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;yr&quot;&gt;&lt;span&gt;Equal representation in national parliaments&lt;/span&gt;&lt;b&gt;47&lt;/b&gt;&lt;div class=&quot;bar&quot; style=&quot;width:15.7%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Estimated years &lt;span class=&quot;src&quot;&gt;slide p. 20&lt;/span&gt;. The slide does not give a source: 286 and 140 years appear in news coverage of the &lt;em&gt;Gender Snapshot 2022&lt;/em&gt; &lt;a class=&quot;ext&quot; href=&quot;https://www.downtoearth.org.in/news/it-will-take-3-centuries-to-close-gender-gap-completely-warns-un-84782&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;. I found no confirmation of the 47 years in the sources consulted.&lt;/p&gt;
&lt;p&gt;Political leadership, investment and broad reforms against systemic barriers are needed. Goal 5 is a &lt;dfn class=&quot;t&quot;&gt;cross-cutting objective&lt;/dfn&gt;: it must be embedded in national policies, budgets and institutions &lt;span class=&quot;src&quot;&gt;slide p. 20&lt;/span&gt;.&lt;/p&gt;

&lt;h3&gt;A timeline&lt;/h3&gt;
&lt;figure&gt;&lt;div id=&quot;tl&quot;&gt;&lt;/div&gt;&lt;div class=&quot;box&quot; id=&quot;tlp&quot; style=&quot;margin-bottom:0&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;figcaption&gt;Equally spaced points, not to scale. Tap a year.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3 id=&quot;cedaw&quot;&gt;CEDAW&lt;/h3&gt;
&lt;p&gt;&lt;dfn class=&quot;t&quot;&gt;CEDAW&lt;/dfn&gt; (Convention on the Elimination of All Forms of Discrimination against Women) dates from 1979. It is the most important international treaty for gender equality legislation, and it covers family rights, inheritance and land ownership, work and education, political representation, freedom of movement and more &lt;span class=&quot;src&quot;&gt;slide p. 22&lt;/span&gt;. The official text is on the &lt;a class=&quot;ext&quot; href=&quot;https://www.un.org/womenwatch/daw/cedaw/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN website&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;The slide indicates 189 countries, some with &lt;dfn class=&quot;t&quot;&gt;reservations&lt;/dfn&gt;. A reservation is a statement by which a state accepts the treaty but excludes or limits certain clauses for itself. CEDAW prohibits those incompatible with the object and purpose of the treaty (Art. 28.2), while expressly allowing those concerning Art. 29.1, that is, arbitration of disputes &lt;a class=&quot;ext&quot; href=&quot;https://www.un.org/unispal/?p=205832&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Reservations by country&quot;&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Kuwait 1994&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Libya 1989&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Lebanon 1997&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Morocco 1993&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Art. 9(2):&lt;/strong&gt; equal rights regarding one&#x27;s own nationality and that of one&#x27;s children.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Art. 16(f):&lt;/strong&gt; equal rights in marriage and the family.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Art. 29(1):&lt;/strong&gt; arbitration in the event of a dispute.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Art. 2:&lt;/strong&gt; policy measures, that is, the commitment to embed gender equality in national law.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Art. 16:&lt;/strong&gt; equal rights in marriage and the family.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Art. 9(2):&lt;/strong&gt; one&#x27;s own nationality and that of one&#x27;s children.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Art. 16(1)(c)(d)(f)(g):&lt;/strong&gt; equal rights in marriage and the family.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Art. 29(1):&lt;/strong&gt; arbitration.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Art. 2:&lt;/strong&gt; policy measures.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Art. 15(4):&lt;/strong&gt; legal capacity and freedom of movement.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Art. 29:&lt;/strong&gt; arbitration.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;The reservations were formally withdrawn in 2011.&lt;/strong&gt; They can therefore change over time.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p style=&quot;font-size:.9rem;color:var(--muted)&quot;&gt;&lt;span class=&quot;src&quot;&gt;slide p. 23&lt;/span&gt; Extract from a chapter by V. Lomazzi on women&#x27;s rights and Shari&#x27;a in the MENA (Middle East and North Africa) region. Note that family and nationality recur: this is where cultural and religious norms weigh most heavily on the law.&lt;/p&gt;

&lt;h3&gt;Gender mainstreaming&lt;/h3&gt;
&lt;p&gt;&lt;dfn class=&quot;t&quot;&gt;Gender mainstreaming (GM)&lt;/dfn&gt; is a strategy: instead of treating gender in a separate policy, it is considered in all policies. It has been a global perspective since the 1995 UN conference, while the first world conference on the subject dates back to 1975 &lt;span class=&quot;src&quot;&gt;slide p. 24&lt;/span&gt;. The classic ECOSOC definition speaks of assessing the implications for women and men of any planned action, in all areas; it does not replace policies targeted at women &lt;a class=&quot;ext&quot; href=&quot;https://www.un.org/womenwatch/osagi/pdf/e65237.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;In the EU, GM has been the first transnational strategy since 1997 with the Treaty of Amsterdam. Gender equality is among the values of the Union and in the Charter of Fundamental Rights. It has developed through rules, recommendations and four-year action plans, it affects the legislation of member states (MS) and candidate countries, and it concerns internal policies and external cooperation &lt;span class=&quot;src&quot;&gt;slide p. 24&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;EIGE applies it to every phase of the policy cycle &lt;a class=&quot;ext&quot; href=&quot;https://eige.europa.eu/publications-resources/publications/what-gender-mainstreaming&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;. Go through the phases, following an invented example: a municipal call for funding for new businesses.&lt;/p&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Preparation&lt;/h4&gt;&lt;p&gt;Sex-disaggregated data are collected: who starts businesses in the city, in which sectors, and with what credit and care constraints.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Design&lt;/h4&gt;&lt;p&gt;The criteria of the call take the data into account. Scoring linked only to initial capital could disadvantage those with fewer resources.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Implementation&lt;/h4&gt;&lt;p&gt;Information also reaches the most female-dominated sectors, and deadlines are compatible with care responsibilities.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · Monitoring&lt;/h4&gt;&lt;p&gt;During the call, who applies and who obtains funds are tracked, with data disaggregated by sex.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;5 · Evaluation&lt;/h4&gt;&lt;p&gt;At the end, the effect on women and men is evaluated. The results inform the next call, and the cycle begins again.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Istanbul Convention&lt;/h3&gt;
&lt;p&gt;This is the Council of Europe human rights treaty on preventing and combating violence against women and domestic violence. It defines violence against women as a &lt;strong&gt;violation of human rights&lt;/strong&gt;. It is the first comprehensive, legally binding instrument to prevent violence, protect victims and end impunity &lt;span class=&quot;src&quot;&gt;slide p. 25&lt;/span&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;chart&quot; viewBox=&quot;0 0 480 110&quot; role=&quot;img&quot; aria-label=&quot;Sequence: signature, ratification, entry into force; only with the last two is participation fully active.&quot;&gt;
&lt;path d=&quot;M60 40H420&quot; style=&quot;stroke:var(--rule);stroke-width:4&quot;/&gt;&lt;path d=&quot;M240 40H420&quot; style=&quot;stroke:var(--brick);stroke-width:4&quot;/&gt;
&lt;g text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;&lt;circle cx=&quot;60&quot; cy=&quot;40&quot; r=&quot;15&quot; style=&quot;fill:var(--card);stroke:var(--brick);stroke-width:3&quot;/&gt;&lt;circle cx=&quot;240&quot; cy=&quot;40&quot; r=&quot;15&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick);stroke-width:3&quot;/&gt;&lt;circle cx=&quot;420&quot; cy=&quot;40&quot; r=&quot;15&quot; style=&quot;fill:var(--brick)&quot;/&gt;
&lt;text x=&quot;60&quot; y=&quot;76&quot; font-weight=&quot;600&quot;&gt;Signature&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;94&quot;&gt;political will&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;76&quot; font-weight=&quot;600&quot;&gt;Ratification&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;94&quot;&gt;consent to be bound&lt;/text&gt;&lt;text x=&quot;420&quot; y=&quot;76&quot; font-weight=&quot;600&quot;&gt;Entry into force&lt;/text&gt;&lt;text x=&quot;420&quot; y=&quot;94&quot;&gt;active participation&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;As slide p. 25 says, the same applies as for CEDAW: signing is not enough. Slovakia stopped at signature in 2011, while Germany reached entry into force in 2018 &lt;span class=&quot;src&quot;&gt;slide p. 19&lt;/span&gt;.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;Open for signature since 2011, it requires states to act on several fronts &lt;span class=&quot;src&quot;&gt;slide pp. 25-26&lt;/span&gt;: legislation and prosecution of perpetrators, protection of victims, shelters and services, helplines. Implementation is monitored by the independent expert group &lt;dfn class=&quot;t&quot;&gt;GREVIO&lt;/dfn&gt; &lt;a class=&quot;ext&quot; href=&quot;https://www.coe.int/web/istanbul-convention/grevio&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;. Türkiye left the treaty with effect from 1 July 2021 &lt;a class=&quot;ext&quot; href=&quot;https://www.coe.int/en/web/istanbul-convention/turkey&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;A concrete effect: 1522&lt;/h4&gt;&lt;p&gt;If Italy has a helpline active 24/7, it is mainly because of the implementation of the Convention &lt;span class=&quot;src&quot;&gt;slide p. 26&lt;/span&gt;. &lt;strong&gt;1522&lt;/strong&gt; is a public service promoted by the Presidency of the Council of Ministers, Department for Equal Opportunities: it is free, active 24 hours a day, and answered by specialized staff who support victims of violence and stalking &lt;span class=&quot;src&quot;&gt;slide p. 27&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;If you or someone you know needs it, you can call 1522 or use the chat at &lt;a href=&quot;https://www.1522.eu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1522.eu&lt;/a&gt; &lt;a class=&quot;ext&quot; href=&quot;https://www.ufficiostampa.provincia.tn.it/Rubrica-Contro-la-violenza-sulle-donne/A-chi-rivolgerti-se-hai-bisogno-di-aiuto/1522-Numero-antiviolenza-e-stalking&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between signing and ratifying?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Signature expresses political will. Ratification makes the state bound, and participation is fully active with entry into force. Armenia, Czechia and Slovakia, in the table, have only signed.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is a reservation to Art. 2 of CEDAW more serious than one to Art. 29?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Art. 2 concerns the commitment to transpose equality into national law, so it touches on the purpose of the treaty. Art. 29 concerns arbitration of disputes, and the Convention expressly allows a reservation on this point.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Are gender mainstreaming and policies for women mutually exclusive?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. GM integrates gender into all policies, but it does not replace targeted actions: the two approaches work side by side.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What makes the Istanbul Convention special compared with a declaration of principles?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It is legally binding on those who ratify it and requires concrete measures: legislation, protection, services and helplines. 1522 is an example of its national impact.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s5&quot;&gt;
&lt;div class=&quot;num&quot;&gt;5&lt;/div&gt;
&lt;h2&gt;SDG5: how are things going?&lt;/h2&gt;
&lt;p class=&quot;big&quot;&gt;“A girl born today will have to wait until her 97th birthday, beyond her own life expectancy, to celebrate an equal society.” &lt;span class=&quot;src&quot;&gt;slide p. 28&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;What SDG5 is&lt;/h3&gt;
&lt;p&gt;&lt;dfn class=&quot;t&quot;&gt;Sustainable Development Goal 5&lt;/dfn&gt; is the fifth of the 17 UN goals for 2030. It calls for achieving gender equality and the &lt;dfn class=&quot;t&quot;&gt;empowerment&lt;/dfn&gt; (gaining power and autonomy) of women and girls. It has nine targets &lt;a class=&quot;ext&quot; href=&quot;https://en.wikipedia.org/wiki/Sustainable_Development_Goal_5&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;. The slides do not list them, so they are paraphrased here.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;The nine SDG5 targets &lt;span class=&quot;ext&quot; style=&quot;cursor:default&quot;&gt;external source&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;5.1&lt;/strong&gt; End all discrimination against women and girls.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;5.2&lt;/strong&gt; Eliminate violence, in public and in private, including trafficking and exploitation.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;5.3&lt;/strong&gt; Eliminate harmful practices: child and forced marriage, genital mutilation.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;5.4&lt;/strong&gt; Recognize unpaid care and domestic work, with services and shared responsibility.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;5.5&lt;/strong&gt; Full participation and equal leadership opportunities in decision-making.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;5.6&lt;/strong&gt; Universal access to sexual and reproductive health and rights.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;5.a&lt;/strong&gt; Equal rights to economic resources, land and property.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;5.b&lt;/strong&gt; Use of technology, in particular ICT, for empowerment.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;5.c&lt;/strong&gt; Enforceable policies and laws for gender equality at all levels.&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Texts: &lt;a href=&quot;https://sdgdata.gov.uk/5&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SDG data UK&lt;/a&gt; and &lt;a href=&quot;https://turkiye.un.org/en/sdgs/5&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Türkiye&lt;/a&gt;. For the official wording, check the UN SDG website.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;The SDG Gender Index&lt;/h3&gt;
&lt;p&gt;The index, produced by the &lt;dfn class=&quot;t&quot;&gt;Equal Measures 2030&lt;/dfn&gt; partnership, gives each country a score from 0 to 100. The assessment in the slides &lt;span class=&quot;src&quot;&gt;slides pp. 29-30&lt;/span&gt;:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;The overall picture&lt;/h4&gt;&lt;ul style=&quot;margin:0&quot;&gt;&lt;li&gt;&lt;strong&gt;Little progress&lt;/strong&gt; globally between 2015 and 2020.&lt;/li&gt;&lt;li&gt;On these trends, the global score will only reach &lt;strong&gt;71/100 by 2030&lt;/strong&gt;.&lt;/li&gt;&lt;li&gt;This estimate may be optimistic, given the impact of COVID-19.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;The countries&lt;/h4&gt;&lt;ul style=&quot;margin:0&quot;&gt;&lt;li&gt;Fewer than a quarter are making &lt;em&gt;fast progress&lt;/em&gt;.&lt;/li&gt;&lt;li&gt;A third are stalled or moving in the wrong direction.&lt;/li&gt;&lt;li&gt;More than half are moving in the right direction.&lt;/li&gt;&lt;li&gt;In 2020, over 3 billion women and girls lived in countries with a &lt;em&gt;poor&lt;/em&gt; or &lt;em&gt;very poor&lt;/em&gt; score.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;The global score was 67.8 in 2020, and the report estimates parity only around 2108 &lt;a class=&quot;ext&quot; href=&quot;https://equalmeasures2030.org/publications/2022-sdg-gender-index-report/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;

&lt;h3&gt;Level and direction: the matrix&lt;/h3&gt;
&lt;p&gt;The matrix crosses where a country stands (columns) with where it is heading (rows). This shows that a high score does not guarantee progress, and vice versa. Tap a cell to see the countries &lt;span class=&quot;src&quot;&gt;slide p. 33&lt;/span&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;div class=&quot;matrix&quot; id=&quot;mx&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot; id=&quot;mxp&quot; aria-live=&quot;polite&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;outs&quot;&gt;&lt;div class=&quot;out&quot;&gt;&lt;b&gt;20.7%&lt;/b&gt;fast progress (28/135)&lt;/div&gt;&lt;div class=&quot;out&quot;&gt;&lt;b&gt;32.6%&lt;/b&gt;no progress or decline (44/135)&lt;/div&gt;&lt;div class=&quot;out&quot;&gt;&lt;b&gt;67.4%&lt;/b&gt;fast or some progress (91/135)&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;The percentages match the statements on slide p. 30. &lt;span class=&quot;calc&quot;&gt;calculation&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;The map and the extreme cases&lt;/h3&gt;
&lt;p&gt;The map on &lt;span class=&quot;src&quot;&gt;slide p. 31&lt;/span&gt; shows the 2020 score. In summary: Nordic countries &lt;em&gt;very good&lt;/em&gt; or &lt;em&gt;good&lt;/em&gt;, most of Western Europe and Australia &lt;em&gt;good&lt;/em&gt;; Russia, China, India and Brazil &lt;em&gt;poor&lt;/em&gt;; much of Sub-Saharan Africa and some countries in Southern and Western Asia &lt;em&gt;very poor&lt;/em&gt;.&lt;/p&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Greatest improvement&lt;/th&gt;&lt;th&gt;No change&lt;/th&gt;&lt;th&gt;Greatest decline&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Benin +9.3 (53.7)&lt;/td&gt;&lt;td&gt;Sweden +0.1 (90.3)&lt;/td&gt;&lt;td&gt;Afghanistan −1.9 (38.2)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Saudi Arabia +8.6 (64.4)&lt;/td&gt;&lt;td&gt;Colombia −0.1 (66.8)&lt;/td&gt;&lt;td&gt;Algeria −1.3 (64.3)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Nepal +6.7 (64.2)&lt;/td&gt;&lt;td&gt;Bolivia +0.1 (63.2)&lt;/td&gt;&lt;td&gt;Belarus −1.3 (72.3)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Armenia +6.7 (74.3)&lt;/td&gt;&lt;td&gt;Iceland +0.1 (89)&lt;/td&gt;&lt;td&gt;Kuwait −1.3 (64.9)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Egypt +5.8 (62.4)&lt;/td&gt;&lt;td&gt;Lebanon +0.1 (58.2)&lt;/td&gt;&lt;td&gt;Ecuador −1.1 (68.7)&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p style=&quot;font-size:.9rem;color:var(--muted);margin-top:.5rem&quot;&gt;&lt;span class=&quot;src&quot;&gt;slide p. 32&lt;/span&gt; Change and, in parentheses, score. For Lebanon the slide reads “0.1”.&lt;/p&gt;
&lt;p&gt;Those who improve most often start from low levels, and those who do not change can be at the top (Sweden) or at the bottom (Lebanon). This is why both dimensions are needed.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;What the 2024 edition actually says &lt;span class=&quot;ext&quot; style=&quot;cursor:default&quot;&gt;external source&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;The 2024 edition, &lt;em&gt;A gender equal future in crisis?&lt;/em&gt;, covers 139 countries with reference years 2015, 2019 and 2022. On current trends, parity would not arrive before the 22nd century. Between 2019 and 2022, 40% of countries stalled or regressed. The top country is Switzerland (90.1), the last is Afghanistan (35.4). Source: &lt;a href=&quot;https://ruralindiaonline.org/en/library/resource/findings-from-the-2024-sdg-gender-index/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PARI summary&lt;/a&gt;; the original is on the &lt;a href=&quot;https://equalmeasures2030.org/2024-sdg-gender-index/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EM2030 website&lt;/a&gt;, which I did not open.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Can a country be “good” and not progress?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Yes. Germany and the Netherlands, for example, are &lt;em&gt;good&lt;/em&gt; with &lt;em&gt;no progress&lt;/em&gt;. Level and dynamics are two distinct things.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Where does Italy stand in the matrix?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;em&gt;Fair&lt;/em&gt; for level and &lt;em&gt;some progress&lt;/em&gt; for direction.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Does Saudi Arabia&#x27;s +8.6 make this country a model of parity?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. The score remains 64.4, hence &lt;em&gt;poor&lt;/em&gt;. A large change can arise from a low starting point.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is SDG5 called cross-cutting?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because it is not a sector of its own: it concerns all national policies, budgets and institutions. It echoes the logic of gender mainstreaming.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;s6&quot;&gt;
&lt;div class=&quot;num&quot;&gt;6&lt;/div&gt;
&lt;h2&gt;Intersectionality&lt;/h2&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;strong&gt;On the agenda only.&lt;/strong&gt; Slide p. 3 announces intersectionality, poverty and migration background, but the PDF ends at p. 33 without developing them. This entire part is therefore a supplement from external sources and does not reflect what was said in the lecture: look for the specific material or your own notes.&lt;/div&gt;
&lt;p&gt;The term &lt;dfn class=&quot;t&quot;&gt;intersectionality&lt;/dfn&gt; appears in a 1989 article by Kimberlé Crenshaw, on the case of Black women whom the courts would not allow to bring a combined claim of race and sex discrimination &lt;a class=&quot;ext&quot; href=&quot;https://www.britannica.com/story/what-is-intersectionality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;. The definition attributed to EIGE describes it as a tool for analyzing how sex and gender intertwine with other personal characteristics, producing specific experiences of discrimination &lt;a class=&quot;ext&quot; href=&quot;https://www.unescwa.org/sd-glossary/intersectionality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;The underlying idea: disadvantages do not always simply add up. Their intersection can create a situation that a separate analysis of each axis does not see. The 2025 Index also treats intersecting inequalities as a cross-cutting lens &lt;a class=&quot;ext&quot; href=&quot;https://eige.europa.eu/about/projects/gender-equality-index-2025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;div class=&quot;seg&quot; id=&quot;vnbtn&quot; role=&quot;group&quot; aria-label=&quot;Combination&quot;&gt;&lt;/div&gt;
&lt;svg class=&quot;chart&quot; viewBox=&quot;0 0 480 290&quot; role=&quot;img&quot; aria-label=&quot;Three overlapping circles: gender, poverty and migration background.&quot;&gt;
&lt;g style=&quot;stroke:var(--ink);stroke-width:1.4&quot;&gt;
&lt;circle id=&quot;vg&quot; cx=&quot;185&quot; cy=&quot;115&quot; r=&quot;92&quot; style=&quot;fill:var(--accent)&quot;/&gt;
&lt;circle id=&quot;vp&quot; cx=&quot;295&quot; cy=&quot;115&quot; r=&quot;92&quot; style=&quot;fill:var(--ochre)&quot;/&gt;
&lt;circle id=&quot;vm&quot; cx=&quot;240&quot; cy=&quot;190&quot; r=&quot;92&quot; style=&quot;fill:var(--slate)&quot;/&gt;
&lt;/g&gt;
&lt;g text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; style=&quot;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round&quot;&gt;&lt;text x=&quot;135&quot; y=&quot;88&quot;&gt;Gender&lt;/text&gt;&lt;text x=&quot;345&quot; y=&quot;88&quot;&gt;Poverty&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;258&quot;&gt;Migration&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;276&quot;&gt;background&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;box&quot; id=&quot;vnp&quot; aria-live=&quot;polite&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Didactic examples, not data.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why can an average for “women” be misleading?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because it brings together very different situations. An average can improve while the condition of a subgroup worsens, for example poor women with a migration background.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What does intersectionality add to an analysis that controls separately for gender and income?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It asks whether the effect of gender changes according to income, and vice versa. In statistics this often translates into interaction terms or subgroup analysis.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s7&quot;&gt;
&lt;h2&gt;Slide checks&lt;/h2&gt;
&lt;p&gt;I have reported the data as they appear on the slides. These points deserve checking in class or against the original material.&lt;/p&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Where&lt;/th&gt;&lt;th&gt;What I noticed&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;p. 3&lt;/td&gt;&lt;td&gt;Intersectionality, poverty and migration background are on the agenda, but without dedicated slides.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 7&lt;/td&gt;&lt;td&gt;The link leads to &lt;code&gt;/FI/work&lt;/code&gt;, hence to Finland, while the chart highlights Italy.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 4 and p. 13&lt;/td&gt;&lt;td&gt;The European Index slide is repeated identically.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 11&lt;/td&gt;&lt;td&gt;The WEF table does not indicate the country. It is probably Italy, but I found no confirmation of the complete row.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 12&lt;/td&gt;&lt;td&gt;The 15% EU figure seems dated: Eurostat reports about 12.0% for 2023.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 16&lt;/td&gt;&lt;td&gt;“Lee et al., 2010” was not found. There is a related work by Lee, Alwin and Tufiș from 2007: this may be a different work or a typo.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 18&lt;/td&gt;&lt;td&gt;“De Waal and de Waal, 1996”: I found &lt;em&gt;Good Natured&lt;/em&gt; from 1996, by Frans de Waal alone. I could not verify the exact reference.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 20&lt;/td&gt;&lt;td&gt;The estimates in years have no source. I found no confirmation of the 47 years; a popular source on the Gender Snapshot 2022 mentions at least 40. The 300 years for child marriage also remain to be verified.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 22&lt;/td&gt;&lt;td&gt;“Signed by 189”: for consistency with p. 25, the difference between signature and ratification matters. A source linked to UN Women mentions 189 ratifications as of 2013. The official name is &lt;em&gt;on the Elimination of All Forms of&lt;/em&gt;.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 26&lt;/td&gt;&lt;td&gt;“Legislation (persecution)” is most likely &lt;em&gt;prosecution&lt;/em&gt;, that is, criminal proceedings. I have used this meaning here.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 28&lt;/td&gt;&lt;td&gt;The 97-year figure has no source, and the web search did not trace it.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 30&lt;/td&gt;&lt;td&gt;The title is “Report 2024”, with the cover of that edition, but the text matches the 2022 edition (2015-2020, over 3 billion). The link on p. 32 also leads to the 2022 report, and the 2024 edition uses different years and a different sample.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 33&lt;/td&gt;&lt;td&gt;The matrix adds up to 135 countries, whereas the 2022 index covers 144. The sources I consulted do not explain the difference.&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part refs&quot; id=&quot;s8&quot;&gt;
&lt;h2&gt;Further reading&lt;/h2&gt;
&lt;p&gt;Authors, texts and websites cited in the slides, with the additions needed to understand them. Each entry is an &lt;span class=&quot;ext&quot; style=&quot;cursor:default&quot;&gt;external source&lt;/span&gt;, distinct from the slide content. “Cited on p. N” indicates where it appears in the PDF. The descriptions are based on abstracts, publisher pages and search results: the full texts were not read.&lt;/p&gt;

&lt;h3&gt;Studies and books&lt;/h3&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.annualreviews.org/doi/10.1146/annurev-soc-070308-115920&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Davis &amp;amp; Greenstein (2009), Gender Ideology: Components, Predictors, and Consequences&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Annual Review of Sociology&lt;/em&gt; 35:87-105. Review of how gender ideology is measured, what predicts it and what effects it has on family and work. Cited on pp. 15-16.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the basis for saying that individual values explain the division of paid and unpaid work.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://bristoluniversitypress.co.uk/gender-mainstreaming-and-gender-equality-in-europe&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Lomazzi &amp;amp; Crespi (2019), Gender Mainstreaming and Gender Equality in Europe&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Policy Press. Origins and limits of GM, cross-country comparison with survey data, measurement and European gender cultures. Cited on p. 15.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is co-authored by Vera Lomazzi, who teaches this module, and it links parts 3 and 4 of the lecture.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://data.gesis.org/gesiskg/resource/bibsonomy-pfaueffingerbirgit1998gender&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pfau-Effinger (1998), Gender Cultures and Gender Arrangement&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Innovation: The European Journal of Social Science Research&lt;/em&gt; 11:147-166. Theoretical framework for comparative gender research. Cited on p. 15.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explains why comparing countries requires looking at culture and institutions together. I found only the bibliographic record.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5817238/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Grunow, Begall &amp;amp; Buchler (2018), Gender Ideologies in Europe&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Journal of Marriage and Family&lt;/em&gt; 80(1):42-60, open access. Latent class analysis of EVS 2008 in eight countries, with five ideological profiles. Cited on p. 16.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it shows the limits of a single scale from traditional to egalitarian.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://pure.psu.edu/en/publications/beliefs-about-womens-labour-in-the-reunified-germany-19912004/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Lee, Alwin &amp;amp; Tufiș (2007), Beliefs about women&#x27;s labour in the reunified Germany&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;European Sociological Review&lt;/em&gt; 23(4). Changes in beliefs about women&#x27;s work in Germany, 1991-2004. Slide p. 16 cites “Lee et al., 2010”, which I did not find: this is only a related work, not the work cited.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it shows how political context shapes values, and it helps clarify the citation.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://carta.anthropogeny.org/node/1571&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;de Waal (1996), Good Natured&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Harvard University Press. Evolutionary origins of right and wrong, with observations of primates. Probable reference for p. 18, which cites “De Waal and de Waal, 1996”.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it argues that fairness and justice lie at the basis of morality.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.mdpi.com/2076-0760/12/3/117&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Lomazzi (2023), The Cultural Roots of Violence against Women&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Social Sciences&lt;/em&gt; 12(3):117, open access. Individual and institutional norms in 12 countries. Linked on p. 18; the countries match the table on p. 19.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the model to read for combining surveys, indices and conventions.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://brill.com/view/book/edcoll/9789004429604/BP000010.xml&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Lomazzi, Women&#x27;s Rights and Shari&#x27;a Law in the MENA Region&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Brill chapter, source of the table on p. 23. The link is the one on the slide: the search did not return the record, so I could not verify its data.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explores the relationship between reservations and family law.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://docs.iza.org/dp1941.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Olivetti &amp;amp; Petrongolo (2008), Unequal Pay or Unequal Employment?&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Journal of Labor Economics&lt;/em&gt; 26(4); working paper version here. Not cited in the slides: added to explain the selection effect.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it helps avoid reading a low GPG as proof of parity.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.britannica.com/story/what-is-intersectionality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Crenshaw (1989) and intersectionality, Britannica entry&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Introduction to the concept and to the article &lt;em&gt;Demarginalizing the Intersection of Race and Sex&lt;/em&gt;, &lt;em&gt;University of Chicago Legal Forum&lt;/em&gt;. Not cited in the slides: added for the topic on the agenda on p. 3.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the origin of the term.&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Indices and reports&lt;/h3&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://eige.europa.eu/gender-equality-index/2025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EIGE, Gender Equality Index 2025&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Scores by country and domain. Linked on pp. 4-5. See also the &lt;a href=&quot;https://eige.europa.eu/modules/custom/eige_gei/app/content/downloads/factsheets/IT_2025_factsheet.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Italy factsheet&lt;/a&gt; and the &lt;a href=&quot;https://eige.europa.eu/publications-resources/publications/gender-equality-index-methodological-report&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;methodological report&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the primary source for part 1; only there can weights and series be checked.&lt;/p&gt;&lt;/div&gt;
