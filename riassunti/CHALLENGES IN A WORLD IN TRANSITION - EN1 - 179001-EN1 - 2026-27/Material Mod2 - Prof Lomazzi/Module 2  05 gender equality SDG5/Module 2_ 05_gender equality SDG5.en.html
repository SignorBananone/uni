&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.weforum.org/publications/global-gender-gap-report-2021/gggr2-benchmarking-gender-gaps-findings-from-the-global-gender-gap-index-2021&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Economic Forum, Global Gender Gap Report 2021&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Index covering four areas: economy, education, health and politics. Source of p. 11.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it measures the gap between the sexes and not the level of development, so a poor country can obtain a good score.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://equalmeasures2030.org/publications/2022-sdg-gender-index-report/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Equal Measures 2030, 2022 SDG Gender Index&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;&#x27;Back to Normal&#x27; is Not Enough&lt;/em&gt;: 144 countries, 2015-2020 comparison. Link to the PDF on p. 32.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: almost all the data in part 5 seem to come from here.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://equalmeasures2030.org/2024-sdg-gender-index/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Equal Measures 2030, 2024 SDG Gender Index&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;A gender equal future in crisis?&lt;/em&gt;: 139 countries, with reference years 2015, 2019 and 2022. Linked on p. 30.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the most recent edition among those cited, and it updates the picture with subsequent crises.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.unwomen.org/en/digital-library/publications/2022/09/progress-on-the-sustainable-development-goals-the-gender-snapshot-2022&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Women and UN DESA, The Gender Snapshot 2022&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Progress on all the SDGs from a gender perspective. Probable source, at least in part, of the estimates on p. 20.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the right place to verify the “how many years remain” figures.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.oecd.org/en/publications/sigi-2023-methodology_775aca3a-en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OECD, SIGI 2023 Methodology&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;25 variables in four dimensions, from 0 to 100, where 100 is maximum discrimination. Used on p. 19.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it measures formal and informal social institutions. The scale runs in the opposite direction to the EIGE Index.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://ec.europa.eu/eurostat/statistics-explained/index.php/Gender_pay_gap_statistics&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eurostat, Gender pay gap statistics&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Definition and data for the unadjusted gap, based on gross hourly earnings. Eurostat is also the source of p. 10 (database &lt;code&gt;htec_emp_nat2&lt;/code&gt;).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is useful for updating the Italian and European data on slide p. 12.&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Treaties, regulations and policies&lt;/h3&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.un.org/womenwatch/daw/cedaw/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CEDAW, text of the Convention&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Adopted by the General Assembly on 18 December 1979, in force since 3 September 1981. See also the list of &lt;a href=&quot;https://www.un.org/womenwatch/daw/cedaw/reservations-country.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;reservations by country&lt;/a&gt;. Cited on pp. 8 and 21-23.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the global legal basis. For the current number of parties, check the UN Treaty Collection.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://digitallibrary.un.org/record/1648092&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Beijing Declaration and Platform for Action (1995)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Outcome of the Fourth World Conference on Women, with 12 critical areas. It is the “UN world conference 1995” on p. 24. The first conference was held in Mexico City in 1975.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it made gender mainstreaming a global strategy.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.un.org/womenwatch/osagi/pdf/e65237.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN, Gender Mainstreaming: An Overview&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Reports the definition from the ECOSOC agreed conclusions 1997/2. Added to clarify p. 24.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the most cited definition.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://eige.europa.eu/publications-resources/publications/what-gender-mainstreaming&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EIGE, What is gender mainstreaming?&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Short introduction to GM in the EU policy cycle. Added to clarify p. 24.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it translates the principle into operational steps.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.eurofound.europa.eu/en/publications/all/amsterdam-treaty-enters-force&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Treaty of Amsterdam&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Signed on 2 October 1997, in force since 1 May 1999. Cited on p. 24. The entry does not confirm the text on GM, which should be checked on EUR-Lex.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it marks the start of the EU strategy indicated by the slide.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://fra.europa.eu/en/eu-charter/charter/article/23-equality-between-women-and-men&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EU Charter of Fundamental Rights, Art. 23&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Equality in all areas, including employment, work and pay; it allows positive measures for the under-represented sex. The “Chart” on p. 24.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the foundation of equality among EU rights, and it justifies positive action.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://commission.europa.eu/news-and-media/news/new-strategy-embeds-gender-equality-every-aspect-life-2026-03-05_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;European Commission, Gender Equality Strategy 2026-2030&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Adopted in March 2026 and based on the Roadmap for Women&#x27;s Rights. Not in the slides: it updates the action plans cited on p. 24.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it shows where European GM stands today.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.coe.int/web/istanbul-convention/grevio&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Council of Europe, Istanbul Convention and GREVIO&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Official pages on monitoring and on individual countries. Cited on pp. 19, 21 and 25-26.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: GREVIO reports show actual implementation, beyond signature. For the current status, use the Treaty Office.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://ntplusdiritto.ilsole24ore.com/art/in-gazzetta-legge-parita-salariale-uomo-donna-AEKzGAy&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Law 162/2021 on equal pay&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;NT+ Diritto article on the law that should correspond to the “new law” on p. 12. It amends the Italian Equal Opportunities Code. The reference standard for certification is UNI/PdR 125:2022.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is a national example of action on the gender pay gap.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.1522.eu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1522, anti-violence and anti-stalking helpline&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Official website of the service, shown on p. 27. Available in several languages, with chat.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it shows in concrete terms what implementing a treaty means. And it may be useful.&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Surveys&lt;/h3&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://europeanvaluesstudy.eu/projects-and-collaborations/collaborations/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;European Values Study (EVS)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;European survey on values since 1981. Cited on pp. 14 and 16; in 2017 it collaborated with the WVS.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it provides many of the GRA items.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://worldvaluessurvey.org/WVSSiteMap.jsp&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Values Survey (WVS)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Global research network on values and beliefs. Cited on pp. 14, 16 and 18.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it extends the comparison beyond Europe, and it contains the item on violence.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://gesis.org/en/services/finding-and-accessing-data/international-survey-programs&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ISSP and Eurobarometer, at GESIS&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;The ISSP is a collaboration with annual surveys in about 50 countries. The Eurobarometer has monitored EU public opinion since 1974. Cited on p. 14. I did not find the official pages in my searches.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: GESIS is the access point to the data for anyone wanting to analyze them.&lt;/p&gt;&lt;/div&gt;
