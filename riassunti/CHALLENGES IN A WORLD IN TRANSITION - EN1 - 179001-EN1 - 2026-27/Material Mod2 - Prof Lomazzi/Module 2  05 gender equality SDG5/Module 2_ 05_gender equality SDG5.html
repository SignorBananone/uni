&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://eige.europa.eu/gender-equality-index/2025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EIGE, Gender Equality Index 2025&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Punteggi per paese e dominio. Link a p. 4-5. Vedi anche la &lt;a href=&quot;https://eige.europa.eu/modules/custom/eige_gei/app/content/downloads/factsheets/IT_2025_factsheet.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda Italia&lt;/a&gt; e il &lt;a href=&quot;https://eige.europa.eu/publications-resources/publications/gender-equality-index-methodological-report&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;report metodologico&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte primaria della parte 1; solo lì si possono controllare pesi e serie.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.weforum.org/publications/global-gender-gap-report-2021/gggr2-benchmarking-gender-gaps-findings-from-the-global-gender-gap-index-2021&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Economic Forum, Global Gender Gap Report 2021&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Indice su quattro aree: economia, istruzione, salute e politica. Fonte di p. 11.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: misura il divario tra sessi e non il livello di sviluppo, quindi un paese povero può ottenere un buon punteggio.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://equalmeasures2030.org/publications/2022-sdg-gender-index-report/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Equal Measures 2030, 2022 SDG Gender Index&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;&#x27;Back to Normal&#x27; is Not Enough&lt;/em&gt;: 144 paesi, confronto 2015-2020. Link al PDF a p. 32.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: da qui sembrano venire quasi tutti i dati della parte 5.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://equalmeasures2030.org/2024-sdg-gender-index/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Equal Measures 2030, 2024 SDG Gender Index&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;A gender equal future in crisis?&lt;/em&gt;: 139 paesi, con riferimenti 2015, 2019 e 2022. Link a p. 30.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è l&#x27;edizione più recente tra quelle citate, e aggiorna il quadro con le crisi successive.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.unwomen.org/en/digital-library/publications/2022/09/progress-on-the-sustainable-development-goals-the-gender-snapshot-2022&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Women e UN DESA, The Gender Snapshot 2022&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Stato di avanzamento di tutti gli SDG in ottica di genere. Probabile fonte, almeno in parte, delle stime di p. 20.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il posto giusto per verificare i “quanti anni mancano”.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.oecd.org/en/publications/sigi-2023-methodology_775aca3a-en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OECD, SIGI 2023 Methodology&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;25 variabili in quattro dimensioni, da 0 a 100, dove 100 è la discriminazione massima. Usato a p. 19.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: misura le istituzioni sociali, formali e informali. La scala va al contrario rispetto all&#x27;Index EIGE.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://ec.europa.eu/eurostat/statistics-explained/index.php/Gender_pay_gap_statistics&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eurostat, Gender pay gap statistics&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Definizione e dati del gap non corretto, sui salari orari lordi. Eurostat è anche la fonte di p. 10 (database &lt;code&gt;htec_emp_nat2&lt;/code&gt;).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: serve per aggiornare i dati italiani ed europei della slide p. 12.&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Trattati, norme e politiche&lt;/h3&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.un.org/womenwatch/daw/cedaw/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CEDAW, testo della Convention&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Adottata dall&#x27;Assemblea Generale il 18 dicembre 1979, in vigore dal 3 settembre 1981. Vedi anche l&#x27;elenco delle &lt;a href=&quot;https://www.un.org/womenwatch/daw/cedaw/reservations-country.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;reservations per paese&lt;/a&gt;. Citata a p. 8 e 21-23.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la base legale globale. Per il numero attuale di parti controlla la UN Treaty Collection.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://digitallibrary.un.org/record/1648092&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Beijing Declaration and Platform for Action (1995)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Esito della quarta conferenza mondiale sulle donne, con 12 aree critiche. È la “UN world conference 1995” di p. 24. La prima conferenza si tenne a Città del Messico nel 1975.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: ha reso il gender mainstreaming una strategia globale.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.un.org/womenwatch/osagi/pdf/e65237.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN, Gender Mainstreaming: An Overview&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Riporta la definizione delle agreed conclusions ECOSOC 1997/2. Aggiunta per chiarire p. 24.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la definizione più citata.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://eige.europa.eu/publications-resources/publications/what-gender-mainstreaming&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EIGE, What is gender mainstreaming?&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Introduzione breve al GM nel ciclo delle politiche EU. Aggiunta per chiarire p. 24.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: traduce il principio in passaggi operativi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.eurofound.europa.eu/en/publications/all/amsterdam-treaty-enters-force&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Trattato di Amsterdam&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Firmato il 2 ottobre 1997, in vigore dal 1° maggio 1999. Citato a p. 24. La scheda non conferma il testo sul GM, che va controllato su EUR-Lex.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: segna l&#x27;avvio della strategia EU indicato dalla slide.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://fra.europa.eu/en/eu-charter/charter/article/23-equality-between-women-and-men&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Carta dei diritti fondamentali UE, art. 23&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Parità in tutti i settori, compresi lavoro e retribuzione; ammette misure positive per il sesso sottorappresentato. La “Chart” di p. 24.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il fondamento dell&#x27;uguaglianza tra i diritti EU, e giustifica le azioni positive.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://commission.europa.eu/news-and-media/news/new-strategy-embeds-gender-equality-every-aspect-life-2026-03-05_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Commissione europea, Gender Equality Strategy 2026-2030&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Adottata nel marzo 2026 e basata sulla Roadmap for Women&#x27;s Rights. Non è nelle slide: aggiorna gli action plan citati a p. 24.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: mostra dove si trova oggi il GM europeo.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.coe.int/web/istanbul-convention/grevio&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Council of Europe, Istanbul Convention e GREVIO&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Pagine ufficiali sul monitoraggio e sui singoli paesi. Citata a p. 19 e 21 e 25-26.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: i rapporti GREVIO mostrano l&#x27;attuazione reale, al di là della firma. Per lo stato aggiornato usa il Treaty Office.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://ntplusdiritto.ilsole24ore.com/art/in-gazzetta-legge-parita-salariale-uomo-donna-AEKzGAy&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Legge 162/2021 sulla parità salariale&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Scheda di NT+ Diritto sulla legge che dovrebbe corrispondere alla “new law” di p. 12. Modifica il Codice delle pari opportunità. La norma di riferimento per la certificazione è UNI/PdR 125:2022.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è un esempio nazionale di azione sul gender pay gap.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.1522.eu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1522, numero antiviolenza e stalking&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Sito ufficiale del servizio, mostrato a p. 27. Disponibile in più lingue, con chat.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: mostra in concreto che cosa significa attuare un trattato. E può servire.&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Indagini&lt;/h3&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://europeanvaluesstudy.eu/projects-and-collaborations/collaborations/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;European Values Study (EVS)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Indagine europea sui valori dal 1981. Citata a p. 14 e 16; nel 2017 ha collaborato col WVS.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: fornisce molti degli item delle GRA.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://worldvaluessurvey.org/WVSSiteMap.jsp&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Values Survey (WVS)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Rete globale di ricerca su valori e credenze. Citata a p. 14, 16 e 18.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: allarga il confronto oltre l&#x27;Europa, e contiene l&#x27;item sulla violenza.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://gesis.org/en/services/finding-and-accessing-data/international-survey-programs&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ISSP ed Eurobarometer, presso GESIS&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;L&#x27;ISSP è una collaborazione con indagini annuali in circa 50 paesi. L&#x27;Eurobarometer monitora l&#x27;opinione pubblica EU dal 1974. Citati a p. 14. Non ho trovato le pagine ufficiali nelle ricerche.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: GESIS è il punto d&#x27;accesso ai dati per chi vuole analizzarli.&lt;/p&gt;&lt;/div&gt;

&lt;/section&gt;
&lt;footer&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/footer&gt;
