&lt;/figure&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s0&quot;&gt;
&lt;div class=&quot;num&quot;&gt;0&lt;/div&gt;
&lt;h2&gt;Il punto di partenza&lt;/h2&gt;
&lt;p class=&quot;big&quot;&gt;La lezione precedente ha definito la &lt;em&gt;gender equality&lt;/em&gt; e ha presentato le sue misure. Questa aggiunge il pezzo mancante: i valori di una società, e le regole internazionali che cercano di cambiarla.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Last time &lt;span class=&quot;src&quot;&gt;slide p. 2&lt;/span&gt;&lt;/h4&gt;&lt;ul style=&quot;margin:0&quot;&gt;&lt;li&gt;Definizione di gender equality&lt;/li&gt;&lt;li&gt;Misure da statistical offices (uffici statistici)&lt;/li&gt;&lt;li&gt;Misure da population surveys (indagini sulla popolazione)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Today &lt;span class=&quot;src&quot;&gt;slide p. 3&lt;/span&gt;&lt;/h4&gt;&lt;ul style=&quot;margin:0&quot;&gt;&lt;li&gt;Informazioni dai population surveys&lt;/li&gt;&lt;li&gt;International platforms&lt;/li&gt;&lt;li&gt;SDG5&lt;/li&gt;&lt;li&gt;Intersectionality: poverty, migration background&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;&lt;dfn class=&quot;t&quot;&gt;Gender equality&lt;/dfn&gt; significa, in breve, pari diritti, responsabilità e opportunità per donne e uomini, a prescindere dal sesso di nascita. Non vuol dire che tutte le persone debbano fare le stesse scelte, ma che il genere non deve limitarle. La definizione estesa sta nella lezione precedente, che qui non ho potuto consultare.&lt;/p&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;strong&gt;Altri file del corso.&lt;/strong&gt; In questa sessione non avevo uno strumento per elencare la cartella &lt;code&gt;corso/&lt;/code&gt;: ho provato alcuni nomi di file plausibili, senza trovarne. Quindi tutto viene da questo PDF o dal web, e nessun collegamento è tratto da altri materiali del corso.&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p-sage&quot; id=&quot;s1&quot;&gt;
&lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;
&lt;h2&gt;Il Gender Equality Index&lt;/h2&gt;
&lt;p class=&quot;big&quot;&gt;Un solo numero da 0 a 100 riassume sei aree della vita. L&#x27;Italia è vicina alla media EU nel totale, ma ultima nel dominio Work.&lt;/p&gt;

&lt;h3&gt;Che cos&#x27;è&lt;/h3&gt;
&lt;p&gt;Il &lt;dfn class=&quot;t&quot;&gt;Gender Equality Index&lt;/dfn&gt; (indice composito dell&#x27;uguaglianza di genere) è prodotto da &lt;dfn class=&quot;t&quot;&gt;EIGE&lt;/dfn&gt;, lo European Institute for Gender Equality. Un indice composito combina molti indicatori in un unico punteggio: qui 100 significa massima uguaglianza &lt;span class=&quot;src&quot;&gt;slide p. 5&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;outs&quot;&gt;
&lt;div class=&quot;out&quot;&gt;&lt;b&gt;63,4&lt;/b&gt;EU, Index 2025 &lt;span class=&quot;src&quot;&gt;p. 4&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;out&quot;&gt;&lt;b&gt;61,9&lt;/b&gt;Italia, Index 2025 &lt;span class=&quot;src&quot;&gt;p. 4&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;out&quot;&gt;&lt;b&gt;+3,5 / +3,9&lt;/b&gt;variazione in 5 anni, EU / Italia &lt;span class=&quot;src&quot;&gt;p. 4&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;L&#x27;Italia è 12ª nella EU, e dal 2020 il guadagno viene soprattutto dal dominio Power &lt;a class=&quot;ext&quot; href=&quot;https://eige.europa.eu/modules/custom/eige_gei/app/content/downloads/factsheets/IT_2025_factsheet.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;. Attenzione ai confronti storici: nel 2025 la metodologia è cambiata e i punteggi delle edizioni precedenti non sono più confrontabili. EIGE ha ricalcolato il 2020 per poter misurare il cambiamento &lt;a class=&quot;ext&quot; href=&quot;https://eige.europa.eu/about/projects/gender-equality-index-2025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;

&lt;figure&gt;
&lt;div class=&quot;seg&quot; id=&quot;rankbtn&quot; role=&quot;group&quot; aria-label=&quot;Classifica da mostrare&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;chips&quot; id=&quot;rankchips&quot;&gt;&lt;/div&gt;
&lt;figcaption id=&quot;rankcap&quot;&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Come si calcola, e perché la media geometrica conta&lt;/h3&gt;
&lt;p&gt;Gli indicatori si aggregano in sub-domini e questi nei sei domini. La versione 2025 conta 27 indicatori e 13 sub-domini &lt;a class=&quot;ext&quot; href=&quot;https://www.idescat.cat/novetats/?id=5730&amp;amp;lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;. Al livello finale i domini sono uniti con una media geometrica pesata, con pesi decisi da esperti &lt;a class=&quot;ext&quot; href=&quot;https://arxiv.org/pdf/2509.17140&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Index = D&lt;sub&gt;1&lt;/sub&gt;&lt;sup&gt;w₁&lt;/sup&gt; × D&lt;sub&gt;2&lt;/sub&gt;&lt;sup&gt;w₂&lt;/sup&gt; × … × D&lt;sub&gt;6&lt;/sub&gt;&lt;sup&gt;w₆&lt;/sup&gt; &amp;nbsp; con &amp;nbsp; w₁ + … + w₆ = 1&lt;/div&gt;
&lt;p&gt;La media geometrica è più severa di quella aritmetica: un dominio molto basso non si compensa del tutto con uno molto alto. Provalo qui sotto partendo dai valori italiani &lt;span class=&quot;src&quot;&gt;slide p. 5&lt;/span&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;div id=&quot;geisl&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;outs&quot;&gt;
&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;geiA&quot;&gt;–&lt;/b&gt;media aritmetica&lt;/div&gt;
&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;geiG&quot;&gt;–&lt;/b&gt;media geometrica&lt;/div&gt;
&lt;div class=&quot;out&quot;&gt;&lt;b&gt;61,9&lt;/b&gt;Index ufficiale, Italia&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;seg&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;geireset&quot; type=&quot;button&quot;&gt;Valori Italia 2025&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;geipow&quot; type=&quot;button&quot;&gt;Power +20&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;geihea&quot; type=&quot;button&quot;&gt;Health +13,1 (a 100)&lt;/button&gt;&lt;/div&gt;
&lt;figcaption&gt;Laboratorio con &lt;strong&gt;pesi uguali&lt;/strong&gt;, quindi non è la formula ufficiale: i pesi reali non sono riportati qui. Il valore geometrico si avvicina comunque molto al 61,9. &lt;span class=&quot;calc&quot;&gt;calcolo&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;I sei domini, uno per uno&lt;/summary&gt;&lt;div&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Work (61,0)&lt;/strong&gt;: partecipazione al lavoro e qualità dell&#x27;impiego.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Money (67,0)&lt;/strong&gt;: risorse economiche, redditi e rischio di povertà.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Knowledge (56,8)&lt;/strong&gt;: istruzione e sua segregazione per campo di studio.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Time (59,4)&lt;/strong&gt;: tempo per cura, lavori domestici e attività sociali.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Power (47,9)&lt;/strong&gt;: presenza nelle decisioni politiche, economiche e sociali. È il valore più basso.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Health (86,9)&lt;/strong&gt;: stato di salute, comportamenti e accesso alle cure. È il valore più alto.&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;I punteggi vengono dalla &lt;span class=&quot;src&quot;&gt;slide p. 5&lt;/span&gt;. Le descrizioni sono sintesi didattiche: il dettaglio esatto sta nel report metodologico EIGE.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Work versus Time&lt;/h3&gt;
&lt;p&gt;La slide mette a confronto due serie &lt;span class=&quot;src&quot;&gt;slide p. 6&lt;/span&gt;: il lavoro retribuito e il tempo, che comprende il lavoro di cura non pagato. Sono due facce dello stesso problema: chi si carica più lavoro di cura ha meno tempo e meno margine per il lavoro pagato.&lt;/p&gt;
&lt;figure&gt;
&lt;div class=&quot;seg&quot; id=&quot;wtbtn&quot; role=&quot;group&quot; aria-label=&quot;Dominio&quot;&gt;&lt;/div&gt;
&lt;div id=&quot;wtchart&quot;&gt;&lt;/div&gt;
&lt;figcaption id=&quot;wtcap&quot;&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;strong&gt;Una linea piatta non prova l&#x27;immobilità.&lt;/strong&gt; L&#x27;Italia resta a 59,4 in tutti e quattro gli anni. Può dipendere anche dai dati: il dominio Time usa la EIGE CARE survey del 2024 &lt;a class=&quot;ext&quot; href=&quot;https://eige.europa.eu/modules/custom/eige_gei/app/content/downloads/factsheets/IT_2025_factsheet.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;. Questa è una mia ipotesi di lettura, da verificare nel report metodologico.&lt;/div&gt;

&lt;h3&gt;Dentro il dominio Work&lt;/h3&gt;
&lt;p&gt;Italia 61, EU 69,3 &lt;span class=&quot;src&quot;&gt;slide p. 7&lt;/span&gt;. La slide elenca gli indicatori del sub-index:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Participation&lt;/h4&gt;&lt;ul style=&quot;margin:0&quot;&gt;&lt;li&gt;&lt;dfn class=&quot;t&quot;&gt;FTE employment rate&lt;/dfn&gt; (%): tasso di occupazione in equivalenti a tempo pieno. Due part-time a metà orario contano come un posto a tempo pieno, quindi il part-time non gonfia il dato.&lt;/li&gt;&lt;li&gt;Length of working life (anni): durata attesa della vita lavorativa.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Segregation&lt;/h4&gt;&lt;ul style=&quot;margin:0&quot;&gt;&lt;li&gt;Occupati in education, health and social work (%).&lt;/li&gt;&lt;li&gt;Possibilità di prendersi una o due ore durante il lavoro per motivi personali o familiari (%).&lt;/li&gt;&lt;li&gt;Index of career prospects (punti, 0-100).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché l&#x27;Italia può stare poco sotto la media EU nel totale ed essere ultima nel Work?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché l&#x27;indice aggrega sei domini: valori alti, come Health a 86,9, sostengono il totale. L&#x27;indice composito riassume, ma può nascondere una debolezza specifica. Per questo bisogna guardare anche i domini.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa succede alla media geometrica se un dominio scende molto?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Scende più di quella aritmetica, a parità di altri valori. In pratica penalizza gli squilibri: non basta eccellere in un&#x27;area per compensare un forte ritardo in un&#x27;altra.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Si può dire che l&#x27;Italia è passata da 69,2 a 61,9 tra le edizioni 2024 e 2025?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Il 69,2 dell&#x27;edizione 2024 &lt;a class=&quot;ext&quot; href=&quot;https://unipd-centrodirittiumani.it/en/news/eige-how-italy-fared-in-the-gender-equality-index-for-2024&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt; usa la vecchia metodologia, quindi i due numeri non sono confrontabili. Il confronto corretto usa la serie ricalcolata: +3,9 in cinque anni.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Nel grafico Work, quanto vale il divario Italia-EU nel 2010 e nel 2025?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Nel 2010 è 67,2 − 62,4 = 4,8 punti. Nel 2025 è 69,3 − 61 = 8,3 punti. Il divario si è allargato, e l&#x27;Italia è sotto il proprio valore del 2010.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p-ochre&quot; id=&quot;s2&quot;&gt;
&lt;div class=&quot;num&quot;&gt;2&lt;/div&gt;
&lt;h2&gt;Gender inequalities nel labor market&lt;/h2&gt;
&lt;p class=&quot;big&quot;&gt;Le leggi discriminatorie spiegano sempre meno. Nella maggior parte delle società contano soprattutto barriere invisibili, che producono tre effetti misurabili.&lt;/p&gt;

&lt;h3&gt;Le barriere: dalle visibili alle invisibili&lt;/h3&gt;
&lt;p&gt;Secondo la &lt;span class=&quot;src&quot;&gt;slide p. 8&lt;/span&gt;, oggi le disuguaglianze poggiano soprattutto su barriere culturali, invisibili perché nessuna norma scritta le dichiara:&lt;/p&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Tipi di barriera&quot;&gt;
&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Gender role expectations&lt;/button&gt;
&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Social norms&lt;/button&gt;
&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Legal laws&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;dfn class=&quot;t&quot;&gt;Gender role expectations&lt;/dfn&gt; sono le aspettative su ciò che donne e uomini “dovrebbero” fare. Esempio: dare per scontato che sia la madre a chiedere il part-time dopo una nascita.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;dfn class=&quot;t&quot;&gt;Social norms&lt;/dfn&gt; sono regole non scritte, sostenute da &lt;em&gt;conformity&lt;/em&gt; (ci si adegua a ciò che fanno e si aspettano gli altri) e &lt;em&gt;social control&lt;/em&gt; (chi devia subisce giudizi o sanzioni informali). Esempio: il commento sul padre che prende il congedo.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;In alcune società i trattamenti diversi sono ancora legittimati dalla legge: quote di eredità, libertà di movimento, guida, viaggi. In questo caso la barriera è visibile. Qui si collega il tema delle reservations alla CEDAW (&lt;a href=&quot;#cedaw&quot;&gt;parte 4&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;I tre effetti&lt;/h3&gt;
&lt;p&gt;La &lt;span class=&quot;src&quot;&gt;slide p. 9&lt;/span&gt; indica horizontal segregation, vertical segregation e gender pay gap. Lo schema mostra la differenza.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;chart&quot; viewBox=&quot;0 0 480 300&quot; role=&quot;img&quot; aria-label=&quot;Schema: la segregazione orizzontale separa donne e uomini tra settori; quella verticale le blocca sotto il glass ceiling o sullo sticky floor; insieme contribuiscono al gender pay gap.&quot;&gt;
&lt;g font-size=&quot;13&quot;&gt;
&lt;rect x=&quot;20&quot; y=&quot;30&quot; width=&quot;130&quot; height=&quot;222&quot; rx=&quot;6&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--rule)&quot;/&gt;
&lt;rect x=&quot;165&quot; y=&quot;30&quot; width=&quot;130&quot; height=&quot;222&quot; rx=&quot;6&quot; style=&quot;fill:var(--slate-bg);stroke:var(--rule)&quot;/&gt;
&lt;text x=&quot;85&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;Education, care&lt;/text&gt;&lt;text x=&quot;230&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;Manufacturing&lt;/text&gt;
&lt;path d=&quot;M12 84H304&quot; style=&quot;stroke:var(--accent);stroke-width:3;stroke-dasharray:7 5&quot;/&gt;
&lt;text x=&quot;310&quot; y=&quot;80&quot; font-weight=&quot;600&quot;&gt;Glass ceiling&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;97&quot;&gt;tetto invisibile&lt;/text&gt;
&lt;path d=&quot;M12 226H304&quot; style=&quot;stroke:var(--ochre);stroke-width:5&quot;/&gt;
&lt;text x=&quot;310&quot; y=&quot;222&quot; font-weight=&quot;600&quot;&gt;Sticky floor&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;239&quot;&gt;pavimento “appiccicoso”&lt;/text&gt;
&lt;g style=&quot;fill:var(--accent)&quot;&gt;&lt;circle cx=&quot;50&quot; cy=&quot;240&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;70&quot; cy=&quot;240&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;90&quot; cy=&quot;240&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;110&quot; cy=&quot;240&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;60&quot; cy=&quot;205&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;85&quot; cy=&quot;205&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;110&quot; cy=&quot;205&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;72&quot; cy=&quot;155&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;100&quot; cy=&quot;155&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;85&quot; cy=&quot;105&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;205&quot; cy=&quot;205&quot; r=&quot;6&quot;/&gt;&lt;circle cx=&quot;240&quot; cy=&quot;155&quot; r=&quot;6&quot;/&gt;&lt;/g&gt;
&lt;g style=&quot;fill:var(--slate)&quot;&gt;&lt;rect x=&quot;57&quot; y=&quot;52&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;102&quot; y=&quot;52&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;190&quot; y=&quot;52&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;225&quot; y=&quot;52&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;258&quot; y=&quot;52&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;190&quot; y=&quot;100&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;225&quot; y=&quot;100&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;258&quot; y=&quot;100&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;190&quot; y=&quot;150&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;258&quot; y=&quot;150&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;225&quot; y=&quot;199&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;rect x=&quot;258&quot; y=&quot;199&quot; width=&quot;12&quot; height=&quot;12&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;160&quot; y=&quot;278&quot; text-anchor=&quot;middle&quot;&gt;← horizontal: tra settori →&lt;/text&gt;
&lt;path d=&quot;M455 110V205&quot; marker-start=&quot;url(#ar)&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke:var(--muted);stroke-width:1.5;fill:none&quot;/&gt;
&lt;text x=&quot;402&quot; y=&quot;162&quot;&gt;vertical&lt;/text&gt;
&lt;circle cx=&quot;340&quot; cy=&quot;278&quot; r=&quot;6&quot; style=&quot;fill:var(--accent)&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;283&quot;&gt;donne&lt;/text&gt;&lt;rect x=&quot;402&quot; y=&quot;272&quot; width=&quot;12&quot; height=&quot;12&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;418&quot; y=&quot;283&quot;&gt;uomini&lt;/text&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Schema illustrativo: i simboli non corrispondono a dati.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Horizontal segregation&lt;/h3&gt;
&lt;p&gt;&lt;dfn class=&quot;t&quot;&gt;Horizontal segregation&lt;/dfn&gt; (segregazione orizzontale) è la concentrazione di donne e uomini in settori e professioni diverse. Nel 2020, nella EU, le donne erano &lt;strong&gt;93%&lt;/strong&gt; dei professionisti di education and care, &lt;strong&gt;86%&lt;/strong&gt; dell&#x27;assistenza sanitaria e &lt;strong&gt;95%&lt;/strong&gt; di cleaners and helpers &lt;span class=&quot;src&quot;&gt;slide p. 10&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;La tabella italiana della stessa slide si legge in un altro modo: “12,7%” non è la quota di donne in education, ma la quota delle occupate che lavora in education. Cambia il denominatore. Passa da una vista all&#x27;altra.&lt;/p&gt;
&lt;figure&gt;
&lt;div class=&quot;seg&quot; id=&quot;secbtn&quot; role=&quot;group&quot; aria-label=&quot;Vista&quot;&gt;&lt;/div&gt;
&lt;div id=&quot;secchart&quot;&gt;&lt;/div&gt;
&lt;figcaption id=&quot;seccap&quot;&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;Come ho ricavato la quota di donne dalla tabella&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;Il dato totale è una media dei due gruppi, pesata per la quota di donne &lt;em&gt;w&lt;/em&gt; tra gli occupati:&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;totale = w · donne + (1 − w) · uomini &amp;nbsp;⇒&amp;nbsp; w = (totale − uomini) / (donne − uomini)&lt;/div&gt;
&lt;p&gt;Per education: (7,2 − 3,1) / (12,7 − 3,1) ≈ 0,43. Manufacturing e services danno circa 0,42. Con w ≈ 0,42, la quota di donne in education è 0,42 × 12,7 / 7,2 ≈ 74%. Le percentuali sono stime da dati arrotondati. &lt;span class=&quot;calc&quot;&gt;calcolo&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Vertical segregation&lt;/h3&gt;
&lt;p&gt;&lt;dfn class=&quot;t&quot;&gt;Vertical segregation&lt;/dfn&gt; (segregazione verticale) è la minore presenza di donne man mano che si sale nella gerarchia. La slide la illustra con due immagini &lt;span class=&quot;src&quot;&gt;slide p. 11&lt;/span&gt;, che hanno questo significato:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;dfn class=&quot;t&quot;&gt;Glass ceiling&lt;/dfn&gt;: un tetto di cristallo. Le posizioni apicali si vedono, ma ostacoli non dichiarati ne impediscono l&#x27;accesso.&lt;/li&gt;
&lt;li&gt;&lt;dfn class=&quot;t&quot;&gt;Sticky floor&lt;/dfn&gt;: un pavimento appiccicoso. Molte donne restano bloccate nei gradini bassi, con paghe modeste e poche possibilità di avanzare. Il problema sta quindi anche in basso, non solo al vertice.&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;I dati vengono dal &lt;em&gt;Global Gender Gap Report 2021&lt;/em&gt; del World Economic Forum. L&#x27;indicatore centrale è il rapporto &lt;strong&gt;f/m&lt;/strong&gt;: 1,00 è la parità, valori più bassi indicano il ritardo femminile. La slide lo presenta come &lt;dfn class=&quot;t&quot;&gt;distance to parity&lt;/dfn&gt; (distanza dalla parità).&lt;/p&gt;
&lt;figure&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;weft&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Indicatore&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;F&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;M&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;f/m&lt;/th&gt;&lt;th style=&quot;min-width:80px&quot;&gt;verso 1,00&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;figcaption&gt;&lt;span class=&quot;src&quot;&gt;slide p. 11&lt;/span&gt; La slide non dice di quale paese si tratta. Il rango 114 per l&#x27;economic participation coincide con quello riportato per l&#x27;Italia in questa &lt;a class=&quot;ext&quot; href=&quot;https://apiwp.thelocal.com/?p=257167&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;, quindi è probabile che sia l&#x27;Italia: controlla col report.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Da notare in questa tabella&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Il cuore della vertical segregation:&lt;/strong&gt; tra professional and technical workers il rapporto è 0,91, tra legislators, senior officials and managers crolla a 0,39.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Rank e score dicono cose diverse:&lt;/strong&gt; la political empowerment ha rango 41 ma score 0,313, mentre l&#x27;economic participation ha rango 114 e score 0,609. Politica migliore nel confronto globale, eppure più lontana dalla parità: la media mondiale è solo 0,218.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;figure&gt;
&lt;div class=&quot;slid&quot;&gt;&lt;label for=&quot;par&quot;&gt;Quota di donne&lt;/label&gt;&lt;input id=&quot;par&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;50&quot; value=&quot;28&quot;&gt;&lt;output id=&quot;parv&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;outs&quot;&gt;&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;parr&quot;&gt;–&lt;/b&gt;rapporto f/m&lt;/div&gt;&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;pard&quot;&gt;–&lt;/b&gt;distanza da 1,00&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;Il rapporto scende più in fretta di quanto suggerisca la percentuale: con 28% di donne, f/m è già attorno a 0,39. &lt;span class=&quot;calc&quot;&gt;calcolo&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Gender Pay Gap&lt;/h3&gt;
&lt;p&gt;Il &lt;dfn class=&quot;t&quot;&gt;gender pay gap (GPG)&lt;/dfn&gt; è la differenza tra i salari orari medi di uomini e donne, espressa in percentuale del salario medio maschile &lt;span class=&quot;src&quot;&gt;slide p. 12&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;GPG = (salario orario medio M − salario orario medio F) / salario orario medio M × 100&lt;/div&gt;
&lt;p&gt;La slide dà &lt;strong&gt;5% in Italia e 15% nella EU&lt;/strong&gt;. Su base annua il divario italiano sale fino al &lt;strong&gt;12%&lt;/strong&gt;, perché le donne lavorano meno ore &lt;span class=&quot;src&quot;&gt;slide p. 12&lt;/span&gt;. Il calcolatore lo mostra.&lt;/p&gt;
&lt;figure&gt;
&lt;div class=&quot;slid&quot;&gt;&lt;label for=&quot;gm&quot;&gt;Salario orario M&lt;/label&gt;&lt;input id=&quot;gm&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;40&quot; step=&quot;.5&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;gmv&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;slid&quot;&gt;&lt;label for=&quot;gf&quot;&gt;Salario orario F&lt;/label&gt;&lt;input id=&quot;gf&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;40&quot; step=&quot;.1&quot; value=&quot;19&quot;&gt;&lt;output id=&quot;gfv&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;slid&quot;&gt;&lt;label for=&quot;hm&quot;&gt;Ore/sett. M&lt;/label&gt;&lt;input id=&quot;hm&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;48&quot; step=&quot;.5&quot; value=&quot;38&quot;&gt;&lt;output id=&quot;hmv&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;slid&quot;&gt;&lt;label for=&quot;hf&quot;&gt;Ore/sett. F&lt;/label&gt;&lt;input id=&quot;hf&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;48&quot; step=&quot;.5&quot; value=&quot;35&quot;&gt;&lt;output id=&quot;hfv&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;outs&quot;&gt;&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;gh&quot;&gt;–&lt;/b&gt;GPG orario&lt;/div&gt;&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;ga&quot;&gt;–&lt;/b&gt;GPG su base annua&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;Valori ipotetici, scelti per dare circa 5% orario e circa 12% annuo. &lt;span class=&quot;calc&quot;&gt;calcolo&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;Perché un GPG basso non significa per forza più parità&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;Il GPG si calcola solo su chi lavora. Se lavorano relativamente poche donne, e soprattutto quelle con più istruzione, il salario medio femminile osservato è più alto di quanto sarebbe con tutte le donne al lavoro. Si chiama &lt;dfn class=&quot;t&quot;&gt;selection effect&lt;/dfn&gt; (effetto selezione).&lt;/p&gt;
&lt;p&gt;Olivetti e Petrongolo (2008) trovano che la correzione per selezione spiega quasi metà della correlazione negativa tra wage gap ed employment gap, con effetti sensibili nei paesi dell&#x27;Europa meridionale &lt;a class=&quot;ext&quot; href=&quot;https://econpapers.repec.org/RePEc:ucp:jlabec:v:26:y:2008:i:4:p:621-654&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;. La fonte consultata non dà un dato specifico sull&#x27;Italia.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Dati più recenti e legge italiana&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;Il 15% EU della slide non è l&#x27;ultimo dato: per il 2023 Eurostat riporta circa 12,0% nella EU, considerando le imprese con almeno 10 dipendenti &lt;a class=&quot;ext&quot; href=&quot;https://ec.europa.eu/eurostat/statistics-explained/index.php/Gender_pay_gap_statistics&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;. Controlla lì anche il dato italiano aggiornato, che non ho trovato.&lt;/p&gt;
&lt;p&gt;La slide cita una nuova legge dell&#x27;autunno 2021 senza nominarla. Dovrebbe trattarsi della &lt;strong&gt;Legge 162/2021&lt;/strong&gt;, che modifica il Codice delle pari opportunità e crea la certificazione della parità di genere per le imprese &lt;a class=&quot;ext&quot; href=&quot;https://ntplusdiritto.ilsole24ore.com/art/in-gazzetta-legge-parita-salariale-uomo-donna-AEKzGAy&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Le donne sono 93% degli education professionals, ma solo il 12,7% delle occupate lavora in education. Si contraddicono?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. La prima percentuale descrive chi compone una professione. La seconda descrive dove lavorano le donne. Hanno denominatori diversi, e riguardano anche ambiti diversi: EU la prima, Italia la seconda.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Glass ceiling e sticky floor: in che cosa differiscono?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il glass ceiling blocca l&#x27;accesso ai vertici. Lo sticky floor trattiene in basso, in lavori poco pagati e con poca mobilità. Il primo riguarda soprattutto chi è già salita di livello, il secondo chi non riesce a salire.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Hourly GPG 5%: cosa accade al divario annuo se le donne lavorano meno ore?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Aumenta. Il rapporto dei salari annui è (F/M orario) × (ore F/ore M). Con 0,95 × 35/38 ≈ 0,875, il divario annuo è circa 12,5%.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Come si calcola lo score dell&#x27;indicatore “women in parliament” partendo da 35,7 e 64,3?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;35,7 / 64,3 ≈ 0,555, che è lo score nella tabella.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;s3&quot;&gt;
&lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;
&lt;h2&gt;Oltre le statistiche: i values surveys&lt;/h2&gt;
&lt;p class=&quot;big&quot;&gt;Gli indici misurano la struttura di una società. I survey fanno emergere la cultura che la sostiene o la cambia, e le due dimensioni si influenzano a vicenda.&lt;/p&gt;

&lt;h3&gt;Structural aspects e cultural orientations&lt;/h3&gt;
&lt;p&gt;I progressi sono spesso monitorati con indici basati su statistiche oggettive che riguardano gli &lt;dfn class=&quot;t&quot;&gt;structural aspects&lt;/dfn&gt; (aspetti strutturali: leggi, occupazione, redditi). Le &lt;dfn class=&quot;t&quot;&gt;cultural orientations&lt;/dfn&gt; (il complesso prevalente di valori, norme e credenze) restano invece spesso trascurate, benché siano in relazione interattiva con i contesti strutturali e plasmino credenze e comportamenti individuali &lt;span class=&quot;src&quot;&gt;slide p. 14&lt;/span&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;chart&quot; viewBox=&quot;0 0 480 210&quot; role=&quot;img&quot; aria-label=&quot;Ciclo: i contesti strutturali influenzano gli orientamenti culturali e viceversa; gli indici misurano i primi, i values surveys i secondi.&quot;&gt;
&lt;rect x=&quot;14&quot; y=&quot;52&quot; width=&quot;176&quot; height=&quot;96&quot; rx=&quot;10&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage);stroke-width:1.5&quot;/&gt;
&lt;rect x=&quot;290&quot; y=&quot;52&quot; width=&quot;176&quot; height=&quot;96&quot; rx=&quot;10&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate);stroke-width:1.5&quot;/&gt;
&lt;g text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;
&lt;text class=&quot;serif&quot; x=&quot;102&quot; y=&quot;88&quot; font-size=&quot;19&quot;&gt;Struttura&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;110&quot;&gt;leggi, lavoro, redditi,&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;128&quot;&gt;servizi di cura&lt;/text&gt;
&lt;text class=&quot;serif&quot; x=&quot;378&quot; y=&quot;88&quot; font-size=&quot;19&quot;&gt;Cultura&lt;/text&gt;&lt;text x=&quot;378&quot; y=&quot;110&quot;&gt;valori, norme,&lt;/text&gt;&lt;text x=&quot;378&quot; y=&quot;128&quot;&gt;credenze&lt;/text&gt;
&lt;text x=&quot;240&quot; y=&quot;44&quot;&gt;le politiche orientano&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;60&quot;&gt;le aspettative&lt;/text&gt;
&lt;text x=&quot;240&quot; y=&quot;162&quot;&gt;i valori rendono possibili&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;178&quot;&gt;(o frenano) le riforme&lt;/text&gt;
&lt;text x=&quot;102&quot; y=&quot;34&quot; style=&quot;fill:var(--sage)&quot; font-weight=&quot;600&quot;&gt;si misura con indici&lt;/text&gt;
&lt;text x=&quot;378&quot; y=&quot;34&quot; style=&quot;fill:var(--slate)&quot; font-weight=&quot;600&quot;&gt;si misura con survey&lt;/text&gt;
&lt;/g&gt;
&lt;path d=&quot;M194 76Q240 62 286 76&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke:var(--muted);stroke-width:1.7;fill:none&quot;/&gt;
&lt;path d=&quot;M286 124Q240 138 194 124&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke:var(--muted);stroke-width:1.7;fill:none&quot;/&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Gli esempi dentro i riquadri e sulle frecce sono didattici. La relazione interattiva è nella slide p. 14.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;Esempi di &lt;dfn class=&quot;t&quot;&gt;population representative surveys&lt;/dfn&gt; (indagini su campioni rappresentativi della popolazione) citati nella slide: &lt;strong&gt;Eurobarometer&lt;/strong&gt;, &lt;strong&gt;International Social Survey Programme (ISSP)&lt;/strong&gt;, &lt;strong&gt;European Values Study (EVS)&lt;/strong&gt; e &lt;strong&gt;World Values Survey (WVS)&lt;/strong&gt; &lt;span class=&quot;src&quot;&gt;slide p. 14&lt;/span&gt;.&lt;/p&gt;

&lt;h3&gt;Due livelli di lettura&lt;/h3&gt;
&lt;p&gt;Lo stesso questionario informa su due piani &lt;span class=&quot;src&quot;&gt;slide p. 15&lt;/span&gt;:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Livello individuale&lt;/h4&gt;&lt;p&gt;Gli &lt;em&gt;individual gender equality values&lt;/em&gt; motivano la ricerca di uguaglianza nella vita quotidiana. Sono il fattore esplicativo più rilevante della distribuzione diseguale di paid e unpaid work (Davis &amp;amp; Greenstein, 2009).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Livello aggregato&lt;/h4&gt;&lt;p&gt;Le risposte sommate permettono di studiare le &lt;dfn class=&quot;t&quot;&gt;gender cultures&lt;/dfn&gt; (le idee condivise in una società su genere e ruoli) e di integrare i macro-indicatori (Lomazzi &amp;amp; Crespi, 2019; Pfau-Effinger, 1998).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Gli strumenti in EVS/WVS&lt;/h3&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Strumenti&quot;&gt;
&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Principle&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Gender role attitudes&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Moral norms&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Principle of gender equality&lt;/strong&gt; &lt;span class=&quot;src&quot;&gt;slide p. 16&lt;/span&gt;. Tre item osservano il principio in contesti diversi:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Democrazia:&lt;/strong&gt; quanto “women have the same rights as men” è una caratteristica essenziale della democrazia.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Lavoro:&lt;/strong&gt; “When jobs are scarce, men have more right to a job than women”.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Coppia:&lt;/strong&gt; “share the household chores” tra gli elementi importanti di un matrimonio o di una relazione riuscita.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Gender role attitudes (GRA)&lt;/strong&gt; &lt;span class=&quot;src&quot;&gt;slide p. 16&lt;/span&gt;: credenze su quali ruoli sociali siano appropriati per uomini e donne, soprattutto nella divisione di paid labor, childcare e housework, in base a una separazione di compiti per genere (Davis &amp;amp; Greenstein, 2009; Grunow et al., 2018; Lee et al., 2010).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Moral norms&lt;/strong&gt; &lt;span class=&quot;src&quot;&gt;slide p. 16&lt;/span&gt;: qui si indaga la justification of domestic violence against women (giustificazione della violenza domestica contro le donne).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Come si misurano le GRA&lt;/h3&gt;
&lt;p&gt;Gli item usano una scala a 4 punti (1 agree strongly, 2 agree, 3 disagree, 4 strongly disagree). Poiché tutti esprimono una posizione tradizionale, il punteggio viene invertito: valori più alti indicano maggiore traditionalism &lt;span class=&quot;src&quot;&gt;slide p. 17&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;punteggio invertito = 5 − risposta &amp;nbsp;&amp;nbsp;(1→4, 2→3, 3→2, 4→1)&lt;/div&gt;
&lt;p&gt;Il laboratorio qui sotto usa un &lt;strong&gt;rispondente fittizio&lt;/strong&gt;: non chiede la tua opinione e non salva nulla.&lt;/p&gt;
&lt;figure&gt;
&lt;div class=&quot;seg&quot; id=&quot;grapre&quot; role=&quot;group&quot; aria-label=&quot;Profili fittizi&quot;&gt;&lt;/div&gt;
&lt;div id=&quot;graitems&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;outs&quot;&gt;&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;graD&quot;&gt;–&lt;/b&gt;GRA domestic&lt;/div&gt;&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;graP&quot;&gt;–&lt;/b&gt;GRA public (media)&lt;/div&gt;&lt;div class=&quot;out&quot;&gt;&lt;b id=&quot;graL&quot;&gt;–&lt;/b&gt;labor market&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;Scala da 1 (egalitarian) a 4 (traditional) dopo l&#x27;inversione. La suddivisione degli item è quella della slide p. 17. &lt;span class=&quot;calc&quot;&gt;calcolo&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;Il profilo “misto” mostra un punto discusso in letteratura: Grunow, Begall e Buchler (2018) sostengono che una sola scala da traditional a egalitarian è problematica, e con dati EVS 2008 trovano cinque profili, tra cui &lt;em&gt;egalitarian essentialism&lt;/em&gt; e &lt;em&gt;intensive parenting&lt;/em&gt; &lt;a class=&quot;ext&quot; href=&quot;https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5817238/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;

&lt;h3&gt;La giustificazione della violenza contro le donne&lt;/h3&gt;
&lt;p&gt;Le &lt;dfn class=&quot;t&quot;&gt;moral norms&lt;/dfn&gt; sono standard usati per valutare i comportamenti personali e quindi guidano la condotta; alla base ci sono le idee di fairness e justice (De Waal and de Waal, 1996) &lt;span class=&quot;src&quot;&gt;slide p. 18&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;La domanda del WVS chiede se “a man beating his wife” possa essere sempre giustificato, mai, o una via di mezzo, su una scala da &lt;strong&gt;1 (never justifiable)&lt;/strong&gt; a &lt;strong&gt;10 (always justifiable)&lt;/strong&gt; &lt;span class=&quot;src&quot;&gt;slide p. 18&lt;/span&gt;. VAW sta per &lt;em&gt;violence against women&lt;/em&gt;.&lt;/p&gt;
&lt;p&gt;Il confronto tra paesi viene dallo studio di Lomazzi (2023), che analizza norme individuali e istituzionali in 12 paesi &lt;a class=&quot;ext&quot; href=&quot;https://www.mdpi.com/2076-0760/12/3/117&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;. Sulla scala &lt;dfn class=&quot;t&quot;&gt;SIGI&lt;/dfn&gt; (Social Institutions and Gender Index, OECD), 100 significa massima discriminazione &lt;span class=&quot;src&quot;&gt;slide p. 19&lt;/span&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;div class=&quot;seg&quot; id=&quot;scbtn&quot; role=&quot;group&quot; aria-label=&quot;Variabile sull&#x27;asse orizzontale&quot;&gt;&lt;/div&gt;
&lt;div id=&quot;scchart&quot;&gt;&lt;/div&gt;
&lt;figcaption id=&quot;sccap&quot;&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;details open&gt;&lt;summary&gt;La tabella dei 12 paesi (tocca un&#x27;intestazione per ordinare)&lt;/summary&gt;&lt;div&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;vt&quot;&gt;&lt;thead&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p style=&quot;font-size:.85rem;color:var(--muted);margin-top:.6rem&quot;&gt;&lt;span class=&quot;src&quot;&gt;slide p. 19&lt;/span&gt; Istanbul Convention: s = firma, r = ratifica, e = entrata in vigore, w = ritiro. “Gap” è %F − %M: un valore positivo indica che le donne respingono la violenza più degli uomini. “IPV” è la lifetime physical and/or sexual intimate partner violence (%).&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Come leggere bene questi dati&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;In tutti e 12 i paesi il gap è positivo: la condanna è più diffusa tra le donne.&lt;/li&gt;
&lt;li&gt;Una forte condanna non implica poca violenza dichiarata: la Germania ha 95,7% e IPV 22%.&lt;/li&gt;
&lt;li&gt;La violenza dichiarata dipende anche dalla disponibilità a riconoscerla e riferirla, e 11 paesi con dati non bastano per conclusioni causali.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché gli indici strutturali non bastano?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché non colgono i valori che orientano i comportamenti. Una legge può esistere senza essere socialmente accettata, e le norme culturali possono frenare o sostenere il cambiamento strutturale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un rispondente sceglie 2 (agree) su “Men make better political leaders”. Che punteggio ottiene e cosa significa?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;5 − 2 = 3. È sopra il centro scala di 2,5: indica un orientamento tendenzialmente tradizionale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra individual level e aggregate level?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il primo spiega i comportamenti delle persone, per esempio la divisione dei lavori di cura. Il secondo descrive la gender culture di una società e si affianca ai macro-indicatori.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché l&#x27;item “When jobs are scarce” compare in un blocco a parte?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché riguarda un principio di equal rights nel labor market, oltre che i ruoli. La slide p. 17 lo tiene distinto da domestic e public domain.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p-brick&quot; id=&quot;s4&quot;&gt;
&lt;div class=&quot;num&quot;&gt;4&lt;/div&gt;
&lt;h2&gt;International platforms&lt;/h2&gt;
&lt;p class=&quot;big&quot;&gt;L&#x27;uguaglianza di genere è un obiettivo globale, costruito in decenni di trattati e strategie. Un testo però produce effetti solo se gli stati lo accettano davvero e lo applicano.&lt;/p&gt;

&lt;h3&gt;Quanto manca, al ritmo attuale&lt;/h3&gt;
&lt;div class=&quot;yrs&quot; aria-label=&quot;Anni stimati per raggiungere ciascun obiettivo&quot;&gt;
&lt;div class=&quot;yr&quot;&gt;&lt;span&gt;Porre fine ai child marriage (matrimoni precoci)&lt;/span&gt;&lt;b&gt;300&lt;/b&gt;&lt;div class=&quot;bar&quot; style=&quot;width:100%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;yr&quot;&gt;&lt;span&gt;Colmare le lacune di legal protection e togliere le leggi discriminatorie&lt;/span&gt;&lt;b&gt;286&lt;/b&gt;&lt;div class=&quot;bar&quot; style=&quot;width:95.3%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;yr&quot;&gt;&lt;span&gt;Pari rappresentanza nelle posizioni di potere e leadership sul lavoro&lt;/span&gt;&lt;b&gt;140&lt;/b&gt;&lt;div class=&quot;bar&quot; style=&quot;width:46.7%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;yr&quot;&gt;&lt;span&gt;Pari rappresentanza nei parlamenti nazionali&lt;/span&gt;&lt;b&gt;47&lt;/b&gt;&lt;div class=&quot;bar&quot; style=&quot;width:15.7%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Anni stimati &lt;span class=&quot;src&quot;&gt;slide p. 20&lt;/span&gt;. La slide non indica la fonte: 286 e 140 anni compaiono nelle cronache sul &lt;em&gt;Gender Snapshot 2022&lt;/em&gt; &lt;a class=&quot;ext&quot; href=&quot;https://www.downtoearth.org.in/news/it-will-take-3-centuries-to-close-gender-gap-completely-warns-un-84782&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;. Per i 47 anni non ho trovato conferma nelle fonti consultate.&lt;/p&gt;
&lt;p&gt;Servono leadership politica, investimenti e riforme ampie contro le barriere sistemiche. Il Goal 5 è un &lt;dfn class=&quot;t&quot;&gt;cross-cutting objective&lt;/dfn&gt; (obiettivo trasversale): deve entrare in politiche, bilanci e istituzioni nazionali &lt;span class=&quot;src&quot;&gt;slide p. 20&lt;/span&gt;.&lt;/p&gt;

&lt;h3&gt;Una linea del tempo&lt;/h3&gt;
&lt;figure&gt;&lt;div id=&quot;tl&quot;&gt;&lt;/div&gt;&lt;div class=&quot;box&quot; id=&quot;tlp&quot; style=&quot;margin-bottom:0&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;figcaption&gt;Punti equidistanti, non in scala. Tocca un anno.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3 id=&quot;cedaw&quot;&gt;CEDAW&lt;/h3&gt;
&lt;p&gt;La &lt;dfn class=&quot;t&quot;&gt;CEDAW&lt;/dfn&gt; (Convention on the Elimination of All Forms of Discrimination against Women) è del 1979. È il trattato internazionale più importante per la legislazione sulla gender equality, e copre diritti di famiglia, eredità e proprietà della terra, lavoro e istruzione, rappresentanza politica, libertà di movimento e altro &lt;span class=&quot;src&quot;&gt;slide p. 22&lt;/span&gt;. Il testo ufficiale è sul &lt;a class=&quot;ext&quot; href=&quot;https://www.un.org/womenwatch/daw/cedaw/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sito ONU&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;La slide indica 189 paesi, alcuni con &lt;dfn class=&quot;t&quot;&gt;reservations&lt;/dfn&gt;. Una reservation è una dichiarazione con cui uno stato accetta il trattato ma esclude o limita certe clausole per sé. La CEDAW vieta quelle incompatibili con l&#x27;oggetto e lo scopo del trattato (art. 28.2), mentre consente espressamente quelle sull&#x27;art. 29.1, cioè sull&#x27;arbitrato per le controversie &lt;a class=&quot;ext&quot; href=&quot;https://www.un.org/unispal/?p=205832&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Reservations per paese&quot;&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Kuwait 1994&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Libya 1989&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Lebanon 1997&lt;/button&gt;&lt;button role=&quot;tab&quot; type=&quot;button&quot;&gt;Morocco 1993&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Art. 9(2):&lt;/strong&gt; pari diritti su cittadinanza propria e dei figli.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Art. 16(f):&lt;/strong&gt; pari diritti nel matrimonio e nella famiglia.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Art. 29(1):&lt;/strong&gt; arbitrato in caso di controversia.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Art. 2:&lt;/strong&gt; misure politiche, cioè l&#x27;impegno a inserire la gender equality nella legge nazionale.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Art. 16:&lt;/strong&gt; pari diritti nel matrimonio e nella famiglia.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Art. 9(2):&lt;/strong&gt; cittadinanza propria e dei figli.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Art. 16(1)(c)(d)(f)(g):&lt;/strong&gt; pari diritti nel matrimonio e nella famiglia.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Art. 29(1):&lt;/strong&gt; arbitrato.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Art. 2:&lt;/strong&gt; misure politiche.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Art. 15(4):&lt;/strong&gt; capacità giuridica e libertà di movimento.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Art. 29:&lt;/strong&gt; arbitrato.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;Le reservations sono state formalmente ritirate nel 2011.&lt;/strong&gt; Quindi possono cambiare nel tempo.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p style=&quot;font-size:.9rem;color:var(--muted)&quot;&gt;&lt;span class=&quot;src&quot;&gt;slide p. 23&lt;/span&gt; Estratto da un capitolo di V. Lomazzi su diritti delle donne e Shari&#x27;a nell&#x27;area MENA (Middle East and North Africa). Noterai che ricorrono famiglia e cittadinanza: è lì che le norme culturali e religiose pesano di più sulla legge.&lt;/p&gt;

&lt;h3&gt;Gender mainstreaming&lt;/h3&gt;
&lt;p&gt;Il &lt;dfn class=&quot;t&quot;&gt;gender mainstreaming (GM)&lt;/dfn&gt; è una strategia: invece di trattare il genere in una politica separata, lo si considera in tutte le politiche. È una prospettiva globale dalla conferenza ONU del 1995, mentre la prima conferenza mondiale sul tema risale al 1975 &lt;span class=&quot;src&quot;&gt;slide p. 24&lt;/span&gt;. La definizione classica dell&#x27;ECOSOC parla di valutare le implicazioni per donne e uomini di ogni azione pianificata, in tutti i settori; non sostituisce le politiche mirate alle donne &lt;a class=&quot;ext&quot; href=&quot;https://www.un.org/womenwatch/osagi/pdf/e65237.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;Nella EU il GM è la prima strategia transnazionale dal 1997 con il Trattato di Amsterdam. La gender equality è tra i valori dell&#x27;Unione e nella Charter of Fundamental Rights. Si è sviluppata con norme, raccomandazioni e action plan quadriennali, incide sulla legislazione degli stati membri (MS) e dei candidati, e riguarda politiche interne e cooperazione esterna &lt;span class=&quot;src&quot;&gt;slide p. 24&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;EIGE lo applica a ogni fase del ciclo delle politiche &lt;a class=&quot;ext&quot; href=&quot;https://eige.europa.eu/publications-resources/publications/what-gender-mainstreaming&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;. Scorri le fasi, seguendo un esempio inventato: un bando comunale per nuove imprese.&lt;/p&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Preparation&lt;/h4&gt;&lt;p&gt;Si raccolgono dati per sesso: chi avvia imprese in città, in quali settori, con quali ostacoli di credito e cura.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Design&lt;/h4&gt;&lt;p&gt;I criteri del bando tengono conto dei dati. Un punteggio legato solo al capitale iniziale potrebbe sfavorire chi ha meno risorse.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Implementation&lt;/h4&gt;&lt;p&gt;Le informazioni raggiungono anche i settori più femminilizzati, e le scadenze sono compatibili con chi ha carichi di cura.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · Monitoring&lt;/h4&gt;&lt;p&gt;Durante il bando si controlla chi presenta domanda e chi ottiene fondi, separando i dati per sesso.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;5 · Evaluation&lt;/h4&gt;&lt;p&gt;Alla fine si valuta l&#x27;effetto su donne e uomini. I risultati orientano il bando successivo, e il ciclo ricomincia.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Istanbul Convention&lt;/h3&gt;
&lt;p&gt;È il trattato sui diritti umani del Council of Europe per prevenire e combattere la violenza contro le donne e la domestic violence. Definisce la violenza contro le donne come una &lt;strong&gt;violation of human rights&lt;/strong&gt;. È il primo strumento completo e giuridicamente vincolante per prevenire la violenza, proteggere le vittime e porre fine all&#x27;impunità &lt;span class=&quot;src&quot;&gt;slide p. 25&lt;/span&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;chart&quot; viewBox=&quot;0 0 480 110&quot; role=&quot;img&quot; aria-label=&quot;Sequenza: firma, ratifica, entrata in vigore; solo con le ultime due l&#x27;adesione è pienamente attiva.&quot;&gt;
&lt;path d=&quot;M60 40H420&quot; style=&quot;stroke:var(--rule);stroke-width:4&quot;/&gt;&lt;path d=&quot;M240 40H420&quot; style=&quot;stroke:var(--brick);stroke-width:4&quot;/&gt;
&lt;g text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;&lt;circle cx=&quot;60&quot; cy=&quot;40&quot; r=&quot;15&quot; style=&quot;fill:var(--card);stroke:var(--brick);stroke-width:3&quot;/&gt;&lt;circle cx=&quot;240&quot; cy=&quot;40&quot; r=&quot;15&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick);stroke-width:3&quot;/&gt;&lt;circle cx=&quot;420&quot; cy=&quot;40&quot; r=&quot;15&quot; style=&quot;fill:var(--brick)&quot;/&gt;
&lt;text x=&quot;60&quot; y=&quot;76&quot; font-weight=&quot;600&quot;&gt;Signature&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;94&quot;&gt;volontà politica&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;76&quot; font-weight=&quot;600&quot;&gt;Ratification&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;94&quot;&gt;consenso a vincolarsi&lt;/text&gt;&lt;text x=&quot;420&quot; y=&quot;76&quot; font-weight=&quot;600&quot;&gt;Entry into force&lt;/text&gt;&lt;text x=&quot;420&quot; y=&quot;94&quot;&gt;adesione attiva&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Vale, dice la slide p. 25, come per la CEDAW: firmare non basta. Slovakia è ferma alla firma del 2011, Germany arriva all&#x27;entrata in vigore nel 2018 &lt;span class=&quot;src&quot;&gt;slide p. 19&lt;/span&gt;.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;Aperta alla firma dal 2011, impone agli stati di agire su più fronti &lt;span class=&quot;src&quot;&gt;slide p. 25-26&lt;/span&gt;: legislazione e prosecution dei responsabili, protezione delle vittime, shelters e servizi, helpline. L&#x27;attuazione è controllata dal gruppo di esperti indipendenti &lt;dfn class=&quot;t&quot;&gt;GREVIO&lt;/dfn&gt; &lt;a class=&quot;ext&quot; href=&quot;https://www.coe.int/web/istanbul-convention/grevio&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;. La Türkiye è uscita dal trattato dal 1° luglio 2021 &lt;a class=&quot;ext&quot; href=&quot;https://www.coe.int/en/web/istanbul-convention/turkey&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Un effetto concreto: il 1522&lt;/h4&gt;&lt;p&gt;Se in Italia esiste una helpline attiva 24/7, è soprattutto per l&#x27;attuazione della Convention &lt;span class=&quot;src&quot;&gt;slide p. 26&lt;/span&gt;. Il &lt;strong&gt;1522&lt;/strong&gt; è un servizio pubblico promosso dalla Presidenza del Consiglio, Dipartimento per le Pari Opportunità: è gratuito, attivo 24 ore su 24 e risponde con personale specializzato alle vittime di violenza e stalking &lt;span class=&quot;src&quot;&gt;slide p. 27&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;Se serve a te o a qualcuno che conosci, si può chiamare il 1522 o usare la chat su &lt;a href=&quot;https://www.1522.eu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;1522.eu&lt;/a&gt; &lt;a class=&quot;ext&quot; href=&quot;https://www.ufficiostampa.provincia.tn.it/Rubrica-Contro-la-violenza-sulle-donne/A-chi-rivolgerti-se-hai-bisogno-di-aiuto/1522-Numero-antiviolenza-e-stalking&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra firmare e ratificare?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;La firma esprime una volontà politica. La ratifica rende lo stato vincolato, e l&#x27;adesione è pienamente attiva con l&#x27;entrata in vigore. Armenia, Czechia e Slovakia, nella tabella, hanno solo firmato.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché una reservation all&#x27;art. 2 della CEDAW è più grave di una all&#x27;art. 29?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;L&#x27;art. 2 riguarda l&#x27;impegno a recepire l&#x27;uguaglianza nella legge nazionale, quindi tocca lo scopo del trattato. L&#x27;art. 29 riguarda l&#x27;arbitrato sulle controversie, e la Convention ammette espressamente una reservation su questo punto.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Gender mainstreaming e politiche per le donne si escludono?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Il GM integra il genere in tutte le politiche, ma non sostituisce le azioni mirate: i due approcci si affiancano.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa ha di speciale la Istanbul Convention rispetto a una dichiarazione di principi?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;È giuridicamente vincolante per chi la ratifica e impone misure concrete: legislazione, protezione, servizi e helpline. Il 1522 è un esempio di ricaduta nazionale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s5&quot;&gt;
&lt;div class=&quot;num&quot;&gt;5&lt;/div&gt;
&lt;h2&gt;SDG5: come stanno andando le cose?&lt;/h2&gt;
&lt;p class=&quot;big&quot;&gt;“Una bambina nata oggi dovrà aspettare il suo 97° compleanno, oltre la propria aspettativa di vita, per festeggiare una società paritaria.” &lt;span class=&quot;src&quot;&gt;slide p. 28&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Che cos&#x27;è SDG5&lt;/h3&gt;
&lt;p&gt;Il &lt;dfn class=&quot;t&quot;&gt;Sustainable Development Goal 5&lt;/dfn&gt; è il quinto dei 17 obiettivi dell&#x27;ONU per il 2030. Chiede di raggiungere la gender equality e l&#x27;&lt;dfn class=&quot;t&quot;&gt;empowerment&lt;/dfn&gt; (acquisizione di potere e autonomia) di donne e ragazze. Ha nove target &lt;a class=&quot;ext&quot; href=&quot;https://en.wikipedia.org/wiki/Sustainable_Development_Goal_5&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;. Le slide non li elencano, quindi qui sono parafrasati.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;I nove target di SDG5 &lt;span class=&quot;ext&quot; style=&quot;cursor:default&quot;&gt;fonte esterna&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;5.1&lt;/strong&gt; Fine di ogni discriminazione contro donne e ragazze.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;5.2&lt;/strong&gt; Eliminazione della violenza, in pubblico e in privato, inclusi tratta e sfruttamento.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;5.3&lt;/strong&gt; Eliminazione di pratiche dannose: matrimoni precoci e forzati, mutilazioni genitali.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;5.4&lt;/strong&gt; Riconoscimento del lavoro di cura e domestico non pagato, con servizi e responsabilità condivisa.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;5.5&lt;/strong&gt; Piena partecipazione e pari opportunità di leadership nelle decisioni.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;5.6&lt;/strong&gt; Accesso universale a salute e diritti sessuali e riproduttivi.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;5.a&lt;/strong&gt; Pari diritti su risorse economiche, terra e proprietà.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;5.b&lt;/strong&gt; Uso della tecnologia, in particolare ICT, per l&#x27;empowerment.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;5.c&lt;/strong&gt; Politiche e leggi applicabili per la gender equality a tutti i livelli.&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Testi: &lt;a href=&quot;https://sdgdata.gov.uk/5&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SDG data UK&lt;/a&gt; e &lt;a href=&quot;https://turkiye.un.org/en/sdgs/5&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ONU Türkiye&lt;/a&gt;. Per la formulazione ufficiale controlla il sito ONU degli SDG.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;L&#x27;SDG Gender Index&lt;/h3&gt;
&lt;p&gt;L&#x27;indice, curato dalla partnership &lt;dfn class=&quot;t&quot;&gt;Equal Measures 2030&lt;/dfn&gt;, assegna a ogni paese un punteggio da 0 a 100. Il bilancio delle slide &lt;span class=&quot;src&quot;&gt;slide p. 29-30&lt;/span&gt;:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Il quadro&lt;/h4&gt;&lt;ul style=&quot;margin:0&quot;&gt;&lt;li&gt;&lt;strong&gt;Little progress&lt;/strong&gt; globale tra 2015 e 2020.&lt;/li&gt;&lt;li&gt;Con questi trend, il punteggio globale arriverà solo a &lt;strong&gt;71/100 nel 2030&lt;/strong&gt;.&lt;/li&gt;&lt;li&gt;Stima forse ottimista, per l&#x27;impatto del COVID-19.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;I paesi&lt;/h4&gt;&lt;ul style=&quot;margin:0&quot;&gt;&lt;li&gt;Meno di un quarto fa &lt;em&gt;fast progress&lt;/em&gt;.&lt;/li&gt;&lt;li&gt;Un terzo è fermo o va nella direzione sbagliata.&lt;/li&gt;&lt;li&gt;Più di metà va nella direzione giusta.&lt;/li&gt;&lt;li&gt;Nel 2020, oltre 3 miliardi di donne e ragazze vivevano in paesi con punteggio &lt;em&gt;poor&lt;/em&gt; o &lt;em&gt;very poor&lt;/em&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Il global score era 67,8 nel 2020, e il report stima la parità solo intorno al 2108 &lt;a class=&quot;ext&quot; href=&quot;https://equalmeasures2030.org/publications/2022-sdg-gender-index-report/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;

&lt;h3&gt;Livello e direzione: la matrice&lt;/h3&gt;
&lt;p&gt;La matrice incrocia dove si trova un paese (colonne) e dove sta andando (righe). Così si capisce che un punteggio alto non garantisce progresso, e viceversa. Tocca una casella per vedere i paesi &lt;span class=&quot;src&quot;&gt;slide p. 33&lt;/span&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;div class=&quot;matrix&quot; id=&quot;mx&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot; id=&quot;mxp&quot; aria-live=&quot;polite&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;outs&quot;&gt;&lt;div class=&quot;out&quot;&gt;&lt;b&gt;20,7%&lt;/b&gt;fast progress (28/135)&lt;/div&gt;&lt;div class=&quot;out&quot;&gt;&lt;b&gt;32,6%&lt;/b&gt;no progress o decline (44/135)&lt;/div&gt;&lt;div class=&quot;out&quot;&gt;&lt;b&gt;67,4%&lt;/b&gt;fast o some progress (91/135)&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;Le percentuali coincidono con le frasi della slide p. 30. &lt;span class=&quot;calc&quot;&gt;calcolo&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;La mappa e i casi estremi&lt;/h3&gt;
&lt;p&gt;La mappa della &lt;span class=&quot;src&quot;&gt;slide p. 31&lt;/span&gt; mostra il punteggio 2020. In sintesi: Paesi nordici &lt;em&gt;very good&lt;/em&gt; o &lt;em&gt;good&lt;/em&gt;, gran parte dell&#x27;Europa occidentale e l&#x27;Australia &lt;em&gt;good&lt;/em&gt;; Russia, Cina, India e Brasile &lt;em&gt;poor&lt;/em&gt;; molta parte dell&#x27;Africa subsahariana e alcuni paesi dell&#x27;Asia meridionale e occidentale &lt;em&gt;very poor&lt;/em&gt;.&lt;/p&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Maggiore miglioramento&lt;/th&gt;&lt;th&gt;Nessun cambiamento&lt;/th&gt;&lt;th&gt;Maggiore declino&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Benin +9,3 (53,7)&lt;/td&gt;&lt;td&gt;Sweden +0,1 (90,3)&lt;/td&gt;&lt;td&gt;Afghanistan −1,9 (38,2)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Saudi Arabia +8,6 (64,4)&lt;/td&gt;&lt;td&gt;Colombia −0,1 (66,8)&lt;/td&gt;&lt;td&gt;Algeria −1,3 (64,3)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Nepal +6,7 (64,2)&lt;/td&gt;&lt;td&gt;Bolivia +0,1 (63,2)&lt;/td&gt;&lt;td&gt;Belarus −1,3 (72,3)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Armenia +6,7 (74,3)&lt;/td&gt;&lt;td&gt;Iceland +0,1 (89)&lt;/td&gt;&lt;td&gt;Kuwait −1,3 (64,9)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Egypt +5,8 (62,4)&lt;/td&gt;&lt;td&gt;Lebanon +0,1 (58,2)&lt;/td&gt;&lt;td&gt;Ecuador −1,1 (68,7)&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p style=&quot;font-size:.9rem;color:var(--muted);margin-top:.5rem&quot;&gt;&lt;span class=&quot;src&quot;&gt;slide p. 32&lt;/span&gt; Variazione e, tra parentesi, punteggio. Per Lebanon la slide scrive “0,1”.&lt;/p&gt;
&lt;p&gt;Chi migliora di più spesso parte da livelli bassi, e chi non cambia può stare in cima (Sweden) o in basso (Lebanon). Ecco perché servono entrambe le dimensioni.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Che cosa dice davvero l&#x27;edizione 2024 &lt;span class=&quot;ext&quot; style=&quot;cursor:default&quot;&gt;fonte esterna&lt;/span&gt;&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;L&#x27;edizione 2024, &lt;em&gt;A gender equal future in crisis?&lt;/em&gt;, copre 139 paesi con anni di riferimento 2015, 2019 e 2022. Con i trend attuali la parità non arriverebbe prima del XXII secolo. Tra 2019 e 2022, il 40% dei paesi è rimasto fermo o è regredito. Il primo paese è la Switzerland (90,1), l&#x27;ultimo l&#x27;Afghanistan (35,4). Fonte: &lt;a href=&quot;https://ruralindiaonline.org/en/library/resource/findings-from-the-2024-sdg-gender-index/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sintesi di PARI&lt;/a&gt;; l&#x27;originale è sul &lt;a href=&quot;https://equalmeasures2030.org/2024-sdg-gender-index/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sito EM2030&lt;/a&gt;, che non ho aperto.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Un paese può essere “good” e non progredire?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sì. Germany e Netherlands, per esempio, sono &lt;em&gt;good&lt;/em&gt; con &lt;em&gt;no progress&lt;/em&gt;. Livello e dinamica sono due cose distinte.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Dove si colloca l&#x27;Italia nella matrice?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;em&gt;Fair&lt;/em&gt; per livello e &lt;em&gt;some progress&lt;/em&gt; per direzione.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Saudi Arabia +8,6 fa di questo paese un modello di parità?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Il punteggio resta 64,4, quindi &lt;em&gt;poor&lt;/em&gt;. Una grande variazione può nascere da un punto di partenza basso.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché SDG5 viene detto cross-cutting?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché non è un settore a sé: riguarda tutte le politiche, i bilanci e le istituzioni nazionali. Ricorda la logica del gender mainstreaming.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part p-slate&quot; id=&quot;s6&quot;&gt;
&lt;div class=&quot;num&quot;&gt;6&lt;/div&gt;
&lt;h2&gt;Intersectionality&lt;/h2&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;strong&gt;Solo in agenda.&lt;/strong&gt; La slide p. 3 annuncia intersectionality, poverty e migration background, ma il PDF si chiude a p. 33 senza svilupparli. Tutta questa parte è quindi un&#x27;integrazione da fonti esterne e non riflette ciò che è stato detto a lezione: cerca il materiale specifico o i tuoi appunti.&lt;/div&gt;
&lt;p&gt;Il termine &lt;dfn class=&quot;t&quot;&gt;intersectionality&lt;/dfn&gt; (intersezionalità) compare in un articolo di Kimberlé Crenshaw del 1989, sul caso di donne nere che i tribunali non lasciavano agire insieme per discriminazione di razza e sesso &lt;a class=&quot;ext&quot; href=&quot;https://www.britannica.com/story/what-is-intersectionality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;. La definizione attribuita a EIGE la descrive come strumento per analizzare come sesso e genere si intrecciano con altre caratteristiche personali, producendo esperienze specifiche di discriminazione &lt;a class=&quot;ext&quot; href=&quot;https://www.unescwa.org/sd-glossary/intersectionality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;L&#x27;idea di fondo: gli svantaggi non sempre si sommano e basta. L&#x27;incrocio può creare una situazione che un&#x27;analisi separata per ogni asse non vede. Anche l&#x27;Index 2025 tratta le disuguaglianze che si intersecano come lente trasversale &lt;a class=&quot;ext&quot; href=&quot;https://eige.europa.eu/about/projects/gender-equality-index-2025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;div class=&quot;seg&quot; id=&quot;vnbtn&quot; role=&quot;group&quot; aria-label=&quot;Combinazione&quot;&gt;&lt;/div&gt;
&lt;svg class=&quot;chart&quot; viewBox=&quot;0 0 480 290&quot; role=&quot;img&quot; aria-label=&quot;Tre cerchi sovrapposti: genere, poverty e migration background.&quot;&gt;
&lt;g style=&quot;stroke:var(--ink);stroke-width:1.4&quot;&gt;
&lt;circle id=&quot;vg&quot; cx=&quot;185&quot; cy=&quot;115&quot; r=&quot;92&quot; style=&quot;fill:var(--accent)&quot;/&gt;
&lt;circle id=&quot;vp&quot; cx=&quot;295&quot; cy=&quot;115&quot; r=&quot;92&quot; style=&quot;fill:var(--ochre)&quot;/&gt;
&lt;circle id=&quot;vm&quot; cx=&quot;240&quot; cy=&quot;190&quot; r=&quot;92&quot; style=&quot;fill:var(--slate)&quot;/&gt;
&lt;/g&gt;
&lt;g text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; style=&quot;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round&quot;&gt;&lt;text x=&quot;135&quot; y=&quot;88&quot;&gt;Genere&lt;/text&gt;&lt;text x=&quot;345&quot; y=&quot;88&quot;&gt;Poverty&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;258&quot;&gt;Migration&lt;/text&gt;&lt;text x=&quot;240&quot; y=&quot;276&quot;&gt;background&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;box&quot; id=&quot;vnp&quot; aria-live=&quot;polite&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Esempi didattici, non dati.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché una media sulle “donne” può ingannare?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché riunisce situazioni molto diverse. Una media può migliorare mentre peggiora la condizione di un sottogruppo, per esempio donne povere con background migratorio.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa aggiunge l&#x27;intersectionality a un&#x27;analisi che controlla separatamente genere e reddito?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Chiede se l&#x27;effetto del genere cambia secondo il reddito, e viceversa. In statistica questo si traduce spesso in termini di interazione o analisi per sottogruppi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s7&quot;&gt;
&lt;h2&gt;Controlli sulle slide&lt;/h2&gt;
&lt;p&gt;Ho riportato i dati così come sono nelle slide. Questi punti meritano una verifica a lezione o sul materiale originale.&lt;/p&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Dove&lt;/th&gt;&lt;th&gt;Che cosa ho notato&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;p. 3&lt;/td&gt;&lt;td&gt;Intersectionality, poverty e migration background sono in agenda, ma senza slide dedicate.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 7&lt;/td&gt;&lt;td&gt;Il link porta a &lt;code&gt;/FI/work&lt;/code&gt;, quindi alla Finlandia, mentre il grafico evidenzia l&#x27;Italia.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 4 e p. 13&lt;/td&gt;&lt;td&gt;La slide dell&#x27;Index europeo è ripetuta identica.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 11&lt;/td&gt;&lt;td&gt;La tabella WEF non indica il paese. Probabilmente è l&#x27;Italia, ma non ho trovato la conferma della riga completa.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 12&lt;/td&gt;&lt;td&gt;Il 15% EU sembra datato: Eurostat riporta circa 12,0% per il 2023.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 16&lt;/td&gt;&lt;td&gt;“Lee et al., 2010” non è stato trovato. Esiste un lavoro affine di Lee, Alwin e Tufiș del 2007: potrebbe essere un&#x27;altra opera o un refuso.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 18&lt;/td&gt;&lt;td&gt;“De Waal and de Waal, 1996”: ho trovato &lt;em&gt;Good Natured&lt;/em&gt; del 1996, a sola firma di Frans de Waal. Non ho potuto verificare il riferimento esatto.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 20&lt;/td&gt;&lt;td&gt;Le stime in anni sono senza fonte. Non ho trovato conferma dei 47 anni; una fonte divulgativa sul Gender Snapshot 2022 parla di almeno 40. Anche i 300 anni riferiti ai child marriage restano da verificare.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 22&lt;/td&gt;&lt;td&gt;“Signed by 189”: per coerenza con p. 25, conta la differenza tra firma e ratifica. Una fonte legata a UN Women parla di 189 ratifiche al 2013. Il nome ufficiale è &lt;em&gt;on the Elimination of All Forms of&lt;/em&gt;.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 26&lt;/td&gt;&lt;td&gt;“Legislation (persecution)” è verosimilmente &lt;em&gt;prosecution&lt;/em&gt;, cioè l&#x27;azione penale. Qui ho usato questo significato.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 28&lt;/td&gt;&lt;td&gt;Il dato dei 97 anni è senza fonte, e la ricerca web non l&#x27;ha rintracciata.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 30&lt;/td&gt;&lt;td&gt;Il titolo è “Report 2024”, con la copertina di quell&#x27;edizione, ma il testo coincide con l&#x27;edizione 2022 (2015-2020, oltre 3 miliardi). Anche il link di p. 32 porta al report 2022, e l&#x27;edizione 2024 usa anni e campione diversi.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;p. 33&lt;/td&gt;&lt;td&gt;La matrice somma 135 paesi, mentre l&#x27;indice 2022 ne copre 144. Le fonti che ho consultato non spiegano la differenza.&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part refs&quot; id=&quot;s8&quot;&gt;
&lt;h2&gt;Per approfondire&lt;/h2&gt;
&lt;p&gt;Autori, testi e siti citati nelle slide, con le aggiunte necessarie a capirli. Ogni voce è una &lt;span class=&quot;ext&quot; style=&quot;cursor:default&quot;&gt;fonte esterna&lt;/span&gt;, distinta dal contenuto delle slide. “Citato a p. N” indica dove compare nel PDF. Le descrizioni si basano su abstract, schede editoriali e risultati di ricerca: i testi completi non sono stati letti.&lt;/p&gt;

&lt;h3&gt;Studi e libri&lt;/h3&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.annualreviews.org/doi/10.1146/annurev-soc-070308-115920&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Davis &amp;amp; Greenstein (2009), Gender Ideology: Components, Predictors, and Consequences&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Annual Review of Sociology&lt;/em&gt; 35:87-105. Rassegna su come si misura la gender ideology, cosa la predice e quali effetti ha su famiglia e lavoro. Citato a p. 15-16.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la base per dire che i valori individuali spiegano la divisione di paid e unpaid work.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://bristoluniversitypress.co.uk/gender-mainstreaming-and-gender-equality-in-europe&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Lomazzi &amp;amp; Crespi (2019), Gender Mainstreaming and Gender Equality in Europe&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Policy Press. Origini e limiti del GM, confronto tra paesi con dati di survey, misurazione e gender cultures europee. Citato a p. 15.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: porta la firma di Vera Lomazzi, titolare di questo modulo, e unisce le parti 3 e 4 della lezione.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://data.gesis.org/gesiskg/resource/bibsonomy-pfaueffingerbirgit1998gender&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pfau-Effinger (1998), Gender Cultures and Gender Arrangement&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Innovation: The European Journal of Social Science Research&lt;/em&gt; 11:147-166. Quadro teorico per la ricerca comparata sul genere. Citato a p. 15.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: spiega perché confrontare i paesi richiede di guardare insieme cultura e istituzioni. Ho trovato solo la scheda bibliografica.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5817238/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Grunow, Begall &amp;amp; Buchler (2018), Gender Ideologies in Europe&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Journal of Marriage and Family&lt;/em&gt; 80(1):42-60, open access. Latent class analysis su EVS 2008 in otto paesi, con cinque profili ideologici. Citato a p. 16.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: mostra i limiti di una sola scala da traditional a egalitarian.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://pure.psu.edu/en/publications/beliefs-about-womens-labour-in-the-reunified-germany-19912004/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Lee, Alwin &amp;amp; Tufiș (2007), Beliefs about women&#x27;s labour in the reunified Germany&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;European Sociological Review&lt;/em&gt; 23(4). Mutamenti delle credenze sul lavoro femminile in Germania, 1991-2004. La slide p. 16 cita “Lee et al., 2010”, che non ho trovato: questo è solo un lavoro affine, non l&#x27;opera citata.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: mostra come il contesto politico plasmi i valori, e aiuta a chiarire la citazione.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://carta.anthropogeny.org/node/1571&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;de Waal (1996), Good Natured&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Harvard University Press. Origini evolutive di giusto e sbagliato, con osservazioni sui primati. Probabile riferimento di p. 18, che cita “De Waal and de Waal, 1996”.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: sostiene che fairness e justice stanno alla base della morale.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.mdpi.com/2076-0760/12/3/117&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Lomazzi (2023), The Cultural Roots of Violence against Women&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Social Sciences&lt;/em&gt; 12(3):117, open access. Norme individuali e istituzionali in 12 paesi. Linkato a p. 18; i paesi coincidono con la tabella di p. 19.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il modello da leggere per unire survey, indici e convenzioni.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://brill.com/view/book/edcoll/9789004429604/BP000010.xml&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Lomazzi, Women&#x27;s Rights and Shari&#x27;a Law in the MENA Region&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Capitolo Brill, fonte della tabella a p. 23. Il link è quello della slide: la ricerca non ha restituito la scheda, quindi non ho potuto verificarne i dati.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: approfondisce il rapporto tra reservations e diritto di famiglia.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://docs.iza.org/dp1941.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Olivetti &amp;amp; Petrongolo (2008), Unequal Pay or Unequal Employment?&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Journal of Labor Economics&lt;/em&gt; 26(4); qui la versione working paper. Non è citato nelle slide: è un&#x27;aggiunta per spiegare il selection effect.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: aiuta a non leggere un GPG basso come prova di parità.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.britannica.com/story/what-is-intersectionality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Crenshaw (1989) e l&#x27;intersectionality, scheda Britannica&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Introduzione al concetto e all&#x27;articolo &lt;em&gt;Demarginalizing the Intersection of Race and Sex&lt;/em&gt;, &lt;em&gt;University of Chicago Legal Forum&lt;/em&gt;. Non è citato nelle slide: è un&#x27;aggiunta per il tema in agenda a p. 3.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è l&#x27;origine del termine.&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Indici e report&lt;/h3&gt;
