&lt;div class=&quot;card&quot; style=&quot;font-size:.93rem&quot;&gt;&lt;strong&gt;How to read the provenance labels.&lt;/strong&gt; The running text follows the slides, with &lt;span class=&quot;tag sl&quot;&gt;slide 5&lt;/span&gt; indicating where. &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt; marks an explanation added by Claude to clarify what the slides take for granted: it does not come from the course. &lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt; marks material from the web, always with a link.&lt;/div&gt;
&lt;/header&gt;

&lt;section id=&quot;s-ponte&quot;&gt;
&lt;div class=&quot;kicker&quot; style=&quot;color:var(--muted)&quot;&gt;The bridge&lt;/div&gt;
&lt;h2&gt;Where we are coming from&lt;/h2&gt;
&lt;p&gt;The lecture picks up three points from the previous one &lt;span class=&quot;tag sl&quot;&gt;slide 2&lt;/span&gt;. All three return today.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Gender equality definition&lt;/h4&gt;&lt;p&gt;The starting concept. Here it is crossed with other axes: poverty, age, migration background.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Measurements&lt;/h4&gt;&lt;p&gt;Two sources: &lt;strong&gt;statistical offices&lt;/strong&gt; and &lt;strong&gt;population surveys&lt;/strong&gt;. They reappear when Resolution 2440 calls for &lt;em&gt;gender statistics&lt;/em&gt; &lt;span class=&quot;tag sl&quot;&gt;slide 16&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cross-cutting goal in the SDGs&lt;/h4&gt;&lt;p&gt;Gender equality runs through the other goals. Today this is visible in the goal of eliminating extreme poverty by 2030 &lt;span class=&quot;tag sl&quot;&gt;slide 10&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Today&#x27;s outline is short &lt;span class=&quot;tag sl&quot;&gt;slide 3&lt;/span&gt;: &lt;strong&gt;intersectionality&lt;/strong&gt; applied to gender, poverty and migration background. The reference reading is the article by Naila Kabeer &lt;span class=&quot;tag sl&quot;&gt;slide 4&lt;/span&gt;.&lt;/p&gt;
&lt;/section&gt;

&lt;section id=&quot;s-ineq&quot; class=&quot;slate&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 1&lt;/div&gt;
&lt;h2&gt;Two axes: vertical and horizontal inequalities&lt;/h2&gt;
&lt;p&gt;To understand what intersects, we must first distinguish two ways of classifying inequalities &lt;span class=&quot;tag sl&quot;&gt;slide 5&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Vertical inequalities&lt;/h4&gt;&lt;p&gt;“Vertical” inequalities rank individuals or households according to their position in the hierarchy of income or wealth. The focus is on &lt;strong&gt;class&lt;/strong&gt; inequalities.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Horizontal inequalities&lt;/h4&gt;&lt;p&gt;“Horizontal” inequalities exist between socially defined groups, which often &lt;strong&gt;cut across&lt;/strong&gt; income levels. They concern discrimination linked to marginalised identities: gender, race, caste.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure&gt;
&lt;div class=&quot;ctrl&quot; id=&quot;iq-btn&quot; role=&quot;group&quot; aria-label=&quot;Chart view&quot;&gt;
&lt;button data-v=&quot;v&quot; aria-pressed=&quot;true&quot;&gt;Vertical view&lt;/button&gt;
&lt;button data-v=&quot;h&quot; aria-pressed=&quot;false&quot;&gt;Horizontal view&lt;/button&gt;
&lt;button data-v=&quot;x&quot; aria-pressed=&quot;false&quot;&gt;Combined&lt;/button&gt;
&lt;/div&gt;
&lt;svg id=&quot;iq&quot; viewBox=&quot;0 0 560 230&quot; role=&quot;img&quot; aria-label=&quot;Twenty people ordered by income, then separated by gender&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;live&quot; id=&quot;iq-t&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Example with 20 people and invented incomes, solely to show the logic &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;&lt;strong&gt;Why it matters.&lt;/strong&gt; For a long time, development policies focused on economic growth and on the elimination of &lt;em&gt;absolute poverty&lt;/em&gt; &lt;span class=&quot;tag sl&quot;&gt;slide 5&lt;/span&gt;. This approach looks only at the vertical axis. If a group remains disadvantaged at every income level, growth alone may not be enough to bring this into view &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt; Kabeer traces how feminist contributions criticised poverty measures based on household income, which treat the household (those who live and spend together) as a single unit and ignore gender and age within it. Summary drawn from abstracts and catalogue records, not from the full text: &lt;a href=&quot;https://researchonline.lse.ac.uk/id/eprint/66021&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;LSE record&lt;/a&gt;, &lt;a href=&quot;https://policy-practice.oxfam.org/resources/gender-poverty-and-inequality-a-brief-history-of-feminist-contributions-in-the-560889/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Oxfam record&lt;/a&gt;.&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;&lt;p&gt;Try to answer, then open.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;A female manager and an unemployed man: who is higher on the vertical axis? And on the horizontal one?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;On the vertical axis income is what counts, so she is higher. The horizontal axis does not produce an individual ranking: it compares groups. She may still face gender discrimination despite her high position, which is precisely the meaning of “cut across income groups”.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is caste an example of horizontal inequality even though it is linked to wealth?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because it is a socially defined group and membership does not depend on current income: discrimination can persist even when income rises.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What can a policy centred only on growth and absolute poverty not see?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Disadvantages between groups at equal income levels, and inequalities that do not push people below a minimum threshold.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;&lt;section id=&quot;s-pov&quot; class=&quot;ochre&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 2&lt;/div&gt;
&lt;h2&gt;What is poverty?&lt;/h2&gt;
&lt;p&gt;The slide first asks: &lt;strong&gt;“What images come to your mind?”&lt;/strong&gt; &lt;span class=&quot;tag sl&quot;&gt;slide 6&lt;/span&gt;. Pause for a moment on your own images: are they closer to someone who has nothing to eat, or to someone who cannot afford what is normal in their surroundings? These are the two definitions that follow.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Absolute poverty&lt;/h4&gt;&lt;p&gt;A person is unable to meet the most basic needs: food, clothing, shelter &lt;span class=&quot;tag sl&quot;&gt;slide 7&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Relative poverty&lt;/h4&gt;&lt;p&gt;A person&#x27;s income is below a certain percentage of the &lt;strong&gt;national median income&lt;/strong&gt; &lt;span class=&quot;tag sl&quot;&gt;slide 7&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;relatively poor if &amp;nbsp; y &amp;lt; α · Me(y)&lt;small&gt;y = income · Me = national median, the income of the person “halfway along the line” · α = the chosen percentage &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt; At Eurostat, the at-risk-of-poverty threshold is &lt;strong&gt;60%&lt;/strong&gt; of national median equivalised disposable income, after social transfers. Eurostat cautions that the indicator does not in itself imply a low standard of living. &lt;a href=&quot;https://ec.europa.eu/eurostat/statistics-explained/index.php/Glossary:At-risk-of-poverty_rate&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eurostat glossary&lt;/a&gt;&lt;/div&gt;
&lt;h3&gt;Lab: the two thresholds behave differently&lt;/h3&gt;
&lt;figure&gt;
&lt;svg id=&quot;lab&quot; viewBox=&quot;0 0 560 262&quot; role=&quot;img&quot; aria-label=&quot;Forty people on an income scale with the absolute and the relative line&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;stats&quot;&gt;
&lt;div class=&quot;stat&quot;&gt;&lt;b id=&quot;l-me&quot;&gt;&lt;/b&gt;median&lt;/div&gt;
&lt;div class=&quot;stat&quot;&gt;&lt;b id=&quot;l-z&quot;&gt;&lt;/b&gt;relative line&lt;/div&gt;
&lt;div class=&quot;stat&quot;&gt;&lt;b id=&quot;l-a&quot;&gt;&lt;/b&gt;below the absolute line&lt;/div&gt;
&lt;div class=&quot;stat&quot;&gt;&lt;b id=&quot;l-r&quot;&gt;&lt;/b&gt;below the relative line&lt;/div&gt;
&lt;/div&gt;
&lt;label class=&quot;sl&quot;&gt;Equal growth for everyone &lt;b id=&quot;v-g&quot;&gt;&lt;/b&gt;&lt;input type=&quot;range&quot; id=&quot;r-g&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;0&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;Redistribution towards the median &lt;b id=&quot;v-d&quot;&gt;&lt;/b&gt;&lt;input type=&quot;range&quot; id=&quot;r-d&quot; min=&quot;0&quot; max=&quot;70&quot; step=&quot;5&quot; value=&quot;0&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;Percentage α of the median &lt;b id=&quot;v-a&quot;&gt;&lt;/b&gt;&lt;input type=&quot;range&quot; id=&quot;r-a&quot; min=&quot;40&quot; max=&quot;70&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;live&quot; id=&quot;l-t&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Invented population of 40 people, logarithmic axis, absolute line fixed at $3 &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;. These are not real data.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;&lt;strong&gt;The result to remember:&lt;/strong&gt; with equal growth for everyone, absolute poverty falls while relative poverty does not change. A growth-only policy can therefore reduce the former while leaving the latter intact &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;
&lt;h3&gt;The poverty line&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;p&gt;It is &lt;strong&gt;“an estimated, imaginary line developed by economists in order to define a poor person”&lt;/strong&gt;: a line that is both estimated and imaginary. Using standard measures, it is calculated so that all poor people fall below it and anyone above it is not poor &lt;span class=&quot;tag sl&quot;&gt;slide 9&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;“Imaginary” is the key word: the threshold is a convention that is useful for counting. A person living on $2.14 and a person living on $2.16 do not lead different lives, yet they end up in different categories &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;
&lt;figure data-stepper&gt;
&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;Three values of the poverty line over time&quot;&gt;
&lt;path class=&quot;ln&quot; d=&quot;M40 95H530&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;g data-s=&quot;1&quot; text-anchor=&quot;middle&quot;&gt;&lt;circle class=&quot;fc&quot; cx=&quot;110&quot; cy=&quot;95&quot; r=&quot;11&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;110&quot; y=&quot;66&quot;&gt;$1.90&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;110&quot; y=&quot;128&quot;&gt;2011 prices&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;2&quot; text-anchor=&quot;middle&quot;&gt;&lt;circle class=&quot;fc&quot; cx=&quot;280&quot; cy=&quot;95&quot; r=&quot;11&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;280&quot; y=&quot;66&quot;&gt;$2.15&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;280&quot; y=&quot;128&quot;&gt;2017 prices&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;3&quot; text-anchor=&quot;middle&quot;&gt;&lt;circle class=&quot;fc&quot; cx=&quot;450&quot; cy=&quot;95&quot; r=&quot;11&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;450&quot; y=&quot;66&quot;&gt;$3.00&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;450&quot; y=&quot;128&quot;&gt;2021 prices&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;1&quot;&gt;&lt;p&gt;&lt;strong&gt;$1.90 a day.&lt;/strong&gt; The old threshold cited in the slides &lt;span class=&quot;tag sl&quot;&gt;slide 9&lt;/span&gt;. The dollars are &lt;em&gt;PPP&lt;/em&gt;, purchasing power parity: “theoretical” dollars that buy the same basket of goods in every country, so that comparisons do not depend on the exchange rate &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;$2.15 a day: this is the course&#x27;s threshold.&lt;/strong&gt; Below this figure a person is in &lt;strong&gt;extreme poverty&lt;/strong&gt;; in 2019 this applied to about &lt;strong&gt;648 million&lt;/strong&gt; people &lt;span class=&quot;tag sl&quot;&gt;slide 9&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt; The slide dates the update to 2020, but Our World in Data places it in September 2022. The value rises mainly because the price base year changes, so it is not a genuine increase. &lt;a href=&quot;https://ourworldindata.org/from-1-90-to-2-15-a-day-the-updated-international-poverty-line&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Our World in Data&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;3&quot;&gt;&lt;p&gt;&lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt; &lt;strong&gt;After the slides:&lt;/strong&gt; in June 2025 the World Bank raised the threshold to $3.00 in 2021 PPP. The count of poor people rose, but Our World in Data cautions that this reflects the higher threshold, not a poorer world (&lt;a href=&quot;https://intellinews.com/extreme-poverty-falling-steadily-owid-401156&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;summary&lt;/a&gt;). For the exam, check which figure the course requires. &lt;a href=&quot;https://www.worldbank.org/en/news/factsheet/2025/06/05/june-2025-update-to-global-poverty-lines&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank, June 2025 factsheet&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;prev&quot;&gt;← Back&lt;/button&gt;&lt;output&gt;&lt;/output&gt;&lt;button class=&quot;next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
&lt;/figure&gt;
&lt;h3&gt;Outlook: 2030 is out of reach&lt;/h3&gt;
&lt;p&gt;Recent crises have moved the world further from the goal of eliminating extreme poverty by 2030 &lt;span class=&quot;tag sl&quot;&gt;slide 10&lt;/span&gt;. On current trends, in 2030 &lt;strong&gt;574 million&lt;/strong&gt; people, almost 7% of the world population, would still be living on less than $2.15 a day.&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 560 170&quot; role=&quot;img&quot; aria-label=&quot;Millions of people in extreme poverty: 648 in 2019, 719 in 2020, 574 projected for 2030&quot;&gt;
&lt;g&gt;&lt;text x=&quot;0&quot; y=&quot;37&quot;&gt;2019&lt;/text&gt;&lt;rect class=&quot;fc&quot; x=&quot;62&quot; y=&quot;18&quot; width=&quot;389&quot; height=&quot;28&quot; rx=&quot;3&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;460&quot; y=&quot;39&quot;&gt;648 m&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;text x=&quot;0&quot; y=&quot;87&quot;&gt;2020&lt;/text&gt;&lt;rect x=&quot;62&quot; y=&quot;68&quot; width=&quot;431&quot; height=&quot;28&quot; rx=&quot;3&quot; fill=&quot;none&quot; stroke-dasharray=&quot;5 4&quot; style=&quot;stroke:var(--accent);stroke-width:1.5&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;499&quot; y=&quot;89&quot;&gt;719&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;text x=&quot;0&quot; y=&quot;137&quot;&gt;2030&lt;/text&gt;&lt;rect x=&quot;62&quot; y=&quot;118&quot; width=&quot;344&quot; height=&quot;28&quot; rx=&quot;3&quot; class=&quot;fc&quot; style=&quot;fill-opacity:.45&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;415&quot; y=&quot;139&quot;&gt;574 m&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;415&quot; y=&quot;160&quot;&gt;projection&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Threshold: $2.15. 2019 and 2030: &lt;span class=&quot;tag sl&quot;&gt;slide 9-10&lt;/span&gt;. 2020 (dashed border): &lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt; press coverage of the 2022 World Bank report, with an increase of about 71 million in one year due to the pandemic. &lt;a href=&quot;https://nextbillion.net/news/goal-of-ending-extreme-poverty-by-2030-out-of-reach-report-says&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NextBillion&lt;/a&gt;, &lt;a href=&quot;https://www.worldbank.org/en/news/immersive-story/2022/10/05/covid-19-dealt-a-historic-blow-to-poverty-reduction&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank&lt;/a&gt;. These figures are not comparable with those calculated using the $3 threshold.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;The challenge is harder because extreme poverty is concentrated where it is most difficult to eliminate &lt;span class=&quot;tag sl&quot;&gt;slide 10&lt;/span&gt;:&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Sub-Saharan Africa&lt;/h4&gt;&lt;p&gt;The first of the three areas named by the slide, which gives no percentage.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Conflict-affected areas&lt;/h4&gt;&lt;p&gt;War destroys income and services &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;: this is the link with the part on vulnerabilities.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Rural areas&lt;/h4&gt;&lt;p&gt;Fewer services, markets and infrastructure &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt; The goal is &lt;strong&gt;Target 1.1 of SDG 1&lt;/strong&gt;. Target 1.2, by contrast, uses national definitions and poverty “in all its dimensions”: the agenda therefore does not stop at the dollar threshold. &lt;a href=&quot;https://sdg-tracker.org/no-poverty&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SDG Tracker&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;&lt;p&gt;Try to answer, then open.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;If all incomes in a country double, what happens to absolute and relative poverty?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Absolute poverty falls, because the threshold is fixed. Relative poverty stays the same, because the median doubles and the threshold doubles with it.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Can there be relative poverty in a rich country with nobody in extreme poverty?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Yes. Someone below, for example, 60% of the median in a rich country may be well above the international threshold.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why does the slide define the poverty line as “imaginary”?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because it is a construction by economists for counting the poor, not a natural boundary: it changes with the method and with the reference prices.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What do 648 and 574 million mean? Which of the two is an estimate about the future?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;648 million is the number of people below $2.15 in 2019. 574 million, almost 7% of the world population, is the projection for 2030 on current trends.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s-int&quot; class=&quot;brick&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 3&lt;/div&gt;
&lt;h2&gt;The intersectionality approach&lt;/h2&gt;
&lt;div class=&quot;def&quot;&gt;&lt;p&gt;In the slides, it means &lt;strong&gt;considering gender inequality when addressing poverty&lt;/strong&gt;, looking at global and local aspects and at the private and public domains &lt;span class=&quot;tag sl&quot;&gt;slide 11&lt;/span&gt;. More generally, axes of disadvantage are not studied separately: their combination produces distinct experiences &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt; The slides do not attribute the term to any author. It is credited to Kimberlé Crenshaw (1989), who analysed cases in which courts did not allow Black women workers to bring claims of race and sex discrimination together; the idea was already present in earlier Black feminism. &lt;a href=&quot;https://www.britannica.com/story/what-is-intersectionality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Britannica&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Global and local&lt;/h4&gt;&lt;p&gt;A global phenomenon takes shape in a specific place: for example, worldwide demand for electronics and those who, in a given country, bear its risks &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Private and public&lt;/h4&gt;&lt;p&gt;Private: who decides on spending and who does the care work at home. Public: work, laws, services. A purely “public” measure cannot see what happens inside the household &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Switch the axes on and off&lt;/h3&gt;
&lt;figure&gt;
&lt;div class=&quot;ctrl&quot; id=&quot;vn-btn&quot; role=&quot;group&quot; aria-label=&quot;Axes to intersect&quot;&gt;
&lt;button data-k=&quot;G&quot; aria-pressed=&quot;true&quot;&gt;Gender&lt;/button&gt;
&lt;button data-k=&quot;P&quot; aria-pressed=&quot;true&quot;&gt;Poverty&lt;/button&gt;
&lt;button data-k=&quot;A&quot; aria-pressed=&quot;true&quot;&gt;Age&lt;/button&gt;
&lt;button data-k=&quot;M&quot; aria-pressed=&quot;false&quot;&gt;Migration&lt;/button&gt;
&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;Four overlapping circles, one for each axis&quot;&gt;
&lt;g id=&quot;vn&quot;&gt;
&lt;circle data-k=&quot;G&quot; cx=&quot;225&quot; cy=&quot;115&quot; r=&quot;90&quot;/&gt;&lt;circle data-k=&quot;P&quot; cx=&quot;335&quot; cy=&quot;115&quot; r=&quot;90&quot;/&gt;&lt;circle data-k=&quot;A&quot; cx=&quot;225&quot; cy=&quot;185&quot; r=&quot;90&quot;/&gt;&lt;circle data-k=&quot;M&quot; cx=&quot;335&quot; cy=&quot;185&quot; r=&quot;90&quot;/&gt;
&lt;/g&gt;
&lt;g&gt;&lt;text class=&quot;h&quot; x=&quot;130&quot; y=&quot;50&quot; text-anchor=&quot;end&quot;&gt;Gender&lt;/text&gt;&lt;text class=&quot;h&quot; x=&quot;430&quot; y=&quot;50&quot;&gt;Poverty&lt;/text&gt;&lt;text class=&quot;h&quot; x=&quot;130&quot; y=&quot;258&quot; text-anchor=&quot;end&quot;&gt;Age&lt;/text&gt;&lt;text class=&quot;h&quot; x=&quot;430&quot; y=&quot;258&quot;&gt;Migration&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;live&quot; id=&quot;vn-t&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;The examples combine points from the slides with Claude&#x27;s interpretations &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;h3&gt;What the asterisk means in “Gender*Poverty*Age”&lt;/h3&gt;
&lt;p&gt;The slides write &lt;em&gt;Gender*Poverty*Age&lt;/em&gt; &lt;span class=&quot;tag sl&quot;&gt;slide 12-13&lt;/span&gt;. The symbol is not explained, but it recalls the statistical notation for an &lt;strong&gt;interaction&lt;/strong&gt;: the effect of one factor changes according to the level of the other. The disadvantage of a poor woman may therefore be greater than the sum of the two disadvantages &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;R = β₀ + β₁·G + β₂·P + β₃·(G·P)&lt;small&gt;G = 1 if woman, P = 1 if poor · β₃ is the interaction: the part that simple addition does not explain &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;&lt;/small&gt;&lt;/div&gt;
&lt;figure&gt;
&lt;svg id=&quot;ix&quot; viewBox=&quot;0 0 560 240&quot; role=&quot;img&quot; aria-label=&quot;Four risk bars with and without interaction&quot;&gt;&lt;/svg&gt;
&lt;label class=&quot;sl&quot;&gt;Interaction β₃ &lt;b id=&quot;v-i&quot;&gt;&lt;/b&gt;&lt;input type=&quot;range&quot; id=&quot;r-i&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;12&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;live&quot; id=&quot;ix-t&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Invented numbers: β₀ = 10, β₁ = 5, β₂ = 15, “risk” on an arbitrary scale &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;h3&gt;Crises and cascading vulnerabilities&lt;/h3&gt;
&lt;p&gt;War, conflicts and economic crises trigger further vulnerabilities &lt;span class=&quot;tag sl&quot;&gt;slide 11&lt;/span&gt;. Follow the chain:&lt;/p&gt;
&lt;figure data-stepper&gt;
&lt;svg viewBox=&quot;0 0 560 310&quot; role=&quot;img&quot; aria-label=&quot;Chain from crisis to poverty risk for female headed households&quot;&gt;
&lt;path class=&quot;ln&quot; d=&quot;M240 62L150 92&quot; marker-end=&quot;url(#ar)&quot; data-s=&quot;2 3 4 5&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M320 62L410 92&quot; marker-end=&quot;url(#ar)&quot; data-s=&quot;3 4 5&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M420 156V178&quot; marker-end=&quot;url(#ar)&quot; data-s=&quot;4 5&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M400 242L334 256&quot; marker-end=&quot;url(#ar)&quot; data-s=&quot;5&quot;/&gt;
&lt;g data-s=&quot;1 2 3 4 5&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect class=&quot;fc&quot; x=&quot;150&quot; y=&quot;8&quot; width=&quot;260&quot; height=&quot;54&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;280&quot; y=&quot;32&quot; style=&quot;font-weight:600&quot;&gt;War, conflicts&lt;/text&gt;&lt;text x=&quot;280&quot; y=&quot;52&quot; style=&quot;font-weight:600&quot;&gt;economic crises&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;2 3 4 5&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect class=&quot;bx&quot; x=&quot;10&quot; y=&quot;94&quot; width=&quot;240&quot; height=&quot;62&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;120&quot;&gt;Women: more exposed&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;142&quot;&gt;than men to violence&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;3 4 5&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect class=&quot;bx&quot; x=&quot;300&quot; y=&quot;94&quot; width=&quot;250&quot; height=&quot;62&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;425&quot; y=&quot;120&quot;&gt;Men are likely to leave:&lt;/text&gt;&lt;text x=&quot;425&quot; y=&quot;142&quot;&gt;soldiers, migration&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;4 5&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect class=&quot;bx&quot; x=&quot;300&quot; y=&quot;180&quot; width=&quot;250&quot; height=&quot;62&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;425&quot; y=&quot;206&quot;&gt;Female headed household&lt;/text&gt;&lt;text x=&quot;425&quot; y=&quot;228&quot;&gt;headed by a woman&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;5&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect class=&quot;fc&quot; x=&quot;60&quot; y=&quot;244&quot; width=&quot;270&quot; height=&quot;62&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;195&quot; y=&quot;270&quot; style=&quot;font-weight:600&quot;&gt;More poverty risks&lt;/text&gt;&lt;text x=&quot;195&quot; y=&quot;292&quot;&gt;especially with young children&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;1&quot;&gt;&lt;p&gt;&lt;strong&gt;The shock.&lt;/strong&gt; Wars and economic crises affect everyone, but not in the same way. The point of the slides is that the effect is mediated by gender.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;First channel: violence.&lt;/strong&gt; Women are more exposed to violence than men &lt;span class=&quot;tag sl&quot;&gt;slide 11&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;3&quot;&gt;&lt;p&gt;&lt;strong&gt;Second channel: departures.&lt;/strong&gt; Men are at risk of leaving the household because they become soldiers or migrate &lt;span class=&quot;tag sl&quot;&gt;slide 11&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;4&quot;&gt;&lt;p&gt;&lt;strong&gt;The family reorganises.&lt;/strong&gt; What remains is a &lt;em&gt;female headed household&lt;/em&gt;. A single adult woman must both earn and care for the others: time becomes a scarce resource &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;5&quot;&gt;&lt;p&gt;&lt;strong&gt;The outcome.&lt;/strong&gt; These households are more exposed to poverty risks, especially when the children are very young &lt;span class=&quot;tag sl&quot;&gt;slide 11&lt;/span&gt;: this is where gender, poverty and age intersect.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;prev&quot;&gt;← Back&lt;/button&gt;&lt;output&gt;&lt;/output&gt;&lt;button class=&quot;next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
&lt;/figure&gt;
&lt;h3&gt;The three video cases&lt;/h3&gt;
&lt;p&gt;The slides entrust the examples to three videos, with a single image each. Claude was unable to watch them: this section contains only what can be seen in the slides, plus questions to use while watching.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Videos&quot;&gt;&lt;button role=&quot;tab&quot; data-t=&quot;a&quot; aria-selected=&quot;true&quot;&gt;Extreme poverty in India&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;b&quot; aria-selected=&quot;false&quot;&gt;The cost of electronics&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;c&quot; aria-selected=&quot;false&quot;&gt;Gender*poverty*age&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-p=&quot;a&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide 8&lt;/span&gt; The frame shows a family in a very simple dwelling: a woman is cooking on the floor, a man is sitting in the foreground, and children are around them.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;While watching:&lt;/strong&gt; which basic needs are unmet? Who does which work in the home?&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.youtube.com/watch?v=kdrtB2saFrY&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open the video indicated in the slide&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-p=&quot;b&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide 12&lt;/span&gt; Slide title: &lt;em&gt;Intersection of inequality / Gender*Poverty*Age&lt;/em&gt;. In the frame, from Insider&#x27;s “Risky Business” series, a boy crouching on railway tracks is handling pieces of a phone.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;While watching:&lt;/strong&gt; why does this work fall specifically to young, poor people? What role does gender play? What is the link between those who use electronics and those who bear its risks?&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.youtube.com/watch?v=QuBy6YzLMn0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open the video indicated in the slide&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-p=&quot;c&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide 13&lt;/span&gt; Al Jazeera frame showing a young woman in traditional dress. The slide adds no text beyond the title &lt;em&gt;Gender*poverty*age&lt;/em&gt;.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;While watching:&lt;/strong&gt; what choice is truly available to this person, given their age and household income?&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.youtube.com/watch?v=iIIz2gb3UjM&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open the video indicated in the slide&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;meta&quot;&gt;The address was read from the slide image and some letters (capital I, lowercase l) are ambiguous. If it does not open, use the link in the PDF.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;&lt;p&gt;Try to answer, then open.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between adding two disadvantages and making them intersect?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In a sum, each disadvantage remains the same whatever the other is. In an intersection, the effect of one changes in the presence of the other, creating a situation that the two axes taken separately do not describe.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why does the departure of men increase the poverty risk for those who remain?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It often creates a female headed household, which is more exposed to poverty risks, especially with very young children.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Give one example of the “private domain” and one of the “public domain”.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Private: unpaid care work or household spending decisions. Public: the labour market, laws, childcare services.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s-mig&quot; class=&quot;sage&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 4&lt;/div&gt;
&lt;h2&gt;Gender and migration&lt;/h2&gt;
&lt;blockquote&gt;“just as poor countries suffer a brain drain as trained personnel move from the South to the North, so too they suffer a care drain”&lt;footer&gt;Hochschild, 2013, p. 147, cited in &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;&lt;/footer&gt;&lt;/blockquote&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Comparison&quot;&gt;&lt;button role=&quot;tab&quot; data-t=&quot;a&quot; aria-selected=&quot;true&quot;&gt;Brain drain&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;b&quot; aria-selected=&quot;false&quot;&gt;Care drain&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-p=&quot;a&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Brain drain&lt;/strong&gt;: trained personnel move from the South to the North &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;. The country of origin loses skills in which it had invested &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-p=&quot;b&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Care drain&lt;/strong&gt;: the same mechanism applied to care work &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;. The country of origin loses those who look after children and older people, and the gap falls on the families left behind &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Feminization of migration&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;p&gt;Migration flows characterised by women leaving their country for &lt;strong&gt;economic reasons&lt;/strong&gt;, often as &lt;strong&gt;first-migrants&lt;/strong&gt; (the first in the family to leave), who work in the &lt;strong&gt;care sector&lt;/strong&gt; as domestic workers &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;figure data-stepper&gt;
&lt;svg viewBox=&quot;0 0 600 310&quot; role=&quot;img&quot; aria-label=&quot;Care chain between the country of origin and the country of destination&quot;&gt;
&lt;rect x=&quot;6&quot; y=&quot;6&quot; width=&quot;238&quot; height=&quot;298&quot; rx=&quot;10&quot; style=&quot;fill:var(--cbg)&quot;/&gt;&lt;rect x=&quot;356&quot; y=&quot;6&quot; width=&quot;238&quot; height=&quot;298&quot; rx=&quot;10&quot; style=&quot;fill:var(--cbg)&quot;/&gt;
&lt;text class=&quot;h&quot; x=&quot;125&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot;&gt;South: origin&lt;/text&gt;&lt;text class=&quot;h&quot; x=&quot;475&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot;&gt;North: destination&lt;/text&gt;
&lt;g data-s=&quot;1 2 3 4 5 6&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect class=&quot;bx&quot; x=&quot;28&quot; y=&quot;52&quot; width=&quot;194&quot; height=&quot;52&quot; rx=&quot;7&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;83&quot;&gt;family of origin&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;3 4 5 6&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect class=&quot;bx&quot; x=&quot;378&quot; y=&quot;52&quot; width=&quot;194&quot; height=&quot;52&quot; rx=&quot;7&quot;/&gt;&lt;text x=&quot;475&quot; y=&quot;74&quot;&gt;employing family&lt;/text&gt;&lt;text x=&quot;475&quot; y=&quot;94&quot;&gt;elderly, children, home&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;2 3 4 5 6&quot;&gt;&lt;path class=&quot;ln&quot; d=&quot;M226 78H374&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke-width:2.5&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;cardhalo&quot;&gt;first-migrant&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;3 4 5 6&quot;&gt;&lt;text x=&quot;520&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot;&gt;care work&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;4 5 6&quot;&gt;&lt;path class=&quot;ln&quot; d=&quot;M390 106V136H190V108&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke-width:2.5&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; class=&quot;cardhalo&quot;&gt;remittances&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;5 6&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect class=&quot;bx&quot; x=&quot;28&quot; y=&quot;172&quot; width=&quot;194&quot; height=&quot;72&quot; rx=&quot;7&quot; style=&quot;stroke:var(--accent)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;199&quot;&gt;who cares at home?&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;223&quot; style=&quot;fill:var(--accent);font-weight:600&quot;&gt;care drain&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;6&quot;&gt;&lt;path class=&quot;ln&quot; d=&quot;M125 244V272H470V108&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke-width:2.5&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;262&quot; text-anchor=&quot;middle&quot; class=&quot;cardhalo&quot;&gt;family reunification&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;1 2 3 4 5 6&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;84&quot; y=&quot;146&quot;&gt;economic reasons&lt;/text&gt;&lt;path class=&quot;ln&quot; d=&quot;M90 128V108&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;1&quot;&gt;&lt;p&gt;&lt;strong&gt;The push.&lt;/strong&gt; Departure stems from economic reasons &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;: poverty is one of the causes of movement.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;First-migrant.&lt;/strong&gt; She is often the first to leave &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;. The classic model, in which the man leaves and his wife joins him, is reversed &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;3&quot;&gt;&lt;p&gt;&lt;strong&gt;The care sector.&lt;/strong&gt; She works as a domestic worker &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;: she often looks after someone else&#x27;s family, in work that is barely visible because it takes place in the home &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;4&quot;&gt;&lt;p&gt;&lt;strong&gt;Remittances&lt;/strong&gt;, the money sent home &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;. They support the family, but they do not replace presence.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;5&quot;&gt;&lt;p&gt;&lt;strong&gt;The gap at home.&lt;/strong&gt; Care has to be reorganised: it often falls on grandmothers, daughters or other women &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;. This is the care drain: care, too, moves from the South to the North.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt; Hochschild is associated with the concept of the &lt;em&gt;global care chain&lt;/em&gt; (essay “Love and Gold”, in &lt;em&gt;Global Woman&lt;/em&gt;). &lt;a href=&quot;https://wikiwand.com/en/articles/Arlie_Russell_Hochschild&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Profile of Hochschild&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;6&quot;&gt;&lt;p&gt;&lt;strong&gt;Reconjunction.&lt;/strong&gt; The slide writes “Reconjuction”: what is meant is &lt;em&gt;family reunification&lt;/em&gt; &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;. The family may join her in the country of destination &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;; the theme returns in points 5.2, 5.9 and 5.10 of the policy part.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;prev&quot;&gt;← Back&lt;/button&gt;&lt;output&gt;&lt;/output&gt;&lt;button class=&quot;next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
&lt;/figure&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt; &lt;strong&gt;A caution about the name.&lt;/strong&gt; The share of women among international migrants has been almost static for decades: about 46.6% in 1960, 48.8% in 2000 (&lt;a href=&quot;https://www.migrationpolicy.org/article/global-dimensions-female-migration&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Migration Policy Institute&lt;/a&gt;), around 48% in 2024 (&lt;a href=&quot;https://www.dawn.com/news/1892702&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Dawn on UN data&lt;/a&gt;). “Feminization” is therefore better understood as a change in the &lt;em&gt;mode&lt;/em&gt; of migrating, autonomously and for work, rather than in numbers &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/div&gt;
&lt;h3&gt;Case of Italy&lt;/h3&gt;
&lt;p&gt;In the slide this is only a title &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;: what follows does not come from the course, so go back to your notes for this part.&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 560 120&quot; role=&quot;img&quot; aria-label=&quot;Regular domestic workers in Italy: 60 per cent foreign women, 28.5 Italian women, 11.1 men&quot;&gt;
&lt;rect x=&quot;0&quot; y=&quot;10&quot; width=&quot;338&quot; height=&quot;54&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;rect x=&quot;338&quot; y=&quot;10&quot; width=&quot;160&quot; height=&quot;54&quot; class=&quot;fc&quot;/&gt;&lt;rect x=&quot;498&quot; y=&quot;10&quot; width=&quot;62&quot; height=&quot;54&quot; style=&quot;fill:var(--rule)&quot;/&gt;
&lt;text x=&quot;12&quot; y=&quot;44&quot; style=&quot;fill:var(--paper);font-weight:600&quot;&gt;foreign women ~60%&lt;/text&gt;&lt;text x=&quot;418&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;Italian 28.5%&lt;/text&gt;&lt;text x=&quot;529&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;11.1%&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;560&quot; y=&quot;86&quot; text-anchor=&quot;end&quot;&gt;men: the last segment&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;0&quot; y=&quot;86&quot;&gt;Regular domestic workers, INPS data&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;&lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt; DOMINA Observatory on 2024 INPS data, as reported by the press and in summaries: women 88.9%, &lt;em&gt;badanti&lt;/em&gt; (family care assistants) 50.5% of the total. Irregular work is estimated at around 48.8%, so the figures describe only the regular part. Check the &lt;a href=&quot;https://www.osservatoriolavorodomestico.it/wp-content/uploads/2025/09/Osservtorio-Domina-VII-Rapporto-Annuale.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;7th DOMINA Report&lt;/a&gt;.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;&lt;p&gt;Try to answer, then open.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Define the care drain starting from the brain drain.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Just as the brain drain moves trained personnel from the South to the North, the care drain moves care capacity, taking it away from families and communities of origin.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Which elements characterise the feminization of migration according to the slide?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Economic reasons, women often as first-migrants, work in the care sector as domestic workers, remittances and reconjunction. Case cited: Italy.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Where can gender, poverty and migration be seen together in this story?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Gender norms steer women towards care work, poverty pushes them to leave and migrant status weakens their position at work: none of the three axes alone explains the situation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s-gm&quot; class=&quot;terra&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 5&lt;/div&gt;
&lt;h2&gt;Gendering migration policies&lt;/h2&gt;
&lt;div class=&quot;def&quot;&gt;&lt;p&gt;&lt;strong&gt;Gender mainstreaming (GM)&lt;/strong&gt;: integrating a gender equality perspective into all policies, rather than treating it as a separate sector. In the field of migration it is called for by &lt;strong&gt;Resolution 2440&lt;/strong&gt; of the Council of Europe &lt;span class=&quot;tag sl&quot;&gt;slide 16&lt;/span&gt;; the underlying report is Doc. 15456 of 16 February 2022, rapporteur Petra Stienen &lt;span class=&quot;tag sl&quot;&gt;slide 18&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt; Classic Council of Europe definition (1998): “(re)organisation, improvement, development and evaluation of policy processes”, so that a gender perspective is incorporated in all policies, at all levels and at all stages. &lt;a href=&quot;https://rm.coe.int/1680630394&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Council of Europe&lt;/a&gt;. The resolution was adopted on 31 May 2022 by the Standing Committee: &lt;a href=&quot;https://pace.coe.int/files/30075/html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;adopted text&lt;/a&gt;.&lt;/div&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;p&gt;&lt;strong&gt;Not to be confused.&lt;/strong&gt; Slide 16 writes “EU MS”, but the Resolution comes from the Parliamentary Assembly of the &lt;strong&gt;Council of Europe&lt;/strong&gt;, which is not the European Union: it has 46 member states, including the 27 EU members (&lt;a href=&quot;https://www.coe.int/en/web/tbilisi/the-coe/objectives-and-missions&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Council of Europe&lt;/a&gt; &lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt;). Indeed, the text of slide 20 refers to “member States”. It is worth asking for confirmation in class.&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;Three requests cited as examples &lt;span class=&quot;tag sl&quot;&gt;slide 16&lt;/span&gt;:&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Gender statistics&lt;/h4&gt;&lt;p&gt;An invitation to adopt them: without data disaggregated by gender the problem remains invisible. This is the link with the previous lecture.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Balanced representation&lt;/h4&gt;&lt;p&gt;Balanced representation in policy making, with an intersectional approach: including people with a migrant background.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Financial inclusion&lt;/h4&gt;&lt;p&gt;Financial inclusion of migrants through &lt;em&gt;gender-responsive programmes&lt;/em&gt;, designed around the different needs of women and men.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Why the societal context matters&lt;/h3&gt;
&lt;p&gt;A policy operates within a context made up of two mutually reinforcing components &lt;span class=&quot;tag sl&quot;&gt;slide 17&lt;/span&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;The societal context divides into a structural component and a cultural dimension, which influence each other; GM enables opportunity structures&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;105&quot; y=&quot;8&quot; width=&quot;350&quot; height=&quot;44&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;280&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Relevance of the societal context&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M240 52L135 92&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M320 52L425 92&quot;/&gt;
&lt;rect class=&quot;fc&quot; x=&quot;20&quot; y=&quot;92&quot; width=&quot;225&quot; height=&quot;78&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;132&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot;&gt;Structural&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;132&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot;&gt;policies and practices&lt;/text&gt;
&lt;rect class=&quot;fc&quot; x=&quot;315&quot; y=&quot;92&quot; width=&quot;225&quot; height=&quot;78&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;427&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot;&gt;Cultural&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;427&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot;&gt;values and legitimate roles&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M248 112Q280 84 312 112&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke-width:2.5&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M312 150Q280 178 248 150&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke-width:2.5&quot;/&gt;
&lt;path class=&quot;ln&quot; d=&quot;M280 186V226&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke-width:2.5&quot;/&gt;
&lt;rect x=&quot;80&quot; y=&quot;230&quot; width=&quot;400&quot; height=&quot;56&quot; rx=&quot;8&quot; style=&quot;fill:var(--accent)&quot;/&gt;&lt;text x=&quot;280&quot; y=&quot;265&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font-weight:600;font-size:18px&quot;&gt;GM enables opportunity structures&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Components&quot;&gt;&lt;button role=&quot;tab&quot; data-t=&quot;a&quot; aria-selected=&quot;true&quot;&gt;Structural component&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;b&quot; aria-selected=&quot;false&quot;&gt;Cultural dimension&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;c&quot; aria-selected=&quot;false&quot;&gt;The circle&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-p=&quot;a&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;“Provides an organized system of opportunities which allows individuals to reach their goals, by introducing policies and practices” &lt;span class=&quot;tag sl&quot;&gt;slide 17&lt;/span&gt;. That is, the set of opportunities made available by the rules. Example: if the documents needed for work are issued quickly, a woman who arrived through family reunification can look for a job &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-p=&quot;b&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;“Societal value orientations” encompass shared opinions and beliefs and culturally define the social roles considered legitimate for men and women &lt;span class=&quot;tag sl&quot;&gt;slide 17&lt;/span&gt;. Example: if care is seen as “women&#x27;s work”, care work remains female and undervalued &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-p=&quot;c&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;The circular arrows in the slide indicate mutual influence: policies change what is considered normal, and values make certain policies acceptable. GM acts here because it &lt;strong&gt;enables opportunity structures&lt;/strong&gt;, the concrete conditions in which people can reach their goals &lt;span class=&quot;tag sl&quot;&gt;slide 17&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;The premises of GM&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Migration is a gendered phenomenon&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Gender norms and expectations, power relations and unequal rights shape the migration choices and experiences of women and girls, as well as of men and boys &lt;span class=&quot;tag sl&quot;&gt;slide 19&lt;/span&gt;. It therefore does not concern women alone.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Ignoring gender causes harm&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It can expose people on the move to certain vulnerabilities, exacerbate inequalities and render measures and services inadequate &lt;span class=&quot;tag sl&quot;&gt;slide 19&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Intersectional discrimination&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Migrant women and men face discrimination based on multiple factors: age, (dis)ability, social origin, ethnicity, religion, migration status, sex, gender identity, sexual orientation &lt;span class=&quot;tag sl&quot;&gt;slide 19&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;h3&gt;Implementation: 14 requests to states&lt;/h3&gt;
&lt;p&gt;GM requires the full integration of a gender equality perspective into all legislation, policies, programmes and infrastructure governing migration &lt;span class=&quot;tag sl&quot;&gt;slide 20&lt;/span&gt;. Here are the points in summary: filter by theme &lt;span class=&quot;tag sl&quot;&gt;slide 20-22&lt;/span&gt;. The themes are a grouping made by Claude &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;ctrl&quot; id=&quot;pf&quot; role=&quot;group&quot; aria-label=&quot;Filter by theme&quot;&gt;
&lt;button data-f=&quot;*&quot; aria-pressed=&quot;true&quot;&gt;All&lt;/button&gt;&lt;button data-f=&quot;v&quot; aria-pressed=&quot;false&quot;&gt;Violence and protection&lt;/button&gt;&lt;button data-f=&quot;a&quot; aria-pressed=&quot;false&quot;&gt;Reception&lt;/button&gt;&lt;button data-f=&quot;i&quot; aria-pressed=&quot;false&quot;&gt;Information and assistance&lt;/button&gt;&lt;button data-f=&quot;s&quot; aria-pressed=&quot;false&quot;&gt;Health&lt;/button&gt;&lt;button data-f=&quot;f&quot; aria-pressed=&quot;false&quot;&gt;Family and documents&lt;/button&gt;&lt;button data-f=&quot;l&quot; aria-pressed=&quot;false&quot;&gt;Work&lt;/button&gt;&lt;button data-f=&quot;m&quot; aria-pressed=&quot;false&quot;&gt;Minors&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;para&quot; id=&quot;pl&quot;&gt;
&lt;div class=&quot;card&quot; data-th=&quot;v&quot;&gt;&lt;b&gt;5.1&lt;/b&gt;Recognise gender-based violence as a form of persecution under Art. 1 A(2) of the 1951 Convention and the Istanbul Convention.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;a f&quot;&gt;&lt;b&gt;5.2&lt;/b&gt;Single-sex facilities available, but also mixed facilities to keep families together.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;a m&quot;&gt;&lt;b&gt;5.3&lt;/b&gt;For boys, especially adolescents, accommodation separate from both girls and adult men.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;i&quot;&gt;&lt;b&gt;5.4&lt;/b&gt;In line with Objective 3 of the Global Compact: accessible, accurate, timely and gender-responsive information, in the relevant languages, at all stages.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;i&quot;&gt;&lt;b&gt;5.5&lt;/b&gt;Legal assistance and interpreting with staff trained to work with women and girls: female interpreters where appropriate, psychological support, information on rights.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;v m&quot;&gt;&lt;b&gt;5.6&lt;/b&gt;Specific protection for unaccompanied girls, single mothers, women who are pregnant or have young children, and women facing intersectional discrimination.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;s&quot;&gt;&lt;b&gt;5.7&lt;/b&gt;Access to gender-specific health services (sexual and reproductive health, obstetrics, pre- and post-natal care), services and education for men and boys as well; reform of the rules that restrict access on the basis of residence or status.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;s a&quot;&gt;&lt;b&gt;5.8&lt;/b&gt;Feminine hygiene products in reception centres, with appropriate assistance in their use.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;f&quot;&gt;&lt;b&gt;5.9&lt;/b&gt;Take into account the family situation and family reunification, to guarantee the right to family life.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;f&quot;&gt;&lt;b&gt;5.10&lt;/b&gt;Long-validity personal documents issued promptly to women and girls, including those who arrived through family reunification.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;l&quot;&gt;&lt;b&gt;5.11&lt;/b&gt;Common system for the recognition of qualifications and diplomas; gender-sensitive labour policies.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;l&quot;&gt;&lt;b&gt;5.12&lt;/b&gt;Regulate and improve working conditions to eliminate intersectional exploitation and discrimination.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;l&quot;&gt;&lt;b&gt;5.13&lt;/b&gt;More women than men in informal employment, such as care and domestic work: guarantee rights through oversight and accessible assistance.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;m v&quot;&gt;&lt;b&gt;5.14&lt;/b&gt;Gender-sensitive approach for migrant and refugee children, taking into account girls&#x27; greater vulnerability to violence and trafficking.&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;The three legal references behind these points&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;strong&gt;1951 Geneva Convention, Art. 1 A(2).&lt;/strong&gt; A refugee is a person with a well-founded fear of persecution for reasons of race, religion, nationality, membership of a particular social group or political opinion. Gender is not a separate ground: UNHCR maintains that a proper reading already covers gender-related claims, without adding grounds, but this does not automatically make every woman a refugee &lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.refworld.org/policy/legalguidance/unhcr/2002/31754&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNHCR Guidelines 2002&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Istanbul Convention.&lt;/strong&gt; Art. 60 requires States Parties to ensure that gender-based violence is recognised as a possible form of persecution, with gender-sensitive interpretation and procedures &lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://rm.coe.int/articles-60-and-61-of-ic/1680a87d65&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Council of Europe study&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Global Compact for Migration, Objective 3.&lt;/strong&gt; Accurate and timely information at all stages of migration &lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://rli.sas.ac.uk/news-events/blogs/gcm-commentary-objective-3-provide-accurate-timely-information-all-stages-migration&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Refugee Law Initiative commentary&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;&lt;p&gt;Try to answer, then open.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Why does “gendered phenomenon” not mean “a women&#x27;s problem”?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because norms and power shape everyone&#x27;s experience: slide 19 also names men and boys, and point 5.3 specifically concerns adolescent boys.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Explain the diagram on slide 17 in your own words.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The context has a structural part (opportunities created by policies and practices) and a cultural part (values and legitimate roles). They influence each other. GM acts on opportunity structures.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What does point 5.1 change for a woman fleeing gender-based violence?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Gender-based violence is recognised as a form of persecution under the 1951 Convention, and this can provide grounds for a protection claim.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Which point responds directly to the care drain and domestic work?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Point 5.13, on informal employment in care and domestic work; points 5.11 and 5.12 are also related.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s-env&quot;&gt;
&lt;div class=&quot;kicker&quot; style=&quot;color:var(--muted)&quot;&gt;A note&lt;/div&gt;
&lt;h2&gt;Environmental migration&lt;/h2&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;p&gt;The topic is announced on the cover &lt;span class=&quot;tag sl&quot;&gt;slide 1&lt;/span&gt;, but &lt;strong&gt;none of the 22 slides develops it&lt;/strong&gt;. Everything else in this box does not come from the course: check whether the material is in another lecture.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt; Under the IOM working definition (2007), &lt;strong&gt;environmental migrants&lt;/strong&gt; are persons who, chiefly because of sudden or gradual environmental changes that adversely affect their lives, are obliged or choose to leave, temporarily or permanently, within their country or abroad. &lt;em&gt;Climate migration&lt;/em&gt; is a subset. &lt;a href=&quot;https://www.informea.org/en/knowledge/glossary/environmental-migration&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;InforMEA glossary&lt;/a&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;The link with this lecture.&lt;/strong&gt; The environment is not among the five grounds in Art. 1 A(2) of the 1951 Convention: this is why the term used is migrants, and the expression “environmental refugees” is contested. Here too, the intersectional approach helps us ask who can leave and who stays &lt;span class=&quot;tag in&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;
&lt;/section&gt;
&lt;section id=&quot;s-more&quot;&gt;
&lt;div class=&quot;kicker&quot; style=&quot;color:var(--accent)&quot;&gt;End&lt;/div&gt;
&lt;h2&gt;Further reading&lt;/h2&gt;
&lt;p&gt;Each entry is an &lt;span class=&quot;tag ex&quot;&gt;external source&lt;/span&gt;: the details come from pages found through web search, often from abstracts or summaries, not from a full reading. The “why it matters” line is a comment by Claude.&lt;/p&gt;
&lt;h3&gt;Cited in the slides&lt;/h3&gt;
&lt;div class=&quot;src&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://researchonline.lse.ac.uk/id/eprint/66021&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Naila Kabeer, “Gender, poverty, and inequality: a brief history of feminist contributions in the field of international development”&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Gender &amp;amp; Development&lt;/em&gt; 23(2), 2015, pp. 189-205. A history of feminist contributions on gender, poverty and inequality, from micro to macro. Copy on the &lt;a href=&quot;https://nailakabeer.net/2016/01/30/gender-poverty-and-inequality-a-brief-history-of-feminist-contributions-in-the-field-of-international-development/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;author&#x27;s website&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the reading indicated on slide 4, and the vertical/horizontal framework comes from here.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://ucpress.edu/books/so-hows-the-family/paper&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Arlie Russell Hochschild, &lt;em&gt;So How&#x27;s the Family? And Other Essays&lt;/em&gt;&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;University of California Press, 2013. Thirteen essays, including the section “Women on the Global Backstage” on the global traffic in care and on children left at home.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: the reference “Hochschild: 2013, p. 147” on slide 15 appears to point to this volume, but the slide does not give the title: to be verified.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://pace.coe.int/files/30075/html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PACE, Resolution 2440 (2022), Gender mainstreaming of migration policies&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Adopted by the Standing Committee on 31 May 2022. Slide 16 links to a different file (&lt;a href=&quot;https://pace.coe.int/en/files/28577#trace-1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;28577&lt;/a&gt;), which the search did not make it possible to check.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the central document of Part 5. Compare the numbering of points 5.x here with the slides.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://pace.coe.int/files/29600/html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PACE, Doc. 15456, report (rapporteur P. Stienen)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Report of the Committee on Migration, Refugees and Displaced Persons, 16 February 2022. Accompanied by opinion Doc. 15457 of the Committee on Equality and Non-Discrimination.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explains the reasons and the data behind the requests; it is the link on slide 18.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://legal.un.org/avl/ha/prsr/prsr.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Convention relating to the Status of Refugees (1951)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Historical note from the UN Audiovisual Library of International Law. The text defines the refugee in Art. 1 A(2); gender reading in the &lt;a href=&quot;https://www.refworld.org/policy/legalguidance/unhcr/2002/31754&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNHCR Guidelines 2002&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: point 5.1 cannot be understood without this definition.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.coe.int/en/web/istanbul-convention/-/new-study-published-gender-based-asylum-claims-and-non-refoulement-articles-60-and-61-of-the-istanbul-convention&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Istanbul Convention (CETS No. 210), Arts. 60-61&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Council of Europe treaty opened for signature on 11 May 2011. The 2019 study explains gender-based asylum claims and non-refoulement (the prohibition on returning someone to a place where they risk persecution).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the European basis of the recognition cited in point 5.1.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.un.org/pga/72/wp-content/uploads/sites/51/2018/07/migration.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Global Compact for Safe, Orderly and Regular Migration&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Final text of July 2018, adopted in Marrakesh in December 2018 (A/RES/73/195). Objective 3 concerns information at all stages of migration.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the direct source of point 5.4.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.worldbank.org/en/news/factsheet/2025/06/05/june-2025-update-to-global-poverty-lines&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank, June 2025 Update to Global Poverty Lines&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Move of the threshold from $2.15 to $3.00 in 2021 PPP. See also &lt;a href=&quot;https://ourworldindata.org/from-1-90-to-2-15-a-day-the-updated-international-poverty-line&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Our World in Data&lt;/a&gt; on the move from $1.90 to $2.15.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: the slides stop at $2.15. The press reports about 808 million people in 2025 under the new threshold (&lt;a href=&quot;https://news.fundsforngos.org/2025/10/14/world-bank-revises-global-poverty-figures-upward-with-new-data-and-ppps/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;summary on the rates&lt;/a&gt;), a figure not comparable with the 648 million and one to check with the World Bank.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;The three videos in the slides&lt;/h4&gt;&lt;p&gt;&lt;a href=&quot;https://www.youtube.com/watch?v=kdrtB2saFrY&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Slide 8&lt;/a&gt; · &lt;a href=&quot;https://www.youtube.com/watch?v=QuBy6YzLMn0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Slide 12&lt;/a&gt; · &lt;a href=&quot;https://www.youtube.com/watch?v=iIIz2gb3UjM&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Slide 13&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Their content and availability could not be verified: the web search did not find them.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Not cited in the slides, useful for understanding&lt;/h3&gt;
&lt;div class=&quot;src&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.britannica.com/story/what-is-intersectionality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Kimberlé Crenshaw, “Demarginalizing the Intersection of Race and Sex” (1989)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;University of Chicago Legal Forum&lt;/em&gt;. The link leads to a Britannica explanation of the origin of the term.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it gives a root to the concept that the slides use without attribution.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://ec.europa.eu/eurostat/statistics-explained/index.php/Glossary:At-risk-of-poverty_rate&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eurostat, Glossary: At-risk-of-poverty rate&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Threshold at 60% of median equivalised income, after social transfers.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is a concrete example of the relative poverty on slide 7.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://sdg-tracker.org/no-poverty&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SDG Tracker, Goal 1: No Poverty&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Targets and indicators of the poverty goal, with updated data.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it places the 2030 goal on slide 10 within the SDG framework.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.migrationpolicy.org/article/global-dimensions-female-migration&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Migration Policy Institute, “The Global Dimensions of Female Migration”&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Historical series of the female share among migrants. Recent data: &lt;a href=&quot;https://www.un.org/development/desa/pd/node/3315&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN DESA, International Migrant Stock&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it makes it possible to discuss the feminization of migration with numbers.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.osservatoriolavorodomestico.it/wp-content/uploads/2025/09/Osservtorio-Domina-VII-Rapporto-Annuale.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOMINA Observatory, 7th Annual Report on domestic work&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;INPS data on domestic helpers and care assistants (&lt;em&gt;colf&lt;/em&gt; and &lt;em&gt;badanti&lt;/em&gt;) in Italy, by gender and nationality.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it fills in the “Case of Italy”, which on slide 15 is only a title.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.informea.org/en/knowledge/glossary/environmental-migration&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;InforMEA, Environmental migration&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Glossary entry that reproduces the 2007 IOM definition.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is a starting point for the topic announced on the cover.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
