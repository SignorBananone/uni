&lt;figcaption&gt;Le frecce sono una ricostruzione didattica dei legami: le slide non contengono una mappa.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;card&quot; style=&quot;font-size:.93rem&quot;&gt;&lt;strong&gt;Come leggere le provenienze.&lt;/strong&gt; Il testo corrente segue le slide, con &lt;span class=&quot;tag sl&quot;&gt;slide 5&lt;/span&gt; a indicare dove. &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt; segna una spiegazione aggiunta da Claude per chiarire ciò che le slide danno per scontato: non viene dal corso. &lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt; segna ciò che viene dal web, sempre con link.&lt;/div&gt;
&lt;/header&gt;

&lt;section id=&quot;s-ponte&quot;&gt;
&lt;div class=&quot;kicker&quot; style=&quot;color:var(--muted)&quot;&gt;Il raccordo&lt;/div&gt;
&lt;h2&gt;Da dove arriviamo&lt;/h2&gt;
&lt;p&gt;La lezione riparte da tre punti della precedente &lt;span class=&quot;tag sl&quot;&gt;slide 2&lt;/span&gt;. Oggi tornano tutti e tre.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Gender equality definition&lt;/h4&gt;&lt;p&gt;Il concetto di partenza. Qui viene incrociato con altri assi: poverty, age, migration background.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Measurements&lt;/h4&gt;&lt;p&gt;Due fonti: &lt;strong&gt;statistical offices&lt;/strong&gt; e &lt;strong&gt;population surveys&lt;/strong&gt;. Ricompaiono quando la Resolution 2440 chiede &lt;em&gt;gender statistics&lt;/em&gt; &lt;span class=&quot;tag sl&quot;&gt;slide 16&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cross-cutting goal negli SDGs&lt;/h4&gt;&lt;p&gt;Gender equality attraversa gli altri obiettivi. Oggi si vede con l&#x27;obiettivo di eliminare la extreme poverty entro il 2030 &lt;span class=&quot;tag sl&quot;&gt;slide 10&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;L&#x27;indice di oggi è breve &lt;span class=&quot;tag sl&quot;&gt;slide 3&lt;/span&gt;: &lt;strong&gt;intersectionality&lt;/strong&gt; applicata a gender, poverty e migration background. La lettura di riferimento è l&#x27;articolo di Naila Kabeer &lt;span class=&quot;tag sl&quot;&gt;slide 4&lt;/span&gt;.&lt;/p&gt;
&lt;/section&gt;

&lt;section id=&quot;s-ineq&quot; class=&quot;slate&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 1&lt;/div&gt;
&lt;h2&gt;Due assi: vertical e horizontal inequalities&lt;/h2&gt;
&lt;p&gt;Per capire cosa si incrocia, bisogna prima distinguere due modi di classificare le disuguaglianze &lt;span class=&quot;tag sl&quot;&gt;slide 5&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Vertical inequalities&lt;/h4&gt;&lt;p&gt;Disuguaglianze «in verticale»: mettono in fila individui o famiglie in base alla posizione nella gerarchia di income (reddito) o wealth (patrimonio). L&#x27;attenzione va alle disuguaglianze di &lt;strong&gt;class&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Horizontal inequalities&lt;/h4&gt;&lt;p&gt;Disuguaglianze «in orizzontale»: tra gruppi definiti socialmente, che spesso &lt;strong&gt;tagliano trasversalmente&lt;/strong&gt; i livelli di reddito. Riguardano la discriminazione legata a identità marginalizzate: gender, race, caste.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure&gt;
&lt;div class=&quot;ctrl&quot; id=&quot;iq-btn&quot; role=&quot;group&quot; aria-label=&quot;Vista del grafico&quot;&gt;
&lt;button data-v=&quot;v&quot; aria-pressed=&quot;true&quot;&gt;Vista vertical&lt;/button&gt;
&lt;button data-v=&quot;h&quot; aria-pressed=&quot;false&quot;&gt;Vista horizontal&lt;/button&gt;
&lt;button data-v=&quot;x&quot; aria-pressed=&quot;false&quot;&gt;Insieme&lt;/button&gt;
&lt;/div&gt;
&lt;svg id=&quot;iq&quot; viewBox=&quot;0 0 560 230&quot; role=&quot;img&quot; aria-label=&quot;Venti persone ordinate per reddito, poi separate per genere&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;live&quot; id=&quot;iq-t&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Esempio con 20 persone e redditi inventati, solo per mostrare la logica &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;&lt;strong&gt;Perché conta.&lt;/strong&gt; Per molto tempo le development policies (politiche di sviluppo) si sono concentrate su economic growth (crescita economica) e sull&#x27;eliminazione della &lt;em&gt;absolute poverty&lt;/em&gt; &lt;span class=&quot;tag sl&quot;&gt;slide 5&lt;/span&gt;. Questa impostazione guarda solo l&#x27;asse verticale. Se un gruppo resta svantaggiato a ogni livello di reddito, la sola crescita può non bastare a vederlo &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt; Kabeer ripercorre come i contributi femministi hanno criticato le misure di povertà basate sul reddito familiare, che trattano la household (l&#x27;insieme di chi vive e spende insieme) come un&#x27;unità unica e ignorano genere ed età al suo interno. Riassunto tratto da abstract e schede, non dal testo integrale: &lt;a href=&quot;https://researchonline.lse.ac.uk/id/eprint/66021&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda LSE&lt;/a&gt;, &lt;a href=&quot;https://policy-practice.oxfam.org/resources/gender-poverty-and-inequality-a-brief-history-of-feminist-contributions-in-the-560889/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda Oxfam&lt;/a&gt;.&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;&lt;p&gt;Prova a rispondere, poi apri.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Una donna manager e un uomo disoccupato: chi è più in alto sull&#x27;asse verticale? E su quello orizzontale?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sul verticale conta il reddito, quindi lei è più in alto. L&#x27;orizzontale non produce una classifica individuale: confronta i gruppi. Lei può comunque subire discriminazioni di gender pur stando in alto, ed è proprio il senso di «cut across income groups».&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché caste è un esempio di horizontal inequality anche se è legata alla ricchezza?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché è un gruppo definito socialmente e l&#x27;appartenenza non dipende dal reddito del momento: la discriminazione può restare anche quando il reddito sale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Cosa non riesce a vedere una politica centrata solo su growth e absolute poverty?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Gli svantaggi tra gruppi a parità di reddito e le disuguaglianze che non portano sotto una soglia minima.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;&lt;section id=&quot;s-pov&quot; class=&quot;ochre&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 2&lt;/div&gt;
&lt;h2&gt;Che cos&#x27;è la poverty&lt;/h2&gt;
&lt;p&gt;La slide chiede prima di tutto: &lt;strong&gt;«What images come to your mind?»&lt;/strong&gt; &lt;span class=&quot;tag sl&quot;&gt;slide 6&lt;/span&gt;. Fermati un attimo sulle tue immagini: sono più vicine a chi non ha da mangiare, o a chi non può permettersi ciò che intorno è normale? Sono le due definizioni che seguono.&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Absolute poverty&lt;/h4&gt;&lt;p&gt;Una persona non riesce a soddisfare i bisogni più elementari: food, clothing, shelter &lt;span class=&quot;tag sl&quot;&gt;slide 7&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Relative poverty&lt;/h4&gt;&lt;p&gt;Il reddito di una persona è sotto una certa percentuale del &lt;strong&gt;national median income&lt;/strong&gt; &lt;span class=&quot;tag sl&quot;&gt;slide 7&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;povero in senso relativo se &amp;nbsp; y &amp;lt; α · Me(y)&lt;small&gt;y = reddito · Me = mediana nazionale, il reddito della persona «a metà fila» · α = la percentuale scelta &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt; In Eurostat la at-risk-of-poverty threshold è il &lt;strong&gt;60%&lt;/strong&gt; del reddito disponibile equivalente mediano nazionale, dopo i trasferimenti sociali. Eurostat avverte che l&#x27;indicatore non implica di per sé un basso tenore di vita. &lt;a href=&quot;https://ec.europa.eu/eurostat/statistics-explained/index.php/Glossary:At-risk-of-poverty_rate&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Glossario Eurostat&lt;/a&gt;&lt;/div&gt;
&lt;h3&gt;Laboratorio: le due soglie si comportano in modo diverso&lt;/h3&gt;
&lt;figure&gt;
&lt;svg id=&quot;lab&quot; viewBox=&quot;0 0 560 262&quot; role=&quot;img&quot; aria-label=&quot;Quaranta persone su una scala di reddito con la linea assoluta e quella relativa&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;stats&quot;&gt;
&lt;div class=&quot;stat&quot;&gt;&lt;b id=&quot;l-me&quot;&gt;&lt;/b&gt;mediana&lt;/div&gt;
&lt;div class=&quot;stat&quot;&gt;&lt;b id=&quot;l-z&quot;&gt;&lt;/b&gt;linea relativa&lt;/div&gt;
&lt;div class=&quot;stat&quot;&gt;&lt;b id=&quot;l-a&quot;&gt;&lt;/b&gt;sotto la linea assoluta&lt;/div&gt;
&lt;div class=&quot;stat&quot;&gt;&lt;b id=&quot;l-r&quot;&gt;&lt;/b&gt;sotto la linea relativa&lt;/div&gt;
&lt;/div&gt;
&lt;label class=&quot;sl&quot;&gt;Crescita uguale per tutti &lt;b id=&quot;v-g&quot;&gt;&lt;/b&gt;&lt;input type=&quot;range&quot; id=&quot;r-g&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;0&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;Redistribuzione verso la mediana &lt;b id=&quot;v-d&quot;&gt;&lt;/b&gt;&lt;input type=&quot;range&quot; id=&quot;r-d&quot; min=&quot;0&quot; max=&quot;70&quot; step=&quot;5&quot; value=&quot;0&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;Percentuale α della mediana &lt;b id=&quot;v-a&quot;&gt;&lt;/b&gt;&lt;input type=&quot;range&quot; id=&quot;r-a&quot; min=&quot;40&quot; max=&quot;70&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;live&quot; id=&quot;l-t&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Popolazione inventata di 40 persone, asse logaritmico, linea assoluta fissa a 3 $ &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;. Non sono dati reali.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;&lt;strong&gt;Il risultato da ricordare:&lt;/strong&gt; con la crescita uguale per tutti la absolute poverty cala, mentre la relative poverty non si muove. Perciò una politica di sola growth può ridurre la prima lasciando intatta la seconda &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;
&lt;h3&gt;La poverty line&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;p&gt;È &lt;strong&gt;«an estimated, imaginary line developed by economists in order to define a poor person»&lt;/strong&gt;: una linea stimata e immaginaria. Con misure standard viene calcolata in modo che tutti i poveri stiano sotto e chiunque sia sopra non sia povero &lt;span class=&quot;tag sl&quot;&gt;slide 9&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;«Imaginary» è la parola chiave: la soglia è una convenzione utile a contare. Chi vive con 2,14 $ e chi vive con 2,16 $ non hanno vite diverse, ma finiscono in categorie diverse &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;
&lt;figure data-stepper&gt;
&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;Tre valori della poverty line nel tempo&quot;&gt;
&lt;path class=&quot;ln&quot; d=&quot;M40 95H530&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;g data-s=&quot;1&quot; text-anchor=&quot;middle&quot;&gt;&lt;circle class=&quot;fc&quot; cx=&quot;110&quot; cy=&quot;95&quot; r=&quot;11&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;110&quot; y=&quot;66&quot;&gt;1,90 $&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;110&quot; y=&quot;128&quot;&gt;prezzi 2011&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;2&quot; text-anchor=&quot;middle&quot;&gt;&lt;circle class=&quot;fc&quot; cx=&quot;280&quot; cy=&quot;95&quot; r=&quot;11&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;280&quot; y=&quot;66&quot;&gt;2,15 $&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;280&quot; y=&quot;128&quot;&gt;prezzi 2017&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;3&quot; text-anchor=&quot;middle&quot;&gt;&lt;circle class=&quot;fc&quot; cx=&quot;450&quot; cy=&quot;95&quot; r=&quot;11&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;450&quot; y=&quot;66&quot;&gt;3,00 $&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;450&quot; y=&quot;128&quot;&gt;prezzi 2021&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;1&quot;&gt;&lt;p&gt;&lt;strong&gt;1,90 $ al giorno.&lt;/strong&gt; La vecchia soglia citata dalle slide &lt;span class=&quot;tag sl&quot;&gt;slide 9&lt;/span&gt;. I dollari sono &lt;em&gt;PPP&lt;/em&gt;, purchasing power parity: dollari «teorici» che comprano lo stesso paniere in ogni paese, così i confronti non dipendono dal cambio &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;2,15 $ al giorno: è la soglia del corso.&lt;/strong&gt; Sotto questa cifra si è in &lt;strong&gt;extreme poverty&lt;/strong&gt;; nel 2019 erano circa &lt;strong&gt;648 milioni&lt;/strong&gt; di persone &lt;span class=&quot;tag sl&quot;&gt;slide 9&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt; La slide data l&#x27;aggiornamento al 2020, ma Our World in Data lo colloca a settembre 2022. Il valore cresce soprattutto perché cambia l&#x27;anno dei prezzi, quindi non è un innalzamento vero e proprio. &lt;a href=&quot;https://ourworldindata.org/from-1-90-to-2-15-a-day-the-updated-international-poverty-line&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Our World in Data&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;3&quot;&gt;&lt;p&gt;&lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt; &lt;strong&gt;Dopo le slide:&lt;/strong&gt; a giugno 2025 la World Bank ha portato la soglia a 3,00 $ in PPP 2021. Il conteggio dei poveri è salito, ma Our World in Data avverte che ciò riflette la soglia più alta, non un mondo più povero (&lt;a href=&quot;https://intellinews.com/extreme-poverty-falling-steadily-owid-401156&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sintesi&lt;/a&gt;). Per l&#x27;esame verifica quale cifra chiede il corso. &lt;a href=&quot;https://www.worldbank.org/en/news/factsheet/2025/06/05/june-2025-update-to-global-poverty-lines&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank, factsheet giugno 2025&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;prev&quot;&gt;← Indietro&lt;/button&gt;&lt;output&gt;&lt;/output&gt;&lt;button class=&quot;next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
&lt;/figure&gt;
&lt;h3&gt;Outlook: il 2030 è fuori portata&lt;/h3&gt;
&lt;p&gt;Le crisi recenti hanno allontanato il mondo dall&#x27;obiettivo di eliminare la extreme poverty entro il 2030 &lt;span class=&quot;tag sl&quot;&gt;slide 10&lt;/span&gt;. Con i trend attuali, nel 2030 &lt;strong&gt;574 milioni&lt;/strong&gt; di persone, quasi il 7% della popolazione mondiale, vivrebbero ancora con meno di 2,15 $ al giorno.&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 560 170&quot; role=&quot;img&quot; aria-label=&quot;Milioni di persone in extreme poverty: 648 nel 2019, 719 nel 2020, 574 proiettati al 2030&quot;&gt;
&lt;g&gt;&lt;text x=&quot;0&quot; y=&quot;37&quot;&gt;2019&lt;/text&gt;&lt;rect class=&quot;fc&quot; x=&quot;62&quot; y=&quot;18&quot; width=&quot;389&quot; height=&quot;28&quot; rx=&quot;3&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;460&quot; y=&quot;39&quot;&gt;648 mln&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;text x=&quot;0&quot; y=&quot;87&quot;&gt;2020&lt;/text&gt;&lt;rect x=&quot;62&quot; y=&quot;68&quot; width=&quot;431&quot; height=&quot;28&quot; rx=&quot;3&quot; fill=&quot;none&quot; stroke-dasharray=&quot;5 4&quot; style=&quot;stroke:var(--accent);stroke-width:1.5&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;499&quot; y=&quot;89&quot;&gt;719&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;text x=&quot;0&quot; y=&quot;137&quot;&gt;2030&lt;/text&gt;&lt;rect x=&quot;62&quot; y=&quot;118&quot; width=&quot;344&quot; height=&quot;28&quot; rx=&quot;3&quot; class=&quot;fc&quot; style=&quot;fill-opacity:.45&quot; stroke-dasharray=&quot;3 3&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;415&quot; y=&quot;139&quot;&gt;574 mln&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;415&quot; y=&quot;160&quot;&gt;proiezione&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Soglia 2,15 $. 2019 e 2030: &lt;span class=&quot;tag sl&quot;&gt;slide 9-10&lt;/span&gt;. 2020 (bordo tratteggiato): &lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt; stampa sul rapporto World Bank 2022, con un aumento di circa 71 milioni in un anno per la pandemia. &lt;a href=&quot;https://nextbillion.net/news/goal-of-ending-extreme-poverty-by-2030-out-of-reach-report-says&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NextBillion&lt;/a&gt;, &lt;a href=&quot;https://www.worldbank.org/en/news/immersive-story/2022/10/05/covid-19-dealt-a-historic-blow-to-poverty-reduction&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank&lt;/a&gt;. Queste cifre non sono confrontabili con quelle calcolate con la soglia a 3 $.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;La sfida è più dura perché la extreme poverty si concentra dove è più difficile eliminarla &lt;span class=&quot;tag sl&quot;&gt;slide 10&lt;/span&gt;:&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Sub-Saharan Africa&lt;/h4&gt;&lt;p&gt;La prima delle tre aree indicate dalla slide; non dà una percentuale.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Conflict-affected areas&lt;/h4&gt;&lt;p&gt;La guerra distrugge reddito e servizi &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;: è il legame con la parte sulle vulnerabilità.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Rural areas&lt;/h4&gt;&lt;p&gt;Meno servizi, mercati e infrastrutture &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt; L&#x27;obiettivo è il &lt;strong&gt;Target 1.1 di SDG 1&lt;/strong&gt;. Il Target 1.2 usa invece le definizioni nazionali e la povertà «in all its dimensions»: quindi l&#x27;agenda non si ferma alla soglia in dollari. &lt;a href=&quot;https://sdg-tracker.org/no-poverty&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SDG Tracker&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;&lt;p&gt;Prova a rispondere, poi apri.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Se tutti i redditi di un paese raddoppiano, cosa succede a absolute e relative poverty?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;La absolute cala, perché la soglia è fissa. La relative resta uguale, perché raddoppia anche la mediana e con lei la soglia.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Può esserci relative poverty in un paese ricco senza nessuno in extreme poverty?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sì. Chi è sotto, per esempio, il 60% della mediana di un paese ricco può stare molto sopra la soglia internazionale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché la slide definisce la poverty line «imaginary»?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché è una costruzione degli economisti per contare i poveri, non un confine naturale: cambia con il metodo e con i prezzi di riferimento.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Cosa significano 648 e 574 milioni? Quale dei due è una stima sul futuro?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;648 milioni sono le persone sotto 2,15 $ nel 2019. 574 milioni, quasi il 7% della popolazione mondiale, è la proiezione al 2030 con i trend attuali.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s-int&quot; class=&quot;brick&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 3&lt;/div&gt;
&lt;h2&gt;L&#x27;intersectionality approach&lt;/h2&gt;
&lt;div class=&quot;def&quot;&gt;&lt;p&gt;Significa, nelle slide, &lt;strong&gt;considerare la gender inequality quando si affronta la poverty&lt;/strong&gt;, guardando agli aspetti globali e locali e ai domini privato e pubblico &lt;span class=&quot;tag sl&quot;&gt;slide 11&lt;/span&gt;. Più in generale, gli assi di svantaggio non si studiano separati: la loro combinazione produce esperienze proprie &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt; Il termine non compare con un&#x27;autrice nelle slide. Viene attribuito a Kimberlé Crenshaw (1989), che analizzò casi in cui i tribunali non permettevano alle lavoratrici nere di far valere insieme discriminazione di razza e di sesso; l&#x27;idea era già presente nel femminismo nero precedente. &lt;a href=&quot;https://www.britannica.com/story/what-is-intersectionality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Britannica&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Global e local&lt;/h4&gt;&lt;p&gt;Un fenomeno globale prende forma in un luogo preciso: per esempio la domanda mondiale di elettronica e chi, in un dato paese, ne sopporta i rischi &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Private e public&lt;/h4&gt;&lt;p&gt;Private: chi decide le spese e chi fa il lavoro di cura in casa. Public: lavoro, leggi, servizi. Una misura solo «pubblica» non vede cosa accade dentro la household &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Accendi e spegni gli assi&lt;/h3&gt;
&lt;figure&gt;
&lt;div class=&quot;ctrl&quot; id=&quot;vn-btn&quot; role=&quot;group&quot; aria-label=&quot;Assi da incrociare&quot;&gt;
&lt;button data-k=&quot;G&quot; aria-pressed=&quot;true&quot;&gt;Gender&lt;/button&gt;
&lt;button data-k=&quot;P&quot; aria-pressed=&quot;true&quot;&gt;Poverty&lt;/button&gt;
&lt;button data-k=&quot;A&quot; aria-pressed=&quot;true&quot;&gt;Age&lt;/button&gt;
&lt;button data-k=&quot;M&quot; aria-pressed=&quot;false&quot;&gt;Migration&lt;/button&gt;
&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;Quattro cerchi sovrapposti, uno per asse&quot;&gt;
&lt;g id=&quot;vn&quot;&gt;
&lt;circle data-k=&quot;G&quot; cx=&quot;225&quot; cy=&quot;115&quot; r=&quot;90&quot;/&gt;&lt;circle data-k=&quot;P&quot; cx=&quot;335&quot; cy=&quot;115&quot; r=&quot;90&quot;/&gt;&lt;circle data-k=&quot;A&quot; cx=&quot;225&quot; cy=&quot;185&quot; r=&quot;90&quot;/&gt;&lt;circle data-k=&quot;M&quot; cx=&quot;335&quot; cy=&quot;185&quot; r=&quot;90&quot;/&gt;
&lt;/g&gt;
&lt;g&gt;&lt;text class=&quot;h&quot; x=&quot;130&quot; y=&quot;50&quot; text-anchor=&quot;end&quot;&gt;Gender&lt;/text&gt;&lt;text class=&quot;h&quot; x=&quot;430&quot; y=&quot;50&quot;&gt;Poverty&lt;/text&gt;&lt;text class=&quot;h&quot; x=&quot;130&quot; y=&quot;258&quot; text-anchor=&quot;end&quot;&gt;Age&lt;/text&gt;&lt;text class=&quot;h&quot; x=&quot;430&quot; y=&quot;258&quot;&gt;Migration&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;live&quot; id=&quot;vn-t&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Gli esempi combinano punti delle slide con letture di Claude &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;h3&gt;Cosa significa l&#x27;asterisco in «Gender*Poverty*Age»&lt;/h3&gt;
&lt;p&gt;Le slide scrivono &lt;em&gt;Gender*Poverty*Age&lt;/em&gt; &lt;span class=&quot;tag sl&quot;&gt;slide 12-13&lt;/span&gt;. Il simbolo non è spiegato, ma ricorda la notazione statistica della &lt;strong&gt;interaction&lt;/strong&gt;: l&#x27;effetto di un fattore cambia secondo il livello dell&#x27;altro. Quindi lo svantaggio di una donna povera può essere più della somma dei due svantaggi &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;R = β₀ + β₁·G + β₂·P + β₃·(G·P)&lt;small&gt;G = 1 se donna, P = 1 se povera · β₃ è la interaction: la parte che la semplice somma non spiega &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;&lt;/small&gt;&lt;/div&gt;
&lt;figure&gt;
&lt;svg id=&quot;ix&quot; viewBox=&quot;0 0 560 240&quot; role=&quot;img&quot; aria-label=&quot;Quattro barre di rischio con e senza interazione&quot;&gt;&lt;/svg&gt;
&lt;label class=&quot;sl&quot;&gt;Interaction β₃ &lt;b id=&quot;v-i&quot;&gt;&lt;/b&gt;&lt;input type=&quot;range&quot; id=&quot;r-i&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;12&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;live&quot; id=&quot;ix-t&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Numeri inventati: β₀ = 10, β₁ = 5, β₂ = 15, «rischio» su scala arbitraria &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;h3&gt;Crisi e vulnerabilità a catena&lt;/h3&gt;
&lt;p&gt;War, conflicts ed economic crises innescano ulteriori vulnerabilità &lt;span class=&quot;tag sl&quot;&gt;slide 11&lt;/span&gt;. Segui la catena:&lt;/p&gt;
&lt;figure data-stepper&gt;
&lt;svg viewBox=&quot;0 0 560 310&quot; role=&quot;img&quot; aria-label=&quot;Catena da crisi a rischio di povertà per le female headed households&quot;&gt;
&lt;path class=&quot;ln&quot; d=&quot;M240 62L150 92&quot; marker-end=&quot;url(#ar)&quot; data-s=&quot;2 3 4 5&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M320 62L410 92&quot; marker-end=&quot;url(#ar)&quot; data-s=&quot;3 4 5&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M420 156V178&quot; marker-end=&quot;url(#ar)&quot; data-s=&quot;4 5&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M400 242L334 256&quot; marker-end=&quot;url(#ar)&quot; data-s=&quot;5&quot;/&gt;
&lt;g data-s=&quot;1 2 3 4 5&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect class=&quot;fc&quot; x=&quot;150&quot; y=&quot;8&quot; width=&quot;260&quot; height=&quot;54&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;280&quot; y=&quot;32&quot; style=&quot;font-weight:600&quot;&gt;War, conflicts&lt;/text&gt;&lt;text x=&quot;280&quot; y=&quot;52&quot; style=&quot;font-weight:600&quot;&gt;economic crises&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;2 3 4 5&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect class=&quot;bx&quot; x=&quot;10&quot; y=&quot;94&quot; width=&quot;240&quot; height=&quot;62&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;120&quot;&gt;Women: più esposte&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;142&quot;&gt;degli uomini alla violence&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;3 4 5&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect class=&quot;bx&quot; x=&quot;300&quot; y=&quot;94&quot; width=&quot;250&quot; height=&quot;62&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;425&quot; y=&quot;120&quot;&gt;Men rischiano di partire:&lt;/text&gt;&lt;text x=&quot;425&quot; y=&quot;142&quot;&gt;soldiers, migration&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;4 5&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect class=&quot;bx&quot; x=&quot;300&quot; y=&quot;180&quot; width=&quot;250&quot; height=&quot;62&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;425&quot; y=&quot;206&quot;&gt;Female headed household&lt;/text&gt;&lt;text x=&quot;425&quot; y=&quot;228&quot;&gt;guidata da una donna&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;5&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect class=&quot;fc&quot; x=&quot;60&quot; y=&quot;244&quot; width=&quot;270&quot; height=&quot;62&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;195&quot; y=&quot;270&quot; style=&quot;font-weight:600&quot;&gt;Più poverty risks&lt;/text&gt;&lt;text x=&quot;195&quot; y=&quot;292&quot;&gt;soprattutto con figli piccoli&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;1&quot;&gt;&lt;p&gt;&lt;strong&gt;Lo shock.&lt;/strong&gt; Guerre e crisi economiche colpiscono tutti, ma non allo stesso modo. Il punto delle slide è che l&#x27;effetto passa per il gender.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;Primo canale: la violence.&lt;/strong&gt; Le donne sono più esposte degli uomini alla violenza &lt;span class=&quot;tag sl&quot;&gt;slide 11&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;3&quot;&gt;&lt;p&gt;&lt;strong&gt;Secondo canale: le partenze.&lt;/strong&gt; Gli uomini rischiano di lasciare la household perché diventano soldati o migrano &lt;span class=&quot;tag sl&quot;&gt;slide 11&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;4&quot;&gt;&lt;p&gt;&lt;strong&gt;La famiglia si riorganizza.&lt;/strong&gt; Resta una &lt;em&gt;female headed household&lt;/em&gt;. Una sola adulta deve guadagnare e prendersi cura degli altri: il tempo diventa una risorsa scarsa &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;5&quot;&gt;&lt;p&gt;&lt;strong&gt;L&#x27;esito.&lt;/strong&gt; Queste famiglie sono più esposte ai poverty risks, soprattutto quando i figli sono molto piccoli &lt;span class=&quot;tag sl&quot;&gt;slide 11&lt;/span&gt;: qui si incrociano gender, poverty e age.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;prev&quot;&gt;← Indietro&lt;/button&gt;&lt;output&gt;&lt;/output&gt;&lt;button class=&quot;next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
&lt;/figure&gt;
&lt;h3&gt;I tre casi video&lt;/h3&gt;
&lt;p&gt;Le slide affidano gli esempi a tre video, con una sola immagine ciascuno. Claude non ha potuto guardarli: qui c&#x27;è solo ciò che si vede nelle slide, più domande da usare mentre li guardi.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Video&quot;&gt;&lt;button role=&quot;tab&quot; data-t=&quot;a&quot; aria-selected=&quot;true&quot;&gt;Extreme poverty in India&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;b&quot; aria-selected=&quot;false&quot;&gt;The cost of electronics&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;c&quot; aria-selected=&quot;false&quot;&gt;Gender*poverty*age&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-p=&quot;a&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide 8&lt;/span&gt; Il fotogramma mostra una famiglia in un&#x27;abitazione molto semplice: una donna cucina sul pavimento, un uomo è seduto in primo piano, dei bambini stanno intorno.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Mentre guardi:&lt;/strong&gt; quali bisogni di base mancano? Chi fa quale lavoro in casa?&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.youtube.com/watch?v=kdrtB2saFrY&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Apri il video indicato nella slide&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-p=&quot;b&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide 12&lt;/span&gt; Titolo della slide: &lt;em&gt;Intersection of inequality / Gender*Poverty*Age&lt;/em&gt;. Nel fotogramma, della serie «Risky Business» di Insider, un ragazzo accovacciato sui binari maneggia pezzi di telefono.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Mentre guardi:&lt;/strong&gt; perché questo lavoro tocca proprio a persone giovani e povere? Che ruolo ha il gender? Che legame c&#x27;è tra chi usa l&#x27;elettronica e chi ne subisce i rischi?&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.youtube.com/watch?v=QuBy6YzLMn0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Apri il video indicato nella slide&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-p=&quot;c&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide 13&lt;/span&gt; Fotogramma Al Jazeera con una giovane donna in abito tradizionale. La slide non aggiunge testo, oltre al titolo &lt;em&gt;Gender*poverty*age&lt;/em&gt;.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Mentre guardi:&lt;/strong&gt; quale scelta è davvero disponibile a questa persona, data la sua età e il suo reddito familiare?&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.youtube.com/watch?v=iIIz2gb3UjM&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Apri il video indicato nella slide&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;meta&quot;&gt;L&#x27;indirizzo è stato letto dall&#x27;immagine della slide e alcune lettere (I maiuscola, l minuscola) sono ambigue. Se non si apre, usa il link nel PDF.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;&lt;p&gt;Prova a rispondere, poi apri.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra sommare due svantaggi e farli intersecare?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Nella somma ogni svantaggio resta uguale qualunque sia l&#x27;altro. Nella intersection l&#x27;effetto di uno cambia in presenza dell&#x27;altro, creando una situazione che i due assi presi da soli non descrivono.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché la partenza degli uomini aumenta il rischio di povertà per chi resta?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Si crea spesso una female headed household, più esposta ai poverty risks, soprattutto con bambini molto piccoli.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Fai un esempio per «private domain» e uno per «public domain».&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Private: lavoro di cura non pagato o decisioni di spesa in famiglia. Public: mercato del lavoro, leggi, servizi per l&#x27;infanzia.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s-mig&quot; class=&quot;sage&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 4&lt;/div&gt;
&lt;h2&gt;Gender and migration&lt;/h2&gt;
&lt;blockquote&gt;«just as poor countries suffer a brain drain as trained personnel move from the South to the North, so too they suffer a care drain»&lt;footer&gt;Hochschild, 2013, p. 147, citata in &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;&lt;/footer&gt;&lt;/blockquote&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Confronto&quot;&gt;&lt;button role=&quot;tab&quot; data-t=&quot;a&quot; aria-selected=&quot;true&quot;&gt;Brain drain&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;b&quot; aria-selected=&quot;false&quot;&gt;Care drain&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-p=&quot;a&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;strong&gt;Brain drain&lt;/strong&gt;, «fuga di cervelli»: personale formato si sposta dal South al North &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;. Il paese d&#x27;origine perde competenze in cui aveva investito &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-p=&quot;b&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Care drain&lt;/strong&gt;, «fuga di cura»: lo stesso meccanismo applicato al lavoro di cura &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;. Il paese d&#x27;origine perde chi si prende cura di bambini e anziani, e il vuoto ricade sulle famiglie rimaste &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Feminization of migration&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;p&gt;Flussi migratori caratterizzati da donne che lasciano il proprio paese per &lt;strong&gt;motivi economici&lt;/strong&gt;, spesso come &lt;strong&gt;first-migrant&lt;/strong&gt; (la prima della famiglia a partire), che lavorano nel &lt;strong&gt;care sector&lt;/strong&gt; (il settore della cura) come domestic workers, cioè lavoratrici domestiche &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;figure data-stepper&gt;
&lt;svg viewBox=&quot;0 0 600 310&quot; role=&quot;img&quot; aria-label=&quot;Catena di cura tra paese di origine e paese di destinazione&quot;&gt;
&lt;rect x=&quot;6&quot; y=&quot;6&quot; width=&quot;238&quot; height=&quot;298&quot; rx=&quot;10&quot; style=&quot;fill:var(--cbg)&quot;/&gt;&lt;rect x=&quot;356&quot; y=&quot;6&quot; width=&quot;238&quot; height=&quot;298&quot; rx=&quot;10&quot; style=&quot;fill:var(--cbg)&quot;/&gt;
&lt;text class=&quot;h&quot; x=&quot;125&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot;&gt;South: origine&lt;/text&gt;&lt;text class=&quot;h&quot; x=&quot;475&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot;&gt;North: destinazione&lt;/text&gt;
&lt;g data-s=&quot;1 2 3 4 5 6&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect class=&quot;bx&quot; x=&quot;28&quot; y=&quot;52&quot; width=&quot;194&quot; height=&quot;52&quot; rx=&quot;7&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;83&quot;&gt;famiglia d&#x27;origine&lt;/text&gt;&lt;/g&gt;

&lt;g data-s=&quot;2 3 4 5 6&quot;&gt;&lt;path class=&quot;ln&quot; d=&quot;M226 78H374&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke-width:2.5&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;cardhalo&quot;&gt;first-migrant&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;3 4 5 6&quot;&gt;&lt;text x=&quot;520&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot;&gt;care work&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;4 5 6&quot;&gt;&lt;path class=&quot;ln&quot; d=&quot;M390 106V136H190V108&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke-width:2.5&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; class=&quot;cardhalo&quot;&gt;remittances&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;5 6&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect class=&quot;bx&quot; x=&quot;28&quot; y=&quot;172&quot; width=&quot;194&quot; height=&quot;72&quot; rx=&quot;7&quot; style=&quot;stroke:var(--accent)&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;199&quot;&gt;chi cura chi resta?&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;223&quot; style=&quot;fill:var(--accent);font-weight:600&quot;&gt;care drain&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;6&quot;&gt;&lt;path class=&quot;ln&quot; d=&quot;M125 244V272H470V108&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke-width:2.5&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;262&quot; text-anchor=&quot;middle&quot; class=&quot;cardhalo&quot;&gt;family reunification&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;1 2 3 4 5 6&quot; text-anchor=&quot;middle&quot;&gt;&lt;text x=&quot;84&quot; y=&quot;146&quot;&gt;motivi economici&lt;/text&gt;&lt;path class=&quot;ln&quot; d=&quot;M90 128V108&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;1&quot;&gt;&lt;p&gt;&lt;strong&gt;La spinta.&lt;/strong&gt; La partenza nasce da motivi economici &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;: la poverty è una delle cause del movimento.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;2&quot;&gt;&lt;p&gt;&lt;strong&gt;First-migrant.&lt;/strong&gt; Spesso è lei a partire per prima &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;. Il modello classico, con l&#x27;uomo che parte e la moglie che lo raggiunge, si inverte &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;3&quot;&gt;&lt;p&gt;&lt;strong&gt;Il care sector.&lt;/strong&gt; Lavora come domestic worker &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;: spesso assiste la famiglia di qualcun altro, con lavoro poco visibile perché svolto in casa &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;4&quot;&gt;&lt;p&gt;&lt;strong&gt;Remittances&lt;/strong&gt;, i soldi inviati a casa &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;. Sostengono la famiglia, ma non sostituiscono la presenza.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;5&quot;&gt;&lt;p&gt;&lt;strong&gt;Il vuoto a casa.&lt;/strong&gt; La cura va riorganizzata: spesso ricade su nonne, figlie o altre donne &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;. È il care drain: dal South al North si sposta anche la cura.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt; Hochschild è associata al concetto di &lt;em&gt;global care chain&lt;/em&gt; (saggio «Love and Gold», in &lt;em&gt;Global Woman&lt;/em&gt;). &lt;a href=&quot;https://wikiwand.com/en/articles/Arlie_Russell_Hochschild&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda su Hochschild&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;sp&quot; data-s=&quot;6&quot;&gt;&lt;p&gt;&lt;strong&gt;Reconjunction.&lt;/strong&gt; La slide scrive «Reconjuction»: si intende il ricongiungimento, in inglese &lt;em&gt;family reunification&lt;/em&gt; &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;. La famiglia può raggiungerla nel paese di destinazione &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;; il tema ritorna ai punti 5.2, 5.9 e 5.10 della parte sulle policy.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepbar&quot;&gt;&lt;button class=&quot;prev&quot;&gt;← Indietro&lt;/button&gt;&lt;output&gt;&lt;/output&gt;&lt;button class=&quot;next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
&lt;/figure&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt; &lt;strong&gt;Attenzione al nome.&lt;/strong&gt; La quota di donne tra i migranti internazionali è quasi ferma da decenni: circa il 46,6% nel 1960, il 48,8% nel 2000 (&lt;a href=&quot;https://www.migrationpolicy.org/article/global-dimensions-female-migration&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Migration Policy Institute&lt;/a&gt;), intorno al 48% nel 2024 (&lt;a href=&quot;https://www.dawn.com/news/1892702&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Dawn sui dati ONU&lt;/a&gt;). Quindi «feminization» si capisce meglio come cambiamento di &lt;em&gt;modo&lt;/em&gt; di migrare, autonomo e per lavoro, più che di numeri &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/div&gt;
&lt;h3&gt;Case of Italy&lt;/h3&gt;
&lt;p&gt;Nella slide è solo un titolo &lt;span class=&quot;tag sl&quot;&gt;slide 15&lt;/span&gt;: quanto segue non viene dal corso, quindi riprendilo dagli appunti.&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 560 120&quot; role=&quot;img&quot; aria-label=&quot;Lavoratori domestici regolari in Italia: 60 per cento donne straniere, 28,5 donne italiane, 11,1 uomini&quot;&gt;
&lt;rect x=&quot;0&quot; y=&quot;10&quot; width=&quot;338&quot; height=&quot;54&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;rect x=&quot;338&quot; y=&quot;10&quot; width=&quot;160&quot; height=&quot;54&quot; class=&quot;fc&quot;/&gt;&lt;rect x=&quot;498&quot; y=&quot;10&quot; width=&quot;62&quot; height=&quot;54&quot; style=&quot;fill:var(--rule)&quot;/&gt;
&lt;text x=&quot;12&quot; y=&quot;44&quot; style=&quot;fill:var(--paper);font-weight:600&quot;&gt;donne straniere ~60%&lt;/text&gt;&lt;text x=&quot;418&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;italiane 28,5%&lt;/text&gt;&lt;text x=&quot;529&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;11,1%&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;560&quot; y=&quot;86&quot; text-anchor=&quot;end&quot;&gt;uomini: l&#x27;ultimo segmento&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;0&quot; y=&quot;86&quot;&gt;Lavoratori domestici regolari, dati INPS&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;&lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt; Osservatorio DOMINA su dati INPS 2024, come riportati dalla stampa e dalle sintesi: donne 88,9%, badanti (assistenti familiari) 50,5% del totale. Si stima un lavoro irregolare attorno al 48,8%, quindi le cifre descrivono solo la parte regolare. Controlla sul &lt;a href=&quot;https://www.osservatoriolavorodomestico.it/wp-content/uploads/2025/09/Osservtorio-Domina-VII-Rapporto-Annuale.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;VII Rapporto DOMINA&lt;/a&gt;.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;&lt;p&gt;Prova a rispondere, poi apri.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Definisci il care drain partendo dal brain drain.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Come il brain drain sposta personale formato dal South al North, il care drain sposta la capacità di cura, sottraendola alle famiglie e alle comunità d&#x27;origine.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quali elementi caratterizzano la feminization of migration secondo la slide?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Motivi economici, donna spesso first-migrant, lavoro nel care sector come domestic worker, remittances e reconjunction. Caso citato: l&#x27;Italia.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Dove si vedono gender, poverty e migration insieme in questa storia?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Le norme di genere orientano verso il lavoro di cura, la povertà spinge a partire e lo status di migrante indebolisce la posizione sul lavoro: nessuno dei tre assi da solo spiega la situazione.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s-gm&quot; class=&quot;terra&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 5&lt;/div&gt;
&lt;h2&gt;Gendering migration policies&lt;/h2&gt;
&lt;div class=&quot;def&quot;&gt;&lt;p&gt;&lt;strong&gt;Gender mainstreaming (GM)&lt;/strong&gt;: integrare una prospettiva di gender equality in tutte le politiche, invece di trattarla come un settore a parte. Nel campo migratorio la richiede la &lt;strong&gt;Resolution 2440&lt;/strong&gt; del Council of Europe &lt;span class=&quot;tag sl&quot;&gt;slide 16&lt;/span&gt;; il rapporto di base è il Doc. 15456 del 16 febbraio 2022, rapporteur (relatrice) Petra Stienen &lt;span class=&quot;tag sl&quot;&gt;slide 18&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt; Definizione classica del Council of Europe (1998): «(re)organisation, improvement, development and evaluation of policy processes», perché la prospettiva di gender entri in tutte le politiche, a tutti i livelli e in tutte le fasi. &lt;a href=&quot;https://rm.coe.int/1680630394&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Council of Europe&lt;/a&gt;. La risoluzione è stata adottata il 31 maggio 2022 dallo Standing Committee: &lt;a href=&quot;https://pace.coe.int/files/30075/html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo adottato&lt;/a&gt;.&lt;/div&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;p&gt;&lt;strong&gt;Da non confondere.&lt;/strong&gt; La slide 16 scrive «EU MS», ma la Resolution viene dalla Parliamentary Assembly del &lt;strong&gt;Council of Europe&lt;/strong&gt;, che non è l&#x27;Unione Europea: conta 46 stati membri, tra cui i 27 UE (&lt;a href=&quot;https://www.coe.int/en/web/tbilisi/the-coe/objectives-and-missions&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Council of Europe&lt;/a&gt; &lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt;). Il testo della slide 20 parla infatti di «member States». Vale chiedere conferma a lezione.&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;Tre richieste citate come esempio &lt;span class=&quot;tag sl&quot;&gt;slide 16&lt;/span&gt;:&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Gender statistics&lt;/h4&gt;&lt;p&gt;Invito ad adottarle: senza dati divisi per genere il problema non si vede. È il legame con la lezione precedente.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Balanced representation&lt;/h4&gt;&lt;p&gt;Rappresentanza equilibrata nel policy making, con approccio intersezionale: includere chi ha un migrant background.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Financial inclusion&lt;/h4&gt;&lt;p&gt;Inclusione finanziaria dei migranti tramite &lt;em&gt;gender-responsive programmes&lt;/em&gt;, programmi costruiti sui bisogni diversi di donne e uomini.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Perché conta il societal context&lt;/h3&gt;
&lt;p&gt;Una policy agisce dentro un contesto con due componenti che si alimentano a vicenda &lt;span class=&quot;tag sl&quot;&gt;slide 17&lt;/span&gt;.&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;Il societal context si divide in structural component e cultural dimension, che si influenzano a vicenda; il GM abilita le opportunity structures&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;105&quot; y=&quot;8&quot; width=&quot;350&quot; height=&quot;44&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;280&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Relevance of the societal context&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M240 52L135 92&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M320 52L425 92&quot;/&gt;
&lt;rect class=&quot;fc&quot; x=&quot;20&quot; y=&quot;92&quot; width=&quot;225&quot; height=&quot;78&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;132&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot;&gt;Structural&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;132&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot;&gt;policies e practices&lt;/text&gt;
&lt;rect class=&quot;fc&quot; x=&quot;315&quot; y=&quot;92&quot; width=&quot;225&quot; height=&quot;78&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;427&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot;&gt;Cultural&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;427&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot;&gt;valori e ruoli legittimi&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M248 112Q280 84 312 112&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke-width:2.5&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M312 150Q280 178 248 150&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke-width:2.5&quot;/&gt;
&lt;path class=&quot;ln&quot; d=&quot;M280 186V226&quot; marker-end=&quot;url(#ar)&quot; style=&quot;stroke-width:2.5&quot;/&gt;
&lt;rect x=&quot;80&quot; y=&quot;230&quot; width=&quot;400&quot; height=&quot;56&quot; rx=&quot;8&quot; style=&quot;fill:var(--accent)&quot;/&gt;&lt;text x=&quot;280&quot; y=&quot;265&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--paper);font-weight:600;font-size:18px&quot;&gt;GM enables opportunity structures&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Componenti&quot;&gt;&lt;button role=&quot;tab&quot; data-t=&quot;a&quot; aria-selected=&quot;true&quot;&gt;Structural component&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;b&quot; aria-selected=&quot;false&quot;&gt;Cultural dimension&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;c&quot; aria-selected=&quot;false&quot;&gt;Il circolo&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-p=&quot;a&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;«Provides an organized system of opportunities which allows individuals to reach their goals, by introducing policies and practices» &lt;span class=&quot;tag sl&quot;&gt;slide 17&lt;/span&gt;. Cioè l&#x27;insieme delle opportunità messe a disposizione dalle regole. Esempio: se servono documenti rapidi per lavorare, una donna arrivata per ricongiungimento può cercare un impiego &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-p=&quot;b&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Le «societal value orientations» racchiudono opinioni e credenze condivise e definiscono culturalmente i ruoli sociali ritenuti legittimi per uomini e donne &lt;span class=&quot;tag sl&quot;&gt;slide 17&lt;/span&gt;. Esempio: se la cura è considerata cosa «da donne», il lavoro di cura resta femminile e poco valorizzato &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; data-p=&quot;c&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Le frecce circolari della slide indicano un&#x27;influenza reciproca: le policy cambiano ciò che è considerato normale e i valori rendono accettabili certe policy. Il GM agisce qui perché &lt;strong&gt;abilita le opportunity structures&lt;/strong&gt;, le condizioni concrete in cui le persone possono raggiungere i propri obiettivi &lt;span class=&quot;tag sl&quot;&gt;slide 17&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Le premesse del GM&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Migration è un gendered phenomenon&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Norme e aspettative di genere, relazioni di potere e diritti disuguali plasmano scelte ed esperienze migratorie di donne e ragazze, come di uomini e ragazzi &lt;span class=&quot;tag sl&quot;&gt;slide 19&lt;/span&gt;. Quindi non riguarda solo le donne.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Ignorare il gender produce danni&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Può esporre chi si sposta a certe vulnerabilità, aggravare le disuguaglianze e rendere inadeguati misure e servizi &lt;span class=&quot;tag sl&quot;&gt;slide 19&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Intersectional discrimination&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Migrant women e men subiscono discriminazioni basate su più fattori: age, (dis)ability, social origin, ethnicity, religion, migration status, sex, gender identity, sexual orientation &lt;span class=&quot;tag sl&quot;&gt;slide 19&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;h3&gt;L&#x27;implementazione: 14 richieste agli stati&lt;/h3&gt;
&lt;p&gt;Il GM richiede la piena integrazione della prospettiva di gender equality in tutta la legislazione, le politiche, i programmi e le infrastrutture che regolano la migrazione &lt;span class=&quot;tag sl&quot;&gt;slide 20&lt;/span&gt;. Ecco i punti in sintesi: filtra per tema &lt;span class=&quot;tag sl&quot;&gt;slide 20-22&lt;/span&gt;. I temi sono un raggruppamento di Claude &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;ctrl&quot; id=&quot;pf&quot; role=&quot;group&quot; aria-label=&quot;Filtra per tema&quot;&gt;
&lt;button data-f=&quot;*&quot; aria-pressed=&quot;true&quot;&gt;Tutti&lt;/button&gt;&lt;button data-f=&quot;v&quot; aria-pressed=&quot;false&quot;&gt;Violenza e protezione&lt;/button&gt;&lt;button data-f=&quot;a&quot; aria-pressed=&quot;false&quot;&gt;Accoglienza&lt;/button&gt;&lt;button data-f=&quot;i&quot; aria-pressed=&quot;false&quot;&gt;Informazione e assistenza&lt;/button&gt;&lt;button data-f=&quot;s&quot; aria-pressed=&quot;false&quot;&gt;Salute&lt;/button&gt;&lt;button data-f=&quot;f&quot; aria-pressed=&quot;false&quot;&gt;Famiglia e documenti&lt;/button&gt;&lt;button data-f=&quot;l&quot; aria-pressed=&quot;false&quot;&gt;Lavoro&lt;/button&gt;&lt;button data-f=&quot;m&quot; aria-pressed=&quot;false&quot;&gt;Minori&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;para&quot; id=&quot;pl&quot;&gt;
&lt;div class=&quot;card&quot; data-th=&quot;v&quot;&gt;&lt;b&gt;5.1&lt;/b&gt;Riconoscere la gender-based violence come forma di persecuzione ai sensi dell&#x27;art. 1 A(2) della Convenzione del 1951 e della Istanbul Convention.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;a f&quot;&gt;&lt;b&gt;5.2&lt;/b&gt;Strutture single-sex disponibili, ma anche strutture miste per tenere unite le famiglie.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;a m&quot;&gt;&lt;b&gt;5.3&lt;/b&gt;Per i ragazzi, soprattutto adolescenti, alloggi separati sia dalle ragazze sia dagli uomini adulti.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;i&quot;&gt;&lt;b&gt;5.4&lt;/b&gt;Secondo l&#x27;Objective 3 del Global Compact: informazioni accessibili, accurate, tempestive e gender-responsive, nelle lingue utili, in tutte le fasi.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;i&quot;&gt;&lt;b&gt;5.5&lt;/b&gt;Assistenza legale e interpretariato con personale formato per donne e ragazze: interpreti donne se opportuno, supporto psicologico, informazioni sui diritti.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;v m&quot;&gt;&lt;b&gt;5.6&lt;/b&gt;Protezione specifica per ragazze non accompagnate, madri sole, donne in gravidanza o con bambini piccoli, donne con discriminazione intersezionale.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;s&quot;&gt;&lt;b&gt;5.7&lt;/b&gt;Accesso a servizi sanitari gender-specific (salute sessuale e riproduttiva, ostetricia, pre e post natale), servizi ed educazione anche per uomini e ragazzi; riformare le norme che limitano l&#x27;accesso per residenza o status.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;s a&quot;&gt;&lt;b&gt;5.8&lt;/b&gt;Prodotti per l&#x27;igiene femminile nei centri di accoglienza, con assistenza adeguata nell&#x27;uso.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;f&quot;&gt;&lt;b&gt;5.9&lt;/b&gt;Considerare la situazione familiare e la family reunification, per garantire il diritto alla vita familiare.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;f&quot;&gt;&lt;b&gt;5.10&lt;/b&gt;Documenti personali a lunga validità in tempi brevi per donne e ragazze, anche se arrivate per ricongiungimento.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;l&quot;&gt;&lt;b&gt;5.11&lt;/b&gt;Sistema comune di riconoscimento di qualifiche e diplomi; politiche del lavoro gender-sensitive.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;l&quot;&gt;&lt;b&gt;5.12&lt;/b&gt;Regolare e migliorare le condizioni di lavoro per eliminare sfruttamento e discriminazione intersezionali.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;l&quot;&gt;&lt;b&gt;5.13&lt;/b&gt;Più donne che uomini nell&#x27;informal employment (lavoro informale), come cura e lavoro domestico: garantire i diritti con vigilanza e assistenza accessibile.&lt;/div&gt;
&lt;div class=&quot;card&quot; data-th=&quot;m v&quot;&gt;&lt;b&gt;5.14&lt;/b&gt;Approccio gender-sensitive per bambini migranti e rifugiati, considerando la maggiore vulnerabilità delle ragazze a violenza e trafficking (tratta).&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;I tre riferimenti giuridici dietro questi punti&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;strong&gt;Convenzione di Ginevra del 1951, art. 1 A(2).&lt;/strong&gt; Rifugiato è chi ha un fondato timore di persecuzione per race, religion, nationality, membership of a particular social group o political opinion. Il gender non è un motivo a sé: UNHCR sostiene che una lettura corretta copre già le domande legate al genere, senza aggiungere motivi, ma ciò non rende automaticamente rifugiata ogni donna &lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.refworld.org/policy/legalguidance/unhcr/2002/31754&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Linee guida UNHCR 2002&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Istanbul Convention.&lt;/strong&gt; L&#x27;art. 60 chiede agli stati parte di far riconoscere la violenza di genere come possibile persecuzione, con interpretazione e procedure attente al genere &lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://rm.coe.int/articles-60-and-61-of-ic/1680a87d65&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Studio del Council of Europe&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Global Compact for Migration, Objective 3.&lt;/strong&gt; Informazioni accurate e tempestive in tutte le fasi della migrazione &lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://rli.sas.ac.uk/news-events/blogs/gcm-commentary-objective-3-provide-accurate-timely-information-all-stages-migration&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Commento del Refugee Law Initiative&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;&lt;p&gt;Prova a rispondere, poi apri.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Perché «gendered phenomenon» non significa «problema delle donne»?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché norme e potere modellano l&#x27;esperienza di tutti: la slide 19 nomina anche uomini e ragazzi, e il punto 5.3 riguarda proprio i ragazzi adolescenti.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Spiega con le tue parole lo schema della slide 17.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il contesto ha una parte strutturale (opportunità create da policies e practices) e una culturale (valori e ruoli legittimi). Si influenzano a vicenda. Il GM agisce sulle opportunity structures.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Cosa cambia il punto 5.1 per una donna in fuga dalla violenza di genere?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;La violenza di genere viene riconosciuta come forma di persecuzione ai sensi della Convenzione del 1951, e ciò può dare fondamento alla richiesta di protezione.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quale punto risponde direttamente al care drain e al lavoro domestico?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il 5.13, sull&#x27;informal employment nella cura e nel lavoro domestico; collegati anche il 5.11 e il 5.12.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s-env&quot;&gt;
&lt;div class=&quot;kicker&quot; style=&quot;color:var(--muted)&quot;&gt;Una nota&lt;/div&gt;
&lt;h2&gt;Environmental migration&lt;/h2&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;p&gt;Il tema è annunciato nella copertina &lt;span class=&quot;tag sl&quot;&gt;slide 1&lt;/span&gt;, ma &lt;strong&gt;nessuna delle 22 slide lo sviluppa&lt;/strong&gt;. Tutto il resto di questo riquadro non viene dal corso: controlla se il materiale è in un&#x27;altra lezione.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt; Per la definizione di lavoro dell&#x27;IOM (2007), gli &lt;strong&gt;environmental migrants&lt;/strong&gt; sono persone che, soprattutto per cambiamenti ambientali improvvisi o graduali che danneggiano la loro vita, devono o scelgono di partire, per un tempo limitato o per sempre, dentro il paese o all&#x27;estero. &lt;em&gt;Climate migration&lt;/em&gt; è un sottoinsieme. &lt;a href=&quot;https://www.informea.org/en/knowledge/glossary/environmental-migration&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Glossario InforMEA&lt;/a&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;Il legame con questa lezione.&lt;/strong&gt; L&#x27;ambiente non è tra i cinque motivi dell&#x27;art. 1 A(2) della Convenzione del 1951: per questo si parla di migrants e l&#x27;espressione «environmental refugees» è discussa. Anche qui l&#x27;approccio intersezionale aiuta a chiedersi chi può partire e chi resta &lt;span class=&quot;tag in&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;
&lt;/section&gt;
&lt;section id=&quot;s-more&quot;&gt;
&lt;div class=&quot;kicker&quot; style=&quot;color:var(--accent)&quot;&gt;Fine&lt;/div&gt;
&lt;h2&gt;Per approfondire&lt;/h2&gt;
&lt;p&gt;Ogni scheda è una &lt;span class=&quot;tag ex&quot;&gt;fonte esterna&lt;/span&gt;: i dati vengono dalle pagine trovate con la ricerca web, spesso da abstract o sintesi, non dalla lettura integrale. La riga «perché conta» è un commento di Claude.&lt;/p&gt;
&lt;h3&gt;Citati nelle slide&lt;/h3&gt;
&lt;div class=&quot;src&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://researchonline.lse.ac.uk/id/eprint/66021&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Naila Kabeer, «Gender, poverty, and inequality: a brief history of feminist contributions in the field of international development»&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Gender &amp;amp; Development&lt;/em&gt; 23(2), 2015, pp. 189-205. Storia dei contributi femministi su genere, povertà e disuguaglianza, dal micro al macro. Copia sul &lt;a href=&quot;https://nailakabeer.net/2016/01/30/gender-poverty-and-inequality-a-brief-history-of-feminist-contributions-in-the-field-of-international-development/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sito dell&#x27;autrice&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la lettura indicata a slide 4, e da qui viene la cornice vertical/horizontal.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://ucpress.edu/books/so-hows-the-family/paper&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Arlie Russell Hochschild, &lt;em&gt;So How&#x27;s the Family? And Other Essays&lt;/em&gt;&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;University of California Press, 2013. Tredici saggi, con la parte «Women on the Global Backstage» sul traffico globale di cura e sui figli lasciati a casa.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: il riferimento «Hochschild: 2013, p. 147» della slide 15 sembra rimandare a questo volume, ma la slide non dà il titolo: da verificare.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://pace.coe.int/files/30075/html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PACE, Resolution 2440 (2022), Gender mainstreaming of migration policies&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Adottata dallo Standing Committee il 31 maggio 2022. La slide 16 linka un altro file (&lt;a href=&quot;https://pace.coe.int/en/files/28577#trace-1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;28577&lt;/a&gt;), che la ricerca non ha permesso di controllare.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il documento centrale della parte 5. Confronta qui la numerazione dei punti 5.x con le slide.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://pace.coe.int/files/29600/html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PACE, Doc. 15456, report (rapporteur P. Stienen)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Rapporto del Committee on Migration, Refugees and Displaced Persons, 16 febbraio 2022. Affiancato dall&#x27;opinion Doc. 15457 del Committee on Equality and Non-Discrimination.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: spiega le ragioni e i dati dietro le richieste; è il link di slide 18.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://legal.un.org/avl/ha/prsr/prsr.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Convention relating to the Status of Refugees (1951)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Scheda storica della UN Audiovisual Library of International Law. Il testo definisce il rifugiato all&#x27;art. 1 A(2); lettura di genere nelle &lt;a href=&quot;https://www.refworld.org/policy/legalguidance/unhcr/2002/31754&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;linee guida UNHCR 2002&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: senza questa definizione il punto 5.1 non si capisce.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.coe.int/en/web/istanbul-convention/-/new-study-published-gender-based-asylum-claims-and-non-refoulement-articles-60-and-61-of-the-istanbul-convention&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Istanbul Convention (CETS n. 210), artt. 60-61&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Trattato del Council of Europe aperto alla firma l&#x27;11 maggio 2011. Lo studio del 2019 spiega le domande di asilo basate sul genere e il non-refoulement (il divieto di rimandare qualcuno dove rischia persecuzione).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la base europea del riconoscimento citato al punto 5.1.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.un.org/pga/72/wp-content/uploads/sites/51/2018/07/migration.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Global Compact for Safe, Orderly and Regular Migration&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Testo finale del luglio 2018, adottato a Marrakech nel dicembre 2018 (A/RES/73/195). L&#x27;Objective 3 riguarda l&#x27;informazione in tutte le fasi della migrazione.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte diretta del punto 5.4.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.worldbank.org/en/news/factsheet/2025/06/05/june-2025-update-to-global-poverty-lines&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank, June 2025 Update to Global Poverty Lines&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Passaggio della soglia da 2,15 a 3,00 $ in PPP 2021. Vedi anche &lt;a href=&quot;https://ourworldindata.org/from-1-90-to-2-15-a-day-the-updated-international-poverty-line&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Our World in Data&lt;/a&gt; sul passaggio da 1,90 a 2,15 $.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: le slide si fermano a 2,15 $. La stampa indica circa 808 milioni di persone nel 2025 con la nuova soglia (&lt;a href=&quot;https://news.fundsforngos.org/2025/10/14/world-bank-revises-global-poverty-figures-upward-with-new-data-and-ppps/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sintesi sui tassi&lt;/a&gt;), un dato non confrontabile con i 648 milioni e da controllare sulla World Bank.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;I tre video delle slide&lt;/h4&gt;&lt;p&gt;&lt;a href=&quot;https://www.youtube.com/watch?v=kdrtB2saFrY&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Slide 8&lt;/a&gt; · &lt;a href=&quot;https://www.youtube.com/watch?v=QuBy6YzLMn0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Slide 12&lt;/a&gt; · &lt;a href=&quot;https://www.youtube.com/watch?v=iIIz2gb3UjM&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Slide 13&lt;/a&gt;&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Non è stato possibile verificarne contenuto e disponibilità: la ricerca web non li ha trovati.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Non citati nelle slide, utili per capire&lt;/h3&gt;
&lt;div class=&quot;src&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.britannica.com/story/what-is-intersectionality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Kimberlé Crenshaw, «Demarginalizing the Intersection of Race and Sex» (1989)&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&lt;em&gt;University of Chicago Legal Forum&lt;/em&gt;. Il link porta a una spiegazione di Britannica sull&#x27;origine del termine.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: dà una radice al concetto che le slide usano senza attribuirlo.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://ec.europa.eu/eurostat/statistics-explained/index.php/Glossary:At-risk-of-poverty_rate&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eurostat, Glossary: At-risk-of-poverty rate&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Soglia al 60% della mediana del reddito equivalente, dopo i trasferimenti sociali.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è un esempio concreto della relative poverty di slide 7.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://sdg-tracker.org/no-poverty&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SDG Tracker, Goal 1: No Poverty&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Target e indicatori dell&#x27;obiettivo sulla povertà, con dati aggiornati.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: colloca nel quadro SDGs l&#x27;obiettivo 2030 di slide 10.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.migrationpolicy.org/article/global-dimensions-female-migration&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Migration Policy Institute, «The Global Dimensions of Female Migration»&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Serie storica della quota femminile tra i migranti. Dati recenti: &lt;a href=&quot;https://www.un.org/development/desa/pd/node/3315&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN DESA, International Migrant Stock&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: permette di discutere con i numeri la feminization of migration.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.osservatoriolavorodomestico.it/wp-content/uploads/2025/09/Osservtorio-Domina-VII-Rapporto-Annuale.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Osservatorio DOMINA, VII Rapporto annuale sul lavoro domestico&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Dati INPS su colf e badanti in Italia, per genere e nazionalità.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: riempie il «Case of Italy», che nella slide 15 è solo un titolo.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.informea.org/en/knowledge/glossary/environmental-migration&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;InforMEA, Environmental migration&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Voce di glossario che riprende la definizione IOM del 2007.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è un punto di partenza per il tema annunciato in copertina.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;
&lt;footer class=&quot;end&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/div&gt;&lt;/footer&gt;
