&lt;div class=&quot;panel&quot; id=&quot;sigi-lab&quot;&gt;
&lt;h4&gt;SIGI lab&lt;/h4&gt;
&lt;p style=&quot;font-size:.93rem&quot;&gt;Move the sliders or choose a country. The black ticks on the bars mark the regional mean. The result is a &lt;b&gt;simple mean&lt;/b&gt;: my own approximation. The OECD states equal weights and the same formula at every level (&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.oecd.org/en/publications/sigi-2023-methodology_775aca3a-en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OECD&lt;/a&gt;), and the values in the table differ from the simple mean by about one point at most.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Family&lt;/span&gt;&lt;output&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;60&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Physical integrity&lt;/span&gt;&lt;output&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;60&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Resources&lt;/span&gt;&lt;output&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;60&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Civil liberties&lt;/span&gt;&lt;output&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;60&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;big&quot; id=&quot;sigi-mean&quot;&gt;&lt;/div&gt;&lt;p id=&quot;sigi-msg&quot; aria-live=&quot;polite&quot; style=&quot;margin:.3rem 0&quot;&gt;&lt;/p&gt;&lt;div id=&quot;sigi-bars&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;levels&quot; id=&quot;sigi-lv&quot; aria-label=&quot;Levels of discrimination, slide p. 18&quot;&gt;
&lt;div&gt;&lt;b&gt;Very low&lt;/b&gt;&amp;lt; 20&lt;/div&gt;&lt;div&gt;&lt;b&gt;Low&lt;/b&gt;20-30&lt;/div&gt;&lt;div&gt;&lt;b&gt;Medium&lt;/b&gt;30-40&lt;/div&gt;&lt;div&gt;&lt;b&gt;High&lt;/b&gt;40-50&lt;/div&gt;&lt;div&gt;&lt;b&gt;Very high&lt;/b&gt;&amp;gt; 50&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;The slide uses strict inequalities and does not say exactly where 20, 30, 40 and 50 fall: here each exact value moves to the upper band (20 is Low, 50 is Very high).&lt;/p&gt;
&lt;/div&gt;

&lt;h4&gt;What the table teaches&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;The total conceals the profile.&lt;/b&gt; Armenia (28) and Greece (27) are almost level, but Armenia is high in physical integrity (35), whereas Greece scores 9 there and 45 in family.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Each maximum is in a different country:&lt;/b&gt; Greece in family (45), Azerbaijan in physical integrity (43), Turkey in resources (37), Russia in civil liberties (32).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Levels.&lt;/b&gt; Only Romania (17) is Very low; all the others remain in the Low band, between 21 and 29. The shared band, however, conceals very different profiles.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;EU membership is no protection against everything.&lt;/b&gt; &lt;span class=&quot;src add&quot;&gt;added&lt;/span&gt; The family maximum belongs to a member state: no country is &quot;ahead&quot; on every dimension.&lt;/li&gt;
&lt;/ul&gt;
&lt;p class=&quot;cap&quot;&gt;The slide cites &quot;a study on the Black Sea region&quot; without author or year. &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; I could not identify the study with certainty; on the same topic there are &lt;a href=&quot;https://zenodo.org/records/7081629&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Gender norms, policies, and values in the Black Sea region&lt;/a&gt; and an &lt;a href=&quot;https://icbss.org/black-sea-women-in-society/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICBSS&lt;/a&gt; infographic.&lt;/p&gt;

&lt;h3 id=&quot;pluralism&quot;&gt;Current discussion: legal pluralism &lt;span class=&quot;src&quot;&gt;slide p. 22-23&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;In view of the &lt;b&gt;6th edition&lt;/b&gt;, the Expert Group Meeting is reviewing the framework, methodology and data sources. First issue: &lt;b&gt;legal pluralism&lt;/b&gt;, the coexistence of two or more legal systems in the same social field.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg class=&quot;wide&quot; viewBox=&quot;0 0 680 280&quot; role=&quot;img&quot; aria-label=&quot;Two legal systems overlap within one country. Those in the shared area may fall under both: which prevails?&quot;&gt;
&lt;rect x=&quot;4&quot; y=&quot;6&quot; width=&quot;672&quot; height=&quot;268&quot; rx=&quot;12&quot; class=&quot;rl&quot;/&gt;
&lt;text class=&quot;s&quot; x=&quot;20&quot; y=&quot;28&quot;&gt;Same country, same social field&lt;/text&gt;
&lt;circle cx=&quot;270&quot; cy=&quot;135&quot; r=&quot;100&quot; class=&quot;fb&quot; style=&quot;stroke:var(--c);fill-opacity:.75&quot;/&gt;&lt;circle cx=&quot;410&quot; cy=&quot;135&quot; r=&quot;100&quot; class=&quot;fb&quot; style=&quot;stroke:var(--c);fill-opacity:.75&quot;/&gt;
&lt;text x=&quot;225&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Law A&lt;/text&gt;&lt;text x=&quot;225&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot; class=&quot;s&quot;&gt;e.g. civil&lt;/text&gt;
&lt;text x=&quot;455&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Law B&lt;/text&gt;&lt;text x=&quot;455&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot; class=&quot;s&quot;&gt;e.g. religious&lt;/text&gt;
&lt;text x=&quot;340&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot; style=&quot;fill:var(--c);font-size:26px&quot;&gt;?&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; class=&quot;s&quot;&gt;which&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; class=&quot;s&quot;&gt;prevails?&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;340&quot; y=&quot;258&quot; text-anchor=&quot;middle&quot;&gt;Groups distinguished by religion, ethnicity, race, class, geographic location&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;In these countries, different laws apply to groups that differ by &lt;b&gt;religion, ethnicity, race, class or geographic location&lt;/b&gt;. The challenge is twofold: each law may create differences between the rights of women and men, and it is unclear whether one &lt;b&gt;supersedes&lt;/b&gt; (takes precedence over) the other.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;src add&quot;&gt;added&lt;/span&gt; Practical consequence: what score should a country receive if it has an egalitarian civil law and a discriminatory customary law on inheritance or marriage? A single national number does not properly represent women subject to different rules.&lt;/p&gt;

&lt;h3 id=&quot;gaps&quot;&gt;Managing data gaps &lt;span class=&quot;src&quot;&gt;slide p. 24&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;The second issue concerns data. The SIGI combines international and national sources, including &lt;b&gt;Demographic and Health Surveys (DHS)&lt;/b&gt; and &lt;b&gt;Multiple Indicator Cluster Surveys (MICS)&lt;/b&gt;. According to the slide, the &lt;b&gt;discontinuation of the DHS programme&lt;/b&gt; is a major challenge for the next edition. A &lt;b&gt;data gap&lt;/b&gt; is missing information for a country or topic; &lt;span class=&quot;src add&quot;&gt;added&lt;/span&gt; &lt;b&gt;microdata&lt;/b&gt; are individual responses, &lt;b&gt;aggregates&lt;/b&gt; are data that have already been summarised.&lt;/p&gt;
&lt;div class=&quot;panel gaps&quot; id=&quot;gaps-lab&quot;&gt;
&lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;gaps-btn&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;Remove the DHS&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg class=&quot;wide&quot; viewBox=&quot;0 0 680 290&quot; role=&quot;img&quot; aria-label=&quot;The DHS feeds the SIGI directly, and indirectly through UNICEF, SDG 5.3.1 and the FGM/C database. The MICS also feeds the SIGI.&quot;&gt;
&lt;text class=&quot;s&quot; x=&quot;80&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot;&gt;Surveys&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;340&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot;&gt;External databases&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;600&quot; y=&quot;18&quot; text-anchor=&quot;middle&quot;&gt;Index&lt;/text&gt;
&lt;g class=&quot;dh&quot;&gt;&lt;rect class=&quot;n&quot; x=&quot;10&quot; y=&quot;56&quot; width=&quot;140&quot; height=&quot;56&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;DHS&lt;/text&gt;
&lt;path class=&quot;l&quot; d=&quot;M150 72C350 20 460 40 528 126&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;text class=&quot;s&quot; x=&quot;330&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--c)&quot;&gt;Direct impact&lt;/text&gt;
&lt;path class=&quot;l&quot; d=&quot;M150 84H258&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;l&quot; d=&quot;M150 92C200 92 210 150 258 150&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;l&quot; d=&quot;M150 102C190 130 210 216 258 216&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;/g&gt;
&lt;rect class=&quot;n&quot; x=&quot;10&quot; y=&quot;190&quot; width=&quot;140&quot; height=&quot;56&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;224&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;MICS&lt;/text&gt;
&lt;path class=&quot;l d&quot; d=&quot;M150 218C200 218 200 165 258 158&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;path class=&quot;l d&quot; d=&quot;M150 226H258&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect class=&quot;n&quot; x=&quot;260&quot; y=&quot;60&quot; width=&quot;160&quot; height=&quot;48&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot;&gt;UNICEF database&lt;/text&gt;
&lt;rect class=&quot;n&quot; x=&quot;260&quot; y=&quot;126&quot; width=&quot;160&quot; height=&quot;48&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot;&gt;UN SDG 5.3.1&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;165&quot; text-anchor=&quot;middle&quot; class=&quot;s&quot;&gt;child marriage&lt;/text&gt;
&lt;rect class=&quot;n&quot; x=&quot;260&quot; y=&quot;192&quot; width=&quot;160&quot; height=&quot;48&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;214&quot; text-anchor=&quot;middle&quot;&gt;UNICEF FGM/C&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;231&quot; text-anchor=&quot;middle&quot; class=&quot;s&quot;&gt;database&lt;/text&gt;
&lt;path class=&quot;l&quot; d=&quot;M420 84C470 84 490 125 528 135&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;l&quot; d=&quot;M420 150H528&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;l&quot; d=&quot;M420 216C470 216 490 175 528 165&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;path class=&quot;l&quot; d=&quot;M150 236C350 285 470 262 545 182&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect x=&quot;530&quot; y=&quot;120&quot; width=&quot;140&quot; height=&quot;60&quot; rx=&quot;8&quot; class=&quot;fc&quot;/&gt;&lt;text x=&quot;600&quot; y=&quot;156&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot; style=&quot;fill:var(--paper)&quot;&gt;SIGI&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;10&quot; y=&quot;284&quot;&gt;Solid line: link shown in the slide. Dashed: MICS to the databases, from SDG and UNICEF metadata (external source).&lt;/text&gt;
&lt;/svg&gt;&lt;/div&gt;
&lt;p id=&quot;gaps-t&quot; aria-live=&quot;polite&quot; style=&quot;margin-bottom:.4rem&quot;&gt;With the DHS active, the SIGI receives data through two routes: directly (microdata or aggregates) and indirectly, through international databases.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div&gt;&lt;h4&gt;Direct impact&lt;/h4&gt;&lt;p&gt;DHS microdata or aggregates are used for several variables: land and house ownership of women and men, &lt;i&gt;gender gaps in asset ownership&lt;/i&gt;, and attitudes justifying &lt;i&gt;intimate partner violence&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div&gt;&lt;h4&gt;Indirect impact&lt;/h4&gt;&lt;p&gt;The DHS is the &lt;b&gt;primary source&lt;/b&gt; of databases on which the SIGI draws: UNICEF, &lt;b&gt;UN SDG Indicator 5.3.1&lt;/b&gt; on child marriage and UNICEF &lt;b&gt;FGM/C&lt;/b&gt; (&lt;i&gt;female genital mutilation/cutting&lt;/i&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;aside class=&quot;ext&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;
&lt;p&gt;&lt;b&gt;Update on the DHS, to be verified:&lt;/b&gt; the picture is less clear-cut than &quot;discontinuation&quot;. After the USAID contract ended in 2025, funding from the Gates Foundation and Bloomberg Philanthropies made it possible to continue ongoing surveys and keep the archive active, with a reduced scope. The future remains uncertain: at the beginning of 2026, governance and stable funding had not been settled (&lt;a href=&quot;https://www.devex.com/news/demographic-and-health-surveys-reemerge-with-gates-funds-after-trump-cut-111840&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Devex&lt;/a&gt;, &lt;a href=&quot;https://www.prb.org/news/charting-a-path-forward-for-the-demographic-and-health-surveys-program/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PRB&lt;/a&gt;). I found no later news.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;On the 6th edition:&lt;/b&gt; I found no public documents dedicated to the sixth edition or to legal pluralism in the SIGI; the slide remains the source. The expert meeting I traced dates from 2020 (&lt;a href=&quot;https://ced.cat/wp-content/uploads/2020/10/OECD-SIGI-Expert-Group-Meeting_draft-agenda.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;agenda&lt;/a&gt;).&lt;/p&gt;&lt;/aside&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check, Part 4&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;What distinguishes the SIGI from the GII?&lt;/summary&gt;&lt;div&gt;The GII mainly measures outcomes in health, empowerment and labour. The SIGI looks at the institutional foundations: laws, formal and informal social norms, and practices.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What are the four dimensions of the SIGI?&lt;/summary&gt;&lt;div&gt;Discrimination in the family; restricted physical integrity; restricted access to productive and financial resources; restricted civil liberties.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;A country has a SIGI of 35. How do you classify it? And with a SIGI of 17?&lt;/summary&gt;&lt;div&gt;35: Medium (30-40). 17: Very low (&amp;lt; 20). This is the case of Romania.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Greece has a SIGI of 27 and physical integrity of 9. What raises the total?&lt;/summary&gt;&lt;div&gt;Family (45) and resources (33). The example shows why the dimension scores must be read, not only the total.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What does sex ratio at birth &quot;natural = 105&quot; mean?&lt;/summary&gt;&lt;div&gt;Under natural conditions, about 105 boys are born per 100 girls. A strong upward deviation is an indirect sign of son preference.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why does legal pluralism complicate a national index?&lt;/summary&gt;&lt;div&gt;Different laws apply to different groups and may discriminate in different ways; moreover, it is not always clear which prevails. A single national value struggles to represent this.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between the direct and indirect impact of the end of the DHS?&lt;/summary&gt;&lt;div&gt;Direct: the DHS data used for SIGI variables are missing. Indirect: the external databases (UNICEF, SDG 5.3.1, FGM/C) that have the DHS as a primary source, and on which the SIGI draws, are weakened.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;indici&quot; class=&quot;part p0&quot;&gt;
&lt;span class=&quot;num&quot;&gt;Overview&lt;/span&gt;
&lt;h2&gt;All the indices at a glance&lt;/h2&gt;
&lt;p class=&quot;dek&quot;&gt;The most common confusion in the exam concerns direction: for some indices a high value is good, for others it is bad.&lt;/p&gt;
&lt;div class=&quot;tw&quot; tabindex=&quot;0&quot; role=&quot;region&quot; aria-label=&quot;Index comparison table, scrollable&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Index&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Who, when&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;What it looks at&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;The &quot;good&quot; value&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Caution&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;GDI&lt;/th&gt;&lt;td&gt;UNDP, 1995&lt;/td&gt;&lt;td&gt;Gender differences in life expectancy, education, income&lt;/td&gt;&lt;td&gt;1 = parity &lt;span class=&quot;src ext&quot;&gt;ext.&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Not a pure measure of inequality&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;GEM&lt;/th&gt;&lt;td&gt;UNDP, 1995&lt;/td&gt;&lt;td&gt;Economic, political and decision-making empowerment&lt;/td&gt;&lt;td&gt;Not stated in the slides&lt;/td&gt;&lt;td&gt;Comparability; ignores resource gaps&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;GII&lt;/th&gt;&lt;td&gt;UNDP, 2010&lt;/td&gt;&lt;td&gt;Reproductive health, empowerment, labour&lt;/td&gt;&lt;td&gt;Low (0 = parity) &lt;span class=&quot;src ext&quot;&gt;ext.&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Complex; reproductive health uses female-only data&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;WEI&lt;/th&gt;&lt;td&gt;UNDP and UN Women, 2023&lt;/td&gt;&lt;td&gt;Women&#x27;s power and freedom of choice&lt;/td&gt;&lt;td&gt;High&lt;/td&gt;&lt;td&gt;Says nothing about men&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;GGPI&lt;/th&gt;&lt;td&gt;UNDP and UN Women, 2023&lt;/td&gt;&lt;td&gt;Female-male disparities in human development&lt;/td&gt;&lt;td&gt;High (close to parity)&lt;/td&gt;&lt;td&gt;Parity can coexist with low levels&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;SIGI&lt;/th&gt;&lt;td&gt;OECD, first version 2009 &lt;span class=&quot;src ext&quot;&gt;ext.&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Institutional foundations: laws, norms, practices&lt;/td&gt;&lt;td&gt;Low (0-100)&lt;/td&gt;&lt;td&gt;Legal pluralism; data gaps&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Global Gender Gap&lt;/th&gt;&lt;td&gt;WEF &lt;span class=&quot;src ext&quot;&gt;ext.&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Economy, education, health, politics&lt;/td&gt;&lt;td&gt;High (% of gap closed)&lt;/td&gt;&lt;td&gt;Measures gaps, not levels&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Gender Equality Index&lt;/th&gt;&lt;td&gt;EIGE &lt;span class=&quot;src ext&quot;&gt;ext.&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Work, money, knowledge, time, power, health&lt;/td&gt;&lt;td&gt;High (out of 100)&lt;/td&gt;&lt;td&gt;Method changed in 2025: no comparisons with earlier editions&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;ext.&lt;/span&gt; = external source, see &quot;Further reading&quot;. The &quot;Caution&quot; notes on GEM, GDI and SIGI come from the slides; the others are my own inferences or cited criticisms.&lt;/p&gt;
&lt;/section&gt;
&lt;section id=&quot;fonti&quot; class=&quot;part p0&quot;&gt;
&lt;span class=&quot;num&quot;&gt;Beyond the slides&lt;/span&gt;
&lt;h2&gt;Further reading&lt;/h2&gt;
&lt;p class=&quot;dek&quot;&gt;Everything that follows is an &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;, except where the link is stated to come from the slide.&lt;/p&gt;
&lt;p class=&quot;prose&quot; style=&quot;font-size:.95rem&quot;&gt;I read the search results, not the full documents: open a source before citing any figure from it. The &quot;from the slide&quot; links did not appear in the searches, so I could not confirm them.&lt;/p&gt;

&lt;h3&gt;Definitions&lt;/h3&gt;
&lt;div class=&quot;cards&quot;&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;UNICEF ROSA, Gender Equality: Glossary of Terms and Concepts (2017)&lt;/h4&gt;&lt;p&gt;Glossary from the UNICEF Regional Office for South Asia, recommended on p. 4: the definitions used in the lecture follow this approach.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;It matters because it provides the shared vocabulary of the whole lecture.&lt;/p&gt;&lt;a href=&quot;https://www.unicef.org/rosa/media/1761/file/Gender%20glossary%20of%20terms%20and%20concepts%20.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open the PDF&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;UN Women Training Centre, entry &quot;Gender equity&quot;&lt;/h4&gt;&lt;p&gt;Explains the UN preference for &quot;gender equality&quot; and refers to CEDAW General Recommendation 28.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Not in the slides, but it avoids presenting &quot;equity&quot; as an uncontested term.&lt;/p&gt;&lt;a href=&quot;https://trainingcentre.unwomen.org/mod/glossary/showentry.php?eid=55&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open the entry&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Agenda 2030, SDG 5&lt;/h4&gt;&lt;p&gt;The goal on gender equality, with targets 5.1 to 5.c. The UN page reports 27.4% of women in parliaments as of 1 January 2026 and judges the world to be off track for 2030.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;It is the framework for WEI and GGPI (slide p. 17).&lt;/p&gt;&lt;a href=&quot;https://sdgs.un.org/goals/goal5&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sdgs.un.org&lt;/a&gt;&lt;/article&gt;
&lt;/div&gt;

&lt;h3&gt;Manels&lt;/h3&gt;
&lt;div class=&quot;cards&quot;&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;BBC, 2017 photo &lt;span class=&quot;src&quot;&gt;link from the slide&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;The article cited on p. 9 about the all-male meeting on health and maternity. The case is confirmed by other outlets, such as the &lt;a href=&quot;https://www.irishtimes.com/news/world/us/all-male-meeting-discussing-us-maternity-care-sparks-outrage-1.3023608&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Irish Times&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;A concrete example of imbalanced decision-making power.&lt;/p&gt;&lt;a href=&quot;https://www.bbc.com/news/world-us-canada-39375228&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BBC News&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;The Guardian, &quot;Congrats, you have an all male panel&quot; (2015) &lt;span class=&quot;src&quot;&gt;link from the slide&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;On the Tumblr that went viral. A parallel account is in &lt;a href=&quot;https://time.com/3859765/congrats-all-male-panel-tumblr-women-sexism-feminism-discrimination-gender/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Time&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Shows irony as a tool for making the problem visible.&lt;/p&gt;&lt;a href=&quot;https://www.theguardian.com/world/2015/may/28/congrats-you-have-an-all-male-panel-creator-viral-tumblr&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Guardian&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Speak Out Revolution, the consequences of manels &lt;span class=&quot;src&quot;&gt;from the slide&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Blog cited on p. 9 on the less visible consequences of all-male panels. In the PDF the address is cut off by the edge of the slide and I could not find the exact page: the link leads to the website.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;For the precise text, take the URL from the original PDF.&lt;/p&gt;&lt;a href=&quot;https://www.speakoutrevolution.co.uk/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;speakoutrevolution.co.uk&lt;/a&gt;&lt;/article&gt;
&lt;/div&gt;

&lt;h3&gt;UNDP and UN Women&lt;/h3&gt;
&lt;div class=&quot;cards&quot;&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Human Development Index, UNDP &lt;span class=&quot;src&quot;&gt;link from the slide&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;The data portal indicated on p. 16 for the annual report.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Here you can find updated values by country.&lt;/p&gt;&lt;a href=&quot;https://hdr.undp.org/data-center/human-development-index#/indicies/HDI&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;hdr.undp.org&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;HDR 2025, Technical Notes&lt;/h4&gt;&lt;p&gt;The technical document on the calculation of HDI, GDI and GII. The Costa Rica example comes from the &lt;a href=&quot;https://hdr.undp.org/sites/default/files/2023-24_HDR/hdr2023-24_technical_notes.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2023/24 version&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;It is the primary source, to be preferred to any summary, including this one.&lt;/p&gt;&lt;a href=&quot;https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Technical_Notes.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open the PDF&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;The paths to equal (2023)&lt;/h4&gt;&lt;p&gt;The report on the twin indices, 114 countries, indicated on p. 17. It provides the data on WEI and GGPI.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;The first UN gender index with violence as a separate dimension.&lt;/p&gt;&lt;a href=&quot;https://www.unwomen.org/en/digital-library/publications/2023/07/the-paths-to-equal-twin-indices-on-womens-empowerment-and-gender-equality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Women&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;The critiques: Klasen (2017)&lt;/h4&gt;&lt;p&gt;&lt;i&gt;UNDP&#x27;s gender-related measures: current problems and proposals for fixing them&lt;/i&gt;. Argues that the GII has conceptual and empirical weaknesses and proposes reforming GDI and GEM.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Useful for discussing the indices, not merely repeating them.&lt;/p&gt;&lt;a href=&quot;https://econpapers.repec.org/RePEc:got:gotcrc:220&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers&lt;/a&gt;&lt;/article&gt;
&lt;/div&gt;

&lt;h3&gt;OECD SIGI and other indices&lt;/h3&gt;
&lt;div class=&quot;cards&quot;&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;SIGI 2023 Methodology, OECD&lt;/h4&gt;&lt;p&gt;Framework, variables and formula of the 2023 edition: the same aggregation and equal weights at every level.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Explains how to get from a single law to the score.&lt;/p&gt;&lt;a href=&quot;https://www.oecd.org/en/publications/sigi-2023-methodology_775aca3a-en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;oecd.org&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;SIGI 2023 Global Report, OECD&lt;/h4&gt;&lt;p&gt;The global report with results by country.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;For comparing the Black Sea data with the most recent figures.&lt;/p&gt;&lt;a href=&quot;https://www.oecd.org/content/dam/oecd/en/publications/reports/2023/07/sigi-2023-global-report_a65d7f7f/4607b7c7-en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open the PDF&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Global Gender Gap Report 2025, WEF&lt;/h4&gt;&lt;p&gt;148 economies, 4 subindices, 14 indicators. Gap closed at 68.8%: health 96.2%, education 95.1%, economy 61.0%, politics 22.9%. At this pace it would take 162 years.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Shows that the widest gap is in political power.&lt;/p&gt;&lt;a href=&quot;https://www.weforum.org/publications/global-gender-gap-report-2025/in-full/benchmarking-gender-gaps-2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;weforum.org&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Gender Equality Index 2025, EIGE&lt;/h4&gt;&lt;p&gt;EU at 63.4 out of 100, from 47.6 (Cyprus) to 73.7 (Sweden); Italy 61.9, in 12th place, according to sources citing EIGE. Updated method: earlier values are not directly comparable.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;A concrete case of how a methodological choice changes the number: 71 in 2024, 63.4 in 2025, without this being a real decline.&lt;/p&gt;&lt;a href=&quot;https://eige.europa.eu/newsroom/news/new-eu-data-shows-women-need-work-15-1-2-months-earn-what-men-make-year&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;eige.europa.eu&lt;/a&gt;&lt;/article&gt;
&lt;/div&gt;

&lt;h3&gt;Values surveys&lt;/h3&gt;
&lt;div class=&quot;cards&quot;&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;European Values Study&lt;/h4&gt;&lt;p&gt;A survey on basic values, repeated every nine years since 1981. Sixth wave under way.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;A long series, suited to studying attitude change in Europe.&lt;/p&gt;&lt;a href=&quot;https://europeanvaluesstudy.eu/about-evs/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;europeanvaluesstudy.eu&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;World Values Survey&lt;/h4&gt;&lt;p&gt;Since 1981, almost 120 societies. The eighth wave runs from 2024 to the end of 2026.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Extends the comparison beyond Europe.&lt;/p&gt;&lt;a href=&quot;https://www.worldvaluessurvey.org/WVSContents.jsp?CMSID=Home&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;worldvaluessurvey.org&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;International Social Survey Programme&lt;/h4&gt;&lt;p&gt;A collaboration running annual surveys. The &lt;i&gt;Family and Changing Gender Roles&lt;/i&gt; module has waves from 1988 to 2022 (&lt;a href=&quot;https://www.gesis.org/en/issp/data-and-documentation/family-and-changing-gender-roles&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GESIS&lt;/a&gt;).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;It is the module most directly devoted to gender roles.&lt;/p&gt;&lt;a href=&quot;https://issp.org/about-issp/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;issp.org&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Eurobarometer&lt;/h4&gt;&lt;p&gt;The polling instrument of the Commission, the Parliament and other EU institutions, active since 1974.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Provides frequently updated EU public opinion.&lt;/p&gt;&lt;a href=&quot;https://europa.eu/eurobarometer/about/eurobarometer&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;europa.eu&lt;/a&gt;&lt;/article&gt;
&lt;/div&gt;

&lt;h3&gt;Data and cases cited&lt;/h3&gt;
&lt;div class=&quot;cards&quot;&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;When health data go dark (BMC Medicine, 2025)&lt;/h4&gt;&lt;p&gt;On the importance of the DHS programme and its possible future. See also the &lt;a href=&quot;https://unstats.un.org/iswghs/documents/funding_impact_users.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN assessment&lt;/a&gt; of the impact on data users.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Expands on the topic of data gaps on p. 24.&lt;/p&gt;&lt;a href=&quot;https://link.springer.com/article/10.1186/s12916-025-04062-6&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Springer&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;MICS, UNICEF&lt;/h4&gt;&lt;p&gt;A household survey programme supported by UNICEF, active since 1995 in over 100 countries (figure from a 2011 UNICEF presentation).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Expected to be an important source for low-income countries if the DHS shrinks.&lt;/p&gt;&lt;a href=&quot;https://unstats.un.org/unsd/iaeggs/Meetings/NewYork_October_2011/Documents/S2_Panel1_UNICEF.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open the PDF&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;SDG 5.3.1, metadata&lt;/h4&gt;&lt;p&gt;Share of women aged 20-24 married or in a union before age 15 and before age 18. Harmonised data from DHS and MICS, compiled by UNICEF.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Shows concretely the indirect dependence on the DHS.&lt;/p&gt;&lt;a href=&quot;https://unstats.un.org/sdgs/metadata/?Text=&amp;amp;Goal=5&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Statistics&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;UNICEF, FGM/C data&lt;/h4&gt;&lt;p&gt;A global database based on representative surveys such as DHS and MICS. The link is a 2016 brochure.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;A second example of the indirect link.&lt;/p&gt;&lt;a href=&quot;https://data.unicef.org/wp-content/uploads/2016/04/FGMC-2016-brochure_250.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open the PDF&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Poland, 1996 regulation&lt;/h4&gt;&lt;p&gt;Eurofound article on the rules protecting women&#x27;s employment. It confirms the general picture, not the specific ban on public transport.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Context for the case on p. 12.&lt;/p&gt;&lt;a href=&quot;https://www.eurofound.europa.eu/fi/resources/article/2002/protective-regulations-womens-employment-amended&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;eurofound.europa.eu&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Measuring Gender Equality (Springer, 2023)&lt;/h4&gt;&lt;p&gt;Open-access volume edited by di Bella, Fachelli, López-Roldán and Suter, with a review of the main international indicators. Not cited in the slides.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;A good text for anyone wishing to go further.&lt;/p&gt;&lt;a href=&quot;https://link.springer.com/content/pdf/10.1007/978-3-031-41486-2.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Open the PDF&lt;/a&gt;&lt;/article&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;
&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Summary written by Claude from the slides: always check against the material.&lt;/div&gt;&lt;/footer&gt;

safe(function(){$$(&quot;[data-steps]&quot;).forEach(function(w){

/* staccionata */
safe(function(){
  var root=$(&quot;#fence-lab&quot;);if(!root)return;
  var S={equality:[1,1,1],equity:[0,1,2],justice:[0,0,0]};
  var H=[170,130,90],G=260,F=110,B=40;
  var T={
    equality:&quot;&lt;b&gt;Equality.&lt;/b&gt; Same treatment: one crate each. The shortest person still cannot see: formal parity is not enough when starting points differ.&quot;,
    equity:&quot;&lt;b&gt;Equity.&lt;/b&gt; Differentiated treatment: there are still three crates, but they are distributed according to need. Now everyone can see. This is the logic of &lt;i&gt;temporary special measures&lt;/i&gt;.&quot;,
    justice:&quot;&lt;b&gt;Barrier removed.&lt;/b&gt; A third panel that circulates online, not in the slide: instead of compensating, the obstacle is removed. In gender terms: changing the norm or the institution rather than assisting those subject to it.&quot;
  };
  var btn=$$(&quot;[data-mode]&quot;,root),txt=$(&quot;#fence-text&quot;,root),fn=$(&quot;#fence-svg .fn&quot;,root);
  var per=$$(&quot;#fence-svg .per&quot;,root),seen=$$(&quot;#fence-svg .see&quot;,root);
  function set(m){
    btn.forEach(function(b){b.setAttribute(&quot;aria-pressed&quot;,b.dataset.mode===m)});
    S[m].forEach(function(n,i){

});

/* gender pay gap */
safe(function(){
  var m=$(&quot;#pg-m&quot;),f=$(&quot;#pg-f&quot;);if(!m)return;
  function up(){
    var a=+m.value,b=+f.value,g=(a-b)/a*100;
    $(&quot;#pg-mo&quot;).textContent=a+&quot; €&quot;;$(&quot;#pg-fo&quot;).textContent=b+&quot; €&quot;;
    $(&quot;#pg-g&quot;).textContent=it(g,1)+&quot;%&quot;;
    $(&quot;#pg-t&quot;).textContent=g&gt;0?&quot;To earn what a man earns in 12 months, a woman would have to work &quot;+it(12*a/b,1)+&quot; months.&quot;:g&lt;0?&quot;Here the gap favours women: the sign of the formula is reversed.&quot;:&quot;No average gap. Segregation may still exist: the mean does not capture it.&quot;;
  }

});
