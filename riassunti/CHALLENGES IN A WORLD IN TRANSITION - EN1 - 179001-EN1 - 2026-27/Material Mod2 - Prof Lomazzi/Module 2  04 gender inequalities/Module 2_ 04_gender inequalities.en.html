&lt;section id=&quot;ponte&quot; class=&quot;prose&quot;&gt;
&lt;span class=&quot;num&quot;&gt;The starting point&lt;/span&gt;
&lt;h3 style=&quot;margin-top:0&quot;&gt;Where we come from: stratification &lt;span class=&quot;src&quot;&gt;slide p. 2&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;The previous lecture described &lt;b&gt;stratification&lt;/b&gt;, that is, how a society is ordered into hierarchical strata:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Social class&lt;/b&gt;: a hierarchy based on occupation, linked to valued goods such as well-being, standard of living and health.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Social status&lt;/b&gt;: a subjective ranking in terms of honour, esteem and respect, for example &lt;i&gt;occupational prestige&lt;/i&gt; or group membership.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Income and wealth&lt;/b&gt;: summarised by the &lt;b&gt;Gini coefficient&lt;/b&gt; and by the debate on income stratification, the &quot;one percent&quot;. &lt;span class=&quot;src add&quot;&gt;added&lt;/span&gt; The Gini ranges from 0 (everyone has the same) to 1 (one person has everything).&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;note&quot;&gt;&lt;p&gt;&lt;b&gt;The link to today&lt;/b&gt; &lt;span class=&quot;src add&quot;&gt;added&lt;/span&gt; Gender is another axis of inequality, and it cuts across class and status. There is, however, a methodological difference: income has a widely used summary indicator, the Gini, whereas for gender equality &lt;i&gt;&quot;a single solid indicator of gender equality does not exist&quot;&lt;/i&gt; (slide p. 13).&lt;/p&gt;&lt;/div&gt;
&lt;p style=&quot;font-size:.9rem;color:var(--muted)&quot;&gt;This connection comes only from the recap on p. 2 of this PDF. The other files in &lt;code&gt;corso/&lt;/code&gt; were not consulted: the reading tool cannot list folders, and the paths attempted did not exist.&lt;/p&gt;
&lt;/section&gt;
&lt;section id=&quot;p1&quot; class=&quot;part p1&quot;&gt;
&lt;span class=&quot;num&quot;&gt;Part 1&lt;/span&gt;
&lt;h2&gt;Defining: equality is not equity&lt;/h2&gt;
&lt;p class=&quot;dek&quot;&gt;Two similar words, two different ideas: one describes the state to be reached, the other the fair way of getting there.&lt;/p&gt;

&lt;div class=&quot;note&quot;&gt;&lt;p&gt;&lt;b&gt;Sex and gender&lt;/b&gt; &lt;span class=&quot;src add&quot;&gt;added&lt;/span&gt; The slides use the term without defining it. &lt;b&gt;Sex&lt;/b&gt; refers to biological differences; &lt;b&gt;gender&lt;/b&gt; refers to socially constructed roles, norms and expectations, which therefore change over time and across societies. Precisely because it is constructed, gender can be studied as a source of inequality, and it can be changed.&lt;/p&gt;&lt;/div&gt;

&lt;h3 id=&quot;equality&quot;&gt;Gender equality &lt;span class=&quot;src&quot;&gt;slide p. 4-5&lt;/span&gt;&lt;/h3&gt;
&lt;blockquote class=&quot;defn&quot;&gt;Women and men, girls and boys have &lt;b&gt;equal conditions, treatment and opportunities&lt;/b&gt; to realise their full potential, human rights and dignity, and to contribute to, and benefit from, economic, social, cultural and political development.&lt;/blockquote&gt;
&lt;p&gt;The UN definition rests on four ideas. Open each one:&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Not uniformity: &quot;equal valuing&quot; of similarities and differences&lt;/summary&gt;&lt;div&gt;Society values equally the similarities, differences and roles of men and women, who are full partners in the home, the community and society. Equality &lt;b&gt;does not mean becoming the same&lt;/b&gt;: rights, responsibilities and opportunities &lt;i&gt;will not depend&lt;/i&gt; on being born male or female.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;The interests and needs of all, and the diversity of groups&lt;/summary&gt;&lt;div&gt;The interests, needs and priorities of both are taken into account, recognising that women and men are not homogeneous blocs (&lt;i&gt;recognizing the diversity of different groups&lt;/i&gt;).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Freedom from stereotypes&lt;/summary&gt;&lt;div&gt;Everyone is free to develop their abilities and make choices without the limits set by &lt;b&gt;stereotypes&lt;/b&gt; and &lt;b&gt;prejudices&lt;/b&gt; about gender roles. &lt;span class=&quot;src add&quot;&gt;added&lt;/span&gt; A stereotype is a generalisation about a group (&quot;women are naturally better at caregiving&quot;); a prejudice is a judgement made in advance on the basis of that generalisation.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Human rights and development&lt;/summary&gt;&lt;div&gt;&lt;b&gt;&quot;A matter of human rights&quot;&lt;/b&gt;, but also a &lt;i&gt;precondition for, and indicator of, sustainable people-centred development&lt;/i&gt;: a condition of people-centred development and, at the same time, a way of measuring it. This dual function explains why gender indices originate within the Human Development Report (Part 3).&lt;/div&gt;&lt;/details&gt;

&lt;h3 id=&quot;equity&quot;&gt;Gender equity &lt;span class=&quot;src&quot;&gt;slide p. 6&lt;/span&gt;&lt;/h3&gt;
&lt;blockquote class=&quot;defn&quot;&gt;The &lt;b&gt;process of being fair&lt;/b&gt; to men and women, boys and girls and, above all, the &lt;b&gt;equality of outcomes and results&lt;/b&gt;.&lt;/blockquote&gt;
&lt;p&gt;Equity allows people to be treated differently when this serves to correct a disadvantage arising from roles, norms or differences between the sexes. The typical instrument is &lt;b&gt;temporary special measures&lt;/b&gt;: special, time-limited measures that compensate for historical and systemic bias or discrimination. &lt;span class=&quot;src add&quot;&gt;added&lt;/span&gt; One example is a gender quota on electoral lists; it is temporary because it should apply only as long as the imbalance persists.&lt;/p&gt;
&lt;p&gt;The slide sums it up as follows: equal chances &lt;i&gt;not only at the starting point, but also when reaching the finishing line&lt;/i&gt;, taking into account the different needs, cultural barriers and past discrimination of the specific group.&lt;/p&gt;

&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Gender equality&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Gender equity&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;What it is&lt;/th&gt;&lt;td&gt;A principle and a state: equal rights, conditions and opportunities&lt;/td&gt;&lt;td&gt;A process: being fair, with attention to outcomes&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Treatment&lt;/th&gt;&lt;td&gt;Opportunities do not depend on sex at birth&lt;/td&gt;&lt;td&gt;May be differentiated, if this corrects a disadvantage&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Focus&lt;/th&gt;&lt;td&gt;Value, partnership, freedom of choice&lt;/td&gt;&lt;td&gt;Start and finish; the group&#x27;s barriers and history&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Key term&lt;/th&gt;&lt;td&gt;&lt;i&gt;equal valuing&lt;/i&gt;&lt;/td&gt;&lt;td&gt;&lt;i&gt;temporary special measures&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

&lt;p id=&quot;fence-text&quot; aria-live=&quot;polite&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;aside class=&quot;ext&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;
&lt;p&gt;Two caveats worth knowing. &lt;b&gt;On the cartoon:&lt;/b&gt; it is usually attributed to Craig Froehle and circulates in the Interaction Institute for Social Change version illustrated by Angus Maguire (&lt;a href=&quot;https://www.childrensmn.org/blog/need-think-think-equity/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Children&#x27;s Minnesota&lt;/a&gt;); the reported dates do not agree. It is also criticised for locating the problem in the person rather than in the fence (&lt;a href=&quot;https://www.socialventurepartners.org/wp-content/uploads/2018/01/Problem-with-Equity-vs-Equality-Graphic.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Social Venture Partners&lt;/a&gt;).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;On the term:&lt;/b&gt; the UN Women glossary states that the UN prefers &quot;gender equality&quot; to &quot;gender equity&quot;, and CEDAW General Recommendation 28 asks States to use the concepts of equality (&lt;a href=&quot;https://trainingcentre.unwomen.org/mod/glossary/showentry.php?eid=55&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Women Training Centre&lt;/a&gt;). The distinction made in the slides is useful for understanding, but UN usage is not uniform.&lt;/p&gt;&lt;/aside&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check, Part 1&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Does gender equality mean that men and women must become the same?&lt;/summary&gt;&lt;div&gt;No. It means that rights, responsibilities and opportunities do not depend on being born male or female, and that similarities and differences are valued equally (p. 5).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Does a quota reserved for women violate gender equality?&lt;/summary&gt;&lt;div&gt;According to the logic of the slides, no: it is a temporary special measure, a differentiated but fair treatment that compensates for historical discrimination. It serves equity, which in turn aims at equality.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What does &quot;the finishing line&quot; add to &quot;the starting point&quot;?&lt;/summary&gt;&lt;div&gt;Equal starting conditions may not be enough. Equity also looks at the outcome: if results remain unbalanced under formally equal rules, there is a barrier to be addressed.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is gender equality both a &quot;precondition&quot; and an &quot;indicator&quot; of development?&lt;/summary&gt;&lt;div&gt;Precondition: without equal rights, people-centred development cannot be achieved. Indicator: the level of parity signals how far a society is genuinely developing. This is why it can be measured alongside human development.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;p2&quot; class=&quot;part p2&quot;&gt;
&lt;span class=&quot;num&quot;&gt;Part 2&lt;/span&gt;
&lt;h2&gt;The dimensions: where inequality becomes visible&lt;/h2&gt;
&lt;p class=&quot;dek&quot;&gt;The slide lists five examples and ends with &quot;……&quot;: the list is deliberately open.&lt;/p&gt;

&lt;h3 id=&quot;dim&quot;&gt;Example of dimensions &lt;span class=&quot;src&quot;&gt;slide p. 8&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Each dimension will return in the indices of Parts 3 and 4. The connections below come from those slides.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Dimensions&quot;&gt;
&lt;button role=&quot;tab&quot;&gt;Health&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Family&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Education&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Economy&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Power&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Health and reproductive rights&lt;/h4&gt;&lt;p&gt;Health and reproductive rights: being able to decide whether and when to have children, and to do so safely.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How it is measured:&lt;/b&gt; maternal mortality ratio and adolescent birth rate in the GII (p. 16); law on reproductive rights and unmet needs for family planning in the SIGI (p. 19).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Family rights&lt;/h4&gt;&lt;p&gt;Rights within the family: marriage, divorce, inheritance, household responsibilities.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How it is measured:&lt;/b&gt; law on child marriage, divorce and inheritance; share of girls married before the age of 18; time spent on unpaid care work (p. 19).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Access to education&lt;/h4&gt;&lt;p&gt;Access to education at its various levels.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How it is measured:&lt;/b&gt; in the GII, the share of women and men aged 25 and over with at least some secondary education (p. 16).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Economic inequality&lt;/h4&gt;&lt;p&gt;Economic inequality: &lt;b&gt;horizontal/vertical segregation&lt;/b&gt; and the &lt;b&gt;gender pay gap&lt;/b&gt;, explained below.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How it is measured:&lt;/b&gt; labour force participation in the GII (p. 16); shares of managers, house and land owners and account holders in the SIGI (p. 20).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Power and decision making&lt;/h4&gt;&lt;p&gt;Power and decision-making processes: who sits where decisions are made.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How it is measured:&lt;/b&gt; parliamentary seats in the GII (p. 16); percentage of male MPs and the opinion that men are better leaders in the SIGI (p. 20). The most visible symptom is manels.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;p&gt;&lt;b&gt;The list remains open.&lt;/b&gt; Items not named on p. 8 include violence, freedom of movement and access to justice; they do, however, appear in the SIGI (p. 19-20).&lt;/p&gt;&lt;/div&gt;

&lt;h3 id=&quot;segr&quot;&gt;Segregation and the gender pay gap &lt;span class=&quot;src add&quot;&gt;added&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;The slides name these terms (p. 8, p. 12) without defining them. &lt;b&gt;Horizontal segregation&lt;/b&gt;: women and men are concentrated in different sectors. &lt;b&gt;Vertical segregation&lt;/b&gt;: within the same sector, women are less present at higher levels, the so-called &lt;i&gt;glass ceiling&lt;/i&gt;. Slide p. 12 uses the rate of women in technical vs service sectors as an indicator of the former.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg class=&quot;wide&quot; viewBox=&quot;0 0 680 280&quot; role=&quot;img&quot; aria-label=&quot;On the left, side-by-side bars: predominantly male technical sectors, predominantly female services. On the right, a pyramid: the female share declines at higher levels.&quot;&gt;
&lt;text class=&quot;h&quot; x=&quot;10&quot; y=&quot;24&quot;&gt;Horizontal: across sectors&lt;/text&gt;
&lt;text x=&quot;10&quot; y=&quot;62&quot;&gt;Technical&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;48&quot; width=&quot;230&quot; height=&quot;22&quot; class=&quot;fb&quot; style=&quot;stroke:var(--c)&quot;/&gt;&lt;rect x=&quot;90&quot; y=&quot;48&quot; width=&quot;58&quot; height=&quot;22&quot; class=&quot;fc&quot;/&gt;
&lt;text x=&quot;10&quot; y=&quot;112&quot;&gt;Service&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;98&quot; width=&quot;230&quot; height=&quot;22&quot; class=&quot;fb&quot; style=&quot;stroke:var(--c)&quot;/&gt;&lt;rect x=&quot;90&quot; y=&quot;98&quot; width=&quot;166&quot; height=&quot;22&quot; class=&quot;fc&quot;/&gt;
&lt;rect x=&quot;90&quot; y=&quot;150&quot; width=&quot;14&quot; height=&quot;14&quot; class=&quot;fc&quot;/&gt;&lt;text class=&quot;s&quot; x=&quot;110&quot; y=&quot;162&quot;&gt;women&lt;/text&gt;&lt;rect x=&quot;165&quot; y=&quot;150&quot; width=&quot;14&quot; height=&quot;14&quot; class=&quot;fb&quot; style=&quot;stroke:var(--c)&quot;/&gt;&lt;text class=&quot;s&quot; x=&quot;185&quot; y=&quot;162&quot;&gt;men&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;10&quot; y=&quot;200&quot;&gt;Invented values, only to show the shape&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;10&quot; y=&quot;218&quot;&gt;of the phenomenon.&lt;/text&gt;
&lt;text class=&quot;h&quot; x=&quot;370&quot; y=&quot;24&quot;&gt;Vertical: across levels&lt;/text&gt;
&lt;path d=&quot;M500 46L550 96H450Z&quot; class=&quot;fb&quot; style=&quot;stroke:var(--c)&quot;/&gt;&lt;path d=&quot;M500 46L510 56V96H490V56Z&quot; class=&quot;fc&quot;/&gt;
&lt;path d=&quot;M450 102H550L600 152H400Z&quot; class=&quot;fb&quot; style=&quot;stroke:var(--c)&quot;/&gt;&lt;path d=&quot;M475 102H525V152H445Z&quot; class=&quot;fc&quot;/&gt;
&lt;path d=&quot;M400 158H600L650 208H350Z&quot; class=&quot;fb&quot; style=&quot;stroke:var(--c)&quot;/&gt;&lt;path d=&quot;M400 158H530V208H350Z&quot; class=&quot;fc&quot;/&gt;
&lt;text class=&quot;s&quot; x=&quot;370&quot; y=&quot;240&quot;&gt;From the bottom: base, middle management, top.&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;370&quot; y=&quot;258&quot;&gt;The higher the level, the smaller women&#x27;s share.&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;h4&gt;Gender pay gap: how it is calculated&lt;/h4&gt;
&lt;p class=&quot;formula&quot;&gt;gap = (mean male wage − mean female wage) / mean male wage&lt;/p&gt;
&lt;p style=&quot;font-size:.93rem&quot;&gt;Formula for the &quot;raw&quot; (&lt;i&gt;unadjusted&lt;/i&gt;) version, which compares means without accounting for sector, hours or seniority. It therefore also includes the effects of segregation. Illustrative values, not real data.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Mean hourly wage, men&lt;/span&gt;&lt;output id=&quot;pg-mo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;pg-m&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;40&quot; value=&quot;20&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Mean hourly wage, women&lt;/span&gt;&lt;output id=&quot;pg-fo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;pg-f&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;40&quot; value=&quot;17&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;big&quot; id=&quot;pg-g&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;p id=&quot;pg-t&quot; style=&quot;margin:.3rem 0 0&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;aside class=&quot;ext&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The 2025 edition of EIGE&#x27;s Gender Equality Index summarises the earnings gap as follows: women would need to work 15 and a half months to earn what men earn in one year (&lt;a href=&quot;https://eige.europa.eu/newsroom/news/new-eu-data-shows-women-need-work-15-1-2-months-earn-what-men-make-year&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EIGE&lt;/a&gt;).&lt;/aside&gt;

&lt;h3 id=&quot;manels&quot;&gt;Manels &lt;span class=&quot;src&quot;&gt;slide p. 9&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;A &lt;b&gt;manel&lt;/b&gt; (&lt;i&gt;man + panel&lt;/i&gt;) is a panel or discussion table composed solely of men. The slide places two images side by side:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;a 2017 photo of an all-male table discussing health and benefits, &lt;i&gt;maternity included&lt;/i&gt;;&lt;/li&gt;
&lt;li&gt;a cartoon in which, while women carry water, men sitting under a tree explain: &lt;i&gt;&quot;Women? They are too busy to discuss water!&quot;&lt;/i&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;Diagram: on the left, those who bear the consequences, all women; on the right, those at the table, all men; the decision arrow runs from the table towards those subject to it.&quot;&gt;
&lt;text class=&quot;h&quot; x=&quot;10&quot; y=&quot;24&quot; style=&quot;fill:var(--sage)&quot;&gt;Those who bear the consequences&lt;/text&gt;
&lt;g style=&quot;fill:var(--sage)&quot;&gt;&lt;circle cx=&quot;30&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;66&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;102&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;138&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;174&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;210&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;10&quot; y=&quot;100&quot;&gt;water, maternity care&lt;/text&gt;
&lt;text class=&quot;h&quot; x=&quot;400&quot; y=&quot;24&quot; style=&quot;fill:var(--slate)&quot;&gt;Those at the table&lt;/text&gt;
&lt;g style=&quot;fill:var(--slate)&quot;&gt;&lt;circle cx=&quot;420&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;456&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;492&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;528&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;564&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;600&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;400&quot; y=&quot;100&quot;&gt;the decision&lt;/text&gt;
&lt;path class=&quot;l&quot; d=&quot;M390 60H238&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;text class=&quot;s&quot; x=&quot;314&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;decide for&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;10&quot; y=&quot;145&quot;&gt;Conceptual diagram: it shows the gap between those affected and those who decide, not data.&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;Why does a lecture on measurement discuss a photo? &lt;span class=&quot;src add&quot;&gt;added&lt;/span&gt; Because it makes the &lt;b&gt;power and decision making&lt;/b&gt; dimension visible: those who are absent contribute neither their experience nor their priorities, and decisions risk being less informed and less legitimate. These are the same aspects that GEM, GII and SIGI try to capture through seats, managers and opinions on leadership.&lt;/p&gt;
&lt;aside class=&quot;ext&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The photo was taken at the White House in March 2017, during negotiations on a healthcare reform that removed the requirement to cover maternity care in all insurance plans (&lt;a href=&quot;https://www.irishtimes.com/news/world/us/all-male-meeting-discussing-us-maternity-care-sparks-outrage-1.3023608&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Irish Times&lt;/a&gt;). The phenomenon went viral in 2015 with the satirical Tumblr &quot;Congrats, you have an all male panel!&quot;, started by Saara Särmä (&lt;a href=&quot;https://time.com/3859765/congrats-all-male-panel-tumblr-women-sexism-feminism-discrimination-gender/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Time&lt;/a&gt;).&lt;/aside&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check, Part 2&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Nurses are mostly women and engineers mostly men: which type of segregation is this?&lt;/summary&gt;&lt;div&gt;Horizontal: the difference is between sectors, not between hierarchical levels.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In a hospital, many female doctors but very few female heads of department: which type of segregation is this?&lt;/summary&gt;&lt;div&gt;Vertical: within the same sector, female presence declines at higher levels.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;If the raw gender pay gap is zero, are there no economic inequalities?&lt;/summary&gt;&lt;div&gt;No. The mean can conceal segregation, part-time work or differences in access to resources and assets. This is why the economy cannot be reduced to a single indicator.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What makes the water cartoon so effective?&lt;/summary&gt;&lt;div&gt;It inverts the justification: women&#x27;s absence is explained by the very work on which decisions are being made. It shows that the burden of unpaid work limits access to power, linking family, economy and power.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;p3&quot; class=&quot;part p3&quot;&gt;
&lt;span class=&quot;num&quot;&gt;Part 3&lt;/span&gt;
&lt;h2&gt;Measuring: no single indicator is enough&lt;/h2&gt;
&lt;p class=&quot;dek&quot;&gt;Gender equality is a multidimensional concept: different instruments may give different answers because they ask different questions.&lt;/p&gt;

&lt;h3 id=&quot;macro&quot;&gt;Three choices that distinguish every instrument &lt;span class=&quot;src&quot;&gt;slide p. 10-12&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Instruments vary according to the &lt;b&gt;dimensions&lt;/b&gt; investigated, the &lt;b&gt;spheres of life&lt;/b&gt; they focus on and the weight given to the &lt;b&gt;macro&lt;/b&gt; and &lt;b&gt;micro&lt;/b&gt; levels. The micro level concerns people&#x27;s relationships and lived experiences; the macro level concerns institutional and contextual aspects. The sphere is either &lt;b&gt;domestic&lt;/b&gt; (home and family) or &lt;b&gt;public&lt;/b&gt;.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; class=&quot;mx&quot; aria-label=&quot;Level and sphere&quot;&gt;
&lt;span aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot;&gt;Domestic&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot;&gt;Public&lt;/span&gt;
&lt;span aria-hidden=&quot;true&quot;&gt;Micro&lt;/span&gt;
&lt;button role=&quot;tab&quot; aria-label=&quot;Micro, domestic&quot;&gt;Inside the home&lt;small&gt;family relations&lt;/small&gt;&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-label=&quot;Micro, public&quot;&gt;Outside the home&lt;small&gt;public life&lt;/small&gt;&lt;/button&gt;
&lt;span aria-hidden=&quot;true&quot;&gt;Macro&lt;/span&gt;
&lt;button role=&quot;tab&quot; aria-label=&quot;Macro, domestic&quot;&gt;Rules on the family&lt;small&gt;laws and norms&lt;/small&gt;&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-label=&quot;Macro, public&quot;&gt;Rules of public life&lt;small&gt;institutions, structure&lt;/small&gt;&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Micro · Domestic &lt;span class=&quot;src&quot;&gt;slide p. 11&lt;/span&gt;&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Power dynamics between partners: who decides within the couple&lt;/li&gt;&lt;li&gt;Inequalities among siblings: between brothers and sisters&lt;/li&gt;&lt;li&gt;Relations with parents&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Micro · Public &lt;span class=&quot;src&quot;&gt;slide p. 11&lt;/span&gt;&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Labor market&lt;/li&gt;&lt;li&gt;Education&lt;/li&gt;&lt;li&gt;Decision-making process&lt;/li&gt;&lt;li&gt;Social and political participation&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Macro · Domestic &lt;span class=&quot;src add&quot;&gt;added&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;The slides leave this cell empty: this is my own placement of SIGI items (p. 19), such as laws on inheritance, divorce and household responsibilities. They set the rules of family life from the outside.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Macro · Public &lt;span class=&quot;src&quot;&gt;slide p. 12&lt;/span&gt;&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Rate of women employed in &lt;b&gt;technical vs service sectors&lt;/b&gt;: an indicator of horizontal segregation&lt;/li&gt;&lt;li&gt;&lt;b&gt;Laws&lt;/b&gt;: indicators of the &lt;i&gt;legal climate&lt;/i&gt; for norms and practices&lt;/li&gt;&lt;li&gt;&lt;b&gt;Poland&lt;/b&gt;: until 1996 women were barred from certain jobs, for example driving public transport vehicles&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;aside class=&quot;ext&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; On the Polish case, I found a regulation of 10 September 1996 listing jobs considered arduous or harmful to women&#x27;s health, which replaced a 1979 ordinance (&lt;a href=&quot;https://www.eurofound.europa.eu/fi/resources/article/2002/protective-regulations-womens-employment-amended&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eurofound&lt;/a&gt;). The sources found do not, however, mention driving public transport: that detail is confirmed only by the slide. The example illustrates a point well: a rule presented as protection can also function as a barrier to accessing work.&lt;/aside&gt;

&lt;h3 id=&quot;strategie&quot;&gt;Two measurement strategies &lt;span class=&quot;src&quot;&gt;slide p. 13-14&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Since &lt;i&gt;a single solid indicator of gender equality does not exist&lt;/i&gt;, several strategies are used:&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg class=&quot;wide&quot; viewBox=&quot;0 0 680 270&quot; role=&quot;img&quot; aria-label=&quot;Two paths. Official statistical offices provide the data for indices that compare societies over time. Surveys among population samples yield behaviours and attitudes.&quot;&gt;
&lt;rect class=&quot;n&quot; x=&quot;10&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;62&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Official statistical&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;offices&lt;/text&gt;
&lt;path class=&quot;l&quot; d=&quot;M200 51H258&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect class=&quot;n&quot; x=&quot;260&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;62&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;345&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Indices&lt;/text&gt;&lt;text x=&quot;345&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;s&quot;&gt;composite, transnational&lt;/text&gt;
&lt;path class=&quot;l&quot; d=&quot;M430 51H478&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;text x=&quot;482&quot; y=&quot;40&quot;&gt;Comparing societies&lt;/text&gt;&lt;text x=&quot;482&quot; y=&quot;60&quot;&gt;and over time&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;482&quot; y=&quot;80&quot;&gt;UNDP, OECD, WEF, EIGE&lt;/text&gt;
&lt;rect class=&quot;n&quot; x=&quot;10&quot; y=&quot;150&quot; width=&quot;190&quot; height=&quot;62&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Surveys among&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;population samples&lt;/text&gt;
&lt;path class=&quot;l&quot; d=&quot;M200 170C230 170 232 140 258 140&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;path class=&quot;l&quot; d=&quot;M200 192C230 192 232 222 258 222&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect class=&quot;n&quot; x=&quot;260&quot; y=&quot;118&quot; width=&quot;170&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;345&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot;&gt;What people do&lt;/text&gt;
&lt;rect class=&quot;n&quot; x=&quot;260&quot; y=&quot;200&quot; width=&quot;170&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;345&quot; y=&quot;227&quot; text-anchor=&quot;middle&quot;&gt;What people think&lt;/text&gt;
&lt;text x=&quot;450&quot; y=&quot;145&quot;&gt;Behaviours&lt;/text&gt;
&lt;text x=&quot;450&quot; y=&quot;218&quot;&gt;Beliefs, expected roles&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;450&quot; y=&quot;238&quot;&gt;Eurobarometer, EVS, WVS, ISSP&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Strategies&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Indices&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Surveys&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Strengths and limitations&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Indices constructed by transnational agencies using data from statistical offices: &lt;b&gt;UNDP&lt;/b&gt; (United Nations Development Programme), &lt;b&gt;OECD&lt;/b&gt; (Organisation for Economic Cooperation and Development), &lt;b&gt;WEF&lt;/b&gt; (World Economic Forum) and &lt;b&gt;EIGE&lt;/b&gt; (European Institute for Gender Equality). In the slide, UNDP and OECD are in bold, and these are the ones developed on the following pages.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;src add&quot;&gt;added&lt;/span&gt; A &lt;b&gt;composite index&lt;/b&gt; combines several indicators into a single value. It is convenient for comparison, but every choice of variables, weights and formula affects the result.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Information collected from individuals: both what they do and what they think about the roles of women and men. Examples: &lt;b&gt;Eurobarometer&lt;/b&gt;, &lt;b&gt;European Values Study&lt;/b&gt;, &lt;b&gt;World Values Survey&lt;/b&gt;, &lt;b&gt;International Social Survey Programme&lt;/b&gt; (EVS and WVS are in bold in the slide).&lt;/p&gt;&lt;p&gt;Such a survey makes it possible to ask questions that official statistics cannot answer, for example whether children suffer when their mother works outside the home. Similar questions feed into the SIGI (p. 19).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;span class=&quot;src add&quot;&gt;added&lt;/span&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Official indices&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Surveys&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Strength&lt;/th&gt;&lt;td&gt;Broad comparison across countries and over time&lt;/td&gt;&lt;td&gt;Captures norms, beliefs and lived experiences&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Limitation&lt;/th&gt;&lt;td&gt;Sees only what is recorded; depends on the quality of national data&lt;/td&gt;&lt;td&gt;Affected by sampling and question wording; a question may not mean the same thing across cultures&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Risk&lt;/th&gt;&lt;td&gt;The single number conceals internal profiles&lt;/td&gt;&lt;td&gt;Answers may follow what is socially acceptable&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;undp&quot;&gt;The UNDP indices over time &lt;span class=&quot;src&quot;&gt;slide p. 15-17&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;p&gt;The slides write &quot;UNPD&quot;: this is a typo for &lt;b&gt;UNDP&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-steps&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;year&quot;&gt;1990&lt;/div&gt;&lt;h4&gt;HDI, the starting point &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;The &lt;b&gt;Human Development Index&lt;/b&gt; shifts attention from GDP alone to human development: health, education and income, combined since 2010 using a geometric mean. The slides mention it without explaining it, but it is the basis for everything that follows. Sources: &lt;a href=&quot;https://www.frontiersin.org/articles/10.3389/fsoc.2023.1114095&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Frontiers in Sociology&lt;/a&gt;, &lt;a href=&quot;https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Technical_Notes.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNDP Technical Notes&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;year&quot;&gt;1995&lt;/div&gt;&lt;h4&gt;GDI and GEM &lt;span class=&quot;src&quot;&gt;slide p. 15&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Gender-related Development Index (GDI)&lt;/b&gt;: assesses how far gender differences in life expectancy, education and income affect human development. &lt;i&gt;It is not a pure measure of inequality&lt;/i&gt;: it adjusts the HDI to take gender into account.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Gender Empowerment Measure (GEM)&lt;/b&gt;: measures female empowerment, with an emphasis on economic and political life and on decision-making processes. &lt;b&gt;Limitation:&lt;/b&gt; doubtful comparability across parts of the world, for example Western urban areas and rural areas of developing countries; resource gaps were not considered.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;year&quot;&gt;2010&lt;/div&gt;&lt;h4&gt;GII &lt;span class=&quot;src&quot;&gt;slide p. 16&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Gender Inequality Index&lt;/b&gt;: measures gender inequities in three domains: reproductive health, political empowerment and economic participation. It is calculated every year and published in the Human Development Report. It is broken down below.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;year&quot;&gt;2023&lt;/div&gt;&lt;h4&gt;WEI and GGPI &lt;span class=&quot;src&quot;&gt;slide p. 17&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Two new measures from UNDP and UN Women, closely linked to the &lt;b&gt;UN Agenda 2030&lt;/b&gt;. &lt;b&gt;Women&#x27;s Empowerment Index (WEI)&lt;/b&gt;: women&#x27;s power and freedom to make choices. &lt;b&gt;Global Gender Parity Index (GGPI)&lt;/b&gt;: disparities in the key dimensions of human development.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-prev&gt;← Previous&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-next&gt;Next →&lt;/button&gt;&lt;span data-count aria-live=&quot;polite&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;GDI: try the ratio&lt;/h4&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;p class=&quot;formula&quot;&gt;GDI = female HDI / male HDI &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
&lt;p style=&quot;font-size:.93rem&quot;&gt;From the &lt;a href=&quot;https://hdr.undp.org/sites/default/files/data/2020/hdr2020_technical_notes.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNDP Technical Notes&lt;/a&gt;: this is the current version, redefined relative to 1995. A value of 1 indicates parity. Illustrative values.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Female HDI&lt;/span&gt;&lt;output id=&quot;gdi-fo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;gdi-f&quot; type=&quot;range&quot; min=&quot;30&quot; max=&quot;100&quot; value=&quot;72&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Male HDI&lt;/span&gt;&lt;output id=&quot;gdi-mo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;gdi-m&quot; type=&quot;range&quot; min=&quot;30&quot; max=&quot;100&quot; value=&quot;78&quot;&gt;&lt;/label&gt;
&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;big&quot; id=&quot;gdi-v&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;p id=&quot;gdi-t&quot; style=&quot;margin:.3rem 0 0&quot;&gt;&lt;/p&gt;
&lt;p style=&quot;font-size:.9rem;color:var(--muted)&quot;&gt;Note: a very poor country with HDIs of 0.40 and 0.40 has a GDI of 1. The GDI compares genders; it does not say whether the level is high.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4 id=&quot;gii-domini&quot;&gt;GII: the three domains &lt;span class=&quot;src&quot;&gt;slide p. 16&lt;/span&gt;&lt;/h4&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg class=&quot;wide&quot; viewBox=&quot;0 0 680 220&quot; role=&quot;img&quot; aria-label=&quot;The GII combines three domains: reproductive health, with maternal mortality and adolescent birth rate; political empowerment, with parliamentary seats and secondary education; economic participation.&quot;&gt;
&lt;rect class=&quot;n&quot; x=&quot;10&quot; y=&quot;20&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;115&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Reproductive health&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;115&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot;&gt;Maternal mortality ratio&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;115&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot;&gt;Adolescent birth rate&lt;/text&gt;
&lt;rect class=&quot;n&quot; x=&quot;235&quot; y=&quot;20&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Political empowerment&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;340&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot;&gt;Parliamentary seats (F, M)&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;340&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot;&gt;Secondary education 25+ (F, M)&lt;/text&gt;
&lt;rect class=&quot;n&quot; x=&quot;460&quot; y=&quot;20&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;565&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Economic participation&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;565&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot;&gt;Labour force participation&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;565&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot;&gt;women relative to men&lt;/text&gt;
&lt;path class=&quot;l&quot; d=&quot;M115 114C115 150 290 150 310 164&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;l&quot; d=&quot;M340 114V164&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;l&quot; d=&quot;M565 114C565 150 390 150 370 164&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect x=&quot;255&quot; y=&quot;166&quot; width=&quot;170&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;fc&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot; style=&quot;fill:var(--paper)&quot;&gt;GII&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;Note that in the slides &lt;b&gt;education falls within empowerment&lt;/b&gt;: it is not a domain of its own. &lt;span class=&quot;src add&quot;&gt;added&lt;/span&gt; The first domain concerns women only, because its indicators have no male equivalent.&lt;/p&gt;

&lt;div class=&quot;panel&quot; id=&quot;gii-lab&quot;&gt;
&lt;h4&gt;GII lab &lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;
&lt;p style=&quot;font-size:.93rem&quot;&gt;The formula is not in the slides: it comes from the &lt;a href=&quot;https://hdr.undp.org/sites/default/files/2023-24_HDR/hdr2023-24_technical_notes.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNDP Technical Notes 2023/24&lt;/a&gt;. I wrote it out from the structure described there (geometric means within each gender, harmonic mean across genders); check the details in the PDF.&lt;/p&gt;
&lt;p class=&quot;formula&quot;&gt;G&lt;sub&gt;F&lt;/sub&gt; = ∛[ √(10/MMR · 1/ABR) · √(PR&lt;sub&gt;F&lt;/sub&gt; · SE&lt;sub&gt;F&lt;/sub&gt;) · LFPR&lt;sub&gt;F&lt;/sub&gt; ]&lt;/p&gt;
&lt;p class=&quot;formula&quot;&gt;G&lt;sub&gt;M&lt;/sub&gt; = ∛[ 1 · √(PR&lt;sub&gt;M&lt;/sub&gt; · SE&lt;sub&gt;M&lt;/sub&gt;) · LFPR&lt;sub&gt;M&lt;/sub&gt; ]&lt;/p&gt;
&lt;p class=&quot;formula&quot;&gt;GII = 1 − Harm(G&lt;sub&gt;F&lt;/sub&gt;, G&lt;sub&gt;M&lt;/sub&gt;) / G&lt;sub&gt;F,M&lt;/sub&gt;&lt;/p&gt;
&lt;p style=&quot;font-size:.93rem&quot;&gt;&lt;b&gt;MMR&lt;/b&gt;: maternal deaths per 100,000 live births, capped between 10 and 1,000. &lt;b&gt;ABR&lt;/b&gt;: births per 1,000 girls aged 15-19. &lt;b&gt;PR&lt;/b&gt;: share of seats. &lt;b&gt;SE&lt;/b&gt;: share with secondary education. &lt;b&gt;LFPR&lt;/b&gt;: &lt;i&gt;labour force participation rate&lt;/i&gt;. &lt;b&gt;Harm&lt;/b&gt; is the harmonic mean; G&lt;sub&gt;F,M&lt;/sub&gt; is the same calculation on the means of women and men, the parity reference.&lt;/p&gt;
&lt;div id=&quot;gii&quot;&gt;
&lt;div class=&quot;btnrow&quot;&gt;
&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-pre=&quot;10,1,50,50,80,80,70,70&quot;&gt;Theoretical parity&lt;/button&gt;
&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-pre=&quot;70,40,25,75,60,65,50,75&quot;&gt;Intermediate scenario&lt;/button&gt;
&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-pre=&quot;600,120,10,90,15,35,30,80&quot;&gt;Severe imbalance&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;MMR&lt;/span&gt;&lt;output id=&quot;o-mmr&quot;&gt;&lt;/output&gt;&lt;input id=&quot;g-mmr&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;70&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;ABR&lt;/span&gt;&lt;output id=&quot;o-abr&quot;&gt;&lt;/output&gt;&lt;input id=&quot;g-abr&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;150&quot; value=&quot;40&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Seats, women&lt;/span&gt;&lt;output id=&quot;o-prf&quot;&gt;&lt;/output&gt;&lt;input id=&quot;g-prf&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;99&quot; value=&quot;25&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Seats, men&lt;/span&gt;&lt;output id=&quot;o-prm&quot;&gt;&lt;/output&gt;&lt;input id=&quot;g-prm&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;99&quot; value=&quot;75&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Secondary, women&lt;/span&gt;&lt;output id=&quot;o-sef&quot;&gt;&lt;/output&gt;&lt;input id=&quot;g-sef&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;100&quot; value=&quot;60&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Secondary, men&lt;/span&gt;&lt;output id=&quot;o-sem&quot;&gt;&lt;/output&gt;&lt;input id=&quot;g-sem&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;100&quot; value=&quot;65&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Labour, women&lt;/span&gt;&lt;output id=&quot;o-lff&quot;&gt;&lt;/output&gt;&lt;input id=&quot;g-lff&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;100&quot; value=&quot;50&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Labour, men&lt;/span&gt;&lt;output id=&quot;o-lfm&quot;&gt;&lt;/output&gt;&lt;input id=&quot;g-lfm&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;100&quot; value=&quot;75&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;big&quot; id=&quot;g-v&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;meter&quot;&gt;&lt;i id=&quot;g-bar&quot;&gt;&lt;/i&gt;&lt;/div&gt;
&lt;p id=&quot;g-d&quot; style=&quot;font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums&quot;&gt;&lt;/p&gt;
&lt;p style=&quot;font-size:.93rem&quot;&gt;&lt;b&gt;Things to try.&lt;/b&gt; With &quot;Theoretical parity&quot; the GII equals 0. Then raise MMR alone: the index rises sharply even though schooling, seats and labour do not change. Illustrative values; none is a real country. The GII ranges from 0 to 1, and a high value is a &lt;b&gt;worse&lt;/b&gt; result.&lt;/p&gt;
&lt;p style=&quot;font-size:.93rem&quot;&gt;&lt;b&gt;Check against real data:&lt;/b&gt; for Costa Rica 2022, UNDP calculates Harm 0.4249 and reference 0.5534, hence 1 − 0.4249/0.5534 = 0.232.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;aside class=&quot;ext&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The debate remains open. Bardhan and Klasen (1999) judged comparisons using GDI and GEM to be misleading (&lt;a href=&quot;https://bigenc.ru/b/undps-gender-related-indices-a-critical-review-87a12c&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;bibliographic record&lt;/a&gt;). A 2006 review notes that the GDI was often mistakenly read as a measure of inequality (&lt;a href=&quot;https://www.scilit.net/publications/3cf350b86653e3a94346ee1ee2f81aff&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scilit&lt;/a&gt;). Klasen (2017) argues that the GII is too complex to be a genuine step forward (&lt;a href=&quot;https://econpapers.repec.org/RePEc:got:gotcrc:220&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers&lt;/a&gt;).&lt;/aside&gt;

&lt;h4 id=&quot;twin&quot;&gt;WEI and GGPI: the two lenses &lt;span class=&quot;src&quot;&gt;slide p. 17&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;The WEI asks &lt;b&gt;how much power women have&lt;/b&gt; relative to their potential. The GGPI asks &lt;b&gt;how far they are from men&lt;/b&gt;. Both are needed: a country may show a small gap only because men are also doing poorly.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;big&quot;&gt;60%&lt;/div&gt;&lt;p style=&quot;margin:.2rem 0 .4rem&quot;&gt;&lt;b&gt;WEI.&lt;/b&gt; On average, women are empowered to achieve only 60% of their potential.&lt;/p&gt;&lt;div class=&quot;meter&quot; role=&quot;img&quot; aria-label=&quot;60 percent&quot;&gt;&lt;i style=&quot;width:60%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;big&quot;&gt;−28%&lt;/div&gt;&lt;p style=&quot;margin:.2rem 0 .4rem&quot;&gt;&lt;b&gt;GGPI.&lt;/b&gt; On average, women achieve 28% less than men in the key dimensions.&lt;/p&gt;&lt;div class=&quot;meter&quot; role=&quot;img&quot; aria-label=&quot;72 percent relative to men&quot;&gt;&lt;i style=&quot;width:72%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;Quadrant chart with empowerment on the horizontal axis and gender parity on the vertical axis. Fewer than one percent of women live in the upper-right quadrant.&quot;&gt;
&lt;path class=&quot;l&quot; d=&quot;M70 262H530&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;l&quot; d=&quot;M70 262V20&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect x=&quot;74&quot; y=&quot;24&quot; width=&quot;222&quot; height=&quot;114&quot; class=&quot;fb&quot;/&gt;&lt;rect x=&quot;302&quot; y=&quot;24&quot; width=&quot;222&quot; height=&quot;114&quot; class=&quot;fc&quot;/&gt;&lt;rect x=&quot;74&quot; y=&quot;144&quot; width=&quot;222&quot; height=&quot;114&quot; class=&quot;fb&quot;/&gt;&lt;rect x=&quot;302&quot; y=&quot;144&quot; width=&quot;222&quot; height=&quot;114&quot; class=&quot;fb&quot;/&gt;
&lt;text x=&quot;413&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot; style=&quot;fill:var(--paper)&quot;&gt;High WEI + small gap&lt;/text&gt;&lt;text x=&quot;413&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot; style=&quot;fill:var(--paper);font-size:17px&quot;&gt;&amp;lt; 1% women and girls&lt;/text&gt;
&lt;text x=&quot;185&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot;&gt;Small gap, little power&lt;/text&gt;
&lt;text x=&quot;413&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot;&gt;Much power, still a gap&lt;/text&gt;
&lt;text x=&quot;185&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot;&gt;Little power, wide gap&lt;/text&gt;
&lt;text x=&quot;300&quot; y=&quot;286&quot; text-anchor=&quot;middle&quot; class=&quot;s&quot;&gt;WEI: women&#x27;s empowerment →&lt;/text&gt;
&lt;text x=&quot;18&quot; y=&quot;140&quot; transform=&quot;rotate(-90 18 140)&quot; text-anchor=&quot;middle&quot; class=&quot;s&quot;&gt;GGPI: parity →&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption class=&quot;cap&quot;&gt;The &quot;&amp;lt; 1%&quot; figure is from slide p. 17; the labels of the other quadrants are mine, to explain how to read the two indices together.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;aside class=&quot;ext&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The report &lt;i&gt;The paths to equal&lt;/i&gt; covers 114 countries. The &lt;b&gt;WEI&lt;/b&gt; has five dimensions (life and health, education and skills, labour and financial inclusion, decision-making, freedom from violence); the &lt;b&gt;GGPI&lt;/b&gt; has the first four. Violence therefore appears only in the WEI. 3.1 billion women and girls live in countries with low or middle performance on both indices (&lt;a href=&quot;https://hdr.undp.org/content/paths-equal&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNDP&lt;/a&gt;, &lt;a href=&quot;https://www.unwomen.org/en/digital-library/publications/2023/07/the-paths-to-equal-twin-indices-on-womens-empowerment-and-gender-equality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Women&lt;/a&gt;).&lt;/aside&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check, Part 3&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;A law barring women from certain jobs: which level and sphere?&lt;/summary&gt;&lt;div&gt;Macro (institutional, legal climate) and public (labour market). This is the Polish example on p. 12.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;You want to know whether people believe a mother should stay at home. Index or survey?&lt;/summary&gt;&lt;div&gt;Survey: it is a belief. Official statistics record what happens, not what people think should happen.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is the GDI not a pure measure of inequality?&lt;/summary&gt;&lt;div&gt;Because it originated as an adjustment of the HDI for gender differences: it looks at human development, not only at the distance between women and men (p. 15).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What criticisms does the GEM receive in the slides?&lt;/summary&gt;&lt;div&gt;Comparability problems across very different parts of the world, such as Western urban and developing rural areas, and a failure to consider resource gaps (p. 15).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;GII: is a higher value better or worse? And the WEI?&lt;/summary&gt;&lt;div&gt;A high GII is worse (more inequality). A high WEI is better (more empowerment). Always check the direction of the scale: see the comparison table.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Can a country have a high GGPI and a low WEI?&lt;/summary&gt;&lt;div&gt;Yes: women and men can be close to each other, yet both far from what would be possible. This is why they are &quot;twin indices&quot;.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;p4&quot; class=&quot;part p4&quot;&gt;
&lt;span class=&quot;num&quot;&gt;Part 4&lt;/span&gt;
&lt;h2&gt;The SIGI case: looking at rules, not only outcomes&lt;/h2&gt;
&lt;p class=&quot;dek&quot;&gt;From what happens to why: the laws, social norms and practices that produce inequality.&lt;/p&gt;

&lt;h3 id=&quot;sigi&quot;&gt;What it is &lt;span class=&quot;src&quot;&gt;slide p. 18&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;The OECD&#x27;s &lt;b&gt;Social Institutions and Gender Index (SIGI)&lt;/b&gt; looks at the &lt;i&gt;institutional basis of gender inequality&lt;/i&gt;. It considers discrimination against women in four areas, focusing on &lt;b&gt;formal and informal social norms and practices&lt;/b&gt; that restrict participation in social life and access to human rights.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;src add&quot;&gt;added&lt;/span&gt; In sociology, a &lt;b&gt;social institution&lt;/b&gt; is not merely an organisation: it is a stable rule of collective life, whether written (the law) or unwritten (the expectation that women will care for the children). That is why most items alternate between three types of data.&lt;/p&gt;
&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;b style=&quot;color:var(--c)&quot;&gt;Law&lt;/b&gt; legal rule&lt;/span&gt;&lt;span&gt;&lt;b style=&quot;color:var(--c)&quot;&gt;Norm&lt;/b&gt; opinions and attitudes&lt;/span&gt;&lt;span&gt;&lt;b style=&quot;color:var(--c)&quot;&gt;Practice&lt;/b&gt; what actually happens&lt;/span&gt;&lt;/div&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;SIGI dimensions&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Family&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Physical integrity&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Resources&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Civil liberties&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Discrimination in the family &lt;span class=&quot;src&quot;&gt;slide p. 19&lt;/span&gt;&lt;/h4&gt;&lt;ul class=&quot;vt&quot;&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on child marriage&lt;small&gt;marriage involving minors&lt;/small&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practice&lt;/b&gt;&lt;span&gt;Percentage of girls under 18 married&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on household responsibilities&lt;small&gt;domestic duties&lt;/small&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Norm&lt;/b&gt;&lt;span&gt;Proportion of the population declaring that children will suffer if mothers are working outside home for a pay&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practice&lt;/b&gt;&lt;span&gt;Female to male ratio of time spent on unpaid care work&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on inheritance&lt;small&gt;succession to property&lt;/small&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on divorce&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Restricted physical integrity &lt;span class=&quot;src&quot;&gt;slide p. 19&lt;/span&gt;&lt;/h4&gt;&lt;ul class=&quot;vt&quot;&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on violence against women&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Norm&lt;/b&gt;&lt;span&gt;Proportion of the female population justifying domestic violence&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practice&lt;/b&gt;&lt;span&gt;Prevalence of domestic violence against women (lifetime)&lt;small&gt;at least once in a lifetime&lt;/small&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practice&lt;/b&gt;&lt;span&gt;Sex ratio at birth (natural = 105)&lt;small&gt;&lt;span class=&quot;src add&quot;&gt;added&lt;/span&gt; about 105 boys per 100 girls. Much higher values suggest prenatal selection driven by son preference.&lt;/small&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on reproductive rights&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practice&lt;/b&gt;&lt;span&gt;Female population with unmet needs for family planning&lt;small&gt;would like to avoid or delay a pregnancy but is not using contraception&lt;/small&gt;&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Restricted access to productive and financial resources &lt;span class=&quot;src&quot;&gt;slide p. 20&lt;/span&gt;&lt;/h4&gt;&lt;ul class=&quot;vt&quot;&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on working rights&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Norm&lt;/b&gt;&lt;span&gt;Proportion of the population declaring this is not acceptable for a woman in their family to work outside home for a pay&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practice&lt;/b&gt;&lt;span&gt;Share of managers (male)&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on access to non-land assets&lt;small&gt;assets other than land&lt;/small&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practice&lt;/b&gt;&lt;span&gt;Share of house owners (male)&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on access to land assets&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practice&lt;/b&gt;&lt;span&gt;Share of agricultural land holders (male)&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on access to financial services&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practice&lt;/b&gt;&lt;span&gt;Share of account holders (male)&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Restricted civil liberties &lt;span class=&quot;src&quot;&gt;slide p. 20&lt;/span&gt;&lt;/h4&gt;&lt;ul class=&quot;vt&quot;&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on civil rights&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on freedom of movement&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practice&lt;/b&gt;&lt;span&gt;Percentage of women in the total number of persons not feeling safe walking alone at night&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on political participation&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Norm&lt;/b&gt;&lt;span&gt;Share of the population that believes men are better political leaders than women&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practice&lt;/b&gt;&lt;span&gt;Percentage of male MPs&lt;small&gt;MP: member of parliament&lt;/small&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on access to justice&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Norm&lt;/b&gt;&lt;span&gt;Share of women declaring lack of confidence in the justice system&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;The Law, Norm, Practice classification is mine, to help you read the items: the slide does not label them. Some cases are debatable.&lt;/p&gt;
&lt;aside class=&quot;ext&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;external source&lt;/span&gt; The slides list 30 items. The fifth edition (2023) states 4 dimensions, 16 indicators and 25 variables, with scores from 0 to 100, where 100 is absolute discrimination; it covers 179 countries but calculates a score for 140 because of data gaps. The number does not match, so the list may come from another edition: for the exam, follow the slide (&lt;a href=&quot;https://www.oecd.org/en/publications/sigi-2023-methodology_775aca3a-en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OECD, SIGI 2023 Methodology&lt;/a&gt;).&lt;/aside&gt;

&lt;h3 id=&quot;blacksea&quot;&gt;The Black Sea table: reading beyond the total &lt;span class=&quot;src&quot;&gt;slide p. 18, 21&lt;/span&gt;&lt;/h3&gt;
