&lt;section id=&quot;ponte&quot; class=&quot;prose&quot;&gt;
&lt;span class=&quot;num&quot;&gt;Il punto di partenza&lt;/span&gt;
&lt;h3 style=&quot;margin-top:0&quot;&gt;Da dove veniamo: stratification &lt;span class=&quot;src&quot;&gt;slide p. 2&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;La lezione precedente ha descritto la &lt;b&gt;stratification&lt;/b&gt;, cioè come una società si ordina a strati gerarchici:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Social class&lt;/b&gt;: gerarchia basata sull&#x27;occupazione, legata a beni di valore come benessere, tenore di vita e salute.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Social status&lt;/b&gt;: graduatoria soggettiva in termini di onore, stima e rispetto, per esempio l&#x27;&lt;i&gt;occupational prestige&lt;/i&gt; (prestigio del lavoro) o l&#x27;appartenenza a un gruppo.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Income and wealth&lt;/b&gt;: reddito e patrimonio, riassunti dal &lt;b&gt;Gini coefficient&lt;/b&gt; e dal dibattito sull&#x27;income stratification, il &quot;one percent&quot;. &lt;span class=&quot;src add&quot;&gt;aggiunta&lt;/span&gt; Il Gini va da 0 (tutti hanno lo stesso) a 1 (uno solo ha tutto).&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;note&quot;&gt;&lt;p&gt;&lt;b&gt;Il legame con oggi&lt;/b&gt; &lt;span class=&quot;src add&quot;&gt;aggiunta&lt;/span&gt; Il genere è un altro asse di disuguaglianza e attraversa classe e status. C&#x27;è però una differenza di metodo: il reddito ha un indicatore di sintesi molto usato come il Gini, mentre per la gender equality &lt;i&gt;&quot;a single solid indicator of gender equality does not exist&quot;&lt;/i&gt; (slide p. 13).&lt;/p&gt;&lt;/div&gt;
&lt;p style=&quot;font-size:.9rem;color:var(--muted)&quot;&gt;Il collegamento viene solo dal ripasso a p. 2 di questo PDF. Gli altri file di &lt;code&gt;corso/&lt;/code&gt; non sono stati consultati: lo strumento di lettura non può elencare le cartelle e i percorsi tentati non esistevano.&lt;/p&gt;
&lt;/section&gt;
&lt;section id=&quot;p1&quot; class=&quot;part p1&quot;&gt;
&lt;span class=&quot;num&quot;&gt;Parte 1&lt;/span&gt;
&lt;h2&gt;Definire: equality non è equity&lt;/h2&gt;
&lt;p class=&quot;dek&quot;&gt;Due parole simili, due idee diverse: una descrive lo stato da raggiungere, l&#x27;altra il modo equo di arrivarci.&lt;/p&gt;

&lt;div class=&quot;note&quot;&gt;&lt;p&gt;&lt;b&gt;Sex e gender&lt;/b&gt; &lt;span class=&quot;src add&quot;&gt;aggiunta&lt;/span&gt; Le slide usano il termine senza definirlo. &lt;b&gt;Sex&lt;/b&gt; indica le differenze biologiche; &lt;b&gt;gender&lt;/b&gt; indica ruoli, norme e aspettative costruiti socialmente, che quindi cambiano nel tempo e tra società. Proprio perché è costruito, il genere si può studiare come fonte di disuguaglianza e si può modificare.&lt;/p&gt;&lt;/div&gt;

&lt;h3 id=&quot;equality&quot;&gt;Gender equality &lt;span class=&quot;src&quot;&gt;slide p. 4-5&lt;/span&gt;&lt;/h3&gt;
&lt;blockquote class=&quot;defn&quot;&gt;Donne e uomini, ragazze e ragazzi hanno &lt;b&gt;equal conditions, treatment and opportunities&lt;/b&gt; per realizzare il proprio potenziale, i diritti umani e la dignità, e per contribuire allo sviluppo economico, sociale, culturale e politico e beneficiarne.&lt;/blockquote&gt;
&lt;p&gt;La definizione ONU si regge su quattro idee. Apri ciascuna:&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Non è uniformità: &quot;equal valuing&quot; di somiglianze e differenze&lt;/summary&gt;&lt;div&gt;La società valorizza allo stesso modo somiglianze, differenze e ruoli di uomini e donne, partner a pieno titolo in casa, nella comunità e nella società. Equality &lt;b&gt;non vuol dire diventare uguali&lt;/b&gt;: diritti, responsabilità e opportunità &lt;i&gt;will not depend&lt;/i&gt; dall&#x27;essere nati maschi o femmine.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Interessi e bisogni di tutti, e diversità dei gruppi&lt;/summary&gt;&lt;div&gt;Si tengono in conto interessi, bisogni e priorità di entrambi, riconoscendo che donne e uomini non sono blocchi omogenei (&lt;i&gt;recognizing the diversity of different groups&lt;/i&gt;).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Libertà dagli stereotipi&lt;/summary&gt;&lt;div&gt;Ognuno è libero di sviluppare le proprie capacità e di scegliere senza i limiti posti da &lt;b&gt;stereotypes&lt;/b&gt; e &lt;b&gt;prejudices&lt;/b&gt; sui ruoli di genere. &lt;span class=&quot;src add&quot;&gt;aggiunta&lt;/span&gt; Lo stereotipo è una generalizzazione su un gruppo (&quot;le donne sono più portate alla cura&quot;); il pregiudizio è un giudizio dato in anticipo sulla base di quella generalizzazione.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Diritti umani e sviluppo&lt;/summary&gt;&lt;div&gt;&lt;b&gt;&quot;A matter of human rights&quot;&lt;/b&gt;, ma anche &lt;i&gt;precondition for, and indicator of, sustainable people-centred development&lt;/i&gt;: una condizione dello sviluppo centrato sulle persone e, insieme, un modo per misurarlo. Questa doppia funzione spiega perché gli indici di genere nascono dentro l&#x27;Human Development Report (Parte 3).&lt;/div&gt;&lt;/details&gt;

&lt;h3 id=&quot;equity&quot;&gt;Gender equity &lt;span class=&quot;src&quot;&gt;slide p. 6&lt;/span&gt;&lt;/h3&gt;
&lt;blockquote class=&quot;defn&quot;&gt;Il &lt;b&gt;process of being fair&lt;/b&gt; verso uomini e donne, ragazzi e ragazze e, soprattutto, l&#x27;&lt;b&gt;equality of outcomes and results&lt;/b&gt;.&lt;/blockquote&gt;
&lt;p&gt;L&#x27;equity ammette di trattare le persone in modo diverso, se serve a correggere uno svantaggio dovuto a ruoli, norme o differenze tra i sessi. Lo strumento tipico sono le &lt;b&gt;temporary special measures&lt;/b&gt;: misure speciali e a tempo che compensano bias o discriminazioni storiche e sistemiche. &lt;span class=&quot;src add&quot;&gt;aggiunta&lt;/span&gt; Un esempio è una quota di genere nelle liste elettorali; è temporanea perché dovrebbe servire finché resta lo squilibrio.&lt;/p&gt;
&lt;p&gt;La slide la riassume così: pari possibilità &lt;i&gt;not only at the starting point, but also when reaching the finishing line&lt;/i&gt;, tenendo conto di bisogni diversi, barriere culturali e discriminazioni passate del gruppo specifico.&lt;/p&gt;

&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Gender equality&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Gender equity&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Che cos&#x27;è&lt;/th&gt;&lt;td&gt;Un principio e uno stato: pari diritti, condizioni, opportunità&lt;/td&gt;&lt;td&gt;Un processo: essere equi, guardando ai risultati&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Il trattamento&lt;/th&gt;&lt;td&gt;Le opportunità non dipendono dal sesso di nascita&lt;/td&gt;&lt;td&gt;Può essere differenziato, se corregge uno svantaggio&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Dove guarda&lt;/th&gt;&lt;td&gt;Valore, partnership, libertà di scelta&lt;/td&gt;&lt;td&gt;Partenza e traguardo; barriere e storia del gruppo&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Parola chiave&lt;/th&gt;&lt;td&gt;&lt;i&gt;equal valuing&lt;/i&gt;&lt;/td&gt;&lt;td&gt;&lt;i&gt;temporary special measures&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

&lt;h3 id=&quot;fence&quot;&gt;Equality vs equity: prova la staccionata &lt;span class=&quot;src&quot;&gt;slide p. 7&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;La slide usa la celebre vignetta dei tre spettatori. Eccola ridisegnata: cambia la distribuzione e guarda chi riesce a vedere la partita.&lt;/p&gt;

&lt;aside class=&quot;ext&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;
&lt;p&gt;Due cautele da sapere. &lt;b&gt;Sulla vignetta:&lt;/b&gt; è di solito attribuita a Craig Froehle e circola nella versione dell&#x27;Interaction Institute for Social Change con illustrazione di Angus Maguire (&lt;a href=&quot;https://www.childrensmn.org/blog/need-think-think-equity/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Children&#x27;s Minnesota&lt;/a&gt;); le date riportate non concordano. Viene anche criticata perché lega il problema alla persona, non alla staccionata (&lt;a href=&quot;https://www.socialventurepartners.org/wp-content/uploads/2018/01/Problem-with-Equity-vs-Equality-Graphic.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Social Venture Partners&lt;/a&gt;).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Sul termine:&lt;/b&gt; il glossario di UN Women indica che l&#x27;ONU preferisce &quot;gender equality&quot; a &quot;gender equity&quot;, e la CEDAW General Recommendation 28 chiede agli Stati di usare i concetti di equality (&lt;a href=&quot;https://trainingcentre.unwomen.org/mod/glossary/showentry.php?eid=55&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Women Training Centre&lt;/a&gt;). La distinzione delle slide è utile per capire, ma il linguaggio ONU non è uniforme.&lt;/p&gt;&lt;/aside&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica, parte 1&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Gender equality significa che uomini e donne devono diventare uguali?&lt;/summary&gt;&lt;div&gt;No. Significa che diritti, responsabilità e opportunità non dipendono dall&#x27;essere nati maschi o femmine, e che somiglianze e differenze sono valorizzate allo stesso modo (p. 5).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Una quota riservata alle donne viola la gender equality?&lt;/summary&gt;&lt;div&gt;Secondo la logica delle slide no: è una temporary special measure, un trattamento differenziato ma equo per compensare una discriminazione storica. Serve all&#x27;equity, che a sua volta punta alla equality.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa aggiunge &quot;the finishing line&quot; rispetto a &quot;the starting point&quot;?&lt;/summary&gt;&lt;div&gt;Pari condizioni di partenza possono non bastare. L&#x27;equity guarda anche al risultato: se con regole formalmente uguali gli esiti restano squilibrati, c&#x27;è una barriera da affrontare.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché la gender equality è sia &quot;precondition&quot; sia &quot;indicator&quot; dello sviluppo?&lt;/summary&gt;&lt;div&gt;Precondition: senza pari diritti lo sviluppo centrato sulle persone non si realizza. Indicator: il livello di parità segnala quanto una società si sta sviluppando davvero. Per questo si può misurare accanto allo sviluppo umano.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;p2&quot; class=&quot;part p2&quot;&gt;
&lt;span class=&quot;num&quot;&gt;Parte 2&lt;/span&gt;
&lt;h2&gt;Le dimensioni: dove si vede la disuguaglianza&lt;/h2&gt;
&lt;p class=&quot;dek&quot;&gt;La slide elenca cinque esempi e chiude con &quot;……&quot;: la lista è volutamente aperta.&lt;/p&gt;

&lt;h3 id=&quot;dim&quot;&gt;Example of dimensions &lt;span class=&quot;src&quot;&gt;slide p. 8&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Ciascuna dimensione tornerà negli indici della Parte 3 e 4. I collegamenti sotto vengono da quelle slide.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Dimensioni&quot;&gt;
&lt;button role=&quot;tab&quot;&gt;Health&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Family&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Education&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Economy&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Power&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Health and reproductive rights&lt;/h4&gt;&lt;p&gt;Salute e diritti riproduttivi: poter decidere se e quando avere figli e farlo in sicurezza.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Come si misura:&lt;/b&gt; maternal mortality ratio e adolescent birth rate nel GII (p. 16); legge sui reproductive rights e unmet needs for family planning nel SIGI (p. 19).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Family rights&lt;/h4&gt;&lt;p&gt;Diritti dentro la famiglia: matrimonio, divorzio, eredità, responsabilità domestiche.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Come si misura:&lt;/b&gt; legge su child marriage, divorce e inheritance; quota di ragazze sposate prima dei 18 anni; tempo in unpaid care work, cioè il lavoro di cura non pagato (p. 19).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Access to education&lt;/h4&gt;&lt;p&gt;Accesso all&#x27;istruzione, ai diversi livelli.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Come si misura:&lt;/b&gt; nel GII, quota di donne e uomini dai 25 anni in su con almeno un po&#x27; di istruzione secondaria (p. 16).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Economic inequality&lt;/h4&gt;&lt;p&gt;Disuguaglianza economica: &lt;b&gt;horizontal/vertical segregation&lt;/b&gt; e &lt;b&gt;gender pay gap&lt;/b&gt;, spiegati qui sotto.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Come si misura:&lt;/b&gt; partecipazione al lavoro nel GII (p. 16); quote di manager, proprietari di casa e di terra e titolari di conto nel SIGI (p. 20).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Power and decision making&lt;/h4&gt;&lt;p&gt;Potere e processi decisionali: chi siede dove si decide.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Come si misura:&lt;/b&gt; seggi parlamentari nel GII (p. 16); percentuale di MP maschi e opinione che gli uomini siano leader migliori nel SIGI (p. 20). Il sintomo più visibile sono i manels.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;p&gt;&lt;b&gt;La lista resta aperta.&lt;/b&gt; Tra le voci non nominate a p. 8 ci sono violenza, libertà di movimento, accesso alla giustizia: compaiono però nel SIGI (p. 19-20).&lt;/p&gt;&lt;/div&gt;

&lt;h3 id=&quot;segr&quot;&gt;Segregation e gender pay gap &lt;span class=&quot;src add&quot;&gt;aggiunta&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Le slide nominano questi termini (p. 8, p. 12) senza definirli. &lt;b&gt;Horizontal segregation&lt;/b&gt;: donne e uomini si concentrano in settori diversi. &lt;b&gt;Vertical segregation&lt;/b&gt;: nello stesso settore, le donne sono meno presenti ai livelli alti, il cosiddetto &lt;i&gt;glass ceiling&lt;/i&gt; (soffitto di cristallo). La slide p. 12 usa come indicatore della prima il tasso di donne in technical vs service sectors.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg class=&quot;wide&quot; viewBox=&quot;0 0 680 280&quot; role=&quot;img&quot; aria-label=&quot;A sinistra barre affiancate: settori tecnici a prevalenza maschile, servizi a prevalenza femminile. A destra una piramide: la quota femminile cala salendo di livello.&quot;&gt;
&lt;text class=&quot;h&quot; x=&quot;10&quot; y=&quot;24&quot;&gt;Horizontal: tra settori&lt;/text&gt;
&lt;text x=&quot;10&quot; y=&quot;62&quot;&gt;Technical&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;48&quot; width=&quot;230&quot; height=&quot;22&quot; class=&quot;fb&quot; style=&quot;stroke:var(--c)&quot;/&gt;&lt;rect x=&quot;90&quot; y=&quot;48&quot; width=&quot;58&quot; height=&quot;22&quot; class=&quot;fc&quot;/&gt;
&lt;text x=&quot;10&quot; y=&quot;112&quot;&gt;Service&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;98&quot; width=&quot;230&quot; height=&quot;22&quot; class=&quot;fb&quot; style=&quot;stroke:var(--c)&quot;/&gt;&lt;rect x=&quot;90&quot; y=&quot;98&quot; width=&quot;166&quot; height=&quot;22&quot; class=&quot;fc&quot;/&gt;
&lt;rect x=&quot;90&quot; y=&quot;150&quot; width=&quot;14&quot; height=&quot;14&quot; class=&quot;fc&quot;/&gt;&lt;text class=&quot;s&quot; x=&quot;110&quot; y=&quot;162&quot;&gt;donne&lt;/text&gt;&lt;rect x=&quot;165&quot; y=&quot;150&quot; width=&quot;14&quot; height=&quot;14&quot; class=&quot;fb&quot; style=&quot;stroke:var(--c)&quot;/&gt;&lt;text class=&quot;s&quot; x=&quot;185&quot; y=&quot;162&quot;&gt;uomini&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;10&quot; y=&quot;200&quot;&gt;Valori inventati, solo per mostrare la forma&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;10&quot; y=&quot;218&quot;&gt;del fenomeno.&lt;/text&gt;
&lt;text class=&quot;h&quot; x=&quot;370&quot; y=&quot;24&quot;&gt;Vertical: tra livelli&lt;/text&gt;
&lt;path d=&quot;M500 46L550 96H450Z&quot; class=&quot;fb&quot; style=&quot;stroke:var(--c)&quot;/&gt;&lt;path d=&quot;M500 46L510 56V96H490V56Z&quot; class=&quot;fc&quot;/&gt;
&lt;path d=&quot;M450 102H550L600 152H400Z&quot; class=&quot;fb&quot; style=&quot;stroke:var(--c)&quot;/&gt;&lt;path d=&quot;M475 102H525V152H445Z&quot; class=&quot;fc&quot;/&gt;
&lt;path d=&quot;M400 158H600L650 208H350Z&quot; class=&quot;fb&quot; style=&quot;stroke:var(--c)&quot;/&gt;&lt;path d=&quot;M400 158H530V208H350Z&quot; class=&quot;fc&quot;/&gt;
&lt;text class=&quot;s&quot; x=&quot;370&quot; y=&quot;240&quot;&gt;Dal basso: base, middle management, vertice.&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;370&quot; y=&quot;258&quot;&gt;Più si sale, più la quota femminile si restringe.&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;h4&gt;Gender pay gap: come si calcola&lt;/h4&gt;
&lt;p class=&quot;formula&quot;&gt;gap = (salario medio uomini − salario medio donne) / salario medio uomini&lt;/p&gt;
&lt;p style=&quot;font-size:.93rem&quot;&gt;Formula della versione &quot;grezza&quot; (&lt;i&gt;unadjusted&lt;/i&gt;), che confronta medie senza tenere conto di settore, ore o anzianità. Include quindi anche gli effetti della segregazione. Valori di prova, non dati reali.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Salario orario medio, uomini&lt;/span&gt;&lt;output id=&quot;pg-mo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;pg-m&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;40&quot; value=&quot;20&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Salario orario medio, donne&lt;/span&gt;&lt;output id=&quot;pg-fo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;pg-f&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;40&quot; value=&quot;17&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;big&quot; id=&quot;pg-g&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;p id=&quot;pg-t&quot; style=&quot;margin:.3rem 0 0&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;aside class=&quot;ext&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; L&#x27;edizione 2025 del Gender Equality Index di EIGE riassume il divario dei guadagni così: le donne dovrebbero lavorare 15 mesi e mezzo per guadagnare ciò che gli uomini ottengono in un anno (&lt;a href=&quot;https://eige.europa.eu/newsroom/news/new-eu-data-shows-women-need-work-15-1-2-months-earn-what-men-make-year&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EIGE&lt;/a&gt;).&lt;/aside&gt;

&lt;h3 id=&quot;manels&quot;&gt;Manels &lt;span class=&quot;src&quot;&gt;slide p. 9&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Un &lt;b&gt;manel&lt;/b&gt; (&lt;i&gt;man + panel&lt;/i&gt;) è un panel o un tavolo di discussione composto di soli uomini. La slide affianca due immagini:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;una foto del 2017 con un tavolo di soli uomini che discute di salute e benefit, &lt;i&gt;maternity included&lt;/i&gt;;&lt;/li&gt;
&lt;li&gt;una vignetta in cui, mentre le donne trasportano l&#x27;acqua, gli uomini seduti sotto un albero spiegano: &lt;i&gt;&quot;Women? They are too busy to discuss water!&quot;&lt;/i&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;Schema: a sinistra chi vive le conseguenze, tutte donne; a destra chi siede al tavolo, tutti uomini; la freccia della decisione va dal tavolo verso chi la subisce.&quot;&gt;
&lt;text class=&quot;h&quot; x=&quot;10&quot; y=&quot;24&quot; style=&quot;fill:var(--sage)&quot;&gt;Chi vive le conseguenze&lt;/text&gt;
&lt;g style=&quot;fill:var(--sage)&quot;&gt;&lt;circle cx=&quot;30&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;66&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;102&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;138&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;174&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;210&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;10&quot; y=&quot;100&quot;&gt;acqua, cure di maternità&lt;/text&gt;
&lt;text class=&quot;h&quot; x=&quot;400&quot; y=&quot;24&quot; style=&quot;fill:var(--slate)&quot;&gt;Chi siede al tavolo&lt;/text&gt;
&lt;g style=&quot;fill:var(--slate)&quot;&gt;&lt;circle cx=&quot;420&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;456&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;492&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;528&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;564&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;600&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;400&quot; y=&quot;100&quot;&gt;la decisione&lt;/text&gt;
&lt;path class=&quot;l&quot; d=&quot;M390 60H238&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;text class=&quot;s&quot; x=&quot;314&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;decide per&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;10&quot; y=&quot;145&quot;&gt;Schema concettuale: mostra lo scarto tra chi è toccato e chi decide, non dati.&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;Perché una lezione sulla misura parla di una foto? &lt;span class=&quot;src add&quot;&gt;aggiunta&lt;/span&gt; Perché rende visibile la dimensione &lt;b&gt;power and decision making&lt;/b&gt;: chi è assente non porta esperienza né priorità, e le decisioni rischiano di essere meno informate e meno legittime. Sono gli stessi aspetti che GEM, GII e SIGI cercano di catturare con seggi, manager e opinioni sulla leadership.&lt;/p&gt;
&lt;aside class=&quot;ext&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; La foto è quella del marzo 2017 alla Casa Bianca, durante le trattative su una riforma sanitaria che toglieva l&#x27;obbligo di coprire la maternità in tutti i piani assicurativi (&lt;a href=&quot;https://www.irishtimes.com/news/world/us/all-male-meeting-discussing-us-maternity-care-sparks-outrage-1.3023608&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Irish Times&lt;/a&gt;). Il fenomeno divenne virale nel 2015 con il Tumblr ironico &quot;Congrats, you have an all male panel!&quot;, avviato da Saara Särmä (&lt;a href=&quot;https://time.com/3859765/congrats-all-male-panel-tumblr-women-sexism-feminism-discrimination-gender/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Time&lt;/a&gt;).&lt;/aside&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica, parte 2&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Infermiere soprattutto donne e ingegneri soprattutto uomini: quale segregazione è?&lt;/summary&gt;&lt;div&gt;Horizontal: la differenza è tra settori, non tra livelli gerarchici.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In un ospedale, molte dottoresse ma pochissime primarie: quale segregazione è?&lt;/summary&gt;&lt;div&gt;Vertical: nello stesso settore, la presenza femminile cala salendo di livello.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Se il gender pay gap grezzo è zero, non ci sono disuguaglianze economiche?&lt;/summary&gt;&lt;div&gt;No. La media può nascondere segregazione, part-time o differenze nell&#x27;accesso a risorse e patrimoni. Per questo l&#x27;economia non si riduce a un solo indicatore.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa rende così efficace la vignetta dell&#x27;acqua?&lt;/summary&gt;&lt;div&gt;Inverte la giustificazione: l&#x27;assenza delle donne viene spiegata con il lavoro stesso su cui si sta decidendo. Mostra che il carico di lavoro non pagato limita l&#x27;accesso al potere, collegando family, economy e power.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;p3&quot; class=&quot;part p3&quot;&gt;
&lt;span class=&quot;num&quot;&gt;Parte 3&lt;/span&gt;
&lt;h2&gt;Misurare: nessun indicatore basta da solo&lt;/h2&gt;
&lt;p class=&quot;dek&quot;&gt;Gender equality è un concetto multidimensionale: strumenti diversi possono dare risposte diverse perché fanno domande diverse.&lt;/p&gt;

&lt;h3 id=&quot;macro&quot;&gt;Tre scelte che distinguono ogni strumento &lt;span class=&quot;src&quot;&gt;slide p. 10-12&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Gli strumenti cambiano secondo le &lt;b&gt;dimensions&lt;/b&gt; indagate, le &lt;b&gt;spheres of life&lt;/b&gt; su cui si concentrano e il peso dato ai livelli &lt;b&gt;macro&lt;/b&gt; e &lt;b&gt;micro&lt;/b&gt;. Il livello micro riguarda relazioni e vissuti delle persone; il macro riguarda aspetti istituzionali e di contesto. La sfera è &lt;b&gt;domestic&lt;/b&gt; (casa e famiglia) o &lt;b&gt;public&lt;/b&gt;.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; class=&quot;mx&quot; aria-label=&quot;Livello e sfera&quot;&gt;
&lt;span aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot;&gt;Domestic&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot;&gt;Public&lt;/span&gt;
&lt;span aria-hidden=&quot;true&quot;&gt;Micro&lt;/span&gt;
&lt;button role=&quot;tab&quot; aria-label=&quot;Micro, domestic&quot;&gt;Dentro casa&lt;small&gt;relazioni familiari&lt;/small&gt;&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-label=&quot;Micro, public&quot;&gt;Fuori casa&lt;small&gt;vita pubblica&lt;/small&gt;&lt;/button&gt;
&lt;span aria-hidden=&quot;true&quot;&gt;Macro&lt;/span&gt;
&lt;button role=&quot;tab&quot; aria-label=&quot;Macro, domestic&quot;&gt;Regole sulla famiglia&lt;small&gt;leggi e norme&lt;/small&gt;&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-label=&quot;Macro, public&quot;&gt;Regole del pubblico&lt;small&gt;istituzioni, struttura&lt;/small&gt;&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Micro · Domestic &lt;span class=&quot;src&quot;&gt;slide p. 11&lt;/span&gt;&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Power dynamics between partners: chi decide nella coppia&lt;/li&gt;&lt;li&gt;Inequalities among siblings: disuguaglianze tra fratelli e sorelle&lt;/li&gt;&lt;li&gt;Relations with parents&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Micro · Public &lt;span class=&quot;src&quot;&gt;slide p. 11&lt;/span&gt;&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Labor market&lt;/li&gt;&lt;li&gt;Education&lt;/li&gt;&lt;li&gt;Decision-making process&lt;/li&gt;&lt;li&gt;Social and political participation&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Macro · Domestic &lt;span class=&quot;src add&quot;&gt;aggiunta&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Le slide non compilano questa casella: è la mia collocazione di voci del SIGI (p. 19), come le leggi su inheritance, divorce e household responsibilities. Stabiliscono dall&#x27;esterno le regole della vita familiare.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Macro · Public &lt;span class=&quot;src&quot;&gt;slide p. 12&lt;/span&gt;&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Tasso di donne occupate in &lt;b&gt;technical vs service sectors&lt;/b&gt;: indicatore di horizontal segregation&lt;/li&gt;&lt;li&gt;&lt;b&gt;Laws&lt;/b&gt;: indicatori del &lt;i&gt;legal climate&lt;/i&gt;, il clima giuridico per norme e pratiche&lt;/li&gt;&lt;li&gt;&lt;b&gt;Poland&lt;/b&gt;: fino al 1996 alle donne erano vietati alcuni lavori, per esempio guidare mezzi pubblici&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;aside class=&quot;ext&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Sul caso polacco ho trovato un regolamento del 10 settembre 1996 che elenca i lavori considerati gravosi o dannosi per la salute delle donne e sostituisce un&#x27;ordinanza del 1979 (&lt;a href=&quot;https://www.eurofound.europa.eu/fi/resources/article/2002/protective-regulations-womens-employment-amended&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eurofound&lt;/a&gt;). Le fonti trovate non nominano però la guida di mezzi pubblici: quel dettaglio resta confermato solo dalla slide. L&#x27;esempio mostra bene un punto: una norma presentata come tutela può funzionare anche da limite all&#x27;accesso al lavoro.&lt;/aside&gt;

&lt;h3 id=&quot;strategie&quot;&gt;Due strategie di misura &lt;span class=&quot;src&quot;&gt;slide p. 13-14&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Poiché &lt;i&gt;a single solid indicator of gender equality does not exist&lt;/i&gt;, si usano più strategie:&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg class=&quot;wide&quot; viewBox=&quot;0 0 680 270&quot; role=&quot;img&quot; aria-label=&quot;Due percorsi. Dagli uffici statistici ufficiali si calcolano indici per confrontare società nel tempo. Dalle survey su campioni di popolazione si ricavano comportamenti e atteggiamenti.&quot;&gt;
&lt;rect class=&quot;n&quot; x=&quot;10&quot; y=&quot;20&quot; width=&quot;190&quot; height=&quot;62&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Official statistical&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;offices&lt;/text&gt;
&lt;path class=&quot;l&quot; d=&quot;M200 51H258&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect class=&quot;n&quot; x=&quot;260&quot; y=&quot;20&quot; width=&quot;170&quot; height=&quot;62&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;345&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Indices&lt;/text&gt;&lt;text x=&quot;345&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; class=&quot;s&quot;&gt;composite, transnational&lt;/text&gt;
&lt;path class=&quot;l&quot; d=&quot;M430 51H478&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;text x=&quot;482&quot; y=&quot;40&quot;&gt;Confronto tra società&lt;/text&gt;&lt;text x=&quot;482&quot; y=&quot;60&quot;&gt;e nel tempo&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;482&quot; y=&quot;80&quot;&gt;UNDP, OECD, WEF, EIGE&lt;/text&gt;
&lt;rect class=&quot;n&quot; x=&quot;10&quot; y=&quot;150&quot; width=&quot;190&quot; height=&quot;62&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Surveys among&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;population samples&lt;/text&gt;
&lt;path class=&quot;l&quot; d=&quot;M200 170C230 170 232 140 258 140&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;path class=&quot;l&quot; d=&quot;M200 192C230 192 232 222 258 222&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect class=&quot;n&quot; x=&quot;260&quot; y=&quot;118&quot; width=&quot;170&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;345&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot;&gt;What people do&lt;/text&gt;
&lt;rect class=&quot;n&quot; x=&quot;260&quot; y=&quot;200&quot; width=&quot;170&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;345&quot; y=&quot;227&quot; text-anchor=&quot;middle&quot;&gt;What people think&lt;/text&gt;
&lt;text x=&quot;450&quot; y=&quot;145&quot;&gt;Comportamenti&lt;/text&gt;
&lt;text x=&quot;450&quot; y=&quot;218&quot;&gt;Credenze, ruoli attesi&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;450&quot; y=&quot;238&quot;&gt;Eurobarometer, EVS, WVS, ISSP&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Strategie&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Indici&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Survey&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Punti di forza e limiti&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Indici costruiti da agenzie transnazionali con i dati degli uffici statistici: &lt;b&gt;UNDP&lt;/b&gt; (United Nations Development Programme), &lt;b&gt;OECD&lt;/b&gt; (Organisation for Economic Cooperation and Development), &lt;b&gt;WEF&lt;/b&gt; (World Economic Forum) ed &lt;b&gt;EIGE&lt;/b&gt; (European Institute for Gender Equality). Nella slide UNDP e OECD sono in grassetto, e sono quelli sviluppati nelle pagine seguenti.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;src add&quot;&gt;aggiunta&lt;/span&gt; Un &lt;b&gt;composite index&lt;/b&gt; riunisce più indicatori in un solo valore. È comodo per confrontare, ma ogni scelta di variabili, pesi e formula incide sul risultato.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;Informazioni raccolte dagli individui: sia che cosa fanno, sia che cosa pensano del ruolo di donne e uomini. Esempi: &lt;b&gt;Eurobarometer&lt;/b&gt;, &lt;b&gt;European Values Study&lt;/b&gt;, &lt;b&gt;World Values Survey&lt;/b&gt;, &lt;b&gt;International Social Survey Programme&lt;/b&gt; (in grassetto nella slide EVS e WVS).&lt;/p&gt;&lt;p&gt;Una survey così permette domande impossibili da ricavare da una statistica ufficiale, per esempio se i figli soffrano quando la madre lavora fuori casa. Domande simili entrano nel SIGI (p. 19).&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;span class=&quot;src add&quot;&gt;aggiunta&lt;/span&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Indici ufficiali&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Survey&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Forza&lt;/th&gt;&lt;td&gt;Confronto ampio tra Paesi e nel tempo&lt;/td&gt;&lt;td&gt;Coglie norme, credenze e vissuti&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Limite&lt;/th&gt;&lt;td&gt;Vede ciò che è registrato; dipende dalla qualità dei dati nazionali&lt;/td&gt;&lt;td&gt;Risente di campione e formulazione; una domanda può non significare lo stesso in culture diverse&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Rischio&lt;/th&gt;&lt;td&gt;Il numero unico nasconde i profili interni&lt;/td&gt;&lt;td&gt;Le risposte possono seguire ciò che è socialmente accettabile&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;undp&quot;&gt;Gli indici UNDP nel tempo &lt;span class=&quot;src&quot;&gt;slide p. 15-17&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;p&gt;Le slide scrivono &quot;UNPD&quot;: è un refuso per &lt;b&gt;UNDP&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; data-steps&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;year&quot;&gt;1990&lt;/div&gt;&lt;h4&gt;HDI, il punto di partenza &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Lo &lt;b&gt;Human Development Index&lt;/b&gt; sposta l&#x27;attenzione dal solo PIL allo sviluppo umano: salute, istruzione e reddito, combinati dal 2010 con una media geometrica. Le slide lo citano senza spiegarlo, ma è la base di tutto ciò che segue. Fonti: &lt;a href=&quot;https://www.frontiersin.org/articles/10.3389/fsoc.2023.1114095&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Frontiers in Sociology&lt;/a&gt;, &lt;a href=&quot;https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Technical_Notes.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNDP Technical Notes&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;year&quot;&gt;1995&lt;/div&gt;&lt;h4&gt;GDI e GEM &lt;span class=&quot;src&quot;&gt;slide p. 15&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Gender-related Development Index (GDI)&lt;/b&gt;: valuta quanto le differenze di genere in life expectancy, education e income incidono sullo sviluppo umano. &lt;i&gt;Non è una misura pura di disuguaglianza&lt;/i&gt;: corregge l&#x27;HDI per tenere conto del genere.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Gender Empowerment Measure (GEM)&lt;/b&gt;: misura l&#x27;empowerment femminile, con enfasi su vita economica e politica e sui processi decisionali. &lt;b&gt;Limite:&lt;/b&gt; comparabilità dubbia tra parti del mondo, per esempio aree urbane occidentali e aree rurali dei Paesi in via di sviluppo; i divari di risorse non erano considerati.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;year&quot;&gt;2010&lt;/div&gt;&lt;h4&gt;GII &lt;span class=&quot;src&quot;&gt;slide p. 16&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Gender Inequality Index&lt;/b&gt;: misura le gender inequities in tre domini: reproductive health, political empowerment e partecipazione economica. Calcolato ogni anno e pubblicato nello Human Development Report. Lo trovi smontato qui sotto.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;year&quot;&gt;2023&lt;/div&gt;&lt;h4&gt;WEI e GGPI &lt;span class=&quot;src&quot;&gt;slide p. 17&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Due nuove misure di UNDP e UN Women, strettamente legate alla &lt;b&gt;UN Agenda 2030&lt;/b&gt;. &lt;b&gt;Women&#x27;s Empowerment Index (WEI)&lt;/b&gt;: potere e libertà delle donne di fare scelte. &lt;b&gt;Global Gender Parity Index (GGPI)&lt;/b&gt;: disparità nelle dimensioni chiave dello sviluppo umano.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-prev&gt;← Prima&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-next&gt;Dopo →&lt;/button&gt;&lt;span data-count aria-live=&quot;polite&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;GDI: prova il rapporto&lt;/h4&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;p class=&quot;formula&quot;&gt;GDI = HDI donne / HDI uomini &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
&lt;p style=&quot;font-size:.93rem&quot;&gt;Dalle &lt;a href=&quot;https://hdr.undp.org/sites/default/files/data/2020/hdr2020_technical_notes.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Technical Notes UNDP&lt;/a&gt;: è la versione attuale, ridefinita rispetto al 1995. Il valore 1 indica parità. Valori di prova.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;HDI donne&lt;/span&gt;&lt;output id=&quot;gdi-fo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;gdi-f&quot; type=&quot;range&quot; min=&quot;30&quot; max=&quot;100&quot; value=&quot;72&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;HDI uomini&lt;/span&gt;&lt;output id=&quot;gdi-mo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;gdi-m&quot; type=&quot;range&quot; min=&quot;30&quot; max=&quot;100&quot; value=&quot;78&quot;&gt;&lt;/label&gt;
&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;big&quot; id=&quot;gdi-v&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;p id=&quot;gdi-t&quot; style=&quot;margin:.3rem 0 0&quot;&gt;&lt;/p&gt;
&lt;p style=&quot;font-size:.9rem;color:var(--muted)&quot;&gt;Attenzione: un Paese poverissimo con HDI 0,40 e 0,40 ha GDI 1. Il GDI confronta i generi, non dice se il livello è alto.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4 id=&quot;gii-domini&quot;&gt;GII: i tre domini &lt;span class=&quot;src&quot;&gt;slide p. 16&lt;/span&gt;&lt;/h4&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg class=&quot;wide&quot; viewBox=&quot;0 0 680 220&quot; role=&quot;img&quot; aria-label=&quot;Il GII riunisce tre domini: reproductive health, con maternal mortality e adolescent birth rate; political empowerment, con seggi parlamentari e istruzione secondaria; economic participation.&quot;&gt;
&lt;rect class=&quot;n&quot; x=&quot;10&quot; y=&quot;20&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;115&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Reproductive health&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;115&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot;&gt;Maternal mortality ratio&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;115&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot;&gt;Adolescent birth rate&lt;/text&gt;
&lt;rect class=&quot;n&quot; x=&quot;235&quot; y=&quot;20&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Political empowerment&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;340&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot;&gt;Seggi parlamentari (F, M)&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;340&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot;&gt;Istruzione secondaria 25+ (F, M)&lt;/text&gt;
&lt;rect class=&quot;n&quot; x=&quot;460&quot; y=&quot;20&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;565&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Economic participation&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;565&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot;&gt;Partecipazione al lavoro&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;565&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot;&gt;donne rispetto a uomini&lt;/text&gt;
&lt;path class=&quot;l&quot; d=&quot;M115 114C115 150 290 150 310 164&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;l&quot; d=&quot;M340 114V164&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;l&quot; d=&quot;M565 114C565 150 390 150 370 164&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect x=&quot;255&quot; y=&quot;166&quot; width=&quot;170&quot; height=&quot;44&quot; rx=&quot;8&quot; class=&quot;fc&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot; style=&quot;fill:var(--paper)&quot;&gt;GII&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;Nota che nelle slide l&#x27;&lt;b&gt;istruzione sta dentro l&#x27;empowerment&lt;/b&gt;: non è un dominio a sé. &lt;span class=&quot;src add&quot;&gt;aggiunta&lt;/span&gt; Il primo dominio riguarda solo le donne, perché i suoi indicatori non hanno un equivalente maschile.&lt;/p&gt;

&lt;div class=&quot;panel&quot; id=&quot;gii-lab&quot;&gt;
&lt;h4&gt;Laboratorio GII &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;
&lt;p style=&quot;font-size:.93rem&quot;&gt;La formula non è nelle slide: viene dalle &lt;a href=&quot;https://hdr.undp.org/sites/default/files/2023-24_HDR/hdr2023-24_technical_notes.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Technical Notes UNDP 2023/24&lt;/a&gt;. Le ho scritte a partire dalla struttura descritta lì (medie geometriche entro ciascun genere, media armonica tra i generi); controlla i dettagli sul PDF.&lt;/p&gt;
&lt;p class=&quot;formula&quot;&gt;G&lt;sub&gt;F&lt;/sub&gt; = ∛[ √(10/MMR · 1/ABR) · √(PR&lt;sub&gt;F&lt;/sub&gt; · SE&lt;sub&gt;F&lt;/sub&gt;) · LFPR&lt;sub&gt;F&lt;/sub&gt; ]&lt;/p&gt;
&lt;p class=&quot;formula&quot;&gt;G&lt;sub&gt;M&lt;/sub&gt; = ∛[ 1 · √(PR&lt;sub&gt;M&lt;/sub&gt; · SE&lt;sub&gt;M&lt;/sub&gt;) · LFPR&lt;sub&gt;M&lt;/sub&gt; ]&lt;/p&gt;
&lt;p class=&quot;formula&quot;&gt;GII = 1 − Harm(G&lt;sub&gt;F&lt;/sub&gt;, G&lt;sub&gt;M&lt;/sub&gt;) / G&lt;sub&gt;F,M&lt;/sub&gt;&lt;/p&gt;
&lt;p style=&quot;font-size:.93rem&quot;&gt;&lt;b&gt;MMR&lt;/b&gt;: morti materne per 100.000 nati vivi, limitata tra 10 e 1000. &lt;b&gt;ABR&lt;/b&gt;: nascite per 1000 ragazze 15-19. &lt;b&gt;PR&lt;/b&gt;: quota di seggi. &lt;b&gt;SE&lt;/b&gt;: quota con istruzione secondaria. &lt;b&gt;LFPR&lt;/b&gt;: &lt;i&gt;labour force participation rate&lt;/i&gt;, tasso di partecipazione al lavoro. &lt;b&gt;Harm&lt;/b&gt; è la media armonica; G&lt;sub&gt;F,M&lt;/sub&gt; è lo stesso calcolo sulle medie di donne e uomini, il riferimento di parità.&lt;/p&gt;
&lt;div id=&quot;gii&quot;&gt;
&lt;div class=&quot;btnrow&quot;&gt;
&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-pre=&quot;10,1,50,50,80,80,70,70&quot;&gt;Parità teorica&lt;/button&gt;
&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-pre=&quot;70,40,25,75,60,65,50,75&quot;&gt;Scenario intermedio&lt;/button&gt;
&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-pre=&quot;600,120,10,90,15,35,30,80&quot;&gt;Forte squilibrio&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;

&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Secondaria, donne&lt;/span&gt;&lt;output id=&quot;o-sef&quot;&gt;&lt;/output&gt;&lt;input id=&quot;g-sef&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;100&quot; value=&quot;60&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Secondaria, uomini&lt;/span&gt;&lt;output id=&quot;o-sem&quot;&gt;&lt;/output&gt;&lt;input id=&quot;g-sem&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;100&quot; value=&quot;65&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Lavoro, donne&lt;/span&gt;&lt;output id=&quot;o-lff&quot;&gt;&lt;/output&gt;&lt;input id=&quot;g-lff&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;100&quot; value=&quot;50&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Lavoro, uomini&lt;/span&gt;&lt;output id=&quot;o-lfm&quot;&gt;&lt;/output&gt;&lt;input id=&quot;g-lfm&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;100&quot; value=&quot;75&quot;&gt;&lt;/label&gt;
&lt;/div&gt;

&lt;div class=&quot;meter&quot;&gt;&lt;i id=&quot;g-bar&quot;&gt;&lt;/i&gt;&lt;/div&gt;
&lt;p id=&quot;g-d&quot; style=&quot;font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums&quot;&gt;&lt;/p&gt;
&lt;p style=&quot;font-size:.93rem&quot;&gt;&lt;b&gt;Da provare.&lt;/b&gt; Con &quot;Parità teorica&quot; il GII vale 0. Poi alza solo MMR: l&#x27;indice sale molto anche se scuola, seggi e lavoro non cambiano. Valori di prova, nessuno è un Paese reale. Il GII va da 0 a 1 e un valore alto è un dato &lt;b&gt;peggiore&lt;/b&gt;.&lt;/p&gt;
&lt;p style=&quot;font-size:.93rem&quot;&gt;&lt;b&gt;Controllo con dato reale:&lt;/b&gt; UNDP calcola per la Costa Rica 2022 Harm 0,4249 e riferimento 0,5534, quindi 1 − 0,4249/0,5534 = 0,232.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;aside class=&quot;ext&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Il dibattito è aperto. Bardhan e Klasen (1999) giudicavano fuorvianti i confronti con GDI e GEM (&lt;a href=&quot;https://bigenc.ru/b/undps-gender-related-indices-a-critical-review-87a12c&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda bibliografica&lt;/a&gt;). Una rassegna del 2006 nota che il GDI veniva spesso letto per errore come misura di disuguaglianza (&lt;a href=&quot;https://www.scilit.net/publications/3cf350b86653e3a94346ee1ee2f81aff&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scilit&lt;/a&gt;). Klasen (2017) sostiene che il GII sia troppo complesso per essere un vero passo avanti (&lt;a href=&quot;https://econpapers.repec.org/RePEc:got:gotcrc:220&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers&lt;/a&gt;).&lt;/aside&gt;

&lt;h4 id=&quot;twin&quot;&gt;WEI e GGPI: le due lenti &lt;span class=&quot;src&quot;&gt;slide p. 17&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;Il WEI chiede &lt;b&gt;quanto potere hanno le donne&lt;/b&gt; rispetto al loro potenziale. Il GGPI chiede &lt;b&gt;quanto sono lontane dagli uomini&lt;/b&gt;. Servono entrambi: un Paese può avere poco divario solo perché anche gli uomini stanno male.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;big&quot;&gt;60%&lt;/div&gt;&lt;p style=&quot;margin:.2rem 0 .4rem&quot;&gt;&lt;b&gt;WEI.&lt;/b&gt; In media le donne hanno il potere di raggiungere solo il 60% del proprio potenziale.&lt;/p&gt;&lt;div class=&quot;meter&quot; role=&quot;img&quot; aria-label=&quot;60 per cento&quot;&gt;&lt;i style=&quot;width:60%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;big&quot;&gt;−28%&lt;/div&gt;&lt;p style=&quot;margin:.2rem 0 .4rem&quot;&gt;&lt;b&gt;GGPI.&lt;/b&gt; In media le donne raggiungono il 28% in meno degli uomini nelle dimensioni chiave.&lt;/p&gt;&lt;div class=&quot;meter&quot; role=&quot;img&quot; aria-label=&quot;72 per cento rispetto agli uomini&quot;&gt;&lt;i style=&quot;width:72%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;Quadrante con empowerment sull&#x27;asse orizzontale e gender parity sull&#x27;asse verticale. Meno dell&#x27;uno per cento delle donne vive nel quadrante in alto a destra.&quot;&gt;
&lt;path class=&quot;l&quot; d=&quot;M70 262H530&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;l&quot; d=&quot;M70 262V20&quot; marker-end=&quot;url(#ar)&quot;/&gt;

&lt;aside class=&quot;ext&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Il report &lt;i&gt;The paths to equal&lt;/i&gt; copre 114 Paesi. Il &lt;b&gt;WEI&lt;/b&gt; ha cinque dimensioni (life and health, education and skills, labour and financial inclusion, decision-making, freedom from violence); il &lt;b&gt;GGPI&lt;/b&gt; le prime quattro. La violenza compare quindi solo nel WEI. 3,1 miliardi di donne e ragazze vivono in Paesi con risultati bassi o medi su entrambi gli indici (&lt;a href=&quot;https://hdr.undp.org/content/paths-equal&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNDP&lt;/a&gt;, &lt;a href=&quot;https://www.unwomen.org/en/digital-library/publications/2023/07/the-paths-to-equal-twin-indices-on-womens-empowerment-and-gender-equality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Women&lt;/a&gt;).&lt;/aside&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica, parte 3&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Una legge che vieta alle donne certi lavori: livello e sfera?&lt;/summary&gt;&lt;div&gt;Macro (istituzionale, legal climate) e public (mercato del lavoro). È l&#x27;esempio polacco di p. 12.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Vuoi sapere se le persone credono che la madre debba stare a casa. Indice o survey?&lt;/summary&gt;&lt;div&gt;Survey: è una credenza. Una statistica ufficiale registra che cosa accade, non che cosa si pensa debba accadere.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché il GDI non è una misura pura di disuguaglianza?&lt;/summary&gt;&lt;div&gt;Perché nasce come aggiustamento dell&#x27;HDI per le differenze di genere: guarda allo sviluppo umano, non alla sola distanza tra donne e uomini (p. 15).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quali critiche riceve il GEM nelle slide?&lt;/summary&gt;&lt;div&gt;Problemi di comparabilità tra aree molto diverse del mondo, come urbane occidentali e rurali in via di sviluppo, e mancata considerazione dei divari di risorse (p. 15).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;GII: un valore più alto è meglio o peggio? E il WEI?&lt;/summary&gt;&lt;div&gt;GII alto è peggio (più disuguaglianza). WEI alto è meglio (più empowerment). Controlla sempre la direzione della scala: vedi la tabella di confronto.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un Paese può avere GGPI alto e WEI basso?&lt;/summary&gt;&lt;div&gt;Sì: donne e uomini possono essere vicini tra loro, ma entrambi lontani da ciò che sarebbe possibile. Per questo sono &quot;twin indices&quot;.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;p4&quot; class=&quot;part p4&quot;&gt;
&lt;span class=&quot;num&quot;&gt;Parte 4&lt;/span&gt;
&lt;h2&gt;Il caso SIGI: guardare alle regole, non solo agli esiti&lt;/h2&gt;
&lt;p class=&quot;dek&quot;&gt;Dal che cosa succede al perché: leggi, norme sociali e pratiche che producono la disuguaglianza.&lt;/p&gt;

&lt;h3 id=&quot;sigi&quot;&gt;Che cos&#x27;è &lt;span class=&quot;src&quot;&gt;slide p. 18&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Il &lt;b&gt;Social Institutions and Gender Index (SIGI)&lt;/b&gt; dell&#x27;OECD guarda alla &lt;i&gt;institutional basis of gender inequality&lt;/i&gt;, cioè alle sue basi istituzionali. Considera la discriminazione contro le donne in quattro aree, concentrandosi su &lt;b&gt;formal and informal social norms and practices&lt;/b&gt; che limitano la partecipazione alla vita sociale e l&#x27;accesso ai diritti umani.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;src add&quot;&gt;aggiunta&lt;/span&gt; Una &lt;b&gt;social institution&lt;/b&gt;, in sociologia, non è solo un ente: è una regola stabile del vivere comune, scritta (la legge) o non scritta (l&#x27;aspettativa che sia la donna a curare i figli). Per questo la maggior parte delle voci alterna tre tipi di dato.&lt;/p&gt;
&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;b style=&quot;color:var(--c)&quot;&gt;Law&lt;/b&gt; norma giuridica&lt;/span&gt;&lt;span&gt;&lt;b style=&quot;color:var(--c)&quot;&gt;Norm&lt;/b&gt; opinioni e atteggiamenti&lt;/span&gt;&lt;span&gt;&lt;b style=&quot;color:var(--c)&quot;&gt;Practice&lt;/b&gt; ciò che accade&lt;/span&gt;&lt;/div&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Dimensioni del SIGI&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Family&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Physical integrity&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Resources&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Civil liberties&lt;/button&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Discrimination in the family &lt;span class=&quot;src&quot;&gt;slide p. 19&lt;/span&gt;&lt;/h4&gt;&lt;ul class=&quot;vt&quot;&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on child marriage&lt;small&gt;matrimonio infantile&lt;/small&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practice&lt;/b&gt;&lt;span&gt;Percentage of girls under 18 married&lt;/span&gt;&lt;/li&gt;

&lt;li&gt;&lt;b&gt;Norm&lt;/b&gt;&lt;span&gt;Proportion of the population declaring that children will suffer if mothers are working outside home for a pay&lt;/span&gt;&lt;/li&gt;

&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Restricted physical integrity &lt;span class=&quot;src&quot;&gt;slide p. 19&lt;/span&gt;&lt;/h4&gt;&lt;ul class=&quot;vt&quot;&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on violence against women&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Norm&lt;/b&gt;&lt;span&gt;Proportion of the female population justifying domestic violence&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practice&lt;/b&gt;&lt;span&gt;Prevalence of domestic violence against women (lifetime)&lt;small&gt;almeno una volta nella vita&lt;/small&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practice&lt;/b&gt;&lt;span&gt;Sex ratio at birth (natural = 105)&lt;small&gt;&lt;span class=&quot;src add&quot;&gt;aggiunta&lt;/span&gt; circa 105 maschi ogni 100 femmine. Valori molto più alti fanno sospettare selezione prenatale per preferenza verso i figli maschi.&lt;/small&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Law&lt;/b&gt;&lt;span&gt;Legal framework on reproductive rights&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practice&lt;/b&gt;&lt;span&gt;Female population with unmet needs for family planning&lt;small&gt;vorrebbe evitare o rimandare una gravidanza ma non usa contraccezione&lt;/small&gt;&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;h4&gt;Restricted access to productive and financial resources &lt;span class=&quot;src&quot;&gt;slide p. 20&lt;/span&gt;&lt;/h4&gt;&lt;ul class=&quot;vt&quot;&gt;

&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;La suddivisione Law, Norm, Practice è mia, per aiutarti a leggere le voci: la slide non le etichetta. Alcuni casi sono discutibili.&lt;/p&gt;
&lt;aside class=&quot;ext&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Le slide elencano 30 voci. La quinta edizione (2023) dichiara 4 dimensioni, 16 indicatori e 25 variabili, con punteggi da 0 a 100, in cui 100 è discriminazione assoluta; copre 179 Paesi, ma calcola il punteggio per 140 a causa dei data gaps. Il numero non coincide, quindi l&#x27;elenco potrebbe venire da un&#x27;altra edizione: per l&#x27;esame segui la slide (&lt;a href=&quot;https://www.oecd.org/en/publications/sigi-2023-methodology_775aca3a-en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OECD, SIGI 2023 Methodology&lt;/a&gt;).&lt;/aside&gt;

&lt;h3 id=&quot;blacksea&quot;&gt;La tabella del Black Sea: leggere oltre il totale &lt;span class=&quot;src&quot;&gt;slide p. 18, 21&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Scala 0-100, &lt;b&gt;più alto significa più disuguaglianza&lt;/b&gt;. Tocca un&#x27;intestazione per ordinare e il nome di un Paese per caricarlo nel laboratorio. I bordi segnano il massimo di ogni colonna, gli stessi valori cerchiati nella slide.&lt;/p&gt;

&lt;div class=&quot;panel&quot; id=&quot;sigi-lab&quot;&gt;
&lt;h4&gt;Laboratorio SIGI&lt;/h4&gt;
&lt;p style=&quot;font-size:.93rem&quot;&gt;Muovi i cursori o scegli un Paese. Le lineette nere sui grafici sono la media di regione. Il risultato è una &lt;b&gt;media semplice&lt;/b&gt;: un&#x27;approssimazione mia. L&#x27;OECD dichiara pesi uguali e la stessa formula a ogni livello (&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.oecd.org/en/publications/sigi-2023-methodology_775aca3a-en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;OECD&lt;/a&gt;), e i valori in tabella si discostano dalla media semplice al massimo di circa un punto.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Family&lt;/span&gt;&lt;output&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;60&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Physical integrity&lt;/span&gt;&lt;output&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;60&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Resources&lt;/span&gt;&lt;output&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;60&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;&lt;span&gt;Civil liberties&lt;/span&gt;&lt;output&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;60&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;big&quot; id=&quot;sigi-mean&quot;&gt;&lt;/div&gt;&lt;p id=&quot;sigi-msg&quot; aria-live=&quot;polite&quot; style=&quot;margin:.3rem 0&quot;&gt;&lt;/p&gt;&lt;div id=&quot;sigi-bars&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;levels&quot; id=&quot;sigi-lv&quot; aria-label=&quot;Livelli di discriminazione, slide p. 18&quot;&gt;
&lt;div&gt;&lt;b&gt;Very low&lt;/b&gt;&amp;lt; 20&lt;/div&gt;&lt;div&gt;&lt;b&gt;Low&lt;/b&gt;20-30&lt;/div&gt;&lt;div&gt;&lt;b&gt;Medium&lt;/b&gt;30-40&lt;/div&gt;&lt;div&gt;&lt;b&gt;High&lt;/b&gt;40-50&lt;/div&gt;&lt;div&gt;&lt;b&gt;Very high&lt;/b&gt;&amp;gt; 50&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;La slide usa disuguaglianze strette e non dice dove cadono esattamente 20, 30, 40 e 50: qui ogni valore esatto passa alla fascia superiore (20 è Low, 50 è Very high).&lt;/p&gt;
&lt;/div&gt;

&lt;h4&gt;Che cosa insegna la tabella&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Il totale nasconde il profilo.&lt;/b&gt; Armenia (28) e Greece (27) sono quasi pari, ma l&#x27;Armenia è alta in physical integrity (35) e la Grecia ha 9 lì e 45 in family.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Ogni massimo sta in un Paese diverso:&lt;/b&gt; Greece in family (45), Azerbaijan in physical integrity (43), Turkey in resources (37), Russia in civil liberties (32).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Livelli.&lt;/b&gt; Solo Romania (17) è Very low; tutti gli altri restano nella fascia Low, tra 21 e 29. La fascia uguale però nasconde profili molto diversi.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Essere nell&#x27;UE non salva da tutto.&lt;/b&gt; &lt;span class=&quot;src add&quot;&gt;aggiunta&lt;/span&gt; Il massimo di family è di un Paese membro: nessun Paese è &quot;avanti&quot; su ogni dimensione.&lt;/li&gt;
&lt;/ul&gt;
&lt;p class=&quot;cap&quot;&gt;La slide cita &quot;a study on the Black Sea region&quot; senza autore né anno. &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt; Non ho trovato con certezza lo studio; sullo stesso tema ci sono &lt;a href=&quot;https://zenodo.org/records/7081629&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Gender norms, policies, and values in the Black Sea region&lt;/a&gt; e un&#x27;infografica &lt;a href=&quot;https://icbss.org/black-sea-women-in-society/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICBSS&lt;/a&gt;.&lt;/p&gt;

&lt;h3 id=&quot;pluralism&quot;&gt;Current discussion: legal pluralism &lt;span class=&quot;src&quot;&gt;slide p. 22-23&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;In vista della &lt;b&gt;6th edition&lt;/b&gt;, l&#x27;Expert Group Meeting rivede framework, metodologia e fonti di dati. Primo nodo: &lt;b&gt;legal pluralism&lt;/b&gt;, la coesistenza di due o più sistemi giuridici nello stesso campo sociale.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg class=&quot;wide&quot; viewBox=&quot;0 0 680 280&quot; role=&quot;img&quot; aria-label=&quot;Due sistemi giuridici si sovrappongono in un solo Paese. Chi sta nella zona comune può ricadere sotto entrambi: quale prevale?&quot;&gt;
&lt;rect x=&quot;4&quot; y=&quot;6&quot; width=&quot;672&quot; height=&quot;268&quot; rx=&quot;12&quot; class=&quot;rl&quot;/&gt;
&lt;text class=&quot;s&quot; x=&quot;20&quot; y=&quot;28&quot;&gt;Stesso Paese, stesso social field&lt;/text&gt;
&lt;circle cx=&quot;270&quot; cy=&quot;135&quot; r=&quot;100&quot; class=&quot;fb&quot; style=&quot;stroke:var(--c);fill-opacity:.75&quot;/&gt;&lt;circle cx=&quot;410&quot; cy=&quot;135&quot; r=&quot;100&quot; class=&quot;fb&quot; style=&quot;stroke:var(--c);fill-opacity:.75&quot;/&gt;
&lt;text x=&quot;225&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Legge A&lt;/text&gt;&lt;text x=&quot;225&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot; class=&quot;s&quot;&gt;es. civile&lt;/text&gt;
&lt;text x=&quot;455&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot;&gt;Legge B&lt;/text&gt;&lt;text x=&quot;455&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot; class=&quot;s&quot;&gt;es. religiosa&lt;/text&gt;
&lt;text x=&quot;340&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; class=&quot;b&quot; style=&quot;fill:var(--c);font-size:26px&quot;&gt;?&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot; class=&quot;s&quot;&gt;quale&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; class=&quot;s&quot;&gt;prevale?&lt;/text&gt;
&lt;text class=&quot;s&quot; x=&quot;340&quot; y=&quot;258&quot; text-anchor=&quot;middle&quot;&gt;Gruppi distinti per religion, ethnicity, race, class, geographic location&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;In questi Paesi leggi diverse si applicano a gruppi diversi per &lt;b&gt;religion, ethnicity, race, class o geographic location&lt;/b&gt;. La sfida è doppia: ogni legge può creare differenze tra i diritti di donne e uomini e non è chiaro se una &lt;b&gt;supersedes&lt;/b&gt; (prevale su) l&#x27;altra.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;src add&quot;&gt;aggiunta&lt;/span&gt; Conseguenza pratica: un Paese con una legge civile paritaria e una legge consuetudinaria discriminatoria su eredità o matrimonio che punteggio riceve? Un solo numero nazionale non rappresenta bene donne soggette a regole diverse.&lt;/p&gt;

&lt;h3 id=&quot;gaps&quot;&gt;Managing data gaps &lt;span class=&quot;src&quot;&gt;slide p. 24&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Il secondo nodo riguarda i dati. Il SIGI combina fonti internazionali e nazionali, tra cui &lt;b&gt;Demographic and Health Surveys (DHS)&lt;/b&gt; e &lt;b&gt;Multiple Indicator Cluster Surveys (MICS)&lt;/b&gt;. Per la slide, la &lt;b&gt;discontinuation of the DHS programme&lt;/b&gt; è una sfida importante per la prossima edizione. Un &lt;b&gt;data gap&lt;/b&gt; è un&#x27;informazione mancante per un Paese o un tema; &lt;span class=&quot;src add&quot;&gt;aggiunta&lt;/span&gt; i &lt;b&gt;microdata&lt;/b&gt; sono le risposte individuali, gli &lt;b&gt;aggregates&lt;/b&gt; i dati già riassunti.&lt;/p&gt;
