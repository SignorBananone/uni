&lt;p id=&quot;gaps-t&quot; aria-live=&quot;polite&quot; style=&quot;margin-bottom:.4rem&quot;&gt;Con la DHS attiva il SIGI riceve dati per due vie: direttamente (microdata o aggregati) e indirettamente, attraverso database internazionali.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div&gt;&lt;h4&gt;Direct impact&lt;/h4&gt;&lt;p&gt;DHS microdata o aggregati servono per varie variabili: terra e casa di donne e uomini, &lt;i&gt;gender gaps in asset ownership&lt;/i&gt;, atteggiamenti che giustificano la &lt;i&gt;intimate partner violence&lt;/i&gt;, cioè la violenza da parte del partner.&lt;/p&gt;&lt;/div&gt;
&lt;div&gt;&lt;h4&gt;Indirect impact&lt;/h4&gt;&lt;p&gt;La DHS è la &lt;b&gt;primary source&lt;/b&gt; di database da cui attinge il SIGI: UNICEF, &lt;b&gt;UN SDG Indicator 5.3.1&lt;/b&gt; su child marriage e UNICEF &lt;b&gt;FGM/C&lt;/b&gt; (&lt;i&gt;female genital mutilation/cutting&lt;/i&gt;, mutilazioni genitali femminili).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;aside class=&quot;ext&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;
&lt;p&gt;&lt;b&gt;Aggiornamento sulla DHS, da verificare:&lt;/b&gt; il quadro è meno netto di &quot;discontinuation&quot;. Dopo la fine del contratto USAID, nel 2025, fondi della Gates Foundation e di Bloomberg Philanthropies hanno permesso di proseguire le survey in corso e tenere attivo l&#x27;archivio, con un ambito ridotto. Il futuro resta incerto: all&#x27;inizio del 2026 la governance e il finanziamento stabile non erano definiti (&lt;a href=&quot;https://www.devex.com/news/demographic-and-health-surveys-reemerge-with-gates-funds-after-trump-cut-111840&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Devex&lt;/a&gt;, &lt;a href=&quot;https://www.prb.org/news/charting-a-path-forward-for-the-demographic-and-health-surveys-program/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PRB&lt;/a&gt;). Non ho trovato notizie successive.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Sulla 6th edition:&lt;/b&gt; non ho trovato documenti pubblici dedicati alla sesta edizione né al legal pluralism nel SIGI; la fonte resta la slide. La riunione di esperti rintracciata è del 2020 (&lt;a href=&quot;https://ced.cat/wp-content/uploads/2020/10/OECD-SIGI-Expert-Group-Meeting_draft-agenda.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;agenda&lt;/a&gt;).&lt;/p&gt;&lt;/aside&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica, parte 4&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Che cosa distingue il SIGI dal GII?&lt;/summary&gt;&lt;div&gt;Il GII misura soprattutto esiti in salute, empowerment e lavoro. Il SIGI guarda alle basi istituzionali: leggi, norme sociali formali e informali, pratiche.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quali sono le quattro dimensioni del SIGI?&lt;/summary&gt;&lt;div&gt;Discrimination in the family; restricted physical integrity; restricted access to productive and financial resources; restricted civil liberties.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un Paese ha SIGI 35. Come lo classifichi? E con SIGI 17?&lt;/summary&gt;&lt;div&gt;35: Medium (30-40). 17: Very low (&amp;lt; 20). È il caso della Romania.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Greece ha SIGI 27 e physical integrity 9. Che cosa fa alzare il totale?&lt;/summary&gt;&lt;div&gt;Family (45) e resources (33). L&#x27;esempio mostra perché vanno letti i punteggi delle dimensioni, non solo il totale.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa significa sex ratio at birth &quot;natural = 105&quot;?&lt;/summary&gt;&lt;div&gt;In condizioni naturali nascono circa 105 maschi ogni 100 femmine. Uno scostamento forte verso l&#x27;alto è un segnale indiretto di preferenza per i figli maschi.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché il legal pluralism complica un indice nazionale?&lt;/summary&gt;&lt;div&gt;Leggi diverse valgono per gruppi diversi e possono discriminare in modo diverso; inoltre non è sempre chiaro quale prevalga. Un solo valore nazionale fatica a rappresentarlo.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Differenza tra direct e indirect impact della fine della DHS?&lt;/summary&gt;&lt;div&gt;Direct: mancano i dati DHS usati per variabili del SIGI. Indirect: si indeboliscono i database esterni (UNICEF, SDG 5.3.1, FGM/C) che hanno la DHS come fonte primaria e da cui il SIGI attinge.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;indici&quot; class=&quot;part p0&quot;&gt;
&lt;span class=&quot;num&quot;&gt;Sintesi&lt;/span&gt;
&lt;h2&gt;Tutti gli indici a colpo d&#x27;occhio&lt;/h2&gt;
&lt;p class=&quot;dek&quot;&gt;La confusione più comune all&#x27;esame è sulla direzione: per alcuni un valore alto è buono, per altri è cattivo.&lt;/p&gt;
&lt;div class=&quot;tw&quot; tabindex=&quot;0&quot; role=&quot;region&quot; aria-label=&quot;Tabella di confronto degli indici, scorrevole&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Indice&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Chi, quando&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Che cosa guarda&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Il valore &quot;buono&quot;&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Attenzione&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;GDI&lt;/th&gt;&lt;td&gt;UNDP, 1995&lt;/td&gt;&lt;td&gt;Differenze di genere in life expectancy, education, income&lt;/td&gt;&lt;td&gt;1 = parità &lt;span class=&quot;src ext&quot;&gt;est.&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Non misura pura di disuguaglianza&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;GEM&lt;/th&gt;&lt;td&gt;UNDP, 1995&lt;/td&gt;&lt;td&gt;Empowerment economico, politico, decisionale&lt;/td&gt;&lt;td&gt;Non indicato nelle slide&lt;/td&gt;&lt;td&gt;Comparabilità; ignora i divari di risorse&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;GII&lt;/th&gt;&lt;td&gt;UNDP, 2010&lt;/td&gt;&lt;td&gt;Reproductive health, empowerment, lavoro&lt;/td&gt;&lt;td&gt;Basso (0 = parità) &lt;span class=&quot;src ext&quot;&gt;est.&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Complesso; la salute riproduttiva usa dati solo femminili&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;WEI&lt;/th&gt;&lt;td&gt;UNDP e UN Women, 2023&lt;/td&gt;&lt;td&gt;Potere e libertà di scelta delle donne&lt;/td&gt;&lt;td&gt;Alto&lt;/td&gt;&lt;td&gt;Non dice nulla sugli uomini&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;GGPI&lt;/th&gt;&lt;td&gt;UNDP e UN Women, 2023&lt;/td&gt;&lt;td&gt;Disparità donne-uomini nello sviluppo umano&lt;/td&gt;&lt;td&gt;Alto (vicino a parità)&lt;/td&gt;&lt;td&gt;Parità può convivere con livelli bassi&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;SIGI&lt;/th&gt;&lt;td&gt;OECD, prima versione 2009 &lt;span class=&quot;src ext&quot;&gt;est.&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Basi istituzionali: leggi, norme, pratiche&lt;/td&gt;&lt;td&gt;Basso (0-100)&lt;/td&gt;&lt;td&gt;Legal pluralism; data gaps&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Global Gender Gap&lt;/th&gt;&lt;td&gt;WEF &lt;span class=&quot;src ext&quot;&gt;est.&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Economy, education, health, politics&lt;/td&gt;&lt;td&gt;Alto (% di gap chiuso)&lt;/td&gt;&lt;td&gt;Misura i divari, non il livello&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Gender Equality Index&lt;/th&gt;&lt;td&gt;EIGE &lt;span class=&quot;src ext&quot;&gt;est.&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Work, money, knowledge, time, power, health&lt;/td&gt;&lt;td&gt;Alto (su 100)&lt;/td&gt;&lt;td&gt;Metodo cambiato nel 2025: no confronti con le vecchie edizioni&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src ext&quot;&gt;est.&lt;/span&gt; = fonte esterna, vedi &quot;Per approfondire&quot;. Le note &quot;Attenzione&quot; su GEM, GDI e SIGI vengono dalle slide; le altre sono mie deduzioni o critiche citate.&lt;/p&gt;
&lt;/section&gt;
&lt;section id=&quot;fonti&quot; class=&quot;part p0&quot;&gt;
&lt;span class=&quot;num&quot;&gt;Oltre le slide&lt;/span&gt;
&lt;h2&gt;Per approfondire&lt;/h2&gt;
&lt;p class=&quot;dek&quot;&gt;Tutto ciò che segue è &lt;span class=&quot;src ext&quot;&gt;fonte esterna&lt;/span&gt;, salvo dove è indicato che il link viene dalla slide.&lt;/p&gt;
&lt;p class=&quot;prose&quot; style=&quot;font-size:.95rem&quot;&gt;Ho letto i risultati di ricerca, non i documenti interi: prima di citare un dato, aprilo. I link &quot;dalla slide&quot; non sono comparsi nelle ricerche, quindi non ho potuto confermarli.&lt;/p&gt;

&lt;h3&gt;Definizioni&lt;/h3&gt;
&lt;div class=&quot;cards&quot;&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;UNICEF ROSA, Gender Equality: Glossary of Terms and Concepts (2017)&lt;/h4&gt;&lt;p&gt;Glossario dell&#x27;ufficio regionale UNICEF per l&#x27;Asia meridionale, consigliato a p. 4: le definizioni usate in lezione seguono questa impostazione.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Conta perché dà il lessico comune di tutta la lezione.&lt;/p&gt;&lt;a href=&quot;https://www.unicef.org/rosa/media/1761/file/Gender%20glossary%20of%20terms%20and%20concepts%20.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Apri il PDF&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;UN Women Training Centre, voce &quot;Gender equity&quot;&lt;/h4&gt;&lt;p&gt;Spiega la preferenza ONU per &quot;gender equality&quot; e richiama la CEDAW General Recommendation 28.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Non è nelle slide, ma evita di presentare &quot;equity&quot; come termine pacifico.&lt;/p&gt;&lt;a href=&quot;https://trainingcentre.unwomen.org/mod/glossary/showentry.php?eid=55&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Apri la voce&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Agenda 2030, SDG 5&lt;/h4&gt;&lt;p&gt;Obiettivo su gender equality, con target da 5.1 a 5.c. La pagina ONU riporta il 27,4% di donne nei parlamenti al 1° gennaio 2026 e valuta il mondo fuori rotta per il 2030.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;È la cornice di WEI e GGPI (slide p. 17).&lt;/p&gt;&lt;a href=&quot;https://sdgs.un.org/goals/goal5&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sdgs.un.org&lt;/a&gt;&lt;/article&gt;
&lt;/div&gt;

&lt;h3&gt;Manels&lt;/h3&gt;
&lt;div class=&quot;cards&quot;&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;BBC, foto del 2017 &lt;span class=&quot;src&quot;&gt;link dalla slide&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;L&#x27;articolo citato a p. 9 sulla riunione di soli uomini su salute e maternità. Il caso è confermato da altre testate, come &lt;a href=&quot;https://www.irishtimes.com/news/world/us/all-male-meeting-discussing-us-maternity-care-sparks-outrage-1.3023608&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Irish Times&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Un esempio concreto di potere decisionale squilibrato.&lt;/p&gt;&lt;a href=&quot;https://www.bbc.com/news/world-us-canada-39375228&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BBC News&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;The Guardian, &quot;Congrats, you have an all male panel&quot; (2015) &lt;span class=&quot;src&quot;&gt;link dalla slide&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Sul Tumblr diventato virale. Un resoconto parallelo è su &lt;a href=&quot;https://time.com/3859765/congrats-all-male-panel-tumblr-women-sexism-feminism-discrimination-gender/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Time&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Mostra l&#x27;ironia come strumento per rendere visibile il problema.&lt;/p&gt;&lt;a href=&quot;https://www.theguardian.com/world/2015/may/28/congrats-you-have-an-all-male-panel-creator-viral-tumblr&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Guardian&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Speak Out Revolution, le conseguenze dei manels &lt;span class=&quot;src&quot;&gt;dalla slide&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Blog citato a p. 9 sulle conseguenze poco visibili dei panel di soli uomini. Nel PDF l&#x27;indirizzo è tagliato dal bordo della slide e non ho trovato la pagina esatta: il link porta al sito.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Per il testo preciso, prendi l&#x27;URL dal PDF originale.&lt;/p&gt;&lt;a href=&quot;https://www.speakoutrevolution.co.uk/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;speakoutrevolution.co.uk&lt;/a&gt;&lt;/article&gt;
&lt;/div&gt;

&lt;h3&gt;UNDP e UN Women&lt;/h3&gt;
&lt;div class=&quot;cards&quot;&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Human Development Index, UNDP &lt;span class=&quot;src&quot;&gt;link dalla slide&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Il portale dati indicato a p. 16 per il report annuale.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Qui trovi i valori aggiornati per Paese.&lt;/p&gt;&lt;a href=&quot;https://hdr.undp.org/data-center/human-development-index#/indicies/HDI&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;hdr.undp.org&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;HDR 2025, Technical Notes&lt;/h4&gt;&lt;p&gt;Il documento tecnico sul calcolo di HDI, GDI e GII. L&#x27;esempio Costa Rica viene dalla &lt;a href=&quot;https://hdr.undp.org/sites/default/files/2023-24_HDR/hdr2023-24_technical_notes.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;versione 2023/24&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;È la fonte primaria da preferire a ogni riassunto, anche a questo.&lt;/p&gt;&lt;a href=&quot;https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Technical_Notes.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Apri il PDF&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;The paths to equal (2023)&lt;/h4&gt;&lt;p&gt;Il report dei twin indices, 114 Paesi, indicato a p. 17. Dà i dati su WEI e GGPI.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Primo indice ONU di genere con la violenza come dimensione autonoma.&lt;/p&gt;&lt;a href=&quot;https://www.unwomen.org/en/digital-library/publications/2023/07/the-paths-to-equal-twin-indices-on-womens-empowerment-and-gender-equality&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Women&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Le critiche: Klasen (2017)&lt;/h4&gt;&lt;p&gt;&lt;i&gt;UNDP&#x27;s gender-related measures: current problems and proposals for fixing them&lt;/i&gt;. Sostiene che il GII abbia debolezze concettuali ed empiriche e propone di riformare GDI e GEM.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Utile per discutere, non solo ripetere, gli indici.&lt;/p&gt;&lt;a href=&quot;https://econpapers.repec.org/RePEc:got:gotcrc:220&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers&lt;/a&gt;&lt;/article&gt;
&lt;/div&gt;

&lt;h3&gt;OECD SIGI e altri indici&lt;/h3&gt;
&lt;div class=&quot;cards&quot;&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;SIGI 2023 Methodology, OECD&lt;/h4&gt;&lt;p&gt;Framework, variabili e formula dell&#x27;edizione 2023: stessa aggregazione e pesi uguali a ogni livello.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Spiega come si passa dalla singola legge al punteggio.&lt;/p&gt;&lt;a href=&quot;https://www.oecd.org/en/publications/sigi-2023-methodology_775aca3a-en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;oecd.org&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;SIGI 2023 Global Report, OECD&lt;/h4&gt;&lt;p&gt;Il rapporto globale con i risultati per Paese.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Per confrontare i dati del Black Sea con quelli più recenti.&lt;/p&gt;&lt;a href=&quot;https://www.oecd.org/content/dam/oecd/en/publications/reports/2023/07/sigi-2023-global-report_a65d7f7f/4607b7c7-en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Apri il PDF&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Global Gender Gap Report 2025, WEF&lt;/h4&gt;&lt;p&gt;148 economie, 4 subindex, 14 indicatori. Gap chiuso al 68,8%: health 96,2%, education 95,1%, economy 61,0%, politics 22,9%. Con questo ritmo servirebbero 162 anni.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Mostra che il divario più ampio è sul potere politico.&lt;/p&gt;&lt;a href=&quot;https://www.weforum.org/publications/global-gender-gap-report-2025/in-full/benchmarking-gender-gaps-2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;weforum.org&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Gender Equality Index 2025, EIGE&lt;/h4&gt;&lt;p&gt;UE a 63,4 su 100, da 47,6 (Cipro) a 73,7 (Svezia); Italia 61,9, al 12° posto, secondo fonti che citano EIGE. Metodo aggiornato: i valori precedenti non sono confrontabili direttamente.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Un caso concreto di come una scelta di metodo cambia il numero: 71 nel 2024, 63,4 nel 2025, senza che questo sia un calo reale.&lt;/p&gt;&lt;a href=&quot;https://eige.europa.eu/newsroom/news/new-eu-data-shows-women-need-work-15-1-2-months-earn-what-men-make-year&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;eige.europa.eu&lt;/a&gt;&lt;/article&gt;
&lt;/div&gt;

&lt;h3&gt;Survey sui valori&lt;/h3&gt;
&lt;div class=&quot;cards&quot;&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;European Values Study&lt;/h4&gt;&lt;p&gt;Survey ripetuta dal 1981 ogni nove anni sui valori di fondo. Sesta ondata in corso.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Serie lunga, adatta a studiare il cambiamento degli atteggiamenti in Europa.&lt;/p&gt;&lt;a href=&quot;https://europeanvaluesstudy.eu/about-evs/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;europeanvaluesstudy.eu&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;World Values Survey&lt;/h4&gt;&lt;p&gt;Dal 1981, quasi 120 società. L&#x27;ottava ondata va dal 2024 alla fine del 2026.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Estende il confronto oltre l&#x27;Europa.&lt;/p&gt;&lt;a href=&quot;https://www.worldvaluessurvey.org/WVSContents.jsp?CMSID=Home&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;worldvaluessurvey.org&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;International Social Survey Programme&lt;/h4&gt;&lt;p&gt;Collaborazione con survey annuali. Il modulo &lt;i&gt;Family and Changing Gender Roles&lt;/i&gt; ha ondate dal 1988 al 2022 (&lt;a href=&quot;https://www.gesis.org/en/issp/data-and-documentation/family-and-changing-gender-roles&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GESIS&lt;/a&gt;).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;È il modulo più direttamente dedicato ai ruoli di genere.&lt;/p&gt;&lt;a href=&quot;https://issp.org/about-issp/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;issp.org&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Eurobarometer&lt;/h4&gt;&lt;p&gt;Lo strumento di sondaggio di Commissione, Parlamento e altre istituzioni UE, attivo dal 1974.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Dà un&#x27;opinione pubblica UE aggiornata di frequente.&lt;/p&gt;&lt;a href=&quot;https://europa.eu/eurobarometer/about/eurobarometer&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;europa.eu&lt;/a&gt;&lt;/article&gt;
&lt;/div&gt;

&lt;h3&gt;Dati e casi citati&lt;/h3&gt;
&lt;div class=&quot;cards&quot;&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;When health data go dark (BMC Medicine, 2025)&lt;/h4&gt;&lt;p&gt;Sull&#x27;importanza del programma DHS e sul suo possibile futuro. Vedi anche la &lt;a href=&quot;https://unstats.un.org/iswghs/documents/funding_impact_users.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;valutazione ONU&lt;/a&gt; sull&#x27;impatto per chi usa i dati.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Approfondisce il tema dei data gaps a p. 24.&lt;/p&gt;&lt;a href=&quot;https://link.springer.com/article/10.1186/s12916-025-04062-6&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Springer&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;MICS, UNICEF&lt;/h4&gt;&lt;p&gt;Programma di survey sulle famiglie sostenuto da UNICEF, dal 1995 in oltre 100 Paesi (dato di una presentazione UNICEF del 2011).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Atteso come fonte importante per i Paesi a basso reddito se la DHS si riduce.&lt;/p&gt;&lt;a href=&quot;https://unstats.un.org/unsd/iaeggs/Meetings/NewYork_October_2011/Documents/S2_Panel1_UNICEF.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Apri il PDF&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;SDG 5.3.1, metadati&lt;/h4&gt;&lt;p&gt;Quota di donne di 20-24 anni sposate o in unione prima dei 15 e prima dei 18 anni. Dati da DHS e MICS, armonizzati; compilati da UNICEF.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Mostra concretamente la dipendenza indiretta da DHS.&lt;/p&gt;&lt;a href=&quot;https://unstats.un.org/sdgs/metadata/?Text=&amp;amp;Goal=5&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Statistics&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;UNICEF, dati FGM/C&lt;/h4&gt;&lt;p&gt;Database globale basato su survey rappresentative come DHS e MICS. Il link è una brochure del 2016.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Secondo esempio del legame indiretto.&lt;/p&gt;&lt;a href=&quot;https://data.unicef.org/wp-content/uploads/2016/04/FGMC-2016-brochure_250.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Apri il PDF&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Polonia, regolamento del 1996&lt;/h4&gt;&lt;p&gt;Articolo Eurofound sulle regole di tutela del lavoro femminile. Conferma il quadro generale, non il divieto specifico sui mezzi pubblici.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Contesto del caso a p. 12.&lt;/p&gt;&lt;a href=&quot;https://www.eurofound.europa.eu/fi/resources/article/2002/protective-regulations-womens-employment-amended&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;eurofound.europa.eu&lt;/a&gt;&lt;/article&gt;
&lt;article class=&quot;card&quot;&gt;&lt;h4&gt;Measuring Gender Equality (Springer, 2023)&lt;/h4&gt;&lt;p&gt;Volume open access curato da di Bella, Fachelli, López-Roldán e Suter, con rassegna dei principali indicatori internazionali. Non è citato nelle slide.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Un buon testo per chi vuole andare oltre.&lt;/p&gt;&lt;a href=&quot;https://link.springer.com/content/pdf/10.1007/978-3-031-41486-2.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Apri il PDF&lt;/a&gt;&lt;/article&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;
&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/div&gt;&lt;/footer&gt;

/* staccionata */
safe(function(){
  var root=$(&quot;#fence-lab&quot;);if(!root)return;
  var S={equality:[1,1,1],equity:[0,1,2],justice:[0,0,0]};
  var H=[170,130,90],G=260,F=110,B=40;
  var T={
    equality:&quot;&lt;b&gt;Equality.&lt;/b&gt; Stesso trattamento: una cassa a testa. La persona più bassa continua a non vedere: la parità formale non basta se i punti di partenza sono diversi.&quot;,
    equity:&quot;&lt;b&gt;Equity.&lt;/b&gt; Trattamento differenziato: le casse sono sempre tre, ma distribuite secondo il bisogno. Ora vedono tutte. È la logica delle &lt;i&gt;temporary special measures&lt;/i&gt;.&quot;,
    justice:&quot;&lt;b&gt;Barriera rimossa.&lt;/b&gt; Terzo pannello diffuso in rete, non nella slide: invece di compensare si toglie l&#x27;ostacolo. In termini di genere: cambiare la norma o l&#x27;istituzione, non aiutare chi la subisce.&quot;
  };
  var btn=$$(&quot;[data-mode]&quot;,root),txt=$(&quot;#fence-text&quot;,root),fn=$(&quot;#fence-svg .fn&quot;,root);
  var per=$$(&quot;#fence-svg .per&quot;,root),seen=$$(&quot;#fence-svg .see&quot;,root);
  function set(m){
    btn.forEach(function(b){b.setAttribute(&quot;aria-pressed&quot;,b.dataset.mode===m)});
    S[m].forEach(function(n,i){
      var y=G-n*B;per[i].style.transform=&quot;translateY(&quot;+(y-G)+&quot;px)&quot;;
      $$(&quot;.bx[data-col=&#x27;&quot;+i+&quot;&#x27;]&quot;,root).forEach(function(r,k){r.style.opacity=k&lt;n?1:0});
      var can=m===&quot;justice&quot;||(y-H[i]+15)&lt;=F;seen[i].textContent=can?&quot;vede&quot;:&quot;non vede&quot;;
    });
    fn.style.opacity=m===&quot;justice&quot;?.15:1;txt.innerHTML=T[m];
  }
  btn.forEach(function(b){b.addEventListener(&quot;click&quot;,function(){set(b.dataset.mode)})});
  set(&quot;equality&quot;);
});

/* gender pay gap */
safe(function(){
  var m=$(&quot;#pg-m&quot;),f=$(&quot;#pg-f&quot;);if(!m)return;
  function up(){
    var a=+m.value,b=+f.value,g=(a-b)/a*100;
    $(&quot;#pg-mo&quot;).textContent=a+&quot; €&quot;;$(&quot;#pg-fo&quot;).textContent=b+&quot; €&quot;;
    $(&quot;#pg-g&quot;).textContent=it(g,1)+&quot; %&quot;;
    $(&quot;#pg-t&quot;).textContent=g&gt;0?&quot;Per guadagnare quanto un uomo in 12 mesi, una donna dovrebbe lavorare &quot;+it(12*a/b,1)+&quot; mesi.&quot;:g&lt;0?&quot;Qui il divario è a favore delle donne: il segno della formula si inverte.&quot;:&quot;Nessun divario medio. Può comunque esserci segregazione: la media non la vede.&quot;;
  }
  m.addEventListener(&quot;input&quot;,up);f.addEventListener(&quot;input&quot;,up);up();
});

/* GDI */
safe(function(){
  var f=$(&quot;#gdi-f&quot;),m=$(&quot;#gdi-m&quot;);if(!f)return;
  function up(){

    $(&quot;#gdi-fo&quot;).textContent=it(a,2);$(&quot;#gdi-mo&quot;).textContent=it(b,2);$(&quot;#gdi-v&quot;).textContent=it(g,3);
    $(&quot;#gdi-t&quot;).textContent=Math.abs(g-1)&lt;.0005?&quot;Parità: i due HDI coincidono.&quot;:g&lt;1?&quot;HDI femminile più basso di quello maschile.&quot;:&quot;HDI femminile più alto: anche questo è un divario, il GDI lo mostra sopra 1.&quot;;
  }
  f.addEventListener(&quot;input&quot;,up);m.addEventListener(&quot;input&quot;,up);up();
});

/* GII */
safe(function(){
  var w=$(&quot;#gii&quot;);if(!w)return;
  var ks=[&quot;mmr&quot;,&quot;abr&quot;,&quot;prf&quot;,&quot;prm&quot;,&quot;sef&quot;,&quot;sem&quot;,&quot;lff&quot;,&quot;lfm&quot;];
  var el={};ks.forEach(function(k){el[k]=$(&quot;#g-&quot;+k,w)});
  function up(){
    var v={};ks.forEach(function(k){v[k]=+el[k].value;$(&quot;#o-&quot;+k,w).textContent=v[k]+(k===&quot;mmr&quot;||k===&quot;abr&quot;?&quot;&quot;:&quot; %&quot;)});
    var cb=Math.cbrt,sq=Math.sqrt;
    var h=sq(10/v.mmr*1/v.abr),ef=sq(v.prf/100*v.sef/100),em=sq(v.prm/100*v.sem/100),lf=v.lff/100,lm=v.lfm/100;
    var gf=cb(h*ef*lf),gm=cb(em*lm),harm=2/(1/gf+1/gm),ref=cb(((h+1)/2)*((ef+em)/2)*((lf+lm)/2)),g=Math.max(0,1-harm/ref);
    $(&quot;#g-v&quot;,w).textContent=it(g,3);$(&quot;#g-bar&quot;,w).style.width=(g*100)+&quot;%&quot;;
    $(&quot;#g-d&quot;,w).textContent=&quot;GF &quot;+it(gf,3)+&quot; · GM &quot;+it(gm,3)+&quot; · Harm &quot;+it(harm,3)+&quot; · riferimento &quot;+it(ref,3);
  }
  ks.forEach(function(k){el[k].addEventListener(&quot;input&quot;,up)});
  $$(&quot;[data-pre]&quot;,w).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){
    b.dataset.pre.split(&quot;,&quot;).forEach(function(x,i){el[ks[i]].value=x});up();
  })});
  up();
});

/* SIGI: tabella + laboratorio */
safe(function(){
  var t=$(&quot;#sigi-table&quot;);if(!t)return;
  var body=$(&quot;tbody&quot;,t),rows=$$(&quot;tr&quot;,body);
  var REG=[30.4,18.9,23.4,22.1],names=[&quot;Discrimination in the family&quot;,&quot;Restricted physical integrity&quot;,&quot;Restricted access to resources&quot;,&quot;Restricted civil liberties&quot;];
  var max=[0,0,0,0,0];
  rows.forEach(function(r){$$(&quot;td.v&quot;,r).forEach(function(c,i){var v=+c.textContent;c.style.setProperty(&quot;--v&quot;,Math.min(42,v));if(i&gt;0&amp;&amp;v&gt;max[i])max[i]=v})});
  rows.forEach(function(r){$$(&quot;td.v&quot;,r).forEach(function(c,i){if(i&gt;0&amp;&amp;+c.textContent===max[i])c.classList.add(&quot;max&quot;)})});
  var sl=$$(&quot;#sigi-lab input&quot;),out=$$(&quot;#sigi-lab output&quot;),bars=$(&quot;#sigi-bars&quot;),cur=null;
  bars.innerHTML=names.map(function(n,i){return &#x27;&lt;div class=&quot;barrow&quot;&gt;&lt;span&gt;&#x27;+n+&#x27;&lt;/span&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;u style=&quot;left:&#x27;+(REG[i]/60*100)+&#x27;%&quot;&gt;&lt;/u&gt;&lt;/div&gt;&lt;b&gt;&lt;/b&gt;&lt;/div&gt;&#x27;}).join(&quot;&quot;);
  var fills=$$(&quot;i&quot;,bars),vals=$$(&quot;b&quot;,bars);
  function lvl(s){return s&lt;20?0:s&lt;30?1:s&lt;40?2:s&lt;50?3:4}
  var LV=[&quot;Very low&quot;,&quot;Low&quot;,&quot;Medium&quot;,&quot;High&quot;,&quot;Very high&quot;];
  function calc(){
    var n=sl.map(function(s){return +s.value}),a=(n[0]+n[1]+n[2]+n[3])/4;
    sl.forEach(function(s,i){out[i].textContent=n[i];fills[i].style.width=(n[i]/60*100)+&quot;%&quot;;vals[i].textContent=n[i]});
    $(&quot;#sigi-mean&quot;).textContent=it(a,1);
    var l=lvl(a);$$(&quot;#sigi-lv&gt;div&quot;).forEach(function(d,i){d.classList.toggle(&quot;on&quot;,i===l)});
    var msg=&quot;Con la media semplice: livello &quot;+LV[l]+&quot;.&quot;;
    if(cur){var same=cur.vals.every(function(x,i){return x===n[i]});
      if(same){var dl=cur.sigi-a;msg=cur.name+&quot;: SIGI in tabella &quot;+cur.sigi+&quot; (&quot;+LV[lvl(cur.sigi)]+&quot;), media semplice &quot;+it(a,2)+&quot;, scarto &quot;+it(dl,2)+&quot; punti.&quot;}
      else msg=&quot;Profilo modificato a partire da &quot;+cur.name+&quot;. &quot;+msg}
    $(&quot;#sigi-msg&quot;).textContent=msg;
  }
  function pick(r){
    rows.forEach(function(x){x.classList.toggle(&quot;sel&quot;,x===r);$(&quot;.row&quot;,x).setAttribute(&quot;aria-pressed&quot;,x===r)});
    var c=$$(&quot;td.v&quot;,r).map(function(x){return +x.textContent});
    cur={name:$(&quot;.row&quot;,r).textContent,sigi:c[0],vals:c.slice(1)};
    sl.forEach(function(s,i){s.value=cur.vals[i]});calc();
  }
  rows.forEach(function(r){$(&quot;.row&quot;,r).addEventListener(&quot;click&quot;,function(){pick(r)})});
  sl.forEach(function(s){s.addEventListener(&quot;input&quot;,calc)});
  var dir={};
  $$(&quot;.th&quot;,t).forEach(function(b,i){b.addEventListener(&quot;click&quot;,function(){
    dir[i]=!dir[i];var d=dir[i]?-1:1;if(i===0)d=-d;
    var cur2=$$(&quot;tr&quot;,body);
    cur2.sort(function(x,y){
      if(i===0)return d*$(&quot;.row&quot;,x).textContent.localeCompare($(&quot;.row&quot;,y).textContent);
      return d*(+$$(&quot;td.v&quot;,x)[i-1].textContent - +$$(&quot;td.v&quot;,y)[i-1].textContent);
    }).forEach(function(r){body.appendChild(r)});
    $$(&quot;th&quot;,t).forEach(function(h,j){if(h.querySelector(&quot;.th&quot;))h.setAttribute(&quot;aria-sort&quot;,j===i?(d&gt;0?&quot;ascending&quot;:&quot;descending&quot;):&quot;none&quot;)});
  })});
  pick(rows.filter(function(r){return $(&quot;.row&quot;,r).textContent===&quot;Greece&quot;})[0]||rows[0]);
});
