&lt;section class=&quot;part sage&quot; id=&quot;perche&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot; style=&quot;color:var(--sage)&quot;&gt;Migration&lt;/div&gt;&lt;h2&gt;Perché si migra?&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 3–4&lt;/span&gt; La lezione riparte dalla precedente (introduzione a &lt;span class=&quot;term-en&quot;&gt;migration&lt;/span&gt;, &lt;span class=&quot;term-en&quot;&gt;environmental migration&lt;/span&gt;, &lt;span class=&quot;term-en&quot;&gt;displacement&lt;/span&gt; e &lt;span class=&quot;term-en&quot;&gt;relocation&lt;/span&gt;) e apre con un&#x27;immagine di fenicotteri in volo e una domanda: &lt;b&gt;Why?&lt;/b&gt; Anche gli animali migrano: si spostano quando le condizioni dove vivono (cibo, acqua, clima, sicurezza) non bastano più, o quando altrove ce ne sono di migliori.&lt;/p&gt;
  &lt;div class=&quot;box tint small&quot;&gt;&lt;b&gt;Collegamento con le altre lezioni.&lt;/b&gt; La slide 3 rimanda alla lezione precedente del Modulo 2 (migrazione, migrazione ambientale, displacement e relocation). Non sono riuscito ad aprire gli altri file della cartella &lt;code&gt;corso/&lt;/code&gt;: con gli strumenti di questa sessione non si può elencarne il contenuto e i percorsi che ho provato a indovinare non esistevano. Le definizioni qui sotto sono quindi un ripasso generale (&lt;span class=&quot;src extra&quot;&gt;Oltre le slide&lt;/span&gt;), da confrontare con le slide della lezione 7.&lt;/div&gt;

  &lt;h3&gt;Push e pull: il modello di base &lt;span class=&quot;src extra&quot;&gt;Oltre le slide&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Il modo più semplice per rispondere al «perché» è il modello &lt;span class=&quot;term-en&quot;&gt;push–pull&lt;/span&gt; (fattori di spinta e di attrazione): una persona decide di partire quando ciò che la &lt;em&gt;spinge&lt;/em&gt; via dal luogo di origine e ciò che la &lt;em&gt;attira&lt;/em&gt; verso una destinazione superano gli &lt;em&gt;ostacoli&lt;/em&gt; (costi, distanza, confini, legami). Prova a cambiare categoria:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Economici&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Ambientali&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Politici&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Sociali / demografici&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;Push&lt;/b&gt;: disoccupazione, salari bassi, povertà, mancanza di credito.&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;Pull&lt;/b&gt;: domanda di lavoro, salari più alti, &lt;span class=&quot;term-en&quot;&gt;remittances&lt;/span&gt; (le rimesse, cioè il denaro che i migranti mandano alle famiglie d&#x27;origine).&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;Push&lt;/b&gt;: siccità, desertificazione, alluvioni, innalzamento del mare (lezione precedente: &lt;span class=&quot;term-en&quot;&gt;environmental migration&lt;/span&gt;).&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;Pull&lt;/b&gt;: terre fertili, città con servizi, zone meno esposte al rischio.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;Push&lt;/b&gt;: conflitti, persecuzioni, instabilità: qui si parla spesso di &lt;span class=&quot;term-en&quot;&gt;forced displacement&lt;/span&gt; (spostamento forzato).&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;Pull&lt;/b&gt;: sicurezza, diritti, stabilità istituzionale.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;Push&lt;/b&gt;: pressione demografica, discriminazione, scarso accesso a istruzione e sanità.&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;Pull&lt;/b&gt;: reti di parenti e connazionali già emigrati, università, ricongiungimento familiare.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Parole da avere chiare &lt;span class=&quot;src extra&quot;&gt;Oltre le slide&lt;/span&gt;&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;term-en&quot;&gt;International&lt;/span&gt; vs &lt;span class=&quot;term-en&quot;&gt;internal migration&lt;/span&gt;&lt;/span&gt;&lt;/summary&gt;&lt;p&gt;La migrazione &lt;b&gt;internazionale&lt;/b&gt; attraversa un confine di Stato; quella &lt;b&gt;interna&lt;/b&gt; avviene dentro un paese (es. campagna → città). Le slide ricordano che quella interna riguarda circa il &lt;b&gt;75% dei migranti&lt;/b&gt; nel mondo (sezione 4).&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;term-en&quot;&gt;Displacement&lt;/span&gt; e &lt;span class=&quot;term-en&quot;&gt;relocation&lt;/span&gt;&lt;/span&gt;&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Displacement&lt;/b&gt;: spostamento forzato da conflitti, violenze o disastri. &lt;b&gt;Relocation&lt;/b&gt; (o &lt;span class=&quot;term-en&quot;&gt;planned relocation&lt;/span&gt;): trasferimento &lt;em&gt;pianificato&lt;/em&gt;, spesso organizzato dallo Stato, di intere comunità da aree a rischio.&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;term-en&quot;&gt;Circular migration&lt;/span&gt;&lt;/span&gt;&lt;/summary&gt;&lt;p&gt;Spostamenti ripetuti avanti e indietro tra origine e destinazione (lavoro stagionale, contratti temporanei). È proprio la &lt;span class=&quot;term-en&quot;&gt;circularity&lt;/span&gt; che, secondo la critica della sezione 4, gli SDGs non vedono.&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;term-en&quot;&gt;Regular&lt;/span&gt; / &lt;span class=&quot;term-en&quot;&gt;irregular migration&lt;/span&gt;&lt;/span&gt;&lt;/summary&gt;&lt;p&gt;Regolare = attraverso canali legali (visti, permessi); irregolare = al di fuori di quelle regole. Il Target 10.7 parla di migrazione &lt;em&gt;orderly, safe, regular and responsible&lt;/em&gt;.&lt;/p&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 1&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa sono le remittances e perché legano migrazione e sviluppo?&lt;/summary&gt;&lt;p&gt;Sono il denaro che i migranti inviano alle famiglie nel paese d&#x27;origine. Finanziano consumi, istruzione, salute e piccoli investimenti: la migrazione diventa così un canale di sviluppo per chi resta, non solo una perdita.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Differenza tra displacement e planned relocation?&lt;/summary&gt;&lt;p&gt;Il displacement è forzato e non pianificato (fuga da conflitti o disastri); la relocation è un trasferimento organizzato e pianificato, di solito da parte delle autorità.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Nel modello push–pull, basta un forte fattore push perché qualcuno parta?&lt;/summary&gt;&lt;p&gt;No: contano anche gli ostacoli (costi, confini, distanza) e le risorse per superarli. Per questo i più poveri spesso &lt;em&gt;non&lt;/em&gt; riescono a migrare.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;md&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot; style=&quot;color:var(--ochre)&quot;&gt;Migration and Development&lt;/div&gt;&lt;h2&gt;Due politiche che non si parlavano&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 6&lt;/span&gt; Storicamente &lt;b&gt;non c&#x27;è stato mainstreaming&lt;/b&gt;: la migrazione non entrava nelle politiche di sviluppo e lo sviluppo non entrava nelle politiche migratorie.&lt;/p&gt;
  &lt;div class=&quot;box def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Mainstreaming&lt;/b&gt; — integrare un tema in &lt;em&gt;tutte&lt;/em&gt; le politiche ordinarie, invece di trattarlo come un capitolo a parte. «Mainstreaming della migrazione nello sviluppo» significa che i piani di sviluppo (sanità, lavoro, istruzione…) tengono conto di chi parte, di chi arriva e di chi torna.&lt;/div&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 760 210&quot; role=&quot;img&quot; aria-label=&quot;Schema: due silos di policy senza ponte&quot;&gt;
    &lt;rect x=&quot;20&quot; y=&quot;30&quot; width=&quot;250&quot; height=&quot;150&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
    &lt;text x=&quot;145&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Development policy&lt;/text&gt;
    &lt;text x=&quot;145&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;aiuti, crescita, povertà&lt;/text&gt;
    &lt;text x=&quot;145&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;«nel paese d&#x27;origine»&lt;/text&gt;
    &lt;text x=&quot;145&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;ministeri esteri / cooperazione&lt;/text&gt;
    &lt;rect x=&quot;490&quot; y=&quot;30&quot; width=&quot;250&quot; height=&quot;150&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
    &lt;text x=&quot;615&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Migration policy&lt;/text&gt;
    &lt;text x=&quot;615&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;ingressi, confini, sicurezza&lt;/text&gt;
    &lt;text x=&quot;615&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;«nel paese di destinazione»&lt;/text&gt;
    &lt;text x=&quot;615&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;ministeri dell&#x27;interno&lt;/text&gt;
    &lt;path d=&quot;M280 105 L340 105&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M420 105 L480 105&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;text x=&quot;380&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;26&quot; fill=&quot;var(--brick)&quot;&gt;✕&lt;/text&gt;
    &lt;text x=&quot;380&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--brick)&quot;&gt;nessun ponte&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Le due politiche erano gestite da istituzioni diverse e con obiettivi diversi (schema interpretativo).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Perché è stato così difficile collegarle&lt;/h3&gt;
  &lt;p class=&quot;small&quot;&gt;I sette fattori delle slide: apri ciascuno per la spiegazione.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;Prospettive diverse dei paesi (interessi diversi)&lt;/summary&gt;&lt;p&gt;I paesi di origine vedono nell&#x27;emigrazione rimesse, competenze di ritorno e minore disoccupazione, ma anche perdita di capitale umano. I paesi di destinazione la guardano in termini di mercato del lavoro, costi di welfare e controllo dei confini. Un accordo comune è difficile perché &lt;b&gt;gli interessi divergono&lt;/b&gt;.&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Economic concerns&lt;/summary&gt;&lt;p&gt;Paura della concorrenza sui salari, effetti sulla finanza pubblica, ma anche bisogno di manodopera in alcuni settori (agricoltura, cura, edilizia).&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Demographic processes&lt;/summary&gt;&lt;p&gt;Società che invecchiano e hanno bassa natalità (Europa, Giappone) accanto a popolazioni giovani in crescita (Africa subsahariana): la migrazione diventa anche una questione demografica, legata a pensioni e forza lavoro.&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Domanda crescente di (highly-)skilled migration: selective admission&lt;/summary&gt;&lt;p&gt;I paesi ricchi aprono le porte soprattutto ai lavoratori qualificati (&lt;span class=&quot;term-en&quot;&gt;selective admission&lt;/span&gt;: ammissione selettiva, es. visti a punti o «blue card»). Per i paesi d&#x27;origine può voler dire &lt;span class=&quot;term-en&quot;&gt;brain drain&lt;/span&gt; (fuga dei cervelli); se le persone tornano o trasferiscono conoscenze, &lt;span class=&quot;term-en&quot;&gt;brain gain&lt;/span&gt; o &lt;span class=&quot;term-en&quot;&gt;brain circulation&lt;/span&gt;. &lt;span class=&quot;src extra&quot;&gt;Oltre le slide&lt;/span&gt;&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Public debates: integration, national security, national identity&lt;/summary&gt;&lt;p&gt;La migrazione è politicamente sensibile: il dibattito pubblico si concentra su integrazione, sicurezza e identità nazionale e mette in secondo piano lo sviluppo.&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;«Explotion» (esplosione) dei migrant workers&lt;/summary&gt;&lt;p&gt;Forte aumento dei lavoratori migranti: il tema diventa troppo grande per restare in un capitolo marginale delle politiche. (Nella slide il termine è scritto «Explotion».)&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Migration often seen as a failure of development&lt;/summary&gt;&lt;p&gt;È il punto chiave e torna nella critica della sezione 4. Se lo sviluppo «funziona», si pensa, le persone restano a casa: chi parte è il segno che lo sviluppo è fallito. Da qui le politiche di &lt;em&gt;aiutarli a casa loro&lt;/em&gt; per «fermare» i flussi.&lt;/p&gt;&lt;/details&gt;

  &lt;h3&gt;Lo sviluppo ferma davvero la migrazione? &lt;span class=&quot;src extra&quot;&gt;Oltre le slide&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;La letteratura sulla migrazione ha mostrato un fatto controintuitivo, noto come &lt;span class=&quot;term-en&quot;&gt;migration hump&lt;/span&gt; (la «gobba» migratoria): nei paesi più poveri l&#x27;emigrazione &lt;em&gt;cresce&lt;/em&gt; mentre il reddito sale, perché le persone acquistano le risorse per partire; cala solo a livelli di reddito medio-alti. Muovi il cursore: la curva è stilizzata e serve a far capire l&#x27;idea, non a dare dati reali.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;label for=&quot;hump&quot; class=&quot;small&quot;&gt;Livello di sviluppo del paese d&#x27;origine (reddito pro capite, scala qualitativa)&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;hump&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;20&quot;&gt;
    &lt;svg id=&quot;humpsvg&quot; viewBox=&quot;0 0 600 240&quot; aria-label=&quot;Grafico migration hump&quot;&gt;
      &lt;line x1=&quot;50&quot; y1=&quot;200&quot; x2=&quot;580&quot; y2=&quot;200&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;20&quot; x2=&quot;50&quot; y2=&quot;200&quot; stroke=&quot;var(--ink2)&quot;/&gt;
      &lt;text x=&quot;580&quot; y=&quot;225&quot; text-anchor=&quot;end&quot; font-size=&quot;12&quot;&gt;reddito pro capite →&lt;/text&gt;
      &lt;text x=&quot;14&quot; y=&quot;110&quot; font-size=&quot;12&quot; transform=&quot;rotate(-90 14 110)&quot; text-anchor=&quot;middle&quot;&gt;emigrazione →&lt;/text&gt;
      &lt;path id=&quot;humppath&quot; fill=&quot;none&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;circle id=&quot;humpdot&quot; r=&quot;8&quot; fill=&quot;var(--accent)&quot;/&gt;
    &lt;/svg&gt;
    &lt;p id=&quot;humptext&quot; class=&quot;readout&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;Conseguenza: se l&#x27;obiettivo dichiarato dell&#x27;aiuto allo sviluppo è &lt;em&gt;fermare&lt;/em&gt; la migrazione, rischia di ottenere il contrario nel breve periodo. Chiedersi se la migrazione sia un «fallimento dello sviluppo» è quindi la domanda sbagliata.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 2&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa vuol dire che «storicamente non c&#x27;è stato mainstreaming»?&lt;/summary&gt;&lt;p&gt;Che migrazione e sviluppo erano trattati in politiche separate: le politiche di sviluppo ignoravano la mobilità e le politiche migratorie ignoravano gli effetti sullo sviluppo.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Cita almeno quattro fattori che, secondo le slide, hanno ostacolato il collegamento.&lt;/summary&gt;&lt;p&gt;Interessi diversi dei paesi; economic concerns; processi demografici; domanda di migrazione qualificata (selective admission); dibattiti pubblici su integrazione, sicurezza e identità; forte aumento dei migrant workers; migrazione vista come fallimento dello sviluppo.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché «migration as a failure of development» è una visione discutibile?&lt;/summary&gt;&lt;p&gt;Perché la migrazione può essere essa stessa una strategia di sviluppo (rimesse, competenze, reti) e perché lo sviluppo iniziale tende ad &lt;em&gt;aumentare&lt;/em&gt; la mobilità (migration hump), non a ridurla.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;sdg&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot; style=&quot;color:var(--slate)&quot;&gt;Migration &amp;amp; SDGs&lt;/div&gt;&lt;h2&gt;La migrazione nell&#x27;Agenda 2030&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;box def&quot;&gt;&lt;b class=&quot;term&quot;&gt;SDGs – Sustainable Development Goals&lt;/b&gt;: i 17 obiettivi di sviluppo sostenibile, con 169 &lt;span class=&quot;term-en&quot;&gt;targets&lt;/span&gt; (traguardi specifici) e un insieme di &lt;span class=&quot;term-en&quot;&gt;indicators&lt;/span&gt; (gli indicatori statistici che misurano i progressi). Sono il cuore dell&#x27;&lt;b&gt;Agenda 2030&lt;/b&gt;, adottata dall&#x27;Assemblea Generale ONU il 25 settembre 2015 (risoluzione A/RES/70/1) &lt;span class=&quot;src web&quot;&gt;Fonte esterna&lt;/span&gt;. Hanno preso il posto dei &lt;b&gt;Millennium Development Goals&lt;/b&gt; (MDGs, 2000–2015: 8 obiettivi pensati soprattutto per i paesi poveri).&lt;/div&gt;

  &lt;h3&gt;Una linea del tempo&lt;/h3&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 800 150&quot; role=&quot;img&quot; aria-label=&quot;Linea del tempo MDGs, SDGs, Global Compact&quot;&gt;

    &lt;line x1=&quot;80&quot; y1=&quot;70&quot; x2=&quot;420&quot; y2=&quot;70&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;6&quot;/&gt;
    &lt;line x1=&quot;420&quot; y1=&quot;70&quot; x2=&quot;760&quot; y2=&quot;70&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;6&quot;/&gt;
    &lt;g font-size=&quot;13&quot;&gt;
    &lt;circle cx=&quot;80&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;2000&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;Millennium Goals&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;117&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;8 obiettivi, migrazione quasi assente&lt;/text&gt;

    &lt;circle cx=&quot;420&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;420&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;2015&lt;/text&gt;&lt;text x=&quot;420&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;Agenda 2030 / SDGs&lt;/text&gt;&lt;text x=&quot;420&quot; y=&quot;117&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;Target 10.7 + 7 riferimenti&lt;/text&gt;
    &lt;circle cx=&quot;530&quot; cy=&quot;70&quot; r=&quot;7&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;530&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;2018&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;Global Compact&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;117&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;for Migration (GCM)&lt;/text&gt;
    &lt;circle cx=&quot;760&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;760&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;2030&lt;/text&gt;&lt;text x=&quot;745&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;scadenza&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Date MDGs, Agenda 2030 e GCM: &lt;span class=&quot;src web&quot;&gt;Fonte esterna&lt;/span&gt; (vedi «Per approfondire»). Il GCM non è nelle slide: il portale lo cita come «framework» insieme agli SDGs.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Il contesto in cui è nata l&#x27;Agenda 2030 &lt;span class=&quot;src slide&quot;&gt;Slide 7–8&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Aid architecture&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;North/South&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Financial crisis&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;New actors&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Relatively stable aid architecture.&lt;/b&gt; L&#x27;&lt;span class=&quot;term-en&quot;&gt;aid architecture&lt;/span&gt; è l&#x27;insieme di donatori, agenzie, regole e canali dell&#x27;aiuto allo sviluppo. Era relativamente stabile: donatori tradizionali (OCSE), agenzie ONU, banche multilaterali.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Clear cut North/South.&lt;/b&gt; Il mondo era ancora letto con una divisione netta tra un «Nord» donatore e sviluppato e un «Sud» ricevente e da sviluppare. È proprio questa lente che la critica della sezione 4 ritrova nel modo in cui gli SDGs pensano la migrazione (un flusso Sud → Nord).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Financial crisis (global).&lt;/b&gt; La crisi del 2008 aveva ridotto i bilanci per l&#x27;aiuto e reso evidente l&#x27;interdipendenza globale: problemi nati nel Nord colpivano tutto il mondo.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;New actors at the negotiation table:&lt;/b&gt; Cina, Sudafrica, India e le ONG. Le economie emergenti e la società civile hanno partecipato alla stesura, a differenza degli MDGs, scritti in gran parte da un ristretto gruppo di esperti. Ne è uscita un&#x27;agenda &lt;em&gt;universale&lt;/em&gt;, che vale per tutti i paesi e non solo per quelli poveri.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box tint&quot;&gt;&lt;b&gt;Il punto chiave:&lt;/b&gt; l&#x27;Agenda 2030 dà &lt;b&gt;più attenzione alla migrazione&lt;/b&gt; rispetto ai Millennium Goals, dove era quasi assente. Le slide contano &lt;b&gt;7 riferimenti specifici&lt;/b&gt; a migrazione e migranti.&lt;/div&gt;

  &lt;h3&gt;Target 10.7: il riferimento centrale&lt;/h3&gt;
  &lt;div class=&quot;box def&quot; style=&quot;font-family:var(--serif);font-size:1.15rem&quot;&gt;«Facilitate orderly, safe, regular and responsible migration and mobility of people, including through the implementation of planned and well-managed migration policies.»&lt;div class=&quot;small&quot; style=&quot;font-family:var(--sans)&quot;&gt;Target 10.7, dentro il &lt;b&gt;Goal 10 – Reduce inequality within and among countries&lt;/b&gt; &lt;span class=&quot;src slide&quot;&gt;Slide 8&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Conta &lt;em&gt;dove&lt;/em&gt; si trova: la migrazione è collocata nell&#x27;obiettivo sulle &lt;b&gt;disuguaglianze&lt;/b&gt;, e questo prepara il finale della lezione (sezione 5). L&#x27;indicatore 10.7.2 misura la quota di paesi con politiche migratorie «well-managed» e si basa sul Migration Governance Framework dell&#x27;OIM, articolato in sei ambiti &lt;span class=&quot;src web&quot;&gt;Fonte esterna&lt;/span&gt;.&lt;/p&gt;

  &lt;h3&gt;Esplora la ruota: dove sono i migranti negli SDGs?&lt;/h3&gt;
  &lt;p class=&quot;small&quot;&gt;I goal evidenziati hanno target con un collegamento diretto alla migrazione (slide 8); il Goal 3 è l&#x27;esempio di tema trasversale della slide 9. Clicca un settore.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;svg id=&quot;wheel&quot; viewBox=&quot;-160 -160 320 320&quot; role=&quot;img&quot; aria-label=&quot;Ruota dei 17 SDGs&quot;&gt;&lt;/svg&gt;
    &lt;div id=&quot;sdgpanel&quot; class=&quot;box&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Un esempio di tema trasversale: SDG 3 &lt;span class=&quot;src slide&quot;&gt;Slide 5, 9&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Il &lt;b&gt;Migration Data Portal&lt;/b&gt; (OIM) presenta la migrazione come un &lt;span class=&quot;term-en&quot;&gt;cross-cutting issue&lt;/span&gt;, cioè un tema trasversale &lt;b&gt;rilevante per tutti i 17 goal&lt;/b&gt;, anche quelli che non la nominano. L&#x27;esempio della slide è il Goal 3, &lt;em&gt;Good Health and Well-being&lt;/em&gt; («Ensure healthy lives and promote well-being for all»): il video del portale ricorda che i &lt;b&gt;sistemi sanitari nazionali di tutto il mondo si reggono sui migranti&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Migranti come risorsa&lt;/b&gt;&lt;br&gt;Medici, infermieri e lavoratori della cura sono spesso migranti: senza di loro molti sistemi sanitari non reggerebbero.&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Migranti come utenti vulnerabili&lt;/b&gt;&lt;br&gt;Accesso ai servizi, barriere linguistiche e legali, salute durante il viaggio: «for all» significa anche per loro.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il costo delle rimesse (Target 10.c)&lt;/h3&gt;
  &lt;p&gt;Il Target 10.c chiede di portare il costo medio delle rimesse &lt;b&gt;sotto il 3%&lt;/b&gt; ed eliminare i «corridoi» (le rotte paese-paese) che costano più del 5% &lt;span class=&quot;src web&quot;&gt;Fonte esterna&lt;/span&gt;. Prova a vedere quanto pesa la differenza:&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;label class=&quot;small&quot; for=&quot;rAmt&quot;&gt;Somma inviata ogni mese: &lt;b id=&quot;rAmtV&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rAmt&quot; min=&quot;50&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;200&quot;&gt;
    &lt;label class=&quot;small&quot; for=&quot;rCost&quot;&gt;Costo della transazione: &lt;b id=&quot;rCostV&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rCost&quot; min=&quot;1&quot; max=&quot;15&quot; step=&quot;0.5&quot; value=&quot;7&quot;&gt;
    &lt;svg viewBox=&quot;0 0 600 120&quot; aria-label=&quot;Confronto costi annui&quot;&gt;
      &lt;text x=&quot;0&quot; y=&quot;30&quot; font-size=&quot;13&quot;&gt;costo attuale&lt;/text&gt;&lt;rect id=&quot;barNow&quot; x=&quot;120&quot; y=&quot;15&quot; height=&quot;22&quot; fill=&quot;var(--brick)&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;75&quot; font-size=&quot;13&quot;&gt;al 3% (target)&lt;/text&gt;&lt;rect id=&quot;barT&quot; x=&quot;120&quot; y=&quot;60&quot; height=&quot;22&quot; fill=&quot;var(--sage)&quot;/&gt;
      &lt;text id=&quot;tNow&quot; y=&quot;31&quot; font-size=&quot;13&quot;&gt;&lt;/text&gt;&lt;text id=&quot;tT&quot; y=&quot;76&quot; font-size=&quot;13&quot;&gt;&lt;/text&gt;
    &lt;/svg&gt;
    &lt;p class=&quot;readout&quot; id=&quot;rOut&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 3&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;In quale Goal si trova il Target 10.7 e perché conta?&lt;/summary&gt;&lt;p&gt;Nel Goal 10, «Reduce inequality within and among countries». La migrazione viene così letta come uno strumento legato alle disuguaglianze (tra e dentro i paesi) e da governare con politiche pianificate.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Elenca quattro elementi del contesto politico-economico in cui nasce l&#x27;Agenda 2030.&lt;/summary&gt;&lt;p&gt;Aid architecture relativamente stabile; divisione netta North/South; crisi finanziaria globale; nuovi attori al tavolo (Cina, Sudafrica, India, ONG).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Associa: tratta di esseri umani, rimesse, dati migratori, mobilità studentesca.&lt;/summary&gt;&lt;p&gt;Trafficking → 5.2, 8.7, 16.2 · Remittances → 10.c · Migration data → 17.18 · International student mobility → 4.b.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa vuol dire che la migrazione è un «cross-cutting issue»?&lt;/summary&gt;&lt;p&gt;Che riguarda tutti i goal, anche quelli che non la citano: l&#x27;esempio è l&#x27;SDG 3, dove i migranti sono sia lavoratori essenziali dei sistemi sanitari sia persone con bisogni specifici di salute.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part brick&quot; id=&quot;critica&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot; style=&quot;color:var(--brick)&quot;&gt;A critical perspective&lt;/div&gt;&lt;h2&gt;Ripensare la migrazione nell&#x27;Agenda 2030&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 10–13&lt;/span&gt; Il riferimento è G. Nijenhuis &amp;amp; M. Leung (2017), &lt;em&gt;«Rethinking migration in the 2030 Agenda: Towards a De-Territorialized Conceptualization of Development»&lt;/em&gt;, uscito su &lt;em&gt;Forum for Development Studies&lt;/em&gt; &lt;span class=&quot;src web&quot;&gt;Fonte esterna&lt;/span&gt;. La loro tesi: gli SDGs danno più spazio alla migrazione, ma &lt;b&gt;non cambiano la visione di fondo&lt;/b&gt;, cioè uno sviluppo legato a un luogo, con la mobilità vista come anomalia.&lt;/p&gt;
  &lt;div class=&quot;box def&quot;&gt;&lt;b class=&quot;term&quot;&gt;De-territorialization&lt;/b&gt; — staccare un processo da un territorio definito. Uno sviluppo «de-territorializzato» non si misura solo in un villaggio o in un paese, ma lungo le reti che collegano luoghi diversi (famiglie divise tra due paesi, rimesse, ritorni, conoscenze che circolano).&lt;/div&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Critica 1&lt;/div&gt;&lt;h3 style=&quot;margin-top:.2em&quot;&gt;Migration as a binary and linear process&lt;/h3&gt;
      &lt;p&gt;Gli SDGs vedono ancora la migrazione come un processo &lt;b&gt;binario&lt;/b&gt; (origine/destinazione) e &lt;b&gt;lineare&lt;/b&gt;: un flusso &lt;em&gt;a senso unico&lt;/em&gt; dal Global South verso i paesi più ricchi, &lt;em&gt;permanente&lt;/em&gt;.&lt;/p&gt;
      &lt;p&gt;Non è realistico, perché i flussi sono &lt;b&gt;diversi&lt;/b&gt; (anche Sud–Sud, Nord–Sud), sempre più &lt;b&gt;circolari&lt;/b&gt; e spesso con più paesi di destinazione. In più gli SDGs guardano soprattutto alla migrazione internazionale, mentre quella &lt;b&gt;interna&lt;/b&gt; riguarda circa il &lt;b&gt;75% dei migranti&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Critica 2&lt;/div&gt;&lt;h3 style=&quot;margin-top:.2em&quot;&gt;Poverty and development seen as territorialized processes&lt;/h3&gt;
      &lt;p&gt;Lo sviluppo è trattato come un fenomeno &lt;b&gt;territorializzato&lt;/b&gt;. Lo mostrano gli &lt;b&gt;indicatori&lt;/b&gt;: misurano i cambiamenti in &lt;em&gt;un singolo luogo&lt;/em&gt; (villaggio, città, paese).&lt;/p&gt;
      &lt;p&gt;Ne seguono due rischi: mobilità e migrazione vengono lette come &lt;b&gt;mancanza di sviluppo&lt;/b&gt; in quel luogo, e si adotta un &lt;span class=&quot;term-en&quot;&gt;sedentary approach&lt;/span&gt; (approccio «sedentario», che considera normale restare fermi) che trascura il &lt;span class=&quot;term-en&quot;&gt;translocal&lt;/span&gt; character dello sviluppo, cioè il fatto che avviene &lt;em&gt;tra&lt;/em&gt; luoghi collegati.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Critica 3&lt;/div&gt;&lt;h3 style=&quot;margin-top:.2em&quot;&gt;Development as a process that happens «at home»&lt;/h3&gt;
      &lt;p&gt;L&#x27;idea che lo sviluppo avvenga «a casa» &lt;b&gt;ignora le dinamiche transnazionali e complesse&lt;/b&gt; dello sviluppo (diaspore, rimesse, catene globali del valore).&lt;/p&gt;
      &lt;p&gt;Parlare di &lt;span class=&quot;term-en&quot;&gt;global interdependency&lt;/span&gt; senza cambiare questa visione rischia di &lt;b&gt;mantenere lo status quo&lt;/b&gt;, senza mettere in discussione i &lt;b&gt;rapporti di potere tradizionali&lt;/b&gt; tra Nord e Sud. È la frase politica &lt;em&gt;«aiutiamoli a casa loro»&lt;/em&gt; tradotta in indicatori.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Due modi di vedere la stessa mobilità&lt;/h3&gt;
  &lt;div&gt;&lt;button class=&quot;btn on&quot; id=&quot;vLin&quot;&gt;Visione SDGs: lineare&lt;/button&gt; &lt;button class=&quot;btn&quot; id=&quot;vNet&quot;&gt;Visione critica: rete translocale&lt;/button&gt;&lt;/div&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 700 260&quot; role=&quot;img&quot; aria-label=&quot;Confronto visione lineare e rete translocale&quot;&gt;

      &lt;circle cx=&quot;580&quot; cy=&quot;130&quot; r=&quot;48&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;580&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Paese ricco&lt;/text&gt;&lt;text x=&quot;580&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;destinazione&lt;/text&gt;
      &lt;path d=&quot;M175 130 L520 130&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;4&quot; marker-end=&quot;url(#ar)&quot;/&gt;

    &lt;/g&gt;

      &lt;/g&gt;
      &lt;circle cx=&quot;100&quot; cy=&quot;85&quot; r=&quot;30&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;100&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot;&gt;villaggio&lt;/text&gt;
      &lt;circle cx=&quot;180&quot; cy=&quot;210&quot; r=&quot;30&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;214&quot; text-anchor=&quot;middle&quot;&gt;città&lt;/text&gt;
      &lt;circle cx=&quot;350&quot; cy=&quot;150&quot; r=&quot;30&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;154&quot; text-anchor=&quot;middle&quot;&gt;paese vicino&lt;/text&gt;
      &lt;circle cx=&quot;570&quot; cy=&quot;70&quot; r=&quot;30&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot;&gt;paese A&lt;/text&gt;
      &lt;circle cx=&quot;550&quot; cy=&quot;185&quot; r=&quot;30&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;550&quot; y=&quot;189&quot; text-anchor=&quot;middle&quot;&gt;paese B&lt;/text&gt;
      &lt;text x=&quot;350&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;rimesse, idee, ritorni&lt;/text&gt;
      &lt;text x=&quot;350&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;migrazione interna, circolare, multi-destinazione: lo sviluppo è translocale&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 220 220&quot; role=&quot;img&quot; aria-label=&quot;Migranti interni 75%, internazionali 25%&quot;&gt;
      &lt;circle cx=&quot;110&quot; cy=&quot;110&quot; r=&quot;80&quot; fill=&quot;none&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;34&quot;/&gt;
      &lt;circle cx=&quot;110&quot; cy=&quot;110&quot; r=&quot;80&quot; fill=&quot;none&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;34&quot; stroke-dasharray=&quot;376.99 502.65&quot; transform=&quot;rotate(-90 110 110)&quot;/&gt;
      &lt;text x=&quot;110&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;34&quot; font-weight=&quot;600&quot;&gt;75%&lt;/text&gt;
      &lt;text x=&quot;110&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;migranti interni&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Dato delle slide (slide 11): circa il 75% dei migranti si sposta dentro il proprio paese (mattone); il 25% sono migranti internazionali (ardesia).&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;table class=&quot;cmp&quot;&gt;
      &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Visione territorializzata&lt;/th&gt;&lt;th&gt;Visione de-territorializzata&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Migrazione&lt;/td&gt;&lt;td&gt;binaria, lineare, permanente&lt;/td&gt;&lt;td&gt;circolare, multipla, anche interna&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Sviluppo&lt;/td&gt;&lt;td&gt;in un luogo, «at home»&lt;/td&gt;&lt;td&gt;translocale e transnazionale&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Indicatori&lt;/td&gt;&lt;td&gt;cambiamenti in un solo posto&lt;/td&gt;&lt;td&gt;flussi e legami tra posti&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Migrare è…&lt;/td&gt;&lt;td&gt;sintomo di mancato sviluppo&lt;/td&gt;&lt;td&gt;parte del processo di sviluppo&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Potere&lt;/td&gt;&lt;td&gt;status quo Nord/Sud&lt;/td&gt;&lt;td&gt;rimette in discussione i rapporti&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 4&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono le tre critiche di Nijenhuis &amp;amp; Leung?&lt;/summary&gt;&lt;p&gt;(1) Migrazione vista come processo binario e lineare; (2) povertà e sviluppo visti come processi territorializzati; (3) sviluppo come processo che avviene «at home».&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché gli indicatori SDG rafforzano un «sedentary approach»?&lt;/summary&gt;&lt;p&gt;Perché misurano i cambiamenti in un singolo luogo: chi se ne va scompare dalla misura e la sua partenza sembra un segno di sottosviluppo, mentre rimesse e legami translocali non vengono contati.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché la visione lineare non è realistica? Dai tre motivi delle slide.&lt;/summary&gt;&lt;p&gt;Flussi migratori diversificati, circolarità crescente, destinazione non limitata a un solo paese. In più conta molto la migrazione interna (75% dei migranti).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che rischio politico vedono gli autori nell&#x27;idea di sviluppo «at home»?&lt;/summary&gt;&lt;p&gt;Che parlare di interdipendenza globale mantenga lo status quo, senza toccare i rapporti di potere tradizionali tra paesi ricchi e poveri.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part terra&quot; id=&quot;ineq&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Implications of inequalities&lt;/div&gt;&lt;h2&gt;Perché un mondo più equo?&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 14–17&lt;/span&gt; La seconda parte della lezione ruota attorno a un video (&lt;em&gt;suggerito, &lt;b&gt;non obbligatorio&lt;/b&gt; per l&#x27;esame&lt;/em&gt;) e a tre temi: le implicazioni delle disuguaglianze (conseguenze economiche, democrazia), cosa si può fare a livello locale e l&#x27;&lt;span class=&quot;term-en&quot;&gt;intersectionality&lt;/span&gt;.&lt;/p&gt;

  &lt;h3&gt;Ripasso dei concetti &lt;span class=&quot;src slide&quot;&gt;Slide 17&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Income inequality&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Poverty (poverties)&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Social mobility&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Status&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Disuguaglianza di reddito&lt;/b&gt;: quanto è distribuito in modo diseguale il reddito in una popolazione. Si misura spesso con la &lt;b&gt;curva di Lorenz&lt;/b&gt; e con l&#x27;&lt;b&gt;indice di Gini&lt;/b&gt; (grafico sotto). &lt;span class=&quot;src extra&quot;&gt;Oltre le slide&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Le slide scrivono &lt;em&gt;poverties&lt;/em&gt; al plurale, perché ne esistono diverse forme: &lt;b&gt;assoluta&lt;/b&gt; (sotto una soglia fissa di sopravvivenza, es. la linea internazionale della Banca Mondiale), &lt;b&gt;relativa&lt;/b&gt; (molto sotto il tenore di vita medio della propria società, es. sotto il 60% del reddito mediano), &lt;b&gt;multidimensionale&lt;/b&gt; (mancanze in salute, istruzione, abitazione, non solo nel reddito). &lt;span class=&quot;src extra&quot;&gt;Oltre le slide&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Mobilità sociale&lt;/b&gt;: la possibilità di cambiare posizione nella scala sociale, tra generazioni (figli rispetto ai genitori) o nel corso della vita. Dove la disuguaglianza è alta, di solito la mobilità è bassa: i «gradini» sono più distanti. &lt;span class=&quot;src extra&quot;&gt;Oltre le slide&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Status&lt;/b&gt;: la posizione relativa e il riconoscimento sociale. Le slide sottolineano le &lt;b&gt;conseguenze sulla self-perception&lt;/b&gt;: in società molto diseguali il confronto continuo con chi sta sopra genera ansia da status, vergogna e minore autostima.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Curva di Lorenz e indice di Gini &lt;span class=&quot;src extra&quot;&gt;Oltre le slide&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;La curva di Lorenz mette sull&#x27;asse orizzontale la quota cumulata di popolazione (dai più poveri ai più ricchi) e su quello verticale la quota cumulata di reddito. Con uguaglianza perfetta la curva è la diagonale. Il Gini è il rapporto tra l&#x27;area A (fra diagonale e curva) e l&#x27;intera area sotto la diagonale:&lt;/p&gt;
  &lt;p class=&quot;readout&quot; style=&quot;text-align:center&quot;&gt;G = A / (A + B) &amp;nbsp;·&amp;nbsp; 0 = tutti uguali, 1 = uno ha tutto&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;label class=&quot;small&quot; for=&quot;lor&quot;&gt;Concentrazione del reddito&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lor&quot; min=&quot;1&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;2.5&quot;&gt;
    &lt;svg viewBox=&quot;0 0 340 300&quot; aria-label=&quot;Curva di Lorenz interattiva&quot;&gt;
      &lt;rect x=&quot;40&quot; y=&quot;10&quot; width=&quot;260&quot; height=&quot;260&quot; fill=&quot;none&quot; stroke=&quot;var(--rule)&quot;/&gt;
      &lt;path id=&quot;lorA&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;none&quot;/&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;270&quot; x2=&quot;300&quot; y2=&quot;10&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
      &lt;path id=&quot;lorC&quot; fill=&quot;none&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;text x=&quot;170&quot; y=&quot;292&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;% cumulata popolazione →&lt;/text&gt;
      &lt;text x=&quot;16&quot; y=&quot;140&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 16 140)&quot;&gt;% cumulata reddito →&lt;/text&gt;
      &lt;text id=&quot;lorLab&quot; x=&quot;200&quot; y=&quot;150&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;240&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;B&lt;/text&gt;
    &lt;/svg&gt;
    &lt;p class=&quot;readout&quot; id=&quot;lorOut&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;Nel modello L(p) = p&lt;sup&gt;k&lt;/sup&gt; il Gini vale (k−1)/(k+1). Riferimento indicativo: i paesi nordici stanno intorno a 0,25–0,30, i paesi più diseguali sopra 0,50.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le implicazioni delle disuguaglianze &lt;span class=&quot;src slide&quot;&gt;Slide 15, 17&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Per l&#x27;economia&lt;/b&gt;&lt;br&gt;Meno domanda interna, talenti sprecati (chi nasce povero non può investire nell&#x27;istruzione), crescita meno stabile.&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Per la salute mentale e il benessere&lt;/b&gt;&lt;br&gt;Stress da status, ansia, minore fiducia negli altri e meno coesione sociale.&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Per il potere&lt;/b&gt;&lt;br&gt;Rafforzano le &lt;span class=&quot;term-en&quot;&gt;dominance dynamics&lt;/span&gt; (dinamiche di dominio), anche &lt;em&gt;a livello globale&lt;/em&gt;, e mettono sotto pressione la &lt;b&gt;democrazia&lt;/b&gt;: chi ha più risorse ha più influenza politica.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;Il nesso disuguaglianza–salute–fiducia è al centro del lavoro di Wilkinson &amp;amp; Pickett, &lt;em&gt;The Spirit Level&lt;/em&gt; (2009): non è citato nelle slide, vedi «Per approfondire». &lt;span class=&quot;src web&quot;&gt;Fonte esterna&lt;/span&gt;&lt;/p&gt;

  &lt;h3&gt;Intersectionality &lt;span class=&quot;src slide&quot;&gt;Slide 15&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;term-en&quot;&gt;Intersectionality&lt;/span&gt; (intersezionalità): gli svantaggi non si sommano soltanto, si &lt;b&gt;intrecciano&lt;/b&gt;. Chi è povero, appartiene a una minoranza, vive in un quartiere periferico ed è esposto all&#x27;inquinamento vive una condizione diversa dalla somma delle singole parti. Questo collega le disuguaglianze alla giustizia ambientale e alla migrazione delle lezioni precedenti.&lt;/p&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 420 300&quot; role=&quot;img&quot; aria-label=&quot;Diagramma di intersezionalità&quot;&gt;
    &lt;g fill-opacity=&quot;.35&quot; stroke-width=&quot;1.5&quot;&gt;
      &lt;circle cx=&quot;160&quot; cy=&quot;115&quot; r=&quot;78&quot; fill=&quot;var(--accent)&quot; stroke=&quot;var(--accent)&quot;/&gt;
      &lt;circle cx=&quot;260&quot; cy=&quot;115&quot; r=&quot;78&quot; fill=&quot;var(--slate)&quot; stroke=&quot;var(--slate)&quot;/&gt;
      &lt;circle cx=&quot;160&quot; cy=&quot;195&quot; r=&quot;78&quot; fill=&quot;var(--sage)&quot; stroke=&quot;var(--sage)&quot;/&gt;
      &lt;circle cx=&quot;260&quot; cy=&quot;195&quot; r=&quot;78&quot; fill=&quot;var(--ochre)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
    &lt;/g&gt;
    &lt;g font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;
      &lt;text x=&quot;120&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;poverty&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;minorities&lt;/text&gt;
      &lt;text x=&quot;112&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot;&gt;place of&lt;/text&gt;&lt;text x=&quot;112&quot; y=&quot;261&quot; text-anchor=&quot;middle&quot;&gt;residence&lt;/text&gt;
      &lt;text x=&quot;308&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot;&gt;pollution&lt;/text&gt;&lt;text x=&quot;308&quot; y=&quot;261&quot; text-anchor=&quot;middle&quot;&gt;exposure&lt;/text&gt;
      &lt;text x=&quot;210&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot;&gt;svantaggio&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot;&gt;cumulato&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 5&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Perché le slide scrivono «poverties» al plurale?&lt;/summary&gt;&lt;p&gt;Perché la povertà ha più forme: assoluta, relativa, multidimensionale (salute, istruzione, abitazione…), non solo mancanza di reddito.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono le tre implicazioni delle disuguaglianze elencate nei «Main points»?&lt;/summary&gt;&lt;p&gt;Per l&#x27;economia; per la salute mentale e il benessere; il rafforzamento delle dinamiche di dominio, anche a livello globale.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Un paese ha Gini 0,25 e un altro 0,55: quale è più diseguale e come appare la sua curva di Lorenz?&lt;/summary&gt;&lt;p&gt;Quello con 0,55: la sua curva è più lontana dalla diagonale e l&#x27;area A è più grande.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Definisci l&#x27;intersezionalità con un esempio delle slide.&lt;/summary&gt;&lt;p&gt;È l&#x27;intreccio di più assi di svantaggio. Esempio: una famiglia povera, di una minoranza, che vive in una zona esposta all&#x27;inquinamento.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part sage&quot; id=&quot;fare&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot; style=&quot;color:var(--sage)&quot;&gt;What can be done&lt;/div&gt;&lt;h2&gt;Dal locale al globale&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 18&lt;/span&gt; Due livelli di intervento e una domanda aperta.&lt;/p&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 700 230&quot; role=&quot;img&quot; aria-label=&quot;Livelli di intervento: locale e globale&quot;&gt;
    &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;300&quot; height=&quot;190&quot; rx=&quot;14&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
    &lt;text x=&quot;170&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Local actors&lt;/text&gt;
    &lt;text x=&quot;170&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;territorialized experiences&lt;/text&gt;
    &lt;text x=&quot;170&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;comuni, associazioni, scuole,&lt;/text&gt;
    &lt;text x=&quot;170&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;diaspore, imprese sociali&lt;/text&gt;
    &lt;rect x=&quot;380&quot; y=&quot;20&quot; width=&quot;300&quot; height=&quot;190&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
    &lt;text x=&quot;530&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Policies and institutions&lt;/text&gt;
    &lt;text x=&quot;530&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;global stakeholders&lt;/text&gt;
    &lt;text x=&quot;530&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;ONU, OIM, governi,&lt;/text&gt;
    &lt;text x=&quot;530&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;Banca Mondiale, accordi globali&lt;/text&gt;
    &lt;path d=&quot;M325 95 L375 95&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M375 135 L325 135&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;rect x=&quot;245&quot; y=&quot;170&quot; width=&quot;210&quot; height=&quot;40&quot; rx=&quot;20&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;195&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Can the SDGs help?&lt;/text&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;h3&gt;Can the SDGs help? Pro e contro &lt;span class=&quot;src extra&quot;&gt;Oltre le slide&lt;/span&gt;&lt;/h3&gt;
  &lt;p class=&quot;small&quot;&gt;La slide lascia la domanda aperta. Ecco gli argomenti che emergono dalla lezione stessa:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;details&gt;&lt;summary&gt;Sì, perché…&lt;/summary&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;danno un &lt;b&gt;linguaggio comune&lt;/b&gt; e obiettivi misurabili a governi, ONG e attori locali;&lt;/li&gt;&lt;li&gt;mettono la migrazione dentro il goal sulle disuguaglianze (10.7) e la rendono trasversale;&lt;/li&gt;&lt;li&gt;chiedono dati disaggregati per &lt;em&gt;migratory status&lt;/em&gt; (17.18): ciò che si misura diventa visibile;&lt;/li&gt;&lt;li&gt;sono universali: valgono anche per i paesi ricchi.&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Con dei limiti, perché…&lt;/summary&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;non sono vincolanti;&lt;/li&gt;&lt;li&gt;i loro indicatori restano territorializzati (critica di Nijenhuis &amp;amp; Leung);&lt;/li&gt;&lt;li&gt;trascurano migrazione interna e circolarità;&lt;/li&gt;&lt;li&gt;rischiano di non toccare i rapporti di potere globali.&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 6&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Quali due livelli di azione indica la slide «What can be done»?&lt;/summary&gt;&lt;p&gt;Gli attori locali (con esperienze territorializzate) e le politiche e istituzioni con gli stakeholder globali.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Domanda d&#x27;esame possibile: «Can the SDGs help reduce inequalities linked to migration?»&lt;/summary&gt;&lt;p&gt;Traccia: sì, come quadro comune (Target 10.7, 10.c, 17.18, natura cross-cutting e universale); ma secondo Nijenhuis &amp;amp; Leung restano una visione lineare e territorializzata, che ignora la migrazione interna e circolare e rischia di mantenere lo status quo. Conclusione: servono indicatori translocali e l&#x27;impegno degli attori locali.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;approfondire&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Per approfondire&lt;/div&gt;
  &lt;h2&gt;Autori, testi, documenti e siti citati&lt;/h2&gt;
  &lt;p class=&quot;small&quot;&gt;Ogni scheda indica che cosa dicono le slide e, separato con il bollino &lt;span class=&quot;src web&quot;&gt;Fonte esterna&lt;/span&gt;, che cosa ho verificato sul web. In fondo, due letture &lt;em&gt;non&lt;/em&gt; citate nelle slide ma utili.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Nijenhuis, G. &amp;amp; Leung, M. W. H. (2017). «Rethinking Migration in the 2030 Agenda: Towards a De-Territorialized Conceptualization of Development»&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 10&lt;/span&gt; Testo di riferimento della «critical perspective».&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;Fonte esterna&lt;/span&gt; Articolo in &lt;em&gt;Forum for Development Studies&lt;/em&gt;, vol. 44, pp. 51–68, DOI 10.1080/08039410.2016.1276958. Confronta come MDGs e SDGs trattano la migrazione e sostiene che l&#x27;Agenda 2030 non supera la visione dello sviluppo legata ai luoghi e continua a leggere la migrazione come processo binario e lineare. Risulta in accesso aperto nel repository dell&#x27;Università di Utrecht.
    &lt;br&gt;&lt;a href=&quot;https://research-portal.uu.nl/en/publications/rethinking-migration-in-the-2030-agenda-towards-a-de-territoriali/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Utrecht University Research Portal&lt;/a&gt; · &lt;a href=&quot;https://doi.org/10.1080/08039410.2016.1276958&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è la fonte delle tre critiche della sezione 4, quindi il cuore teorico della lezione.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Migration Data Portal (OIM – GMDAC)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 5, 9&lt;/span&gt; Portale mostrato a lezione, con la «ruota» degli SDGs e la pagina sull&#x27;SDG 3.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;Fonte esterna&lt;/span&gt; Portale dell&#x27;Organizzazione Internazionale per le Migrazioni con dati, panoramiche tematiche e una sezione SDGs. Indica che almeno 10 dei 17 goal contengono target e indicatori direttamente rilevanti per la migrazione e che la migrazione è trasversale a tutti i 17.
    &lt;br&gt;&lt;a href=&quot;https://www.migrationdataportal.org/sdgs?node=0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sezione SDGs&lt;/a&gt; · &lt;a href=&quot;https://www.migrationdataportal.org/sdgs?node=3&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina SDG 3 (link della slide)&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è lo strumento per vedere goal per goal dove sono i migranti, ed è utile per esercitarsi sulla parte 3.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Agenda 2030 – risoluzione ONU A/RES/70/1 «Transforming our world»&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 7–8&lt;/span&gt; Agenda 2030, SDGs, Target 10.7 e Goal 10.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;Fonte esterna&lt;/span&gt; Adottata senza voto dall&#x27;Assemblea Generale il 25 settembre 2015: definisce obiettivi e target per i 15 anni successivi, come «piano d&#x27;azione per le persone, il pianeta e la prosperità».
    &lt;br&gt;&lt;a href=&quot;https://digitallibrary.un.org/record/3923923&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Digital Library&lt;/a&gt; · &lt;a href=&quot;https://www.un.org/en/development/desa/population/migration/generalassembly/docs/globalcompact/A_RES_70_1_E.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo PDF (un.org)&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è il testo normativo da cui vengono le citazioni dei target (10.7, 10.c, 8.8…).&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Millennium Development Goals (2000–2015)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 7&lt;/span&gt; Il «previous framework», con meno attenzione alla migrazione.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;Fonte esterna&lt;/span&gt; Otto obiettivi con 21 target, adottati al Millennium Summit ONU di settembre 2000 con scadenza 2015: povertà estrema e fame, istruzione primaria, parità di genere, mortalità infantile, salute materna, HIV/malaria, sostenibilità ambientale, partenariato globale. Risultati disomogenei.
    &lt;br&gt;&lt;a href=&quot;https://www.britannica.com/topic/United-Nations-Millennium-Development-Goals&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Encyclopaedia Britannica&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; il confronto MDGs → SDGs è la base per dire che cosa è cambiato sulla migrazione.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Indicatori SDG 10.7.2 e 10.c.1 (metadati ufficiali)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 8, 12&lt;/span&gt; Target 10.7 e 10.c; il ruolo degli indicatori nella critica.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;Fonte esterna&lt;/span&gt; Il 10.7.2 misura la quota di paesi con politiche migratorie che facilitano una migrazione ordinata, sicura e regolare, con il Migration Governance Framework dell&#x27;OIM (sei ambiti). Il 10.c.1 misura il costo delle rimesse sull&#x27;importo inviato: obiettivo sotto il 3% ed eliminazione dei corridoi sopra il 5%, con dati del database Remittance Prices Worldwide della Banca Mondiale.
    &lt;br&gt;&lt;a href=&quot;https://unstats.un.org/sdgs/metadata/files/Metadata-10-07-02.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Metadati 10.7.2 (UN Stats)&lt;/a&gt; · &lt;a href=&quot;https://worldbank.github.io/sdg-metadata/metadata/en/10-c-1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Metadati 10.c.1 (Banca Mondiale)&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; mostra in concreto che cosa misurano gli indicatori criticati da Nijenhuis &amp;amp; Leung.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Global Compact for Safe, Orderly and Regular Migration (2018)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 5&lt;/span&gt; Il portale lo indica fra i «Frameworks» («SDGs and GCM»); la slide non lo spiega.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;Fonte esterna&lt;/span&gt; Adottato a Marrakech il 10–11 dicembre 2018 e approvato dall&#x27;Assemblea Generale il 19 dicembre 2018 (A/RES/73/195; 152 sì, 5 no, 12 astenuti). Contiene 23 obiettivi lungo tutto il ciclo migratorio, non è vincolante ed è complementare al Global Compact on Refugees.
    &lt;br&gt;&lt;a href=&quot;https://digitallibrary.un.org/record/1660537?ln=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Digital Library&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; mette in pratica il Target 10.7: è il primo quadro globale dedicato solo alla migrazione.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Video «Why a more equitable world?»&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 14, 16&lt;/span&gt; Suggerito, non obbligatorio per l&#x27;esame.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;Fonte esterna&lt;/span&gt; Con la ricerca web non sono riuscito a verificare titolo e autore del video, quindi non ne descrivo il contenuto oltre a quanto riportano le slide (slide 15 e 17). Link dalla slide:
    &lt;br&gt;&lt;a href=&quot;https://www.youtube.com/watch?v=pXwJI1d2kNw&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=pXwJI1d2kNw&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è la base della parte sulle disuguaglianze (sezione 5).&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Letture collegate, non citate nelle slide&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IOM – World Migration Report 2024&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;Fonte esterna&lt;/span&gt; Rapporto biennale dell&#x27;OIM. Stima 281 milioni di migranti internazionali nel 2020, circa il 3,6% della popolazione mondiale, e ricorda che la migrazione interna resta più diffusa di quella internazionale.
    &lt;br&gt;&lt;a href=&quot;https://ruralindiaonline.org/en/library/resource/world-migration-report-2024/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda del rapporto (PARI Library)&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; dà gli ordini di grandezza e conferma il peso della migrazione interna.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Wilkinson, R. &amp;amp; Pickett, K. (2009). &lt;em&gt;The Spirit Level: Why More Equal Societies Almost Always Do Better&lt;/em&gt;&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;Fonte esterna&lt;/span&gt; Libro (Allen Lane) secondo cui, per undici problemi sociali e sanitari, i risultati sono peggiori nei paesi ricchi più diseguali. Ha avuto grande diffusione ma anche critiche sul nesso causale; nel 2024 è uscita un&#x27;edizione aggiornata.
    &lt;br&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/The_Spirit_Level_(Wilkinson_and_Pickett_book)&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda Wikipedia&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Perché conta:&lt;/b&gt; approfondisce i «Main points» della slide 17 (status, salute mentale, fiducia).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;
&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/div&gt;&lt;/footer&gt;
