&lt;section class=&quot;part sage&quot; id=&quot;perche&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot; style=&quot;color:var(--sage)&quot;&gt;Migration&lt;/div&gt;&lt;h2&gt;Why do people migrate?&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slides 3–4&lt;/span&gt; The lecture picks up from the previous one (introduction to &lt;span class=&quot;term-en&quot;&gt;migration&lt;/span&gt;, &lt;span class=&quot;term-en&quot;&gt;environmental migration&lt;/span&gt;, &lt;span class=&quot;term-en&quot;&gt;displacement&lt;/span&gt; and &lt;span class=&quot;term-en&quot;&gt;relocation&lt;/span&gt;) and opens with an image of flamingos in flight and a question: &lt;b&gt;Why?&lt;/b&gt; Animals migrate too: they move when conditions where they live (food, water, climate, safety) are no longer sufficient, or when better conditions exist elsewhere.&lt;/p&gt;
  &lt;div class=&quot;box tint small&quot;&gt;&lt;b&gt;Link to the other lectures.&lt;/b&gt; Slide 3 refers back to the previous lecture of Module 2 (migration, environmental migration, displacement and relocation). I was unable to open the other files in the &lt;code&gt;corso/&lt;/code&gt; folder: the tools available in this session cannot list its contents, and the paths I tried to guess did not exist. The definitions below are therefore a general review (&lt;span class=&quot;src extra&quot;&gt;Beyond the slides&lt;/span&gt;), to be checked against the slides of lecture 7.&lt;/div&gt;

  &lt;h3&gt;Push and pull: the basic model &lt;span class=&quot;src extra&quot;&gt;Beyond the slides&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The simplest way to answer the “why” is the &lt;span class=&quot;term-en&quot;&gt;push–pull&lt;/span&gt; model: a person decides to leave when the factors that &lt;em&gt;push&lt;/em&gt; them away from the place of origin and those that &lt;em&gt;pull&lt;/em&gt; them towards a destination outweigh the &lt;em&gt;intervening obstacles&lt;/em&gt; (costs, distance, borders, ties). Try switching category:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Economic&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Environmental&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Political&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Social / demographic&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;Push&lt;/b&gt;: unemployment, low wages, poverty, lack of credit.&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;Pull&lt;/b&gt;: labour demand, higher wages, &lt;span class=&quot;term-en&quot;&gt;remittances&lt;/span&gt; (the money migrants send to their families in the country of origin).&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;Push&lt;/b&gt;: drought, desertification, floods, sea-level rise (previous lecture: &lt;span class=&quot;term-en&quot;&gt;environmental migration&lt;/span&gt;).&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;Pull&lt;/b&gt;: fertile land, cities with services, areas less exposed to risk.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;Push&lt;/b&gt;: conflict, persecution, instability: here one often speaks of &lt;span class=&quot;term-en&quot;&gt;forced displacement&lt;/span&gt;.&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;Pull&lt;/b&gt;: security, rights, institutional stability.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;Push&lt;/b&gt;: demographic pressure, discrimination, poor access to education and healthcare.&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;Pull&lt;/b&gt;: networks of relatives and fellow nationals who have already emigrated, universities, family reunification.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Key terms to get right &lt;span class=&quot;src extra&quot;&gt;Beyond the slides&lt;/span&gt;&lt;/h3&gt;
  &lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;term-en&quot;&gt;International&lt;/span&gt; vs &lt;span class=&quot;term-en&quot;&gt;internal migration&lt;/span&gt;&lt;/span&gt;&lt;/summary&gt;&lt;p&gt;&lt;b&gt;International&lt;/b&gt; migration crosses a state border; &lt;b&gt;internal&lt;/b&gt; migration takes place within a country (e.g. rural → urban). The slides point out that internal migration accounts for about &lt;b&gt;75% of migrants&lt;/b&gt; worldwide (section 4).&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;term-en&quot;&gt;Displacement&lt;/span&gt; and &lt;span class=&quot;term-en&quot;&gt;relocation&lt;/span&gt;&lt;/span&gt;&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Displacement&lt;/b&gt;: forced movement caused by conflict, violence or disasters. &lt;b&gt;Relocation&lt;/b&gt; (or &lt;span class=&quot;term-en&quot;&gt;planned relocation&lt;/span&gt;): the &lt;em&gt;planned&lt;/em&gt; transfer, often organised by the state, of entire communities away from at-risk areas.&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;term-en&quot;&gt;Circular migration&lt;/span&gt;&lt;/span&gt;&lt;/summary&gt;&lt;p&gt;Repeated back-and-forth movements between origin and destination (seasonal work, temporary contracts). It is precisely this &lt;span class=&quot;term-en&quot;&gt;circularity&lt;/span&gt; that, according to the critique in section 4, the SDGs fail to see.&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;term-en&quot;&gt;Regular&lt;/span&gt; / &lt;span class=&quot;term-en&quot;&gt;irregular migration&lt;/span&gt;&lt;/span&gt;&lt;/summary&gt;&lt;p&gt;Regular = through legal channels (visas, permits); irregular = outside those rules. Target 10.7 refers to &lt;em&gt;orderly, safe, regular and responsible&lt;/em&gt; migration.&lt;/p&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 1&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;What are remittances and why do they link migration and development?&lt;/summary&gt;&lt;p&gt;They are the money migrants send to their families in the country of origin. They finance consumption, education, health and small investments: migration thus becomes a channel of development for those who stay, not just a loss.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between displacement and planned relocation?&lt;/summary&gt;&lt;p&gt;Displacement is forced and unplanned (fleeing conflict or disasters); relocation is an organised, planned transfer, usually carried out by the authorities.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In the push–pull model, is a strong push factor enough to make someone leave?&lt;/summary&gt;&lt;p&gt;No: the obstacles (costs, borders, distance) and the resources needed to overcome them also matter. This is why the poorest often &lt;em&gt;cannot&lt;/em&gt; migrate.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part ochre&quot; id=&quot;md&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot; style=&quot;color:var(--ochre)&quot;&gt;Migration and Development&lt;/div&gt;&lt;h2&gt;Two policy fields that did not talk to each other&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 6&lt;/span&gt; Historically there has been &lt;b&gt;no mainstreaming&lt;/b&gt;: migration was absent from development policy, and development was absent from migration policy.&lt;/p&gt;
  &lt;div class=&quot;box def&quot;&gt;&lt;b class=&quot;term&quot;&gt;Mainstreaming&lt;/b&gt; — integrating an issue into &lt;em&gt;all&lt;/em&gt; regular policy areas instead of treating it as a separate chapter. “Mainstreaming migration into development” means that development plans (health, employment, education…) take into account those who leave, those who arrive and those who return.&lt;/div&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 760 210&quot; role=&quot;img&quot; aria-label=&quot;Diagram: two policy silos with no bridge&quot;&gt;
    &lt;rect x=&quot;20&quot; y=&quot;30&quot; width=&quot;250&quot; height=&quot;150&quot; rx=&quot;12&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
    &lt;text x=&quot;145&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Development policy&lt;/text&gt;
    &lt;text x=&quot;145&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;aid, growth, poverty&lt;/text&gt;
    &lt;text x=&quot;145&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;“in the country of origin”&lt;/text&gt;
    &lt;text x=&quot;145&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;foreign affairs / cooperation ministries&lt;/text&gt;
    &lt;rect x=&quot;490&quot; y=&quot;30&quot; width=&quot;250&quot; height=&quot;150&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
    &lt;text x=&quot;615&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Migration policy&lt;/text&gt;
    &lt;text x=&quot;615&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;admission, borders, security&lt;/text&gt;
    &lt;text x=&quot;615&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;“in the destination country”&lt;/text&gt;
    &lt;text x=&quot;615&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;interior ministries&lt;/text&gt;
    &lt;path d=&quot;M280 105 L340 105&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M420 105 L480 105&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;text x=&quot;380&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;26&quot; fill=&quot;var(--brick)&quot;&gt;✕&lt;/text&gt;
    &lt;text x=&quot;380&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--brick)&quot;&gt;no bridge&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;The two policy fields were managed by different institutions with different objectives (interpretive diagram).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Why linking them was so difficult&lt;/h3&gt;
  &lt;p class=&quot;small&quot;&gt;The seven factors from the slides: open each one for an explanation.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;Different country perspectives (different interests)&lt;/summary&gt;&lt;p&gt;Countries of origin see emigration in terms of remittances, return skills and lower unemployment, but also loss of human capital. Destination countries view it in terms of the labour market, welfare costs and border control. A common agreement is difficult because &lt;b&gt;interests diverge&lt;/b&gt;.&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Economic concerns&lt;/summary&gt;&lt;p&gt;Fear of wage competition, effects on public finances, but also the need for labour in certain sectors (agriculture, care work, construction).&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Demographic processes&lt;/summary&gt;&lt;p&gt;Ageing societies with low fertility (Europe, Japan) alongside young, growing populations (sub-Saharan Africa): migration also becomes a demographic issue, linked to pensions and the labour force.&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Growing demand for (highly-)skilled migration: selective admission&lt;/summary&gt;&lt;p&gt;Rich countries open their doors mainly to skilled workers (&lt;span class=&quot;term-en&quot;&gt;selective admission&lt;/span&gt;, e.g. points-based visas or the “Blue Card”). For countries of origin this can mean &lt;span class=&quot;term-en&quot;&gt;brain drain&lt;/span&gt;; if people return or transfer knowledge, &lt;span class=&quot;term-en&quot;&gt;brain gain&lt;/span&gt; or &lt;span class=&quot;term-en&quot;&gt;brain circulation&lt;/span&gt;. &lt;span class=&quot;src extra&quot;&gt;Beyond the slides&lt;/span&gt;&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Public debates: integration, national security, national identity&lt;/summary&gt;&lt;p&gt;Migration is politically sensitive: public debate focuses on integration, security and national identity, pushing development into the background.&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;“Explotion” (explosion) of migrant workers&lt;/summary&gt;&lt;p&gt;A sharp increase in the number of migrant workers: the issue becomes too large to remain a marginal chapter of policy. (The slide spells the term “Explotion”.)&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Migration often seen as a failure of development&lt;/summary&gt;&lt;p&gt;This is the key point, and it returns in the critique in section 4. If development “works”, the reasoning goes, people stay at home: those who leave are a sign that development has failed. Hence the policies of &lt;em&gt;helping them in their own countries&lt;/em&gt; to “stop” the flows.&lt;/p&gt;&lt;/details&gt;

  &lt;h3&gt;Does development really stop migration? &lt;span class=&quot;src extra&quot;&gt;Beyond the slides&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The migration literature has shown a counter-intuitive pattern known as the &lt;span class=&quot;term-en&quot;&gt;migration hump&lt;/span&gt;: in the poorest countries emigration &lt;em&gt;rises&lt;/em&gt; as income increases, because people acquire the resources to leave; it only declines at upper-middle income levels. Move the slider: the curve is stylised and meant to illustrate the idea, not to provide real data.&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;label for=&quot;hump&quot; class=&quot;small&quot;&gt;Level of development of the country of origin (GDP per capita, qualitative scale)&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;hump&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;20&quot;&gt;
    &lt;svg id=&quot;humpsvg&quot; viewBox=&quot;0 0 600 240&quot; aria-label=&quot;Migration hump chart&quot;&gt;
      &lt;line x1=&quot;50&quot; y1=&quot;200&quot; x2=&quot;580&quot; y2=&quot;200&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;20&quot; x2=&quot;50&quot; y2=&quot;200&quot; stroke=&quot;var(--ink2)&quot;/&gt;
      &lt;text x=&quot;580&quot; y=&quot;225&quot; text-anchor=&quot;end&quot; font-size=&quot;12&quot;&gt;income per capita →&lt;/text&gt;
      &lt;text x=&quot;14&quot; y=&quot;110&quot; font-size=&quot;12&quot; transform=&quot;rotate(-90 14 110)&quot; text-anchor=&quot;middle&quot;&gt;emigration →&lt;/text&gt;
      &lt;path id=&quot;humppath&quot; fill=&quot;none&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;circle id=&quot;humpdot&quot; r=&quot;8&quot; fill=&quot;var(--accent)&quot;/&gt;
    &lt;/svg&gt;
    &lt;p id=&quot;humptext&quot; class=&quot;readout&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;The consequence: if the stated aim of development aid is to &lt;em&gt;stop&lt;/em&gt; migration, it risks achieving the opposite in the short term. Asking whether migration is a “failure of development” is therefore the wrong question.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 2&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;What does it mean that “historically there has been no mainstreaming”?&lt;/summary&gt;&lt;p&gt;That migration and development were handled by separate policies: development policies ignored mobility, and migration policies ignored the effects on development.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Name at least four factors that, according to the slides, hindered the link.&lt;/summary&gt;&lt;p&gt;Countries&#x27; different interests; economic concerns; demographic processes; demand for skilled migration (selective admission); public debates on integration, security and identity; the sharp increase in migrant workers; migration seen as a failure of development.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is “migration as a failure of development” a questionable view?&lt;/summary&gt;&lt;p&gt;Because migration can itself be a development strategy (remittances, skills, networks), and because early-stage development tends to &lt;em&gt;increase&lt;/em&gt; mobility (migration hump), not reduce it.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part slate&quot; id=&quot;sdg&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot; style=&quot;color:var(--slate)&quot;&gt;Migration &amp;amp; SDGs&lt;/div&gt;&lt;h2&gt;Migration in the 2030 Agenda&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;box def&quot;&gt;&lt;b class=&quot;term&quot;&gt;SDGs – Sustainable Development Goals&lt;/b&gt;: the 17 goals, with 169 &lt;span class=&quot;term-en&quot;&gt;targets&lt;/span&gt; (specific objectives) and a set of &lt;span class=&quot;term-en&quot;&gt;indicators&lt;/span&gt; (the statistical measures used to track progress). They are the core of the &lt;b&gt;2030 Agenda&lt;/b&gt;, adopted by the UN General Assembly on 25 September 2015 (resolution A/RES/70/1) &lt;span class=&quot;src web&quot;&gt;External source&lt;/span&gt;. They replaced the &lt;b&gt;Millennium Development Goals&lt;/b&gt; (MDGs, 2000–2015: 8 goals designed mainly for poor countries).&lt;/div&gt;

  &lt;h3&gt;A timeline&lt;/h3&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 800 150&quot; role=&quot;img&quot; aria-label=&quot;Timeline of the MDGs, SDGs and Global Compact&quot;&gt;
    &lt;line x1=&quot;30&quot; y1=&quot;70&quot; x2=&quot;780&quot; y2=&quot;70&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;4&quot;/&gt;
    &lt;line x1=&quot;80&quot; y1=&quot;70&quot; x2=&quot;420&quot; y2=&quot;70&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;6&quot;/&gt;
    &lt;line x1=&quot;420&quot; y1=&quot;70&quot; x2=&quot;760&quot; y2=&quot;70&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;6&quot;/&gt;
    &lt;g font-size=&quot;13&quot;&gt;
    &lt;circle cx=&quot;80&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;2000&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;Millennium Goals&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;117&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;8 goals, migration almost absent&lt;/text&gt;
    &lt;circle cx=&quot;300&quot; cy=&quot;70&quot; r=&quot;7&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;2008&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;global financial crisis&lt;/text&gt;
    &lt;circle cx=&quot;420&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;420&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;2015&lt;/text&gt;&lt;text x=&quot;420&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;2030 Agenda / SDGs&lt;/text&gt;&lt;text x=&quot;420&quot; y=&quot;117&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;Target 10.7 + 7 references&lt;/text&gt;
    &lt;circle cx=&quot;530&quot; cy=&quot;70&quot; r=&quot;7&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;530&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;2018&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;Global Compact&lt;/text&gt;&lt;text x=&quot;545&quot; y=&quot;117&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;for Migration (GCM)&lt;/text&gt;
    &lt;circle cx=&quot;760&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;760&quot; y=&quot;45&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;2030&lt;/text&gt;&lt;text x=&quot;745&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;deadline&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Dates of the MDGs, 2030 Agenda and GCM: &lt;span class=&quot;src web&quot;&gt;External source&lt;/span&gt; (see “Further reading”). The GCM is not in the slides: the portal lists it as a “framework” alongside the SDGs.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;The context in which the 2030 Agenda emerged &lt;span class=&quot;src slide&quot;&gt;Slides 7–8&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Aid architecture&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;North/South&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Financial crisis&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;New actors&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Relatively stable aid architecture.&lt;/b&gt; The &lt;span class=&quot;term-en&quot;&gt;aid architecture&lt;/span&gt; is the set of donors, agencies, rules and channels of development aid. It was relatively stable: traditional (OECD) donors, UN agencies, multilateral development banks.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Clear cut North/South.&lt;/b&gt; The world was still read through a sharp divide between a donor, developed “North” and a recipient “South” in need of development. This is precisely the lens that the critique in section 4 finds in the way the SDGs conceive of migration (a South → North flow).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Financial crisis (global).&lt;/b&gt; The 2008 crisis had cut aid budgets and exposed global interdependence: problems originating in the North affected the whole world.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;New actors at the negotiation table:&lt;/b&gt; China, South Africa, India and NGOs. Emerging economies and civil society took part in the drafting, unlike the MDGs, which were largely written by a small group of experts. The result was a &lt;em&gt;universal&lt;/em&gt; agenda, applying to all countries and not only to poor ones.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box tint&quot;&gt;&lt;b&gt;The key point:&lt;/b&gt; the 2030 Agenda gives &lt;b&gt;more attention to migration&lt;/b&gt; than the Millennium Goals, where it was almost absent. The slides count &lt;b&gt;7 specific references&lt;/b&gt; to migration and migrants.&lt;/div&gt;

  &lt;h3&gt;Target 10.7: the central reference&lt;/h3&gt;
  &lt;div class=&quot;box def&quot; style=&quot;font-family:var(--serif);font-size:1.15rem&quot;&gt;“Facilitate orderly, safe, regular and responsible migration and mobility of people, including through the implementation of planned and well-managed migration policies.”&lt;div class=&quot;small&quot; style=&quot;font-family:var(--sans)&quot;&gt;Target 10.7, under &lt;b&gt;Goal 10 – Reduce inequality within and among countries&lt;/b&gt; &lt;span class=&quot;src slide&quot;&gt;Slide 8&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Its &lt;em&gt;placement&lt;/em&gt; matters: migration is located in the goal on &lt;b&gt;inequalities&lt;/b&gt;, which sets up the final part of the lecture (section 5). Indicator 10.7.2 measures the proportion of countries with “well-managed” migration policies and is based on IOM&#x27;s Migration Governance Framework, structured into six domains &lt;span class=&quot;src web&quot;&gt;External source&lt;/span&gt;.&lt;/p&gt;

  &lt;h3&gt;Explore the wheel: where are migrants in the SDGs?&lt;/h3&gt;
  &lt;p class=&quot;small&quot;&gt;The highlighted goals have targets directly linked to migration (slide 8); Goal 3 is the cross-cutting example from slide 9. Click a segment.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;svg id=&quot;wheel&quot; viewBox=&quot;-160 -160 320 320&quot; role=&quot;img&quot; aria-label=&quot;Wheel of the 17 SDGs&quot;&gt;&lt;/svg&gt;
    &lt;div id=&quot;sdgpanel&quot; class=&quot;box&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;An example of a cross-cutting issue: SDG 3 &lt;span class=&quot;src slide&quot;&gt;Slides 5, 9&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The &lt;b&gt;Migration Data Portal&lt;/b&gt; (IOM) presents migration as a &lt;span class=&quot;term-en&quot;&gt;cross-cutting issue&lt;/span&gt;, &lt;b&gt;relevant to all 17 goals&lt;/b&gt;, including those that do not mention it. The example on the slide is Goal 3, &lt;em&gt;Good Health and Well-being&lt;/em&gt; (“Ensure healthy lives and promote well-being for all”): the portal&#x27;s video points out that &lt;b&gt;national health systems around the world rely on migrants&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Migrants as a resource&lt;/b&gt;&lt;br&gt;Doctors, nurses and care workers are often migrants: without them many health systems could not function.&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;b&gt;Migrants as vulnerable users&lt;/b&gt;&lt;br&gt;Access to services, language and legal barriers, health during the journey: “for all” includes them too.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The cost of remittances (Target 10.c)&lt;/h3&gt;
  &lt;p&gt;Target 10.c calls for reducing the average transaction cost of remittances to &lt;b&gt;less than 3%&lt;/b&gt; and eliminating remittance “corridors” (country-to-country routes) with costs higher than 5% &lt;span class=&quot;src web&quot;&gt;External source&lt;/span&gt;. See how much the difference matters:&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;label class=&quot;small&quot; for=&quot;rAmt&quot;&gt;Amount sent each month: &lt;b id=&quot;rAmtV&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rAmt&quot; min=&quot;50&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;200&quot;&gt;
    &lt;label class=&quot;small&quot; for=&quot;rCost&quot;&gt;Transaction cost: &lt;b id=&quot;rCostV&quot;&gt;&lt;/b&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rCost&quot; min=&quot;1&quot; max=&quot;15&quot; step=&quot;0.5&quot; value=&quot;7&quot;&gt;
    &lt;svg viewBox=&quot;0 0 600 120&quot; aria-label=&quot;Comparison of annual costs&quot;&gt;
      &lt;text x=&quot;0&quot; y=&quot;30&quot; font-size=&quot;13&quot;&gt;current cost&lt;/text&gt;&lt;rect id=&quot;barNow&quot; x=&quot;120&quot; y=&quot;15&quot; height=&quot;22&quot; fill=&quot;var(--brick)&quot;/&gt;
      &lt;text x=&quot;0&quot; y=&quot;75&quot; font-size=&quot;13&quot;&gt;at 3% (target)&lt;/text&gt;&lt;rect id=&quot;barT&quot; x=&quot;120&quot; y=&quot;60&quot; height=&quot;22&quot; fill=&quot;var(--sage)&quot;/&gt;
      &lt;text id=&quot;tNow&quot; y=&quot;31&quot; font-size=&quot;13&quot;&gt;&lt;/text&gt;&lt;text id=&quot;tT&quot; y=&quot;76&quot; font-size=&quot;13&quot;&gt;&lt;/text&gt;
    &lt;/svg&gt;
    &lt;p class=&quot;readout&quot; id=&quot;rOut&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 3&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Which Goal contains Target 10.7 and why does it matter?&lt;/summary&gt;&lt;p&gt;Goal 10, “Reduce inequality within and among countries”. Migration is thus framed as an instrument linked to inequalities (between and within countries), to be governed through planned policies.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;List four elements of the political-economic context in which the 2030 Agenda emerged.&lt;/summary&gt;&lt;p&gt;A relatively stable aid architecture; a clear-cut North/South divide; the global financial crisis; new actors at the table (China, South Africa, India, NGOs).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Match: human trafficking, remittances, migration data, student mobility.&lt;/summary&gt;&lt;p&gt;Trafficking → 5.2, 8.7, 16.2 · Remittances → 10.c · Migration data → 17.18 · International student mobility → 4.b.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What does it mean that migration is a “cross-cutting issue”?&lt;/summary&gt;&lt;p&gt;That it concerns all the goals, including those that do not mention it: the example is SDG 3, where migrants are both essential workers in health systems and people with specific health needs.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part brick&quot; id=&quot;critica&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot; style=&quot;color:var(--brick)&quot;&gt;A critical perspective&lt;/div&gt;&lt;h2&gt;Rethinking migration in the 2030 Agenda&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slides 10–13&lt;/span&gt; The reference is G. Nijenhuis &amp;amp; M. Leung (2017), &lt;em&gt;“Rethinking migration in the 2030 Agenda: Towards a De-Territorialized Conceptualization of Development”&lt;/em&gt;, published in &lt;em&gt;Forum for Development Studies&lt;/em&gt; &lt;span class=&quot;src web&quot;&gt;External source&lt;/span&gt;. Their argument: the SDGs give more space to migration but &lt;b&gt;do not change the underlying view&lt;/b&gt;, namely a place-bound conception of development in which mobility is seen as an anomaly.&lt;/p&gt;
  &lt;div class=&quot;box def&quot;&gt;&lt;b class=&quot;term&quot;&gt;De-territorialization&lt;/b&gt; — detaching a process from a defined territory. “De-territorialized” development is not measured only in a single village or country, but along the networks connecting different places (families split between two countries, remittances, returns, circulating knowledge).&lt;/div&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Critique 1&lt;/div&gt;&lt;h3 style=&quot;margin-top:.2em&quot;&gt;Migration as a binary and linear process&lt;/h3&gt;
      &lt;p&gt;The SDGs still view migration as a &lt;b&gt;binary&lt;/b&gt; (origin/destination) and &lt;b&gt;linear&lt;/b&gt; process: a &lt;em&gt;one-way&lt;/em&gt;, &lt;em&gt;permanent&lt;/em&gt; flow from the Global South to richer countries.&lt;/p&gt;
      &lt;p&gt;This is unrealistic, because flows are &lt;b&gt;diverse&lt;/b&gt; (also South–South and North–South), increasingly &lt;b&gt;circular&lt;/b&gt; and often involve multiple destination countries. Moreover, the SDGs focus mainly on international migration, whereas &lt;b&gt;internal&lt;/b&gt; migration accounts for about &lt;b&gt;75% of migrants&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Critique 2&lt;/div&gt;&lt;h3 style=&quot;margin-top:.2em&quot;&gt;Poverty and development seen as territorialized processes&lt;/h3&gt;
      &lt;p&gt;Development is treated as a &lt;b&gt;territorialized&lt;/b&gt; phenomenon. The &lt;b&gt;indicators&lt;/b&gt; show this: they measure change in &lt;em&gt;a single place&lt;/em&gt; (village, city, country).&lt;/p&gt;
      &lt;p&gt;Two risks follow: mobility and migration are read as a &lt;b&gt;lack of development&lt;/b&gt; in that place, and a &lt;span class=&quot;term-en&quot;&gt;sedentary approach&lt;/span&gt; (one that treats staying put as the norm) is adopted, overlooking the &lt;span class=&quot;term-en&quot;&gt;translocal&lt;/span&gt; character of development, i.e. the fact that it takes place &lt;em&gt;between&lt;/em&gt; connected places.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Critique 3&lt;/div&gt;&lt;h3 style=&quot;margin-top:.2em&quot;&gt;Development as a process that happens “at home”&lt;/h3&gt;
      &lt;p&gt;The idea that development happens “at home” &lt;b&gt;ignores the transnational and complex dynamics&lt;/b&gt; of development (diasporas, remittances, global value chains).&lt;/p&gt;
      &lt;p&gt;Talking about &lt;span class=&quot;term-en&quot;&gt;global interdependency&lt;/span&gt; without changing this view risks &lt;b&gt;maintaining the status quo&lt;/b&gt;, without challenging the &lt;b&gt;traditional power relations&lt;/b&gt; between North and South. It is the political slogan &lt;em&gt;“let&#x27;s help them in their own countries”&lt;/em&gt; translated into indicators.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn&quot; data-next&gt;next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Two ways of seeing the same mobility&lt;/h3&gt;
  &lt;div&gt;&lt;button class=&quot;btn on&quot; id=&quot;vLin&quot;&gt;SDG view: linear&lt;/button&gt; &lt;button class=&quot;btn&quot; id=&quot;vNet&quot;&gt;Critical view: translocal network&lt;/button&gt;&lt;/div&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 700 260&quot; role=&quot;img&quot; aria-label=&quot;Comparison of the linear view and the translocal network&quot;&gt;
    &lt;g id=&quot;gLin&quot;&gt;

      &lt;circle cx=&quot;580&quot; cy=&quot;130&quot; r=&quot;48&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;580&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Rich country&lt;/text&gt;&lt;text x=&quot;580&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;destination&lt;/text&gt;

      &lt;text x=&quot;350&quot; y=&quot;220&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--ink2)&quot;&gt;development is measured only in the place of origin&lt;/text&gt;
    &lt;/g&gt;
    &lt;g id=&quot;gNet&quot; style=&quot;display:none&quot; font-size=&quot;12&quot;&gt;

      &lt;circle cx=&quot;350&quot; cy=&quot;150&quot; r=&quot;30&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;154&quot; text-anchor=&quot;middle&quot;&gt;nearby country&lt;/text&gt;
      &lt;circle cx=&quot;570&quot; cy=&quot;70&quot; r=&quot;30&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot;&gt;country A&lt;/text&gt;

      &lt;text x=&quot;350&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;remittances, ideas, returns&lt;/text&gt;
      &lt;text x=&quot;350&quot; y=&quot;250&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink2)&quot;&gt;internal, circular, multi-destination migration: development is translocal&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;

      &lt;text x=&quot;110&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;34&quot; font-weight=&quot;600&quot;&gt;75%&lt;/text&gt;

      &lt;tr&gt;&lt;td&gt;Migration&lt;/td&gt;&lt;td&gt;binary, linear, permanent&lt;/td&gt;&lt;td&gt;circular, multiple, also internal&lt;/td&gt;&lt;/tr&gt;

      &lt;tr&gt;&lt;td&gt;Indicators&lt;/td&gt;&lt;td&gt;change in a single place&lt;/td&gt;&lt;td&gt;flows and links between places&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Migrating is…&lt;/td&gt;&lt;td&gt;a symptom of failed development&lt;/td&gt;&lt;td&gt;part of the development process&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Power&lt;/td&gt;&lt;td&gt;North/South status quo&lt;/td&gt;&lt;td&gt;challenges existing relations&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 4&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;What are Nijenhuis &amp;amp; Leung&#x27;s three critiques?&lt;/summary&gt;&lt;p&gt;(1) Migration seen as a binary and linear process; (2) poverty and development seen as territorialized processes; (3) development as a process that happens “at home”.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why do the SDG indicators reinforce a “sedentary approach”?&lt;/summary&gt;&lt;p&gt;Because they measure change in a single place: those who leave disappear from the measurement and their departure looks like a sign of underdevelopment, while remittances and translocal ties are not counted.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is the linear view unrealistic? Give the three reasons from the slides.&lt;/summary&gt;&lt;p&gt;Diversified migration flows, increasing circularity, destination not limited to a single country. In addition, internal migration matters a great deal (75% of migrants).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What political risk do the authors see in the idea of development “at home”?&lt;/summary&gt;&lt;p&gt;That talk of global interdependence maintains the status quo, leaving the traditional power relations between rich and poor countries untouched.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part terra&quot; id=&quot;ineq&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Implications of inequalities&lt;/div&gt;&lt;h2&gt;Why a more equitable world?&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slides 14–17&lt;/span&gt; The second part of the lecture revolves around a video (&lt;em&gt;recommended, &lt;b&gt;not required&lt;/b&gt; for the exam&lt;/em&gt;) and three themes: the implications of inequalities (economic consequences, democracy), what can be done at the local level, and &lt;span class=&quot;term-en&quot;&gt;intersectionality&lt;/span&gt;.&lt;/p&gt;

  &lt;h3&gt;Review of key concepts &lt;span class=&quot;src slide&quot;&gt;Slide 17&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Income inequality&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Poverty (poverties)&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Social mobility&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Status&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Income inequality&lt;/b&gt;: how unequally income is distributed across a population. It is often measured with the &lt;b&gt;Lorenz curve&lt;/b&gt; and the &lt;b&gt;Gini coefficient&lt;/b&gt; (chart below). &lt;span class=&quot;src extra&quot;&gt;Beyond the slides&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;The slides write &lt;em&gt;poverties&lt;/em&gt; in the plural because poverty takes several forms: &lt;b&gt;absolute&lt;/b&gt; (below a fixed subsistence threshold, e.g. the World Bank&#x27;s international poverty line), &lt;b&gt;relative&lt;/b&gt; (well below the average living standard of one&#x27;s society, e.g. below 60% of median income), &lt;b&gt;multidimensional&lt;/b&gt; (deprivations in health, education and housing, not only income). &lt;span class=&quot;src extra&quot;&gt;Beyond the slides&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Social mobility&lt;/b&gt;: the possibility of changing position on the social ladder, either between generations (children relative to their parents) or over the life course. Where inequality is high, mobility is usually low: the “rungs” are further apart. &lt;span class=&quot;src extra&quot;&gt;Beyond the slides&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Status&lt;/b&gt;: relative position and social recognition. The slides stress the &lt;b&gt;consequences for self-perception&lt;/b&gt;: in highly unequal societies, constant comparison with those above generates status anxiety, shame and lower self-esteem.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Lorenz curve and Gini coefficient &lt;span class=&quot;src extra&quot;&gt;Beyond the slides&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The Lorenz curve plots the cumulative share of the population (from poorest to richest) on the horizontal axis and the cumulative share of income on the vertical axis. Under perfect equality the curve is the diagonal. The Gini coefficient is the ratio between area A (between the diagonal and the curve) and the whole area under the diagonal:&lt;/p&gt;
  &lt;p class=&quot;readout&quot; style=&quot;text-align:center&quot;&gt;G = A / (A + B) &amp;nbsp;·&amp;nbsp; 0 = perfect equality, 1 = one person has everything&lt;/p&gt;
  &lt;div class=&quot;box&quot;&gt;
    &lt;label class=&quot;small&quot; for=&quot;lor&quot;&gt;Income concentration&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lor&quot; min=&quot;1&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;2.5&quot;&gt;
    &lt;svg viewBox=&quot;0 0 340 300&quot; aria-label=&quot;Interactive Lorenz curve&quot;&gt;
      &lt;rect x=&quot;40&quot; y=&quot;10&quot; width=&quot;260&quot; height=&quot;260&quot; fill=&quot;none&quot; stroke=&quot;var(--rule)&quot;/&gt;
      &lt;path id=&quot;lorA&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;none&quot;/&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;270&quot; x2=&quot;300&quot; y2=&quot;10&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
      &lt;path id=&quot;lorC&quot; fill=&quot;none&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;text x=&quot;170&quot; y=&quot;292&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;cumulative % of population →&lt;/text&gt;
      &lt;text x=&quot;16&quot; y=&quot;140&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot; transform=&quot;rotate(-90 16 140)&quot;&gt;cumulative % of income →&lt;/text&gt;
      &lt;text id=&quot;lorLab&quot; x=&quot;200&quot; y=&quot;150&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;250&quot; y=&quot;240&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;B&lt;/text&gt;
    &lt;/svg&gt;
    &lt;p class=&quot;readout&quot; id=&quot;lorOut&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;In the model L(p) = p&lt;sup&gt;k&lt;/sup&gt; the Gini coefficient equals (k−1)/(k+1). Rough benchmark: the Nordic countries are around 0.25–0.30, the most unequal countries above 0.50.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;The implications of inequalities &lt;span class=&quot;src slide&quot;&gt;Slides 15, 17&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;b&gt;For the economy&lt;/b&gt;&lt;br&gt;Weaker domestic demand, wasted talent (those born poor cannot invest in education), less stable growth.&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;b&gt;For mental health and well-being&lt;/b&gt;&lt;br&gt;Status stress, anxiety, lower trust in others and weaker social cohesion.&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;b&gt;For power&lt;/b&gt;&lt;br&gt;They reinforce &lt;span class=&quot;term-en&quot;&gt;dominance dynamics&lt;/span&gt;, also &lt;em&gt;at the global level&lt;/em&gt;, and put &lt;b&gt;democracy&lt;/b&gt; under strain: those with more resources have more political influence.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;The link between inequality, health and trust is central to Wilkinson &amp;amp; Pickett, &lt;em&gt;The Spirit Level&lt;/em&gt; (2009): it is not cited in the slides, see “Further reading”. &lt;span class=&quot;src web&quot;&gt;External source&lt;/span&gt;&lt;/p&gt;

  &lt;h3&gt;Intersectionality &lt;span class=&quot;src slide&quot;&gt;Slide 15&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;term-en&quot;&gt;Intersectionality&lt;/span&gt;: disadvantages do not simply add up, they &lt;b&gt;intersect&lt;/b&gt;. Someone who is poor, belongs to a minority, lives in a peripheral neighbourhood and is exposed to pollution experiences a condition that differs from the sum of its parts. This links inequalities to the environmental justice and migration topics of previous lectures.&lt;/p&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 420 300&quot; role=&quot;img&quot; aria-label=&quot;Intersectionality diagram&quot;&gt;
    &lt;g fill-opacity=&quot;.35&quot; stroke-width=&quot;1.5&quot;&gt;
      &lt;circle cx=&quot;160&quot; cy=&quot;115&quot; r=&quot;78&quot; fill=&quot;var(--accent)&quot; stroke=&quot;var(--accent)&quot;/&gt;
      &lt;circle cx=&quot;260&quot; cy=&quot;115&quot; r=&quot;78&quot; fill=&quot;var(--slate)&quot; stroke=&quot;var(--slate)&quot;/&gt;
      &lt;circle cx=&quot;160&quot; cy=&quot;195&quot; r=&quot;78&quot; fill=&quot;var(--sage)&quot; stroke=&quot;var(--sage)&quot;/&gt;
      &lt;circle cx=&quot;260&quot; cy=&quot;195&quot; r=&quot;78&quot; fill=&quot;var(--ochre)&quot; stroke=&quot;var(--ochre)&quot;/&gt;
    &lt;/g&gt;
    &lt;g font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;
      &lt;text x=&quot;120&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;poverty&lt;/text&gt;&lt;text x=&quot;300&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;minorities&lt;/text&gt;
      &lt;text x=&quot;112&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot;&gt;place of&lt;/text&gt;&lt;text x=&quot;112&quot; y=&quot;261&quot; text-anchor=&quot;middle&quot;&gt;residence&lt;/text&gt;
      &lt;text x=&quot;308&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot;&gt;pollution&lt;/text&gt;&lt;text x=&quot;308&quot; y=&quot;261&quot; text-anchor=&quot;middle&quot;&gt;exposure&lt;/text&gt;
      &lt;text x=&quot;210&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot;&gt;cumulative&lt;/text&gt;&lt;text x=&quot;210&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot;&gt;disadvantage&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 5&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Why do the slides write “poverties” in the plural?&lt;/summary&gt;&lt;p&gt;Because poverty takes several forms: absolute, relative, multidimensional (health, education, housing…), not just lack of income.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What are the three implications of inequalities listed in the “Main points”?&lt;/summary&gt;&lt;p&gt;For the economy; for mental health and well-being; the reinforcement of dominance dynamics, also at the global level.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;One country has a Gini of 0.25 and another 0.55: which is more unequal and what does its Lorenz curve look like?&lt;/summary&gt;&lt;p&gt;The one at 0.55: its curve lies further from the diagonal and area A is larger.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Define intersectionality with an example from the slides.&lt;/summary&gt;&lt;p&gt;It is the intersection of multiple axes of disadvantage. Example: a poor family from a minority living in an area exposed to pollution.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part sage&quot; id=&quot;fare&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot; style=&quot;color:var(--sage)&quot;&gt;What can be done&lt;/div&gt;&lt;h2&gt;From local to global&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 18&lt;/span&gt; Two levels of intervention and an open question.&lt;/p&gt;
  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 700 230&quot; role=&quot;img&quot; aria-label=&quot;Levels of intervention: local and global&quot;&gt;
    &lt;rect x=&quot;20&quot; y=&quot;20&quot; width=&quot;300&quot; height=&quot;190&quot; rx=&quot;14&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
    &lt;text x=&quot;170&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Local actors&lt;/text&gt;
    &lt;text x=&quot;170&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;territorialized experiences&lt;/text&gt;
    &lt;text x=&quot;170&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;municipalities, associations, schools,&lt;/text&gt;
    &lt;text x=&quot;170&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;diasporas, social enterprises&lt;/text&gt;
    &lt;rect x=&quot;380&quot; y=&quot;20&quot; width=&quot;300&quot; height=&quot;190&quot; rx=&quot;14&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
    &lt;text x=&quot;530&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Policies and institutions&lt;/text&gt;
    &lt;text x=&quot;530&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;global stakeholders&lt;/text&gt;
    &lt;text x=&quot;530&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;UN, IOM, governments,&lt;/text&gt;
    &lt;text x=&quot;530&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;World Bank, global agreements&lt;/text&gt;
    &lt;path d=&quot;M325 95 L375 95&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M375 135 L325 135&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;rect x=&quot;245&quot; y=&quot;170&quot; width=&quot;210&quot; height=&quot;40&quot; rx=&quot;20&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;195&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--paper)&quot;&gt;Can the SDGs help?&lt;/text&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;h3&gt;Can the SDGs help? Pros and cons &lt;span class=&quot;src extra&quot;&gt;Beyond the slides&lt;/span&gt;&lt;/h3&gt;
  &lt;p class=&quot;small&quot;&gt;The slide leaves the question open. Here are the arguments that emerge from the lecture itself:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;details&gt;&lt;summary&gt;Yes, because…&lt;/summary&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;they provide a &lt;b&gt;common language&lt;/b&gt; and measurable goals for governments, NGOs and local actors;&lt;/li&gt;&lt;li&gt;they place migration within the goal on inequalities (10.7) and make it cross-cutting;&lt;/li&gt;&lt;li&gt;they call for data disaggregated by &lt;em&gt;migratory status&lt;/em&gt; (17.18): what gets measured becomes visible;&lt;/li&gt;&lt;li&gt;they are universal: they apply to rich countries too.&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;With limitations, because…&lt;/summary&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;they are not binding;&lt;/li&gt;&lt;li&gt;their indicators remain territorialized (Nijenhuis &amp;amp; Leung&#x27;s critique);&lt;/li&gt;&lt;li&gt;they overlook internal migration and circularity;&lt;/li&gt;&lt;li&gt;they risk leaving global power relations untouched.&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 6&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Which two levels of action does the “What can be done” slide identify?&lt;/summary&gt;&lt;p&gt;Local actors (with territorialized experiences), and policies and institutions with global stakeholders.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Possible exam question: “Can the SDGs help reduce inequalities linked to migration?”&lt;/summary&gt;&lt;p&gt;Outline: yes, as a common framework (Targets 10.7, 10.c, 17.18; cross-cutting and universal nature); but according to Nijenhuis &amp;amp; Leung they retain a linear, territorialized view that ignores internal and circular migration and risks maintaining the status quo. Conclusion: translocal indicators and the engagement of local actors are needed.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;approfondire&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Further reading&lt;/div&gt;
  &lt;h2&gt;Authors, texts, documents and websites cited&lt;/h2&gt;
  &lt;p class=&quot;small&quot;&gt;Each entry states what the slides say and, marked separately with the &lt;span class=&quot;src web&quot;&gt;External source&lt;/span&gt; badge, what I verified online. At the end, two readings &lt;em&gt;not&lt;/em&gt; cited in the slides but useful.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Nijenhuis, G. &amp;amp; Leung, M. W. H. (2017). “Rethinking Migration in the 2030 Agenda: Towards a De-Territorialized Conceptualization of Development”&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 10&lt;/span&gt; Reference text for the “critical perspective”.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;External source&lt;/span&gt; Article in &lt;em&gt;Forum for Development Studies&lt;/em&gt;, vol. 44, pp. 51–68, DOI 10.1080/08039410.2016.1276958. It compares how the MDGs and SDGs address migration and argues that the 2030 Agenda does not move beyond a place-bound view of development and continues to frame migration as a binary and linear process. It is available open access in the Utrecht University repository.
    &lt;br&gt;&lt;a href=&quot;https://research-portal.uu.nl/en/publications/rethinking-migration-in-the-2030-agenda-towards-a-de-territoriali/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Utrecht University Research Portal&lt;/a&gt; · &lt;a href=&quot;https://doi.org/10.1080/08039410.2016.1276958&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the three critiques in section 4, and therefore the theoretical core of the lecture.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Migration Data Portal (IOM – GMDAC)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slides 5, 9&lt;/span&gt; Portal shown in class, with the SDG “wheel” and the SDG 3 page.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;External source&lt;/span&gt; Portal of the International Organization for Migration with data, thematic overviews and an SDG section. It states that at least 10 of the 17 goals contain targets and indicators directly relevant to migration, and that migration cuts across all 17.
    &lt;br&gt;&lt;a href=&quot;https://www.migrationdataportal.org/sdgs?node=0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SDG section&lt;/a&gt; · &lt;a href=&quot;https://www.migrationdataportal.org/sdgs?node=3&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SDG 3 page (link from the slide)&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the tool for seeing, goal by goal, where migrants are, and it is useful for practising Part 3.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;2030 Agenda – UN resolution A/RES/70/1 “Transforming our world”&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slides 7–8&lt;/span&gt; 2030 Agenda, SDGs, Target 10.7 and Goal 10.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;External source&lt;/span&gt; Adopted without a vote by the General Assembly on 25 September 2015: it sets out goals and targets for the following 15 years as a “plan of action for people, planet and prosperity”.
    &lt;br&gt;&lt;a href=&quot;https://digitallibrary.un.org/record/3923923&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Digital Library&lt;/a&gt; · &lt;a href=&quot;https://www.un.org/en/development/desa/population/migration/generalassembly/docs/globalcompact/A_RES_70_1_E.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF text (un.org)&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the normative text from which the target wordings (10.7, 10.c, 8.8…) are quoted.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Millennium Development Goals (2000–2015)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 7&lt;/span&gt; The “previous framework”, with less attention to migration.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;External source&lt;/span&gt; Eight goals with 21 targets, adopted at the UN Millennium Summit in September 2000 with a 2015 deadline: extreme poverty and hunger, primary education, gender equality, child mortality, maternal health, HIV/malaria, environmental sustainability, global partnership. Results were uneven.
    &lt;br&gt;&lt;a href=&quot;https://www.britannica.com/topic/United-Nations-Millennium-Development-Goals&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Encyclopaedia Britannica&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; the MDG → SDG comparison is the basis for stating what has changed regarding migration.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;SDG indicators 10.7.2 and 10.c.1 (official metadata)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slides 8, 12&lt;/span&gt; Targets 10.7 and 10.c; the role of indicators in the critique.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;External source&lt;/span&gt; Indicator 10.7.2 measures the proportion of countries with migration policies that facilitate orderly, safe and regular migration, using IOM&#x27;s Migration Governance Framework (six domains). Indicator 10.c.1 measures remittance costs as a proportion of the amount remitted: the target is below 3%, with corridors above 5% eliminated, using data from the World Bank&#x27;s Remittance Prices Worldwide database.
    &lt;br&gt;&lt;a href=&quot;https://unstats.un.org/sdgs/metadata/files/Metadata-10-07-02.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;10.7.2 metadata (UN Stats)&lt;/a&gt; · &lt;a href=&quot;https://worldbank.github.io/sdg-metadata/metadata/en/10-c-1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;10.c.1 metadata (World Bank)&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it shows concretely what the indicators criticised by Nijenhuis &amp;amp; Leung actually measure.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Global Compact for Safe, Orderly and Regular Migration (2018)&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slide 5&lt;/span&gt; The portal lists it among the “Frameworks” (“SDGs and GCM”); the slide does not explain it.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;External source&lt;/span&gt; Adopted in Marrakech on 10–11 December 2018 and endorsed by the General Assembly on 19 December 2018 (A/RES/73/195; 152 in favour, 5 against, 12 abstentions). It contains 23 objectives covering the entire migration cycle, is non-binding and complements the Global Compact on Refugees.
    &lt;br&gt;&lt;a href=&quot;https://digitallibrary.un.org/record/1660537?ln=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UN Digital Library&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it puts Target 10.7 into practice: it is the first global framework dedicated solely to migration.&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Video “Why a more equitable world?”&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src slide&quot;&gt;Slides 14, 16&lt;/span&gt; Recommended, not required for the exam.&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;External source&lt;/span&gt; Through web searches I was unable to verify the title and author of the video, so I do not describe its content beyond what the slides report (slides 15 and 17). Link from the slide:
    &lt;br&gt;&lt;a href=&quot;https://www.youtube.com/watch?v=pXwJI1d2kNw&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;youtube.com/watch?v=pXwJI1d2kNw&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the basis of the part on inequalities (section 5).&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Related readings not cited in the slides&lt;/h3&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;IOM – World Migration Report 2024&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;External source&lt;/span&gt; IOM&#x27;s biennial report. It estimates 281 million international migrants in 2020, about 3.6% of the world population, and notes that internal migration remains more widespread than international migration.
    &lt;br&gt;&lt;a href=&quot;https://ruralindiaonline.org/en/library/resource/world-migration-report-2024/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Report overview (PARI Library)&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it provides orders of magnitude and confirms the weight of internal migration.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Wilkinson, R. &amp;amp; Pickett, K. (2009). &lt;em&gt;The Spirit Level: Why More Equal Societies Almost Always Do Better&lt;/em&gt;&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;src web&quot;&gt;External source&lt;/span&gt; A book (Allen Lane) arguing that, across eleven health and social problems, outcomes are worse in more unequal rich countries. It was widely read but also criticised regarding causality; an updated edition was published in 2024.
    &lt;br&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/The_Spirit_Level_(Wilkinson_and_Pickett_book)&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia entry&lt;/a&gt;&lt;/p&gt;
    &lt;p class=&quot;why&quot;&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it expands on the “Main points” of slide 17 (status, mental health, trust).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;
