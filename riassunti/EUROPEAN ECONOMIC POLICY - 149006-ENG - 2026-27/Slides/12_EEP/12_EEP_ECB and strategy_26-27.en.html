&lt;h1&gt;The European Central Bank&lt;br&gt;&lt;span style=&quot;font-style:italic;font-weight:200&quot;&gt;institution, independence and strategy&lt;/span&gt;&lt;/h1&gt;
&lt;p class=&quot;lede&quot;&gt;Who sets monetary policy for the euro area, why it was made so independent of politics, to whom it is accountable, whether it really behaves as a &quot;conservative&quot; central bank, and what strategy it uses to pursue price stability.&lt;/p&gt;
&lt;div class=&quot;meta&quot;&gt;&lt;span&gt;Source: &lt;i&gt;12_EEP_ECB and strategy_26-27.pdf&lt;/i&gt; (72 slides)&lt;/span&gt;&lt;span&gt;Parts: institution · Treaty · Barro-Gordon · accountability · Fed vs ECB · new tasks · Governing Council · strategy&lt;/span&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot; style=&quot;margin-top:14px&quot;&gt;How to read this page: boxes marked &lt;span class=&quot;tag-sl&quot;&gt;slide&lt;/span&gt; report the content of the slides; dashed boxes &lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt; contain information taken from the web, always with a link. Additional explanations (definitions, steps of the models) have been added to clarify what the slides take for granted. The other materials in the &lt;code&gt;corso/&lt;/code&gt; folder were not consulted, because the working environment offered no way to list its files. Links to other lectures are therefore limited to those that can be inferred from the slides.&lt;/p&gt;

&lt;h2&gt;The ECB as an institution&lt;/h2&gt;

&lt;h3&gt;The stages of Economic and Monetary Union (EMU)&lt;/h3&gt;
&lt;p&gt;&lt;b&gt;EMU&lt;/b&gt; (&lt;i&gt;Economic and Monetary Union&lt;/i&gt;) was built in three stages. The slides recall the two key dates for the creation of the ECB:&lt;/p&gt;
&lt;div class=&quot;timeline&quot;&gt;
&lt;div&gt;&lt;b&gt;1990&lt;/b&gt;&lt;span class=&quot;note&quot;&gt;Stage one: free movement of capital and closer coordination (background, not in the slides).&lt;/span&gt;&lt;/div&gt;
&lt;div&gt;&lt;b&gt;Jan. 1994&lt;/b&gt;The &lt;b&gt;EMI&lt;/b&gt; (&lt;i&gt;European Monetary Institute&lt;/i&gt;) is established: it strengthens cooperation among central banks and prepares the &lt;b&gt;ESCB&lt;/b&gt;.&lt;/div&gt;
&lt;div&gt;&lt;b&gt;Jan. 1999&lt;/b&gt;The conversion rates of the currencies of &lt;b&gt;11 Member States&lt;/b&gt; are irrevocably fixed. The ECB takes over the single monetary policy.&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Seat: the &lt;b&gt;Eurotower&lt;/b&gt; in Frankfurt (Germany), as in the photo in the slides. President: &lt;b&gt;Christine Lagarde&lt;/b&gt;, term of office 1/11/2019 – 31/10/2027. The slides add that Lagarde will step down on 7 February 2027 and, with a question mark, mention Pablo Hernández de Cos as a possible successor and Markus Brunnermeier as a possible chief economist. These are current-affairs items: check them at the time of the exam.&lt;/p&gt;

&lt;h3&gt;Eurosystem and ESCB: two different sets&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Eurosystem&lt;/b&gt;&lt;br&gt;The ECB plus the &lt;b&gt;NCBs&lt;/b&gt; (&lt;i&gt;National Central Banks&lt;/i&gt;) of the countries that have adopted the euro. It is the body that conducts monetary policy.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;ESCB&lt;/b&gt; — &lt;i&gt;European System of Central Banks&lt;/i&gt;&lt;br&gt;The ECB plus the central banks of &lt;b&gt;all&lt;/b&gt; EU Member States, including those outside the euro area. The Treaty assigns it the objective of price stability.&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The three decision-making bodies&lt;/h3&gt;
&lt;p&gt;Composition (from «Chart 1.1» of the 2011 ECB publication cited in the slides). Click the tabs:&lt;/p&gt;
&lt;div class=&quot;tabset&quot;&gt;
&lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;&lt;button data-tab=&quot;gc&quot; aria-selected=&quot;true&quot;&gt;Governing Council&lt;/button&gt;&lt;button data-tab=&quot;eb&quot;&gt;Executive Board&lt;/button&gt;&lt;button data-tab=&quot;gen&quot;&gt;General Council&lt;/button&gt;&lt;/div&gt;
&lt;div data-panel=&quot;gc&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;
&lt;p&gt;&lt;b&gt;Who:&lt;/b&gt; the 6 members of the Executive Board plus the governors of the euro-area NCBs.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;What it does:&lt;/b&gt; formulates the monetary policy of the euro area: intermediate monetary objectives, &lt;i&gt;key interest rates&lt;/i&gt;, the supply of reserves in the Eurosystem, and the guidelines for implementing these decisions. It also decides on the new &lt;i&gt;banking supervision&lt;/i&gt; tasks.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;How:&lt;/b&gt; it usually meets twice a month in Frankfurt. It assesses economic and monetary developments and &lt;b&gt;takes monetary policy decisions every six weeks&lt;/b&gt;. At the other meetings it deals with the ECB&#x27;s other tasks. To keep monetary policy and supervision separate, it holds &lt;b&gt;separate meetings&lt;/b&gt;.&lt;/p&gt;
&lt;/div&gt;&lt;svg id=&quot;gc-dots&quot; viewBox=&quot;0 0 300 170&quot; aria-label=&quot;Composition of the Governing Council&quot;&gt;&lt;/svg&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-panel=&quot;eb&quot; hidden&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;
&lt;p&gt;&lt;b&gt;Who:&lt;/b&gt; the President, the Vice-President and 4 other members: 6 people.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;What it does:&lt;/b&gt; prepares the meetings of the Governing Council; &lt;b&gt;implements&lt;/b&gt; monetary policy in accordance with the Council&#x27;s guidelines and gives the necessary instructions to the NCBs; manages the day-to-day business of the ECB; exercises the powers delegated to it by the Council.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it holds a &lt;b&gt;strategic position&lt;/b&gt; in the Governing Council&#x27;s decision-making process. We will see this with median voter theory in &lt;a href=&quot;#s7&quot;&gt;Part 7&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;&lt;svg viewBox=&quot;0 0 300 120&quot; aria-hidden=&quot;true&quot;&gt;&lt;g id=&quot;eb-dots&quot;&gt;&lt;/g&gt;&lt;/svg&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-panel=&quot;gen&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Who:&lt;/b&gt; the President and Vice-President of the ECB plus the governors of the central banks of &lt;b&gt;all&lt;/b&gt; EU Member States.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;What it does:&lt;/b&gt; contributes to the ECB&#x27;s advisory functions, the collection of statistical information and the preparation of the annual report.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Nature:&lt;/b&gt; it is a &lt;b&gt;transitional&lt;/b&gt; body. It exists as long as there are EU Member States outside the euro area and acts as a bridge with them.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;How the Executive Board is appointed&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 760 330&quot; aria-label=&quot;Appointment procedure for the Executive Board&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ar2&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; class=&quot;f-ocr&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;

&lt;/g&gt;

&lt;rect x=&quot;540&quot; y=&quot;140&quot; width=&quot;160&quot; height=&quot;38&quot; rx=&quot;17&quot; class=&quot;fb-ocr c-ocr&quot;/&gt;&lt;text x=&quot;620&quot; y=&quot;164&quot; text-anchor=&quot;middle&quot;&gt;Council of the EU&lt;/text&gt;
&lt;rect x=&quot;540&quot; y=&quot;60&quot; width=&quot;160&quot; height=&quot;42&quot; rx=&quot;17&quot; class=&quot;fb-ocr c-ocr&quot;/&gt;&lt;text x=&quot;620&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;European Council&lt;/text&gt;
&lt;rect x=&quot;540&quot; y=&quot;0&quot; width=&quot;160&quot; height=&quot;22&quot; rx=&quot;11&quot; class=&quot;fb-ocr c-ocr&quot;/&gt;&lt;text x=&quot;620&quot; y=&quot;16&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;European Parliament&lt;/text&gt;
&lt;rect x=&quot;60&quot; y=&quot;56&quot; width=&quot;238&quot; height=&quot;96&quot; rx=&quot;10&quot; class=&quot;fb-ard c-ard&quot;/&gt;&lt;text x=&quot;179&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Executive Board&lt;/text&gt;
&lt;text x=&quot;179&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;President · Vice-President&lt;/text&gt;&lt;text x=&quot;179&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;4 other members&lt;/text&gt;&lt;text x=&quot;179&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;f-mut&quot;&gt;8 years, non-renewable&lt;/text&gt;
&lt;rect x=&quot;60&quot; y=&quot;180&quot; width=&quot;150&quot; height=&quot;36&quot; rx=&quot;10&quot; class=&quot;fb-ard c-ard&quot;/&gt;&lt;text x=&quot;135&quot; y=&quot;203&quot; text-anchor=&quot;middle&quot;&gt;Governing Council&lt;/text&gt;
&lt;/g&gt;
&lt;g font-size=&quot;11&quot; font-style=&quot;italic&quot; class=&quot;f-mut&quot;&gt;&lt;text x=&quot;630&quot; y=&quot;278&quot;&gt;propose candidates&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;202&quot;&gt;discusses candidates&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;126&quot;&gt;recommends&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;44&quot;&gt;opinion&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;72&quot;&gt;appoints (qualified majority)&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;140&quot;&gt;opinion&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Redrawn from the diagram in the slides (source given: Rakic D., &lt;i&gt;European Central Bank appointments: Role of the European Parliament&lt;/i&gt;, European Parliament, 2019). The Parliament and the Governing Council only give an &lt;b&gt;opinion&lt;/b&gt;: the European Council decides.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 1&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. What is the difference between the Eurosystem and the ESCB?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;The Eurosystem consists of the ECB and the NCBs of the euro-area countries. The ESCB also includes the central banks of EU Member States that do not use the euro.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. How often does the Governing Council take monetary policy decisions, and why does it hold separate meetings?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Every six weeks, even though it usually meets twice a month. It holds separate meetings so as not to mix monetary policy with banking supervision tasks.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Why is the General Council described as &quot;transitional&quot;?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;It links the ECB with the central banks of EU Member States outside the euro area. If all of them adopted the euro, it would no longer have any reason to exist.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ S2 ============ --&gt;
&lt;section class=&quot;part p-ocr&quot; id=&quot;s2&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 2 · slides 9–16&lt;/div&gt;
&lt;h2&gt;The Treaty: objectives and three forms of independence&lt;/h2&gt;

&lt;h3&gt;A hierarchy of objectives (Art. 127 TFEU)&lt;/h3&gt;
&lt;p&gt;The &lt;b&gt;TFEU&lt;/b&gt; (&lt;i&gt;Treaty on the Functioning of the European Union&lt;/i&gt;) sets out a precise order:&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 700 210&quot; aria-label=&quot;Hierarchy of objectives&quot;&gt;
&lt;rect x=&quot;180&quot; y=&quot;10&quot; width=&quot;340&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;fb-ocr c-ocr&quot; stroke-width=&quot;2&quot;/&gt;
&lt;text x=&quot;350&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;1. Price stability&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-mut&quot;&gt;primary objective of the ESCB&lt;/text&gt;
&lt;path d=&quot;M350,66 L350,92&quot; class=&quot;c-ocr&quot; stroke-width=&quot;2&quot;/&gt;
&lt;rect x=&quot;110&quot; y=&quot;92&quot; width=&quot;480&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;f-card c-ocr&quot; stroke-width=&quot;1.4&quot;/&gt;
&lt;text x=&quot;350&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;2. «Without prejudice to price stability»: support for the Union&#x27;s general economic policies&lt;/text&gt;
&lt;text x=&quot;350&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-mut&quot;&gt;to contribute to the objectives of Art. 3 TEU&lt;/text&gt;
&lt;path d=&quot;M350,142 L350,160&quot; class=&quot;c-ocr&quot; stroke-width=&quot;1.4&quot;/&gt;
&lt;g font-size=&quot;11.5&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;160&quot; width=&quot;160&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;f-card c-mut&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;184&quot; text-anchor=&quot;middle&quot;&gt;balanced growth&lt;/text&gt;
&lt;rect x=&quot;185&quot; y=&quot;160&quot; width=&quot;160&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;f-card c-mut&quot;/&gt;&lt;text x=&quot;265&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot;&gt;competitive social&lt;/text&gt;&lt;text x=&quot;265&quot; y=&quot;193&quot; text-anchor=&quot;middle&quot;&gt;market economy&lt;/text&gt;
&lt;rect x=&quot;360&quot; y=&quot;160&quot; width=&quot;160&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;f-card c-mut&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot;&gt;full employment&lt;/text&gt;&lt;text x=&quot;440&quot; y=&quot;193&quot; text-anchor=&quot;middle&quot;&gt;and social progress&lt;/text&gt;
&lt;rect x=&quot;535&quot; y=&quot;160&quot; width=&quot;160&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;f-card c-mut&quot;/&gt;&lt;text x=&quot;615&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot;&gt;protection and quality&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;193&quot; text-anchor=&quot;middle&quot;&gt;of the environment&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;figcaption&gt;The second level is &lt;b&gt;subordinate&lt;/b&gt; to the first: the ECB supports growth and employment only if doing so does not jeopardise price stability.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3&gt;The three independences&lt;/h3&gt;
&lt;div class=&quot;tabset&quot;&gt;
&lt;div class=&quot;tabs&quot;&gt;&lt;button data-tab=&quot;ist&quot; aria-selected=&quot;true&quot;&gt;Institutional · Art. 130&lt;/button&gt;&lt;button data-tab=&quot;fun&quot;&gt;Functional · Art. 123–124&lt;/button&gt;&lt;button data-tab=&quot;per&quot;&gt;Personal · Art. 283(2)&lt;/button&gt;&lt;/div&gt;
&lt;div data-panel=&quot;ist&quot;&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Institutional independence&lt;/b&gt;&lt;br&gt;Neither the ECB, nor an NCB, nor any member of their decision-making bodies may &lt;b&gt;seek or take instructions&lt;/b&gt; from EU institutions, national governments or any other body. At the same time, institutions and governments undertake &lt;b&gt;not to seek to influence them&lt;/b&gt;.&lt;/div&gt;&lt;p&gt;The prohibition works in both directions: the central bank takes no orders, and politicians do not try to give any.&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;fun&quot; hidden&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Functional independence&lt;/b&gt;&lt;br&gt;&lt;b&gt;Art. 123&lt;/b&gt; — prohibition of &lt;b&gt;monetary financing&lt;/b&gt;: no overdraft facilities or credit from the ECB or the NCBs in favour of EU institutions, governments, public authorities or public undertakings, and no &lt;b&gt;direct&lt;/b&gt; purchase (on the primary market) of their debt instruments.&lt;br&gt;&lt;b&gt;Art. 124&lt;/b&gt; — prohibition of &lt;b&gt;privileged access&lt;/b&gt;: no measure granting the public sector privileged access to financial institutions, unless it is based on &lt;i&gt;prudential considerations&lt;/i&gt;.&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Note from the slides: under Art. 2 of Regulation (EC) No 3604/93, «prudential considerations» are those underlying national laws or acts compatible with Community law and designed to promote the soundness of financial institutions, strengthen the stability of the system and protect their customers.&lt;/p&gt;
&lt;p&gt;Why it matters: if the central bank could finance the State directly, the government could &quot;print money&quot; to cover its deficits. This is precisely the source of inflation that independence is meant to prevent. Purchases on the &lt;b&gt;secondary&lt;/b&gt; market (the QE of &lt;a href=&quot;#s5&quot;&gt;Part 5&lt;/a&gt;) are not prohibited by this provision.&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;per&quot; hidden&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Personal independence&lt;/b&gt;&lt;br&gt;The Executive Board (President, Vice-President and 4 members) is appointed by the &lt;b&gt;European Council by qualified majority&lt;/b&gt;, on a recommendation from the Council, after consulting the European Parliament and the Governing Council. Members are chosen from among persons of recognised standing and professional experience in monetary or banking matters. &lt;b&gt;8-year term, non-renewable.&lt;/b&gt; Only nationals of Member States may be members.&lt;/div&gt;&lt;p&gt;The &lt;b&gt;non-renewable&lt;/b&gt; term is the key: someone who does not need to be reappointed has no reason to please those who appoint them. The 8-year term is also longer than an electoral cycle.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Comparison: the Fed&#x27;s mandate&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;History&lt;/h4&gt;&lt;p&gt;Founded in &lt;b&gt;1913&lt;/b&gt;, mainly as a &lt;i&gt;lender of last resort&lt;/i&gt; against banking crises. After the banking problems of the 1930s it was reformed in &lt;b&gt;1933 and 1935&lt;/b&gt;, when the modern &lt;i&gt;Board of Governors&lt;/i&gt; in Washington was created. With a banking system that subsequently remained stable, monetary policy became its main task.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;The &lt;i&gt;dual mandate&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;The &lt;b&gt;Full Employment and Balanced Growth Act of 1978&lt;/b&gt; requires it to pursue &lt;b&gt;maximum employment&lt;/b&gt;, &lt;b&gt;stable prices&lt;/b&gt; and &lt;b&gt;moderate long-term interest rates&lt;/b&gt;. With stable prices, long-term rates remain moderate, hence the term «dual mandate»: maximum employment and price stability, &lt;b&gt;on an equal footing&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;Congress sets the objectives. The decisions of the Board and of the &lt;b&gt;FOMC&lt;/b&gt; (&lt;i&gt;Federal Open Market Committee&lt;/i&gt;) on how to achieve them do not require political approval. The Board reports to Congress and is directly accountable to it.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;Federal Reserve History specifies that the three-objective formula comes from a &lt;b&gt;1977 amendment&lt;/b&gt; to the Federal Reserve Act. The Humphrey-Hawkins Act of 1978 then introduced national objectives and the requirement of periodic reports to Congress. — &lt;a href=&quot;https://www.federalreservehistory.org/essays/humphrey-hawkins-act&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;federalreservehistory.org&lt;/a&gt;&lt;/div&gt;

&lt;h3&gt;Two models of central banking&lt;/h3&gt;
&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Anglo-French model&lt;/th&gt;&lt;th&gt;German model (Bundesbank)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Objectives&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Several objectives; price stability is only one of them, with no priority&lt;/td&gt;&lt;td&gt;Price stability is the &lt;b&gt;primary&lt;/b&gt; objective&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Relationship with the government&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Decisions are subject to government approval → &lt;b&gt;political dependence&lt;/b&gt;&lt;/td&gt;&lt;td&gt;The central bank decides without interference → &lt;b&gt;political independence&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;In the ECB&lt;/b&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;b&gt;Prevailed&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Why did the German model prevail? Two reasons&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;b&gt;1. Germany&#x27;s strategic position.&lt;/b&gt; In order to accept EMU, that is, to give up the Deutsche Mark and the Bundesbank, the German authorities demanded an ECB that would give price stability &lt;b&gt;even greater&lt;/b&gt; weight than the Bundesbank did.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;2. Intellectual developments: the «monetarist counter-revolution».&lt;/b&gt; &lt;b&gt;Monetarism&lt;/b&gt; holds that in the long run inflation is a monetary phenomenon and that monetary policy cannot permanently reduce unemployment. To reduce the &lt;i&gt;inflation bias&lt;/i&gt; (Barro-Gordon, 1983), it is preferable to delegate monetary policy to a &lt;b&gt;conservative&lt;/b&gt; central bank and to insulate it from political pressure: more independence, less inflation. This is the topic of the next part.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 2&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Match each article to the type of independence: Art. 130, Art. 123, Art. 283(2).&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Art. 130 → institutional independence (no instructions). Art. 123 (together with Art. 124) → functional independence (no monetary financing or privileged access). Art. 283(2) → personal independence (appointment, 8-year non-renewable term).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Can the ECB support full employment?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Yes, but only «without prejudice» to price stability: it is a secondary, subordinate objective. The Fed, by contrast, has a dual mandate with employment and prices on an equal footing.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Why does a non-renewable term strengthen independence?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Someone who cannot be reappointed has no incentive to please the governments that appoint them in order to secure a second term.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ S3 ============ --&gt;
&lt;section class=&quot;part p-ard&quot; id=&quot;s3&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 3 · slides 17–21, 29–32&lt;/div&gt;
&lt;h2&gt;Why independence? Barro-Gordon, time inconsistency, evidence&lt;/h2&gt;

&lt;h3&gt;Different preferences&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Governments&lt;/h4&gt;&lt;p&gt;They aim for growth, jobs… and &lt;b&gt;re-election&lt;/b&gt;. They take a short-term view: they prefer policies with immediate positive effects even if harmful in the long run, such as boosting growth and employment today at the cost of higher inflation tomorrow. They tend to overspend during expansions. They are &lt;b&gt;less inflation-averse&lt;/b&gt; and &lt;b&gt;more unemployment-averse&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Central bank&lt;/h4&gt;&lt;p&gt;Its main objective is price stability, and it is independent. Central bankers have terms longer than political cycles and cannot be removed because of how they conduct monetary policy. The ECB&#x27;s independence ensures that monetary policy does not serve purposes other than price stability.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The preference diagram: a negative shock&lt;/h3&gt;
&lt;p&gt;Axes: unemployment &lt;i&gt;u&lt;/i&gt; (horizontal) and inflation &lt;i&gt;π&lt;/i&gt; (vertical). The origin is the point (p*, u*), i.e. target inflation and the natural rate. A &lt;b&gt;negative shock&lt;/b&gt; (e.g. a supply shock) shifts the &lt;b&gt;short-run Phillips curve&lt;/b&gt;, the short-run inverse relationship between inflation and unemployment, to the right. Each policymaker chooses the point on the new curve that lies on its own &lt;b&gt;preference line&lt;/b&gt;. The steep line (government) accepts a lot of inflation in order to contain unemployment. The flat line (ECB) accepts more unemployment in order to keep inflation low.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;Size of the shock &lt;input type=&quot;range&quot; id=&quot;bg-s&quot; min=&quot;0.5&quot; max=&quot;5&quot; step=&quot;0.1&quot; value=&quot;3&quot;&gt;&lt;/label&gt;&lt;label&gt;ECB inflation aversion &lt;input type=&quot;range&quot; id=&quot;bg-c&quot; min=&quot;0.15&quot; max=&quot;1.5&quot; step=&quot;0.05&quot; value=&quot;0.4&quot;&gt;&lt;/label&gt;&lt;/div&gt;
&lt;svg id=&quot;bg-svg&quot; viewBox=&quot;0 0 640 360&quot; aria-label=&quot;Government and central bank preferences&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;out&quot; id=&quot;bg-out&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Interactive reconstruction of the slide «Preferences: Government vs CB». The curves are linear and the numbers are illustrative. The key result: faced with the same shock, the government would want &lt;b&gt;more stabilisation&lt;/b&gt; of unemployment, the central bank less.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Time inconsistency and inflation bias&lt;/h3&gt;
&lt;p&gt;In the 1970s widespread inflation prompted a rethinking of central bank governance, and by the 1980s many central bankers had become monetarists. The reference research concerns the problem of &lt;b&gt;time inconsistency&lt;/b&gt; (Kydland and Prescott, 1977; Barro and Gordon, 1983).&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Time inconsistency&lt;/b&gt;&lt;br&gt;A plan that is optimal &lt;i&gt;today&lt;/i&gt; («low inflation») ceases to be optimal &lt;i&gt;tomorrow&lt;/i&gt;, once expectations have been set: at that point it pays to surprise with higher inflation in order to reduce unemployment. The public knows this and expects it. If the central bank has a great deal of discretion, governments can put pressure on it.&lt;/div&gt;
&lt;div class=&quot;stepper&quot; id=&quot;tc-step&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Step 1&lt;/span&gt;&lt;p&gt;The expectations-augmented Phillips curve: &lt;span class=&quot;formula&quot; style=&quot;display:block&quot;&gt;&lt;i&gt;u&lt;/i&gt; = &lt;i&gt;u&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt; − &lt;i&gt;c&lt;/i&gt;(&lt;i&gt;π&lt;/i&gt; − &lt;i&gt;π&lt;sup&gt;e&lt;/sup&gt;&lt;/i&gt;)&lt;/span&gt; Unemployment falls below the natural rate &lt;i&gt;u&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt; only if inflation exceeds expected inflation &lt;i&gt;π&lt;sup&gt;e&lt;/sup&gt;&lt;/i&gt; (a «surprise»).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;Step 2&lt;/span&gt;&lt;p&gt;The policymaker minimises a loss function: &lt;span class=&quot;formula&quot; style=&quot;display:block&quot;&gt;&lt;i&gt;L&lt;/i&gt; = &lt;i&gt;π&lt;/i&gt;² + &lt;i&gt;λ&lt;/i&gt;(&lt;i&gt;u&lt;/i&gt; − &lt;i&gt;k·u&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt;)², &amp;nbsp; 0 &amp;lt; &lt;i&gt;k&lt;/i&gt; &amp;lt; 1&lt;/span&gt; &lt;i&gt;λ&lt;/i&gt; is the weight given to unemployment. &lt;i&gt;k&lt;/i&gt; &amp;lt; 1 means that the government would like unemployment &lt;b&gt;below&lt;/b&gt; the natural rate, for example for electoral reasons.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;Step 3&lt;/span&gt;&lt;p&gt;Under &lt;b&gt;discretion&lt;/b&gt;, taking expectations as given, it pays to create inflation: the first-order condition yields &lt;i&gt;π&lt;/i&gt; = &lt;i&gt;λc&lt;/i&gt;(&lt;i&gt;u&lt;/i&gt; − &lt;i&gt;k·u&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;Step 4&lt;/span&gt;&lt;p&gt;The public has &lt;b&gt;rational expectations&lt;/b&gt; and anticipates the move: &lt;i&gt;π&lt;sup&gt;e&lt;/sup&gt;&lt;/i&gt; = &lt;i&gt;π&lt;/i&gt;, hence &lt;i&gt;u&lt;/i&gt; = &lt;i&gt;u&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt;. The result is &lt;span class=&quot;formula&quot; style=&quot;display:block&quot;&gt;&lt;i&gt;π&lt;/i&gt;&lt;sup&gt;disc&lt;/sup&gt; = &lt;i&gt;λ c&lt;/i&gt; (1 − &lt;i&gt;k&lt;/i&gt;) &lt;i&gt;u&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt; &amp;gt; 0&lt;/span&gt; This is the &lt;b&gt;inflation bias&lt;/b&gt;: higher inflation with the &lt;b&gt;same&lt;/b&gt; unemployment. A pure loss.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;Step 5&lt;/span&gt;&lt;p&gt;&lt;b&gt;Solution&lt;/b&gt;: entrust monetary policy to a &lt;b&gt;conservative&lt;/b&gt; central bank with a low &lt;i&gt;λ&lt;/i&gt; (an idea attributed to Rogoff, 1985, not cited in the slides), and &lt;b&gt;insulate&lt;/b&gt; it from political pressure. Less weight on unemployment means less bias: independence leads to lower inflation.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← back&lt;/button&gt;&lt;span data-count&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;next →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;Government λ &lt;input type=&quot;range&quot; id=&quot;ib-lg&quot; min=&quot;0&quot; max=&quot;2&quot; step=&quot;0.05&quot; value=&quot;1&quot;&gt;&lt;/label&gt;&lt;label&gt;Conservative ECB λ &lt;input type=&quot;range&quot; id=&quot;ib-lc&quot; min=&quot;0&quot; max=&quot;2&quot; step=&quot;0.05&quot; value=&quot;0.25&quot;&gt;&lt;/label&gt;&lt;label&gt;k &lt;input type=&quot;range&quot; id=&quot;ib-k&quot; min=&quot;0.5&quot; max=&quot;1&quot; step=&quot;0.01&quot; value=&quot;0.8&quot;&gt;&lt;/label&gt;&lt;/div&gt;
&lt;svg id=&quot;ib-svg&quot; viewBox=&quot;0 0 640 200&quot; aria-label=&quot;Inflation bias&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Inflation bias calculator with &lt;i&gt;c&lt;/i&gt; = 1 and &lt;i&gt;u&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt; = 8%. In all cases equilibrium unemployment remains at &lt;i&gt;u&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt;: the extra inflation buys no employment. With &lt;i&gt;k&lt;/i&gt; = 1 (no desire to push below the natural rate) the bias disappears.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;More independent central banks since the 1980s&lt;/h3&gt;
&lt;p&gt;Distribution of an independence index &lt;i&gt;x&lt;/i&gt; between 0 and 1 (Crowe and Meade, 2007; 1980-89 data from Cukierman, Webb and Neyapti, 1992).&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;span class=&quot;tabs&quot; style=&quot;margin:0&quot; id=&quot;cbi-g&quot;&gt;&lt;button class=&quot;btn on&quot; data-g=&quot;0&quot;&gt;All countries&lt;/button&gt;&lt;button class=&quot;btn&quot; data-g=&quot;1&quot;&gt;Advanced&lt;/button&gt;&lt;button class=&quot;btn&quot; data-g=&quot;2&quot;&gt;Emerging and developing&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;
&lt;svg id=&quot;cbi-svg&quot; viewBox=&quot;0 0 640 260&quot; aria-label=&quot;Distribution of central bank independence&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Light bars: 1980-89. Dark bars: 2003. Number of central banks per index class. The mass shifts to the right; in 2003, 28 of 96 banks have &lt;i&gt;x&lt;/i&gt; &amp;gt; 0.8 (none in the 1980s).&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Independence and inflation: correlation or causation?&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg id=&quot;as-svg&quot; viewBox=&quot;0 0 640 330&quot; aria-label=&quot;Independence and average inflation 1955-1988&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Reconstructed from the Alesina and Summers (1993) chart in the slides: independence index (x-axis) and average inflation 1955-1988 (y-axis), 16 OECD countries. Positions are approximate. Germany and Switzerland are the most independent and the least inflationary.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;The &lt;b&gt;negative correlation&lt;/b&gt; is clear, but is it also a &lt;b&gt;causal effect&lt;/b&gt;? There could be &lt;i&gt;endogeneity&lt;/i&gt;: countries that already dislike inflation (such as Germany) create independent central banks, in which case it would be the culture, not the bank, that keeps inflation low. Crowe and Meade (2008; IMF 2008) find that:&lt;/p&gt;
&lt;ol&gt;&lt;li&gt;controlling for &lt;b&gt;country fixed effects&lt;/b&gt; (the time-invariant characteristics of each country), independence &lt;b&gt;reduces&lt;/b&gt; inflation, and the result is robust to controls for endogeneity and measurement error using &lt;b&gt;instrumental variables&lt;/b&gt;;&lt;/li&gt;
&lt;li&gt;greater &lt;b&gt;transparency&lt;/b&gt; leads the private sector to make more use of central bank information in its own forecasts.&lt;/li&gt;&lt;/ol&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 3&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. In the Barro-Gordon model with rational expectations, what does a government gain by using monetary policy to reduce unemployment?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Nothing in terms of employment: the public anticipates the surprise, unemployment stays at the natural rate and all that remains is higher inflation (inflation bias).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. What does it mean for the ECB to be &quot;conservative&quot;?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;It gives price stability more weight than society or the government does (low λ), even at the cost of less stabilisation of output and employment.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Why is the Alesina-Summers correlation alone not enough to prove that independence reduces inflation?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because of endogeneity and omitted variables: countries that are already inflation-averse tend to create independent banks. Crowe and Meade use fixed effects and instrumental variables to estimate the causal effect.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ S4 ============ --&gt;
&lt;section class=&quot;part p-mat&quot; id=&quot;s4&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 4 · slides 22–28&lt;/div&gt;
&lt;h2&gt;Independence and accountability: to whom is the ECB accountable?&lt;/h2&gt;
&lt;p&gt;The ECB was designed to be a &lt;b&gt;VERY&lt;/b&gt; independent institution. But who checks its work?&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Accountability&lt;/b&gt;&lt;br&gt;When the government &lt;b&gt;delegates&lt;/b&gt; a power to the central bank, a corresponding degree of accountability is needed. The government remains fully accountable to &lt;b&gt;voters&lt;/b&gt;, so it cannot delegate without retaining some control over how that power is used. &lt;b&gt;Independence and accountability are parts of the same delegation process.&lt;/b&gt;&lt;/div&gt;

&lt;h3&gt;The ideal «delegation contract»&lt;/h3&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;i&lt;/span&gt;&lt;h4&gt;Define the objectives&lt;/h4&gt;&lt;p&gt;The principal tells the agent &lt;i&gt;what&lt;/i&gt; it must achieve.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;ii&lt;/span&gt;&lt;h4&gt;Monitor performance&lt;/h4&gt;&lt;p&gt;Oversight must be stronger the greater the powers delegated.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;iii&lt;/span&gt;&lt;h4&gt;Decide on renewal&lt;/h4&gt;&lt;p&gt;The principal decides whether or not to renew the contract.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;How it works for the ECB: many powers, but…&lt;/h3&gt;
&lt;div class=&quot;tabset&quot;&gt;
&lt;div class=&quot;tabs&quot;&gt;&lt;button data-tab=&quot;a1&quot; aria-selected=&quot;true&quot;&gt;i · vague objectives&lt;/button&gt;&lt;button data-tab=&quot;a2&quot;&gt;ii · weak oversight&lt;/button&gt;&lt;button data-tab=&quot;a3&quot;&gt;iii · transparency&lt;/button&gt;&lt;/div&gt;
&lt;div data-panel=&quot;a1&quot;&gt;&lt;p&gt;The Treaty&#x27;s objectives are &lt;b&gt;vague&lt;/b&gt;. It is the ECB itself that determines what &quot;price stability&quot; means (see the quantitative definition in &lt;a href=&quot;#s8&quot;&gt;Part 8&lt;/a&gt;), while the other objectives of Art. 3 remain undefined.&lt;/p&gt;&lt;p class=&quot;def&quot;&gt;&lt;b&gt;Criticism:&lt;/b&gt; the delegation contract should give the central bank &lt;b&gt;independence of the instruments&lt;/b&gt; (freedom over &lt;i&gt;how&lt;/i&gt;), but shouldn&#x27;t the &lt;b&gt;objectives&lt;/b&gt; be set by elected politicians?&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;a2&quot; hidden&gt;&lt;p&gt;Governments &lt;b&gt;do not assess&lt;/b&gt; the ECB&#x27;s performance. The ECB reports &lt;b&gt;quarterly&lt;/b&gt; to the European Parliament (the &lt;i&gt;Monetary Dialogues&lt;/i&gt;), but the Parliament has no powers over it. Changing the ECB&#x27;s statute requires an amendment to the Maastricht Treaty, i.e. the &lt;b&gt;unanimity&lt;/b&gt; of all Member States.&lt;/p&gt;&lt;p&gt;In the US, by contrast, the Fed&#x27;s rules can be changed by &lt;b&gt;Congress&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;a3&quot; hidden&gt;&lt;p&gt;The ECB is, however, &lt;b&gt;transparent&lt;/b&gt;: documents and information (Monthly Bulletin), press conferences after Governing Council meetings and, since early &lt;b&gt;2015&lt;/b&gt;, the accounts (&lt;i&gt;minutes&lt;/i&gt;) of monetary policy meetings. This is a form of &lt;b&gt;«informal»&lt;/b&gt; accountability.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;grid2&quot;&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 400 300&quot; aria-label=&quot;Optimal relationship between independence and accountability&quot;&gt;
&lt;line x1=&quot;50&quot; y1=&quot;260&quot; x2=&quot;380&quot; y2=&quot;260&quot; class=&quot;axis&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;260&quot; x2=&quot;50&quot; y2=&quot;20&quot; class=&quot;axis&quot;/&gt;
&lt;text x=&quot;380&quot; y=&quot;285&quot; text-anchor=&quot;end&quot; class=&quot;lbl&quot;&gt;Accountability →&lt;/text&gt;&lt;text x=&quot;18&quot; y=&quot;140&quot; transform=&quot;rotate(-90 18 140)&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;Independence →&lt;/text&gt;
&lt;path d=&quot;M70,240 L360,40&quot; class=&quot;ln c-mat&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;100&quot; font-size=&quot;11&quot; class=&quot;f-mat&quot; transform=&quot;rotate(-34 300 100)&quot;&gt;optimal relationship&lt;/text&gt;
&lt;path d=&quot;M70,240 L360,40 L360,20 L70,20 Z&quot; class=&quot;fb-mat&quot; opacity=&quot;.45&quot;/&gt;
&lt;text x=&quot;140&quot; y=&quot;45&quot; font-size=&quot;11&quot; class=&quot;f-mut&quot;&gt;«too much independence» zone&lt;/text&gt;
&lt;circle cx=&quot;110&quot; cy=&quot;80&quot; r=&quot;6&quot; class=&quot;f-ink&quot;/&gt;&lt;text x=&quot;122&quot; y=&quot;85&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;ECB&lt;/text&gt;
&lt;circle cx=&quot;110&quot; cy=&quot;140&quot; r=&quot;6&quot; class=&quot;f-ink&quot;/&gt;&lt;text x=&quot;122&quot; y=&quot;145&quot; font-size=&quot;13&quot;&gt;Bundesbank&lt;/text&gt;
&lt;circle cx=&quot;230&quot; cy=&quot;170&quot; r=&quot;6&quot; class=&quot;f-ink&quot;/&gt;&lt;text x=&quot;242&quot; y=&quot;175&quot; font-size=&quot;13&quot;&gt;Federal Reserve&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;From the chart in the slides: the Fed lies roughly on the optimal line, while the ECB is well above it (more independent than its accountability would justify).&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div&gt;&lt;h4&gt;What the chart shows&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;The ECB is &lt;b&gt;more independent&lt;/b&gt; than any other major central bank.&lt;/li&gt;&lt;li&gt;Its accountability is &lt;b&gt;weaker&lt;/b&gt; than the Fed&#x27;s.&lt;/li&gt;&lt;li&gt;This runs &lt;b&gt;contrary to theory&lt;/b&gt;, according to which accountability should increase together with independence.&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;A recent study, however, finds that this is not always the case.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Akbik (2026): is the grass really greener on the other side?&lt;/h3&gt;
&lt;p&gt;The study compares parliamentary oversight of the ECB and the Fed during the Covid-19 crisis, through a qualitative analysis of &lt;b&gt;1,014&lt;/b&gt; questions and answers in hearings between March 2020 and March 2022. &lt;b&gt;Result:&lt;/b&gt; over this period the Monetary Dialogues imposed a &lt;b&gt;higher&lt;/b&gt; standard of accountability on the ECB than Congress imposed on the Fed.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 640 230&quot; aria-label=&quot;ECB and Fed responses&quot;&gt;
&lt;g font-size=&quot;12.5&quot;&gt;
&lt;text x=&quot;0&quot; y=&quot;20&quot; font-weight=&quot;600&quot;&gt;Type of response (% of responses)&lt;/text&gt;
&lt;text x=&quot;0&quot; y=&quot;52&quot;&gt;Answerability&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;40&quot; width=&quot;164&quot; height=&quot;16&quot; rx=&quot;3&quot; class=&quot;f-mat&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;53&quot;&gt;ECB 41%&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;60&quot; width=&quot;28&quot; height=&quot;16&quot; rx=&quot;3&quot; class=&quot;f-ard&quot;/&gt;&lt;text x=&quot;154&quot; y=&quot;73&quot;&gt;Fed 7%&lt;/text&gt;
&lt;text x=&quot;0&quot; y=&quot;112&quot;&gt;Transparency&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;100&quot; width=&quot;176&quot; height=&quot;16&quot; rx=&quot;3&quot; class=&quot;f-mat&quot;/&gt;&lt;text x=&quot;302&quot; y=&quot;113&quot;&gt;ECB 44%&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;120&quot; width=&quot;356&quot; height=&quot;16&quot; rx=&quot;3&quot; class=&quot;f-ard&quot;/&gt;&lt;text x=&quot;482&quot; y=&quot;133&quot;&gt;Fed 89%&lt;/text&gt;
&lt;text x=&quot;0&quot; y=&quot;170&quot; font-weight=&quot;600&quot;&gt;Volume:&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;170&quot;&gt;the Fed Chair received 3.4 times as many questions (members of Congress ask short, direct questions)&lt;/text&gt;
&lt;text x=&quot;0&quot; y=&quot;196&quot; font-weight=&quot;600&quot;&gt;ECB topics:&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;196&quot;&gt;unconventional monetary policy 23%, inflation target 22%&lt;/text&gt;
&lt;text x=&quot;0&quot; y=&quot;220&quot; font-weight=&quot;600&quot;&gt;Fed topics:&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;220&quot;&gt;employment and social issues 18%, financial supervision 14%, inflation 13%&lt;/text&gt;
&lt;/g&gt;&lt;/svg&gt;&lt;figcaption&gt;Data from slides 27-28. Answerability: the central bank actually responds and justifies its choices. Transparency: it merely provides information.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;ext&quot;&gt;The Leiden University repository indicates that the article was published online on 22 September 2025 (DOI 10.1080/13563467.2025.2555354). The issue cited in the slides, vol. 31(2), is from 2026. — &lt;a href=&quot;https://scholarlypublications.universiteitleiden.nl/handle/1887/4286377&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Leiden University Scholarly Publications&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 4&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Why are independence and accountability &quot;part of the same process&quot;?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Both stem from delegation: the government entrusts a power to the central bank (independence) but, being accountable to voters, it must be able to monitor how it is used (accountability).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Which of the three elements of the delegation contract are weak in the case of the ECB?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;(i) vague objectives, specified by the ECB itself; (ii) weak oversight: the Parliament listens but has no powers, and changing the statute requires unanimity. Transparency remains as a form of informal accountability.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. What does Akbik add to the picture of a &quot;poorly accountable ECB&quot;?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;That, in the practice of the 2020-22 hearings, the ECB showed more answerability (41% versus 7%) and the European Parliament imposed a higher standard of accountability than Congress did on the Fed.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ S5 ============ --&gt;
&lt;section class=&quot;part p-sal&quot; id=&quot;s5&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 5 · slides 29, 33–43&lt;/div&gt;
&lt;h2&gt;Is the ECB really a «conservative» central bank? The comparison with the Fed&lt;/h2&gt;
&lt;p&gt;The creation of the ECB was dominated by the fear of &lt;b&gt;inflation bias&lt;/b&gt;: hence the idea of a &lt;b&gt;conservative&lt;/b&gt; ECB, which attaches overriding importance to price stability and, if necessary, neglects the stabilisation of output and unemployment. &lt;b&gt;Two questions&lt;/b&gt; remain: (1) does independence really reduce inflation? (covered in &lt;a href=&quot;#s3&quot;&gt;Part 3&lt;/a&gt;: yes); (2) does the ECB really behave more conservatively than the Fed?&lt;/p&gt;

&lt;h3&gt;First test: policy rates&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg id=&quot;rates-svg&quot; viewBox=&quot;0 0 680 300&quot; aria-label=&quot;ECB and Fed policy rates&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Stylised path, reconstructed by eye from the BIS chart on slide 33: values are approximate. In the slide data, over 1999-2021 the standard deviation of the US rate was &lt;b&gt;2%&lt;/b&gt; against &lt;b&gt;1.5%&lt;/b&gt; for the ECB, with similar means (1.9% and 1.8%): the Fed is more &lt;b&gt;activist&lt;/b&gt;.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;ul&gt;&lt;li&gt;The Fed reacted more strongly to the &lt;b&gt;2001&lt;/b&gt; slowdown, keeping rates too low for too long.&lt;/li&gt;&lt;li&gt;It then reacted more sharply to the &lt;b&gt;2004-06&lt;/b&gt; boom and to the &lt;b&gt;2007-08&lt;/b&gt; recession.&lt;/li&gt;&lt;li&gt;After Covid it had room to raise rates as the economy recovered.&lt;/li&gt;&lt;/ul&gt;

&lt;h3&gt;But was the cycle the same? The output gap&lt;/h3&gt;
&lt;p&gt;Comparing rates only makes sense if the euro area and the US were in the same phase of the cycle. The measure of the cyclical position is the &lt;b&gt;output gap&lt;/b&gt;:&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;i&gt;OG&lt;/i&gt; = (&lt;i&gt;GDP&lt;/i&gt; − &lt;i&gt;GDP&lt;sub&gt;pot&lt;/sub&gt;&lt;/i&gt;) / &lt;i&gt;GDP&lt;sub&gt;pot&lt;/sub&gt;&lt;/i&gt;&lt;/div&gt;
&lt;p&gt;&lt;b&gt;Potential GDP&lt;/b&gt;: the GDP attainable with a &lt;b&gt;normal&lt;/b&gt; utilisation of all resources (labour and capital) at the current level of &lt;i&gt;total factor productivity&lt;/i&gt;. It is GDP net of the effects, positive or negative, of the cyclical phase. OG &amp;gt; 0 means an «overheating» economy; OG &amp;lt; 0 means unused resources (slack).&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;GDP &lt;input type=&quot;range&quot; id=&quot;og-y&quot; min=&quot;900&quot; max=&quot;1100&quot; step=&quot;5&quot; value=&quot;970&quot;&gt;&lt;/label&gt;&lt;label&gt;Potential GDP &lt;input type=&quot;range&quot; id=&quot;og-p&quot; min=&quot;900&quot; max=&quot;1100&quot; step=&quot;5&quot; value=&quot;1000&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;out&quot; id=&quot;og-out&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;div class=&quot;tabs&quot; id=&quot;og-tabs&quot;&gt;&lt;button class=&quot;btn on&quot; data-r=&quot;ez&quot;&gt;Euro area&lt;/button&gt;&lt;button class=&quot;btn&quot; data-r=&quot;us&quot;&gt;US&lt;/button&gt;&lt;/div&gt;
&lt;svg id=&quot;og-svg&quot; viewBox=&quot;0 0 680 300&quot; aria-label=&quot;Output gap and short-term rate&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Bars: output gap (% of potential, left scale). Line: short-term rate (%, right scale). Values read from Figures 9.3-9.4 in the slides (original source: OECD &lt;i&gt;Economic Outlook&lt;/i&gt;), hence approximate.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;What we see&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;The ECB &lt;b&gt;reacts&lt;/b&gt; to the output gap, so it gives some weight to output stabilisation.&lt;/li&gt;&lt;li&gt;The Fed reacts &lt;b&gt;more strongly&lt;/b&gt; to falls in the output gap: it gives more weight to output stabilisation.&lt;/li&gt;&lt;li&gt;In this sense the ECB is &lt;b&gt;more conservative&lt;/b&gt; than the Fed.&lt;/li&gt;&lt;li&gt;The Fed may have kept rates too low in 2002-05.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Conclusion (slide 36)&lt;/h4&gt;&lt;p&gt;The ECB attaches more importance to price stability and is more cautious in reacting to the cycle. This does &lt;b&gt;not&lt;/b&gt; mean that the Fed pursued better policies: there is consensus that in &lt;b&gt;2001-04&lt;/b&gt; the Fed&#x27;s policy was too expansionary for too long. It fuelled the housing and consumption boom in the US, which ended spectacularly in &lt;b&gt;2007&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Second test: unconventional measures (QE)&lt;/h3&gt;
&lt;div class=&quot;stepper&quot; id=&quot;qe-step&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1 · legacy of the crisis&lt;/span&gt;&lt;p&gt;After the financial crisis: low inflation, at times &lt;b&gt;deflation&lt;/b&gt; (a generalised fall in prices). In the BIS data in the slides the episodes are 2009, 2015 and 2020. In 2010-17 both the euro area and the US had negative inflation in early 2015.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;2 · zero lower bound&lt;/span&gt;&lt;p&gt;Deflationary pressures pushed nominal rates &lt;b&gt;towards zero&lt;/b&gt;. There the rate can no longer fall much: this is the &lt;b&gt;zero (or effective) lower bound&lt;/b&gt; on interest rates.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;3 · quantitative easing&lt;/span&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Quantitative easing (QE)&lt;/b&gt;&lt;br&gt;An «unconventional» method of stimulus: the central bank &lt;b&gt;purchases large quantities of assets&lt;/b&gt;, including government bonds, to avoid deflation.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;4 · monetary base&lt;/span&gt;&lt;p&gt;In this way the central bank increases liquidity, i.e. the &lt;b&gt;money base&lt;/b&gt; (monetary base): the money created by the central bank, equal to &lt;b&gt;currency in circulation&lt;/b&gt; plus &lt;b&gt;commercial banks&#x27; deposits with the central bank&lt;/b&gt;.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;MB = C + R&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;5 · balance sheet&lt;/span&gt;&lt;p&gt;Effect: the central bank&#x27;s &lt;b&gt;balance sheet&lt;/b&gt; expands. The assets purchased are on the asset side, the reserves created on the liability side. The size of the balance sheet thus becomes an indicator of how aggressive policy has been.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← back&lt;/button&gt;&lt;span data-count&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;next →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg id=&quot;bs-svg&quot; viewBox=&quot;0 0 680 290&quot; aria-label=&quot;ECB and Fed total assets as a percentage of GDP&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Total assets as % of GDP (BIS, slide 42), stylised path and approximate values. Up to 2017 in absolute terms (slide 40): the Fed rises from late 2012 to about 4.5 trillion; the ECB falls in 2013-14 and then rises again to about 4.2 trillion in 2017.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div&gt;&lt;h4&gt;What the balance sheets tell us&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;The contrast is stark: the &lt;b&gt;Fed&lt;/b&gt; was faster and more aggressive, with QE in full swing from late 2012. The &lt;b&gt;ECB&lt;/b&gt;&#x27;s balance sheet, by contrast, &lt;b&gt;shrank in 2013-14&lt;/b&gt;, precisely while inflation was falling.&lt;/li&gt;&lt;li&gt;The ECB launched QE only in &lt;b&gt;2015&lt;/b&gt;. But the contexts differ: in the euro area financing flows mainly through &lt;b&gt;banks&lt;/b&gt;, in the US through &lt;b&gt;financial markets&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;With QE, the ECB&#x27;s assets overtook those of the Fed.&lt;/li&gt;&lt;li&gt;Both expanded QE substantially during the &lt;b&gt;pandemic&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;&lt;svg id=&quot;mix-svg&quot; viewBox=&quot;0 0 330 250&quot; aria-label=&quot;Composition of assets&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Composition of assets at end-2016/early 2017 (Credit Suisse, &lt;i&gt;The future of monetary policy&lt;/i&gt;, 2017, in the slides), approximate values. ABS = &lt;i&gt;asset-backed securities&lt;/i&gt;, securities backed by loans. The ECB holds more loans to banks, consistent with a bank-based system.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 5&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Why is it not enough to compare the levels of ECB and Fed rates to say which one is more conservative?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because the two economies may have been in different phases of the cycle. One has to look at how the rate reacts to the output gap.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Calculate the output gap if GDP is 1,020 and potential GDP is 1,000.&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;OG = (1020 − 1000)/1000 = +2%: the economy is above potential. A central bank would tend to raise rates.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Why does QE expand the central bank&#x27;s balance sheet?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;The central bank pays for the securities purchased by creating reserves (monetary base): assets (securities) and liabilities (bank reserves) grow together.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;4. Give one argument that &quot;justifies&quot; the ECB&#x27;s slowness with QE.&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;In the euro area intermediation is mainly bank-based, so buying securities on the market is less effective than in the US, where financial markets channel funds to the real economy.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ S6 ============ --&gt;
&lt;section class=&quot;part p-ocr&quot; id=&quot;s6&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 6 · slides 44–45&lt;/div&gt;
&lt;h2&gt;Broader responsibilities and new tasks&lt;/h2&gt;
&lt;blockquote&gt;«Central banks have, for example, started acting in the areas of macro- and micro-prudential supervision and crisis management. […] Critical voices claim that central banks have been over-stretching their mandates, blurring or even crossing the line into fiscal and economic policy. […] This has re-opened the debate surrounding the legitimacy, and the precise scope, of central bank independence.» &lt;br&gt;&lt;span class=&quot;src&quot;&gt;— Yves Mersch (ECB Executive Board), «Central bank independence revisited», 2017, quoted in the slides&lt;/span&gt;&lt;/blockquote&gt;
&lt;p&gt;In short: QE and the new functions have &lt;b&gt;distributional effects&lt;/b&gt; (on income and wealth) and may look like a subsidy to the financial sector. These are matters that usually require &lt;b&gt;democratic legitimacy&lt;/b&gt;, which is why the accountability questions of &lt;a href=&quot;#s4&quot;&gt;Part 4&lt;/a&gt; come back.&lt;/p&gt;

&lt;h3&gt;The new tasks after the financial and sovereign debt crises&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Direct prudential supervision&lt;/b&gt; of significant banks&lt;/li&gt;&lt;li&gt;&lt;b&gt;Macroprudential&lt;/b&gt; instruments, in addition to microprudential ones&lt;/li&gt;&lt;li&gt;Participation in &lt;b&gt;crisis management&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Liaison with the Commission in assistance programmes through the &lt;b&gt;ESM&lt;/b&gt; (&lt;i&gt;European Stability Mechanism&lt;/i&gt;) and the &lt;b&gt;EFSF&lt;/b&gt; (&lt;i&gt;European Financial Stability Facility&lt;/i&gt;)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 340 200&quot; aria-label=&quot;Micro- and macroprudential&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;150&quot; height=&quot;180&quot; rx=&quot;12&quot; class=&quot;fb-ocr&quot;/&gt;&lt;rect x=&quot;180&quot; y=&quot;10&quot; width=&quot;150&quot; height=&quot;180&quot; rx=&quot;12&quot; class=&quot;fb-ard&quot;/&gt;
&lt;text x=&quot;85&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Microprudential&lt;/text&gt;&lt;text x=&quot;255&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Macroprudential&lt;/text&gt;
&lt;g class=&quot;c-ocr&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;70&quot; width=&quot;34&quot; height=&quot;34&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;96&quot; y=&quot;70&quot; width=&quot;34&quot; height=&quot;34&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;40&quot; y=&quot;120&quot; width=&quot;34&quot; height=&quot;34&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;96&quot; y=&quot;120&quot; width=&quot;34&quot; height=&quot;34&quot; rx=&quot;4&quot;/&gt;&lt;/g&gt;
&lt;circle cx=&quot;57&quot; cy=&quot;87&quot; r=&quot;24&quot; class=&quot;c-acc&quot; fill=&quot;none&quot; stroke-width=&quot;2&quot;/&gt;
&lt;g class=&quot;c-ard&quot; stroke-width=&quot;2&quot;&gt;&lt;line x1=&quot;226&quot; y1=&quot;87&quot; x2=&quot;284&quot; y2=&quot;87&quot;/&gt;&lt;line x1=&quot;226&quot; y1=&quot;87&quot; x2=&quot;226&quot; y2=&quot;137&quot;/&gt;&lt;line x1=&quot;284&quot; y1=&quot;87&quot; x2=&quot;284&quot; y2=&quot;137&quot;/&gt;&lt;line x1=&quot;226&quot; y1=&quot;137&quot; x2=&quot;284&quot; y2=&quot;137&quot;/&gt;&lt;line x1=&quot;226&quot; y1=&quot;87&quot; x2=&quot;284&quot; y2=&quot;137&quot;/&gt;&lt;/g&gt;
&lt;g class=&quot;f-ard&quot;&gt;&lt;circle cx=&quot;226&quot; cy=&quot;87&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;284&quot; cy=&quot;87&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;226&quot; cy=&quot;137&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;284&quot; cy=&quot;137&quot; r=&quot;9&quot;/&gt;&lt;/g&gt;
&lt;ellipse cx=&quot;255&quot; cy=&quot;112&quot; rx=&quot;62&quot; ry=&quot;50&quot; class=&quot;c-acc&quot; fill=&quot;none&quot; stroke-width=&quot;2&quot;/&gt;
&lt;text x=&quot;85&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;the individual bank&lt;/text&gt;&lt;text x=&quot;255&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;the system as a whole&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;/div&gt;
&lt;p&gt;&lt;b&gt;Microprudential supervision&lt;/b&gt; makes the &lt;b&gt;individual institution&lt;/b&gt; sounder. &lt;b&gt;Macroprudential policy&lt;/b&gt; strengthens resilience to risks arising for the &lt;b&gt;financial system as a whole&lt;/b&gt; (contagion, bubbles, systemic risk). The two functions complement each other, but the mandates for monetary policy, macroprudential policy and microprudential supervision remain &lt;b&gt;separate&lt;/b&gt;. This is the reason for the separate Governing Council meetings seen in &lt;a href=&quot;#s1&quot;&gt;Part 1&lt;/a&gt;.&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;According to the ECB page on its financial stability tasks, the ECB obtained macroprudential instruments when the SSM (&lt;i&gt;Single Supervisory Mechanism&lt;/i&gt;) Regulation entered into force in November 2014. It can impose higher capital buffers than national ones, and national authorities must notify it of their measures in advance. — &lt;a href=&quot;https://www.ecb.europa.eu/ecb/orga/tasks/stability/tasks/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB, Tasks on financial stability and macroprudential policy&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 6&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Distinguish between microprudential supervision and macroprudential policy.&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;The former focuses on the soundness of individual financial institutions, the latter on risks to the financial system as a whole.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Why do the new tasks reopen the debate on independence?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because they touch on areas close to fiscal and economic policy, with distributional effects on income and wealth: areas that usually require greater democratic legitimacy and oversight.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ S7 ============ --&gt;
&lt;section class=&quot;part p-ard&quot; id=&quot;s7&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 7 · slides 46–59&lt;/div&gt;
&lt;h2&gt;National or Union interest? The Governing Council put to the test&lt;/h2&gt;
&lt;p&gt;Economic conditions in euro-area countries may differ because of &lt;b&gt;divergences&lt;/b&gt;, different institutions and &lt;b&gt;asymmetric shocks&lt;/b&gt;, i.e. shocks that hit countries differently (for example a crisis affecting only the periphery). This is the classic problem of &lt;b&gt;optimum currency area&lt;/b&gt; theory: a single interest rate cannot respond to different shocks. Each governor might therefore want a different policy. The questions in the slides: can national interests prevail over those of the Union? Is heterogeneity a risk for decision-making?&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;No weighted voting (qualified voting) in the Governing Council&lt;/b&gt;&lt;br&gt;The reason lies in the Treaty: a vote weighted by country would suggest that members represent national interests. Instead, they must look after the interest of the euro area &lt;b&gt;as a whole&lt;/b&gt;, not that of their country of origin.&lt;/div&gt;

&lt;h3&gt;The voting rotation system&lt;/h3&gt;
&lt;p&gt;To keep the Governing Council able to take decisions even with more countries, the Treaties provided for a &lt;b&gt;rotation system&lt;/b&gt; once the number of governors exceeded 18. &lt;b&gt;Lithuania&#x27;s accession in 2015&lt;/b&gt; triggered it, according to the rules set by the Governing Council in &lt;b&gt;December 2002&lt;/b&gt;.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;div class=&quot;ctrl&quot;&gt;&lt;span class=&quot;tabs&quot; style=&quot;margin:0&quot; id=&quot;rot-cfg&quot;&gt;&lt;button class=&quot;btn on&quot; data-n=&quot;15&quot;&gt;Slide example: 20 Member States&lt;/button&gt;&lt;button class=&quot;btn&quot; data-n=&quot;16&quot;&gt;2026: 21 Member States&lt;/button&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; id=&quot;rot-next&quot;&gt;Next month ↻&lt;/button&gt;&lt;span id=&quot;rot-m&quot; class=&quot;pill&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;svg id=&quot;rot-svg&quot; viewBox=&quot;0 0 640 330&quot; aria-label=&quot;Voting rotation in the Governing Council&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Filled = votes this month; empty = attends and speaks, but does not vote. The monthly sequence is &lt;b&gt;simplified&lt;/b&gt; for illustrative purposes: the actual schedule is published by the ECB.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Two groups, similar rights&lt;/h4&gt;&lt;p&gt;Group 1, the five «largest» countries (DE, FR, IT, ES, NL): 4 votes for 5 governors, &lt;b&gt;4/5 = 0.8&lt;/b&gt;.&lt;br&gt;Group 2, the others: 11 votes for 15 governors, &lt;b&gt;11/15 = 0.73&lt;/b&gt;.&lt;br&gt;With the 6 permanent votes of the Executive Board, the total is &lt;b&gt;21 votes&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Comparison with the FOMC&lt;/h4&gt;&lt;p&gt;The Fed&#x27;s FOMC works in a similar way: 12 voting members, of whom 7 from the Board (the slides say «appointed by Congress»; more precisely, they are nominated by the US President and confirmed by the Senate) with a permanent vote, and 5 rotating representatives of the regional Reserve Banks. The rotation is &lt;b&gt;annual&lt;/b&gt;, not monthly as at the ECB.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;According to the ECB&#x27;s explainer on rotation, after Bulgaria joined in 2026 there are 21 governors, and the 16 in group 2 share 11 votes: 11/16 ≈ 0.69. Non-voting governors still take part in the discussions. — &lt;a href=&quot;https://www.ecb.europa.eu/explainers/tell-me-more/html/voting-rotation.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB Explainers, voting rotation&lt;/a&gt;&lt;/div&gt;

&lt;h3&gt;What rate would each country want? The Taylor rule&lt;/h3&gt;
&lt;p&gt;To measure how far apart preferences are, we need an estimate of the rate each country would «desire» if it were independent. The tool is the &lt;b&gt;Taylor rule&lt;/b&gt; (John Taylor, 1993, &lt;i&gt;Discretion versus policy rules in practice&lt;/i&gt;). In the original version:&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;i&gt;r&lt;/i&gt; = &lt;i&gt;p&lt;/i&gt; + 0.5&lt;i&gt;y&lt;/i&gt; + 0.5(&lt;i&gt;p&lt;/i&gt; − 2) + 2&lt;/div&gt;
&lt;p&gt;&lt;i&gt;r&lt;/i&gt; = &lt;b&gt;federal funds rate&lt;/b&gt; (the rate at which banks lend excess reserves to each other overnight, targeted by the FOMC); &lt;i&gt;p&lt;/i&gt; = inflation over the previous four quarters; &lt;i&gt;y&lt;/i&gt; = 100(&lt;i&gt;Y&lt;/i&gt; − &lt;i&gt;Y&lt;/i&gt;*)/&lt;i&gt;Y&lt;/i&gt;* = percentage deviation of real GDP from trend (which was 2.2% per year in 1984-92); the final &lt;b&gt;2&lt;/b&gt; is the &lt;b&gt;long-run real interest rate&lt;/b&gt;. Taylor shows that this «policy rule» tracks the federal funds rate of 1987-1992 very closely.&lt;/p&gt;
&lt;p&gt;General form used in the course:&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;i&gt;r&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;* = &lt;i&gt;ρ&lt;/i&gt; + &lt;i&gt;π&lt;/i&gt; + &lt;i&gt;a&lt;/i&gt;(&lt;i&gt;π&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; − &lt;i&gt;π&lt;/i&gt;*) + &lt;i&gt;b x&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/div&gt;
&lt;p&gt;&lt;i&gt;r&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;* desired rate; &lt;i&gt;ρ&lt;/i&gt; long-run real interest rate; &lt;i&gt;π&lt;/i&gt;* inflation target; &lt;i&gt;x&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; output gap; &lt;i&gt;a&lt;/i&gt;, &lt;i&gt;b&lt;/i&gt; are the weights given to inflation and the cycle.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;π (%) &lt;input type=&quot;range&quot; id=&quot;tr-pi&quot; min=&quot;-1&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;2&quot;&gt;&lt;/label&gt;
&lt;label&gt;output gap x (%) &lt;input type=&quot;range&quot; id=&quot;tr-x&quot; min=&quot;-6&quot; max=&quot;4&quot; step=&quot;0.1&quot; value=&quot;0&quot;&gt;&lt;/label&gt;
&lt;label&gt;a &lt;input type=&quot;range&quot; id=&quot;tr-a&quot; min=&quot;0&quot; max=&quot;2&quot; step=&quot;0.1&quot; value=&quot;0.5&quot;&gt;&lt;/label&gt;
&lt;label&gt;b &lt;input type=&quot;range&quot; id=&quot;tr-b&quot; min=&quot;0&quot; max=&quot;2&quot; step=&quot;0.1&quot; value=&quot;0.5&quot;&gt;&lt;/label&gt;
&lt;span&gt;&lt;button class=&quot;btn&quot; id=&quot;tr-p1&quot;&gt;Taylor 1993 (a=b=0.5)&lt;/button&gt; &lt;button class=&quot;btn&quot; id=&quot;tr-p2&quot;&gt;Table 9.1 (a=1.5, b=0.5)&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;
&lt;svg id=&quot;tr-svg&quot; viewBox=&quot;0 0 640 120&quot; aria-label=&quot;Decomposition of the Taylor rule&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;out&quot; id=&quot;tr-out&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;With ρ = 2% and π* = 2%. Try a strongly negative output gap: the rule may call for &lt;b&gt;negative&lt;/b&gt; rates, and this is where the lower bound comes into play (&lt;a href=&quot;#s8&quot;&gt;Part 8&lt;/a&gt;).&lt;/figcaption&gt;&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;Why is the total coefficient on inflation greater than 1?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Inflation enters the rule twice: with coefficient 1 and with &lt;i&gt;a&lt;/i&gt;. If inflation rises by 1 point, the nominal rate rises by 1 + &lt;i&gt;a&lt;/i&gt; &amp;gt; 1 points, so the &lt;b&gt;real&lt;/b&gt; rate rises and slows the economy down. This is the so-called &lt;i&gt;Taylor principle&lt;/i&gt; (additional explanation, not in the slides).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;2010: very different desired rates (Table 9.1)&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;div class=&quot;ctrl&quot;&gt;&lt;span class=&quot;tabs&quot; style=&quot;margin:0&quot; id=&quot;dr-t&quot;&gt;&lt;button class=&quot;btn on&quot; data-eb=&quot;1&quot;&gt;With Executive Board&lt;/button&gt;&lt;button class=&quot;btn&quot; data-eb=&quot;0&quot;&gt;Without Executive Board&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;
&lt;svg id=&quot;dr-svg&quot; viewBox=&quot;0 0 680 300&quot; aria-label=&quot;Desired rates and country weights&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;out&quot; id=&quot;dr-out&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Assumptions: a = 1.5, b = 0.5, ρ = 2%, π* = 2%. Vertical axis: relative economic weight of the country. The Executive Board (6 votes) is placed at the «area-wide» rate of 1.41%.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Desired rate range&lt;/th&gt;&lt;th&gt;&amp;lt; 1&lt;/th&gt;&lt;th&gt;1–1.5&lt;/th&gt;&lt;th&gt;1.5–2&lt;/th&gt;&lt;th&gt;2–2.5&lt;/th&gt;&lt;th&gt;&amp;gt; 2.5&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Votes without EB&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Votes with EB&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;&lt;b&gt;8&lt;/b&gt;&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Median voter theory&lt;/h4&gt;&lt;p&gt;With majority voting on a single variable (the rate), the winning proposal is the one preferred by the &lt;b&gt;median voter&lt;/b&gt;, the one with half of the voters to their left and half to their right. This holds only if preferences are &lt;b&gt;single-peaked&lt;/b&gt;. With a &lt;b&gt;multimodal&lt;/b&gt; distribution, i.e. with several separate clusters, the majority may be unstable or driven by national interests.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;The strategic role of the Executive Board&lt;/h4&gt;&lt;p&gt;Without the EB there would be &lt;b&gt;three groups of equal weight&lt;/b&gt; (3, 3, 3 votes): a problematic majority choice. With the EB&#x27;s 6 votes concentrated around the area-wide rate, the distribution becomes unimodal and the &lt;b&gt;median coincides&lt;/b&gt; with the EB&#x27;s position (1.41). The EB brings in the interest of the euro area as a whole and stays in control even when shocks are asymmetric.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The crisis reversed the divergences (Nechio, 2011)&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Before 2008&lt;/h4&gt;&lt;p&gt;The ECB&#x27;s actual rate was &lt;b&gt;below&lt;/b&gt; the one suggested by the Taylor rule for the &lt;b&gt;periphery&lt;/b&gt; (high inflation and growth) and close to the one for the &lt;b&gt;core&lt;/b&gt;. For the periphery, policy was therefore too expansionary.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;After 2008&lt;/h4&gt;&lt;p&gt;The periphery enters a deep recession, then the debt crisis; the core recovers better. For the periphery the Taylor rule calls for strongly &lt;b&gt;negative&lt;/b&gt; rates (down to about −5% in 2009-10), and the ECB rate ends up &lt;b&gt;above&lt;/b&gt; the recommendation. Now policy is too restrictive for the periphery.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Rule used by Nechio: Target = 1 + 1.5 × Inflation − 1 × Unemployment gap (source: FRBSF Economic Letter, OECD and Eurostat data).&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 7&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Why is there no country-weighted voting in the Governing Council?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because it would suggest that members represent national interests, whereas they must decide in the interest of the euro area as a whole.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. With ρ = 2, π = 3, π* = 2, x = −1, a = 0.5, b = 0.5, what is the desired rate?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;r* = 2 + 3 + 0.5·(3−2) + 0.5·(−1) = 2 + 3 + 0.5 − 0.5 = 5%.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Calculate the median of the 12 desired rates in Table 9.1 without the Executive Board, and then with the EB.&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Without the EB (12 votes) the median falls between the 6th and 7th values: (1.57 + 1.59)/2 ≈ 1.58. With the EB (18 votes, 6 of which at 1.41) the 9th and 10th values are both 1.41: the median coincides with the EB&#x27;s position.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;4. Why does the rotation give «similar» rights to the two groups?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because the share of time during which they vote is close: 4/5 = 0.8 for the large countries and 11/15 ≈ 0.73 for the others.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ S8 ============ --&gt;
&lt;section class=&quot;part p-mat&quot; id=&quot;s8&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Part 8 · slides 60–72&lt;/div&gt;
&lt;h2&gt;The ECB&#x27;s monetary policy strategy&lt;/h2&gt;
&lt;h3&gt;Three principles shared in the 1990s&lt;/h3&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;1 · Independence, delegation, accountability&lt;/h4&gt;&lt;p&gt;The topic of Parts 2-4.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;2 · Price stability&lt;/h4&gt;&lt;p&gt;It should be given prominence, preferably expressed in &lt;b&gt;measurable&lt;/b&gt; terms.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;3 · Broader strategy&lt;/h4&gt;&lt;p&gt;It explains &lt;u&gt;how&lt;/u&gt; the central bank intends to pursue its objectives, including how it &lt;u&gt;communicates to the public&lt;/u&gt; its assessment of the economy and the policy stance.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;timeline&quot;&gt;
&lt;div&gt;&lt;b&gt;Oct. 1998&lt;/b&gt;First strategy, adopted by the Governing Council&lt;/div&gt;
&lt;div&gt;&lt;b&gt;May 2003&lt;/b&gt;First review&lt;/div&gt;
&lt;div&gt;&lt;b&gt;8 Jul. 2021&lt;/b&gt;Second review&lt;/div&gt;
&lt;div&gt;&lt;b&gt;30 Jun. 2025&lt;/b&gt;&lt;span class=&quot;note&quot;&gt;Strategy assessment (external source, see below)&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;&lt;b&gt;Ingredients&lt;/b&gt; of a strategy: (1) the definition of the objectives; (2) the time horizon; (3) the instruments; (4) the information used in the analysis, i.e. the role of a reference value for money growth, other data and a broad assessment of the outlook for prices.&lt;/p&gt;

&lt;h3&gt;The objective: three versions of «price stability»&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;div class=&quot;tabs&quot; id=&quot;tg-t&quot;&gt;&lt;button class=&quot;btn on&quot; data-v=&quot;0&quot;&gt;1998&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;1&quot;&gt;2003&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;2&quot;&gt;2021&lt;/button&gt;&lt;/div&gt;
&lt;svg id=&quot;tg-svg&quot; viewBox=&quot;0 0 640 220&quot; aria-label=&quot;Definitions of the inflation target&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;out&quot; id=&quot;tg-out&quot;&gt;&lt;/div&gt;&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;What the HICP is and what changes with owner-occupied housing&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;The &lt;b&gt;HICP&lt;/b&gt; (&lt;i&gt;Harmonised Index of Consumer Prices&lt;/i&gt;) is the consumer price index compiled with the same methodology in all EU countries. According to the 2021 review, it remains the appropriate index for measuring euro-area inflation for monetary policy purposes.&lt;/p&gt;
