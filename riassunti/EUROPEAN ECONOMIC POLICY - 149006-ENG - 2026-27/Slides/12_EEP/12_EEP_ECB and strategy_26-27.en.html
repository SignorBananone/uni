&lt;p&gt;The Governing Council has, however, proposed including &lt;b&gt;owner-occupied housing (OOH)&lt;/b&gt;, i.e. the costs of the home one owns and lives in. The measure is based on the transaction prices paid by households to buy a home, separating the &lt;b&gt;investment&lt;/b&gt; component from the &lt;b&gt;consumption&lt;/b&gt; component and considering only the latter. Euro-area inflation can be tracked on the ECB&#x27;s HICP page (link in the slides).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why the «medium term»?&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;For the ECB, the medium term «reflects the need for monetary policy to be forward-looking» and recognises that there is short-term price volatility that monetary policy cannot control. Policy operates with &lt;b&gt;lags&lt;/b&gt;, so it must look ahead.&lt;/p&gt;
&lt;p&gt;In this way the ECB seeks to control inflation &lt;b&gt;while minimising the costs to output and employment&lt;/b&gt;. It is a «gradualist policy rule»: the medium term implicitly leaves room for stabilising the cycle.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;The instruments&lt;/h3&gt;
&lt;p&gt;The instruments used since the financial crisis have proved effective against disinflationary pressures and remain part of the toolkit near the &lt;b&gt;effective lower bound&lt;/b&gt;.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Key ECB rates&lt;/h4&gt;&lt;p&gt;The main instrument. There are three rates: the deposit facility, the main refinancing operations and the marginal lending facility (detail added, not in the slides). They can also go &lt;b&gt;below zero&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Forward guidance&lt;/h4&gt;&lt;p&gt;Communication about the future path of rates, which steers expectations and hence long-term rates.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Asset purchases&lt;/h4&gt;&lt;p&gt;Purchases of securities (QE, &lt;a href=&quot;#s5&quot;&gt;Part 5&lt;/a&gt;) to compress long-term yields.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Longer-term refinancing operations&lt;/h4&gt;&lt;p&gt;Long-term loans to banks, crucial in a system where credit flows through banks.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Asymmetry of the lower bound&lt;/b&gt;&lt;br&gt;Central banks can, at least in theory, raise nominal rates without limit, but they can lower them below zero only slightly. Unless addressed, this constraint leads to &lt;b&gt;persistent downward deviations&lt;/b&gt; of inflation from the target, especially when the economy is hit by repeated disinflationary shocks. This is one of the reasons for the symmetric target.&lt;/div&gt;

&lt;h3&gt;The role of fiscal policy (according to the ECB)&lt;/h3&gt;
&lt;p&gt;Fiscal and other policies are important for stabilisation, especially near the lower bound. A &lt;b&gt;countercyclical&lt;/b&gt; fiscal policy requires decisive action in severe recessions and, once the recovery is firmly established, the rebuilding of fiscal buffers to ensure debt sustainability. In this way it &lt;b&gt;enhances the effectiveness&lt;/b&gt; of monetary policy.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;In normal times&lt;/h4&gt;&lt;p&gt;It is mainly the &lt;b&gt;automatic stabilisers&lt;/b&gt; that operate: taxes that fall and unemployment benefits that rise on their own during a recession.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;In a crisis, at the lower bound&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Discretionary measures&lt;/b&gt; are needed, i.e. countercyclical fiscal measures deliberately adopted by the government.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;div class=&quot;tabset&quot;&gt;&lt;div class=&quot;tabs&quot;&gt;&lt;button data-tab=&quot;n&quot; aria-selected=&quot;true&quot;&gt;Normal circumstances&lt;/button&gt;&lt;button data-tab=&quot;z&quot;&gt;Crisis: zero lower bound&lt;/button&gt;&lt;/div&gt;
&lt;div data-panel=&quot;n&quot;&gt;&lt;svg viewBox=&quot;0 0 340 280&quot; aria-label=&quot;IS-LM in normal circumstances&quot;&gt;
&lt;line x1=&quot;40&quot; y1=&quot;240&quot; x2=&quot;330&quot; y2=&quot;240&quot; class=&quot;axis&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;240&quot; x2=&quot;40&quot; y2=&quot;20&quot; class=&quot;axis&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;262&quot; text-anchor=&quot;end&quot; class=&quot;lbl&quot;&gt;Output&lt;/text&gt;&lt;text x=&quot;44&quot; y=&quot;18&quot; class=&quot;lbl&quot;&gt;Interest rate&lt;/text&gt;
&lt;path d=&quot;M40,185 L100,185 L280,45&quot; class=&quot;ln c-ard&quot;/&gt;&lt;text x=&quot;284&quot; y=&quot;44&quot; font-size=&quot;12&quot;&gt;LM&lt;/text&gt;
&lt;path d=&quot;M40,205 L150,205 L300,88&quot; class=&quot;ln c-ard dash&quot;/&gt;&lt;text x=&quot;302&quot; y=&quot;86&quot; font-size=&quot;12&quot;&gt;LM&#x27;&lt;/text&gt;
&lt;path d=&quot;M60,70 L260,220&quot; class=&quot;ln c-mat&quot;/&gt;&lt;text x=&quot;262&quot; y=&quot;232&quot; font-size=&quot;12&quot;&gt;IS&lt;/text&gt;
&lt;path d=&quot;M110,50 L310,200&quot; class=&quot;ln c-mat dash&quot;/&gt;&lt;text x=&quot;312&quot; y=&quot;200&quot; font-size=&quot;12&quot;&gt;IS&#x27;&lt;/text&gt;
&lt;g class=&quot;c-mut dash thin&quot;&gt;&lt;line x1=&quot;155.6&quot; y1=&quot;141.7&quot; x2=&quot;155.6&quot; y2=&quot;240&quot;/&gt;&lt;line x1=&quot;194.1&quot; y1=&quot;170.6&quot; x2=&quot;194.1&quot; y2=&quot;240&quot;/&gt;&lt;line x1=&quot;231.7&quot; y1=&quot;141.3&quot; x2=&quot;231.7&quot; y2=&quot;240&quot;/&gt;&lt;/g&gt;
&lt;line x1=&quot;156&quot; y1=&quot;252&quot; x2=&quot;190&quot; y2=&quot;252&quot; class=&quot;c-mat&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;line x1=&quot;156&quot; y1=&quot;270&quot; x2=&quot;228&quot; y2=&quot;270&quot; class=&quot;c-sal&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
&lt;text x=&quot;60&quot; y=&quot;256&quot; font-size=&quot;10.5&quot; class=&quot;f-mat&quot;&gt;monetary only&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;274&quot; font-size=&quot;10.5&quot; class=&quot;f-sal&quot;&gt;monetary + fiscal&lt;/text&gt;
&lt;/svg&gt;&lt;p class=&quot;cap&quot;&gt;A shift of the LM curve (expansionary monetary policy) increases output. If the IS curve also shifts (countercyclical fiscal policy), the effect is much larger: the effectiveness of monetary policy is &lt;b&gt;amplified&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;z&quot; hidden&gt;&lt;svg viewBox=&quot;0 0 340 280&quot; aria-label=&quot;IS-LM at the zero lower bound&quot;&gt;
&lt;line x1=&quot;40&quot; y1=&quot;240&quot; x2=&quot;330&quot; y2=&quot;240&quot; class=&quot;axis&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;240&quot; x2=&quot;40&quot; y2=&quot;20&quot; class=&quot;axis&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;262&quot; text-anchor=&quot;end&quot; class=&quot;lbl&quot;&gt;Output&lt;/text&gt;&lt;text x=&quot;44&quot; y=&quot;18&quot; class=&quot;lbl&quot;&gt;Interest rate&lt;/text&gt;
&lt;line x1=&quot;40&quot; y1=&quot;228&quot; x2=&quot;330&quot; y2=&quot;228&quot; class=&quot;c-mut dash thin&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;224&quot; font-size=&quot;10&quot; class=&quot;f-mut&quot;&gt;ZLB&lt;/text&gt;
&lt;path d=&quot;M40,200 L200,200 L300,90&quot; class=&quot;ln c-ard&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;86&quot; font-size=&quot;12&quot;&gt;LM&lt;/text&gt;
&lt;path d=&quot;M40,202 L245,202 L320,125&quot; class=&quot;ln c-ard dash&quot;/&gt;&lt;text x=&quot;318&quot; y=&quot;120&quot; font-size=&quot;12&quot;&gt;LM&#x27;&lt;/text&gt;
&lt;path d=&quot;M50,110 L190,225&quot; class=&quot;ln c-mat&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;104&quot; font-size=&quot;12&quot;&gt;IS&lt;/text&gt;
&lt;path d=&quot;M90,100 L230,215&quot; class=&quot;ln c-mat dash&quot;/&gt;&lt;text x=&quot;92&quot; y=&quot;94&quot; font-size=&quot;12&quot;&gt;IS&#x27;&lt;/text&gt;
&lt;g class=&quot;c-mut dash thin&quot;&gt;&lt;line x1=&quot;159.6&quot; y1=&quot;200&quot; x2=&quot;159.6&quot; y2=&quot;240&quot;/&gt;&lt;line x1=&quot;211.8&quot; y1=&quot;200&quot; x2=&quot;211.8&quot; y2=&quot;240&quot;/&gt;&lt;/g&gt;
&lt;line x1=&quot;160&quot; y1=&quot;256&quot; x2=&quot;208&quot; y2=&quot;256&quot; class=&quot;c-sal&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;260&quot; font-size=&quot;10.5&quot; class=&quot;f-sal&quot;&gt;only fiscal policy moves output&lt;/text&gt;
&lt;/svg&gt;&lt;p class=&quot;cap&quot;&gt;At the lower bound the LM curve is &lt;b&gt;flat&lt;/b&gt; (&lt;i&gt;liquidity trap&lt;/i&gt;): shifting it does not change the equilibrium, because the rate cannot fall. Only a shift of the IS curve (fiscal policy) increases output.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/figure&gt;

&lt;h3&gt;Demand shocks and supply shocks&lt;/h3&gt;
&lt;p&gt;With price stability as the priority, output is stabilised &lt;b&gt;only if the shock is a demand shock&lt;/b&gt;. With a supply shock the strategy stabilises prices &lt;b&gt;at the expense of output&lt;/b&gt;: the hierarchy of objectives reaffirmed by the ECB then becomes binding in substance.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;div class=&quot;tabset&quot;&gt;&lt;div class=&quot;tabs&quot;&gt;&lt;button data-tab=&quot;d&quot; aria-selected=&quot;true&quot;&gt;Demand shock&lt;/button&gt;&lt;button data-tab=&quot;s&quot;&gt;Supply shock&lt;/button&gt;&lt;/div&gt;
&lt;div data-panel=&quot;d&quot;&gt;&lt;svg viewBox=&quot;0 0 340 260&quot; aria-label=&quot;Demand shock&quot;&gt;
&lt;line x1=&quot;30&quot; y1=&quot;230&quot; x2=&quot;330&quot; y2=&quot;230&quot; class=&quot;axis&quot;/&gt;&lt;line x1=&quot;30&quot; y1=&quot;230&quot; x2=&quot;30&quot; y2=&quot;20&quot; class=&quot;axis&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;250&quot; text-anchor=&quot;end&quot; class=&quot;lbl&quot;&gt;Output&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;16&quot; class=&quot;lbl&quot;&gt;Price level&lt;/text&gt;
&lt;path d=&quot;M60,220 L280,60&quot; class=&quot;ln c-ard&quot;/&gt;&lt;text x=&quot;283&quot; y=&quot;58&quot; font-size=&quot;12&quot;&gt;AS&lt;/text&gt;
&lt;path d=&quot;M80,70 L290,220&quot; class=&quot;ln c-mat&quot;/&gt;&lt;text x=&quot;292&quot; y=&quot;222&quot; font-size=&quot;12&quot;&gt;AD&lt;/text&gt;
&lt;path d=&quot;M30,105 L240,255&quot; class=&quot;ln c-mat dash&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;250&quot; font-size=&quot;12&quot;&gt;AD&#x27;&lt;/text&gt;
&lt;circle cx=&quot;174&quot; cy=&quot;137&quot; r=&quot;5&quot; class=&quot;f-ink&quot;/&gt;&lt;circle cx=&quot;149&quot; cy=&quot;155&quot; r=&quot;5&quot; class=&quot;f-acc&quot;/&gt;
&lt;line x1=&quot;174&quot; y1=&quot;137&quot; x2=&quot;174&quot; y2=&quot;230&quot; class=&quot;c-mut dash thin&quot;/&gt;&lt;text x=&quot;174&quot; y=&quot;244&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; class=&quot;f-mut&quot;&gt;normal output&lt;/text&gt;
&lt;/svg&gt;&lt;p class=&quot;cap&quot;&gt;AD falls: &lt;b&gt;both prices and output&lt;/b&gt; decline. A policy that brings prices back to their initial level (lower rates) also brings output back up. No conflict.&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;s&quot; hidden&gt;&lt;svg viewBox=&quot;0 0 340 260&quot; aria-label=&quot;Supply shock&quot;&gt;
&lt;line x1=&quot;30&quot; y1=&quot;230&quot; x2=&quot;330&quot; y2=&quot;230&quot; class=&quot;axis&quot;/&gt;&lt;line x1=&quot;30&quot; y1=&quot;230&quot; x2=&quot;30&quot; y2=&quot;20&quot; class=&quot;axis&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;250&quot; text-anchor=&quot;end&quot; class=&quot;lbl&quot;&gt;Output&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;16&quot; class=&quot;lbl&quot;&gt;Price level&lt;/text&gt;
&lt;path d=&quot;M60,220 L280,60&quot; class=&quot;ln c-ard&quot;/&gt;&lt;text x=&quot;283&quot; y=&quot;58&quot; font-size=&quot;12&quot;&gt;AS&lt;/text&gt;
&lt;path d=&quot;M30,198 L250,38&quot; class=&quot;ln c-ard dash&quot;/&gt;&lt;text x=&quot;252&quot; y=&quot;36&quot; font-size=&quot;12&quot;&gt;AS&#x27;&lt;/text&gt;
&lt;path d=&quot;M80,70 L290,220&quot; class=&quot;ln c-mat&quot;/&gt;&lt;text x=&quot;292&quot; y=&quot;222&quot; font-size=&quot;12&quot;&gt;AD&lt;/text&gt;
&lt;circle cx=&quot;174&quot; cy=&quot;137&quot; r=&quot;5&quot; class=&quot;f-ink&quot;/&gt;&lt;circle cx=&quot;143.7&quot; cy=&quot;115.5&quot; r=&quot;5&quot; class=&quot;f-acc&quot;/&gt;
&lt;line x1=&quot;174&quot; y1=&quot;137&quot; x2=&quot;174&quot; y2=&quot;230&quot; class=&quot;c-mut dash thin&quot;/&gt;&lt;text x=&quot;174&quot; y=&quot;244&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; class=&quot;f-mut&quot;&gt;normal output&lt;/text&gt;
&lt;/svg&gt;&lt;p class=&quot;cap&quot;&gt;AS shifts to the left (for example because of higher energy prices): &lt;b&gt;prices rise&lt;/b&gt; and &lt;b&gt;output falls&lt;/b&gt;. To bring prices back down, demand must be compressed further, and output falls even more. There is a conflict.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/figure&gt;

&lt;h4&gt;How the strategy handles a negative supply shock&lt;/h4&gt;
&lt;div class=&quot;stepper&quot; id=&quot;ss-step&quot;&gt;
&lt;svg viewBox=&quot;0 0 340 260&quot; style=&quot;max-width:420px;width:100%;display:block&quot; aria-label=&quot;ECB response to a supply shock&quot;&gt;
&lt;line x1=&quot;30&quot; y1=&quot;230&quot; x2=&quot;330&quot; y2=&quot;230&quot; class=&quot;axis&quot;/&gt;&lt;line x1=&quot;30&quot; y1=&quot;230&quot; x2=&quot;30&quot; y2=&quot;20&quot; class=&quot;axis&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;250&quot; text-anchor=&quot;end&quot; class=&quot;lbl&quot;&gt;Y&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;16&quot; class=&quot;lbl&quot;&gt;p&lt;/text&gt;
&lt;line x1=&quot;30&quot; y1=&quot;137&quot; x2=&quot;330&quot; y2=&quot;137&quot; class=&quot;c-mut dash thin&quot;/&gt;&lt;text x=&quot;10&quot; y=&quot;141&quot; font-size=&quot;11&quot;&gt;p*&lt;/text&gt;
&lt;path d=&quot;M60,220 L280,60&quot; class=&quot;ln c-ard&quot;/&gt;&lt;path d=&quot;M80,70 L290,220&quot; class=&quot;ln c-mat&quot;/&gt;&lt;circle cx=&quot;174&quot; cy=&quot;137&quot; r=&quot;5&quot; class=&quot;f-ink&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;132&quot; font-size=&quot;11&quot;&gt;Y*&lt;/text&gt;
&lt;g data-show=&quot;2 3 4&quot;&gt;&lt;path d=&quot;M30,198 L250,38&quot; class=&quot;ln c-ard dash&quot;/&gt;&lt;text x=&quot;252&quot; y=&quot;36&quot; font-size=&quot;12&quot;&gt;AS&#x27;&lt;/text&gt;&lt;circle cx=&quot;143.7&quot; cy=&quot;115.5&quot; r=&quot;5&quot; class=&quot;f-acc&quot;/&gt;&lt;/g&gt;
&lt;g data-show=&quot;3&quot;&gt;&lt;path d=&quot;M40,84 L250,234&quot; class=&quot;ln c-mat dash&quot;/&gt;&lt;circle cx=&quot;114&quot; cy=&quot;137&quot; r=&quot;6&quot; class=&quot;f-mat&quot;/&gt;&lt;line x1=&quot;114&quot; y1=&quot;137&quot; x2=&quot;114&quot; y2=&quot;230&quot; class=&quot;c-mat thin&quot;/&gt;&lt;text x=&quot;118&quot; y=&quot;226&quot; font-size=&quot;10&quot; class=&quot;f-mat&quot;&gt;sharp fall in Y&lt;/text&gt;&lt;/g&gt;
&lt;g data-show=&quot;4&quot;&gt;&lt;path d=&quot;M60,74 L270,224&quot; class=&quot;ln c-sal dash&quot;/&gt;&lt;circle cx=&quot;130&quot; cy=&quot;125.5&quot; r=&quot;6&quot; class=&quot;f-sal&quot;/&gt;&lt;line x1=&quot;130&quot; y1=&quot;125.5&quot; x2=&quot;130&quot; y2=&quot;230&quot; class=&quot;c-sal thin&quot;/&gt;&lt;text x=&quot;134&quot; y=&quot;226&quot; font-size=&quot;10&quot; class=&quot;f-sal&quot;&gt;moderate fall&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1&lt;/span&gt; Initial equilibrium: prices at p*, output at its normal level Y*.&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;2&lt;/span&gt; Negative supply shock: AS → AS&#x27;. Prices rise above p* and output falls.&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;3&lt;/span&gt; «Aggressive» response: the ECB tightens immediately to bring prices back to p*. AD shifts far to the left and output collapses.&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;4&lt;/span&gt; The strategy&#x27;s response: the Governing Council can &lt;b&gt;lengthen the horizon&lt;/b&gt; over which inflation returns to target. This avoids sharp falls in activity and employment, which, if persistent, could &lt;b&gt;in turn&lt;/b&gt; threaten price stability in the medium term.&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← back&lt;/button&gt;&lt;span data-count&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;next →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Note from the slides: the &lt;b&gt;gradual&lt;/b&gt; response of interest rates, consistent with the objective of stability over the &lt;b&gt;medium term&lt;/b&gt;, is the way in which the ECB also takes output into account and avoids anti-inflationary policies that would be too restrictive for aggregate demand.&lt;/p&gt;

&lt;h3&gt;Climate change&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;p&gt;The primary responsibility and the tools for tackling climate change lie with &lt;b&gt;governments&lt;/b&gt;. But the ECB&#x27;s mandate requires it to assess its impact and to incorporate climate considerations into its policies.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Why?&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Physical risks&lt;/b&gt; (damage from climate events) and &lt;b&gt;transition risks&lt;/b&gt; (costs of the shift to a low-carbon economy) affect both &lt;b&gt;price stability&lt;/b&gt; and &lt;b&gt;financial stability&lt;/b&gt;. They also change the value and risk profile of the assets on the Eurosystem&#x27;s balance sheet.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;On 30 June 2025 the ECB published the outcome of its strategy assessment: all instruments remain available, their use is subject to a proportionality assessment, and the next assessment is planned for 2030. The symmetric 2% medium-term target has been confirmed since 2021. — &lt;a href=&quot;https://www.ecb.europa.eu/press/pr/date/2025/html/ecb.pr250630~aabf988af8.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB, press release of 30/06/2025&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Part 8&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. How did the definition of price stability change from 1998 to 2021?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;1998: a year-on-year increase in the HICP below 2% over the medium term (a clear ceiling, a vague floor). 2003: «below but close to 2%». 2021: a symmetric 2%, with upward and downward deviations equally undesirable.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Why does the lower bound justify a symmetric target?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because rates can be raised without limit but lowered only slightly below zero. Without a symmetric commitment, inflation would tend to remain persistently below target after disinflationary shocks.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. With a negative supply shock, what dilemma does the ECB face and how does the strategy mitigate it?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Prices up and output down: bringing prices back to target immediately costs further output. The strategy allows the horizon to be lengthened and a gradual response over the medium term.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;4. Why is fiscal policy needed at the zero lower bound?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Because the LM curve is flat: monetary expansion does not lower the rate and does not move output. Only a shift of the IS curve, through discretionary countercyclical fiscal measures, does so.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ S9 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s9&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Further reading&lt;/div&gt;
&lt;h2&gt;Authors, studies, legislation and websites cited in the slides&lt;/h2&gt;
&lt;p class=&quot;note&quot;&gt;All the entries below are &lt;b&gt;external sources&lt;/b&gt;, verified through web search. Links open in a new tab. The descriptions are based on abstracts and official pages: the entries are no substitute for reading the texts themselves.&lt;/p&gt;
&lt;div class=&quot;refgrid&quot;&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Barro, R. J. and Gordon, D. B. (1983), «Rules, Discretion and Reputation in a Model of Monetary Policy», &lt;i&gt;Journal of Monetary Economics&lt;/i&gt; 12(1), 101–121&lt;/h4&gt;&lt;p&gt;Shows that under discretion the policymaker is tempted to create inflation surprises. The public anticipates this and the equilibrium features higher inflation with no gains in employment. Binding rules, or to some extent reputation, lower inflation. It is the basis of the «inflation bias» in Part 3. — &lt;a href=&quot;https://www.nber.org/papers/w1079&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER Working Paper 1079&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Kydland, F. E. and Prescott, E. C. (1977), «Rules Rather than Discretion: The Inconsistency of Optimal Plans», &lt;i&gt;Journal of Political Economy&lt;/i&gt; 85(3), 473–492&lt;/h4&gt;&lt;p&gt;Introduces the distinction between time-consistent and time-inconsistent policies: a policymaker who re-optimises every period may achieve worse outcomes than one bound by a rule. It is one of the two works cited for the authors&#x27; 2004 Nobel Prize. — &lt;a href=&quot;https://www.britannica.com/topic/Rules-Rather-than-Discretion-The-Inconsistency-of-Optimal-Plans&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Britannica&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Alesina, A. and Summers, L. (1993), «Central Bank Independence and Macroeconomic Performance: Some Comparative Evidence», &lt;i&gt;Journal of Money, Credit and Banking&lt;/i&gt; 25(2), 151–162&lt;/h4&gt;&lt;p&gt;Sixteen OECD countries: greater independence goes with lower average inflation (1955-88). No effects are found on the level and variability of growth, unemployment and the real interest rate, so independence appears to be a «free lunch». Its scatter plot is the chart on slide 30. — &lt;a href=&quot;https://econpapers.repec.org/RePEc:mcb:jmoncb:v:25:y:1993:i:2:p:151-62&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Cukierman, A., Webb, S. B. and Neyapti, B. (1992), «Measuring the Independence of Central Banks and Its Effect on Policy Outcomes», &lt;i&gt;World Bank Economic Review&lt;/i&gt; 6(3), 353–398&lt;/h4&gt;&lt;p&gt;Constructs the legal independence index (CWN index, 72 countries), which has become the standard in the field, and measures of «actual» independence such as governor turnover. Legal independence is associated with lower inflation in industrial countries, but not in developing ones. It provides the 1980-89 data in the table on slide 21. — &lt;a href=&quot;https://documents1.worldbank.org/curated/ar/797831468739529187/pdf/multi-page.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank (PDF)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Crowe, C. and Meade, E. E. (2007), «The Evolution of Central Bank Governance around the World», &lt;i&gt;Journal of Economic Perspectives&lt;/i&gt; 21(4), 69–90&lt;/h4&gt;&lt;p&gt;Measures and compares the evolution of central bank independence and transparency around the world. It is the source of the table on the distribution of independence (slide 21). — &lt;a href=&quot;https://ideas.repec.org/a/aea/jecper/v21y2007i4p69-90.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Crowe, C. and Meade, E. E. (2008), «Central Bank Independence and Transparency: Evolution and Effectiveness», &lt;i&gt;European Journal of Political Economy&lt;/i&gt; 24(4), 763–777 (also IMF WP 08/119)&lt;/h4&gt;&lt;p&gt;Using country fixed effects and instrumental variables, it finds that greater independence reduces inflation. It also documents that legal independence has increased substantially since the 1980s, while transparency has increased less. It is the basis of slide 31 on causality. — &lt;a href=&quot;https://econpapers.repec.org/RePEc:eee:poleco:v:24:y:2008:i:4:p:763-777&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers&lt;/a&gt; · &lt;a href=&quot;https://econpapers.repec.org/RePEc:imf:imfwpa:08/119&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF WP&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Akbik, A., «Is the grass really greener on the other side? Parliamentary oversight of the European Central Bank and the Fed», &lt;i&gt;New Political Economy&lt;/i&gt; 31(2), 283–307&lt;/h4&gt;&lt;p&gt;A systematic comparison of the parliamentary hearings of the ECB and the Fed during the Covid crisis, measuring the strength of the questions and the central banks&#x27; responses. Online since September 2025. — &lt;a href=&quot;https://scholarlypublications.universiteitleiden.nl/handle/1887/4286377&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Leiden University&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Taylor, J. B. (1993), «Discretion versus Policy Rules in Practice», &lt;i&gt;Carnegie-Rochester Conference Series on Public Policy&lt;/i&gt; 39, 195–214&lt;/h4&gt;&lt;p&gt;Proposes a «hypothetical but representative» rule for the federal funds rate, based on inflation and the deviation of GDP from trend. It is the Taylor rule of Part 7. The San Francisco Fed offers an introductory explanation. — &lt;a href=&quot;https://www.frbsf.org/research-and-insights/publications/doctor-econ/1998/03/taylor-rule-monetary-policy/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;FRBSF, «What is Taylor&#x27;s rule?»&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Nechio, F. (2011), «Monetary Policy When One Size Does Not Fit All», &lt;i&gt;FRBSF Economic Letter&lt;/i&gt; 2011-18&lt;/h4&gt;&lt;p&gt;Using separate Taylor rules for the core and the periphery, it shows that the ECB&#x27;s single rate does not suit all euro-area countries, and that the divergence was reversed by the crisis. — &lt;a href=&quot;https://econpapers.repec.org/RePEc:fip:fedfel:y:2011:i:june13:n:2011-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Rakic, D. (2019), &lt;i&gt;European Central Bank appointments: Role of the European Parliament&lt;/i&gt;, study for the European Parliament&#x27;s ECON Committee&lt;/h4&gt;&lt;p&gt;Source of the diagram on appointments (slide 6). The web search did not turn up a direct, reliable link to the study. The Council of the EU publishes an official infographic on the appointment procedure for the Executive Board. — &lt;a href=&quot;https://www.consilium.europa.eu/en/infographics/ecb-executive-board-appointment-procedure/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Consilium, infographic&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Mersch, Y. (2017), «Central bank independence revisited», keynote speech, 30 March 2017&lt;/h4&gt;&lt;p&gt;The Executive Board member argues that the ECB&#x27;s independence remains unchanged despite its broader role after the crisis. The reasons: the inflation bias of political cycles, the need for a limited and clear mandate, and the case law of the Court of Justice of the EU. He points out that independence does not mean isolation. — &lt;a href=&quot;https://www.ecb.europa.eu/press/key/date/2017/html/sp170330.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;ECB (2011), &lt;i&gt;The Monetary Policy of the ECB&lt;/i&gt;, 3rd edition&lt;/h4&gt;&lt;p&gt;Official handbook (161 pages) on the institutional framework, the economic structure of the euro area, and the strategy and implementation of monetary policy, updated after the crisis. «Chart 1.1» on the decision-making bodies comes from here. — &lt;a href=&quot;https://www.ecb.europa.eu/press/pr/date/2011/html/pr110506.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB, publication press release&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Treaty on the Functioning of the European Union (TFEU): Arts. 123, 124, 127, 130, 283&lt;/h4&gt;&lt;p&gt;The official consolidated text contains the articles on the objectives of the ESCB (127), independence (130), the prohibition of monetary financing (123), the prohibition of privileged access (124) and the appointment of the Executive Board (283). — &lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Council Regulation (EC) No 3604/93 of 13 December 1993&lt;/h4&gt;&lt;p&gt;Specifies definitions for the application of the prohibition of privileged access. Art. 2 defines «prudential considerations», and the recitals prohibit their use as cover for disguised privileged access. — &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/1993/3604/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Full Employment and Balanced Growth Act (Humphrey-Hawkins), 1978&lt;/h4&gt;&lt;p&gt;Signed on 27 October 1978: it set national employment and inflation objectives and introduced the Fed&#x27;s semi-annual reports to Congress. The formula of the Fed&#x27;s three objectives dates back to the 1977 amendment to the Federal Reserve Act. — &lt;a href=&quot;https://www.federalreservehistory.org/essays/humphrey-hawkins-act&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Federal Reserve History&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;ECB, monetary policy strategy (2021) and 2025 assessment&lt;/h4&gt;&lt;p&gt;The 2021 statement introduces the symmetric 2% medium-term target, «especially forceful or persistent» action near the lower bound, the HICP with OOH in prospect, and the climate action plan. The 2025 assessment confirms the framework. — &lt;a href=&quot;https://www.ecb.europa.eu/home/search/review/html/ecb.strategyreview_monpol_strategy_statement.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Strategy statement&lt;/a&gt; · &lt;a href=&quot;https://www.ecb.europa.eu/mopo/strategy/strategy-review/strategy-review-assessment-2025/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Assessment 2025&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;ECB, rotation of voting rights in the Governing Council&lt;/h4&gt;&lt;p&gt;Explains the groups of governors, the monthly rotation and the participation of non-voting members. It reports the current composition after Bulgaria&#x27;s accession. — &lt;a href=&quot;https://www.ecb.europa.eu/explainers/tell-me-more/html/voting-rotation.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB Explainers&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;ECB, financial stability tasks and macroprudential policy&lt;/h4&gt;&lt;p&gt;Page cited on slide 45: identification and assessment of systemic risks, stress tests and macroprudential instruments since 2014. — &lt;a href=&quot;https://www.ecb.europa.eu/ecb/orga/tasks/stability/tasks/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;BIS, Central bank policy rates&lt;/h4&gt;&lt;p&gt;Database of the policy rates of more than 40 central banks, at daily and monthly frequency. It is the source of the rate charts on slides 33 and 42. — &lt;a href=&quot;https://data.bis.org/topics/CBPOL&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BIS Data Portal&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Likely reference textbook: De Grauwe, P., &lt;i&gt;Economics of Monetary Union&lt;/i&gt;, Oxford University Press&lt;/h4&gt;&lt;p&gt;The numbering «Figure 8.5», «Figure 9.3-9.4», «Table 9.1» and «Figure 9.6» in the slides points to this textbook: in the 11th edition chapter 8 covers the ECB and chapter 9 monetary policy in the euro area. This is a hypothesis to be checked against the course syllabus. The most recent edition found is the 14th (2022). — &lt;a href=&quot;https://researchonline.lse.ac.uk/id/eprint/122822&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;LSE Research Online&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Cited in the slides but not verified through search: the ECB&#x27;s HICP page (&lt;a href=&quot;https://www.ecb.europa.eu/stats/macroeconomic_and_sectoral/hicp/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;link from slide 65&lt;/a&gt;), OECD &lt;i&gt;Economic Outlook&lt;/i&gt; (output gap data), Credit Suisse, &lt;i&gt;The future of monetary policy&lt;/i&gt; (2017), Eurostat (inflation 2010-17).&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;/main&gt;
