&lt;p&gt;Le politiche fiscali e le altre politiche sono importanti per la stabilizzazione, soprattutto vicino alla lower bound. Una politica fiscale &lt;b&gt;anticiclica&lt;/b&gt; richiede un&#x27;azione decisa nelle recessioni gravi e, quando la ripresa è solida, la ricostituzione delle risorse per garantire la sostenibilità del debito. Così &lt;b&gt;amplifica l&#x27;efficacia&lt;/b&gt; della politica monetaria.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;In tempi normali&lt;/h4&gt;&lt;p&gt;Lavorano soprattutto gli &lt;b&gt;automatic stabilisers&lt;/b&gt;, gli stabilizzatori automatici: tasse che calano e sussidi di disoccupazione che crescono da soli in recessione.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;In crisi, alla lower bound&lt;/h4&gt;&lt;p&gt;Servono &lt;b&gt;discretionary measures&lt;/b&gt;, cioè misure decise apposta dal governo, di politica fiscale anticiclica.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;div class=&quot;tabset&quot;&gt;&lt;div class=&quot;tabs&quot;&gt;&lt;button data-tab=&quot;n&quot; aria-selected=&quot;true&quot;&gt;Circostanze normali&lt;/button&gt;&lt;button data-tab=&quot;z&quot;&gt;Crisi: zero lower bound&lt;/button&gt;&lt;/div&gt;
&lt;div data-panel=&quot;n&quot;&gt;&lt;svg viewBox=&quot;0 0 340 280&quot; aria-label=&quot;IS-LM in circostanze normali&quot;&gt;
&lt;line x1=&quot;40&quot; y1=&quot;240&quot; x2=&quot;330&quot; y2=&quot;240&quot; class=&quot;axis&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;240&quot; x2=&quot;40&quot; y2=&quot;20&quot; class=&quot;axis&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;262&quot; text-anchor=&quot;end&quot; class=&quot;lbl&quot;&gt;Output&lt;/text&gt;&lt;text x=&quot;44&quot; y=&quot;18&quot; class=&quot;lbl&quot;&gt;Tasso d&#x27;interesse&lt;/text&gt;
&lt;path d=&quot;M40,185 L100,185 L280,45&quot; class=&quot;ln c-ard&quot;/&gt;&lt;text x=&quot;284&quot; y=&quot;44&quot; font-size=&quot;12&quot;&gt;LM&lt;/text&gt;
&lt;path d=&quot;M40,205 L150,205 L300,88&quot; class=&quot;ln c-ard dash&quot;/&gt;&lt;text x=&quot;302&quot; y=&quot;86&quot; font-size=&quot;12&quot;&gt;LM&#x27;&lt;/text&gt;
&lt;path d=&quot;M60,70 L260,220&quot; class=&quot;ln c-mat&quot;/&gt;&lt;text x=&quot;262&quot; y=&quot;232&quot; font-size=&quot;12&quot;&gt;IS&lt;/text&gt;
&lt;path d=&quot;M110,50 L310,200&quot; class=&quot;ln c-mat dash&quot;/&gt;&lt;text x=&quot;312&quot; y=&quot;200&quot; font-size=&quot;12&quot;&gt;IS&#x27;&lt;/text&gt;
&lt;g class=&quot;c-mut dash thin&quot;&gt;&lt;line x1=&quot;155.6&quot; y1=&quot;141.7&quot; x2=&quot;155.6&quot; y2=&quot;240&quot;/&gt;&lt;line x1=&quot;194.1&quot; y1=&quot;170.6&quot; x2=&quot;194.1&quot; y2=&quot;240&quot;/&gt;&lt;line x1=&quot;231.7&quot; y1=&quot;141.3&quot; x2=&quot;231.7&quot; y2=&quot;240&quot;/&gt;&lt;/g&gt;
&lt;line x1=&quot;156&quot; y1=&quot;252&quot; x2=&quot;190&quot; y2=&quot;252&quot; class=&quot;c-mat&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;line x1=&quot;156&quot; y1=&quot;270&quot; x2=&quot;228&quot; y2=&quot;270&quot; class=&quot;c-sal&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar2)&quot;/&gt;
&lt;text x=&quot;60&quot; y=&quot;256&quot; font-size=&quot;10.5&quot; class=&quot;f-mat&quot;&gt;solo moneta&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;274&quot; font-size=&quot;10.5&quot; class=&quot;f-sal&quot;&gt;moneta + fisco&lt;/text&gt;
&lt;/svg&gt;&lt;p class=&quot;cap&quot;&gt;Una LM che si sposta (politica monetaria espansiva) aumenta l&#x27;output. Se anche la IS si sposta (politica fiscale anticiclica), l&#x27;effetto è molto maggiore: l&#x27;efficacia della politica monetaria è &lt;b&gt;amplificata&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;z&quot; hidden&gt;&lt;svg viewBox=&quot;0 0 340 280&quot; aria-label=&quot;IS-LM alla zero lower bound&quot;&gt;
&lt;line x1=&quot;40&quot; y1=&quot;240&quot; x2=&quot;330&quot; y2=&quot;240&quot; class=&quot;axis&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;240&quot; x2=&quot;40&quot; y2=&quot;20&quot; class=&quot;axis&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;262&quot; text-anchor=&quot;end&quot; class=&quot;lbl&quot;&gt;Output&lt;/text&gt;&lt;text x=&quot;44&quot; y=&quot;18&quot; class=&quot;lbl&quot;&gt;Tasso d&#x27;interesse&lt;/text&gt;
&lt;line x1=&quot;40&quot; y1=&quot;228&quot; x2=&quot;330&quot; y2=&quot;228&quot; class=&quot;c-mut dash thin&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;224&quot; font-size=&quot;10&quot; class=&quot;f-mut&quot;&gt;ZLB&lt;/text&gt;
&lt;path d=&quot;M40,200 L200,200 L300,90&quot; class=&quot;ln c-ard&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;86&quot; font-size=&quot;12&quot;&gt;LM&lt;/text&gt;
&lt;path d=&quot;M40,202 L245,202 L320,125&quot; class=&quot;ln c-ard dash&quot;/&gt;&lt;text x=&quot;318&quot; y=&quot;120&quot; font-size=&quot;12&quot;&gt;LM&#x27;&lt;/text&gt;
&lt;path d=&quot;M50,110 L190,225&quot; class=&quot;ln c-mat&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;104&quot; font-size=&quot;12&quot;&gt;IS&lt;/text&gt;
&lt;path d=&quot;M90,100 L230,215&quot; class=&quot;ln c-mat dash&quot;/&gt;&lt;text x=&quot;92&quot; y=&quot;94&quot; font-size=&quot;12&quot;&gt;IS&#x27;&lt;/text&gt;
&lt;g class=&quot;c-mut dash thin&quot;&gt;&lt;line x1=&quot;159.6&quot; y1=&quot;200&quot; x2=&quot;159.6&quot; y2=&quot;240&quot;/&gt;&lt;line x1=&quot;211.8&quot; y1=&quot;200&quot; x2=&quot;211.8&quot; y2=&quot;240&quot;/&gt;&lt;/g&gt;
&lt;line x1=&quot;160&quot; y1=&quot;256&quot; x2=&quot;208&quot; y2=&quot;256&quot; class=&quot;c-sal&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar2)&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;260&quot; font-size=&quot;10.5&quot; class=&quot;f-sal&quot;&gt;solo il fisco sposta l&#x27;output&lt;/text&gt;
&lt;/svg&gt;&lt;p class=&quot;cap&quot;&gt;Alla lower bound la LM è &lt;b&gt;piatta&lt;/b&gt; (&lt;i&gt;liquidity trap&lt;/i&gt;, trappola della liquidità): spostarla non cambia l&#x27;equilibrio, perché il tasso non può scendere. Solo lo spostamento della IS (politica fiscale) aumenta l&#x27;output.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/figure&gt;

&lt;h3&gt;Shock di domanda e shock di offerta&lt;/h3&gt;
&lt;p&gt;Con la stabilità dei prezzi come priorità, la produzione viene stabilizzata &lt;b&gt;solo se lo shock è di domanda&lt;/b&gt;. Con uno shock di offerta la strategia stabilizza i prezzi &lt;b&gt;a spese della produzione&lt;/b&gt;: la gerarchia degli obiettivi riaffermata dalla BCE diventa allora sostanziale.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;div class=&quot;tabset&quot;&gt;&lt;div class=&quot;tabs&quot;&gt;&lt;button data-tab=&quot;d&quot; aria-selected=&quot;true&quot;&gt;Demand shock&lt;/button&gt;&lt;button data-tab=&quot;s&quot;&gt;Supply shock&lt;/button&gt;&lt;/div&gt;
&lt;div data-panel=&quot;d&quot;&gt;&lt;svg viewBox=&quot;0 0 340 260&quot; aria-label=&quot;Shock di domanda&quot;&gt;
&lt;line x1=&quot;30&quot; y1=&quot;230&quot; x2=&quot;330&quot; y2=&quot;230&quot; class=&quot;axis&quot;/&gt;&lt;line x1=&quot;30&quot; y1=&quot;230&quot; x2=&quot;30&quot; y2=&quot;20&quot; class=&quot;axis&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;250&quot; text-anchor=&quot;end&quot; class=&quot;lbl&quot;&gt;Output&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;16&quot; class=&quot;lbl&quot;&gt;Livello dei prezzi&lt;/text&gt;
&lt;path d=&quot;M60,220 L280,60&quot; class=&quot;ln c-ard&quot;/&gt;&lt;text x=&quot;283&quot; y=&quot;58&quot; font-size=&quot;12&quot;&gt;AS&lt;/text&gt;
&lt;path d=&quot;M80,70 L290,220&quot; class=&quot;ln c-mat&quot;/&gt;&lt;text x=&quot;292&quot; y=&quot;222&quot; font-size=&quot;12&quot;&gt;AD&lt;/text&gt;
&lt;path d=&quot;M30,105 L240,255&quot; class=&quot;ln c-mat dash&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;250&quot; font-size=&quot;12&quot;&gt;AD&#x27;&lt;/text&gt;
&lt;circle cx=&quot;174&quot; cy=&quot;137&quot; r=&quot;5&quot; class=&quot;f-ink&quot;/&gt;&lt;circle cx=&quot;149&quot; cy=&quot;155&quot; r=&quot;5&quot; class=&quot;f-acc&quot;/&gt;
&lt;line x1=&quot;174&quot; y1=&quot;137&quot; x2=&quot;174&quot; y2=&quot;230&quot; class=&quot;c-mut dash thin&quot;/&gt;&lt;text x=&quot;174&quot; y=&quot;244&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; class=&quot;f-mut&quot;&gt;output normale&lt;/text&gt;
&lt;/svg&gt;&lt;p class=&quot;cap&quot;&gt;AD cala: scendono &lt;b&gt;sia i prezzi sia l&#x27;output&lt;/b&gt;. Una politica che riporta i prezzi al livello iniziale (tassi più bassi) riporta su anche l&#x27;output. Nessun conflitto.&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;s&quot; hidden&gt;&lt;svg viewBox=&quot;0 0 340 260&quot; aria-label=&quot;Shock di offerta&quot;&gt;
&lt;line x1=&quot;30&quot; y1=&quot;230&quot; x2=&quot;330&quot; y2=&quot;230&quot; class=&quot;axis&quot;/&gt;&lt;line x1=&quot;30&quot; y1=&quot;230&quot; x2=&quot;30&quot; y2=&quot;20&quot; class=&quot;axis&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;250&quot; text-anchor=&quot;end&quot; class=&quot;lbl&quot;&gt;Output&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;16&quot; class=&quot;lbl&quot;&gt;Livello dei prezzi&lt;/text&gt;
&lt;path d=&quot;M60,220 L280,60&quot; class=&quot;ln c-ard&quot;/&gt;&lt;text x=&quot;283&quot; y=&quot;58&quot; font-size=&quot;12&quot;&gt;AS&lt;/text&gt;
&lt;path d=&quot;M30,198 L250,38&quot; class=&quot;ln c-ard dash&quot;/&gt;&lt;text x=&quot;252&quot; y=&quot;36&quot; font-size=&quot;12&quot;&gt;AS&#x27;&lt;/text&gt;
&lt;path d=&quot;M80,70 L290,220&quot; class=&quot;ln c-mat&quot;/&gt;&lt;text x=&quot;292&quot; y=&quot;222&quot; font-size=&quot;12&quot;&gt;AD&lt;/text&gt;
&lt;circle cx=&quot;174&quot; cy=&quot;137&quot; r=&quot;5&quot; class=&quot;f-ink&quot;/&gt;&lt;circle cx=&quot;143.7&quot; cy=&quot;115.5&quot; r=&quot;5&quot; class=&quot;f-acc&quot;/&gt;
&lt;line x1=&quot;174&quot; y1=&quot;137&quot; x2=&quot;174&quot; y2=&quot;230&quot; class=&quot;c-mut dash thin&quot;/&gt;&lt;text x=&quot;174&quot; y=&quot;244&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; class=&quot;f-mut&quot;&gt;output normale&lt;/text&gt;
&lt;/svg&gt;&lt;p class=&quot;cap&quot;&gt;AS si sposta a sinistra (per esempio per il rincaro dell&#x27;energia): i &lt;b&gt;prezzi salgono&lt;/b&gt; e l&#x27;&lt;b&gt;output scende&lt;/b&gt;. Per riportare giù i prezzi bisogna comprimere ancora la domanda, e l&#x27;output cala di più. C&#x27;è un conflitto.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/figure&gt;

&lt;h4&gt;Come la strategia gestisce uno shock di offerta negativo&lt;/h4&gt;
&lt;div class=&quot;stepper&quot; id=&quot;ss-step&quot;&gt;
&lt;svg viewBox=&quot;0 0 340 260&quot; style=&quot;max-width:420px;width:100%;display:block&quot; aria-label=&quot;Risposta della BCE a uno shock di offerta&quot;&gt;
&lt;line x1=&quot;30&quot; y1=&quot;230&quot; x2=&quot;330&quot; y2=&quot;230&quot; class=&quot;axis&quot;/&gt;&lt;line x1=&quot;30&quot; y1=&quot;230&quot; x2=&quot;30&quot; y2=&quot;20&quot; class=&quot;axis&quot;/&gt;&lt;text x=&quot;330&quot; y=&quot;250&quot; text-anchor=&quot;end&quot; class=&quot;lbl&quot;&gt;Y&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;16&quot; class=&quot;lbl&quot;&gt;p&lt;/text&gt;
&lt;line x1=&quot;30&quot; y1=&quot;137&quot; x2=&quot;330&quot; y2=&quot;137&quot; class=&quot;c-mut dash thin&quot;/&gt;&lt;text x=&quot;10&quot; y=&quot;141&quot; font-size=&quot;11&quot;&gt;p*&lt;/text&gt;
&lt;path d=&quot;M60,220 L280,60&quot; class=&quot;ln c-ard&quot;/&gt;&lt;path d=&quot;M80,70 L290,220&quot; class=&quot;ln c-mat&quot;/&gt;&lt;circle cx=&quot;174&quot; cy=&quot;137&quot; r=&quot;5&quot; class=&quot;f-ink&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;132&quot; font-size=&quot;11&quot;&gt;Y*&lt;/text&gt;
&lt;g data-show=&quot;2 3 4&quot;&gt;&lt;path d=&quot;M30,198 L250,38&quot; class=&quot;ln c-ard dash&quot;/&gt;&lt;text x=&quot;252&quot; y=&quot;36&quot; font-size=&quot;12&quot;&gt;AS&#x27;&lt;/text&gt;&lt;circle cx=&quot;143.7&quot; cy=&quot;115.5&quot; r=&quot;5&quot; class=&quot;f-acc&quot;/&gt;&lt;/g&gt;
&lt;g data-show=&quot;3&quot;&gt;&lt;path d=&quot;M40,84 L250,234&quot; class=&quot;ln c-mat dash&quot;/&gt;&lt;circle cx=&quot;114&quot; cy=&quot;137&quot; r=&quot;6&quot; class=&quot;f-mat&quot;/&gt;&lt;line x1=&quot;114&quot; y1=&quot;137&quot; x2=&quot;114&quot; y2=&quot;230&quot; class=&quot;c-mat thin&quot;/&gt;&lt;text x=&quot;118&quot; y=&quot;226&quot; font-size=&quot;10&quot; class=&quot;f-mat&quot;&gt;calo forte di Y&lt;/text&gt;&lt;/g&gt;
&lt;g data-show=&quot;4&quot;&gt;&lt;path d=&quot;M60,74 L270,224&quot; class=&quot;ln c-sal dash&quot;/&gt;&lt;circle cx=&quot;130&quot; cy=&quot;125.5&quot; r=&quot;6&quot; class=&quot;f-sal&quot;/&gt;&lt;line x1=&quot;130&quot; y1=&quot;125.5&quot; x2=&quot;130&quot; y2=&quot;230&quot; class=&quot;c-sal thin&quot;/&gt;&lt;text x=&quot;134&quot; y=&quot;226&quot; font-size=&quot;10&quot; class=&quot;f-sal&quot;&gt;calo moderato&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1&lt;/span&gt; Equilibrio iniziale: prezzi a p*, output al livello normale Y*.&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;2&lt;/span&gt; Shock di offerta negativo: AS → AS&#x27;. I prezzi salgono sopra p* e l&#x27;output scende.&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;3&lt;/span&gt; Risposta «aggressiva»: la BCE stringe subito per riportare i prezzi a p*. AD si sposta molto a sinistra e l&#x27;output crolla.&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;4&lt;/span&gt; Risposta della strategia: il Governing Council può &lt;b&gt;allungare l&#x27;orizzonte&lt;/b&gt; entro cui l&#x27;inflazione torna al target. Così evita forti cali di attività e occupazione, che se persistenti potrebbero &lt;b&gt;a loro volta&lt;/b&gt; minacciare la stabilità dei prezzi nel medio termine.&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← indietro&lt;/button&gt;&lt;span data-count&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;avanti →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Nota delle slide: la risposta &lt;b&gt;graduale&lt;/b&gt; dei tassi, coerente con l&#x27;obiettivo di stabilità nel &lt;b&gt;medio termine&lt;/b&gt;, è il modo in cui la BCE tiene conto anche della produzione ed evita politiche anti-inflazione troppo restrittive per la domanda aggregata.&lt;/p&gt;

&lt;h3&gt;Cambiamento climatico&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;p&gt;La responsabilità principale e gli strumenti per affrontare il cambiamento climatico spettano ai &lt;b&gt;governi&lt;/b&gt;. Ma il mandato della BCE le chiede di valutarne l&#x27;impatto e di integrare considerazioni climatiche nelle sue politiche.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Perché?&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Physical risks&lt;/b&gt; (danni da eventi climatici) e &lt;b&gt;transition risks&lt;/b&gt; (costi del passaggio a un&#x27;economia a basse emissioni) hanno effetti sia sulla &lt;b&gt;stabilità dei prezzi&lt;/b&gt; sia sulla &lt;b&gt;stabilità finanziaria&lt;/b&gt;. Inoltre cambiano il valore e il profilo di rischio delle attività nel bilancio dell&#x27;Eurosystem.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;Il 30 giugno 2025 la BCE ha pubblicato l&#x27;esito della valutazione della strategia: tutti gli strumenti restano disponibili, il loro uso è soggetto a una valutazione di proporzionalità e la prossima valutazione è prevista nel 2030. Il target simmetrico del 2% nel medio termine è confermato dal 2021. — &lt;a href=&quot;https://www.ecb.europa.eu/press/pr/date/2025/html/ecb.pr250630~aabf988af8.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB, comunicato del 30/06/2025&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · parte 8&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Come è cambiata la definizione di price stability dal 1998 al 2021?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;1998: aumento annuo dell&#x27;HICP sotto il 2% nel medio termine (un tetto chiaro, un pavimento vago). 2003: «sotto ma vicino al 2%». 2021: 2% simmetrico, con scostamenti verso l&#x27;alto e verso il basso ugualmente indesiderati.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Perché la lower bound giustifica un target simmetrico?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché i tassi si possono alzare senza limiti ma abbassare poco sotto zero. Senza un impegno simmetrico l&#x27;inflazione tenderebbe a restare persistentemente sotto il target dopo shock disinflazionistici.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Con uno shock di offerta negativo, quale dilemma ha la BCE e come lo attenua la strategia?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Prezzi su e output giù: riportare subito i prezzi al target costa altra produzione. La strategia permette di allungare l&#x27;orizzonte e rispondere in modo graduale, nel medio termine.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;4. Perché alla zero lower bound serve la politica fiscale?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché la LM è piatta: l&#x27;espansione monetaria non abbassa il tasso e non sposta l&#x27;output. Lo fa solo uno spostamento della IS, con misure fiscali discrezionali anticicliche.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ S9 ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s9&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Per approfondire&lt;/div&gt;
&lt;h2&gt;Autori, studi, norme e siti citati nelle slide&lt;/h2&gt;
&lt;p class=&quot;note&quot;&gt;Tutte le schede qui sotto sono &lt;b&gt;fonti esterne&lt;/b&gt;, verificate con la ricerca web. I link aprono una nuova scheda. Le descrizioni si basano su abstract e pagine ufficiali: le schede non sostituiscono la lettura del testo.&lt;/p&gt;
&lt;div class=&quot;refgrid&quot;&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Barro, R. J. e Gordon, D. B. (1983), «Rules, Discretion and Reputation in a Model of Monetary Policy», &lt;i&gt;Journal of Monetary Economics&lt;/i&gt; 12(1), 101–121&lt;/h4&gt;&lt;p&gt;Mostra che con la discrezionalità il policy maker è tentato di creare sorprese inflazionistiche. Il pubblico lo anticipa e l&#x27;equilibrio ha più inflazione senza guadagni di occupazione. Regole vincolanti, o in parte la reputazione, abbassano l&#x27;inflazione. È la base dell&#x27;«inflation bias» della parte 3. — &lt;a href=&quot;https://www.nber.org/papers/w1079&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER Working Paper 1079&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Kydland, F. E. e Prescott, E. C. (1977), «Rules Rather than Discretion: The Inconsistency of Optimal Plans», &lt;i&gt;Journal of Political Economy&lt;/i&gt; 85(3), 473–492&lt;/h4&gt;&lt;p&gt;Introduce la distinzione tra politiche time-consistent e time-inconsistent: un decisore che ri-ottimizza ogni periodo può ottenere risultati peggiori di uno vincolato a una regola. È uno dei due lavori citati per il Nobel 2004 agli autori. — &lt;a href=&quot;https://www.britannica.com/topic/Rules-Rather-than-Discretion-The-Inconsistency-of-Optimal-Plans&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Britannica&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Alesina, A. e Summers, L. (1993), «Central Bank Independence and Macroeconomic Performance: Some Comparative Evidence», &lt;i&gt;Journal of Money, Credit and Banking&lt;/i&gt; 25(2), 151–162&lt;/h4&gt;&lt;p&gt;Sedici Paesi OCSE: più indipendenza va con meno inflazione media (1955-88). Non si trovano effetti su livello e variabilità di crescita, disoccupazione e tasso reale, quindi l&#x27;indipendenza sembra un «pasto gratis». Il suo scatter è il grafico della slide 30. — &lt;a href=&quot;https://econpapers.repec.org/RePEc:mcb:jmoncb:v:25:y:1993:i:2:p:151-62&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Cukierman, A., Webb, S. B. e Neyapti, B. (1992), «Measuring the Independence of Central Banks and Its Effect on Policy Outcomes», &lt;i&gt;World Bank Economic Review&lt;/i&gt; 6(3), 353–398&lt;/h4&gt;&lt;p&gt;Costruisce l&#x27;indice legale di indipendenza (indice CWN, 72 Paesi), diventato lo standard del settore, e misure di indipendenza «effettiva» come il turnover dei governatori. L&#x27;indipendenza legale è legata a meno inflazione nei Paesi industriali, non in quelli in via di sviluppo. Fornisce i dati 1980-89 della tabella della slide 21. — &lt;a href=&quot;https://documents1.worldbank.org/curated/ar/797831468739529187/pdf/multi-page.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank (PDF)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Crowe, C. e Meade, E. E. (2007), «The Evolution of Central Bank Governance around the World», &lt;i&gt;Journal of Economic Perspectives&lt;/i&gt; 21(4), 69–90&lt;/h4&gt;&lt;p&gt;Misura e confronta l&#x27;evoluzione di indipendenza e trasparenza delle banche centrali nel mondo. È la fonte della tabella sulla distribuzione dell&#x27;indipendenza (slide 21). — &lt;a href=&quot;https://ideas.repec.org/a/aea/jecper/v21y2007i4p69-90.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Crowe, C. e Meade, E. E. (2008), «Central Bank Independence and Transparency: Evolution and Effectiveness», &lt;i&gt;European Journal of Political Economy&lt;/i&gt; 24(4), 763–777 (anche IMF WP 08/119)&lt;/h4&gt;&lt;p&gt;Con effetti fissi per Paese e variabili strumentali trova che più indipendenza riduce l&#x27;inflazione. Documenta anche che l&#x27;indipendenza legale è cresciuta molto dagli anni &#x27;80, mentre la trasparenza è aumentata di meno. È la base della slide 31 sulla causalità. — &lt;a href=&quot;https://econpapers.repec.org/RePEc:eee:poleco:v:24:y:2008:i:4:p:763-777&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers&lt;/a&gt; · &lt;a href=&quot;https://econpapers.repec.org/RePEc:imf:imfwpa:08/119&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IMF WP&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Akbik, A., «Is the grass really greener on the other side? Parliamentary oversight of the European Central Bank and the Fed», &lt;i&gt;New Political Economy&lt;/i&gt; 31(2), 283–307&lt;/h4&gt;&lt;p&gt;Confronto sistematico delle audizioni parlamentari di BCE e Fed durante la crisi Covid, misurando la forza delle domande e la risposta delle banche centrali. Online da settembre 2025. — &lt;a href=&quot;https://scholarlypublications.universiteitleiden.nl/handle/1887/4286377&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Leiden University&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Taylor, J. B. (1993), «Discretion versus Policy Rules in Practice», &lt;i&gt;Carnegie-Rochester Conference Series on Public Policy&lt;/i&gt; 39, 195–214&lt;/h4&gt;&lt;p&gt;Propone una regola «ipotetica ma rappresentativa» per il federal funds rate, in base a inflazione e scostamento del PIL dal trend. È la Taylor rule della parte 7. La Fed di San Francisco ne offre una spiegazione introduttiva. — &lt;a href=&quot;https://www.frbsf.org/research-and-insights/publications/doctor-econ/1998/03/taylor-rule-monetary-policy/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;FRBSF, «What is Taylor&#x27;s rule?»&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Nechio, F. (2011), «Monetary Policy When One Size Does Not Fit All», &lt;i&gt;FRBSF Economic Letter&lt;/i&gt; 2011-18&lt;/h4&gt;&lt;p&gt;Mostra con Taylor rule separate per core e periferia che il tasso unico della BCE non va bene per tutti i Paesi dell&#x27;euro, e che la divergenza si è ribaltata con la crisi. — &lt;a href=&quot;https://econpapers.repec.org/RePEc:fip:fedfel:y:2011:i:june13:n:2011-18&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Rakic, D. (2019), &lt;i&gt;European Central Bank appointments: Role of the European Parliament&lt;/i&gt;, studio per la commissione ECON del Parlamento europeo&lt;/h4&gt;&lt;p&gt;Fonte dello schema sulle nomine (slide 6). Non ho trovato con la ricerca un link diretto e affidabile allo studio. Il Consiglio dell&#x27;UE pubblica un&#x27;infografica ufficiale sulla procedura di nomina dell&#x27;Executive Board. — &lt;a href=&quot;https://www.consilium.europa.eu/en/infographics/ecb-executive-board-appointment-procedure/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Consilium, infografica&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Mersch, Y. (2017), «Central bank independence revisited», keynote, 30 marzo 2017&lt;/h4&gt;&lt;p&gt;Il membro dell&#x27;Executive Board sostiene che l&#x27;indipendenza della BCE non cambia anche con il ruolo più ampio dopo la crisi. Le ragioni: inflation bias dei cicli politici, necessità di un mandato limitato e chiaro, giurisprudenza della Corte di giustizia UE. Ricorda che indipendenza non significa isolamento. — &lt;a href=&quot;https://www.ecb.europa.eu/press/key/date/2017/html/sp170330.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;BCE (2011), &lt;i&gt;The Monetary Policy of the ECB&lt;/i&gt;, 3ª edizione&lt;/h4&gt;&lt;p&gt;Manuale ufficiale (161 pagine) su assetto istituzionale, struttura economica dell&#x27;area euro, strategia e attuazione della politica monetaria, aggiornato dopo la crisi. Da qui viene il «Chart 1.1» sugli organi decisionali. — &lt;a href=&quot;https://www.ecb.europa.eu/press/pr/date/2011/html/pr110506.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB, comunicato di pubblicazione&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Trattato sul funzionamento dell&#x27;UE (TFEU): artt. 123, 124, 127, 130, 283&lt;/h4&gt;&lt;p&gt;Il testo consolidato ufficiale contiene gli articoli su obiettivi dell&#x27;ESCB (127), indipendenza (130), divieto di finanziamento monetario (123), divieto di accesso privilegiato (124) e nomina dell&#x27;Executive Board (283). — &lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Regolamento (CE) n. 3604/93 del Consiglio, 13 dicembre 1993&lt;/h4&gt;&lt;p&gt;Definisce i termini per applicare il divieto di accesso privilegiato. L&#x27;art. 2 definisce le «prudential considerations» e i considerando vietano di usarle come copertura per un accesso privilegiato mascherato. — &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/1993/3604/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;Full Employment and Balanced Growth Act (Humphrey-Hawkins), 1978&lt;/h4&gt;&lt;p&gt;Firmato il 27 ottobre 1978: ha fissato obiettivi nazionali di occupazione e inflazione e ha introdotto i rapporti semestrali della Fed al Congresso. La formula dei tre obiettivi della Fed risale all&#x27;emendamento del 1977 al Federal Reserve Act. — &lt;a href=&quot;https://www.federalreservehistory.org/essays/humphrey-hawkins-act&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Federal Reserve History&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;BCE, strategia di politica monetaria (2021) e valutazione 2025&lt;/h4&gt;&lt;p&gt;Lo statement del 2021 introduce il target simmetrico del 2% nel medio termine, l&#x27;azione «particolarmente forte o persistente» vicino alla lower bound, l&#x27;HICP con l&#x27;OOH in prospettiva e il piano d&#x27;azione sul clima. La valutazione del 2025 conferma l&#x27;impianto. — &lt;a href=&quot;https://www.ecb.europa.eu/home/search/review/html/ecb.strategyreview_monpol_strategy_statement.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Strategy statement&lt;/a&gt; · &lt;a href=&quot;https://www.ecb.europa.eu/mopo/strategy/strategy-review/strategy-review-assessment-2025/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Assessment 2025&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;BCE, rotazione dei diritti di voto nel Governing Council&lt;/h4&gt;&lt;p&gt;Spiega i gruppi di governatori, la rotazione mensile e la partecipazione dei non votanti. Riporta la composizione attuale dopo l&#x27;ingresso della Bulgaria. — &lt;a href=&quot;https://www.ecb.europa.eu/explainers/tell-me-more/html/voting-rotation.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB Explainers&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;BCE, compiti di stabilità finanziaria e politica macroprudenziale&lt;/h4&gt;&lt;p&gt;Pagina citata nella slide 45: identificazione e valutazione dei rischi sistemici, stress test e strumenti macroprudenziali dal 2014. — &lt;a href=&quot;https://www.ecb.europa.eu/ecb/orga/tasks/stability/tasks/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag-ext&quot;&gt;&lt;/span&gt;&lt;h4&gt;BIS, Central bank policy rates&lt;/h4&gt;&lt;p&gt;Database con i tassi di policy di oltre 40 banche centrali, giornalieri e mensili. È la fonte dei grafici sui tassi delle slide 33 e 42. — &lt;a href=&quot;https://data.bis.org/topics/CBPOL&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BIS Data Portal&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
