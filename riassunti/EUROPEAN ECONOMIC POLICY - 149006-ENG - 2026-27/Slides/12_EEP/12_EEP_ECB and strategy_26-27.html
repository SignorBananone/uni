&lt;section class=&quot;part p-sal&quot; id=&quot;s1&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 1 · slide 1–8&lt;/div&gt;
&lt;h2&gt;La BCE come istituzione&lt;/h2&gt;

&lt;h3&gt;Le tappe dell&#x27;Unione economica e monetaria (EMU)&lt;/h3&gt;
&lt;p&gt;La &lt;b&gt;EMU&lt;/b&gt; (&lt;i&gt;Economic and Monetary Union&lt;/i&gt;, Unione economica e monetaria) è stata costruita in tre fasi. Le slide ricordano le due date chiave per la nascita della BCE:&lt;/p&gt;
&lt;div class=&quot;timeline&quot;&gt;
&lt;div&gt;&lt;b&gt;1990&lt;/b&gt;&lt;span class=&quot;note&quot;&gt;Prima fase: libera circolazione dei capitali e più coordinamento (contesto, non nelle slide).&lt;/span&gt;&lt;/div&gt;
&lt;div&gt;&lt;b&gt;gen. 1994&lt;/b&gt;Nasce l&#x27;&lt;b&gt;EMI&lt;/b&gt; (&lt;i&gt;European Monetary Institute&lt;/i&gt;): rafforza la cooperazione tra banche centrali e prepara l&#x27;&lt;b&gt;ESCB&lt;/b&gt;.&lt;/div&gt;
&lt;div&gt;&lt;b&gt;gen. 1999&lt;/b&gt;I tassi di conversione delle valute di &lt;b&gt;11 Stati&lt;/b&gt; vengono fissati in modo irrevocabile. La BCE assume la politica monetaria unica.&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Sede: l&#x27;&lt;b&gt;Eurotower&lt;/b&gt; di Francoforte (Germania), come nella foto delle slide. Presidente: &lt;b&gt;Christine Lagarde&lt;/b&gt;, mandato 1/11/2019 – 31/10/2027. Le slide aggiungono che Lagarde lascerà il 7 febbraio 2027 e pongono, con il punto di domanda, i nomi di Pablo Hernández de Cos come possibile successore e di Markus Brunnermeier come possibile capo economista. Sono notizie d&#x27;attualità: verificale al momento dell&#x27;esame.&lt;/p&gt;

&lt;h3&gt;Eurosystem ed ESCB: due insiemi diversi&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Eurosystem&lt;/b&gt;&lt;br&gt;La BCE più le &lt;b&gt;NCBs&lt;/b&gt; (&lt;i&gt;National Central Banks&lt;/i&gt;, banche centrali nazionali) dei Paesi che hanno adottato l&#x27;euro. È chi fa la politica monetaria.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;ESCB&lt;/b&gt; — &lt;i&gt;European System of Central Banks&lt;/i&gt;&lt;br&gt;La BCE più le banche centrali di &lt;b&gt;tutti&lt;/b&gt; gli Stati UE, anche fuori dall&#x27;euro. Il Trattato gli assegna l&#x27;obiettivo della stabilità dei prezzi.&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;I tre organi decisionali&lt;/h3&gt;
&lt;p&gt;Composizione (dal grafico «Chart 1.1» della pubblicazione BCE del 2011 citata nelle slide). Clicca le linguette:&lt;/p&gt;
&lt;div class=&quot;tabset&quot;&gt;
&lt;div class=&quot;tabs&quot; role=&quot;tablist&quot;&gt;&lt;button data-tab=&quot;gc&quot; aria-selected=&quot;true&quot;&gt;Governing Council&lt;/button&gt;&lt;button data-tab=&quot;eb&quot;&gt;Executive Board&lt;/button&gt;&lt;button data-tab=&quot;gen&quot;&gt;General Council&lt;/button&gt;&lt;/div&gt;
&lt;div data-panel=&quot;gc&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;
&lt;p&gt;&lt;b&gt;Chi:&lt;/b&gt; i 6 membri dell&#x27;Executive Board più i governatori delle NCB dell&#x27;area euro.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Cosa fa:&lt;/b&gt; formula la politica monetaria dell&#x27;area euro: obiettivi monetari, tassi d&#x27;interesse di riferimento (&lt;i&gt;key interest rates&lt;/i&gt;), offerta di riserve nell&#x27;Eurosystem, linee guida per attuare queste decisioni. Decide anche sui nuovi compiti di &lt;i&gt;banking supervision&lt;/i&gt; (vigilanza bancaria).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Come:&lt;/b&gt; di solito si riunisce due volte al mese a Francoforte. Valuta gli andamenti economici e monetari e &lt;b&gt;decide la politica monetaria ogni sei settimane&lt;/b&gt;. Nelle altre riunioni tratta gli altri compiti della BCE. Per tenere separate politica monetaria e vigilanza tiene &lt;b&gt;riunioni distinte&lt;/b&gt;.&lt;/p&gt;
&lt;/div&gt;&lt;svg id=&quot;gc-dots&quot; viewBox=&quot;0 0 300 170&quot; aria-label=&quot;Composizione del Governing Council&quot;&gt;&lt;/svg&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-panel=&quot;eb&quot; hidden&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div&gt;
&lt;p&gt;&lt;b&gt;Chi:&lt;/b&gt; Presidente, Vicepresidente e altri 4 membri: 6 persone.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Cosa fa:&lt;/b&gt; prepara le riunioni del Governing Council; &lt;b&gt;attua&lt;/b&gt; la politica monetaria secondo le linee guida del Council e dà le istruzioni necessarie alle NCB; gestisce l&#x27;attività quotidiana della BCE; esercita i poteri che il Council gli delega.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Perché conta:&lt;/b&gt; ha una &lt;b&gt;posizione strategica&lt;/b&gt; nel processo decisionale del Governing Council. Lo vedremo con la teoria dell&#x27;elettore mediano nella &lt;a href=&quot;#s7&quot;&gt;parte 7&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;&lt;svg viewBox=&quot;0 0 300 120&quot; aria-hidden=&quot;true&quot;&gt;&lt;g id=&quot;eb-dots&quot;&gt;&lt;/g&gt;&lt;/svg&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-panel=&quot;gen&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Chi:&lt;/b&gt; Presidente e Vicepresidente della BCE più i governatori delle banche centrali di &lt;b&gt;tutti&lt;/b&gt; gli Stati UE.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Cosa fa:&lt;/b&gt; contribuisce alle funzioni consultive della BCE, alla raccolta di informazioni statistiche e alla preparazione del rapporto annuale.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Natura:&lt;/b&gt; è un&#x27;istituzione &lt;b&gt;transitoria&lt;/b&gt;. Esiste finché ci sono Stati UE fuori dall&#x27;euro e fa da ponte con loro.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;/figure&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · parte 1&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Qual è la differenza tra Eurosystem ed ESCB?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;L&#x27;Eurosystem è formato dalla BCE e dalle NCB dei Paesi dell&#x27;euro. L&#x27;ESCB comprende anche le banche centrali degli Stati UE che non usano l&#x27;euro.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Con che frequenza il Governing Council decide la politica monetaria, e perché tiene riunioni separate?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Ogni sei settimane, anche se si riunisce di solito due volte al mese. Tiene riunioni separate per non mescolare la politica monetaria con i compiti di vigilanza bancaria.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Perché il General Council è definito &quot;transitorio&quot;?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Collega la BCE con le banche centrali degli Stati UE fuori dall&#x27;euro. Se tutti adottassero l&#x27;euro, non avrebbe più ragione di esistere.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ S2 ============ --&gt;
&lt;section class=&quot;part p-ocr&quot; id=&quot;s2&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 2 · slide 9–16&lt;/div&gt;
&lt;h2&gt;Il Trattato: obiettivi e tre forme di indipendenza&lt;/h2&gt;

&lt;h3&gt;Una gerarchia di obiettivi (art. 127 TFEU)&lt;/h3&gt;
&lt;p&gt;Il &lt;b&gt;TFEU&lt;/b&gt; (&lt;i&gt;Treaty on the Functioning of the European Union&lt;/i&gt;, Trattato sul funzionamento dell&#x27;UE) fissa un ordine preciso:&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 700 210&quot; aria-label=&quot;Gerarchia degli obiettivi&quot;&gt;
&lt;rect x=&quot;180&quot; y=&quot;10&quot; width=&quot;340&quot; height=&quot;56&quot; rx=&quot;10&quot; class=&quot;fb-ocr c-ocr&quot; stroke-width=&quot;2&quot;/&gt;
&lt;text x=&quot;350&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;600&quot;&gt;1. Price stability&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-mut&quot;&gt;obiettivo primario dell&#x27;ESCB&lt;/text&gt;
&lt;path d=&quot;M350,66 L350,92&quot; class=&quot;c-ocr&quot; stroke-width=&quot;2&quot;/&gt;
&lt;rect x=&quot;110&quot; y=&quot;92&quot; width=&quot;480&quot; height=&quot;50&quot; rx=&quot;10&quot; class=&quot;f-card c-ocr&quot; stroke-width=&quot;1.4&quot;/&gt;
&lt;text x=&quot;350&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;2. «Without prejudice to price stability»: sostegno alle politiche economiche generali dell&#x27;Unione&lt;/text&gt;
&lt;text x=&quot;350&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-mut&quot;&gt;per contribuire agli obiettivi dell&#x27;art. 3 TEU&lt;/text&gt;
&lt;path d=&quot;M350,142 L350,160&quot; class=&quot;c-ocr&quot; stroke-width=&quot;1.4&quot;/&gt;
&lt;g font-size=&quot;11.5&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;160&quot; width=&quot;160&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;f-card c-mut&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;184&quot; text-anchor=&quot;middle&quot;&gt;crescita equilibrata&lt;/text&gt;
&lt;rect x=&quot;185&quot; y=&quot;160&quot; width=&quot;160&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;f-card c-mut&quot;/&gt;&lt;text x=&quot;265&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot;&gt;economia sociale di&lt;/text&gt;&lt;text x=&quot;265&quot; y=&quot;193&quot; text-anchor=&quot;middle&quot;&gt;mercato competitiva&lt;/text&gt;
&lt;rect x=&quot;360&quot; y=&quot;160&quot; width=&quot;160&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;f-card c-mut&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot;&gt;piena occupazione&lt;/text&gt;&lt;text x=&quot;440&quot; y=&quot;193&quot; text-anchor=&quot;middle&quot;&gt;e progresso sociale&lt;/text&gt;
&lt;rect x=&quot;535&quot; y=&quot;160&quot; width=&quot;160&quot; height=&quot;40&quot; rx=&quot;8&quot; class=&quot;f-card c-mut&quot;/&gt;&lt;text x=&quot;615&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot;&gt;tutela e qualità&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;193&quot; text-anchor=&quot;middle&quot;&gt;dell&#x27;ambiente&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;figcaption&gt;Il secondo livello è &lt;b&gt;subordinato&lt;/b&gt; al primo: la BCE sostiene crescita e occupazione solo se questo non mette a rischio la stabilità dei prezzi.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3&gt;Le tre indipendenze&lt;/h3&gt;
&lt;div class=&quot;tabset&quot;&gt;
&lt;div class=&quot;tabs&quot;&gt;&lt;button data-tab=&quot;ist&quot; aria-selected=&quot;true&quot;&gt;Institutional · art. 130&lt;/button&gt;&lt;button data-tab=&quot;fun&quot;&gt;Functional · art. 123–124&lt;/button&gt;&lt;button data-tab=&quot;per&quot;&gt;Personal · art. 283(2)&lt;/button&gt;&lt;/div&gt;
&lt;div data-panel=&quot;ist&quot;&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Institutional independence&lt;/b&gt;&lt;br&gt;Né la BCE, né una NCB, né alcun membro dei loro organi può &lt;b&gt;chiedere o accettare istruzioni&lt;/b&gt; da istituzioni UE, governi nazionali o qualsiasi altro organismo. Allo stesso tempo, istituzioni e governi si impegnano a &lt;b&gt;non cercare di influenzarli&lt;/b&gt;.&lt;/div&gt;&lt;p&gt;Il divieto vale in tutte e due le direzioni: la banca centrale non prende ordini e la politica non prova a darne.&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;fun&quot; hidden&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Functional independence&lt;/b&gt;&lt;br&gt;&lt;b&gt;Art. 123&lt;/b&gt; — divieto di &lt;b&gt;monetary financing&lt;/b&gt; (finanziamento monetario): niente scoperti o crediti della BCE o delle NCB a favore di istituzioni UE, governi, enti pubblici o imprese pubbliche, e niente acquisto &lt;b&gt;diretto&lt;/b&gt; (sul mercato primario) dei loro titoli di debito.&lt;br&gt;&lt;b&gt;Art. 124&lt;/b&gt; — divieto di &lt;b&gt;privileged access&lt;/b&gt;: nessuna misura che dia al settore pubblico un accesso privilegiato alle istituzioni finanziarie, salvo che si basi su &lt;i&gt;prudential considerations&lt;/i&gt;.&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Nota delle slide: per l&#x27;art. 2 del Regolamento (CE) n. 3604/93, le «prudential considerations» sono quelle alla base di leggi o atti nazionali conformi al diritto comunitario, pensati per rendere solide le istituzioni finanziarie, rafforzare la stabilità del sistema e proteggerne i clienti.&lt;/p&gt;
&lt;p&gt;Perché conta: se la banca centrale potesse finanziare direttamente lo Stato, il governo potrebbe &quot;stampare moneta&quot; per coprire i deficit. È proprio la fonte di inflazione che l&#x27;indipendenza vuole evitare. Gli acquisti sul mercato &lt;b&gt;secondario&lt;/b&gt; (il QE della &lt;a href=&quot;#s5&quot;&gt;parte 5&lt;/a&gt;) non sono vietati da questa norma.&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;per&quot; hidden&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Personal independence&lt;/b&gt;&lt;br&gt;L&#x27;Executive Board (Presidente, Vicepresidente e 4 membri) è nominato dal &lt;b&gt;Consiglio europeo a maggioranza qualificata&lt;/b&gt;, su raccomandazione del Consiglio, dopo aver consultato il Parlamento europeo e il Governing Council. Sono scelti tra persone di riconosciuta esperienza in materia monetaria o bancaria. &lt;b&gt;Mandato di 8 anni, non rinnovabile.&lt;/b&gt; Possono essere membri solo cittadini degli Stati membri.&lt;/div&gt;&lt;p&gt;Il mandato &lt;b&gt;non rinnovabile&lt;/b&gt; è la chiave: chi non deve essere riconfermato non ha motivo di compiacere chi lo nomina. Il mandato di 8 anni è inoltre più lungo di un ciclo elettorale.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Confronto: il mandato della Fed&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Storia&lt;/h4&gt;&lt;p&gt;Fondata nel &lt;b&gt;1913&lt;/b&gt;, soprattutto come &lt;i&gt;lender of last resort&lt;/i&gt; (prestatore di ultima istanza) contro le crisi bancarie. Dopo i problemi bancari degli anni &#x27;30 è stata riformata nel &lt;b&gt;1933 e 1935&lt;/b&gt;, quando nasce il moderno &lt;i&gt;Board of Governors&lt;/i&gt; a Washington. Con un sistema bancario poi stabile, la politica monetaria è diventata il suo compito principale.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Il &lt;i&gt;dual mandate&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Il &lt;b&gt;Full Employment and Balanced Growth Act del 1978&lt;/b&gt; le chiede: &lt;b&gt;alta occupazione&lt;/b&gt;, &lt;b&gt;prezzi stabili&lt;/b&gt; e &lt;b&gt;tassi a lungo termine moderati&lt;/b&gt;. Con prezzi stabili, i tassi a lungo restano moderati, quindi si parla di «dual mandate»: massima occupazione e stabilità dei prezzi, &lt;b&gt;sullo stesso piano&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;Il Congresso fissa gli obiettivi. Le decisioni del Board e del &lt;b&gt;FOMC&lt;/b&gt; (&lt;i&gt;Federal Open Market Committee&lt;/i&gt;) su come raggiungerli non hanno bisogno di approvazione politica. Il Board riferisce al Congresso e ne risponde direttamente.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;Federal Reserve History precisa che la formula dei tre obiettivi viene da un &lt;b&gt;emendamento del 1977&lt;/b&gt; al Federal Reserve Act. La legge Humphrey-Hawkins del 1978 ha poi introdotto obiettivi nazionali e l&#x27;obbligo di relazioni periodiche al Congresso. — &lt;a href=&quot;https://www.federalreservehistory.org/essays/humphrey-hawkins-act&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;federalreservehistory.org&lt;/a&gt;&lt;/div&gt;

&lt;h3&gt;Due modelli di banca centrale&lt;/h3&gt;
&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Anglo-French model&lt;/th&gt;&lt;th&gt;German model (Bundesbank)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Obiettivi&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Diversi obiettivi; la stabilità dei prezzi è solo uno di questi, senza priorità&lt;/td&gt;&lt;td&gt;La stabilità dei prezzi è l&#x27;obiettivo &lt;b&gt;primario&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Rapporto col governo&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Le decisioni sono soggette all&#x27;approvazione del governo → &lt;b&gt;dipendenza politica&lt;/b&gt;&lt;/td&gt;&lt;td&gt;La banca centrale decide senza interferenze → &lt;b&gt;indipendenza politica&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Nella BCE&lt;/b&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;b&gt;Ha prevalso&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Perché ha vinto il modello tedesco? Due ragioni&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;b&gt;1. Posizione strategica della Germania.&lt;/b&gt; Per accettare la EMU, cioè per rinunciare al marco e alla Bundesbank, le autorità tedesche chiesero una BCE che desse alla stabilità dei prezzi un peso &lt;b&gt;ancora maggiore&lt;/b&gt; di quello della Bundesbank.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;2. Sviluppo intellettuale: la «monetarist counter-revolution».&lt;/b&gt; Il &lt;b&gt;monetarismo&lt;/b&gt; sostiene che nel lungo periodo l&#x27;inflazione è un fenomeno monetario e che la politica monetaria non può ridurre stabilmente la disoccupazione. Per ridurre l&#x27;&lt;i&gt;inflation bias&lt;/i&gt; (Barro-Gordon, 1983) conviene delegare la politica monetaria a una banca centrale &lt;b&gt;conservatrice&lt;/b&gt; e isolarla dalle pressioni politiche: più indipendenza, meno inflazione. È il tema della parte successiva.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · parte 2&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Associa ciascun articolo al tipo di indipendenza: art. 130, art. 123, art. 283(2).&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Art. 130 → indipendenza istituzionale (niente istruzioni). Art. 123 (con il 124) → indipendenza funzionale (niente finanziamento monetario né accesso privilegiato). Art. 283(2) → indipendenza personale (nomina, mandato di 8 anni non rinnovabile).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. La BCE può sostenere la piena occupazione?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Sì, ma solo «without prejudice» alla stabilità dei prezzi: è un obiettivo secondario e subordinato. La Fed invece ha un dual mandate con occupazione e prezzi sullo stesso piano.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Perché un mandato non rinnovabile rafforza l&#x27;indipendenza?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Chi non può essere riconfermato non ha interesse a compiacere i governi che lo nominano per ottenere un secondo mandato.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ S3 ============ --&gt;
&lt;section class=&quot;part p-ard&quot; id=&quot;s3&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 3 · slide 17–21, 29–32&lt;/div&gt;
&lt;h2&gt;Perché l&#x27;indipendenza? Barro-Gordon, time inconsistency, evidenza&lt;/h2&gt;

&lt;h3&gt;Preferenze diverse&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Governi&lt;/h4&gt;&lt;p&gt;Puntano a crescita, posti di lavoro… e &lt;b&gt;rielezione&lt;/b&gt;. Guardano al breve periodo: preferiscono politiche con effetti positivi immediati anche se dannose nel lungo, come spingere crescita e occupazione oggi a costo di più inflazione domani. Tendono a spendere troppo nelle fasi espansive. Sono &lt;b&gt;meno inflation-averse&lt;/b&gt; e &lt;b&gt;più unemployment-averse&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Banca centrale&lt;/h4&gt;&lt;p&gt;Ha come obiettivo principale la stabilità dei prezzi ed è indipendente. I banchieri centrali hanno mandati più lunghi dei cicli politici e non possono essere rimossi per come gestiscono la politica monetaria. L&#x27;indipendenza della BCE fa sì che la politica monetaria non serva a scopi diversi dalla stabilità dei prezzi.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Il grafico delle preferenze: uno shock negativo&lt;/h3&gt;
&lt;p&gt;Assi: disoccupazione &lt;i&gt;u&lt;/i&gt; (orizzontale) e inflazione &lt;i&gt;π&lt;/i&gt; (verticale). L&#x27;origine è il punto (p*, u*), cioè inflazione obiettivo e tasso naturale. Uno &lt;b&gt;shock negativo&lt;/b&gt; (per esempio di offerta) sposta a destra la &lt;b&gt;short-run Phillips curve&lt;/b&gt;, la relazione inversa di breve periodo tra inflazione e disoccupazione. Ogni decisore sceglie il punto della nuova curva che sta sulla propria &lt;b&gt;retta delle preferenze&lt;/b&gt;. La retta ripida (governo) accetta molta inflazione pur di contenere la disoccupazione. Quella piatta (BCE) accetta più disoccupazione pur di tenere bassa l&#x27;inflazione.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;Entità dello shock &lt;input type=&quot;range&quot; id=&quot;bg-s&quot; min=&quot;0.5&quot; max=&quot;5&quot; step=&quot;0.1&quot; value=&quot;3&quot;&gt;&lt;/label&gt;&lt;label&gt;Avversione all&#x27;inflazione della BCE &lt;input type=&quot;range&quot; id=&quot;bg-c&quot; min=&quot;0.15&quot; max=&quot;1.5&quot; step=&quot;0.05&quot; value=&quot;0.4&quot;&gt;&lt;/label&gt;&lt;/div&gt;
&lt;svg id=&quot;bg-svg&quot; viewBox=&quot;0 0 640 360&quot; aria-label=&quot;Preferenze governo e banca centrale&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;out&quot; id=&quot;bg-out&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Ricostruzione interattiva della slide «Preferences: Government vs CB». Le curve sono lineari e i numeri illustrativi. Il risultato da ricordare: davanti allo stesso shock il governo vorrebbe &lt;b&gt;più stabilizzazione&lt;/b&gt; della disoccupazione, la banca centrale meno.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Time inconsistency e inflation bias&lt;/h3&gt;
&lt;p&gt;Negli anni &#x27;70 un&#x27;inflazione diffusa spinse a ripensare la governance delle banche centrali, e negli anni &#x27;80 molti banchieri centrali erano diventati monetaristi. La ricerca di riferimento è sul problema della &lt;b&gt;time inconsistency&lt;/b&gt; (Kydland e Prescott, 1977; Barro e Gordon, 1983).&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Time inconsistency&lt;/b&gt; (incoerenza temporale)&lt;br&gt;Un piano ottimo &lt;i&gt;oggi&lt;/i&gt; («inflazione bassa») smette di essere ottimo &lt;i&gt;domani&lt;/i&gt;, quando le aspettative sono già fissate: a quel punto conviene sorprendere con più inflazione per ridurre la disoccupazione. Il pubblico lo sa e se lo aspetta. Se la banca centrale ha molta discrezionalità, i governi possono fare pressione su di essa.&lt;/div&gt;
&lt;div class=&quot;stepper&quot; id=&quot;tc-step&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;Passo 1&lt;/span&gt;&lt;p&gt;La curva di Phillips con aspettative: &lt;span class=&quot;formula&quot; style=&quot;display:block&quot;&gt;&lt;i&gt;u&lt;/i&gt; = &lt;i&gt;u&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt; − &lt;i&gt;c&lt;/i&gt;(&lt;i&gt;π&lt;/i&gt; − &lt;i&gt;π&lt;sup&gt;e&lt;/sup&gt;&lt;/i&gt;)&lt;/span&gt; La disoccupazione scende sotto il tasso naturale &lt;i&gt;u&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt; solo se l&#x27;inflazione supera quella attesa &lt;i&gt;π&lt;sup&gt;e&lt;/sup&gt;&lt;/i&gt; (una «sorpresa»).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;Passo 2&lt;/span&gt;&lt;p&gt;Il decisore minimizza una perdita: &lt;span class=&quot;formula&quot; style=&quot;display:block&quot;&gt;&lt;i&gt;L&lt;/i&gt; = &lt;i&gt;π&lt;/i&gt;² + &lt;i&gt;λ&lt;/i&gt;(&lt;i&gt;u&lt;/i&gt; − &lt;i&gt;k·u&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt;)², &amp;nbsp; 0 &amp;lt; &lt;i&gt;k&lt;/i&gt; &amp;lt; 1&lt;/span&gt; &lt;i&gt;λ&lt;/i&gt; è il peso dato alla disoccupazione. &lt;i&gt;k&lt;/i&gt; &amp;lt; 1 vuol dire che il governo vorrebbe una disoccupazione &lt;b&gt;sotto&lt;/b&gt; il tasso naturale, per esempio per motivi elettorali.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;Passo 3&lt;/span&gt;&lt;p&gt;Con &lt;b&gt;discrezionalità&lt;/b&gt;, prese per date le aspettative, conviene creare inflazione: dalla condizione del primo ordine si ricava &lt;i&gt;π&lt;/i&gt; = &lt;i&gt;λc&lt;/i&gt;(&lt;i&gt;u&lt;/i&gt; − &lt;i&gt;k·u&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;Passo 4&lt;/span&gt;&lt;p&gt;Il pubblico ha &lt;b&gt;aspettative razionali&lt;/b&gt; e anticipa la mossa: &lt;i&gt;π&lt;sup&gt;e&lt;/sup&gt;&lt;/i&gt; = &lt;i&gt;π&lt;/i&gt;, quindi &lt;i&gt;u&lt;/i&gt; = &lt;i&gt;u&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt;. Il risultato è &lt;span class=&quot;formula&quot; style=&quot;display:block&quot;&gt;&lt;i&gt;π&lt;/i&gt;&lt;sup&gt;disc&lt;/sup&gt; = &lt;i&gt;λ c&lt;/i&gt; (1 − &lt;i&gt;k&lt;/i&gt;) &lt;i&gt;u&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt; &amp;gt; 0&lt;/span&gt; Questo è l&#x27;&lt;b&gt;inflation bias&lt;/b&gt;: più inflazione con la &lt;b&gt;stessa&lt;/b&gt; disoccupazione. Una perdita netta.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;Passo 5&lt;/span&gt;&lt;p&gt;&lt;b&gt;Soluzione&lt;/b&gt;: affidare la politica monetaria a una banca centrale &lt;b&gt;conservative&lt;/b&gt;, con &lt;i&gt;λ&lt;/i&gt; basso (idea attribuita a Rogoff, 1985, non citato nelle slide), e &lt;b&gt;isolarla&lt;/b&gt; dalle pressioni politiche. Meno peso alla disoccupazione vuol dire meno bias: l&#x27;indipendenza porta a meno inflazione.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← indietro&lt;/button&gt;&lt;span data-count&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;avanti →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;λ governo &lt;input type=&quot;range&quot; id=&quot;ib-lg&quot; min=&quot;0&quot; max=&quot;2&quot; step=&quot;0.05&quot; value=&quot;1&quot;&gt;&lt;/label&gt;&lt;label&gt;λ BCE conservatrice &lt;input type=&quot;range&quot; id=&quot;ib-lc&quot; min=&quot;0&quot; max=&quot;2&quot; step=&quot;0.05&quot; value=&quot;0.25&quot;&gt;&lt;/label&gt;&lt;label&gt;k &lt;input type=&quot;range&quot; id=&quot;ib-k&quot; min=&quot;0.5&quot; max=&quot;1&quot; step=&quot;0.01&quot; value=&quot;0.8&quot;&gt;&lt;/label&gt;&lt;/div&gt;
&lt;svg id=&quot;ib-svg&quot; viewBox=&quot;0 0 640 200&quot; aria-label=&quot;Inflation bias&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Calcolatore dell&#x27;inflation bias con &lt;i&gt;c&lt;/i&gt; = 1 e &lt;i&gt;u&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt; = 8%. In tutti i casi la disoccupazione di equilibrio resta &lt;i&gt;u&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt;: l&#x27;inflazione in più non compra occupazione. Con &lt;i&gt;k&lt;/i&gt; = 1 (nessuna voglia di andare sotto il tasso naturale) il bias sparisce.&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Più banche centrali indipendenti dagli anni &#x27;80&lt;/h3&gt;
&lt;p&gt;Distribuzione di un indice di indipendenza &lt;i&gt;x&lt;/i&gt; tra 0 e 1 (Crowe e Meade, 2007; dati 1980-89 da Cukierman, Webb e Neyapti, 1992).&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;span class=&quot;tabs&quot; style=&quot;margin:0&quot; id=&quot;cbi-g&quot;&gt;&lt;button class=&quot;btn on&quot; data-g=&quot;0&quot;&gt;Tutti i Paesi&lt;/button&gt;&lt;button class=&quot;btn&quot; data-g=&quot;1&quot;&gt;Avanzati&lt;/button&gt;&lt;button class=&quot;btn&quot; data-g=&quot;2&quot;&gt;Emergenti e in via di sviluppo&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;
&lt;svg id=&quot;cbi-svg&quot; viewBox=&quot;0 0 640 260&quot; aria-label=&quot;Distribuzione dell&#x27;indipendenza delle banche centrali&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Barre chiare: 1980-89. Barre scure: 2003. Numero di banche centrali per classe dell&#x27;indice. La massa si sposta verso destra; nel 2003 28 banche su 96 hanno &lt;i&gt;x&lt;/i&gt; &amp;gt; 0,8 (nessuna negli anni &#x27;80).&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Indipendenza e inflazione: correlazione o causalità?&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg id=&quot;as-svg&quot; viewBox=&quot;0 0 640 330&quot; aria-label=&quot;Indipendenza e inflazione media 1955-1988&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Ricostruito dal grafico di Alesina e Summers (1993) nelle slide: indice di indipendenza (asse x) e inflazione media 1955-1988 (asse y), 16 Paesi OCSE. Posizioni approssimate. Germania e Svizzera sono le più indipendenti e le meno inflazionistiche.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;La &lt;b&gt;correlazione negativa&lt;/b&gt; è chiara, ma è anche un &lt;b&gt;effetto causale&lt;/b&gt;? Potrebbe esserci &lt;i&gt;endogeneity&lt;/i&gt; (endogeneità): Paesi che già detestano l&#x27;inflazione (come la Germania) creano banche centrali indipendenti, e allora sarebbe la cultura, non la banca, a tenere bassa l&#x27;inflazione. Crowe e Meade (2008; IMF 2008) trovano che:&lt;/p&gt;
&lt;ol&gt;&lt;li&gt;tenendo conto dei &lt;b&gt;country fixed effects&lt;/b&gt; (le caratteristiche fisse di ciascun Paese), l&#x27;indipendenza &lt;b&gt;riduce&lt;/b&gt; l&#x27;inflazione, e il risultato regge ai controlli per endogeneità ed errori di misura con &lt;b&gt;instrumental variables&lt;/b&gt; (variabili strumentali);&lt;/li&gt;
&lt;li&gt;più &lt;b&gt;trasparenza&lt;/b&gt; porta il settore privato a usare di più le informazioni della banca centrale nelle proprie previsioni.&lt;/li&gt;&lt;/ol&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · parte 3&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Nel modello Barro-Gordon con aspettative razionali, cosa ottiene un governo che usa la politica monetaria per ridurre la disoccupazione?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Niente in termini di occupazione: il pubblico anticipa la sorpresa, la disoccupazione resta al tasso naturale e resta solo un&#x27;inflazione più alta (inflation bias).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Cosa significa che la BCE deve essere &quot;conservative&quot;?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Che dà alla stabilità dei prezzi un peso maggiore della società o del governo (λ basso), anche a costo di stabilizzare meno produzione e occupazione.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Perché la sola correlazione di Alesina-Summers non basta a provare che l&#x27;indipendenza riduce l&#x27;inflazione?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Per l&#x27;endogeneità e le variabili omesse: Paesi già avversi all&#x27;inflazione tendono a creare banche indipendenti. Crowe e Meade usano effetti fissi e variabili strumentali per stimare l&#x27;effetto causale.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ S4 ============ --&gt;
&lt;section class=&quot;part p-mat&quot; id=&quot;s4&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 4 · slide 22–28&lt;/div&gt;
&lt;h2&gt;Independence and accountability: a chi risponde la BCE?&lt;/h2&gt;
&lt;p&gt;La BCE è stata costruita per essere un&#x27;istituzione &lt;b&gt;MOLTO&lt;/b&gt; indipendente. Ma chi ne verifica il lavoro?&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Accountability&lt;/b&gt; (responsabilità, obbligo di rendere conto)&lt;br&gt;Quando il governo &lt;b&gt;delega&lt;/b&gt; un potere alla banca centrale, serve un&#x27;accountability corrispondente. Il governo resta pienamente responsabile verso gli &lt;b&gt;elettori&lt;/b&gt;, quindi non può delegare senza mantenere un controllo sull&#x27;uso di quel potere. &lt;b&gt;Indipendenza e accountability sono parti dello stesso processo di delega.&lt;/b&gt;&lt;/div&gt;

&lt;h3&gt;Il «contratto di delega» ideale&lt;/h3&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;i&lt;/span&gt;&lt;h4&gt;Definire gli obiettivi&lt;/h4&gt;&lt;p&gt;Chi delega dice al delegato &lt;i&gt;cosa&lt;/i&gt; deve ottenere.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;ii&lt;/span&gt;&lt;h4&gt;Verificare il lavoro&lt;/h4&gt;&lt;p&gt;Il controllo deve essere tanto più forte quanto maggiori sono i poteri delegati.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;span class=&quot;pill&quot;&gt;iii&lt;/span&gt;&lt;h4&gt;Decidere il rinnovo&lt;/h4&gt;&lt;p&gt;Chi delega decide se rinnovare o no il contratto.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Come va per la BCE: tanti poteri, ma…&lt;/h3&gt;
&lt;div class=&quot;tabset&quot;&gt;
&lt;div class=&quot;tabs&quot;&gt;&lt;button data-tab=&quot;a1&quot; aria-selected=&quot;true&quot;&gt;i · obiettivi vaghi&lt;/button&gt;&lt;button data-tab=&quot;a2&quot;&gt;ii · verifica debole&lt;/button&gt;&lt;button data-tab=&quot;a3&quot;&gt;iii · trasparenza&lt;/button&gt;&lt;/div&gt;
&lt;div data-panel=&quot;a1&quot;&gt;&lt;p&gt;Gli obiettivi del Trattato sono &lt;b&gt;vaghi&lt;/b&gt;. È la BCE stessa a stabilire cosa significa &quot;price stability&quot; (vedi la definizione numerica nella &lt;a href=&quot;#s8&quot;&gt;parte 8&lt;/a&gt;), mentre gli altri obiettivi dell&#x27;art. 3 restano indefiniti.&lt;/p&gt;&lt;p class=&quot;def&quot;&gt;&lt;b&gt;Critica:&lt;/b&gt; il contratto di delega dovrebbe dare alla banca centrale &lt;b&gt;independence of the instruments&lt;/b&gt; (libertà sul &lt;i&gt;come&lt;/i&gt;), ma gli &lt;b&gt;obiettivi&lt;/b&gt; non dovrebbero essere fissati dai politici eletti?&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;a2&quot; hidden&gt;&lt;p&gt;I governi &lt;b&gt;non valutano&lt;/b&gt; la performance della BCE. La BCE riferisce &lt;b&gt;ogni trimestre&lt;/b&gt; al Parlamento europeo (i &lt;i&gt;Monetary Dialogues&lt;/i&gt;), ma il Parlamento non ha poteri su di essa. Per cambiare lo statuto della BCE serve una modifica del Trattato di Maastricht, cioè l&#x27;&lt;b&gt;unanimità&lt;/b&gt; di tutti gli Stati.&lt;/p&gt;&lt;p&gt;Negli USA, invece, le regole della Fed possono essere cambiate dal &lt;b&gt;Congresso&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div data-panel=&quot;a3&quot; hidden&gt;&lt;p&gt;La BCE però è &lt;b&gt;trasparente&lt;/b&gt;: documenti e informazioni (Monthly Bulletin), conferenze stampa dopo le riunioni del Governing Council e, dall&#x27;inizio del &lt;b&gt;2015&lt;/b&gt;, i resoconti (&lt;i&gt;minutes&lt;/i&gt;) delle riunioni di politica monetaria. È una forma di accountability &lt;b&gt;«informale»&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;grid2&quot;&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 400 300&quot; aria-label=&quot;Relazione ottimale tra indipendenza e accountability&quot;&gt;
&lt;line x1=&quot;50&quot; y1=&quot;260&quot; x2=&quot;380&quot; y2=&quot;260&quot; class=&quot;axis&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;260&quot; x2=&quot;50&quot; y2=&quot;20&quot; class=&quot;axis&quot;/&gt;
&lt;text x=&quot;380&quot; y=&quot;285&quot; text-anchor=&quot;end&quot; class=&quot;lbl&quot;&gt;Accountability →&lt;/text&gt;&lt;text x=&quot;18&quot; y=&quot;140&quot; transform=&quot;rotate(-90 18 140)&quot; text-anchor=&quot;middle&quot; class=&quot;lbl&quot;&gt;Independence →&lt;/text&gt;
&lt;path d=&quot;M70,240 L360,40&quot; class=&quot;ln c-mat&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;100&quot; font-size=&quot;11&quot; class=&quot;f-mat&quot; transform=&quot;rotate(-34 300 100)&quot;&gt;relazione ottimale&lt;/text&gt;
&lt;path d=&quot;M70,240 L360,40 L360,20 L70,20 Z&quot; class=&quot;fb-mat&quot; opacity=&quot;.45&quot;/&gt;
&lt;text x=&quot;140&quot; y=&quot;45&quot; font-size=&quot;11&quot; class=&quot;f-mut&quot;&gt;zona «troppa indipendenza»&lt;/text&gt;
&lt;circle cx=&quot;110&quot; cy=&quot;80&quot; r=&quot;6&quot; class=&quot;f-ink&quot;/&gt;&lt;text x=&quot;122&quot; y=&quot;85&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;ECB&lt;/text&gt;
&lt;circle cx=&quot;110&quot; cy=&quot;140&quot; r=&quot;6&quot; class=&quot;f-ink&quot;/&gt;&lt;text x=&quot;122&quot; y=&quot;145&quot; font-size=&quot;13&quot;&gt;Bundesbank&lt;/text&gt;
&lt;circle cx=&quot;230&quot; cy=&quot;170&quot; r=&quot;6&quot; class=&quot;f-ink&quot;/&gt;&lt;text x=&quot;242&quot; y=&quot;175&quot; font-size=&quot;13&quot;&gt;Federal Reserve&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;Dal grafico delle slide: la Fed sta circa sulla retta ottimale, la BCE è molto sopra (più indipendente di quanto la sua accountability giustificherebbe).&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div&gt;&lt;h4&gt;Cosa dice il grafico&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;La BCE è &lt;b&gt;più indipendente&lt;/b&gt; di qualsiasi altra grande banca centrale.&lt;/li&gt;&lt;li&gt;La sua accountability è &lt;b&gt;più debole&lt;/b&gt; di quella della Fed.&lt;/li&gt;&lt;li&gt;Questo va &lt;b&gt;contro la teoria&lt;/b&gt;, secondo cui l&#x27;accountability dovrebbe crescere insieme all&#x27;indipendenza.&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Uno studio recente, però, trova che non è sempre così.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Akbik (2026): l&#x27;erba del vicino è davvero più verde?&lt;/h3&gt;
&lt;p&gt;Lo studio confronta il controllo parlamentare su BCE e Fed durante la crisi Covid-19, con un&#x27;analisi qualitativa di &lt;b&gt;1.014&lt;/b&gt; domande e risposte nelle audizioni tra marzo 2020 e marzo 2022. &lt;b&gt;Risultato:&lt;/b&gt; nel periodo i Monetary Dialogues hanno imposto alla BCE uno standard di accountability &lt;b&gt;più alto&lt;/b&gt; di quello che il Congresso ha imposto alla Fed.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg viewBox=&quot;0 0 640 230&quot; aria-label=&quot;Risposte di BCE e Fed&quot;&gt;
&lt;g font-size=&quot;12.5&quot;&gt;
&lt;text x=&quot;0&quot; y=&quot;20&quot; font-weight=&quot;600&quot;&gt;Tipo di risposta (% delle risposte)&lt;/text&gt;
&lt;text x=&quot;0&quot; y=&quot;52&quot;&gt;Answerability&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;40&quot; width=&quot;164&quot; height=&quot;16&quot; rx=&quot;3&quot; class=&quot;f-mat&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;53&quot;&gt;BCE 41%&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;60&quot; width=&quot;28&quot; height=&quot;16&quot; rx=&quot;3&quot; class=&quot;f-ard&quot;/&gt;&lt;text x=&quot;154&quot; y=&quot;73&quot;&gt;Fed 7%&lt;/text&gt;
&lt;text x=&quot;0&quot; y=&quot;112&quot;&gt;Transparency&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;100&quot; width=&quot;176&quot; height=&quot;16&quot; rx=&quot;3&quot; class=&quot;f-mat&quot;/&gt;&lt;text x=&quot;302&quot; y=&quot;113&quot;&gt;BCE 44%&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;120&quot; width=&quot;356&quot; height=&quot;16&quot; rx=&quot;3&quot; class=&quot;f-ard&quot;/&gt;&lt;text x=&quot;482&quot; y=&quot;133&quot;&gt;Fed 89%&lt;/text&gt;
&lt;text x=&quot;0&quot; y=&quot;170&quot; font-weight=&quot;600&quot;&gt;Volume:&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;170&quot;&gt;il Fed Chair ha ricevuto 3,4 volte più domande (i membri del Congresso fanno domande brevi e dirette)&lt;/text&gt;
&lt;text x=&quot;0&quot; y=&quot;196&quot; font-weight=&quot;600&quot;&gt;Temi BCE:&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;196&quot;&gt;unconventional monetary policy 23%, inflation target 22%&lt;/text&gt;
&lt;text x=&quot;0&quot; y=&quot;220&quot; font-weight=&quot;600&quot;&gt;Temi Fed:&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;220&quot;&gt;occupazione e temi sociali 18%, vigilanza finanziaria 14%, inflazione 13%&lt;/text&gt;
&lt;/g&gt;&lt;/svg&gt;&lt;figcaption&gt;Dati dalle slide 27-28. Answerability: la banca centrale risponde davvero e motiva le scelte. Transparency: si limita a fornire informazioni.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;ext&quot;&gt;Il repository dell&#x27;Università di Leiden indica che l&#x27;articolo è stato pubblicato online il 22 settembre 2025 (DOI 10.1080/13563467.2025.2555354). Il fascicolo citato nelle slide, vol. 31(2), è del 2026. — &lt;a href=&quot;https://scholarlypublications.universiteitleiden.nl/handle/1887/4286377&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Leiden University Scholarly Publications&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · parte 4&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Perché indipendenza e accountability &quot;fanno parte dello stesso processo&quot;?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Entrambe nascono dalla delega: il governo affida un potere alla banca centrale (indipendenza) ma, dovendo rispondere agli elettori, deve poterne controllare l&#x27;uso (accountability).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Quali dei tre elementi del contratto di delega sono deboli nel caso BCE?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;(i) obiettivi vaghi, specificati dalla BCE stessa; (ii) verifica debole: il Parlamento ascolta ma non ha poteri, e cambiare lo statuto richiede l&#x27;unanimità. Resta la trasparenza come accountability informale.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Cosa aggiunge Akbik al quadro &quot;BCE poco accountable&quot;?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Che, nella pratica delle audizioni 2020-22, la BCE ha mostrato più answerability (41% contro 7%) e il Parlamento europeo ha imposto uno standard di accountability più alto di quello del Congresso sulla Fed.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ S5 ============ --&gt;
&lt;section class=&quot;part p-sal&quot; id=&quot;s5&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 5 · slide 29, 33–43&lt;/div&gt;
&lt;h2&gt;La BCE è davvero una banca centrale «conservative»? Il confronto con la Fed&lt;/h2&gt;
&lt;p&gt;La creazione della BCE fu dominata dalla paura dell&#x27;&lt;b&gt;inflation bias&lt;/b&gt;: da qui l&#x27;idea di una BCE &lt;b&gt;conservative&lt;/b&gt;, che dà un&#x27;importanza preponderante alla stabilità dei prezzi e, se necessario, trascura la stabilizzazione di produzione e disoccupazione. Restano &lt;b&gt;due domande&lt;/b&gt;: (1) l&#x27;indipendenza riduce davvero l&#x27;inflazione? (vista nella &lt;a href=&quot;#s3&quot;&gt;parte 3&lt;/a&gt;: sì); (2) la BCE si comporta davvero in modo più conservatore della Fed?&lt;/p&gt;

&lt;h3&gt;Prima prova: i tassi di policy&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg id=&quot;rates-svg&quot; viewBox=&quot;0 0 680 300&quot; aria-label=&quot;Tassi di policy BCE e Fed&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Andamento stilizzato, ricostruito a occhio dal grafico BIS della slide 33: i valori sono approssimati. Nei dati delle slide, nel 1999-2021 la deviazione standard del tasso USA è stata del &lt;b&gt;2%&lt;/b&gt; contro l&#x27;&lt;b&gt;1,5%&lt;/b&gt; della BCE, con medie simili (1,9% e 1,8%): la Fed è più &lt;b&gt;attivista&lt;/b&gt;.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;ul&gt;&lt;li&gt;La Fed ha reagito di più al rallentamento del &lt;b&gt;2001&lt;/b&gt;, tenendo i tassi troppo bassi troppo a lungo.&lt;/li&gt;&lt;li&gt;Poi ha reagito più bruscamente al boom del &lt;b&gt;2004-06&lt;/b&gt; e alla recessione del &lt;b&gt;2007-08&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;Dopo il Covid ha avuto spazio per alzare i tassi man mano che l&#x27;economia ripartiva.&lt;/li&gt;&lt;/ul&gt;

&lt;h3&gt;Ma il ciclo era lo stesso? L&#x27;output gap&lt;/h3&gt;
&lt;p&gt;Confrontare i tassi ha senso solo se l&#x27;area euro e gli USA erano nella stessa fase del ciclo. La misura della fase ciclica è l&#x27;&lt;b&gt;output gap&lt;/b&gt;:&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;i&gt;OG&lt;/i&gt; = (&lt;i&gt;GDP&lt;/i&gt; − &lt;i&gt;GDP&lt;sub&gt;pot&lt;/sub&gt;&lt;/i&gt;) / &lt;i&gt;GDP&lt;sub&gt;pot&lt;/sub&gt;&lt;/i&gt;&lt;/div&gt;
&lt;p&gt;&lt;b&gt;Potential GDP&lt;/b&gt; (PIL potenziale): il PIL ottenibile con un uso &lt;b&gt;normale&lt;/b&gt; di tutte le risorse (lavoro e capitale) al livello attuale di &lt;i&gt;total factor productivity&lt;/i&gt;, la produttività complessiva dei fattori. È il PIL al netto degli effetti, positivi o negativi, della fase ciclica. OG &amp;gt; 0 vuol dire economia «surriscaldata»; OG &amp;lt; 0 vuol dire risorse inutilizzate.&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;GDP &lt;input type=&quot;range&quot; id=&quot;og-y&quot; min=&quot;900&quot; max=&quot;1100&quot; step=&quot;5&quot; value=&quot;970&quot;&gt;&lt;/label&gt;&lt;label&gt;GDP potenziale &lt;input type=&quot;range&quot; id=&quot;og-p&quot; min=&quot;900&quot; max=&quot;1100&quot; step=&quot;5&quot; value=&quot;1000&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;out&quot; id=&quot;og-out&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;div class=&quot;tabs&quot; id=&quot;og-tabs&quot;&gt;&lt;button class=&quot;btn on&quot; data-r=&quot;ez&quot;&gt;Eurozona&lt;/button&gt;&lt;button class=&quot;btn&quot; data-r=&quot;us&quot;&gt;USA&lt;/button&gt;&lt;/div&gt;
&lt;svg id=&quot;og-svg&quot; viewBox=&quot;0 0 680 300&quot; aria-label=&quot;Output gap e tasso a breve&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Barre: output gap (% del potenziale, scala a sinistra). Linea: tasso a breve (%, scala a destra). Valori letti dalle Figure 9.3-9.4 delle slide (fonte originale: OECD &lt;i&gt;Economic Outlook&lt;/i&gt;), quindi approssimati.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Cosa si vede&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;La BCE &lt;b&gt;reagisce&lt;/b&gt; all&#x27;output gap, quindi dà un certo peso alla stabilizzazione della produzione.&lt;/li&gt;&lt;li&gt;La Fed reagisce &lt;b&gt;di più&lt;/b&gt; ai cali dell&#x27;output gap: dà più peso alla stabilizzazione della produzione.&lt;/li&gt;&lt;li&gt;In questo senso la BCE è &lt;b&gt;più conservatrice&lt;/b&gt; della Fed.&lt;/li&gt;&lt;li&gt;La Fed potrebbe aver tenuto i tassi troppo bassi nel 2002-05.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Conclusione (slide 36)&lt;/h4&gt;&lt;p&gt;La BCE dà più importanza alla stabilità dei prezzi ed è più cauta nel reagire al ciclo. &lt;b&gt;Non&lt;/b&gt; vuol dire che la Fed abbia fatto politiche migliori: c&#x27;è consenso sul fatto che nel &lt;b&gt;2001-04&lt;/b&gt; la politica della Fed sia stata troppo espansiva troppo a lungo. Ha alimentato il boom immobiliare e dei consumi negli USA, finito in modo spettacolare nel &lt;b&gt;2007&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Seconda prova: le misure non convenzionali (QE)&lt;/h3&gt;
&lt;div class=&quot;stepper&quot; id=&quot;qe-step&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;pill&quot;&gt;1 · eredità della crisi&lt;/span&gt;&lt;p&gt;Dopo la crisi finanziaria: inflazione bassa, a volte &lt;b&gt;deflation&lt;/b&gt; (calo generalizzato dei prezzi). Nei dati BIS delle slide gli episodi sono il 2009, il 2015 e il 2020. Nel 2010-17 sia l&#x27;area euro sia gli USA hanno avuto inflazione negativa all&#x27;inizio del 2015.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;2 · zero lower bound&lt;/span&gt;&lt;p&gt;Le pressioni deflazionistiche hanno spinto i tassi nominali &lt;b&gt;verso zero&lt;/b&gt;. Lì il tasso non può più scendere molto: è la &lt;b&gt;zero (o effective) lower bound&lt;/b&gt;, il limite inferiore effettivo dei tassi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;3 · quantitative easing&lt;/span&gt;&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Quantitative easing (QE)&lt;/b&gt;&lt;br&gt;Metodo «non convenzionale» di stimolo: la banca centrale &lt;b&gt;acquista grandi quantità di attività&lt;/b&gt;, tra cui titoli di Stato, per evitare la deflazione.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;4 · base monetaria&lt;/span&gt;&lt;p&gt;Così la banca centrale aumenta la liquidità, cioè la &lt;b&gt;money base&lt;/b&gt; (base monetaria): la moneta creata dalla banca centrale, pari al &lt;b&gt;circolante&lt;/b&gt; più i &lt;b&gt;depositi delle banche commerciali presso la banca centrale&lt;/b&gt;.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;MB = C + R&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;span class=&quot;pill&quot;&gt;5 · bilancio&lt;/span&gt;&lt;p&gt;Effetto: il &lt;b&gt;balance sheet&lt;/b&gt; (bilancio) della banca centrale si gonfia. Le attività comprate stanno nell&#x27;attivo, le riserve create nel passivo. La dimensione del bilancio diventa quindi un indicatore di quanto è stata aggressiva la politica.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← indietro&lt;/button&gt;&lt;span data-count&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;avanti →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg id=&quot;bs-svg&quot; viewBox=&quot;0 0 680 290&quot; aria-label=&quot;Attivi totali BCE e Fed in percentuale del PIL&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Attivi totali in % del PIL (BIS, slide 42), andamento stilizzato e valori approssimati. Fino al 2017 in valore assoluto (slide 40): la Fed sale da fine 2012 fino a circa 4,5 trilioni; la BCE scende nel 2013-14 e poi risale fino a circa 4,2 trilioni nel 2017.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div&gt;&lt;h4&gt;Cosa raccontano i bilanci&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Il contrasto è netto: la &lt;b&gt;Fed&lt;/b&gt; è stata più rapida e aggressiva, con il QE a pieno ritmo da fine 2012. Il bilancio della &lt;b&gt;BCE&lt;/b&gt; invece è &lt;b&gt;calato nel 2013-14&lt;/b&gt;, proprio mentre l&#x27;inflazione scendeva.&lt;/li&gt;&lt;li&gt;La BCE ha avviato il QE solo dal &lt;b&gt;2015&lt;/b&gt;. Ma i contesti sono diversi: nell&#x27;eurozona i finanziamenti passano soprattutto dalle &lt;b&gt;banche&lt;/b&gt;, negli USA dai &lt;b&gt;mercati finanziari&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;Con il QE, gli attivi della BCE hanno superato quelli della Fed.&lt;/li&gt;&lt;li&gt;Entrambe hanno espanso molto il QE durante la &lt;b&gt;pandemia&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;&lt;svg id=&quot;mix-svg&quot; viewBox=&quot;0 0 330 250&quot; aria-label=&quot;Composizione degli attivi&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Composizione degli attivi a fine 2016/inizio 2017 (Credit Suisse, &lt;i&gt;The future of monetary policy&lt;/i&gt;, 2017, nelle slide), valori approssimati. ABS = &lt;i&gt;asset-backed securities&lt;/i&gt;, titoli garantiti da prestiti. La BCE ha più prestiti alle banche, coerente con un sistema bancocentrico.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · parte 5&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Perché non basta confrontare i livelli dei tassi di BCE e Fed per dire quale è più conservatrice?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché le due economie potevano essere in fasi del ciclo diverse. Bisogna guardare come il tasso reagisce all&#x27;output gap.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Calcola l&#x27;output gap se il PIL è 1.020 e il potenziale è 1.000.&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;OG = (1020 − 1000)/1000 = +2%: economia sopra il potenziale. Una banca centrale tenderebbe ad alzare i tassi.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Perché il QE fa crescere il bilancio della banca centrale?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;La banca centrale paga i titoli acquistati creando riserve (base monetaria): crescono insieme l&#x27;attivo (titoli) e il passivo (riserve delle banche).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;4. Cita un argomento che &quot;giustifica&quot; la lentezza della BCE nel QE.&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Nell&#x27;eurozona l&#x27;intermediazione è soprattutto bancaria, quindi comprare titoli sul mercato è meno efficace che negli USA, dove i mercati finanziari portano i fondi all&#x27;economia reale.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ S6 ============ --&gt;
&lt;section class=&quot;part p-ocr&quot; id=&quot;s6&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 6 · slide 44–45&lt;/div&gt;
&lt;h2&gt;Responsabilità più ampie e nuovi compiti&lt;/h2&gt;
&lt;blockquote&gt;«Central banks have, for example, started acting in the areas of macro- and micro-prudential supervision and crisis management. […] Critical voices claim that central banks have been over-stretching their mandates, blurring or even crossing the line into fiscal and economic policy. […] This has re-opened the debate surrounding the legitimacy, and the precise scope, of central bank independence.» &lt;br&gt;&lt;span class=&quot;src&quot;&gt;— Yves Mersch (Executive Board BCE), «Central bank independence revisited», 2017, citato nelle slide&lt;/span&gt;&lt;/blockquote&gt;
&lt;p&gt;In sintesi: QE e nuove funzioni hanno &lt;b&gt;effetti distributivi&lt;/b&gt; (su reddito e ricchezza) e possono sembrare un sussidio al settore finanziario. Sono materie che di solito richiedono &lt;b&gt;legittimazione democratica&lt;/b&gt;, e per questo tornano le domande della &lt;a href=&quot;#s4&quot;&gt;parte 4&lt;/a&gt; sull&#x27;accountability.&lt;/p&gt;

&lt;h3&gt;I nuovi compiti dopo le crisi finanziaria e del debito sovrano&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Vigilanza prudenziale diretta&lt;/b&gt; sulle banche significative&lt;/li&gt;&lt;li&gt;Strumenti &lt;b&gt;macroprudenziali&lt;/b&gt;, in aggiunta a quelli microprudenziali&lt;/li&gt;&lt;li&gt;Partecipazione alla &lt;b&gt;gestione delle crisi&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Raccordo con la Commissione nei programmi di assistenza tramite &lt;b&gt;ESM&lt;/b&gt; (&lt;i&gt;European Stability Mechanism&lt;/i&gt;) ed &lt;b&gt;EFSF&lt;/b&gt; (&lt;i&gt;European Financial Stability Facility&lt;/i&gt;)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;&lt;svg viewBox=&quot;0 0 340 200&quot; aria-label=&quot;Micro e macroprudenziale&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;150&quot; height=&quot;180&quot; rx=&quot;12&quot; class=&quot;fb-ocr&quot;/&gt;&lt;rect x=&quot;180&quot; y=&quot;10&quot; width=&quot;150&quot; height=&quot;180&quot; rx=&quot;12&quot; class=&quot;fb-ard&quot;/&gt;
&lt;text x=&quot;85&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Microprudential&lt;/text&gt;&lt;text x=&quot;255&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;13&quot;&gt;Macroprudential&lt;/text&gt;
&lt;g class=&quot;c-ocr&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;70&quot; width=&quot;34&quot; height=&quot;34&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;96&quot; y=&quot;70&quot; width=&quot;34&quot; height=&quot;34&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;40&quot; y=&quot;120&quot; width=&quot;34&quot; height=&quot;34&quot; rx=&quot;4&quot;/&gt;&lt;rect x=&quot;96&quot; y=&quot;120&quot; width=&quot;34&quot; height=&quot;34&quot; rx=&quot;4&quot;/&gt;&lt;/g&gt;
&lt;circle cx=&quot;57&quot; cy=&quot;87&quot; r=&quot;24&quot; class=&quot;c-acc&quot; fill=&quot;none&quot; stroke-width=&quot;2&quot;/&gt;
&lt;g class=&quot;c-ard&quot; stroke-width=&quot;2&quot;&gt;&lt;line x1=&quot;226&quot; y1=&quot;87&quot; x2=&quot;284&quot; y2=&quot;87&quot;/&gt;&lt;line x1=&quot;226&quot; y1=&quot;87&quot; x2=&quot;226&quot; y2=&quot;137&quot;/&gt;&lt;line x1=&quot;284&quot; y1=&quot;87&quot; x2=&quot;284&quot; y2=&quot;137&quot;/&gt;&lt;line x1=&quot;226&quot; y1=&quot;137&quot; x2=&quot;284&quot; y2=&quot;137&quot;/&gt;&lt;line x1=&quot;226&quot; y1=&quot;87&quot; x2=&quot;284&quot; y2=&quot;137&quot;/&gt;&lt;/g&gt;
&lt;g class=&quot;f-ard&quot;&gt;&lt;circle cx=&quot;226&quot; cy=&quot;87&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;284&quot; cy=&quot;87&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;226&quot; cy=&quot;137&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;284&quot; cy=&quot;137&quot; r=&quot;9&quot;/&gt;&lt;/g&gt;
&lt;ellipse cx=&quot;255&quot; cy=&quot;112&quot; rx=&quot;62&quot; ry=&quot;50&quot; class=&quot;c-acc&quot; fill=&quot;none&quot; stroke-width=&quot;2&quot;/&gt;
&lt;text x=&quot;85&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;la singola banca&lt;/text&gt;&lt;text x=&quot;255&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;il sistema nel suo insieme&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;/div&gt;
&lt;p&gt;&lt;b&gt;Microprudential supervision&lt;/b&gt; rende più solida la &lt;b&gt;singola istituzione&lt;/b&gt;. La &lt;b&gt;macroprudential policy&lt;/b&gt; rafforza la resistenza ai rischi che nascono per il &lt;b&gt;sistema finanziario nel suo complesso&lt;/b&gt; (contagi, bolle, rischio sistemico). Le due funzioni si completano, ma i mandati di politica monetaria, politica macroprudenziale e vigilanza microprudenziale restano &lt;b&gt;separati&lt;/b&gt;. Per questo ci sono le riunioni distinte del Governing Council viste nella &lt;a href=&quot;#s1&quot;&gt;parte 1&lt;/a&gt;.&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;Secondo la pagina BCE sui compiti di stabilità finanziaria, la BCE ha ottenuto strumenti macroprudenziali con l&#x27;entrata in vigore del Regolamento SSM (&lt;i&gt;Single Supervisory Mechanism&lt;/i&gt;) nel novembre 2014. Può imporre buffer di capitale più alti di quelli nazionali, e le autorità nazionali devono notificarle in anticipo le proprie misure. — &lt;a href=&quot;https://www.ecb.europa.eu/ecb/orga/tasks/stability/tasks/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB, Tasks on financial stability and macroprudential policy&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · parte 6&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Distingui microprudential supervision e macroprudential policy.&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;La prima guarda alla solidità delle singole istituzioni finanziarie, la seconda ai rischi per il sistema finanziario nel suo insieme.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Perché i nuovi compiti riaprono il dibattito sull&#x27;indipendenza?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché toccano aree vicine alla politica fiscale ed economica, con effetti distributivi su reddito e ricchezza: ambiti che di solito richiedono più legittimazione democratica e controllo.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ S7 ============ --&gt;
&lt;section class=&quot;part p-ard&quot; id=&quot;s7&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 7 · slide 46–59&lt;/div&gt;
&lt;h2&gt;Interesse nazionale o dell&#x27;Unione? Il Governing Council alla prova&lt;/h2&gt;
&lt;p&gt;Le condizioni economiche dei Paesi dell&#x27;euro possono essere diverse per &lt;b&gt;divergenze&lt;/b&gt;, per istituzioni diverse e per &lt;b&gt;asymmetric shocks&lt;/b&gt;, cioè shock che colpiscono i Paesi in modo diverso (per esempio una crisi che tocca solo la periferia). È il problema classico della teoria delle &lt;b&gt;optimum currency areas&lt;/b&gt; (aree valutarie ottimali): con un solo tasso d&#x27;interesse non si può rispondere a shock diversi. Ogni governatore potrebbe quindi volere una politica diversa. Le domande delle slide: gli interessi nazionali possono prevalere su quelli dell&#x27;Unione? L&#x27;eterogeneità è un rischio per le decisioni?&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Niente voto ponderato (qualified voting) nel Governing Council&lt;/b&gt;&lt;br&gt;La ragione sta nel Trattato: un voto pesato per Paese farebbe pensare che i membri rappresentino interessi nazionali. Invece devono occuparsi dell&#x27;interesse dell&#x27;area euro &lt;b&gt;nel suo insieme&lt;/b&gt;, non di quello del Paese da cui vengono.&lt;/div&gt;

&lt;h3&gt;Il sistema di rotazione dei voti&lt;/h3&gt;
&lt;p&gt;Per mantenere il Governing Council capace di decidere anche con più Paesi, i Trattati prevedevano una &lt;b&gt;rotation system&lt;/b&gt; da quando i governatori fossero stati più di 18. L&#x27;ingresso della &lt;b&gt;Lituania nel 2015&lt;/b&gt; l&#x27;ha fatta scattare, secondo le regole definite dal Governing Council nel &lt;b&gt;dicembre 2002&lt;/b&gt;.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;div class=&quot;ctrl&quot;&gt;&lt;span class=&quot;tabs&quot; style=&quot;margin:0&quot; id=&quot;rot-cfg&quot;&gt;&lt;button class=&quot;btn on&quot; data-n=&quot;15&quot;&gt;Esempio slide: 20 Stati&lt;/button&gt;&lt;button class=&quot;btn&quot; data-n=&quot;16&quot;&gt;2026: 21 Stati&lt;/button&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; id=&quot;rot-next&quot;&gt;Mese successivo ↻&lt;/button&gt;&lt;span id=&quot;rot-m&quot; class=&quot;pill&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;svg id=&quot;rot-svg&quot; viewBox=&quot;0 0 640 330&quot; aria-label=&quot;Rotazione dei voti nel Governing Council&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Pieno = vota questo mese; vuoto = partecipa e parla, ma non vota. La sequenza mensile è &lt;b&gt;semplificata&lt;/b&gt; a scopo illustrativo: il calendario reale è pubblicato dalla BCE.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Due gruppi, diritti simili&lt;/h4&gt;&lt;p&gt;Gruppo 1, i cinque Paesi «più grandi» (DE, FR, IT, ES, NL): 4 voti per 5 governatori, &lt;b&gt;4/5 = 0,8&lt;/b&gt;.&lt;br&gt;Gruppo 2, gli altri: 11 voti per 15 governatori, &lt;b&gt;11/15 = 0,73&lt;/b&gt;.&lt;br&gt;Con 6 voti permanenti dell&#x27;Executive Board si arriva a &lt;b&gt;21 voti&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Il confronto con il FOMC&lt;/h4&gt;&lt;p&gt;Il FOMC della Fed funziona in modo simile: 12 membri votanti, di cui 7 del Board (le slide dicono «nominati dal Congresso»; più precisamente li nomina il Presidente USA con la conferma del Senato) con voto permanente, e 5 rappresentanti delle Fed regionali a rotazione. La rotazione è &lt;b&gt;annuale&lt;/b&gt;, non mensile come nella BCE.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;Secondo la spiegazione della BCE sulla rotazione, dopo l&#x27;ingresso della Bulgaria nel 2026 i governatori sono 21 e quelli del gruppo 2 sono 16, che si dividono 11 voti: 11/16 ≈ 0,69. I non votanti partecipano comunque alle discussioni. — &lt;a href=&quot;https://www.ecb.europa.eu/explainers/tell-me-more/html/voting-rotation.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB Explainers, voting rotation&lt;/a&gt;&lt;/div&gt;

&lt;h3&gt;Quale tasso vorrebbe ogni Paese? La Taylor rule&lt;/h3&gt;
&lt;p&gt;Per misurare quanto sono lontane le preferenze serve una stima del tasso «desiderato» da ciascun Paese se fosse indipendente. Lo strumento è la &lt;b&gt;Taylor rule&lt;/b&gt; (John Taylor, 1993, &lt;i&gt;Discretion versus policy rules in practice&lt;/i&gt;). Nella versione originale:&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;i&gt;r&lt;/i&gt; = &lt;i&gt;p&lt;/i&gt; + 0,5&lt;i&gt;y&lt;/i&gt; + 0,5(&lt;i&gt;p&lt;/i&gt; − 2) + 2&lt;/div&gt;
&lt;p&gt;&lt;i&gt;r&lt;/i&gt; = &lt;b&gt;federal funds rate&lt;/b&gt; (il tasso a cui le banche si prestano overnight le riserve in eccesso, obiettivo del FOMC); &lt;i&gt;p&lt;/i&gt; = inflazione degli ultimi quattro trimestri; &lt;i&gt;y&lt;/i&gt; = 100(&lt;i&gt;Y&lt;/i&gt; − &lt;i&gt;Y&lt;/i&gt;*)/&lt;i&gt;Y&lt;/i&gt;* = scostamento percentuale del PIL reale dal trend (che era del 2,2% annuo nel 1984-92); il &lt;b&gt;2&lt;/b&gt; finale è il &lt;b&gt;tasso reale di lungo periodo&lt;/b&gt;. Taylor mostra che questa «policy rule» riproduce molto bene il federal funds rate del 1987-1992.&lt;/p&gt;
&lt;p&gt;Forma generale usata nel corso:&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;&lt;i&gt;r&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;* = &lt;i&gt;ρ&lt;/i&gt; + &lt;i&gt;π&lt;/i&gt; + &lt;i&gt;a&lt;/i&gt;(&lt;i&gt;π&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; − &lt;i&gt;π&lt;/i&gt;*) + &lt;i&gt;b x&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/div&gt;
&lt;p&gt;&lt;i&gt;r&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;* tasso desiderato; &lt;i&gt;ρ&lt;/i&gt; tasso reale di lungo periodo; &lt;i&gt;π&lt;/i&gt;* inflation target; &lt;i&gt;x&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; output gap; &lt;i&gt;a&lt;/i&gt;, &lt;i&gt;b&lt;/i&gt; sono i pesi dati a inflazione e ciclo.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;π (%) &lt;input type=&quot;range&quot; id=&quot;tr-pi&quot; min=&quot;-1&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;2&quot;&gt;&lt;/label&gt;
&lt;label&gt;output gap x (%) &lt;input type=&quot;range&quot; id=&quot;tr-x&quot; min=&quot;-6&quot; max=&quot;4&quot; step=&quot;0.1&quot; value=&quot;0&quot;&gt;&lt;/label&gt;
&lt;label&gt;a &lt;input type=&quot;range&quot; id=&quot;tr-a&quot; min=&quot;0&quot; max=&quot;2&quot; step=&quot;0.1&quot; value=&quot;0.5&quot;&gt;&lt;/label&gt;
&lt;label&gt;b &lt;input type=&quot;range&quot; id=&quot;tr-b&quot; min=&quot;0&quot; max=&quot;2&quot; step=&quot;0.1&quot; value=&quot;0.5&quot;&gt;&lt;/label&gt;
&lt;span&gt;&lt;button class=&quot;btn&quot; id=&quot;tr-p1&quot;&gt;Taylor 1993 (a=b=0,5)&lt;/button&gt; &lt;button class=&quot;btn&quot; id=&quot;tr-p2&quot;&gt;Tabella 9.1 (a=1,5, b=0,5)&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;
&lt;svg id=&quot;tr-svg&quot; viewBox=&quot;0 0 640 120&quot; aria-label=&quot;Scomposizione della Taylor rule&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;out&quot; id=&quot;tr-out&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Con ρ = 2% e π* = 2%. Prova un output gap fortemente negativo: la regola può chiedere tassi &lt;b&gt;negativi&lt;/b&gt;, e qui entra in gioco la lower bound (&lt;a href=&quot;#s8&quot;&gt;parte 8&lt;/a&gt;).&lt;/figcaption&gt;&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;Perché il coefficiente totale sull&#x27;inflazione è maggiore di 1?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Nella regola l&#x27;inflazione entra due volte: con coefficiente 1 e con &lt;i&gt;a&lt;/i&gt;. Se l&#x27;inflazione sale di 1 punto, il tasso nominale sale di 1 + &lt;i&gt;a&lt;/i&gt; &amp;gt; 1 punti, quindi il tasso &lt;b&gt;reale&lt;/b&gt; sale e frena l&#x27;economia. È il cosiddetto &lt;i&gt;Taylor principle&lt;/i&gt; (spiegazione aggiuntiva, non presente nelle slide).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;2010: tassi desiderati molto diversi (Tabella 9.1)&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;div class=&quot;ctrl&quot;&gt;&lt;span class=&quot;tabs&quot; style=&quot;margin:0&quot; id=&quot;dr-t&quot;&gt;&lt;button class=&quot;btn on&quot; data-eb=&quot;1&quot;&gt;Con Executive Board&lt;/button&gt;&lt;button class=&quot;btn&quot; data-eb=&quot;0&quot;&gt;Senza Executive Board&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;
&lt;svg id=&quot;dr-svg&quot; viewBox=&quot;0 0 680 300&quot; aria-label=&quot;Tassi desiderati e peso dei Paesi&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;out&quot; id=&quot;dr-out&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Ipotesi: a = 1,5, b = 0,5, ρ = 2%, π* = 2%. Asse verticale: peso economico relativo del Paese. L&#x27;Executive Board (6 voti) è collocato al tasso «di area» di 1,41%.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Intervallo del tasso desiderato&lt;/th&gt;&lt;th&gt;&amp;lt; 1&lt;/th&gt;&lt;th&gt;1–1,5&lt;/th&gt;&lt;th&gt;1,5–2&lt;/th&gt;&lt;th&gt;2–2,5&lt;/th&gt;&lt;th&gt;&amp;gt; 2,5&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Voti senza EB&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Voti con EB&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;&lt;b&gt;8&lt;/b&gt;&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;La teoria dell&#x27;elettore mediano&lt;/h4&gt;&lt;p&gt;Con il voto a maggioranza su un&#x27;unica variabile (il tasso), vince la proposta preferita dall&#x27;&lt;b&gt;elettore mediano&lt;/b&gt;, quello che ha metà dei votanti a sinistra e metà a destra. Questo vale solo se le preferenze sono &lt;b&gt;single-peaked&lt;/b&gt; (unimodali). Con una distribuzione &lt;b&gt;multimodale&lt;/b&gt;, cioè con più gruppi separati, la maggioranza può essere instabile o guidata dagli interessi nazionali.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Il ruolo strategico dell&#x27;Executive Board&lt;/h4&gt;&lt;p&gt;Senza EB ci sarebbero &lt;b&gt;tre gruppi di peso uguale&lt;/b&gt; (3, 3, 3 voti): una scelta a maggioranza problematica. Con i 6 voti dell&#x27;EB concentrati attorno al tasso d&#x27;area, la distribuzione diventa unimodale e il &lt;b&gt;mediano coincide&lt;/b&gt; con la posizione dell&#x27;EB (1,41). L&#x27;EB porta l&#x27;interesse dell&#x27;eurozona nel suo insieme e tiene il controllo anche quando gli shock sono asimmetrici.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;La crisi ha ribaltato le divergenze (Nechio, 2011)&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Prima del 2008&lt;/h4&gt;&lt;p&gt;Il tasso effettivo della BCE era &lt;b&gt;sotto&lt;/b&gt; quello suggerito dalla Taylor rule per la &lt;b&gt;periferia&lt;/b&gt; (inflazione e crescita alte) e vicino a quello del &lt;b&gt;core&lt;/b&gt;. Per la periferia la politica era quindi troppo espansiva.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Dopo il 2008&lt;/h4&gt;&lt;p&gt;La periferia entra in una recessione profonda, poi nella crisi del debito; il core si riprende meglio. Per la periferia la Taylor rule chiede tassi molto &lt;b&gt;negativi&lt;/b&gt; (fino a circa −5% nel 2009-10), e il tasso BCE si trova &lt;b&gt;sopra&lt;/b&gt; la raccomandazione. Ora la politica è troppo restrittiva per la periferia.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Regola usata da Nechio: Target = 1 + 1,5 × Inflazione − 1 × Unemployment gap (fonte: FRBSF Economic Letter, dati OECD ed Eurostat).&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · parte 7&lt;/h3&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Perché nel Governing Council non c&#x27;è voto ponderato per Paese?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché farebbe pensare che i membri rappresentino interessi nazionali, mentre devono decidere nell&#x27;interesse dell&#x27;area euro nel suo complesso.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Con ρ = 2, π = 3, π* = 2, x = −1, a = 0,5, b = 0,5, quanto vale il tasso desiderato?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;r* = 2 + 3 + 0,5·(3−2) + 0,5·(−1) = 2 + 3 + 0,5 − 0,5 = 5%.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Calcola il mediano dei 12 tassi desiderati della Tabella 9.1 senza Executive Board, e poi con l&#x27;EB.&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Senza EB (12 voti) il mediano cade tra il 6° e il 7° valore: (1,57 + 1,59)/2 ≈ 1,58. Con l&#x27;EB (18 voti, 6 dei quali a 1,41) il 9° e il 10° valore sono entrambi 1,41: il mediano coincide con la posizione dell&#x27;EB.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;q&quot;&gt;&lt;p&gt;4. Perché la rotazione dà diritti «simili» ai due gruppi?&lt;/p&gt;&lt;button class=&quot;reveal&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché la quota di tempo in cui si vota è vicina: 4/5 = 0,8 per i grandi e 11/15 ≈ 0,73 per gli altri.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ S8 ============ --&gt;
&lt;section class=&quot;part p-mat&quot; id=&quot;s8&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Parte 8 · slide 60–72&lt;/div&gt;
&lt;h2&gt;La strategia di politica monetaria della BCE&lt;/h2&gt;
&lt;h3&gt;Tre principi condivisi negli anni &#x27;90&lt;/h3&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;1 · Independence, delegation, accountability&lt;/h4&gt;&lt;p&gt;Il tema delle parti 2-4.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;2 · Price stability&lt;/h4&gt;&lt;p&gt;Va messa in posizione di rilievo, possibilmente espressa in termini &lt;b&gt;misurabili&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;3 · Broader strategy&lt;/h4&gt;&lt;p&gt;Spiega &lt;u&gt;come&lt;/u&gt; la banca centrale intende perseguire i suoi obiettivi, compreso il modo di &lt;u&gt;comunicare al pubblico&lt;/u&gt; le valutazioni sull&#x27;economia e l&#x27;orientamento della politica.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;timeline&quot;&gt;
&lt;div&gt;&lt;b&gt;ott. 1998&lt;/b&gt;Prima strategia, adottata dal Governing Council&lt;/div&gt;
&lt;div&gt;&lt;b&gt;mag. 2003&lt;/b&gt;Prima revisione&lt;/div&gt;
&lt;div&gt;&lt;b&gt;8 lug. 2021&lt;/b&gt;Seconda revisione&lt;/div&gt;
&lt;div&gt;&lt;b&gt;30 giu. 2025&lt;/b&gt;&lt;span class=&quot;note&quot;&gt;Valutazione della strategia (fonte esterna, vedi sotto)&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;&lt;b&gt;Ingredienti&lt;/b&gt; di una strategia: (1) la definizione degli obiettivi; (2) l&#x27;orizzonte temporale; (3) gli strumenti; (4) le informazioni usate nell&#x27;analisi, cioè il ruolo di un valore di riferimento per la crescita della moneta, altri dati e una valutazione ampia degli sviluppi futuri dei prezzi.&lt;/p&gt;

&lt;h3&gt;L&#x27;obiettivo: tre versioni della «price stability»&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;div class=&quot;tabs&quot; id=&quot;tg-t&quot;&gt;&lt;button class=&quot;btn on&quot; data-v=&quot;0&quot;&gt;1998&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;1&quot;&gt;2003&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;2&quot;&gt;2021&lt;/button&gt;&lt;/div&gt;
&lt;svg id=&quot;tg-svg&quot; viewBox=&quot;0 0 640 220&quot; aria-label=&quot;Definizioni del target di inflazione&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;out&quot; id=&quot;tg-out&quot;&gt;&lt;/div&gt;&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;Che cos&#x27;è l&#x27;HICP e cosa cambia con l&#x27;owner-occupied housing&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;L&#x27;&lt;b&gt;HICP&lt;/b&gt; (&lt;i&gt;Harmonised Index of Consumer Prices&lt;/i&gt;) è l&#x27;indice dei prezzi al consumo armonizzato, costruito con la stessa metodologia in tutti i Paesi UE. Secondo la revisione del 2021 resta l&#x27;indice adatto a misurare l&#x27;inflazione dell&#x27;area euro ai fini della politica monetaria.&lt;/p&gt;
&lt;p&gt;Il Governing Council ha però proposto di includere l&#x27;&lt;b&gt;owner-occupied housing (OOH)&lt;/b&gt;, cioè i costi dell&#x27;abitazione di proprietà in cui si vive. Si basa sui prezzi di transazione pagati dalle famiglie per comprare casa, separando la parte di &lt;b&gt;investimento&lt;/b&gt; da quella di &lt;b&gt;consumo&lt;/b&gt; e considerando solo quest&#x27;ultima. L&#x27;andamento dell&#x27;inflazione nell&#x27;area euro si può seguire sulla pagina HICP della BCE (link nelle slide).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché «medium term»?&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;Per la BCE il medio termine «riflette la necessità di un orientamento forward-looking» e riconosce che c&#x27;è volatilità di breve periodo nei prezzi che la politica monetaria non può controllare. La politica agisce con &lt;b&gt;ritardi&lt;/b&gt;, quindi deve guardare avanti.&lt;/p&gt;
&lt;p&gt;Così la BCE cerca di controllare l&#x27;inflazione &lt;b&gt;riducendo al minimo i danni a produzione e occupazione&lt;/b&gt;. È una «gradualist policy rule»: nel medio termine c&#x27;è spazio implicito per la stabilizzazione del ciclo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Gli strumenti&lt;/h3&gt;
&lt;p&gt;Gli strumenti usati dalla crisi finanziaria in poi si sono dimostrati efficaci contro le pressioni disinflazionistiche e restano parte del kit vicino all&#x27;&lt;b&gt;effective lower bound&lt;/b&gt;.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Key ECB rates&lt;/h4&gt;&lt;p&gt;Lo strumento principale. Sono tre tassi: deposit facility, main refinancing operations e marginal lending facility (dettaglio aggiunto, non nelle slide). Possono scendere anche &lt;b&gt;sotto zero&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Forward guidance&lt;/h4&gt;&lt;p&gt;Comunicazione sul percorso futuro dei tassi, che orienta le aspettative e quindi i tassi a lungo termine.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Asset purchases&lt;/h4&gt;&lt;p&gt;Acquisti di titoli (QE, &lt;a href=&quot;#s5&quot;&gt;parte 5&lt;/a&gt;) per comprimere i rendimenti a lungo termine.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Longer-term refinancing operations&lt;/h4&gt;&lt;p&gt;Prestiti a lungo termine alle banche, cruciali in un sistema in cui il credito passa dalle banche.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Asimmetria della lower bound&lt;/b&gt;&lt;br&gt;Le banche centrali possono, almeno in teoria, alzare i tassi nominali senza limiti, ma possono abbassarli sotto zero solo di poco. Se non si interviene, questo limite porta a &lt;b&gt;scostamenti persistenti verso il basso&lt;/b&gt; dell&#x27;inflazione dal target, soprattutto quando l&#x27;economia subisce shock disinflazionistici ripetuti. È uno dei motivi del target simmetrico.&lt;/div&gt;

&lt;h3&gt;Il ruolo della politica fiscale (secondo la BCE)&lt;/h3&gt;
