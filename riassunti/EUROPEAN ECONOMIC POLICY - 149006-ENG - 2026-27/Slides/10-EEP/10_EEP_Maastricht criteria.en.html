&lt;details&gt;&lt;summary&gt;Solution outline&lt;/summary&gt;&lt;div&gt;If g &amp;gt; r the slope is less than 1, so the line crosses the 45° line from above. Above b̄ the line lies below the 45° line, so b&lt;sub&gt;t&lt;/sub&gt; &amp;lt; b&lt;sub&gt;t−1&lt;/sub&gt;; below b̄ it lies above, so b&lt;sub&gt;t&lt;/sub&gt; &amp;gt; b&lt;sub&gt;t−1&lt;/sub&gt;. The steps always lead toward b̄. To see this, choose case 1 in the chart in section 7. Algebraically: ((1+r)/(1+g))&lt;sup&gt;t&lt;/sup&gt; tends to 0.&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Exercise 3&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;Using a chart and/or mathematics, explain under what conditions a reduction in deficit/GDP can reduce debt/GDP when r &amp;gt; g. &lt;span class=&quot;src&quot;&gt;slide 49&lt;/span&gt;&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Solution outline&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;From (**), Δb &amp;lt; 0 if and only if a&lt;sup&gt;P&lt;/sup&gt; &amp;gt; b&lt;sub&gt;t−1&lt;/sub&gt;(r − g)/(1 + g). So reducing the deficit is not enough: the primary surplus must be brought above the snowball. Graphically, the line falls until b&lt;sub&gt;t−1&lt;/sub&gt; drops below the new b̄.&lt;/p&gt;
&lt;p&gt;The higher r − g and the higher the debt, the larger the correction must be. If the deficit reduction is too small, debt merely rises more slowly.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;add&quot;&gt;caution&lt;/span&gt; The exercise holds g fixed. If the cut slows growth, g falls, the snowball increases and part of the effect is lost.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;/section&gt;
&lt;section id=&quot;s12&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;→&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;External sources&lt;/span&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;Texts, authors and legal provisions cited in the slides, searched for on the web. Everything in this section is &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; unless otherwise stated.&lt;/p&gt;
&lt;div class=&quot;bib&quot;&gt;
&lt;article&gt;&lt;h4&gt;Delors Report (1989)&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Report on economic and monetary union in the European Community&lt;/i&gt;, presented on April 12, 1989 by the committee chaired by Jacques Delors. It proposes EMU in three stages, with no binding deadlines. It matters because it is the blueprint of the Treaty. &lt;span class=&quot;src&quot;&gt;cited on slide 2&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.cvce.eu/en/education/unit-content/-/unit/02bb76df-d066-4c08-a58a-d4686a3e68ff/43b6bdf1-1bca-4e2f-91fd-1bbfe483af9e&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · CVCE&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://en.wikipedia.org/wiki/Delors_Committee&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · Wikipedia&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;Treaty on European Union (Maastricht, 1992)&lt;/h4&gt;&lt;p&gt;OJ C 191. It creates the Union and introduces EMU in three stages and the principle of subsidiarity (Art. 3b). Worth reading for the original text of the provisions. &lt;span class=&quot;src&quot;&gt;cited on slide 2-6&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/treaty-on-european-union.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · EUR-Lex summary&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://treaties.un.org/doc/Publication/UNTS/Volume%201757/volume-1757-I-30615-English.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · text, UN Treaty Series&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;Art. 104c, now Art. 126 TFEU, and Protocol 12&lt;/h4&gt;&lt;p&gt;Excessive deficit procedure. The Protocol sets the 3% and 60% reference values. The numbers are in an annexed protocol and not in the body of the Treaty; the column by Buti and Gaspar on VoxEU traces their origin and notes that they have no solid basis in theory or data. &lt;span class=&quot;src&quot;&gt;cited on slide 6&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.legislation.gov.uk/eut/teu/attachment/13&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · Protocol 12&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://en.wikisource.org/wiki/Consolidated_version_of_the_Treaty_on_the_Functioning_of_the_European_Union/Title_VIII:_Economic_and_Monetary_Policy&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · Title VIII TFEU&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://cepr.org/voxeu/columns/maastricht-values&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · VoxEU, “Maastricht values”&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;No-bailout and debt monetization: Arts. 125 and 123 TFEU&lt;/h4&gt;&lt;p&gt;The prohibition of bailouts and that of monetary financing, now in these articles. Pringle (C-370/12, November 27, 2012) is the case that answers the question “is this clause credible?”: Art. 125 does not prohibit all aid. &lt;span class=&quot;src&quot;&gt;cited on slide 15-16&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/art_123/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · Art. 123, EUR-Lex&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://europeanlawblog.eu/2012/11/27/to-bail-out-or-to-not-to-bail-out-the-cjeu-confirms-competence-to-conclude-the-esm-treaty/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · commentary on Pringle&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;Barro and Gordon (1983)&lt;/h4&gt;&lt;p&gt;R. J. Barro, D. B. Gordon, &lt;i&gt;Rules, Discretion and Reputation in a Model of Monetary Policy&lt;/i&gt;, Journal of Monetary Economics 12(1), 101-121. Under discretion, surprises are not systematically repeated: rules and reputation improve outcomes. It is the foundation of the inflation bias. &lt;span class=&quot;src&quot;&gt;cited on slide 7&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.nber.org/papers/w1079&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · NBER WP 1079, free&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://econpapers.repec.org/RePEc:eee:moneco:v:12:y:1983:i:1:p:101-121&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · journal record&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;Heller (2005)&lt;/h4&gt;&lt;p&gt;P. S. Heller, &lt;i&gt;Understanding Fiscal Space&lt;/i&gt;, IMF Policy Discussion Paper PDP/05/4. It defines fiscal space and its relationship with sustainability. The definition on the slide comes from here. &lt;span class=&quot;src&quot;&gt;cited on slide 41&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://econpapers.repec.org/RePEc:imf:imfpdp:05/4&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · EconPapers record&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;Aizenman et al. (2013)&lt;/h4&gt;&lt;p&gt;J. Aizenman, M. Hutchison, Y. Jinjarak, &lt;i&gt;What is the risk of European sovereign debt defaults? Fiscal space, CDS spreads and market pricing of risk&lt;/i&gt;, Journal of International Money and Finance 34, 37-59. Fiscal space explains sovereign risk, but in 2010 the euro periphery appears to be priced far beyond fundamentals. &lt;span class=&quot;src&quot;&gt;cited on slide 41&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.nber.org/papers/w17407.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · NBER version&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://escholarship.org/content/qt2914v9fh/qt2914v9fh.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · eScholarship&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;Banca d&#x27;Italia and Istat&lt;/h4&gt;&lt;p&gt;The data sources. &lt;i&gt;Statistiche di finanza pubblica nei paesi dell&#x27;Unione europea&lt;/i&gt; (Public finance statistics in EU countries) is the publication linked on slide 36, with updated editions; the &lt;i&gt;Bollettino Economico&lt;/i&gt; (Economic Bulletin) is cited for the Italian table; Istat estimates the net borrowing and the primary balance notified to the EU. Useful for updating the table&#x27;s data, which stop at 2016. &lt;span class=&quot;src&quot;&gt;cited on slide 33, 36-42&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.bancaditalia.it/pubblicazioni/finanza-pubblica-ue/index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · Statistiche&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.bancaditalia.it/pubblicazioni/bollettino-economico/index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · Bollettino Economico&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.istat.it/it/files//2023/04/Notifica_21_04_2023.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · example of an Istat notification&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;ERM II and conversion rates&lt;/h4&gt;&lt;p&gt;The mechanism was established by the Amsterdam Resolution of June 16, 1997; I did not find the June 1996 ECOFIN document cited in the slides. The conversion rates are in Regulation 2866/98, to which Regulation 2025/1409 added Bulgaria. &lt;span class=&quot;src&quot;&gt;cited on slide 43-46&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://ECB.eu/pub/pdf/other/policyaccexchangerateen.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · ECB, policy on ERM II&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.ecb.europa.eu/ecb/history-arts-culture/history/enlargement/html/faqenlarge.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · ECB, FAQ&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/reg/1998/2866&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · Reg. 2866/98&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/reg/2025/1409/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · Reg. 2025/1409&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;For the debate on 3% and 60%: Buiter, Corsetti, Roubini (1993)&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Excessive Deficits: Sense and Nonsense in the Treaty of Maastricht&lt;/i&gt;, Economic Policy, April 1993. It is not cited in the slides: I add it because it argues that the requirements, especially on debt, are far stricter than solvency requires. It complements section 6.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://ideas.repec.org/p/fth/yalegr/674.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · IDEAS record&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;Probable textbook: De Grauwe, &lt;i&gt;Economics of Monetary Union&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;“Table 6.1” on slide 43 and the framework of the part on the criteria suggest this text, but the slides do not name it: &lt;b&gt;this is my own hypothesis, to be verified&lt;/b&gt; against the course syllabus.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://eprints.lse.ac.uk/46546&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · LSE record&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Limits of this summary.&lt;/b&gt; I was able to read only the PDF of lecture 10. The other materials in the &lt;code&gt;corso/&lt;/code&gt; folder (other lectures, exercises, syllabus) and the Excel file on debt dynamics were not consulted, because I was unable to list the folder: nothing here comes from those files. References to the EMS and interest rate parity should therefore be checked against the previous lectures.&lt;/div&gt;
&lt;/section&gt;
