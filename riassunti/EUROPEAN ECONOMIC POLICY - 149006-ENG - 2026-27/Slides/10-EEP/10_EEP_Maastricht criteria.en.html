&lt;main class=&quot;wrap&quot;&gt;
&lt;section id=&quot;s1&quot; class=&quot;pa&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Part A · The Treaty&lt;/span&gt;&lt;h2&gt;The Maastricht Treaty opens the way to the euro&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;The Treaty on European Union, signed at Maastricht (“TM” in the slides), formally establishes the path to the single currency and to &lt;b&gt;Economic and Monetary Union&lt;/b&gt; (EMU). &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Who made it possible&lt;/h3&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;François Mitterrand&lt;/h4&gt;&lt;p&gt;President of France. Together with Kohl, he mediated between the differing objectives and visions of the member states. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Helmut Kohl&lt;/h4&gt;&lt;p&gt;Chancellor of Germany. He is the other half of the political mediation. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Jacques Delors&lt;/h4&gt;&lt;p&gt;President of the European Commission. His &lt;b&gt;Delors Report&lt;/b&gt; (1989) is the blueprint of the Treaty. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;prose&quot;&gt;The provisions on EMU, based on the Delors Report, are the largest part of the Treaty: stages, convergence, European Central Bank (ECB), ECB independence, fiscal coordination. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;The other provisions of the Treaty&lt;/summary&gt;&lt;div&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Principle of subsidiarity&lt;/b&gt;: the Union acts only where it is more effective than the national level. The definition is taken from the &lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/treaty-on-european-union.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · EUR-Lex&lt;/a&gt;; the slides merely mention it. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Revision of the &lt;b&gt;Structural Funds&lt;/b&gt; (funds to reduce regional disparities) for the Cohesion Objective. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Extension of the Common Market to transport, health, culture and other areas. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Two principles: graduality and convergence&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;&lt;b&gt;Graduality&lt;/b&gt;: the single currency arrives in successive stages, not all at once. &lt;b&gt;Convergence&lt;/b&gt;: a country joins only after satisfying the &lt;i&gt;convergence criteria&lt;/i&gt;, that is, economic conditions that are the same for all. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;

&lt;figure class=&quot;fig&quot; id=&quot;tl&quot;&gt;
&lt;svg viewBox=&quot;0 0 760 118&quot; role=&quot;group&quot; aria-label=&quot;Timeline: choose an event&quot;&gt;

&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Stage 1 · from July 1, 1990&lt;/h4&gt;&lt;p&gt;Liberalization of capital movements. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Stage 2 · from January 1, 1994&lt;/h4&gt;&lt;p&gt;Convergence of the economic policies of the member states. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Stage 3 · from January 1, 1999&lt;/h4&gt;&lt;p&gt;Single currency and creation of the ECB. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Reading note.&lt;/b&gt; Slide 3 attributes all three stages to the Treaty, but stage 1 begins before the 1992 signing. It in fact comes from the Delors Report roadmap and required no treaty changes, according to the &lt;a class=&quot;ext&quot; href=&quot;https://en.wikipedia.org/wiki/Delors_Committee&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · Delors Committee&lt;/a&gt;. In the slides the names appear as “Mitterand” and “Khol”: here I use the correct spellings.&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;What does the principle of convergence add to that of graduality?&lt;/summary&gt;&lt;div&gt;Graduality sets the &lt;i&gt;when&lt;/i&gt;: the stages with their dates. Convergence sets the &lt;i&gt;who&lt;/i&gt;: only a country that meets the criteria may join.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Which stage is linked to the free movement of capital, and why does it matter later on?&lt;/summary&gt;&lt;div&gt;Stage 1. With free capital and stable expected exchange rates, interest rates tend to converge through interest rate parity (section 4).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Signature and entry into force: which dates?&lt;/summary&gt;&lt;div&gt;Signed on February 7, 1992, in force from November 1, 1993. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s2&quot; class=&quot;pa&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Part A · The Treaty&lt;/span&gt;&lt;h2&gt;The five convergence criteria&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;The Treaty requires &lt;i&gt;macroeconomic&lt;/i&gt; convergence, but only in monetary policy and public finance: inflation, interest rates, budgets. The underlying concern is inflation and anything that might fuel it. &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;What is missing.&lt;/b&gt; The criteria do not consider employment, productivity or the structure of the economy: this is what the word “only” on slide 4 conveys. &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; They are therefore nominal criteria: they measure prices, rates and balances, not the degree of real similarity between economies.&lt;/div&gt;

&lt;div class=&quot;split&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Criterion&lt;/th&gt;&lt;th&gt;Condition&lt;/th&gt;&lt;th&gt;Source&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;(1) Inflation&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;≤ average of the 3 lowest rates among the candidates + 1.5&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;(2) Long-term interest rate&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;≤ average of the 3 low-inflation countries + 2&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;(3) Exchange rate&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;within the EMS exchange rate mechanism, with no devaluation in the 2 years before entry&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;(4) Deficit&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;≤ 3% of GDP, or: declining continuously and substantially and close to 3%, or an “exceptional and temporary” excess and close to 3%&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;(5) Debt&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;≤ 60% of GDP, or: “diminish sufficiently” and approaching 60% “at a satisfactory pace”&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; The +1.5 and +2 are to be read as percentage points: they are added to a rate and are not a percentage of it. GDP is gross domestic product.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;The articles cited: 104c and today&#x27;s numbering&lt;/summary&gt;&lt;div&gt;Slide 6 cites Art. 104c(a) and 104c(b) of the Maastricht Treaty. &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; Today the same subject matter is in Art. 126 TFEU, and the 3% and 60% values are in the &lt;a class=&quot;ext&quot; href=&quot;https://www.legislation.gov.uk/eut/teu/attachment/13&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · Protocol 12&lt;/a&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;figure class=&quot;fig&quot; id=&quot;chk&quot; style=&quot;margin-top:0&quot;&gt;
&lt;h4 style=&quot;margin-top:0&quot;&gt;Put a candidate through the test&lt;/h4&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;&lt;span&gt;Average of the 3 lowest inflation rates &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;ref&quot; data-u=&quot; %&quot; min=&quot;0.5&quot; max=&quot;4&quot; step=&quot;0.1&quot; value=&quot;1.5&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;Candidate&#x27;s inflation &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;inf&quot; data-u=&quot; %&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;3.5&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;Long-term rate in the 3 reference countries &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;rr&quot; data-u=&quot; %&quot; min=&quot;2&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;5&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;Candidate&#x27;s long-term rate &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;lr&quot; data-u=&quot; %&quot; min=&quot;2&quot; max=&quot;14&quot; step=&quot;0.1&quot; value=&quot;6.5&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;Deficit / GDP &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;def&quot; data-u=&quot; %&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;3.4&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;Debt / GDP &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;debt&quot; data-u=&quot; %&quot; min=&quot;20&quot; max=&quot;140&quot; step=&quot;1&quot; value=&quot;110&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;tgl&quot;&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;erm&quot; checked&gt;&lt;span&gt;Two years in the exchange rate mechanism, with no devaluation&lt;/span&gt;&lt;/label&gt;
&lt;label class=&quot;tgl&quot;&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;dfall&quot; checked&gt;&lt;span&gt;Deficit falling sharply and close to 3%&lt;/span&gt;&lt;/label&gt;
&lt;label class=&quot;tgl&quot;&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;dbfall&quot; checked&gt;&lt;span&gt;Debt falling at a satisfactory pace&lt;/span&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;pass&quot; id=&quot;chkout&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Starting values are invented. The judgment on “close” and “satisfactory” is simplified: for the deficit, “close” here means up to 4%. &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Worth noting.&lt;/b&gt; The 3% and 60% parameters have escape clauses written in words. Set debt to 110% with the box checked, then uncheck it: &lt;i&gt;the criterion depends on a judgment&lt;/i&gt;, not just on a number.&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Are thresholds (1) and (2) fixed?&lt;/summary&gt;&lt;div&gt;No, they are relative: they depend on the three countries with the lowest inflation. Thresholds (4) and (5), by contrast, are fixed values, but with flexibility clauses.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Can a country with debt at 110% of GDP join?&lt;/summary&gt;&lt;div&gt;According to the text, yes, if the debt “diminish sufficiently” and approaches 60% “at a satisfactory pace”. &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Which economic variables do the criteria ignore?&lt;/summary&gt;&lt;div&gt;Everything that is not monetary or related to public finance, for example unemployment and real growth. &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s3&quot; class=&quot;pb&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Part B · Why the criteria · (1)&lt;/span&gt;&lt;h2&gt;Inflation convergence and inflation bias&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;The inflation criterion is meant to prevent the union from starting with an &lt;b&gt;inflation bias&lt;/b&gt;, that is, a systematic tendency to produce more inflation than would be needed. The analysis is framed within the Barro-Gordon model. &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;The model in words&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;The algebra&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;The chart from the slides&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;prose&quot;&gt;
&lt;p&gt;&lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; The slides take the model as known. It has four components:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Short-run Phillips curve&lt;/b&gt;: inflation above what is expected lowers unemployment for a while.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;U&lt;sub&gt;n&lt;/sub&gt;&lt;/b&gt;, natural rate of unemployment: in the long run unemployment returns here, whatever the inflation rate. Hence the vertical line.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;U*&lt;/b&gt;, the unemployment rate the government would like: it lies &lt;i&gt;below&lt;/i&gt; U&lt;sub&gt;n&lt;/sub&gt;, so the government is tempted to surprise the public with inflation.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Rational expectations&lt;/b&gt;: the public understands the temptation and incorporates it into its expectations. The surprise fails, unemployment stays at U&lt;sub&gt;n&lt;/sub&gt; and only the inflation remains.&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Result: higher inflation with no gain in employment. This is the bias.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;prose&quot;&gt;
&lt;p&gt;&lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; A simple version with a quadratic loss. The coefficient &lt;span class=&quot;m&quot;&gt;a&lt;/span&gt; measures how much the country cares about employment relative to prices.&lt;/p&gt;
&lt;div class=&quot;eq&quot;&gt;L = π² + a (U − U*)²&lt;span class=&quot;tag&quot;&gt;loss function&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;eq&quot;&gt;U = U&lt;sub&gt;n&lt;/sub&gt; − (π − π&lt;sup&gt;e&lt;/sup&gt;) / m&lt;span class=&quot;tag&quot;&gt;Phillips, slope −m&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;The minimum gives the dashed line in the charts, which starts from U*:&lt;/p&gt;
&lt;div class=&quot;eq&quot;&gt;π = (a / m) (U − U*)&lt;/div&gt;
&lt;p&gt;If expectations are correct, U = U&lt;sub&gt;n&lt;/sub&gt;, so the equilibrium is:&lt;/p&gt;
&lt;div class=&quot;eq&quot;&gt;π&lt;sup&gt;eq&lt;/sup&gt; = (a / m) (U&lt;sub&gt;n&lt;/sub&gt; − U*) &amp;gt; 0&lt;/div&gt;
&lt;p&gt;The higher &lt;span class=&quot;m&quot;&gt;a&lt;/span&gt; is, the steeper the line and the higher the equilibrium inflation: this is the difference between the “Italy” and “Germany” lines. With &lt;span class=&quot;m&quot;&gt;U&lt;sub&gt;n&lt;/sub&gt; = U*&lt;/span&gt; the bias would disappear.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;prose&quot;&gt;
&lt;ul&gt;
&lt;li&gt;The &lt;b&gt;concave curves&lt;/b&gt; are the government&#x27;s indifference curves: the closer they are to the point (U*, 0), the better.&lt;/li&gt;
&lt;li&gt;The &lt;b&gt;downward-sloping lines&lt;/b&gt; are short-run Phillips curves.&lt;/li&gt;
&lt;li&gt;The &lt;b&gt;dashed lines&lt;/b&gt; connect the tangency points. They reflect the country&#x27;s preferences.&lt;/li&gt;
&lt;li&gt;E&lt;sub&gt;G&lt;/sub&gt; and E&lt;sub&gt;I&lt;/sub&gt; lie on the vertical line at U&lt;sub&gt;n&lt;/sub&gt;, with the same unemployment and different inflation. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;figure class=&quot;fig&quot; id=&quot;bg&quot;&gt;&lt;div class=&quot;split&quot;&gt;
&lt;div&gt;&lt;svg id=&quot;bgsvg&quot; viewBox=&quot;0 0 520 410&quot; role=&quot;img&quot; aria-label=&quot;Chart of inflation and unemployment with the equilibria of Germany, Italy and the union&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;div&gt;
&lt;h4 style=&quot;margin-top:0&quot;&gt;Two countries, one central bank&lt;/h4&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;&lt;span&gt;Germany: weight on employment &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;sg&quot; min=&quot;0.2&quot; max=&quot;1&quot; step=&quot;0.05&quot; value=&quot;0.45&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;Italy: weight on employment &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;si&quot; min=&quot;1&quot; max=&quot;2.2&quot; step=&quot;0.05&quot; value=&quot;1.7&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;U&lt;sub&gt;n&lt;/sub&gt; natural rate &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;un&quot; data-u=&quot; %&quot; min=&quot;4&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;6&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;Germany&#x27;s weight in the union &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;w&quot; data-u=&quot; %&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;50&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;bgread&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;Diagram with illustrative numbers built on slide 8. Point E&lt;sub&gt;U&lt;/sub&gt; is the average of preferences. &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3&gt;What happens when they join the union&lt;/h3&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Before&lt;/h4&gt;&lt;p&gt;Germany has low inflation and Italy high inflation, owing to different preferences between inflation and unemployment. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;After&lt;/h4&gt;&lt;p&gt;They decide together. Inflation reflects the average of preferences and lies between E&lt;sub&gt;I&lt;/sub&gt; and E&lt;sub&gt;G&lt;/sub&gt;. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Who wins&lt;/h4&gt;&lt;p&gt;Germany loses welfare, Italy gains it. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;What Germany asks for&lt;/h4&gt;&lt;p&gt;Evidence that Italy has the same preference for price stability, that is, criterion (1), and an ECB that is a clone of the Bundesbank. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The problem of reducing inflation&lt;/h3&gt;
&lt;div class=&quot;steps fig&quot; data-steps data-layers=&quot;dis&quot;&gt;
&lt;svg viewBox=&quot;0 0 520 340&quot; role=&quot;img&quot; aria-label=&quot;Disinflation path from E I to E G&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ag&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L8 4L0 8z&quot; fill=&quot;var(--good)&quot;/&gt;&lt;/marker&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L8 4L0 8z&quot; fill=&quot;var(--bad)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;path class=&quot;ax&quot; d=&quot;M50 14V300H505&quot;/&gt;
&lt;text x=&quot;20&quot; y=&quot;160&quot; font-size=&quot;14&quot; transform=&quot;rotate(-90 20 160)&quot; text-anchor=&quot;middle&quot;&gt;Inflation&lt;/text&gt;&lt;text x=&quot;440&quot; y=&quot;326&quot; font-size=&quot;14&quot;&gt;Unemployment&lt;/text&gt;
&lt;path class=&quot;gl&quot; stroke-width=&quot;1.3&quot; d=&quot;M260 30V300&quot; style=&quot;stroke:var(--soft)&quot;/&gt;&lt;text x=&quot;260&quot; y=&quot;320&quot; font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;U&lt;/text&gt;&lt;text x=&quot;270&quot; y=&quot;324&quot; font-size=&quot;10&quot;&gt;n&lt;/text&gt;
&lt;text x=&quot;110&quot; y=&quot;320&quot; font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;U*&lt;/text&gt;
&lt;path class=&quot;gl dsh&quot; d=&quot;M110 300L320 44&quot; style=&quot;stroke:var(--soft)&quot;/&gt;&lt;path class=&quot;gl dsh&quot; d=&quot;M110 300L440 145&quot; style=&quot;stroke:var(--soft)&quot;/&gt;
&lt;text x=&quot;325&quot; y=&quot;40&quot; font-size=&quot;13&quot;&gt;Italy&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;143&quot; font-size=&quot;13&quot;&gt;Germany&lt;/text&gt;
&lt;path d=&quot;M160 48L480 268&quot; style=&quot;stroke:var(--bad);fill:none&quot; stroke-width=&quot;2.5&quot;/&gt;
&lt;path class=&quot;gl&quot; d=&quot;M180 175L340 285&quot; style=&quot;stroke:var(--soft)&quot;/&gt;
&lt;circle cx=&quot;260&quot; cy=&quot;117&quot; r=&quot;7&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;273&quot; y=&quot;109&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;E&lt;tspan dy=&quot;4&quot; font-size=&quot;10&quot;&gt;I&lt;/tspan&gt;&lt;/text&gt;
&lt;circle cx=&quot;260&quot; cy=&quot;230&quot; r=&quot;7&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;238&quot; y=&quot;252&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;E&lt;tspan dy=&quot;4&quot; font-size=&quot;10&quot;&gt;G&lt;/tspan&gt;&lt;/text&gt;
&lt;g class=&quot;layer&quot; data-on=&quot;1&quot;&gt;&lt;path d=&quot;M260 127V218&quot; stroke=&quot;var(--good)&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ag)&quot; fill=&quot;none&quot;/&gt;&lt;text x=&quot;205&quot; y=&quot;176&quot; font-size=&quot;13&quot; style=&quot;fill:var(--good)&quot;&gt;ideal&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;layer&quot; data-on=&quot;2 3&quot;&gt;&lt;path d=&quot;M270 124L349 178&quot; stroke=&quot;var(--bad)&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar)&quot; fill=&quot;none&quot;/&gt;&lt;circle cx=&quot;357&quot; cy=&quot;184&quot; r=&quot;6&quot; fill=&quot;var(--bad)&quot;/&gt;&lt;text x=&quot;367&quot; y=&quot;180&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;E&lt;tspan dy=&quot;4&quot; font-size=&quot;10&quot;&gt;I1&lt;/tspan&gt;&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;layer&quot; data-on=&quot;3&quot;&gt;&lt;path d=&quot;M349 189L272 226&quot; stroke=&quot;var(--bad)&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#ar)&quot; fill=&quot;none&quot;/&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;The starting point.&lt;/b&gt; Italy is at E&lt;sub&gt;I&lt;/sub&gt; and must get close to E&lt;sub&gt;G&lt;/sub&gt; in order to join. How it does so is a relevant question. &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;The ideal, green arrow.&lt;/b&gt; Inflation falls and unemployment does not rise. This would require expectations to adjust immediately, that is, a fully credible disinflation. &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt; &lt;span class=&quot;add&quot;&gt;added on expectations&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;In practice, first red arrow.&lt;/b&gt; Inflation falls along the short-run Phillips curve to E&lt;sub&gt;I1&lt;/sub&gt;: less inflation, but more unemployment. &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Second red arrow.&lt;/b&gt; As expectations fall, the Phillips curve shifts and the system returns to U&lt;sub&gt;n&lt;/sub&gt; at E&lt;sub&gt;G&lt;/sub&gt;. The open questions on the slide: how long does this last? Can the natural rate rise? &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt; &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; This second risk is called hysteresis: temporary unemployment becomes permanent.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next&lt;/button&gt;&lt;span class=&quot;dots&quot; data-count&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why does the government not achieve U*, if that is what it wants?&lt;/summary&gt;&lt;div&gt;Because the public anticipates the surprise and raises its expectations. In equilibrium U = U&lt;sub&gt;n&lt;/sub&gt;: only the higher inflation remains.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why, in the model, does Italy gain welfare and Germany does not?&lt;/summary&gt;&lt;div&gt;With the average of preferences, inflation falls for Italy and rises for Germany, with U&lt;sub&gt;n&lt;/sub&gt; unchanged. Germany bears more inflation with no employment benefit. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What makes the ECB a “clone of the Bundesbank”, and what purpose does this serve?&lt;/summary&gt;&lt;div&gt;It serves to import into the union the German preference for price stability: it lowers the weight on employment in the common central bank&#x27;s loss function. &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; The institutional levers are independence and the price mandate, mentioned among the provisions on slide 2.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s4&quot; class=&quot;pb&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Part B · Why the criteria · (3) and (2)&lt;/span&gt;&lt;h2&gt;No-devaluation and interest rate convergence&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

&lt;h3&gt;Exchange rate convergence&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;The requirement prevents countries from manipulating the exchange rate, for example in order to join the union at a more favorable, that is, devalued, rate. &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;split even&quot;&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin-top:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 460 250&quot; role=&quot;img&quot; aria-label=&quot;The exchange rate stays within the band around the central rate for two years&quot;&gt;
&lt;path class=&quot;ax&quot; d=&quot;M44 16V226H446&quot;/&gt;
&lt;rect x=&quot;44&quot; y=&quot;50&quot; width=&quot;402&quot; height=&quot;130&quot; fill=&quot;var(--c-bg)&quot;/&gt;
&lt;path class=&quot;gl&quot; style=&quot;stroke:var(--c)&quot; stroke-width=&quot;2&quot; d=&quot;M44 115H446&quot;/&gt;
&lt;path d=&quot;M44 128C80 90 110 96 140 118S200 158 240 124S300 70 340 96S410 140 446 110&quot; fill=&quot;none&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;2.4&quot;/&gt;
&lt;text x=&quot;52&quot; y=&quot;44&quot; font-size=&quot;13&quot;&gt;+15%&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;197&quot; font-size=&quot;13&quot;&gt;−15%&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;110&quot; font-size=&quot;13&quot; class=&quot;t2&quot;&gt;central rate&lt;/text&gt;
&lt;text x=&quot;245&quot; y=&quot;244&quot; font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;24 months before entry&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;The exchange rate may move within the band; the central rate may not change. &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt; Illustrative curve.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div&gt;
&lt;p&gt;According to the Treaty, countries must keep the exchange rate within the “normal” band without changing it, and hence without changing the &lt;b&gt;central rate&lt;/b&gt; (the value around which the currency fluctuates), in the two years before entry. &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;From August 1993 the “normal” band of the EMS was ±15%. &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; Such a wide band makes the criterion not very strict: what counts in the text is what happens to the central rate, not how much the exchange rate fluctuates within the band.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Interest rate convergence&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;Excessively large differences between interest rates before entry could produce large &lt;b&gt;capital gains and losses&lt;/b&gt; (gains and losses on the value of securities) at the moment of entry. But these changes probably occur &lt;i&gt;earlier&lt;/i&gt;: markets make long-term rates converge as soon as the political decision to admit the country is taken. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/p&gt;

&lt;figure class=&quot;fig&quot; id=&quot;irp&quot;&gt;&lt;div class=&quot;split even&quot;&gt;
&lt;div&gt;&lt;svg id=&quot;irpsvg&quot; viewBox=&quot;0 0 440 260&quot; role=&quot;img&quot; aria-label=&quot;Interest rates and bond price&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;div&gt;
&lt;div class=&quot;eq&quot; style=&quot;font-size:1.2rem&quot;&gt;i&lt;sub&gt;A&lt;/sub&gt; ≈ i&lt;sub&gt;B&lt;/sub&gt; + Δs&lt;sup&gt;e&lt;/sup&gt;&lt;span class=&quot;tag&quot;&gt;interest rate parity&lt;/span&gt;&lt;/div&gt;
&lt;p style=&quot;font-size:.96rem&quot;&gt;&lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; With free capital movements, the interest rate of country A can exceed that of country B only to compensate for an expected devaluation of A, Δs&lt;sup&gt;e&lt;/sup&gt;. If the market becomes convinced that there will be no devaluation, the spread closes.&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;&lt;span&gt;Expected devaluation of A &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;dep&quot; data-u=&quot; %&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.25&quot; value=&quot;5&quot;&gt;&lt;/label&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;irpread&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;Perpetual bond with a coupon of 10, for simplicity: price = coupon / rate. Invented numbers. &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;The point of the slide.&lt;/b&gt; Given the inflation criterion, no devaluation and free capital movements, interest rates were bound to converge anyway. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt; Criterion (2) therefore largely confirms what the others already produce.&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Write out the chain of reasoning that leads to interest rate convergence.&lt;/summary&gt;&lt;div&gt;Free capital (stage 1) + credible exchange rate (no expected devaluation) → parity: interest rates equalize for equal risk. Similar inflation also keeps real rates aligned. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Who makes a capital gain when interest rates fall?&lt;/summary&gt;&lt;div&gt;Holders of fixed-rate bonds issued when rates were high: the price rises to bring their yield into line with the new one.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the purpose of prohibiting devaluation shortly before entry?&lt;/summary&gt;&lt;div&gt;It prevents a country from presenting itself with an artificially devalued exchange rate in order to gain competitiveness once the rate is fixed. &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s5&quot; class=&quot;pc&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Part C · Mathematics of debt · (4) and (5)&lt;/span&gt;&lt;h2&gt;Public budget and debt, step by step&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;The logic is the same as for inflation: a highly indebted country has an incentive to create &lt;b&gt;surprise inflation&lt;/b&gt;; the country with little debt loses out and demands a reduction in debt and deficit before entry. &lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;The definitions&lt;/h3&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;B, D, Y&lt;/h4&gt;&lt;p&gt;Nominal debt, nominal deficit (expenditure minus revenue), nominal GDP. &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Primary deficit D&lt;sup&gt;P&lt;/sup&gt;&lt;/h4&gt;&lt;p&gt;Deficit net of interest: G&lt;sup&gt;P&lt;/sup&gt; − T. If it is negative we speak of a &lt;b&gt;primary surplus&lt;/b&gt;, A&lt;sup&gt;P&lt;/sup&gt; = −D&lt;sup&gt;P&lt;/sup&gt;. &lt;span class=&quot;src&quot;&gt;slide 13-14&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;i, ṗ, r, g&lt;/h4&gt;&lt;p&gt;Average nominal interest rate on debt, inflation, real interest rate, real GDP growth. &lt;span class=&quot;src&quot;&gt;slide 14, 15, 22&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;b, d&lt;/h4&gt;&lt;p&gt;Lowercase letters denote ratios to GDP. &lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;steps fig&quot; data-steps&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;1 · Debt accumulates through the deficit&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;B&lt;sub&gt;t&lt;/sub&gt; = B&lt;sub&gt;t−1&lt;/sub&gt; + D&lt;sub&gt;t&lt;/sub&gt;&lt;/div&gt;&lt;p&gt;This year&#x27;s debt is last year&#x27;s debt plus the deficit. &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;2 · Separate out interest&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;D&lt;sub&gt;t&lt;/sub&gt; = G&lt;sub&gt;t&lt;/sub&gt; − T&lt;sub&gt;t&lt;/sub&gt; = (G&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt; + i&lt;sub&gt;t&lt;/sub&gt;B&lt;sub&gt;t−1&lt;/sub&gt;) − T&lt;sub&gt;t&lt;/sub&gt; = i&lt;sub&gt;t&lt;/sub&gt;B&lt;sub&gt;t−1&lt;/sub&gt; + D&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/div&gt;&lt;p&gt;Part of expenditure is interest on the existing debt; the rest is primary expenditure. &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;3 · Substitute&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;B&lt;sub&gt;t&lt;/sub&gt; = B&lt;sub&gt;t−1&lt;/sub&gt;(1 + i&lt;sub&gt;t&lt;/sub&gt;) + D&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/div&gt;&lt;p&gt;Nominal debt is constant if the primary surplus covers interest: i&lt;sub&gt;t&lt;/sub&gt;B&lt;sub&gt;t−1&lt;/sub&gt; = −D&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt; = A&lt;sup&gt;P&lt;/sup&gt;. &lt;span class=&quot;src&quot;&gt;slide 14&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;4 · In real terms: divide by P&lt;sub&gt;t&lt;/sub&gt;&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;B̃&lt;sub&gt;t&lt;/sub&gt; = B̃&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;f&quot;&gt;&lt;i&gt;1 + i&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;i&gt;1 + ṗ&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt; + D̃&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/div&gt;&lt;p&gt;The tilde denotes the real value, that is, B/P. We use the fact that P&lt;sub&gt;t&lt;/sub&gt;/P&lt;sub&gt;t−1&lt;/sub&gt; = 1 + ṗ&lt;sub&gt;t&lt;/sub&gt;. &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;5 · The real interest rate&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;&lt;span class=&quot;f&quot;&gt;&lt;i&gt;1 + i&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;i&gt;1 + ṗ&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt; = 1 + r&lt;sub&gt;t&lt;/sub&gt; ≅ 1 + i − ṗ&lt;sub&gt;t&lt;/sub&gt;&lt;/div&gt;&lt;p&gt;Hence B̃&lt;sub&gt;t&lt;/sub&gt; = B̃&lt;sub&gt;t−1&lt;/sub&gt;(1 + r&lt;sub&gt;t&lt;/sub&gt;) + D̃&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;. &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;6 · As a ratio to real GDP: the key formula&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;b&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;f&quot;&gt;&lt;i&gt;1 + r&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;i&gt;1 + g&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt; + d&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/div&gt;&lt;p&gt;It will take center stage in section 7. &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next&lt;/button&gt;&lt;span class=&quot;dots&quot; data-count&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Why inflation tempts governments&lt;/h3&gt;
&lt;figure class=&quot;fig&quot; id=&quot;real&quot;&gt;&lt;div class=&quot;split even&quot;&gt;
&lt;div&gt;
&lt;p style=&quot;margin-top:0&quot;&gt;All else being equal (&lt;i&gt;ceteris paribus&lt;/i&gt;), higher inflation reduces the real value of debt: the government may be tempted to create it by surprise. &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;&lt;span&gt;Nominal rate already set i &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;i&quot; data-u=&quot; %&quot; min=&quot;1&quot; max=&quot;12&quot; step=&quot;0.5&quot; value=&quot;5&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;Actual inflation ṗ &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;p&quot; data-u=&quot; %&quot; min=&quot;0&quot; max=&quot;20&quot; step=&quot;0.5&quot; value=&quot;2&quot;&gt;&lt;/label&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;big&quot; id=&quot;realbig&quot;&gt;&lt;/div&gt;&lt;div class=&quot;read&quot; id=&quot;realread&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;&lt;figcaption&gt;Initial debt 100, D&lt;sup&gt;P&lt;/sup&gt; = 0. This works only if the rate is already set, that is, if inflation is unexpected. &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Debt monetization.&lt;/b&gt; Financing the deficit with central bank money. The slides specify that it is prohibited by the EU Treaty. &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt; &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; Today the prohibition is in &lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/art_123/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · Art. 123 TFEU&lt;/a&gt;: no credit to the public sector and no direct purchases of its securities by the central bank.&lt;/div&gt;

&lt;h3&gt;Default risk and no-bailout&lt;/h3&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;1 · High debt&lt;/h4&gt;&lt;p&gt;The country has a higher default risk.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;2 · In the union&lt;/h4&gt;&lt;p&gt;Pressure for a bailout grows in the event of a crisis.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;3 · No-bailout clause&lt;/h4&gt;&lt;p&gt;It is included in the Treaty.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;4 · But is it credible?&lt;/h4&gt;&lt;p&gt;The question with which the slide closes.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;prose&quot;&gt;A &lt;b&gt;bailout&lt;/b&gt; is the rescue of a state by the others. &lt;span class=&quot;src&quot;&gt;slide 16&lt;/span&gt; As for why it is doubtful: if a default would put the whole union at risk, the other countries might prefer to help, despite the clause. &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; In fact the Court of Justice, in &lt;a class=&quot;ext&quot; href=&quot;https://europeanlawblog.eu/2012/11/27/to-bail-out-or-to-not-to-bail-out-the-cjeu-confirms-competence-to-conclude-the-esm-treaty/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · Pringle, 2012&lt;/a&gt;, held that aid indispensable to the stability of the area and subject to strict conditions is compatible with Art. 125 TFEU.&lt;/p&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;When does nominal debt remain constant?&lt;/summary&gt;&lt;div&gt;When the primary surplus exactly covers interest: i&lt;sub&gt;t&lt;/sub&gt;B&lt;sub&gt;t−1&lt;/sub&gt; = A&lt;sup&gt;P&lt;/sup&gt;. &lt;span class=&quot;src&quot;&gt;slide 14&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;And real debt, if nominal debt is constant and inflation is positive?&lt;/summary&gt;&lt;div&gt;It falls, because you divide the same number by higher prices. This is the answer to the question “What about the debt in real terms?” on slide 14.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why does expected inflation not reduce real debt?&lt;/summary&gt;&lt;div&gt;Because it enters the nominal rate on new bonds: the real rate does not change. What counts is unexpected inflation. &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s6&quot; class=&quot;pc&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;6&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Part C · Mathematics of debt&lt;/span&gt;&lt;h2&gt;Where 3% and 60% come from&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;The two numbers are linked by a precise relationship. The problem is that it holds only under a very particular assumption about growth. &lt;span class=&quot;src&quot;&gt;slide 19-21&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;steps fig&quot; data-steps&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;1 · Divide by nominal GDP&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;b&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;f&quot;&gt;&lt;i&gt;1&lt;/i&gt;&lt;i&gt;1 + g&lt;sub&gt;N,t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt; + d&lt;sub&gt;t&lt;/sub&gt;&lt;span class=&quot;tag&quot;&gt;(1)&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Maastricht does not distinguish between primary balance and interest: it uses the total deficit. Equation (1) is a &lt;b&gt;first order difference equation&lt;/b&gt;, that is, it links today&#x27;s value to yesterday&#x27;s. g&lt;sub&gt;N&lt;/sub&gt; is nominal GDP growth. &lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;2 · What equilibrium means&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;b&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt; = &lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt;&lt;/div&gt;&lt;p&gt;The solution consists of an equilibrium value plus a deviation, which over time may vanish or grow. &lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;3 · Solve with constant g&lt;sub&gt;N&lt;/sub&gt; and d&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;&lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt; = &lt;span class=&quot;f&quot;&gt;&lt;i&gt;&lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt;&lt;/i&gt;&lt;i&gt;1 + g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt; + d &amp;nbsp;→&amp;nbsp; &lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt; = &lt;span class=&quot;f&quot;&gt;&lt;i&gt;1 + g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt;&lt;i&gt;g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt; d&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;4 · Approximate: d·g&lt;sub&gt;N&lt;/sub&gt; is small&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;&lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt; g&lt;sub&gt;N&lt;/sub&gt; = d &amp;nbsp;→&amp;nbsp; g&lt;sub&gt;N&lt;/sub&gt; = &lt;span class=&quot;f&quot;&gt;&lt;i&gt;d&lt;/i&gt;&lt;i&gt;&lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt;&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;5 · Insert the Maastricht numbers&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;g&lt;sub&gt;N&lt;/sub&gt; = 0.03 / 0.6 = 0.05&lt;/div&gt;&lt;p&gt;Here is the implicit nominal growth: 5%. With equilibrium inflation at 2%, real GDP must grow at 3%. &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next&lt;/button&gt;&lt;span class=&quot;dots&quot; data-count&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;figure class=&quot;fig&quot; id=&quot;rule&quot;&gt;&lt;div class=&quot;split&quot;&gt;
&lt;div&gt;&lt;svg id=&quot;rulesvg&quot; viewBox=&quot;0 0 520 320&quot; role=&quot;img&quot; aria-label=&quot;Debt-stabilizing deficit as a function of nominal growth&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;div&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;d = g·b&lt;/h4&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;&lt;span&gt;Nominal growth g &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;g&quot; data-u=&quot; %&quot; min=&quot;0.5&quot; max=&quot;10&quot; step=&quot;0.25&quot; value=&quot;5&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;Target debt b &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;b&quot; data-u=&quot; %&quot; min=&quot;20&quot; max=&quot;130&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;ruleread&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;Formula: slide 20. The exact value d = b·g/(1+g) comes from slide 18; the gap between the two is an added calculation.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3&gt;Why the rule is arbitrary on two fronts&lt;/h3&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;The 60%&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;The 5% growth&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;The overall reading&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p class=&quot;prose&quot;&gt;Why stabilize at precisely 60%? The only reason is that, at the time of the negotiations, it was the average debt/GDP ratio in the Union. &lt;span class=&quot;src&quot;&gt;slide 21&lt;/span&gt; A confirmation: according to Buti and Gaspar, the simple average of the 12 negotiating countries was almost exactly 60% in the five years up to 1989 (&lt;a class=&quot;ext&quot; href=&quot;https://cepr.org/voxeu/columns/maastricht-values&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · VoxEU&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p class=&quot;prose&quot;&gt;The rule depends on future nominal growth. If this exceeds (falls below) 5%, the deficit that stabilizes debt at 60% exceeds (falls below) 3%. &lt;span class=&quot;src&quot;&gt;slide 21&lt;/span&gt; Move the slider: with g = 2% the stabilizing deficit is 1.2%.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p class=&quot;prose&quot;&gt;To stabilize debt at 60%, the deficit must be 3% “if and only if” nominal growth is 5%. &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt; The numerical precision is therefore hard to justify: the numbers come from an accounting rule, not from an optimality calculation. &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; The classic critique is by &lt;a class=&quot;ext&quot; href=&quot;https://ideas.repec.org/p/fth/yalegr/674.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · Buiter, Corsetti, Roubini&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;With constant d = 3% and nominal growth at 2%, where does debt/GDP go?&lt;/summary&gt;&lt;div&gt;With the approximate formula, b̄ = d/g = 150%. So the 3% limit is not enough to keep debt at 60%.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What did you assume in saying that real GDP grows at 3%?&lt;/summary&gt;&lt;div&gt;Equilibrium inflation at 2%: 5 − 2 = 3. &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between b̄ from (1) and the approximate version?&lt;/summary&gt;&lt;div&gt;Exact: b̄ = d(1+g)/g = 0.03·1.05/0.05 = 63%. Approximate: 60%. Slide 18 drops the term d·g&lt;sub&gt;N&lt;/sub&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s7&quot; class=&quot;pc&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;7&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Part C · Mathematics of debt&lt;/span&gt;&lt;h2&gt;Debt dynamics: r versus g&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;“Should we worry about high public debts?” The answer lies in a comparison: the real interest rate on debt versus the real growth rate of the economy. &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;split even&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;eq&quot;&gt;b&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;f&quot;&gt;&lt;i&gt;1 + r&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;i&gt;1 + g&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt; + d&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/div&gt;
&lt;div class=&quot;eq&quot;&gt;&lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt; = d&lt;sup&gt;P&lt;/sup&gt; &lt;span class=&quot;f&quot;&gt;&lt;i&gt;1 + g&lt;/i&gt;&lt;i&gt;g − r&lt;/i&gt;&lt;/span&gt; &amp;nbsp;≈&amp;nbsp; &lt;span class=&quot;f&quot;&gt;&lt;i&gt;d&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;&lt;i&gt;g − r&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Equation and equilibrium: &lt;span class=&quot;src&quot;&gt;slide 22, 24&lt;/span&gt;. The right-hand side uses the approximate slope 1 + r − g.&lt;/p&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;The 45° line&lt;/b&gt; is the locus of stationary equilibria: b&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt;. &lt;span class=&quot;src&quot;&gt;slide 24&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;The intercept&lt;/b&gt; is the primary deficit: positive with a deficit, negative with a surplus. Changing it shifts the line. &lt;span class=&quot;src&quot;&gt;slide 25&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;The slope&lt;/b&gt; is approximately 1 + r − g: less than 1 if g &amp;gt; r, greater than 1 if g &amp;lt; r. &lt;span class=&quot;src&quot;&gt;slide 26&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;figure class=&quot;fig&quot; id=&quot;dyn&quot;&gt;
&lt;div class=&quot;chips&quot; id=&quot;dynpre&quot; role=&quot;group&quot; aria-label=&quot;Choose one of the four cases&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;split even&quot;&gt;
&lt;div&gt;&lt;svg id=&quot;phase&quot; viewBox=&quot;0 0 470 430&quot; role=&quot;img&quot; aria-label=&quot;Phase diagram of debt&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;div&gt;&lt;svg id=&quot;tpath&quot; viewBox=&quot;0 0 470 300&quot; role=&quot;img&quot; aria-label=&quot;Debt over time&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;&lt;span&gt;r, real interest rate &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;r&quot; data-u=&quot; %&quot; min=&quot;-3&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;g, real growth &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;g&quot; data-u=&quot; %&quot; min=&quot;-3&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;3&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;d&lt;sup&gt;P&lt;/sup&gt;, primary deficit (negative = surplus) &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;d&quot; data-u=&quot; %&quot; min=&quot;-5&quot; max=&quot;5&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;b&lt;sub&gt;0&lt;/sub&gt;, initial debt &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;b0&quot; data-u=&quot; %&quot; min=&quot;0&quot; max=&quot;200&quot; step=&quot;1&quot; value=&quot;120&quot;&gt;&lt;/label&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;dynread&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;On the left, slope and intercept are multiplied by 8 around the same equilibrium: with realistic numbers the lines would be almost parallel, and the diagrams in the slides also exaggerate the slopes. Each step therefore corresponds to about 8 years. On the right, the 30 years are calculated with the true values of the formula. &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;The four cases in the slides&lt;/h3&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Case&lt;/th&gt;&lt;th&gt;Conditions&lt;/th&gt;&lt;th&gt;b̄&lt;/th&gt;&lt;th&gt;Equilibrium&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Debt (positive values)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;1 &lt;span class=&quot;src&quot;&gt;slide 27&lt;/span&gt;&lt;/td&gt;&lt;td&gt;g &amp;gt; r, primary deficit&lt;/td&gt;&lt;td&gt;&amp;gt; 0&lt;/td&gt;&lt;td class=&quot;ok&quot;&gt;stable&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;rises or falls toward b̄&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2 &lt;span class=&quot;src&quot;&gt;slide 28&lt;/span&gt;&lt;/td&gt;&lt;td&gt;g &amp;gt; r, surplus&lt;/td&gt;&lt;td&gt;&amp;lt; 0&lt;/td&gt;&lt;td class=&quot;ok&quot;&gt;stable&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;falls for all positive values&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3 &lt;span class=&quot;src&quot;&gt;slide 29&lt;/span&gt;&lt;/td&gt;&lt;td&gt;g &amp;lt; r, primary deficit&lt;/td&gt;&lt;td&gt;&amp;lt; 0&lt;/td&gt;&lt;td class=&quot;ko&quot;&gt;unstable&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;rises for all positive values&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4 &lt;span class=&quot;src&quot;&gt;slide 30&lt;/span&gt;&lt;/td&gt;&lt;td&gt;g &amp;lt; r, surplus&lt;/td&gt;&lt;td&gt;&amp;gt; 0&lt;/td&gt;&lt;td class=&quot;ko&quot;&gt;unstable&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;rises above b̄, falls below b̄&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

&lt;h3&gt;Snowball effect: how much effort is needed&lt;/h3&gt;
&lt;div class=&quot;eq&quot;&gt;Δb&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;f&quot;&gt;&lt;i&gt;r&lt;sub&gt;t&lt;/sub&gt; − g&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;i&gt;1 + g&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt; − a&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;span class=&quot;tag&quot;&gt;(**) slide 31&lt;/span&gt;&lt;/div&gt;
&lt;p class=&quot;prose&quot;&gt;The first term is the &lt;b&gt;snowball effect&lt;/b&gt;: debt grows on its own if r &amp;gt; g, and all the more the higher it is. To stop it, that is, Δb ≤ 0, with r &amp;gt; g a relatively high primary surplus is needed. &lt;span class=&quot;src&quot;&gt;slide 31&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;eq&quot;&gt;&lt;span class=&quot;ov&quot;&gt;a&lt;/span&gt;&lt;sup&gt;P&lt;/sup&gt; = b&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;f&quot;&gt;&lt;i&gt;r − g&lt;/i&gt;&lt;i&gt;1 + g&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;stabilizing surplus, added&lt;/span&gt;&lt;/div&gt;

&lt;h3&gt;The solution over time&lt;/h3&gt;
&lt;div class=&quot;eq&quot;&gt;b&lt;sub&gt;t&lt;/sub&gt; = (b&lt;sub&gt;0&lt;/sub&gt; − &lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt;) &lt;span class=&quot;f&quot;&gt;&lt;i&gt;1 + r&lt;/i&gt;&lt;i&gt;1 + g&lt;/i&gt;&lt;/span&gt;&lt;sup&gt;t&lt;/sup&gt; + &lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;(b&lt;sub&gt;0&lt;/sub&gt; − b̄)&lt;/h4&gt;&lt;p&gt;Deviation: how far from the stationary state you start. &lt;span class=&quot;src&quot;&gt;slide 32&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;((1+r)/(1+g))&lt;sup&gt;t&lt;/sup&gt;&lt;/h4&gt;&lt;p&gt;Evolution of the deviation: it vanishes if g &amp;gt; r, it explodes if g &amp;lt; r. &lt;span class=&quot;src&quot;&gt;slide 32&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;b̄&lt;/h4&gt;&lt;p&gt;Stationary state. It holds with constant g, r and d&lt;sup&gt;P&lt;/sup&gt;. &lt;span class=&quot;src&quot;&gt;slide 32&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Case 2: with g &amp;gt; r and a surplus, the equilibrium is negative. What does this mean?&lt;/summary&gt;&lt;div&gt;The country would end up a net creditor. For positive values, debt always falls. &lt;span class=&quot;src&quot;&gt;slide 28&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;r = 3%, g = 1%, b = 130%: what surplus is needed to stabilize debt?&lt;/summary&gt;&lt;div&gt;130 × 0.02 / 1.01 ≈ 2.57% of GDP.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Case 4: why may the same surplus not be enough for a higher debt?&lt;/summary&gt;&lt;div&gt;The snowball is proportional to b. Above b̄ it exceeds the surplus and debt rises; below b̄ the surplus prevails and debt falls. &lt;span class=&quot;src&quot;&gt;slide 30&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s8&quot; class=&quot;pd&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;8&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Part D · Data and final stage&lt;/span&gt;&lt;h2&gt;Italy&#x27;s debt/GDP&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;The table on slide 33 applies the formulas to nine years of data (stated source: Banca d&#x27;Italia Economic Bulletin and Istat). Click a year to read which case applied.&lt;/p&gt;
&lt;div class=&quot;split&quot;&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table id=&quot;ittab&quot;&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Year&lt;/th&gt;&lt;th&gt;d&lt;sup&gt;P&lt;/sup&gt;&lt;/th&gt;&lt;th&gt;g&lt;/th&gt;&lt;th&gt;r&lt;/th&gt;&lt;th&gt;(1+r)/(1+g)&lt;/th&gt;&lt;th&gt;b̄ &lt;small&gt;(ratio)&lt;/small&gt;&lt;/th&gt;&lt;th&gt;b&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src&quot;&gt;slide 33&lt;/span&gt; Values of d&lt;sup&gt;P&lt;/sup&gt;, g, r and b in %.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;itread&quot; aria-live=&quot;polite&quot; style=&quot;margin-top:0&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;How to read b̄.&lt;/b&gt; In the table the “b stationary” column is a ratio, not a percentage: 1.31 means 131% of GDP. Recalculating all rows with b̄ = d(1+g)/(g−r), I obtain the same values as the slide. &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; In 2010 the primary balance is zero, so b̄ is 0.&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Caution.&lt;/b&gt; If I apply the formula to the previous year and compare it with the observed b, gaps remain, some of them large (2012: forecast 120.4 against 126.9). The formula does not include stock-flow adjustments, that is, changes in debt that do not pass through the balance; the measure of r used in the table may also matter. The slides do not explain these gaps. &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt;&lt;/div&gt;

&lt;h3&gt;Four forecasts, four futures&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg id=&quot;fc&quot; viewBox=&quot;0 0 640 340&quot; role=&quot;img&quot; aria-label=&quot;Debt to GDP over 30 years starting from 1990, 1999, 2008 and 2012 data&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Projected dynamics based on 1990, 1999, 2008 and 2012 data, assuming that g, r and the primary deficit stay at their initial-year values. &lt;span class=&quot;src&quot;&gt;slide 35&lt;/span&gt; The 2008 and 2012 curves are recalculated with the table data and match the slide; 1990 and 1999 are reconstructed with parameters I estimated from the shape of the chart. &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; Slide 34 refers to an Excel file on debt dynamics, which I was unable to open.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;p class=&quot;prose&quot;&gt;The message is that these are not forecasts in the true sense, but &lt;i&gt;extrapolations&lt;/i&gt;: changing the starting year is enough to go from over 400% to a negative value. &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;In 2012 b = 126.9 and b̄ = 106%. What does the theory say?&lt;/summary&gt;&lt;div&gt;g &amp;lt; r with a surplus: case 4, unstable. Being above b̄, debt tends to rise.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In 2015 and 2016 b̄ is negative: is this bad news?&lt;/summary&gt;&lt;div&gt;No. g &amp;gt; r with a surplus is case 2: stable, with debt tending to fall for all positive values.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between the 2008 and 2012 lines in the chart?&lt;/summary&gt;&lt;div&gt;In 2008 debt is below b̄ (106 against 131) and falls; in 2012 it is above (127 against 106) and rises. Both are in case 4.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s9&quot; class=&quot;pd&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;9&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Part D · Data and final stage&lt;/span&gt;&lt;h2&gt;Public finances in the Eurozone&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;Six series from 1980 to 2024, with three dates marked in all the slide charts: 1999, 2009 and 2020. &lt;span class=&quot;src&quot;&gt;slide 37-42&lt;/span&gt;&lt;/p&gt;
&lt;figure class=&quot;fig&quot; id=&quot;ez&quot;&gt;
&lt;div class=&quot;chips&quot; id=&quot;ezm&quot; role=&quot;group&quot; aria-label=&quot;Choose the series&quot;&gt;&lt;/div&gt;
&lt;svg id=&quot;ezsvg&quot; viewBox=&quot;0 0 640 330&quot; role=&quot;img&quot; aria-label=&quot;Time series of the chosen indicator&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;chips&quot; id=&quot;ezc&quot; role=&quot;group&quot; aria-label=&quot;Countries to show&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;&lt;span&gt;Read the year &lt;output id=&quot;ezy&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;ezr&quot; aria-label=&quot;Year to read&quot; min=&quot;0&quot; max=&quot;14&quot; step=&quot;1&quot; value=&quot;12&quot;&gt;&lt;/label&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;ezread&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;&lt;b&gt;Values read by eye&lt;/b&gt; from the slide charts at 15 sample years, joined by line segments: they serve to show the shape and should not be cited. The slides also show France, Spain and Portugal; the stated source is “Own elaboration on BdI data”. &lt;span class=&quot;add&quot;&gt;reconstruction&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Fiscal space and fiscal sustainability&lt;/h3&gt;
&lt;div class=&quot;split even&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;De facto fiscal space&lt;/b&gt; = public debt / tax base. The tax base is the 5-year moving average of total revenues / GDP. Space is weak when debt is high relative to the tax base. This measure is used by Aizenman et al. (2013). &lt;span class=&quot;src&quot;&gt;slide 41&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Fiscal space&lt;/b&gt;, according to Heller (2005): “room in a government&#x27;s budget that allows it to provide resources for a desired purpose without jeopardizing the sustainability of its financial position or the stability of the economy”. There are several measures; the de facto one is among them. &lt;span class=&quot;src&quot;&gt;slide 41&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Example.&lt;/b&gt; &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; Debt at 135% of GDP with revenues at 47% gives about 2.9: debt is worth almost three years of revenues. The indicator reads “in reverse”: a high value means &lt;i&gt;little&lt;/i&gt; space.&lt;/div&gt;
&lt;p class=&quot;prose&quot;&gt;&lt;b&gt;Fiscal pressure&lt;/b&gt; on slide 42 is total revenues / GDP. &lt;span class=&quot;src&quot;&gt;slide 42&lt;/span&gt; &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; It is the denominator of fiscal space: for a given debt/GDP, there is more space where the state collects more.&lt;/p&gt;
&lt;p class=&quot;prose&quot;&gt;The link to the statistics in the slides: &lt;a href=&quot;https://www.bancaditalia.it/pubblicazioni/finanza-pubblica-ue/2022-finanza-pubblica-ue/statistiche_FPE_13122022.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Banca d&#x27;Italia statistics, December 2022&lt;/a&gt; &lt;span class=&quot;src&quot;&gt;slide 36&lt;/span&gt;.&lt;/p&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why does the 2009 crisis push debt/GDP up so quickly in Ireland?&lt;/summary&gt;&lt;div&gt;In the chart the Irish deficit reaches about 30% of GDP around 2010. &lt;span class=&quot;src&quot;&gt;slide 38&lt;/span&gt; &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt; The slides do not explain this; the fact usually cited is the bank rescue.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Italy has a high total deficit but often a primary surplus. How is this possible?&lt;/summary&gt;&lt;div&gt;Because interest expenditure is very high: d = d&lt;sup&gt;P&lt;/sup&gt; + interest. This is the comparison between slides 38, 39 and 40.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Fiscal space of 4 for Greece and 1.3 for Germany: who has more space?&lt;/summary&gt;&lt;div&gt;Germany: the value is debt over revenues, so the lower it is, the more space there is.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s10&quot; class=&quot;pd&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;10&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Part D · Data and final stage&lt;/span&gt;&lt;h2&gt;The final stage, the “ins” and the “outs”&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

&lt;h3&gt;The conversion rates&lt;/h3&gt;
&lt;figure class=&quot;fig&quot; id=&quot;cv&quot;&gt;&lt;div class=&quot;split even&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;chips&quot; id=&quot;cvc&quot; role=&quot;group&quot; aria-label=&quot;Choose the currency&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;&lt;span&gt;Amount in euros &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;eur&quot; data-u=&quot; €&quot; min=&quot;1&quot; max=&quot;1000&quot; step=&quot;1&quot; value=&quot;100&quot;&gt;&lt;/label&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;big&quot; id=&quot;cvbig&quot;&gt;&lt;/div&gt;&lt;div class=&quot;read&quot; id=&quot;cvread&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;&lt;figcaption&gt;The values are in Table 6.1 on slide 43, which lists 11 currencies. The rates irrevocably fixed on December 31, 1998: &lt;a class=&quot;ext&quot; href=&quot;https://www.ecb.europa.eu/press/pr/date/1998/html/pr981231_2.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · ECB&lt;/a&gt;. The comparisons between currencies are added calculations.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3&gt;ERM II: how it works&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;The &lt;b&gt;Exchange Rate Mechanism II&lt;/b&gt; organizes relations between those who have adopted the euro (“ins”) and those who have not (“outs”). Principles decided at the June 1996 ECOFIN; in force from January 1, 1999, replacing the old ERM. &lt;span class=&quot;src&quot;&gt;slide 44&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;split&quot;&gt;
&lt;figure class=&quot;fig&quot; id=&quot;band&quot; style=&quot;margin-top:0&quot;&gt;
&lt;div class=&quot;chips&quot; id=&quot;bandc&quot; role=&quot;group&quot; aria-label=&quot;Choose the case&quot;&gt;&lt;/div&gt;
&lt;svg id=&quot;bandsvg&quot; viewBox=&quot;0 0 520 150&quot; role=&quot;img&quot; aria-label=&quot;The exchange rate within the fluctuation band&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;&lt;span&gt;Deviation from the central rate &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;dev&quot; data-u=&quot; %&quot; min=&quot;-20&quot; max=&quot;20&quot; step=&quot;0.25&quot; value=&quot;4&quot;&gt;&lt;/label&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;bandread&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Exchange rate expressed in units of national currency per euro: above the central rate the currency is weaker. Limits: &lt;a class=&quot;ext&quot; href=&quot;https://suomenpankki.fi/en/statistics/interest-rates-and-exchange-rates/exchange-rates/exchange-rate-mechanism-erm-ii&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · Suomen Pankki&lt;/a&gt;.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Anchor&lt;/b&gt;: the system is anchored to the euro. &lt;span class=&quot;src&quot;&gt;slide 45&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Voluntary participation&lt;/b&gt;, with rules agreed between the ECB and the central banks of the “outs”. &lt;span class=&quot;src&quot;&gt;slide 44&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Margins&lt;/b&gt;: ±15% around a central rate, or narrower by choice. &lt;span class=&quot;src&quot;&gt;slide 44&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Mandatory intervention&lt;/b&gt; (buying or selling currency) at the edge of the band; the obligation lapses if it conflicts with price stability in the Eurozone or in the outside country. &lt;span class=&quot;src&quot;&gt;slide 45&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;The ECB can &lt;b&gt;initiate a procedure&lt;/b&gt; to change the central rates. &lt;span class=&quot;src&quot;&gt;slide 45&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Voluntary, but not for those who want the euro.&lt;/b&gt; To qualify, a country must participate for at least two years without severe tensions and without devaluing the central rate on its own initiative. &lt;span class=&quot;src&quot;&gt;slide 45&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;ERM II today&lt;/h3&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Denmark&lt;/h4&gt;&lt;p&gt;Since January 1, 1999. Central rate 7.46038, narrow band ±2.25%. &lt;span class=&quot;src&quot;&gt;slide 46&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Bulgaria&lt;/h4&gt;&lt;p&gt;In the mechanism since July 10, 2020, central rate 1.95583; euro since January 1, 2026. &lt;span class=&quot;src&quot;&gt;slide 46&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Croatia&lt;/h4&gt;&lt;p&gt;In the mechanism since July 10, 2020; euro since January 1, 2023. &lt;span class=&quot;src&quot;&gt;slide 46&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Sweden&lt;/h4&gt;&lt;p&gt;Has not joined ERM II. &lt;span class=&quot;src&quot;&gt;slide 46&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Reading note.&lt;/b&gt; Slide 46 says that “currently” ERM II includes Bulgaria and Denmark, but on the same slide Bulgaria adopts the euro from 2026. So today only the Danish krone remains: confirmation of Bulgaria&#x27;s entry in &lt;a class=&quot;ext&quot; href=&quot;https://www.ecb.europa.eu/press/pr/date/2025/html/ecb.pr250708~b9676a9fa8.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · ECB 2025&lt;/a&gt;. Moreover, the slide gives July 10, 2020 for Bulgaria and Croatia, whereas the table from &lt;a class=&quot;ext&quot; href=&quot;https://suomenpankki.fi/en/statistics/interest-rates-and-exchange-rates/exchange-rates/exchange-rate-mechanism-erm-ii&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · Suomen Pankki&lt;/a&gt; gives July 13 for the lev.&lt;/div&gt;
&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;What does criterion (3) correspond to after 1999?&lt;/summary&gt;&lt;div&gt;To participation in ERM II for at least two years, without severe tensions or devaluations on the country&#x27;s own initiative. &lt;span class=&quot;src&quot;&gt;slide 45&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;How many lire was a German mark worth at the final rate?&lt;/summary&gt;&lt;div&gt;1,936.27 / 1.95583 ≈ 990 lire.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What do the Bulgarian lev and the mark have in common?&lt;/summary&gt;&lt;div&gt;The same number: 1.95583 per euro. It is the rate of the mark in the table and the central rate of the lev. &lt;span class=&quot;src&quot;&gt;slide 43, 46&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s11&quot; class=&quot;pd&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;11&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Exercises from the slides&lt;/span&gt;&lt;h2&gt;Exercises on debt dynamics&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;The texts are from slides 47-49. The slides give no solutions: these outlines were written by me, so check them against the course. &lt;span class=&quot;add&quot;&gt;added&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Exercise 1&lt;/h3&gt;
&lt;div class=&quot;split even&quot;&gt;
&lt;div&gt;&lt;p&gt;In the chart, b&lt;sub&gt;0&lt;/sub&gt; is the initial debt/GDP. How does it change over the next two years, with r and g constant? What can the government do to reduce it? &lt;span class=&quot;src&quot;&gt;slide 47&lt;/span&gt;&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Solution outline&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;The line has a slope greater than 1, hence g &amp;lt; r, and a positive intercept, hence a primary deficit: this is case 3. The equilibrium is negative and b&lt;sub&gt;0&lt;/sub&gt; lies to its right: debt rises, and the increase is larger each year.&lt;/p&gt;
&lt;p&gt;The government can &lt;b&gt;shift the line down&lt;/b&gt; with a primary surplus. To make debt fall, a&lt;sup&gt;P&lt;/sup&gt; &amp;gt; b&lt;sub&gt;0&lt;/sub&gt;(r − g)/(1 + g) is needed: this moves the economy to case 4 with b&lt;sub&gt;0&lt;/sub&gt; below b̄. The alternative is to reduce the slope, by seeking a higher g or a lower r.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin-top:0&quot;&gt;&lt;svg viewBox=&quot;0 0 340 240&quot; role=&quot;img&quot; aria-label=&quot;Chart for exercise 1: steep line with positive intercept&quot;&gt;
&lt;path class=&quot;ax&quot; d=&quot;M24 170H326M90 228V14&quot;/&gt;
&lt;path class=&quot;gl dsh&quot; d=&quot;M24 236L290 -30&quot; style=&quot;stroke:var(--soft)&quot;/&gt;
&lt;path d=&quot;M36 240L196 14&quot; stroke=&quot;var(--c)&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot;/&gt;
&lt;text x=&quot;62&quot; y=&quot;28&quot; font-size=&quot;14&quot;&gt;b&lt;/text&gt;&lt;text x=&quot;71&quot; y=&quot;32&quot; font-size=&quot;10&quot;&gt;t&lt;/text&gt;&lt;text x=&quot;298&quot; y=&quot;192&quot; font-size=&quot;14&quot;&gt;b&lt;/text&gt;&lt;text x=&quot;307&quot; y=&quot;196&quot; font-size=&quot;10&quot;&gt;t−1&lt;/text&gt;
&lt;path class=&quot;ax&quot; d=&quot;M108 164V176&quot;/&gt;&lt;text x=&quot;103&quot; y=&quot;194&quot; font-size=&quot;14&quot;&gt;b&lt;/text&gt;&lt;text x=&quot;112&quot; y=&quot;198&quot; font-size=&quot;10&quot;&gt;0&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;Diagram redrawn from slide 47.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;/div&gt;

&lt;h3&gt;Exercise 2&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;With r the real interest rate and g GDP growth, show by graphical analysis that if g &amp;gt; r, debt/GDP converges to a stable equilibrium. &lt;span class=&quot;src&quot;&gt;slide 48&lt;/span&gt;&lt;/p&gt;
