    &lt;a href=&quot;#erm2&quot;&gt;&lt;rect x=&quot;700&quot; y=&quot;412&quot; width=&quot;180&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text class=&quot;lbl&quot; x=&quot;790&quot; y=&quot;432&quot; text-anchor=&quot;middle&quot;&gt;ERM II today&lt;/text&gt;&lt;text class=&quot;sub&quot; x=&quot;790&quot; y=&quot;448&quot; text-anchor=&quot;middle&quot;&gt;Denmark, Bulgaria…&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#esercizi&quot;&gt;&lt;rect x=&quot;20&quot; y=&quot;412&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;var(--acc-bg)&quot; stroke=&quot;var(--acc)&quot;/&gt;&lt;text class=&quot;lbl&quot; x=&quot;120&quot; y=&quot;432&quot; text-anchor=&quot;middle&quot;&gt;Exercises&lt;/text&gt;&lt;text class=&quot;sub&quot; x=&quot;120&quot; y=&quot;448&quot; text-anchor=&quot;middle&quot;&gt;with guided solutions&lt;/text&gt;&lt;/a&gt;

&lt;!-- ============ 1 TRATTATO ============ --&gt;
&lt;section id=&quot;trattato&quot; class=&quot;part p-sage&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;01&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--sage)&quot;&gt;History and institutions&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;The Maastricht Treaty: the road to the euro and EMU&lt;/span&gt;&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 2&lt;/span&gt; The &lt;dfn&gt;Maastricht Treaty&lt;/dfn&gt; (MT, formally the &lt;em&gt;Treaty on European Union&lt;/em&gt;) formally sets out the path towards the single currency and &lt;span class=&quot;term&quot;&gt;EMU&lt;/span&gt; (&lt;em&gt;Economic and Monetary Union&lt;/em&gt;: single market + single currency + common central bank + coordination of economic policies).&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;François Mitterrand&lt;/h4&gt;President of the French Republic.&lt;/div&gt;
    &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;Helmut Kohl&lt;/h4&gt;German Chancellor. &lt;span class=&quot;src&quot;&gt;(spelled &quot;Khol&quot; in the slides)&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;Jacques Delors&lt;/h4&gt;President of the European Commission; his &lt;strong&gt;Delors Report&lt;/strong&gt; (1989) is the &quot;blueprint&quot; of the Treaty.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Mitterrand and Kohl acted as mediators between the differing objectives and visions of the member states. The provisions on EMU, drawn from the Delors Report, make up &lt;strong&gt;the largest part of the Treaty&lt;/strong&gt;: stages, convergence, the &lt;span class=&quot;term&quot;&gt;ECB&lt;/span&gt; (European Central Bank) and its independence, fiscal coordination.&lt;/p&gt;
  &lt;div class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 860 120&quot; aria-label=&quot;Timeline&quot;&gt;
    &lt;line x1=&quot;30&quot; y1=&quot;60&quot; x2=&quot;830&quot; y2=&quot;60&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;3&quot;/&gt;
    &lt;g font-size=&quot;12&quot;&gt;
      &lt;circle cx=&quot;60&quot; cy=&quot;60&quot; r=&quot;7&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Apr 1989&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot;&gt;Delors Report&lt;/text&gt;
      &lt;circle cx=&quot;200&quot; cy=&quot;60&quot; r=&quot;7&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 Jul 1990&lt;/text&gt;&lt;text x=&quot;200&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot;&gt;Stage 1&lt;/text&gt;
      &lt;circle cx=&quot;340&quot; cy=&quot;60&quot; r=&quot;9&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;7 Feb 1992&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot;&gt;signed in Maastricht&lt;/text&gt;
      &lt;circle cx=&quot;480&quot; cy=&quot;60&quot; r=&quot;7&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;480&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 Nov 1993&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot;&gt;entry into force&lt;/text&gt;
      &lt;circle cx=&quot;610&quot; cy=&quot;60&quot; r=&quot;7&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;610&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 Jan 1994&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot;&gt;Stage 2&lt;/text&gt;
      &lt;circle cx=&quot;760&quot; cy=&quot;60&quot; r=&quot;9&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;760&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 Jan 1999&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot;&gt;Stage 3: euro + ECB&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Dates from slides 2–3; the date of the Delors Report (April 1989) is confirmed by the external source CVCE (see &quot;Further reading&quot;).&lt;/figcaption&gt;
  &lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;The Treaty&#x27;s other innovations (non-monetary)&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Principle of &lt;span class=&quot;term&quot;&gt;subsidiarity&lt;/span&gt;&lt;/strong&gt;: the Union acts only if an objective cannot be better achieved by the member states. &lt;span class=&quot;tag int&quot;&gt;supplement&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Reform of the &lt;span class=&quot;term&quot;&gt;Structural Funds&lt;/span&gt;&lt;/strong&gt; for the cohesion objective (reducing regional disparities).&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Extension of the common market&lt;/strong&gt; to transport, health, culture…&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3 id=&quot;fasi&quot;&gt;Two principles: gradualism and convergence&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 3&lt;/span&gt; The single currency arrives in &lt;strong&gt;three successive stages&lt;/strong&gt; (gradualism), and entry is conditional on meeting the &lt;span class=&quot;term&quot;&gt;convergence criteria&lt;/span&gt; (convergence). Step through the stages:&lt;/p&gt;
  &lt;div class=&quot;steps box tint&quot; data-steps&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Stage 1 · from 1 July 1990&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Liberalisation of capital movements.&lt;/strong&gt; Capital flows freely between member countries.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;tag int&quot;&gt;supplement&lt;/span&gt; With free capital mobility, (quasi-)fixed exchange rates and independent monetary policies cannot coexist (the &quot;trilemma&quot; or &lt;em&gt;impossible trinity&lt;/em&gt;): this is the first step that makes coordination of monetary policy unavoidable.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Stage 2 · from 1 January 1994&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Convergence of the economic policies&lt;/strong&gt; of the member states: this is the period in which countries must meet the criteria.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Stage 3 · from 1 January 1999&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Single currency and creation of the ECB.&lt;/strong&gt; The conversion rates of the national currencies are irrevocably fixed (see &lt;a href=&quot;#fase-finale&quot;&gt;section 8&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepctl&quot;&gt;&lt;button class=&quot;btn ghost&quot; data-prev&gt;← back&lt;/button&gt;&lt;span data-count&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Which document is considered the &quot;blueprint&quot; of the Maastricht Treaty?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;The 1989 Delors Report, drafted by the committee chaired by Jacques Delors, President of the Commission.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What are the two principles underpinning the path to the euro?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;&lt;strong&gt;Gradualism&lt;/strong&gt; (three stages: 1990, 1994, 1999) and &lt;strong&gt;convergence&lt;/strong&gt; (entry only for countries that meet the criteria).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What begins on 1 January 1999?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;The third stage: the single currency and the European Central Bank becoming operational.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 CRITERI ============ --&gt;
&lt;section id=&quot;criteri&quot; class=&quot;part p-ochre&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--ochre)&quot;&gt;The entry rules&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;The five convergence criteria&lt;/span&gt;&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 4&lt;/span&gt; The Treaty requires &lt;strong&gt;macroeconomic&lt;/strong&gt; convergence, but &lt;em&gt;only&lt;/em&gt; in monetary policy and public finance: inflation, interest rates, fiscal policies. The overriding concern is &lt;strong&gt;inflation&lt;/strong&gt; and anything that may generate inflationary pressures.&lt;/p&gt;
  &lt;div class=&quot;box note&quot;&gt;&lt;span class=&quot;tag int&quot;&gt;supplement&lt;/span&gt; Note what is &lt;em&gt;missing&lt;/em&gt;: there is no &quot;real&quot; criterion (unemployment, growth, business-cycle synchronisation, labour mobility). These are precisely the variables of &lt;span class=&quot;term&quot;&gt;optimum currency area&lt;/span&gt; theory (how costly it is for different countries to give up the exchange rate when an &lt;span class=&quot;term&quot;&gt;asymmetric shock&lt;/span&gt; hits, i.e. a shock that affects one country and not the others). Maastricht measures &lt;em&gt;nominal&lt;/em&gt; convergence, not real convergence.&lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1 · Inflation&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;2 · Long-term rates&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;3 · Exchange rate&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;4 · Deficit&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;5 · Debt&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;f&quot;&gt;π&lt;sub&gt;country&lt;/sub&gt; ≤ average of the 3 lowest inflation rates among the candidates + 1.5 points&lt;/div&gt;&lt;p&gt;Its purpose is to prevent the union from starting out with an &lt;span class=&quot;term&quot;&gt;inflationary bias&lt;/span&gt; (→ &lt;a href=&quot;#inflazione&quot;&gt;section 3&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;f&quot;&gt;i&lt;sub&gt;long, country&lt;/sub&gt; ≤ average long-term rate of the 3 lowest-inflation countries + 2 points&lt;/div&gt;&lt;p&gt;Avoids large capital gains/losses at the moment of entry (→ &lt;a href=&quot;#tassi&quot;&gt;section 4&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;The country must have joined the &lt;span class=&quot;term&quot;&gt;exchange rate mechanism&lt;/span&gt; (ERM) of the &lt;span class=&quot;term&quot;&gt;EMS&lt;/span&gt; (European Monetary System, the European system of semi-fixed exchange rates created in 1979) and &lt;strong&gt;must not have devalued in the two years preceding&lt;/strong&gt; entry into EMU (→ &lt;a href=&quot;#cambio&quot;&gt;section 4&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;f&quot;&gt;government deficit ≤ 3% of GDP&lt;/div&gt;&lt;p&gt;If not met: the deficit must have &lt;em&gt;declined substantially and continuously&lt;/em&gt; to a level close to 3%, or the excess must be &quot;only exceptional and temporary and remain close to the reference value&quot; (Art. 104c(a) of the Treaty).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;f&quot;&gt;government debt ≤ 60% of GDP&lt;/div&gt;&lt;p&gt;If not met: the debt must be &quot;sufficiently diminishing and approaching the reference value (60%) at a satisfactory pace&quot; (Art. 104c(b)).&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;tag int&quot;&gt;supplement&lt;/span&gt; The &quot;satisfactory pace&quot; clause is what allowed Italy and Belgium, with debt above 100%, to join in 1999.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt; Today the criteria are set out in Art. 140 TFEU and Protocol No. 13; the budgetary criterion is formulated as &quot;not being the subject of a Council decision on the existence of an excessive deficit&quot; (Art. 126(6) TFEU). Links in &lt;a href=&quot;#approfondire&quot;&gt;Further reading&lt;/a&gt;.&lt;/p&gt;

  &lt;h3&gt;Try it yourself: does this country get in?&lt;/h3&gt;
  &lt;p&gt;&lt;strong&gt;Hypothetical&lt;/strong&gt; reference values: the three best-performing countries have inflation of 1.0%, 1.3%, 1.6% (average 1.3% → threshold &lt;strong&gt;2.8%&lt;/strong&gt;) and an average long-term rate of 4.5% (→ threshold &lt;strong&gt;6.5%&lt;/strong&gt;).&lt;/p&gt;
  &lt;div class=&quot;box&quot; id=&quot;checker&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ck-pi&quot;&gt;Inflation&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ck-pi&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;3.5&quot;&gt;&lt;output id=&quot;ck-pi-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ck-i&quot;&gt;Long-term rate&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ck-i&quot; min=&quot;2&quot; max=&quot;14&quot; step=&quot;0.1&quot; value=&quot;7&quot;&gt;&lt;output id=&quot;ck-i-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ck-d&quot;&gt;Deficit / GDP&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ck-d&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;3.4&quot;&gt;&lt;output id=&quot;ck-d-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ck-b&quot;&gt;Debt / GDP&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ck-b&quot; min=&quot;20&quot; max=&quot;140&quot; step=&quot;1&quot; value=&quot;115&quot;&gt;&lt;output id=&quot;ck-b-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;label class=&quot;toggle&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;ck-dfall&quot; checked&gt; deficit declining continuously and close to 3%&lt;/label&gt;
    &lt;label class=&quot;toggle&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;ck-bfall&quot; checked&gt; debt declining &quot;at a satisfactory pace&quot;&lt;/label&gt;
    &lt;label class=&quot;toggle&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;ck-erm&quot; checked&gt; 2 years in the ERM without devaluing&lt;/label&gt;
    &lt;div class=&quot;readout&quot; id=&quot;ck-out&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Which three areas does the convergence required by the Treaty focus on?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Inflation, interest rates (and the exchange rate), fiscal policies: only monetary policy and public finance.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;The reference value for long-term rates is the average of which countries?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Of the three countries with the lowest inflation (not the three with the lowest rates), plus 2 percentage points.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;A country has a deficit of 3.4% that has been falling sharply for years. Does it meet the criterion?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;It can be considered compliant: the Treaty allows a deficit above 3% if it has declined substantially and continuously and is approaching the reference value, or if the excess is exceptional and temporary.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 INFLAZIONE ============ --&gt;
&lt;section id=&quot;inflazione&quot; class=&quot;part p-ochre&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--ochre)&quot;&gt;Criterion 1&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;Inflation convergence and the Barro-Gordon model&lt;/span&gt;&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slides 7–9&lt;/span&gt; The aim is to prevent the future monetary union from having an &lt;span class=&quot;term&quot;&gt;inflationary bias&lt;/span&gt; (a systematic tendency towards higher inflation than necessary). The analysis builds on the &lt;dfn&gt;Barro-Gordon model&lt;/dfn&gt;.&lt;/p&gt;

  &lt;details open&gt;&lt;summary&gt;The Barro-Gordon model in four ideas&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;tag int&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;
    &lt;ol&gt;
      &lt;li&gt;&lt;strong&gt;Expectations-augmented Phillips curve&lt;/strong&gt;: unemployment falls below the natural rate &lt;i&gt;U&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt; only if inflation is &lt;em&gt;higher than expected&lt;/em&gt; (a surprise). In the long run the curve is vertical at &lt;i&gt;U&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt;.&lt;/li&gt;
      &lt;li&gt;The government/central bank would like an unemployment rate &lt;i&gt;U*&lt;/i&gt; &amp;lt; &lt;i&gt;U&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt; (for instance because &lt;i&gt;U&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt; is &quot;too high&quot; owing to labour-market rigidities).&lt;/li&gt;
      &lt;li&gt;It is therefore &lt;strong&gt;tempted&lt;/strong&gt; to create surprise inflation. But the public knows this and raises its expectations until the temptation disappears.&lt;/li&gt;
      &lt;li&gt;Result: an equilibrium with &lt;strong&gt;unemployment = &lt;i&gt;U&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt;&lt;/strong&gt; and &lt;strong&gt;positive inflation&lt;/strong&gt; with no gain whatsoever. This &quot;useless&quot; inflation is the inflation bias, and it is higher the more weight the country places on unemployment relative to inflation (“flatter” indifference curves).&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;The inflationary bias in a monetary union&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
  &lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;
    &lt;svg viewBox=&quot;0 0 420 320&quot; aria-label=&quot;Interactive Barro-Gordon diagram&quot;&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;280&quot; x2=&quot;400&quot; y2=&quot;280&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;280&quot; x2=&quot;40&quot; y2=&quot;20&quot; stroke=&quot;var(--ink)&quot;/&gt;
      &lt;text x=&quot;400&quot; y=&quot;300&quot; text-anchor=&quot;end&quot; font-size=&quot;12&quot;&gt;Unemployment&lt;/text&gt;&lt;text x=&quot;14&quot; y=&quot;150&quot; font-size=&quot;12&quot; transform=&quot;rotate(-90 14 150)&quot; text-anchor=&quot;middle&quot;&gt;Inflation&lt;/text&gt;
      &lt;line x1=&quot;230&quot; y1=&quot;280&quot; x2=&quot;230&quot; y2=&quot;30&quot; stroke=&quot;var(--ink2)&quot;/&gt;
      &lt;text x=&quot;230&quot; y=&quot;298&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Uₙ&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;298&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;U*&lt;/text&gt;

      &lt;line x1=&quot;90&quot; y1=&quot;280&quot; x2=&quot;390&quot; y2=&quot;160&quot; stroke=&quot;var(--slate)&quot; stroke-dasharray=&quot;5 4&quot;/&gt;
      &lt;text x=&quot;345&quot; y=&quot;170&quot; font-size=&quot;11&quot; style=&quot;fill:var(--slate)&quot;&gt;Germany&lt;/text&gt;
