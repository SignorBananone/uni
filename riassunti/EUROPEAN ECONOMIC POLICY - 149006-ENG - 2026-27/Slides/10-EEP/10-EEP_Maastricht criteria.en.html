      &lt;circle cx=&quot;230&quot; cy=&quot;140&quot; r=&quot;6&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;136&quot; font-size=&quot;12&quot;&gt;E&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;I&lt;/tspan&gt;&lt;/text&gt;
      &lt;circle cx=&quot;230&quot; cy=&quot;220&quot; r=&quot;6&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;216&quot; font-size=&quot;12&quot;&gt;E&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;G&lt;/tspan&gt;&lt;/text&gt;
      &lt;line id=&quot;bg-line&quot; x1=&quot;90&quot; y1=&quot;280&quot; x2=&quot;230&quot; y2=&quot;180&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;circle id=&quot;bg-u&quot; cx=&quot;230&quot; cy=&quot;180&quot; r=&quot;7&quot; style=&quot;fill:var(--acc)&quot; stroke=&quot;var(--paper)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text id=&quot;bg-ul&quot; x=&quot;200&quot; y=&quot;184&quot; font-size=&quot;12&quot; text-anchor=&quot;end&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--acc)&quot;&gt;E&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;U&lt;/tspan&gt;&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Redrawing of slide 8. Dashed lines: locus of equilibria for each country; E&lt;sub&gt;U&lt;/sub&gt; = union equilibrium.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;Before EMU, Germany has low inflation (E&lt;sub&gt;G&lt;/sub&gt;) and Italy high inflation (E&lt;sub&gt;I&lt;/sub&gt;): &lt;strong&gt;different preferences&lt;/strong&gt; over inflation and unemployment.&lt;/li&gt;
      &lt;li&gt;In the union they decide &lt;strong&gt;jointly&lt;/strong&gt;: inflation will reflect the average of preferences, between E&lt;sub&gt;I&lt;/sub&gt; and E&lt;sub&gt;G&lt;/sub&gt;.&lt;/li&gt;
      &lt;li&gt;Germany &lt;strong&gt;loses&lt;/strong&gt; welfare, Italy &lt;strong&gt;gains&lt;/strong&gt; (it imports credibility).&lt;/li&gt;
      &lt;li&gt;Germany therefore demands proof that Italy shares the same preference for price stability (→ inflation criterion) and wants an ECB that is a &lt;strong&gt;clone of the Bundesbank&lt;/strong&gt;.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;bg-w&quot;&gt;Weight of &quot;Italian&quot; preferences in the ECB&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;bg-w&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;50&quot;&gt;&lt;output id=&quot;bg-w-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;readout&quot; id=&quot;bg-out&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The problem of disinflation&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 9&lt;/span&gt; How can Italy move from E&lt;sub&gt;I&lt;/sub&gt; to E&lt;sub&gt;G&lt;/sub&gt; before joining? Step through the stages.&lt;/p&gt;
  &lt;div class=&quot;steps box tint&quot; data-steps data-svg=&quot;dis&quot;&gt;
    &lt;svg id=&quot;dis&quot; viewBox=&quot;0 0 420 300&quot; style=&quot;max-width:520px;margin:auto&quot;&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;270&quot; x2=&quot;400&quot; y2=&quot;270&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;270&quot; x2=&quot;40&quot; y2=&quot;20&quot; stroke=&quot;var(--ink)&quot;/&gt;
      &lt;text x=&quot;400&quot; y=&quot;290&quot; text-anchor=&quot;end&quot; font-size=&quot;12&quot;&gt;Unemployment&lt;/text&gt;
      &lt;line x1=&quot;200&quot; y1=&quot;270&quot; x2=&quot;200&quot; y2=&quot;30&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;288&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;Uₙ&lt;/text&gt;
      &lt;line x1=&quot;150&quot; y1=&quot;60&quot; x2=&quot;380&quot; y2=&quot;270&quot; stroke=&quot;var(--bad)&quot; stroke-width=&quot;2.5&quot; style=&quot;stroke:var(--bad)&quot;/&gt;
      &lt;circle cx=&quot;200&quot; cy=&quot;106&quot; r=&quot;6&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;104&quot; font-size=&quot;12&quot;&gt;E&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;I&lt;/tspan&gt;&lt;/text&gt;
      &lt;circle cx=&quot;200&quot; cy=&quot;200&quot; r=&quot;6&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;204&quot; font-size=&quot;12&quot;&gt;E&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;G&lt;/tspan&gt;&lt;/text&gt;
      &lt;g data-show=&quot;1 3&quot;&gt;&lt;line x1=&quot;208&quot; y1=&quot;118&quot; x2=&quot;196&quot; y2=&quot;186&quot; stroke=&quot;var(--good)&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#arr)&quot; style=&quot;color:var(--good)&quot;/&gt;&lt;text x=&quot;212&quot; y=&quot;160&quot; font-size=&quot;11&quot; style=&quot;fill:var(--good)&quot;&gt;ideal&lt;/text&gt;&lt;/g&gt;
      &lt;g data-show=&quot;2 3&quot;&gt;&lt;line x1=&quot;210&quot; y1=&quot;118&quot; x2=&quot;270&quot; y2=&quot;172&quot; stroke=&quot;var(--bad)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;circle cx=&quot;276&quot; cy=&quot;176&quot; r=&quot;6&quot; style=&quot;fill:var(--acc)&quot;/&gt;&lt;text x=&quot;286&quot; y=&quot;172&quot; font-size=&quot;12&quot;&gt;E&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;I1&lt;/tspan&gt;&lt;/text&gt;&lt;/g&gt;
      &lt;g data-show=&quot;3&quot;&gt;&lt;line x1=&quot;268&quot; y1=&quot;182&quot; x2=&quot;212&quot; y2=&quot;198&quot; stroke=&quot;var(--bad)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Starting point&lt;/h4&gt;&lt;p&gt;Italy is at E&lt;sub&gt;I&lt;/sub&gt;: unemployment at the natural rate, inflation high and expected by everyone. The red line is the short-run Phillips curve, drawn for &lt;em&gt;those&lt;/em&gt; expectations.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Ideal case: green arrow&lt;/h4&gt;&lt;p&gt;If the disinflation announcement were &lt;strong&gt;fully credible&lt;/strong&gt;, expectations would fall immediately: inflation declines with no increase in unemployment.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;In practice: along the Phillips curve&lt;/h4&gt;&lt;p&gt;Expectations adjust slowly: monetary tightening reduces inflation by &lt;em&gt;moving along the curve&lt;/em&gt; to E&lt;sub&gt;I1&lt;/sub&gt;, with &lt;strong&gt;higher unemployment&lt;/strong&gt; (the cost of disinflation, measured by the &lt;span class=&quot;term&quot;&gt;sacrifice ratio&lt;/span&gt; &lt;span class=&quot;tag int&quot;&gt;supplement&lt;/span&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Then towards E&lt;sub&gt;G&lt;/sub&gt;&lt;/h4&gt;&lt;p&gt;As expectations adjust, the curve shifts down and the country returns to U&lt;sub&gt;n&lt;/sub&gt;, at E&lt;sub&gt;G&lt;/sub&gt;. Open questions from the slide: &lt;strong&gt;how long will it take&lt;/strong&gt;? And will prolonged unemployment &lt;strong&gt;raise the natural rate&lt;/strong&gt; (hysteresis)?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepctl&quot;&gt;&lt;button class=&quot;btn ghost&quot; data-prev&gt;← back&lt;/button&gt;&lt;span data-count&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why, in the Barro-Gordon model, is equilibrium inflation positive even though unemployment remains at U&lt;sub&gt;n&lt;/sub&gt;?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Because the policymaker has an incentive to create surprise inflation to push U towards U* &amp;lt; U&lt;sub&gt;n&lt;/sub&gt;; the public anticipates this and raises its expectations up to the point where the marginal incentive vanishes. The outcome is inflation without benefits: the inflation bias.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Who gains and who loses in a union between a low-inflation and a high-inflation country?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;The low-inflation country (Germany) loses, because common inflation is higher than its own; the high-inflation country (Italy) gains.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why does disinflation not follow the green arrow?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Because expectations do not adjust immediately (imperfect credibility): inflation falls along the short-run Phillips curve, with a temporary rise in unemployment.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 CAMBIO E TASSI ============ --&gt;
&lt;section id=&quot;cambio&quot; class=&quot;part p-ochre&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;04&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--ochre)&quot;&gt;Criteria 2 and 3&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;Exchange rate and interest rate convergence&lt;/span&gt;&lt;/h2&gt;
  &lt;h3&gt;No-devaluation requirement&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 10&lt;/span&gt; The criterion prevents countries from &lt;strong&gt;manipulating the exchange rate&lt;/strong&gt; shortly before entry, for example by devaluing in order to enter the union at a more favourable conversion rate (a depreciated currency = permanently more competitive exports, since the conversion rate is irrevocable).&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;What the Treaty requires&lt;/h4&gt;Keeping the exchange rate within the &quot;normal&quot; fluctuation band, &lt;strong&gt;without changing the central parity&lt;/strong&gt; (&lt;span class=&quot;term&quot;&gt;central rate&lt;/span&gt;), for the two years before entry.&lt;/div&gt;
    &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;Which band?&lt;/h4&gt;From August 1993 the &quot;normal&quot; EMS band was &lt;strong&gt;±15%&lt;/strong&gt; around the central parity.&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 640 170&quot; aria-label=&quot;Fluctuation band&quot;&gt;
      &lt;rect x=&quot;40&quot; y=&quot;30&quot; width=&quot;560&quot; height=&quot;110&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;85&quot; x2=&quot;600&quot; y2=&quot;85&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;30&quot; x2=&quot;600&quot; y2=&quot;30&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;140&quot; x2=&quot;600&quot; y2=&quot;140&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
      &lt;text x=&quot;606&quot; y=&quot;34&quot; font-size=&quot;11&quot;&gt;+15%&lt;/text&gt;&lt;text x=&quot;606&quot; y=&quot;89&quot; font-size=&quot;11&quot;&gt;parity&lt;/text&gt;&lt;text x=&quot;606&quot; y=&quot;144&quot; font-size=&quot;11&quot;&gt;−15%&lt;/text&gt;
      &lt;path d=&quot;M40,85 C90,60 130,110 180,95 S270,55 320,80 S420,120 470,100 S560,70 600,88&quot; fill=&quot;none&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text x=&quot;44&quot; y=&quot;162&quot; font-size=&quot;11&quot;&gt;−2 years&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;162&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot;&gt;entry into EMU&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;The exchange rate may fluctuate within the band, but the central parity must not be devalued. &lt;span class=&quot;tag int&quot;&gt;supplement&lt;/span&gt; The band was widened from ±2.25% to ±15% after the speculative crises of 1992-93 (the lira and sterling left the ERM in September 1992).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3 id=&quot;tassi&quot;&gt;Interest rate convergence&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 11&lt;/span&gt;&lt;/p&gt;
  &lt;ul&gt;
    &lt;li&gt;Very large interest rate differentials before entry could cause large &lt;strong&gt;capital gains and losses&lt;/strong&gt; at the moment of entry.&lt;/li&gt;
    &lt;li&gt;However, these gains/losses probably occur &lt;strong&gt;earlier&lt;/strong&gt;: the market makes long-term rates converge on its own as soon as the political decision to admit the country is taken.&lt;/li&gt;
    &lt;li&gt;Given the inflation criterion, the exchange rate criterion and free capital mobility, rates &lt;strong&gt;would have converged anyway&lt;/strong&gt; (recall &lt;span class=&quot;term&quot;&gt;interest rate parity&lt;/span&gt;).&lt;/li&gt;
  &lt;/ul&gt;
  &lt;details&gt;&lt;summary&gt;Refresher: interest rate parity and bond prices&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;tag int&quot;&gt;supplement&lt;/span&gt; With free capital mobility, the expected return must be the same everywhere:&lt;/p&gt;
    &lt;div class=&quot;f&quot;&gt;&lt;i&gt;i&lt;/i&gt;&lt;sub&gt;ITA&lt;/sub&gt; = &lt;i&gt;i&lt;/i&gt;&lt;sub&gt;GER&lt;/sub&gt; + expected depreciation of the lira (+ risk premium)&lt;/div&gt;
    &lt;p&gt;If euro entry becomes credible, expected depreciation goes to zero and the spread closes. The price of a fixed-rate bond moves in the opposite direction to the interest rate: those holding high-yield BTPs (Italian government bonds) in the mid-1990s made &lt;strong&gt;large capital gains&lt;/strong&gt; as Italian rates fell towards German ones (the &quot;convergence play&quot;).&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why might a country want to devalue just before joining?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;To lock in a depreciated conversion rate and thus a permanent competitive advantage over the other members: this is the behaviour the criterion aims to prevent.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why is the interest rate criterion partly redundant?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Because with converging inflation, a stable exchange rate and free capital mobility, interest rate parity pushes long-term rates to converge spontaneously as soon as entry becomes credible.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 BILANCIO ============ --&gt;
&lt;section id=&quot;bilancio&quot; class=&quot;part p-slate&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--slate)&quot;&gt;Criteria 4 and 5&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;Budgetary convergence: deficit and debt&lt;/span&gt;&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 12&lt;/span&gt; The deficit and debt criteria are justified in the same way as the inflation criterion:&lt;/p&gt;
  &lt;ul&gt;
    &lt;li&gt;A country with a high &lt;span class=&quot;term&quot;&gt;debt-to-GDP ratio&lt;/span&gt; has an incentive to create &lt;strong&gt;surprise inflation&lt;/strong&gt;, which reduces the real value of the debt.&lt;/li&gt;
    &lt;li&gt;The low-debt country would lose out, so it demands that the high-debt country &lt;strong&gt;reduce its debt before&lt;/strong&gt; joining.&lt;/li&gt;
    &lt;li&gt;The high-debt country must also reduce its &lt;strong&gt;deficit&lt;/strong&gt;.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h3&gt;The government budget constraint, step by step&lt;/h3&gt;
  &lt;div class=&quot;steps box tint&quot; data-steps&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Debt accumulates deficits&lt;/h4&gt;&lt;p&gt;B = nominal debt, D = nominal deficit (expenditure − revenue), Y = nominal GDP.&lt;/p&gt;&lt;div class=&quot;f&quot;&gt;&lt;i&gt;B&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;B&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt; + &lt;i&gt;D&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Primary expenditure and interest payments&lt;/h4&gt;&lt;p&gt;Expenditure G is split into primary expenditure G&lt;sup&gt;P&lt;/sup&gt; (everything except interest) and interest on the existing debt i·B&lt;sub&gt;t−1&lt;/sub&gt;:&lt;/p&gt;&lt;div class=&quot;f&quot;&gt;&lt;i&gt;D&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;G&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; − &lt;i&gt;T&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = (&lt;i&gt;G&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt; + &lt;i&gt;i&lt;sub&gt;t&lt;/sub&gt;B&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt;) − &lt;i&gt;T&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;i&lt;sub&gt;t&lt;/sub&gt;B&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt; + &lt;i&gt;D&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;D&lt;sup&gt;P&lt;/sup&gt; = G&lt;sup&gt;P&lt;/sup&gt; − T is the &lt;dfn&gt;primary deficit&lt;/dfn&gt;; if negative it is a &lt;dfn&gt;primary surplus&lt;/dfn&gt; A&lt;sup&gt;P&lt;/sup&gt; = −D&lt;sup&gt;P&lt;/sup&gt;. i&lt;sub&gt;t&lt;/sub&gt; = average interest rate on the existing debt.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · The debt equation&lt;/h4&gt;&lt;div class=&quot;f&quot;&gt;&lt;i&gt;B&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;B&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt;(1 + &lt;i&gt;i&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;) + &lt;i&gt;D&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;Nominal debt remains constant (B&lt;sub&gt;t&lt;/sub&gt; − B&lt;sub&gt;t−1&lt;/sub&gt; = 0) if &lt;i&gt;i&lt;sub&gt;t&lt;/sub&gt;B&lt;sub&gt;t−1&lt;/sub&gt;&lt;/i&gt; = −&lt;i&gt;D&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt; = &lt;i&gt;A&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;: the &lt;strong&gt;primary surplus exactly covers interest payments&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · In real terms&lt;/h4&gt;&lt;p&gt;Dividing by the price level P (with ṗ = inflation), and denoting real variables with a tilde:&lt;/p&gt;&lt;div class=&quot;f&quot;&gt;&lt;i&gt;B̃&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;B̃&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;1 + &lt;i&gt;i&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;1 + &lt;i&gt;ṗ&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;/span&gt; + &lt;i&gt;D̃&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;An increase in inflation reduces the real value of the debt&lt;/strong&gt;, ceteris paribus: hence the temptation to create unexpected inflation. (Unexpected, because if it were expected creditors would demand a higher &lt;i&gt;i&lt;/i&gt;.)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;5 · The legal barrier&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Debt monetization&lt;/span&gt; (financing the deficit by printing money, i.e. the central bank buying bonds from the Treasury) is &lt;strong&gt;prohibited by the EU Treaty&lt;/strong&gt;. &lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt; Today: Art. 123 TFEU, prohibition of monetary financing.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepctl&quot;&gt;&lt;button class=&quot;btn ghost&quot; data-prev&gt;← back&lt;/button&gt;&lt;span data-count&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;No-bailout clause&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 16&lt;/span&gt; Highly indebted countries have a higher risk of default; within the union this increases the pressure for a &lt;span class=&quot;term&quot;&gt;bailout&lt;/span&gt; (rescue by the other members) in the event of a crisis. This is why the Treaty includes a &lt;em&gt;no-bailout&lt;/em&gt; clause. &lt;strong&gt;But is it credible?&lt;/strong&gt;&lt;/p&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;tag int&quot;&gt;supplement&lt;/span&gt; The doubt is one of &lt;span class=&quot;term&quot;&gt;time inconsistency&lt;/span&gt;: ex ante there is a promise not to bail out, but ex post a member&#x27;s default can spread contagion to banks and other states, making a rescue worthwhile. The Greek crisis (2010) and the creation of the ESM demonstrated this. &lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt; Today it is Art. 125 TFEU; the Court of Justice (&lt;em&gt;Pringle&lt;/em&gt; case) has allowed assistance subject to strict conditionality.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;How the Treaty measures deficit and debt&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slides 17–18&lt;/span&gt; Maastricht &lt;strong&gt;does not distinguish&lt;/strong&gt; between primary expenditure and interest, and measures everything &lt;strong&gt;relative to GDP&lt;/strong&gt;. Using lower-case letters for GDP ratios and &lt;i&gt;g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt; = nominal GDP growth:&lt;/p&gt;
  &lt;div class=&quot;f&quot;&gt;(1) &amp;nbsp; &lt;i&gt;b&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;b&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;1&lt;/span&gt;&lt;span&gt;1 + &lt;i&gt;g&lt;/i&gt;&lt;sub&gt;N,t&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt; + &lt;i&gt;d&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/div&gt;
  &lt;p&gt;This is a &lt;dfn&gt;first-order difference equation&lt;/dfn&gt;: today&#x27;s value depends on yesterday&#x27;s. The solution has an &lt;strong&gt;equilibrium&lt;/strong&gt; component and a &lt;strong&gt;deviation&lt;/strong&gt; that over time may vanish or grow. At equilibrium (&lt;i&gt;b&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;b&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt; = &lt;i&gt;b̄&lt;/i&gt;):&lt;/p&gt;
  &lt;div class=&quot;f&quot;&gt;&lt;i&gt;b̄&lt;/i&gt; = &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;1 + &lt;i&gt;g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;&lt;i&gt;g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;/span&gt;&lt;i&gt;d&lt;/i&gt; &amp;nbsp;≈&amp;nbsp; &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;&lt;i&gt;d&lt;/i&gt;&lt;/span&gt;&lt;span&gt;&lt;i&gt;g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;/span&gt; &amp;nbsp;&amp;nbsp;⇔&amp;nbsp;&amp;nbsp; &lt;strong&gt;&lt;i&gt;d&lt;/i&gt; = &lt;i&gt;g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt; · &lt;i&gt;b̄&lt;/i&gt;&lt;/strong&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;The approximation neglects the term &lt;i&gt;d·g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt;, which is small (e.g. 0.03 × 0.05 = 0.0015).&lt;/p&gt;

  &lt;h3&gt;Where 3% and 60% come from&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slides 19–21&lt;/span&gt; With &lt;i&gt;b&lt;/i&gt; = 0.6 and &lt;i&gt;d&lt;/i&gt; = 0.03 → &lt;i&gt;g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt; = 0.03/0.6 = &lt;strong&gt;5%&lt;/strong&gt;. If nominal GDP grows by 5% and equilibrium inflation is 2%, real GDP grows by 3%. The thresholds are consistent only under this assumption: &lt;strong&gt;they are arbitrary&lt;/strong&gt;, for two reasons:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Why exactly 60%?&lt;/h4&gt;The only reason: it was the &lt;strong&gt;average EU debt-to-GDP ratio&lt;/strong&gt; at the time of the negotiations.&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;It depends on future growth&lt;/h4&gt;If nominal GDP grows faster (slower) than 5%, the deficit that stabilises debt at 60% is higher (lower) than 3%.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box tint&quot; id=&quot;rule&quot;&gt;
    &lt;h4&gt;Calculator for the rule d = g · b&lt;/h4&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ru-g&quot;&gt;Nominal GDP growth g&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ru-g&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;ru-g-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ru-b&quot;&gt;Target debt b&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ru-b&quot; min=&quot;20&quot; max=&quot;140&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;&lt;output id=&quot;ru-b-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;readout&quot; id=&quot;ru-out&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What does it mean that nominal debt is constant if A&lt;sup&gt;P&lt;/sup&gt; = i·B&lt;sub&gt;t−1&lt;/sub&gt;?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;The primary surplus (revenue minus expenditure net of interest) is enough to pay all the interest: no new borrowing is needed.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;With nominal growth of 3%, what deficit stabilises debt at 60%?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;d = 0.03 × 0.60 = 1.8% of GDP. With a 3% deficit, debt would rise towards 0.03/0.03 = 100%.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why does high debt create an incentive for surprise inflation?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Because the real value of debt is B/P: inflation above the rate built into nominal interest rates erodes real debt, transferring wealth from creditors to the state.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6 DINAMICA ============ --&gt;
&lt;section id=&quot;dinamica&quot; class=&quot;part p-slate&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;06&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--slate)&quot;&gt;The analytical core&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;Should we worry about high debt? Debt-to-GDP dynamics&lt;/span&gt;&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 22&lt;/span&gt; We start from real debt and divide by real GDP. We define the &lt;dfn&gt;real interest rate&lt;/dfn&gt;&lt;/p&gt;
  &lt;div class=&quot;f&quot;&gt;&lt;span class=&quot;fr&quot;&gt;&lt;span&gt;1 + &lt;i&gt;i&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;1 + &lt;i&gt;ṗ&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;/span&gt; = 1 + &lt;i&gt;r&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; &amp;nbsp;≅&amp;nbsp; 1 + &lt;i&gt;i&lt;/i&gt; − &lt;i&gt;ṗ&lt;/i&gt;&lt;/div&gt;
  &lt;p&gt;and with &lt;i&gt;g&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;strong&gt;real&lt;/strong&gt; GDP growth we obtain the key equation and its equilibrium:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;f&quot; style=&quot;border:2px solid var(--bad)&quot;&gt;&lt;i&gt;b&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;b&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;1 + &lt;i&gt;r&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;1 + &lt;i&gt;g&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;/span&gt; + &lt;i&gt;d&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;f&quot; style=&quot;border:2px solid var(--bad)&quot;&gt;&lt;i&gt;b̄&lt;/i&gt; = &lt;i&gt;d&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt; &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;1 + &lt;i&gt;g&lt;/i&gt;&lt;/span&gt;&lt;span&gt;&lt;i&gt;g&lt;/i&gt; − &lt;i&gt;r&lt;/i&gt;&lt;/span&gt;&lt;/span&gt; &amp;nbsp;≈&amp;nbsp; &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;&lt;i&gt;d&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;&lt;i&gt;g&lt;/i&gt; − &lt;i&gt;r&lt;/i&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box note&quot;&gt;&lt;span class=&quot;tag int&quot;&gt;supplement&lt;/span&gt; Difference from section 5: there we used the &lt;em&gt;overall&lt;/em&gt; deficit and &lt;em&gt;nominal&lt;/em&gt; growth; here we use the &lt;em&gt;primary&lt;/em&gt; deficit and the &lt;em&gt;real&lt;/em&gt; differential r − g. The two versions are equivalent, but this one separates what the government controls directly (d&lt;sup&gt;P&lt;/sup&gt;) from what depends on markets and the economy (r, g).&lt;/div&gt;

  &lt;h3&gt;Graphical analysis: the b&lt;sub&gt;t&lt;/sub&gt; – b&lt;sub&gt;t−1&lt;/sub&gt; diagram&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slides 23–30&lt;/span&gt; Approximating the slope by (1 + r − g): &lt;i&gt;b&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;b&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt;(1 + &lt;i&gt;r&lt;/i&gt; − &lt;i&gt;g&lt;/i&gt;) + &lt;i&gt;d&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;. This is a straight line in (b&lt;sub&gt;t−1&lt;/sub&gt;, b&lt;sub&gt;t&lt;/sub&gt;) space:&lt;/p&gt;
  &lt;ul&gt;
    &lt;li&gt;the &lt;strong&gt;45° line&lt;/strong&gt; is the locus of steady-state equilibria (b&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt;);&lt;/li&gt;
    &lt;li&gt;the &lt;strong&gt;intercept&lt;/strong&gt; is d&lt;sup&gt;P&lt;/sup&gt;: positive with a primary deficit, negative with a surplus. Changing d&lt;sup&gt;P&lt;/sup&gt; &lt;em&gt;shifts&lt;/em&gt; the line;&lt;/li&gt;
    &lt;li&gt;the &lt;strong&gt;slope&lt;/strong&gt; is (1+r)/(1+g): less than 1 if g &amp;gt; r, greater than 1 if g &amp;lt; r. Changing r or g &lt;em&gt;rotates&lt;/em&gt; it.&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p&gt;Move the sliders or pick one of the four cases from the slides. The step line (&lt;span class=&quot;term&quot;&gt;cobweb&lt;/span&gt;) shows the year-by-year path starting from b&lt;sub&gt;0&lt;/sub&gt;.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs data-onchange=&quot;debtCase&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Case 1: g&amp;gt;r, deficit&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Case 2: g&amp;gt;r, surplus&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Case 3: g&amp;lt;r, deficit&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Case 4: g&amp;lt;r, surplus&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;strong&gt;STABLE equilibrium&lt;/strong&gt;, positive: debt rises if it starts below the equilibrium and falls if it starts above.&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;strong&gt;STABLE equilibrium&lt;/strong&gt; but negative (the state becomes a net creditor): from any positive value, debt falls.&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;strong&gt;UNSTABLE equilibrium&lt;/strong&gt;, negative: from any positive value, debt grows without bound.&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;strong&gt;UNSTABLE equilibrium&lt;/strong&gt;, positive: debt grows if it starts above the equilibrium and falls if it starts below.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;
      &lt;svg id=&quot;ph&quot; viewBox=&quot;0 0 420 400&quot; aria-label=&quot;Debt phase diagram&quot;&gt;
        &lt;defs&gt;&lt;clipPath id=&quot;phc&quot;&gt;&lt;rect x=&quot;50&quot; y=&quot;20&quot; width=&quot;350&quot; height=&quot;350&quot;/&gt;&lt;/clipPath&gt;&lt;/defs&gt;
        &lt;line x1=&quot;50&quot; y1=&quot;270&quot; x2=&quot;400&quot; y2=&quot;270&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;line x1=&quot;150&quot; y1=&quot;20&quot; x2=&quot;150&quot; y2=&quot;370&quot; stroke=&quot;var(--ink)&quot;/&gt;
        &lt;text x=&quot;400&quot; y=&quot;290&quot; text-anchor=&quot;end&quot; font-size=&quot;12&quot;&gt;b&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;t−1&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;156&quot; y=&quot;32&quot; font-size=&quot;12&quot;&gt;b&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;t&lt;/tspan&gt;&lt;/text&gt;
        &lt;g font-size=&quot;9&quot; fill=&quot;var(--ink2)&quot;&gt;&lt;text x=&quot;250&quot; y=&quot;283&quot; text-anchor=&quot;middle&quot;&gt;100%&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;283&quot; text-anchor=&quot;middle&quot;&gt;200%&lt;/text&gt;&lt;text x=&quot;144&quot; y=&quot;173&quot; text-anchor=&quot;end&quot;&gt;100%&lt;/text&gt;&lt;text x=&quot;144&quot; y=&quot;73&quot; text-anchor=&quot;end&quot;&gt;200%&lt;/text&gt;&lt;text x=&quot;50&quot; y=&quot;283&quot;&gt;−100%&lt;/text&gt;&lt;/g&gt;
        &lt;g clip-path=&quot;url(#phc)&quot;&gt;
          &lt;line x1=&quot;50&quot; y1=&quot;370&quot; x2=&quot;400&quot; y2=&quot;20&quot; stroke=&quot;var(--ink2)&quot;/&gt;
          &lt;path id=&quot;ph-cob&quot; fill=&quot;none&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;1.4&quot;/&gt;
          &lt;line id=&quot;ph-line&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;3&quot;/&gt;
          &lt;circle id=&quot;ph-eq&quot; r=&quot;6&quot; style=&quot;fill:var(--brick)&quot; stroke=&quot;var(--paper)&quot; stroke-width=&quot;2&quot;/&gt;
          &lt;circle id=&quot;ph-b0&quot; r=&quot;4&quot; style=&quot;fill:var(--acc)&quot;/&gt;
        &lt;/g&gt;
        &lt;text x=&quot;380&quot; y=&quot;40&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot;&gt;45°&lt;/text&gt;
      &lt;/svg&gt;
      &lt;figcaption&gt;Blue line: b&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt;(1+r)/(1+g) + d&lt;sup&gt;P&lt;/sup&gt;. Red dot: equilibrium b̄.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;dd-r&quot;&gt;r (real interest rate)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;dd-r&quot; min=&quot;-2&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;dd-r-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;dd-g&quot;&gt;g (real growth)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;dd-g&quot; min=&quot;-3&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;dd-g-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;dd-d&quot;&gt;d&lt;sup&gt;P&lt;/sup&gt; (primary deficit)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;dd-d&quot; min=&quot;-5&quot; max=&quot;5&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;dd-d-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;dd-b0&quot;&gt;b&lt;sub&gt;0&lt;/sub&gt; (initial debt)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;dd-b0&quot; min=&quot;0&quot; max=&quot;200&quot; step=&quot;1&quot; value=&quot;130&quot;&gt;&lt;output id=&quot;dd-b0-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;dd-out&quot;&gt;&lt;/div&gt;
      &lt;svg id=&quot;tp&quot; viewBox=&quot;0 0 420 250&quot; aria-label=&quot;Debt over time&quot; style=&quot;margin-top:10px&quot;&gt;
        &lt;line x1=&quot;50&quot; y1=&quot;220&quot; x2=&quot;410&quot; y2=&quot;220&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;220&quot; x2=&quot;50&quot; y2=&quot;10&quot; stroke=&quot;var(--ink)&quot;/&gt;
        &lt;g font-size=&quot;9&quot; fill=&quot;var(--ink2)&quot;&gt;&lt;text x=&quot;44&quot; y=&quot;223&quot; text-anchor=&quot;end&quot;&gt;0&lt;/text&gt;&lt;text x=&quot;44&quot; y=&quot;150&quot; text-anchor=&quot;end&quot;&gt;100&lt;/text&gt;&lt;text x=&quot;44&quot; y=&quot;80&quot; text-anchor=&quot;end&quot;&gt;200&lt;/text&gt;&lt;text x=&quot;44&quot; y=&quot;14&quot; text-anchor=&quot;end&quot;&gt;300%&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;236&quot; text-anchor=&quot;end&quot;&gt;30 years&lt;/text&gt;&lt;/g&gt;
        &lt;line x1=&quot;50&quot; y1=&quot;150&quot; x2=&quot;410&quot; y2=&quot;150&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;line x1=&quot;50&quot; y1=&quot;80&quot; x2=&quot;410&quot; y2=&quot;80&quot; stroke=&quot;var(--rule)&quot;/&gt;
        &lt;line id=&quot;tp-eq&quot; x1=&quot;50&quot; x2=&quot;410&quot; stroke=&quot;var(--brick)&quot; stroke-dasharray=&quot;5 4&quot;/&gt;
        &lt;polyline id=&quot;tp-path&quot; fill=&quot;none&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2.5&quot;/&gt;
      &lt;/svg&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The effort needed to stabilise: the snowball effect&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 31&lt;/span&gt; Subtracting b&lt;sub&gt;t−1&lt;/sub&gt; from both sides:&lt;/p&gt;
  &lt;div class=&quot;f&quot;&gt;(**) &amp;nbsp; Δ&lt;i&gt;b&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;span style=&quot;background:var(--brick-bg);padding:2px 6px;border-radius:6px&quot;&gt;&lt;i&gt;b&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;&lt;i&gt;r&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; − &lt;i&gt;g&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;1 + &lt;i&gt;g&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt; − &lt;i&gt;a&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;&lt;/div&gt;
  &lt;p&gt;The highlighted term is the &lt;dfn&gt;snowball effect&lt;/dfn&gt;: if r &amp;gt; g, debt grows &quot;on its own&quot;, and all the more so the higher it is. For the debt-to-GDP ratio to stop rising (Δb ≤ 0), a primary surplus is required:&lt;/p&gt;
  &lt;div class=&quot;f&quot;&gt;&lt;i&gt;a&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt; ≥ &lt;i&gt;b&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;&lt;i&gt;r&lt;/i&gt; − &lt;i&gt;g&lt;/i&gt;&lt;/span&gt;&lt;span&gt;1 + &lt;i&gt;g&lt;/i&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;With r &amp;gt; g, the required surplus is &lt;strong&gt;relatively large&lt;/strong&gt;, and it increases with the level of debt. (Example: b = 130%, r − g = 2 points → a primary surplus of about 2.5% of GDP is needed every year.)&lt;/p&gt;

  &lt;h3&gt;The solution of the difference equation&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 32&lt;/span&gt; If g, r and d&lt;sup&gt;P&lt;/sup&gt; are constant:&lt;/p&gt;
  &lt;div class=&quot;f&quot;&gt;&lt;i&gt;b&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = (&lt;i&gt;b&lt;/i&gt;&lt;sub&gt;0&lt;/sub&gt; − &lt;i&gt;b̄&lt;/i&gt;) · &lt;span style=&quot;font-size:1.4em&quot;&gt;(&lt;/span&gt;&lt;span class=&quot;fr&quot;&gt;&lt;span&gt;1 + &lt;i&gt;r&lt;/i&gt;&lt;/span&gt;&lt;span&gt;1 + &lt;i&gt;g&lt;/i&gt;&lt;/span&gt;&lt;/span&gt;&lt;span style=&quot;font-size:1.4em&quot;&gt;)&lt;/span&gt;&lt;sup&gt;&lt;i&gt;t&lt;/i&gt;&lt;/sup&gt; + &lt;i&gt;b̄&lt;/i&gt;&lt;/div&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;(b&lt;sub&gt;0&lt;/sub&gt; − b̄)&lt;/h4&gt;Distance of the initial value from the steady state.&lt;/div&gt;
    &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;((1+r)/(1+g))&lt;sup&gt;t&lt;/sup&gt;&lt;/h4&gt;Evolution of the deviation: it dies out if the ratio is &amp;lt; 1 (g &amp;gt; r) and explodes if it is &amp;gt; 1 (r &amp;gt; g).&lt;/div&gt;
    &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;b̄&lt;/h4&gt;Steady state.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;This is exactly the curve drawn in the &quot;debt over time&quot; chart above.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What does the 45° line represent in the b&lt;sub&gt;t&lt;/sub&gt;–b&lt;sub&gt;t−1&lt;/sub&gt; diagram?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;All points where b&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt;, i.e. the possible steady-state equilibria. The actual equilibrium is where the debt line crosses it.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What does an increase in the primary deficit do to the line? And an increase in r?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;The primary deficit shifts the line upwards (a parallel shift, changing the intercept). An increase in r makes it steeper (a rotation, changing the slope (1+r)/(1+g)).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;With g &amp;lt; r and a primary surplus, when does debt fall?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Only if initial debt is &lt;em&gt;below&lt;/em&gt; the (unstable) equilibrium b̄ = a&lt;sup&gt;P&lt;/sup&gt;(1+g)/(r−g). Above b̄ it keeps growing regardless.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7 DATI ============ --&gt;
&lt;section id=&quot;dati&quot; class=&quot;part p-brick&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;07&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--brick)&quot;&gt;Theory put to the test of the numbers&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;Public debt in Italy and the Eurozone&lt;/span&gt;&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 33&lt;/span&gt; Data for Italy (source in the slides: Banca d&#x27;Italia Economic Bulletin and Istat). Values in % of GDP; &quot;b stationary&quot; is expressed as a ratio (1.31 = 131%). Years in which (1+r)/(1+g) &amp;gt; 1, i.e. &lt;strong&gt;unstable dynamics&lt;/strong&gt;, are shown in red.&lt;/p&gt;
  &lt;div class=&quot;tablewrap box&quot; style=&quot;padding:6px&quot;&gt;
  &lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Year&lt;/th&gt;&lt;th&gt;primary d&lt;/th&gt;&lt;th&gt;g&lt;/th&gt;&lt;th&gt;r&lt;/th&gt;&lt;th&gt;(1+r)/(1+g)&lt;/th&gt;&lt;th&gt;steady-state b&lt;/th&gt;&lt;th&gt;b&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody id=&quot;ita&quot;&gt;&lt;/tbody&gt;
  &lt;/table&gt;
  &lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;How to read the table&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;
      &lt;li&gt;The &quot;primary d&quot; is &lt;strong&gt;negative&lt;/strong&gt; in almost every year: Italy runs a &lt;strong&gt;primary surplus&lt;/strong&gt; (except in 2009).&lt;/li&gt;
      &lt;li&gt;But in 2008–2014 real growth g is low or negative, so r &amp;gt; g: we are in &lt;strong&gt;case 4&lt;/strong&gt; (surplus, g &amp;lt; r). The equilibrium b̄ = d&lt;sup&gt;P&lt;/sup&gt;/(g−r) is positive but, being &lt;em&gt;unstable&lt;/em&gt;, it matters only if debt lies below it: with b&lt;sub&gt;t&lt;/sub&gt; &amp;gt; b̄ (e.g. 2012: b = 126.9% against b̄ ≈ 106%) debt &lt;strong&gt;rises&lt;/strong&gt;, as indeed it does (106 → 132).&lt;/li&gt;
      &lt;li&gt;In 2015–16 g &amp;gt; r: we are in &lt;strong&gt;case 2&lt;/strong&gt; (surplus, g &amp;gt; r). The equilibrium is negative and stable: debt stops growing and slowly tends to fall.&lt;/li&gt;
      &lt;li&gt;2011: g − r ≈ −0.2 points, very close to zero → a huge b̄ (4.79 = 479%): with r ≈ g even a small surplus stabilises &quot;almost&quot; any level.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slides 34–35&lt;/span&gt; A course Excel spreadsheet (&quot;excel file on debt dynamics&quot;) projects Italian debt over 30 years with g, r and d&lt;sup&gt;P&lt;/sup&gt; fixed at their 1990, 2000, 2008 and 2012 values: with the 1990 data debt explodes beyond 330%, with the 2012 data it reaches about 250%, with the 2008 data about 180%; only with the 2000 data (a large primary surplus and g &amp;gt; r) does it fall towards 90%. &lt;span class=&quot;src&quot;&gt;The Excel file is not in the folder I was able to read: the figures are read off the chart on slide 35.&lt;/span&gt;&lt;/p&gt;

  &lt;h3&gt;The time series (1980–2024)&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slides 37–40&lt;/span&gt; For Germany, Italy, France, Ireland, Spain, Portugal, Greece and the Eurozone, the slides show four series (based on Banca d&#x27;Italia data). Vertical lines: 1999 (euro), 2009 (financial crisis), 2020 (pandemic). Below, the debt-to-GDP ratio is redrawn &lt;strong&gt;by hand and approximately&lt;/strong&gt; for four series: toggle the lines on and off.&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;div id=&quot;dc-tg&quot; style=&quot;margin-bottom:6px&quot;&gt;&lt;/div&gt;
    &lt;svg id=&quot;dc&quot; viewBox=&quot;0 0 640 300&quot; aria-label=&quot;Debt/GDP 1980-2024, approximate values&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Values estimated by eye from the chart on slide 37: useful for the shape, not for the exact figures.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Debt/GDP&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Deficit/GDP&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Interest/GDP&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Primary balance/GDP&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;Italy above 100% from the early 1990s, peaking at ~155% in 2020; Greece above 200% in 2020; Ireland and Spain jump after 2008 (bank bailouts); Germany and the area average remain much lower.&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;Italy and Greece with deficits of ~10% in the 1980s; all converge towards 3% around 1999 (effect of the criteria); Irish peak above 30% in 2010; another generalised jump in 2020.&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;Italian interest expenditure reaches ~12% of GDP in 1993 and drops towards 6% by 1999: this is the interest rate convergence of &lt;a href=&quot;#tassi&quot;&gt;section 4&lt;/a&gt; translating into budgetary savings.&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;Italy has run almost uninterrupted primary surpluses from the early 1990s until 2019: its problem is not the primary deficit but the snowball effect (r − g).&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;De facto fiscal space&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slides 41–42&lt;/span&gt; &lt;span class=&quot;term&quot;&gt;Fiscal space&lt;/span&gt; is linked to &lt;span class=&quot;term&quot;&gt;fiscal sustainability&lt;/span&gt;, and is defined by Heller (2005) as &quot;room in a government&#x27;s budget that allows it to provide resources for a desired purpose without jeopardizing the sustainability of its financial position or the stability of the economy&quot;. One of its measures, used by Aizenman et al. (2013):&lt;/p&gt;
  &lt;div class=&quot;f&quot;&gt;&lt;i&gt;de facto&lt;/i&gt; fiscal space = &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;public debt&lt;/span&gt;&lt;span&gt;tax base&lt;/span&gt;&lt;/span&gt; &amp;nbsp;&amp;nbsp;with tax base = 5-year moving average of (total revenue / GDP)&lt;/div&gt;
  &lt;p&gt;The higher it is, the &lt;strong&gt;weaker&lt;/strong&gt; the fiscal space: it indicates how many &quot;years of revenue&quot; would be needed to repay the debt. In the slides: Greece above 4 in 2011, Italy ~3.3 in 2020, euro area ~2, Germany ~1.3–1.5. &lt;span class=&quot;term&quot;&gt;Fiscal pressure&lt;/span&gt; (revenue/GDP) shows France above 50%, Italy and the EMU average around 46–47%, and Ireland below 30% (recent data).&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Italy almost always runs a primary surplus: why did its debt rise between 2008 and 2014?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Because r &amp;gt; g (negative or near-zero growth): the snowball effect b(r−g)/(1+g) exceeded the primary surplus.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why does fiscal space use revenue rather than just GDP in the denominator?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Because debt is repaid out of tax revenue: two countries with the same debt-to-GDP ratio but different revenue-raising capacity have different degrees of sustainability.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 8 FASE FINALE ============ --&gt;
&lt;section id=&quot;fase-finale&quot; class=&quot;part p-brick&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;08&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--brick)&quot;&gt;Back to Maastricht&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;The final stage: conversion rates, ins and outs, ERM II&lt;/span&gt;&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 43&lt;/span&gt; Irrevocable conversion rates of the national currencies (units of currency per 1 euro). Use the converter:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tablewrap box&quot; style=&quot;padding:6px&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Currency&lt;/th&gt;&lt;th&gt;per €1&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;conv&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;box tint&quot;&gt;
      &lt;h4&gt;Converter&lt;/h4&gt;
      &lt;div class=&quot;ctrl&quot; style=&quot;grid-template-columns:1fr&quot;&gt;&lt;select id=&quot;cv-c&quot; style=&quot;font:inherit;padding:4px&quot;&gt;&lt;/select&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cv-e&quot;&gt;Euro&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cv-e&quot; min=&quot;1&quot; max=&quot;500&quot; step=&quot;1&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;cv-e-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;cv-out&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;tag int&quot;&gt;supplement&lt;/span&gt; 6 significant figures by law; the German mark and the Bulgarian lev share the value 1.95583 because the lev was pegged to the mark.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Relations between &quot;ins&quot; and &quot;outs&quot;&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slides 44–45&lt;/span&gt; Principles agreed at the June 1996 &lt;span class=&quot;term&quot;&gt;ECOFIN&lt;/span&gt; (Economic and Financial Affairs Council) for EU countries outside the euro (the &lt;em&gt;outs&lt;/em&gt;):&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;ul&gt;
      &lt;li&gt;From 1 January 1999 &lt;strong&gt;ERM II&lt;/strong&gt; replaces the old ERM.&lt;/li&gt;
      &lt;li&gt;Participation is &lt;strong&gt;voluntary&lt;/strong&gt;; procedures are agreed between the ECB and the central banks of the outs.&lt;/li&gt;
      &lt;li&gt;Central parities with fluctuation margins of &lt;strong&gt;±15%&lt;/strong&gt; (narrower bands are possible).&lt;/li&gt;
      &lt;li&gt;The &lt;strong&gt;anchor&lt;/strong&gt; of the system is the euro.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;ul&gt;
      &lt;li&gt;At the margins of the band, &lt;strong&gt;intervention&lt;/strong&gt; (buying/selling currency) is mandatory…&lt;/li&gt;
      &lt;li&gt;…unless it conflicts with price stability in the Eurozone or in the non-euro country.&lt;/li&gt;
      &lt;li&gt;The ECB can initiate a procedure to &lt;strong&gt;change the central parities&lt;/strong&gt;.&lt;/li&gt;
      &lt;li&gt;Although voluntary, ERM II is &lt;strong&gt;a convergence criterion&lt;/strong&gt;: at least 2 years without severe tensions and without devaluing on the country&#x27;s own initiative.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
  &lt;h3 id=&quot;erm2&quot;&gt;ERM II today&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 46&lt;/span&gt;&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 700 200&quot; aria-label=&quot;ERM II paths&quot;&gt;
      &lt;g font-size=&quot;12&quot;&gt;
        &lt;text x=&quot;10&quot; y=&quot;40&quot; font-weight=&quot;600&quot;&gt;Denmark&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;28&quot; width=&quot;560&quot; height=&quot;16&quot; rx=&quot;8&quot; style=&quot;fill:var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;126&quot; y=&quot;40&quot; font-size=&quot;10&quot;&gt;ERM II since 1/1/1999 · parity 7.46038 · band ±2.25% (opt-out: no euro)&lt;/text&gt;
        &lt;text x=&quot;10&quot; y=&quot;90&quot; font-weight=&quot;600&quot;&gt;Croatia&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;78&quot; width=&quot;220&quot; height=&quot;16&quot; rx=&quot;8&quot; style=&quot;fill:var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;rect x=&quot;340&quot; y=&quot;78&quot; width=&quot;340&quot; height=&quot;16&quot; rx=&quot;8&quot; style=&quot;fill:var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;126&quot; y=&quot;90&quot; font-size=&quot;10&quot;&gt;ERM II 10/7/2020&lt;/text&gt;&lt;text x=&quot;346&quot; y=&quot;90&quot; font-size=&quot;10&quot;&gt;euro since 1/1/2023&lt;/text&gt;
        &lt;text x=&quot;10&quot; y=&quot;140&quot; font-weight=&quot;600&quot;&gt;Bulgaria&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;128&quot; width=&quot;400&quot; height=&quot;16&quot; rx=&quot;8&quot; style=&quot;fill:var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;rect x=&quot;520&quot; y=&quot;128&quot; width=&quot;160&quot; height=&quot;16&quot; rx=&quot;8&quot; style=&quot;fill:var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;126&quot; y=&quot;140&quot; font-size=&quot;10&quot;&gt;ERM II 10/7/2020 · parity 1.95583&lt;/text&gt;&lt;text x=&quot;526&quot; y=&quot;140&quot; font-size=&quot;10&quot;&gt;euro since 1/1/2026&lt;/text&gt;
        &lt;text x=&quot;10&quot; y=&quot;185&quot; font-weight=&quot;600&quot;&gt;Sweden&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;185&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;does not participate in ERM II (so it does not meet the exchange rate criterion)&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Bars not drawn to an exact time scale. &lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt; The ECB Convergence Report of June 2026 counts 21 euro-area countries and assesses Czechia, Hungary, Poland, Romania and Sweden.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-assessment&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Is participation in ERM II mandatory?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;No, it is voluntary; but any country wishing to adopt the euro must participate for at least two years without severe tensions or devaluations on its own initiative.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;When can the obligation to intervene at the margins be lifted?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show answer&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;When intervention would conflict with the objective of price stability in the Eurozone or in the non-euro country.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 9 ESERCIZI ============ --&gt;
&lt;section id=&quot;esercizi&quot; class=&quot;part p-sage&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;09&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--sage)&quot;&gt;Practice&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;Exercises on debt dynamics&lt;/span&gt;&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slides 47–49&lt;/span&gt; The exercises from the slides, with an outline solution &lt;span class=&quot;tag int&quot;&gt;supplement&lt;/span&gt; to compare with the lecturer&#x27;s.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
  &lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;
    &lt;svg viewBox=&quot;0 0 300 260&quot;&gt;&lt;line x1=&quot;20&quot; y1=&quot;180&quot; x2=&quot;290&quot; y2=&quot;180&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;line x1=&quot;70&quot; y1=&quot;250&quot; x2=&quot;70&quot; y2=&quot;10&quot; stroke=&quot;var(--ink)&quot;/&gt;
    &lt;line x1=&quot;20&quot; y1=&quot;230&quot; x2=&quot;250&quot; y2=&quot;0&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
    &lt;line x1=&quot;30&quot; y1=&quot;250&quot; x2=&quot;150&quot; y2=&quot;20&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;3&quot;/&gt;
    &lt;line x1=&quot;82&quot; y1=&quot;176&quot; x2=&quot;82&quot; y2=&quot;186&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;84&quot; y=&quot;198&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot;&gt;b0&lt;/text&gt;
    &lt;text x=&quot;290&quot; y=&quot;198&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot;&gt;bt-1&lt;/text&gt;&lt;text x=&quot;76&quot; y=&quot;20&quot; font-size=&quot;11&quot;&gt;bt&lt;/text&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Redrawing of slide 47 (steep line = slope &amp;gt; 1; dashed = 45°).&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div&gt;
    &lt;div class=&quot;q box&quot;&gt;&lt;p&gt;&lt;strong&gt;Ex. 1.&lt;/strong&gt; How does the debt-to-GDP ratio evolve over the next two years if r and g remain constant? What can the government do?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show solution&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;The line has slope &amp;gt; 1 (r &amp;gt; g) and a positive intercept (primary deficit): this is &lt;strong&gt;case 3&lt;/strong&gt;. The equilibrium lies in the negative quadrant and is unstable; b&lt;sub&gt;0&lt;/sub&gt; lies above it, so debt &lt;strong&gt;rises&lt;/strong&gt; in years 1 and 2, and at an increasing pace (the distance from the 45° line grows). The government can: (a) switch to a &lt;strong&gt;primary surplus&lt;/strong&gt; large enough to lower the line until the equilibrium exceeds b&lt;sub&gt;0&lt;/sub&gt;, i.e. a&lt;sup&gt;P&lt;/sup&gt; &amp;gt; b&lt;sub&gt;0&lt;/sub&gt;(r−g)/(1+g); (b) act on &lt;strong&gt;r&lt;/strong&gt; (credibility, lower risk premia) and on &lt;strong&gt;g&lt;/strong&gt; (growth-enhancing reforms) to rotate the line until its slope is &amp;lt; 1.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;q box&quot;&gt;&lt;p&gt;&lt;strong&gt;Ex. 2.&lt;/strong&gt; Show graphically that with g &amp;gt; r the dynamics converge to a stable equilibrium.&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show solution&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;With g &amp;gt; r the slope (1+r)/(1+g) is &amp;lt; 1: the line crosses the 45° line &quot;from above&quot;. To the left of the intersection the line lies above the 45° line (b&lt;sub&gt;t&lt;/sub&gt; &amp;gt; b&lt;sub&gt;t−1&lt;/sub&gt;: debt rises), to the right it lies below (debt falls): in both cases the cobweb leads towards b̄. Algebraically, in the solution b&lt;sub&gt;t&lt;/sub&gt; = (b&lt;sub&gt;0&lt;/sub&gt;−b̄)((1+r)/(1+g))&lt;sup&gt;t&lt;/sup&gt; + b̄ the power term tends to 0. Try cases 1 and 2 in the &lt;a href=&quot;#dinamica&quot;&gt;simulator&lt;/a&gt;.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;q box&quot;&gt;&lt;p&gt;&lt;strong&gt;Ex. 3.&lt;/strong&gt; With r &amp;gt; g, under what conditions does a reduction in the deficit-to-GDP ratio reduce the debt-to-GDP ratio?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Show solution&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;From Δb&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt;(r−g)/(1+g) − a&lt;sup&gt;P&lt;/sup&gt;: debt falls only if the &lt;strong&gt;primary surplus exceeds the snowball effect&lt;/strong&gt;, a&lt;sup&gt;P&lt;/sup&gt; &amp;gt; b&lt;sub&gt;t−1&lt;/sub&gt;(r−g)/(1+g). Graphically, the deficit reduction must lower the line enough to bring the (unstable) equilibrium &lt;em&gt;above&lt;/em&gt; current debt: only then are we on the segment where debt declines. An insufficient deficit reduction slows the growth of debt but does not reverse it. Caution (beyond the slides): if the fiscal adjustment depresses g, the snowball effect increases and part of the effort is cancelled out.&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ APPROFONDIRE ============ --&gt;
&lt;section id=&quot;approfondire&quot; class=&quot;part&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;External sources&lt;/div&gt;
  &lt;h2&gt;Further reading&lt;/h2&gt;
  &lt;p&gt;Works, legal provisions and websites cited in the slides (or directly underlying what they cite). Everything below is an &lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;, verified through a web search: open the link for the original text.&lt;/p&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Delors Committee, &lt;em&gt;Report on economic and monetary union in the European Community&lt;/em&gt; (12 April 1989)&lt;/h4&gt;&lt;p&gt;Report of the committee chaired by Jacques Delors (together with the central bank governors). It proposes a three-stage path to EMU, with a European system of central banks and a single currency. Endorsed by the Madrid European Council (June 1989).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the &quot;blueprint&quot; of the Treaty cited on slide 2; the approach based on stages and convergence comes from here.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.cvce.eu/obj/en-725f74fb-841b-4452-a428-39e7a703f35f&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Text on CVCE.eu&lt;/a&gt; · &lt;a href=&quot;https://www.ecb.europa.eu/ecb/access_to_documents/archives/delors/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Delors Committee archive (ECB)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Treaty on European Union (Maastricht), signed on 7 February 1992, in force since 1 November 1993&lt;/h4&gt;&lt;p&gt;Establishes the European Union and the provisions on EMU. Ratification was contested (Danish &quot;no&quot; referendum in June 1992, narrow French &quot;yes&quot; in September).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the subject of the lecture; the Art. 104c provisions cited in the slides follow the original numbering.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/summary/SR/xy0026&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Summary on EUR-Lex&lt;/a&gt; · &lt;a href=&quot;https://www.cvce.eu/de/collections/unit-content/-/unit/en/d5906df5-4f83-4603-85f7-0cabc24b9fe1/e038b310-f139-407f-9bfb-a1b2e901fb56/Resources&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CVCE dossier&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Art. 140 TFEU and Protocol No. 13 on the convergence criteria&lt;/h4&gt;&lt;p&gt;Current version of the criteria: price stability, budgetary position (no excessive deficit procedure under Art. 126(6)), participation in the ERM, long-term interest rates over a one-year observation period. The Commission and the ECB report at least once every two years.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: this is where the five criteria of slides 5–6 &quot;live&quot; today.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/art_140/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Art. 140 TFEU&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/pro_13/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Protocol No. 13&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Arts. 123 and 125 TFEU: prohibition of monetary financing and the no-bailout clause&lt;/h4&gt;&lt;p&gt;Art. 123 prohibits the ECB and national central banks from directly financing governments; Art. 125 rules out the Union or member states being liable for the commitments of another state. Interpreted by the Court of Justice in the &lt;em&gt;Pringle&lt;/em&gt; (C-370/12, on the ESM) and &lt;em&gt;Gauweiler&lt;/em&gt; (C-62/14, on OMT) judgments.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: these are the two &quot;barriers&quot; cited on slides 15–16 (no monetisation, no bailout) and the focus of the debate on their credibility.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/art_123/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Art. 123 TFEU&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2012/art_125/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Art. 125 TFEU&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Robert J. Barro and David B. Gordon, &quot;Rules, Discretion and Reputation in a Model of Monetary Policy&quot;, &lt;em&gt;Journal of Monetary Economics&lt;/em&gt; 12(1), 1983, pp. 101–121&lt;/h4&gt;&lt;p&gt;Shows that a discretionary policymaker generates inflation without being able to systematically surprise the public, and that binding rules (or reputation) can improve the outcome.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the model on which slides 7–9 base the inflation criterion and the demand for an independent ECB.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.nber.org/papers/w1079&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER Working Paper 1079&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Peter S. Heller, &quot;Understanding Fiscal Space&quot;, IMF Policy Discussion Paper PDP/05/4, March 2005&lt;/h4&gt;&lt;p&gt;Defines fiscal space and its link with fiscal sustainability, and discusses how to create it (originally in the context of aid to low-income countries).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it provides the definition cited on slide 41.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://econpapers.repec.org/RePEc:imf:imfpdp:05/4&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers entry (with link to the IMF PDF)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Aizenman, Hutchison and Jinjarak, &quot;What is the risk of European sovereign debt defaults? Fiscal space, CDS spreads and market pricing of risk&quot;, &lt;em&gt;Journal of International Money and Finance&lt;/em&gt; 34, 2013, pp. 37–59&lt;/h4&gt;&lt;p&gt;Estimates the pricing of sovereign risk (CDS) for around fifty countries over 2005–10 as a function of fiscal space (debt/revenue, deficit/revenue) and other fundamentals, with a focus on the Eurozone periphery.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is very probably the &quot;Aizenman et al. (2013)&quot; of slide 41 that uses debt/tax base as a measure of fiscal space (the exact identification of the paper should be checked with the lecturer).&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.nber.org/papers/w17407&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER version (w17407)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Banca d&#x27;Italia, &lt;em&gt;Public finance statistics in the European Union countries&lt;/em&gt; (Statistiche di finanza pubblica nei paesi dell&#x27;Unione europea)&lt;/h4&gt;&lt;p&gt;Semi-annual publication (June and December) with net borrowing, debt and the main general government account items for EU and G7 countries; tables also available in the BDS database.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the source of the charts on slides 37–42 and of the link on slide 36 (edition of 13/12/2022).&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.bancaditalia.it/pubblicazioni/finanza-pubblica-ue/2022-finanza-pubblica-ue/statistiche_FPE_13122022.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Edition of 13/12/2022 (link from the slide)&lt;/a&gt; · &lt;a href=&quot;https://www.bancaditalia.it/pubblicazioni/finanza-pubblica-ue/index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;All editions&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;ECB, ERM II — Exchange Rate Mechanism&lt;/h4&gt;&lt;p&gt;Describes the mechanism: central parity against the euro, standard ±15% band, intervention rates; the Danish krone has participated since 1999 with a parity of 7.46038.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it updates slides 44–46 on how the mechanism works and who participates.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ecb.europa.eu/ecb/tasks/forex/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB page&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;ECB, &lt;em&gt;Convergence Report&lt;/em&gt;, June 2026&lt;/h4&gt;&lt;p&gt;Assesses the EU countries outside the euro (Czechia, Hungary, Poland, Romania, Sweden) against the Treaty criteria, applied strictly to actual data and with attention to sustainability; it reports on Bulgaria&#x27;s accession (21st member, 1/1/2026).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it shows how the Maastricht criteria are applied today.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ecb.europa.eu/press/other-publications/convergence/pdf/ecb.cr202606~30e75ae1c2.en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Report PDF&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Paul De Grauwe, &lt;em&gt;Economics of Monetary Union&lt;/em&gt;, Oxford University Press&lt;/h4&gt;&lt;p&gt;Standard textbook on monetary union: costs and benefits, optimum currency area theory, the ECB, fiscal policies. The latest edition I was able to confirm is the 12th (2018).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: &quot;Table 6.1&quot; on slide 43 and the approach of slides 4–12 (Germany/Italy inflation bias, rationale for the criteria) closely follow this text. This attribution is mine and is not stated in the slides: check it against the course syllabus.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://econpapers.repec.org/RePEc:oxp:obooks:9780198739876&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers entry (11th ed.)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;footer&gt;Summary written by Claude from the slides: always check against the material.&lt;/footer&gt;
&lt;/main&gt;

    function show(){steps.forEach(function(x,j){x.hidden=j!==i;});prev.disabled=i===0;next.disabled=i===steps.length-1;cnt.textContent=(i+1)+&#x27; / &#x27;+steps.length;
      if(svg)svg.querySelectorAll(&#x27;[data-show]&#x27;).forEach(function(g){g.style.display=g.getAttribute(&#x27;data-show&#x27;).split(&#x27; &#x27;).indexOf(String(i))&gt;=0?&#x27;&#x27;:&#x27;none&#x27;;});}
    prev.addEventListener(&#x27;click&#x27;,function(){if(i&gt;0){i--;show();}});
    next.addEventListener(&#x27;click&#x27;,function(){if(i&lt;steps.length-1){i++;show();}});
    show();
  });
  function $(id){return document.getElementById(id);}
  function fmt(x,d){return (Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d).replace(&#x27;.&#x27;,&#x27;,&#x27;);}
  // Criteria checker
  if($(&#x27;checker&#x27;)){
    var ids=[&#x27;ck-pi&#x27;,&#x27;ck-i&#x27;,&#x27;ck-d&#x27;,&#x27;ck-b&#x27;,&#x27;ck-dfall&#x27;,&#x27;ck-bfall&#x27;,&#x27;ck-erm&#x27;];
    function ck(){
      var pi=+$(&#x27;ck-pi&#x27;).value,i=+$(&#x27;ck-i&#x27;).value,d=+$(&#x27;ck-d&#x27;).value,b=+$(&#x27;ck-b&#x27;).value;
      $(&#x27;ck-pi-o&#x27;).textContent=fmt(pi,1)+&#x27;%&#x27;;$(&#x27;ck-i-o&#x27;).textContent=fmt(i,1)+&#x27;%&#x27;;$(&#x27;ck-d-o&#x27;).textContent=fmt(d,1)+&#x27;%&#x27;;$(&#x27;ck-b-o&#x27;).textContent=b+&#x27;%&#x27;;
      var r=[];
      r.push([&#x27;Inflation ≤ 2.8%&#x27;,pi&lt;=2.8]);
