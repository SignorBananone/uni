  &lt;h3&gt;Lo sforzo per stabilizzare: lo snowball effect&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 31&lt;/span&gt; Sottraendo b&lt;sub&gt;t−1&lt;/sub&gt; da entrambi i lati:&lt;/p&gt;
  &lt;div class=&quot;f&quot;&gt;(**) &amp;nbsp; Δ&lt;i&gt;b&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;span style=&quot;background:var(--brick-bg);padding:2px 6px;border-radius:6px&quot;&gt;&lt;i&gt;b&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;&lt;i&gt;r&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; − &lt;i&gt;g&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;1 + &lt;i&gt;g&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt; − &lt;i&gt;a&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;&lt;/div&gt;
  &lt;p&gt;Il termine evidenziato è l&#x27;&lt;dfn&gt;effetto valanga&lt;/dfn&gt; (&lt;span class=&quot;term&quot;&gt;snowball effect&lt;/span&gt;): se r &amp;gt; g il debito cresce &quot;da solo&quot;, e tanto più quanto più è alto. Perché il debito/PIL smetta di crescere (Δb ≤ 0) serve un avanzo primario&lt;/p&gt;
  &lt;div class=&quot;f&quot;&gt;&lt;i&gt;a&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt; ≥ &lt;i&gt;b&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;&lt;i&gt;r&lt;/i&gt; − &lt;i&gt;g&lt;/i&gt;&lt;/span&gt;&lt;span&gt;1 + &lt;i&gt;g&lt;/i&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Con r &amp;gt; g, l&#x27;avanzo necessario è &lt;strong&gt;relativamente alto&lt;/strong&gt;, e cresce col livello del debito. (Esempio: b = 130%, r − g = 2 punti → serve circa 2,5% di PIL di avanzo primario ogni anno.)&lt;/p&gt;

  &lt;h3&gt;La soluzione dell&#x27;equazione alle differenze&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 32&lt;/span&gt; Se g, r e d&lt;sup&gt;P&lt;/sup&gt; sono costanti:&lt;/p&gt;
  &lt;div class=&quot;f&quot;&gt;&lt;i&gt;b&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = (&lt;i&gt;b&lt;/i&gt;&lt;sub&gt;0&lt;/sub&gt; − &lt;i&gt;b̄&lt;/i&gt;) · &lt;span style=&quot;font-size:1.4em&quot;&gt;(&lt;/span&gt;&lt;span class=&quot;fr&quot;&gt;&lt;span&gt;1 + &lt;i&gt;r&lt;/i&gt;&lt;/span&gt;&lt;span&gt;1 + &lt;i&gt;g&lt;/i&gt;&lt;/span&gt;&lt;/span&gt;&lt;span style=&quot;font-size:1.4em&quot;&gt;)&lt;/span&gt;&lt;sup&gt;&lt;i&gt;t&lt;/i&gt;&lt;/sup&gt; + &lt;i&gt;b̄&lt;/i&gt;&lt;/div&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;(b&lt;sub&gt;0&lt;/sub&gt; − b̄)&lt;/h4&gt;Distanza del valore iniziale dallo stato stazionario.&lt;/div&gt;
    &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;((1+r)/(1+g))&lt;sup&gt;t&lt;/sup&gt;&lt;/h4&gt;Evoluzione della deviazione: si smorza se il rapporto è &amp;lt; 1 (g &amp;gt; r), esplode se è &amp;gt; 1 (r &amp;gt; g).&lt;/div&gt;
    &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;b̄&lt;/h4&gt;Stato stazionario.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;È esattamente la curva disegnata nel grafico &quot;debito nel tempo&quot; qui sopra.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Cosa rappresenta la bisettrice nel diagramma b&lt;sub&gt;t&lt;/sub&gt;–b&lt;sub&gt;t−1&lt;/sub&gt;?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Tutti i punti in cui b&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt;, cioè i possibili equilibri stazionari. L&#x27;equilibrio effettivo è dove la retta del debito la incrocia.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Un aumento del disavanzo primario cosa fa alla retta? E un aumento di r?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Il disavanzo primario sposta la retta in alto (traslazione, cambia l&#x27;intercetta). Un aumento di r la rende più ripida (rotazione, cambia la pendenza (1+r)/(1+g)).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Con g &amp;lt; r e avanzo primario, quando il debito scende?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Solo se il debito iniziale è &lt;em&gt;sotto&lt;/em&gt; l&#x27;equilibrio (instabile) b̄ = a&lt;sup&gt;P&lt;/sup&gt;(1+g)/(r−g). Sopra b̄ cresce comunque.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7 DATI ============ --&gt;
&lt;section id=&quot;dati&quot; class=&quot;part p-brick&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;07&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--brick)&quot;&gt;Teoria alla prova dei numeri&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;Debito pubblico in Italia e nell&#x27;Eurozona&lt;/span&gt;&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 33&lt;/span&gt; Dati per l&#x27;Italia (fonte nelle slide: Bollettino economico Banca d&#x27;Italia e Istat). Valori in % del PIL; &quot;b stationary&quot; è espresso come rapporto (1,31 = 131%). In rosso gli anni in cui (1+r)/(1+g) &amp;gt; 1, cioè &lt;strong&gt;dinamica instabile&lt;/strong&gt;.&lt;/p&gt;
  &lt;div class=&quot;tablewrap box&quot; style=&quot;padding:6px&quot;&gt;
  &lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Anno&lt;/th&gt;&lt;th&gt;d primario&lt;/th&gt;&lt;th&gt;g&lt;/th&gt;&lt;th&gt;r&lt;/th&gt;&lt;th&gt;(1+r)/(1+g)&lt;/th&gt;&lt;th&gt;b stazionario&lt;/th&gt;&lt;th&gt;b&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody id=&quot;ita&quot;&gt;&lt;/tbody&gt;
  &lt;/table&gt;
  &lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;Come si legge la tabella&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;
      &lt;li&gt;Il &quot;d primario&quot; è &lt;strong&gt;negativo&lt;/strong&gt; in quasi tutti gli anni: l&#x27;Italia ha un &lt;strong&gt;avanzo primario&lt;/strong&gt; (eccetto 2009).&lt;/li&gt;
      &lt;li&gt;Ma nel 2008–2014 la crescita reale g è bassa o negativa, quindi r &amp;gt; g: siamo nel &lt;strong&gt;caso 4&lt;/strong&gt; (surplus, g &amp;lt; r). L&#x27;equilibrio b̄ = d&lt;sup&gt;P&lt;/sup&gt;/(g−r) è positivo ma, essendo &lt;em&gt;instabile&lt;/em&gt;, conta solo se il debito sta sotto: con b&lt;sub&gt;t&lt;/sub&gt; &amp;gt; b̄ (es. 2012: b = 126,9% contro b̄ ≈ 106%) il debito &lt;strong&gt;sale&lt;/strong&gt;, come infatti accade (106 → 132).&lt;/li&gt;
      &lt;li&gt;Nel 2015–16 g &amp;gt; r: siamo nel &lt;strong&gt;caso 2&lt;/strong&gt; (surplus, g &amp;gt; r). L&#x27;equilibrio è negativo e stabile: il debito smette di crescere e tende lentamente a scendere.&lt;/li&gt;
      &lt;li&gt;2011: g − r ≈ −0,2 punti, molto vicino a zero → b̄ enorme (4,79 = 479%): con r ≈ g anche un piccolo avanzo stabilizza &quot;quasi&quot; qualunque livello.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 34–35&lt;/span&gt; Un foglio Excel del corso (&quot;excel file on debt dynamics&quot;) proietta il debito italiano per 30 anni con g, r e d&lt;sup&gt;P&lt;/sup&gt; fissi ai valori del 1990, 2000, 2008 e 2012: con i dati del 1990 il debito esplode oltre il 330%, con quelli del 2012 arriva a circa 250%, con quelli del 2008 a circa 180%; solo con quelli del 2000 (avanzo primario elevato e g &amp;gt; r) scende verso il 90%. &lt;span class=&quot;src&quot;&gt;Il file Excel non è nella cartella che ho potuto leggere: i numeri sono letti dal grafico della slide 35.&lt;/span&gt;&lt;/p&gt;

  &lt;h3&gt;Le serie storiche (1980–2024)&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 37–40&lt;/span&gt; Le slide mostrano, per Germania, Italia, Francia, Irlanda, Spagna, Portogallo, Grecia ed Eurozona, quattro serie (elaborazione su dati BdI). Linee verticali: 1999 (euro), 2009 (crisi finanziaria), 2020 (pandemia). Qui sotto il debito/PIL ridisegnato &lt;strong&gt;a mano e in modo approssimato&lt;/strong&gt; per quattro serie: attiva/disattiva le linee.&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;div id=&quot;dc-tg&quot; style=&quot;margin-bottom:6px&quot;&gt;&lt;/div&gt;
    &lt;svg id=&quot;dc&quot; viewBox=&quot;0 0 640 300&quot; aria-label=&quot;Debito/PIL 1980-2024, valori approssimati&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Valori stimati a occhio dal grafico della slide 37: utili per la forma, non per le cifre esatte.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Debito/PIL&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Deficit/PIL&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Interessi/PIL&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Primario/PIL&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;Italia sopra il 100% dai primi anni &#x27;90, picco ~155% nel 2020; Grecia oltre 200% nel 2020; Irlanda e Spagna balzano dopo il 2008 (salvataggi bancari); Germania e media dell&#x27;area restano molto più basse.&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;Italia e Grecia con deficit ~10% negli anni &#x27;80; tutti convergono verso il 3% attorno al 1999 (effetto dei criteri); picco irlandese oltre il 30% nel 2010; nuovo salto generalizzato nel 2020.&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;La spesa per interessi italiana tocca ~12% del PIL nel 1993 e crolla verso il 6% al 1999: è la convergenza dei tassi della &lt;a href=&quot;#tassi&quot;&gt;sezione 4&lt;/a&gt; che si traduce in risparmi di bilancio.&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;L&#x27;Italia ha avanzi primari quasi ininterrotti dai primi anni &#x27;90 fino al 2019: il suo problema non è il disavanzo primario ma lo snowball effect (r − g).&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;De facto fiscal space&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 41–42&lt;/span&gt; Il &lt;span class=&quot;term&quot;&gt;fiscal space&lt;/span&gt; (spazio fiscale) è legato alla &lt;span class=&quot;term&quot;&gt;fiscal sustainability&lt;/span&gt;, definita da Heller (2005) come &quot;lo spazio nel bilancio di un governo che gli permette di fornire risorse per uno scopo desiderato senza compromettere la sostenibilità della sua posizione finanziaria o la stabilità dell&#x27;economia&quot;. Una delle sue misure, usata da Aizenman et al. (2013):&lt;/p&gt;
  &lt;div class=&quot;f&quot;&gt;&lt;i&gt;de facto&lt;/i&gt; fiscal space = &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;debito pubblico&lt;/span&gt;&lt;span&gt;tax base&lt;/span&gt;&lt;/span&gt; &amp;nbsp;&amp;nbsp;con tax base = media mobile a 5 anni di (entrate totali / PIL)&lt;/div&gt;
  &lt;p&gt;Più è alto, più lo spazio fiscale è &lt;strong&gt;debole&lt;/strong&gt;: indica quanti &quot;anni di entrate&quot; servirebbero a ripagare il debito. Nelle slide: Grecia oltre 4 nel 2011, Italia ~3,3 nel 2020, area euro ~2, Germania ~1,3–1,5. La &lt;span class=&quot;term&quot;&gt;fiscal pressure&lt;/span&gt; (entrate/PIL) mostra la Francia oltre il 50%, Italia e media UME attorno al 46–47%, l&#x27;Irlanda sotto il 30% (dati recenti).&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;L&#x27;Italia ha quasi sempre avanzo primario: perché il debito è salito fra 2008 e 2014?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Perché r &amp;gt; g (crescita negativa o quasi nulla): lo snowball effect b(r−g)/(1+g) superava l&#x27;avanzo primario.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché il fiscal space usa le entrate e non solo il PIL al denominatore?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Perché il debito si ripaga con le entrate fiscali: due Paesi con lo stesso debito/PIL ma diversa capacità di prelievo hanno diversa sostenibilità.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 8 FASE FINALE ============ --&gt;
&lt;section id=&quot;fase-finale&quot; class=&quot;part p-brick&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;08&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--brick)&quot;&gt;Ritorno a Maastricht&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;La fase finale: tassi di conversione, ins e outs, ERM II&lt;/span&gt;&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 43&lt;/span&gt; Tassi di conversione irrevocabili delle valute nazionali (unità di valuta per 1 euro). Usa il convertitore:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tablewrap box&quot; style=&quot;padding:6px&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Valuta&lt;/th&gt;&lt;th&gt;per 1 €&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;conv&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;box tint&quot;&gt;
      &lt;h4&gt;Convertitore&lt;/h4&gt;
      &lt;div class=&quot;ctrl&quot; style=&quot;grid-template-columns:1fr&quot;&gt;&lt;select id=&quot;cv-c&quot; style=&quot;font:inherit;padding:4px&quot;&gt;&lt;/select&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;cv-e&quot;&gt;Euro&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;cv-e&quot; min=&quot;1&quot; max=&quot;500&quot; step=&quot;1&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;cv-e-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;cv-out&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt; 6 decimali significativi per legge; marco tedesco e lev bulgaro condividono il valore 1,95583 perché il lev era agganciato al marco.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Relazioni fra &quot;ins&quot; e &quot;outs&quot;&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 44–45&lt;/span&gt; Principi decisi all&#x27;&lt;span class=&quot;term&quot;&gt;ECOFIN&lt;/span&gt; (Consiglio dei ministri economici e finanziari) del giugno 1996 per i Paesi UE fuori dall&#x27;euro (&lt;em&gt;outs&lt;/em&gt;):&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;ul&gt;
      &lt;li&gt;Dal 1 gennaio 1999 l&#x27;&lt;strong&gt;ERM II&lt;/strong&gt; sostituisce il vecchio ERM.&lt;/li&gt;
      &lt;li&gt;L&#x27;adesione è &lt;strong&gt;volontaria&lt;/strong&gt;; le procedure sono concordate fra BCE e banche centrali degli outs.&lt;/li&gt;
      &lt;li&gt;Parità centrali con margini di &lt;strong&gt;±15%&lt;/strong&gt; (possibili bande più strette).&lt;/li&gt;
      &lt;li&gt;L&#x27;&lt;strong&gt;ancora&lt;/strong&gt; del sistema è l&#x27;euro.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;ul&gt;
      &lt;li&gt;Ai margini della banda l&#x27;&lt;strong&gt;intervento&lt;/strong&gt; (comprare/vendere valuta) è obbligatorio…&lt;/li&gt;
      &lt;li&gt;…salvo che contrasti con la stabilità dei prezzi nell&#x27;Eurozona o nel Paese esterno.&lt;/li&gt;
      &lt;li&gt;La BCE può avviare una procedura per &lt;strong&gt;cambiare le parità centrali&lt;/strong&gt;.&lt;/li&gt;
      &lt;li&gt;Pur volontario, l&#x27;ERM II è &lt;strong&gt;un criterio di convergenza&lt;/strong&gt;: almeno 2 anni senza tensioni gravi e senza svalutare di propria iniziativa.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
  &lt;h3 id=&quot;erm2&quot;&gt;ERM II oggi&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 46&lt;/span&gt;&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 700 200&quot; aria-label=&quot;Percorsi ERM II&quot;&gt;
      &lt;g font-size=&quot;12&quot;&gt;
        &lt;text x=&quot;10&quot; y=&quot;40&quot; font-weight=&quot;600&quot;&gt;Danimarca&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;28&quot; width=&quot;560&quot; height=&quot;16&quot; rx=&quot;8&quot; style=&quot;fill:var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;126&quot; y=&quot;40&quot; font-size=&quot;10&quot;&gt;ERM II dal 1/1/1999 · parità 7,46038 · banda ±2,25% (opt-out: niente euro)&lt;/text&gt;
        &lt;text x=&quot;10&quot; y=&quot;90&quot; font-weight=&quot;600&quot;&gt;Croazia&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;78&quot; width=&quot;220&quot; height=&quot;16&quot; rx=&quot;8&quot; style=&quot;fill:var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;rect x=&quot;340&quot; y=&quot;78&quot; width=&quot;340&quot; height=&quot;16&quot; rx=&quot;8&quot; style=&quot;fill:var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;126&quot; y=&quot;90&quot; font-size=&quot;10&quot;&gt;ERM II 10/7/2020&lt;/text&gt;&lt;text x=&quot;346&quot; y=&quot;90&quot; font-size=&quot;10&quot;&gt;euro dal 1/1/2023&lt;/text&gt;
        &lt;text x=&quot;10&quot; y=&quot;140&quot; font-weight=&quot;600&quot;&gt;Bulgaria&lt;/text&gt;&lt;rect x=&quot;120&quot; y=&quot;128&quot; width=&quot;400&quot; height=&quot;16&quot; rx=&quot;8&quot; style=&quot;fill:var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;rect x=&quot;520&quot; y=&quot;128&quot; width=&quot;160&quot; height=&quot;16&quot; rx=&quot;8&quot; style=&quot;fill:var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;126&quot; y=&quot;140&quot; font-size=&quot;10&quot;&gt;ERM II 10/7/2020 · parità 1,95583&lt;/text&gt;&lt;text x=&quot;526&quot; y=&quot;140&quot; font-size=&quot;10&quot;&gt;euro dal 1/1/2026&lt;/text&gt;
        &lt;text x=&quot;10&quot; y=&quot;185&quot; font-weight=&quot;600&quot;&gt;Svezia&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;185&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;non aderisce all&#x27;ERM II (quindi non soddisfa il criterio di cambio)&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Barre non in scala temporale esatta. &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt; Il Convergence Report BCE di giugno 2026 conta 21 Paesi nell&#x27;euro e valuta Cechia, Ungheria, Polonia, Romania e Svezia.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;L&#x27;adesione all&#x27;ERM II è obbligatoria?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;No, è volontaria; ma chi vuole adottare l&#x27;euro deve parteciparvi per almeno due anni senza tensioni gravi né svalutazioni su propria iniziativa.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quando può venire meno l&#x27;obbligo di intervento ai margini?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Quando l&#x27;intervento contrasterebbe con l&#x27;obiettivo di stabilità dei prezzi nell&#x27;Eurozona o nel Paese esterno.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 9 ESERCIZI ============ --&gt;
&lt;section id=&quot;esercizi&quot; class=&quot;part p-sage&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;09&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--sage)&quot;&gt;Allenamento&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;Exercises on debt dynamics&lt;/span&gt;&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 47–49&lt;/span&gt; Gli esercizi delle slide, con una traccia di soluzione &lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt; da confrontare con quella del docente.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
  &lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;
    &lt;svg viewBox=&quot;0 0 300 260&quot;&gt;&lt;line x1=&quot;20&quot; y1=&quot;180&quot; x2=&quot;290&quot; y2=&quot;180&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;line x1=&quot;70&quot; y1=&quot;250&quot; x2=&quot;70&quot; y2=&quot;10&quot; stroke=&quot;var(--ink)&quot;/&gt;
    &lt;line x1=&quot;20&quot; y1=&quot;230&quot; x2=&quot;250&quot; y2=&quot;0&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
    &lt;line x1=&quot;30&quot; y1=&quot;250&quot; x2=&quot;150&quot; y2=&quot;20&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;3&quot;/&gt;
    &lt;line x1=&quot;82&quot; y1=&quot;176&quot; x2=&quot;82&quot; y2=&quot;186&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;84&quot; y=&quot;198&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot;&gt;b0&lt;/text&gt;
    &lt;text x=&quot;290&quot; y=&quot;198&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot;&gt;bt-1&lt;/text&gt;&lt;text x=&quot;76&quot; y=&quot;20&quot; font-size=&quot;11&quot;&gt;bt&lt;/text&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Ridisegno della slide 47 (retta ripida = pendenza &amp;gt; 1; tratteggio = 45°).&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div&gt;
    &lt;div class=&quot;q box&quot;&gt;&lt;p&gt;&lt;strong&gt;Es. 1.&lt;/strong&gt; Come evolve il debito/PIL nei due anni successivi, se r e g restano costanti? Che cosa può fare il governo?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra soluzione&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;La retta ha pendenza &amp;gt; 1 (r &amp;gt; g) e intercetta positiva (disavanzo primario): è il &lt;strong&gt;caso 3&lt;/strong&gt;. L&#x27;equilibrio è nel quadrante negativo ed è instabile; b&lt;sub&gt;0&lt;/sub&gt; sta sopra, quindi il debito &lt;strong&gt;cresce&lt;/strong&gt; negli anni 1 e 2, e a ritmo crescente (la distanza dalla bisettrice aumenta). Il governo può: (a) passare a un &lt;strong&gt;avanzo primario&lt;/strong&gt; abbastanza grande da abbassare la retta finché l&#x27;equilibrio supera b&lt;sub&gt;0&lt;/sub&gt;, cioè a&lt;sup&gt;P&lt;/sup&gt; &amp;gt; b&lt;sub&gt;0&lt;/sub&gt;(r−g)/(1+g); (b) agire su &lt;strong&gt;r&lt;/strong&gt; (credibilità, minori premi al rischio) e su &lt;strong&gt;g&lt;/strong&gt; (riforme per la crescita) per ruotare la retta fino a pendenza &amp;lt; 1.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;q box&quot;&gt;&lt;p&gt;&lt;strong&gt;Es. 2.&lt;/strong&gt; Mostra graficamente che con g &amp;gt; r la dinamica converge a un equilibrio stabile.&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra soluzione&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Con g &amp;gt; r la pendenza (1+r)/(1+g) è &amp;lt; 1: la retta taglia la bisettrice &quot;dall&#x27;alto verso il basso&quot;. A sinistra dell&#x27;incrocio la retta sta sopra la bisettrice (b&lt;sub&gt;t&lt;/sub&gt; &amp;gt; b&lt;sub&gt;t−1&lt;/sub&gt;: il debito sale), a destra sta sotto (il debito scende): in entrambi i casi il cobweb porta verso b̄. Algebricamente, nella soluzione b&lt;sub&gt;t&lt;/sub&gt; = (b&lt;sub&gt;0&lt;/sub&gt;−b̄)((1+r)/(1+g))&lt;sup&gt;t&lt;/sup&gt; + b̄ la potenza tende a 0. Prova con i casi 1 e 2 del &lt;a href=&quot;#dinamica&quot;&gt;simulatore&lt;/a&gt;.&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;q box&quot;&gt;&lt;p&gt;&lt;strong&gt;Es. 3.&lt;/strong&gt; Con r &amp;gt; g, a quali condizioni una riduzione del deficit/PIL riduce il debito/PIL?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra soluzione&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Da Δb&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt;(r−g)/(1+g) − a&lt;sup&gt;P&lt;/sup&gt;: il debito scende solo se l&#x27;&lt;strong&gt;avanzo primario supera lo snowball effect&lt;/strong&gt;, a&lt;sup&gt;P&lt;/sup&gt; &amp;gt; b&lt;sub&gt;t−1&lt;/sub&gt;(r−g)/(1+g). Graficamente la riduzione del deficit deve abbassare la retta abbastanza da portare l&#x27;equilibrio (instabile) &lt;em&gt;sopra&lt;/em&gt; il debito corrente: solo allora siamo nel tratto in cui il debito decresce. Una riduzione del deficit insufficiente rallenta la crescita del debito ma non la inverte. Attenzione (oltre le slide): se la correzione deprime g, lo snowball effect aumenta e parte dello sforzo si annulla.&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ APPROFONDIRE ============ --&gt;
&lt;section id=&quot;approfondire&quot; class=&quot;part&quot;&gt;
  &lt;div class=&quot;kicker&quot;&gt;Fonti esterne&lt;/div&gt;
  &lt;h2&gt;Per approfondire&lt;/h2&gt;
  &lt;p&gt;Opere, norme e siti citati nelle slide (o direttamente alla base di ciò che citano). Tutto ciò che segue è &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;, verificato con una ricerca web: apri il link per il testo originale.&lt;/p&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Delors Committee, &lt;em&gt;Report on economic and monetary union in the European Community&lt;/em&gt; (12 aprile 1989)&lt;/h4&gt;&lt;p&gt;Rapporto del comitato presieduto da Jacques Delors (con i governatori delle banche centrali). Propone il percorso in tre fasi verso l&#x27;EMU, con un sistema europeo di banche centrali e la moneta unica. Approvato dal Consiglio europeo di Madrid (giugno 1989).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il &quot;blueprint&quot; del Trattato citato nella slide 2; l&#x27;impostazione per fasi e convergenza viene da qui.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.cvce.eu/obj/en-725f74fb-841b-4452-a428-39e7a703f35f&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo su CVCE.eu&lt;/a&gt; · &lt;a href=&quot;https://www.ecb.europa.eu/ecb/access_to_documents/archives/delors/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Archivio del Comitato Delors (BCE)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Trattato sull&#x27;Unione europea (Maastricht), firmato il 7 febbraio 1992, in vigore dal 1 novembre 1993&lt;/h4&gt;&lt;p&gt;Istituisce l&#x27;Unione europea e le norme sull&#x27;EMU. La ratifica fu contrastata (referendum danese negativo del giugno 1992, sì francese di misura a settembre).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è l&#x27;oggetto della lezione; gli articoli 104c citati nelle slide sono nella numerazione originale.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/summary/SR/xy0026&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sintesi su EUR-Lex&lt;/a&gt; · &lt;a href=&quot;https://www.cvce.eu/de/collections/unit-content/-/unit/en/d5906df5-4f83-4603-85f7-0cabc24b9fe1/e038b310-f139-407f-9bfb-a1b2e901fb56/Resources&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Dossier CVCE&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Art. 140 TFUE e Protocollo n. 13 sui criteri di convergenza&lt;/h4&gt;&lt;p&gt;Versione attuale dei criteri: stabilità dei prezzi, posizione di bilancio (nessuna procedura per disavanzo eccessivo ex art. 126(6)), partecipazione all&#x27;ERM, tassi a lungo su un anno di osservazione. Commissione e BCE riferiscono almeno ogni due anni.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è dove &quot;vivono&quot; oggi i cinque criteri delle slide 5–6.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/art_140/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Art. 140 TFUE&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/pro_13/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Protocollo n. 13&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Art. 123 e 125 TFUE: divieto di finanziamento monetario e no-bailout clause&lt;/h4&gt;&lt;p&gt;L&#x27;art. 123 vieta alla BCE e alle banche centrali nazionali di finanziare direttamente gli Stati; l&#x27;art. 125 esclude che Unione o Stati membri rispondano degli impegni di un altro Stato. Interpretati dalla Corte di giustizia nelle sentenze &lt;em&gt;Pringle&lt;/em&gt; (C-370/12, sull&#x27;ESM) e &lt;em&gt;Gauweiler&lt;/em&gt; (C-62/14, sulle OMT).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: sono le due &quot;barriere&quot; citate nelle slide 15–16 (no monetizzazione, no-bailout) e il centro del dibattito sulla loro credibilità.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/art_123/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Art. 123 TFUE&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2012/art_125/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Art. 125 TFUE&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Robert J. Barro e David B. Gordon, &quot;Rules, Discretion and Reputation in a Model of Monetary Policy&quot;, &lt;em&gt;Journal of Monetary Economics&lt;/em&gt; 12(1), 1983, pp. 101–121&lt;/h4&gt;&lt;p&gt;Mostra che un policymaker discrezionale genera inflazione senza riuscire a sorprendere sistematicamente il pubblico, e che regole vincolanti (o la reputazione) possono migliorare il risultato.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il modello su cui le slide 7–9 fondano il criterio d&#x27;inflazione e la richiesta di una BCE indipendente.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.nber.org/papers/w1079&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER Working Paper 1079&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Peter S. Heller, &quot;Understanding Fiscal Space&quot;, IMF Policy Discussion Paper PDP/05/4, marzo 2005&lt;/h4&gt;&lt;p&gt;Definisce il fiscal space e il suo legame con la sostenibilità fiscale e discute come crearlo (nato nel contesto degli aiuti ai Paesi a basso reddito).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: fornisce la definizione citata nella slide 41.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://econpapers.repec.org/RePEc:imf:imfpdp:05/4&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda su EconPapers (con link al PDF IMF)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Aizenman, Hutchison e Jinjarak, &quot;What is the risk of European sovereign debt defaults? Fiscal space, CDS spreads and market pricing of risk&quot;, &lt;em&gt;Journal of International Money and Finance&lt;/em&gt; 34, 2013, pp. 37–59&lt;/h4&gt;&lt;p&gt;Stima il prezzo del rischio sovrano (CDS) per circa cinquanta Paesi nel 2005–10 in funzione del fiscal space (debito/entrate, deficit/entrate) e di altri fondamentali, con focus sulla periferia dell&#x27;Eurozona.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è con buona probabilità l&#x27;&quot;Aizenman et al. (2013)&quot; della slide 41 che usa debito/tax base come misura di fiscal space (l&#x27;identificazione esatta del lavoro va verificata col docente).&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.nber.org/papers/w17407&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Versione NBER (w17407)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Banca d&#x27;Italia, &lt;em&gt;Statistiche di finanza pubblica nei paesi dell&#x27;Unione europea&lt;/em&gt;&lt;/h4&gt;&lt;p&gt;Pubblicazione semestrale (giugno e dicembre) con indebitamento netto, debito e principali voci del conto delle AP dei Paesi UE e del G7; tavole anche nella base dati BDS.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte dei grafici delle slide 37–42 e del link della slide 36 (edizione 13/12/2022).&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.bancaditalia.it/pubblicazioni/finanza-pubblica-ue/2022-finanza-pubblica-ue/statistiche_FPE_13122022.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Edizione 13/12/2022 (link della slide)&lt;/a&gt; · &lt;a href=&quot;https://www.bancaditalia.it/pubblicazioni/finanza-pubblica-ue/index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Tutte le edizioni&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;BCE, ERM II — Exchange Rate Mechanism&lt;/h4&gt;&lt;p&gt;Descrive il meccanismo: parità centrale verso l&#x27;euro, banda standard ±15%, tassi di intervento; la corona danese partecipa dal 1999 con parità 7,46038.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: aggiorna le slide 44–46 su funzionamento e partecipanti.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ecb.europa.eu/ecb/tasks/forex/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina BCE&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;BCE, &lt;em&gt;Convergence Report&lt;/em&gt;, giugno 2026&lt;/h4&gt;&lt;p&gt;Valuta i Paesi UE fuori dall&#x27;euro (Cechia, Ungheria, Polonia, Romania, Svezia) sui criteri del Trattato, applicati in modo rigoroso su dati effettivi e con attenzione alla sostenibilità; dà conto dell&#x27;ingresso della Bulgaria (21° membro, 1/1/2026).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: mostra come i criteri di Maastricht vengono applicati oggi.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ecb.europa.eu/press/other-publications/convergence/pdf/ecb.cr202606~30e75ae1c2.en.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF del rapporto&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Paul De Grauwe, &lt;em&gt;Economics of Monetary Union&lt;/em&gt;, Oxford University Press&lt;/h4&gt;&lt;p&gt;Manuale di riferimento sull&#x27;unione monetaria: costi e benefici, teoria delle aree valutarie ottimali, BCE, politiche fiscali. L&#x27;ultima edizione che ho potuto confermare è la 12ª (2018).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: la &quot;Table 6.1&quot; della slide 43 e l&#x27;impostazione delle slide 4–12 (inflation bias Germania/Italia, rationale dei criteri) seguono da vicino questo testo. È una mia attribuzione, non dichiarata nelle slide: verificala col programma del corso.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://econpapers.repec.org/RePEc:oxp:obooks:9780198739876&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda EconPapers (11ª ed.)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;footer&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/footer&gt;

&lt;script&gt;
(function(){

  function $(id){return document.getElementById(id);}

  // Criteria checker

    function ck(){

      else t=&#x27;Inflazione comune fra E&lt;sub&gt;G&lt;/sub&gt; ed E&lt;sub&gt;I&lt;/sub&gt;: la Germania perde benessere (più inflazione senza meno disoccupazione), l\&#x27;Italia ne guadagna. Più il peso sale, più la perdita tedesca cresce.&#x27;;

  }
  var NS=&#x27;http://www.w3.org/2000/svg&#x27;;
  function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
  // Rule d = g b

    function dd(){
      var r=+$(&#x27;dd-r&#x27;).value,g=+$(&#x27;dd-g&#x27;).value,d=+$(&#x27;dd-d&#x27;).value,b0=+$(&#x27;dd-b0&#x27;).value;
      $(&#x27;dd-r-o&#x27;).textContent=fmt(r,1)+&#x27;%&#x27;;$(&#x27;dd-g-o&#x27;).textContent=fmt(g,1)+&#x27;%&#x27;;$(&#x27;dd-d-o&#x27;).textContent=fmt(d,1)+&#x27;%&#x27;;$(&#x27;dd-b0-o&#x27;).textContent=b0+&#x27;%&#x27;;
      var s=(1+r/100)/(1+g/100),f=function(b){return b*s+d;};

      var eq=Math.abs(s-1)&lt;1e-9?null:d/(1-s);
      var E=$(&#x27;ph-eq&#x27;);if(eq!==null&amp;&amp;eq&gt;-100&amp;&amp;eq&lt;250){E.style.display=&#x27;&#x27;;E.setAttribute(&#x27;cx&#x27;,X(eq));E.setAttribute(&#x27;cy&#x27;,Y(eq));}else E.style.display=&#x27;none&#x27;;
      $(&#x27;ph-b0&#x27;).setAttribute(&#x27;cx&#x27;,X(b0));$(&#x27;ph-b0&#x27;).setAttribute(&#x27;cy&#x27;,Y(b0));
      var b=b0,p=&#x27;M&#x27;+X(b)+&#x27;,&#x27;+Y(b);

      $(&#x27;tp-path&#x27;).setAttribute(&#x27;points&#x27;,pts.join(&#x27; &#x27;));
      var te=$(&#x27;tp-eq&#x27;);if(eq!==null&amp;&amp;eq&gt;=0&amp;&amp;eq&lt;=300){te.style.display=&#x27;&#x27;;te.setAttribute(&#x27;y1&#x27;,220-eq*0.7);te.setAttribute(&#x27;y2&#x27;,220-eq*0.7);}else te.style.display=&#x27;none&#x27;;
      var stable=s&lt;1,cs=(g&gt;r?(d&gt;=0?1:2):(d&gt;=0?3:4));
      var snow=b0*(r-g)/(100+g),need=snow;
      var b30=b0;for(var t2=0;t2&lt;30;t2++)b30=f(b30);
      $(&#x27;dd-out&#x27;).innerHTML=&#x27;Pendenza (1+r)/(1+g) = &lt;strong&gt;&#x27;+fmt(s,3)+&#x27;&lt;/strong&gt; → equilibrio &lt;span class=&quot;&#x27;+(stable?&#x27;ok&#x27;:&#x27;ko&#x27;)+&#x27;&quot;&gt;&#x27;+(stable?&#x27;STABILE&#x27;:&#x27;INSTABILE&#x27;)+&#x27;&lt;/span&gt;&#x27;+(eq!==null?&#x27;, b̄ = &lt;strong&gt;&#x27;+fmt(eq,1)+&#x27;%&lt;/strong&gt;&#x27;:&#x27;&#x27;)+&#x27; · caso &#x27;+(g===r?&#x27;limite (r = g)&#x27;:cs)+&#x27;&lt;br&gt;Snowball effect su b&lt;sub&gt;0&lt;/sub&gt;: &#x27;+fmt(snow,2)+&#x27; punti/anno; avanzo primario minimo per non far crescere b: &lt;strong&gt;&#x27;+fmt(Math.max(need,0),2)+&#x27;% del PIL&lt;/strong&gt;&#x27;+(need&lt;0?&#x27; (con g &amp;gt; r il debito scende anche con un piccolo disavanzo: fino a &#x27;+fmt(-need,2)+&#x27;%)&#x27;:&#x27;&#x27;)+&#x27;&lt;br&gt;Debito dopo 30 anni: &lt;strong&gt;&#x27;+(Math.abs(b30)&gt;999?(b30&gt;0?&#x27;&gt; 999%&#x27;:&#x27;&lt; −999%&#x27;):fmt(b30,0)+&#x27;%&#x27;)+&#x27;&lt;/strong&gt;&#x27;;

    $(&#x27;ita&#x27;).innerHTML=rows.map(function(r){var bad=r[4]&gt;1;return &#x27;&lt;tr&gt;&lt;td&gt;&#x27;+r[0]+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(r[1],1)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(r[2],1)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(r[3],2)+&#x27;&lt;/td&gt;&lt;td class=&quot;&#x27;+(bad?&#x27;ko&#x27;:&#x27;ok&#x27;)+&#x27;&quot;&gt;&#x27;+fmt(r[4],3)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(r[5],2)+&#x27;&lt;/td&gt;&lt;td&gt;&#x27;+fmt(r[6],1)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;}).join(&#x27;&#x27;);
  }
  // Debt chart (approximate)
  if($(&#x27;dc&#x27;)){
    var S=[
      {n:&#x27;Italia&#x27;,c:&#x27;var(--brick)&#x27;,on:true,d:[[1980,56],[1985,80],[1990,95],[1994,120],[1999,113],[2004,104],[2007,103],[2009,116],[2012,126],[2014,135],[2019,134],[2020,155],[2022,140],[2024,135]]},
      {n:&#x27;Germania&#x27;,c:&#x27;var(--sage)&#x27;,on:true,d:[[1980,31],[1990,41],[1995,55],[2000,59],[2005,67],[2010,82],[2015,72],[2019,60],[2020,69],[2024,62]]},
      {n:&#x27;Grecia&#x27;,c:&#x27;var(--ochre)&#x27;,on:true,d:[[1980,25],[1990,80],[1993,110],[2000,105],[2008,110],[2011,175],[2012,162],[2014,180],[2018,186],[2020,207],[2024,154]]},
      {n:&#x27;Area euro&#x27;,c:&#x27;var(--ink)&#x27;,on:true,d:[[1984,48],[1990,56],[1996,74],[2000,69],[2007,65],[2010,85],[2014,93],[2019,84],[2020,97],[2024,87]]}
    ];
