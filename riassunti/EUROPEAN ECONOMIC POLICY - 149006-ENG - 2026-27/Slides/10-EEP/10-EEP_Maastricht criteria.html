&lt;!-- ============ 1 TRATTATO ============ --&gt;
&lt;section id=&quot;trattato&quot; class=&quot;part p-sage&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;01&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--sage)&quot;&gt;Storia e istituzioni&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;Il Maastricht Treaty: la strada verso l&#x27;euro e l&#x27;EMU&lt;/span&gt;&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 2&lt;/span&gt; Il &lt;dfn&gt;Maastricht Treaty&lt;/dfn&gt; (TM, in italiano &lt;em&gt;Trattato sull&#x27;Unione europea&lt;/em&gt;) fissa formalmente il percorso verso la moneta unica e l&#x27;&lt;span class=&quot;term&quot;&gt;EMU&lt;/span&gt; (&lt;em&gt;Economic and Monetary Union&lt;/em&gt;, Unione economica e monetaria: mercato unico + moneta unica + banca centrale comune + coordinamento delle politiche economiche).&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;François Mitterrand&lt;/h4&gt;Presidente della Repubblica francese.&lt;/div&gt;
    &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;Helmut Kohl&lt;/h4&gt;Cancelliere tedesco. &lt;span class=&quot;src&quot;&gt;(nelle slide scritto &quot;Khol&quot;)&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;Jacques Delors&lt;/h4&gt;Presidente della Commissione europea; il suo &lt;strong&gt;Delors Report&lt;/strong&gt; (1989) è il &quot;progetto&quot; del Trattato.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Mitterrand e Kohl hanno fatto da mediatori fra obiettivi e visioni diverse degli Stati. Le norme sull&#x27;EMU, ricavate dal Delors Report, sono &lt;strong&gt;la parte più ampia del Trattato&lt;/strong&gt;: fasi, convergenza, BCE (&lt;span class=&quot;term&quot;&gt;ECB&lt;/span&gt;, European Central Bank) e sua indipendenza, coordinamento fiscale.&lt;/p&gt;
  &lt;div class=&quot;fig&quot;&gt;
  &lt;svg viewBox=&quot;0 0 860 120&quot; aria-label=&quot;Linea del tempo&quot;&gt;
    &lt;line x1=&quot;30&quot; y1=&quot;60&quot; x2=&quot;830&quot; y2=&quot;60&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;3&quot;/&gt;
    &lt;g font-size=&quot;12&quot;&gt;
      &lt;circle cx=&quot;60&quot; cy=&quot;60&quot; r=&quot;7&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;60&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;apr 1989&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot;&gt;Delors Report&lt;/text&gt;
      &lt;circle cx=&quot;200&quot; cy=&quot;60&quot; r=&quot;7&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 lug 1990&lt;/text&gt;&lt;text x=&quot;200&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot;&gt;1ª fase&lt;/text&gt;
      &lt;circle cx=&quot;340&quot; cy=&quot;60&quot; r=&quot;9&quot; fill=&quot;var(--acc)&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;7 feb 1992&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot;&gt;firma a Maastricht&lt;/text&gt;
      &lt;circle cx=&quot;480&quot; cy=&quot;60&quot; r=&quot;7&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;480&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 nov 1993&lt;/text&gt;&lt;text x=&quot;480&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot;&gt;entrata in vigore&lt;/text&gt;
      &lt;circle cx=&quot;610&quot; cy=&quot;60&quot; r=&quot;7&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;610&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 gen 1994&lt;/text&gt;&lt;text x=&quot;610&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot;&gt;2ª fase&lt;/text&gt;
      &lt;circle cx=&quot;760&quot; cy=&quot;60&quot; r=&quot;9&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;760&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;1 gen 1999&lt;/text&gt;&lt;text x=&quot;760&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot;&gt;3ª fase: euro + BCE&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Date dalle slide 2–3; la data del Delors Report (aprile 1989) è confermata dalla fonte esterna CVCE (vedi &quot;Per approfondire&quot;).&lt;/figcaption&gt;
  &lt;/div&gt;
  &lt;details&gt;&lt;summary&gt;Le altre novità del Trattato (non monetarie)&lt;/summary&gt;&lt;div&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Principio di &lt;span class=&quot;term&quot;&gt;subsidiarity&lt;/span&gt;&lt;/strong&gt; (sussidiarietà): l&#x27;Unione interviene solo se un obiettivo non può essere raggiunto meglio dagli Stati membri. &lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Revisione degli &lt;span class=&quot;term&quot;&gt;Structural Funds&lt;/span&gt;&lt;/strong&gt; per l&#x27;obiettivo di coesione (ridurre i divari regionali).&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Estensione del mercato comune&lt;/strong&gt; a trasporti, sanità, cultura…&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3 id=&quot;fasi&quot;&gt;Due principi: gradualità e convergenza&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 3&lt;/span&gt; La moneta unica arriva in &lt;strong&gt;tre fasi successive&lt;/strong&gt; (gradualità), e l&#x27;ingresso è subordinato al rispetto dei &lt;span class=&quot;term&quot;&gt;convergence criteria&lt;/span&gt; (convergenza). Scorri le fasi:&lt;/p&gt;
  &lt;div class=&quot;steps box tint&quot; data-steps&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Fase 1 · dal 1 luglio 1990&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Liberalizzazione dei movimenti di capitale.&lt;/strong&gt; I capitali circolano liberamente fra i Paesi membri.&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt; Con capitali liberi, cambi (quasi) fissi e politiche monetarie autonome non possono convivere (il &quot;trilemma&quot; o &lt;em&gt;impossible trinity&lt;/em&gt;): è il primo passo che rende inevitabile coordinare la politica monetaria.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Fase 2 · dal 1 gennaio 1994&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Convergenza delle politiche economiche&lt;/strong&gt; degli Stati membri: è il periodo in cui i Paesi devono soddisfare i criteri.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Fase 3 · dal 1 gennaio 1999&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Moneta unica e nascita della BCE.&lt;/strong&gt; I tassi di conversione delle valute nazionali vengono fissati irrevocabilmente (vedi &lt;a href=&quot;#fase-finale&quot;&gt;sezione 8&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepctl&quot;&gt;&lt;button class=&quot;btn ghost&quot; data-prev&gt;← indietro&lt;/button&gt;&lt;span data-count&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quale documento è considerato il &quot;blueprint&quot; del Trattato di Maastricht?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Il Delors Report del 1989, redatto dal comitato presieduto da Jacques Delors, presidente della Commissione.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quali sono i due principi che reggono il percorso verso l&#x27;euro?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;&lt;strong&gt;Gradualità&lt;/strong&gt; (tre fasi: 1990, 1994, 1999) e &lt;strong&gt;convergenza&lt;/strong&gt; (ingresso solo per chi rispetta i criteri).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che cosa inizia il 1° gennaio 1999?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;La terza fase: moneta unica e operatività della Banca centrale europea.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 CRITERI ============ --&gt;
&lt;section id=&quot;criteri&quot; class=&quot;part p-ochre&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--ochre)&quot;&gt;Le regole d&#x27;ingresso&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;I cinque convergence criteria&lt;/span&gt;&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 4&lt;/span&gt; Il Trattato chiede una convergenza &lt;strong&gt;macroeconomica&lt;/strong&gt;, ma &lt;em&gt;solo&lt;/em&gt; su politica monetaria e finanza pubblica: inflazione, tassi d&#x27;interesse, politiche di bilancio. La grande preoccupazione è l&#x27;&lt;strong&gt;inflazione&lt;/strong&gt; e tutto ciò che può generare pressioni inflazionistiche.&lt;/p&gt;
  &lt;div class=&quot;box note&quot;&gt;&lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt; Notate cosa &lt;em&gt;manca&lt;/em&gt;: nessun criterio &quot;reale&quot; (disoccupazione, crescita, sincronia dei cicli, mobilità del lavoro). Sono proprio le variabili della teoria dell&#x27;&lt;span class=&quot;term&quot;&gt;optimum currency area&lt;/span&gt; (area valutaria ottimale: quanto è costoso per Paesi diversi rinunciare al cambio quando arriva un &lt;span class=&quot;term&quot;&gt;asymmetric shock&lt;/span&gt;, cioè uno shock che colpisce un Paese e non gli altri). Maastricht misura la convergenza &lt;em&gt;nominale&lt;/em&gt;, non quella reale.&lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1 · Inflazione&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;2 · Tassi a lungo&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;3 · Cambio&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;4 · Deficit&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;5 · Debito&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;f&quot;&gt;π&lt;sub&gt;paese&lt;/sub&gt; ≤ media dei 3 tassi d&#x27;inflazione più bassi fra i candidati + 1,5 punti&lt;/div&gt;&lt;p&gt;Serve a evitare che l&#x27;unione nasca con un &lt;span class=&quot;term&quot;&gt;inflationary bias&lt;/span&gt; (→ &lt;a href=&quot;#inflazione&quot;&gt;sezione 3&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;f&quot;&gt;i&lt;sub&gt;lungo, paese&lt;/sub&gt; ≤ media dei tassi a lungo dei 3 Paesi a più bassa inflazione + 2 punti&lt;/div&gt;&lt;p&gt;Evita grandi guadagni/perdite in conto capitale al momento dell&#x27;ingresso (→ &lt;a href=&quot;#tassi&quot;&gt;sezione 4&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Il Paese deve aver aderito all&#x27;&lt;span class=&quot;term&quot;&gt;exchange rate mechanism&lt;/span&gt; (ERM) dello &lt;span class=&quot;term&quot;&gt;EMS&lt;/span&gt; (European Monetary System, il sistema di cambi semi-fissi europeo nato nel 1979) e &lt;strong&gt;non aver svalutato nei due anni precedenti&lt;/strong&gt; l&#x27;ingresso nell&#x27;EMU (→ &lt;a href=&quot;#cambio&quot;&gt;sezione 4&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;f&quot;&gt;deficit pubblico ≤ 3% del PIL&lt;/div&gt;&lt;p&gt;Se non rispettato: il deficit deve essere &lt;em&gt;sceso in modo continuo e sostanziale&lt;/em&gt; fino a valori vicini al 3%, oppure lo sforamento deve essere &quot;eccezionale e temporaneo e restare vicino al valore di riferimento&quot; (art. 104c(a) del Trattato).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;f&quot;&gt;debito pubblico ≤ 60% del PIL&lt;/div&gt;&lt;p&gt;Se non rispettato: il debito deve &quot;diminuire in misura sufficiente e avvicinarsi al valore di riferimento (60%) con ritmo adeguato&quot; (art. 104c(b)).&lt;/p&gt;&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt; La clausola &quot;ritmo adeguato&quot; è ciò che ha permesso a Italia e Belgio, con debiti oltre il 100%, di entrare nel 1999.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt; Oggi i criteri sono nell&#x27;art. 140 TFUE e nel Protocollo n. 13; il criterio di bilancio è formulato come &quot;non essere soggetti a una decisione del Consiglio sull&#x27;esistenza di un disavanzo eccessivo&quot; (art. 126(6) TFUE). Link in &lt;a href=&quot;#approfondire&quot;&gt;Per approfondire&lt;/a&gt;.&lt;/p&gt;

  &lt;h3&gt;Prova tu: questo Paese entra?&lt;/h3&gt;
  &lt;p&gt;Valori di riferimento &lt;strong&gt;ipotetici&lt;/strong&gt;: i tre Paesi migliori hanno inflazione 1,0 %, 1,3 %, 1,6 % (media 1,3 % → soglia &lt;strong&gt;2,8 %&lt;/strong&gt;) e tasso a lungo medio 4,5 % (→ soglia &lt;strong&gt;6,5 %&lt;/strong&gt;).&lt;/p&gt;
  &lt;div class=&quot;box&quot; id=&quot;checker&quot;&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ck-pi&quot;&gt;Inflazione&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ck-pi&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;3.5&quot;&gt;&lt;output id=&quot;ck-pi-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ck-i&quot;&gt;Tasso a lungo&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ck-i&quot; min=&quot;2&quot; max=&quot;14&quot; step=&quot;0.1&quot; value=&quot;7&quot;&gt;&lt;output id=&quot;ck-i-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ck-d&quot;&gt;Deficit / PIL&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ck-d&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;3.4&quot;&gt;&lt;output id=&quot;ck-d-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ck-b&quot;&gt;Debito / PIL&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ck-b&quot; min=&quot;20&quot; max=&quot;140&quot; step=&quot;1&quot; value=&quot;115&quot;&gt;&lt;output id=&quot;ck-b-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;label class=&quot;toggle&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;ck-dfall&quot; checked&gt; deficit in calo continuo e vicino al 3%&lt;/label&gt;
    &lt;label class=&quot;toggle&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;ck-bfall&quot; checked&gt; debito in calo &quot;a ritmo adeguato&quot;&lt;/label&gt;
    &lt;label class=&quot;toggle&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;ck-erm&quot; checked&gt; 2 anni nell&#x27;ERM senza svalutare&lt;/label&gt;
    &lt;div class=&quot;readout&quot; id=&quot;ck-out&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Su quali tre ambiti si concentra la convergenza richiesta dal Trattato?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Inflazione, tassi d&#x27;interesse (e cambio), politiche di bilancio: solo politica monetaria e finanza pubblica.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Il riferimento per i tassi a lungo è la media di quali Paesi?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Dei tre Paesi con l&#x27;inflazione più bassa (non dei tre con i tassi più bassi), più 2 punti percentuali.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Un Paese ha deficit al 3,4 % in forte calo da anni. Rispetta il criterio?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Può essere considerato conforme: il Trattato ammette un deficit sopra il 3 % se è sceso in modo continuo e sostanziale e si avvicina al riferimento, o se lo sforamento è eccezionale e temporaneo.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 INFLAZIONE ============ --&gt;
&lt;section id=&quot;inflazione&quot; class=&quot;part p-ochre&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--ochre)&quot;&gt;Criterio 1&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;Inflation convergence e il modello di Barro-Gordon&lt;/span&gt;&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 7–9&lt;/span&gt; Lo scopo è evitare che la futura unione monetaria abbia un &lt;span class=&quot;term&quot;&gt;inflationary bias&lt;/span&gt; (una tendenza sistematica a un&#x27;inflazione più alta del necessario). L&#x27;analisi si appoggia al &lt;dfn&gt;modello di Barro-Gordon&lt;/dfn&gt;.&lt;/p&gt;

  &lt;details open&gt;&lt;summary&gt;Il modello di Barro-Gordon in quattro idee&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
    &lt;ol&gt;
      &lt;li&gt;&lt;strong&gt;Phillips curve con aspettative&lt;/strong&gt;: la disoccupazione scende sotto il tasso naturale &lt;i&gt;U&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt; solo se l&#x27;inflazione è &lt;em&gt;più alta del previsto&lt;/em&gt; (sorpresa). Nel lungo periodo la curva è verticale in &lt;i&gt;U&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt;.&lt;/li&gt;
      &lt;li&gt;Il governo/banca centrale vorrebbe una disoccupazione &lt;i&gt;U*&lt;/i&gt; &amp;lt; &lt;i&gt;U&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt; (ad esempio perché &lt;i&gt;U&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt; è &quot;troppo alto&quot; per rigidità del mercato del lavoro).&lt;/li&gt;
      &lt;li&gt;Ha quindi la &lt;strong&gt;tentazione&lt;/strong&gt; di creare inflazione a sorpresa. Ma il pubblico lo sa e alza le aspettative finché la tentazione sparisce.&lt;/li&gt;
      &lt;li&gt;Risultato: equilibrio con &lt;strong&gt;disoccupazione = &lt;i&gt;U&lt;sub&gt;n&lt;/sub&gt;&lt;/i&gt;&lt;/strong&gt; e &lt;strong&gt;inflazione positiva&lt;/strong&gt; senza alcun guadagno. Questa inflazione &quot;inutile&quot; è l&#x27;inflation bias, ed è tanto più alta quanto più il Paese pesa la disoccupazione rispetto all&#x27;inflazione (curve di indifferenza più &quot;piatte&quot;).&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;La distorsione inflazionistica in un&#x27;unione monetaria&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
  &lt;figure class=&quot;fig&quot; style=&quot;margin:0&quot;&gt;
    &lt;svg viewBox=&quot;0 0 420 320&quot; aria-label=&quot;Grafico Barro-Gordon interattivo&quot;&gt;

      &lt;text x=&quot;400&quot; y=&quot;300&quot; text-anchor=&quot;end&quot; font-size=&quot;12&quot;&gt;Unemployment&lt;/text&gt;&lt;text x=&quot;14&quot; y=&quot;150&quot; font-size=&quot;12&quot; transform=&quot;rotate(-90 14 150)&quot; text-anchor=&quot;middle&quot;&gt;Inflation&lt;/text&gt;

      &lt;text x=&quot;345&quot; y=&quot;170&quot; font-size=&quot;11&quot; style=&quot;fill:var(--slate)&quot;&gt;Germania&lt;/text&gt;

      &lt;circle cx=&quot;230&quot; cy=&quot;220&quot; r=&quot;6&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;240&quot; y=&quot;216&quot; font-size=&quot;12&quot;&gt;E&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;G&lt;/tspan&gt;&lt;/text&gt;
      &lt;line id=&quot;bg-line&quot; x1=&quot;90&quot; y1=&quot;280&quot; x2=&quot;230&quot; y2=&quot;180&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;circle id=&quot;bg-u&quot; cx=&quot;230&quot; cy=&quot;180&quot; r=&quot;7&quot; style=&quot;fill:var(--acc)&quot; stroke=&quot;var(--paper)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text id=&quot;bg-ul&quot; x=&quot;200&quot; y=&quot;184&quot; font-size=&quot;12&quot; text-anchor=&quot;end&quot; font-weight=&quot;600&quot; style=&quot;fill:var(--acc)&quot;&gt;E&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;U&lt;/tspan&gt;&lt;/text&gt;

    &lt;figcaption&gt;Ridisegno della slide 8. Linee tratteggiate: luogo degli equilibri di ciascun Paese; E&lt;sub&gt;U&lt;/sub&gt; = equilibrio dell&#x27;unione.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;Prima dell&#x27;EMU la Germania ha inflazione bassa (E&lt;sub&gt;G&lt;/sub&gt;), l&#x27;Italia alta (E&lt;sub&gt;I&lt;/sub&gt;): &lt;strong&gt;preferenze diverse&lt;/strong&gt; fra inflazione e disoccupazione.&lt;/li&gt;
      &lt;li&gt;Nell&#x27;unione decidono &lt;strong&gt;insieme&lt;/strong&gt;: l&#x27;inflazione rifletterà la media delle preferenze, fra E&lt;sub&gt;I&lt;/sub&gt; ed E&lt;sub&gt;G&lt;/sub&gt;.&lt;/li&gt;
      &lt;li&gt;La Germania &lt;strong&gt;perde&lt;/strong&gt; benessere, l&#x27;Italia ne &lt;strong&gt;guadagna&lt;/strong&gt; (importa credibilità).&lt;/li&gt;
      &lt;li&gt;Perciò la Germania chiede prove che l&#x27;Italia condivida la stessa preferenza per la stabilità dei prezzi (→ criterio d&#x27;inflazione) e vuole una BCE &lt;strong&gt;clone della Bundesbank&lt;/strong&gt;.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;bg-w&quot;&gt;Peso delle preferenze &quot;italiane&quot; nella BCE&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;bg-w&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;50&quot;&gt;&lt;output id=&quot;bg-w-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;readout&quot; id=&quot;bg-out&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il problema di ridurre l&#x27;inflazione&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 9&lt;/span&gt; Come può l&#x27;Italia passare da E&lt;sub&gt;I&lt;/sub&gt; a E&lt;sub&gt;G&lt;/sub&gt; prima di entrare? Scorri i passi.&lt;/p&gt;
  &lt;div class=&quot;steps box tint&quot; data-steps data-svg=&quot;dis&quot;&gt;
    &lt;svg id=&quot;dis&quot; viewBox=&quot;0 0 420 300&quot; style=&quot;max-width:520px;margin:auto&quot;&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;270&quot; x2=&quot;400&quot; y2=&quot;270&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;270&quot; x2=&quot;40&quot; y2=&quot;20&quot; stroke=&quot;var(--ink)&quot;/&gt;
      &lt;text x=&quot;400&quot; y=&quot;290&quot; text-anchor=&quot;end&quot; font-size=&quot;12&quot;&gt;Unemployment&lt;/text&gt;
      &lt;line x1=&quot;200&quot; y1=&quot;270&quot; x2=&quot;200&quot; y2=&quot;30&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;288&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;Uₙ&lt;/text&gt;
      &lt;line x1=&quot;150&quot; y1=&quot;60&quot; x2=&quot;380&quot; y2=&quot;270&quot; stroke=&quot;var(--bad)&quot; stroke-width=&quot;2.5&quot; style=&quot;stroke:var(--bad)&quot;/&gt;
      &lt;circle cx=&quot;200&quot; cy=&quot;106&quot; r=&quot;6&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;104&quot; font-size=&quot;12&quot;&gt;E&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;I&lt;/tspan&gt;&lt;/text&gt;
      &lt;circle cx=&quot;200&quot; cy=&quot;200&quot; r=&quot;6&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;204&quot; font-size=&quot;12&quot;&gt;E&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;G&lt;/tspan&gt;&lt;/text&gt;
      &lt;g data-show=&quot;1 3&quot;&gt;&lt;line x1=&quot;208&quot; y1=&quot;118&quot; x2=&quot;196&quot; y2=&quot;186&quot; stroke=&quot;var(--good)&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#arr)&quot; style=&quot;color:var(--good)&quot;/&gt;&lt;text x=&quot;212&quot; y=&quot;160&quot; font-size=&quot;11&quot; style=&quot;fill:var(--good)&quot;&gt;ideale&lt;/text&gt;&lt;/g&gt;
      &lt;g data-show=&quot;2 3&quot;&gt;&lt;line x1=&quot;210&quot; y1=&quot;118&quot; x2=&quot;270&quot; y2=&quot;172&quot; stroke=&quot;var(--bad)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;circle cx=&quot;276&quot; cy=&quot;176&quot; r=&quot;6&quot; style=&quot;fill:var(--acc)&quot;/&gt;&lt;text x=&quot;286&quot; y=&quot;172&quot; font-size=&quot;12&quot;&gt;E&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;I1&lt;/tspan&gt;&lt;/text&gt;&lt;/g&gt;
      &lt;g data-show=&quot;3&quot;&gt;&lt;line x1=&quot;268&quot; y1=&quot;182&quot; x2=&quot;212&quot; y2=&quot;198&quot; stroke=&quot;var(--bad)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Punto di partenza&lt;/h4&gt;&lt;p&gt;L&#x27;Italia è in E&lt;sub&gt;I&lt;/sub&gt;: disoccupazione al tasso naturale, inflazione alta e attesa da tutti. La retta rossa è la Phillips curve di breve periodo, disegnata per &lt;em&gt;quelle&lt;/em&gt; aspettative.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Ideale: freccia verde&lt;/h4&gt;&lt;p&gt;Se l&#x27;annuncio di disinflazione fosse &lt;strong&gt;pienamente credibile&lt;/strong&gt;, le aspettative scenderebbero subito: l&#x27;inflazione cala senza alcun aumento di disoccupazione.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Nella pratica: lungo la Phillips curve&lt;/h4&gt;&lt;p&gt;Le aspettative sono lente: la stretta monetaria riduce l&#x27;inflazione &lt;em&gt;muovendosi lungo la curva&lt;/em&gt; fino a E&lt;sub&gt;I1&lt;/sub&gt;, con &lt;strong&gt;più disoccupazione&lt;/strong&gt; (costo della disinflazione, misurato dal &lt;span class=&quot;term&quot;&gt;sacrifice ratio&lt;/span&gt; &lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt;).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Poi verso E&lt;sub&gt;G&lt;/sub&gt;&lt;/h4&gt;&lt;p&gt;Quando le aspettative si adeguano la curva scende e il Paese torna a U&lt;sub&gt;n&lt;/sub&gt;, in E&lt;sub&gt;G&lt;/sub&gt;. Domande aperte della slide: &lt;strong&gt;quanto durerà&lt;/strong&gt;? E la lunga disoccupazione &lt;strong&gt;alzerà il tasso naturale&lt;/strong&gt; (isteresi)?&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepctl&quot;&gt;&lt;button class=&quot;btn ghost&quot; data-prev&gt;← indietro&lt;/button&gt;&lt;span data-count&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché nel Barro-Gordon l&#x27;inflazione di equilibrio è positiva anche se la disoccupazione resta a U&lt;sub&gt;n&lt;/sub&gt;?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Perché il policymaker ha l&#x27;incentivo a creare inflazione a sorpresa per portare U verso U* &amp;lt; U&lt;sub&gt;n&lt;/sub&gt;; il pubblico lo anticipa e alza le aspettative fino al punto in cui l&#x27;incentivo marginale si annulla. Si ottiene inflazione senza benefici: inflation bias.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Chi guadagna e chi perde in un&#x27;unione fra Paese a bassa e Paese ad alta inflazione?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Il Paese a bassa inflazione (Germania) perde, perché l&#x27;inflazione comune è più alta della sua; il Paese ad alta inflazione (Italia) guadagna.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché la disinflazione non segue la freccia verde?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Perché le aspettative non si adeguano subito (credibilità imperfetta): l&#x27;inflazione scende lungo la Phillips curve di breve, con aumento temporaneo della disoccupazione.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4 CAMBIO E TASSI ============ --&gt;
&lt;section id=&quot;cambio&quot; class=&quot;part p-ochre&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;04&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--ochre)&quot;&gt;Criteri 2 e 3&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;Exchange rate e interest rate convergence&lt;/span&gt;&lt;/h2&gt;
  &lt;h3&gt;No-devaluation requirement&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 10&lt;/span&gt; Il criterio impedisce ai Paesi di &lt;strong&gt;manipolare il cambio&lt;/strong&gt; poco prima dell&#x27;ingresso, per esempio svalutando per entrare nell&#x27;unione con un tasso di conversione più favorevole (valuta deprezzata = esportazioni più competitive per sempre, perché il tasso di conversione è irrevocabile).&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;Cosa chiede il Trattato&lt;/h4&gt;Mantenere il cambio entro la banda di oscillazione &quot;normale&quot;, &lt;strong&gt;senza cambiare la parità centrale&lt;/strong&gt; (&lt;span class=&quot;term&quot;&gt;central rate&lt;/span&gt;), per i due anni prima dell&#x27;ingresso.&lt;/div&gt;
    &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;Quale banda?&lt;/h4&gt;Dall&#x27;agosto 1993 la banda &quot;normale&quot; dell&#x27;EMS era &lt;strong&gt;±15%&lt;/strong&gt; attorno alla parità centrale.&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 640 170&quot; aria-label=&quot;Banda di oscillazione&quot;&gt;
      &lt;rect x=&quot;40&quot; y=&quot;30&quot; width=&quot;560&quot; height=&quot;110&quot; fill=&quot;var(--ochre-bg)&quot;/&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;85&quot; x2=&quot;600&quot; y2=&quot;85&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;30&quot; x2=&quot;600&quot; y2=&quot;30&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;140&quot; x2=&quot;600&quot; y2=&quot;140&quot; stroke=&quot;var(--ink2)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
      &lt;text x=&quot;606&quot; y=&quot;34&quot; font-size=&quot;11&quot;&gt;+15%&lt;/text&gt;&lt;text x=&quot;606&quot; y=&quot;89&quot; font-size=&quot;11&quot;&gt;parità&lt;/text&gt;&lt;text x=&quot;606&quot; y=&quot;144&quot; font-size=&quot;11&quot;&gt;−15%&lt;/text&gt;
      &lt;path d=&quot;M40,85 C90,60 130,110 180,95 S270,55 320,80 S420,120 470,100 S560,70 600,88&quot; fill=&quot;none&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text x=&quot;44&quot; y=&quot;162&quot; font-size=&quot;11&quot;&gt;−2 anni&lt;/text&gt;&lt;text x=&quot;600&quot; y=&quot;162&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot;&gt;ingresso nell&#x27;EMU&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Il cambio può oscillare dentro la banda, ma la parità centrale non deve essere svalutata. &lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt; La banda fu allargata da ±2,25% a ±15% dopo le crisi speculative del 1992-93 (uscita di lira e sterlina dall&#x27;ERM nel settembre 1992).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3 id=&quot;tassi&quot;&gt;Interest rate convergence&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 11&lt;/span&gt;&lt;/p&gt;
  &lt;ul&gt;
    &lt;li&gt;Differenze molto grandi fra i tassi d&#x27;interesse prima dell&#x27;ingresso potrebbero provocare forti &lt;strong&gt;guadagni e perdite in conto capitale&lt;/strong&gt; al momento dell&#x27;ingresso.&lt;/li&gt;
    &lt;li&gt;Però questi guadagni/perdite avvengono probabilmente &lt;strong&gt;prima&lt;/strong&gt;: il mercato fa convergere da solo i tassi a lungo appena viene presa la decisione politica di ammettere il Paese.&lt;/li&gt;
    &lt;li&gt;Dati il criterio d&#x27;inflazione, quello di cambio e la libertà dei capitali, i tassi &lt;strong&gt;sarebbero comunque convergiti&lt;/strong&gt; (ricorda la &lt;span class=&quot;term&quot;&gt;interest rate parity&lt;/span&gt;).&lt;/li&gt;
  &lt;/ul&gt;
  &lt;details&gt;&lt;summary&gt;Ripasso: interest rate parity e prezzo dei titoli&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt; Con capitali liberi, il rendimento atteso deve essere uguale ovunque:&lt;/p&gt;
    &lt;div class=&quot;f&quot;&gt;&lt;i&gt;i&lt;/i&gt;&lt;sub&gt;ITA&lt;/sub&gt; = &lt;i&gt;i&lt;/i&gt;&lt;sub&gt;GER&lt;/sub&gt; + svalutazione attesa della lira (+ premio per il rischio)&lt;/div&gt;
    &lt;p&gt;Se l&#x27;ingresso nell&#x27;euro diventa credibile, la svalutazione attesa va a zero e il differenziale si chiude. Il prezzo di un titolo a tasso fisso si muove in senso opposto al tasso: chi deteneva BTP ad alto rendimento a metà anni &#x27;90 ha avuto &lt;strong&gt;forti guadagni in conto capitale&lt;/strong&gt; man mano che i tassi italiani scendevano verso quelli tedeschi (la &quot;convergence play&quot;).&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché un Paese potrebbe voler svalutare appena prima di entrare?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Per fissare un tasso di conversione deprezzato e quindi un vantaggio competitivo permanente verso gli altri membri: è il comportamento che il criterio vuole impedire.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché il criterio sui tassi è in parte ridondante?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Perché con inflazione convergente, cambio stabile e capitali liberi la parità dei tassi spinge i tassi a lungo a convergere spontaneamente non appena l&#x27;ingresso diventa credibile.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 BILANCIO ============ --&gt;
&lt;section id=&quot;bilancio&quot; class=&quot;part p-slate&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--slate)&quot;&gt;Criteri 4 e 5&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;Budgetary convergence: deficit e debito&lt;/span&gt;&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 12&lt;/span&gt; I criteri su deficit e debito si giustificano come quello d&#x27;inflazione:&lt;/p&gt;
  &lt;ul&gt;
    &lt;li&gt;Un Paese con alto &lt;span class=&quot;term&quot;&gt;debt-to-GDP ratio&lt;/span&gt; (rapporto debito/PIL) ha l&#x27;incentivo a creare &lt;strong&gt;inflazione a sorpresa&lt;/strong&gt;, che riduce il valore reale del debito.&lt;/li&gt;
    &lt;li&gt;Il Paese poco indebitato ci perderebbe, quindi pretende che il Paese molto indebitato &lt;strong&gt;riduca il debito prima&lt;/strong&gt; di entrare.&lt;/li&gt;
    &lt;li&gt;Il Paese molto indebitato deve ridurre anche il &lt;strong&gt;deficit&lt;/strong&gt;.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h3&gt;Il vincolo di bilancio pubblico, passo per passo&lt;/h3&gt;
  &lt;div class=&quot;steps box tint&quot; data-steps&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Il debito accumula i deficit&lt;/h4&gt;&lt;p&gt;B = debito nominale, D = deficit nominale (spese − entrate), Y = PIL nominale.&lt;/p&gt;&lt;div class=&quot;f&quot;&gt;&lt;i&gt;B&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;B&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt; + &lt;i&gt;D&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Spesa primaria e spesa per interessi&lt;/h4&gt;&lt;p&gt;La spesa G si divide in spesa primaria G&lt;sup&gt;P&lt;/sup&gt; (tutto tranne gli interessi) e interessi sul debito esistente i·B&lt;sub&gt;t−1&lt;/sub&gt;:&lt;/p&gt;&lt;div class=&quot;f&quot;&gt;&lt;i&gt;D&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;G&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; − &lt;i&gt;T&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = (&lt;i&gt;G&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt; + &lt;i&gt;i&lt;sub&gt;t&lt;/sub&gt;B&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt;) − &lt;i&gt;T&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;i&lt;sub&gt;t&lt;/sub&gt;B&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt; + &lt;i&gt;D&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;D&lt;sup&gt;P&lt;/sup&gt; = G&lt;sup&gt;P&lt;/sup&gt; − T è il &lt;dfn&gt;primary deficit&lt;/dfn&gt; (disavanzo primario); se negativo è un &lt;dfn&gt;primary surplus&lt;/dfn&gt; A&lt;sup&gt;P&lt;/sup&gt; = −D&lt;sup&gt;P&lt;/sup&gt;. i&lt;sub&gt;t&lt;/sub&gt; = tasso medio sul debito esistente.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · L&#x27;equazione del debito&lt;/h4&gt;&lt;div class=&quot;f&quot;&gt;&lt;i&gt;B&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;B&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt;(1 + &lt;i&gt;i&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;) + &lt;i&gt;D&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;Il debito nominale resta costante (B&lt;sub&gt;t&lt;/sub&gt; − B&lt;sub&gt;t−1&lt;/sub&gt; = 0) se &lt;i&gt;i&lt;sub&gt;t&lt;/sub&gt;B&lt;sub&gt;t−1&lt;/sub&gt;&lt;/i&gt; = −&lt;i&gt;D&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt; = &lt;i&gt;A&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;: l&#x27;&lt;strong&gt;avanzo primario copre esattamente gli interessi&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · In termini reali&lt;/h4&gt;&lt;p&gt;Dividendo per il livello dei prezzi P (con ṗ = inflazione), e indicando con la tilde le grandezze reali:&lt;/p&gt;&lt;div class=&quot;f&quot;&gt;&lt;i&gt;B̃&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;B̃&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;1 + &lt;i&gt;i&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;1 + &lt;i&gt;ṗ&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;/span&gt; + &lt;i&gt;D̃&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Un aumento dell&#x27;inflazione riduce il valore reale del debito&lt;/strong&gt;, ceteris paribus: ecco la tentazione di creare inflazione inattesa. (Inattesa, perché se attesa i creditori chiederebbero un &lt;i&gt;i&lt;/i&gt; più alto.)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;5 · Lo sbarramento giuridico&lt;/h4&gt;&lt;p&gt;La &lt;span class=&quot;term&quot;&gt;debt monetization&lt;/span&gt; (finanziare il deficit stampando moneta, cioè la banca centrale che compra titoli dal Tesoro) è &lt;strong&gt;vietata dal Trattato UE&lt;/strong&gt;. &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt; Oggi: art. 123 TFUE, divieto di finanziamento monetario.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepctl&quot;&gt;&lt;button class=&quot;btn ghost&quot; data-prev&gt;← indietro&lt;/button&gt;&lt;span data-count&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;box def&quot;&gt;&lt;h4&gt;No-bailout clause&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 16&lt;/span&gt; I Paesi con molto debito hanno un rischio di default più alto; dentro l&#x27;unione questo aumenta la pressione per un &lt;span class=&quot;term&quot;&gt;bailout&lt;/span&gt; (salvataggio da parte degli altri) in caso di crisi. Per questo il Trattato include una clausola di &lt;em&gt;no-bailout&lt;/em&gt;. &lt;strong&gt;Ma è credibile?&lt;/strong&gt;&lt;/p&gt;
  &lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt; Il dubbio è di &lt;span class=&quot;term&quot;&gt;time inconsistency&lt;/span&gt;: ex ante si promette di non salvare, ex post il default di un membro può contagiare banche e altri Stati, e salvarlo diventa conveniente. La crisi greca (2010) e la nascita dell&#x27;ESM l&#x27;hanno mostrato. &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt; Oggi è l&#x27;art. 125 TFUE; la Corte di giustizia (caso &lt;em&gt;Pringle&lt;/em&gt;) ha ammesso aiuti con condizionalità stretta.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Come il Trattato misura deficit e debito&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 17–18&lt;/span&gt; Maastricht &lt;strong&gt;non distingue&lt;/strong&gt; spesa primaria e interessi, e misura tutto &lt;strong&gt;in rapporto al PIL&lt;/strong&gt;. Con lettere minuscole per i rapporti al PIL e &lt;i&gt;g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt; = crescita del PIL nominale:&lt;/p&gt;
  &lt;div class=&quot;f&quot;&gt;(1) &amp;nbsp; &lt;i&gt;b&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;b&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;1&lt;/span&gt;&lt;span&gt;1 + &lt;i&gt;g&lt;/i&gt;&lt;sub&gt;N,t&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt; + &lt;i&gt;d&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/div&gt;
  &lt;p&gt;È un&#x27;&lt;dfn&gt;equazione alle differenze del primo ordine&lt;/dfn&gt;: il valore di oggi dipende da quello di ieri. La soluzione ha una parte di &lt;strong&gt;equilibrio&lt;/strong&gt; e una &lt;strong&gt;deviazione&lt;/strong&gt; che col tempo può svanire o crescere. All&#x27;equilibrio (&lt;i&gt;b&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;b&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt; = &lt;i&gt;b̄&lt;/i&gt;):&lt;/p&gt;
  &lt;div class=&quot;f&quot;&gt;&lt;i&gt;b̄&lt;/i&gt; = &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;1 + &lt;i&gt;g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;&lt;i&gt;g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;/span&gt;&lt;i&gt;d&lt;/i&gt; &amp;nbsp;≈&amp;nbsp; &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;&lt;i&gt;d&lt;/i&gt;&lt;/span&gt;&lt;span&gt;&lt;i&gt;g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;/span&gt; &amp;nbsp;&amp;nbsp;⇔&amp;nbsp;&amp;nbsp; &lt;strong&gt;&lt;i&gt;d&lt;/i&gt; = &lt;i&gt;g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt; · &lt;i&gt;b̄&lt;/i&gt;&lt;/strong&gt;&lt;/div&gt;
  &lt;p class=&quot;src&quot;&gt;L&#x27;approssimazione trascura il termine &lt;i&gt;d·g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt;, piccolo (es. 0,03 × 0,05 = 0,0015).&lt;/p&gt;

  &lt;h3&gt;Da dove vengono 3% e 60%&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 19–21&lt;/span&gt; Con &lt;i&gt;b&lt;/i&gt; = 0,6 e &lt;i&gt;d&lt;/i&gt; = 0,03 → &lt;i&gt;g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt; = 0,03/0,6 = &lt;strong&gt;5%&lt;/strong&gt;. Se il PIL nominale cresce del 5% e l&#x27;inflazione di equilibrio è 2%, il PIL reale cresce del 3%. Le soglie sono coerenti solo con questa ipotesi: &lt;strong&gt;sono arbitrarie&lt;/strong&gt;, per due motivi:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Perché proprio 60%?&lt;/h4&gt;Unica ragione: era il &lt;strong&gt;rapporto debito/PIL medio dell&#x27;UE&lt;/strong&gt; al momento del negoziato.&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Dipende dalla crescita futura&lt;/h4&gt;Se il PIL nominale cresce più (meno) del 5%, il deficit che stabilizza il debito al 60% è più alto (più basso) del 3%.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box tint&quot; id=&quot;rule&quot;&gt;
    &lt;h4&gt;Calcolatore della regola d = g · b&lt;/h4&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ru-g&quot;&gt;Crescita PIL nominale g&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ru-g&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;ru-g-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;ru-b&quot;&gt;Debito obiettivo b&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ru-b&quot; min=&quot;20&quot; max=&quot;140&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;&lt;output id=&quot;ru-b-o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;readout&quot; id=&quot;ru-out&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che cosa significa che il debito nominale è costante se A&lt;sup&gt;P&lt;/sup&gt; = i·B&lt;sub&gt;t−1&lt;/sub&gt;?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;L&#x27;avanzo primario (entrate meno spese al netto degli interessi) basta a pagare tutti gli interessi: non serve nuovo debito.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Con crescita nominale del 3%, quale deficit stabilizza il debito al 60%?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;d = 0,03 × 0,60 = 1,8% del PIL. Con il 3% di deficit il debito salirebbe verso 0,03/0,03 = 100%.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché un alto debito crea un incentivo all&#x27;inflazione a sorpresa?&lt;/p&gt;&lt;button class=&quot;btn ghost&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;a&quot;&gt;Perché il valore reale del debito è B/P: un&#x27;inflazione superiore a quella incorporata nei tassi nominali erode il debito reale, trasferendo ricchezza dai creditori allo Stato.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6 DINAMICA ============ --&gt;
&lt;section id=&quot;dinamica&quot; class=&quot;part p-slate&quot;&gt;
  &lt;div class=&quot;num&quot;&gt;06&lt;/div&gt;
  &lt;div class=&quot;kicker&quot; style=&quot;color:var(--slate)&quot;&gt;Il cuore analitico&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;ul&quot;&gt;Dobbiamo preoccuparci dei debiti alti? La dinamica di debito/PIL&lt;/span&gt;&lt;/h2&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 22&lt;/span&gt; Partiamo dal debito reale e dividiamo per il PIL reale. Definiamo il &lt;dfn&gt;tasso d&#x27;interesse reale&lt;/dfn&gt;&lt;/p&gt;
  &lt;div class=&quot;f&quot;&gt;&lt;span class=&quot;fr&quot;&gt;&lt;span&gt;1 + &lt;i&gt;i&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;1 + &lt;i&gt;ṗ&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;/span&gt; = 1 + &lt;i&gt;r&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; &amp;nbsp;≅&amp;nbsp; 1 + &lt;i&gt;i&lt;/i&gt; − &lt;i&gt;ṗ&lt;/i&gt;&lt;/div&gt;
  &lt;p&gt;e con &lt;i&gt;g&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = crescita del PIL &lt;strong&gt;reale&lt;/strong&gt; otteniamo l&#x27;equazione chiave e il suo equilibrio:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;f&quot; style=&quot;border:2px solid var(--bad)&quot;&gt;&lt;i&gt;b&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;b&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;1 + &lt;i&gt;r&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;1 + &lt;i&gt;g&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt;&lt;/span&gt; + &lt;i&gt;d&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;f&quot; style=&quot;border:2px solid var(--bad)&quot;&gt;&lt;i&gt;b̄&lt;/i&gt; = &lt;i&gt;d&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt; &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;1 + &lt;i&gt;g&lt;/i&gt;&lt;/span&gt;&lt;span&gt;&lt;i&gt;g&lt;/i&gt; − &lt;i&gt;r&lt;/i&gt;&lt;/span&gt;&lt;/span&gt; &amp;nbsp;≈&amp;nbsp; &lt;span class=&quot;fr&quot;&gt;&lt;span&gt;&lt;i&gt;d&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;&lt;i&gt;g&lt;/i&gt; − &lt;i&gt;r&lt;/i&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;box note&quot;&gt;&lt;span class=&quot;tag int&quot;&gt;integrazione&lt;/span&gt; Differenza rispetto alla sezione 5: lì si usava il deficit &lt;em&gt;totale&lt;/em&gt; e la crescita &lt;em&gt;nominale&lt;/em&gt;; qui il deficit &lt;em&gt;primario&lt;/em&gt; e il differenziale &lt;em&gt;reale&lt;/em&gt; r − g. Le due versioni sono equivalenti, ma questa separa ciò che il governo controlla direttamente (d&lt;sup&gt;P&lt;/sup&gt;) da ciò che dipende da mercati ed economia (r, g).&lt;/div&gt;

  &lt;h3&gt;Analisi grafica: il diagramma b&lt;sub&gt;t&lt;/sub&gt; – b&lt;sub&gt;t−1&lt;/sub&gt;&lt;/h3&gt;
  &lt;p&gt;&lt;span class=&quot;tag slide&quot;&gt;slide 23–30&lt;/span&gt; Approssimando la pendenza con (1 + r − g): &lt;i&gt;b&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt; = &lt;i&gt;b&lt;/i&gt;&lt;sub&gt;t−1&lt;/sub&gt;(1 + &lt;i&gt;r&lt;/i&gt; − &lt;i&gt;g&lt;/i&gt;) + &lt;i&gt;d&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;. È una retta nello spazio (b&lt;sub&gt;t−1&lt;/sub&gt;, b&lt;sub&gt;t&lt;/sub&gt;):&lt;/p&gt;
  &lt;ul&gt;
    &lt;li&gt;la &lt;strong&gt;bisettrice a 45°&lt;/strong&gt; è il luogo degli equilibri stazionari (b&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt;);&lt;/li&gt;
    &lt;li&gt;l&#x27;&lt;strong&gt;intercetta&lt;/strong&gt; è d&lt;sup&gt;P&lt;/sup&gt;: positiva con disavanzo primario, negativa con avanzo. Cambiare d&lt;sup&gt;P&lt;/sup&gt; &lt;em&gt;trasla&lt;/em&gt; la retta;&lt;/li&gt;
    &lt;li&gt;la &lt;strong&gt;pendenza&lt;/strong&gt; è (1+r)/(1+g): minore di 1 se g &amp;gt; r, maggiore di 1 se g &amp;lt; r. Cambiare r o g la &lt;em&gt;ruota&lt;/em&gt;.&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p&gt;Muovi i cursori o scegli uno dei quattro casi delle slide. La linea a gradini (&lt;span class=&quot;term&quot;&gt;cobweb&lt;/span&gt;) mostra il percorso anno per anno a partire da b&lt;sub&gt;0&lt;/sub&gt;.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs data-onchange=&quot;debtCase&quot;&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Caso 1: g&amp;gt;r, deficit&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Caso 2: g&amp;gt;r, surplus&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Caso 3: g&amp;lt;r, deficit&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Caso 4: g&amp;lt;r, surplus&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;strong&gt;Equilibrio STABILE&lt;/strong&gt; e positivo: il debito sale se parte sotto l&#x27;equilibrio, scende se parte sopra.&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;strong&gt;Equilibrio STABILE&lt;/strong&gt; ma negativo (lo Stato diventa creditore netto): per ogni valore positivo il debito scende.&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;strong&gt;Equilibrio INSTABILE&lt;/strong&gt; e negativo: per ogni valore positivo il debito cresce senza limite.&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;strong&gt;Equilibrio INSTABILE&lt;/strong&gt; e positivo: il debito cresce se parte sopra l&#x27;equilibrio, scende se parte sotto.&lt;/div&gt;
  &lt;/div&gt;
