&lt;/svg&gt;
&lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Il punto di partenza.&lt;/b&gt; L&#x27;Italy sta in E&lt;sub&gt;I&lt;/sub&gt; e per entrare deve arrivare vicino a E&lt;sub&gt;G&lt;/sub&gt;. Il come è una questione rilevante. &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;L&#x27;ideale, freccia verde.&lt;/b&gt; L&#x27;inflazione scende e la disoccupazione non sale. Servirebbe che le attese si adeguino subito, cioè una disinflazione del tutto credibile. &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt; &lt;span class=&quot;add&quot;&gt;aggiunta sulle attese&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;In pratica, prima freccia rossa.&lt;/b&gt; L&#x27;inflazione scende lungo la Phillips di breve periodo fino a E&lt;sub&gt;I1&lt;/sub&gt;: meno inflazione, ma più disoccupazione. &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Seconda freccia rossa.&lt;/b&gt; Con le attese che scendono, la Phillips si sposta e il sistema torna a U&lt;sub&gt;n&lt;/sub&gt; in E&lt;sub&gt;G&lt;/sub&gt;. Le domande aperte della slide: quanto dura? Il natural rate può salire? &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt; &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; Questo secondo rischio si chiama hysteresis: la disoccupazione temporanea diventa permanente.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti&lt;/button&gt;&lt;span class=&quot;dots&quot; data-count&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché il governo non ottiene U*, se è ciò che vuole?&lt;/summary&gt;&lt;div&gt;Perché il pubblico prevede la sorpresa e alza le attese. In equilibrio U = U&lt;sub&gt;n&lt;/sub&gt;: resta solo l&#x27;inflazione più alta.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché nel modello l&#x27;Italy guadagna welfare e la Germany no?&lt;/summary&gt;&lt;div&gt;Con la media delle preferenze l&#x27;inflazione scende per l&#x27;Italy e sale per la Germany, a parità di U&lt;sub&gt;n&lt;/sub&gt;. La Germany paga più inflazione senza vantaggi di occupazione. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa rende «clone della Bundesbank» la ECB, e a che cosa serve?&lt;/summary&gt;&lt;div&gt;Serve a importare nell&#x27;unione la preferenza tedesca per la stabilità dei prezzi: abbassa il peso dell&#x27;occupazione nella funzione di perdita della banca centrale comune. &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; Le leve istituzionali sono l&#x27;indipendenza e il mandato sui prezzi, citate fra le norme a slide 2.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s4&quot; class=&quot;pb&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Parte B · Perché i criteri · (3) e (2)&lt;/span&gt;&lt;h2&gt;No-devaluation e convergenza dei tassi&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

&lt;h3&gt;Exchange rate convergence&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;Il requisito impedisce ai paesi di manipolare il cambio, per esempio per entrare nell&#x27;unione con un cambio più favorevole, cioè svalutato. &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;split even&quot;&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin-top:0&quot;&gt;
&lt;svg viewBox=&quot;0 0 460 250&quot; role=&quot;img&quot; aria-label=&quot;Il cambio resta nella banda attorno alla central rate per due anni&quot;&gt;
&lt;path class=&quot;ax&quot; d=&quot;M44 16V226H446&quot;/&gt;
&lt;rect x=&quot;44&quot; y=&quot;50&quot; width=&quot;402&quot; height=&quot;130&quot; fill=&quot;var(--c-bg)&quot;/&gt;
&lt;path class=&quot;gl&quot; style=&quot;stroke:var(--c)&quot; stroke-width=&quot;2&quot; d=&quot;M44 115H446&quot;/&gt;
&lt;path d=&quot;M44 128C80 90 110 96 140 118S200 158 240 124S300 70 340 96S410 140 446 110&quot; fill=&quot;none&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;2.4&quot;/&gt;
&lt;text x=&quot;52&quot; y=&quot;44&quot; font-size=&quot;13&quot;&gt;+15%&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;197&quot; font-size=&quot;13&quot;&gt;−15%&lt;/text&gt;&lt;text x=&quot;330&quot; y=&quot;110&quot; font-size=&quot;13&quot; class=&quot;t2&quot;&gt;central rate&lt;/text&gt;
&lt;text x=&quot;245&quot; y=&quot;244&quot; font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;24 mesi prima dell&#x27;ingresso&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Il cambio può muoversi nella banda, la central rate non può cambiare. &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt; Curva illustrativa.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div&gt;
&lt;p&gt;Secondo il Trattato i paesi devono tenere il cambio nella banda «normal» senza modificarla, quindi senza cambiare la &lt;b&gt;central rate&lt;/b&gt; (cambio centrale, il valore attorno a cui oscilla la moneta), nei due anni prima dell&#x27;ingresso. &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Da agosto 1993 la banda «normal» dell&#x27;EMS era ±15%. &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; Una banda così ampia rende il criterio poco severo: nel testo vale ciò che accade alla central rate, non quanto oscilla il cambio dentro la banda.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Interest rate convergence&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;Differenze troppo grandi fra i tassi prima dell&#x27;ingresso potrebbero produrre grandi &lt;b&gt;capital gains and losses&lt;/b&gt; (guadagni e perdite sul valore dei titoli) al momento dell&#x27;entrata. Ma queste variazioni probabilmente avvengono &lt;i&gt;prima&lt;/i&gt;: i mercati fanno convergere i tassi lunghi appena la decisione politica di ammettere il paese è presa. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/p&gt;

&lt;figure class=&quot;fig&quot; id=&quot;irp&quot;&gt;&lt;div class=&quot;split even&quot;&gt;
&lt;div&gt;&lt;svg id=&quot;irpsvg&quot; viewBox=&quot;0 0 440 260&quot; role=&quot;img&quot; aria-label=&quot;Tassi d&#x27;interesse e prezzo del titolo&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;div&gt;
&lt;div class=&quot;eq&quot; style=&quot;font-size:1.2rem&quot;&gt;i&lt;sub&gt;A&lt;/sub&gt; ≈ i&lt;sub&gt;B&lt;/sub&gt; + Δs&lt;sup&gt;e&lt;/sup&gt;&lt;span class=&quot;tag&quot;&gt;interest rate parity&lt;/span&gt;&lt;/div&gt;
&lt;p style=&quot;font-size:.96rem&quot;&gt;&lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; Con capitali liberi, il tasso del paese A può superare quello del paese B solo per compensare una svalutazione attesa di A, Δs&lt;sup&gt;e&lt;/sup&gt;. Se il mercato si convince che la svalutazione non ci sarà, lo spread si chiude.&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;&lt;span&gt;Svalutazione attesa di A &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;dep&quot; data-u=&quot; %&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.25&quot; value=&quot;5&quot;&gt;&lt;/label&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;irpread&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;Titolo perpetuo con cedola 10, per semplicità: prezzo = cedola / tasso. Numeri inventati. &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Il punto della slide.&lt;/b&gt; Dati il criterio sull&#x27;inflazione, il no-devaluation e i capitali liberi, i tassi erano comunque destinati a convergere. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt; Il criterio (2), quindi, in buona parte conferma ciò che gli altri già producono.&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Scrivi la catena logica che porta alla convergenza dei tassi.&lt;/summary&gt;&lt;div&gt;Capitali liberi (stage 1) + cambio credibile (nessuna svalutazione attesa) → parity: i tassi si uguagliano a parità di rischio. L&#x27;inflazione simile tiene allineati anche i tassi reali. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Chi fa un capital gain quando i tassi scendono?&lt;/summary&gt;&lt;div&gt;Chi detiene titoli a tasso fisso emessi quando i tassi erano alti: il prezzo sale per allineare il loro rendimento a quello nuovo.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;A che cosa serve vietare la devaluation a ridosso dell&#x27;ingresso?&lt;/summary&gt;&lt;div&gt;Evita che un paese si presenti con un cambio artificialmente svalutato per guadagnare competitività una volta fissato il tasso. &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s5&quot; class=&quot;pc&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Parte C · Matematica del debito · (4) e (5)&lt;/span&gt;&lt;h2&gt;Bilancio pubblico e debito, passo per passo&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;La logica è la stessa dell&#x27;inflazione: un paese molto indebitato ha un incentivo a creare &lt;b&gt;surprise inflation&lt;/b&gt; (inflazione a sorpresa); il paese poco indebitato ci perde e chiede di ridurre debito e deficit prima dell&#x27;ingresso. &lt;span class=&quot;src&quot;&gt;slide 12&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Le definizioni&lt;/h3&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;B, D, Y&lt;/h4&gt;&lt;p&gt;Debito nominale, deficit nominale (spese meno entrate), GDP nominale. &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Primary deficit D&lt;sup&gt;P&lt;/sup&gt;&lt;/h4&gt;&lt;p&gt;Deficit al netto degli interessi: G&lt;sup&gt;P&lt;/sup&gt; − T. Se è negativo si parla di &lt;b&gt;primary surplus&lt;/b&gt;, A&lt;sup&gt;P&lt;/sup&gt; = −D&lt;sup&gt;P&lt;/sup&gt;. &lt;span class=&quot;src&quot;&gt;slide 13-14&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;i, ṗ, r, g&lt;/h4&gt;&lt;p&gt;Tasso nominale medio sul debito, inflazione, tasso reale, crescita reale del GDP. &lt;span class=&quot;src&quot;&gt;slide 14, 15, 22&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;b, d&lt;/h4&gt;&lt;p&gt;Le lettere minuscole indicano rapporti al GDP. &lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;steps fig&quot; data-steps&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;1 · Il debito si accumula con il deficit&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;B&lt;sub&gt;t&lt;/sub&gt; = B&lt;sub&gt;t−1&lt;/sub&gt; + D&lt;sub&gt;t&lt;/sub&gt;&lt;/div&gt;&lt;p&gt;Il debito di quest&#x27;anno è quello dell&#x27;anno scorso più il deficit. &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;2 · Separiamo gli interessi&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;D&lt;sub&gt;t&lt;/sub&gt; = G&lt;sub&gt;t&lt;/sub&gt; − T&lt;sub&gt;t&lt;/sub&gt; = (G&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt; + i&lt;sub&gt;t&lt;/sub&gt;B&lt;sub&gt;t−1&lt;/sub&gt;) − T&lt;sub&gt;t&lt;/sub&gt; = i&lt;sub&gt;t&lt;/sub&gt;B&lt;sub&gt;t−1&lt;/sub&gt; + D&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/div&gt;&lt;p&gt;Parte della spesa è interessi sul debito esistente, il resto è spesa primaria. &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;3 · Sostituiamo&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;B&lt;sub&gt;t&lt;/sub&gt; = B&lt;sub&gt;t−1&lt;/sub&gt;(1 + i&lt;sub&gt;t&lt;/sub&gt;) + D&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/div&gt;&lt;p&gt;Il debito nominale è costante se il primary surplus copre gli interessi: i&lt;sub&gt;t&lt;/sub&gt;B&lt;sub&gt;t−1&lt;/sub&gt; = −D&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt; = A&lt;sup&gt;P&lt;/sup&gt;. &lt;span class=&quot;src&quot;&gt;slide 14&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;4 · In termini reali: dividiamo per P&lt;sub&gt;t&lt;/sub&gt;&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;B̃&lt;sub&gt;t&lt;/sub&gt; = B̃&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;f&quot;&gt;&lt;i&gt;1 + i&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;i&gt;1 + ṗ&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt; + D̃&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/div&gt;&lt;p&gt;La tilde indica il valore reale, cioè B/P. Usiamo che P&lt;sub&gt;t&lt;/sub&gt;/P&lt;sub&gt;t−1&lt;/sub&gt; = 1 + ṗ&lt;sub&gt;t&lt;/sub&gt;. &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;5 · Il tasso reale&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;&lt;span class=&quot;f&quot;&gt;&lt;i&gt;1 + i&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;i&gt;1 + ṗ&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt; = 1 + r&lt;sub&gt;t&lt;/sub&gt; ≅ 1 + i − ṗ&lt;sub&gt;t&lt;/sub&gt;&lt;/div&gt;&lt;p&gt;Quindi B̃&lt;sub&gt;t&lt;/sub&gt; = B̃&lt;sub&gt;t−1&lt;/sub&gt;(1 + r&lt;sub&gt;t&lt;/sub&gt;) + D̃&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;. &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;6 · In rapporto al GDP reale: la formula chiave&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;b&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;f&quot;&gt;&lt;i&gt;1 + r&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;i&gt;1 + g&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt; + d&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/div&gt;&lt;p&gt;Sarà il protagonista della sezione 7. &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti&lt;/button&gt;&lt;span class=&quot;dots&quot; data-count&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Perché l&#x27;inflazione tenta i governi&lt;/h3&gt;
&lt;figure class=&quot;fig&quot; id=&quot;real&quot;&gt;&lt;div class=&quot;split even&quot;&gt;
&lt;div&gt;
&lt;p style=&quot;margin-top:0&quot;&gt;A parità di tutto il resto (&lt;i&gt;ceteris paribus&lt;/i&gt;), più inflazione riduce il valore reale del debito: il governo può essere tentato di crearne a sorpresa. &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;&lt;span&gt;Tasso nominale già fissato i &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;i&quot; data-u=&quot; %&quot; min=&quot;1&quot; max=&quot;12&quot; step=&quot;0.5&quot; value=&quot;5&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;Inflazione effettiva ṗ &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;p&quot; data-u=&quot; %&quot; min=&quot;0&quot; max=&quot;20&quot; step=&quot;0.5&quot; value=&quot;2&quot;&gt;&lt;/label&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;big&quot; id=&quot;realbig&quot;&gt;&lt;/div&gt;&lt;div class=&quot;read&quot; id=&quot;realread&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;&lt;figcaption&gt;Debito iniziale 100, D&lt;sup&gt;P&lt;/sup&gt; = 0. Funziona solo se il tasso è già fissato, cioè se l&#x27;inflazione è inattesa. &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Debt monetization.&lt;/b&gt; Finanziare il deficit con moneta della banca centrale. Le slide precisano che è impedita dal Trattato UE. &lt;span class=&quot;src&quot;&gt;slide 15&lt;/span&gt; &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; Oggi il divieto è nell&#x27;&lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/art_123/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · art. 123 TFEU&lt;/a&gt;: niente credito alla pubblica amministrazione e niente acquisti diretti dei suoi titoli da parte della banca centrale.&lt;/div&gt;

&lt;h3&gt;Default risk e no-bailout&lt;/h3&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;1 · Debito alto&lt;/h4&gt;&lt;p&gt;Il paese ha un default risk più alto.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;2 · Nell&#x27;unione&lt;/h4&gt;&lt;p&gt;Cresce la pressione per un bailout in caso di crisi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;3 · No-bailout clause&lt;/h4&gt;&lt;p&gt;Viene inserita nel Trattato.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;4 · Ma è credibile?&lt;/h4&gt;&lt;p&gt;La domanda con cui si chiude la slide.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;prose&quot;&gt;&lt;b&gt;Bailout&lt;/b&gt; è il salvataggio di uno Stato da parte degli altri. &lt;span class=&quot;src&quot;&gt;slide 16&lt;/span&gt; Per il perché sia dubbio: se un default metterebbe a rischio tutta l&#x27;unione, gli altri paesi potrebbero preferire aiutare, nonostante la clausola. &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; Di fatto la Corte di giustizia, in &lt;a class=&quot;ext&quot; href=&quot;https://europeanlawblog.eu/2012/11/27/to-bail-out-or-to-not-to-bail-out-the-cjeu-confirms-competence-to-conclude-the-esm-treaty/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · Pringle, 2012&lt;/a&gt;, ha ritenuto compatibile con l&#x27;art. 125 TFEU un aiuto indispensabile alla stabilità dell&#x27;area e soggetto a condizioni rigorose.&lt;/p&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Quando resta costante il debito nominale?&lt;/summary&gt;&lt;div&gt;Quando il primary surplus copre esattamente gli interessi: i&lt;sub&gt;t&lt;/sub&gt;B&lt;sub&gt;t−1&lt;/sub&gt; = A&lt;sup&gt;P&lt;/sup&gt;. &lt;span class=&quot;src&quot;&gt;slide 14&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;E il debito reale, se il debito nominale è costante e l&#x27;inflazione è positiva?&lt;/summary&gt;&lt;div&gt;Scende, perché dividi lo stesso numero per prezzi più alti. È la risposta alla domanda «What about the debt in real terms?» della slide 14.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché l&#x27;inflazione attesa non riduce il debito reale?&lt;/summary&gt;&lt;div&gt;Perché entra nel tasso nominale dei nuovi titoli: il tasso reale non cambia. Conta l&#x27;inflazione inattesa. &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s6&quot; class=&quot;pc&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;6&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Parte C · Matematica del debito&lt;/span&gt;&lt;h2&gt;Da dove vengono 3% e 60%&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;I due numeri sono legati da una relazione precisa. Il problema è che regge solo sotto un&#x27;ipotesi molto particolare sulla crescita. &lt;span class=&quot;src&quot;&gt;slide 19-21&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;steps fig&quot; data-steps&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;1 · Dividi per il GDP nominale&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;b&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;f&quot;&gt;&lt;i&gt;1&lt;/i&gt;&lt;i&gt;1 + g&lt;sub&gt;N,t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt; + d&lt;sub&gt;t&lt;/sub&gt;&lt;span class=&quot;tag&quot;&gt;(1)&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Maastricht non distingue primaria e interessi: usa il deficit totale. La (1) è una &lt;b&gt;first order difference equation&lt;/b&gt;, cioè lega il valore di oggi a quello di ieri. g&lt;sub&gt;N&lt;/sub&gt; è la crescita del GDP nominale. &lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;2 · Che cosa significa equilibrio&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;b&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt; = &lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt;&lt;/div&gt;&lt;p&gt;La soluzione ha un valore di equilibrio più una deviazione, che col tempo può sparire o crescere. &lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;3 · Risolvi con g&lt;sub&gt;N&lt;/sub&gt; e d costanti&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;&lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt; = &lt;span class=&quot;f&quot;&gt;&lt;i&gt;&lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt;&lt;/i&gt;&lt;i&gt;1 + g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt; + d &amp;nbsp;→&amp;nbsp; &lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt; = &lt;span class=&quot;f&quot;&gt;&lt;i&gt;1 + g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt;&lt;i&gt;g&lt;sub&gt;N&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt; d&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;4 · Approssima: d·g&lt;sub&gt;N&lt;/sub&gt; è piccolo&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;&lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt; g&lt;sub&gt;N&lt;/sub&gt; = d &amp;nbsp;→&amp;nbsp; g&lt;sub&gt;N&lt;/sub&gt; = &lt;span class=&quot;f&quot;&gt;&lt;i&gt;d&lt;/i&gt;&lt;i&gt;&lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt;&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;&lt;p&gt;&lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;5 · Metti i numeri di Maastricht&lt;/h4&gt;&lt;div class=&quot;eq&quot;&gt;g&lt;sub&gt;N&lt;/sub&gt; = 0,03 / 0,6 = 0,05&lt;/div&gt;&lt;p&gt;Ecco la crescita nominale implicita: 5%. Con inflazione di equilibrio al 2%, il reale deve crescere al 3%. &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti&lt;/button&gt;&lt;span class=&quot;dots&quot; data-count&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;figure class=&quot;fig&quot; id=&quot;rule&quot;&gt;&lt;div class=&quot;split&quot;&gt;
&lt;div&gt;&lt;svg id=&quot;rulesvg&quot; viewBox=&quot;0 0 520 320&quot; role=&quot;img&quot; aria-label=&quot;Deficit che stabilizza il debito in funzione della crescita nominale&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;div&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;d = g·b&lt;/h4&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;&lt;span&gt;Crescita nominale g &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;g&quot; data-u=&quot; %&quot; min=&quot;0.5&quot; max=&quot;10&quot; step=&quot;0.25&quot; value=&quot;5&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;Debito obiettivo b &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;b&quot; data-u=&quot; %&quot; min=&quot;20&quot; max=&quot;130&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;ruleread&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;Formula: slide 20. Il valore esatto d = b·g/(1+g) viene dalla slide 18; la distanza tra i due è un calcolo aggiunto.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3&gt;Perché la regola è arbitraria su due fronti&lt;/h3&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Il 60%&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Il 5% di crescita&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;La lettura d&#x27;insieme&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p class=&quot;prose&quot;&gt;Perché stabilizzare proprio al 60%? L&#x27;unico motivo è che, al momento del negoziato, era il rapporto medio debito/GDP nell&#x27;Unione. &lt;span class=&quot;src&quot;&gt;slide 21&lt;/span&gt; Una conferma: secondo Buti e Gaspar la media semplice dei 12 paesi negoziatori era quasi esattamente il 60% nei cinque anni fino al 1989 (&lt;a class=&quot;ext&quot; href=&quot;https://cepr.org/voxeu/columns/maastricht-values&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · VoxEU&lt;/a&gt;).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p class=&quot;prose&quot;&gt;La regola dipende dalla crescita nominale futura. Se questa supera (scende sotto) il 5%, il deficit che stabilizza il debito al 60% supera (scende sotto) il 3%. &lt;span class=&quot;src&quot;&gt;slide 21&lt;/span&gt; Muovi il cursore: con g = 2% il deficit stabilizzante è 1,2%.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p class=&quot;prose&quot;&gt;Per stabilizzare il debito al 60% il deficit deve essere al 3% «if and only if» la crescita nominale è il 5%. &lt;span class=&quot;src&quot;&gt;slide 20&lt;/span&gt; Quindi la precisione numerica è difficile da giustificare: i numeri vengono da una regola contabile, non da un calcolo di ottimalità. &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; La critica classica è di &lt;a class=&quot;ext&quot; href=&quot;https://ideas.repec.org/p/fth/yalegr/674.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · Buiter, Corsetti, Roubini&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Con d = 3% costante e crescita nominale al 2%, dove va il debito/GDP?&lt;/summary&gt;&lt;div&gt;Con la formula approssimata b̄ = d/g = 150%. Quindi il limite del 3% non basta a tenere il debito al 60%.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa hai ipotizzato per dire che il reale cresce al 3%?&lt;/summary&gt;&lt;div&gt;Inflazione di equilibrio al 2%: 5 − 2 = 3. &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Qual è la differenza fra b̄ della (1) e la versione approssimata?&lt;/summary&gt;&lt;div&gt;Esatta: b̄ = d(1+g)/g = 0,03·1,05/0,05 = 63%. Approssimata: 60%. La slide 18 scarta il termine d·g&lt;sub&gt;N&lt;/sub&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s7&quot; class=&quot;pc&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;7&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Parte C · Matematica del debito&lt;/span&gt;&lt;h2&gt;Debt dynamics: r contro g&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;«Should we worry about high public debts?» La risposta sta in un confronto: il tasso reale sul debito contro la crescita reale dell&#x27;economia. &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;split even&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;eq&quot;&gt;b&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;f&quot;&gt;&lt;i&gt;1 + r&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;i&gt;1 + g&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt; + d&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;/div&gt;
&lt;div class=&quot;eq&quot;&gt;&lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt; = d&lt;sup&gt;P&lt;/sup&gt; &lt;span class=&quot;f&quot;&gt;&lt;i&gt;1 + g&lt;/i&gt;&lt;i&gt;g − r&lt;/i&gt;&lt;/span&gt; &amp;nbsp;≈&amp;nbsp; &lt;span class=&quot;f&quot;&gt;&lt;i&gt;d&lt;sup&gt;P&lt;/sup&gt;&lt;/i&gt;&lt;i&gt;g − r&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Equazione ed equilibrio: &lt;span class=&quot;src&quot;&gt;slide 22, 24&lt;/span&gt;. Il secondo membro usa la pendenza approssimata 1 + r − g.&lt;/p&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;La retta a 45°&lt;/b&gt; è il luogo degli stationary equilibrium: b&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt;. &lt;span class=&quot;src&quot;&gt;slide 24&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;L&#x27;intercetta&lt;/b&gt; è il primary deficit: positiva se c&#x27;è deficit, negativa se c&#x27;è surplus. Cambiarlo trasla la retta. &lt;span class=&quot;src&quot;&gt;slide 25&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;La pendenza&lt;/b&gt; è circa 1 + r − g: minore di 1 se g &amp;gt; r, maggiore di 1 se g &amp;lt; r. &lt;span class=&quot;src&quot;&gt;slide 26&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;figure class=&quot;fig&quot; id=&quot;dyn&quot;&gt;
&lt;div class=&quot;chips&quot; id=&quot;dynpre&quot; role=&quot;group&quot; aria-label=&quot;Scegli uno dei quattro casi&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;split even&quot;&gt;
&lt;div&gt;&lt;svg id=&quot;phase&quot; viewBox=&quot;0 0 470 430&quot; role=&quot;img&quot; aria-label=&quot;Diagramma di fase del debito&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;div&gt;&lt;svg id=&quot;tpath&quot; viewBox=&quot;0 0 470 300&quot; role=&quot;img&quot; aria-label=&quot;Debito nel tempo&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;&lt;span&gt;r, tasso reale &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;r&quot; data-u=&quot; %&quot; min=&quot;-3&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;g, crescita reale &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;g&quot; data-u=&quot; %&quot; min=&quot;-3&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;3&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;d&lt;sup&gt;P&lt;/sup&gt;, primary deficit (negativo = surplus) &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;d&quot; data-u=&quot; %&quot; min=&quot;-5&quot; max=&quot;5&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;b&lt;sub&gt;0&lt;/sub&gt;, debito iniziale &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;b0&quot; data-u=&quot; %&quot; min=&quot;0&quot; max=&quot;200&quot; step=&quot;1&quot; value=&quot;120&quot;&gt;&lt;/label&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;dynread&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;A sinistra la pendenza e l&#x27;intercetta sono moltiplicate per 8 attorno allo stesso equilibrio: con numeri realistici le rette sarebbero quasi parallele, e anche gli schemi delle slide esagerano le pendenze. Ogni scalino equivale quindi a circa 8 anni. A destra i 30 anni sono calcolati con i valori veri della formula. &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;I quattro casi delle slide&lt;/h3&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Caso&lt;/th&gt;&lt;th&gt;Condizioni&lt;/th&gt;&lt;th&gt;b̄&lt;/th&gt;&lt;th&gt;Equilibrium&lt;/th&gt;&lt;th style=&quot;text-align:left&quot;&gt;Debito (valori positivi)&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;1 &lt;span class=&quot;src&quot;&gt;slide 27&lt;/span&gt;&lt;/td&gt;&lt;td&gt;g &amp;gt; r, primary deficit&lt;/td&gt;&lt;td&gt;&amp;gt; 0&lt;/td&gt;&lt;td class=&quot;ok&quot;&gt;stable&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;sale o scende verso b̄&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2 &lt;span class=&quot;src&quot;&gt;slide 28&lt;/span&gt;&lt;/td&gt;&lt;td&gt;g &amp;gt; r, surplus&lt;/td&gt;&lt;td&gt;&amp;lt; 0&lt;/td&gt;&lt;td class=&quot;ok&quot;&gt;stable&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;scende per tutti i valori positivi&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3 &lt;span class=&quot;src&quot;&gt;slide 29&lt;/span&gt;&lt;/td&gt;&lt;td&gt;g &amp;lt; r, primary deficit&lt;/td&gt;&lt;td&gt;&amp;lt; 0&lt;/td&gt;&lt;td class=&quot;ko&quot;&gt;unstable&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;sale per tutti i valori positivi&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4 &lt;span class=&quot;src&quot;&gt;slide 30&lt;/span&gt;&lt;/td&gt;&lt;td&gt;g &amp;lt; r, surplus&lt;/td&gt;&lt;td&gt;&amp;gt; 0&lt;/td&gt;&lt;td class=&quot;ko&quot;&gt;unstable&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;sale sopra b̄, scende sotto b̄&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

&lt;h3&gt;Snowball effect: quanto sforzo serve&lt;/h3&gt;
&lt;div class=&quot;eq&quot;&gt;Δb&lt;sub&gt;t&lt;/sub&gt; = b&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;f&quot;&gt;&lt;i&gt;r&lt;sub&gt;t&lt;/sub&gt; − g&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;i&gt;1 + g&lt;sub&gt;t&lt;/sub&gt;&lt;/i&gt;&lt;/span&gt; − a&lt;sub&gt;t&lt;/sub&gt;&lt;sup&gt;P&lt;/sup&gt;&lt;span class=&quot;tag&quot;&gt;(**) slide 31&lt;/span&gt;&lt;/div&gt;
&lt;p class=&quot;prose&quot;&gt;Il primo termine è lo &lt;b&gt;snowball effect&lt;/b&gt; (effetto valanga): il debito cresce da solo se r &amp;gt; g, e tanto più quanto più è alto. Per fermarlo, cioè Δb ≤ 0, con r &amp;gt; g serve un primary surplus relativamente alto. &lt;span class=&quot;src&quot;&gt;slide 31&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;eq&quot;&gt;&lt;span class=&quot;ov&quot;&gt;a&lt;/span&gt;&lt;sup&gt;P&lt;/sup&gt; = b&lt;sub&gt;t−1&lt;/sub&gt; &lt;span class=&quot;f&quot;&gt;&lt;i&gt;r − g&lt;/i&gt;&lt;i&gt;1 + g&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;surplus che stabilizza, aggiunta&lt;/span&gt;&lt;/div&gt;

&lt;h3&gt;La soluzione nel tempo&lt;/h3&gt;
&lt;div class=&quot;eq&quot;&gt;b&lt;sub&gt;t&lt;/sub&gt; = (b&lt;sub&gt;0&lt;/sub&gt; − &lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt;) &lt;span class=&quot;f&quot;&gt;&lt;i&gt;1 + r&lt;/i&gt;&lt;i&gt;1 + g&lt;/i&gt;&lt;/span&gt;&lt;sup&gt;t&lt;/sup&gt; + &lt;span class=&quot;ov&quot;&gt;b&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;(b&lt;sub&gt;0&lt;/sub&gt; − b̄)&lt;/h4&gt;&lt;p&gt;Deviation: quanto parti lontano dallo stationary state. &lt;span class=&quot;src&quot;&gt;slide 32&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;((1+r)/(1+g))&lt;sup&gt;t&lt;/sup&gt;&lt;/h4&gt;&lt;p&gt;Evoluzione della deviazione: svanisce se g &amp;gt; r, esplode se g &amp;lt; r. &lt;span class=&quot;src&quot;&gt;slide 32&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;b̄&lt;/h4&gt;&lt;p&gt;Stationary state. Vale con g, r e d&lt;sup&gt;P&lt;/sup&gt; costanti. &lt;span class=&quot;src&quot;&gt;slide 32&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Caso 2: con g &amp;gt; r e surplus, l&#x27;equilibrio è negativo. Che cosa significa?&lt;/summary&gt;&lt;div&gt;Il paese finirebbe creditore netto. Per i valori positivi il debito scende sempre. &lt;span class=&quot;src&quot;&gt;slide 28&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;r = 3%, g = 1%, b = 130%: quale surplus serve per stabilizzare?&lt;/summary&gt;&lt;div&gt;130 × 0,02 / 1,01 ≈ 2,57% del GDP.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Caso 4: perché lo stesso surplus può non bastare a un debito più alto?&lt;/summary&gt;&lt;div&gt;Lo snowball è proporzionale a b. Sopra b̄ supera il surplus e il debito sale; sotto b̄ il surplus vince e il debito scende. &lt;span class=&quot;src&quot;&gt;slide 30&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s8&quot; class=&quot;pd&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;8&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Parte D · Dati e fase finale&lt;/span&gt;&lt;h2&gt;Il debito/GDP dell&#x27;Italia&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;La tabella della slide 33 applica le formule a nove anni di dati (fonte indicata: Bollettino economico Banca d&#x27;Italia e Istat). Clicca un anno per leggere in quale caso eravamo.&lt;/p&gt;
&lt;div class=&quot;split&quot;&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table id=&quot;ittab&quot;&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Anno&lt;/th&gt;&lt;th&gt;d&lt;sup&gt;P&lt;/sup&gt;&lt;/th&gt;&lt;th&gt;g&lt;/th&gt;&lt;th&gt;r&lt;/th&gt;&lt;th&gt;(1+r)/(1+g)&lt;/th&gt;&lt;th&gt;b̄ &lt;small&gt;(rapporto)&lt;/small&gt;&lt;/th&gt;&lt;th&gt;b&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;src&quot;&gt;slide 33&lt;/span&gt; Valori di d&lt;sup&gt;P&lt;/sup&gt;, g, r e b in %.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;itread&quot; aria-live=&quot;polite&quot; style=&quot;margin-top:0&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Come leggere b̄.&lt;/b&gt; Nella tabella la colonna «b stationary» è un rapporto, non una percentuale: 1,31 significa 131% del GDP. Ricalcolando tutte le righe con b̄ = d(1+g)/(g−r) ottengo gli stessi valori della slide. &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; Nel 2010 il saldo primario è zero, quindi b̄ è 0.&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Attenzione.&lt;/b&gt; Se applico la formula all&#x27;anno prima e confronto con il b osservato, restano scarti anche grandi (2012: previsione 120,4 contro 126,9). La formula non comprende gli aggiustamenti stock-flow, cioè variazioni del debito che non passano dal saldo; anche la misura di r usata nella tabella può contare. Le slide non spiegano questi scarti. &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt;&lt;/div&gt;

&lt;h3&gt;Quattro previsioni, quattro futuri&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;&lt;svg id=&quot;fc&quot; viewBox=&quot;0 0 640 340&quot; role=&quot;img&quot; aria-label=&quot;Debito su GDP a 30 anni partendo dai dati 1990, 1999, 2008 e 2012&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;Dinamica prevista sui dati del 1990, 1999, 2008 e 2012, ipotizzando che g, r e primary deficit restino quelli dell&#x27;anno iniziale. &lt;span class=&quot;src&quot;&gt;slide 35&lt;/span&gt; Le curve 2008 e 2012 sono ricalcolate con i dati della tabella e coincidono con la slide; 1990 e 1999 sono ricostruite con parametri stimati da me sulla forma del grafico. &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; La slide 34 rimanda a un file Excel sulla debt dynamics, che non ho potuto aprire.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;p class=&quot;prose&quot;&gt;Il messaggio è che queste non sono previsioni in senso vero, ma &lt;i&gt;estrapolazioni&lt;/i&gt;: basta cambiare l&#x27;anno di partenza per passare da oltre il 400% a un valore negativo. &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Nel 2012 b = 126,9 e b̄ = 106%. Che cosa dice la teoria?&lt;/summary&gt;&lt;div&gt;g &amp;lt; r con surplus: caso 4, instabile. Stando sopra b̄, il debito tende a salire.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Nel 2015 e 2016 b̄ è negativo: è una cattiva notizia?&lt;/summary&gt;&lt;div&gt;No. g &amp;gt; r con surplus è il caso 2: stabile, con debito tendenzialmente in calo per tutti i valori positivi.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra le linee 2008 e 2012 del grafico?&lt;/summary&gt;&lt;div&gt;Nel 2008 il debito è sotto b̄ (106 contro 131) e scende; nel 2012 è sopra (127 contro 106) e sale. Sono entrambe nel caso 4.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s9&quot; class=&quot;pd&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;9&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Parte D · Dati e fase finale&lt;/span&gt;&lt;h2&gt;La finanza pubblica nell&#x27;Eurozona&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;Sei serie dal 1980 al 2024, con tre date segnate in tutti i grafici delle slide: 1999, 2009 e 2020. &lt;span class=&quot;src&quot;&gt;slide 37-42&lt;/span&gt;&lt;/p&gt;
&lt;figure class=&quot;fig&quot; id=&quot;ez&quot;&gt;
&lt;div class=&quot;chips&quot; id=&quot;ezm&quot; role=&quot;group&quot; aria-label=&quot;Scegli la serie&quot;&gt;&lt;/div&gt;
&lt;svg id=&quot;ezsvg&quot; viewBox=&quot;0 0 640 330&quot; role=&quot;img&quot; aria-label=&quot;Serie storica dell&#x27;indicatore scelto&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;chips&quot; id=&quot;ezc&quot; role=&quot;group&quot; aria-label=&quot;Paesi da mostrare&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;&lt;span&gt;Leggi l&#x27;anno &lt;output id=&quot;ezy&quot;&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; id=&quot;ezr&quot; aria-label=&quot;Anno da leggere&quot; min=&quot;0&quot; max=&quot;14&quot; step=&quot;1&quot; value=&quot;12&quot;&gt;&lt;/label&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;ezread&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;&lt;b&gt;Valori letti a occhio&lt;/b&gt; sui grafici delle slide in 15 anni campione, uniti da segmenti: servono a vedere la forma, non vanno citati. Le slide mostrano anche France, Spain e Portugal; la fonte indicata è «Own elaboration on BdI data». &lt;span class=&quot;add&quot;&gt;ricostruzione&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;h3&gt;Fiscal space e fiscal sustainability&lt;/h3&gt;
&lt;div class=&quot;split even&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;De facto fiscal space&lt;/b&gt; = public debt / tax base. La tax base è la media mobile a 5 anni di total revenues / GDP. Lo spazio è debole quando il debito è alto rispetto alla base imponibile. Questa misura è usata da Aizenman et al. (2013). &lt;span class=&quot;src&quot;&gt;slide 41&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Fiscal space&lt;/b&gt;, secondo Heller (2005): «room in a government&#x27;s budget that allows it to provide resources for a desired purpose without jeopardizing the sustainability of its financial position or the stability of the economy». Esistono più misure; quella de facto è una di queste. &lt;span class=&quot;src&quot;&gt;slide 41&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Esempio.&lt;/b&gt; &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; Un debito al 135% del GDP con revenues al 47% dà circa 2,9: il debito vale quasi tre anni di entrate. L&#x27;indicatore si legge «al contrario»: un valore alto significa &lt;i&gt;poco&lt;/i&gt; spazio.&lt;/div&gt;
&lt;p class=&quot;prose&quot;&gt;&lt;b&gt;Fiscal pressure&lt;/b&gt; nella slide 42 è total revenues / GDP. &lt;span class=&quot;src&quot;&gt;slide 42&lt;/span&gt; &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; È il denominatore del fiscal space: a parità di debito/GDP, lo spazio è maggiore dove lo Stato raccoglie di più.&lt;/p&gt;
&lt;p class=&quot;prose&quot;&gt;Il link alle statistiche nelle slide: &lt;a href=&quot;https://www.bancaditalia.it/pubblicazioni/finanza-pubblica-ue/2022-finanza-pubblica-ue/statistiche_FPE_13122022.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;statistiche Banca d&#x27;Italia, dicembre 2022&lt;/a&gt; &lt;span class=&quot;src&quot;&gt;slide 36&lt;/span&gt;.&lt;/p&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché la crisi del 2009 fa salire il debito/GDP così in fretta in Ireland?&lt;/summary&gt;&lt;div&gt;Nel grafico il deficit irlandese tocca circa il 30% del GDP intorno al 2010. &lt;span class=&quot;src&quot;&gt;slide 38&lt;/span&gt; &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; Le slide non lo spiegano; il fatto di norma citato è il salvataggio delle banche.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;L&#x27;Italy ha un deficit totale alto ma spesso un primary surplus. Come è possibile?&lt;/summary&gt;&lt;div&gt;Perché la spesa per interessi è molto alta: d = d&lt;sup&gt;P&lt;/sup&gt; + interessi. È il confronto fra le slide 38, 39 e 40.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Fiscal space a 4 per Greece e a 1,3 per Germany: chi ha più spazio?&lt;/summary&gt;&lt;div&gt;La Germany: il valore è debito su entrate, quindi più è basso, più c&#x27;è spazio.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s10&quot; class=&quot;pd&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;10&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Parte D · Dati e fase finale&lt;/span&gt;&lt;h2&gt;La fase finale, gli «ins» e gli «outs»&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

&lt;h3&gt;I conversion rates&lt;/h3&gt;
&lt;figure class=&quot;fig&quot; id=&quot;cv&quot;&gt;&lt;div class=&quot;split even&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;chips&quot; id=&quot;cvc&quot; role=&quot;group&quot; aria-label=&quot;Scegli la moneta&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;&lt;span&gt;Importo in euro &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;eur&quot; data-u=&quot; €&quot; min=&quot;1&quot; max=&quot;1000&quot; step=&quot;1&quot; value=&quot;100&quot;&gt;&lt;/label&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;big&quot; id=&quot;cvbig&quot;&gt;&lt;/div&gt;&lt;div class=&quot;read&quot; id=&quot;cvread&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;&lt;figcaption&gt;I valori sono nella tabella 6.1 della slide 43, che riporta 11 monete. I tassi fissati irrevocabilmente il 31 dicembre 1998: &lt;a class=&quot;ext&quot; href=&quot;https://www.ecb.europa.eu/press/pr/date/1998/html/pr981231_2.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · ECB&lt;/a&gt;. I confronti fra monete sono calcoli aggiunti.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3&gt;ERM II: come funziona&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;Il &lt;b&gt;Exchange Rate Mechanism II&lt;/b&gt; organizza i rapporti tra chi ha adottato l&#x27;euro («ins») e chi no («outs»). Principi decisi all&#x27;ECOFIN del giugno 1996; in vigore dal 1° gennaio 1999, al posto del vecchio ERM. &lt;span class=&quot;src&quot;&gt;slide 44&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;split&quot;&gt;
&lt;figure class=&quot;fig&quot; id=&quot;band&quot; style=&quot;margin-top:0&quot;&gt;
&lt;div class=&quot;chips&quot; id=&quot;bandc&quot; role=&quot;group&quot; aria-label=&quot;Scegli il caso&quot;&gt;&lt;/div&gt;
&lt;svg id=&quot;bandsvg&quot; viewBox=&quot;0 0 520 150&quot; role=&quot;img&quot; aria-label=&quot;Il cambio nella banda di fluttuazione&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;ctrl&quot;&gt;&lt;label&gt;&lt;span&gt;Scarto dalla central rate &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;dev&quot; data-u=&quot; %&quot; min=&quot;-20&quot; max=&quot;20&quot; step=&quot;0.25&quot; value=&quot;4&quot;&gt;&lt;/label&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;bandread&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Cambio espresso in unità di moneta nazionale per un euro: sopra la central rate la moneta è più debole. Limiti: &lt;a class=&quot;ext&quot; href=&quot;https://suomenpankki.fi/en/statistics/interest-rates-and-exchange-rates/exchange-rates/exchange-rate-mechanism-erm-ii&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · Suomen Pankki&lt;/a&gt;.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Anchor&lt;/b&gt;: il sistema è ancorato all&#x27;euro. &lt;span class=&quot;src&quot;&gt;slide 45&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Adesione volontaria&lt;/b&gt;, con regole concordate fra ECB e banche centrali degli «outs». &lt;span class=&quot;src&quot;&gt;slide 44&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Margini&lt;/b&gt;: ±15% attorno a una central rate, oppure più stretti su scelta. &lt;span class=&quot;src&quot;&gt;slide 44&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Intervento obbligatorio&lt;/b&gt; (comprare o vendere moneta) al limite della banda; l&#x27;obbligo cade se confligge con la stabilità dei prezzi nell&#x27;Eurozona o nel paese esterno. &lt;span class=&quot;src&quot;&gt;slide 45&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;La ECB può &lt;b&gt;avviare una procedura&lt;/b&gt; per cambiare le central rate. &lt;span class=&quot;src&quot;&gt;slide 45&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Volontario, ma non per chi vuole l&#x27;euro.&lt;/b&gt; Per qualificarsi, un paese deve starci almeno due anni senza severe tensions e senza svalutare di propria iniziativa la central rate. &lt;span class=&quot;src&quot;&gt;slide 45&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;ERM II oggi&lt;/h3&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Denmark&lt;/h4&gt;&lt;p&gt;Dal 1° gennaio 1999. Central rate 7,46038, banda stretta ±2,25%. &lt;span class=&quot;src&quot;&gt;slide 46&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Bulgaria&lt;/h4&gt;&lt;p&gt;Nel meccanismo dal 10 luglio 2020, central rate 1,95583; euro dal 1° gennaio 2026. &lt;span class=&quot;src&quot;&gt;slide 46&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Croatia&lt;/h4&gt;&lt;p&gt;Nel meccanismo dal 10 luglio 2020; euro dal 1° gennaio 2023. &lt;span class=&quot;src&quot;&gt;slide 46&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Sweden&lt;/h4&gt;&lt;p&gt;Non ha aderito a ERM II. &lt;span class=&quot;src&quot;&gt;slide 46&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Nota di lettura.&lt;/b&gt; La slide 46 dice che «currently» ERM II comprende Bulgaria e Denmark, ma nella stessa slide la Bulgaria adotta l&#x27;euro dal 2026. Dunque oggi resta la sola corona danese: conferma sull&#x27;ingresso della Bulgaria in &lt;a class=&quot;ext&quot; href=&quot;https://www.ecb.europa.eu/press/pr/date/2025/html/ecb.pr250708~b9676a9fa8.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · ECB 2025&lt;/a&gt;. Inoltre la slide dà il 10 luglio 2020 per Bulgaria e Croatia, mentre la tabella di &lt;a class=&quot;ext&quot; href=&quot;https://suomenpankki.fi/en/statistics/interest-rates-and-exchange-rates/exchange-rates/exchange-rate-mechanism-erm-ii&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · Suomen Pankki&lt;/a&gt; riporta il 13 luglio per il lev.&lt;/div&gt;
&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;A che cosa corrisponde il criterio (3) dopo il 1999?&lt;/summary&gt;&lt;div&gt;Alla partecipazione a ERM II per almeno due anni, senza severe tensions né svalutazioni di iniziativa propria. &lt;span class=&quot;src&quot;&gt;slide 45&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quante lire valeva un marco tedesco al tasso finale?&lt;/summary&gt;&lt;div&gt;1936,27 / 1,95583 ≈ 990 lire.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cos&#x27;hanno in comune il lev bulgaro e il marco?&lt;/summary&gt;&lt;div&gt;Lo stesso numero: 1,95583 per euro. È il cambio del marco in tabella e la central rate del lev. &lt;span class=&quot;src&quot;&gt;slide 43, 46&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s11&quot; class=&quot;pd&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;11&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Esercizi delle slide&lt;/span&gt;&lt;h2&gt;Exercises on debt dynamics&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;I testi sono delle slide 47-49. Le slide non danno soluzioni: queste tracce sono scritte da me, confrontale con il corso. &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Esercizio 1&lt;/h3&gt;
&lt;div class=&quot;split even&quot;&gt;
&lt;div&gt;&lt;p&gt;Nel grafico b&lt;sub&gt;0&lt;/sub&gt; è il debito/GDP iniziale. Come cambia nei due anni successivi, con r e g costanti? Che cosa può fare il governo per ridurlo? &lt;span class=&quot;src&quot;&gt;slide 47&lt;/span&gt;&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Traccia di soluzione&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;La retta ha pendenza maggiore di 1, quindi g &amp;lt; r, e intercetta positiva, quindi primary deficit: è il caso 3. L&#x27;equilibrio è negativo e b&lt;sub&gt;0&lt;/sub&gt; sta a destra: il debito sale e l&#x27;aumento è ogni anno maggiore.&lt;/p&gt;
&lt;p&gt;Il governo può &lt;b&gt;traslare la retta in basso&lt;/b&gt; con un primary surplus. Per far calare il debito serve a&lt;sup&gt;P&lt;/sup&gt; &amp;gt; b&lt;sub&gt;0&lt;/sub&gt;(r − g)/(1 + g): così si passa al caso 4 con b&lt;sub&gt;0&lt;/sub&gt; sotto b̄. L&#x27;alternativa è ridurre la pendenza, cercando g più alto o r più basso.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin-top:0&quot;&gt;&lt;svg viewBox=&quot;0 0 340 240&quot; role=&quot;img&quot; aria-label=&quot;Grafico dell&#x27;esercizio 1: retta ripida con intercetta positiva&quot;&gt;
&lt;path class=&quot;ax&quot; d=&quot;M24 170H326M90 228V14&quot;/&gt;
&lt;path class=&quot;gl dsh&quot; d=&quot;M24 236L290 -30&quot; style=&quot;stroke:var(--soft)&quot;/&gt;
&lt;path d=&quot;M36 240L196 14&quot; stroke=&quot;var(--c)&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot;/&gt;
&lt;text x=&quot;62&quot; y=&quot;28&quot; font-size=&quot;14&quot;&gt;b&lt;/text&gt;&lt;text x=&quot;71&quot; y=&quot;32&quot; font-size=&quot;10&quot;&gt;t&lt;/text&gt;&lt;text x=&quot;298&quot; y=&quot;192&quot; font-size=&quot;14&quot;&gt;b&lt;/text&gt;&lt;text x=&quot;307&quot; y=&quot;196&quot; font-size=&quot;10&quot;&gt;t−1&lt;/text&gt;
&lt;path class=&quot;ax&quot; d=&quot;M108 164V176&quot;/&gt;&lt;text x=&quot;103&quot; y=&quot;194&quot; font-size=&quot;14&quot;&gt;b&lt;/text&gt;&lt;text x=&quot;112&quot; y=&quot;198&quot; font-size=&quot;10&quot;&gt;0&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;Schema ridisegnato dalla slide 47.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;/div&gt;

&lt;h3&gt;Esercizio 2&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;Con r il tasso reale e g la crescita del GDP, mostra con l&#x27;analisi grafica che se g &amp;gt; r il debito/GDP converge a un equilibrio stabile. &lt;span class=&quot;src&quot;&gt;slide 48&lt;/span&gt;&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Traccia di soluzione&lt;/summary&gt;&lt;div&gt;Se g &amp;gt; r la pendenza è minore di 1, quindi la retta taglia la 45° dall&#x27;alto. Sopra b̄ la retta sta sotto la 45°, perciò b&lt;sub&gt;t&lt;/sub&gt; &amp;lt; b&lt;sub&gt;t−1&lt;/sub&gt;; sotto b̄ sta sopra, perciò b&lt;sub&gt;t&lt;/sub&gt; &amp;gt; b&lt;sub&gt;t−1&lt;/sub&gt;. Gli scalini portano sempre verso b̄. Per vederlo scegli il caso 1 nel grafico della sezione 7. Algebricamente: ((1+r)/(1+g))&lt;sup&gt;t&lt;/sup&gt; tende a 0.&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Esercizio 3&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;Con grafico e/o matematica, spiega a quali condizioni una riduzione di deficit/GDP può ridurre il debito/GDP quando r &amp;gt; g. &lt;span class=&quot;src&quot;&gt;slide 49&lt;/span&gt;&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Traccia di soluzione&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;Da (**), Δb &amp;lt; 0 se e solo se a&lt;sup&gt;P&lt;/sup&gt; &amp;gt; b&lt;sub&gt;t−1&lt;/sub&gt;(r − g)/(1 + g). Quindi non basta ridurre il deficit: bisogna portare il primary surplus oltre lo snowball. Graficamente, la retta scende fino a far cadere b&lt;sub&gt;t−1&lt;/sub&gt; sotto il nuovo b̄.&lt;/p&gt;
&lt;p&gt;Più r − g è alto e più il debito è alto, più la correzione deve essere grande. Se la riduzione del deficit è troppo piccola, il debito sale solo più lentamente.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;add&quot;&gt;attenzione&lt;/span&gt; L&#x27;esercizio tiene g fisso. Se il taglio frena la crescita, g scende, lo snowball aumenta e parte dell&#x27;effetto si perde.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;/section&gt;
&lt;section id=&quot;s12&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;→&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Fonti esterne&lt;/span&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;Testi, autori e norme citati nelle slide, cercati sul web. Tutto ciò che è in questa sezione è &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; salvo diversa indicazione.&lt;/p&gt;
&lt;div class=&quot;bib&quot;&gt;
&lt;article&gt;&lt;h4&gt;Delors Report (1989)&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Report on economic and monetary union in the European Community&lt;/i&gt;, presentato il 12 aprile 1989 dal comitato presieduto da Jacques Delors. Propone la EMU in tre fasi, senza scadenze vincolanti. Conta perché è il blueprint del Trattato. &lt;span class=&quot;src&quot;&gt;citato a slide 2&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.cvce.eu/en/education/unit-content/-/unit/02bb76df-d066-4c08-a58a-d4686a3e68ff/43b6bdf1-1bca-4e2f-91fd-1bbfe483af9e&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · CVCE&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://en.wikipedia.org/wiki/Delors_Committee&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · Wikipedia&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;Treaty on European Union (Maastricht, 1992)&lt;/h4&gt;&lt;p&gt;GU C 191. Crea l&#x27;Unione, introduce la EMU in tre fasi e il principio di sussidiarietà (art. 3b). Da leggere per il testo originale delle disposizioni. &lt;span class=&quot;src&quot;&gt;citato a slide 2-6&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/treaty-on-european-union.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · sintesi EUR-Lex&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://treaties.un.org/doc/Publication/UNTS/Volume%201757/volume-1757-I-30615-English.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · testo, UN Treaty Series&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;Art. 104c, oggi art. 126 TFEU, e Protocollo 12&lt;/h4&gt;&lt;p&gt;Excessive deficit procedure. Il Protocollo fissa i valori di riferimento 3% e 60%. I numeri stanno in un protocollo allegato e non nel corpo del Trattato; la colonna di Buti e Gaspar su VoxEU ne ricostruisce l&#x27;origine e nota che non hanno basi solide in teoria o nei dati. &lt;span class=&quot;src&quot;&gt;citato a slide 6&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.legislation.gov.uk/eut/teu/attachment/13&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · Protocollo 12&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://en.wikisource.org/wiki/Consolidated_version_of_the_Treaty_on_the_Functioning_of_the_European_Union/Title_VIII:_Economic_and_Monetary_Policy&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · Titolo VIII TFEU&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://cepr.org/voxeu/columns/maastricht-values&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · VoxEU, «Maastricht values»&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;No-bailout e debt monetization: artt. 125 e 123 TFEU&lt;/h4&gt;&lt;p&gt;Il divieto di salvataggio e quello di finanziamento monetario, oggi in questi articoli. Pringle (C-370/12, 27 novembre 2012) è il caso che risponde alla domanda «is this clause credible?»: l&#x27;art. 125 non vieta ogni aiuto. &lt;span class=&quot;src&quot;&gt;citati a slide 15-16&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/art_123/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · art. 123, EUR-Lex&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://europeanlawblog.eu/2012/11/27/to-bail-out-or-to-not-to-bail-out-the-cjeu-confirms-competence-to-conclude-the-esm-treaty/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · commento a Pringle&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;Barro e Gordon (1983)&lt;/h4&gt;&lt;p&gt;R. J. Barro, D. B. Gordon, &lt;i&gt;Rules, Discretion and Reputation in a Model of Monetary Policy&lt;/i&gt;, Journal of Monetary Economics 12(1), 101-121. Sotto discrezionalità le sorprese non si ripetono sistematicamente: regole e reputazione migliorano i risultati. È il fondamento dell&#x27;inflation bias. &lt;span class=&quot;src&quot;&gt;citato a slide 7&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.nber.org/papers/w1079&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · NBER WP 1079, gratuito&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://econpapers.repec.org/RePEc:eee:moneco:v:12:y:1983:i:1:p:101-121&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · scheda rivista&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;Heller (2005)&lt;/h4&gt;&lt;p&gt;P. S. Heller, &lt;i&gt;Understanding Fiscal Space&lt;/i&gt;, IMF Policy Discussion Paper PDP/05/4. Definisce il fiscal space e il suo rapporto con la sostenibilità. Da qui viene la definizione della slide. &lt;span class=&quot;src&quot;&gt;citato a slide 41&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://econpapers.repec.org/RePEc:imf:imfpdp:05/4&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · scheda EconPapers&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;Aizenman et al. (2013)&lt;/h4&gt;&lt;p&gt;J. Aizenman, M. Hutchison, Y. Jinjarak, &lt;i&gt;What is the risk of European sovereign debt defaults? Fiscal space, CDS spreads and market pricing of risk&lt;/i&gt;, Journal of International Money and Finance 34, 37-59. Il fiscal space spiega il rischio sovrano, ma nel 2010 la periferia dell&#x27;euro risulta prezzata molto oltre i fondamentali. &lt;span class=&quot;src&quot;&gt;citato a slide 41&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.nber.org/papers/w17407.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · versione NBER&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://escholarship.org/content/qt2914v9fh/qt2914v9fh.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · eScholarship&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;Banca d&#x27;Italia e Istat&lt;/h4&gt;&lt;p&gt;Le fonti dei dati. &lt;i&gt;Statistiche di finanza pubblica nei paesi dell&#x27;Unione europea&lt;/i&gt; è la pubblicazione del link a slide 36, con edizioni aggiornate; il &lt;i&gt;Bollettino Economico&lt;/i&gt; è citato per la tabella italiana; Istat stima l&#x27;indebitamento netto e il saldo primario notificati alla UE. Utili per aggiornare i dati fermi al 2016 della tabella. &lt;span class=&quot;src&quot;&gt;citati a slide 33, 36-42&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.bancaditalia.it/pubblicazioni/finanza-pubblica-ue/index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · Statistiche&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.bancaditalia.it/pubblicazioni/bollettino-economico/index.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · Bollettino Economico&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.istat.it/it/files//2023/04/Notifica_21_04_2023.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · esempio di notifica Istat&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;ERM II e conversion rates&lt;/h4&gt;&lt;p&gt;Il meccanismo è istituito dalla risoluzione di Amsterdam del 16 giugno 1997; non ho trovato il documento ECOFIN del giugno 1996 citato nelle slide. I tassi di conversione sono nel Regolamento 2866/98, a cui il Regolamento 2025/1409 ha aggiunto la Bulgaria. &lt;span class=&quot;src&quot;&gt;citati a slide 43-46&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://ECB.eu/pub/pdf/other/policyaccexchangerateen.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · ECB, policy su ERM II&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://www.ecb.europa.eu/ecb/history-arts-culture/history/enlargement/html/faqenlarge.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · ECB, FAQ&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/reg/1998/2866&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · Reg. 2866/98&lt;/a&gt;&lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/reg/2025/1409/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · Reg. 2025/1409&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;Per il dibattito su 3% e 60%: Buiter, Corsetti, Roubini (1993)&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Excessive Deficits: Sense and Nonsense in the Treaty of Maastricht&lt;/i&gt;, Economic Policy, aprile 1993. Non è citato nelle slide: lo aggiungo perché sostiene che i requisiti, specie sul debito, sono ben più severi di quanto serva alla solvibilità. Completa la sezione 6.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://ideas.repec.org/p/fth/yalegr/674.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · scheda IDEAS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h4&gt;Probabile manuale: De Grauwe, &lt;i&gt;Economics of Monetary Union&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;La «Table 6.1» della slide 43 e l&#x27;impianto della parte sui criteri fanno pensare a questo testo, ma le slide non lo nominano: &lt;b&gt;è una mia ipotesi, da verificare&lt;/b&gt; sul programma del corso.&lt;/p&gt;&lt;p class=&quot;links&quot;&gt;&lt;a class=&quot;ext&quot; href=&quot;https://eprints.lse.ac.uk/46546&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · scheda LSE&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Limite di questo riassunto.&lt;/b&gt; Ho potuto leggere solo il PDF della lezione 10. Gli altri materiali della cartella &lt;code&gt;corso/&lt;/code&gt; (altre lezioni, esercizi, programma) e il file Excel sulla debt dynamics non sono stati consultati, perché non ho potuto elencare la cartella: nessun contenuto qui viene da quei file. I richiami a EMS e interest rate parity vanno quindi confrontati con le lezioni precedenti.&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer class=&quot;foot wrap&quot;&gt;
&lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
&lt;/footer&gt;
