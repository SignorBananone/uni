&lt;main class=&quot;wrap&quot;&gt;
&lt;section id=&quot;s1&quot; class=&quot;pa&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Parte A · Il Trattato&lt;/span&gt;&lt;h2&gt;Il Maastricht Treaty apre la strada all&#x27;euro&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;Il Treaty on European Union, firmato a Maastricht (nelle slide «TM»), stabilisce formalmente il percorso verso la moneta unica e la &lt;b&gt;Economic and Monetary Union&lt;/b&gt; (EMU, l&#x27;unione economica e monetaria). &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Chi lo ha reso possibile&lt;/h3&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;François Mitterrand&lt;/h4&gt;&lt;p&gt;Presidente della Francia. Con Kohl media tra obiettivi e visioni diverse degli Stati. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Helmut Kohl&lt;/h4&gt;&lt;p&gt;Cancelliere della Germania. È l&#x27;altra metà della mediazione politica. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Jacques Delors&lt;/h4&gt;&lt;p&gt;Presidente della European Commission. Il suo &lt;b&gt;Delors Report&lt;/b&gt; (1989) è il progetto di base (blueprint) del Trattato. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;prose&quot;&gt;Le norme sulla EMU, basate sul Delors Report, sono la parte più ampia del Trattato: fasi, convergenza, European Central Bank (ECB), indipendenza della ECB, coordinamento fiscale. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Le altre norme del Trattato&lt;/summary&gt;&lt;div&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Principle of subsidiarity&lt;/b&gt; (sussidiarietà): l&#x27;Unione agisce solo dove è più efficace del livello nazionale. La definizione è presa dalla &lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/treaty-on-european-union.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · EUR-Lex&lt;/a&gt;; le slide lo citano soltanto. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Revisione degli &lt;b&gt;Structural Funds&lt;/b&gt; (fondi per ridurre i divari regionali) per il Cohesion Objective. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Estensione del Common Market a trasporti, salute, cultura e altri ambiti. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Due principi: graduality e convergence&lt;/h3&gt;
&lt;p class=&quot;prose&quot;&gt;&lt;b&gt;Graduality&lt;/b&gt;: la moneta unica arriva per fasi successive, non in un colpo solo. &lt;b&gt;Convergence&lt;/b&gt;: si entra solo dopo aver soddisfatto i &lt;i&gt;convergence criteria&lt;/i&gt;, cioè condizioni economiche uguali per tutti. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Stage 1 · dal 1° luglio 1990&lt;/h4&gt;&lt;p&gt;Liberalizzazione dei movimenti di capitale. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Stage 2 · dal 1° gennaio 1994&lt;/h4&gt;&lt;p&gt;Convergenza delle politiche economiche degli Stati membri. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Stage 3 · dal 1° gennaio 1999&lt;/h4&gt;&lt;p&gt;Moneta unica e nascita della ECB. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Nota di lettura.&lt;/b&gt; La slide 3 attribuisce al Trattato tutte e tre le fasi, ma lo stage 1 parte prima della firma del 1992. Viene infatti dalla tabella di marcia del Delors Report e non richiedeva modifiche ai trattati, secondo la &lt;a class=&quot;ext&quot; href=&quot;https://en.wikipedia.org/wiki/Delors_Committee&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · Delors Committee&lt;/a&gt;. Nelle slide i nomi compaiono come «Mitterand» e «Khol»: qui uso le grafie corrette.&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Che cosa aggiunge il principio di convergence a quello di graduality?&lt;/summary&gt;&lt;div&gt;La graduality fissa il &lt;i&gt;quando&lt;/i&gt;: le fasi con le loro date. La convergence fissa il &lt;i&gt;chi&lt;/i&gt;: entra solo il paese che rispetta i criteri.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quale fase è legata alla libera circolazione dei capitali, e perché conta più avanti?&lt;/summary&gt;&lt;div&gt;Lo stage 1. Con capitali liberi e cambi attesi stabili, i tassi d&#x27;interesse tendono a convergere per interest rate parity (sezione 4).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Firma ed entrata in vigore: quali date?&lt;/summary&gt;&lt;div&gt;Firmato il 7 febbraio 1992, in vigore dal 1° novembre 1993. &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s2&quot; class=&quot;pa&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Parte A · Il Trattato&lt;/span&gt;&lt;h2&gt;I cinque convergence criteria&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;Il Trattato chiede convergenza &lt;i&gt;macroeconomica&lt;/i&gt;, ma solo su politica monetaria e finanza pubblica: inflazione, tassi d&#x27;interesse, bilanci. La preoccupazione di fondo è l&#x27;inflazione e tutto ciò che può alimentarla. &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Cosa non c&#x27;è.&lt;/b&gt; I criteri non guardano occupazione, produttività o struttura dell&#x27;economia: lo dice la parola «only» della slide 4. &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; Sono quindi criteri nominali: misurano prezzi, tassi e saldi, non il grado di somiglianza reale tra le economie.&lt;/div&gt;

&lt;div class=&quot;split&quot;&gt;
&lt;div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Criterio&lt;/th&gt;&lt;th&gt;Condizione&lt;/th&gt;&lt;th&gt;Fonte&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;(1) Inflation&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;≤ media dei 3 tassi più bassi fra i candidati + 1,5&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;(2) Long-term interest rate&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;≤ media dei 3 paesi a bassa inflazione + 2&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;(3) Exchange rate&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;nel meccanismo di cambio dell&#x27;EMS, senza devaluation nei 2 anni prima dell&#x27;ingresso&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;(4) Deficit&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;≤ 3% del GDP, oppure: in calo continuo e sostanziale e vicino al 3%, oppure scostamento «exceptional and temporary» e vicino al 3%&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;(5) Debt&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;≤ 60% del GDP, oppure: «diminish sufficiently» e si avvicina al 60% «at a satisfactory pace»&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; I +1,5 e +2 vanno letti come punti percentuali: si sommano a un tasso, non sono una percentuale di esso. GDP è il prodotto interno lordo (PIL).&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Gli articoli citati: 104c e la numerazione di oggi&lt;/summary&gt;&lt;div&gt;La slide 6 cita l&#x27;art. 104c(a) e 104c(b) del Trattato di Maastricht. &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; Oggi la stessa materia sta nell&#x27;art. 126 TFEU e i valori 3% e 60% sono nel &lt;a class=&quot;ext&quot; href=&quot;https://www.legislation.gov.uk/eut/teu/attachment/13&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · Protocollo 12&lt;/a&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;figure class=&quot;fig&quot; id=&quot;chk&quot; style=&quot;margin-top:0&quot;&gt;
&lt;h4 style=&quot;margin-top:0&quot;&gt;Fai passare l&#x27;esame a un candidato&lt;/h4&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;&lt;span&gt;Media delle 3 inflazioni più basse &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;ref&quot; data-u=&quot; %&quot; min=&quot;0.5&quot; max=&quot;4&quot; step=&quot;0.1&quot; value=&quot;1.5&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;Inflazione del candidato &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;inf&quot; data-u=&quot; %&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;3.5&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;Tasso lungo nei 3 paesi di riferimento &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;rr&quot; data-u=&quot; %&quot; min=&quot;2&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;5&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;Tasso lungo del candidato &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;lr&quot; data-u=&quot; %&quot; min=&quot;2&quot; max=&quot;14&quot; step=&quot;0.1&quot; value=&quot;6.5&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;Deficit / GDP &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;def&quot; data-u=&quot; %&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;3.4&quot;&gt;&lt;/label&gt;

&lt;label class=&quot;tgl&quot;&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;erm&quot; checked&gt;&lt;span&gt;Due anni nel meccanismo di cambio, senza devaluation&lt;/span&gt;&lt;/label&gt;
&lt;label class=&quot;tgl&quot;&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;dfall&quot; checked&gt;&lt;span&gt;Deficit in forte calo e vicino al 3%&lt;/span&gt;&lt;/label&gt;
&lt;label class=&quot;tgl&quot;&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;dbfall&quot; checked&gt;&lt;span&gt;Debito in calo a ritmo soddisfacente&lt;/span&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;pass&quot; id=&quot;chkout&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;figcaption&gt;Valori di partenza inventati. Il giudizio su «vicino» e «soddisfacente» è semplificato: per il deficit qui vale «vicino» fino al 4%. &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Da notare.&lt;/b&gt; I parametri 3% e 60% hanno vie d&#x27;uscita scritte a parole. Sposta il debito a 110% con la casella spuntata e poi togli la spunta: &lt;i&gt;il criterio dipende da un giudizio&lt;/i&gt;, non solo da un numero.&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Le soglie (1) e (2) sono fisse?&lt;/summary&gt;&lt;div&gt;No, sono relative: dipendono dai tre paesi con l&#x27;inflazione più bassa. Le soglie (4) e (5) invece sono valori fissi, ma con clausole di flessibilità.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un paese con debito al 110% del GDP può entrare?&lt;/summary&gt;&lt;div&gt;Secondo il testo sì, se il debito «diminish sufficiently» e si avvicina al 60% «at a satisfactory pace». &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quali variabili economiche i criteri ignorano?&lt;/summary&gt;&lt;div&gt;Tutto ciò che non è monetario o di finanza pubblica, per esempio la disoccupazione e la crescita reale. &lt;span class=&quot;src&quot;&gt;slide 4&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s3&quot; class=&quot;pb&quot;&gt;
&lt;div class=&quot;shead&quot;&gt;&lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Parte B · Perché i criteri · (1)&lt;/span&gt;&lt;h2&gt;Inflation convergence e inflation bias&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;lead&quot;&gt;Il criterio sull&#x27;inflazione serve a evitare che l&#x27;unione nasca con un &lt;b&gt;inflation bias&lt;/b&gt;, cioè con una tendenza sistematica a produrre più inflazione di quanta ne servirebbe. L&#x27;analisi si inquadra nel modello di Barro e Gordon. &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Il modello a parole&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;L&#x27;algebra&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Il grafico delle slide&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;prose&quot;&gt;
&lt;p&gt;&lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; Le slide danno il modello per noto. I pezzi sono quattro:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Short-run Phillips curve&lt;/b&gt; (curva di Phillips di breve periodo): un&#x27;inflazione maggiore di quella attesa riduce la disoccupazione per un po&#x27;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;U&lt;sub&gt;n&lt;/sub&gt;&lt;/b&gt;, natural rate of unemployment: nel lungo periodo la disoccupazione torna qui, qualunque sia l&#x27;inflazione. Di qui la linea verticale.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;U*&lt;/b&gt;, la disoccupazione che il governo vorrebbe: è &lt;i&gt;sotto&lt;/i&gt; U&lt;sub&gt;n&lt;/sub&gt;, perciò ha la tentazione di sorprendere il pubblico con inflazione.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Rational expectations&lt;/b&gt;: il pubblico capisce la tentazione e la incorpora nelle attese. La sorpresa non riesce, la disoccupazione resta a U&lt;sub&gt;n&lt;/sub&gt; e rimane solo l&#x27;inflazione.&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Risultato: più inflazione senza alcun guadagno in occupazione. È questo il bias.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;prose&quot;&gt;
&lt;p&gt;&lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt; Una versione semplice con perdita quadratica. Il coefficiente &lt;span class=&quot;m&quot;&gt;a&lt;/span&gt; misura quanto il paese tiene all&#x27;occupazione rispetto ai prezzi.&lt;/p&gt;
&lt;div class=&quot;eq&quot;&gt;L = π² + a (U − U*)²&lt;span class=&quot;tag&quot;&gt;funzione di perdita&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;eq&quot;&gt;U = U&lt;sub&gt;n&lt;/sub&gt; − (π − π&lt;sup&gt;e&lt;/sup&gt;) / m&lt;span class=&quot;tag&quot;&gt;Phillips, pendenza −m&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;Il minimo dà la retta tratteggiata dei grafici, che parte da U*:&lt;/p&gt;
&lt;div class=&quot;eq&quot;&gt;π = (a / m) (U − U*)&lt;/div&gt;
&lt;p&gt;Se le attese sono corrette U = U&lt;sub&gt;n&lt;/sub&gt;, quindi l&#x27;equilibrio è:&lt;/p&gt;
&lt;div class=&quot;eq&quot;&gt;π&lt;sup&gt;eq&lt;/sup&gt; = (a / m) (U&lt;sub&gt;n&lt;/sub&gt; − U*) &amp;gt; 0&lt;/div&gt;
&lt;p&gt;Più &lt;span class=&quot;m&quot;&gt;a&lt;/span&gt; è alto, più la retta è ripida e l&#x27;inflazione di equilibrio è alta: è la differenza fra le rette «Italy» e «Germany». Con &lt;span class=&quot;m&quot;&gt;U&lt;sub&gt;n&lt;/sub&gt; = U*&lt;/span&gt; il bias sparirebbe.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;prose&quot;&gt;
&lt;ul&gt;
&lt;li&gt;Le &lt;b&gt;curve concave&lt;/b&gt; sono curve di indifferenza del governo: più sono vicine al punto (U*, 0), meglio è.&lt;/li&gt;
&lt;li&gt;Le &lt;b&gt;rette decrescenti&lt;/b&gt; sono Phillips di breve periodo.&lt;/li&gt;
&lt;li&gt;Le &lt;b&gt;rette tratteggiate&lt;/b&gt; uniscono i punti di tangenza. Riflettono le preferenze del paese.&lt;/li&gt;
&lt;li&gt;E&lt;sub&gt;G&lt;/sub&gt; ed E&lt;sub&gt;I&lt;/sub&gt; stanno sulla verticale U&lt;sub&gt;n&lt;/sub&gt;, con stessa disoccupazione e inflazione diversa. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;figure class=&quot;fig&quot; id=&quot;bg&quot;&gt;&lt;div class=&quot;split&quot;&gt;
&lt;div&gt;&lt;svg id=&quot;bgsvg&quot; viewBox=&quot;0 0 520 410&quot; role=&quot;img&quot; aria-label=&quot;Grafico inflazione e disoccupazione con gli equilibri di Germania, Italia e dell&#x27;unione&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;div&gt;
&lt;h4 style=&quot;margin-top:0&quot;&gt;Due paesi, una banca centrale&lt;/h4&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;&lt;span&gt;Germany: peso dell&#x27;occupazione &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;sg&quot; min=&quot;0.2&quot; max=&quot;1&quot; step=&quot;0.05&quot; value=&quot;0.45&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;span&gt;Italy: peso dell&#x27;occupazione &lt;output&gt;&lt;/output&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;si&quot; min=&quot;1&quot; max=&quot;2.2&quot; step=&quot;0.05&quot; value=&quot;1.7&quot;&gt;&lt;/label&gt;

&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;bgread&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;figcaption&gt;Schema con numeri illustrativi costruito sulla slide 8. Il punto E&lt;sub&gt;U&lt;/sub&gt; è la media delle preferenze. &lt;span class=&quot;add&quot;&gt;aggiunta&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3&gt;Che cosa succede quando entrano nell&#x27;unione&lt;/h3&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Prima&lt;/h4&gt;&lt;p&gt;La Germany ha inflazione bassa, l&#x27;Italy alta, per preferenze diverse tra inflazione e disoccupazione. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Dopo&lt;/h4&gt;&lt;p&gt;Decidono insieme. L&#x27;inflazione riflette la media delle preferenze e si colloca tra E&lt;sub&gt;I&lt;/sub&gt; ed E&lt;sub&gt;G&lt;/sub&gt;. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Chi vince&lt;/h4&gt;&lt;p&gt;La Germany perde welfare, l&#x27;Italy lo guadagna. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Cosa chiede la Germany&lt;/h4&gt;&lt;p&gt;Prove che l&#x27;Italy abbia la stessa preferenza per la stabilità dei prezzi, cioè il criterio (1), e una ECB clone della Bundesbank. &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Il problema di ridurre l&#x27;inflazione&lt;/h3&gt;
&lt;div class=&quot;steps fig&quot; data-steps data-layers=&quot;dis&quot;&gt;
&lt;svg viewBox=&quot;0 0 520 340&quot; role=&quot;img&quot; aria-label=&quot;Percorso di disinflazione da E I a E G&quot;&gt;
