  &lt;figcaption&gt;Schematic reconstruction of slides 24–25. C: German equilibrium. E: Italian equilibrium with a wet CB. F: Italy with German inflation and unemployment at u&lt;sub&gt;N&lt;/sub&gt;. G: the point the Italian CB would be tempted to move to if the public believed in F.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;The key question (slides 25–26).&lt;/b&gt; How can the Italian authorities make the announcement of point F &lt;em&gt;credible&lt;/em&gt;, i.e. German inflation with no higher unemployment in the long run? If they simply announce F, the public knows they would be tempted to move to G (surprise) and goes back to expecting E. Without credibility, Italian inflation stays high and recurrent devaluations are needed to remain competitive.&lt;/div&gt;

  &lt;h3&gt;Three routes, increasingly binding&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;svg viewBox=&quot;0 0 760 110&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;g data-st=&quot;0&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;220&quot; height=&quot;64&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Fixed exchange rate&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;e.g. exchange rate agreements&lt;/text&gt;&lt;/g&gt;
      &lt;g data-st=&quot;1&quot;&gt;&lt;rect x=&quot;270&quot; y=&quot;20&quot; width=&quot;220&quot; height=&quot;64&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Adopting the DM&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;like dollarisation&lt;/text&gt;&lt;/g&gt;
      &lt;g data-st=&quot;2&quot;&gt;&lt;rect x=&quot;530&quot; y=&quot;20&quot; width=&quot;220&quot; height=&quot;64&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;640&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot; font-size=&quot;14&quot;&gt;Monetary union&lt;/text&gt;&lt;text x=&quot;640&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;a new common CB&lt;/text&gt;&lt;/g&gt;
      &lt;g class=&quot;thin&quot; marker-end=&quot;url(#arr)&quot;&gt;&lt;path d=&quot;M230,52 H268&quot;/&gt;&lt;path d=&quot;M490,52 H528&quot;/&gt;&lt;/g&gt;
      &lt;text x=&quot;380&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--ink2)&quot; style=&quot;font-style:italic&quot;&gt;increasingly binding →&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;steptext&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;template&gt;
      &lt;p&gt;&lt;b&gt;1. Moving to a fixed exchange rate.&lt;/b&gt; Under a fixed exchange rate, competitiveness cannot be regained by devaluing: excess inflation is paid for with lower exports, which makes inflating more costly. This is more credible than a mere inflation announcement, &lt;b&gt;but not fully so&lt;/b&gt;: the temptation remains to create surprise inflation, or to devalue and change the announced parity (a &lt;span class=&quot;term&quot;&gt;realignment&lt;/span&gt;).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;2. Abandoning the lira for the Mark.&lt;/b&gt; Italy “borrows” the preferences and credibility of the Bundesbank and enjoys its low inflation. The slides draw an analogy with the &lt;span class=&quot;term&quot;&gt;dollarization&lt;/span&gt; (unilateral adoption of the US dollar as the national currency) of small Latin American economies, or with the use of the euro in Kosovo and Montenegro. In this case the Italian authorities &lt;span class=&quot;term&quot;&gt;tie their hands&lt;/span&gt;, in the phrase of Giavazzi and Pagano.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;3. Creating a GER–ITA monetary union.&lt;/b&gt; This is a more complex option: a monetary union has a &lt;b&gt;new&lt;/b&gt; central bank, which must build its own reputation from scratch. There is a gain if the new CB is more credible than the national one: this was the case for several European countries with the ECB.&lt;/p&gt;
    &lt;/template&gt;
  &lt;/div&gt;

  &lt;h3&gt;From E to F: a costly disinflation&lt;/h3&gt;
  &lt;p&gt;The move from E to F was &lt;b&gt;neither painless nor quick&lt;/b&gt;. One of the &lt;span class=&quot;term&quot;&gt;Maastricht convergence criteria&lt;/span&gt; (the conditions set by the Maastricht Treaty for joining the euro) requires inflation to be no more than &lt;b&gt;1.5 percentage points&lt;/b&gt; above the average of the &lt;b&gt;three countries with the lowest inflation&lt;/b&gt;. Countries had almost &lt;b&gt;10 years&lt;/b&gt; to converge, and the policies adopted in order to join were also a &lt;em&gt;signal&lt;/em&gt; that policy makers&#x27; preferences were changing.&lt;/p&gt;

  &lt;div class=&quot;stepper&quot; data-stepper data-cumulative&gt;
    &lt;svg viewBox=&quot;0 0 460 300&quot; role=&quot;img&quot; aria-label=&quot;Italy&#x27;s disinflation path from E to F&quot;&gt;
      &lt;line class=&quot;axis&quot; x1=&quot;50&quot; y1=&quot;270&quot; x2=&quot;440&quot; y2=&quot;270&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;line class=&quot;axis&quot; x1=&quot;50&quot; y1=&quot;270&quot; x2=&quot;50&quot; y2=&quot;14&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;text x=&quot;435&quot; y=&quot;292&quot; font-size=&quot;12&quot; text-anchor=&quot;end&quot;&gt;U&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;I&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;22&quot; font-size=&quot;12&quot;&gt;ṗ&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;I&lt;/tspan&gt;&lt;/text&gt;
      &lt;line x1=&quot;230&quot; y1=&quot;20&quot; x2=&quot;230&quot; y2=&quot;270&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;text x=&quot;222&quot; y=&quot;290&quot; font-size=&quot;12&quot;&gt;u&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;N&lt;/tspan&gt;&lt;/text&gt;
      &lt;path d=&quot;M150,30 Q250,40 290,140&quot; class=&quot;thin&quot; stroke-width=&quot;1.4&quot;/&gt;
      &lt;line x1=&quot;200&quot; y1=&quot;30&quot; x2=&quot;420&quot; y2=&quot;250&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;circle cx=&quot;230&quot; cy=&quot;60&quot; r=&quot;5&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;238&quot; y=&quot;54&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;E&lt;/text&gt;
      &lt;circle cx=&quot;230&quot; cy=&quot;220&quot; r=&quot;5&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;238&quot; y=&quot;216&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;F&lt;/text&gt;
      &lt;text x=&quot;238&quot; y=&quot;264&quot; font-size=&quot;12&quot;&gt;A&lt;/text&gt;
      &lt;g data-st=&quot;1&quot;&gt;&lt;path d=&quot;M234,64 L306,136&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;circle cx=&quot;310&quot; cy=&quot;140&quot; r=&quot;5&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;318&quot; y=&quot;136&quot; font-size=&quot;12&quot;&gt;u ↑&lt;/text&gt;&lt;/g&gt;
      &lt;g data-st=&quot;2&quot;&gt;&lt;line x1=&quot;160&quot; y1=&quot;50&quot; x2=&quot;380&quot; y2=&quot;270&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;1.2&quot; class=&quot;dash&quot;/&gt;&lt;path d=&quot;M308,144 L284,166&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;circle cx=&quot;280&quot; cy=&quot;170&quot; r=&quot;5&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;/g&gt;
      &lt;g data-st=&quot;3&quot;&gt;&lt;line x1=&quot;120&quot; y1=&quot;66&quot; x2=&quot;324&quot; y2=&quot;270&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;1.2&quot; class=&quot;dash&quot;/&gt;&lt;path d=&quot;M278,174 L256,194&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;circle cx=&quot;252&quot; cy=&quot;198&quot; r=&quot;5&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;/g&gt;
      &lt;g data-st=&quot;4&quot;&gt;&lt;line x1=&quot;90&quot; y1=&quot;80&quot; x2=&quot;280&quot; y2=&quot;270&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.6&quot; class=&quot;dash&quot;/&gt;&lt;path d=&quot;M250,202 L236,214&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;circle cx=&quot;230&quot; cy=&quot;220&quot; r=&quot;8&quot; fill=&quot;none&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;steptext&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;template&gt;
      &lt;p&gt;&lt;b&gt;Starting point: E.&lt;/b&gt; Italy is in the high-inflation equilibrium, on the short-run Phillips curve (red) consistent with high expectations.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Monetary tightening.&lt;/b&gt; Inflation falls but expectations remain high (contracts already set, credibility still low): the economy moves down &lt;em&gt;along&lt;/em&gt; the short-run Phillips curve and &lt;b&gt;unemployment rises&lt;/b&gt; above u&lt;sub&gt;N&lt;/sub&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Expectations start to fall.&lt;/b&gt; Only as the public comes to believe in the new policy does the short-run Phillips curve shift down and unemployment recede.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Gradual adjustment.&lt;/b&gt; Each fall in expectations shifts the curve again. Meanwhile, as the slides note, unemployment had become a serious problem in Europe.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Arrival: F.&lt;/b&gt; Inflation at the German level and unemployment back at u&lt;sub&gt;N&lt;/sub&gt;. The credibility gain is permanent, but the cost of the transition was real.&lt;/p&gt;
    &lt;/template&gt;
  &lt;/div&gt;

  &lt;h3&gt;Conclusions (slide 29)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;b&gt;The gain.&lt;/b&gt; Joining a monetary union pays off if the new CB is more credible than the national one: it helps to reduce inflation. This was the case for some European countries.&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-color:var(--accent)&quot;&gt;&lt;b&gt;The downside.&lt;/b&gt; In a monetary union without a &lt;span class=&quot;term&quot;&gt;budgetary union&lt;/span&gt; or other safeguards, the CB&#x27;s independence from governments can have adverse effects: it makes possible &lt;span class=&quot;term&quot;&gt;self-fulfilling debt crises&lt;/span&gt; (debt crises in which the very fear of default brings it about). This is the topic of the next lecture.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Self-assessment&lt;/div&gt;&lt;h3&gt;Check part 5&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why did Italy have to devalue repeatedly when the two CBs differed?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The wet CB leads to an equilibrium with higher inflation than in Germany. The inflation differential erodes Italy&#x27;s price competitiveness, which it regains by devaluing the lira.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is a fixed exchange rate not enough to make F fully credible?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because the temptation remains both to create surprise inflation and to devalue by changing the announced parity. It is more credible than an inflation announcement, but it is not irreversible.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between adopting the Mark and creating a monetary union with Germany?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;By adopting the Mark, Italy borrows an existing reputation (that of the Bundesbank). In a monetary union a new CB is created, which must build its own reputation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;State the Maastricht inflation criterion cited in the slides.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Inflation no more than 1.5 percentage points above the average of the three countries with the lowest inflation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why did the move from E to F raise unemployment?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because inflation expectations fell slowly: with expectations still high, reducing actual inflation means moving along the short-run Phillips curve towards higher unemployment, until the curve shifts down.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;fonti&quot; class=&quot;part ext-c&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;↗&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Further reading&lt;/div&gt;&lt;h2&gt;Authors, studies and rules cited in the slides&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Every entry is cited in the slides &lt;span class=&quot;badge sl&quot;&gt;slides&lt;/span&gt;. Bibliographic details, descriptions and links come from web searches &lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;: they are kept separate from the slide content and should be checked against the source.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Kydland, F. E. &amp;amp; Prescott, E. C. (1977), “Rules Rather than Discretion: The Inconsistency of Optimal Plans”&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slides 5, 22&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; &lt;i&gt;Journal of Political Economy&lt;/i&gt;, 85(3), pp. 473–492, DOI 10.1086/260580.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; it shows that discretionary policy, even with a fixed social objective and full knowledge of policy effects, does not maximise that objective, because economic policy is a game against rational agents and not a “game against nature”. Hence the case for rules.&lt;br&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the paper that gave rise to the concept of time inconsistency on which the whole lecture is based.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://doi.org/10.1086/260580&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;doi.org/10.1086/260580&lt;/a&gt; · &lt;a href=&quot;https://www.econbiz.de/Record/rules-rather-than-discretion-the-inconsistency-of-optimal-plans/10002347684&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconBiz record&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;2004 Nobel Prize in Economic Sciences — Kydland and Prescott&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 5&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; Awarded by the Royal Swedish Academy of Sciences “for their contributions to dynamic macroeconomics: the time consistency of economic policy and the driving forces behind business cycles”.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the press release and the popular information sheet explain that a policy announced as optimal is often not implemented afterwards, and that such temptations can trap the economy in high inflation with no effect on unemployment. The sheet also uses this to explain the failure of anti-inflation policy in the 1970s.&lt;br&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is an official, accessible summary of the lecture&#x27;s core idea.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.nobelprize.org/prizes/economic-sciences/2004/press-release/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Press release (nobelprize.org)&lt;/a&gt; · &lt;a href=&quot;https://www.nobelprize.org/nobel_prizes/economic-sciences/laureates/2004/popular.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Popular information&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Barro, R. J. &amp;amp; Gordon, D. B. (1983a), “A Positive Theory of Monetary Policy in a Natural Rate Model”&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slides 5, 22&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; &lt;i&gt;Journal of Political Economy&lt;/i&gt;, 91(4), pp. 589–610; first version: NBER Working Paper 807 (1981).&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; a discretionary policy maker may create surprise inflation to reduce unemployment and raise revenue. If the public knows the policy maker&#x27;s objectives, surprises cannot be systematic: average inflation turns out to be excessive and depends on the slope of the Phillips curve, the relative cost of unemployment and inflation, and the natural rate. A rule that constrains future choices improves outcomes.&lt;br&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the lecture&#x27;s “BG model”, with the two incentives of section 2.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.nber.org/papers/w0807&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER w0807 (pdf available)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Barro, R. J. &amp;amp; Gordon, D. B. (1983b), “Rules, Discretion and Reputation in a Model of Monetary Policy”&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slides 5, 22&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; &lt;i&gt;Journal of Monetary Economics&lt;/i&gt;, 12(1), pp. 101–121; NBER Working Paper 1079.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; it compares discretion and rules and shows that reputation, in a repeated game, can partly substitute for a formal rule. The reputational equilibrium lies between the discretionary outcome and the ideal rule, and is closer to discretion if the policy maker discounts the future heavily.&lt;br&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it introduces the “CB reputation” listed among the lecture&#x27;s objectives.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.nber.org/papers/w1079&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER w1079 (pdf available)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Rogoff, K. (1985), “The Optimal Degree of Commitment to an Intermediate Monetary Target”&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 22&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; &lt;i&gt;Quarterly Journal of Economics&lt;/i&gt;, 100(4), pp. 1169–1189, DOI 10.2307/1885679.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; society can be better off by appointing a central banker who places “too large” a weight on inflation relative to employment. Time-consistent inflation falls, but employment variability increases when supply shocks are large.&lt;br&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the &lt;em&gt;delegation&lt;/em&gt; solution and the theoretical basis for independent, conservative central banks such as the ECB.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://ideas.repec.org/a/oup/qjecon/v100y1985i4p1169-1189..html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RePEc/IDEAS record&lt;/a&gt; · &lt;a href=&quot;https://rogoff.scholars.harvard.edu/publications/optimal-degree-commitment-intermediate-monetary-target&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;author&#x27;s page (Harvard)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Giavazzi, F. &amp;amp; Pagano, M. (1988), “The Advantage of Tying One&#x27;s Hands: EMS Discipline and Central Bank Credibility”&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 27&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; &lt;i&gt;European Economic Review&lt;/i&gt;, 32(5), pp. 1055–1075; first version CEPR Discussion Paper 135 (1986).&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; membership of the &lt;span class=&quot;term&quot;&gt;EMS&lt;/span&gt; (European Monetary System, the European system of semi-fixed exchange rates that preceded the euro) adds a penalty on inflation, namely the loss of competitiveness, and makes the public aware of this penalty. In this way it helps to overcome distrust of the authorities.&lt;br&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the origin of the phrase “tie their hands” and the bridge between the BG model and Italy&#x27;s choice of a fixed exchange rate and then of the euro.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://ideas.repec.org/a/eee/eecrev/v32y1988i5p1055-1075.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;RePEc/IDEAS record&lt;/a&gt; · &lt;a href=&quot;https://www.nber.org/chapters/c11684.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER reprint (pdf)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Maastricht convergence criteria — price stability&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 27&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; Treaty on European Union (Maastricht, 1992), now Art. 140 TFEU and Protocol No 13.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; a country meets the criterion if its average inflation over one year does not exceed by more than 1.5 percentage points that of the (at most) three best-performing Member States in terms of price stability. The other criteria concern public finances, the exchange rate and long-term interest rates (2-point margin). The ECB stresses that they must be met on a sustainable basis, not just at a single point in time.&lt;br&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the concrete instrument through which candidate countries moved from E to F.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.ecb.europa.eu/explainers/tell-me-more/html/join_the_euro_area.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB: What does a country need to do to join the euro area?&lt;/a&gt; · &lt;a href=&quot;https://ec.europa.eu/eurostat/statistics-explained/index.php/Glossary:Convergence_criteria&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eurostat glossary&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Phillips, A. W. (1958) and the Phillips curve&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slides 7, 8, 13&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; “The Relation Between Unemployment and the Rate of Change of Money Wage Rates in the United Kingdom, 1861–1957”, &lt;i&gt;Economica&lt;/i&gt;, 25(100), pp. 283–299.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the original empirical study on British data: it relates the growth of &lt;em&gt;money&lt;/em&gt; wages (not prices) to the level of unemployment. The expectations-“augmented” version used in the slides comes from the later debate.&lt;br&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the constraint of the BG model; the curve takes its name from this paper.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://econpapers.repec.org/RePEc:bla:econom:v:25:y:1958:i:100:p:283-299&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers record&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Unilateral euroisation: Kosovo and Montenegro&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 27&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt; Both have used the euro since 2002 without a monetary agreement with the EU.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; Montenegro and Kosovo adopted the euro unilaterally in 2002. The ECB has repeatedly restated the 2000 ECOFIN position: unilateral euroisation is not compatible with the Treaty and cannot replace the convergence process.&lt;br&gt;&lt;b&gt;Why it matters:&lt;/b&gt; it is the slides&#x27; example of “borrowing” another central bank&#x27;s credibility, at the price of having no say over monetary policy.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Montenegro_and_the_euro&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Montenegro and the euro&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/Kosovo_and_the_euro&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Kosovo and the euro&lt;/a&gt; &lt;span class=&quot;small&quot;&gt;(encyclopaedic source: use it as a starting point)&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;p class=&quot;small&quot;&gt;I could not consult the other materials in &lt;code&gt;corso/&lt;/code&gt; (lectures, exercises, syllabus) or the model pdf cited on slide 15: the available tool does not list folder contents and the file names are not known. The links to other lectures therefore come from this presentation alone.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;
&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
&quot;use strict&quot;;
var NS=&quot;http://www.w3.org/2000/svg&quot;;
function el(tag,attrs,txt){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;return e;}
function $(id){return document.getElementById(id);}
function f1(x){return (Math.round(x*10)/10).toFixed(1).replace(&quot;.&quot;,&quot;,&quot;);}

/* Tabs */
document.querySelectorAll(&quot;[data-tabs]&quot;).forEach(function(t){
  var bs=[].slice.call(t.querySelectorAll(&quot;.tablist button&quot;));
  var ps=[].slice.call(t.children).filter(function(c){return c.classList.contains(&quot;tabpanel&quot;);});
  bs.forEach(function(b,i){b.addEventListener(&quot;click&quot;,function(){
    bs.forEach(function(x,j){x.setAttribute(&quot;aria-selected&quot;,j===i?&quot;true&quot;:&quot;false&quot;);});
    ps.forEach(function(p,j){p.hidden=(j!==i);});
  });});
});

/* Steppers */
document.querySelectorAll(&quot;[data-stepper]&quot;).forEach(function(s){
  var tpl=s.querySelector(&quot;template&quot;);if(!tpl)return;
  var steps=[].slice.call(tpl.content.children);
  var box=s.querySelector(&quot;.steptext&quot;),dots=s.querySelector(&quot;.dots&quot;);
  var prev=s.querySelector(&quot;[data-prev]&quot;),next=s.querySelector(&quot;[data-next]&quot;);
  var gs=[].slice.call(s.querySelectorAll(&quot;[data-st]&quot;));
  var cum=s.hasAttribute(&quot;data-cumulative&quot;);
  dots.innerHTML=steps.map(function(){return &quot;&lt;i&gt;&lt;/i&gt;&quot;;}).join(&quot;&quot;);
  var k=0;
  function show(){
    box.innerHTML=&quot;&quot;;box.appendChild(steps[k].cloneNode(true));
    [].forEach.call(dots.children,function(d,i){d.classList.toggle(&quot;on&quot;,i&lt;=k);});
    prev.disabled=(k===0);next.disabled=(k===steps.length-1);
    gs.forEach(function(g){var on=(+g.getAttribute(&quot;data-st&quot;)&lt;=k);g.style.transition=&quot;opacity .35s&quot;;g.style.opacity=on?1:(cum?0:0.22);});
  }
  prev.addEventListener(&quot;click&quot;,function(){if(k&gt;0){k--;show();}});
  next.addEventListener(&quot;click&quot;,function(){if(k&lt;steps.length-1){k++;show();}});
  show();
});

/* Phillips curve chart */
(function(){
  var g=$(&quot;pcDyn&quot;);if(!g)return;
  var b=1.2,uN=5;
  function X(u){return 50+u*36;} function Y(p){return 260-p*24;}
  var pe=$(&quot;pcPe&quot;),pp=$(&quot;pcP&quot;);
  function line(peV,attrs){var u0=0,u1=10;g.appendChild(el(&quot;line&quot;,Object.assign({x1:X(u0),y1:Y(peV+b*(uN-u0)),x2:X(u1),y2:Y(peV+b*(uN-u1))},attrs)));}
  function draw(){
    var e=+pe.value,p=+pp.value;$(&quot;pcPeO&quot;).textContent=f1(e);$(&quot;pcPO&quot;).textContent=f1(p);
    g.innerHTML=&quot;&quot;;
    [0,3,6].forEach(function(v){line(v,{stroke:&quot;var(--rule)&quot;,&quot;stroke-width&quot;:1.2});});
    line(e,{stroke:&quot;var(--ochre)&quot;,&quot;stroke-width&quot;:2.4});
    var u=uN-(p-e)/b; var uc=Math.max(0,Math.min(10,u));
    g.appendChild(el(&quot;line&quot;,{x1:50,y1:Y(p),x2:X(uc),y2:Y(p),stroke:&quot;var(--ink2)&quot;,&quot;stroke-dasharray&quot;:&quot;4 4&quot;}));
    g.appendChild(el(&quot;line&quot;,{x1:X(uc),y1:Y(p),x2:X(uc),y2:260,stroke:&quot;var(--ink2)&quot;,&quot;stroke-dasharray&quot;:&quot;4 4&quot;}));
    g.appendChild(el(&quot;circle&quot;,{cx:X(uc),cy:Y(p),r:6,fill:&quot;var(--accent)&quot;}));
    g.appendChild(el(&quot;circle&quot;,{cx:X(uN),cy:Y(e),r:4,fill:&quot;var(--ochre)&quot;}));
    g.appendChild(el(&quot;text&quot;,{x:X(10)-4,y:Y(e+b*(uN-10))-6,&quot;text-anchor&quot;:&quot;end&quot;,&quot;font-size&quot;:11,fill:&quot;var(--ochre)&quot;},&quot;SRPC with ṗᵉ = &quot;+f1(e)));
    var s=p-e;
    $(&quot;pcRead&quot;).innerHTML=&quot;&lt;div&gt;&lt;span&gt;Surprise ṗ − ṗᵉ&lt;/span&gt;&lt;b&gt;&quot;+f1(s)+&quot;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Unemployment u&lt;/span&gt;&lt;b&gt;&quot;+f1(u)+&quot;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;u − u&lt;sub&gt;N&lt;/sub&gt;&lt;/span&gt;&lt;b&gt;&quot;+(u-uN&gt;=0?&quot;+&quot;:&quot;&quot;)+f1(u-uN)+&quot;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Outcome&lt;/span&gt;&lt;b&gt;&quot;+(Math.abs(s)&lt;1e-9?&quot;on the LRPC&quot;:(s&gt;0?&quot;u below u&lt;sub&gt;N&lt;/sub&gt;&quot;:&quot;u above u&lt;sub&gt;N&lt;/sub&gt;&quot;))+&quot;&lt;/b&gt;&lt;/div&gt;&quot;;
  }
  pe.addEventListener(&quot;input&quot;,draw);pp.addEventListener(&quot;input&quot;,draw);draw();
})();

/* Revenue incentive */
(function(){
  var B=$(&quot;rvB&quot;),S=$(&quot;rvS&quot;);if(!B)return;
  function draw(){
    var b=+B.value,s=+S.value/100;$(&quot;rvBO&quot;).textContent=b;$(&quot;rvSO&quot;).textContent=f1(+S.value);
    var ex=b*(1-1/(1+s)),ap=b*s;
    $(&quot;rvRead&quot;).innerHTML=&quot;&lt;div&gt;&lt;span&gt;Real erosion (≈ B·surprise)&lt;/span&gt;&lt;b&gt;&quot;+f1(ap)+&quot; bn&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Real erosion (exact formula)&lt;/span&gt;&lt;b&gt;&quot;+f1(ex)+&quot; bn&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Remaining real value&lt;/span&gt;&lt;b&gt;&quot;+f1(b-ex)+&quot; bn&lt;/b&gt;&lt;/div&gt;&quot;;
    var svg=$(&quot;rvBar&quot;);svg.innerHTML=&quot;&quot;;var w=290*(b/3200),we=Math.max(w*ex/b,ex&gt;0?1.5:0);
    svg.appendChild(el(&quot;rect&quot;,{x:5,y:8,width:w,height:22,rx:4,fill:&quot;var(--ochre-bg)&quot;,stroke:&quot;var(--ochre)&quot;}));
    svg.appendChild(el(&quot;rect&quot;,{x:5+w-we,y:8,width:we,height:22,rx:2,fill:&quot;var(--accent)&quot;}));
    svg.appendChild(el(&quot;text&quot;,{x:5,y:43,&quot;font-size&quot;:10,fill:&quot;var(--ink2)&quot;},&quot;bar = debt; red part = share eroded by the surprise&quot;));
  }
  B.addEventListener(&quot;input&quot;,draw);S.addEventListener(&quot;input&quot;,draw);draw();
})();

/* Barro-Gordon lab */
(function(){
  var g=$(&quot;bgDyn&quot;);if(!g)return;
  var lab=$(&quot;bgLab&quot;);
  var R=$(&quot;bgR&quot;),Bs=$(&quot;bgB&quot;),G=$(&quot;bgG&quot;);
  var pe=0,trail=[];
  function X(u){return 50+u*43;} function Y(p){return 280-p*21;}
  function arc(L,r,attrs){
    if(L&lt;=0)return;var a=Math.sqrt(L/r),c=Math.sqrt(L),d=&quot;&quot;;
    for(var i=0;i&lt;=48;i++){var t=i/48*Math.PI/2;d+=(i?&quot;L&quot;:&quot;M&quot;)+X(a*Math.cos(t)).toFixed(1)+&quot;,&quot;+Y(c*Math.sin(t)).toFixed(1);}
    g.appendChild(el(&quot;path&quot;,Object.assign({d:d,fill:&quot;none&quot;},attrs)));
  }
  function pt(u,p,col,label,rad){
    g.appendChild(el(&quot;circle&quot;,{cx:X(u),cy:Y(p),r:rad||5,fill:col}));
    if(label)g.appendChild(el(&quot;text&quot;,{x:X(u)-9,y:Y(p)-8,&quot;font-size&quot;:13,&quot;font-weight&quot;:600,&quot;text-anchor&quot;:&quot;end&quot;,fill:&quot;var(--ink)&quot;},label));
  }
  function params(){return {r:+R.value,b:+Bs.value,gap:+G.value};}
  function choice(P,e){var k=P.r/P.b;var u=(e+P.b*P.gap)/(k+P.b);return {u:u,p:k*u};}
  function draw(){
    var P=params();$(&quot;bgRO&quot;).textContent=f1(P.r);$(&quot;bgBO&quot;).textContent=f1(P.b);$(&quot;bgGO&quot;).textContent=f1(P.gap);
    var k=P.r/P.b,pE=k*P.gap,LA=P.r*P.gap*P.gap,LE=pE*pE+LA;
    var c=choice(P,pe),Lc=c.p*c.p+P.r*c.u*c.u;
    g.innerHTML=&quot;&quot;;lab.innerHTML=&quot;&quot;;
    [0.25,0.6,1.6,2.6].forEach(function(m){arc(Math.max(LE,4)*m,P.r,{stroke:&quot;var(--rule)&quot;,&quot;stroke-width&quot;:1});});
    arc(LA,P.r,{stroke:&quot;var(--ink2)&quot;,&quot;stroke-width&quot;:1.2});
    arc(LE,P.r,{stroke:&quot;var(--brick)&quot;,&quot;stroke-width&quot;:1.4});
    arc(Lc,P.r,{stroke:&quot;var(--slate)&quot;,&quot;stroke-width&quot;:1.4,&quot;stroke-dasharray&quot;:&quot;3 3&quot;});
    g.appendChild(el(&quot;line&quot;,{x1:X(P.gap),y1:Y(0),x2:X(P.gap),y2:Y(13),stroke:&quot;var(--ink)&quot;,&quot;stroke-width&quot;:1.5}));
    g.appendChild(el(&quot;line&quot;,{x1:X(0),y1:Y(0),x2:X(9),y2:Y(k*9),stroke:&quot;var(--slate)&quot;,&quot;stroke-width&quot;:1.8,&quot;stroke-dasharray&quot;:&quot;7 5&quot;}));
    g.appendChild(el(&quot;line&quot;,{x1:X(0),y1:Y(pe+P.b*P.gap),x2:X(9),y2:Y(pe+P.b*(P.gap-9)),stroke:&quot;var(--ochre)&quot;,&quot;stroke-width&quot;:2.2}));
    var names=[&quot;B&quot;,&quot;C&quot;,&quot;C₂&quot;,&quot;C₃&quot;,&quot;C₄&quot;,&quot;C₅&quot;];
    trail.forEach(function(t,i){pt(t.u,t.p,&quot;var(--ink2)&quot;,names[i]||&quot;&quot;,4);});
    pt(P.gap,0,&quot;var(--ink)&quot;,&quot;A&quot;,4.5);
    pt(P.gap,pE,&quot;var(--brick)&quot;,&quot;E&quot;,6);
    var atE=Math.abs(c.p-pE)&lt;0.06;
    if(!atE)pt(c.u,c.p,&quot;var(--accent)&quot;,names[trail.length]||&quot;…&quot;,6);
    else g.appendChild(el(&quot;circle&quot;,{cx:X(P.gap),cy:Y(pE),r:10,fill:&quot;none&quot;,stroke:&quot;var(--accent)&quot;,&quot;stroke-width&quot;:2.5}));
    var tl=el(&quot;text&quot;,{x:X(P.gap),y:298,&quot;font-size&quot;:12,&quot;text-anchor&quot;:&quot;middle&quot;},&quot;u&quot;);tl.appendChild(el(&quot;tspan&quot;,{&quot;font-size&quot;:9,dy:3},&quot;N&quot;));lab.appendChild(tl);
    $(&quot;bgRead&quot;).innerHTML=
      &quot;&lt;div&gt;&lt;span&gt;Expected inflation ṗᵉ&lt;/span&gt;&lt;b&gt;&quot;+f1(pe)+&quot;&lt;/b&gt;&lt;/div&gt;&quot;+
      &quot;&lt;div&gt;&lt;span&gt;CB choice: ṗ / u − u*&lt;/span&gt;&lt;b&gt;&quot;+f1(c.p)+&quot; / &quot;+f1(c.u)+&quot;&lt;/b&gt;&lt;/div&gt;&quot;+
      &quot;&lt;div&gt;&lt;span&gt;Equilibrium E: ṗ&lt;sub&gt;E&lt;/sub&gt; (inflation bias)&lt;/span&gt;&lt;b&gt;&quot;+f1(pE)+&quot;&lt;/b&gt;&lt;/div&gt;&quot;+
      &quot;&lt;div&gt;&lt;span&gt;Loss at A (rule)&lt;/span&gt;&lt;b&gt;&quot;+f1(LA)+&quot;&lt;/b&gt;&lt;/div&gt;&quot;+
      &quot;&lt;div&gt;&lt;span&gt;Loss at E (discretion)&lt;/span&gt;&lt;b&gt;&quot;+f1(LE)+&quot;&lt;/b&gt;&lt;/div&gt;&quot;+
      &quot;&lt;div&gt;&lt;span&gt;Status&lt;/span&gt;&lt;b&gt;&quot;+(atE?&quot;equilibrium E: no incentive to deviate&quot;:(c.u&lt;P.gap-1e-6?&quot;surprise: u &amp;lt; u&lt;sub&gt;N&lt;/sub&gt;&quot;:&quot;—&quot;))+&quot;&lt;/b&gt;&lt;/div&gt;&quot;;
  }
  function resetAll(){pe=0;trail=[];draw();}
  [R,Bs,G].forEach(function(s){s.addEventListener(&quot;input&quot;,resetAll);});
  $(&quot;bgReset&quot;).addEventListener(&quot;click&quot;,resetAll);
  $(&quot;bgStep&quot;).addEventListener(&quot;click&quot;,function(){var P=params(),c=choice(P,pe);if(Math.abs(c.p-P.r/P.b*P.gap)&lt;0.06)return;if(trail.length&lt;14)trail.push(c);pe=c.p;draw();});
  $(&quot;bgRat&quot;).addEventListener(&quot;click&quot;,function(){var P=params();pe=P.r/P.b*P.gap;draw();});
  $(&quot;bgHard&quot;).addEventListener(&quot;click&quot;,function(){R.value=0.4;resetAll();});
  $(&quot;bgWet&quot;).addEventListener(&quot;click&quot;,function(){R.value=2.5;resetAll();});
  draw();
})();
})();
&lt;/script&gt;
