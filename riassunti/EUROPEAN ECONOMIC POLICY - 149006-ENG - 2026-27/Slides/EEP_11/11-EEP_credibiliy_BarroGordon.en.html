    &lt;a href=&quot;#s4&quot;&gt;&lt;rect x=&quot;60&quot; y=&quot;338&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;362&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Hard-nosed vs wet CB&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;380&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;reaction curves&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s4&quot;&gt;&lt;rect x=&quot;340&quot; y=&quot;338&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;362&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Rules vs discretion&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;380&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;reputation · delegation&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s5&quot;&gt;&lt;rect x=&quot;620&quot; y=&quot;338&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;730&quot; y=&quot;362&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Open economy&lt;/text&gt;&lt;text x=&quot;730&quot; y=&quot;380&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;inflation differential, devaluations&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s5&quot;&gt;&lt;rect x=&quot;340&quot; y=&quot;438&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;462&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Tying one&#x27;s hands&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;480&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;fixed peg · EMU · Maastricht&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s5&quot;&gt;&lt;text x=&quot;450&quot; y=&quot;540&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; fill=&quot;var(--brick)&quot; style=&quot;font-style:italic&quot;&gt;→ next lecture: self-fulfilling debt crises&lt;/text&gt;&lt;/a&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s1&quot; class=&quot;part sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slides 1–6&lt;/div&gt;&lt;h2&gt;Credibility and time inconsistency&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;h3&gt;Where the problem comes from: devaluation has a price&lt;/h3&gt;
  &lt;p&gt;The slides start from a link with the theory of monetary union. A country with its own currency can respond to an &lt;span class=&quot;term&quot;&gt;asymmetric permanent shock&lt;/span&gt; (a shock that hits only that country, or hits it harder than the others, and does not fade away on its own) by devaluing: the currency loses value, the country&#x27;s goods become cheaper abroad and competitiveness is restored.&lt;/p&gt;
  &lt;p&gt;If devaluations become &lt;em&gt;recurrent&lt;/em&gt;, however, the country loses &lt;span class=&quot;term&quot;&gt;control of inflation&lt;/span&gt;, which is the primary objective of monetary policy. A country that loses price stability also loses the &lt;span class=&quot;term&quot;&gt;credibility of monetary policy&lt;/span&gt;: nobody believes the central bank&#x27;s announcements any more.&lt;/p&gt;

  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 860 150&quot; role=&quot;img&quot; aria-label=&quot;Chain: asymmetric shock, devaluations, inflation, loss of credibility, EMU&quot;&gt;
    &lt;g font-size=&quot;13.5&quot;&gt;
      &lt;rect x=&quot;4&quot; y=&quot;34&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;79&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Asymmetric&lt;/text&gt;&lt;text x=&quot;79&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;permanent shock&lt;/text&gt;
      &lt;rect x=&quot;178&quot; y=&quot;34&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;253&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Recurrent&lt;/text&gt;&lt;text x=&quot;253&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;devaluations&lt;/text&gt;
      &lt;rect x=&quot;352&quot; y=&quot;34&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;427&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Inflation&lt;/text&gt;&lt;text x=&quot;427&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;out of control&lt;/text&gt;
      &lt;rect x=&quot;526&quot; y=&quot;34&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--accent-soft)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;601&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Credibility&lt;/text&gt;&lt;text x=&quot;601&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;lost&lt;/text&gt;
      &lt;rect x=&quot;700&quot; y=&quot;34&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;775&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Joining EMU&lt;/text&gt;&lt;text x=&quot;775&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;= regaining it&lt;/text&gt;
      &lt;g class=&quot;thin&quot; marker-end=&quot;url(#arr)&quot;&gt;&lt;path d=&quot;M154,69 H176&quot;/&gt;&lt;path d=&quot;M328,69 H350&quot;/&gt;&lt;path d=&quot;M502,69 H524&quot;/&gt;&lt;path d=&quot;M676,69 H698&quot;/&gt;&lt;/g&gt;
      &lt;text x=&quot;430&quot; y=&quot;135&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot; style=&quot;font-style:italic&quot;&gt;The lecture explains the last arrow: why joining EMU was, for many countries, a way of regaining credibility&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;p&gt;The lecture is organised around two guiding questions (slide 3):&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;b&gt;①&lt;/b&gt; Why do the credibility of monetary policy and &lt;span class=&quot;term&quot;&gt;CB reputation&lt;/span&gt; (the reputation of the central bank, CB = central bank) matter?&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;b&gt;②&lt;/b&gt; How is monetary credibility gained by joining the &lt;span class=&quot;term&quot;&gt;EMU&lt;/span&gt; (Economic and Monetary Union)?&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;callout link&quot;&gt;&lt;p&gt;The topic of asymmetric shocks and of the cost of giving up the exchange rate is the basis of &lt;span class=&quot;term&quot;&gt;optimum currency area&lt;/span&gt; theory, covered in earlier lectures of the course. &lt;span class=&quot;small&quot;&gt;I could not open the other files in &lt;code&gt;corso/&lt;/code&gt;: the available tool cannot list folder contents. The link comes from slide 2 of this lecture, which takes the topic as known.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Time inconsistency: promising today, reneging tomorrow&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Time inconsistency&lt;/b&gt;. A plan is &lt;em&gt;time-inconsistent&lt;/em&gt; when the best choice announced &lt;em&gt;beforehand&lt;/em&gt; is no longer the best one &lt;em&gt;after&lt;/em&gt; others have made their decisions on the basis of the announcement. In the words of the slides: “policy makers find it optimal to announce a commitment to a particular policy and deviate from it &lt;b&gt;after&lt;/b&gt; the people have made their decisions based on the announcement”.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Credibility problem&lt;/b&gt;. The government announces a move. If it later has the chance to achieve a better short-run outcome, it takes it, even at the cost of “cheating” the public. Rational agents know this, &lt;em&gt;anticipate&lt;/em&gt; the cheating and adjust their &lt;span class=&quot;term&quot;&gt;response functions&lt;/span&gt; (the way they react to policy).&lt;/div&gt;

  &lt;p&gt;The slides point out that these dynamics arise in a great many economic and social settings. Choose an example:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Public debt&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Fixed exchange rate&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Zero taxes&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Exams&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div&gt;&lt;b&gt;Announcement&lt;/b&gt;&lt;br&gt;The government issues bonds to spend more than it collects and promises to repay them.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Ex post temptation&lt;/b&gt;&lt;br&gt;If a severe crisis hits, the pressure to &lt;span class=&quot;term&quot;&gt;default&lt;/span&gt; (not repay) is strong.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;If nobody believes it&lt;/b&gt;&lt;br&gt;Investors do not buy the bonds, or buy them only in exchange for a risk premium.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div&gt;&lt;b&gt;Announcement&lt;/b&gt;&lt;br&gt;The country enters a &lt;span class=&quot;term&quot;&gt;fixed exchange rate regime&lt;/span&gt;.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Ex post temptation&lt;/b&gt;&lt;br&gt;Faced with a severe &lt;span class=&quot;term&quot;&gt;balance of payments&lt;/span&gt; shock, devalue.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;If nobody believes it&lt;/b&gt;&lt;br&gt;Markets bet on a devaluation: the parity remains fragile and interest rates rise.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div&gt;&lt;b&gt;Announcement&lt;/b&gt;&lt;br&gt;To encourage innovation, a zero-tax regime for a sector.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Ex post temptation&lt;/b&gt;&lt;br&gt;Once the sector prospers, tax it anyway.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;If nobody believes it&lt;/b&gt;&lt;br&gt;Firms do not invest in &lt;span class=&quot;term&quot;&gt;R&amp;amp;D&lt;/span&gt; (research and development).&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div&gt;&lt;b&gt;Announcement&lt;/b&gt;&lt;br&gt;The lecturer announces an exam so that students study.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Ex post temptation&lt;/b&gt;&lt;br&gt;Once the students have studied, the “best” option would be not to hold it: everyone saves time and effort.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;If nobody believes it&lt;/b&gt;&lt;br&gt;Students do not study in the first place.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;callout idea&quot;&gt;&lt;p&gt;The mechanism is always the same: an announcement works &lt;em&gt;only if it is also credible for the future&lt;/em&gt;. If it is not, it changes agents&#x27; choices from the outset and the announcement becomes useless.&lt;/p&gt;&lt;/div&gt;

  &lt;h4&gt;The credibility game, step by step&lt;/h4&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;svg viewBox=&quot;0 0 760 120&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;60&quot; x2=&quot;720&quot; y2=&quot;60&quot; class=&quot;axis&quot;/&gt;
      &lt;g data-st=&quot;0&quot;&gt;&lt;circle cx=&quot;90&quot; cy=&quot;60&quot; r=&quot;11&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;t₀ announcement&lt;/text&gt;&lt;/g&gt;
      &lt;g data-st=&quot;1&quot;&gt;&lt;circle cx=&quot;290&quot; cy=&quot;60&quot; r=&quot;11&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;t₁ the public decides&lt;/text&gt;&lt;/g&gt;
      &lt;g data-st=&quot;2&quot;&gt;&lt;circle cx=&quot;490&quot; cy=&quot;60&quot; r=&quot;11&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;t₂ the CB can deviate&lt;/text&gt;&lt;/g&gt;
      &lt;g data-st=&quot;3&quot;&gt;&lt;circle cx=&quot;680&quot; cy=&quot;60&quot; r=&quot;11&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;680&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;anticipation&lt;/text&gt;&lt;/g&gt;
      &lt;text x=&quot;90&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;“0% inflation”&lt;/text&gt;
      &lt;text x=&quot;290&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;wages, contracts, bonds&lt;/text&gt;
      &lt;text x=&quot;490&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;inflation surprise&lt;/text&gt;
      &lt;text x=&quot;680&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;high πᵉ from t₁&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;steptext&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;template&gt;
      &lt;p&gt;&lt;b&gt;t₀ – Announcement.&lt;/b&gt; The central bank announces: “inflation will be zero”. If everyone believed it, this would be the socially best outcome.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;t₁ – The public decides.&lt;/b&gt; Workers and firms set wages and prices in contracts, savers buy fixed-rate bonds: all on the basis of expected inflation (πᵉ = 0).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;t₂ – The temptation.&lt;/b&gt; Contracts are now locked in. A little unexpected inflation lowers real wages (firms hire, unemployment falls) and reduces the real value of public debt. Deviating pays off: the announcement was &lt;em&gt;time-inconsistent&lt;/em&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Rational anticipation.&lt;/b&gt; Rational agents see through the “trick” already at t₁ and expect high inflation from the start. Result: high inflation and &lt;em&gt;no&lt;/em&gt; employment gain. This is the equilibrium formalised by the Barro-Gordon model (section 3).&lt;/p&gt;
    &lt;/template&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Self-assessment&lt;/div&gt;&lt;h3&gt;Check part 1&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why do recurrent devaluations undermine the credibility of monetary policy?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Each devaluation raises the prices of imported goods and hence inflation. If the country devalues every time it suffers a shock, it loses control of inflation, i.e. the primary objective of monetary policy. Agents stop believing announcements of price stability.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Define time inconsistency in the words of the slides.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The policy maker finds it optimal to announce a commitment and then deviate from it &lt;b&gt;after&lt;/b&gt; the public has made its decisions on the basis of the announcement.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In the exam example, what harm does a non-credible announcement do?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;If students expect that the exam will not take place, they do not study in the first place: the announcement no longer has the effect it was meant to have. In the same way, investors do not buy bonds and firms do not undertake R&amp;amp;D.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What do rational agents do when faced with a government tempted to “cheat”?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;They anticipate the attempt and adjust their response functions, i.e. their expectations and behaviour, so that the surprise no longer works.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s2&quot; class=&quot;part ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slides 7–10, 13&lt;/div&gt;&lt;h2&gt;Why the central bank has an incentive to surprise&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;p&gt;Why would an authority deviate from what it has announced? The slides give two reasons: the &lt;b&gt;Phillips curve&lt;/b&gt; (higher employment) and the &lt;b&gt;revenue incentive&lt;/b&gt; (lower real debt).&lt;/p&gt;

  &lt;h3&gt;1 · The expectations-augmented Phillips curve&lt;/h3&gt;
  &lt;p&gt;The &lt;span class=&quot;term&quot;&gt;Phillips curve&lt;/span&gt; describes a short-run relationship: &lt;em&gt;higher inflation goes together with lower unemployment&lt;/em&gt; or, equivalently, with higher output and employment. If the CB can influence inflation and also cares about real objectives such as employment, it is tempted to exploit this relationship.&lt;/p&gt;
  &lt;p class=&quot;small&quot;&gt;Notation of the slides: &lt;span class=&quot;v&quot;&gt;ṗ&lt;/span&gt; (“p dot”) is the inflation rate, i.e. the percentage change in the price level &lt;span class=&quot;v&quot;&gt;p&lt;/span&gt;; &lt;span class=&quot;v&quot;&gt;ṗᵉ&lt;/span&gt; is &lt;em&gt;expected&lt;/em&gt; inflation; &lt;span class=&quot;v&quot;&gt;u&lt;/span&gt; is the unemployment rate; &lt;span class=&quot;v&quot;&gt;ε&lt;/span&gt; is a random shock.&lt;/p&gt;

  &lt;div class=&quot;formula&quot;&gt;ṗ = c − b·u + ṗᵉ + ε&lt;small&gt;&lt;span class=&quot;term&quot;&gt;Expectation-augmented Phillips curve&lt;/span&gt;. c, b &amp;gt; 0 are parameters; b measures how strongly inflation responds to unemployment.&lt;/small&gt;&lt;/div&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;steptext&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next step →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;template&gt;
      &lt;div&gt;&lt;p&gt;&lt;b&gt;Step 1 – Long-run equilibrium.&lt;/b&gt; In the &lt;span class=&quot;term&quot;&gt;long-run stationary equilibrium&lt;/span&gt; expectations are correct: ṗ = ṗᵉ. Substituting (with ε = 0): 0 = c − b·u.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;u = c / b = u&lt;sub&gt;N&lt;/sub&gt;&lt;small&gt;&lt;span class=&quot;term&quot;&gt;Natural rate of unemployment&lt;/span&gt;: the unemployment rate that prevails when inflation surprises nobody.&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p&gt;&lt;b&gt;Step 2 – Rewriting the short-run curve.&lt;/b&gt; Since c = b·u&lt;sub&gt;N&lt;/sub&gt;, factor out b:&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;ṗ − ṗᵉ = b·(u&lt;sub&gt;N&lt;/sub&gt; − u) + ε&lt;small&gt;The left-hand side is &lt;span class=&quot;term&quot;&gt;surprise inflation&lt;/span&gt;: the part nobody expected.&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p&gt;&lt;b&gt;Step 3 – Reading it the other way round&lt;/b&gt; (“ignoring causality issues”, i.e. without asking what causes what):&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;u = u&lt;sub&gt;N&lt;/sub&gt; − (1/b)·(ṗ − ṗᵉ) + ε&lt;small&gt;The slides write +ε; solving for u would give −ε/b, but this is merely a relabelling of the shock.&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Interpretation.&lt;/b&gt; Unemployment falls below u&lt;sub&gt;N&lt;/sub&gt; &lt;em&gt;only&lt;/em&gt; if inflation exceeds expected inflation. High but anticipated inflation yields no benefit at all.&lt;/p&gt;
    &lt;/template&gt;
  &lt;/div&gt;

  &lt;div class=&quot;callout&quot;&gt;&lt;p&gt;&lt;b&gt;The natural rate need not be optimal.&lt;/b&gt; The benefit from surprise exists because the policy maker regards u&lt;sub&gt;N&lt;/sub&gt; as &lt;em&gt;too high&lt;/em&gt; (for instance because of labour-market rigidities, taxes or subsidies). This is why its target u* lies below u&lt;sub&gt;N&lt;/sub&gt;. If u* = u&lt;sub&gt;N&lt;/sub&gt;, the temptation would disappear (see “target conservative”, section 4).&lt;/p&gt;&lt;/div&gt;

  &lt;h4&gt;Try it: shift expectations&lt;/h4&gt;
  &lt;div class=&quot;lab&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
    &lt;svg id=&quot;pcChart&quot; viewBox=&quot;0 0 440 300&quot; role=&quot;img&quot; aria-label=&quot;Short-run and long-run Phillips curves&quot;&gt;
      &lt;defs&gt;&lt;clipPath id=&quot;pcClip&quot;&gt;&lt;rect x=&quot;50&quot; y=&quot;20&quot; width=&quot;370&quot; height=&quot;240&quot;/&gt;&lt;/clipPath&gt;&lt;/defs&gt;
      &lt;g id=&quot;pcDyn&quot; clip-path=&quot;url(#pcClip)&quot;&gt;&lt;/g&gt;
      &lt;line class=&quot;axis&quot; x1=&quot;50&quot; y1=&quot;260&quot; x2=&quot;425&quot; y2=&quot;260&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;line class=&quot;axis&quot; x1=&quot;50&quot; y1=&quot;260&quot; x2=&quot;50&quot; y2=&quot;15&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;text x=&quot;420&quot; y=&quot;282&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;u&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;24&quot; font-size=&quot;13&quot;&gt;ṗ&lt;/text&gt;
      &lt;line x1=&quot;230&quot; y1=&quot;20&quot; x2=&quot;230&quot; y2=&quot;260&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;230&quot; y=&quot;278&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;u&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;N&lt;/tspan&gt;&lt;/text&gt;
      &lt;text x=&quot;236&quot; y=&quot;34&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;vertical LRPC&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Downward-sloping lines: &lt;span class=&quot;term&quot;&gt;short-run Phillips curves&lt;/span&gt;, one for each level of expected inflation. Vertical line: the &lt;span class=&quot;term&quot;&gt;long-run Phillips curve&lt;/span&gt;, the set of points with u = u&lt;sub&gt;N&lt;/sub&gt; (slide 13).&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;ctrls&quot;&gt;
      &lt;label&gt;Expected inflation ṗᵉ &lt;output id=&quot;pcPeO&quot;&gt;2.0&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pcPe&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.5&quot; value=&quot;2&quot;&gt;
      &lt;label&gt;Actual inflation ṗ &lt;output id=&quot;pcPO&quot;&gt;4.0&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pcP&quot; min=&quot;0&quot; max=&quot;9&quot; step=&quot;0.5&quot; value=&quot;4&quot;&gt;
      &lt;div class=&quot;readout&quot; id=&quot;pcRead&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Set ṗ = ṗᵉ: the point returns to the vertical line. Unemployment falls below u&lt;sub&gt;N&lt;/sub&gt; only if there is a surprise.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;2 · Revenue incentive: inflation as a tax on debt&lt;/h3&gt;
  &lt;p&gt;Public debt is &lt;span class=&quot;term&quot;&gt;fixed in nominal terms&lt;/span&gt; (i.e. in euros, not in purchasing power). People hold bonds with a real value of B&lt;sub&gt;t−1&lt;/sub&gt;/P&lt;sub&gt;t−1&lt;/sub&gt;, earning a nominal return R&lt;sub&gt;t−1&lt;/sub&gt; that was set when they were bought and was deemed adequate for &lt;em&gt;expected&lt;/em&gt; inflation.&lt;/p&gt;
  &lt;p&gt;Surprise inflation reduces the real value of those bonds and therefore the government&#x27;s future real spending on interest and principal repayment. The slides note that this channel really matters when public debt is high.&lt;/p&gt;
  &lt;div class=&quot;lab&quot;&gt;
    &lt;div class=&quot;card tint&quot; style=&quot;margin:0&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Example from the slides&lt;/div&gt;
      &lt;p&gt;With debt of &lt;b&gt;2,000 billion&lt;/b&gt; and a surprise of &lt;b&gt;1%&lt;/b&gt;, the real value of the debt falls by about &lt;b&gt;20 billion&lt;/b&gt;.&lt;/p&gt;
      &lt;div class=&quot;formula&quot; style=&quot;background:var(--paper)&quot;&gt;ΔB&lt;sub&gt;real&lt;/sub&gt; ≈ B · (ṗ − ṗᵉ)&lt;small&gt;Exact: B·(1 − 1/(1+surprise)); for small surprises the two formulas give almost the same number.&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ctrls&quot;&gt;
      &lt;label&gt;Public debt (bn €) &lt;output id=&quot;rvBO&quot;&gt;2000&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rvB&quot; min=&quot;200&quot; max=&quot;3200&quot; step=&quot;100&quot; value=&quot;2000&quot;&gt;
      &lt;label&gt;Surprise inflation (%) &lt;output id=&quot;rvSO&quot;&gt;1.0&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rvS&quot; min=&quot;0&quot; max=&quot;6&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;
      &lt;div class=&quot;readout&quot; id=&quot;rvRead&quot;&gt;&lt;/div&gt;
      &lt;svg id=&quot;rvBar&quot; viewBox=&quot;0 0 300 46&quot; aria-hidden=&quot;true&quot;&gt;&lt;/svg&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;3 · But agents cannot be fooled forever&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;They learn.&lt;/b&gt; Consumers, firms and other agents update their inflation expectations over time.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;They see through the trick.&lt;/b&gt; They realise that the policy maker will try to create surprise inflation in order to raise output.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;No gain.&lt;/b&gt; Once expectations have adjusted, there is no longer any gain in output (or revenue), &lt;em&gt;not even in the short run&lt;/em&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Surprise inflation also entails &lt;b&gt;costs&lt;/b&gt;: the slides link them to “changing prices”, i.e. the costs of continually changing prices. This is why the model combines benefits and costs in a &lt;span class=&quot;term&quot;&gt;loss function&lt;/span&gt; to be minimised subject to a constraint, the Phillips curve. This is the model of section 3.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Self-assessment&lt;/div&gt;&lt;h3&gt;Check part 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Derive u&lt;sub&gt;N&lt;/sub&gt; from the curve ṗ = c − b·u + ṗᵉ.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In the long run ṗ = ṗᵉ, so c − b·u = 0 and u = c/b = u&lt;sub&gt;N&lt;/sub&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;If ṗᵉ = 3%, ṗ = 5% and b = 2, by how much does unemployment fall below u&lt;sub&gt;N&lt;/sub&gt;?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;u = u&lt;sub&gt;N&lt;/sub&gt; − (1/b)(ṗ − ṗᵉ) = u&lt;sub&gt;N&lt;/sub&gt; − (1/2)(2) = u&lt;sub&gt;N&lt;/sub&gt; − 1 percentage point.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is the revenue incentive stronger for highly indebted countries?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The gain is approximately debt × surprise: for a given surprise, the larger the nominal debt, the more real value is eroded to the government&#x27;s benefit.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why does it matter that u&lt;sub&gt;N&lt;/sub&gt; “need not be optimal”?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;If the policy maker were satisfied with u&lt;sub&gt;N&lt;/sub&gt;, it would have no reason to create surprises. The temptation arises precisely because it regards u&lt;sub&gt;N&lt;/sub&gt; as excessive (u* &amp;lt; u&lt;sub&gt;N&lt;/sub&gt;).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s3&quot; class=&quot;part slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slides 5, 11–18&lt;/div&gt;&lt;h2&gt;The Barro-Gordon model&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;The model of &lt;b&gt;Barro and Gordon (1983)&lt;/b&gt;, built on the insight of &lt;b&gt;Kydland and Prescott (1977)&lt;/b&gt;, combines two ingredients: the authority&#x27;s &lt;em&gt;preferences&lt;/em&gt; (a loss function) and the economy&#x27;s &lt;em&gt;constraint&lt;/em&gt; (the expectations-augmented Phillips curve). The result is that under &lt;span class=&quot;term&quot;&gt;discretion&lt;/span&gt; (deciding period by period, without binding commitments) the economy ends up in an equilibrium with needlessly high inflation.&lt;/p&gt;

  &lt;h3&gt;Preferences: the loss function&lt;/h3&gt;
  &lt;div class=&quot;formula&quot;&gt;L = a&lt;sub&gt;1&lt;/sub&gt;(ṗ − ṗ*)² + a&lt;sub&gt;2&lt;/sub&gt;(u − u*)²&lt;small&gt;ṗ* and u* are the inflation and unemployment &lt;em&gt;targets&lt;/em&gt;; a&lt;sub&gt;1&lt;/sub&gt;, a&lt;sub&gt;2&lt;/sub&gt; &amp;gt; 0 are the weights.&lt;/small&gt;&lt;/div&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Squared deviations.&lt;/b&gt; What matters is the distance from the target, not its sign; large deviations weigh much more than small ones.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Weights = preferences.&lt;/b&gt; Large a&lt;sub&gt;1&lt;/sub&gt;: inflation is feared. Large a&lt;sub&gt;2&lt;/sub&gt;: unemployment is feared. Different authorities have different weights.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Minimum loss at the origin.&lt;/b&gt; The &lt;span class=&quot;term&quot;&gt;bliss point&lt;/span&gt; is (u*, ṗ*): there L = 0.&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;svg viewBox=&quot;0 0 320 240&quot; role=&quot;img&quot; aria-label=&quot;Concentric indifference curves around the bliss point&quot;&gt;
      &lt;line class=&quot;axis&quot; x1=&quot;40&quot; y1=&quot;210&quot; x2=&quot;300&quot; y2=&quot;210&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;line class=&quot;axis&quot; x1=&quot;40&quot; y1=&quot;210&quot; x2=&quot;40&quot; y2=&quot;20&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;path d=&quot;M40,140 A90,70 0 0 1 130,210&quot; class=&quot;thin&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.6&quot;/&gt;
      &lt;path d=&quot;M40,105 A135,105 0 0 1 175,210&quot; class=&quot;thin&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.6&quot;/&gt;
      &lt;path d=&quot;M40,70 A180,140 0 0 1 220,210&quot; class=&quot;thin&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.6&quot;/&gt;
      &lt;text x=&quot;60&quot; y=&quot;136&quot; font-size=&quot;12&quot;&gt;I₁&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;101&quot; font-size=&quot;12&quot;&gt;I₂&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;66&quot; font-size=&quot;12&quot;&gt;I₃&lt;/text&gt;
      &lt;text x=&quot;20&quot; y=&quot;232&quot; font-size=&quot;11&quot;&gt;ṗ*, u*&lt;/text&gt;&lt;text x=&quot;292&quot; y=&quot;232&quot; font-size=&quot;12&quot;&gt;u&lt;/text&gt;&lt;text x=&quot;24&quot; y=&quot;28&quot; font-size=&quot;12&quot;&gt;ṗ&lt;/text&gt;
      &lt;text x=&quot;230&quot; y=&quot;60&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;increasing loss&lt;/text&gt;&lt;path d=&quot;M230,70 L250,110&quot; class=&quot;thin&quot; marker-end=&quot;url(#arr)&quot;/&gt;
    &lt;/svg&gt;
    &lt;div&gt;&lt;p&gt;The &lt;span class=&quot;term&quot;&gt;indifference curves&lt;/span&gt; (combinations yielding the same loss) are arcs around the bliss point. The slides call them “concave” when viewed from the origin. The farther out they lie, the higher the loss: I₁ is preferred to I₃.&lt;/p&gt;&lt;p&gt;Their &lt;b&gt;slope&lt;/b&gt; expresses how much importance is given to fighting inflation relative to unemployment, i.e. the ratio a&lt;sub&gt;2&lt;/sub&gt;/a&lt;sub&gt;1&lt;/sub&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;/figure&gt;

  &lt;h3&gt;The constraint and the equilibrium: points A, B, C, E&lt;/h3&gt;
  &lt;p&gt;The authority minimises L, but must respect the short-run Phillips curve associated with current expected inflation. The diagram of slide 14, reconstructed below, shows how expectations move the economy from A all the way to E. Move the sliders and press the buttons.&lt;/p&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
    &lt;svg id=&quot;bgChart&quot; viewBox=&quot;0 0 460 330&quot; role=&quot;img&quot; aria-label=&quot;Interactive diagram of the Barro-Gordon model&quot;&gt;
      &lt;defs&gt;&lt;clipPath id=&quot;bgClip&quot;&gt;&lt;rect x=&quot;50&quot; y=&quot;18&quot; width=&quot;390&quot; height=&quot;262&quot;/&gt;&lt;/clipPath&gt;&lt;/defs&gt;
      &lt;g id=&quot;bgDyn&quot; clip-path=&quot;url(#bgClip)&quot;&gt;&lt;/g&gt;
      &lt;line class=&quot;axis&quot; x1=&quot;50&quot; y1=&quot;280&quot; x2=&quot;445&quot; y2=&quot;280&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;line class=&quot;axis&quot; x1=&quot;50&quot; y1=&quot;280&quot; x2=&quot;50&quot; y2=&quot;12&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;text x=&quot;440&quot; y=&quot;302&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;u&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;22&quot; font-size=&quot;13&quot;&gt;ṗ&lt;/text&gt;
      &lt;text x=&quot;44&quot; y=&quot;300&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;ṗ*, u*&lt;/text&gt;
      &lt;g id=&quot;bgLab&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Arcs: indifference curves. Solid sloping line: short-run Phillips curve for current expected inflation. Dashed line: &lt;span class=&quot;term&quot;&gt;reaction curve&lt;/span&gt;, the CB&#x27;s optimal choices for every possible expectation. Vertical line: u = u&lt;sub&gt;N&lt;/sub&gt;.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;ctrls&quot;&gt;
      &lt;label&gt;Relative weight on unemployment a₂/a₁ &lt;output id=&quot;bgRO&quot;&gt;1.0&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;bgR&quot; min=&quot;0.2&quot; max=&quot;4&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;
      &lt;label&gt;Phillips slope b &lt;output id=&quot;bgBO&quot;&gt;1.0&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;bgB&quot; min=&quot;0.5&quot; max=&quot;2&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;
      &lt;label&gt;Gap u&lt;sub&gt;N&lt;/sub&gt; − u* &lt;output id=&quot;bgGO&quot;&gt;4.0&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;bgG&quot; min=&quot;0&quot; max=&quot;6&quot; step=&quot;0.5&quot; value=&quot;4&quot;&gt;
      &lt;div class=&quot;chips&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;bgHard&quot;&gt;Hard-nosed&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;bgWet&quot;&gt;Wet&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;chips&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;bgReset&quot;&gt;A · announce ṗ*&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;bgStep&quot;&gt;Adaptive: period +1&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;bgRat&quot;&gt;Rational → E&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;bgRead&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;A&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;B&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;C …&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;E&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;A = (u&lt;sub&gt;N&lt;/sub&gt;, ṗ*).&lt;/b&gt; The authority announces the target inflation rate ṗ*. If the public believes it (ṗᵉ = ṗ*), the short-run Phillips curve passes through A. But A is &lt;b&gt;not credible&lt;/b&gt;: along that curve there is a point the authority prefers, B.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;B.&lt;/b&gt; With ṗᵉ = ṗ* already locked into contracts, the authority chooses the point on the Phillips curve tangent to the lowest indifference curve: somewhat more inflation (ṗ₁) and less unemployment. This is the gain from surprise. With &lt;span class=&quot;term&quot;&gt;naïve expectations&lt;/span&gt; (which always believe the announcement) the economy stops here.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;C, and so on.&lt;/b&gt; With &lt;span class=&quot;term&quot;&gt;adaptive expectations&lt;/span&gt; (tomorrow I expect the inflation I observed today) the public sets ṗᵉ = ṗ₁. The Phillips curve shifts up, the CB surprises again (point C), and so on: the points move along the dashed reaction curve. The path in the slides is A → B → C → … → E.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;E = time-consistent equilibrium.&lt;/b&gt; With &lt;span class=&quot;term&quot;&gt;rational expectations&lt;/span&gt; (the public knows the model and the CB&#x27;s incentives) the economy moves straight to E. There the short-run Phillips curve is tangent to the indifference curve &lt;em&gt;exactly&lt;/em&gt; at u = u&lt;sub&gt;N&lt;/sub&gt;: the CB no longer has any reason to deviate from the inflation everyone expects. Unemployment is u&lt;sub&gt;N&lt;/sub&gt;, as at A, but inflation is much higher.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Inflation bias&lt;/b&gt;. In equilibrium E inflation exceeds ṗ* with no employment gain whatsoever (u = u&lt;sub&gt;N&lt;/sub&gt; in both cases). E is &lt;span class=&quot;term&quot;&gt;sub-optimal&lt;/span&gt; relative to A: L&lt;sub&gt;E&lt;/sub&gt; &amp;gt; L&lt;sub&gt;A&lt;/sub&gt;. Everyone, the central bank included, would be better off if the authority could commit in a binding way to A.&lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;The algebraic derivation (standard solution; slide 15 refers to a pdf not available here)&lt;/summary&gt;&lt;div&gt;
    &lt;p class=&quot;small&quot;&gt;The slides only say “Model – See pdf”. The derivation below is the standard textbook one, written in the notation of the slides and with ṗ* = 0 for simplicity. Check it against the lecturer&#x27;s pdf.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;1. Problem.&lt;/b&gt; Given ṗᵉ, the CB chooses ṗ to minimise L = a&lt;sub&gt;1&lt;/sub&gt;ṗ² + a&lt;sub&gt;2&lt;/sub&gt;(u − u*)² subject to the constraint u = u&lt;sub&gt;N&lt;/sub&gt; − (1/b)(ṗ − ṗᵉ).&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;2. First-order condition.&lt;/b&gt; ∂L/∂ṗ = 2a&lt;sub&gt;1&lt;/sub&gt;ṗ + 2a&lt;sub&gt;2&lt;/sub&gt;(u − u*)·(−1/b) = 0, which gives:&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;ṗ = (a&lt;sub&gt;2&lt;/sub&gt; / (a&lt;sub&gt;1&lt;/sub&gt;b)) · (u − u*)&lt;small&gt;This is the &lt;span class=&quot;term&quot;&gt;reaction curve&lt;/span&gt;: a straight line starting from the bliss point with slope a&lt;sub&gt;2&lt;/sub&gt;/(a&lt;sub&gt;1&lt;/sub&gt;b).&lt;/small&gt;&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;3. Rational expectations.&lt;/b&gt; In equilibrium ṗᵉ = ṗ, hence u = u&lt;sub&gt;N&lt;/sub&gt;. Substituting:&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;ṗ&lt;sub&gt;E&lt;/sub&gt; = (a&lt;sub&gt;2&lt;/sub&gt; / (a&lt;sub&gt;1&lt;/sub&gt;b)) · (u&lt;sub&gt;N&lt;/sub&gt; − u*)&lt;small&gt;The inflation bias increases with the weight on unemployment (a&lt;sub&gt;2&lt;/sub&gt;/a&lt;sub&gt;1&lt;/sub&gt;) and with the gap u&lt;sub&gt;N&lt;/sub&gt; − u*; it decreases if the Phillips curve is steep (large b).&lt;/small&gt;&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;4. Comparing losses.&lt;/b&gt; L&lt;sub&gt;A&lt;/sub&gt; = a&lt;sub&gt;2&lt;/sub&gt;(u&lt;sub&gt;N&lt;/sub&gt; − u*)², whereas L&lt;sub&gt;E&lt;/sub&gt; = a&lt;sub&gt;1&lt;/sub&gt;ṗ&lt;sub&gt;E&lt;/sub&gt;² + a&lt;sub&gt;2&lt;/sub&gt;(u&lt;sub&gt;N&lt;/sub&gt; − u*)² &amp;gt; L&lt;sub&gt;A&lt;/sub&gt;. The extra term is purely the cost of inflation.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;The same result is found in Barro and Gordon (1983, JPE) &lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;: equilibrium inflation depends on the slope of the Phillips curve, on the relative cost of unemployment and inflation, and on the natural rate (see &lt;a href=&quot;#fonti&quot;&gt;Further reading&lt;/a&gt;).&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Three remarks from the slides (slide 17)&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;b&gt;Inflation bias.&lt;/b&gt; E is worse than A: higher inflation and the same unemployment.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;b&gt;Rules vs discretion.&lt;/b&gt; This is the origin of the “rules versus discretion” debate: is it better for the authority to follow &lt;span class=&quot;term&quot;&gt;rules&lt;/span&gt; (fixed, binding rules) rather than decide case by case?&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;b&gt;A strong assumption.&lt;/b&gt; The model assumes &lt;span class=&quot;term&quot;&gt;rational agents with strategic behaviour&lt;/span&gt;: rational agents who reason strategically about the CB&#x27;s moves.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Self-assessment&lt;/div&gt;&lt;h3&gt;Check part 3&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Why is the announcement of point A not credible?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;If the public sets ṗᵉ = ṗ*, the authority prefers B to A (it lies on a lower indifference curve). The rational public knows this and does not believe the announcement.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What characterises point E?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It is the point at which, given ṗᵉ = ṗ&lt;sub&gt;E&lt;/sub&gt;, the CB&#x27;s optimal choice is exactly ṗ&lt;sub&gt;E&lt;/sub&gt;: there is no incentive to deviate (time-consistent equilibrium under rational expectations). It lies on u = u&lt;sub&gt;N&lt;/sub&gt;, with inflation above ṗ*.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Match expectations to points: naïve, adaptive, rational.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Naïve → B; rational → E; adaptive → the path A, B, C, …, E.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Using the formula ṗ&lt;sub&gt;E&lt;/sub&gt; = (a₂/(a₁b))(u&lt;sub&gt;N&lt;/sub&gt; − u*), compute the inflation bias for a₂/a₁ = 0.5, b = 1, u&lt;sub&gt;N&lt;/sub&gt; − u* = 4.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;ṗ&lt;sub&gt;E&lt;/sub&gt; − ṗ* = 0.5 × 4 / 1 = 2 percentage points. With a₂/a₁ = 2 it would become 8: the “wet” CB has a bias four times as large.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is it said that discretion can make everyone worse off?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because at E unemployment is the same as at A, but inflation is higher: the loss is greater both for society and for the authority itself, which would be better off if it could commit.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s4&quot; class=&quot;part slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slides 19–23&lt;/div&gt;&lt;h2&gt;The authority&#x27;s preferences and ways out&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;h3&gt;‘Hard-nosed’ versus ‘wet’&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;kicker&quot; style=&quot;color:var(--slate)&quot;&gt;Hard-nosed CB&lt;/div&gt;&lt;p&gt;A “tough” central bank: it places &lt;b&gt;a large weight on fighting inflation&lt;/b&gt; (high a&lt;sub&gt;1&lt;/sub&gt;). Its indifference curves are flattened: even a little inflation is very costly.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;kicker&quot; style=&quot;color:var(--brick)&quot;&gt;Wet CB&lt;/div&gt;&lt;p&gt;A “soft” central bank: it places &lt;b&gt;a large weight on fighting unemployment&lt;/b&gt; (high a&lt;sub&gt;2&lt;/sub&gt;). Its curves are stretched vertically: it accepts a lot of inflation in order to reduce u.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;svg viewBox=&quot;0 0 340 260&quot; role=&quot;img&quot; aria-label=&quot;Reaction curves of a hard-nosed CB and a wet CB&quot;&gt;
      &lt;line class=&quot;axis&quot; x1=&quot;40&quot; y1=&quot;230&quot; x2=&quot;320&quot; y2=&quot;230&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;line class=&quot;axis&quot; x1=&quot;40&quot; y1=&quot;230&quot; x2=&quot;40&quot; y2=&quot;14&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;line x1=&quot;220&quot; y1=&quot;20&quot; x2=&quot;220&quot; y2=&quot;230&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.4&quot;/&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;230&quot; x2=&quot;220&quot; y2=&quot;50&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2.4&quot; stroke-dasharray=&quot;8 5&quot;/&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;230&quot; x2=&quot;220&quot; y2=&quot;168&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2.4&quot; stroke-dasharray=&quot;8 5&quot;/&gt;

      &lt;text x=&quot;228&quot; y=&quot;46&quot; font-size=&quot;12&quot; fill=&quot;var(--brick)&quot; font-weight=&quot;600&quot;&gt;E wet&lt;/text&gt;
      &lt;text x=&quot;228&quot; y=&quot;164&quot; font-size=&quot;12&quot; fill=&quot;var(--slate)&quot; font-weight=&quot;600&quot;&gt;E hard-nosed&lt;/text&gt;
      &lt;text x=&quot;228&quot; y=&quot;224&quot; font-size=&quot;12&quot;&gt;A&lt;/text&gt;
      &lt;text x=&quot;214&quot; y=&quot;248&quot; font-size=&quot;12&quot;&gt;u&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;N&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;16&quot; y=&quot;250&quot; font-size=&quot;11&quot;&gt;ṗ*, u*&lt;/text&gt;&lt;text x=&quot;312&quot; y=&quot;250&quot; font-size=&quot;12&quot;&gt;u&lt;/text&gt;&lt;text x=&quot;24&quot; y=&quot;22&quot; font-size=&quot;12&quot;&gt;ṗ&lt;/text&gt;
      &lt;path d=&quot;M232,72 L232,150&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.4&quot; marker-end=&quot;url(#arr)&quot; marker-start=&quot;url(#arr)&quot;/&gt;&lt;text x=&quot;238&quot; y=&quot;114&quot; font-size=&quot;11&quot; fill=&quot;var(--accent)&quot;&gt;inflation&lt;/text&gt;&lt;text x=&quot;238&quot; y=&quot;128&quot; font-size=&quot;11&quot; fill=&quot;var(--accent)&quot;&gt;difference&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div&gt;
      &lt;p&gt;The dashed lines are the &lt;span class=&quot;term&quot;&gt;reaction curves&lt;/span&gt;: the locus of the authority&#x27;s optimal choices for each value of the constraint, i.e. for each expectation. Their &lt;b&gt;slope depends on preferences&lt;/b&gt;, a&lt;sub&gt;2&lt;/sub&gt;/(a&lt;sub&gt;1&lt;/sub&gt;b): steep for the wet CB, flat for the hard-nosed one.&lt;/p&gt;
      &lt;p&gt;Both meet the vertical line u = u&lt;sub&gt;N&lt;/sub&gt;: &lt;b&gt;hard-nosed CBs achieve lower inflation without imposing higher unemployment &lt;em&gt;in the long run&lt;/em&gt;&lt;/b&gt;. In the short run, during disinflation, there is a cost (section 5).&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Try the “Hard-nosed” and “Wet” buttons in the diagram in section 3.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Conclusion of the BG model (slide 22)&lt;/h3&gt;
  &lt;div class=&quot;callout idea&quot;&gt;&lt;p&gt;“Discretionary policymaking can make everyone worse off compared with a situation in which the government could commit to a particular policy path.” Discretion can leave everyone worse off than a government able to commit to a policy path.&lt;/p&gt;&lt;/div&gt;
  &lt;ul class=&quot;tight&quot;&gt;
    &lt;li&gt;The work of &lt;b&gt;Kydland and Prescott&lt;/b&gt; concerned not only monetary policy but every kind of public policy (taxation, debt, regulation…).&lt;/li&gt;
    &lt;li&gt;The 1983 papers by &lt;b&gt;Barro and Gordon&lt;/b&gt; focus on monetary policy and show that &lt;span class=&quot;term&quot;&gt;monetary rules&lt;/span&gt; can overcome time inconsistency.&lt;/li&gt;
    &lt;li&gt;Later, &lt;b&gt;Rogoff (1985)&lt;/b&gt; proposes &lt;span class=&quot;term&quot;&gt;delegation&lt;/span&gt;: entrusting monetary policy to an authority whose preferences differ from those of society.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Rules&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Reputation&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Delegation&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Comparison&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Binding rules.&lt;/b&gt; If the authority is bound by a rule, for example “inflation = ṗ*”, it cannot create surprises. The public knows this and the economy stays at A. The problem is making the rule truly binding, i.e. hard to change.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Reputation.&lt;/b&gt; In their second 1983 paper (Journal of Monetary Economics) Barro and Gordon show that, in a repeated game, the fear of losing reputation can partly substitute for a formal rule. The outcome lies between discretion and the ideal rule &lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Delegation to a “conservative” central banker.&lt;/b&gt; Rogoff (1985): society can be better off by appointing a central banker who places a &lt;em&gt;greater&lt;/em&gt; weight on inflation than society does. Time-consistent inflation then falls, but employment stabilisation worsens when supply shocks are large &lt;span class=&quot;badge&quot;&gt;external source&lt;/span&gt;. This is the theoretical basis for &lt;span class=&quot;term&quot;&gt;central bank independence&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Regime&lt;/th&gt;&lt;th&gt;Inflation&lt;/th&gt;&lt;th&gt;Unemployment (long run)&lt;/th&gt;&lt;th&gt;Problem&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Discretion&lt;/td&gt;&lt;td&gt;high (E)&lt;/td&gt;&lt;td&gt;u&lt;sub&gt;N&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;inflation bias&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Credible rule&lt;/td&gt;&lt;td&gt;ṗ* (A)&lt;/td&gt;&lt;td&gt;u&lt;sub&gt;N&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;who enforces the rule?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Reputation&lt;/td&gt;&lt;td&gt;between A and E&lt;/td&gt;&lt;td&gt;u&lt;sub&gt;N&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;holds only if the future matters enough&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Delegation (Rogoff)&lt;/td&gt;&lt;td&gt;lower&lt;/td&gt;&lt;td&gt;u&lt;sub&gt;N&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;less stabilisation of shocks&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Other possible preferences (slide 23)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;b&gt;Super conservative.&lt;/b&gt; The slides write “b = 0 in the loss function”: this means that the weight on unemployment is zero (in the notation L = a&lt;sub&gt;1&lt;/sub&gt;(…)² + a&lt;sub&gt;2&lt;/sub&gt;(…)², a&lt;sub&gt;2&lt;/sub&gt; = 0; here b is not the slope of the Phillips curve). The reaction curve becomes horizontal at ṗ*: &lt;b&gt;E coincides with A&lt;/b&gt;, with no inflation bias. The price is that the CB no longer responds to employment shocks.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;b&gt;Target conservative.&lt;/b&gt; The unemployment target coincides with the natural rate: &lt;b&gt;u* = u&lt;sub&gt;N&lt;/sub&gt;&lt;/b&gt;. There is nothing to gain from surprise, so ṗ&lt;sub&gt;E&lt;/sub&gt; = ṗ* (in the diagram in section 3, set u&lt;sub&gt;N&lt;/sub&gt; − u* to 0). The CB can still stabilise shocks.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;The interpretation of “b = 0” is my own: compare it with the model pdf indicated by the lecturer.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Self-assessment&lt;/div&gt;&lt;h3&gt;Check part 4&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;What is a reaction curve and what determines its slope?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It is the locus of the authority&#x27;s optimal choices for each value of the constraint (each inflation expectation). Its slope depends on preferences: the more the authority cares about unemployment (high a₂/a₁), the steeper it is.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Does a hard-nosed CB generate more unemployment than a wet one?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Not in the long run: both end up on u = u&lt;sub&gt;N&lt;/sub&gt;. The hard-nosed CB simply has lower inflation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is Rogoff&#x27;s (1985) idea?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Delegating monetary policy to a central banker who is more inflation-averse than society: this reduces the inflation bias, at the cost of less employment stabilisation in the face of shocks.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why does the inflation bias disappear when u* = u&lt;sub&gt;N&lt;/sub&gt;?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because the authority does not want to push unemployment below u&lt;sub&gt;N&lt;/sub&gt;, so it has no reason to create surprise inflation: the reaction curve passes through A.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s5&quot; class=&quot;part brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slides 24–29&lt;/div&gt;&lt;h2&gt;Open economy: Germany, Italy and EMU&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;h3&gt;Two central banks, two equilibria&lt;/h3&gt;
  &lt;p&gt;Now consider two countries: Germany, with a hard-nosed CB (the &lt;b&gt;Bundesbank&lt;/b&gt;) and hence a low-inflation equilibrium; and Italy, with a wet CB and a high-inflation equilibrium. An &lt;span class=&quot;term&quot;&gt;inflation differential&lt;/span&gt; arises: Italian prices grow faster than German ones. To avoid losing competitiveness, Italy has to &lt;b&gt;devalue repeatedly&lt;/b&gt; the lira against the Deutsche Mark (DM). This is the vicious circle of section 1.&lt;/p&gt;

      &lt;path d=&quot;M130,120 Q190,140 225,215&quot; class=&quot;thin&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;circle cx=&quot;270&quot; cy=&quot;70&quot; r=&quot;5&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;278&quot; y=&quot;66&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;E&lt;/text&gt;
      &lt;circle cx=&quot;182&quot; cy=&quot;147&quot; r=&quot;5&quot; fill=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;142&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;G&lt;/text&gt;
      &lt;circle cx=&quot;270&quot; cy=&quot;210&quot; r=&quot;5&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;278&quot; y=&quot;206&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;F&lt;/text&gt;
      &lt;circle cx=&quot;270&quot; cy=&quot;260&quot; r=&quot;4&quot; fill=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;278&quot; y=&quot;254&quot; font-size=&quot;13&quot;&gt;A&lt;/text&gt;
      &lt;path d=&quot;M300,76 L300,204&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.4&quot; marker-start=&quot;url(#arr)&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;text x=&quot;306&quot; y=&quot;140&quot; font-size=&quot;11&quot; fill=&quot;var(--accent)&quot;&gt;inflation&lt;/text&gt;&lt;text x=&quot;306&quot; y=&quot;153&quot; font-size=&quot;11&quot; fill=&quot;var(--accent)&quot;&gt;differential&lt;/text&gt;
      &lt;text x=&quot;262&quot; y=&quot;280&quot; font-size=&quot;12&quot;&gt;u&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;N&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;370&quot; y=&quot;280&quot; font-size=&quot;12&quot;&gt;U&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;I&lt;/tspan&gt;&lt;/text&gt;
    &lt;/g&gt;
