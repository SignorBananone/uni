&lt;main&gt;
&lt;section id=&quot;s1&quot; class=&quot;part sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part I · The problem &lt;span class=&quot;slides&quot;&gt;slides 2–3&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;Monetary union and credibility&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;The lecture starts from a link with earlier material in the course. An independent country hit by an &lt;span class=&quot;term&quot;&gt;asymmetric permanent shock&lt;/span&gt; (a shock that affects only that country, or affects it more than others, and does not die out on its own) can adjust by &lt;b&gt;devaluing&lt;/b&gt; its currency. If it does so &lt;b&gt;repeatedly&lt;/b&gt;, however, it loses control of inflation, which is the primary objective of monetary policy.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 150&quot; role=&quot;img&quot; aria-label=&quot;Causal chain: shock, devaluations, inflation, loss of credibility, EMU&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Asymmetric shock&lt;/text&gt;&lt;text x=&quot;85&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;sm&quot;&gt;permanent&lt;/text&gt;
        &lt;rect x=&quot;190&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;265&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Devaluations&lt;/text&gt;&lt;text x=&quot;265&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;sm&quot;&gt;recurrent&lt;/text&gt;
        &lt;rect x=&quot;370&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;445&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Inflation&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;sm&quot;&gt;out of control&lt;/text&gt;
        &lt;rect x=&quot;550&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;625&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Credibility lost&lt;/text&gt;&lt;text x=&quot;625&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;sm&quot;&gt;of monetary policy&lt;/text&gt;
        &lt;rect x=&quot;730&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;810&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Joining EMU&lt;/text&gt;&lt;text x=&quot;810&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;sm&quot;&gt;= regaining it&lt;/text&gt;
        &lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;path d=&quot;M162,73h24M342,73h24M522,73h24M702,73h24&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;/g&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;The two questions of the lecture&lt;/h4&gt;
      &lt;ol&gt;&lt;li&gt;Why do the &lt;b&gt;credibility&lt;/b&gt; of monetary policy and the &lt;b&gt;reputation&lt;/b&gt; of the central bank (CB) matter?&lt;/li&gt;
      &lt;li&gt;How can a country &lt;b&gt;gain credibility&lt;/b&gt; by joining EMU?&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Credibility, in plain terms&lt;/h4&gt;
      &lt;p&gt;A policy is &lt;dfn&gt;credible&lt;/dfn&gt; when the public genuinely expects it to be implemented, and therefore sets wages, prices and interest rates in line with the announcement. &lt;dfn&gt;Reputation&lt;/dfn&gt; is credibility accumulated over time through past behaviour.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;The first point refers back to earlier lectures on the &lt;span class=&quot;term&quot;&gt;optimum currency area&lt;/span&gt;: there, a flexible exchange rate was the instrument for adjusting to asymmetric shocks. Here we see the &lt;b&gt;cost&lt;/b&gt; of that instrument. I could not open the other files in the &lt;code&gt;corso/&lt;/code&gt; folder (see the note at the end), so this link is based only on what slide 2 says.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 1&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Why does frequent devaluation cost monetary policy its credibility?&lt;/summary&gt;&lt;p&gt;Each devaluation raises the prices of imported goods and, in general, inflation. If the country devalues whenever it needs to, the public learns that price stability takes second place. Promises of low inflation are no longer believed.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Which benefit of EMU is at the centre of this lecture?&lt;/summary&gt;&lt;p&gt;The recovery of monetary-policy credibility. For many high-inflation countries, delegating monetary policy to a common, credible central bank made it possible to lower inflation expectations.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s2&quot; class=&quot;part sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part I · The problem &lt;span class=&quot;slides&quot;&gt;slides 4–6&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;Time inconsistency: announce, then deviate&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Time inconsistency&lt;/b&gt;: the policy maker finds it optimal to &lt;b&gt;announce&lt;/b&gt; a commitment to a certain policy and then to &lt;b&gt;deviate from it&lt;/b&gt; once the public has made its decisions on the basis of the announcement. The plan that is optimal &lt;i&gt;ex ante&lt;/i&gt; is no longer optimal &lt;i&gt;ex post&lt;/i&gt;.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Credibility problem&lt;/b&gt;: the government announces a move. If it later has the opportunity to achieve a better short-run outcome, it will try to do so, even if this means “fooling” the public. But rational agents know this, &lt;b&gt;anticipate&lt;/b&gt; the deception and adjust their &lt;span class=&quot;term&quot;&gt;response functions&lt;/span&gt; (the way they react to policies).&lt;/div&gt;

  &lt;h3&gt;Not just about money: four examples from the slides&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Public debt&lt;/button&gt;
      &lt;button role=&quot;tab&quot;&gt;Fixed exchange rate&lt;/button&gt;
      &lt;button role=&quot;tab&quot;&gt;Taxes on innovation&lt;/button&gt;
      &lt;button role=&quot;tab&quot;&gt;Exams&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;trio&quot;&gt;
      &lt;div&gt;&lt;b&gt;Announcement&lt;/b&gt;The government issues bonds to spend more than its revenue and promises to repay them.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Ex post temptation&lt;/b&gt;If a severe crisis hits, default becomes attractive.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;If nobody believes it&lt;/b&gt;Investors do not buy the bonds, or buy them only at a very high risk premium.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;trio&quot;&gt;
      &lt;div&gt;&lt;b&gt;Announcement&lt;/b&gt;The country adopts a fixed exchange rate regime.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Ex post temptation&lt;/b&gt;Faced with a large balance-of-payments shock, devalue.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;If nobody believes it&lt;/b&gt;Markets bet on a devaluation: the peg comes under pressure and becomes hard to defend.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;trio&quot;&gt;
      &lt;div&gt;&lt;b&gt;Announcement&lt;/b&gt;Zero taxes for a sector, to encourage innovation.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Ex post temptation&lt;/b&gt;Once the sector prospers, tax it and collect the revenue.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;If nobody believes it&lt;/b&gt;Firms do not invest in R&amp;amp;D in the first place.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;trio&quot;&gt;
      &lt;div&gt;&lt;b&gt;Announcement&lt;/b&gt;Exams are announced to induce students to study.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Ex post temptation&lt;/b&gt;Once they have studied, the “best” option would be to cancel the exams, saving time and effort.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;If nobody believes it&lt;/b&gt;Students do not study at all.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;The moral of the slides: &lt;b&gt;if announcements about the future are not credible, they do not work&lt;/b&gt;. They discourage investors from buying bonds, firms from undertaking R&amp;amp;D and students from studying.&lt;/p&gt;

  &lt;h3&gt;The sequence of the game, step by step&lt;/h3&gt;
  &lt;div class=&quot;lab stepper&quot; data-stepper&gt;
    &lt;figure&gt;&lt;svg viewBox=&quot;0 0 800 110&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;line x1=&quot;60&quot; y1=&quot;50&quot; x2=&quot;740&quot; y2=&quot;50&quot; class=&quot;ax&quot;/&gt;
      &lt;g class=&quot;st-dots&quot;&gt;&lt;circle cx=&quot;80&quot; cy=&quot;50&quot; r=&quot;13&quot;/&gt;&lt;circle cx=&quot;293&quot; cy=&quot;50&quot; r=&quot;13&quot;/&gt;&lt;circle cx=&quot;506&quot; cy=&quot;50&quot; r=&quot;13&quot;/&gt;&lt;circle cx=&quot;720&quot; cy=&quot;50&quot; r=&quot;13&quot;/&gt;&lt;/g&gt;
      &lt;text x=&quot;80&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;t₀ announcement&lt;/text&gt;&lt;text x=&quot;293&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;t₁ the public decides&lt;/text&gt;&lt;text x=&quot;506&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;t₂ the CB chooses&lt;/text&gt;&lt;text x=&quot;720&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;t₃ outcome&lt;/text&gt;
    &lt;/svg&gt;&lt;/figure&gt;
    &lt;div class=&quot;stage&quot;&gt;
      &lt;div data-step&gt;&lt;h4&gt;t₀ · The announcement&lt;/h4&gt;&lt;p&gt;The central bank announces inflation equal to the target, ṗ = ṗ* (in the diagrams: &lt;b&gt;point A&lt;/b&gt;, zero inflation and unemployment at the natural rate u&lt;sub&gt;N&lt;/sub&gt;).&lt;/p&gt;&lt;/div&gt;
      &lt;div data-step hidden&gt;&lt;h4&gt;t₁ · The public forms expectations&lt;/h4&gt;&lt;p&gt;Workers, firms and investors sign wage contracts, set prices and buy fixed nominal-rate bonds on the basis of expected inflation ṗ&lt;sup&gt;e&lt;/sup&gt;. From then on, these choices are &lt;b&gt;locked in&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-step hidden&gt;&lt;h4&gt;t₂ · The temptation&lt;/h4&gt;&lt;p&gt;With ṗ&lt;sup&gt;e&lt;/sup&gt; already set, a little &lt;b&gt;surprise inflation&lt;/b&gt; lowers real wages and therefore unemployment (Phillips curve). It also erodes the real value of public debt. The CB would prefer &lt;b&gt;point B&lt;/b&gt; to point A: the announcement was “optimal” yesterday, but it no longer is today.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-step hidden&gt;&lt;h4&gt;t₃ · Rational anticipation&lt;/h4&gt;&lt;p&gt;Rational agents already know all this at t₁. They therefore set expected inflation so high that the CB no longer has any incentive to surprise them: &lt;b&gt;point E&lt;/b&gt;. Result: unemployment is the same (u&lt;sub&gt;N&lt;/sub&gt;) but inflation is higher. This is the &lt;b&gt;inflation bias&lt;/b&gt;, which the model in section 5 makes precise.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;btns&quot;&gt;&lt;button data-prev&gt;← back&lt;/button&gt;&lt;button data-next class=&quot;on&quot;&gt;next →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 2&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between the “credibility problem” and “time inconsistency”?&lt;/summary&gt;&lt;p&gt;Time inconsistency describes the &lt;b&gt;incentive&lt;/b&gt;: the announced optimal plan ceases to be optimal once the public has acted. The credibility problem is the &lt;b&gt;consequence&lt;/b&gt;: the public knows this, does not believe the announcement and changes its behaviour in advance.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;In the examples, why does the public&#x27;s anticipation of the deviation make everyone worse off?&lt;/summary&gt;&lt;p&gt;Because the decisions the announcement was meant to induce (buying bonds, investing in R&amp;amp;D, studying) are not taken. The government loses the benefit it was seeking and the public loses the opportunities the commitment would have created.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Who first formalised this idea, and for which policies?&lt;/summary&gt;&lt;p&gt;Kydland and Prescott (1977), “Rules rather than discretion”. It applied not only to monetary policy but to every kind of public policy. It earned them the Nobel Prize in 2004 (slides 5 and 21).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s3&quot; class=&quot;part ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part II · The model &lt;span class=&quot;slides&quot;&gt;slides 7–10, 13&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;Why surprising pays: the Phillips curve&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Why should the policy maker gain from deviating? Because in the &lt;b&gt;short run&lt;/b&gt; there is a positive relationship between inflation and economic activity or, equivalently, a &lt;b&gt;negative relationship between inflation and unemployment&lt;/b&gt;: the &lt;dfn&gt;Phillips curve&lt;/dfn&gt;. A CB that controls inflation but also cares about real objectives (employment) may be tempted to exploit it.&lt;/p&gt;

  &lt;h3&gt;The expectations-augmented Phillips curve&lt;/h3&gt;
  &lt;p&gt;In the &lt;span class=&quot;term&quot;&gt;expectations-augmented&lt;/span&gt; version, what matters is &lt;b&gt;unexpected&lt;/b&gt; inflation:&lt;/p&gt;
  &lt;div class=&quot;eq&quot;&gt;ṗ = c − b·u + ṗ&lt;sup&gt;e&lt;/sup&gt; + ε&lt;span class=&quot;cap&quot;&gt;short run (slide 8)&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;In the long-run steady state expectations are correct, ṗ = ṗ&lt;sup&gt;e&lt;/sup&gt;, hence&lt;/p&gt;
  &lt;div class=&quot;eq&quot;&gt;u = c / b = u&lt;sub&gt;N&lt;/sub&gt;&lt;span class=&quot;cap&quot;&gt;&lt;span class=&quot;term&quot;&gt;natural rate of unemployment&lt;/span&gt;: the unemployment rate consistent with correct expectations&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Substituting c = b·u&lt;sub&gt;N&lt;/sub&gt;, the curve can be rewritten in two equivalent forms:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;eq&quot;&gt;ṗ − ṗ&lt;sup&gt;e&lt;/sup&gt; = b (u&lt;sub&gt;N&lt;/sub&gt; − u) + ε&lt;span class=&quot;cap&quot;&gt;an inflation surprise corresponds to unemployment below u&lt;sub&gt;N&lt;/sub&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;eq&quot;&gt;u = u&lt;sub&gt;N&lt;/sub&gt; − (1/b)(ṗ − ṗ&lt;sup&gt;e&lt;/sup&gt;) + ε&lt;span class=&quot;cap&quot;&gt;“ignoring causality issues”: surprise inflation lowers u&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;In the last form the shock term should strictly be written −ε/b. The slides simplify it to +ε: all that matters is that it is a random disturbance. The intuitive mechanism: if nominal wages are set on the basis of ṗ&lt;sup&gt;e&lt;/sup&gt; and prices rise more than expected, the real wage falls, firms hire more and u falls below u&lt;sub&gt;N&lt;/sub&gt;.&lt;/p&gt;

  &lt;div class=&quot;card t&quot;&gt;&lt;b&gt;Key note (slide 8):&lt;/b&gt; the natural rate is &lt;b&gt;not necessarily optimal&lt;/b&gt;. The benefit of surprise inflation arises precisely because the policy maker regards u&lt;sub&gt;N&lt;/sub&gt; as &lt;b&gt;too high&lt;/b&gt;, i.e. has a target u* &amp;lt; u&lt;sub&gt;N&lt;/sub&gt;. This is the root of the whole problem.&lt;/div&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Lab · Move expectations and unemployment&lt;/h4&gt;
    &lt;p class=&quot;note&quot;&gt;u&lt;sub&gt;N&lt;/sub&gt; = 8%, b = 1. The faint dashed lines are the short-run Phillips curves for ṗ&lt;sup&gt;e&lt;/sup&gt; = 0, 5, 10. The vertical line is the long-run Phillips curve (slide 13).&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;Expected inflation ṗ&lt;sup&gt;e&lt;/sup&gt;&lt;input type=&quot;range&quot; id=&quot;pc-pe&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;pc-pe-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;Unemployment u&lt;input type=&quot;range&quot; id=&quot;pc-u&quot; min=&quot;2&quot; max=&quot;13&quot; step=&quot;0.5&quot; value=&quot;6&quot;&gt;&lt;output id=&quot;pc-u-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;figure&gt;&lt;svg id=&quot;pc-svg&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;div class=&quot;read&quot;&gt;&lt;div&gt;Actual inflation ṗ&lt;b id=&quot;pc-p&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Surprise ṗ − ṗ&lt;sup&gt;e&lt;/sup&gt;&lt;b id=&quot;pc-s&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;u − u&lt;sub&gt;N&lt;/sub&gt;&lt;b id=&quot;pc-g&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;msg&quot; id=&quot;pc-msg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The Phillips curve and the natural rate (slide 13)&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;For &lt;b&gt;each level of expected inflation&lt;/b&gt; there is a short-run trade-off between inflation and unemployment: a downward-sloping line.&lt;/li&gt;
    &lt;li&gt;If ṗ&lt;sup&gt;e&lt;/sup&gt; rises, the line shifts &lt;b&gt;upwards in parallel&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;The vertical line at u&lt;sub&gt;N&lt;/sub&gt; is the &lt;b&gt;long-run Phillips curve&lt;/b&gt;: the set of points with ṗ = ṗ&lt;sup&gt;e&lt;/sup&gt;. In the long run there is no trade-off: more inflation does not buy less unemployment.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h3&gt;A second incentive: the revenue incentive&lt;/h3&gt;
  &lt;p&gt;Public debt is fixed in &lt;b&gt;nominal&lt;/b&gt; terms. The public holds bonds with a real value of B&lt;sub&gt;t−1&lt;/sub&gt;/P&lt;sub&gt;t−1&lt;/sub&gt; and a nominal yield R&lt;sub&gt;t−1&lt;/sub&gt; that was satisfactory &lt;i&gt;given inflation expectations&lt;/i&gt;. Surprise inflation wipes out part of the real value of the bonds and therefore reduces the government&#x27;s future real expenditure on interest and principal repayments. This channel is quantitatively important when &lt;b&gt;debt is high&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Calculator · How much debt does the surprise “eat up”?&lt;/h4&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;Nominal debt (€ bn)&lt;input type=&quot;range&quot; id=&quot;dv-d&quot; min=&quot;500&quot; max=&quot;3200&quot; step=&quot;100&quot; value=&quot;2000&quot;&gt;&lt;output id=&quot;dv-d-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;Surprise inflation&lt;input type=&quot;range&quot; id=&quot;dv-p&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.25&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;dv-p-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;read&quot;&gt;&lt;div&gt;Real reduction (approximate, D·π)&lt;b id=&quot;dv-a&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Real reduction (exact, D·π/(1+π))&lt;b id=&quot;dv-e&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Example from the slides: debt of 2000 bn and a 1% surprise → roughly &lt;b&gt;20 bn&lt;/b&gt; less in real value. The exact calculation, D·π/(1+π), gives 19.8 bn.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;But agents are not fooled forever (slide 10)&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Consumers and firms &lt;b&gt;learn&lt;/b&gt; over time and correct their expectations.&lt;/li&gt;
    &lt;li&gt;They understand “the trick”: the policy maker will try to create surprise inflation in order to raise output.&lt;/li&gt;
    &lt;li&gt;Once expectations have been corrected, &lt;b&gt;no gain in output or revenue&lt;/b&gt; is possible any longer, not even in the short run.&lt;/li&gt;
    &lt;li&gt;Inflation also has &lt;b&gt;costs&lt;/b&gt; (associated with changing prices). The model represents them through a &lt;b&gt;loss function&lt;/b&gt; to be minimised subject to a constraint, the Phillips curve.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 3&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Where does the formula u&lt;sub&gt;N&lt;/sub&gt; = c/b come from?&lt;/summary&gt;&lt;p&gt;Set ṗ = ṗ&lt;sup&gt;e&lt;/sup&gt; in ṗ = c − bu + ṗ&lt;sup&gt;e&lt;/sup&gt; (with ε = 0): this leaves 0 = c − bu, hence u = c/b.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;If ṗ&lt;sup&gt;e&lt;/sup&gt; = 4%, b = 1 and u&lt;sub&gt;N&lt;/sub&gt; = 8%, what inflation rate is needed to bring u down to 6%?&lt;/summary&gt;&lt;p&gt;ṗ = ṗ&lt;sup&gt;e&lt;/sup&gt; + b(u&lt;sub&gt;N&lt;/sub&gt; − u) = 4 + 1·(8 − 6) = 6%. A surprise of 2 percentage points is required.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why, without u* &amp;lt; u&lt;sub&gt;N&lt;/sub&gt;, would there be no temptation to surprise (on the employment side)?&lt;/summary&gt;&lt;p&gt;If the unemployment target coincides with u&lt;sub&gt;N&lt;/sub&gt;, at point A the CB already has the unemployment rate it wants: generating inflation would only bring costs. This is the “target conservative” case in section 6.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is the revenue incentive stronger in high-debt countries?&lt;/summary&gt;&lt;p&gt;The real loss for creditors, and hence the gain for the government, is approximately debt × surprise: for a given surprise, it increases with the debt stock.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s4&quot; class=&quot;part ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part II · The model &lt;span class=&quot;slides&quot;&gt;slides 11–12&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;The authorities&#x27; preferences: the loss function&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;The monetary authority seeks to minimise a &lt;dfn&gt;loss function&lt;/dfn&gt;: a measure of how “dissatisfied” it is. Its arguments are the &lt;b&gt;squared deviations&lt;/b&gt; of inflation and unemployment from their respective targets:&lt;/p&gt;
  &lt;div class=&quot;eq&quot;&gt;L = a₁ (ṗ − ṗ*)² + a₂ (u − u*)²&lt;span class=&quot;cap&quot;&gt;a₁, a₂ = weights capturing preferences: how much fighting inflation matters relative to fighting unemployment&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Why squared?&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;This way, deviations above and below the target are weighted equally, and large deviations weigh more than proportionally: being two points off costs four times as much as being one point off. The function is also easy to minimise using derivatives.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;How to read the diagram&lt;/h4&gt;&lt;p&gt;The origin is the &lt;b&gt;bliss point&lt;/b&gt; (the point of maximum satisfaction) (ṗ*, u*), where L = 0. The indifference curves are &lt;b&gt;concave&lt;/b&gt; elliptical arcs around the origin. Unlike utility curves, here &lt;b&gt;closer to the origin is better&lt;/b&gt;: I₁ is preferred to I₂, and I₂ to I₃.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Lab · Change the weights and watch the shape of the curves&lt;/h4&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;a₁ · weight on inflation&lt;input type=&quot;range&quot; id=&quot;ic-a1&quot; min=&quot;0.2&quot; max=&quot;3&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;ic-a1-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;a₂ · weight on unemployment&lt;input type=&quot;range&quot; id=&quot;ic-a2&quot; min=&quot;0.2&quot; max=&quot;3&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;ic-a2-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;btns&quot;&gt;&lt;button data-ic=&quot;2.6,0.5&quot;&gt;Hard-nosed&lt;/button&gt;&lt;button data-ic=&quot;1,1&quot;&gt;Neutral&lt;/button&gt;&lt;button data-ic=&quot;0.5,2.6&quot;&gt;Wet&lt;/button&gt;&lt;/div&gt;
    &lt;figure&gt;&lt;svg id=&quot;ic-svg&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Horizontal axis: u − u*; vertical axis: ṗ − ṗ*. Curves I₁, I₂, I₃ with L = 4, 9, 16.&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;div class=&quot;msg&quot; id=&quot;ic-msg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;The &lt;b&gt;slope&lt;/b&gt; of the curves tells us how much additional inflation the authority accepts for one point less of unemployment, i.e. the relative weight of the two objectives. &lt;span class=&quot;ours&quot;&gt;derivation&lt;/span&gt;Along a curve, dṗ/du = −(a₂ (u − u*)) / (a₁ (ṗ − ṗ*)).&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 4&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;For a CB with a₁ much larger than a₂, are the curves flattened vertically or horizontally?&lt;/summary&gt;&lt;p&gt;Flattened vertically, i.e. low and wide. Even a little inflation is very costly, so for a given loss the authority tolerates a lot of unemployment but little inflation. This is the &lt;b&gt;hard-nosed&lt;/b&gt; CB.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is I₁ preferred to I₃?&lt;/summary&gt;&lt;p&gt;Because it is closer to the bliss point (ṗ*, u*): every point on I₁ has a lower loss L.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s5&quot; class=&quot;part ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part II · The model &lt;span class=&quot;slides&quot;&gt;slides 14–17&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;The Barro-Gordon equilibrium and the inflation bias&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Putting the two together: the CB minimises the loss function (section 4) &lt;b&gt;subject to&lt;/b&gt; the short-run Phillips curve (section 3), taking as given the expectations ṗ&lt;sup&gt;e&lt;/sup&gt; already set by the public. Slide 15 refers to a separate pdf for the algebra of the model. Below is a derivation consistent with the formulas on slides 8 and 11.&lt;/p&gt;

  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;&lt;span class=&quot;ours&quot;&gt;derivation&lt;/span&gt; The solution in four lines&lt;/summary&gt;
    &lt;p&gt;1. The problem: min L = a₁(ṗ − ṗ*)² + a₂(u − u*)² subject to u = u&lt;sub&gt;N&lt;/sub&gt; − (1/b)(ṗ − ṗ&lt;sup&gt;e&lt;/sup&gt;).&lt;/p&gt;
    &lt;p&gt;2. First-order condition with respect to ṗ: 2a₁(ṗ − ṗ*) + 2a₂(u − u*)·(−1/b) = 0.&lt;/p&gt;
    &lt;div class=&quot;eq&quot;&gt;ṗ − ṗ* = (a₂ / (a₁ b)) · (u − u*)&lt;span class=&quot;cap&quot;&gt;&lt;b&gt;reaction curve&lt;/b&gt;: the CB&#x27;s optimal choice for each ṗ&lt;sup&gt;e&lt;/sup&gt;. It is a straight line through the origin with slope a₂/(a₁b)&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;3. Under rational expectations, in equilibrium ṗ = ṗ&lt;sup&gt;e&lt;/sup&gt;, hence u = u&lt;sub&gt;N&lt;/sub&gt;.&lt;/p&gt;
    &lt;div class=&quot;eq&quot;&gt;ṗ&lt;sub&gt;E&lt;/sub&gt; = ṗ* + (a₂ / (a₁ b)) · (u&lt;sub&gt;N&lt;/sub&gt; − u*)&lt;span class=&quot;cap&quot;&gt;the second term is the &lt;b&gt;inflation bias&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;4. Losses: L&lt;sub&gt;A&lt;/sub&gt; = a₂(u&lt;sub&gt;N&lt;/sub&gt; − u*)², whereas L&lt;sub&gt;E&lt;/sub&gt; = L&lt;sub&gt;A&lt;/sub&gt; + a₁·bias² &amp;gt; L&lt;sub&gt;A&lt;/sub&gt;. At E unemployment is the same as at A, but with additional inflation: E is worse than A.&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;The bias is larger when: (i) a₂/a₁ is large, i.e. the CB is &lt;i&gt;wet&lt;/i&gt;; (ii) u&lt;sub&gt;N&lt;/sub&gt; − u* is large, i.e. the CB regards the natural rate as highly “excessive”; (iii) b is small, i.e. a small surprise is enough to reduce u considerably. With a₂ = 0 or u* = u&lt;sub&gt;N&lt;/sub&gt; the bias is zero.&lt;/p&gt;
  &lt;/details&gt;

  &lt;h3&gt;The points in the diagram (slide 14)&lt;/h3&gt;
  &lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Point&lt;/th&gt;&lt;th&gt;What it is&lt;/th&gt;&lt;th&gt;Expectations&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;A&lt;/b&gt;&lt;/td&gt;&lt;td&gt;The announcement: ṗ = ṗ*, u = u&lt;sub&gt;N&lt;/sub&gt;. It is not credible, because given ṗ&lt;sup&gt;e&lt;/sup&gt; = ṗ* the CB prefers B.&lt;/td&gt;&lt;td&gt;ṗ&lt;sup&gt;e&lt;/sup&gt; = ṗ*&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;B&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Tangency between the indifference curve and the Phillips curve with ṗ&lt;sup&gt;e&lt;/sup&gt; = ṗ*: an inflation surprise and u &amp;lt; u&lt;sub&gt;N&lt;/sub&gt;. This is the “temptation”, and it can only be reached with a &lt;b&gt;naïve&lt;/b&gt; public.&lt;/td&gt;&lt;td&gt;ṗ&lt;sup&gt;e&lt;/sup&gt; = ṗ* (fooled)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;C&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Intermediate step: the public has raised ṗ&lt;sup&gt;e&lt;/sup&gt; to ṗ₁ (the inflation rate at B), the curve shifts up and the CB surprises again, but by less.&lt;/td&gt;&lt;td&gt;ṗ&lt;sup&gt;e&lt;/sup&gt; = ṗ₁ (adaptive)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;E&lt;/b&gt;&lt;/td&gt;&lt;td&gt;The &lt;b&gt;time consistent equilibrium&lt;/b&gt; under rational expectations: the intersection of the reaction curve with the vertical line at u&lt;sub&gt;N&lt;/sub&gt;. Here the CB no longer has an incentive to deviate.&lt;/td&gt;&lt;td&gt;ṗ&lt;sup&gt;e&lt;/sup&gt; = ṗ&lt;sub&gt;E&lt;/sub&gt; (rational)&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;lab&quot; id=&quot;lab&quot;&gt;
    &lt;h4&gt;Lab · The Barro-Gordon model&lt;/h4&gt;
    &lt;p class=&quot;note&quot;&gt;We normalise ṗ* = 0 and a₁ = 1: only the ratio a₂/a₁ matters. Try the three types of expectations on slide 16: &lt;b&gt;naïve&lt;/b&gt; leads to B, &lt;b&gt;rational&lt;/b&gt; leads straight to E, &lt;b&gt;adaptive&lt;/b&gt; goes through A → B → C → … → E.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;a₂/a₁ · relative weight on unemployment&lt;input type=&quot;range&quot; id=&quot;bg-w&quot; min=&quot;0&quot; max=&quot;2.5&quot; step=&quot;0.05&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;bg-w-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;b · slope of the Phillips curve&lt;input type=&quot;range&quot; id=&quot;bg-b&quot; min=&quot;0.8&quot; max=&quot;2&quot; step=&quot;0.05&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;bg-b-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;u&lt;sub&gt;N&lt;/sub&gt; · natural rate&lt;input type=&quot;range&quot; id=&quot;bg-un&quot; min=&quot;4&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;8&quot;&gt;&lt;output id=&quot;bg-un-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;u* · unemployment target&lt;input type=&quot;range&quot; id=&quot;bg-us&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;bg-us-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;btns&quot;&gt;
      &lt;button data-bg=&quot;naive&quot;&gt;Naïve expectations → B&lt;/button&gt;
      &lt;button data-bg=&quot;adapt&quot;&gt;Adaptive: next period ▸&lt;/button&gt;
      &lt;button data-bg=&quot;rational&quot;&gt;Rational expectations → E&lt;/button&gt;
      &lt;button data-bg=&quot;reset&quot;&gt;Reset to A&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;btns&quot;&gt;&lt;span class=&quot;note&quot; style=&quot;border:0;padding:0&quot;&gt;Presets:&lt;/span&gt;
      &lt;button data-preset=&quot;0.4,1,8,0&quot;&gt;Hard-nosed&lt;/button&gt;&lt;button data-preset=&quot;1.8,1,8,0&quot;&gt;Wet&lt;/button&gt;
      &lt;button data-preset=&quot;0,1,8,0&quot;&gt;Super conservative&lt;/button&gt;&lt;button data-preset=&quot;1,1,8,8&quot;&gt;Target conservative&lt;/button&gt;
    &lt;/div&gt;
    &lt;figure&gt;&lt;svg id=&quot;bg-svg&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Red: short-run Phillips curve with current expectations (earlier ones are faded). Dashed: reaction curve. Arc: the CB&#x27;s indifference curve through the current point.&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;div class=&quot;read&quot;&gt;
      &lt;div&gt;Current point (u, ṗ)&lt;b id=&quot;bg-cur&quot;&gt;–&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;Current ṗ&lt;sup&gt;e&lt;/sup&gt;&lt;b id=&quot;bg-pe&quot;&gt;–&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;Inflation bias ṗ&lt;sub&gt;E&lt;/sub&gt;&lt;b id=&quot;bg-pE&quot;&gt;–&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;Loss at A&lt;b id=&quot;bg-LA&quot;&gt;–&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;Loss at B&lt;b id=&quot;bg-LB&quot;&gt;–&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;Loss at E&lt;b id=&quot;bg-LE&quot;&gt;–&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;msg&quot; id=&quot;bg-msg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;What the equilibrium tells us (slide 17)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Inflation bias&lt;/h4&gt;&lt;p&gt;E is &lt;b&gt;sub-optimal&lt;/b&gt; relative to A: same unemployment, more inflation. Discretion does not buy employment; it only produces inflation. In the lab, the loss at E is always ≥ the loss at A.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Rules vs discretion&lt;/h4&gt;&lt;p&gt;Hence the &lt;span class=&quot;term&quot;&gt;rules vs discretion&lt;/span&gt; debate: would it be better for the authorities to follow binding &lt;b&gt;rules&lt;/b&gt; rather than decide case by case? A credible rule would take the economy to A.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Crucial assumption: the model assumes &lt;b&gt;rational agents with strategic behaviour&lt;/b&gt;. The public and the CB “play” against each other and each anticipates the other&#x27;s moves.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 5&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Why is A not an equilibrium under rational expectations?&lt;/summary&gt;&lt;p&gt;Because if the public expects ṗ*, the CB has an incentive to move to B, on a lower indifference curve. The rational public foresees this and does not expect ṗ*: A cannot be sustained.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is E an equilibrium?&lt;/summary&gt;&lt;p&gt;At E the short-run Phillips curve (with ṗ&lt;sup&gt;e&lt;/sup&gt; = ṗ&lt;sub&gt;E&lt;/sub&gt;) is tangent to the CB&#x27;s indifference curve exactly at u&lt;sub&gt;N&lt;/sub&gt;: given that expectation, the CB&#x27;s optimal choice is ṗ&lt;sub&gt;E&lt;/sub&gt;, which confirms expectations. Nobody has an incentive to deviate.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;With a₂/a₁ = 1, b = 1, u&lt;sub&gt;N&lt;/sub&gt; = 8, u* = 0, what is the inflation bias?&lt;/summary&gt;&lt;p&gt;ṗ&lt;sub&gt;E&lt;/sub&gt; = (a₂/(a₁b))(u&lt;sub&gt;N&lt;/sub&gt; − u*) = 1·8 = 8 points. With b = 2 it halves to 4.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Match each type of expectations to its end point: naïve, rational, adaptive.&lt;/summary&gt;&lt;p&gt;Naïve → B (the public keeps believing the announcement). Rational → E immediately. Adaptive → A, B, C, … and convergence towards E.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s6&quot; class=&quot;part slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;6&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part III · Preferences and remedies &lt;span class=&quot;slides&quot;&gt;slides 18–22&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;Hard-nosed versus wet&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Hard-nosed CB&lt;/b&gt; (tough, uncompromising): attaches &lt;b&gt;a large weight to fighting inflation&lt;/b&gt; (large a₁). Its indifference curves are low and wide.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Wet CB&lt;/b&gt; (soft): attaches &lt;b&gt;a large weight to fighting unemployment&lt;/b&gt; (large a₂). Its curves are tall and narrow.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;figure&gt;&lt;svg id=&quot;hw-hard&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Hard-nosed (a₂/a₁ = 0.4): B and E remain close to A.&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure&gt;&lt;svg id=&quot;hw-wet&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Wet (a₂/a₁ = 1.6): the temptation is strong and E lies far up.&lt;/figcaption&gt;&lt;/figure&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card t&quot;&gt;&lt;b&gt;Message of slide 19:&lt;/b&gt; hard-nosed authorities achieve &lt;b&gt;lower&lt;/b&gt; inflation than wet ones &lt;b&gt;without imposing more unemployment in the long run&lt;/b&gt;: in both cases E lies on the vertical line at u&lt;sub&gt;N&lt;/sub&gt;.&lt;/div&gt;

  &lt;h3&gt;Reaction curves (slide 20)&lt;/h3&gt;
  &lt;figure&gt;&lt;svg id=&quot;hw-rc&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;The dashed lines are the loci of the CB&#x27;s optimal choices for every possible constraint (every ṗ&lt;sup&gt;e&lt;/sup&gt;): the &lt;b&gt;reaction curves&lt;/b&gt;. Their slope, a₂/(a₁b), depends on preferences. Red = wet, blue = hard-nosed.&lt;/figcaption&gt;&lt;/figure&gt;

  &lt;h3&gt;Conclusions on the model and remedies&lt;/h3&gt;
  &lt;p&gt;General conclusion (slide 21): &lt;b&gt;discretion can make everyone worse off&lt;/b&gt; compared with a world in which the government could commit to a policy path. How can this be overcome?&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Rules&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Reputation&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Delegation (Rogoff)&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Super / target conservative&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Barro and Gordon (1983)&lt;/b&gt;, focusing on monetary policy, emphasise the role of &lt;b&gt;monetary rules&lt;/b&gt; as a possible solution to time inconsistency. If the CB is credibly bound to ṗ*, the public expects ṗ* and the economy stays at A.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Kydland-Prescott (1977) applied to &lt;i&gt;every&lt;/i&gt; public policy. Barro-Gordon apply it to monetary policy.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;The title of Barro and Gordon&#x27;s second paper mentions &lt;b&gt;reputation&lt;/b&gt;. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;According to the abstract (NBER WP 1079), in a repeated game the threat of losing reputation can partly substitute for a formal rule: some rules, though in general not the ideal one, can be sustained in this way, and the outcome is a weighted average of discretion and the ideal rule. &lt;a href=&quot;https://www.nber.org/papers/w1079&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;nber.org/papers/w1079&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Slide 21: a later solution in terms of &lt;b&gt;delegation&lt;/b&gt; (Rogoff 1985). Society entrusts monetary policy to a central banker who is &lt;b&gt;more conservative&lt;/b&gt; than society itself, with a higher a₁: in the lab, a lower a₂/a₁ means a lower bias. &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Rogoff also shows the cost: with large supply shocks, employment variability increases, so the optimal weight on inflation is large but finite. &lt;a href=&quot;https://ideas.repec.org/a/oup/qjecon/v100y1985i4p1169-1189..html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div&gt;&lt;h4&gt;Super conservative&lt;/h4&gt;&lt;p&gt;Zero weight on unemployment in the loss function. The slide writes “b = 0”: in the notation of slide 11 this corresponds to &lt;b&gt;a₂ = 0&lt;/b&gt;. The reaction curve is horizontal, the bias is zero and E coincides with A.&lt;/p&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h4&gt;Target conservative&lt;/h4&gt;&lt;p&gt;u* = u&lt;sub&gt;N&lt;/sub&gt;: the CB does not regard the natural rate as excessive. In this case too the bias (a₂/(a₁b))(u&lt;sub&gt;N&lt;/sub&gt; − u*) vanishes. Try both presets in the &lt;a href=&quot;#lab&quot;&gt;lab&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 6&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Does a hard-nosed CB have higher long-run unemployment than a wet one?&lt;/summary&gt;&lt;p&gt;No. In equilibrium both are at u&lt;sub&gt;N&lt;/sub&gt;. The difference lies only in inflation, which is lower with the hard-nosed CB. Greater conservatism does not cost employment in the long run (in the absence of shocks).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What determines the slope of the reaction curve?&lt;/summary&gt;&lt;p&gt;a₂/(a₁b): preferences (the ratio of the weights) and the slope of the Phillips curve. The steeper it is, the higher equilibrium inflation.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why do “super conservative” and “target conservative” both eliminate the inflation bias?&lt;/summary&gt;&lt;p&gt;The bias is (a₂/(a₁b))(u&lt;sub&gt;N&lt;/sub&gt; − u*). The first sets a₂ to zero (the CB does not care about reducing u), the second sets u&lt;sub&gt;N&lt;/sub&gt; − u* to zero (the CB does not want u below u&lt;sub&gt;N&lt;/sub&gt;). In both cases there is no reason to surprise.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s7&quot; class=&quot;part brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;7&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part IV · Europe and EMU &lt;span class=&quot;slides&quot;&gt;slides 23–26&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;Barro-Gordon in an open economy: Germany and Italy&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Two countries: one with a &lt;b&gt;hard-nosed&lt;/b&gt; CB (example: Germany, with the Bundesbank) and a low-inflation equilibrium; the other with a &lt;b&gt;wet&lt;/b&gt; CB (example: Italy) and a high-inflation equilibrium. An &lt;b&gt;inflation differential&lt;/b&gt; emerges, and Italy has to &lt;b&gt;devalue repeatedly&lt;/b&gt; to remain competitive.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;figure&gt;&lt;svg id=&quot;gi-ger&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Germany: low-inflation equilibrium C at ṗ&lt;sub&gt;G&lt;/sub&gt;.&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure&gt;&lt;svg id=&quot;gi-ita&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Italy: equilibrium E. Point F (u&lt;sub&gt;N&lt;/sub&gt;, ṗ&lt;sub&gt;G&lt;/sub&gt;) is the target; G is the temptation starting from F.&lt;/figcaption&gt;&lt;/figure&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;b&gt;The question on slide 24:&lt;/b&gt; how can the Italian authorities make the announcement of point F, i.e. German inflation, &lt;b&gt;credible&lt;/b&gt;? Without credibility, Italian inflation remains high and continuous devaluations are needed. If the public believed in F, the Italian CB would be tempted to move to G, exactly as before from A to B.&lt;/p&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Calculator · Inflation differential and devaluations&lt;/h4&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;To remain competitive, Italy must let the lira depreciate each year by roughly the inflation differential: this is relative purchasing power parity, Δe ≈ π&lt;sub&gt;I&lt;/sub&gt; − π&lt;sub&gt;G&lt;/sub&gt;.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;German inflation π&lt;sub&gt;G&lt;/sub&gt;&lt;input type=&quot;range&quot; id=&quot;df-g&quot; min=&quot;0&quot; max=&quot;6&quot; step=&quot;0.5&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;df-g-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;Italian inflation π&lt;sub&gt;I&lt;/sub&gt;&lt;input type=&quot;range&quot; id=&quot;df-i&quot; min=&quot;0&quot; max=&quot;20&quot; step=&quot;0.5&quot; value=&quot;12&quot;&gt;&lt;output id=&quot;df-i-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;Years&lt;input type=&quot;range&quot; id=&quot;df-n&quot; min=&quot;1&quot; max=&quot;15&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;df-n-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;figure&gt;&lt;svg id=&quot;df-svg&quot; viewBox=&quot;0 0 520 200&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Index of Italian prices relative to German prices (year 0 = 100): each bar shows the loss of competitiveness that the exchange rate must offset.&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;div class=&quot;read&quot;&gt;&lt;div&gt;Required annual devaluation&lt;b id=&quot;df-a&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Cumulative devaluation&lt;b id=&quot;df-c&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The credibility ladder&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1 · Announce F&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;2 · Fixed exchange rate&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;3 · Adopt the DM&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;4 · Monetary union&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;meter&quot;&gt;&lt;i style=&quot;width:12%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;Simply announcing the intention to keep inflation low and stable: &lt;b&gt;not credible&lt;/b&gt;, because of the F → G mechanism.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;meter&quot;&gt;&lt;i style=&quot;width:45%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;Moving to a &lt;b&gt;fixed exchange rate&lt;/b&gt;: competitiveness can no longer be regained through depreciation. This is more credible than a mere announcement, but &lt;b&gt;not fully&lt;/b&gt;: the temptation remains to create surprise inflation, or to devalue and change the announced parity.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;context&lt;/span&gt;This was the experience of the EMS (European Monetary System, from 1979), with its realignments and the lira&#x27;s exit from the exchange rate mechanism in September 1992.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;meter&quot;&gt;&lt;i style=&quot;width:80%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;Abandoning the lira for the Deutsche Mark (DM)&lt;/b&gt;: Italy would enjoy low German inflation, “borrowing” the preferences and credibility of the &lt;b&gt;Bundesbank&lt;/b&gt;. This is analogous to the &lt;span class=&quot;term&quot;&gt;dollarization&lt;/span&gt; (unilateral adoption of the US dollar) of small Latin American economies, or to the use of the euro in &lt;b&gt;Kosovo and Montenegro&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;meter&quot;&gt;&lt;i style=&quot;width:65%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;A &lt;b&gt;monetary union&lt;/b&gt; between Germany and Italy is more complex: a &lt;b&gt;new&lt;/b&gt; central bank is created, which must &lt;b&gt;build its own reputation from scratch&lt;/b&gt;. The Italian authorities &lt;b&gt;“tie their hands”&lt;/b&gt; (&lt;span class=&quot;term&quot;&gt;the advantage of tying one&#x27;s hands&lt;/span&gt;, Giavazzi and Pagano) in matters of monetary policy.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;The bar lengths are indicative and serve only to compare the options.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 7&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Why must a country with a wet CB devalue repeatedly if it wants to remain competitive?&lt;/summary&gt;&lt;p&gt;Because in equilibrium its inflation is persistently higher than that of its partners. Without devaluation its relative prices rise every year and it loses competitiveness.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is a fixed exchange rate not enough to make F fully credible?&lt;/summary&gt;&lt;p&gt;Because the parity can always be changed: the temptations to create surprise inflation and to devalue remain. The public knows this.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What is the difference between adopting the DM and creating a monetary union?&lt;/summary&gt;&lt;p&gt;By adopting the DM, a country inherits an already established reputation (the Bundesbank&#x27;s). In a monetary union a new CB is created, whose credibility must be built from scratch.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s8&quot; class=&quot;part brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;8&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Part IV · Europe and EMU &lt;span class=&quot;slides&quot;&gt;slides 27–29&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;From E to F: disinflation and Maastricht&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;The move from E to F was &lt;b&gt;neither painless nor quick&lt;/b&gt;. The economy moved down &lt;b&gt;along the initial short-run Phillips curve&lt;/b&gt;, and hence with higher unemployment. Only as inflation expectations fell did the curve shift down towards F. This is why unemployment initially rose and became a serious problem in Europe.&lt;/p&gt;
  &lt;div class=&quot;lab stepper&quot; data-stepper id=&quot;dis&quot;&gt;
    &lt;h4&gt;Step by step · A stylised Italian disinflation&lt;/h4&gt;
    &lt;figure&gt;&lt;svg id=&quot;dis-svg&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;div class=&quot;stage&quot;&gt;
      &lt;div data-step&gt;&lt;p&gt;&lt;b&gt;Starting point: E.&lt;/b&gt; Inflation 12%, expected 12%, u = u&lt;sub&gt;N&lt;/sub&gt; = 8%.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-step hidden&gt;&lt;p&gt;&lt;b&gt;Monetary tightening.&lt;/b&gt; Inflation falls to 8%, but expectations are still at 12%: the economy slides along the initial curve and &lt;b&gt;u rises&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-step hidden&gt;&lt;p&gt;&lt;b&gt;Expectations begin to fall&lt;/b&gt; (8%): the curve shifts down. Inflation falls to 5% and u remains above u&lt;sub&gt;N&lt;/sub&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-step hidden&gt;&lt;p&gt;&lt;b&gt;One more step:&lt;/b&gt; ṗ&lt;sup&gt;e&lt;/sup&gt; = 5%, ṗ = 3.5%. The unemployment cost shrinks.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-step hidden&gt;&lt;p&gt;ṗ&lt;sup&gt;e&lt;/sup&gt; = 3.5%, ṗ = 3%: almost there.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-step hidden&gt;&lt;p&gt;&lt;b&gt;Arrival: F.&lt;/b&gt; Inflation at the German level (3%), expectations aligned, u back to u&lt;sub&gt;N&lt;/sub&gt;. Expectations also fell because the policies for joining EMU &lt;b&gt;signalled a change in policy makers&#x27; preferences&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;btns&quot;&gt;&lt;button data-prev&gt;← back&lt;/button&gt;&lt;button data-next class=&quot;on&quot;&gt;next →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;read&quot;&gt;&lt;div&gt;ṗ&lt;sup&gt;e&lt;/sup&gt;&lt;b id=&quot;dis-pe&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;ṗ&lt;b id=&quot;dis-p&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;u&lt;b id=&quot;dis-u&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Illustrative values (b = 1.5; u&lt;sub&gt;N&lt;/sub&gt; = 8), chosen to reproduce the shape of slide 28: they are not historical data.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;The Maastricht inflation criterion&lt;/h3&gt;
  &lt;p&gt;One of the &lt;b&gt;Maastricht convergence criteria&lt;/b&gt; required inflation to be brought to &lt;b&gt;no more than 1.5 percentage points&lt;/b&gt; above the average of the &lt;b&gt;three countries with the lowest inflation&lt;/b&gt;. Countries had almost &lt;b&gt;10 years&lt;/b&gt; to converge.&lt;/p&gt;
  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Check · Does the country meet the criterion?&lt;/h4&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;Average of the 3 best performers&lt;input type=&quot;range&quot; id=&quot;mc-b&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.1&quot; value=&quot;1.5&quot;&gt;&lt;output id=&quot;mc-b-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;Country&#x27;s inflation&lt;input type=&quot;range&quot; id=&quot;mc-x&quot; min=&quot;0&quot; max=&quot;12&quot; step=&quot;0.1&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;mc-x-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;read&quot;&gt;&lt;div&gt;Threshold (average + 1.5)&lt;b id=&quot;mc-t&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Result&lt;b id=&quot;mc-r&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Conclusions (slide 29)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;The gain&lt;/h4&gt;&lt;p&gt;Joining a monetary union can bring a gain if the &lt;b&gt;new CB is more credible&lt;/b&gt;: it helps to reduce inflation. This was the case for several European countries.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;The downside&lt;/h4&gt;&lt;p&gt;If the monetary union lacks a &lt;b&gt;fiscal union&lt;/b&gt; or other forms of protection, the CB&#x27;s independence from governments can have negative effects: it makes &lt;span class=&quot;term&quot;&gt;self-fulfilling debt crises&lt;/span&gt; possible, i.e. debt crises that materialise because markets expect them. This is the topic of the next lecture.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 8&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Why does unemployment exceed u&lt;sub&gt;N&lt;/sub&gt; during disinflation?&lt;/summary&gt;&lt;p&gt;Because actual inflation falls before expectations do: ṗ − ṗ&lt;sup&gt;e&lt;/sup&gt; &amp;lt; 0 and, by the Phillips curve, u = u&lt;sub&gt;N&lt;/sub&gt; − (1/b)(ṗ − ṗ&lt;sup&gt;e&lt;/sup&gt;) &amp;gt; u&lt;sub&gt;N&lt;/sub&gt;. This is the cost of credibility not yet earned.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;If the disinflation had been perfectly credible, what would have changed?&lt;/summary&gt;&lt;p&gt;Expectations would have fallen immediately along with inflation. The economy would have moved from E to F along the vertical line at u&lt;sub&gt;N&lt;/sub&gt;, with no unemployment cost.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Average of the three best performers 2%, country at 3.8%: does it meet the criterion?&lt;/summary&gt;&lt;p&gt;No. The threshold is 2 + 1.5 = 3.5% and the country is at 3.8%.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;fonti&quot; class=&quot;part&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot; style=&quot;color:var(--accent)&quot;&gt;→&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;References cited in the slides&lt;/div&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;All the entries below are &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;: bibliographic details and descriptions come from web research (publisher pages, NBER, RePEc, the Nobel Prize, ECB, EUR-Lex), not from the slides. Only the list of what is cited comes from the slides.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Kydland, F. E. &amp;amp; Prescott, E. C. (1977) · “Rules Rather than Discretion: The Inconsistency of Optimal Plans”&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;i&gt;Journal of Political Economy&lt;/i&gt;, 85(3), pp. 473–492 · cited on slides 5 and 21&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; shows that a policy chosen with discretion, re-evaluated at each date, can be sub-optimal even when the social objective is fixed and the policy maker is perfectly informed. Rules can therefore improve outcomes. &lt;b&gt;Why it matters:&lt;/b&gt; it is the founding paper on time inconsistency and applies to every public policy, not just monetary policy.&lt;/p&gt;
    &lt;a href=&quot;https://www.britannica.com/topic/Rules-Rather-than-Discretion-The-Inconsistency-of-Optimal-Plans&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Britannica entry&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;2004 Nobel Prize in Economics · Kydland and Prescott&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Sveriges Riksbank Prize in Economic Sciences, announced on 11 October 2004 · cited on slide 5&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; citation “for their contributions to dynamic macroeconomics: the time consistency of economic policy and the driving forces behind business cycles”. The popular-information pages explain how, without prior commitment, the economy can become trapped in high inflation with no gain in terms of unemployment. &lt;b&gt;Why it matters:&lt;/b&gt; the Academy links this work to the shift in the debate from individual policy measures to the &lt;b&gt;institutions&lt;/b&gt; of economic policy, such as central bank independence.&lt;/p&gt;
    &lt;a href=&quot;https://www.nobelprize.org/prizes/economic-sciences/2004/press-release/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Press release&lt;/a&gt; · &lt;a href=&quot;https://www.nobelprize.org/prizes/economic-sciences/2004/popular-information/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Popular information&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Barro, R. J. &amp;amp; Gordon, D. B. (1983) · “A Positive Theory of Monetary Policy in a Natural Rate Model”&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;i&gt;Journal of Political Economy&lt;/i&gt;, 91(4), pp. 589–610 · earlier version NBER WP 807 (1981) · cited on slide 5&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; a discretionary policy maker can create surprise inflation to reduce unemployment and increase revenue (the two incentives in section 3). In equilibrium, monetary growth and inflation are excessive and depend on the slope of the Phillips curve, the natural rate and other factors affecting the costs and benefits of inflation. &lt;b&gt;Why it matters:&lt;/b&gt; it is the model the lecture calls the “BG model”.&lt;/p&gt;
    &lt;a href=&quot;https://www.nber.org/papers/w0807&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER Working Paper 807&lt;/a&gt; · &lt;a href=&quot;https://ideas.repec.org/a/ucp/jpolec/v91y1983i4p589-610.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Barro, R. J. &amp;amp; Gordon, D. B. (1983) · “Rules, Discretion and Reputation in a Model of Monetary Policy”&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;i&gt;Journal of Monetary Economics&lt;/i&gt;, 12(1), pp. 101–121 · NBER WP 1079 version · cited on slide 5&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; compares discretion and rules and shows that &lt;b&gt;reputation&lt;/b&gt;, in a repeated game, can partly substitute for a formal rule. Some rules, though generally not the ideal one, are sustainable, and outcomes lie between those of discretion and those of the ideal rule. &lt;b&gt;Why it matters:&lt;/b&gt; it explains the word “reputation” used on slide 3 with reference to central banks.&lt;/p&gt;
    &lt;a href=&quot;https://www.nber.org/papers/w1079&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER Working Paper 1079&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Rogoff, K. (1985) · “The Optimal Degree of Commitment to an Intermediate Monetary Target”&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;i&gt;Quarterly Journal of Economics&lt;/i&gt;, 100(4), pp. 1169–1189 · cited on slide 21&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; society can be better off by appointing a central banker who places &lt;b&gt;more&lt;/b&gt; weight on price stability than society itself does: time-consistent inflation falls, but with large supply shocks employment variability increases. The optimal weight on inflation is therefore large but finite. &lt;b&gt;Why it matters:&lt;/b&gt; it is the &lt;b&gt;delegation&lt;/b&gt; solution (the “conservative central banker”) that underpins the idea of independent, inflation-averse central banks.&lt;/p&gt;
    &lt;a href=&quot;https://ideas.repec.org/a/oup/qjecon/v100y1985i4p1169-1189..html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt; · &lt;a href=&quot;https://rogoff.scholars.harvard.edu/publications/optimal-degree-commitment-intermediate-monetary-target&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Author&#x27;s page (Harvard)&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Giavazzi, F. &amp;amp; Pagano, M. (1988) · “The Advantage of Tying One&#x27;s Hands: EMS Discipline and Central Bank Credibility”&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;i&gt;European Economic Review&lt;/i&gt;, 32(5), pp. 1055–1075 · CEPR DP 135 version (1986) · cited on slide 26&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; membership of the EMS can yield large credibility gains for high-inflation countries, because it adds a penalty on inflation and makes the public aware of that penalty. The result depends on how much the government relies on seigniorage. &lt;b&gt;Why it matters:&lt;/b&gt; it is the origin of the expression “tying one&#x27;s hands” used in the lecture with reference to Italy.&lt;/p&gt;
    &lt;a href=&quot;https://ideas.repec.org/a/eee/eecrev/v32y1988i5p1055-1075.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt; · &lt;a href=&quot;https://www.nber.org/chapters/c11684.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER reprint (pdf)&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Maastricht convergence criteria · price stability&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;Art. 140 TFEU and Protocol No 13 on the convergence criteria · cited on slide 27&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; the Treaty requires an inflation rate close to that of the three best-performing Member States in terms of price stability. Protocol 13 sets the threshold: average inflation (HICP) in the year preceding the examination must not exceed that of those three countries by more than &lt;b&gt;1.5 percentage points&lt;/b&gt;. &lt;b&gt;Why it matters:&lt;/b&gt; it is the institutional instrument through which disinflation from E to F was made mandatory for joining the euro.&lt;/p&gt;
    &lt;a href=&quot;https://www.ecb.europa.eu/ecb/orga/escb/html/convergence-criteria.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB · Convergence criteria&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/pro_13/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex · Protocol 13&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Phillips, A. W. (1958) · the original Phillips curve&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;“The Relation Between Unemployment and the Rate of Change of Money Wage Rates in the United Kingdom, 1861–1957”, &lt;i&gt;Economica&lt;/i&gt;, 25(100), pp. 283–299 · concept used on slides 7–8, 13&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; a negative statistical relationship between unemployment and the growth of &lt;b&gt;nominal wages&lt;/b&gt; in the United Kingdom. The interpretation in terms of price inflation came later. &lt;b&gt;Why it matters:&lt;/b&gt; the lecture uses its “expectations-augmented” version, in which the trade-off holds only for unexpected inflation.&lt;/p&gt;
    &lt;a href=&quot;https://econpapers.repec.org/RePEc:bla:econom:v:25:y:1958:i:100:p:283-299&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers/RePEc&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Unilateral euroisation: Montenegro and Kosovo&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;cited on slide 26 as an analogy with dollarization&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;What it contains:&lt;/b&gt; both countries use the euro as their currency without being part of the euro area, and therefore without a monetary policy of their own. The Central Bank of Montenegro describes the euroisation regime and its limits. The ECB has repeatedly stated that unilateral euroisation is not compatible with the path laid down in the Treaties for adopting the euro. &lt;b&gt;Why it matters:&lt;/b&gt; it is the extreme case of “borrowed” credibility, like the lecture&#x27;s lira → DM scenario.&lt;/p&gt;
    &lt;a href=&quot;https://cbcg.me/en/core-functions/monetary-policy/euroisation&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Central Bank of Montenegro · Euroisation&lt;/a&gt; · &lt;a href=&quot;https://www.ecb.europa.eu/press/key/date/2015/html/sp150323.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB · 2015 speech&lt;/a&gt;&lt;/div&gt;

  &lt;p class=&quot;note&quot; style=&quot;margin-top:1.5rem&quot;&gt;&lt;b&gt;Note on the course materials:&lt;/b&gt; the brief asked for the lecture to be linked to the other files in the &lt;code&gt;corso/&lt;/code&gt; folder. In this session I had no tool to list their contents, so I did not consult them. The links with other lectures (asymmetric shocks and OCA before, self-fulfilling debt crises after) come only from what slides 2 and 29 say.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

let acts=[];

const subs=[&quot;C&quot;,&quot;C₂&quot;,&quot;C₃&quot;,&quot;C₄&quot;,&quot;C₅&quot;,&quot;C₆&quot;,&quot;C₇&quot;,&quot;C₈&quot;,&quot;C₉&quot;];
function trail(P,M){const A={u:P.uN,p:0,pe:0,l:&quot;A&quot;};let t=[A];

    else if(a===&quot;rational&quot;){t=[A,{u:P.uN,p:M.pE,pe:M.pE,l:&quot;E&quot;}];}
    else if(a===&quot;adapt&quot;){if(last.l===&quot;E&quot;)return;const pe=last.l===&quot;A&quot;?0:last.p,q=M.resp(pe);
      if(Math.abs(q.p-M.pE)&lt;0.06||t.length&gt;=10){q.l=&quot;E&quot;;q.u=P.uN;q.p=M.pE;q.pe=M.pE;}else q.l=last.l===&quot;A&quot;?&quot;B&quot;:subs[t.length-2]||&quot;C…&quot;;t.push(q);}});
  return t;}
function bg(){const P=par(),M=model(P);

  const t=trail(P,M),cur=t[t.length-1],ymax=Math.max(12,Math.ceil((M.pE+4)/4)*4);

  const B=M.resp(0),LA=P.w*Math.pow(P.uN-P.us,2),LB=B.p*B.p+P.w*Math.pow(B.u-P.us,2),LE=M.pE*M.pE+LA,Lc=cur.p*cur.p+P.w*Math.pow(cur.u-P.us,2);
  const pts=t.map((q,i)=&gt;({u:q.u,p:q.p,l:q.l,cls:i===t.length-1?&quot;pt&quot;:&quot;pt2&quot;,r:i===t.length-1?6:4.5,dx:q.l===&quot;A&quot;?8:-10,dy:q.l===&quot;A&quot;?-8:-8,anc:q.l===&quot;A&quot;?&quot;start&quot;:&quot;end&quot;}));
  if(!t.some(q=&gt;q.l===&quot;E&quot;))pts.unshift({u:P.uN,p:M.pE,l:&quot;E&quot;,cls:&quot;ptg&quot;,r:4.5});
  plot($(&quot;#bg-svg&quot;),{xmax:14,ymax:ymax,uN:P.uN,b:P.b,tx:2,ty:4,ol:P.us===0?&quot;ṗ*, u*&quot;:&quot;ṗ*&quot;,
    xlab:P.us&gt;0&amp;&amp;P.us&lt;P.uN?[{u:P.us,l:&quot;u*&quot;}]:[],

    rc:[{k:M.k,us:P.us}],path:t.map(q=&gt;[q.u,q.p]),pts:pts});
