    &lt;a href=&quot;#s3&quot;&gt;&lt;rect x=&quot;620&quot; y=&quot;228&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;730&quot; y=&quot;252&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Aspettative&lt;/text&gt;&lt;text x=&quot;730&quot; y=&quot;270&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;naïve · adaptive · rational&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s4&quot;&gt;&lt;rect x=&quot;60&quot; y=&quot;338&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;362&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Hard-nosed vs wet CB&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;380&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;reaction curves&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s4&quot;&gt;&lt;rect x=&quot;340&quot; y=&quot;338&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;362&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Rules vs discretion&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;380&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;reputation · delegation&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s5&quot;&gt;&lt;rect x=&quot;620&quot; y=&quot;338&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;730&quot; y=&quot;362&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Open economy&lt;/text&gt;&lt;text x=&quot;730&quot; y=&quot;380&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;inflation differential, svalutazioni&lt;/text&gt;&lt;/a&gt;

    &lt;a href=&quot;#s5&quot;&gt;&lt;text x=&quot;450&quot; y=&quot;540&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; fill=&quot;var(--brick)&quot; style=&quot;font-style:italic&quot;&gt;→ prossima lezione: self-fulfilling debt crises&lt;/text&gt;&lt;/a&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;

&lt;section id=&quot;s1&quot; class=&quot;part sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slide 1–6&lt;/div&gt;&lt;h2&gt;Credibilità e time inconsistency&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;h3&gt;Da dove nasce il problema: svalutare ha un prezzo&lt;/h3&gt;
  &lt;p&gt;Le slide partono da un legame con la teoria dell&#x27;unione monetaria. Un paese con moneta propria può reagire a un &lt;span class=&quot;term&quot;&gt;asymmetric permanent shock&lt;/span&gt; (uno shock che colpisce solo quel paese, o lo colpisce più degli altri, e non rientra da solo) svalutando: la moneta perde valore, i suoi beni costano meno all&#x27;estero e la competitività torna.&lt;/p&gt;
  &lt;p&gt;Se però le svalutazioni diventano &lt;em&gt;ricorrenti&lt;/em&gt;, il paese perde il &lt;span class=&quot;term&quot;&gt;control of inflation&lt;/span&gt; (il controllo dell&#x27;inflazione), che è l&#x27;obiettivo primario della politica monetaria. Chi perde la stabilità dei prezzi perde anche la &lt;span class=&quot;term&quot;&gt;credibility of monetary policy&lt;/span&gt;: nessuno crede più agli annunci della banca centrale.&lt;/p&gt;

  &lt;figure&gt;
  &lt;svg viewBox=&quot;0 0 860 150&quot; role=&quot;img&quot; aria-label=&quot;Catena: shock asimmetrico, svalutazioni, inflazione, perdita di credibilità, UME&quot;&gt;
    &lt;g font-size=&quot;13.5&quot;&gt;
      &lt;rect x=&quot;4&quot; y=&quot;34&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;79&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Asymmetric&lt;/text&gt;&lt;text x=&quot;79&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;permanent shock&lt;/text&gt;
      &lt;rect x=&quot;178&quot; y=&quot;34&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;253&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Svalutazioni&lt;/text&gt;&lt;text x=&quot;253&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;ricorrenti&lt;/text&gt;
      &lt;rect x=&quot;352&quot; y=&quot;34&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;427&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Inflazione&lt;/text&gt;&lt;text x=&quot;427&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;fuori controllo&lt;/text&gt;
      &lt;rect x=&quot;526&quot; y=&quot;34&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--accent-soft)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;601&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Persa la&lt;/text&gt;&lt;text x=&quot;601&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;credibilità&lt;/text&gt;
      &lt;rect x=&quot;700&quot; y=&quot;34&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;775&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Entrare nell&#x27;UME&lt;/text&gt;&lt;text x=&quot;775&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot;&gt;= recuperarla&lt;/text&gt;
      &lt;g class=&quot;thin&quot; marker-end=&quot;url(#arr)&quot;&gt;&lt;path d=&quot;M154,69 H176&quot;/&gt;&lt;path d=&quot;M328,69 H350&quot;/&gt;&lt;path d=&quot;M502,69 H524&quot;/&gt;&lt;path d=&quot;M676,69 H698&quot;/&gt;&lt;/g&gt;
      &lt;text x=&quot;430&quot; y=&quot;135&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot; style=&quot;font-style:italic&quot;&gt;La lezione serve a spiegare l&#x27;ultima freccia: perché aderire all&#x27;UME è stato, per molti paesi, un modo di recuperare credibilità&lt;/text&gt;
    &lt;/g&gt;
  &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;p&gt;La lezione ha due domande guida (slide 3):&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;b&gt;①&lt;/b&gt; Perché contano la credibilità della politica monetaria e la &lt;span class=&quot;term&quot;&gt;CB reputation&lt;/span&gt; (reputazione della banca centrale, CB = central bank)?&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;b&gt;②&lt;/b&gt; Come si guadagna credibilità monetaria entrando nell&#x27;&lt;span class=&quot;term&quot;&gt;EMU&lt;/span&gt; (Economic and Monetary Union, l&#x27;Unione economica e monetaria)?&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;callout link&quot;&gt;&lt;p&gt;Il tema degli asymmetric shock e del costo di rinunciare al cambio è la base della teoria dell&#x27;&lt;span class=&quot;term&quot;&gt;optimum currency area&lt;/span&gt; (area valutaria ottimale), trattata nelle lezioni precedenti del corso. &lt;span class=&quot;small&quot;&gt;Non ho potuto aprire gli altri file di &lt;code&gt;corso/&lt;/code&gt;: lo strumento a disposizione non permette di elencare le cartelle. Il collegamento viene dalla slide 2 di questa lezione, che dà il tema per noto.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Time inconsistency: promettere oggi, tradire domani&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Time inconsistency&lt;/b&gt; (incoerenza temporale). Un piano è &lt;em&gt;time-inconsistent&lt;/em&gt; quando la scelta migliore annunciata &lt;em&gt;prima&lt;/em&gt; non è più la migliore &lt;em&gt;dopo&lt;/em&gt; che gli altri hanno deciso basandosi sull&#x27;annuncio. Le slide: «policy makers find it optimal to announce a commitment to a particular policy and deviate from it &lt;b&gt;after&lt;/b&gt; the people have made their decisions based on the announcement».&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Credibility problem&lt;/b&gt; (problema di credibilità). Il governo annuncia una mossa. Se poi ha l&#x27;occasione di ottenere un risultato migliore nel breve periodo, la coglie anche a costo di «imbrogliare» il pubblico. Gli agenti razionali lo sanno, &lt;em&gt;anticipano&lt;/em&gt; l&#x27;imbroglio e adattano le proprie &lt;span class=&quot;term&quot;&gt;response functions&lt;/span&gt; (il modo in cui reagiscono alla politica).&lt;/div&gt;

  &lt;p&gt;Le slide ricordano che queste dinamiche si trovano in tantissime situazioni economiche e sociali. Scegli un esempio:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Debito pubblico&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Cambio fisso&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Tasse zero&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Esami&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div&gt;&lt;b&gt;Annuncio&lt;/b&gt;&lt;br&gt;Il governo emette titoli per spendere più di quanto incassa e promette di rimborsarli.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Tentazione ex post&lt;/b&gt;&lt;br&gt;Se arriva una crisi grave, è forte la spinta al &lt;span class=&quot;term&quot;&gt;default&lt;/span&gt; (non rimborsare).&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Se nessuno ci crede&lt;/b&gt;&lt;br&gt;Gli investitori non comprano i titoli, oppure li comprano solo con un premio di rischio.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div&gt;&lt;b&gt;Annuncio&lt;/b&gt;&lt;br&gt;Il paese entra in un &lt;span class=&quot;term&quot;&gt;fixed exchange rate regime&lt;/span&gt; (regime di cambio fisso).&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Tentazione ex post&lt;/b&gt;&lt;br&gt;Davanti a un grave shock della &lt;span class=&quot;term&quot;&gt;balance of payments&lt;/span&gt; (bilancia dei pagamenti), svalutare.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Se nessuno ci crede&lt;/b&gt;&lt;br&gt;I mercati scommettono sulla svalutazione: la parità resta fragile e i tassi salgono.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div&gt;&lt;b&gt;Annuncio&lt;/b&gt;&lt;br&gt;Per favorire l&#x27;innovazione, regime a tassazione zero per un settore.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Tentazione ex post&lt;/b&gt;&lt;br&gt;Quando il settore prospera, tassarlo comunque.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Se nessuno ci crede&lt;/b&gt;&lt;br&gt;Le imprese non investono in &lt;span class=&quot;term&quot;&gt;R&amp;amp;D&lt;/span&gt; (ricerca e sviluppo).&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div&gt;&lt;b&gt;Annuncio&lt;/b&gt;&lt;br&gt;Il docente annuncia l&#x27;esame per far studiare.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Tentazione ex post&lt;/b&gt;&lt;br&gt;Una volta che gli studenti hanno studiato, la cosa «migliore» sarebbe non farlo: si risparmiano tempo ed energie.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Se nessuno ci crede&lt;/b&gt;&lt;br&gt;Gli studenti non studiano fin dall&#x27;inizio.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;callout idea&quot;&gt;&lt;p&gt;Il meccanismo è sempre lo stesso: un annuncio funziona &lt;em&gt;solo se è credibile anche per il futuro&lt;/em&gt;. Se non lo è, cambia le scelte degli agenti fin da subito e l&#x27;annuncio diventa inutile.&lt;/p&gt;&lt;/div&gt;

  &lt;h4&gt;Il gioco della credibilità, passo per passo&lt;/h4&gt;
  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;svg viewBox=&quot;0 0 760 120&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;60&quot; x2=&quot;720&quot; y2=&quot;60&quot; class=&quot;axis&quot;/&gt;
      &lt;g data-st=&quot;0&quot;&gt;&lt;circle cx=&quot;90&quot; cy=&quot;60&quot; r=&quot;11&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;t₀ annuncio&lt;/text&gt;&lt;/g&gt;
      &lt;g data-st=&quot;1&quot;&gt;&lt;circle cx=&quot;290&quot; cy=&quot;60&quot; r=&quot;11&quot; fill=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;290&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;t₁ il pubblico decide&lt;/text&gt;&lt;/g&gt;
      &lt;g data-st=&quot;2&quot;&gt;&lt;circle cx=&quot;490&quot; cy=&quot;60&quot; r=&quot;11&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;t₂ la CB può deviare&lt;/text&gt;&lt;/g&gt;
      &lt;g data-st=&quot;3&quot;&gt;&lt;circle cx=&quot;680&quot; cy=&quot;60&quot; r=&quot;11&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;680&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;anticipazione&lt;/text&gt;&lt;/g&gt;
      &lt;text x=&quot;90&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;«inflazione 0%»&lt;/text&gt;
      &lt;text x=&quot;290&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;salari, contratti, BTP&lt;/text&gt;
      &lt;text x=&quot;490&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;sorpresa inflazionistica&lt;/text&gt;
      &lt;text x=&quot;680&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--ink2)&quot;&gt;πᵉ alta fin da t₁&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;steptext&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;template&gt;
      &lt;p&gt;&lt;b&gt;t₀ – Annuncio.&lt;/b&gt; La banca centrale annuncia: «l&#x27;inflazione sarà zero». Se tutti ci credessero, sarebbe l&#x27;esito socialmente migliore.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;t₁ – Il pubblico decide.&lt;/b&gt; Lavoratori e imprese fissano salari e prezzi nei contratti, i risparmiatori comprano titoli a tasso fisso: tutto sulla base dell&#x27;inflazione attesa (πᵉ = 0).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;t₂ – La tentazione.&lt;/b&gt; Ora i contratti sono bloccati. Un po&#x27; di inflazione inattesa abbassa i salari reali (le imprese assumono, la disoccupazione scende) e il valore reale del debito pubblico. Deviare conviene: l&#x27;annuncio era &lt;em&gt;time-inconsistent&lt;/em&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Anticipazione razionale.&lt;/b&gt; Agenti razionali capiscono il «trucco» fin da t₁ e si aspettano già inflazione alta. Risultato: inflazione alta e &lt;em&gt;nessun&lt;/em&gt; guadagno di occupazione. È l&#x27;equilibrio che il modello Barro-Gordon formalizza (sezione 3).&lt;/p&gt;
    &lt;/template&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Autoverifica&lt;/div&gt;&lt;h3&gt;Verifica la parte 1&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché svalutazioni ricorrenti fanno perdere credibilità alla politica monetaria?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Ogni svalutazione alza i prezzi dei beni importati e quindi l&#x27;inflazione. Se il paese svaluta ogni volta che subisce uno shock, perde il controllo dell&#x27;inflazione, cioè l&#x27;obiettivo primario della politica monetaria. Gli agenti smettono di credere agli annunci di stabilità dei prezzi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Dai una definizione di time inconsistency con le parole delle slide.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il policy maker trova ottimale annunciare un impegno e poi deviare &lt;b&gt;dopo&lt;/b&gt; che il pubblico ha preso le sue decisioni sulla base dell&#x27;annuncio.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Nell&#x27;esempio degli esami, qual è il danno che fa un annuncio non credibile?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Se gli studenti prevedono che l&#x27;esame non si terrà, non studiano fin dall&#x27;inizio: l&#x27;annuncio non produce più l&#x27;effetto per cui era stato fatto. Allo stesso modo, gli investitori non comprano titoli e le imprese non fanno R&amp;amp;D.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa fanno gli agenti razionali davanti a un governo tentato di «imbrogliare»?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Anticipano il tentativo e adattano le loro response functions, cioè le aspettative e i comportamenti, in modo che la sorpresa non funzioni più.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s2&quot; class=&quot;part ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slide 7–10, 13&lt;/div&gt;&lt;h2&gt;Perché alla banca centrale conviene sorprendere&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;p&gt;Perché un&#x27;autorità dovrebbe deviare da ciò che ha annunciato? Le slide danno due ragioni: la &lt;b&gt;curva di Phillips&lt;/b&gt; (più occupazione) e il &lt;b&gt;revenue incentive&lt;/b&gt; (meno debito reale).&lt;/p&gt;

  &lt;h3&gt;1 · La Phillips curve con aspettative&lt;/h3&gt;
  &lt;p&gt;La &lt;span class=&quot;term&quot;&gt;Phillips curve&lt;/span&gt; (curva di Phillips) descrive una relazione di breve periodo: &lt;em&gt;più inflazione si accompagna a meno disoccupazione&lt;/em&gt;, o, che è lo stesso, a più produzione e occupazione. Se la CB può influenzare l&#x27;inflazione e le interessano anche obiettivi reali come l&#x27;occupazione, è tentata di sfruttare questa relazione.&lt;/p&gt;
  &lt;p class=&quot;small&quot;&gt;Notazione delle slide: &lt;span class=&quot;v&quot;&gt;ṗ&lt;/span&gt; («p punto») è il tasso di inflazione, cioè la variazione percentuale del livello dei prezzi &lt;span class=&quot;v&quot;&gt;p&lt;/span&gt;; &lt;span class=&quot;v&quot;&gt;ṗᵉ&lt;/span&gt; è l&#x27;inflazione &lt;em&gt;attesa&lt;/em&gt;; &lt;span class=&quot;v&quot;&gt;u&lt;/span&gt; è il tasso di disoccupazione; &lt;span class=&quot;v&quot;&gt;ε&lt;/span&gt; è uno shock casuale.&lt;/p&gt;

  &lt;div class=&quot;formula&quot;&gt;ṗ = c − b·u + ṗᵉ + ε&lt;small&gt;&lt;span class=&quot;term&quot;&gt;Expectation-augmented Phillips curve&lt;/span&gt; (curva di Phillips aumentata con le aspettative). c, b &amp;gt; 0 sono parametri; b misura quanto l&#x27;inflazione reagisce alla disoccupazione.&lt;/small&gt;&lt;/div&gt;

  &lt;div class=&quot;stepper&quot; data-stepper&gt;
    &lt;div class=&quot;steptext&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Passo successivo →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;template&gt;
      &lt;div&gt;&lt;p&gt;&lt;b&gt;Passo 1 – Equilibrio di lungo periodo.&lt;/b&gt; Nel &lt;span class=&quot;term&quot;&gt;long-run stationary equilibrium&lt;/span&gt; (equilibrio stazionario di lungo periodo) le aspettative sono corrette: ṗ = ṗᵉ. Sostituendo (con ε = 0): 0 = c − b·u.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;u = c / b = u&lt;sub&gt;N&lt;/sub&gt;&lt;small&gt;&lt;span class=&quot;term&quot;&gt;Natural rate of unemployment&lt;/span&gt; (tasso naturale di disoccupazione): la disoccupazione che si ha quando l&#x27;inflazione non sorprende nessuno.&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p&gt;&lt;b&gt;Passo 2 – Riscrivere la curva di breve.&lt;/b&gt; Poiché c = b·u&lt;sub&gt;N&lt;/sub&gt;, si raccoglie b:&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;ṗ − ṗᵉ = b·(u&lt;sub&gt;N&lt;/sub&gt; − u) + ε&lt;small&gt;A sinistra c&#x27;è la &lt;span class=&quot;term&quot;&gt;surprise inflation&lt;/span&gt; (inflazione a sorpresa): la parte che nessuno si aspettava.&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;p&gt;&lt;b&gt;Passo 3 – Leggerla al contrario&lt;/b&gt; («ignoring causality issues», cioè senza chiedersi chi causa chi):&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;u = u&lt;sub&gt;N&lt;/sub&gt; − (1/b)·(ṗ − ṗᵉ) + ε&lt;small&gt;Le slide scrivono +ε; isolando u si avrebbe −ε/b, ma è solo un ridenominare lo shock.&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p&gt;&lt;b&gt;Lettura.&lt;/b&gt; La disoccupazione scende sotto u&lt;sub&gt;N&lt;/sub&gt; &lt;em&gt;solo&lt;/em&gt; se l&#x27;inflazione supera quella attesa. Un&#x27;inflazione alta ma prevista non dà nessun beneficio.&lt;/p&gt;
    &lt;/template&gt;
  &lt;/div&gt;

  &lt;div class=&quot;callout&quot;&gt;&lt;p&gt;&lt;b&gt;Il tasso naturale non è per forza ottimale.&lt;/b&gt; Il beneficio della sorpresa esiste perché il policy maker giudica u&lt;sub&gt;N&lt;/sub&gt; &lt;em&gt;troppo alto&lt;/em&gt; (per esempio a causa di rigidità del mercato del lavoro, tasse o sussidi). Per questo il suo obiettivo u* sta sotto u&lt;sub&gt;N&lt;/sub&gt;. Se fosse u* = u&lt;sub&gt;N&lt;/sub&gt;, la tentazione sparirebbe (vedi «target conservative», sezione 4).&lt;/p&gt;&lt;/div&gt;

  &lt;h4&gt;Prova: sposta le aspettative&lt;/h4&gt;
  &lt;div class=&quot;lab&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
    &lt;svg id=&quot;pcChart&quot; viewBox=&quot;0 0 440 300&quot; role=&quot;img&quot; aria-label=&quot;Short-run e long-run Phillips curve&quot;&gt;
      &lt;defs&gt;&lt;clipPath id=&quot;pcClip&quot;&gt;&lt;rect x=&quot;50&quot; y=&quot;20&quot; width=&quot;370&quot; height=&quot;240&quot;/&gt;&lt;/clipPath&gt;&lt;/defs&gt;
      &lt;g id=&quot;pcDyn&quot; clip-path=&quot;url(#pcClip)&quot;&gt;&lt;/g&gt;
      &lt;line class=&quot;axis&quot; x1=&quot;50&quot; y1=&quot;260&quot; x2=&quot;425&quot; y2=&quot;260&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;line class=&quot;axis&quot; x1=&quot;50&quot; y1=&quot;260&quot; x2=&quot;50&quot; y2=&quot;15&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;text x=&quot;420&quot; y=&quot;282&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;u&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;24&quot; font-size=&quot;13&quot;&gt;ṗ&lt;/text&gt;
      &lt;line x1=&quot;230&quot; y1=&quot;20&quot; x2=&quot;230&quot; y2=&quot;260&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;230&quot; y=&quot;278&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;u&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;N&lt;/tspan&gt;&lt;/text&gt;
      &lt;text x=&quot;236&quot; y=&quot;34&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;LRPC verticale&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Linee oblique: &lt;span class=&quot;term&quot;&gt;short-run Phillips curves&lt;/span&gt;, una per ogni livello di inflazione attesa. Linea verticale: &lt;span class=&quot;term&quot;&gt;long-run Phillips curve&lt;/span&gt;, l&#x27;insieme dei punti con u = u&lt;sub&gt;N&lt;/sub&gt; (slide 13).&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;ctrls&quot;&gt;
      &lt;label&gt;Inflazione attesa ṗᵉ &lt;output id=&quot;pcPeO&quot;&gt;2.0&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pcPe&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.5&quot; value=&quot;2&quot;&gt;
      &lt;label&gt;Inflazione effettiva ṗ &lt;output id=&quot;pcPO&quot;&gt;4.0&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pcP&quot; min=&quot;0&quot; max=&quot;9&quot; step=&quot;0.5&quot; value=&quot;4&quot;&gt;
      &lt;div class=&quot;readout&quot; id=&quot;pcRead&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Metti ṗ = ṗᵉ: il punto torna sulla verticale. La disoccupazione scende sotto u&lt;sub&gt;N&lt;/sub&gt; solo se c&#x27;è sorpresa.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;2 · Revenue incentive: l&#x27;inflazione come tassa sul debito&lt;/h3&gt;
  &lt;p&gt;Il debito pubblico è &lt;span class=&quot;term&quot;&gt;fixed in nominal terms&lt;/span&gt; (fissato in termini nominali, cioè in euro, non in potere d&#x27;acquisto). Le persone detengono titoli per un valore reale B&lt;sub&gt;t−1&lt;/sub&gt;/P&lt;sub&gt;t−1&lt;/sub&gt;, con un rendimento nominale R&lt;sub&gt;t−1&lt;/sub&gt; fissato quando sono stati comprati e ritenuto adeguato all&#x27;inflazione &lt;em&gt;attesa&lt;/em&gt;.&lt;/p&gt;
  &lt;p&gt;Un&#x27;inflazione a sorpresa riduce il valore reale di quei titoli e quindi la spesa reale futura dello Stato per interessi e rimborso del capitale. Le slide notano che il canale pesa davvero quando il debito pubblico è alto.&lt;/p&gt;
  &lt;div class=&quot;lab&quot;&gt;
    &lt;div class=&quot;card tint&quot; style=&quot;margin:0&quot;&gt;
      &lt;div class=&quot;kicker&quot;&gt;Esempio delle slide&lt;/div&gt;
      &lt;p&gt;Debito di &lt;b&gt;2000 miliardi&lt;/b&gt; e sorpresa dell&#x27;&lt;b&gt;1%&lt;/b&gt;: il valore reale del debito scende di circa &lt;b&gt;20 miliardi&lt;/b&gt;.&lt;/p&gt;
      &lt;div class=&quot;formula&quot; style=&quot;background:var(--paper)&quot;&gt;ΔB&lt;sub&gt;reale&lt;/sub&gt; ≈ B · (ṗ − ṗᵉ)&lt;small&gt;Esatto: B·(1 − 1/(1+sorpresa)); per sorprese piccole le due formule danno quasi lo stesso numero.&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ctrls&quot;&gt;
      &lt;label&gt;Debito pubblico (mld €) &lt;output id=&quot;rvBO&quot;&gt;2000&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rvB&quot; min=&quot;200&quot; max=&quot;3200&quot; step=&quot;100&quot; value=&quot;2000&quot;&gt;
      &lt;label&gt;Inflazione a sorpresa (%) &lt;output id=&quot;rvSO&quot;&gt;1.0&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rvS&quot; min=&quot;0&quot; max=&quot;6&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;
      &lt;div class=&quot;readout&quot; id=&quot;rvRead&quot;&gt;&lt;/div&gt;
      &lt;svg id=&quot;rvBar&quot; viewBox=&quot;0 0 300 46&quot; aria-hidden=&quot;true&quot;&gt;&lt;/svg&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;3 · Ma gli agenti non si ingannano per sempre&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Imparano.&lt;/b&gt; Consumatori, imprese e altri agenti aggiornano nel tempo le proprie aspettative d&#x27;inflazione.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Capiscono il trucco.&lt;/b&gt; Si rendono conto che il policy maker tenterà di creare surprise inflation per alzare l&#x27;output.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Nessun guadagno.&lt;/b&gt; Una volta aggiustate le aspettative, non c&#x27;è più alcun guadagno di output (o di entrate), &lt;em&gt;nemmeno nel breve periodo&lt;/em&gt;.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;La sorpresa porta anche dei &lt;b&gt;costi&lt;/b&gt;: le slide li legano al «changing prices», cioè ai costi del cambiare continuamente i prezzi. Per questo il modello mette benefici e costi in una &lt;span class=&quot;term&quot;&gt;loss function&lt;/span&gt; (funzione di perdita) da minimizzare sotto un vincolo, la Phillips curve. È il modello della sezione 3.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Autoverifica&lt;/div&gt;&lt;h3&gt;Verifica la parte 2&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Ricava u&lt;sub&gt;N&lt;/sub&gt; dalla curva ṗ = c − b·u + ṗᵉ.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Nel lungo periodo ṗ = ṗᵉ, quindi c − b·u = 0 e u = c/b = u&lt;sub&gt;N&lt;/sub&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Se ṗᵉ = 3%, ṗ = 5% e b = 2, di quanto la disoccupazione scende sotto u&lt;sub&gt;N&lt;/sub&gt;?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;u = u&lt;sub&gt;N&lt;/sub&gt; − (1/b)(ṗ − ṗᵉ) = u&lt;sub&gt;N&lt;/sub&gt; − (1/2)(2) = u&lt;sub&gt;N&lt;/sub&gt; − 1 punto percentuale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché il revenue incentive è più forte per paesi molto indebitati?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il guadagno è circa debito × sorpresa: a parità di sorpresa, più è grande il debito nominale, più valore reale viene eroso a favore dello Stato.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché è importante che u&lt;sub&gt;N&lt;/sub&gt; «need not be optimal»?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Se il policy maker fosse soddisfatto di u&lt;sub&gt;N&lt;/sub&gt;, non avrebbe motivo di creare sorprese. La tentazione nasce proprio dal ritenere u&lt;sub&gt;N&lt;/sub&gt; eccessivo (u* &amp;lt; u&lt;sub&gt;N&lt;/sub&gt;).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s3&quot; class=&quot;part slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slide 5, 11–18&lt;/div&gt;&lt;h2&gt;Il modello Barro-Gordon&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Il modello di &lt;b&gt;Barro e Gordon (1983)&lt;/b&gt;, costruito sull&#x27;idea di &lt;b&gt;Kydland e Prescott (1977)&lt;/b&gt;, mette insieme due ingredienti: le &lt;em&gt;preferenze&lt;/em&gt; dell&#x27;autorità (una loss function) e il &lt;em&gt;vincolo&lt;/em&gt; dell&#x27;economia (la Phillips curve con aspettative). Il risultato è che con la &lt;span class=&quot;term&quot;&gt;discretion&lt;/span&gt; (discrezionalità: decidere di volta in volta, senza impegni vincolanti) si arriva a un equilibrio con inflazione inutilmente alta.&lt;/p&gt;

  &lt;h3&gt;Le preferenze: la loss function&lt;/h3&gt;
  &lt;div class=&quot;formula&quot;&gt;L = a&lt;sub&gt;1&lt;/sub&gt;(ṗ − ṗ*)² + a&lt;sub&gt;2&lt;/sub&gt;(u − u*)²&lt;small&gt;ṗ* e u* sono i &lt;em&gt;target&lt;/em&gt; (obiettivi) di inflazione e disoccupazione; a&lt;sub&gt;1&lt;/sub&gt;, a&lt;sub&gt;2&lt;/sub&gt; &amp;gt; 0 sono i pesi.&lt;/small&gt;&lt;/div&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Scarti al quadrato.&lt;/b&gt; Conta la distanza dal target, non il segno; gli scarti grandi pesano molto più di quelli piccoli.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Pesi = preferenze.&lt;/b&gt; a&lt;sub&gt;1&lt;/sub&gt; grande: si teme l&#x27;inflazione. a&lt;sub&gt;2&lt;/sub&gt; grande: si teme la disoccupazione. Autorità diverse hanno pesi diversi.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Perdita minima nell&#x27;origine.&lt;/b&gt; Il &lt;span class=&quot;term&quot;&gt;bliss point&lt;/span&gt; (punto di massima soddisfazione) è (u*, ṗ*): lì L = 0.&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;svg viewBox=&quot;0 0 320 240&quot; role=&quot;img&quot; aria-label=&quot;Curve di indifferenza concentriche attorno al bliss point&quot;&gt;
      &lt;line class=&quot;axis&quot; x1=&quot;40&quot; y1=&quot;210&quot; x2=&quot;300&quot; y2=&quot;210&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;line class=&quot;axis&quot; x1=&quot;40&quot; y1=&quot;210&quot; x2=&quot;40&quot; y2=&quot;20&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;path d=&quot;M40,140 A90,70 0 0 1 130,210&quot; class=&quot;thin&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.6&quot;/&gt;
      &lt;path d=&quot;M40,105 A135,105 0 0 1 175,210&quot; class=&quot;thin&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.6&quot;/&gt;
      &lt;path d=&quot;M40,70 A180,140 0 0 1 220,210&quot; class=&quot;thin&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.6&quot;/&gt;
      &lt;text x=&quot;60&quot; y=&quot;136&quot; font-size=&quot;12&quot;&gt;I₁&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;101&quot; font-size=&quot;12&quot;&gt;I₂&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;66&quot; font-size=&quot;12&quot;&gt;I₃&lt;/text&gt;
      &lt;text x=&quot;20&quot; y=&quot;232&quot; font-size=&quot;11&quot;&gt;ṗ*, u*&lt;/text&gt;&lt;text x=&quot;292&quot; y=&quot;232&quot; font-size=&quot;12&quot;&gt;u&lt;/text&gt;&lt;text x=&quot;24&quot; y=&quot;28&quot; font-size=&quot;12&quot;&gt;ṗ&lt;/text&gt;
      &lt;text x=&quot;230&quot; y=&quot;60&quot; font-size=&quot;11&quot; fill=&quot;var(--ink2)&quot;&gt;perdita crescente&lt;/text&gt;&lt;path d=&quot;M230,70 L250,110&quot; class=&quot;thin&quot; marker-end=&quot;url(#arr)&quot;/&gt;
    &lt;/svg&gt;
    &lt;div&gt;&lt;p&gt;Le &lt;span class=&quot;term&quot;&gt;indifference curves&lt;/span&gt; (curve di indifferenza: combinazioni con la stessa perdita) sono archi attorno al bliss point. Le slide le chiamano «concave» guardandole dall&#x27;origine. Più sono lontane, più la perdita è alta: I₁ è preferita a I₃.&lt;/p&gt;&lt;p&gt;La loro &lt;b&gt;pendenza&lt;/b&gt; esprime quanta importanza si dà a combattere l&#x27;inflazione rispetto alla disoccupazione, cioè il rapporto a&lt;sub&gt;2&lt;/sub&gt;/a&lt;sub&gt;1&lt;/sub&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Il vincolo e l&#x27;equilibrio: i punti A, B, C, E&lt;/h3&gt;
  &lt;p&gt;L&#x27;autorità minimizza L, ma deve rispettare la Phillips curve di breve associata all&#x27;inflazione attesa del momento. Il grafico di slide 14, ricostruito qui sotto, mostra come le aspettative portino l&#x27;economia da A fino a E. Muovi i cursori e premi i bottoni.&lt;/p&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
    &lt;svg id=&quot;bgChart&quot; viewBox=&quot;0 0 460 330&quot; role=&quot;img&quot; aria-label=&quot;Grafico interattivo del modello Barro-Gordon&quot;&gt;
      &lt;defs&gt;&lt;clipPath id=&quot;bgClip&quot;&gt;&lt;rect x=&quot;50&quot; y=&quot;18&quot; width=&quot;390&quot; height=&quot;262&quot;/&gt;&lt;/clipPath&gt;&lt;/defs&gt;
      &lt;g id=&quot;bgDyn&quot; clip-path=&quot;url(#bgClip)&quot;&gt;&lt;/g&gt;
      &lt;line class=&quot;axis&quot; x1=&quot;50&quot; y1=&quot;280&quot; x2=&quot;445&quot; y2=&quot;280&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;line class=&quot;axis&quot; x1=&quot;50&quot; y1=&quot;280&quot; x2=&quot;50&quot; y2=&quot;12&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;text x=&quot;440&quot; y=&quot;302&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;u&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;22&quot; font-size=&quot;13&quot;&gt;ṗ&lt;/text&gt;
      &lt;text x=&quot;44&quot; y=&quot;300&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;ṗ*, u*&lt;/text&gt;
      &lt;g id=&quot;bgLab&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Archi: curve di indifferenza. Linea obliqua continua: Phillips curve di breve per l&#x27;inflazione attesa corrente. Tratteggio: &lt;span class=&quot;term&quot;&gt;reaction curve&lt;/span&gt;, le scelte ottime della CB per ogni possibile aspettativa. Verticale: u = u&lt;sub&gt;N&lt;/sub&gt;.&lt;/figcaption&gt;
    &lt;/figure&gt;
    &lt;div class=&quot;ctrls&quot;&gt;
      &lt;label&gt;Peso relativo disoccupazione a₂/a₁ &lt;output id=&quot;bgRO&quot;&gt;1.0&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;bgR&quot; min=&quot;0.2&quot; max=&quot;4&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;
      &lt;label&gt;Pendenza Phillips b &lt;output id=&quot;bgBO&quot;&gt;1.0&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;bgB&quot; min=&quot;0.5&quot; max=&quot;2&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;
      &lt;label&gt;Distanza u&lt;sub&gt;N&lt;/sub&gt; − u* &lt;output id=&quot;bgGO&quot;&gt;4.0&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;bgG&quot; min=&quot;0&quot; max=&quot;6&quot; step=&quot;0.5&quot; value=&quot;4&quot;&gt;
      &lt;div class=&quot;chips&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;bgHard&quot;&gt;Hard-nosed&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;bgWet&quot;&gt;Wet&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;chips&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;bgReset&quot;&gt;A · annuncio ṗ*&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;bgStep&quot;&gt;Adaptive: periodo +1&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;bgRat&quot;&gt;Rational → E&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;readout&quot; id=&quot;bgRead&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;A&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;B&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;C …&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;E&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;A = (u&lt;sub&gt;N&lt;/sub&gt;, ṗ*).&lt;/b&gt; L&#x27;autorità annuncia l&#x27;inflazione obiettivo ṗ*. Se il pubblico ci crede (ṗᵉ = ṗ*), la Phillips curve di breve passa per A. Ma A &lt;b&gt;non è credibile&lt;/b&gt;: lungo quella curva c&#x27;è un punto che l&#x27;autorità preferisce, B.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;B.&lt;/b&gt; Con ṗᵉ = ṗ* già fissata nei contratti, l&#x27;autorità sceglie il punto della Phillips curve tangente alla curva di indifferenza più bassa: un po&#x27; più di inflazione (ṗ₁) e meno disoccupazione. È il guadagno della sorpresa. Con &lt;span class=&quot;term&quot;&gt;naïve expectations&lt;/span&gt; (aspettative ingenue, che credono sempre all&#x27;annuncio) l&#x27;economia si ferma qui.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;C, e così via.&lt;/b&gt; Con &lt;span class=&quot;term&quot;&gt;adaptive expectations&lt;/span&gt; (aspettative adattive: domani mi aspetto l&#x27;inflazione che ho visto oggi) il pubblico pone ṗᵉ = ṗ₁. La Phillips curve sale, la CB sorprende di nuovo (punto C), e così via: i punti scorrono lungo la reaction curve tratteggiata. Il percorso delle slide è A → B → C → … → E.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;E = equilibrio time-consistent.&lt;/b&gt; Con &lt;span class=&quot;term&quot;&gt;rational expectations&lt;/span&gt; (aspettative razionali: il pubblico conosce il modello e gli incentivi della CB) si va subito in E. Lì la Phillips curve di breve è tangente alla curva di indifferenza &lt;em&gt;proprio&lt;/em&gt; su u = u&lt;sub&gt;N&lt;/sub&gt;: la CB non ha più motivo di deviare dall&#x27;inflazione che tutti si aspettano. Disoccupazione u&lt;sub&gt;N&lt;/sub&gt;, come in A, ma inflazione molto più alta.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Inflation bias&lt;/b&gt; (distorsione inflazionistica). In equilibrio E l&#x27;inflazione supera ṗ* senza nessun guadagno di occupazione (u = u&lt;sub&gt;N&lt;/sub&gt; in entrambi i casi). E è &lt;span class=&quot;term&quot;&gt;sub-optimal&lt;/span&gt; rispetto ad A: L&lt;sub&gt;E&lt;/sub&gt; &amp;gt; L&lt;sub&gt;A&lt;/sub&gt;. Tutti, banca centrale compresa, starebbero meglio se l&#x27;autorità potesse impegnarsi in modo vincolante su A.&lt;/div&gt;

  &lt;details&gt;&lt;summary&gt;La derivazione algebrica (soluzione standard; la slide 15 rimanda a un pdf non disponibile qui)&lt;/summary&gt;&lt;div&gt;
    &lt;p class=&quot;small&quot;&gt;Le slide dicono solo «Model – See pdf». La derivazione che segue è quella standard da manuale, scritta con la notazione delle slide e con ṗ* = 0 per semplicità. Verificala sul pdf del docente.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;1. Problema.&lt;/b&gt; Data ṗᵉ, la CB sceglie ṗ per minimizzare L = a&lt;sub&gt;1&lt;/sub&gt;ṗ² + a&lt;sub&gt;2&lt;/sub&gt;(u − u*)² sotto il vincolo u = u&lt;sub&gt;N&lt;/sub&gt; − (1/b)(ṗ − ṗᵉ).&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;2. Condizione del primo ordine.&lt;/b&gt; ∂L/∂ṗ = 2a&lt;sub&gt;1&lt;/sub&gt;ṗ + 2a&lt;sub&gt;2&lt;/sub&gt;(u − u*)·(−1/b) = 0, da cui:&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;ṗ = (a&lt;sub&gt;2&lt;/sub&gt; / (a&lt;sub&gt;1&lt;/sub&gt;b)) · (u − u*)&lt;small&gt;È la &lt;span class=&quot;term&quot;&gt;reaction curve&lt;/span&gt;: una retta che parte dal bliss point con pendenza a&lt;sub&gt;2&lt;/sub&gt;/(a&lt;sub&gt;1&lt;/sub&gt;b).&lt;/small&gt;&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;3. Aspettative razionali.&lt;/b&gt; In equilibrio ṗᵉ = ṗ, quindi u = u&lt;sub&gt;N&lt;/sub&gt;. Sostituendo:&lt;/p&gt;
    &lt;div class=&quot;formula&quot;&gt;ṗ&lt;sub&gt;E&lt;/sub&gt; = (a&lt;sub&gt;2&lt;/sub&gt; / (a&lt;sub&gt;1&lt;/sub&gt;b)) · (u&lt;sub&gt;N&lt;/sub&gt; − u*)&lt;small&gt;L&#x27;inflation bias cresce con il peso della disoccupazione (a&lt;sub&gt;2&lt;/sub&gt;/a&lt;sub&gt;1&lt;/sub&gt;) e con la distanza u&lt;sub&gt;N&lt;/sub&gt; − u*; si riduce se la Phillips curve è ripida (b grande).&lt;/small&gt;&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;4. Confronto delle perdite.&lt;/b&gt; L&lt;sub&gt;A&lt;/sub&gt; = a&lt;sub&gt;2&lt;/sub&gt;(u&lt;sub&gt;N&lt;/sub&gt; − u*)², mentre L&lt;sub&gt;E&lt;/sub&gt; = a&lt;sub&gt;1&lt;/sub&gt;ṗ&lt;sub&gt;E&lt;/sub&gt;² + a&lt;sub&gt;2&lt;/sub&gt;(u&lt;sub&gt;N&lt;/sub&gt; − u*)² &amp;gt; L&lt;sub&gt;A&lt;/sub&gt;. La parte in più è solo il costo dell&#x27;inflazione.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;Lo stesso risultato si trova in Barro e Gordon (1983, JPE) &lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;: l&#x27;inflazione di equilibrio dipende dalla pendenza della Phillips curve, dal costo relativo di disoccupazione e inflazione e dal tasso naturale (vedi &lt;a href=&quot;#fonti&quot;&gt;Per approfondire&lt;/a&gt;).&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Tre note delle slide (slide 17)&lt;/h3&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;b&gt;Inflation bias.&lt;/b&gt; E è peggio di A: inflazione più alta e stessa disoccupazione.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;b&gt;Rules vs discretion.&lt;/b&gt; Da qui nasce il dibattito «regole o discrezionalità»: è meglio che l&#x27;autorità segua &lt;span class=&quot;term&quot;&gt;rules&lt;/span&gt; (regole fisse e vincolanti) invece di decidere caso per caso?&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;b&gt;Ipotesi forte.&lt;/b&gt; Il modello assume &lt;span class=&quot;term&quot;&gt;rational agents with strategic behaviour&lt;/span&gt;: agenti razionali che ragionano in modo strategico sulle mosse della CB.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Autoverifica&lt;/div&gt;&lt;h3&gt;Verifica la parte 3&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché l&#x27;annuncio del punto A non è credibile?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Se il pubblico fissa ṗᵉ = ṗ*, l&#x27;autorità preferisce B ad A (sta su una curva di indifferenza più bassa). Il pubblico razionale lo sa e non crede all&#x27;annuncio.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che cosa caratterizza il punto E?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;È il punto in cui, con ṗᵉ = ṗ&lt;sub&gt;E&lt;/sub&gt;, la scelta ottima della CB è proprio ṗ&lt;sub&gt;E&lt;/sub&gt;: nessun incentivo a deviare (equilibrio time-consistent con aspettative razionali). Sta su u = u&lt;sub&gt;N&lt;/sub&gt;, con inflazione sopra ṗ*.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Abbina le aspettative ai punti: naïve, adaptive, rational.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Naïve → B; rational → E; adaptive → percorso A, B, C, …, E.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Con la formula ṗ&lt;sub&gt;E&lt;/sub&gt; = (a₂/(a₁b))(u&lt;sub&gt;N&lt;/sub&gt; − u*), calcola l&#x27;inflation bias per a₂/a₁ = 0.5, b = 1, u&lt;sub&gt;N&lt;/sub&gt; − u* = 4.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;ṗ&lt;sub&gt;E&lt;/sub&gt; − ṗ* = 0.5 × 4 / 1 = 2 punti percentuali. Con a₂/a₁ = 2 diventerebbe 8: la CB «wet» ha un bias quattro volte più grande.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché si dice che la discrezionalità può peggiorare la situazione di tutti?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché in E la disoccupazione è la stessa di A, ma l&#x27;inflazione è più alta: la perdita è maggiore sia per la società sia per l&#x27;autorità stessa, che starebbe meglio se potesse impegnarsi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s4&quot; class=&quot;part slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slide 19–23&lt;/div&gt;&lt;h2&gt;Preferenze dell&#x27;autorità e vie d&#x27;uscita&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;h3&gt;‘Hard-nosed’ contro ‘wet’&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;kicker&quot; style=&quot;color:var(--slate)&quot;&gt;Hard-nosed CB&lt;/div&gt;&lt;p&gt;Banca centrale «dal naso duro»: dà &lt;b&gt;molto peso alla lotta all&#x27;inflazione&lt;/b&gt; (a&lt;sub&gt;1&lt;/sub&gt; alto). Le curve di indifferenza sono schiacciate: anche poca inflazione costa molto.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;kicker&quot; style=&quot;color:var(--brick)&quot;&gt;Wet CB&lt;/div&gt;&lt;p&gt;Banca centrale «morbida»: dà &lt;b&gt;molto peso alla lotta alla disoccupazione&lt;/b&gt; (a&lt;sub&gt;2&lt;/sub&gt; alto). Le curve sono allungate in verticale: accetta molta inflazione pur di ridurre u.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;align-items:center&quot;&gt;
    &lt;svg viewBox=&quot;0 0 340 260&quot; role=&quot;img&quot; aria-label=&quot;Reaction curves di una CB hard-nosed e di una wet&quot;&gt;
      &lt;line class=&quot;axis&quot; x1=&quot;40&quot; y1=&quot;230&quot; x2=&quot;320&quot; y2=&quot;230&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;line class=&quot;axis&quot; x1=&quot;40&quot; y1=&quot;230&quot; x2=&quot;40&quot; y2=&quot;14&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;line x1=&quot;220&quot; y1=&quot;20&quot; x2=&quot;220&quot; y2=&quot;230&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;1.4&quot;/&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;230&quot; x2=&quot;220&quot; y2=&quot;50&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2.4&quot; stroke-dasharray=&quot;8 5&quot;/&gt;
      &lt;line x1=&quot;40&quot; y1=&quot;230&quot; x2=&quot;220&quot; y2=&quot;168&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;2.4&quot; stroke-dasharray=&quot;8 5&quot;/&gt;
      &lt;circle cx=&quot;220&quot; cy=&quot;50&quot; r=&quot;5&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;circle cx=&quot;220&quot; cy=&quot;168&quot; r=&quot;5&quot; fill=&quot;var(--slate)&quot;/&gt;&lt;circle cx=&quot;220&quot; cy=&quot;230&quot; r=&quot;4&quot; fill=&quot;var(--ink)&quot;/&gt;
      &lt;text x=&quot;228&quot; y=&quot;46&quot; font-size=&quot;12&quot; fill=&quot;var(--brick)&quot; font-weight=&quot;600&quot;&gt;E wet&lt;/text&gt;
      &lt;text x=&quot;228&quot; y=&quot;164&quot; font-size=&quot;12&quot; fill=&quot;var(--slate)&quot; font-weight=&quot;600&quot;&gt;E hard-nosed&lt;/text&gt;
      &lt;text x=&quot;228&quot; y=&quot;224&quot; font-size=&quot;12&quot;&gt;A&lt;/text&gt;
      &lt;text x=&quot;214&quot; y=&quot;248&quot; font-size=&quot;12&quot;&gt;u&lt;tspan font-size=&quot;9&quot; dy=&quot;3&quot;&gt;N&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;16&quot; y=&quot;250&quot; font-size=&quot;11&quot;&gt;ṗ*, u*&lt;/text&gt;&lt;text x=&quot;312&quot; y=&quot;250&quot; font-size=&quot;12&quot;&gt;u&lt;/text&gt;&lt;text x=&quot;24&quot; y=&quot;22&quot; font-size=&quot;12&quot;&gt;ṗ&lt;/text&gt;
      &lt;path d=&quot;M232,72 L232,150&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.4&quot; marker-end=&quot;url(#arr)&quot; marker-start=&quot;url(#arr)&quot;/&gt;&lt;text x=&quot;238&quot; y=&quot;114&quot; font-size=&quot;11&quot; fill=&quot;var(--accent)&quot;&gt;differenza&lt;/text&gt;&lt;text x=&quot;238&quot; y=&quot;128&quot; font-size=&quot;11&quot; fill=&quot;var(--accent)&quot;&gt;di inflazione&lt;/text&gt;
    &lt;/svg&gt;
    &lt;div&gt;
      &lt;p&gt;Le rette tratteggiate sono le &lt;span class=&quot;term&quot;&gt;reaction curves&lt;/span&gt;: il luogo delle scelte ottime dell&#x27;autorità per ogni valore del vincolo, cioè per ogni aspettativa. La loro &lt;b&gt;pendenza dipende dalle preferenze&lt;/b&gt;, a&lt;sub&gt;2&lt;/sub&gt;/(a&lt;sub&gt;1&lt;/sub&gt;b): ripida per la CB wet, piatta per la hard-nosed.&lt;/p&gt;
      &lt;p&gt;Entrambe incontrano la verticale u = u&lt;sub&gt;N&lt;/sub&gt;: &lt;b&gt;le CB hard-nosed ottengono meno inflazione senza imporre più disoccupazione &lt;em&gt;nel lungo periodo&lt;/em&gt;&lt;/b&gt;. Nel breve, durante la disinflazione, il costo c&#x27;è (sezione 5).&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;Prova i bottoni «Hard-nosed» e «Wet» nel grafico della sezione 3.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Conclusione del modello BG (slide 22)&lt;/h3&gt;
  &lt;div class=&quot;callout idea&quot;&gt;&lt;p&gt;«Discretionary policymaking can make everyone worse off compared with a situation in which the government could commit to a particular policy path.» La discrezionalità può peggiorare la situazione di tutti rispetto a un governo capace di impegnarsi su un percorso di politica.&lt;/p&gt;&lt;/div&gt;
  &lt;ul class=&quot;tight&quot;&gt;
    &lt;li&gt;Il lavoro di &lt;b&gt;Kydland e Prescott&lt;/b&gt; non riguardava solo la politica monetaria ma ogni tipo di politica pubblica (fisco, debito, regolazione…).&lt;/li&gt;
    &lt;li&gt;I lavori del 1983 di &lt;b&gt;Barro e Gordon&lt;/b&gt; si concentrano sulla politica monetaria e mostrano che le &lt;span class=&quot;term&quot;&gt;monetary rules&lt;/span&gt; (regole monetarie) possono superare la time inconsistency.&lt;/li&gt;
    &lt;li&gt;Più tardi, &lt;b&gt;Rogoff (1985)&lt;/b&gt; propone la &lt;span class=&quot;term&quot;&gt;delegation&lt;/span&gt; (delega): affidare la politica monetaria a un&#x27;autorità con preferenze diverse da quelle della società.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Rules&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Reputation&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Delegation&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Confronto&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Regole vincolanti.&lt;/b&gt; Se l&#x27;autorità è obbligata da una regola, per esempio «inflazione = ṗ*», non può sorprendere. Il pubblico lo sa e l&#x27;economia resta in A. Il problema è rendere la regola davvero vincolante, cioè difficile da cambiare.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Reputazione.&lt;/b&gt; Nel secondo articolo del 1983 (Journal of Monetary Economics) Barro e Gordon mostrano che, in un gioco ripetuto, la paura di perdere la reputazione può sostituire in parte una regola formale. L&#x27;esito sta fra la discrezionalità e la regola ideale &lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Delega a un banchiere «conservatore».&lt;/b&gt; Rogoff (1985): la società può stare meglio nominando un banchiere centrale che dà all&#x27;inflazione un peso &lt;em&gt;maggiore&lt;/em&gt; di quello che le dà la società. Così l&#x27;inflazione time-consistent scende, ma la stabilizzazione dell&#x27;occupazione peggiora quando ci sono shock di offerta grandi &lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;. È la base teorica della &lt;span class=&quot;term&quot;&gt;central bank independence&lt;/span&gt; (indipendenza della banca centrale).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Regime&lt;/th&gt;&lt;th&gt;Inflazione&lt;/th&gt;&lt;th&gt;Disoccupazione (lungo periodo)&lt;/th&gt;&lt;th&gt;Problema&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Discretion&lt;/td&gt;&lt;td&gt;alta (E)&lt;/td&gt;&lt;td&gt;u&lt;sub&gt;N&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;inflation bias&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Rule credibile&lt;/td&gt;&lt;td&gt;ṗ* (A)&lt;/td&gt;&lt;td&gt;u&lt;sub&gt;N&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;chi garantisce la regola?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Reputation&lt;/td&gt;&lt;td&gt;fra A ed E&lt;/td&gt;&lt;td&gt;u&lt;sub&gt;N&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;regge solo se il futuro conta abbastanza&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Delegation (Rogoff)&lt;/td&gt;&lt;td&gt;più bassa&lt;/td&gt;&lt;td&gt;u&lt;sub&gt;N&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;meno stabilizzazione degli shock&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Altre preferenze possibili (slide 23)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;b&gt;Super conservative.&lt;/b&gt; Le slide scrivono «b = 0 in the loss function»: si intende che il peso sulla disoccupazione è nullo (nella notazione L = a&lt;sub&gt;1&lt;/sub&gt;(…)² + a&lt;sub&gt;2&lt;/sub&gt;(…)², a&lt;sub&gt;2&lt;/sub&gt; = 0; b qui non è la pendenza della Phillips curve). La reaction curve diventa orizzontale su ṗ*: &lt;b&gt;E coincide con A&lt;/b&gt;, nessun inflation bias. Il prezzo è che la CB non reagisce più agli shock sull&#x27;occupazione.&lt;/div&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;b&gt;Target conservative.&lt;/b&gt; L&#x27;obiettivo di disoccupazione coincide con il tasso naturale: &lt;b&gt;u* = u&lt;sub&gt;N&lt;/sub&gt;&lt;/b&gt;. Non c&#x27;è niente da guadagnare con la sorpresa, quindi ṗ&lt;sub&gt;E&lt;/sub&gt; = ṗ* (nel grafico della sezione 3, porta u&lt;sub&gt;N&lt;/sub&gt; − u* a 0). La CB può ancora stabilizzare gli shock.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;L&#x27;interpretazione di «b = 0» è mia: confrontala con il pdf del modello indicato dal docente.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Autoverifica&lt;/div&gt;&lt;h3&gt;Verifica la parte 4&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Che cos&#x27;è una reaction curve e da cosa dipende la sua pendenza?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;È il luogo delle scelte ottime dell&#x27;autorità per ogni valore del vincolo (ogni aspettativa d&#x27;inflazione). La pendenza dipende dalle preferenze: è più ripida quanto più l&#x27;autorità tiene alla disoccupazione (a₂/a₁ alto).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Una CB hard-nosed genera più disoccupazione di una wet?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Non nel lungo periodo: entrambe finiscono su u = u&lt;sub&gt;N&lt;/sub&gt;. La hard-nosed ha solo meno inflazione.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Qual è l&#x27;idea di Rogoff (1985)?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Delegare la politica monetaria a un banchiere centrale più avverso all&#x27;inflazione della società: riduce l&#x27;inflation bias, al costo di stabilizzare meno l&#x27;occupazione davanti agli shock.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché con u* = u&lt;sub&gt;N&lt;/sub&gt; scompare l&#x27;inflation bias?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché l&#x27;autorità non vuole portare la disoccupazione sotto u&lt;sub&gt;N&lt;/sub&gt;, quindi non ha motivo di creare surprise inflation: la reaction curve passa per A.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s5&quot; class=&quot;part brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Slide 24–29&lt;/div&gt;&lt;h2&gt;Economia aperta: Germania, Italia e l&#x27;UME&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;h3&gt;Due banche centrali, due equilibri&lt;/h3&gt;
  &lt;p&gt;Ora due paesi: la Germania con una CB hard-nosed (la &lt;b&gt;Bundesbank&lt;/b&gt;) e quindi un equilibrio a bassa inflazione; l&#x27;Italia con una CB wet e un equilibrio ad alta inflazione. Nasce un &lt;span class=&quot;term&quot;&gt;inflation differential&lt;/span&gt; (differenziale d&#x27;inflazione): i prezzi italiani crescono più in fretta di quelli tedeschi. Per non perdere competitività, l&#x27;Italia deve &lt;b&gt;svalutare ripetutamente&lt;/b&gt; la lira sul marco (DM). È il circolo vizioso della sezione 1.&lt;/p&gt;

  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;La domanda chiave (slide 25–26).&lt;/b&gt; Come possono le autorità italiane rendere &lt;em&gt;credibile&lt;/em&gt; l&#x27;annuncio del punto F, cioè inflazione tedesca senza più disoccupazione nel lungo periodo? Se annunciano F e basta, il pubblico sa che sarebbero tentate di andare in G (sorpresa) e torna ad aspettarsi E. Senza credibilità l&#x27;inflazione italiana resta alta e servono svalutazioni ricorrenti per restare competitivi.&lt;/div&gt;

  &lt;h3&gt;Tre strade, sempre più vincolanti&lt;/h3&gt;

    &lt;div class=&quot;steptext&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;template&gt;
      &lt;p&gt;&lt;b&gt;1. Passare al cambio fisso.&lt;/b&gt; Con il cambio fisso non si recupera competitività svalutando: l&#x27;inflazione in eccesso si paga con meno esportazioni, e questo rende più costoso inflazionare. È più credibile di un semplice annuncio di inflazione, &lt;b&gt;ma non del tutto&lt;/b&gt;: resta la tentazione di creare inflazione a sorpresa, oppure di svalutare e cambiare la parità annunciata (un &lt;span class=&quot;term&quot;&gt;realignment&lt;/span&gt;, riallineamento).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;2. Abbandonare la lira per il marco.&lt;/b&gt; L&#x27;Italia «prende in prestito» le preferenze e la credibilità della Bundesbank e ne gode la bassa inflazione. Le slide fanno l&#x27;analogia con la &lt;span class=&quot;term&quot;&gt;dollarization&lt;/span&gt; (adottare unilateralmente il dollaro come moneta) di piccole economie dell&#x27;America Latina, o con l&#x27;uso dell&#x27;euro in Kosovo e Montenegro. In questo caso le autorità italiane si &lt;span class=&quot;term&quot;&gt;tie their hands&lt;/span&gt; (si «legano le mani»), con l&#x27;espressione di Giavazzi e Pagano.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;3. Creare un&#x27;unione monetaria GER–ITA.&lt;/b&gt; È una scelta più complessa: un&#x27;unione monetaria ha una &lt;b&gt;nuova&lt;/b&gt; banca centrale, che deve costruirsi da zero la propria reputazione. Il guadagno c&#x27;è se la nuova CB è più credibile di quella nazionale: è stato il caso di diversi paesi europei con la BCE.&lt;/p&gt;
    &lt;/template&gt;
  &lt;/div&gt;

  &lt;h3&gt;Da E a F: una disinflazione che costa&lt;/h3&gt;
  &lt;p&gt;Il passaggio da E a F &lt;b&gt;non è stato né indolore né rapido&lt;/b&gt;. Uno dei &lt;span class=&quot;term&quot;&gt;Maastricht convergence criteria&lt;/span&gt; (i criteri di convergenza fissati dal Trattato di Maastricht per entrare nell&#x27;euro) chiede di portare l&#x27;inflazione a non più di &lt;b&gt;1,5 punti percentuali&lt;/b&gt; sopra la media dei &lt;b&gt;tre paesi con l&#x27;inflazione più bassa&lt;/b&gt;. I paesi hanno avuto quasi &lt;b&gt;10 anni&lt;/b&gt; per convergere, e le politiche adottate per entrare erano anche un &lt;em&gt;segnale&lt;/em&gt; che le preferenze dei policy maker stavano cambiando.&lt;/p&gt;

    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;template&gt;
      &lt;p&gt;&lt;b&gt;Partenza: E.&lt;/b&gt; L&#x27;Italia è nell&#x27;equilibrio ad alta inflazione, sulla Phillips curve di breve (rossa) coerente con aspettative alte.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Stretta monetaria.&lt;/b&gt; L&#x27;inflazione scende ma le aspettative restano alte (contratti già fissati, credibilità ancora bassa): l&#x27;economia scende &lt;em&gt;lungo&lt;/em&gt; la Phillips curve di breve e la &lt;b&gt;disoccupazione sale&lt;/b&gt; sopra u&lt;sub&gt;N&lt;/sub&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Le aspettative cominciano a scendere.&lt;/b&gt; Solo man mano che il pubblico crede alla nuova politica la Phillips curve di breve si sposta verso il basso e la disoccupazione rientra.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Aggiustamento graduale.&lt;/b&gt; Ogni calo delle aspettative sposta di nuovo la curva. Nel frattempo, come dicono le slide, la disoccupazione è diventata un serio problema in Europa.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Arrivo: F.&lt;/b&gt; Inflazione al livello tedesco e disoccupazione di nuovo a u&lt;sub&gt;N&lt;/sub&gt;. Il guadagno di credibilità è permanente, ma il costo della transizione è stato reale.&lt;/p&gt;
    &lt;/template&gt;

  &lt;h3&gt;Conclusioni (slide 29)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;b&gt;Il guadagno.&lt;/b&gt; Entrare in un&#x27;unione monetaria conviene anche se la nuova CB è più credibile di quella nazionale: aiuta a ridurre l&#x27;inflazione. È stato il caso di alcuni paesi europei.&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-color:var(--accent)&quot;&gt;&lt;b&gt;Il rovescio.&lt;/b&gt; In un&#x27;unione monetaria senza &lt;span class=&quot;term&quot;&gt;budgetary union&lt;/span&gt; (unione di bilancio) o altre protezioni, l&#x27;indipendenza della CB dai governi può avere effetti negativi: rende possibili le &lt;span class=&quot;term&quot;&gt;self-fulfilling debt crises&lt;/span&gt; (crisi del debito che si autoavverano, perché la paura stessa del default lo provoca). È il tema della prossima lezione.&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Autoverifica&lt;/div&gt;&lt;h3&gt;Verifica la parte 5&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;Perché con CB diverse l&#x27;Italia doveva svalutare ripetutamente?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;La CB wet porta a un equilibrio con inflazione più alta di quella tedesca. Il differenziale d&#x27;inflazione fa perdere competitività di prezzo all&#x27;Italia, che la recupera svalutando la lira.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché il cambio fisso non basta a rendere F del tutto credibile?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché restano la tentazione di sorprendere con l&#x27;inflazione e quella di svalutare cambiando la parità annunciata. È più credibile di un annuncio sull&#x27;inflazione, ma non è irreversibile.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra adottare il marco e creare un&#x27;unione monetaria con la Germania?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Adottando il marco l&#x27;Italia prende in prestito una reputazione già esistente (quella della Bundesbank). In un&#x27;unione monetaria nasce una nuova CB che deve costruirsi la propria reputazione.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Enuncia il criterio di Maastricht sull&#x27;inflazione citato nelle slide.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Inflazione non superiore di oltre 1,5 punti percentuali alla media dei tre paesi con l&#x27;inflazione più bassa.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché il passaggio da E a F ha fatto salire la disoccupazione?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché le aspettative d&#x27;inflazione sono scese lentamente: con aspettative ancora alte, ridurre l&#x27;inflazione effettiva significa muoversi lungo la Phillips curve di breve verso disoccupazione più alta, finché la curva non si sposta in basso.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;fonti&quot; class=&quot;part ext-c&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;part-head&quot;&gt;&lt;span class=&quot;num&quot;&gt;↗&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Per approfondire&lt;/div&gt;&lt;h2&gt;Autori, studi e norme citati nelle slide&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Ogni voce è citata nelle slide &lt;span class=&quot;badge sl&quot;&gt;slide&lt;/span&gt;. Dati bibliografici, descrizione e link vengono da ricerche web &lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt;: sono distinti dal contenuto delle slide e vanno controllati sulla fonte.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Kydland, F. E. &amp;amp; Prescott, E. C. (1977), «Rules Rather than Discretion: The Inconsistency of Optimal Plans»&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 5, 22&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; &lt;i&gt;Journal of Political Economy&lt;/i&gt;, 85(3), pp. 473–492, DOI 10.1086/260580.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; mostra che una politica discrezionale, anche con un obiettivo sociale fisso e piena conoscenza degli effetti, non massimizza quell&#x27;obiettivo, perché la politica economica è un gioco contro agenti razionali e non «contro la natura». Di qui la tesi a favore delle regole.&lt;br&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;articolo da cui nasce il concetto di time inconsistency su cui si basa tutta la lezione.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://doi.org/10.1086/260580&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;doi.org/10.1086/260580&lt;/a&gt; · &lt;a href=&quot;https://www.econbiz.de/Record/rules-rather-than-discretion-the-inconsistency-of-optimal-plans/10002347684&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda EconBiz&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Premio Nobel per l&#x27;economia 2004 — Kydland e Prescott&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 5&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; Assegnato dalla Royal Swedish Academy of Sciences «for their contributions to dynamic macroeconomics: the time consistency of economic policy and the driving forces behind business cycles».&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; il comunicato e la scheda divulgativa spiegano che una politica annunciata come ottimale spesso non viene poi attuata, e che queste tentazioni possono intrappolare l&#x27;economia in un&#x27;inflazione alta senza effetti sulla disoccupazione. La scheda la usa anche per spiegare il fallimento della lotta all&#x27;inflazione negli anni &#x27;70.&lt;br&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è un riassunto ufficiale e accessibile dell&#x27;idea della lezione.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.nobelprize.org/prizes/economic-sciences/2004/press-release/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Press release (nobelprize.org)&lt;/a&gt; · &lt;a href=&quot;https://www.nobelprize.org/nobel_prizes/economic-sciences/laureates/2004/popular.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Popular information&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Barro, R. J. &amp;amp; Gordon, D. B. (1983a), «A Positive Theory of Monetary Policy in a Natural Rate Model»&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 5, 22&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; &lt;i&gt;Journal of Political Economy&lt;/i&gt;, 91(4), pp. 589–610; prima versione: NBER Working Paper 807 (1981).&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; un policy maker discrezionale può creare inflazione a sorpresa per ridurre la disoccupazione e aumentare le entrate. Se il pubblico conosce i suoi obiettivi, le sorprese non possono essere sistematiche: l&#x27;inflazione media risulta eccessiva e dipende dalla pendenza della Phillips curve, dal costo relativo di disoccupazione e inflazione e dal tasso naturale. Una regola che vincola le scelte future migliora i risultati.&lt;br&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è il «modello BG» della lezione, con i due incentivi della sezione 2.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.nber.org/papers/w0807&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER w0807 (pdf disponibile)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Barro, R. J. &amp;amp; Gordon, D. B. (1983b), «Rules, Discretion and Reputation in a Model of Monetary Policy»&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 5, 22&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; &lt;i&gt;Journal of Monetary Economics&lt;/i&gt;, 12(1), pp. 101–121; NBER Working Paper 1079.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; confronta discrezionalità e regole e mostra che la reputazione, in un gioco ripetuto, può sostituire in parte una regola formale. L&#x27;equilibrio reputazionale sta fra l&#x27;esito discrezionale e la regola ideale, ed è più vicino alla discrezionalità se il policy maker sconta molto il futuro.&lt;br&gt;&lt;b&gt;Perché conta:&lt;/b&gt; introduce la «CB reputation» citata fra gli obiettivi della lezione.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.nber.org/papers/w1079&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER w1079 (pdf disponibile)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Rogoff, K. (1985), «The Optimal Degree of Commitment to an Intermediate Monetary Target»&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 22&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; &lt;i&gt;Quarterly Journal of Economics&lt;/i&gt;, 100(4), pp. 1169–1189, DOI 10.2307/1885679.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; la società può stare meglio nominando un banchiere centrale che dà all&#x27;inflazione un peso «troppo grande» rispetto all&#x27;occupazione. L&#x27;inflazione time-consistent scende, ma la variabilità dell&#x27;occupazione cresce quando gli shock di offerta sono grandi.&lt;br&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è la soluzione per &lt;em&gt;delegation&lt;/em&gt; e la base teorica delle banche centrali indipendenti e conservatrici, come la BCE.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://ideas.repec.org/a/oup/qjecon/v100y1985i4p1169-1189..html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda RePEc/IDEAS&lt;/a&gt; · &lt;a href=&quot;https://rogoff.scholars.harvard.edu/publications/optimal-degree-commitment-intermediate-monetary-target&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;pagina dell&#x27;autore (Harvard)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Giavazzi, F. &amp;amp; Pagano, M. (1988), «The Advantage of Tying One&#x27;s Hands: EMS Discipline and Central Bank Credibility»&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 27&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; &lt;i&gt;European Economic Review&lt;/i&gt;, 32(5), pp. 1055–1075; prima versione CEPR Discussion Paper 135 (1986).&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; l&#x27;adesione allo &lt;span class=&quot;term&quot;&gt;EMS&lt;/span&gt; (European Monetary System, il sistema di cambi semi-fissi europeo prima dell&#x27;euro) aggiunge una penalità all&#x27;inflazione, cioè la perdita di competitività, e rende il pubblico consapevole di questa penalità. Così aiuta a superare la sfiducia verso le autorità.&lt;br&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;origine dell&#x27;espressione «tie their hands» e il ponte fra il modello BG e la scelta italiana del cambio fisso e poi dell&#x27;euro.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://ideas.repec.org/a/eee/eecrev/v32y1988i5p1055-1075.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda RePEc/IDEAS&lt;/a&gt; · &lt;a href=&quot;https://www.nber.org/chapters/c11684.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ristampa NBER (pdf)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Criteri di convergenza di Maastricht — stabilità dei prezzi&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 27&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; Trattato sull&#x27;Unione europea (Maastricht, 1992), oggi art. 140 TFUE e Protocollo n. 13.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; un paese rispetta il criterio se la sua inflazione media su un anno non supera di oltre 1,5 punti percentuali quella dei (al massimo) tre Stati membri più virtuosi sulla stabilità dei prezzi. Gli altri criteri riguardano conti pubblici, cambio e tassi a lungo termine (margine di 2 punti). La BCE precisa che vanno rispettati in modo duraturo, non in un solo momento.&lt;br&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è lo strumento concreto con cui i paesi candidati sono passati da E a F.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://www.ecb.europa.eu/explainers/tell-me-more/html/join_the_euro_area.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BCE: What does a country need to do to join the euro area?&lt;/a&gt; · &lt;a href=&quot;https://ec.europa.eu/eurostat/statistics-explained/index.php/Glossary:Convergence_criteria&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Glossario Eurostat&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Phillips, A. W. (1958) e la Phillips curve&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 7, 8, 13&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; «The Relation Between Unemployment and the Rate of Change of Money Wage Rates in the United Kingdom, 1861–1957», &lt;i&gt;Economica&lt;/i&gt;, 25(100), pp. 283–299.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; lo studio empirico originale sui dati britannici: mette in relazione la crescita dei salari &lt;em&gt;monetari&lt;/em&gt; (non dei prezzi) con il livello della disoccupazione. La versione «augmented» con le aspettative, usata nelle slide, viene dal dibattito successivo.&lt;br&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è il vincolo del modello BG; il nome della curva viene da qui.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://econpapers.repec.org/RePEc:bla:econom:v:25:y:1958:i:100:p:283-299&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda EconPapers&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Euroizzazione unilaterale: Kosovo e Montenegro&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;badge sl&quot;&gt;slide 27&lt;/span&gt; &lt;span class=&quot;badge&quot;&gt;fonte esterna&lt;/span&gt; Entrambi usano l&#x27;euro dal 2002 senza un accordo monetario con l&#x27;UE.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; Montenegro e Kosovo hanno adottato l&#x27;euro unilateralmente nel 2002. La BCE ha ribadito più volte la posizione ECOFIN del 2000: l&#x27;euroizzazione unilaterale non è compatibile con il Trattato e non può sostituire il processo di convergenza.&lt;br&gt;&lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;esempio delle slide di «prendere in prestito» la credibilità di un&#x27;altra banca centrale, con il prezzo di non avere voce sulla politica monetaria.&lt;/p&gt;
    &lt;p&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Montenegro_and_the_euro&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Montenegro and the euro&lt;/a&gt; · &lt;a href=&quot;https://en.wikipedia.org/wiki/Kosovo_and_the_euro&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia: Kosovo and the euro&lt;/a&gt; &lt;span class=&quot;small&quot;&gt;(fonte enciclopedica: usala come punto di partenza)&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;p class=&quot;small&quot;&gt;Non ho potuto consultare gli altri materiali di &lt;code&gt;corso/&lt;/code&gt; (lezioni, esercizi, programma) né il pdf del modello citato in slide 15: lo strumento disponibile non elenca il contenuto delle cartelle e i nomi dei file non sono noti. I collegamenti con le altre lezioni vengono quindi solo da questa presentazione.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;
