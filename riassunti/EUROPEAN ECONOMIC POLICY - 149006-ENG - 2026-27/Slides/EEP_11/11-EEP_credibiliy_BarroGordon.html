&lt;main&gt;
&lt;section id=&quot;s1&quot; class=&quot;part sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte I · Il problema &lt;span class=&quot;slides&quot;&gt;slide 2–3&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;Unione monetaria e credibilità&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;La lezione parte da un collegamento con quanto visto prima nel corso. Un paese indipendente che subisce un &lt;span class=&quot;term&quot;&gt;asymmetric permanent shock&lt;/span&gt; (uno shock che colpisce solo lui, o lui più degli altri, e non rientra da solo) può aggiustarsi &lt;b&gt;svalutando&lt;/b&gt; la propria moneta. Se però lo fa &lt;b&gt;ripetutamente&lt;/b&gt;, perde il controllo dell&#x27;inflazione, che è il primo obiettivo della politica monetaria.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 900 150&quot; role=&quot;img&quot; aria-label=&quot;Catena causale: shock, svalutazioni, inflazione, perdita di credibilità, UEM&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Shock asimmetrico&lt;/text&gt;&lt;text x=&quot;85&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;sm&quot;&gt;permanente&lt;/text&gt;
        &lt;rect x=&quot;190&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;265&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Svalutazioni&lt;/text&gt;&lt;text x=&quot;265&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;sm&quot;&gt;ricorrenti&lt;/text&gt;
        &lt;rect x=&quot;370&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;445&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Inflazione&lt;/text&gt;&lt;text x=&quot;445&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;sm&quot;&gt;fuori controllo&lt;/text&gt;
        &lt;rect x=&quot;550&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot;/&gt;&lt;text x=&quot;625&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Credibilità persa&lt;/text&gt;&lt;text x=&quot;625&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;sm&quot;&gt;della politica monetaria&lt;/text&gt;
        &lt;rect x=&quot;730&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink)&quot;/&gt;&lt;text x=&quot;810&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Entrare nell&#x27;UEM&lt;/text&gt;&lt;text x=&quot;810&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; class=&quot;sm&quot;&gt;= recuperarla&lt;/text&gt;
        &lt;g stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot;&gt;&lt;path d=&quot;M162,73h24M342,73h24M522,73h24M702,73h24&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;/g&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Le due domande della lezione&lt;/h4&gt;
      &lt;ol&gt;&lt;li&gt;Perché contano la &lt;b&gt;credibilità&lt;/b&gt; della politica monetaria e la &lt;b&gt;reputazione&lt;/b&gt; della banca centrale (CB)?&lt;/li&gt;
      &lt;li&gt;Come si può &lt;b&gt;guadagnare credibilità&lt;/b&gt; entrando nell&#x27;UEM?&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Credibilità, in parole semplici&lt;/h4&gt;
      &lt;p&gt;Una politica è &lt;dfn&gt;credibile&lt;/dfn&gt; quando il pubblico si aspetta davvero che venga attuata, e quindi fissa salari, prezzi e tassi d&#x27;interesse in linea con l&#x27;annuncio. La &lt;dfn&gt;reputazione&lt;/dfn&gt; è la credibilità accumulata nel tempo con i comportamenti passati.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Il primo punto rimanda alle lezioni precedenti sulla &lt;span class=&quot;term&quot;&gt;optimum currency area&lt;/span&gt; (area valutaria ottimale): lì il cambio flessibile era lo strumento di aggiustamento agli shock asimmetrici. Qui si vede il &lt;b&gt;costo&lt;/b&gt; di quello strumento. Non ho potuto aprire gli altri file della cartella &lt;code&gt;corso/&lt;/code&gt; (vedi la nota in fondo), quindi il collegamento viene solo da quanto dice la slide 2.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 1&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Perché svalutare spesso fa perdere credibilità alla politica monetaria?&lt;/summary&gt;&lt;p&gt;Ogni svalutazione fa salire i prezzi dei beni importati e, per tutti, l&#x27;inflazione. Se il paese svaluta ogni volta che ne ha bisogno, il pubblico impara che la stabilità dei prezzi passa in secondo piano. Le promesse di inflazione bassa non vengono più credute.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quale vantaggio dell&#x27;UEM è al centro di questa lezione?&lt;/summary&gt;&lt;p&gt;Il recupero di credibilità della politica monetaria. Per molti paesi ad alta inflazione, delegare la moneta a una banca centrale comune e credibile ha permesso di abbassare le aspettative d&#x27;inflazione.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s2&quot; class=&quot;part sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte I · Il problema &lt;span class=&quot;slides&quot;&gt;slide 4–6&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;Time inconsistency: annunciare e poi deviare&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Time inconsistency&lt;/b&gt; (incoerenza temporale): il policy maker trova ottimale &lt;b&gt;annunciare&lt;/b&gt; l&#x27;impegno a una certa politica e poi &lt;b&gt;deviarne dopo&lt;/b&gt; che il pubblico ha preso le sue decisioni sulla base dell&#x27;annuncio. Il piano ottimale &lt;i&gt;ex ante&lt;/i&gt; non resta ottimale &lt;i&gt;ex post&lt;/i&gt;.&lt;/div&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Credibility problem&lt;/b&gt;: il governo annuncia una mossa. Se poi ha l&#x27;occasione di ottenere un risultato migliore nel breve periodo, ci prova, anche se questo significa “ingannare” il pubblico. Ma gli agenti razionali lo sanno, &lt;b&gt;anticipano&lt;/b&gt; l&#x27;inganno e adattano le loro &lt;span class=&quot;term&quot;&gt;response functions&lt;/span&gt; (il modo in cui reagiscono alle politiche).&lt;/div&gt;

  &lt;h3&gt;Non riguarda solo la moneta: quattro esempi dalle slide&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Debito pubblico&lt;/button&gt;
      &lt;button role=&quot;tab&quot;&gt;Cambio fisso&lt;/button&gt;
      &lt;button role=&quot;tab&quot;&gt;Tasse sull&#x27;innovazione&lt;/button&gt;
      &lt;button role=&quot;tab&quot;&gt;Esami&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;trio&quot;&gt;
      &lt;div&gt;&lt;b&gt;Annuncio&lt;/b&gt;Il governo emette obbligazioni per spendere più delle entrate e promette di rimborsarle.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Tentazione ex post&lt;/b&gt;Se arriva una crisi grave, il default diventa allettante.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Se nessuno ci crede&lt;/b&gt;Gli investitori non comprano i titoli, o li comprano solo con un premio al rischio molto alto.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;trio&quot;&gt;
      &lt;div&gt;&lt;b&gt;Annuncio&lt;/b&gt;Il paese entra in un regime di cambio fisso.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Tentazione ex post&lt;/b&gt;Davanti a un forte shock della bilancia dei pagamenti, svalutare.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Se nessuno ci crede&lt;/b&gt;I mercati scommettono sulla svalutazione: il cambio fisso viene messo sotto pressione e diventa difficile da difendere.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;trio&quot;&gt;
      &lt;div&gt;&lt;b&gt;Annuncio&lt;/b&gt;Tasse zero per un settore, per favorire l&#x27;innovazione.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Tentazione ex post&lt;/b&gt;Quando il settore prospera, tassarlo e incassare.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Se nessuno ci crede&lt;/b&gt;Le imprese non investono in R&amp;amp;S fin dall&#x27;inizio.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;trio&quot;&gt;
      &lt;div&gt;&lt;b&gt;Annuncio&lt;/b&gt;Si annunciano gli esami per spingere gli studenti a studiare.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Tentazione ex post&lt;/b&gt;Una volta che hanno studiato, la soluzione “migliore” sarebbe non farli, risparmiando tempo ed energie.&lt;/div&gt;
      &lt;div&gt;&lt;b&gt;Se nessuno ci crede&lt;/b&gt;Gli studenti non studiano proprio.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;La morale delle slide: &lt;b&gt;se gli annunci non sono credibili per il futuro, non funzionano&lt;/b&gt;. Scoraggiano gli investitori dal comprare titoli, le imprese dal fare R&amp;amp;S e gli studenti dallo studiare.&lt;/p&gt;

  &lt;h3&gt;La sequenza del gioco, passo per passo&lt;/h3&gt;
  &lt;div class=&quot;lab stepper&quot; data-stepper&gt;
    &lt;figure&gt;&lt;svg viewBox=&quot;0 0 800 110&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;line x1=&quot;60&quot; y1=&quot;50&quot; x2=&quot;740&quot; y2=&quot;50&quot; class=&quot;ax&quot;/&gt;
      &lt;g class=&quot;st-dots&quot;&gt;&lt;circle cx=&quot;80&quot; cy=&quot;50&quot; r=&quot;13&quot;/&gt;&lt;circle cx=&quot;293&quot; cy=&quot;50&quot; r=&quot;13&quot;/&gt;&lt;circle cx=&quot;506&quot; cy=&quot;50&quot; r=&quot;13&quot;/&gt;&lt;circle cx=&quot;720&quot; cy=&quot;50&quot; r=&quot;13&quot;/&gt;&lt;/g&gt;
      &lt;text x=&quot;80&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;t₀ annuncio&lt;/text&gt;&lt;text x=&quot;293&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;t₁ il pubblico decide&lt;/text&gt;&lt;text x=&quot;506&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;t₂ la CB sceglie&lt;/text&gt;&lt;text x=&quot;720&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;t₃ esito&lt;/text&gt;
    &lt;/svg&gt;&lt;/figure&gt;
    &lt;div class=&quot;stage&quot;&gt;
      &lt;div data-step&gt;&lt;h4&gt;t₀ · L&#x27;annuncio&lt;/h4&gt;&lt;p&gt;La banca centrale annuncia inflazione pari all&#x27;obiettivo, ṗ = ṗ* (nei grafici: &lt;b&gt;punto A&lt;/b&gt;, inflazione zero e disoccupazione al tasso naturale u&lt;sub&gt;N&lt;/sub&gt;).&lt;/p&gt;&lt;/div&gt;
      &lt;div data-step hidden&gt;&lt;h4&gt;t₁ · Il pubblico fissa le aspettative&lt;/h4&gt;&lt;p&gt;Lavoratori, imprese e investitori firmano contratti salariali, fissano prezzi e comprano titoli a tasso nominale fisso sulla base di un&#x27;inflazione attesa ṗ&lt;sup&gt;e&lt;/sup&gt;. Da quel momento queste scelte sono &lt;b&gt;bloccate&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-step hidden&gt;&lt;h4&gt;t₂ · La tentazione&lt;/h4&gt;&lt;p&gt;Con ṗ&lt;sup&gt;e&lt;/sup&gt; ormai fissato, un po&#x27; di &lt;b&gt;inflazione a sorpresa&lt;/b&gt; riduce i salari reali e quindi la disoccupazione (Phillips curve). Inoltre erode il valore reale del debito pubblico. La CB preferirebbe il &lt;b&gt;punto B&lt;/b&gt; al punto A: l&#x27;annuncio era “ottimo” ieri, ma oggi non lo è più.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-step hidden&gt;&lt;h4&gt;t₃ · L&#x27;anticipazione razionale&lt;/h4&gt;&lt;p&gt;Gli agenti razionali sanno tutto questo già in t₁. Fissano quindi un&#x27;inflazione attesa così alta che la CB non ha più alcun incentivo a sorprenderli: &lt;b&gt;punto E&lt;/b&gt;. Risultato: la disoccupazione è la stessa (u&lt;sub&gt;N&lt;/sub&gt;) ma l&#x27;inflazione è più alta. È l&#x27;&lt;b&gt;inflation bias&lt;/b&gt;, che il modello della sezione 5 rende preciso.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;btns&quot;&gt;&lt;button data-prev&gt;← indietro&lt;/button&gt;&lt;button data-next class=&quot;on&quot;&gt;avanti →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 2&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Qual è la differenza tra “credibility problem” e “time inconsistency”?&lt;/summary&gt;&lt;p&gt;La time inconsistency descrive l&#x27;&lt;b&gt;incentivo&lt;/b&gt;: il piano ottimale annunciato smette di essere ottimale dopo che il pubblico ha agito. Il credibility problem è la &lt;b&gt;conseguenza&lt;/b&gt;: il pubblico lo sa, non crede all&#x27;annuncio e cambia il proprio comportamento in anticipo.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché, negli esempi, il fatto che il pubblico anticipi la deviazione peggiora le cose per tutti?&lt;/summary&gt;&lt;p&gt;Perché le decisioni che l&#x27;annuncio voleva provocare (comprare titoli, investire in R&amp;amp;S, studiare) non vengono prese. Il governo perde il beneficio che cercava e il pubblico perde le opportunità che l&#x27;impegno avrebbe creato.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Chi ha formalizzato per primo questa idea, e per quali politiche?&lt;/summary&gt;&lt;p&gt;Kydland e Prescott (1977), “Rules rather than discretion”. Non riguardava solo la politica monetaria ma ogni tipo di politica pubblica. Nel 2004 ha valso loro il Nobel (slide 5 e 21).&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s3&quot; class=&quot;part ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte II · Il modello &lt;span class=&quot;slides&quot;&gt;slide 7–10, 13&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;Perché conviene sorprendere: la Phillips curve&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Perché il policy maker dovrebbe guadagnare dal deviare? Perché nel &lt;b&gt;breve periodo&lt;/b&gt; c&#x27;è una relazione positiva fra inflazione e attività economica o, ed è lo stesso, una relazione &lt;b&gt;negativa fra inflazione e disoccupazione&lt;/b&gt;: la &lt;dfn&gt;Phillips curve&lt;/dfn&gt;. Una CB che controlla l&#x27;inflazione ma tiene anche a obiettivi reali (occupazione) può essere tentata di sfruttarla.&lt;/p&gt;

  &lt;h3&gt;La expectations-augmented Phillips curve&lt;/h3&gt;
  &lt;p&gt;Nella versione &lt;span class=&quot;term&quot;&gt;expectations-augmented&lt;/span&gt; (aumentata con le aspettative), ciò che conta è l&#x27;inflazione &lt;b&gt;non attesa&lt;/b&gt;:&lt;/p&gt;
  &lt;div class=&quot;eq&quot;&gt;ṗ = c − b·u + ṗ&lt;sup&gt;e&lt;/sup&gt; + ε&lt;span class=&quot;cap&quot;&gt;breve periodo (slide 8)&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Nell&#x27;equilibrio stazionario di lungo periodo le aspettative sono corrette, ṗ = ṗ&lt;sup&gt;e&lt;/sup&gt;, quindi&lt;/p&gt;
  &lt;div class=&quot;eq&quot;&gt;u = c / b = u&lt;sub&gt;N&lt;/sub&gt;&lt;span class=&quot;cap&quot;&gt;&lt;span class=&quot;term&quot;&gt;natural rate of unemployment&lt;/span&gt;: disoccupazione compatibile con aspettative corrette&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Sostituendo c = b·u&lt;sub&gt;N&lt;/sub&gt; si riscrive la curva in due forme equivalenti:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;eq&quot;&gt;ṗ − ṗ&lt;sup&gt;e&lt;/sup&gt; = b (u&lt;sub&gt;N&lt;/sub&gt; − u) + ε&lt;span class=&quot;cap&quot;&gt;la sorpresa d&#x27;inflazione corrisponde a disoccupazione sotto u&lt;sub&gt;N&lt;/sub&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;eq&quot;&gt;u = u&lt;sub&gt;N&lt;/sub&gt; − (1/b)(ṗ − ṗ&lt;sup&gt;e&lt;/sup&gt;) + ε&lt;span class=&quot;cap&quot;&gt;“ignorando i problemi di causalità”: l&#x27;inflazione a sorpresa abbassa u&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Nell&#x27;ultima forma il termine di shock andrebbe a rigore scritto −ε/b. Le slide lo semplificano in +ε: conta solo che sia un disturbo casuale. Il meccanismo intuitivo: se i salari nominali sono fissati su ṗ&lt;sup&gt;e&lt;/sup&gt; e i prezzi salgono più del previsto, il salario reale scende, le imprese assumono di più e u scende sotto u&lt;sub&gt;N&lt;/sub&gt;.&lt;/p&gt;

  &lt;div class=&quot;card t&quot;&gt;&lt;b&gt;Nota chiave (slide 8):&lt;/b&gt; il tasso naturale &lt;b&gt;non è necessariamente ottimale&lt;/b&gt;. Il beneficio dell&#x27;inflazione a sorpresa nasce proprio dal fatto che il policy maker giudica u&lt;sub&gt;N&lt;/sub&gt; &lt;b&gt;troppo alto&lt;/b&gt;, cioè ha un obiettivo u* &amp;lt; u&lt;sub&gt;N&lt;/sub&gt;. È la radice di tutto il problema.&lt;/div&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Laboratorio · Muovi le aspettative e la disoccupazione&lt;/h4&gt;
    &lt;p class=&quot;note&quot;&gt;u&lt;sub&gt;N&lt;/sub&gt; = 8%, b = 1. Le rette tratteggiate tenui sono le Phillips curve di breve periodo per ṗ&lt;sup&gt;e&lt;/sup&gt; = 0, 5, 10. La verticale è la Phillips curve di lungo periodo (slide 13).&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;Inflazione attesa ṗ&lt;sup&gt;e&lt;/sup&gt;&lt;input type=&quot;range&quot; id=&quot;pc-pe&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;pc-pe-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;Disoccupazione u&lt;input type=&quot;range&quot; id=&quot;pc-u&quot; min=&quot;2&quot; max=&quot;13&quot; step=&quot;0.5&quot; value=&quot;6&quot;&gt;&lt;output id=&quot;pc-u-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;figure&gt;&lt;svg id=&quot;pc-svg&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;div class=&quot;read&quot;&gt;&lt;div&gt;Inflazione effettiva ṗ&lt;b id=&quot;pc-p&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Sorpresa ṗ − ṗ&lt;sup&gt;e&lt;/sup&gt;&lt;b id=&quot;pc-s&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;u − u&lt;sub&gt;N&lt;/sub&gt;&lt;b id=&quot;pc-g&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;msg&quot; id=&quot;pc-msg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Phillips curve e tasso naturale (slide 13)&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Per &lt;b&gt;ogni livello di inflazione attesa&lt;/b&gt; c&#x27;è un trade-off di breve periodo fra inflazione e disoccupazione: una retta inclinata negativamente.&lt;/li&gt;
    &lt;li&gt;Se ṗ&lt;sup&gt;e&lt;/sup&gt; sale, la retta si sposta &lt;b&gt;in alto in parallelo&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;La verticale in u&lt;sub&gt;N&lt;/sub&gt; è la &lt;b&gt;Phillips curve di lungo periodo&lt;/b&gt;: l&#x27;insieme dei punti con ṗ = ṗ&lt;sup&gt;e&lt;/sup&gt;. Nel lungo periodo non c&#x27;è trade-off: più inflazione non compra meno disoccupazione.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h3&gt;Un secondo incentivo: il revenue incentive&lt;/h3&gt;
  &lt;p&gt;Il debito pubblico è fissato in termini &lt;b&gt;nominali&lt;/b&gt;. Il pubblico detiene titoli per un valore reale B&lt;sub&gt;t−1&lt;/sub&gt;/P&lt;sub&gt;t−1&lt;/sub&gt;, con un rendimento nominale R&lt;sub&gt;t−1&lt;/sub&gt; che era soddisfacente &lt;i&gt;date le aspettative d&#x27;inflazione&lt;/i&gt;. L&#x27;inflazione a sorpresa svaluta una parte del valore reale dei titoli e quindi riduce la spesa reale futura dello Stato per interessi e rimborso del capitale. Il canale pesa quantitativamente quando il &lt;b&gt;debito è alto&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Calcolatore · Quanto debito “si mangia” la sorpresa?&lt;/h4&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;Debito nominale (mld €)&lt;input type=&quot;range&quot; id=&quot;dv-d&quot; min=&quot;500&quot; max=&quot;3200&quot; step=&quot;100&quot; value=&quot;2000&quot;&gt;&lt;output id=&quot;dv-d-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;Inflazione a sorpresa&lt;input type=&quot;range&quot; id=&quot;dv-p&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.25&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;dv-p-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;read&quot;&gt;&lt;div&gt;Riduzione reale (approssimata D·π)&lt;b id=&quot;dv-a&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Riduzione reale (esatta D·π/(1+π))&lt;b id=&quot;dv-e&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Esempio delle slide: debito di 2000 mld e sorpresa dell&#x27;1% → circa &lt;b&gt;20 mld&lt;/b&gt; in meno di valore reale. Il conto esatto, D·π/(1+π), dà 19,8 mld.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Ma gli agenti non si lasciano ingannare per sempre (slide 10)&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Consumatori e imprese &lt;b&gt;imparano&lt;/b&gt; col tempo e correggono le proprie aspettative.&lt;/li&gt;
    &lt;li&gt;Capiscono “il trucco”: il policy maker proverà a creare inflazione a sorpresa per aumentare il prodotto.&lt;/li&gt;
    &lt;li&gt;Una volta corrette le aspettative, &lt;b&gt;nessun guadagno di prodotto o di entrate&lt;/b&gt; è più possibile, nemmeno nel breve periodo.&lt;/li&gt;
    &lt;li&gt;L&#x27;inflazione ha anche &lt;b&gt;costi&lt;/b&gt; (legati al cambiamento dei prezzi). Il modello li rappresenta con una &lt;b&gt;loss function&lt;/b&gt; (funzione di perdita) da minimizzare sotto un vincolo, la Phillips curve.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 3&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Da dove viene la formula u&lt;sub&gt;N&lt;/sub&gt; = c/b?&lt;/summary&gt;&lt;p&gt;Si pone ṗ = ṗ&lt;sup&gt;e&lt;/sup&gt; in ṗ = c − bu + ṗ&lt;sup&gt;e&lt;/sup&gt; (con ε = 0): resta 0 = c − bu, quindi u = c/b.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Se ṗ&lt;sup&gt;e&lt;/sup&gt; = 4%, b = 1 e u&lt;sub&gt;N&lt;/sub&gt; = 8%, quale inflazione serve per portare u al 6%?&lt;/summary&gt;&lt;p&gt;ṗ = ṗ&lt;sup&gt;e&lt;/sup&gt; + b(u&lt;sub&gt;N&lt;/sub&gt; − u) = 4 + 1·(8 − 6) = 6%. Serve una sorpresa di 2 punti.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché senza u* &amp;lt; u&lt;sub&gt;N&lt;/sub&gt; non ci sarebbe tentazione di sorprendere (sul fronte occupazione)?&lt;/summary&gt;&lt;p&gt;Se l&#x27;obiettivo di disoccupazione coincide con u&lt;sub&gt;N&lt;/sub&gt;, al punto A la CB ha già la disoccupazione che desidera: generare inflazione le porterebbe solo costi. È il caso del “target conservative” della sezione 6.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché il revenue incentive è più forte nei paesi con debito alto?&lt;/summary&gt;&lt;p&gt;La perdita reale per i creditori, e quindi il guadagno per lo Stato, è circa debito × sorpresa: a parità di sorpresa cresce con lo stock di debito.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s4&quot; class=&quot;part ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte II · Il modello &lt;span class=&quot;slides&quot;&gt;slide 11–12&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;Le preferenze delle autorità: la loss function&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;L&#x27;autorità monetaria vuole minimizzare una &lt;dfn&gt;loss function&lt;/dfn&gt;: una misura di quanto è “scontenta”. Gli argomenti sono gli &lt;b&gt;scostamenti&lt;/b&gt; di inflazione e disoccupazione dai rispettivi obiettivi, &lt;b&gt;elevati al quadrato&lt;/b&gt;:&lt;/p&gt;
  &lt;div class=&quot;eq&quot;&gt;L = a₁ (ṗ − ṗ*)² + a₂ (u − u*)²&lt;span class=&quot;cap&quot;&gt;a₁, a₂ = pesi che misurano le preferenze: quanto conta combattere l&#x27;inflazione rispetto alla disoccupazione&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Perché al quadrato?&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Così scostamenti in alto e in basso pesano allo stesso modo, e quelli grandi pesano più che proporzionalmente: due punti di troppo costano quattro volte uno. Inoltre la funzione è facile da minimizzare con le derivate.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Come leggere il grafico&lt;/h4&gt;&lt;p&gt;L&#x27;origine è il &lt;b&gt;bliss point&lt;/b&gt; (punto di massima soddisfazione) (ṗ*, u*), dove L = 0. Le curve di indifferenza sono archi di ellisse &lt;b&gt;concavi&lt;/b&gt; attorno all&#x27;origine. A differenza delle curve di utilità, qui &lt;b&gt;più vicino all&#x27;origine è meglio&lt;/b&gt;: I₁ è preferita a I₂, e I₂ a I₃.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Laboratorio · Cambia i pesi e guarda la forma delle curve&lt;/h4&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;a₁ · peso dell&#x27;inflazione&lt;input type=&quot;range&quot; id=&quot;ic-a1&quot; min=&quot;0.2&quot; max=&quot;3&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;ic-a1-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;a₂ · peso della disoccupazione&lt;input type=&quot;range&quot; id=&quot;ic-a2&quot; min=&quot;0.2&quot; max=&quot;3&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;ic-a2-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;btns&quot;&gt;&lt;button data-ic=&quot;2.6,0.5&quot;&gt;Hard-nosed&lt;/button&gt;&lt;button data-ic=&quot;1,1&quot;&gt;Neutrale&lt;/button&gt;&lt;button data-ic=&quot;0.5,2.6&quot;&gt;Wet&lt;/button&gt;&lt;/div&gt;
    &lt;figure&gt;&lt;svg id=&quot;ic-svg&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Asse orizzontale: u − u*; asse verticale: ṗ − ṗ*. Curve I₁, I₂, I₃ con L = 4, 9, 16.&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;div class=&quot;msg&quot; id=&quot;ic-msg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;La &lt;b&gt;pendenza&lt;/b&gt; delle curve dice quanta inflazione in più l&#x27;autorità accetta per un punto di disoccupazione in meno, cioè il peso relativo dei due obiettivi. &lt;span class=&quot;ours&quot;&gt;derivazione&lt;/span&gt;Lungo una curva, dṗ/du = −(a₂ (u − u*)) / (a₁ (ṗ − ṗ*)).&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 4&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Una CB con a₁ molto più grande di a₂: le curve sono schiacciate in verticale o in orizzontale?&lt;/summary&gt;&lt;p&gt;Schiacciate in verticale, cioè basse e larghe. Anche poca inflazione costa molto, quindi a parità di perdita l&#x27;autorità tollera tanta disoccupazione ma poca inflazione. È la CB &lt;b&gt;hard-nosed&lt;/b&gt;.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché I₁ è preferita a I₃?&lt;/summary&gt;&lt;p&gt;Perché è più vicina al bliss point (ṗ*, u*): ogni punto di I₁ ha una perdita L più bassa.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s5&quot; class=&quot;part ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte II · Il modello &lt;span class=&quot;slides&quot;&gt;slide 14–17&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;L&#x27;equilibrio di Barro-Gordon e l&#x27;inflation bias&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Mettiamo insieme le due cose: la CB minimizza la loss function (sezione 4) &lt;b&gt;sotto il vincolo&lt;/b&gt; della Phillips curve di breve periodo (sezione 3), prendendo come date le aspettative ṗ&lt;sup&gt;e&lt;/sup&gt; già fissate dal pubblico. La slide 15 rimanda a un pdf separato per l&#x27;algebra del modello. Qui sotto trovi una derivazione coerente con le formule delle slide 8 e 11.&lt;/p&gt;

  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;&lt;span class=&quot;ours&quot;&gt;derivazione&lt;/span&gt; La soluzione in quattro righe&lt;/summary&gt;
    &lt;p&gt;1. Il problema: min L = a₁(ṗ − ṗ*)² + a₂(u − u*)² con u = u&lt;sub&gt;N&lt;/sub&gt; − (1/b)(ṗ − ṗ&lt;sup&gt;e&lt;/sup&gt;).&lt;/p&gt;
    &lt;p&gt;2. Condizione del primo ordine rispetto a ṗ: 2a₁(ṗ − ṗ*) + 2a₂(u − u*)·(−1/b) = 0.&lt;/p&gt;
    &lt;div class=&quot;eq&quot;&gt;ṗ − ṗ* = (a₂ / (a₁ b)) · (u − u*)&lt;span class=&quot;cap&quot;&gt;&lt;b&gt;reaction curve&lt;/b&gt;: la scelta ottima della CB per ogni ṗ&lt;sup&gt;e&lt;/sup&gt;. È una retta che parte dall&#x27;origine e ha pendenza a₂/(a₁b)&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;3. Con aspettative razionali, all&#x27;equilibrio ṗ = ṗ&lt;sup&gt;e&lt;/sup&gt;, quindi u = u&lt;sub&gt;N&lt;/sub&gt;.&lt;/p&gt;
    &lt;div class=&quot;eq&quot;&gt;ṗ&lt;sub&gt;E&lt;/sub&gt; = ṗ* + (a₂ / (a₁ b)) · (u&lt;sub&gt;N&lt;/sub&gt; − u*)&lt;span class=&quot;cap&quot;&gt;il secondo termine è l&#x27;&lt;b&gt;inflation bias&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;p&gt;4. Perdite: L&lt;sub&gt;A&lt;/sub&gt; = a₂(u&lt;sub&gt;N&lt;/sub&gt; − u*)², mentre L&lt;sub&gt;E&lt;/sub&gt; = L&lt;sub&gt;A&lt;/sub&gt; + a₁·bias² &amp;gt; L&lt;sub&gt;A&lt;/sub&gt;. In E la disoccupazione è la stessa di A, ma con inflazione in più: E è peggio di A.&lt;/p&gt;
    &lt;p class=&quot;note&quot;&gt;Il bias è più alto quando: (i) a₂/a₁ è grande, cioè la CB è &lt;i&gt;wet&lt;/i&gt;; (ii) u&lt;sub&gt;N&lt;/sub&gt; − u* è grande, cioè la CB giudica il tasso naturale molto “eccessivo”; (iii) b è piccolo, cioè una piccola sorpresa basta a ridurre molto u. Con a₂ = 0 o u* = u&lt;sub&gt;N&lt;/sub&gt; il bias è nullo.&lt;/p&gt;
  &lt;/details&gt;

  &lt;h3&gt;I punti del grafico (slide 14)&lt;/h3&gt;
  &lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Punto&lt;/th&gt;&lt;th&gt;Che cos&#x27;è&lt;/th&gt;&lt;th&gt;Aspettative&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;A&lt;/b&gt;&lt;/td&gt;&lt;td&gt;L&#x27;annuncio: ṗ = ṗ*, u = u&lt;sub&gt;N&lt;/sub&gt;. Non è credibile, perché data ṗ&lt;sup&gt;e&lt;/sup&gt; = ṗ* la CB preferisce B.&lt;/td&gt;&lt;td&gt;ṗ&lt;sup&gt;e&lt;/sup&gt; = ṗ*&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;B&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Tangenza tra la curva di indifferenza e la Phillips curve con ṗ&lt;sup&gt;e&lt;/sup&gt; = ṗ*: sorpresa d&#x27;inflazione e u &amp;lt; u&lt;sub&gt;N&lt;/sub&gt;. È la “tentazione” e si raggiunge solo con un pubblico &lt;b&gt;naïve&lt;/b&gt;.&lt;/td&gt;&lt;td&gt;ṗ&lt;sup&gt;e&lt;/sup&gt; = ṗ* (ingannate)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;C&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Passo intermedio: il pubblico ha alzato ṗ&lt;sup&gt;e&lt;/sup&gt; a ṗ₁ (l&#x27;inflazione di B), la curva sale e la CB sorprende di nuovo, ma di meno.&lt;/td&gt;&lt;td&gt;ṗ&lt;sup&gt;e&lt;/sup&gt; = ṗ₁ (adattive)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;E&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Il &lt;b&gt;time consistent equilibrium&lt;/b&gt; con aspettative razionali: incontro tra reaction curve e verticale u&lt;sub&gt;N&lt;/sub&gt;. Qui la CB non ha più incentivo a deviare.&lt;/td&gt;&lt;td&gt;ṗ&lt;sup&gt;e&lt;/sup&gt; = ṗ&lt;sub&gt;E&lt;/sub&gt; (razionali)&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;lab&quot; id=&quot;lab&quot;&gt;
    &lt;h4&gt;Laboratorio · Il modello di Barro-Gordon&lt;/h4&gt;
    &lt;p class=&quot;note&quot;&gt;Normalizziamo ṗ* = 0 e a₁ = 1: conta solo il rapporto a₂/a₁. Prova i tre tipi di aspettative della slide 16: &lt;b&gt;naïve&lt;/b&gt; porta a B, &lt;b&gt;razionali&lt;/b&gt; portano subito a E, &lt;b&gt;adattive&lt;/b&gt; passano per A → B → C → … → E.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;a₂/a₁ · peso relativo della disoccupazione&lt;input type=&quot;range&quot; id=&quot;bg-w&quot; min=&quot;0&quot; max=&quot;2.5&quot; step=&quot;0.05&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;bg-w-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;b · pendenza della Phillips curve&lt;input type=&quot;range&quot; id=&quot;bg-b&quot; min=&quot;0.8&quot; max=&quot;2&quot; step=&quot;0.05&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;bg-b-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;u&lt;sub&gt;N&lt;/sub&gt; · tasso naturale&lt;input type=&quot;range&quot; id=&quot;bg-un&quot; min=&quot;4&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;8&quot;&gt;&lt;output id=&quot;bg-un-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;u* · obiettivo di disoccupazione&lt;input type=&quot;range&quot; id=&quot;bg-us&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;0&quot;&gt;&lt;output id=&quot;bg-us-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;btns&quot;&gt;
      &lt;button data-bg=&quot;naive&quot;&gt;Aspettative naïve → B&lt;/button&gt;
      &lt;button data-bg=&quot;adapt&quot;&gt;Adattive: periodo successivo ▸&lt;/button&gt;
      &lt;button data-bg=&quot;rational&quot;&gt;Aspettative razionali → E&lt;/button&gt;
      &lt;button data-bg=&quot;reset&quot;&gt;Reset ad A&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;btns&quot;&gt;&lt;span class=&quot;note&quot; style=&quot;border:0;padding:0&quot;&gt;Preset:&lt;/span&gt;
      &lt;button data-preset=&quot;0.4,1,8,0&quot;&gt;Hard-nosed&lt;/button&gt;&lt;button data-preset=&quot;1.8,1,8,0&quot;&gt;Wet&lt;/button&gt;
      &lt;button data-preset=&quot;0,1,8,0&quot;&gt;Super conservative&lt;/button&gt;&lt;button data-preset=&quot;1,1,8,8&quot;&gt;Target conservative&lt;/button&gt;
    &lt;/div&gt;
    &lt;figure&gt;&lt;svg id=&quot;bg-svg&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Rossa: Phillips curve di breve con le aspettative correnti (le precedenti sono sbiadite). Tratteggiata: reaction curve. Arco: curva di indifferenza della CB nel punto attuale.&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;div class=&quot;read&quot;&gt;
      &lt;div&gt;Punto attuale (u, ṗ)&lt;b id=&quot;bg-cur&quot;&gt;–&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;ṗ&lt;sup&gt;e&lt;/sup&gt; attuale&lt;b id=&quot;bg-pe&quot;&gt;–&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;Inflation bias ṗ&lt;sub&gt;E&lt;/sub&gt;&lt;b id=&quot;bg-pE&quot;&gt;–&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;Perdita in A&lt;b id=&quot;bg-LA&quot;&gt;–&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;Perdita in B&lt;b id=&quot;bg-LB&quot;&gt;–&lt;/b&gt;&lt;/div&gt;
      &lt;div&gt;Perdita in E&lt;b id=&quot;bg-LE&quot;&gt;–&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;msg&quot; id=&quot;bg-msg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Che cosa ci dice l&#x27;equilibrio (slide 17)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Inflation bias&lt;/h4&gt;&lt;p&gt;E è &lt;b&gt;sub-ottimale&lt;/b&gt; rispetto ad A: stessa disoccupazione, più inflazione. La discrezionalità non compra occupazione, produce solo inflazione. Nel laboratorio, la perdita in E è sempre ≥ di quella in A.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Rules vs discretion&lt;/h4&gt;&lt;p&gt;Da qui il dibattito &lt;span class=&quot;term&quot;&gt;rules vs discretion&lt;/span&gt; (regole contro discrezionalità): sarebbe meglio che le autorità seguissero &lt;b&gt;regole&lt;/b&gt; vincolanti invece di decidere di volta in volta? Una regola credibile porterebbe l&#x27;economia in A.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Ipotesi cruciale: il modello assume &lt;b&gt;agenti razionali con comportamento strategico&lt;/b&gt;. Pubblico e CB “giocano” uno contro l&#x27;altro e ciascuno anticipa le mosse dell&#x27;altro.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 5&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Perché A non è un equilibrio con aspettative razionali?&lt;/summary&gt;&lt;p&gt;Perché se il pubblico si aspetta ṗ* la CB ha interesse a portarsi in B, su una curva di indifferenza più bassa. Il pubblico razionale lo prevede e non si aspetta ṗ*: A non regge.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché E è un equilibrio?&lt;/summary&gt;&lt;p&gt;In E la Phillips curve di breve (con ṗ&lt;sup&gt;e&lt;/sup&gt; = ṗ&lt;sub&gt;E&lt;/sub&gt;) è tangente alla curva di indifferenza della CB proprio su u&lt;sub&gt;N&lt;/sub&gt;: data quella aspettativa, la scelta ottima della CB è ṗ&lt;sub&gt;E&lt;/sub&gt;, che conferma le aspettative. Nessuno ha incentivo a deviare.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Con a₂/a₁ = 1, b = 1, u&lt;sub&gt;N&lt;/sub&gt; = 8, u* = 0, quanto vale l&#x27;inflation bias?&lt;/summary&gt;&lt;p&gt;ṗ&lt;sub&gt;E&lt;/sub&gt; = (a₂/(a₁b))(u&lt;sub&gt;N&lt;/sub&gt; − u*) = 1·8 = 8 punti. Con b = 2 si dimezza a 4.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Associa ogni tipo di aspettative al punto finale: naïve, razionali, adattive.&lt;/summary&gt;&lt;p&gt;Naïve → B (il pubblico continua a credere all&#x27;annuncio). Razionali → E subito. Adattive → A, B, C, … e convergenza verso E.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s6&quot; class=&quot;part slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;6&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte III · Preferenze e rimedi &lt;span class=&quot;slides&quot;&gt;slide 18–22&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;Hard-nosed contro wet&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Hard-nosed CB&lt;/b&gt; (“dal naso duro”): attribuisce &lt;b&gt;molto peso alla lotta all&#x27;inflazione&lt;/b&gt; (a₁ grande). Le curve di indifferenza sono basse e larghe.&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Wet CB&lt;/b&gt; (“morbida”): attribuisce &lt;b&gt;molto peso alla lotta alla disoccupazione&lt;/b&gt; (a₂ grande). Le curve sono alte e strette.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;figure&gt;&lt;svg id=&quot;hw-hard&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Hard-nosed (a₂/a₁ = 0,4): B ed E restano vicini ad A.&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure&gt;&lt;svg id=&quot;hw-wet&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Wet (a₂/a₁ = 1,6): la tentazione è forte ed E è molto in alto.&lt;/figcaption&gt;&lt;/figure&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card t&quot;&gt;&lt;b&gt;Messaggio della slide 19:&lt;/b&gt; le autorità hard-nosed ottengono un&#x27;inflazione &lt;b&gt;più bassa&lt;/b&gt; di quelle wet &lt;b&gt;senza imporre più disoccupazione nel lungo periodo&lt;/b&gt;: in entrambi i casi E sta sulla verticale u&lt;sub&gt;N&lt;/sub&gt;.&lt;/div&gt;

  &lt;h3&gt;Reaction curves (slide 20)&lt;/h3&gt;
  &lt;figure&gt;&lt;svg id=&quot;hw-rc&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Le rette tratteggiate sono i luoghi delle scelte ottime della CB per ogni possibile vincolo (ogni ṗ&lt;sup&gt;e&lt;/sup&gt;): le &lt;b&gt;reaction curves&lt;/b&gt;. La loro pendenza, a₂/(a₁b), dipende dalle preferenze. Rossa = wet, blu = hard-nosed.&lt;/figcaption&gt;&lt;/figure&gt;

  &lt;h3&gt;Conclusioni sul modello e rimedi&lt;/h3&gt;
  &lt;p&gt;Conclusione generale (slide 21): la &lt;b&gt;discrezionalità può peggiorare la situazione di tutti&lt;/b&gt; rispetto a un mondo in cui il governo potesse impegnarsi su un percorso di politica. Come uscirne?&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Regole&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Reputazione&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Delega (Rogoff)&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Super / target conservative&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Barro e Gordon (1983)&lt;/b&gt;, concentrandosi sulla politica monetaria, sottolineano il ruolo delle &lt;b&gt;regole monetarie&lt;/b&gt; come possibile soluzione alla time inconsistency. Se la CB è vincolata in modo credibile a ṗ*, il pubblico si aspetta ṗ* e l&#x27;economia sta in A.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Kydland-Prescott (1977) valeva per &lt;i&gt;ogni&lt;/i&gt; politica pubblica. Barro-Gordon lo applicano alla moneta.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Il titolo del secondo articolo di Barro-Gordon cita la &lt;b&gt;reputation&lt;/b&gt;. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Secondo l&#x27;abstract (NBER WP 1079), in un gioco ripetuto la minaccia di perdere reputazione può sostituire in parte una regola formale: alcune regole, ma in generale non quella ideale, si reggono così, e l&#x27;esito è una media ponderata fra discrezionalità e regola ideale. &lt;a href=&quot;https://www.nber.org/papers/w1079&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;nber.org/papers/w1079&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Slide 21: soluzione successiva in termini di &lt;b&gt;delega&lt;/b&gt; (Rogoff 1985). La società affida la moneta a un banchiere centrale &lt;b&gt;più conservatore&lt;/b&gt; di lei, con a₁ più alto: nel laboratorio, a₂/a₁ più basso significa bias più basso. &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Rogoff mostra anche il costo: con grandi shock d&#x27;offerta la variabilità dell&#x27;occupazione aumenta, quindi il peso ottimale sull&#x27;inflazione è grande ma finito. &lt;a href=&quot;https://ideas.repec.org/a/oup/qjecon/v100y1985i4p1169-1189..html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div&gt;&lt;h4&gt;Super conservative&lt;/h4&gt;&lt;p&gt;Peso nullo sulla disoccupazione nella loss function. La slide scrive “b = 0”: nella notazione della slide 11 corrisponde a &lt;b&gt;a₂ = 0&lt;/b&gt;. La reaction curve è orizzontale, il bias è nullo ed E coincide con A.&lt;/p&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h4&gt;Target conservative&lt;/h4&gt;&lt;p&gt;u* = u&lt;sub&gt;N&lt;/sub&gt;: la CB non considera eccessivo il tasso naturale. Anche così il bias (a₂/(a₁b))(u&lt;sub&gt;N&lt;/sub&gt; − u*) si annulla. Prova entrambi i preset nel &lt;a href=&quot;#lab&quot;&gt;laboratorio&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 6&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Una CB hard-nosed ha più disoccupazione di lungo periodo di una wet?&lt;/summary&gt;&lt;p&gt;No. In equilibrio entrambe sono a u&lt;sub&gt;N&lt;/sub&gt;. La differenza sta solo nell&#x27;inflazione, più bassa con la hard-nosed. Più conservatorismo non costa occupazione nel lungo periodo (in assenza di shock).&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Cosa determina la pendenza della reaction curve?&lt;/summary&gt;&lt;p&gt;a₂/(a₁b): le preferenze (rapporto tra i pesi) e la pendenza della Phillips curve. Più è ripida, più alta è l&#x27;inflazione di equilibrio.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché “super conservative” e “target conservative” eliminano entrambi l&#x27;inflation bias?&lt;/summary&gt;&lt;p&gt;Il bias è (a₂/(a₁b))(u&lt;sub&gt;N&lt;/sub&gt; − u*). Il primo azzera a₂ (alla CB non interessa ridurre u), il secondo azzera u&lt;sub&gt;N&lt;/sub&gt; − u* (la CB non vuole u sotto u&lt;sub&gt;N&lt;/sub&gt;). In entrambi i casi manca il motivo per sorprendere.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s7&quot; class=&quot;part brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;7&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte IV · Europa e UEM &lt;span class=&quot;slides&quot;&gt;slide 23–26&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;Barro-Gordon in economia aperta: Germania e Italia&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Due paesi: uno con una CB &lt;b&gt;hard-nosed&lt;/b&gt; (esempio: la Germania, con la Bundesbank) e un equilibrio a bassa inflazione; l&#x27;altro con una CB &lt;b&gt;wet&lt;/b&gt; (esempio: l&#x27;Italia) e un equilibrio ad alta inflazione. Si crea un &lt;b&gt;differenziale d&#x27;inflazione&lt;/b&gt;, e l&#x27;Italia deve &lt;b&gt;svalutare ripetutamente&lt;/b&gt; per restare competitiva.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;figure&gt;&lt;svg id=&quot;gi-ger&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Germania: equilibrio C a bassa inflazione ṗ&lt;sub&gt;G&lt;/sub&gt;.&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure&gt;&lt;svg id=&quot;gi-ita&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Italia: equilibrio E. Il punto F (u&lt;sub&gt;N&lt;/sub&gt;, ṗ&lt;sub&gt;G&lt;/sub&gt;) è l&#x27;obiettivo, G è la tentazione partendo da F.&lt;/figcaption&gt;&lt;/figure&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;b&gt;La domanda della slide 24:&lt;/b&gt; come possono le autorità italiane rendere &lt;b&gt;credibile&lt;/b&gt; l&#x27;annuncio del punto F, cioè l&#x27;inflazione tedesca? Senza credibilità l&#x27;inflazione italiana resta alta e servono svalutazioni continue. Se il pubblico credesse a F, la CB italiana sarebbe tentata di andare in G, esattamente come prima da A a B.&lt;/p&gt;

  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Calcolatore · Differenziale d&#x27;inflazione e svalutazioni&lt;/h4&gt;
    &lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;Per restare competitiva, l&#x27;Italia deve far deprezzare la lira circa quanto il differenziale d&#x27;inflazione ogni anno: è la parità dei poteri d&#x27;acquisto relativa, Δe ≈ π&lt;sub&gt;I&lt;/sub&gt; − π&lt;sub&gt;G&lt;/sub&gt;.&lt;/p&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;Inflazione Germania π&lt;sub&gt;G&lt;/sub&gt;&lt;input type=&quot;range&quot; id=&quot;df-g&quot; min=&quot;0&quot; max=&quot;6&quot; step=&quot;0.5&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;df-g-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;Inflazione Italia π&lt;sub&gt;I&lt;/sub&gt;&lt;input type=&quot;range&quot; id=&quot;df-i&quot; min=&quot;0&quot; max=&quot;20&quot; step=&quot;0.5&quot; value=&quot;12&quot;&gt;&lt;output id=&quot;df-i-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;Anni&lt;input type=&quot;range&quot; id=&quot;df-n&quot; min=&quot;1&quot; max=&quot;15&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;df-n-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;figure&gt;&lt;svg id=&quot;df-svg&quot; viewBox=&quot;0 0 520 200&quot;&gt;&lt;/svg&gt;&lt;figcaption&gt;Indice dei prezzi italiani rispetto a quelli tedeschi (anno 0 = 100): ogni barra mostra la perdita di competitività da compensare con il cambio.&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;div class=&quot;read&quot;&gt;&lt;div&gt;Svalutazione annua necessaria&lt;b id=&quot;df-a&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Svalutazione cumulata&lt;b id=&quot;df-c&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;La scala della credibilità&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot; data-tabs&gt;
    &lt;div role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;1 · Annunciare F&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;2 · Cambio fisso&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;3 · Adottare il DM&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;4 · Unione monetaria&lt;/button&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;&lt;div class=&quot;meter&quot;&gt;&lt;i style=&quot;width:12%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;Annunciare semplicemente di voler mantenere l&#x27;inflazione bassa e costante: &lt;b&gt;non credibile&lt;/b&gt;, per il meccanismo F → G.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;meter&quot;&gt;&lt;i style=&quot;width:45%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;Passare al &lt;b&gt;cambio fisso&lt;/b&gt;: non si può più guadagnare competitività con il deprezzamento. È più credibile del semplice annuncio, ma &lt;b&gt;non del tutto&lt;/b&gt;: resta la tentazione di creare inflazione a sorpresa, oppure di svalutare e cambiare la parità annunciata.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;ctx&quot;&gt;contesto&lt;/span&gt;È l&#x27;esperienza dello SME (Sistema Monetario Europeo, dal 1979), con i suoi riallineamenti e l&#x27;uscita della lira dagli accordi di cambio nel settembre 1992.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;meter&quot;&gt;&lt;i style=&quot;width:80%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;Abbandonare la lira per il marco tedesco (DM)&lt;/b&gt;: l&#x27;Italia godrebbe dell&#x27;inflazione bassa tedesca, “prendendo in prestito” preferenze e credibilità della &lt;b&gt;Bundesbank&lt;/b&gt;. È analogo alla &lt;span class=&quot;term&quot;&gt;dollarization&lt;/span&gt; (adozione unilaterale del dollaro) di piccole economie latinoamericane, o all&#x27;uso dell&#x27;euro in &lt;b&gt;Kosovo e Montenegro&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;div class=&quot;meter&quot;&gt;&lt;i style=&quot;width:65%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;p&gt;Un&#x27;&lt;b&gt;Unione monetaria&lt;/b&gt; fra Germania e Italia è più complessa: nasce una &lt;b&gt;nuova&lt;/b&gt; banca centrale che deve &lt;b&gt;costruirsi da sola la propria reputazione&lt;/b&gt;. Le autorità italiane si &lt;b&gt;“legano le mani”&lt;/b&gt; (&lt;span class=&quot;term&quot;&gt;tie their hands&lt;/span&gt;, Giavazzi e Pagano) in materia di politica monetaria.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Le lunghezze delle barre sono indicative e servono solo a confrontare le opzioni.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 7&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Perché un paese con CB wet deve svalutare ripetutamente se vuole restare competitivo?&lt;/summary&gt;&lt;p&gt;Perché in equilibrio la sua inflazione è stabilmente più alta di quella dei partner. Senza svalutazione i suoi prezzi relativi salgono ogni anno e perde competitività.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché il cambio fisso non basta a rendere F totalmente credibile?&lt;/summary&gt;&lt;p&gt;Perché la parità può sempre essere cambiata: restano la tentazione di inflazione a sorpresa e quella di svalutare. Il pubblico lo sa.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra adottare il DM e creare un&#x27;unione monetaria?&lt;/summary&gt;&lt;p&gt;Adottando il DM si eredita una reputazione già costruita (Bundesbank). In un&#x27;unione monetaria nasce una nuova CB, la cui credibilità va costruita da zero.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;s8&quot; class=&quot;part brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot;&gt;8&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Parte IV · Europa e UEM &lt;span class=&quot;slides&quot;&gt;slide 27–29&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;Da E a F: la disinflazione e Maastricht&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Il passaggio da E a F &lt;b&gt;non è stato né indolore né rapido&lt;/b&gt;. L&#x27;economia è scesa &lt;b&gt;lungo la Phillips curve di breve&lt;/b&gt; di partenza, quindi con più disoccupazione. Solo man mano che le aspettative d&#x27;inflazione calavano, la curva si è spostata in basso verso F. Per questo la disoccupazione è inizialmente aumentata ed è diventata un serio problema in Europa.&lt;/p&gt;
  &lt;div class=&quot;lab stepper&quot; data-stepper id=&quot;dis&quot;&gt;
    &lt;h4&gt;Passo per passo · La disinflazione italiana stilizzata&lt;/h4&gt;
    &lt;figure&gt;&lt;svg id=&quot;dis-svg&quot; viewBox=&quot;0 0 520 345&quot;&gt;&lt;/svg&gt;&lt;/figure&gt;
    &lt;div class=&quot;stage&quot;&gt;
      &lt;div data-step&gt;&lt;p&gt;&lt;b&gt;Partenza: E.&lt;/b&gt; Inflazione 12%, attese 12%, u = u&lt;sub&gt;N&lt;/sub&gt; = 8%.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-step hidden&gt;&lt;p&gt;&lt;b&gt;Stretta monetaria.&lt;/b&gt; L&#x27;inflazione scende all&#x27;8%, ma le aspettative sono ancora al 12%: l&#x27;economia scivola lungo la curva di partenza e &lt;b&gt;u sale&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-step hidden&gt;&lt;p&gt;&lt;b&gt;Le aspettative iniziano a scendere&lt;/b&gt; (8%): la curva si sposta in basso. L&#x27;inflazione scende al 5% e u resta sopra u&lt;sub&gt;N&lt;/sub&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-step hidden&gt;&lt;p&gt;&lt;b&gt;Ancora un passo:&lt;/b&gt; ṗ&lt;sup&gt;e&lt;/sup&gt; = 5%, ṗ = 3,5%. Il costo in disoccupazione si riduce.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-step hidden&gt;&lt;p&gt;ṗ&lt;sup&gt;e&lt;/sup&gt; = 3,5%, ṗ = 3%: quasi arrivati.&lt;/p&gt;&lt;/div&gt;
      &lt;div data-step hidden&gt;&lt;p&gt;&lt;b&gt;Arrivo: F.&lt;/b&gt; Inflazione al livello tedesco (3%), aspettative allineate, u torna a u&lt;sub&gt;N&lt;/sub&gt;. Le aspettative sono scese anche perché le politiche per entrare nell&#x27;UEM &lt;b&gt;segnalavano un cambio di preferenze&lt;/b&gt; dei policy maker.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;btns&quot;&gt;&lt;button data-prev&gt;← indietro&lt;/button&gt;&lt;button data-next class=&quot;on&quot;&gt;avanti →&lt;/button&gt;&lt;span class=&quot;dots&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;read&quot;&gt;&lt;div&gt;ṗ&lt;sup&gt;e&lt;/sup&gt;&lt;b id=&quot;dis-pe&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;ṗ&lt;b id=&quot;dis-p&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;u&lt;b id=&quot;dis-u&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Valori illustrativi (b = 1,5; u&lt;sub&gt;N&lt;/sub&gt; = 8), scelti per riprodurre la forma della slide 28: non sono dati storici.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il criterio di Maastricht sull&#x27;inflazione&lt;/h3&gt;
  &lt;p&gt;Uno dei &lt;b&gt;criteri di convergenza di Maastricht&lt;/b&gt; chiedeva di portare l&#x27;inflazione a &lt;b&gt;non più di 1,5 punti percentuali&lt;/b&gt; sopra la media dei &lt;b&gt;tre paesi con l&#x27;inflazione più bassa&lt;/b&gt;. I paesi hanno avuto quasi &lt;b&gt;10 anni&lt;/b&gt; per convergere.&lt;/p&gt;
  &lt;div class=&quot;lab&quot;&gt;
    &lt;h4&gt;Verifica · Il paese supera il criterio?&lt;/h4&gt;
    &lt;div class=&quot;ctrl&quot;&gt;
      &lt;label&gt;Media dei 3 paesi migliori&lt;input type=&quot;range&quot; id=&quot;mc-b&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.1&quot; value=&quot;1.5&quot;&gt;&lt;output id=&quot;mc-b-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
      &lt;label&gt;Inflazione del paese&lt;input type=&quot;range&quot; id=&quot;mc-x&quot; min=&quot;0&quot; max=&quot;12&quot; step=&quot;0.1&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;mc-x-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;read&quot;&gt;&lt;div&gt;Soglia (media + 1,5)&lt;b id=&quot;mc-t&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Esito&lt;b id=&quot;mc-r&quot;&gt;–&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Conclusioni (slide 29)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Il guadagno&lt;/h4&gt;&lt;p&gt;Entrare in un&#x27;unione monetaria può portare un guadagno se la &lt;b&gt;nuova CB è più credibile&lt;/b&gt;: aiuta a ridurre l&#x27;inflazione. È stato il caso di alcuni paesi europei.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card t&quot;&gt;&lt;h4&gt;Il rovescio&lt;/h4&gt;&lt;p&gt;Se l&#x27;unione monetaria non ha un&#x27;&lt;b&gt;unione di bilancio&lt;/b&gt; o altre forme di protezione, l&#x27;indipendenza della CB dai governi può avere effetti negativi: rende possibili &lt;span class=&quot;term&quot;&gt;self-fulfilling debt crises&lt;/span&gt;, cioè crisi del debito che si autorealizzano perché i mercati se le aspettano. È l&#x27;argomento della prossima lezione.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 8&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Perché durante la disinflazione la disoccupazione supera u&lt;sub&gt;N&lt;/sub&gt;?&lt;/summary&gt;&lt;p&gt;Perché l&#x27;inflazione effettiva scende prima delle aspettative: ṗ − ṗ&lt;sup&gt;e&lt;/sup&gt; &amp;lt; 0 e, per la Phillips curve, u = u&lt;sub&gt;N&lt;/sub&gt; − (1/b)(ṗ − ṗ&lt;sup&gt;e&lt;/sup&gt;) &amp;gt; u&lt;sub&gt;N&lt;/sub&gt;. È il costo della credibilità non ancora conquistata.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Se la disinflazione fosse stata perfettamente credibile, che cosa sarebbe cambiato?&lt;/summary&gt;&lt;p&gt;Le aspettative sarebbero scese subito insieme all&#x27;inflazione. L&#x27;economia sarebbe passata da E a F lungo la verticale u&lt;sub&gt;N&lt;/sub&gt;, senza costi in disoccupazione.&lt;/p&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Media dei tre migliori 2%, paese al 3,8%: supera il criterio?&lt;/summary&gt;&lt;p&gt;No. La soglia è 2 + 1,5 = 3,5% e il paese è a 3,8%.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;fonti&quot; class=&quot;part&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;phead&quot;&gt;&lt;div class=&quot;num&quot; style=&quot;color:var(--accent)&quot;&gt;→&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Riferimenti citati nelle slide&lt;/div&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Tutte le schede qui sotto sono &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;: i dati bibliografici e le descrizioni vengono dalla ricerca web (pagine di editori, NBER, RePEc, Nobel Prize, BCE, EUR-Lex), non dalle slide. Dalle slide viene solo l&#x27;elenco di cosa è citato.&lt;/p&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Kydland, F. E. &amp;amp; Prescott, E. C. (1977) · “Rules Rather than Discretion: The Inconsistency of Optimal Plans”&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;i&gt;Journal of Political Economy&lt;/i&gt;, 85(3), pp. 473–492 · citato a slide 5 e 21&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; mostra che una politica scelta con discrezionalità, rivalutata a ogni data, può essere sub-ottimale anche quando l&#x27;obiettivo sociale è fisso e il policy maker è perfettamente informato. Le regole possono quindi migliorare i risultati. &lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;articolo fondativo della time inconsistency e vale per ogni politica pubblica, non solo per la moneta.&lt;/p&gt;
    &lt;a href=&quot;https://www.britannica.com/topic/Rules-Rather-than-Discretion-The-Inconsistency-of-Optimal-Plans&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda Britannica&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Premio Nobel per l&#x27;economia 2004 · Kydland e Prescott&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Sveriges Riksbank Prize in Economic Sciences, annunciato l&#x27;11 ottobre 2004 · citato a slide 5&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; motivazione “for their contributions to dynamic macroeconomics: the time consistency of economic policy and the driving forces behind business cycles”. Le pagine divulgative spiegano come, senza impegno preventivo, l&#x27;economia possa restare intrappolata in un&#x27;inflazione alta senza alcun guadagno sulla disoccupazione. &lt;b&gt;Perché conta:&lt;/b&gt; l&#x27;Accademia collega questo lavoro allo spostamento del dibattito dalle singole misure alle &lt;b&gt;istituzioni&lt;/b&gt; della politica economica, come l&#x27;indipendenza delle banche centrali.&lt;/p&gt;
    &lt;a href=&quot;https://www.nobelprize.org/prizes/economic-sciences/2004/press-release/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Comunicato stampa&lt;/a&gt; · &lt;a href=&quot;https://www.nobelprize.org/prizes/economic-sciences/2004/popular-information/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Informazioni divulgative&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Barro, R. J. &amp;amp; Gordon, D. B. (1983) · “A Positive Theory of Monetary Policy in a Natural Rate Model”&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;i&gt;Journal of Political Economy&lt;/i&gt;, 91(4), pp. 589–610 · versione precedente NBER WP 807 (1981) · citato a slide 5&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; un policy maker discrezionale può creare inflazione a sorpresa per ridurre la disoccupazione e aumentare le entrate (i due incentivi della sezione 3). In equilibrio crescita monetaria e inflazione risultano eccessive e dipendono da pendenza della Phillips curve, tasso naturale e altri fattori di costi e benefici dell&#x27;inflazione. &lt;b&gt;Perché conta:&lt;/b&gt; è il modello che la lezione chiama “BG model”.&lt;/p&gt;
    &lt;a href=&quot;https://www.nber.org/papers/w0807&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER Working Paper 807&lt;/a&gt; · &lt;a href=&quot;https://ideas.repec.org/a/ucp/jpolec/v91y1983i4p589-610.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Barro, R. J. &amp;amp; Gordon, D. B. (1983) · “Rules, Discretion and Reputation in a Model of Monetary Policy”&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;i&gt;Journal of Monetary Economics&lt;/i&gt;, 12(1), pp. 101–121 · versione NBER WP 1079 · citato a slide 5&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; confronta discrezionalità e regole e mostra che la &lt;b&gt;reputazione&lt;/b&gt;, in un gioco ripetuto, può sostituire in parte una regola formale. Alcune regole, ma in genere non quella ideale, sono sostenibili, e gli esiti stanno fra quelli della discrezionalità e quelli della regola ideale. &lt;b&gt;Perché conta:&lt;/b&gt; spiega la parola “reputazione” usata a slide 3 per le banche centrali.&lt;/p&gt;
    &lt;a href=&quot;https://www.nber.org/papers/w1079&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NBER Working Paper 1079&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Rogoff, K. (1985) · “The Optimal Degree of Commitment to an Intermediate Monetary Target”&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;i&gt;Quarterly Journal of Economics&lt;/i&gt;, 100(4), pp. 1169–1189 · citato a slide 21&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; la società può stare meglio nominando un banchiere centrale che pesa la stabilità dei prezzi &lt;b&gt;più&lt;/b&gt; di quanto faccia lei: l&#x27;inflazione time consistent scende, ma con grandi shock d&#x27;offerta aumenta la variabilità dell&#x27;occupazione. Il peso ottimale sull&#x27;inflazione è quindi grande ma finito. &lt;b&gt;Perché conta:&lt;/b&gt; è la soluzione per &lt;b&gt;delega&lt;/b&gt; (il “conservative central banker”) che fonda l&#x27;idea di banche centrali indipendenti e avverse all&#x27;inflazione.&lt;/p&gt;
    &lt;a href=&quot;https://ideas.repec.org/a/oup/qjecon/v100y1985i4p1169-1189..html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt; · &lt;a href=&quot;https://rogoff.scholars.harvard.edu/publications/optimal-degree-commitment-intermediate-monetary-target&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina dell&#x27;autore (Harvard)&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Giavazzi, F. &amp;amp; Pagano, M. (1988) · “The Advantage of Tying One&#x27;s Hands: EMS Discipline and Central Bank Credibility”&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;i&gt;European Economic Review&lt;/i&gt;, 32(5), pp. 1055–1075 · versione CEPR DP 135 (1986) · citato a slide 26&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; far parte dello SME (EMS) può dare grandi guadagni di credibilità ai paesi ad alta inflazione, perché aggiunge una penalità all&#x27;inflazione e rende il pubblico consapevole di quella penalità. Il risultato dipende da quanto il governo conta sul signoraggio. &lt;b&gt;Perché conta:&lt;/b&gt; è l&#x27;origine dell&#x27;espressione “legarsi le mani” usata nella lezione per l&#x27;Italia.&lt;/p&gt;
    &lt;a href=&quot;https://ideas.repec.org/a/eee/eecrev/v32y1988i5p1055-1075.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IDEAS/RePEc&lt;/a&gt; · &lt;a href=&quot;https://www.nber.org/chapters/c11684.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Ristampa NBER (pdf)&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Criteri di convergenza di Maastricht · stabilità dei prezzi&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;Art. 140 TFUE e Protocollo n. 13 sui criteri di convergenza · citato a slide 27&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; il Trattato chiede un&#x27;inflazione vicina a quella dei tre Stati membri con i migliori risultati in termini di stabilità dei prezzi. Il Protocollo 13 fissa la soglia: inflazione media (indice HICP) nell&#x27;anno precedente l&#x27;esame non superiore di oltre &lt;b&gt;1,5 punti&lt;/b&gt; a quella di quei tre paesi. &lt;b&gt;Perché conta:&lt;/b&gt; è lo strumento istituzionale con cui la disinflazione da E a F è stata resa obbligatoria per entrare nell&#x27;euro.&lt;/p&gt;
    &lt;a href=&quot;https://www.ecb.europa.eu/ecb/orga/escb/html/convergence-criteria.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BCE · Convergence criteria&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/pro_13/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex · Protocollo 13&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Phillips, A. W. (1958) · la Phillips curve originale&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;“The Relation Between Unemployment and the Rate of Change of Money Wage Rates in the United Kingdom, 1861–1957”, &lt;i&gt;Economica&lt;/i&gt;, 25(100), pp. 283–299 · concetto usato a slide 7–8, 13&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; una relazione statistica negativa fra disoccupazione e crescita dei &lt;b&gt;salari nominali&lt;/b&gt; nel Regno Unito. La lettura in termini di inflazione dei prezzi è venuta dopo. &lt;b&gt;Perché conta:&lt;/b&gt; la lezione ne usa la versione “expectations-augmented”, nella quale il trade-off vale solo per l&#x27;inflazione non attesa.&lt;/p&gt;
    &lt;a href=&quot;https://econpapers.repec.org/RePEc:bla:econom:v:25:y:1958:i:100:p:283-299&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EconPapers/RePEc&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;ref&quot;&gt;&lt;h4&gt;Euroizzazione unilaterale: Montenegro e Kosovo&lt;/h4&gt;
    &lt;div class=&quot;src&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;citati a slide 26 come analogia con la dollarizzazione&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;Cosa contiene:&lt;/b&gt; i due paesi usano l&#x27;euro come moneta senza far parte dell&#x27;area euro, quindi senza una propria politica monetaria. La banca centrale del Montenegro descrive il regime di euroizzazione e i suoi limiti. La BCE ha più volte ribadito che l&#x27;euroizzazione unilaterale non è compatibile con il percorso previsto dai Trattati per adottare l&#x27;euro. &lt;b&gt;Perché conta:&lt;/b&gt; è il caso estremo di credibilità “presa in prestito”, come l&#x27;ipotesi lira → DM della lezione.&lt;/p&gt;
    &lt;a href=&quot;https://cbcg.me/en/core-functions/monetary-policy/euroisation&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Banca centrale del Montenegro · Euroisation&lt;/a&gt; · &lt;a href=&quot;https://www.ecb.europa.eu/press/key/date/2015/html/sp150323.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BCE · discorso del 2015&lt;/a&gt;&lt;/div&gt;

  &lt;p class=&quot;note&quot; style=&quot;margin-top:1.5rem&quot;&gt;&lt;b&gt;Nota sui materiali del corso:&lt;/b&gt; la consegna chiedeva di collegare la lezione agli altri file della cartella &lt;code&gt;corso/&lt;/code&gt;. In questa sessione non avevo uno strumento per elencarne il contenuto, quindi non li ho consultati. I collegamenti con le altre lezioni (shock asimmetrici e OCA prima, self-fulfilling debt crises dopo) vengono solo da quanto dicono le slide 2 e 29.&lt;/p&gt;

&lt;script&gt;
(function(){

/* ---------- generic plot in the (u, ṗ) plane ---------- */
function plot(svg,o){
  svg.innerHTML=&quot;&quot;;

  const cp=el(&quot;clipPath&quot;,{id:cid},el(&quot;defs&quot;,{},svg));el(&quot;rect&quot;,{x:L,y:T-2,width:R-L+2,height:B-T+2},cp);
  const g=el(&quot;g&quot;,{&quot;clip-path&quot;:&quot;url(#&quot;+cid+&quot;)&quot;},svg);
  const y0=sy(0);
  if(o.tx){for(let u=o.tx;u&lt;o.xmax;u+=o.tx){el(&quot;line&quot;,{x1:sx(u),y1:y0,x2:sx(u),y2:y0+4,class:&quot;ax&quot;},svg);txt(svg,sx(u),y0+15,String(u),&quot;sm&quot;,&quot;middle&quot;);}}
  if(o.ty){for(let p=Math.ceil(ymin/o.ty)*o.ty;p&lt;o.ymax;p+=o.ty){if(p===0)continue;el(&quot;line&quot;,{x1:L-4,y1:sy(p),x2:L,y2:sy(p),class:&quot;ax&quot;},svg);txt(svg,L-7,sy(p)+4,String(p),&quot;sm&quot;,&quot;end&quot;);}}
  (o.ic||[]).forEach(c=&gt;{if(!(c.L&gt;0))return;const cls=c.cls||&quot;ic&quot;;
    if(c.a2&gt;1e-6){el(&quot;ellipse&quot;,{cx:sx(c.us||0),cy:y0,rx:Math.sqrt(c.L/c.a2)*(R-L)/o.xmax,ry:Math.sqrt(c.L/c.a1)*(B-T)/(o.ymax-ymin),class:cls},g);}
    else{const y=sy(Math.sqrt(c.L/c.a1));el(&quot;line&quot;,{x1:L,y1:y,x2:R,y2:y,class:cls},g);}
    if(c.label){const ry=Math.sqrt(c.L/c.a1)*(B-T)/(o.ymax-ymin);txt(svg,sx(c.us||0)+8,y0-ry-5,c.label,&quot;lbl&quot;);}
  });
  (o.hl||[]).forEach(h=&gt;{el(&quot;line&quot;,{x1:L,y1:sy(h.p),x2:R,y2:sy(h.p),class:&quot;hl&quot;},g);if(h.label)txt(svg,L-7,sy(h.p)+4,h.label,&quot;lbl&quot;,&quot;end&quot;);});
  (o.sr||[]).forEach(s=&gt;{const p0=s.pe+o.b*o.uN,p1=s.pe+o.b*(o.uN-o.xmax);

    if(s.label){const u=o.uN+1.6,p=s.pe-o.b*1.6;if(p&gt;ymin&amp;&amp;p&lt;o.ymax)txt(svg,sx(u)+6,sy(p)-6,s.label,&quot;sm&quot;);}});
  (o.rc||[]).forEach(r=&gt;{el(&quot;line&quot;,{x1:sx(r.us||0),y1:y0,x2:sx(o.xmax),y2:sy(r.k*(o.xmax-(r.us||0))),class:r.cls||&quot;rc&quot;},g);});
  if(o.uN!=null){el(&quot;line&quot;,{x1:sx(o.uN),y1:B,x2:sx(o.uN),y2:T,class:&quot;lr&quot;},g);txt(svg,sx(o.uN),Math.min(y0+(o.tx?30:20),342),&quot;u_N&quot;,&quot;lbl&quot;,&quot;middle&quot;);}
  (o.xlab||[]).forEach(x=&gt;txt(svg,sx(x.u),y0+(o.tx?30:20),x.l,&quot;lbl&quot;,&quot;middle&quot;));
  if(o.path&amp;&amp;o.path.length&gt;1)el(&quot;polyline&quot;,{points:o.path.map(q=&gt;sx(q[0])+&quot;,&quot;+sy(q[1])).join(&quot; &quot;),class:&quot;path&quot;},g);
  (o.pts||[]).forEach(q=&gt;{el(&quot;circle&quot;,{cx:sx(q.u),cy:sy(q.p),r:q.r||5.5,class:q.cls||&quot;pt&quot;},svg);
    if(q.l)txt(svg,sx(q.u)+(q.dx==null?8:q.dx),sy(q.p)+(q.dy==null?-8:q.dy),q.l,&quot;pl&quot;,q.anc||&quot;start&quot;);});
  /* axes on top */
  el(&quot;line&quot;,{x1:L,y1:B,x2:L,y2:T-6,class:&quot;ax&quot;},svg);el(&quot;path&quot;,{d:&quot;M&quot;+(L-4)+&quot;,&quot;+(T-2)+&quot;L&quot;+L+&quot;,&quot;+(T-11)+&quot;L&quot;+(L+4)+&quot;,&quot;+(T-2)+&quot;z&quot;,class:&quot;axh&quot;},svg);
  el(&quot;line&quot;,{x1:L,y1:y0,x2:R+8,y2:y0,class:&quot;ax&quot;},svg);el(&quot;path&quot;,{d:&quot;M&quot;+(R+6)+&quot;,&quot;+(y0-4)+&quot;L&quot;+(R+15)+&quot;,&quot;+y0+&quot;L&quot;+(R+6)+&quot;,&quot;+(y0+4)+&quot;z&quot;,class:&quot;axh&quot;},svg);
  txt(svg,L-10,T+6,o.yl||&quot;ṗ&quot;,&quot;lbl&quot;,&quot;end&quot;);txt(svg,R+12,y0-10,o.xl||&quot;u&quot;,&quot;lbl&quot;,&quot;end&quot;);
  if(o.ol!==&quot;&quot;&amp;&amp;o.ol!==undefined)txt(svg,L-6,y0+18,o.ol,&quot;sm&quot;,&quot;end&quot;);
}

$$(&quot;.ctrl label&quot;).forEach(l=&gt;{const s=document.createElement(&quot;span&quot;);while(l.firstChild&amp;&amp;l.firstChild.nodeName!==&quot;INPUT&quot;)s.appendChild(l.firstChild);l.insertBefore(s,l.firstChild);});

/* ---------- tabs ---------- */
$$(&quot;[data-tabs]&quot;).forEach(box=&gt;{const tabs=$$(&quot;[role=tab]&quot;,box),pans=$$(&quot;[role=tabpanel]&quot;,box);
  tabs.forEach((t,i)=&gt;{t.classList.toggle(&quot;on&quot;,i===0);t.addEventListener(&quot;click&quot;,()=&gt;{tabs.forEach((x,j)=&gt;{x.setAttribute(&quot;aria-selected&quot;,j===i);x.classList.toggle(&quot;on&quot;,j===i);pans[j].hidden=j!==i;});});});});

function stepper(root,onstep){const steps=$$(&quot;[data-step]&quot;,root),dots=$(&quot;.dots&quot;,root);let i=0;

/* ---------- 3: Phillips curve explorer ---------- */
bind([&quot;pc-pe&quot;,&quot;pc-u&quot;],()=&gt;{const pe=+$(&quot;#pc-pe&quot;).value,u=+$(&quot;#pc-u&quot;).value,p=pe+(8-u);
  out(&quot;pc-pe&quot;,f(pe)+&quot;%&quot;);out(&quot;pc-u&quot;,f(u)+&quot;%&quot;);
  plot($(&quot;#pc-svg&quot;),{xmax:14,ymin:-6,ymax:20,uN:8,b:1,tx:2,ty:4,ol:&quot;&quot;,
    sr:[{pe:0,cls:&quot;srf&quot;},{pe:5,cls:&quot;srf&quot;},{pe:10,cls:&quot;srf&quot;},{pe:pe,cls:&quot;sr&quot;,label:&quot;ṗᵉ = &quot;+f(pe)}],
    hl:[{p:pe,label:&quot;ṗᵉ&quot;}],pts:[{u:u,p:p,l:&quot;(&quot;+f(u)+&quot;; &quot;+f(p)+&quot;)&quot;}]});

/* ---------- 4: indifference curves ---------- */
function ic(){const a1=+$(&quot;#ic-a1&quot;).value,a2=+$(&quot;#ic-a2&quot;).value;out(&quot;ic-a1&quot;,f(a1));out(&quot;ic-a2&quot;,f(a2));

    ic:[{L:4,a1:a1,a2:a2,label:&quot;I₁&quot;},{L:9,a1:a1,a2:a2,label:&quot;I₂&quot;},{L:16,a1:a1,a2:a2,label:&quot;I₃&quot;}]});
  const r=a1/a2;
  $(&quot;#ic-msg&quot;).innerHTML=r&gt;1.3?&quot;&lt;b&gt;Hard-nosed&lt;/b&gt;: curve basse e larghe. Anche poca inflazione costa cara, mentre la disoccupazione è tollerata.&quot;:
    r&lt;0.77?&quot;&lt;b&gt;Wet&lt;/b&gt;: curve alte e strette. La disoccupazione pesa molto e l&#x27;autorità accetta più inflazione pur di ridurla.&quot;:

/* ---------- 5: Barro-Gordon lab ---------- */
let acts=[];
function par(){const un=+$(&quot;#bg-un&quot;).value,usEl=$(&quot;#bg-us&quot;);usEl.max=un;if(+usEl.value&gt;un)usEl.value=un;
  return {w:+$(&quot;#bg-w&quot;).value,b:+$(&quot;#bg-b&quot;).value,uN:un,us:+usEl.value};}
function model(P){const k=P.w/P.b,gap=P.uN-P.us;
  return {k:k,pE:k*gap,resp:pe=&gt;{const p=(k*gap+k*pe/P.b)/(1+k/P.b);return {p:p,u:P.uN-(p-pe)/P.b,pe:pe};}};}
const subs=[&quot;C&quot;,&quot;C₂&quot;,&quot;C₃&quot;,&quot;C₄&quot;,&quot;C₅&quot;,&quot;C₆&quot;,&quot;C₇&quot;,&quot;C₈&quot;,&quot;C₉&quot;];
function trail(P,M){const A={u:P.uN,p:0,pe:0,l:&quot;A&quot;};let t=[A];
  acts.forEach(a=&gt;{const last=t[t.length-1];
    if(a===&quot;naive&quot;){t=[A,Object.assign(M.resp(0),{l:&quot;B&quot;})];}
    else if(a===&quot;rational&quot;){t=[A,{u:P.uN,p:M.pE,pe:M.pE,l:&quot;E&quot;}];}
    else if(a===&quot;adapt&quot;){if(last.l===&quot;E&quot;)return;const pe=last.l===&quot;A&quot;?0:last.p,q=M.resp(pe);
      if(Math.abs(q.p-M.pE)&lt;0.06||t.length&gt;=10){q.l=&quot;E&quot;;q.u=P.uN;q.p=M.pE;q.pe=M.pE;}else q.l=last.l===&quot;A&quot;?&quot;B&quot;:subs[t.length-2]||&quot;C…&quot;;t.push(q);}});
  return t;}
function bg(){const P=par(),M=model(P);
  out(&quot;bg-w&quot;,f(P.w,2));out(&quot;bg-b&quot;,f(P.b,2));out(&quot;bg-un&quot;,f(P.uN)+&quot;%&quot;);out(&quot;bg-us&quot;,f(P.us)+&quot;%&quot;);
  const t=trail(P,M),cur=t[t.length-1],ymax=Math.max(12,Math.ceil((M.pE+4)/4)*4);
  const pes=[];t.forEach(q=&gt;{if(pes.indexOf(q.pe)&lt;0)pes.push(q.pe);});
  const B=M.resp(0),LA=P.w*Math.pow(P.uN-P.us,2),LB=B.p*B.p+P.w*Math.pow(B.u-P.us,2),LE=M.pE*M.pE+LA,Lc=cur.p*cur.p+P.w*Math.pow(cur.u-P.us,2);
  const pts=t.map((q,i)=&gt;({u:q.u,p:q.p,l:q.l,cls:i===t.length-1?&quot;pt&quot;:&quot;pt2&quot;,r:i===t.length-1?6:4.5,dx:q.l===&quot;A&quot;?8:-10,dy:q.l===&quot;A&quot;?-8:-8,anc:q.l===&quot;A&quot;?&quot;start&quot;:&quot;end&quot;}));
  if(!t.some(q=&gt;q.l===&quot;E&quot;))pts.unshift({u:P.uN,p:M.pE,l:&quot;E&quot;,cls:&quot;ptg&quot;,r:4.5});
  plot($(&quot;#bg-svg&quot;),{xmax:14,ymax:ymax,uN:P.uN,b:P.b,tx:2,ty:4,ol:P.us===0?&quot;ṗ*, u*&quot;:&quot;ṗ*&quot;,
    xlab:P.us&gt;0&amp;&amp;P.us&lt;P.uN?[{u:P.us,l:&quot;u*&quot;}]:[],
    ic:[{L:Lc,a1:1,a2:P.w,us:P.us}],
    sr:pes.map((pe,i)=&gt;({pe:pe,cls:i===pes.length-1?&quot;sr&quot;:&quot;srf&quot;,label:i===pes.length-1?&quot;ṗᵉ = &quot;+f(pe):&quot;&quot;})),
    rc:[{k:M.k,us:P.us}],path:t.map(q=&gt;[q.u,q.p]),pts:pts});
  $(&quot;#bg-cur&quot;).textContent=cur.l+&quot; (&quot;+f(cur.u)+&quot;; &quot;+f(cur.p)+&quot;)&quot;;$(&quot;#bg-pe&quot;).textContent=f(cur.pe);
  $(&quot;#bg-pE&quot;).textContent=f(M.pE);$(&quot;#bg-LA&quot;).textContent=f(LA);$(&quot;#bg-LB&quot;).textContent=f(LB);$(&quot;#bg-LE&quot;).textContent=f(LE);
  let m;
  if(M.pE&lt;1e-9)m=&quot;Bias nullo: la reaction curve è orizzontale o parte da u&lt;sub&gt;N&lt;/sub&gt;, quindi A, B ed E coincidono. L&#x27;annuncio di ṗ* è credibile.&quot;;
  else if(cur.l===&quot;A&quot;)m=&quot;Punto A: l&#x27;annuncio. Con ṗ&lt;sup&gt;e&lt;/sup&gt; = 0 la CB preferisce sorprendere: perdita in B (&quot;+f(LB)+&quot;) &amp;lt; perdita in A (&quot;+f(LA)+&quot;). Premi un pulsante di aspettative.&quot;;
  else if(cur.l===&quot;B&quot;)m=&quot;Punto B: pubblico &lt;b&gt;naïve&lt;/b&gt; ingannato. u scende a &quot;+f(cur.u)+&quot;% con inflazione &quot;+f(cur.p)+&quot;%. Non può durare: gli agenti imparano.&quot;;
  else if(cur.l===&quot;E&quot;)m=&quot;Punto E: equilibrio &lt;b&gt;time consistent&lt;/b&gt;. u = u&lt;sub&gt;N&lt;/sub&gt; come in A, ma con inflazione &quot;+f(M.pE)+&quot;. La perdita &quot;+f(LE)+&quot; supera quella di A (&quot;+f(LA)+&quot;): è il costo dell&#x27;&lt;b&gt;inflation bias&lt;/b&gt;.&quot;;
  else m=&quot;Aspettative &lt;b&gt;adattive&lt;/b&gt;: ṗ&lt;sup&gt;e&lt;/sup&gt; sale a &quot;+f(cur.pe)+&quot;, la Phillips curve si sposta in alto e la CB sorprende ancora, ma meno. Continua a premere ▸ per convergere verso E.&quot;;
  $(&quot;#bg-msg&quot;).innerHTML=m;}

/* ---------- 7: inflation differential ---------- */
bind([&quot;df-g&quot;,&quot;df-i&quot;,&quot;df-n&quot;],()=&gt;{const pg=+$(&quot;#df-g&quot;).value/100,pi=+$(&quot;#df-i&quot;).value/100,n=+$(&quot;#df-n&quot;).value;
  out(&quot;df-g&quot;,f(pg*100)+&quot;%&quot;);out(&quot;df-i&quot;,f(pi*100)+&quot;%&quot;);out(&quot;df-n&quot;,String(n));
  const r=(1+pi)/(1+pg),svg=$(&quot;#df-svg&quot;);svg.innerHTML=&quot;&quot;;const vals=[];for(let t=0;t&lt;=n;t++)vals.push(100*Math.pow(r,t));
  const mx=Math.max.apply(null,vals.concat([130])),base=Math.min(90,Math.min.apply(null,vals)-10),x0=40,x1=505,y0=170,y1=24,bw=(x1-x0)/(n+1);
  const sy=v=&gt;y0-(v-base)/(mx-base)*(y0-y1);
  vals.forEach((v,t)=&gt;{el(&quot;rect&quot;,{x:x0+t*bw+bw*0.15,y:sy(v),width:bw*0.7,height:y0-sy(v),rx:3,fill:t===0?&quot;var(--muted)&quot;:&quot;var(--brick)&quot;,opacity:t===0?0.5:0.35+0.65*t/n},svg);
    if(n&lt;=10||t%2===0)txt(svg,x0+t*bw+bw/2,y0+14,String(t),&quot;sm&quot;,&quot;middle&quot;);});
  txt(svg,x0+n*bw+bw/2,sy(vals[n])-6,f(vals[n],0),&quot;lbl&quot;,&quot;middle&quot;);
  el(&quot;line&quot;,{x1:x0,y1:sy(100),x2:x1,y2:sy(100),class:&quot;hl&quot;},svg);txt(svg,x0-4,sy(100)+4,&quot;100&quot;,&quot;sm&quot;,&quot;end&quot;);
  txt(svg,x0,y0+30,&quot;anni →&quot;,&quot;sm&quot;);
  $(&quot;#df-a&quot;).textContent=f((r-1)*100)+&quot;% (≈ &quot;+f((pi-pg)*100)+&quot;)&quot;;$(&quot;#df-c&quot;).textContent=f((Math.pow(r,n)-1)*100)+&quot;%&quot;;});

    sr:pes.map((pe,j)=&gt;({pe:pe,cls:j===pes.length-1?&quot;sr&quot;:&quot;srf&quot;,label:j===pes.length-1?&quot;ṗᵉ = &quot;+f(pe):&quot;&quot;})),

  $(&quot;#dis-pe&quot;).textContent=f(cur.pe)+&quot;%&quot;;$(&quot;#dis-p&quot;).textContent=f(cur.p)+&quot;%&quot;;$(&quot;#dis-u&quot;).textContent=f(cur.u)+&quot;%&quot;;});
