&lt;main class=&quot;wrap&quot;&gt;
&lt;header class=&quot;hero&quot; id=&quot;mappa&quot;&gt;
&lt;div class=&quot;kick&quot;&gt;European Economic Policy 2026-27 · Lezione 9 · 27 slide&lt;/div&gt;
&lt;h1&gt;Transition to EMU&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;Dallo European Monetary System al Trattato di Maastricht: come l&#x27;Europa è passata dai cambi concordati alla moneta unica.&lt;/p&gt;
&lt;p class=&quot;lead&quot;&gt;Nel 1971 l&#x27;Europa perde il riferimento del dollaro e prova a stabilizzare da sola i cambi tra le proprie valute. La stabilità arriva, ma ha un prezzo: seguire la politica monetaria tedesca. Quando la riunificazione tedesca spinge la Germania e il resto d&#x27;Europa in direzioni opposte, il sistema salta. La risposta è la &lt;dfn&gt;EMU&lt;/dfn&gt; (Economic and Monetary Union, l&#x27;unione economica e monetaria), con condizioni di ingresso scritte nel Trattato.&lt;/p&gt;
&lt;svg id=&quot;map&quot; role=&quot;group&quot; aria-label=&quot;Mappa concettuale della lezione: ogni riquadro porta alla sezione corrispondente&quot;&gt;&lt;/svg&gt;
&lt;p class=&quot;cap&quot;&gt;Clicca un riquadro per andare alla sezione. Il percorso a serpentina segue l&#x27;ordine delle slide; le frecce tratteggiate sono i legami logici tra argomenti lontani.&lt;/p&gt;
&lt;div class=&quot;key&quot;&gt;
&lt;span&gt;&lt;span class=&quot;s&quot;&gt;slide 12&lt;/span&gt; viene dalle slide&lt;/span&gt;
&lt;span&gt;&lt;span class=&quot;i&quot;&gt;integrazione&lt;/span&gt; spiegazione aggiunta, non presente nelle slide&lt;/span&gt;
&lt;span&gt;&lt;span class=&quot;x&quot;&gt;fonte esterna ↗&lt;/span&gt; dato preso dal web, con link&lt;/span&gt;
&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;&lt;b&gt;Altri materiali del corso:&lt;/b&gt; questa lezione è stata scritta solo dal PDF indicato. Le cartelle &lt;code&gt;corso/Slides/7-EEP&lt;/code&gt;, &lt;code&gt;8-EEP&lt;/code&gt; e &lt;code&gt;10-EEP&lt;/code&gt; esistono, ma non è stato possibile elencarne i file, quindi nessun contenuto viene da lì. Dove le slide danno per note altre lezioni (OCA theory, IS-LM), la spiegazione è segnata come integrazione.&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;part p1&quot; id=&quot;parte1&quot;&gt;
&lt;div class=&quot;ph&quot;&gt;&lt;div class=&quot;num&quot;&gt;Parte 1&lt;/div&gt;&lt;h2&gt;Perso il dollaro, nasce lo Snake&lt;/h2&gt;&lt;p&gt;Perché gli europei cercano un accordo di cambio proprio negli anni &#x27;70, e perché il primo tentativo non regge.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;sec&quot; id=&quot;origini&quot;&gt;
&lt;h3&gt;Dal 1944 al 1979, in sei passi&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;Un &lt;dfn&gt;accordo di cambio&lt;/dfn&gt; (exchange rate agreement) è un patto con cui più paesi si impegnano a tenere il cambio vicino a un valore concordato, la &lt;dfn&gt;parità&lt;/dfn&gt;. Lo EMS durò vent&#x27;anni e, insieme a Bretton Woods, è uno degli accordi di cambio più lunghi &lt;span class=&quot;s&quot;&gt;slide 2&lt;/span&gt;. Per capirlo si parte dal vuoto che doveva riempire.&lt;/p&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1944&lt;/div&gt;&lt;h4&gt;Bretton Woods&lt;/h4&gt;&lt;p&gt;È il sistema del dopoguerra: le valute sono agganciate al dollaro e il dollaro all&#x27;oro, a 35 dollari l&#x27;oncia &lt;span class=&quot;s&quot;&gt;slide 2&lt;/span&gt;. Il dollaro fa da riferimento per tutti. &lt;a class=&quot;x&quot; href=&quot;https://www.federalreservehistory.org/essays/bretton_woods_created&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: Federal Reserve History ↗&lt;/a&gt; aggiunge che i paesi regolavano i saldi internazionali in dollari, convertibili in oro.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;Agosto 1971&lt;/div&gt;&lt;h4&gt;Nixon: il dollaro diventa inconvertibile&lt;/h4&gt;&lt;p&gt;Gli Stati Uniti smettono di cambiare dollari in oro alla parità fissata. Questa è la &lt;dfn&gt;inconvertibility&lt;/dfn&gt;: il dollaro resta una moneta, ma non è più una promessa di oro. Il riferimento comune è perso &lt;span class=&quot;s&quot;&gt;slide 2&lt;/span&gt;. &lt;a class=&quot;x&quot; href=&quot;https://history.state.gov/milestones/1969-1976/nixon-shock&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: Office of the Historian ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;Dicembre 1971&lt;/div&gt;&lt;h4&gt;Smithsonian Agreement&lt;/h4&gt;&lt;p&gt;Il G10, il gruppo dei dieci principali paesi industriali, prova a salvare il sistema. Il dollaro si svaluta dell&#x27;8% e le altre valute possono oscillare di ±2,25% rispetto al dollaro. È il &lt;dfn&gt;Tunnel&lt;/dfn&gt;, con variazione massima del 4,5% &lt;span class=&quot;s&quot;&gt;slide 2&lt;/span&gt;. Il tentativo dura poco: &lt;a class=&quot;x&quot; href=&quot;https://www.federalreservehistory.org/essays/smithsonian-agreement&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: Federal Reserve History ↗&lt;/a&gt; parla di un salvataggio fallito entro quindici mesi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1972&lt;/div&gt;&lt;h4&gt;Lo Snake&lt;/h4&gt;&lt;p&gt;I 6 paesi della EEC (European Economic Community) restringono le oscillazioni tra le proprie valute a ±1,125%. La fascia europea, larga 2,25%, si muove dentro il Tunnel come un serpente in una galleria &lt;span class=&quot;s&quot;&gt;slide 3&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1972-74&lt;/div&gt;&lt;h4&gt;Le uscite&lt;/h4&gt;&lt;p&gt;Regno Unito, Irlanda e Italia escono, poi la Francia nel 1974. Tassi di inflazione diversi rendono difficile restare nella banda: resta solo l&#x27;area tedesca, cioè Germania, Benelux e Danimarca. Negli stessi anni si introducono vari &lt;dfn&gt;capital controls&lt;/dfn&gt;, i limiti ai movimenti di capitale verso l&#x27;estero &lt;span class=&quot;s&quot;&gt;slide 5&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1979&lt;/div&gt;&lt;h4&gt;Nasce lo EMS&lt;/h4&gt;&lt;p&gt;Il nuovo sistema ha due obiettivi: estendere l&#x27;area di coordinamento dello Snake, ma con &lt;b&gt;greater equity among currencies&lt;/b&gt;, e offrire meccanismi di credito alle valute deboli &lt;span class=&quot;s&quot;&gt;slide 5&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Slide e fonti non coincidono.&lt;/b&gt; La slide 5 data al 1972 l&#x27;uscita di Regno Unito, Irlanda e Italia. Le fonti concordano sul Regno Unito (giugno 1972), mentre per l&#x27;Italia indicano l&#x27;inizio del 1973: febbraio per &lt;a class=&quot;x&quot; href=&quot;https://www.europarl.europa.eu/RegData/etudes/BRIE/2015/551325/EPRS_BRI(2015)551325_EN.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: EPRS ↗&lt;/a&gt; e &lt;a class=&quot;x&quot; href=&quot;https://www.elibrary.imf.org/view/journals/024/1976/003/article-A003-en.xml&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: IMF Staff Papers 1976 ↗&lt;/a&gt;. Per l&#x27;Irlanda non ho trovato una data confermata. Per lo studio vale la logica della slide; se servono le date, verificale.&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;snake&quot;&gt;
&lt;h3&gt;Perché serviva lo Snake: i margini si sommano&lt;/h3&gt;
&lt;svg viewBox=&quot;0 0 460 210&quot; role=&quot;img&quot; aria-label=&quot;Tunnel largo 4,5 per cento con dentro lo Snake largo 2,25 per cento, che ondula&quot; style=&quot;max-width:640px;margin:10px 0&quot;&gt;
&lt;path d=&quot;M16 30H380M16 180H380&quot; class=&quot;lh&quot;/&gt;
&lt;path d=&quot;M16 48C70 70 110 88 160 80S270 28 330 34 372 44 380 48&quot; class=&quot;lk&quot;/&gt;
&lt;path d=&quot;M16 123C70 145 110 163 160 155S270 103 330 109 372 119 380 123&quot; class=&quot;lk&quot;/&gt;
&lt;path d=&quot;M390 48V123M385 48H395M385 123H395&quot; class=&quot;lk&quot; style=&quot;stroke-width:1.5&quot;/&gt;&lt;text x=&quot;398&quot; y=&quot;90&quot; class=&quot;tk&quot;&gt;2,25%&lt;/text&gt;
&lt;path d=&quot;M446 30V180M441 30H451M441 180H451&quot; class=&quot;lh&quot; style=&quot;stroke-width:1.5&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;160&quot; class=&quot;th&quot; text-anchor=&quot;end&quot;&gt;4,5%&lt;/text&gt;
&lt;text x=&quot;20&quot; y=&quot;22&quot; class=&quot;th&quot;&gt;Tunnel: limiti rispetto al dollaro&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;120&quot; class=&quot;tk&quot;&gt;Snake&lt;/text&gt;
&lt;/svg&gt;
&lt;p class=&quot;txt&quot;&gt;Se due valute possono muoversi ciascuna di ±2,25% rispetto al dollaro, tra loro possono muoversi molto di più. Basta che una salga al massimo e l&#x27;altra scenda al minimo &lt;span class=&quot;s&quot;&gt;slide 4&lt;/span&gt;. Il &lt;dfn&gt;cambio incrociato&lt;/dfn&gt; (cross rate), cioè il cambio Lira/DM ricavato dai due cambi col dollaro, è a/b.&lt;/p&gt;
&lt;div class=&quot;lab side&quot;&gt;
&lt;div&gt;
&lt;h4&gt;Laboratorio: quanto oscilla Lira/DM?&lt;/h4&gt;
&lt;label class=&quot;ctl&quot;&gt;Margine rispetto al dollaro &lt;output id=&quot;xrmo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;xrm&quot; min=&quot;0.5&quot; max=&quot;6&quot; step=&quot;0.25&quot; value=&quot;2.25&quot;&gt;&lt;/label&gt;
&lt;svg id=&quot;xrs&quot; viewBox=&quot;0 0 460 180&quot; role=&quot;img&quot; aria-label=&quot;Confronto tra l&#x27;intervallo del cambio incrociato e la banda dello Snake&quot;&gt;&lt;/svg&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;num&quot;&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Lira/$&lt;/th&gt;&lt;th&gt;DM/$&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Parità&lt;/td&gt;&lt;td&gt;1500&lt;/td&gt;&lt;td&gt;2,5&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Limite alto&lt;/td&gt;&lt;td id=&quot;xa1&quot;&gt;&lt;/td&gt;&lt;td id=&quot;xb1&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Limite basso&lt;/td&gt;&lt;td id=&quot;xa2&quot;&gt;&lt;/td&gt;&lt;td id=&quot;xb2&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;div&gt;a&lt;sub&gt;1&lt;/sub&gt;/b&lt;sub&gt;2&lt;/sub&gt;&lt;b id=&quot;xhi&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;a&lt;sub&gt;2&lt;/sub&gt;/b&lt;sub&gt;1&lt;/sub&gt;&lt;b id=&quot;xlo&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Max var&lt;b id=&quot;xv&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Con ±2,25% ritrovi il risultato della slide 4: 627,62 e 573,59, cioè 9,42% tra i due estremi. Se Lira e DM si muovono insieme, a/b resta 600.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Come leggere «±4,5%».&lt;/b&gt; La slide scrive che i margini tra valute europee erano ±4,5%, e la tabella dà 0,0942. Sono la stessa cosa: circa +4,6% e −4,4% attorno a 600, quindi circa 9,4% da estremo a estremo. In formula &lt;span class=&quot;i&quot;&gt;integrazione&lt;/span&gt;: max var = [(1+m)/(1−m)]² − 1, cioè circa 4 volte m.&lt;/div&gt;
&lt;p class=&quot;txt&quot;&gt;Per paesi che commerciano molto tra loro, un&#x27;oscillazione del genere è troppa. Di qui la scelta di una fascia più stretta tra valute europee. &lt;span class=&quot;i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 1&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;Perché la fine della convertibilità del dollaro spinge gli europei ad accordarsi tra loro?&lt;/summary&gt;&lt;div&gt;Perché sparisce il riferimento comune che teneva stabili anche i cambi europei. L&#x27;accordo regionale cerca di ricreare quella stabilità senza il dollaro.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Con margini di ±3% rispetto al dollaro, qual è la variazione massima del cambio incrociato?&lt;/summary&gt;&lt;div&gt;(1,03/0,97)² − 1 ≈ 12,75%, cioè circa 4 × 3%. Puoi controllare col cursore. Il rapporto va al quadrato perché si confrontano due estremi: a&lt;sub&gt;1&lt;/sub&gt;/b&lt;sub&gt;2&lt;/sub&gt; è sopra la parità di un fattore (1+m)/(1−m), e a&lt;sub&gt;2&lt;/sub&gt;/b&lt;sub&gt;1&lt;/sub&gt; è sotto dello stesso fattore.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché lo Snake non regge?&lt;/summary&gt;&lt;div&gt;Perché i tassi di inflazione divergono. Un paese con più inflazione perde competitività, la sua valuta tende a scendere e la banda stretta diventa impossibile da difendere a lungo. Restano solo i paesi con inflazione vicina a quella tedesca.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;div class=&quot;part p2&quot; id=&quot;parte2&quot;&gt;
&lt;div class=&quot;ph&quot;&gt;&lt;div class=&quot;num&quot;&gt;Parte 2&lt;/div&gt;&lt;h2&gt;Come funzionava lo EMS&lt;/h2&gt;&lt;p&gt;Lo European Monetary System ha un&#x27;unità di conto, una rete di parità, bande di oscillazione, interventi obbligatori, credito e una regola per cambiare le parità di comune accordo.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;sec&quot; id=&quot;ecu&quot;&gt;
&lt;h3&gt;ECU ed ERM: l&#x27;unità di conto e la rete di parità&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;L&#x27;&lt;dfn&gt;ECU&lt;/dfn&gt; (European Currency Unit) è un paniere: una media ponderata delle valute dello EMS. È una moneta &lt;dfn&gt;notional&lt;/dfn&gt;, cioè esiste come unità di conto ma non come banconote da spendere &lt;span class=&quot;s&quot;&gt;slide 6&lt;/span&gt;. Il suo valore espresso nella valuta i è:&lt;/p&gt;
&lt;div class=&quot;fm&quot;&gt;ECU&lt;sub&gt;i&lt;/sub&gt; = Σ&lt;sub&gt;j=1…n&lt;/sub&gt; a&lt;sub&gt;j&lt;/sub&gt; S&lt;sub&gt;ij&lt;/sub&gt;&lt;/div&gt;
&lt;div class=&quot;cols&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;a&lt;sub&gt;j&lt;/sub&gt;&lt;/h4&gt;&lt;p&gt;Peso della valuta j nel paniere, basato su quote di PIL e di commercio.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;S&lt;sub&gt;ij&lt;/sub&gt;&lt;/h4&gt;&lt;p&gt;Cambio bilaterale tra la valuta j e la valuta i. Se S è il cambio di parità, ECU&lt;sub&gt;i&lt;/sub&gt; è il &lt;b&gt;valore centrale&lt;/b&gt;. Se S è il cambio di mercato, è il &lt;b&gt;valore di mercato&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;La differenza&lt;/h4&gt;&lt;p&gt;Il divario tra i due valori è un indicatore importante di quanto la valuta devia dalla media &lt;span class=&quot;s&quot;&gt;slide 6&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;lab side&quot;&gt;
&lt;div&gt;&lt;h4&gt;Laboratorio: il paniere in lire&lt;/h4&gt;
&lt;p class=&quot;cap&quot;&gt;Numeri inventati per l&#x27;esempio: 1 ECU = 0,6 DM (marco tedesco) + 1,3 FF (franco francese) + 150 lire. Parità: 600 Lira/DM e 200 Lira/FF.&lt;/p&gt;
&lt;label class=&quot;ctl&quot;&gt;Mercato Lira/DM &lt;output id=&quot;ecu1o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ecu1&quot; min=&quot;540&quot; max=&quot;660&quot; step=&quot;5&quot; value=&quot;600&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;Mercato Lira/FF &lt;output id=&quot;ecu2o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ecu2&quot; min=&quot;180&quot; max=&quot;220&quot; step=&quot;2&quot; value=&quot;200&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div&gt;&lt;svg id=&quot;ecus&quot; viewBox=&quot;0 0 460 130&quot; role=&quot;img&quot; aria-label=&quot;Valore centrale e valore di mercato dell&#x27;ECU in lire, divisi per componente&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;read&quot;&gt;&lt;div&gt;Centrale&lt;b id=&quot;ecuC&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Mercato&lt;b id=&quot;ecuM&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Deviazione&lt;b id=&quot;ecuD&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Porta entrambi i cursori al massimo: la lira perde 10% su DM e FF, ma la deviazione è solo circa 8%. La parte in lire del paniere non cambia valore in lire. &lt;span class=&quot;i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Una precisazione sui pesi.&lt;/b&gt; La slide chiama a&lt;sub&gt;j&lt;/sub&gt; «peso». Le fonti storiche descrivono il paniere come &lt;b&gt;quantità fisse&lt;/b&gt; di ciascuna valuta, per cui il peso effettivo cambiava con i cambi: &lt;a class=&quot;x&quot; href=&quot;https://www.bankofengland.co.uk/-/media/boe/files/quarterly-bulletin/1979/intervention-arrangements-in-the-european-monetary-system.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: Bank of England 1979 ↗&lt;/a&gt;. L&#x27;indicatore di deviazione aveva anche un nome e una soglia, il divergence indicator al 75% della divergenza massima: &lt;a class=&quot;x&quot; href=&quot;https://publications.bof.fi/bitstream/10024/48097/1/Muutkeskustelualoitteet11_93.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: Bank of Finland 1993 ↗&lt;/a&gt;.&lt;/div&gt;
&lt;p class=&quot;txt&quot;&gt;L&#x27;&lt;dfn&gt;ERM&lt;/dfn&gt; (Exchange Rate Mechanism) fissa la &lt;dfn&gt;central parity&lt;/dfn&gt;, cioè la parità centrale, di ogni valuta rispetto all&#x27;ECU. Da queste discende la rete delle parità bilaterali &lt;span class=&quot;s&quot;&gt;slide 7&lt;/span&gt;:&lt;/p&gt;
&lt;div class=&quot;fm&quot;&gt;£/ECU = a, DM/ECU = b → £/DM = a/b&lt;/div&gt;
&lt;p class=&quot;txt&quot;&gt;La novità politica è che il riferimento non è più la moneta di un singolo paese: è la «greater equity» richiesta dagli obiettivi dello EMS. &lt;span class=&quot;i&quot;&gt;integrazione&lt;/span&gt; La parte 3 mostra quanto questa equità sia poi rimasta sulla carta.&lt;/p&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;bande&quot;&gt;
&lt;h3&gt;Bande e interventi obbligatori&lt;/h3&gt;
&lt;div class=&quot;cols&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Narrow band&lt;/h4&gt;&lt;p class=&quot;big&quot;&gt;±2,25%&lt;/p&gt;&lt;p&gt;La banda standard.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Wide band&lt;/h4&gt;&lt;p class=&quot;big&quot;&gt;±6%&lt;/p&gt;&lt;p&gt;Concessa a Italia, Spagna e Regno Unito.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Da agosto 1993&lt;/h4&gt;&lt;p class=&quot;big&quot;&gt;±15%&lt;/p&gt;&lt;p&gt;Per tutte le valute &lt;span class=&quot;s&quot;&gt;slide 7&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;txt&quot;&gt;Quando una valuta si avvicina al limite della banda, &lt;b&gt;le banche centrali di entrambe le valute sono obbligate a intervenire&lt;/b&gt;, comprando o vendendo per difendere la parità &lt;span class=&quot;s&quot;&gt;slide 7&lt;/span&gt;. Gli interventi sono &lt;dfn&gt;automatic and compulsory&lt;/dfn&gt;. L&#x27;obbligo vale in entrambe le direzioni: la banca centrale della valuta forte vende la propria moneta, quella della valuta debole la compra. È il tratto che distingue lo EMS da un semplice aggancio unilaterale. &lt;span class=&quot;i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;h4&gt;Laboratorio: stessa pressione, bande diverse&lt;/h4&gt;
&lt;div class=&quot;seg&quot; id=&quot;bandB&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;2.25&quot; aria-pressed=&quot;true&quot;&gt;±2,25%&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;6&quot; aria-pressed=&quot;false&quot;&gt;±6%&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;15&quot; aria-pressed=&quot;false&quot;&gt;±15%&lt;/button&gt;&lt;/div&gt;
&lt;label class=&quot;ctl&quot;&gt;Pressione al ribasso sulla valuta &lt;output id=&quot;bandPo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;bandP&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;35&quot;&gt;&lt;/label&gt;
&lt;svg id=&quot;bandS&quot; viewBox=&quot;0 0 460 256&quot; role=&quot;img&quot; aria-label=&quot;Andamento di una valuta in una banda; i punti rossi segnano gli interventi obbligatori&quot; style=&quot;max-width:720px&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;read&quot;&gt;&lt;div&gt;Episodi di intervento&lt;b id=&quot;bandE&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Periodi al limite, su 100&lt;b id=&quot;bandH&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Traiettoria simulata a scopo didattico. La linea non esce mai dalla banda perché gli interventi la trattengono al limite; i punti rossi indicano dove comincia ogni episodio. Con la banda ±15% gli interventi spariscono.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;credito&quot;&gt;
&lt;h3&gt;Credito e realignment&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;Difendere una valuta debole richiede valuta forte da vendere, e le riserve sono limitate. Il meccanismo principale è la &lt;dfn&gt;Very Short-Term Financing&lt;/dfn&gt;: credito automatico da una banca centrale all&#x27;altra &lt;span class=&quot;s&quot;&gt;slide 9&lt;/span&gt;. Accanto ci sono le short- e medium-term credit facilities.&lt;/p&gt;
&lt;div class=&quot;flow&quot;&gt;
&lt;div&gt;La lira arriva al limite inferiore della banda rispetto al DM.&lt;/div&gt;
&lt;div&gt;La Banca d&#x27;Italia chiede credito alla Bundesbank, la banca centrale tedesca, e ottiene DM.&lt;/div&gt;
&lt;div&gt;Vende quei DM sul mercato e compra lire: la pressione si allenta.&lt;/div&gt;
&lt;div&gt;Rimborsa in fretta: normalmente entro 45 giorni.&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;txt&quot;&gt;Le parità centrali si possono cambiare con un &lt;dfn&gt;realignment&lt;/dfn&gt;. Questa è la vera rottura col passato: il cambio può cambiare solo per &lt;b&gt;accordo reciproco&lt;/b&gt; tra Stati partecipanti e Commissione europea, un inedito &lt;dfn&gt;pooling of monetary sovereignty&lt;/dfn&gt;, cioè la messa in comune della sovranità monetaria &lt;span class=&quot;s&quot;&gt;slide 9&lt;/span&gt;. Nessun paese può svalutare da solo per guadagnare competitività.&lt;/p&gt;
&lt;div class=&quot;lab side&quot;&gt;
&lt;div&gt;&lt;h4&gt;Laboratorio: spostare la parità&lt;/h4&gt;
&lt;label class=&quot;ctl&quot;&gt;Svalutazione della lira sul DM &lt;output id=&quot;ralo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ral&quot; min=&quot;0&quot; max=&quot;12&quot; step=&quot;0.5&quot; value=&quot;3&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;read&quot;&gt;&lt;div&gt;Nuova parità&lt;b id=&quot;ralP&quot; style=&quot;font-size:19px&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p id=&quot;ralN&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;cap&quot;&gt;Il grafico è costruito come quello della slide 10: in alto il cambio in lire per DM, quindi una salita è una svalutazione della lira. L&#x27;osservazione sulla sovrapposizione è un&#x27;&lt;span class=&quot;i&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;svg id=&quot;ralS&quot; viewBox=&quot;0 0 460 236&quot; role=&quot;img&quot; aria-label=&quot;Banda di oscillazione prima e dopo un realignment&quot;&gt;&lt;/svg&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;fasi&quot;&gt;
&lt;h3&gt;Le quattro fasi dell&#x27;ERM&lt;/h3&gt;
&lt;div class=&quot;lab side&quot;&gt;
&lt;svg id=&quot;phS&quot; viewBox=&quot;0 0 460 262&quot; role=&quot;img&quot; aria-label=&quot;Ampiezza delle bande ERM dal 1979 al 1998 con la fase selezionata evidenziata&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;stepper&quot; data-stepper id=&quot;phStep&quot; style=&quot;margin:0&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1979-83&lt;/div&gt;&lt;h4&gt;Realignment frequenti&lt;/h4&gt;&lt;p&gt;Politiche e tassi di inflazione sono ancora divergenti &lt;span class=&quot;s&quot;&gt;slide 11&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1983-87&lt;/div&gt;&lt;h4&gt;Meno realignment&lt;/h4&gt;&lt;p&gt;I tassi di inflazione cominciano a convergere &lt;span class=&quot;s&quot;&gt;slide 11&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1987-92&lt;/div&gt;&lt;h4&gt;Nessun realignment&lt;/h4&gt;&lt;p&gt;La lira entra nella narrow band. Spagna, Regno Unito e Portogallo aderiscono con wide band. Cadono gli ultimi capital controls, si firma Maastricht, la Germania si riunifica. Nel 1992 la speculazione colpisce alcune valute &lt;dfn&gt;over-valued&lt;/dfn&gt;, cioè sopravvalutate: lira e sterlina escono a settembre &lt;span class=&quot;s&quot;&gt;slide 11&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1993-98&lt;/div&gt;&lt;h4&gt;Bande a ±15%&lt;/h4&gt;&lt;p&gt;La lira rientra nel 1996, dopo una forte svalutazione tra il 1992 e il 1995 &lt;span class=&quot;s&quot;&gt;slide 11&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Una data da controllare.&lt;/b&gt; La slide 11 colloca l&#x27;ingresso di Spagna, Regno Unito e Portogallo tra il 1989 e il 1990. Per Spagna e Regno Unito torna: giugno 1989 e ottobre 1990. Il Portogallo risulta invece entrato il 6 aprile 1992: &lt;a class=&quot;x&quot; href=&quot;https://www.bde.es/f/webbde/COM/eurosist/uem/ficheros/en/membership_ec.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: Banco de España ↗&lt;/a&gt;. Lo schema delle tacche è solo indicativo: non conta i realignment reali.&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 2&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra valore centrale e valore di mercato dell&#x27;ECU?&lt;/summary&gt;&lt;div&gt;La formula è la stessa, ma il primo usa le parità centrali e il secondo i cambi di mercato. Il loro divario misura quanto la valuta devia dalla media.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Chi interviene quando una valuta tocca il limite della banda?&lt;/summary&gt;&lt;div&gt;Le banche centrali di entrambe le valute, automaticamente. La banca centrale della valuta debole può finanziarsi con la Very Short-Term Financing, da rimborsare normalmente entro 45 giorni.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché il realignment è un «pooling of monetary sovereignty»?&lt;/summary&gt;&lt;div&gt;Perché la parità si può cambiare solo con l&#x27;accordo unanime degli altri paesi e della Commissione. Una leva di politica economica nazionale diventa una decisione comune.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché i realignment diminuiscono col tempo?&lt;/summary&gt;&lt;div&gt;Perché l&#x27;inflazione converge. Con inflazioni simili i prezzi relativi cambiano meno, e serve meno correggere le parità. La fine dei realignment dopo il 1987 è però anche una rigidità: prepara la crisi del 1992.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;div class=&quot;part p3&quot; id=&quot;parte3&quot;&gt;
&lt;div class=&quot;ph&quot;&gt;&lt;div class=&quot;num&quot;&gt;Parte 3&lt;/div&gt;&lt;h2&gt;Chi comanda? La Germania e la crisi del 1992&lt;/h2&gt;&lt;p&gt;Sulla carta le valute erano pari. L&#x27;aritmetica dei cambi e la credibilità della Bundesbank hanno prodotto un sistema guidato da un solo paese, finché uno shock non ha messo i suoi interessi contro quelli degli altri.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;sec&quot; id=&quot;nth&quot;&gt;
&lt;h3&gt;The n&lt;sup&gt;th&lt;/sup&gt; country&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;In un accordo tra &lt;i&gt;n&lt;/i&gt; paesi, i cambi bilaterali da fissare sono:&lt;/p&gt;
&lt;div class=&quot;fm&quot;&gt;(n² − n) / 2&lt;/div&gt;
&lt;p class=&quot;txt&quot;&gt;Solo &lt;b&gt;n − 1&lt;/b&gt; di questi sono indipendenti: gli altri seguono da soli. Quindi bastano n − 1 banche centrali che dedicano la politica monetaria al cambio. La n-esima resta libera di perseguire il proprio obiettivo &lt;span class=&quot;s&quot;&gt;slide 12&lt;/span&gt;. Nell&#x27;esempio con 3 paesi la Banca d&#x27;Italia tiene Lira/FF, la Banque de France tiene FF/DM, e Lira/DM si fissa da solo perché è Lira/FF × FF/DM. La Bundesbank non deve fare nulla per il cambio.&lt;/p&gt;
&lt;div class=&quot;lab side&quot;&gt;
&lt;svg id=&quot;nS&quot; viewBox=&quot;0 0 420 380&quot; role=&quot;img&quot; aria-label=&quot;Rete dei cambi bilaterali tra n paesi: linee piene difese, linee tratteggiate automatiche&quot; style=&quot;max-width:440px;margin:auto&quot;&gt;&lt;/svg&gt;
&lt;div&gt;&lt;h4&gt;Laboratorio: conta i cambi&lt;/h4&gt;
&lt;label class=&quot;ctl&quot;&gt;Numero di paesi &lt;output id=&quot;nNo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;nN&quot; min=&quot;2&quot; max=&quot;12&quot; value=&quot;3&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;read&quot;&gt;&lt;div&gt;Cambi bilaterali&lt;b id=&quot;nT&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Da difendere&lt;b id=&quot;nI&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Automatici&lt;b id=&quot;nA&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seg&quot; id=&quot;nB&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;star&quot; aria-pressed=&quot;true&quot;&gt;A stella: tutti sul DM&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;chain&quot; aria-pressed=&quot;false&quot;&gt;A catena, come nella slide&lt;/button&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Linee piene: cambi difesi dalle banche centrali. Linee tratteggiate: cambi che seguono automaticamente. Il nodo rosso è il paese n-esimo. In entrambe le forme le linee piene sono n − 1: la forma cambia, il conto no.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;egemonia&quot;&gt;
&lt;h3&gt;Soluzione simmetrica o hegemonic?&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;L&#x27;aritmetica dice che un grado di libertà resta, ma non dice a chi. Le risposte possibili sono due. Nella &lt;dfn&gt;symmetrical o cooperative solution&lt;/dfn&gt; le banche centrali decidono insieme la politica monetaria comune. Nella &lt;dfn&gt;asymmetrical o hegemonic solution&lt;/dfn&gt; un paese guida e gli altri si adeguano. Nello EMS la soluzione fu hegemonic, con la Germania come paese n-esimo &lt;span class=&quot;s&quot;&gt;slide 13&lt;/span&gt;.&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 460 170&quot; role=&quot;img&quot; aria-label=&quot;A sinistra le banche centrali decidono insieme; a destra tutte seguono la Bundesbank&quot; style=&quot;max-width:640px;margin:8px 0&quot;&gt;
&lt;text x=&quot;110&quot; y=&quot;18&quot; class=&quot;tb&quot; text-anchor=&quot;middle&quot;&gt;Symmetrical / cooperative&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;18&quot; class=&quot;tb&quot; text-anchor=&quot;middle&quot;&gt;Asymmetrical / hegemonic&lt;/text&gt;
&lt;g class=&quot;dl&quot;&gt;&lt;circle cx=&quot;110&quot; cy=&quot;96&quot; r=&quot;50&quot;/&gt;&lt;/g&gt;
&lt;circle cx=&quot;110&quot; cy=&quot;46&quot; r=&quot;15&quot; class=&quot;fk&quot;/&gt;&lt;circle cx=&quot;60&quot; cy=&quot;96&quot; r=&quot;15&quot; class=&quot;fk&quot;/&gt;&lt;circle cx=&quot;160&quot; cy=&quot;96&quot; r=&quot;15&quot; class=&quot;fk&quot;/&gt;&lt;circle cx=&quot;110&quot; cy=&quot;146&quot; r=&quot;15&quot; class=&quot;fk&quot;/&gt;
&lt;text x=&quot;110&quot; y=&quot;100&quot; class=&quot;tm&quot; text-anchor=&quot;middle&quot;&gt;obiettivo&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;114&quot; class=&quot;tm&quot; text-anchor=&quot;middle&quot;&gt;comune&lt;/text&gt;
&lt;path d=&quot;M302 53L334 82&quot; class=&quot;li&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path d=&quot;M398 53L366 82&quot; class=&quot;li&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path d=&quot;M302 139L334 110&quot; class=&quot;li&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path d=&quot;M398 139L366 110&quot; class=&quot;li&quot; marker-end=&quot;url(#ah2)&quot;/&gt;
&lt;defs&gt;&lt;marker id=&quot;ah2&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L8 4L0 8z&quot; style=&quot;fill:var(--ink)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;circle cx=&quot;350&quot; cy=&quot;96&quot; r=&quot;20&quot; class=&quot;fh&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;101&quot; text-anchor=&quot;middle&quot; class=&quot;t&quot; style=&quot;fill:var(--paper);font-weight:600&quot;&gt;DM&lt;/text&gt;
&lt;circle cx=&quot;292&quot; cy=&quot;44&quot; r=&quot;13&quot; class=&quot;fk&quot;/&gt;&lt;circle cx=&quot;408&quot; cy=&quot;44&quot; r=&quot;13&quot; class=&quot;fk&quot;/&gt;&lt;circle cx=&quot;292&quot; cy=&quot;148&quot; r=&quot;13&quot; class=&quot;fk&quot;/&gt;&lt;circle cx=&quot;408&quot; cy=&quot;148&quot; r=&quot;13&quot; class=&quot;fk&quot;/&gt;
&lt;/svg&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Perché la Germania?&quot;&gt;&lt;p&gt;Due interpretazioni &lt;span class=&quot;s&quot;&gt;slide 14&lt;/span&gt;:&lt;/p&gt;&lt;ol&gt;&lt;li&gt;&lt;b&gt;Forza monetaria.&lt;/b&gt; Il paese guida è il più forte: quello che può mantenere la propria politica monetaria senza cambiare il cambio.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Credibilità.&lt;/b&gt; Il paese guida è il più credibile. Nel lungo periodo è &lt;dfn&gt;Pareto efficient&lt;/dfn&gt; adattarsi a una situazione di bassa inflazione anziché di alta inflazione. Pareto efficient vuol dire che nessuno può stare meglio senza che un altro stia peggio.&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;La seconda spiega anche perché Francia e Italia accettano il vincolo: per loro entrare nello EMS è parte della lotta all&#x27;inflazione. Con gli anni è chiaro che lo EMS segna l&#x27;&lt;b&gt;acceptance of Germany macroeconomic priorities&lt;/b&gt;. Tutti condividono però l&#x27;obiettivo politico dell&#x27;unificazione europea e di un&#x27;identità europea di fronte agli USA &lt;span class=&quot;s&quot;&gt;slide 5&lt;/span&gt;. Sul tema della disciplina importata vedi &lt;a class=&quot;x&quot; href=&quot;https://ideas.repec.org/a/eee/eecrev/v32y1988i5p1055-1075.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: Giavazzi e Pagano 1988 ↗&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Advantages&quot;&gt;&lt;p&gt;Il paese guida fa da &lt;dfn&gt;anchor&lt;/dfn&gt;, un&#x27;ancora: aiuta a tenere a freno i paesi con tendenze inflazionistiche &lt;span class=&quot;s&quot;&gt;slide 15&lt;/span&gt;. Una banca centrale con poca reputazione può di fatto «prendere in prestito» la disciplina della Bundesbank. &lt;span class=&quot;i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Disadvantages&quot;&gt;&lt;p&gt;Se i paesi periferici sono in recessione, devono adottare politiche &lt;dfn&gt;pro-cyclical&lt;/dfn&gt;, cioè che amplificano il ciclo invece di contrastarlo, e quindi destabilizzanti &lt;span class=&quot;s&quot;&gt;slide 15&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;Il motivo è che il paese guida &lt;dfn&gt;sterilizes&lt;/dfn&gt; la liquidità in entrata: &lt;b&gt;sterilizzare&lt;/b&gt; vuol dire compensare con operazioni di segno opposto l&#x27;aumento di moneta causato dagli interventi sul cambio. Così il peso dell&#x27;aggiustamento, in particolare il rialzo dei tassi per difendere il cambio da pressioni al ribasso, ricade tutto sulla periferia.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;crisi&quot;&gt;
&lt;h3&gt;La crisi del 1992-93&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;La riunificazione tedesca è un &lt;dfn&gt;asymmetric shock&lt;/dfn&gt;, uno shock che colpisce i paesi in modo diverso: la Germania ha bisogno di tassi alti, il resto d&#x27;Europa di tassi bassi. Con i cambi fissi non si possono avere entrambi. Il modello &lt;dfn&gt;IS-LM&lt;/dfn&gt; &lt;span class=&quot;i&quot;&gt;integrazione&lt;/span&gt; mette insieme due equilibri: la curva IS unisce le coppie tasso-reddito che equilibrano il mercato dei beni, la curva LM quelle che equilibrano il mercato della moneta.&lt;/p&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;h4&gt;Laboratorio 1: IS-LM a due paesi&lt;/h4&gt;
&lt;div class=&quot;two&quot;&gt;&lt;svg id=&quot;isG&quot; viewBox=&quot;0 0 310 276&quot; role=&quot;img&quot; aria-label=&quot;IS-LM della Germania&quot;&gt;&lt;/svg&gt;&lt;svg id=&quot;isR&quot; viewBox=&quot;0 0 310 276&quot; role=&quot;img&quot; aria-label=&quot;IS-LM del resto dello EMS&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;div class=&quot;cols&quot; style=&quot;margin:4px 0&quot;&gt;
&lt;label class=&quot;ctl&quot;&gt;Spesa pubblica tedesca: IS a destra &lt;output id=&quot;g1o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;g1&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;25&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;Recessione nel resto d&#x27;Europa: IS a sinistra &lt;output id=&quot;g2o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;g2&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;25&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;Ipotesi 2: rivalutazione del DM &lt;output id=&quot;g3o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;g3&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;0&quot; step=&quot;5&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;div&gt;r Germania&lt;b id=&quot;rG&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;r resto EMS&lt;b id=&quot;rR&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Interest rate differential&lt;b id=&quot;rD&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Schema con curve lineari e unità arbitrarie, come i grafici delle slide 17 e 20. Il divario che vedi non può durare con cambi fissi e capitali liberi: è la tensione da risolvere. Il terzo cursore mostra la &lt;b&gt;Ipotesi 2&lt;/b&gt; &lt;span class=&quot;s&quot;&gt;slide 20&lt;/span&gt;: il DM si rivaluta, la Germania perde competitività e la sua IS torna indietro, gli altri la guadagnano e la loro IS risale. Il nominal exchange rate fa il lavoro che altrimenti farebbero i prezzi.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;h4&gt;Laboratorio 2: Ipotesi 1, nessun realignment&lt;/h4&gt;
&lt;div class=&quot;seg&quot; id=&quot;mB&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;sym&quot; aria-pressed=&quot;true&quot;&gt;Symmetric solution&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;asym&quot; aria-pressed=&quot;false&quot;&gt;Asymmetric solution (sterilization)&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;&lt;svg id=&quot;mG&quot; viewBox=&quot;0 0 310 276&quot; role=&quot;img&quot; aria-label=&quot;Mercato della moneta in Germania&quot;&gt;&lt;/svg&gt;&lt;svg id=&quot;mR&quot; viewBox=&quot;0 0 310 276&quot; role=&quot;img&quot; aria-label=&quot;Mercato della moneta nel resto dello EMS&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;label class=&quot;ctl&quot;&gt;Ampiezza dello shock sulla domanda di moneta &lt;output id=&quot;sho&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;sh&quot; min=&quot;0&quot; max=&quot;16&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;read&quot;&gt;&lt;div&gt;ΔM Germania&lt;b id=&quot;dG&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;ΔM resto EMS&lt;b id=&quot;dR&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Tasso comune&lt;b id=&quot;dr&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p id=&quot;mTxt&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;cap&quot;&gt;Nero: situazione iniziale. Rosso: domanda di moneta Md dopo lo shock, che si muove come la IS. Blu: nuova offerta Ms &lt;span class=&quot;s&quot;&gt;slide 18-19&lt;/span&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Symmetric&quot;&gt;&lt;p&gt;Il tasso tedesco sale, entrano capitali e migliora la &lt;dfn&gt;BoP&lt;/dfn&gt; (balance of payments, la bilancia dei pagamenti). Con cambio fisso il surplus si traduce in più moneta in Germania, il tasso scende e probabilmente sale l&#x27;inflazione. L&#x27;aumento di moneta tedesca ha il suo specchio in un calo negli altri paesi &lt;span class=&quot;s&quot;&gt;slide 18&lt;/span&gt;. Col tempo la competitività si ripristina attraverso i prezzi: salgono in Germania e scendono altrove &lt;span class=&quot;s&quot;&gt;slide 20&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Asymmetric&quot;&gt;&lt;p&gt;L&#x27;inizio è lo stesso, ma le autorità tedesche &lt;b&gt;sterilizzano&lt;/b&gt; e la moneta non aumenta. Per mantenere il cambio, tutto l&#x27;aggiustamento ricade sugli altri, che devono ridurre la moneta più di prima. Una politica restrittiva durante una recessione è pro-ciclica &lt;span class=&quot;s&quot;&gt;slide 19&lt;/span&gt;. È il caso che corrisponde allo EMS.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Realignment&quot;&gt;&lt;p&gt;Il DM si rivaluta contro tutte le altre valute. La competitività si ripristina col cambio nominale e l&#x27;equilibrio torna tramite gli effetti della svalutazione e della rivalutazione sulla domanda aggregata &lt;span class=&quot;s&quot;&gt;slide 20&lt;/span&gt;. Era la via meno dolorosa, ma non fu scelta in tempo.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;Come si è arrivati all&#x27;attacco&lt;/h4&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1&lt;/div&gt;&lt;h4&gt;Riunificazione&lt;/h4&gt;&lt;p&gt;Aumentano spesa pubblica e deficit, con pressioni inflazionistiche. La Bundesbank, non accomodante, alza i tassi &lt;span class=&quot;s&quot;&gt;slide 16-17&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;2&lt;/div&gt;&lt;h4&gt;Recessione altrove&lt;/h4&gt;&lt;p&gt;Il resto d&#x27;Europa avrebbe bisogno di tassi più bassi. Non può abbassarli senza un realignment e una svalutazione &lt;span class=&quot;s&quot;&gt;slide 16&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;3&lt;/div&gt;&lt;h4&gt;Il realignment non arriva&lt;/h4&gt;&lt;p&gt;Per ragioni politiche e di credibilità, e perché in alcuni casi i &lt;dfn&gt;fundamentals&lt;/dfn&gt; (le grandezze economiche di base) non lo richiedono, i governi non si mettono d&#x27;accordo. Francia e Regno Unito non concordano; Germania e Italia sono a favore &lt;span class=&quot;s&quot;&gt;slide 21&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;4&lt;/div&gt;&lt;h4&gt;Le aspettative cambiano&lt;/h4&gt;&lt;p&gt;Tassi troppo alti in piena recessione fanno pensare ai mercati che il realignment sia inevitabile &lt;span class=&quot;s&quot;&gt;slide 21&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;5&lt;/div&gt;&lt;h4&gt;Il NO danese&lt;/h4&gt;&lt;p&gt;Il NO danese al Trattato di Maastricht mette in dubbio il progetto stesso di unione monetaria &lt;span class=&quot;s&quot;&gt;slide 21&lt;/span&gt;. Referendum del 2 giugno 1992, con il 50,7% di contrari: &lt;a class=&quot;x&quot; href=&quot;https://www.cvce.eu/obj/referendum_on_the_maastricht_treaty_in_denmark_2_june_1992-en-0f779f6a-a3a2-4e95-96a9-1f97119f11df.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: CVCE ↗&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;6&lt;/div&gt;&lt;h4&gt;L&#x27;attacco&lt;/h4&gt;&lt;p&gt;I mercati anticipano la svalutazione e attaccano le valute deboli. Le autorità non riescono a fermarli, anche perché alle banche centrali non viene dato credito illimitato &lt;span class=&quot;s&quot;&gt;slide 21&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;7&lt;/div&gt;&lt;h4&gt;Settembre 1992&lt;/h4&gt;&lt;p&gt;Regno Unito e Italia decidono di non intervenire più per tenere le valute nella banda: lira e sterlina escono dall&#x27;ERM &lt;span class=&quot;s&quot;&gt;slide 11, 21&lt;/span&gt;. Lo EMS entra in crisi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;8&lt;/div&gt;&lt;h4&gt;Agosto 1993: bande ±15%&lt;/h4&gt;&lt;p&gt;Dopo altre svalutazioni i paesi allargano le bande a ±15%. Il conflitto di politica economica tra la Germania e il resto della EC è ormai evidente &lt;span class=&quot;s&quot;&gt;slide 22&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;cap&quot;&gt;La slide 21 scrive «the band granted by the AECs»: la sigla non è spiegata e non l&#x27;ho sciolta. Da chiarire a lezione.&lt;/div&gt;

&lt;h4&gt;Perché la speculazione funziona: la scommessa a senso unico&lt;/h4&gt;
&lt;p class=&quot;txt&quot;&gt;Un &lt;dfn&gt;speculative attack&lt;/dfn&gt; è una vendita massiccia di una valuta nella convinzione che verrà svalutata. Con il cambio fisso, o vincolato da una banda, lo speculatore rischia poco: se la parità regge perde il costo del finanziamento per pochi giorni, se cade incassa tutta la svalutazione. Con un cambio libero il prezzo si aggiusterebbe subito, e il vantaggio sparirebbe. &lt;span class=&quot;i&quot;&gt;integrazione&lt;/span&gt; Per difendersi, la banca centrale deve offrire un tasso che compensi la perdita attesa:&lt;/p&gt;
&lt;div class=&quot;fm&quot;&gt;differenziale annuo ≈ svalutazione attesa × 365 / giorni&lt;/div&gt;
&lt;div class=&quot;lab side&quot;&gt;
&lt;div&gt;&lt;label class=&quot;ctl&quot;&gt;Svalutazione attesa &lt;output id=&quot;d1o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;d1&quot; min=&quot;1&quot; max=&quot;30&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;Entro quanto &lt;output id=&quot;d2o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;d2&quot; min=&quot;1&quot; max=&quot;90&quot; value=&quot;30&quot;&gt;&lt;/label&gt;&lt;/div&gt;
&lt;div&gt;&lt;p class=&quot;cap&quot;&gt;Differenziale di tasso annuo da offrire&lt;/p&gt;&lt;p class=&quot;big&quot; id=&quot;dv&quot;&gt;&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;Regola approssimata per l&#x27;intuizione &lt;span class=&quot;i&quot;&gt;integrazione&lt;/span&gt;. Spiega perché tassi così alti, in recessione, non sono credibili a lungo: il mercato lo sa, e questo rafforza l&#x27;attacco. Per un&#x27;analisi sistematica della crisi vedi &lt;a class=&quot;x&quot; href=&quot;https://www.brookings.edu/articles/the-unstable-ems&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: Eichengreen e Wyplosz 1993 ↗&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Il conto delle svalutazioni&lt;/h4&gt;
&lt;svg id=&quot;devS&quot; viewBox=&quot;0 0 460 240&quot; role=&quot;img&quot; aria-label=&quot;Svalutazioni: peseta 15-20 per cento, escudo 6-10 per cento, sterlina irlandese circa 10 per cento, franco francese, franco belga e corona danese difese&quot; style=&quot;max-width:640px&quot;&gt;&lt;/svg&gt;
&lt;p class=&quot;cap&quot;&gt;Valori della &lt;span class=&quot;s&quot;&gt;slide 22&lt;/span&gt;. La slide li attribuisce al periodo maggio-luglio 1993.&lt;/p&gt;
&lt;div class=&quot;acc&quot;&gt;&lt;details&gt;&lt;summary&gt;Slide e cronologia delle fonti: le date non coincidono del tutto&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Le svalutazioni riportate dalle fonti sono distribuite su un periodo più lungo. Questa cronologia incrocia &lt;a class=&quot;x&quot; href=&quot;https://www.centralbank.ie/docs/default-source/consumer-hub-library/the-irish-pound-from-origins-to-emu.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: Central Bank of Ireland ↗&lt;/a&gt;, &lt;a class=&quot;x&quot; href=&quot;https://researchbriefings.files.parliament.uk/documents/RP96-110/RP96-110.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: House of Commons RP 96/110 ↗&lt;/a&gt; e &lt;a class=&quot;x&quot; href=&quot;https://www.elibrary.imf.org/display/book/9781557754196/ch005.xml&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: IMF, The ERM Experience ↗&lt;/a&gt;. Le fonti differiscono di qualche giorno su alcune date.&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Quando&lt;/th&gt;&lt;th&gt;Che cosa&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Settembre 1992&lt;/td&gt;&lt;td&gt;Peseta −5%; lira e sterlina escono dall&#x27;ERM&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Novembre 1992&lt;/td&gt;&lt;td&gt;Peseta ed escudo −6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fine gennaio / inizio febbraio 1993&lt;/td&gt;&lt;td&gt;Sterlina irlandese −10%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Maggio 1993&lt;/td&gt;&lt;td&gt;Peseta −8%, escudo −6,5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2 agosto 1993&lt;/td&gt;&lt;td&gt;Bande a ±15%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p&gt;I totali della slide tornano meglio se letti come cumulati da settembre 1992, non come movimenti del solo maggio-luglio 1993. La slide parla inoltre di due svalutazioni della peseta, le fonti di tre.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;trio&quot;&gt;
&lt;h3&gt;L&#x27;impossible trio&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;La morale della crisi sta in una riga della slide 22. &lt;dfn&gt;Impossible trio&lt;/dfn&gt; (detto anche impossible trinity o trilemma): non si possono avere insieme &lt;b&gt;independent monetary policies, fixed exchange rates e capital mobility&lt;/b&gt;. Il motivo è questo: con capitali liberi e cambio credibilmente fisso, il tasso interno deve uguagliare quello del paese base, altrimenti i capitali si spostano tutti verso il tasso più alto. &lt;a class=&quot;x&quot; href=&quot;https://www.nber.org/papers/w10396.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: Obstfeld, Shambaugh e Taylor ↗&lt;/a&gt;&lt;/p&gt;
&lt;div class=&quot;lab side&quot;&gt;
&lt;svg id=&quot;trS&quot; viewBox=&quot;0 0 420 340&quot; role=&quot;img&quot; aria-label=&quot;Triangolo del trilemma: i vertici accesi sono gli obiettivi tenuti&quot; style=&quot;max-width:440px;margin:auto&quot;&gt;&lt;/svg&gt;
&lt;div&gt;&lt;h4&gt;Quattro momenti, quattro scelte&lt;/h4&gt;
&lt;div class=&quot;seg&quot; id=&quot;trB&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;a&quot; aria-pressed=&quot;true&quot;&gt;Anni &#x27;70-&#x27;80&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;b&quot; aria-pressed=&quot;false&quot;&gt;1990-92&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;c&quot; aria-pressed=&quot;false&quot;&gt;Ago 1993&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;d&quot; aria-pressed=&quot;false&quot;&gt;EMU&lt;/button&gt;&lt;/div&gt;
&lt;p id=&quot;trT&quot;&gt;&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;Lettura della storia alla luce del trilemma: &lt;span class=&quot;i&quot;&gt;integrazione&lt;/span&gt;, costruita su fatti delle slide 5, 11 e 22.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 3&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;Con 5 paesi, quanti cambi bilaterali ci sono e quanti vanno difesi?&lt;/summary&gt;&lt;div&gt;(25 − 5)/2 = 10 cambi bilaterali, di cui 4 da difendere. Gli altri 6 sono automatici.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché la sterilizzazione tedesca rende l&#x27;aggiustamento pro-ciclico per gli altri?&lt;/summary&gt;&lt;div&gt;Perché la moneta tedesca non aumenta e il tasso tedesco resta alto. Per difendere il cambio gli altri devono portarsi a quel tasso, tagliando la moneta durante una recessione: la politica aggrava il ciclo invece di attenuarlo.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Di quanto deve ridursi la moneta nel resto dello EMS nel caso asimmetrico, rispetto a quello simmetrico?&lt;/summary&gt;&lt;div&gt;Nel modello del laboratorio, il doppio: da −k a −2k, con k = shock/pendenza. La slide 19 lo dice in forma qualitativa: «by more than in the case seen before».&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In che modo un realignment avrebbe potuto evitare la crisi?&lt;/summary&gt;&lt;div&gt;Rivalutando il DM si sarebbe sostituito un aggiustamento dei tassi e delle quantità con uno del cambio nominale: la IS tedesca rientra, quella degli altri risale, e il divario di tassi si chiude.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Qual è il vertice del trilemma abbandonato nel 1993, e quale con l&#x27;EMU?&lt;/summary&gt;&lt;div&gt;Nel 1993 si allenta il cambio fisso, con bande ±15%. Con l&#x27;EMU si abbandona la politica monetaria nazionale, tenendo cambio fisso e capitali liberi.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;div class=&quot;part p4&quot; id=&quot;parte4&quot;&gt;
&lt;div class=&quot;ph&quot;&gt;&lt;div class=&quot;num&quot;&gt;Parte 4&lt;/div&gt;&lt;h2&gt;Maastricht: la strada verso l&#x27;EMU&lt;/h2&gt;&lt;p&gt;Il Trattato è il progetto della moneta unica. Stabilisce come arrivarci e chi può entrare.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;sec&quot; id=&quot;maastricht&quot;&gt;
&lt;h3&gt;Due principi&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;Il Trattato di Maastricht è il &lt;dfn&gt;blueprint&lt;/dfn&gt;, cioè il progetto, del cammino verso l&#x27;unificazione monetaria in Europa, e si regge su due principi &lt;span class=&quot;s&quot;&gt;slide 23&lt;/span&gt;:&lt;/p&gt;
&lt;div class=&quot;cols&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Gradualism&lt;/h4&gt;&lt;p&gt;La transizione verso l&#x27;unione monetaria avviene per gradi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Convergence&lt;/h4&gt;&lt;p&gt;L&#x27;ingresso nell&#x27;unione è condizionato al rispetto di criteri di convergenza.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Una data da correggere.&lt;/b&gt; La slide 23 scrive che il Trattato fu firmato nel 1991. La firma è del &lt;b&gt;7 febbraio 1992&lt;/b&gt;, l&#x27;entrata in vigore del 1° novembre 1993: &lt;a class=&quot;x&quot; href=&quot;https://www.cvce.eu/en/unit-content/-/unit/b9fe3d6d-e79c-495e-856d-9729144d2cbd/2ffeeb3b-7aab-4d95-9145-8e0437183479&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: CVCE ↗&lt;/a&gt;. Il 1991 è con ogni probabilità l&#x27;anno della conclusione del negoziato, ma questa è una mia deduzione.&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;tappe&quot;&gt;
&lt;h3&gt;Le tre tappe&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;Le slide nominano il gradualism senza elencare le tappe. Lo schema viene dal Rapporto Delors del 1989, ripreso nel percorso verso l&#x27;EMU: &lt;a class=&quot;x&quot; href=&quot;https://www.ecb.europa.eu/ecb/history/emu/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: ECB ↗&lt;/a&gt;.&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 460 210&quot; role=&quot;img&quot; aria-label=&quot;Tre gradini: 1 luglio 1990, 1 gennaio 1994, 1 gennaio 1999&quot; style=&quot;max-width:680px&quot;&gt;
&lt;path d=&quot;M10 200H150V140H300V80H450&quot; class=&quot;lc&quot;/&gt;
&lt;text x=&quot;16&quot; y=&quot;170&quot; class=&quot;tc&quot;&gt;Stage 1&lt;/text&gt;&lt;text x=&quot;16&quot; y=&quot;189&quot; class=&quot;t&quot;&gt;1.7.1990&lt;/text&gt;
&lt;text x=&quot;158&quot; y=&quot;110&quot; class=&quot;tc&quot;&gt;Stage 2&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;129&quot; class=&quot;t&quot;&gt;1.1.1994&lt;/text&gt;
&lt;text x=&quot;308&quot; y=&quot;50&quot; class=&quot;tc&quot;&gt;Stage 3&lt;/text&gt;&lt;text x=&quot;308&quot; y=&quot;69&quot; class=&quot;t&quot;&gt;1.1.1999&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;cols&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Stage 1&lt;/h4&gt;&lt;p&gt;Completamento del mercato unico, più coordinamento delle politiche economiche, tutte le valute nell&#x27;ERM.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Stage 2&lt;/h4&gt;&lt;p&gt;Nasce lo European Monetary Institute.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Stage 3&lt;/h4&gt;&lt;p&gt;Cambi fissati in modo irrevocabile per 11 paesi: comincia l&#x27;euro.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;criteria&quot;&gt;
&lt;h3&gt;I convergence criteria&lt;/h3&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Grandezza&lt;/th&gt;&lt;th&gt;Condizione &lt;span class=&quot;s&quot;&gt;slide 24-25&lt;/span&gt;&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Inflazione&lt;/td&gt;&lt;td&gt;≤ media dei tre tassi più bassi tra i candidati + 1,5 punti percentuali&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Tasso d&#x27;interesse a lungo termine&lt;/td&gt;&lt;td&gt;≤ media dei tre paesi a bassa inflazione + 2 punti&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Cambio&lt;/td&gt;&lt;td&gt;Nell&#x27;ERM, senza svalutazioni nei due anni precedenti l&#x27;ingresso&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;Deficit pubblico&lt;/td&gt;&lt;td&gt;≤ 3% del PIL. Altrimenti: in calo continuo e sostanziale e vicino al 3%, oppure scostamento eccezionale, temporaneo e vicino al riferimento (art. 104c(a))&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;Debito pubblico&lt;/td&gt;&lt;td&gt;≤ 60% del PIL. Altrimenti: deve diminuire a sufficienza e avvicinarsi al 60% a un ritmo soddisfacente (art. 104c(b))&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Oggi: i riferimenti sono all&#x27;art. 140 TFEU e al Protocollo n. 13, che prevede «at most, the three best performing» e parla di svalutazione «on its own initiative» &lt;a class=&quot;x&quot; href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/pro_13/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: EUR-Lex ↗&lt;/a&gt;. Il 3% e il 60% sono nel Protocollo n. 12, e il vecchio art. 104c corrisponde all&#x27;attuale art. 126 TFEU &lt;a class=&quot;x&quot; href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/pro_12/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: EUR-Lex ↗&lt;/a&gt;. La BCE conta quattro criteri perché unisce deficit e debito &lt;a class=&quot;x&quot; href=&quot;https://www.ecb.europa.eu/ecb/orga/escb/html/convergence-criteria.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: ECB ↗&lt;/a&gt;; le slide ne elencano cinque.&lt;/p&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;h4&gt;Laboratorio: questo paese entra?&lt;/h4&gt;
&lt;div class=&quot;seg&quot; id=&quot;cP&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;v&quot; aria-pressed=&quot;true&quot;&gt;Paese virtuoso&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;d&quot; aria-pressed=&quot;false&quot;&gt;Debito alto ma in calo&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;h&quot; aria-pressed=&quot;false&quot;&gt;Inflazione alta&lt;/button&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Casi inventati per esercizio, nessun paese reale. I cursori calcolano solo nella pagina, nulla viene inviato.&lt;/p&gt;
&lt;div class=&quot;cols&quot; id=&quot;cc&quot;&gt;
&lt;div&gt;
&lt;label class=&quot;ctl&quot;&gt;Media inflazione tre migliori &lt;output id=&quot;o_bi&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;c_bi&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.1&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span class=&quot;res&quot; id=&quot;b_inf&quot;&gt;&lt;/span&gt;Inflazione del paese &lt;output id=&quot;o_inf&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;c_inf&quot; min=&quot;0&quot; max=&quot;12&quot; step=&quot;0.1&quot;&gt;&lt;/label&gt;&lt;p class=&quot;cap&quot; id=&quot;t_inf&quot;&gt;&lt;/p&gt;
&lt;label class=&quot;ctl&quot;&gt;Tasso lungo nei tre migliori &lt;output id=&quot;o_br&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;c_br&quot; min=&quot;2&quot; max=&quot;12&quot; step=&quot;0.1&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span class=&quot;res&quot; id=&quot;b_rt&quot;&gt;&lt;/span&gt;Tasso lungo del paese &lt;output id=&quot;o_rt&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;c_rt&quot; min=&quot;2&quot; max=&quot;16&quot; step=&quot;0.1&quot;&gt;&lt;/label&gt;&lt;p class=&quot;cap&quot; id=&quot;t_rt&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span class=&quot;res&quot; id=&quot;b_def&quot;&gt;&lt;/span&gt;Deficit &lt;output id=&quot;o_def&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;c_def&quot; min=&quot;0&quot; max=&quot;12&quot; step=&quot;0.1&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span class=&quot;res&quot; id=&quot;b_debt&quot;&gt;&lt;/span&gt;Debito &lt;output id=&quot;o_debt&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;c_debt&quot; min=&quot;20&quot; max=&quot;140&quot; step=&quot;1&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;seg&quot; style=&quot;flex-direction:column;align-items:flex-start&quot;&gt;
&lt;button type=&quot;button&quot; data-k=&quot;erm&quot; aria-pressed=&quot;false&quot;&gt;Nell&#x27;ERM, senza svalutazioni per 2 anni&lt;/button&gt;&lt;span class=&quot;res&quot; id=&quot;b_erm&quot; style=&quot;float:none;margin:0&quot;&gt;&lt;/span&gt;
&lt;button type=&quot;button&quot; data-k=&quot;dd&quot; aria-pressed=&quot;false&quot;&gt;Deficit in calo continuo e vicino al 3%&lt;/button&gt;
&lt;button type=&quot;button&quot; data-k=&quot;gd&quot; aria-pressed=&quot;false&quot;&gt;Debito in calo a ritmo soddisfacente&lt;/button&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;big&quot; style=&quot;font-size:24px&quot; id=&quot;cV&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;cap&quot;&gt;Prova il secondo caso: il debito supera di molto il 60%, ma il testo lascia spazio. Le formule «a sufficienza» e «ritmo soddisfacente» non sono numeri: danno margine a un giudizio politico. &lt;span class=&quot;i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;oca&quot;&gt;
&lt;h3&gt;Perché proprio questi requisiti?&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;La domanda della slide 26 nasce da un confronto. La &lt;dfn&gt;OCA theory&lt;/dfn&gt; (optimum currency area, l&#x27;area valutaria ottimale: quando conviene a più paesi avere una sola moneta) guarda a condizioni &lt;i&gt;micro&lt;/i&gt;. Il Trattato guarda a una convergenza &lt;i&gt;macro&lt;/i&gt;, e solo su politica monetaria e finanza pubblica &lt;span class=&quot;s&quot;&gt;slide 26&lt;/span&gt;.&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 460 212&quot; role=&quot;img&quot; aria-label=&quot;Confronto tra condizioni della OCA theory e criteri del Trattato&quot; style=&quot;max-width:680px;margin:8px 0&quot;&gt;
&lt;text x=&quot;110&quot; y=&quot;20&quot; class=&quot;tb&quot; text-anchor=&quot;middle&quot;&gt;OCA theory: micro&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;20&quot; class=&quot;tb&quot; text-anchor=&quot;middle&quot;&gt;Trattato: macro&lt;/text&gt;
&lt;g&gt;&lt;rect x=&quot;10&quot; y=&quot;34&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;6&quot; class=&quot;fb&quot;/&gt;&lt;rect x=&quot;10&quot; y=&quot;90&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;6&quot; class=&quot;fb&quot;/&gt;&lt;rect x=&quot;10&quot; y=&quot;146&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;6&quot; class=&quot;fb&quot;/&gt;
&lt;rect x=&quot;250&quot; y=&quot;34&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;6&quot; class=&quot;fb&quot;/&gt;&lt;rect x=&quot;250&quot; y=&quot;90&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;6&quot; class=&quot;fb&quot;/&gt;&lt;rect x=&quot;250&quot; y=&quot;146&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;6&quot; class=&quot;fb&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;110&quot; y=&quot;62&quot; class=&quot;t&quot; text-anchor=&quot;middle&quot;&gt;symmetry of shocks&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;118&quot; class=&quot;t&quot; text-anchor=&quot;middle&quot;&gt;wage, price flexibility&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;174&quot; class=&quot;t&quot; text-anchor=&quot;middle&quot;&gt;labour mobility&lt;/text&gt;
&lt;text x=&quot;350&quot; y=&quot;62&quot; class=&quot;t&quot; text-anchor=&quot;middle&quot;&gt;inflation&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;118&quot; class=&quot;t&quot; text-anchor=&quot;middle&quot;&gt;interest rates&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;174&quot; class=&quot;t&quot; text-anchor=&quot;middle&quot;&gt;budgetary policies&lt;/text&gt;
&lt;text x=&quot;230&quot; y=&quot;118&quot; class=&quot;th&quot; text-anchor=&quot;middle&quot;&gt;≠&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Symmetry of shocks&quot;&gt;&lt;p&gt;Se uno shock colpisce tutti allo stesso modo, basta una sola politica monetaria comune. Se è un asymmetric shock, una moneta unica non può rispondere per tutti. La riunificazione tedesca, vista nella parte 3, ne è il caso da manuale. &lt;span class=&quot;i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Wage and price flexibility&quot;&gt;&lt;p&gt;Senza il cambio da muovere, la competitività si recupera con salari e prezzi. Se sono rigidi, l&#x27;aggiustamento passa per la disoccupazione. Vale la stessa logica vista nel caso simmetrico: sono i prezzi a fare il lavoro del cambio. &lt;span class=&quot;i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Labour mobility&quot;&gt;&lt;p&gt;I lavoratori possono spostarsi dalla regione in crisi a quella in crescita, e questo attenua lo shock. È il criterio centrale dell&#x27;articolo di &lt;a class=&quot;x&quot; href=&quot;https://www.jstor.org/stable/1812792&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: Mundell 1961 ↗&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Perché il Trattato è diverso&quot;&gt;&lt;p&gt;Le slide pongono il contrasto e lasciano aperta la risposta. Una lettura possibile &lt;span class=&quot;i&quot;&gt;integrazione&lt;/span&gt;:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Credibilità.&lt;/b&gt; I paesi a bassa inflazione temono che la nuova moneta sia meno stabile. I criteri selezionano chi ha già dimostrato disciplina.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Disciplina fiscale.&lt;/b&gt; In una moneta unica, un paese con debito eccessivo può scaricare costi e rischi sugli altri.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Misurabilità.&lt;/b&gt; Inflazione e deficit si possono verificare in numeri; la mobilità del lavoro no.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;b&gt;Il limite:&lt;/b&gt; un paese può rispettare i criteri e non essere adatto a una moneta unica, perché i numeri non dicono nulla sul mercato del lavoro o sulla simmetria degli shock. Eichengreen e Wyplosz sostengono inoltre che il Trattato crei incentivi perversi: &lt;a class=&quot;x&quot; href=&quot;https://ideas.repec.org/p/cpr/ceprdp/817.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna: CEPR DP 817 ↗&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Autoverifica · Parte 4&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;Le tre inflazioni più basse sono 1,5%, 2% e 2,5%. Il candidato ha il 3,8%: passa?&lt;/summary&gt;&lt;div&gt;La media è 2%, la soglia è 3,5%. Con 3,8% non passa.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un paese ha debito al 110% del PIL: è automaticamente escluso?&lt;/summary&gt;&lt;div&gt;No. Passa se il debito diminuisce a sufficienza e si avvicina al 60% a un ritmo soddisfacente. La formula lascia spazio di valutazione.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quali criteri derivano dall&#x27;esperienza dello EMS?&lt;/summary&gt;&lt;div&gt;Il legame più diretto è quello col criterio 3: la partecipazione all&#x27;ERM senza svalutazioni. Anche il criterio sull&#x27;inflazione riprende la convergenza su bassa inflazione che lo EMS aveva costruito.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Qual è la differenza tra OCA theory e criteri del Trattato?&lt;/summary&gt;&lt;div&gt;La prima chiede se due economie funzionano bene con una moneta sola: shock simmetrici, flessibilità, mobilità. I secondi chiedono se le loro grandezze nominali e di finanza pubblica sono già allineate. Rispondono a domande diverse.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;div class=&quot;part p0&quot; id=&quot;finale&quot;&gt;
&lt;div class=&quot;ph&quot;&gt;&lt;div class=&quot;num&quot;&gt;Slide 27&lt;/div&gt;&lt;h2&gt;Check your learning&lt;/h2&gt;&lt;p&gt;Le cinque domande con cui si chiudono le slide. Le slide non danno le risposte: quelle qui sotto sono proposte costruite sul resto della lezione. Prova prima a rispondere senza guardare.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;quiz&quot; style=&quot;margin-top:0&quot;&gt;
&lt;details&gt;&lt;summary&gt;Which features of the EMS were crucial for its long survival?&lt;/summary&gt;&lt;div&gt;La flessibilità controllata dei realignment, il credito alle valute deboli e gli interventi obbligatori da entrambe le parti. Hanno contato anche i capital controls fino alla fine degli anni &#x27;80, la wide band per i paesi più fragili, l&#x27;ancora tedesca e l&#x27;obiettivo politico comune.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What was ECU?&lt;/summary&gt;&lt;div&gt;Un paniere di valute dello EMS, media ponderata con pesi basati su PIL e commercio. Era una moneta notional, cioè un&#x27;unità di conto, e faceva da riferimento per le parità centrali dell&#x27;ERM.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why were European countries interested in a European exchange rate agreement?&lt;/summary&gt;&lt;div&gt;Tre motivi. Dopo il 1971 mancava il riferimento del dollaro. Per Francia e Italia il vincolo era un&#x27;arma contro l&#x27;inflazione. E c&#x27;era l&#x27;obiettivo politico dell&#x27;unificazione europea e di un&#x27;identità europea di fronte agli USA.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why can speculative attacks on currencies happen only when exchange rates are fixed or somewhat constrained?&lt;/summary&gt;&lt;div&gt;Perché solo un prezzo difeso può essere «sbagliato» in modo visibile e correggersi a scatti. Con un cambio vincolato la scommessa è a senso unico: si perde poco se la parità regge e si guadagna tutta la svalutazione se cade. Con un cambio libero il prezzo si aggiusta subito, e non c&#x27;è una banca centrale che ha promesso di comprare a un prezzo fisso.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Would you say that asymmetric shocks were disrupting the economic stability of European countries even before the euro? Why?&lt;/summary&gt;&lt;div&gt;Sì. La riunificazione tedesca è uno shock asimmetrico: spinge in alto la domanda in Germania mentre il resto d&#x27;Europa è in recessione. Con cambi fissi e capitali liberi una sola politica monetaria, quella tedesca, valeva per tutti, e ha prodotto la crisi del 1992-93. Lo stesso problema si ripropone nell&#x27;unione monetaria.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;part p0&quot; id=&quot;fonti&quot;&gt;
&lt;div class=&quot;ph&quot;&gt;&lt;div class=&quot;num&quot;&gt;Fonti esterne&lt;/div&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;p&gt;Le slide non citano autori o articoli: citano eventi, accordi, norme e la OCA theory. Per ciascuno ecco una fonte affidabile. Tutto in questa sezione è &lt;span class=&quot;x&quot;&gt;fonte esterna&lt;/span&gt; e non viene dalle slide. Le descrizioni si basano su quanto emerso dalla ricerca, spesso abstract o estratti: non ho letto ogni testo per intero.&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Dal dollaro allo EMS&lt;/h3&gt;
&lt;div class=&quot;src&quot;&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.federalreservehistory.org/essays/bretton_woods_created&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Creation of the Bretton Woods System&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;Federal Reserve History&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; la conferenza del luglio 1944, il FMI, la parità di 35 dollari per oncia.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Conta perché&lt;/b&gt; spiega il riferimento che viene meno nel 1971.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://history.state.gov/milestones/1969-1976/nixon-shock&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Nixon and the End of the Bretton Woods System, 1971-1973&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;Office of the Historian, U.S. Department of State&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; la decisione dell&#x27;agosto 1971 e l&#x27;accordo del G10.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Conta perché&lt;/b&gt; è la ricostruzione ufficiale dell&#x27;evento di partenza della lezione.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.federalreservehistory.org/essays/smithsonian-agreement&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Smithsonian Agreement&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;Federal Reserve History&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; l&#x27;incontro di Washington del dicembre 1971 e il suo fallimento.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Conta perché&lt;/b&gt; fa capire quanto fosse fragile il Tunnel.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.cvce.eu/en/education/unit-content/-/unit/02bb76df-d066-4c08-a58a-d4686a3e68ff/38cf7d33-69b8-4550-a648-67f433ac14a1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The European currency snake&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;CVCE, Università del Lussemburgo&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; storia e documenti dello Snake.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Conta perché&lt;/b&gt; dà le date che nella slide 5 sono compresse.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.elibrary.imf.org/view/journals/024/1976/003/article-A003-en.xml&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;A Reform of the European Currency Snake&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;IMF Staff Papers, 1976&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; un&#x27;analisi dell&#x27;epoca, con le uscite dei paesi.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Conta perché&lt;/b&gt; mostra come si discutevano i problemi dello Snake mentre accadevano.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.bankofengland.co.uk/-/media/boe/files/quarterly-bulletin/1979/intervention-arrangements-in-the-european-monetary-system.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Intervention arrangements in the European Monetary System&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;Bank of England, Quarterly Bulletin, 1979&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; regole di intervento, ECU e divergence indicator, spiegati all&#x27;avvio.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Conta perché&lt;/b&gt; è il testo più vicino ai meccanismi delle slide 6-9.&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;

&lt;h3&gt;Egemonia e crisi&lt;/h3&gt;
&lt;div class=&quot;src&quot;&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://ideas.repec.org/a/eee/eecrev/v32y1988i5p1055-1075.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The advantage of tying one&#x27;s hands&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;F. Giavazzi, M. Pagano · European Economic Review, 32(5), 1988&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; perché un paese ad alta inflazione può voler subire la disciplina dello EMS.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Conta perché&lt;/b&gt; dà il fondamento teorico dell&#x27;interpretazione «credibilità» della slide 14.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://documentos.fedea.net/documento/eee-52/texto&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Was there monetary autonomy in Europe on the eve of EMU?&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;FEDEA, documento EEE 52&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; una verifica empirica della German Dominance hypothesis.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Conta perché&lt;/b&gt; ricorda che l&#x27;egemonia tedesca è anche un&#x27;ipotesi testata e discussa.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.brookings.edu/articles/the-unstable-ems&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Unstable EMS&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;B. Eichengreen, C. Wyplosz · Brookings Papers on Economic Activity, 1993(1), 51-144&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; l&#x27;analisi sistematica della crisi del 1992.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Conta perché&lt;/b&gt; sostiene che molti paesi avevano già fatto gli aggiustamenti necessari, e quindi discute il ruolo dei fundamentals citato nelle slide 16 e 21.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.nber.org/system/files/working_papers/w29488/w29488.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Imported or Home Grown? The 1992-3 EMS Crisis&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;NBER Working Paper 29488&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; un&#x27;analisi più recente delle origini della crisi.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Conta perché&lt;/b&gt; pone la stessa domanda delle slide: la crisi nasce dalla Germania o dai singoli paesi?&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.cvce.eu/obj/referendum_on_the_maastricht_treaty_in_denmark_2_june_1992-en-0f779f6a-a3a2-4e95-96a9-1f97119f11df.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Referendum on the Maastricht Treaty in Denmark&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;CVCE · 2 giugno 1992&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; il risultato del voto, con il 50,7% di contrari e un&#x27;affluenza dell&#x27;83%.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Conta perché&lt;/b&gt; è il «Danish NO» della slide 21.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.nber.org/papers/w10396.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Trilemma in History&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;M. Obstfeld, J. Shambaugh, A. Taylor · NBER Working Paper 10396&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; il trilemma, cioè l&#x27;impossible trio, spiegato e misurato.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Conta perché&lt;/b&gt; dà base empirica a quanto la slide 22 riassume in una riga.&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;

&lt;h3&gt;Maastricht e OCA&lt;/h3&gt;
&lt;div class=&quot;src&quot;&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://ec-europa-eu.libguides.com/maastricht-treaty/signature/text&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Treaty on European Union: testo&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;European Commission Library · GU C 191, 29.7.1992&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; il testo firmato a Maastricht il 7 febbraio 1992.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Conta perché&lt;/b&gt; è la norma originale con la numerazione usata dalle slide, come l&#x27;art. 104c.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.cvce.eu/collections/unit-content/-/unit/en/02bb76df-d066-4c08-a58a-d4686a3e68ff/021072be-929c-4ca0-ad76-32760b5dc2ff&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Delors Report&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;CVCE · aprile 1989&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contiene:&lt;/b&gt; il rapporto che propone le tre tappe.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Conta perché&lt;/b&gt; è l&#x27;origine del gradualism della slide 23.&lt;/p&gt;&lt;/article&gt;
