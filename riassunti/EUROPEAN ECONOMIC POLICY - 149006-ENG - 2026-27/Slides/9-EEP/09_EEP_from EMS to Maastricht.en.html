&lt;main class=&quot;wrap&quot;&gt;
&lt;header class=&quot;hero&quot; id=&quot;mappa&quot;&gt;
&lt;div class=&quot;kick&quot;&gt;European Economic Policy 2026-27 · Lecture 9 · 27 slides&lt;/div&gt;
&lt;h1&gt;Transition to EMU&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;From the European Monetary System to the Maastricht Treaty: how Europe moved from agreed exchange rates to a single currency.&lt;/p&gt;
&lt;p class=&quot;lead&quot;&gt;In 1971 Europe loses the dollar as its reference point and tries to stabilize the exchange rates among its own currencies by itself. Stability arrives, but at a price: following German monetary policy. When German reunification pushes Germany and the rest of Europe in opposite directions, the system breaks down. The response is &lt;dfn&gt;EMU&lt;/dfn&gt; (Economic and Monetary Union), with entry conditions written into the Treaty.&lt;/p&gt;
&lt;svg id=&quot;map&quot; role=&quot;group&quot; aria-label=&quot;Concept map of the lecture: each box links to the corresponding section&quot;&gt;&lt;/svg&gt;
&lt;p class=&quot;cap&quot;&gt;Click a box to go to the section. The serpentine path follows the order of the slides; the dashed arrows are the logical links between distant topics.&lt;/p&gt;
&lt;div class=&quot;key&quot;&gt;
&lt;span&gt;&lt;span class=&quot;s&quot;&gt;slide 12&lt;/span&gt; comes from the slides&lt;/span&gt;
&lt;span&gt;&lt;span class=&quot;i&quot;&gt;supplement&lt;/span&gt; added explanation, not present in the slides&lt;/span&gt;
&lt;span&gt;&lt;span class=&quot;x&quot;&gt;external source ↗&lt;/span&gt; information taken from the web, with link&lt;/span&gt;
&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;&lt;b&gt;Other course materials:&lt;/b&gt; this lecture was written only from the PDF indicated. The folders &lt;code&gt;corso/Slides/7-EEP&lt;/code&gt;, &lt;code&gt;8-EEP&lt;/code&gt; and &lt;code&gt;10-EEP&lt;/code&gt; exist, but their files could not be listed, so no content comes from them. Where the slides take other lectures for granted (OCA theory, IS-LM), the explanation is marked as a supplement.&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;part p1&quot; id=&quot;parte1&quot;&gt;
&lt;div class=&quot;ph&quot;&gt;&lt;div class=&quot;num&quot;&gt;Part 1&lt;/div&gt;&lt;h2&gt;The dollar is lost, the Snake is born&lt;/h2&gt;&lt;p&gt;Why Europeans sought an exchange rate agreement precisely in the 1970s, and why the first attempt did not hold.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;sec&quot; id=&quot;origini&quot;&gt;
&lt;h3&gt;From 1944 to 1979, in six steps&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;An &lt;dfn&gt;exchange rate agreement&lt;/dfn&gt; is a pact by which several countries commit to keeping the exchange rate close to an agreed value, the &lt;dfn&gt;parity&lt;/dfn&gt;. The EMS lasted twenty years and, together with Bretton Woods, is one of the longest-lived exchange rate agreements &lt;span class=&quot;s&quot;&gt;slide 2&lt;/span&gt;. To understand it, we start from the void it was meant to fill.&lt;/p&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1944&lt;/div&gt;&lt;h4&gt;Bretton Woods&lt;/h4&gt;&lt;p&gt;This is the post-war system: currencies are pegged to the dollar and the dollar to gold, at 35 dollars per ounce &lt;span class=&quot;s&quot;&gt;slide 2&lt;/span&gt;. The dollar serves as the reference for everyone. &lt;a class=&quot;x&quot; href=&quot;https://www.federalreservehistory.org/essays/bretton_woods_created&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: Federal Reserve History ↗&lt;/a&gt; adds that countries settled their international balances in dollars, convertible into gold.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;August 1971&lt;/div&gt;&lt;h4&gt;Nixon: the dollar becomes inconvertible&lt;/h4&gt;&lt;p&gt;The United States stops exchanging dollars for gold at the fixed parity. This is &lt;dfn&gt;inconvertibility&lt;/dfn&gt;: the dollar remains a currency, but it is no longer a promise of gold. The common reference is lost &lt;span class=&quot;s&quot;&gt;slide 2&lt;/span&gt;. &lt;a class=&quot;x&quot; href=&quot;https://history.state.gov/milestones/1969-1976/nixon-shock&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: Office of the Historian ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;December 1971&lt;/div&gt;&lt;h4&gt;Smithsonian Agreement&lt;/h4&gt;&lt;p&gt;The G10, the group of ten leading industrial countries, tries to save the system. The dollar is devalued by 8% and the other currencies may fluctuate by ±2.25% against the dollar. This is the &lt;dfn&gt;Tunnel&lt;/dfn&gt;, with a maximum variation of 4.5% &lt;span class=&quot;s&quot;&gt;slide 2&lt;/span&gt;. The attempt is short-lived: &lt;a class=&quot;x&quot; href=&quot;https://www.federalreservehistory.org/essays/smithsonian-agreement&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: Federal Reserve History ↗&lt;/a&gt; describes a rescue that failed within fifteen months.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1972&lt;/div&gt;&lt;h4&gt;The Snake&lt;/h4&gt;&lt;p&gt;The 6 countries of the EEC (European Economic Community) narrow the fluctuations among their currencies to ±1.125%. The European band, 2.25% wide, moves inside the Tunnel like a snake in a tunnel &lt;span class=&quot;s&quot;&gt;slide 3&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1972-74&lt;/div&gt;&lt;h4&gt;The exits&lt;/h4&gt;&lt;p&gt;The United Kingdom, Ireland and Italy leave, followed by France in 1974. Differing inflation rates make it difficult to stay in the band: only the German area remains, namely Germany, the Benelux countries and Denmark. In the same years various &lt;dfn&gt;capital controls&lt;/dfn&gt; are introduced, that is, limits on capital movements abroad &lt;span class=&quot;s&quot;&gt;slide 5&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1979&lt;/div&gt;&lt;h4&gt;The EMS is born&lt;/h4&gt;&lt;p&gt;The new system has two objectives: to extend the Snake&#x27;s area of coordination, but with &lt;b&gt;greater equity among currencies&lt;/b&gt;, and to provide credit mechanisms for weak currencies &lt;span class=&quot;s&quot;&gt;slide 5&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Slides and sources do not coincide.&lt;/b&gt; Slide 5 dates the exit of the United Kingdom, Ireland and Italy to 1972. The sources agree on the United Kingdom (June 1972), whereas for Italy they indicate early 1973: February according to &lt;a class=&quot;x&quot; href=&quot;https://www.europarl.europa.eu/RegData/etudes/BRIE/2015/551325/EPRS_BRI(2015)551325_EN.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: EPRS ↗&lt;/a&gt; and &lt;a class=&quot;x&quot; href=&quot;https://www.elibrary.imf.org/view/journals/024/1976/003/article-A003-en.xml&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: IMF Staff Papers 1976 ↗&lt;/a&gt;. For Ireland I could not find a confirmed date. For study purposes the logic of the slide holds; if you need the dates, verify them.&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;snake&quot;&gt;
&lt;h3&gt;Why the Snake was needed: the margins add up&lt;/h3&gt;
&lt;svg viewBox=&quot;0 0 460 210&quot; role=&quot;img&quot; aria-label=&quot;Tunnel 4.5 per cent wide containing the Snake, 2.25 per cent wide, which undulates&quot; style=&quot;max-width:640px;margin:10px 0&quot;&gt;
&lt;path d=&quot;M16 30H380M16 180H380&quot; class=&quot;lh&quot;/&gt;
&lt;path d=&quot;M16 48C70 70 110 88 160 80S270 28 330 34 372 44 380 48&quot; class=&quot;lk&quot;/&gt;
&lt;path d=&quot;M16 123C70 145 110 163 160 155S270 103 330 109 372 119 380 123&quot; class=&quot;lk&quot;/&gt;
&lt;path d=&quot;M390 48V123M385 48H395M385 123H395&quot; class=&quot;lk&quot; style=&quot;stroke-width:1.5&quot;/&gt;&lt;text x=&quot;398&quot; y=&quot;90&quot; class=&quot;tk&quot;&gt;2.25%&lt;/text&gt;
&lt;path d=&quot;M446 30V180M441 30H451M441 180H451&quot; class=&quot;lh&quot; style=&quot;stroke-width:1.5&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;160&quot; class=&quot;th&quot; text-anchor=&quot;end&quot;&gt;4.5%&lt;/text&gt;
&lt;text x=&quot;20&quot; y=&quot;22&quot; class=&quot;th&quot;&gt;Tunnel: limits against the dollar&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;120&quot; class=&quot;tk&quot;&gt;Snake&lt;/text&gt;
&lt;/svg&gt;
&lt;p class=&quot;txt&quot;&gt;If two currencies can each move by ±2.25% against the dollar, they can move much further against each other. It is enough for one to rise to its maximum and the other to fall to its minimum &lt;span class=&quot;s&quot;&gt;slide 4&lt;/span&gt;. The &lt;dfn&gt;cross rate&lt;/dfn&gt;, that is, the Lira/DM rate derived from the two dollar rates, is a/b.&lt;/p&gt;
&lt;div class=&quot;lab side&quot;&gt;
&lt;div&gt;
&lt;h4&gt;Lab: how much does Lira/DM fluctuate?&lt;/h4&gt;
&lt;label class=&quot;ctl&quot;&gt;Margin against the dollar &lt;output id=&quot;xrmo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;xrm&quot; min=&quot;0.5&quot; max=&quot;6&quot; step=&quot;0.25&quot; value=&quot;2.25&quot;&gt;&lt;/label&gt;
&lt;svg id=&quot;xrs&quot; viewBox=&quot;0 0 460 180&quot; role=&quot;img&quot; aria-label=&quot;Comparison between the cross rate range and the Snake band&quot;&gt;&lt;/svg&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table class=&quot;num&quot;&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Lira/$&lt;/th&gt;&lt;th&gt;DM/$&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Parity&lt;/td&gt;&lt;td&gt;1500&lt;/td&gt;&lt;td&gt;2.5&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Upper limit&lt;/td&gt;&lt;td id=&quot;xa1&quot;&gt;&lt;/td&gt;&lt;td id=&quot;xb1&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Lower limit&lt;/td&gt;&lt;td id=&quot;xa2&quot;&gt;&lt;/td&gt;&lt;td id=&quot;xb2&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;div&gt;a&lt;sub&gt;1&lt;/sub&gt;/b&lt;sub&gt;2&lt;/sub&gt;&lt;b id=&quot;xhi&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;a&lt;sub&gt;2&lt;/sub&gt;/b&lt;sub&gt;1&lt;/sub&gt;&lt;b id=&quot;xlo&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Max var&lt;b id=&quot;xv&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;With ±2.25% you recover the result of slide 4: 627.62 and 573.59, that is, 9.42% between the two extremes. If Lira and DM move together, a/b stays at 600.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;How to read “±4.5%”.&lt;/b&gt; The slide states that the margins between European currencies were ±4.5%, and the table gives 0.0942. These are the same thing: about +4.6% and −4.4% around 600, hence about 9.4% from extreme to extreme. As a formula &lt;span class=&quot;i&quot;&gt;supplement&lt;/span&gt;: max var = [(1+m)/(1−m)]² − 1, that is, about 4 times m.&lt;/div&gt;
&lt;p class=&quot;txt&quot;&gt;For countries that trade heavily with one another, a fluctuation of this size is too much. Hence the choice of a narrower band among European currencies. &lt;span class=&quot;i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 1&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;Why does the end of dollar convertibility push Europeans to reach an agreement among themselves?&lt;/summary&gt;&lt;div&gt;Because the common reference that also kept European exchange rates stable disappears. The regional agreement seeks to recreate that stability without the dollar.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;With margins of ±3% against the dollar, what is the maximum variation of the cross rate?&lt;/summary&gt;&lt;div&gt;(1.03/0.97)² − 1 ≈ 12.75%, that is, about 4 × 3%. You can check it with the slider. The ratio is squared because two extremes are being compared: a&lt;sub&gt;1&lt;/sub&gt;/b&lt;sub&gt;2&lt;/sub&gt; is above parity by a factor of (1+m)/(1−m), and a&lt;sub&gt;2&lt;/sub&gt;/b&lt;sub&gt;1&lt;/sub&gt; is below it by the same factor.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why does the Snake not hold?&lt;/summary&gt;&lt;div&gt;Because inflation rates diverge. A country with higher inflation loses competitiveness, its currency tends to fall, and the narrow band becomes impossible to defend for long. Only countries with inflation close to the German rate remain.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;div class=&quot;part p2&quot; id=&quot;parte2&quot;&gt;
&lt;div class=&quot;ph&quot;&gt;&lt;div class=&quot;num&quot;&gt;Part 2&lt;/div&gt;&lt;h2&gt;How the EMS worked&lt;/h2&gt;&lt;p&gt;The European Monetary System has a unit of account, a grid of parities, fluctuation bands, compulsory interventions, credit, and a rule for changing parities by common agreement.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;sec&quot; id=&quot;ecu&quot;&gt;
&lt;h3&gt;ECU and ERM: the unit of account and the parity grid&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;The &lt;dfn&gt;ECU&lt;/dfn&gt; (European Currency Unit) is a basket: a weighted average of the EMS currencies. It is a &lt;dfn&gt;notional&lt;/dfn&gt; currency, meaning that it exists as a unit of account but not as banknotes to spend &lt;span class=&quot;s&quot;&gt;slide 6&lt;/span&gt;. Its value expressed in currency i is:&lt;/p&gt;
&lt;div class=&quot;fm&quot;&gt;ECU&lt;sub&gt;i&lt;/sub&gt; = Σ&lt;sub&gt;j=1…n&lt;/sub&gt; a&lt;sub&gt;j&lt;/sub&gt; S&lt;sub&gt;ij&lt;/sub&gt;&lt;/div&gt;
&lt;div class=&quot;cols&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;a&lt;sub&gt;j&lt;/sub&gt;&lt;/h4&gt;&lt;p&gt;Weight of currency j in the basket, based on GDP and trade shares.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;S&lt;sub&gt;ij&lt;/sub&gt;&lt;/h4&gt;&lt;p&gt;Bilateral exchange rate between currency j and currency i. If S is the parity rate, ECU&lt;sub&gt;i&lt;/sub&gt; is the &lt;b&gt;central value&lt;/b&gt;. If S is the market rate, it is the &lt;b&gt;market value&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;The difference&lt;/h4&gt;&lt;p&gt;The gap between the two values is an important indicator of how far the currency deviates from the average &lt;span class=&quot;s&quot;&gt;slide 6&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;lab side&quot;&gt;
&lt;div&gt;&lt;h4&gt;Lab: the basket in lire&lt;/h4&gt;
&lt;p class=&quot;cap&quot;&gt;Figures invented for the example: 1 ECU = 0.6 DM (Deutsche Mark) + 1.3 FF (French franc) + 150 lire. Parities: 600 Lira/DM and 200 Lira/FF.&lt;/p&gt;
&lt;label class=&quot;ctl&quot;&gt;Market Lira/DM &lt;output id=&quot;ecu1o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ecu1&quot; min=&quot;540&quot; max=&quot;660&quot; step=&quot;5&quot; value=&quot;600&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;Market Lira/FF &lt;output id=&quot;ecu2o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ecu2&quot; min=&quot;180&quot; max=&quot;220&quot; step=&quot;2&quot; value=&quot;200&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div&gt;&lt;svg id=&quot;ecus&quot; viewBox=&quot;0 0 460 130&quot; role=&quot;img&quot; aria-label=&quot;Central value and market value of the ECU in lire, broken down by component&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;read&quot;&gt;&lt;div&gt;Central&lt;b id=&quot;ecuC&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Market&lt;b id=&quot;ecuM&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Deviation&lt;b id=&quot;ecuD&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Move both sliders to the maximum: the lira loses 10% against the DM and the FF, yet the deviation is only about 8%. The lira component of the basket does not change value in lire. &lt;span class=&quot;i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;b&gt;A note on the weights.&lt;/b&gt; The slide calls a&lt;sub&gt;j&lt;/sub&gt; a “weight”. Historical sources describe the basket as &lt;b&gt;fixed quantities&lt;/b&gt; of each currency, so the effective weight changed with exchange rates: &lt;a class=&quot;x&quot; href=&quot;https://www.bankofengland.co.uk/-/media/boe/files/quarterly-bulletin/1979/intervention-arrangements-in-the-european-monetary-system.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: Bank of England 1979 ↗&lt;/a&gt;. The deviation indicator also had a name and a threshold, the divergence indicator at 75% of maximum divergence: &lt;a class=&quot;x&quot; href=&quot;https://publications.bof.fi/bitstream/10024/48097/1/Muutkeskustelualoitteet11_93.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: Bank of Finland 1993 ↗&lt;/a&gt;.&lt;/div&gt;
&lt;p class=&quot;txt&quot;&gt;The &lt;dfn&gt;ERM&lt;/dfn&gt; (Exchange Rate Mechanism) sets the &lt;dfn&gt;central parity&lt;/dfn&gt; of each currency against the ECU. From these follows the grid of bilateral parities &lt;span class=&quot;s&quot;&gt;slide 7&lt;/span&gt;:&lt;/p&gt;
&lt;div class=&quot;fm&quot;&gt;£/ECU = a, DM/ECU = b → £/DM = a/b&lt;/div&gt;
&lt;p class=&quot;txt&quot;&gt;The political novelty is that the reference is no longer the currency of a single country: this is the “greater equity” called for by the objectives of the EMS. &lt;span class=&quot;i&quot;&gt;supplement&lt;/span&gt; Part 3 shows how far this equity then remained on paper.&lt;/p&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;bande&quot;&gt;
&lt;h3&gt;Bands and compulsory interventions&lt;/h3&gt;
&lt;div class=&quot;cols&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Narrow band&lt;/h4&gt;&lt;p class=&quot;big&quot;&gt;±2.25%&lt;/p&gt;&lt;p&gt;The standard band.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Wide band&lt;/h4&gt;&lt;p class=&quot;big&quot;&gt;±6%&lt;/p&gt;&lt;p&gt;Granted to Italy, Spain and the United Kingdom.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;From August 1993&lt;/h4&gt;&lt;p class=&quot;big&quot;&gt;±15%&lt;/p&gt;&lt;p&gt;For all currencies &lt;span class=&quot;s&quot;&gt;slide 7&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;txt&quot;&gt;When a currency approaches the limit of the band, &lt;b&gt;the central banks of both currencies are obliged to intervene&lt;/b&gt;, buying or selling to defend the parity &lt;span class=&quot;s&quot;&gt;slide 7&lt;/span&gt;. Interventions are &lt;dfn&gt;automatic and compulsory&lt;/dfn&gt;. The obligation applies in both directions: the central bank of the strong currency sells its own currency, while that of the weak currency buys its own. This is the feature that distinguishes the EMS from a simple unilateral peg. &lt;span class=&quot;i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;h4&gt;Lab: same pressure, different bands&lt;/h4&gt;
&lt;div class=&quot;seg&quot; id=&quot;bandB&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;2.25&quot; aria-pressed=&quot;true&quot;&gt;±2.25%&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;6&quot; aria-pressed=&quot;false&quot;&gt;±6%&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;15&quot; aria-pressed=&quot;false&quot;&gt;±15%&lt;/button&gt;&lt;/div&gt;
&lt;label class=&quot;ctl&quot;&gt;Downward pressure on the currency &lt;output id=&quot;bandPo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;bandP&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;35&quot;&gt;&lt;/label&gt;
&lt;svg id=&quot;bandS&quot; viewBox=&quot;0 0 460 256&quot; role=&quot;img&quot; aria-label=&quot;Path of a currency within a band; the red dots mark the compulsory interventions&quot; style=&quot;max-width:720px&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;read&quot;&gt;&lt;div&gt;Intervention episodes&lt;b id=&quot;bandE&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Periods at the limit, out of 100&lt;b id=&quot;bandH&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Path simulated for teaching purposes. The line never leaves the band because interventions hold it at the limit; the red dots show where each episode begins. With the ±15% band, interventions disappear.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;credito&quot;&gt;
&lt;h3&gt;Credit and realignment&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;Defending a weak currency requires strong currency to sell, and reserves are limited. The main mechanism is the &lt;dfn&gt;Very Short-Term Financing&lt;/dfn&gt;: automatic credit from one central bank to another &lt;span class=&quot;s&quot;&gt;slide 9&lt;/span&gt;. Alongside it are the short- and medium-term credit facilities.&lt;/p&gt;
&lt;div class=&quot;flow&quot;&gt;
&lt;div&gt;The lira reaches the lower limit of its band against the DM.&lt;/div&gt;
&lt;div&gt;The Banca d&#x27;Italia requests credit from the Bundesbank, the German central bank, and obtains DM.&lt;/div&gt;
&lt;div&gt;It sells those DM on the market and buys lire: the pressure eases.&lt;/div&gt;
&lt;div&gt;It repays quickly: normally within 45 days.&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;txt&quot;&gt;Central parities can be changed through a &lt;dfn&gt;realignment&lt;/dfn&gt;. This is the real break with the past: the exchange rate can change only by &lt;b&gt;mutual agreement&lt;/b&gt; among the participating States and the European Commission, an unprecedented &lt;dfn&gt;pooling of monetary sovereignty&lt;/dfn&gt; &lt;span class=&quot;s&quot;&gt;slide 9&lt;/span&gt;. No country can devalue on its own to gain competitiveness.&lt;/p&gt;
&lt;div class=&quot;lab side&quot;&gt;
&lt;div&gt;&lt;h4&gt;Lab: shifting the parity&lt;/h4&gt;
&lt;label class=&quot;ctl&quot;&gt;Devaluation of the lira against the DM &lt;output id=&quot;ralo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ral&quot; min=&quot;0&quot; max=&quot;12&quot; step=&quot;0.5&quot; value=&quot;3&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;read&quot;&gt;&lt;div&gt;New parity&lt;b id=&quot;ralP&quot; style=&quot;font-size:19px&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p id=&quot;ralN&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;cap&quot;&gt;The chart is built like the one on slide 10: the rate in lire per DM is at the top, so a rise is a devaluation of the lira. The observation on the overlap is a &lt;span class=&quot;i&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;svg id=&quot;ralS&quot; viewBox=&quot;0 0 460 236&quot; role=&quot;img&quot; aria-label=&quot;Fluctuation band before and after a realignment&quot;&gt;&lt;/svg&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;fasi&quot;&gt;
&lt;h3&gt;The four phases of the ERM&lt;/h3&gt;
&lt;div class=&quot;lab side&quot;&gt;
&lt;svg id=&quot;phS&quot; viewBox=&quot;0 0 460 262&quot; role=&quot;img&quot; aria-label=&quot;Width of the ERM bands from 1979 to 1998 with the selected phase highlighted&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;stepper&quot; data-stepper id=&quot;phStep&quot; style=&quot;margin:0&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1979-83&lt;/div&gt;&lt;h4&gt;Frequent realignments&lt;/h4&gt;&lt;p&gt;Policies and inflation rates are still divergent &lt;span class=&quot;s&quot;&gt;slide 11&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1983-87&lt;/div&gt;&lt;h4&gt;Fewer realignments&lt;/h4&gt;&lt;p&gt;Inflation rates begin to converge &lt;span class=&quot;s&quot;&gt;slide 11&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1987-92&lt;/div&gt;&lt;h4&gt;No realignments&lt;/h4&gt;&lt;p&gt;The lira enters the narrow band. Spain, the United Kingdom and Portugal join with a wide band. The last capital controls fall, Maastricht is signed, Germany reunifies. In 1992 speculation hits some &lt;dfn&gt;over-valued&lt;/dfn&gt; currencies: the lira and sterling leave in September &lt;span class=&quot;s&quot;&gt;slide 11&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1993-98&lt;/div&gt;&lt;h4&gt;Bands at ±15%&lt;/h4&gt;&lt;p&gt;The lira re-enters in 1996, after a sharp devaluation between 1992 and 1995 &lt;span class=&quot;s&quot;&gt;slide 11&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;b&gt;A date to check.&lt;/b&gt; Slide 11 places the entry of Spain, the United Kingdom and Portugal between 1989 and 1990. This is correct for Spain and the United Kingdom: June 1989 and October 1990. Portugal, however, appears to have joined on 6 April 1992: &lt;a class=&quot;x&quot; href=&quot;https://www.bde.es/f/webbde/COM/eurosist/uem/ficheros/en/membership_ec.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: Banco de España ↗&lt;/a&gt;. The pattern of ticks is only indicative: it does not count the actual realignments.&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 2&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between the central value and the market value of the ECU?&lt;/summary&gt;&lt;div&gt;The formula is the same, but the first uses central parities and the second market exchange rates. The gap between them measures how far the currency deviates from the average.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Who intervenes when a currency reaches the limit of the band?&lt;/summary&gt;&lt;div&gt;The central banks of both currencies, automatically. The central bank of the weak currency can obtain funding through the Very Short-Term Financing, normally repayable within 45 days.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is a realignment a “pooling of monetary sovereignty”?&lt;/summary&gt;&lt;div&gt;Because the parity can be changed only with the unanimous agreement of the other countries and the Commission. A national economic policy lever becomes a joint decision.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why do realignments decrease over time?&lt;/summary&gt;&lt;div&gt;Because inflation converges. With similar inflation rates, relative prices change less and there is less need to correct parities. However, the end of realignments after 1987 is also a rigidity: it sets the stage for the 1992 crisis.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;div class=&quot;part p3&quot; id=&quot;parte3&quot;&gt;
&lt;div class=&quot;ph&quot;&gt;&lt;div class=&quot;num&quot;&gt;Part 3&lt;/div&gt;&lt;h2&gt;Who is in charge? Germany and the 1992 crisis&lt;/h2&gt;&lt;p&gt;On paper the currencies were equal. The arithmetic of exchange rates and the credibility of the Bundesbank produced a system led by a single country, until a shock set its interests against those of the others.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;sec&quot; id=&quot;nth&quot;&gt;
&lt;h3&gt;The n&lt;sup&gt;th&lt;/sup&gt; country&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;In an agreement among &lt;i&gt;n&lt;/i&gt; countries, the bilateral exchange rates to be fixed are:&lt;/p&gt;
&lt;div class=&quot;fm&quot;&gt;(n² − n) / 2&lt;/div&gt;
&lt;p class=&quot;txt&quot;&gt;Only &lt;b&gt;n − 1&lt;/b&gt; of these are independent: the others follow automatically. So it is enough for n − 1 central banks to devote monetary policy to the exchange rate. The nth remains free to pursue its own objective &lt;span class=&quot;s&quot;&gt;slide 12&lt;/span&gt;. In the 3-country example, the Banca d&#x27;Italia maintains Lira/FF, the Banque de France maintains FF/DM, and Lira/DM is fixed automatically because it equals Lira/FF × FF/DM. The Bundesbank need do nothing for the exchange rate.&lt;/p&gt;
&lt;div class=&quot;lab side&quot;&gt;
&lt;svg id=&quot;nS&quot; viewBox=&quot;0 0 420 380&quot; role=&quot;img&quot; aria-label=&quot;Network of bilateral exchange rates among n countries: solid lines defended, dashed lines automatic&quot; style=&quot;max-width:440px;margin:auto&quot;&gt;&lt;/svg&gt;
&lt;div&gt;&lt;h4&gt;Lab: count the exchange rates&lt;/h4&gt;
&lt;label class=&quot;ctl&quot;&gt;Number of countries &lt;output id=&quot;nNo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;nN&quot; min=&quot;2&quot; max=&quot;12&quot; value=&quot;3&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;read&quot;&gt;&lt;div&gt;Bilateral rates&lt;b id=&quot;nT&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;To be defended&lt;b id=&quot;nI&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Automatic&lt;b id=&quot;nA&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;seg&quot; id=&quot;nB&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;star&quot; aria-pressed=&quot;true&quot;&gt;Star: all against the DM&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;chain&quot; aria-pressed=&quot;false&quot;&gt;Chain, as on the slide&lt;/button&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Solid lines: rates defended by central banks. Dashed lines: rates that follow automatically. The red node is the nth country. In both configurations there are n − 1 solid lines: the shape changes, the count does not.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;egemonia&quot;&gt;
&lt;h3&gt;Symmetrical or hegemonic solution?&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;The arithmetic says that one degree of freedom remains, but not who gets it. There are two possible answers. In the &lt;dfn&gt;symmetrical or cooperative solution&lt;/dfn&gt; central banks jointly decide the common monetary policy. In the &lt;dfn&gt;asymmetrical or hegemonic solution&lt;/dfn&gt; one country leads and the others adjust. In the EMS the solution was hegemonic, with Germany as the nth country &lt;span class=&quot;s&quot;&gt;slide 13&lt;/span&gt;.&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 460 170&quot; role=&quot;img&quot; aria-label=&quot;On the left the central banks decide together; on the right they all follow the Bundesbank&quot; style=&quot;max-width:640px;margin:8px 0&quot;&gt;
&lt;text x=&quot;110&quot; y=&quot;18&quot; class=&quot;tb&quot; text-anchor=&quot;middle&quot;&gt;Symmetrical / cooperative&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;18&quot; class=&quot;tb&quot; text-anchor=&quot;middle&quot;&gt;Asymmetrical / hegemonic&lt;/text&gt;
&lt;g class=&quot;dl&quot;&gt;&lt;circle cx=&quot;110&quot; cy=&quot;96&quot; r=&quot;50&quot;/&gt;&lt;/g&gt;
&lt;circle cx=&quot;110&quot; cy=&quot;46&quot; r=&quot;15&quot; class=&quot;fk&quot;/&gt;&lt;circle cx=&quot;60&quot; cy=&quot;96&quot; r=&quot;15&quot; class=&quot;fk&quot;/&gt;&lt;circle cx=&quot;160&quot; cy=&quot;96&quot; r=&quot;15&quot; class=&quot;fk&quot;/&gt;&lt;circle cx=&quot;110&quot; cy=&quot;146&quot; r=&quot;15&quot; class=&quot;fk&quot;/&gt;
&lt;text x=&quot;110&quot; y=&quot;100&quot; class=&quot;tm&quot; text-anchor=&quot;middle&quot;&gt;common&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;114&quot; class=&quot;tm&quot; text-anchor=&quot;middle&quot;&gt;objective&lt;/text&gt;
&lt;path d=&quot;M302 53L334 82&quot; class=&quot;li&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path d=&quot;M398 53L366 82&quot; class=&quot;li&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path d=&quot;M302 139L334 110&quot; class=&quot;li&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path d=&quot;M398 139L366 110&quot; class=&quot;li&quot; marker-end=&quot;url(#ah2)&quot;/&gt;
&lt;defs&gt;&lt;marker id=&quot;ah2&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L8 4L0 8z&quot; style=&quot;fill:var(--ink)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;circle cx=&quot;350&quot; cy=&quot;96&quot; r=&quot;20&quot; class=&quot;fh&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;101&quot; text-anchor=&quot;middle&quot; class=&quot;t&quot; style=&quot;fill:var(--paper);font-weight:600&quot;&gt;DM&lt;/text&gt;
&lt;circle cx=&quot;292&quot; cy=&quot;44&quot; r=&quot;13&quot; class=&quot;fk&quot;/&gt;&lt;circle cx=&quot;408&quot; cy=&quot;44&quot; r=&quot;13&quot; class=&quot;fk&quot;/&gt;&lt;circle cx=&quot;292&quot; cy=&quot;148&quot; r=&quot;13&quot; class=&quot;fk&quot;/&gt;&lt;circle cx=&quot;408&quot; cy=&quot;148&quot; r=&quot;13&quot; class=&quot;fk&quot;/&gt;
&lt;/svg&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Why Germany?&quot;&gt;&lt;p&gt;Two interpretations &lt;span class=&quot;s&quot;&gt;slide 14&lt;/span&gt;:&lt;/p&gt;&lt;ol&gt;&lt;li&gt;&lt;b&gt;Monetary strength.&lt;/b&gt; The leading country is the strongest: the one able to maintain its own monetary policy without changing the exchange rate.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Credibility.&lt;/b&gt; The leading country is the most credible. In the long run it is &lt;dfn&gt;Pareto efficient&lt;/dfn&gt; to adjust to a low-inflation rather than a high-inflation situation. Pareto efficient means that nobody can be made better off without making someone else worse off.&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;The second also explains why France and Italy accept the constraint: for them, joining the EMS is part of the fight against inflation. Over the years it becomes clear that the EMS marks the &lt;b&gt;acceptance of Germany macroeconomic priorities&lt;/b&gt;. All, however, share the political objective of European unification and of a European identity vis-à-vis the USA &lt;span class=&quot;s&quot;&gt;slide 5&lt;/span&gt;. On imported discipline see &lt;a class=&quot;x&quot; href=&quot;https://ideas.repec.org/a/eee/eecrev/v32y1988i5p1055-1075.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: Giavazzi and Pagano 1988 ↗&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Advantages&quot;&gt;&lt;p&gt;The leading country acts as an &lt;dfn&gt;anchor&lt;/dfn&gt;: it helps to restrain countries with inflationary tendencies &lt;span class=&quot;s&quot;&gt;slide 15&lt;/span&gt;. A central bank with little reputation can in effect “borrow” the discipline of the Bundesbank. &lt;span class=&quot;i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Disadvantages&quot;&gt;&lt;p&gt;If the peripheral countries are in recession, they must adopt &lt;dfn&gt;pro-cyclical&lt;/dfn&gt; policies, which amplify the cycle instead of counteracting it and are therefore destabilizing &lt;span class=&quot;s&quot;&gt;slide 15&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;The reason is that the leading country &lt;dfn&gt;sterilizes&lt;/dfn&gt; incoming liquidity: to &lt;b&gt;sterilize&lt;/b&gt; means to offset, through operations of the opposite sign, the increase in money caused by exchange rate interventions. In this way the burden of adjustment, in particular raising rates to defend the exchange rate against downward pressure, falls entirely on the periphery.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;crisi&quot;&gt;
&lt;h3&gt;The 1992-93 crisis&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;German reunification is an &lt;dfn&gt;asymmetric shock&lt;/dfn&gt;, a shock that affects countries differently: Germany needs high interest rates, the rest of Europe low ones. With fixed exchange rates it is impossible to have both. The &lt;dfn&gt;IS-LM&lt;/dfn&gt; model &lt;span class=&quot;i&quot;&gt;supplement&lt;/span&gt; combines two equilibria: the IS curve joins the interest rate-income pairs that clear the goods market, the LM curve those that clear the money market.&lt;/p&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;h4&gt;Lab 1: two-country IS-LM&lt;/h4&gt;
&lt;div class=&quot;two&quot;&gt;&lt;svg id=&quot;isG&quot; viewBox=&quot;0 0 310 276&quot; role=&quot;img&quot; aria-label=&quot;IS-LM for Germany&quot;&gt;&lt;/svg&gt;&lt;svg id=&quot;isR&quot; viewBox=&quot;0 0 310 276&quot; role=&quot;img&quot; aria-label=&quot;IS-LM for the rest of the EMS&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;div class=&quot;cols&quot; style=&quot;margin:4px 0&quot;&gt;
&lt;label class=&quot;ctl&quot;&gt;German public spending: IS shifts right &lt;output id=&quot;g1o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;g1&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;25&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;Recession in the rest of Europe: IS shifts left &lt;output id=&quot;g2o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;g2&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;25&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;Hypothesis 2: revaluation of the DM &lt;output id=&quot;g3o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;g3&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;0&quot; step=&quot;5&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot;&gt;&lt;div&gt;r Germany&lt;b id=&quot;rG&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;r rest of EMS&lt;b id=&quot;rR&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Interest rate differential&lt;b id=&quot;rD&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Diagram with linear curves and arbitrary units, like the charts on slides 17 and 20. The gap you see cannot last with fixed exchange rates and free capital movements: this is the tension to be resolved. The third slider shows &lt;b&gt;Hypothesis 2&lt;/b&gt; &lt;span class=&quot;s&quot;&gt;slide 20&lt;/span&gt;: the DM revalues, Germany loses competitiveness and its IS shifts back, the others gain competitiveness and their IS shifts up. The nominal exchange rate does the work that prices would otherwise do.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;h4&gt;Lab 2: Hypothesis 1, no realignment&lt;/h4&gt;
&lt;div class=&quot;seg&quot; id=&quot;mB&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;sym&quot; aria-pressed=&quot;true&quot;&gt;Symmetric solution&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;asym&quot; aria-pressed=&quot;false&quot;&gt;Asymmetric solution (sterilization)&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;&lt;svg id=&quot;mG&quot; viewBox=&quot;0 0 310 276&quot; role=&quot;img&quot; aria-label=&quot;Money market in Germany&quot;&gt;&lt;/svg&gt;&lt;svg id=&quot;mR&quot; viewBox=&quot;0 0 310 276&quot; role=&quot;img&quot; aria-label=&quot;Money market in the rest of the EMS&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;label class=&quot;ctl&quot;&gt;Size of the money demand shock &lt;output id=&quot;sho&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;sh&quot; min=&quot;0&quot; max=&quot;16&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;read&quot;&gt;&lt;div&gt;ΔM Germany&lt;b id=&quot;dG&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;ΔM rest of EMS&lt;b id=&quot;dR&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Common rate&lt;b id=&quot;dr&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p id=&quot;mTxt&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;cap&quot;&gt;Black: initial situation. Red: money demand Md after the shock, which moves like the IS. Blue: new money supply Ms &lt;span class=&quot;s&quot;&gt;slide 18-19&lt;/span&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Symmetric&quot;&gt;&lt;p&gt;The German interest rate rises, capital flows in and the &lt;dfn&gt;BoP&lt;/dfn&gt; (balance of payments) improves. With a fixed exchange rate, the surplus translates into more money in Germany, the interest rate falls and inflation probably rises. The increase in German money is mirrored by a fall in the other countries &lt;span class=&quot;s&quot;&gt;slide 18&lt;/span&gt;. Over time competitiveness is restored through prices: they rise in Germany and fall elsewhere &lt;span class=&quot;s&quot;&gt;slide 20&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Asymmetric&quot;&gt;&lt;p&gt;The start is the same, but the German authorities &lt;b&gt;sterilize&lt;/b&gt; and money does not increase. To maintain the exchange rate, all the adjustment falls on the others, who must reduce money by more than before. A restrictive policy during a recession is pro-cyclical &lt;span class=&quot;s&quot;&gt;slide 19&lt;/span&gt;. This is the case that corresponds to the EMS.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Realignment&quot;&gt;&lt;p&gt;The DM revalues against all other currencies. Competitiveness is restored through the nominal exchange rate, and equilibrium returns via the effects of devaluation and revaluation on aggregate demand &lt;span class=&quot;s&quot;&gt;slide 20&lt;/span&gt;. This was the least painful route, but it was not chosen in time.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;How the attack came about&lt;/h4&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;1&lt;/div&gt;&lt;h4&gt;Reunification&lt;/h4&gt;&lt;p&gt;Public spending and the deficit increase, with inflationary pressures. The Bundesbank, being non-accommodating, raises interest rates &lt;span class=&quot;s&quot;&gt;slide 16-17&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;2&lt;/div&gt;&lt;h4&gt;Recession elsewhere&lt;/h4&gt;&lt;p&gt;The rest of Europe would need lower interest rates. It cannot lower them without a realignment and a devaluation &lt;span class=&quot;s&quot;&gt;slide 16&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;3&lt;/div&gt;&lt;h4&gt;The realignment does not come&lt;/h4&gt;&lt;p&gt;For political and credibility reasons, and because in some cases the &lt;dfn&gt;fundamentals&lt;/dfn&gt; (the underlying economic variables) do not call for it, governments fail to agree. France and the United Kingdom disagree; Germany and Italy are in favour &lt;span class=&quot;s&quot;&gt;slide 21&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;4&lt;/div&gt;&lt;h4&gt;Expectations change&lt;/h4&gt;&lt;p&gt;Excessively high interest rates in the middle of a recession lead markets to believe that a realignment is inevitable &lt;span class=&quot;s&quot;&gt;slide 21&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;5&lt;/div&gt;&lt;h4&gt;The Danish NO&lt;/h4&gt;&lt;p&gt;The Danish NO to the Maastricht Treaty casts doubt on the monetary union project itself &lt;span class=&quot;s&quot;&gt;slide 21&lt;/span&gt;. Referendum of 2 June 1992, with 50.7% against: &lt;a class=&quot;x&quot; href=&quot;https://www.cvce.eu/obj/referendum_on_the_maastricht_treaty_in_denmark_2_june_1992-en-0f779f6a-a3a2-4e95-96a9-1f97119f11df.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: CVCE ↗&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;6&lt;/div&gt;&lt;h4&gt;The attack&lt;/h4&gt;&lt;p&gt;Markets anticipate the devaluation and attack the weak currencies. The authorities cannot stop them, partly because central banks are not granted unlimited credit &lt;span class=&quot;s&quot;&gt;slide 21&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;7&lt;/div&gt;&lt;h4&gt;September 1992&lt;/h4&gt;&lt;p&gt;The United Kingdom and Italy decide to stop intervening to keep their currencies in the band: the lira and sterling leave the ERM &lt;span class=&quot;s&quot;&gt;slide 11, 21&lt;/span&gt;. The EMS enters a crisis.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;yr&quot;&gt;8&lt;/div&gt;&lt;h4&gt;August 1993: ±15% bands&lt;/h4&gt;&lt;p&gt;After further devaluations, countries widen the bands to ±15%. The economic policy conflict between Germany and the rest of the EC is now evident &lt;span class=&quot;s&quot;&gt;slide 22&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;cap&quot;&gt;Slide 21 states “the band granted by the AECs”: the acronym is not explained and I have not expanded it. To be clarified in class.&lt;/div&gt;

&lt;h4&gt;Why speculation works: the one-way bet&lt;/h4&gt;
&lt;p class=&quot;txt&quot;&gt;A &lt;dfn&gt;speculative attack&lt;/dfn&gt; is a massive sale of a currency in the belief that it will be devalued. With a fixed exchange rate, or one constrained by a band, the speculator risks little: if the parity holds, the loss is the cost of financing for a few days; if it falls, the gain is the entire devaluation. With a floating exchange rate the price would adjust immediately, and the advantage would disappear. &lt;span class=&quot;i&quot;&gt;supplement&lt;/span&gt; To defend itself, the central bank must offer an interest rate that compensates for the expected loss:&lt;/p&gt;
&lt;div class=&quot;fm&quot;&gt;annual differential ≈ expected devaluation × 365 / days&lt;/div&gt;
&lt;div class=&quot;lab side&quot;&gt;
&lt;div&gt;&lt;label class=&quot;ctl&quot;&gt;Expected devaluation &lt;output id=&quot;d1o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;d1&quot; min=&quot;1&quot; max=&quot;30&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;Within &lt;output id=&quot;d2o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;d2&quot; min=&quot;1&quot; max=&quot;90&quot; value=&quot;30&quot;&gt;&lt;/label&gt;&lt;/div&gt;
&lt;div&gt;&lt;p class=&quot;cap&quot;&gt;Annual interest rate differential to be offered&lt;/p&gt;&lt;p class=&quot;big&quot; id=&quot;dv&quot;&gt;&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;Approximate rule for intuition &lt;span class=&quot;i&quot;&gt;supplement&lt;/span&gt;. It explains why such high interest rates, in a recession, are not credible for long: the market knows this, and that reinforces the attack. For a systematic analysis of the crisis see &lt;a class=&quot;x&quot; href=&quot;https://www.brookings.edu/articles/the-unstable-ems&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: Eichengreen and Wyplosz 1993 ↗&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;The tally of devaluations&lt;/h4&gt;
&lt;svg id=&quot;devS&quot; viewBox=&quot;0 0 460 240&quot; role=&quot;img&quot; aria-label=&quot;Devaluations: peseta 15-20 per cent, escudo 6-10 per cent, Irish pound about 10 per cent, French franc, Belgian franc and Danish krone defended&quot; style=&quot;max-width:640px&quot;&gt;&lt;/svg&gt;
&lt;p class=&quot;cap&quot;&gt;Values from &lt;span class=&quot;s&quot;&gt;slide 22&lt;/span&gt;. The slide assigns them to the period May-July 1993.&lt;/p&gt;
&lt;div class=&quot;acc&quot;&gt;&lt;details&gt;&lt;summary&gt;Slide and source chronology: the dates do not fully coincide&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The devaluations reported by the sources are spread over a longer period. This chronology cross-references &lt;a class=&quot;x&quot; href=&quot;https://www.centralbank.ie/docs/default-source/consumer-hub-library/the-irish-pound-from-origins-to-emu.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: Central Bank of Ireland ↗&lt;/a&gt;, &lt;a class=&quot;x&quot; href=&quot;https://researchbriefings.files.parliament.uk/documents/RP96-110/RP96-110.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: House of Commons RP 96/110 ↗&lt;/a&gt; and &lt;a class=&quot;x&quot; href=&quot;https://www.elibrary.imf.org/display/book/9781557754196/ch005.xml&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: IMF, The ERM Experience ↗&lt;/a&gt;. The sources differ by a few days on some dates.&lt;/p&gt;&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;When&lt;/th&gt;&lt;th&gt;What&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;September 1992&lt;/td&gt;&lt;td&gt;Peseta −5%; lira and sterling leave the ERM&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;November 1992&lt;/td&gt;&lt;td&gt;Peseta and escudo −6%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Late January / early February 1993&lt;/td&gt;&lt;td&gt;Irish pound −10%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;May 1993&lt;/td&gt;&lt;td&gt;Peseta −8%, escudo −6.5%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2 August 1993&lt;/td&gt;&lt;td&gt;Bands at ±15%&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p&gt;The slide&#x27;s totals fit better if read as cumulative from September 1992, not as movements in May-July 1993 alone. The slide also mentions two devaluations of the peseta, the sources three.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;trio&quot;&gt;
&lt;h3&gt;The impossible trio&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;The moral of the crisis lies in one line of slide 22. &lt;dfn&gt;Impossible trio&lt;/dfn&gt; (also known as the impossible trinity or trilemma): it is not possible to have &lt;b&gt;independent monetary policies, fixed exchange rates and capital mobility&lt;/b&gt; all at once. The reason is this: with free capital movements and a credibly fixed exchange rate, the domestic interest rate must equal that of the base country, otherwise capital moves entirely towards the higher rate. &lt;a class=&quot;x&quot; href=&quot;https://www.nber.org/papers/w10396.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: Obstfeld, Shambaugh and Taylor ↗&lt;/a&gt;&lt;/p&gt;
&lt;div class=&quot;lab side&quot;&gt;
&lt;svg id=&quot;trS&quot; viewBox=&quot;0 0 420 340&quot; role=&quot;img&quot; aria-label=&quot;Trilemma triangle: the highlighted vertices are the objectives retained&quot; style=&quot;max-width:440px;margin:auto&quot;&gt;&lt;/svg&gt;
&lt;div&gt;&lt;h4&gt;Four moments, four choices&lt;/h4&gt;
&lt;div class=&quot;seg&quot; id=&quot;trB&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;a&quot; aria-pressed=&quot;true&quot;&gt;1970s-80s&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;b&quot; aria-pressed=&quot;false&quot;&gt;1990-92&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;c&quot; aria-pressed=&quot;false&quot;&gt;Aug 1993&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;d&quot; aria-pressed=&quot;false&quot;&gt;EMU&lt;/button&gt;&lt;/div&gt;
&lt;p id=&quot;trT&quot;&gt;&lt;/p&gt;&lt;p class=&quot;cap&quot;&gt;A reading of history in light of the trilemma: &lt;span class=&quot;i&quot;&gt;supplement&lt;/span&gt;, built on facts from slides 5, 11 and 22.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 3&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;With 5 countries, how many bilateral exchange rates are there and how many must be defended?&lt;/summary&gt;&lt;div&gt;(25 − 5)/2 = 10 bilateral rates, of which 4 must be defended. The other 6 are automatic.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why does German sterilization make the adjustment pro-cyclical for the others?&lt;/summary&gt;&lt;div&gt;Because German money does not increase and the German interest rate stays high. To defend the exchange rate the others must move to that rate, cutting money during a recession: policy aggravates the cycle instead of dampening it.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;By how much must money fall in the rest of the EMS in the asymmetric case, compared with the symmetric one?&lt;/summary&gt;&lt;div&gt;In the lab&#x27;s model, by twice as much: from −k to −2k, with k = shock/slope. Slide 19 says so in qualitative terms: “by more than in the case seen before”.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;How could a realignment have avoided the crisis?&lt;/summary&gt;&lt;div&gt;Revaluing the DM would have replaced an adjustment of interest rates and quantities with one of the nominal exchange rate: the German IS shifts back, that of the others shifts up, and the interest rate gap closes.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Which vertex of the trilemma was abandoned in 1993, and which with EMU?&lt;/summary&gt;&lt;div&gt;In 1993 the fixed exchange rate is loosened, with ±15% bands. With EMU national monetary policy is abandoned, while fixed exchange rates and free capital movements are retained.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;div class=&quot;part p4&quot; id=&quot;parte4&quot;&gt;
&lt;div class=&quot;ph&quot;&gt;&lt;div class=&quot;num&quot;&gt;Part 4&lt;/div&gt;&lt;h2&gt;Maastricht: the road to EMU&lt;/h2&gt;&lt;p&gt;The Treaty is the plan for the single currency. It establishes how to get there and who may join.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;sec&quot; id=&quot;maastricht&quot;&gt;
&lt;h3&gt;Two principles&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;The Maastricht Treaty is the &lt;dfn&gt;blueprint&lt;/dfn&gt; for the path towards monetary unification in Europe, and it rests on two principles &lt;span class=&quot;s&quot;&gt;slide 23&lt;/span&gt;:&lt;/p&gt;
&lt;div class=&quot;cols&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Gradualism&lt;/h4&gt;&lt;p&gt;The transition to monetary union takes place in stages.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Convergence&lt;/h4&gt;&lt;p&gt;Entry into the union is conditional on meeting convergence criteria.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;b&gt;A date to correct.&lt;/b&gt; Slide 23 states that the Treaty was signed in 1991. It was signed on &lt;b&gt;7 February 1992&lt;/b&gt; and entered into force on 1 November 1993: &lt;a class=&quot;x&quot; href=&quot;https://www.cvce.eu/en/unit-content/-/unit/b9fe3d6d-e79c-495e-856d-9729144d2cbd/2ffeeb3b-7aab-4d95-9145-8e0437183479&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: CVCE ↗&lt;/a&gt;. 1991 is in all likelihood the year the negotiations concluded, but this is my own inference.&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;tappe&quot;&gt;
&lt;h3&gt;The three stages&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;The slides mention gradualism without listing the stages. The scheme comes from the 1989 Delors Report, taken up in the path towards EMU: &lt;a class=&quot;x&quot; href=&quot;https://www.ecb.europa.eu/ecb/history/emu/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: ECB ↗&lt;/a&gt;.&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 460 210&quot; role=&quot;img&quot; aria-label=&quot;Three steps: 1 July 1990, 1 January 1994, 1 January 1999&quot; style=&quot;max-width:680px&quot;&gt;
&lt;path d=&quot;M10 200H150V140H300V80H450&quot; class=&quot;lc&quot;/&gt;
&lt;text x=&quot;16&quot; y=&quot;170&quot; class=&quot;tc&quot;&gt;Stage 1&lt;/text&gt;&lt;text x=&quot;16&quot; y=&quot;189&quot; class=&quot;t&quot;&gt;1.7.1990&lt;/text&gt;
&lt;text x=&quot;158&quot; y=&quot;110&quot; class=&quot;tc&quot;&gt;Stage 2&lt;/text&gt;&lt;text x=&quot;158&quot; y=&quot;129&quot; class=&quot;t&quot;&gt;1.1.1994&lt;/text&gt;
&lt;text x=&quot;308&quot; y=&quot;50&quot; class=&quot;tc&quot;&gt;Stage 3&lt;/text&gt;&lt;text x=&quot;308&quot; y=&quot;69&quot; class=&quot;t&quot;&gt;1.1.1999&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;cols&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Stage 1&lt;/h4&gt;&lt;p&gt;Completion of the single market, closer coordination of economic policies, all currencies in the ERM.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Stage 2&lt;/h4&gt;&lt;p&gt;The European Monetary Institute is established.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Stage 3&lt;/h4&gt;&lt;p&gt;Exchange rates irrevocably fixed for 11 countries: the euro begins.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;criteria&quot;&gt;
&lt;h3&gt;The convergence criteria&lt;/h3&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Variable&lt;/th&gt;&lt;th&gt;Condition &lt;span class=&quot;s&quot;&gt;slide 24-25&lt;/span&gt;&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Inflation&lt;/td&gt;&lt;td&gt;≤ average of the three lowest rates among the candidates + 1.5 percentage points&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Long-term interest rate&lt;/td&gt;&lt;td&gt;≤ average of the three low-inflation countries + 2 points&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Exchange rate&lt;/td&gt;&lt;td&gt;In the ERM, with no devaluations in the two years preceding entry&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;Government deficit&lt;/td&gt;&lt;td&gt;≤ 3% of GDP. Otherwise: declining continuously and substantially and close to 3%, or an exceptional and temporary excess close to the reference value (Art. 104c(a))&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;Government debt&lt;/td&gt;&lt;td&gt;≤ 60% of GDP. Otherwise: it must be diminishing sufficiently and approaching 60% at a satisfactory pace (Art. 104c(b))&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Today: the references are to Art. 140 TFEU and Protocol No 13, which provides for “at most, the three best performing” and refers to devaluation “on its own initiative” &lt;a class=&quot;x&quot; href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/pro_13/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: EUR-Lex ↗&lt;/a&gt;. The 3% and 60% values are in Protocol No 12, and the former Art. 104c corresponds to the current Art. 126 TFEU &lt;a class=&quot;x&quot; href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/pro_12/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: EUR-Lex ↗&lt;/a&gt;. The ECB counts four criteria because it combines deficit and debt &lt;a class=&quot;x&quot; href=&quot;https://www.ecb.europa.eu/ecb/orga/escb/html/convergence-criteria.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: ECB ↗&lt;/a&gt;; the slides list five.&lt;/p&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;h4&gt;Lab: does this country get in?&lt;/h4&gt;
&lt;div class=&quot;seg&quot; id=&quot;cP&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;v&quot; aria-pressed=&quot;true&quot;&gt;Virtuous country&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;d&quot; aria-pressed=&quot;false&quot;&gt;High but falling debt&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;h&quot; aria-pressed=&quot;false&quot;&gt;High inflation&lt;/button&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;Cases invented for practice, no real country. The sliders calculate only within the page; nothing is sent.&lt;/p&gt;
&lt;div class=&quot;cols&quot; id=&quot;cc&quot;&gt;
&lt;div&gt;
&lt;label class=&quot;ctl&quot;&gt;Average inflation of the best three &lt;output id=&quot;o_bi&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;c_bi&quot; min=&quot;0&quot; max=&quot;5&quot; step=&quot;0.1&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span class=&quot;res&quot; id=&quot;b_inf&quot;&gt;&lt;/span&gt;Country&#x27;s inflation &lt;output id=&quot;o_inf&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;c_inf&quot; min=&quot;0&quot; max=&quot;12&quot; step=&quot;0.1&quot;&gt;&lt;/label&gt;&lt;p class=&quot;cap&quot; id=&quot;t_inf&quot;&gt;&lt;/p&gt;
&lt;label class=&quot;ctl&quot;&gt;Long-term rate in the best three &lt;output id=&quot;o_br&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;c_br&quot; min=&quot;2&quot; max=&quot;12&quot; step=&quot;0.1&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span class=&quot;res&quot; id=&quot;b_rt&quot;&gt;&lt;/span&gt;Country&#x27;s long-term rate &lt;output id=&quot;o_rt&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;c_rt&quot; min=&quot;2&quot; max=&quot;16&quot; step=&quot;0.1&quot;&gt;&lt;/label&gt;&lt;p class=&quot;cap&quot; id=&quot;t_rt&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span class=&quot;res&quot; id=&quot;b_def&quot;&gt;&lt;/span&gt;Deficit &lt;output id=&quot;o_def&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;c_def&quot; min=&quot;0&quot; max=&quot;12&quot; step=&quot;0.1&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;ctl&quot;&gt;&lt;span class=&quot;res&quot; id=&quot;b_debt&quot;&gt;&lt;/span&gt;Debt &lt;output id=&quot;o_debt&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;c_debt&quot; min=&quot;20&quot; max=&quot;140&quot; step=&quot;1&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;seg&quot; style=&quot;flex-direction:column;align-items:flex-start&quot;&gt;
&lt;button type=&quot;button&quot; data-k=&quot;erm&quot; aria-pressed=&quot;false&quot;&gt;In the ERM, no devaluations for 2 years&lt;/button&gt;&lt;span class=&quot;res&quot; id=&quot;b_erm&quot; style=&quot;float:none;margin:0&quot;&gt;&lt;/span&gt;
&lt;button type=&quot;button&quot; data-k=&quot;dd&quot; aria-pressed=&quot;false&quot;&gt;Deficit declining continuously and close to 3%&lt;/button&gt;
&lt;button type=&quot;button&quot; data-k=&quot;gd&quot; aria-pressed=&quot;false&quot;&gt;Debt declining at a satisfactory pace&lt;/button&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;big&quot; style=&quot;font-size:24px&quot; id=&quot;cV&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;cap&quot;&gt;Try the second case: debt is well above 60%, but the text leaves room. The phrases “sufficiently” and “satisfactory pace” are not numbers: they leave scope for political judgement. &lt;span class=&quot;i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;sec&quot; id=&quot;oca&quot;&gt;
&lt;h3&gt;Why these requirements in particular?&lt;/h3&gt;
&lt;p class=&quot;txt&quot;&gt;The question on slide 26 arises from a comparison. &lt;dfn&gt;OCA theory&lt;/dfn&gt; (optimum currency area: when it pays for several countries to share a single currency) looks at &lt;i&gt;micro&lt;/i&gt; conditions. The Treaty looks at &lt;i&gt;macro&lt;/i&gt; convergence, and only in monetary policy and public finance &lt;span class=&quot;s&quot;&gt;slide 26&lt;/span&gt;.&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 460 212&quot; role=&quot;img&quot; aria-label=&quot;Comparison between the conditions of OCA theory and the Treaty criteria&quot; style=&quot;max-width:680px;margin:8px 0&quot;&gt;
&lt;text x=&quot;110&quot; y=&quot;20&quot; class=&quot;tb&quot; text-anchor=&quot;middle&quot;&gt;OCA theory: micro&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;20&quot; class=&quot;tb&quot; text-anchor=&quot;middle&quot;&gt;Treaty: macro&lt;/text&gt;
&lt;g&gt;&lt;rect x=&quot;10&quot; y=&quot;34&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;6&quot; class=&quot;fb&quot;/&gt;&lt;rect x=&quot;10&quot; y=&quot;90&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;6&quot; class=&quot;fb&quot;/&gt;&lt;rect x=&quot;10&quot; y=&quot;146&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;6&quot; class=&quot;fb&quot;/&gt;
&lt;rect x=&quot;250&quot; y=&quot;34&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;6&quot; class=&quot;fb&quot;/&gt;&lt;rect x=&quot;250&quot; y=&quot;90&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;6&quot; class=&quot;fb&quot;/&gt;&lt;rect x=&quot;250&quot; y=&quot;146&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;6&quot; class=&quot;fb&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;110&quot; y=&quot;62&quot; class=&quot;t&quot; text-anchor=&quot;middle&quot;&gt;symmetry of shocks&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;118&quot; class=&quot;t&quot; text-anchor=&quot;middle&quot;&gt;wage, price flexibility&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;174&quot; class=&quot;t&quot; text-anchor=&quot;middle&quot;&gt;labour mobility&lt;/text&gt;
&lt;text x=&quot;350&quot; y=&quot;62&quot; class=&quot;t&quot; text-anchor=&quot;middle&quot;&gt;inflation&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;118&quot; class=&quot;t&quot; text-anchor=&quot;middle&quot;&gt;interest rates&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;174&quot; class=&quot;t&quot; text-anchor=&quot;middle&quot;&gt;budgetary policies&lt;/text&gt;
&lt;text x=&quot;230&quot; y=&quot;118&quot; class=&quot;th&quot; text-anchor=&quot;middle&quot;&gt;≠&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Symmetry of shocks&quot;&gt;&lt;p&gt;If a shock hits everyone in the same way, a single common monetary policy is enough. If it is an asymmetric shock, a single currency cannot respond for everyone. German reunification, seen in Part 3, is the textbook case. &lt;span class=&quot;i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Wage and price flexibility&quot;&gt;&lt;p&gt;Without the exchange rate to adjust, competitiveness is recovered through wages and prices. If these are rigid, adjustment comes through unemployment. The same logic applies as in the symmetric case: prices do the work of the exchange rate. &lt;span class=&quot;i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Labour mobility&quot;&gt;&lt;p&gt;Workers can move from the region in crisis to the growing one, and this mitigates the shock. It is the central criterion of the article by &lt;a class=&quot;x&quot; href=&quot;https://www.jstor.org/stable/1812792&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: Mundell 1961 ↗&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-t=&quot;Why the Treaty is different&quot;&gt;&lt;p&gt;The slides set out the contrast and leave the answer open. One possible reading &lt;span class=&quot;i&quot;&gt;supplement&lt;/span&gt;:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Credibility.&lt;/b&gt; Low-inflation countries fear that the new currency will be less stable. The criteria select those who have already demonstrated discipline.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Fiscal discipline.&lt;/b&gt; In a single currency, a country with excessive debt can shift costs and risks onto the others.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Measurability.&lt;/b&gt; Inflation and deficits can be verified in figures; labour mobility cannot.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;b&gt;The limitation:&lt;/b&gt; a country may meet the criteria and still be unsuited to a single currency, because the figures say nothing about the labour market or the symmetry of shocks. Eichengreen and Wyplosz further argue that the Treaty creates perverse incentives: &lt;a class=&quot;x&quot; href=&quot;https://ideas.repec.org/p/cpr/ceprdp/817.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source: CEPR DP 817 ↗&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h4&gt;Self-check · Part 4&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;The three lowest inflation rates are 1.5%, 2% and 2.5%. The candidate has 3.8%: does it pass?&lt;/summary&gt;&lt;div&gt;The average is 2%, the threshold is 3.5%. At 3.8% it does not pass.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;A country has debt at 110% of GDP: is it automatically excluded?&lt;/summary&gt;&lt;div&gt;No. It passes if debt is diminishing sufficiently and approaching 60% at a satisfactory pace. The wording leaves room for assessment.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Which criteria derive from the experience of the EMS?&lt;/summary&gt;&lt;div&gt;The most direct link is with criterion 3: participation in the ERM without devaluations. The inflation criterion also reflects the convergence towards low inflation that the EMS had built.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between OCA theory and the Treaty criteria?&lt;/summary&gt;&lt;div&gt;The former asks whether two economies work well with a single currency: symmetric shocks, flexibility, mobility. The latter ask whether their nominal and public finance variables are already aligned. They answer different questions.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;div class=&quot;part p0&quot; id=&quot;finale&quot;&gt;
&lt;div class=&quot;ph&quot;&gt;&lt;div class=&quot;num&quot;&gt;Slide 27&lt;/div&gt;&lt;h2&gt;Check your learning&lt;/h2&gt;&lt;p&gt;The five questions with which the slides close. The slides do not give the answers: those below are proposals built on the rest of the lecture. Try answering first without looking.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;quiz&quot; style=&quot;margin-top:0&quot;&gt;
&lt;details&gt;&lt;summary&gt;Which features of the EMS were crucial for its long survival?&lt;/summary&gt;&lt;div&gt;The controlled flexibility of realignments, credit for weak currencies, and compulsory interventions on both sides. Also important were capital controls until the late 1980s, the wide band for the most fragile countries, the German anchor and the common political objective.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What was ECU?&lt;/summary&gt;&lt;div&gt;A basket of EMS currencies, a weighted average with weights based on GDP and trade. It was a notional currency, that is, a unit of account, and served as the reference for the ERM central parities.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why were European countries interested in a European exchange rate agreement?&lt;/summary&gt;&lt;div&gt;Three reasons. After 1971 the dollar reference was missing. For France and Italy the constraint was a weapon against inflation. And there was the political objective of European unification and of a European identity vis-à-vis the USA.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why can speculative attacks on currencies happen only when exchange rates are fixed or somewhat constrained?&lt;/summary&gt;&lt;div&gt;Because only a defended price can be visibly “wrong” and correct itself in jumps. With a constrained exchange rate the bet is one-way: little is lost if the parity holds, and the whole devaluation is gained if it falls. With a floating exchange rate the price adjusts immediately, and no central bank has promised to buy at a fixed price.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Would you say that asymmetric shocks were disrupting the economic stability of European countries even before the euro? Why?&lt;/summary&gt;&lt;div&gt;Yes. German reunification is an asymmetric shock: it pushes up demand in Germany while the rest of Europe is in recession. With fixed exchange rates and free capital movements a single monetary policy, the German one, applied to everyone, and it produced the 1992-93 crisis. The same problem recurs in the monetary union.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;part p0&quot; id=&quot;fonti&quot;&gt;
&lt;div class=&quot;ph&quot;&gt;&lt;div class=&quot;num&quot;&gt;External sources&lt;/div&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;p&gt;The slides do not cite authors or articles: they cite events, agreements, legal provisions and OCA theory. For each, here is a reliable source. Everything in this section is an &lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt; and does not come from the slides. The descriptions are based on what emerged from the search, often abstracts or excerpts: I have not read every text in full.&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;From the dollar to the EMS&lt;/h3&gt;
&lt;div class=&quot;src&quot;&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.federalreservehistory.org/essays/bretton_woods_created&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Creation of the Bretton Woods System&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;Federal Reserve History&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; the July 1944 conference, the IMF, the parity of 35 dollars per ounce.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it explains the reference point that disappears in 1971.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://history.state.gov/milestones/1969-1976/nixon-shock&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Nixon and the End of the Bretton Woods System, 1971-1973&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;Office of the Historian, U.S. Department of State&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; the decision of August 1971 and the G10 agreement.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it is the official account of the lecture&#x27;s starting event.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.federalreservehistory.org/essays/smithsonian-agreement&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Smithsonian Agreement&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;Federal Reserve History&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; the Washington meeting of December 1971 and its failure.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it shows how fragile the Tunnel was.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.cvce.eu/en/education/unit-content/-/unit/02bb76df-d066-4c08-a58a-d4686a3e68ff/38cf7d33-69b8-4550-a648-67f433ac14a1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The European currency snake&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;CVCE, University of Luxembourg&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; the history and documents of the Snake.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it gives the dates that are compressed on slide 5.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.elibrary.imf.org/view/journals/024/1976/003/article-A003-en.xml&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;A Reform of the European Currency Snake&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;IMF Staff Papers, 1976&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; a contemporary analysis, including the countries&#x27; exits.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it shows how the Snake&#x27;s problems were discussed as they unfolded.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.bankofengland.co.uk/-/media/boe/files/quarterly-bulletin/1979/intervention-arrangements-in-the-european-monetary-system.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Intervention arrangements in the European Monetary System&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;Bank of England, Quarterly Bulletin, 1979&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; intervention rules, the ECU and the divergence indicator, explained at the launch.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it is the text closest to the mechanisms on slides 6-9.&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;

&lt;h3&gt;Hegemony and crisis&lt;/h3&gt;
&lt;div class=&quot;src&quot;&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://ideas.repec.org/a/eee/eecrev/v32y1988i5p1055-1075.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The advantage of tying one&#x27;s hands&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;F. Giavazzi, M. Pagano · European Economic Review, 32(5), 1988&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; why a high-inflation country may wish to submit to EMS discipline.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it provides the theoretical basis for the “credibility” interpretation on slide 14.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://documentos.fedea.net/documento/eee-52/texto&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Was there monetary autonomy in Europe on the eve of EMU?&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;FEDEA, working paper EEE 52&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; an empirical test of the German Dominance hypothesis.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it is a reminder that German hegemony is also a hypothesis that has been tested and debated.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.brookings.edu/articles/the-unstable-ems&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Unstable EMS&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;B. Eichengreen, C. Wyplosz · Brookings Papers on Economic Activity, 1993(1), 51-144&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; the systematic analysis of the 1992 crisis.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it argues that many countries had already made the necessary adjustments, and thus discusses the role of the fundamentals mentioned on slides 16 and 21.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.nber.org/system/files/working_papers/w29488/w29488.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Imported or Home Grown? The 1992-3 EMS Crisis&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;NBER Working Paper 29488&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; a more recent analysis of the origins of the crisis.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it asks the same question as the slides: did the crisis originate in Germany or in the individual countries?&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.cvce.eu/obj/referendum_on_the_maastricht_treaty_in_denmark_2_june_1992-en-0f779f6a-a3a2-4e95-96a9-1f97119f11df.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Referendum on the Maastricht Treaty in Denmark&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;CVCE · 2 June 1992&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; the result of the vote, with 50.7% against and a turnout of 83%.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it is the “Danish NO” of slide 21.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.nber.org/papers/w10396.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Trilemma in History&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;M. Obstfeld, J. Shambaugh, A. Taylor · NBER Working Paper 10396&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; the trilemma, that is, the impossible trio, explained and measured.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it gives an empirical basis to what slide 22 sums up in one line.&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;

&lt;h3&gt;Maastricht and OCA&lt;/h3&gt;
&lt;div class=&quot;src&quot;&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://ec-europa-eu.libguides.com/maastricht-treaty/signature/text&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Treaty on European Union: text&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;European Commission Library · OJ C 191, 29.7.1992&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; the text signed at Maastricht on 7 February 1992.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it is the original legal text with the numbering used by the slides, such as Art. 104c.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.cvce.eu/collections/unit-content/-/unit/en/02bb76df-d066-4c08-a58a-d4686a3e68ff/021072be-929c-4ca0-ad76-32760b5dc2ff&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Delors Report&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;CVCE · April 1989&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; the report that proposes the three stages.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it is the origin of the gradualism on slide 23.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ecb.europa.eu/ecb/history/emu/html/index.en.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Economic and Monetary Union: history&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;European Central Bank&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; the stages of EMU with their dates.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it completes the path that the slides leave implicit.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/pro_13/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Protocol No 13 on the convergence criteria&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;EUR-Lex · with Art. 140 TFEU&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; the legal definition of the criteria currently in force.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it refines the simplified wording on slides 24-25.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/treaty/tfeu_2016/pro_12/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Protocol No 12 on the excessive deficit procedure&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;EUR-Lex · with Art. 126 TFEU&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; the reference values of 3% and 60%.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it is the current version of the former Art. 104c.&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;span class=&quot;x&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;&lt;a href=&quot;https://www.jstor.org/stable/1812792&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;A Theory of Optimum Currency Areas&lt;/a&gt;&lt;/h4&gt;&lt;p class=&quot;m&quot;&gt;R. Mundell · American Economic Review, 51(4), 1961, 657-665&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contains:&lt;/b&gt; the founding article of OCA theory, centred on factor mobility.&lt;/p&gt;&lt;p&gt;&lt;b&gt;It matters because&lt;/b&gt; it is the basis of the micro criteria on slide 26.&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/main&gt;
