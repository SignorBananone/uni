*{box-sizing:border-box}

  &lt;div class=&quot;note&quot;&gt;
    &lt;span class=&quot;lbl&quot;&gt;Il filo in tre righe&lt;/span&gt;
    &lt;p&gt;Per confrontare i prezzi di due paesi serve la stessa valuta, quindi serve &lt;em&gt;E&lt;/em&gt;. Se i prezzi convertiti fossero uguali ovunque varrebbe la PPP, ma nella realtà non è così. La distanza dalla PPP si misura con il real exchange rate &lt;em&gt;E&lt;sub&gt;R&lt;/sub&gt;&lt;/em&gt;: quando sale, l&#x27;eurozona perde competitiveness, e la sua variazione si scompone in variazione del cambio più inflation differential.&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part hs&quot; id=&quot;p1&quot; data-spy&gt;
  &lt;span class=&quot;partno&quot;&gt;Parte 1&lt;/span&gt;
  &lt;h2&gt;Il nominal exchange rate&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Un prezzo in euro e uno in dollari non si possono confrontare direttamente. Il cambio è il traduttore che li porta nella stessa unità di misura.&lt;/p&gt;

  &lt;div class=&quot;defs&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;strong&gt;E: nominal bilateral exchange rate&lt;/strong&gt;È il tasso di cambio &lt;em&gt;nominal&lt;/em&gt; (espresso in moneta, senza tenere conto dei prezzi dei beni) e &lt;em&gt;bilateral&lt;/em&gt; (tra due sole valute). &lt;span class=&quot;tag&quot;&gt;slide 2&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;strong&gt;Quotazione usata nel corso&lt;/strong&gt;Quante unità di valuta estera si ottengono con 1 unità di valuta nazionale. Con l&#x27;eurozona (EZ) come &quot;casa&quot;, E = 1,18 USD/EUR significa 1 € = 1,18 $. &lt;span class=&quot;tag&quot;&gt;slide 2, 4&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;warn&quot;&gt;
    &lt;span class=&quot;lbl&quot;&gt;Occhio alla frase della slide&lt;/span&gt;
    &lt;p&gt;La slide dice &quot;the price of a foreign currency in terms of 1 unit of national currency&quot;. Letta alla lettera sembra il prezzo del dollaro, ma gli esercizi usano USD/EUR: E è il numero di dollari per 1 euro, cioè il prezzo dell&#x27;&lt;em&gt;euro&lt;/em&gt; espresso in dollari. Conviene ragionare sempre sulle unità di misura. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;A che cosa serve: confrontare lo stesso bene&lt;/h3&gt;
  &lt;p&gt;Si usa E per confrontare il prezzo dello stesso bene &lt;em&gt;i&lt;/em&gt; venduto in due paesi. La conversione si può fare in due direzioni, e il risultato del confronto non cambia. &lt;span class=&quot;tag&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Tutto in dollari&lt;/button&gt;&lt;button&gt;Tutto in euro&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;div class=&quot;fm&quot;&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt; vs. P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;EZ&lt;/sub&gt; · E&lt;small&gt;Il prezzo in euro, moltiplicato per i dollari per euro, diventa un prezzo in dollari: (€) × ($/€) = $.&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;div class=&quot;fm&quot;&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;EZ&lt;/sub&gt; vs. P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt; / E&lt;small&gt;Il prezzo in dollari, diviso per i dollari per euro, diventa un prezzo in euro: ($) / ($/€) = €.&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 400 126&quot; role=&quot;img&quot; aria-label=&quot;Schema: dal prezzo in euro si passa al prezzo in dollari moltiplicando per E, e si torna indietro dividendo per E&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;38&quot; width=&quot;100&quot; height=&quot;50&quot; rx=&quot;8&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;
      &lt;text class=&quot;ser&quot; x=&quot;60&quot; y=&quot;69&quot; text-anchor=&quot;middle&quot;&gt;P in €&lt;/text&gt;
      &lt;rect x=&quot;290&quot; y=&quot;38&quot; width=&quot;100&quot; height=&quot;50&quot; rx=&quot;8&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;
      &lt;text class=&quot;ser&quot; x=&quot;340&quot; y=&quot;69&quot; text-anchor=&quot;middle&quot;&gt;P in $&lt;/text&gt;
      &lt;path d=&quot;M115 52H282&quot; fill=&quot;none&quot; stroke=&quot;var(--deep)&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M282 47l8 5-8 5z&quot; style=&quot;fill:var(--deep)&quot;/&gt;
      &lt;path d=&quot;M285 76H118&quot; fill=&quot;none&quot; stroke=&quot;var(--deep)&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M118 71l-8 5 8 5z&quot; style=&quot;fill:var(--deep)&quot;/&gt;
      &lt;text x=&quot;200&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;× E&lt;/text&gt;
      &lt;text x=&quot;200&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;÷ E&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Moltiplicare o dividere dipende solo dalla direzione: le unità di misura dicono quale operazione serve.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Prova il cambio&lt;/h3&gt;
  &lt;div class=&quot;fig&quot; id=&quot;sim-e&quot;&gt;
    &lt;svg viewBox=&quot;0 0 400 160&quot; role=&quot;img&quot; aria-label=&quot;Barre: quanti dollari valgono 100 euro e quanti euro valgono 100 dollari al cambio scelto&quot;&gt;&lt;/svg&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;E (USD/EUR)&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;E&quot; data-d=&quot;2&quot; min=&quot;0.8&quot; max=&quot;1.6&quot; step=&quot;0.01&quot; value=&quot;1.18&quot;&gt;&lt;output data-o=&quot;E&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;readout&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Con questa quotazione, &lt;b class=&quot;t&quot;&gt;E che sale = euro che si apprezza&lt;/b&gt;. Con la quotazione inversa (EUR/USD) il verso si ribalta, ed è la fonte di errore più comune. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Con E = 1,25 USD/EUR, un bene che costa €80 nell&#x27;EZ quanto costa in dollari?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Scopri la risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;80 × 1,25 = $100. Dal prezzo in euro al prezzo in dollari si moltiplica per E.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;E passa da 1,10 a 1,20 USD/EUR. L&#x27;euro si apprezza o si deprezza?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Scopri la risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Si apprezza: un euro compra più dollari. Di conseguenza i beni EZ, a parità di prezzo in euro, costano di più a un compratore americano.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Un bene costa $60 negli USA e E = 1,20. Quanto costa in euro?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Scopri la risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;60 / 1,20 = €50. Dal prezzo in dollari al prezzo in euro si divide per E.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part ho&quot; id=&quot;p2&quot; data-spy&gt;
  &lt;span class=&quot;partno&quot;&gt;Parte 2&lt;/span&gt;
  &lt;h2&gt;Law of one price, PPP e Big Mac&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Se i mercati fossero perfettamente integrati, lo stesso bene dovrebbe costare lo stesso ovunque. Da questa idea si ricava un cambio &quot;teorico&quot; da confrontare con quello vero.&lt;/p&gt;

  &lt;h3 id=&quot;loop&quot;&gt;Law of one price&lt;/h3&gt;
  &lt;p&gt;La &lt;b class=&quot;t&quot;&gt;law of one price&lt;/b&gt; (legge del prezzo unico) dice che un singolo bene &lt;em&gt;i&lt;/em&gt;, una volta convertito nella stessa valuta, ha lo stesso prezzo in entrambi i paesi. Le tre scritture si equivalgono. &lt;span class=&quot;tag&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;fm&quot;&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;EZ&lt;/sub&gt; · E = P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt; &amp;nbsp;⇔&amp;nbsp; P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt; / E = P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;EZ&lt;/sub&gt; &amp;nbsp;⇔&amp;nbsp; E = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;EZ&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt;
    &lt;small&gt;L&#x27;ultima forma è annotata a mano sulla slide, dove &quot;EZ&quot; è scritto &quot;EU&quot;: nelle annotazioni i due pedici indicano la stessa area.&lt;/small&gt;&lt;/div&gt;

  &lt;p&gt;Le slide non spiegano &lt;em&gt;perché&lt;/em&gt; dovrebbe valere. Il meccanismo è l&#x27;&lt;b class=&quot;t&quot;&gt;arbitrage&lt;/b&gt;: comprare dove un bene costa meno e rivenderlo dove costa di più. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;&lt;svg data-arb viewBox=&quot;0 0 400 160&quot; role=&quot;img&quot; aria-label=&quot;Barre: prezzo in dollari del bene nell&#x27;EZ e negli USA, che si avvicinano passo dopo passo&quot;&gt;&lt;/svg&gt;
  &lt;figcaption&gt;Numeri inventati per illustrare il meccanismo.&lt;/figcaption&gt;&lt;/figure&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;ol aria-live=&quot;polite&quot;&gt;
      &lt;li data-a=&quot;118&quot; data-b=&quot;130&quot;&gt;&lt;span class=&quot;st&quot;&gt;Il prezzo è diverso&lt;/span&gt;Il bene costa €100 nell&#x27;EZ, cioè $118 con E = 1,18. Negli USA costa $130.&lt;/li&gt;
      &lt;li data-a=&quot;118&quot; data-b=&quot;130&quot;&gt;&lt;span class=&quot;st&quot;&gt;Scatta l&#x27;arbitrage&lt;/span&gt;Conviene comprare nell&#x27;EZ e rivendere negli USA, con $12 di margine per unità.&lt;/li&gt;
      &lt;li data-a=&quot;122&quot; data-b=&quot;126&quot;&gt;&lt;span class=&quot;st&quot;&gt;I prezzi si muovono&lt;/span&gt;La domanda spinge su il prezzo nell&#x27;EZ e l&#x27;offerta extra spinge giù quello USA. Anche la domanda di euro può spingere su E.&lt;/li&gt;
      &lt;li data-a=&quot;124&quot; data-b=&quot;124&quot;&gt;&lt;span class=&quot;st&quot;&gt;Il margine sparisce&lt;/span&gt;Quando i prezzi convertiti coincidono non c&#x27;è più guadagno e l&#x27;arbitrage si ferma: la law of one price vale.&lt;/li&gt;
    &lt;/ol&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Il meccanismo funziona solo a certe condizioni, e ognuna è un motivo per cui nella realtà può fallire. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Il bene è davvero identico?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Marca, qualità e servizio post-vendita rendono due prodotti simili non perfettamente sostituibili.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Si può trasportare a costo zero?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;I transport costs creano una fascia in cui la differenza di prezzo non basta a pagare la spedizione, e quindi resta.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Ci sono barriere al commercio?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Dazi (tariffs), quote e standard tecnici separano i mercati. Anche le imposte sui consumi come l&#x27;IVA spostano i prezzi al dettaglio.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;È un bene tradable?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Un taglio di capelli o un affitto sono non-tradable: non si possono comprare a Bergamo e rivendere a Boston, quindi l&#x27;arbitrage non è possibile.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3 id=&quot;ppp&quot;&gt;Purchasing Power Parity (PPP)&lt;/h3&gt;
  &lt;p&gt;Se la law of one price vale per &lt;em&gt;tutti&lt;/em&gt; i beni di un dato &lt;b class=&quot;t&quot;&gt;basket&lt;/b&gt; (paniere di beni rappresentativo), allora vale la &lt;b class=&quot;t&quot;&gt;Purchasing Power Parity&lt;/b&gt; (parità del potere d&#x27;acquisto): i &lt;b class=&quot;t&quot;&gt;price levels&lt;/b&gt; (livelli generali dei prezzi, cioè il costo del basket) di tutti i paesi sono uguali se misurati nella stessa valuta. Con la stessa somma compro la stessa cosa in entrambi i paesi. &lt;span class=&quot;tag&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 400 112&quot; role=&quot;img&quot; aria-label=&quot;Schema: dal singolo bene al basket, dal basket al price level e alla PPP&quot;&gt;
      &lt;g style=&quot;fill:var(--tint);stroke:var(--deep)&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;22&quot; width=&quot;110&quot; height=&quot;64&quot; rx=&quot;8&quot;/&gt;&lt;rect x=&quot;145&quot; y=&quot;22&quot; width=&quot;110&quot; height=&quot;64&quot; rx=&quot;8&quot;/&gt;&lt;rect x=&quot;285&quot; y=&quot;22&quot; width=&quot;110&quot; height=&quot;64&quot; rx=&quot;8&quot;/&gt;&lt;/g&gt;
      &lt;text class=&quot;ser&quot; x=&quot;60&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;P&lt;tspan dy=&quot;-6&quot; font-size=&quot;12&quot;&gt;i&lt;/tspan&gt;&lt;/text&gt;&lt;text class=&quot;sm&quot; x=&quot;60&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;un bene&lt;/text&gt;
      &lt;text class=&quot;ser&quot; x=&quot;200&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;text class=&quot;sm&quot; x=&quot;200&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;tutto il basket&lt;/text&gt;
      &lt;text class=&quot;ser&quot; x=&quot;340&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;PPP&lt;/text&gt;&lt;text class=&quot;sm&quot; x=&quot;340&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;E = P&lt;tspan dy=&quot;3&quot; font-size=&quot;10&quot;&gt;US&lt;/tspan&gt;&lt;tspan dy=&quot;-3&quot;&gt; / P&lt;/tspan&gt;&lt;tspan dy=&quot;3&quot; font-size=&quot;10&quot;&gt;EZ&lt;/tspan&gt;&lt;/text&gt;
      &lt;path class=&quot;ln&quot; d=&quot;M117 54H140M257 54H280&quot;/&gt;&lt;path d=&quot;M140 49l5 5-5 5zM280 49l5 5-5 5z&quot; style=&quot;fill:var(--ink2)&quot;/&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Stessa logica, scala diversa: la law of one price riguarda un bene &lt;em&gt;i&lt;/em&gt;, la PPP l&#x27;intero basket. Per questo P perde l&#x27;apice &lt;em&gt;i&lt;/em&gt;.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Absolute PPP&lt;/button&gt;&lt;button&gt;Relative PPP&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;È la versione delle slide, sui &lt;em&gt;livelli&lt;/em&gt; dei prezzi. &lt;span class=&quot;tag&quot;&gt;slide 3, 5&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;fm&quot;&gt;E = P&lt;sub&gt;US&lt;/sub&gt; / P&lt;sub&gt;EZ&lt;/sub&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;Le slide non usano questo nome, ma la formula arriva dalla Parte 4: chiede solo che il cambio compensi la differenza di inflation (la crescita dei prezzi), anche se i livelli dei prezzi restano diversi. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;fm&quot;&gt;ΔE = π&lt;sub&gt;US&lt;/sub&gt; − π&lt;sub&gt;EZ&lt;/sub&gt;&lt;small&gt;Se l&#x27;inflazione USA supera quella EZ di 2 punti, il dollaro si deprezza del 2% circa ed E sale del 2%.&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;bigmac&quot;&gt;Il test: Big Mac Index&lt;/h3&gt;
  &lt;p&gt;Il &lt;b class=&quot;t&quot;&gt;Big Mac Index&lt;/b&gt; applica la PPP a un solo prodotto, standardizzato e venduto in molti paesi. Lo pubblica The Economist dal 1986 come misura informale della PPP. &lt;a class=&quot;tag x&quot; href=&quot;https://en.wikipedia.org/wiki/Big_Mac_Index&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/p&gt;
  &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Dati, luglio 2021 &lt;span class=&quot;tag&quot;&gt;slide 4&lt;/span&gt;&lt;/th&gt;&lt;th&gt;Valore&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Prezzo del Big Mac nell&#x27;EZ&lt;/td&gt;&lt;td&gt;€4,27&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Prezzo del Big Mac negli USA&lt;/td&gt;&lt;td&gt;$5,65&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b class=&quot;t&quot;&gt;Market exchange rate&lt;/b&gt; (il cambio effettivo sul mercato)&lt;/td&gt;&lt;td&gt;1,18 USD/EUR&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;ol aria-live=&quot;polite&quot;&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Quale cambio servirebbe per la PPP?&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;E = 5,65 / 4,27 = 1,32&lt;/div&gt;È il cambio implicito nei due prezzi. &lt;span class=&quot;tag&quot;&gt;slide 4&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;È uguale al cambio di mercato?&lt;/span&gt;No: 1,18 &amp;lt; 1,32. Il mercato dà meno dollari per euro di quanti ne servirebbero. &lt;span class=&quot;tag&quot;&gt;slide 4&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Confronto in dollari&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;$5,65 vs. 4,27 × 1,18 = $5,04&lt;/div&gt;Con il cambio di mercato il Big Mac EZ costa meno. &lt;span class=&quot;tag&quot;&gt;slide 4&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Confronto in euro&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;€4,27 vs. 5,65 / 1,18 = €4,79&lt;/div&gt;Stessa conclusione nell&#x27;altra valuta. &lt;span class=&quot;tag&quot;&gt;slide 4&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Quali sono le implicazioni?&lt;/span&gt;La slide pone la domanda senza scrivere la risposta. Il Big Mac costa circa il 10,8% in meno nell&#x27;EZ (5,04 / 5,65 − 1). L&#x27;euro risulta quindi &lt;b class=&quot;t&quot;&gt;undervalued&lt;/b&gt; (sottovalutato) rispetto alla PPP e, su questo prodotto, l&#x27;EZ è più competitiva. La PPP non vale. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/li&gt;
    &lt;/ol&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Sposta i cursori&lt;/h4&gt;
  &lt;div class=&quot;fig&quot; id=&quot;sim-mac&quot;&gt;
    &lt;div class=&quot;presets&quot;&gt;&lt;button type=&quot;button&quot; data-preset=&#x27;{&quot;pe&quot;:4.27,&quot;pu&quot;:5.65,&quot;E&quot;:1.18}&#x27;&gt;Dati della slide&lt;/button&gt;&lt;button type=&quot;button&quot; data-preset=&#x27;{&quot;pe&quot;:4.27,&quot;pu&quot;:5.65,&quot;E&quot;:1.32}&#x27;&gt;E di PPP&lt;/button&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 400 204&quot; role=&quot;img&quot; aria-label=&quot;Barre del prezzo del Big Mac in dollari e linea con il cambio di mercato e quello di PPP&quot;&gt;&lt;/svg&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;Prezzo EZ (€)&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;pe&quot; data-d=&quot;2&quot; data-p=&quot;€&quot; min=&quot;3.5&quot; max=&quot;6&quot; step=&quot;0.01&quot; value=&quot;4.27&quot;&gt;&lt;output data-o=&quot;pe&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;Prezzo USA ($)&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;pu&quot; data-d=&quot;2&quot; data-p=&quot;$&quot; min=&quot;4&quot; max=&quot;7.5&quot; step=&quot;0.01&quot; value=&quot;5.65&quot;&gt;&lt;output data-o=&quot;pu&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;E di mercato&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;E&quot; data-d=&quot;2&quot; min=&quot;0.9&quot; max=&quot;1.6&quot; step=&quot;0.01&quot; value=&quot;1.18&quot;&gt;&lt;output data-o=&quot;E&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;readout&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Perché un Big Mac non basta &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/h4&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Dentro un Big Mac c&#x27;è molto non-tradable&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Affitto del locale e lavoro locale pesano sul prezzo e non si possono arbitrare. Nessuno spedisce hamburger da Milano a New York per guadagnare la differenza.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Tasse e concorrenza locale&lt;/summary&gt;&lt;div&gt;&lt;p&gt;L&#x27;IVA e il diverso potere di mercato di McDonald&#x27;s nei vari paesi spostano il prezzo indipendentemente dal cambio.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Un solo bene non è un basket&lt;/summary&gt;&lt;div&gt;&lt;p&gt;A rigore il Big Mac prova la law of one price su un prodotto. Lo si usa come indicatore semplice della PPP, ma resta una semplificazione. Secondo Pakko e Pollard funziona quasi quanto misure più ampie. &lt;a class=&quot;tag x&quot; href=&quot;https://ideas.repec.org/a/fip/fedlrv/y2003inovp9-28nv.85no.6.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Che differenza c&#x27;è tra law of one price e PPP?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Scopri la risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;La law of one price riguarda un singolo bene; la PPP si ottiene quando vale per tutti i beni di un basket e riguarda quindi i price levels.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Big Mac a €5 nell&#x27;EZ e $6 negli USA. Qual è il cambio di PPP?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Scopri la risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;E = 6 / 5 = 1,20 USD/EUR.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Con gli stessi prezzi il cambio di mercato è 1,30. L&#x27;euro è overvalued o undervalued?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Scopri la risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Overvalued, perché 1,30 &amp;gt; 1,20. In dollari il Big Mac EZ costa 5 × 1,30 = $6,50, più dei $6 americani. Lo scarto è 1,30 / 1,20 − 1 ≈ +8,3%.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché la PPP regge peggio per i servizi che per le materie prime?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Scopri la risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Molti servizi sono non-tradable: non potendoli comprare in un paese e rivendere nell&#x27;altro, manca l&#x27;arbitrage che dovrebbe allineare i prezzi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part ha&quot; id=&quot;p3&quot; data-spy&gt;
  &lt;span class=&quot;partno&quot;&gt;Parte 3&lt;/span&gt;
  &lt;h2&gt;Real exchange rate e competitiveness&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Dato che la PPP non regge, la si usa come metro: quanto i prezzi si allontanano dalla parità dice chi è caro e chi è conveniente.&lt;/p&gt;

  &lt;h3&gt;Dalla PPP al real exchange rate&lt;/h3&gt;
  &lt;p&gt;Se la PPP vale, E = P&lt;sub&gt;US&lt;/sub&gt; / P&lt;sub&gt;EZ&lt;/sub&gt;, e riordinando P&lt;sub&gt;EZ&lt;/sub&gt; · E / P&lt;sub&gt;US&lt;/sub&gt; = 1. Ma la PPP &quot;performs poorly in the real world&quot;, cioè funziona male nella realtà, e le deviazioni descrivono il cambio effettivo. Quel rapporto, che sotto PPP sarebbe 1, diventa allora una misura. &lt;span class=&quot;tag&quot;&gt;slide 5&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;fm&quot;&gt;&lt;span class=&quot;big&quot;&gt;E&lt;sub&gt;R&lt;/sub&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;P&lt;sub&gt;EZ&lt;/sub&gt; · E&lt;/span&gt;&lt;span&gt;P&lt;sub&gt;US&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;
    &lt;small&gt;Real exchange rate: il prezzo del basket EZ convertito in dollari, diviso il prezzo del basket USA.&lt;/small&gt;&lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;
    &lt;span class=&quot;lbl&quot;&gt;Che cosa misura davvero &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/span&gt;
    &lt;p&gt;Facendo le unità di misura: (€/basket EZ) × ($/€) / ($/basket USA) = basket USA per basket EZ. I soldi si semplificano, e resta quanti basket americani &quot;vale&quot; un basket europeo. Per questo si chiama &lt;em&gt;real&lt;/em&gt;: confronta beni con beni, non monete con monete.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;comp&quot;&gt;Che cosa significa per la competitiveness&lt;/h3&gt;
  &lt;p&gt;La slide si chiude con questa domanda. La &lt;b class=&quot;t&quot;&gt;competitiveness&lt;/b&gt; di cui si parla è la competitività di prezzo: quanto i beni di un paese sono convenienti rispetto a quelli di un altro. &lt;span class=&quot;tag&quot;&gt;slide 6&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;E&lt;sub&gt;R&lt;/sub&gt; &amp;gt; 1&lt;/button&gt;&lt;button&gt;E&lt;sub&gt;R&lt;/sub&gt; = 1&lt;/button&gt;&lt;button&gt;E&lt;sub&gt;R&lt;/sub&gt; &amp;lt; 1&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;&lt;strong&gt;I beni EZ costano più di quelli USA.&lt;/strong&gt; &lt;span class=&quot;tag&quot;&gt;slide 6&lt;/span&gt; L&#x27;EZ è meno competitiva: a parità di altre condizioni le sue esportazioni tendono a soffrire e le importazioni dagli USA ad attirare. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;&lt;strong&gt;La PPP vale.&lt;/strong&gt; &lt;span class=&quot;tag&quot;&gt;slide 6&lt;/span&gt; Il basket costa lo stesso nelle due aree: nessuna delle due ha un vantaggio di prezzo.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;&lt;strong&gt;I beni EZ costano meno di quelli USA.&lt;/strong&gt; &lt;span class=&quot;tag&quot;&gt;slide 6&lt;/span&gt; L&#x27;EZ è più competitiva: a parità di altre condizioni le sue esportazioni sono favorite. È il caso del Big Mac: E&lt;sub&gt;R&lt;/sub&gt; = 4,27 × 1,18 / 5,65 ≈ 0,89. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;fig&quot; id=&quot;sim-er&quot;&gt;
    &lt;div class=&quot;presets&quot;&gt;&lt;button type=&quot;button&quot; data-preset=&#x27;{&quot;E&quot;:1.1,&quot;pe&quot;:100,&quot;pu&quot;:110}&#x27;&gt;Metti E&lt;sub&gt;R&lt;/sub&gt; = 1&lt;/button&gt;&lt;button type=&quot;button&quot; data-preset=&#x27;{&quot;E&quot;:1.3,&quot;pe&quot;:100,&quot;pu&quot;:100}&#x27;&gt;EZ cara&lt;/button&gt;&lt;button type=&quot;button&quot; data-preset=&#x27;{&quot;E&quot;:0.95,&quot;pe&quot;:100,&quot;pu&quot;:110}&#x27;&gt;EZ economica&lt;/button&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 400 122&quot; role=&quot;img&quot; aria-label=&quot;Scala del real exchange rate con 1 al centro: a sinistra EZ più economica, a destra EZ più cara&quot;&gt;&lt;/svg&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;E (USD/EUR)&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;E&quot; data-d=&quot;2&quot; min=&quot;0.9&quot; max=&quot;1.4&quot; step=&quot;0.01&quot; value=&quot;1.18&quot;&gt;&lt;output data-o=&quot;E&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;P&lt;sub&gt;EZ&lt;/sub&gt; (€)&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;pe&quot; data-d=&quot;0&quot; min=&quot;90&quot; max=&quot;115&quot; step=&quot;1&quot; value=&quot;100&quot;&gt;&lt;output data-o=&quot;pe&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;P&lt;sub&gt;US&lt;/sub&gt; ($)&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;pu&quot; data-d=&quot;0&quot; min=&quot;90&quot; max=&quot;115&quot; step=&quot;1&quot; value=&quot;110&quot;&gt;&lt;output data-o=&quot;pu&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;readout&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le tre leve&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 400 176&quot; role=&quot;img&quot; aria-label=&quot;Schema: E che sale e P EZ che sale fanno salire E R; P US che sale lo fa scendere&quot;&gt;
      &lt;g style=&quot;fill:var(--tint);stroke:var(--deep)&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;10&quot; width=&quot;125&quot; height=&quot;42&quot; rx=&quot;8&quot;/&gt;&lt;rect x=&quot;5&quot; y=&quot;66&quot; width=&quot;125&quot; height=&quot;42&quot; rx=&quot;8&quot;/&gt;&lt;rect x=&quot;5&quot; y=&quot;122&quot; width=&quot;125&quot; height=&quot;42&quot; rx=&quot;8&quot;/&gt;&lt;rect x=&quot;255&quot; y=&quot;55&quot; width=&quot;140&quot; height=&quot;68&quot; rx=&quot;10&quot;/&gt;&lt;/g&gt;
      &lt;text x=&quot;67&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot;&gt;E sale&lt;/text&gt;&lt;text x=&quot;67&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;P&lt;tspan dy=&quot;3&quot; font-size=&quot;10&quot;&gt;EZ&lt;/tspan&gt;&lt;tspan dy=&quot;-3&quot;&gt; sale&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;67&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot;&gt;P&lt;tspan dy=&quot;3&quot; font-size=&quot;10&quot;&gt;US&lt;/tspan&gt;&lt;tspan dy=&quot;-3&quot;&gt; sale&lt;/tspan&gt;&lt;/text&gt;
      &lt;text class=&quot;ser&quot; x=&quot;325&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot;&gt;E&lt;tspan dy=&quot;4&quot; font-size=&quot;12&quot;&gt;R&lt;/tspan&gt;&lt;/text&gt;&lt;text class=&quot;sm&quot; x=&quot;325&quot; y=&quot;107&quot; text-anchor=&quot;middle&quot;&gt;competitiveness&lt;/text&gt;
      &lt;path d=&quot;M132 31L250 76&quot; fill=&quot;none&quot; stroke=&quot;var(--loss)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;path d=&quot;M132 87L250 89&quot; fill=&quot;none&quot; stroke=&quot;var(--loss)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;path d=&quot;M132 143L250 102&quot; fill=&quot;none&quot; stroke=&quot;var(--gain)&quot; stroke-width=&quot;2.5&quot;/&gt;
      &lt;text x=&quot;190&quot; y=&quot;40&quot; style=&quot;fill:var(--loss);font-weight:600&quot;&gt;+&lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;82&quot; style=&quot;fill:var(--loss);font-weight:600&quot;&gt;+&lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;140&quot; style=&quot;fill:var(--gain);font-weight:600&quot;&gt;−&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;In rosso le leve che alzano E&lt;sub&gt;R&lt;/sub&gt; e tolgono competitiveness all&#x27;EZ; in verde quella che la restituisce.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;E&lt;sub&gt;R&lt;/sub&gt; nel tempo&lt;/th&gt;&lt;th&gt;Nome&lt;/th&gt;&lt;th&gt;Effetto per l&#x27;EZ&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;sale&lt;/td&gt;&lt;td&gt;&lt;b class=&quot;t&quot;&gt;real appreciation&lt;/b&gt; (apprezzamento reale)&lt;/td&gt;&lt;td&gt;perde competitiveness&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;scende&lt;/td&gt;&lt;td&gt;&lt;b class=&quot;t&quot;&gt;real depreciation&lt;/b&gt; (deprezzamento reale)&lt;/td&gt;&lt;td&gt;guadagna competitiveness&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p&gt;I nomi della tabella non compaiono nelle slide ma sono quelli standard. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt; Anche la BCE usa lo stesso verso per i suoi indicatori: una variazione positiva indica meno competitiveness di prezzo. &lt;a class=&quot;tag x&quot; href=&quot;https://data.ecb.europa.eu/key-figures/ecb-interest-rates-and-exchange-rates/harmonised-competitiveness-indicators&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/p&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Che cosa E&lt;sub&gt;R&lt;/sub&gt; non dice&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt; È un rapporto bilaterale: guarda solo gli USA, mentre l&#x27;EZ commercia con molti partner. La versione con tutti i partner, pesati per il commercio, è il real effective exchange rate. Inoltre misura solo i prezzi: qualità, innovazione e produttività entrano solo in modo indiretto.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;P&lt;sub&gt;EZ&lt;/sub&gt; = 100, P&lt;sub&gt;US&lt;/sub&gt; = 120, E = 1,08. Quanto vale E&lt;sub&gt;R&lt;/sub&gt;? Che cosa significa?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Scopri la risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;E&lt;sub&gt;R&lt;/sub&gt; = 100 × 1,08 / 120 = 0,90. Il basket EZ costa il 10% in meno di quello USA, quindi l&#x27;EZ è più competitiva sui prezzi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Se l&#x27;inflazione EZ sale e il resto non cambia, che cosa succede alla competitiveness dell&#x27;EZ?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Scopri la risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;P&lt;sub&gt;EZ&lt;/sub&gt; cresce, quindi E&lt;sub&gt;R&lt;/sub&gt; sale: real appreciation e perdita di competitiveness.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché un E&lt;sub&gt;R&lt;/sub&gt; pari a 1 è il riferimento naturale?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Scopri la risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché è il valore che si avrebbe se valesse la PPP: i price levels, nella stessa valuta, coincidono.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part hm&quot; id=&quot;p4&quot; data-spy&gt;
  &lt;span class=&quot;partno&quot;&gt;Parte 4&lt;/span&gt;
  &lt;h2&gt;Competitiveness rate of change&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Di solito interessa meno il livello e più la direzione: l&#x27;EZ sta guadagnando o perdendo terreno? Per rispondere si passa dai levels ai growth rates.&lt;/p&gt;

  &lt;p&gt;Il &lt;b class=&quot;t&quot;&gt;rate of change&lt;/b&gt; (tasso di variazione) di E&lt;sub&gt;R&lt;/sub&gt; tra il periodo precedente &lt;em&gt;t−1&lt;/em&gt; e quello attuale &lt;em&gt;t&lt;/em&gt; si definisce così: &lt;span class=&quot;tag&quot;&gt;slide 7&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;fm&quot;&gt;ΔE&lt;sub&gt;R&lt;/sub&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;E&lt;sub&gt;R,t&lt;/sub&gt; − E&lt;sub&gt;R,t−1&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;E&lt;sub&gt;R,t−1&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Nel corso Δ indica questo tasso, non la semplice differenza. Il punto che si vede in ṗ&lt;sup&gt;EZ&lt;/sup&gt; e ṗ&lt;sup&gt;US&lt;/sup&gt; sulle slide degli esercizi indica lo stesso concetto per i prezzi, cioè l&#x27;&lt;b class=&quot;t&quot;&gt;inflation&lt;/b&gt; (qui la scrivo anche π). &lt;span class=&quot;tag&quot;&gt;slide 7, 8&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;warn&quot;&gt;
    &lt;span class=&quot;lbl&quot;&gt;Una formula da non usare&lt;/span&gt;
    &lt;p&gt;Sulla slide 7 compare a mano ΔE&lt;sub&gt;R&lt;/sub&gt; = ΔE · ΔP&lt;sub&gt;EU&lt;/sub&gt; / ΔP&lt;sub&gt;US&lt;/sub&gt;, subito prima del passaggio ai log. Il tasso di un prodotto &lt;em&gt;non&lt;/em&gt; è il prodotto dei tassi. Con i dati dell&#x27;Esercizio A darebbe 5,14 × 2 / 2,9 ≈ 3,5%, mentre il valore corretto è 4,22%. La leggo come il tentativo ingenuo che i log correggono, ma è una mia interpretazione: chiedi conferma al tutor. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;La derivazione, passo per passo&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;ol aria-live=&quot;polite&quot;&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Si parte dal livello&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;E&lt;sub&gt;R&lt;/sub&gt; = E · P&lt;sub&gt;EU&lt;/sub&gt; / P&lt;sub&gt;US&lt;/sub&gt;&lt;/div&gt;Un prodotto e un rapporto: scomodi da far variare nel tempo. &lt;span class=&quot;tag&quot;&gt;slide 7&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Si prende il log&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;log(E&lt;sub&gt;R&lt;/sub&gt;) = log(E) + log(P&lt;sub&gt;EU&lt;/sub&gt;) − log(P&lt;sub&gt;US&lt;/sub&gt;)&lt;/div&gt;I log trasformano i prodotti in somme e i rapporti in differenze: log(a·b) = log a + log b. &lt;span class=&quot;tag&quot;&gt;slide 7&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Si usa la proprietà chiave&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;Δx = ∂log(x) / ∂t&lt;/div&gt;La derivata nel tempo del log di una variabile è il suo tasso di crescita, perché ∂log(x)/∂t = (∂x/∂t) / x. &lt;span class=&quot;tag&quot;&gt;slide 7&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Si deriva ogni termine&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;∂log(E&lt;sub&gt;R&lt;/sub&gt;)/∂t = ∂log(E)/∂t + [∂log(P&lt;sub&gt;EU&lt;/sub&gt;)/∂t − ∂log(P&lt;sub&gt;US&lt;/sub&gt;)/∂t]&lt;/div&gt;Sulla slide manca per svista il ∂ nell&#x27;ultimo termine. &lt;span class=&quot;tag&quot;&gt;slide 7&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Si leggono i pezzi&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;ΔE&lt;sub&gt;R&lt;/sub&gt; = ΔE + (π&lt;sub&gt;EZ&lt;/sub&gt; − π&lt;sub&gt;US&lt;/sub&gt;)&lt;/div&gt;Variazione del cambio nominale più &lt;b class=&quot;t&quot;&gt;inflation differential&lt;/b&gt; (differenziale di inflazione tra le due aree). &lt;span class=&quot;tag&quot;&gt;slide 7, 10&lt;/span&gt;&lt;/li&gt;
    &lt;/ol&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Scomponi la variazione&lt;/h3&gt;
  &lt;div class=&quot;fig&quot; id=&quot;sim-wf&quot;&gt;
    &lt;div class=&quot;presets&quot;&gt;&lt;button type=&quot;button&quot; data-preset=&#x27;{&quot;dE&quot;:5.14,&quot;a&quot;:2,&quot;b&quot;:2.9}&#x27;&gt;Esercizio A&lt;/button&gt;&lt;button type=&quot;button&quot; data-preset=&#x27;{&quot;dE&quot;:-8.33,&quot;a&quot;:1,&quot;b&quot;:4}&#x27;&gt;Esercizio B&lt;/button&gt;&lt;button type=&quot;button&quot; data-preset=&#x27;{&quot;dE&quot;:0.9,&quot;a&quot;:2,&quot;b&quot;:2.9}&#x27;&gt;Relative PPP&lt;/button&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 400 232&quot; role=&quot;img&quot; aria-label=&quot;Grafico a cascata: variazione del cambio più inflazione EZ meno inflazione USA uguale variazione del real exchange rate&quot;&gt;&lt;/svg&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;ΔE&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;dE&quot; data-d=&quot;2&quot; data-u=&quot;%&quot; min=&quot;-12&quot; max=&quot;12&quot; step=&quot;0.01&quot; value=&quot;5.14&quot;&gt;&lt;output data-o=&quot;dE&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;π&lt;sub&gt;EZ&lt;/sub&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;a&quot; data-d=&quot;1&quot; data-u=&quot;%&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;2&quot;&gt;&lt;output data-o=&quot;a&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;π&lt;sub&gt;US&lt;/sub&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;b&quot; data-d=&quot;1&quot; data-u=&quot;%&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;2.9&quot;&gt;&lt;output data-o=&quot;b&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;readout&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Il pulsante &quot;Relative PPP&quot; mostra il caso in cui il cambio compensa esattamente l&#x27;inflation differential: ΔE&lt;sub&gt;R&lt;/sub&gt; = 0. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;

  &lt;h3&gt;Perché è un&#x27;approssimazione&lt;/h3&gt;
  &lt;p&gt;La formula con i log è esatta per variazioni infinitesime. Con dati annuali usiamo tassi discreti, e log(1 + x) ≈ x vale bene solo se x è piccolo. La formula esatta è (1 + ΔE&lt;sub&gt;R&lt;/sub&gt;) = (1 + ΔE)(1 + π&lt;sub&gt;EZ&lt;/sub&gt;) / (1 + π&lt;sub&gt;US&lt;/sub&gt;). &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;fig&quot; id=&quot;sim-log&quot;&gt;
    &lt;svg viewBox=&quot;0 0 400 225&quot; role=&quot;img&quot; aria-label=&quot;Curva del logaritmo di 1 più x confrontata con la retta x&quot;&gt;&lt;/svg&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;Tasso x&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;x&quot; data-d=&quot;1&quot; data-u=&quot;%&quot; min=&quot;-30&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;5&quot;&gt;&lt;output data-o=&quot;x&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;readout&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Perché conta in European Economic Policy &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;EZ contro USA&lt;/button&gt;&lt;button&gt;Dentro l&#x27;eurozona&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;Il cambio è libero di muoversi, quindi la competitiveness può cambiare per due vie: ΔE e inflation differential. In pratica ΔE spesso domina, perché il cambio si muove più dei prezzi nel breve periodo.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;Tra Italia e Germania non esiste un cambio: E è fissa, quindi ΔE = 0 e resta solo&lt;/p&gt;
      &lt;div class=&quot;fm&quot;&gt;ΔE&lt;sub&gt;R&lt;/sub&gt; = π&lt;sub&gt;IT&lt;/sub&gt; − π&lt;sub&gt;DE&lt;/sub&gt;&lt;/div&gt;
      &lt;p&gt;Con il 3% in Italia e l&#x27;1% in Germania, l&#x27;Italia perde circa 2 punti di competitiveness l&#x27;anno, e la perdita si accumula. Davanti a un &lt;b class=&quot;t&quot;&gt;asymmetric shock&lt;/b&gt; (shock che colpisce un paese più degli altri) un paese dell&#x27;euro non può svalutare: deve aggiustarsi tramite prezzi e salari. È uno dei temi della teoria dell&#x27;&lt;b class=&quot;t&quot;&gt;optimum currency area&lt;/b&gt; (le condizioni per cui conviene condividere una moneta).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;ΔE = +3%, π&lt;sub&gt;EZ&lt;/sub&gt; = 2%, π&lt;sub&gt;US&lt;/sub&gt; = 4%. Quanto vale ΔE&lt;sub&gt;R&lt;/sub&gt;, e che cosa significa?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Scopri la risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;3 + 2 − 4 = +1%. E&lt;sub&gt;R&lt;/sub&gt; sale: l&#x27;EZ perde circa l&#x27;1% di competitiveness. Il vantaggio di inflazione non compensa l&#x27;apprezzamento nominale.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Perché per passare ai tassi si usano i log?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Scopri la risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché trasformano prodotti e rapporti in somme e differenze, e la derivata del log è il tasso di crescita. La formula diventa additiva.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Quando l&#x27;approssimazione additiva è meno affidabile?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Scopri la risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Con variazioni grandi: lo scarto cresce circa come il quadrato di x. Nell&#x27;Esercizio B, con ΔE di circa −8%, è molto più ampio che nell&#x27;Esercizio A.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;p5&quot; data-spy&gt;
  &lt;span class=&quot;partno&quot;&gt;Parte 5&lt;/span&gt;
  &lt;h2&gt;Esercizi A e B&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;La richiesta è la stessa per entrambi: commentare la variazione della competitiveness bilaterale EZ-USA calcolando i real exchange rate (1) in levels e (2) con l&#x27;approssimazione log / growth rate. &lt;span class=&quot;tag&quot;&gt;slide 9&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Esercizio A&lt;/button&gt;&lt;button&gt;Esercizio B&lt;/button&gt;&lt;button&gt;Prova tu&lt;/button&gt;&lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Dati &lt;span class=&quot;tag&quot;&gt;slide 8&lt;/span&gt;&lt;/th&gt;&lt;th&gt;t−1 (set 2024)&lt;/th&gt;&lt;th&gt;t (set 2025)&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;E (USD/EUR)&lt;/td&gt;&lt;td&gt;1,11618&lt;/td&gt;&lt;td&gt;1,1736&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;P&lt;sub&gt;EZ&lt;/sub&gt;, inflazione 2,0%&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;da calcolare&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;P&lt;sub&gt;US&lt;/sub&gt;, inflazione 2,9%&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;da calcolare&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;stepper&quot;&gt;
        &lt;ol aria-live=&quot;polite&quot;&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;1 · Ricava la regola per i prezzi&lt;/span&gt;Dalla definizione ΔP = (P&lt;sub&gt;t&lt;/sub&gt; − P&lt;sub&gt;t−1&lt;/sub&gt;) / P&lt;sub&gt;t−1&lt;/sub&gt; si isola P&lt;sub&gt;t&lt;/sub&gt;:&lt;div class=&quot;fm&quot;&gt;P&lt;sub&gt;t&lt;/sub&gt; = P&lt;sub&gt;t−1&lt;/sub&gt; (1 + ΔP)&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;slide 8&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;2 · Calcola i prezzi in t&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;P&lt;sub&gt;EZ,t&lt;/sub&gt; = 100 × 1,02 = 102&lt;br&gt;P&lt;sub&gt;US,t&lt;/sub&gt; = 100 × 1,029 = 102,9&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;slide 8&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;3 · Levels: E&lt;sub&gt;R&lt;/sub&gt; in t−1&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;E&lt;sub&gt;R,t−1&lt;/sub&gt; = 1,11618 × 100 / 100 = 1,11618&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;slide 10&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;4 · Levels: E&lt;sub&gt;R&lt;/sub&gt; in t&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;E&lt;sub&gt;R,t&lt;/sub&gt; = 1,1736 × 102 / 102,9 = 1,1633&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;slide 10&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;5 · Levels: la variazione&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;ΔE&lt;sub&gt;R&lt;/sub&gt; = (1,1633 − 1,11618) / 1,11618 = 0,0422 = 4,22%&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;slide 10&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;6 · Rates: la scomposizione&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;ΔE = (1,1736 − 1,11618) / 1,11618 = 5,14%&lt;br&gt;ΔE&lt;sub&gt;R&lt;/sub&gt; = 5,14 + 2 − 2,9 = 4,24%&lt;/div&gt;Le due vie differiscono di 0,02 punti. &lt;span class=&quot;tag&quot;&gt;slide 10&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;7 · Il commento&lt;/span&gt;E&lt;sub&gt;R&lt;/sub&gt; sale di circa il 4,2%: &lt;b class=&quot;t&quot;&gt;l&#x27;EZ perde competitiveness&lt;/b&gt; rispetto agli USA. L&#x27;apprezzamento nominale dell&#x27;euro (+5,14%) pesa più del vantaggio dato dalla minore inflazione EZ (0,9 punti). Le slide non scrivono il commento: questa è la mia lettura dei numeri. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/li&gt;
        &lt;/ol&gt;
        &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;figure class=&quot;fig&quot;&gt;&lt;svg data-wf=&quot;5.14,2,2.9&quot; viewBox=&quot;0 0 400 232&quot; role=&quot;img&quot; aria-label=&quot;Esercizio A: più 5,14 più 2 meno 2,9 uguale più 4,24&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Esercizio A in punti percentuali: rosso spinge E&lt;sub&gt;R&lt;/sub&gt; in su (perdita di competitiveness), verde in giù.&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;div class=&quot;warn&quot;&gt;
        &lt;span class=&quot;lbl&quot;&gt;Tre dettagli che le slide danno per scontati &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/span&gt;
        &lt;ul&gt;
          &lt;li&gt;&lt;strong&gt;Con gli indici conta la variazione, non il livello.&lt;/strong&gt; I prezzi base = 100 sono una convenzione, non costi effettivi. E&lt;sub&gt;R,t−1&lt;/sub&gt; = 1,116 &lt;em&gt;non&lt;/em&gt; vuol dire che l&#x27;EZ costi l&#x27;11,6% in più: la frase &quot;E&lt;sub&gt;R&lt;/sub&gt; &amp;gt; 1 = EZ più cara&quot; richiede prezzi veri, come per il Big Mac.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Le date non coincidono del tutto.&lt;/strong&gt; I cambi sono di settembre, l&#x27;inflazione è sui 12 mesi ad agosto 2025. Per un esercizio è un&#x27;approssimazione accettabile.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;I valori sono realistici.&lt;/strong&gt; Eurostat riporta il 2,0% per l&#x27;eurozona e il BLS il 2,9% per gli USA ad agosto 2025 (vedi &lt;a href=&quot;#more&quot;&gt;Per approfondire&lt;/a&gt;). &lt;a class=&quot;tag x&quot; href=&quot;https://www.bls.gov/opub/ted/2025/consumer-prices-up-2-9-percent-from-august-2024-to-august-2025.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Dati &lt;span class=&quot;tag&quot;&gt;slide 11&lt;/span&gt;&lt;/th&gt;&lt;th&gt;t−1&lt;/th&gt;&lt;th&gt;t&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;E (USD/EUR)&lt;/td&gt;&lt;td&gt;1,20&lt;/td&gt;&lt;td&gt;1,10&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;P&lt;sub&gt;EZ&lt;/sub&gt;, inflazione 1%&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;da calcolare&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;P&lt;sub&gt;US&lt;/sub&gt;, inflazione 4%&lt;/td&gt;&lt;td&gt;110&lt;/td&gt;&lt;td&gt;da calcolare&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;La slide riporta solo il risultato: ΔE&lt;sub&gt;R&lt;/sub&gt; = −11,3%. Prova prima senza aiuti e poi controlla: i passaggi qui sotto sono miei. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;stepper&quot;&gt;
        &lt;ol aria-live=&quot;polite&quot;&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;1 · Rates, il metodo rapido&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;ΔE = (1,10 − 1,20) / 1,20 = −8,33%&lt;br&gt;ΔE&lt;sub&gt;R&lt;/sub&gt; = −8,33 + 1 − 4 = −11,33%&lt;/div&gt;È il −11,3% della slide. &lt;span class=&quot;tag&quot;&gt;slide 11&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;2 · Levels: i prezzi in t&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;P&lt;sub&gt;EZ,t&lt;/sub&gt; = 100 × 1,01 = 101&lt;br&gt;P&lt;sub&gt;US,t&lt;/sub&gt; = 110 × 1,04 = 114,4&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;3 · Levels: E&lt;sub&gt;R&lt;/sub&gt;&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;E&lt;sub&gt;R,t−1&lt;/sub&gt; = 1,20 × 100 / 110 = 1,0909&lt;br&gt;E&lt;sub&gt;R,t&lt;/sub&gt; = 1,10 × 101 / 114,4 = 0,9711&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;4 · Levels: la variazione&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;ΔE&lt;sub&gt;R&lt;/sub&gt; = (0,9711 − 1,0909) / 1,0909 = −10,98%&lt;/div&gt;Lo scarto con il metodo rapido è di 0,35 punti, molto più che nell&#x27;Esercizio A, perché ΔE è grande.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;5 · Il commento&lt;/span&gt;E&lt;sub&gt;R&lt;/sub&gt; scende di circa l&#x27;11%: &lt;b class=&quot;t&quot;&gt;l&#x27;EZ guadagna competitiveness&lt;/b&gt;. Questa volta i due canali vanno nella stessa direzione: l&#x27;euro si deprezza (−8,33%) e l&#x27;inflazione EZ è più bassa di 3 punti. La base 110 di P&lt;sub&gt;US&lt;/sub&gt; non influisce sul risultato.&lt;/li&gt;
        &lt;/ol&gt;
        &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;figure class=&quot;fig&quot;&gt;&lt;svg data-wf=&quot;-8.33,1,4&quot; viewBox=&quot;0 0 400 232&quot; role=&quot;img&quot; aria-label=&quot;Esercizio B: meno 8,33 più 1 meno 4 uguale meno 11,33&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Esercizio B in punti percentuali.&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;Esercizio inventato per allenarti, non presente nelle slide. &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Dati&lt;/th&gt;&lt;th&gt;t−1&lt;/th&gt;&lt;th&gt;t&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;E (USD/EUR)&lt;/td&gt;&lt;td&gt;1,30&lt;/td&gt;&lt;td&gt;1,25&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;P&lt;sub&gt;EZ&lt;/sub&gt;, inflazione 3%&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;da calcolare&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;P&lt;sub&gt;US&lt;/sub&gt;, inflazione 1%&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;da calcolare&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Soluzione in levels&lt;/summary&gt;&lt;div&gt;&lt;p&gt;P&lt;sub&gt;EZ,t&lt;/sub&gt; = 103 e P&lt;sub&gt;US,t&lt;/sub&gt; = 101. E&lt;sub&gt;R,t−1&lt;/sub&gt; = 1,30 e E&lt;sub&gt;R,t&lt;/sub&gt; = 1,25 × 103 / 101 = 1,2748. ΔE&lt;sub&gt;R&lt;/sub&gt; = (1,2748 − 1,30) / 1,30 = −1,94%.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Soluzione con i rates&lt;/summary&gt;&lt;div&gt;&lt;p&gt;ΔE = −3,85%. ΔE&lt;sub&gt;R&lt;/sub&gt; = −3,85 + 3 − 1 = −1,85%.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Commento&lt;/summary&gt;&lt;div&gt;&lt;p&gt;L&#x27;EZ guadagna un po&#x27; di competitiveness: il deprezzamento nominale è in parte eroso dalla maggiore inflazione EZ.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il foglio riassuntivo&lt;/h3&gt;
  &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Concetto&lt;/th&gt;&lt;th&gt;Formula&lt;/th&gt;&lt;th&gt;Da ricordare&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Conversione&lt;/td&gt;&lt;td&gt;P&lt;sub&gt;EZ&lt;/sub&gt; · E oppure P&lt;sub&gt;US&lt;/sub&gt; / E&lt;/td&gt;&lt;td&gt;E in USD/EUR: sale = euro più forte&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Law of one price&lt;/td&gt;&lt;td&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;EZ&lt;/sub&gt; · E = P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;un bene&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;PPP&lt;/td&gt;&lt;td&gt;E = P&lt;sub&gt;US&lt;/sub&gt; / P&lt;sub&gt;EZ&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;tutto il basket&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Real exchange rate&lt;/td&gt;&lt;td&gt;E&lt;sub&gt;R&lt;/sub&gt; = P&lt;sub&gt;EZ&lt;/sub&gt; · E / P&lt;sub&gt;US&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;&amp;gt; 1 EZ più cara, &amp;lt; 1 più economica&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Prezzo futuro&lt;/td&gt;&lt;td&gt;P&lt;sub&gt;t&lt;/sub&gt; = P&lt;sub&gt;t−1&lt;/sub&gt; (1 + ΔP)&lt;/td&gt;&lt;td&gt;da inflazione a livello&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Rate of change&lt;/td&gt;&lt;td&gt;ΔE&lt;sub&gt;R&lt;/sub&gt; ≈ ΔE + π&lt;sub&gt;EZ&lt;/sub&gt; − π&lt;sub&gt;US&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;positivo = perde competitiveness&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Nell&#x27;Esercizio A l&#x27;euro si apprezza del 5,14% ma E&lt;sub&gt;R&lt;/sub&gt; sale solo del 4,2% circa. Perché meno?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Scopri la risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché l&#x27;inflazione EZ è più bassa di quella USA di 0,9 punti: questo recupera una parte della perdita dovuta al cambio.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Nell&#x27;Esercizio B il calcolo in levels dà −10,98% e quello con i rates −11,33%. Perché, e quale è esatto?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Scopri la risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il calcolo in levels è esatto; quello additivo è un&#x27;approssimazione, meno precisa con variazioni ampie.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Nell&#x27;Esercizio A si può dire che nel 2025 l&#x27;EZ è più cara degli USA perché E&lt;sub&gt;R&lt;/sub&gt; = 1,16 &amp;gt; 1?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Scopri la risposta&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. I prezzi sono indici con base 100 scelta per convenzione, quindi il livello di E&lt;sub&gt;R&lt;/sub&gt; non è un confronto tra prezzi effettivi. Si può commentare solo la variazione.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;more&quot; data-spy style=&quot;border-bottom:0&quot;&gt;
  &lt;span class=&quot;partno&quot;&gt;Fonti esterne&lt;/span&gt;
  &lt;h2&gt;Per approfondire&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Le slide citano per nome un solo riferimento, il Big Mac Index. Qui sotto ci sono quello, le fonti probabili dei dati dell&#x27;Esercizio A e alcune letture utili.&lt;/p&gt;
  &lt;p&gt;Tutto in questa sezione viene dal web e non dalle slide. Ho controllato i dati tramite la ricerca web, senza aprire integralmente i documenti.&lt;/p&gt;

  &lt;h3&gt;Citato nelle slide&lt;/h3&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Big Mac Index&lt;/h4&gt;
      &lt;p class=&quot;who&quot;&gt;The Economist, dal settembre 1986 &lt;span class=&quot;tag&quot;&gt;slide 4&lt;/span&gt; &lt;span class=&quot;tag x&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Che cosa contiene:&lt;/strong&gt; prezzi del Big Mac nei vari paesi, cambio implicito e sopra/sottovalutazione delle valute. Il repository ha dati e codice di calcolo, con un indice grezzo e uno aggiustato per il PIL pro capite.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; è l&#x27;esempio della slide 4 e permette di rifare il calcolo su altri paesi e anni. Il dataset è il posto giusto per verificare i valori di luglio 2021: la ricerca web non mi ha permesso di confermare €4,27 e $5,65.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://github.com/TheEconomist/big-mac-data&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Dati e codice su GitHub&lt;/a&gt; · &lt;a href=&quot;https://www.economist.com/big-mac-index&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina di The Economist&lt;/a&gt; (non è comparsa nei risultati di ricerca: indirizzo da verificare) · &lt;a href=&quot;https://en.wikipedia.org/wiki/Big_Mac_Index&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Voce di Wikipedia&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Da dove possono venire i dati dell&#x27;Esercizio A&lt;/h3&gt;
  &lt;p&gt;Le slide non indicano la fonte dei dati: questi abbinamenti sono una mia ipotesi.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Euro area annual inflation, agosto 2025&lt;/h4&gt;
      &lt;p class=&quot;who&quot;&gt;Eurostat, Euro indicators, 17 settembre 2025 &lt;span class=&quot;tag x&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Che cosa contiene:&lt;/strong&gt; il dato definitivo dell&#x27;inflazione HICP (l&#x27;indice armonizzato europeo) dell&#x27;eurozona: 2,0%, contro una stima flash del 2,1%.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; coincide con il 2,0% della slide 8 e mostra la differenza tra stima preliminare e dato finale.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://ec.europa.eu/eurostat/web/products-euro-indicators/w/2-17092025-ap&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Comunicato Eurostat&lt;/a&gt; · &lt;a href=&quot;https://ec.europa.eu/eurostat/en/web/products-euro-indicators/w/2-02092025-ap&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Stima flash&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Consumer prices up 2.9 percent, agosto 2024 - agosto 2025&lt;/h4&gt;
      &lt;p class=&quot;who&quot;&gt;U.S. Bureau of Labor Statistics, The Economics Daily &lt;span class=&quot;tag x&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Che cosa contiene:&lt;/strong&gt; la variazione a 12 mesi del Consumer Price Index americano.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; coincide con il 2,9% della slide 8. HICP e CPI non sono costruiti in modo identico, quindi il confronto tra i due è buono ma non perfetto.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.bls.gov/opub/ted/2025/consumer-prices-up-2-9-percent-from-august-2024-to-august-2025.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina del BLS&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;US dollar/Euro, serie mensile&lt;/h4&gt;
      &lt;p class=&quot;who&quot;&gt;Banca Centrale Europea, ECB Data Portal, serie EXR.M.USD.EUR.SP00.A &lt;span class=&quot;tag x&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Che cosa contiene:&lt;/strong&gt; la media mensile del cambio dollaro/euro, dal 1999.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; usa la stessa quotazione del corso (USD per 1 EUR) ed è il posto giusto per controllare 1,11618 e 1,1736. I due valori restano da confermare: la ricerca ha restituito solo singoli cambi giornalieri di settembre 2025, intorno a 1,17.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://data.ecb.europa.eu/data/datasets/EXR/EXR.M.USD.EUR.SP00.A&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Serie sul Data Portal&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Letture utili, non citate nelle slide&lt;/h3&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;The Purchasing Power Parity Puzzle&lt;/h4&gt;
      &lt;p class=&quot;who&quot;&gt;Kenneth Rogoff, &lt;em&gt;Journal of Economic Literature&lt;/em&gt;, 34(2), 1996, pp. 647-668 &lt;span class=&quot;tag x&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Che cosa contiene:&lt;/strong&gt; la rassegna classica sulla PPP come ancora di lungo periodo. Il &quot;puzzle&quot; è conciliare l&#x27;enorme volatilità di breve periodo dei real exchange rate con la lentezza con cui gli shock si riassorbono.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; approfondisce il &quot;PPP performs poorly in the real world&quot; della slide 5.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://ideas.repec.org/a/aea/jeclit/v34y1996i2p647-668.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda su IDEAS/RePEc&lt;/a&gt; · &lt;a href=&quot;https://web.williams.edu/Economics/macro/rogoff.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Burgernomics: A Big Mac Guide to Purchasing Power Parity&lt;/h4&gt;
      &lt;p class=&quot;who&quot;&gt;Michael R. Pakko e Patricia S. Pollard, &lt;em&gt;Federal Reserve Bank of St. Louis Review&lt;/em&gt;, 85(6), 2003, pp. 9-28 &lt;span class=&quot;tag x&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Che cosa contiene:&lt;/strong&gt; usa il Big Mac per spiegare i principi della PPP e confronta l&#x27;indice con misure di prezzo più ampie. Alcuni cataloghi indicano le pagine 9-27.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; spiega in modo accessibile perché la &quot;McParity&quot; spesso non vale, e collega le slide 4 e 5.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://ideas.repec.org/a/fip/fedlrv/y2003inovp9-28nv.85no.6.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda su IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Harmonised competitiveness indicators&lt;/h4&gt;
      &lt;p class=&quot;who&quot;&gt;Banca Centrale Europea, ECB Data Portal &lt;span class=&quot;tag x&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Che cosa contiene:&lt;/strong&gt; misure di competitiveness di prezzo e di costo dei paesi dell&#x27;euro, coerenti con il real effective exchange rate dell&#x27;euro verso 40 partner commerciali.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; è la versione ufficiale di E&lt;sub&gt;R&lt;/sub&gt; con molti partner, e ha lo stesso verso: sale = meno competitiveness.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://data.ecb.europa.eu/key-figures/ecb-interest-rates-and-exchange-rates/harmonised-competitiveness-indicators&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina della BCE&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;note&quot;&gt;
    &lt;span class=&quot;lbl&quot;&gt;Altri materiali del corso&lt;/span&gt;
    &lt;p&gt;Da questa sessione non ho potuto elencare la cartella &lt;code&gt;corso/&lt;/code&gt;, e i pochi nomi di file che ho provato non esistono. Nessun contenuto di questa pagina viene quindi da altri file del corso. I collegamenti con il resto del programma, come optimum currency area e asymmetric shock, sono &lt;span class=&quot;tag i&quot;&gt;integrazione&lt;/span&gt;: verificali su lezioni e programma.&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

      c+=it[1];

      h+=&#x27;&lt;text class=&quot;sm&quot; x=&quot;&#x27;+(x+35)+&#x27;&quot; y=&quot;224&quot; text-anchor=&quot;middle&quot;&gt;&#x27;+it[0]+&#x27;&lt;/text&gt;&#x27;;
    });
