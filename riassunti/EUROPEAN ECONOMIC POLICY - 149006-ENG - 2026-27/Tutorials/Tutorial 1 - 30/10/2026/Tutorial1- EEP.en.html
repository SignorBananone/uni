    &lt;a href=&quot;#more&quot;&gt;&lt;text x=&quot;170&quot; y=&quot;672&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--accent)&quot;&gt;Further reading: external sources →&lt;/text&gt;&lt;/a&gt;

  &lt;div class=&quot;note&quot;&gt;
    &lt;span class=&quot;lbl&quot;&gt;The thread in three lines&lt;/span&gt;
    &lt;p&gt;Comparing prices across two countries requires a common currency, hence &lt;em&gt;E&lt;/em&gt;. If converted prices were equal everywhere, PPP would hold, but in reality this is not the case. The distance from PPP is measured by the real exchange rate &lt;em&gt;E&lt;sub&gt;R&lt;/sub&gt;&lt;/em&gt;: when it rises, the eurozone loses competitiveness, and its change can be decomposed into the change in the exchange rate plus the inflation differential.&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part hs&quot; id=&quot;p1&quot; data-spy&gt;
  &lt;span class=&quot;partno&quot;&gt;Part 1&lt;/span&gt;
  &lt;h2&gt;The nominal exchange rate&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;A price in euros and a price in dollars cannot be compared directly. The exchange rate is the translator that brings them into the same unit of measurement.&lt;/p&gt;

  &lt;div class=&quot;defs&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;strong&gt;E: nominal bilateral exchange rate&lt;/strong&gt;This is the &lt;em&gt;nominal&lt;/em&gt; exchange rate (expressed in money, without taking the prices of goods into account) and it is &lt;em&gt;bilateral&lt;/em&gt; (between two currencies only). &lt;span class=&quot;tag&quot;&gt;slide 2&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;strong&gt;Quotation used in the course&lt;/strong&gt;The number of units of foreign currency obtained with 1 unit of national currency. With the eurozone (EZ) as &quot;home&quot;, E = 1.18 USD/EUR means 1 € = 1.18 $. &lt;span class=&quot;tag&quot;&gt;slide 2, 4&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;warn&quot;&gt;
    &lt;span class=&quot;lbl&quot;&gt;Mind the wording on the slide&lt;/span&gt;
    &lt;p&gt;The slide says &quot;the price of a foreign currency in terms of 1 unit of national currency&quot;. Read literally, this looks like the price of the dollar, but the exercises use USD/EUR: E is the number of dollars per 1 euro, that is, the price of the &lt;em&gt;euro&lt;/em&gt; expressed in dollars. It is always advisable to reason in terms of units of measurement. &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;What it is for: comparing the same good&lt;/h3&gt;
  &lt;p&gt;E is used to compare the price of the same good &lt;em&gt;i&lt;/em&gt; sold in two countries. The conversion can run in either direction, and the outcome of the comparison does not change. &lt;span class=&quot;tag&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Everything in dollars&lt;/button&gt;&lt;button&gt;Everything in euros&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;div class=&quot;fm&quot;&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt; vs. P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;EZ&lt;/sub&gt; · E&lt;small&gt;The price in euros, multiplied by dollars per euro, becomes a price in dollars: (€) × ($/€) = $.&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;div class=&quot;fm&quot;&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;EZ&lt;/sub&gt; vs. P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt; / E&lt;small&gt;The price in dollars, divided by dollars per euro, becomes a price in euros: ($) / ($/€) = €.&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 400 126&quot; role=&quot;img&quot; aria-label=&quot;Diagram: the price in euros becomes the price in dollars by multiplying by E, and converts back by dividing by E&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;38&quot; width=&quot;100&quot; height=&quot;50&quot; rx=&quot;8&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;
      &lt;text class=&quot;ser&quot; x=&quot;60&quot; y=&quot;69&quot; text-anchor=&quot;middle&quot;&gt;P in €&lt;/text&gt;
      &lt;rect x=&quot;290&quot; y=&quot;38&quot; width=&quot;100&quot; height=&quot;50&quot; rx=&quot;8&quot; style=&quot;fill:var(--tint);stroke:var(--deep)&quot;/&gt;
      &lt;text class=&quot;ser&quot; x=&quot;340&quot; y=&quot;69&quot; text-anchor=&quot;middle&quot;&gt;P in $&lt;/text&gt;
      &lt;path d=&quot;M115 52H282&quot; fill=&quot;none&quot; stroke=&quot;var(--deep)&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M282 47l8 5-8 5z&quot; style=&quot;fill:var(--deep)&quot;/&gt;
      &lt;path d=&quot;M285 76H118&quot; fill=&quot;none&quot; stroke=&quot;var(--deep)&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M118 71l-8 5 8 5z&quot; style=&quot;fill:var(--deep)&quot;/&gt;
      &lt;text x=&quot;200&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;× E&lt;/text&gt;
      &lt;text x=&quot;200&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;÷ E&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Whether to multiply or divide depends only on the direction: the units of measurement tell you which operation is needed.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Try the exchange rate&lt;/h3&gt;
  &lt;div class=&quot;fig&quot; id=&quot;sim-e&quot;&gt;
    &lt;svg viewBox=&quot;0 0 400 160&quot; role=&quot;img&quot; aria-label=&quot;Bars: how many dollars 100 euros are worth and how many euros 100 dollars are worth at the chosen exchange rate&quot;&gt;&lt;/svg&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;E (USD/EUR)&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;E&quot; data-d=&quot;2&quot; min=&quot;0.8&quot; max=&quot;1.6&quot; step=&quot;0.01&quot; value=&quot;1.18&quot;&gt;&lt;output data-o=&quot;E&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;readout&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;With this quotation, &lt;b class=&quot;t&quot;&gt;a rising E = an appreciating euro&lt;/b&gt;. With the inverse quotation (EUR/USD) the direction is reversed, and this is the most common source of error. &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;With E = 1.25 USD/EUR, how much does a good costing €80 in the EZ cost in dollars?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Show the answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;80 × 1.25 = $100. To go from the price in euros to the price in dollars, multiply by E.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;E moves from 1.10 to 1.20 USD/EUR. Does the euro appreciate or depreciate?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Show the answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It appreciates: one euro buys more dollars. As a result, for a given price in euros, EZ goods cost more to an American buyer.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;A good costs $60 in the US and E = 1.20. How much does it cost in euros?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Show the answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;60 / 1.20 = €50. To go from the price in dollars to the price in euros, divide by E.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part ho&quot; id=&quot;p2&quot; data-spy&gt;
  &lt;span class=&quot;partno&quot;&gt;Part 2&lt;/span&gt;
  &lt;h2&gt;Law of one price, PPP and Big Mac&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;If markets were perfectly integrated, the same good should cost the same everywhere. From this idea we derive a &quot;theoretical&quot; exchange rate to compare with the actual one.&lt;/p&gt;

  &lt;h3 id=&quot;loop&quot;&gt;Law of one price&lt;/h3&gt;
  &lt;p&gt;The &lt;b class=&quot;t&quot;&gt;law of one price&lt;/b&gt; states that a single good &lt;em&gt;i&lt;/em&gt;, once converted into the same currency, has the same price in both countries. The three expressions are equivalent. &lt;span class=&quot;tag&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;fm&quot;&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;EZ&lt;/sub&gt; · E = P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt; &amp;nbsp;⇔&amp;nbsp; P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt; / E = P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;EZ&lt;/sub&gt; &amp;nbsp;⇔&amp;nbsp; E = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;EZ&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt;
    &lt;small&gt;The last form is handwritten on the slide, where &quot;EZ&quot; is written as &quot;EU&quot;: in the annotations the two subscripts refer to the same area.&lt;/small&gt;&lt;/div&gt;

  &lt;p&gt;The slides do not explain &lt;em&gt;why&lt;/em&gt; it should hold. The mechanism is &lt;b class=&quot;t&quot;&gt;arbitrage&lt;/b&gt;: buying where a good costs less and reselling it where it costs more. &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;&lt;svg data-arb viewBox=&quot;0 0 400 160&quot; role=&quot;img&quot; aria-label=&quot;Bars: the dollar price of the good in the EZ and in the US, converging step by step&quot;&gt;&lt;/svg&gt;
  &lt;figcaption&gt;Invented figures, used to illustrate the mechanism.&lt;/figcaption&gt;&lt;/figure&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;ol aria-live=&quot;polite&quot;&gt;
      &lt;li data-a=&quot;118&quot; data-b=&quot;130&quot;&gt;&lt;span class=&quot;st&quot;&gt;The price differs&lt;/span&gt;The good costs €100 in the EZ, that is, $118 with E = 1.18. In the US it costs $130.&lt;/li&gt;
      &lt;li data-a=&quot;118&quot; data-b=&quot;130&quot;&gt;&lt;span class=&quot;st&quot;&gt;Arbitrage kicks in&lt;/span&gt;It pays to buy in the EZ and resell in the US, with a margin of $12 per unit.&lt;/li&gt;
      &lt;li data-a=&quot;122&quot; data-b=&quot;126&quot;&gt;&lt;span class=&quot;st&quot;&gt;Prices move&lt;/span&gt;Demand pushes up the price in the EZ and the extra supply pushes down the US price. Demand for euros can also push up E.&lt;/li&gt;
      &lt;li data-a=&quot;124&quot; data-b=&quot;124&quot;&gt;&lt;span class=&quot;st&quot;&gt;The margin disappears&lt;/span&gt;When the converted prices coincide there is no further gain and arbitrage stops: the law of one price holds.&lt;/li&gt;
    &lt;/ol&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;The mechanism works only under certain conditions, and each one is a reason why it can fail in reality. &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Is the good truly identical?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Brand, quality and after-sales service make two similar products imperfect substitutes.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Can it be transported at zero cost?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Transport costs create a band within which the price difference is not enough to pay for shipping, and so it persists.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Are there barriers to trade?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Tariffs, quotas and technical standards separate markets. Consumption taxes such as VAT also shift retail prices.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Is it a tradable good?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;A haircut or a rental are non-tradable: they cannot be bought in Bergamo and resold in Boston, so arbitrage is not possible.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3 id=&quot;ppp&quot;&gt;Purchasing Power Parity (PPP)&lt;/h3&gt;
  &lt;p&gt;If the law of one price holds for &lt;em&gt;all&lt;/em&gt; the goods in a given &lt;b class=&quot;t&quot;&gt;basket&lt;/b&gt; (a representative bundle of goods), then &lt;b class=&quot;t&quot;&gt;Purchasing Power Parity&lt;/b&gt; holds: the &lt;b class=&quot;t&quot;&gt;price levels&lt;/b&gt; (general levels of prices, that is, the cost of the basket) of all countries are equal when measured in the same currency. The same sum buys the same things in both countries. &lt;span class=&quot;tag&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 400 112&quot; role=&quot;img&quot; aria-label=&quot;Diagram: from the single good to the basket, from the basket to the price level and PPP&quot;&gt;
      &lt;g style=&quot;fill:var(--tint);stroke:var(--deep)&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;22&quot; width=&quot;110&quot; height=&quot;64&quot; rx=&quot;8&quot;/&gt;&lt;rect x=&quot;145&quot; y=&quot;22&quot; width=&quot;110&quot; height=&quot;64&quot; rx=&quot;8&quot;/&gt;&lt;rect x=&quot;285&quot; y=&quot;22&quot; width=&quot;110&quot; height=&quot;64&quot; rx=&quot;8&quot;/&gt;&lt;/g&gt;
      &lt;text class=&quot;ser&quot; x=&quot;60&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;P&lt;tspan dy=&quot;-6&quot; font-size=&quot;12&quot;&gt;i&lt;/tspan&gt;&lt;/text&gt;&lt;text class=&quot;sm&quot; x=&quot;60&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;one good&lt;/text&gt;
      &lt;text class=&quot;ser&quot; x=&quot;200&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;text class=&quot;sm&quot; x=&quot;200&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;the whole basket&lt;/text&gt;
      &lt;text class=&quot;ser&quot; x=&quot;340&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot;&gt;PPP&lt;/text&gt;&lt;text class=&quot;sm&quot; x=&quot;340&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot;&gt;E = P&lt;tspan dy=&quot;3&quot; font-size=&quot;10&quot;&gt;US&lt;/tspan&gt;&lt;tspan dy=&quot;-3&quot;&gt; / P&lt;/tspan&gt;&lt;tspan dy=&quot;3&quot; font-size=&quot;10&quot;&gt;EZ&lt;/tspan&gt;&lt;/text&gt;
      &lt;path class=&quot;ln&quot; d=&quot;M117 54H140M257 54H280&quot;/&gt;&lt;path d=&quot;M140 49l5 5-5 5zM280 49l5 5-5 5z&quot; style=&quot;fill:var(--ink2)&quot;/&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Same logic, different scale: the law of one price concerns one good &lt;em&gt;i&lt;/em&gt;, PPP the entire basket. This is why P loses the superscript &lt;em&gt;i&lt;/em&gt;.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Absolute PPP&lt;/button&gt;&lt;button&gt;Relative PPP&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;This is the version in the slides, based on price &lt;em&gt;levels&lt;/em&gt;. &lt;span class=&quot;tag&quot;&gt;slide 3, 5&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;fm&quot;&gt;E = P&lt;sub&gt;US&lt;/sub&gt; / P&lt;sub&gt;EZ&lt;/sub&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;The slides do not use this name, but the formula comes from Part 4: it only requires the exchange rate to offset the inflation differential (the difference in price growth), even if price levels remain different. &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;fm&quot;&gt;ΔE = π&lt;sub&gt;US&lt;/sub&gt; − π&lt;sub&gt;EZ&lt;/sub&gt;&lt;small&gt;If US inflation exceeds EZ inflation by 2 points, the dollar depreciates by about 2% and E rises by 2%.&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;bigmac&quot;&gt;The test: Big Mac Index&lt;/h3&gt;
  &lt;p&gt;The &lt;b class=&quot;t&quot;&gt;Big Mac Index&lt;/b&gt; applies PPP to a single product, standardised and sold in many countries. The Economist has published it since 1986 as an informal measure of PPP. &lt;a class=&quot;tag x&quot; href=&quot;https://en.wikipedia.org/wiki/Big_Mac_Index&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/p&gt;
  &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Data, July 2021 &lt;span class=&quot;tag&quot;&gt;slide 4&lt;/span&gt;&lt;/th&gt;&lt;th&gt;Value&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Price of the Big Mac in the EZ&lt;/td&gt;&lt;td&gt;€4.27&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Price of the Big Mac in the US&lt;/td&gt;&lt;td&gt;$5.65&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b class=&quot;t&quot;&gt;Market exchange rate&lt;/b&gt; (the rate actually observed on the market)&lt;/td&gt;&lt;td&gt;1.18 USD/EUR&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;ol aria-live=&quot;polite&quot;&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;What exchange rate would PPP require?&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;E = 5.65 / 4.27 = 1.32&lt;/div&gt;This is the exchange rate implied by the two prices. &lt;span class=&quot;tag&quot;&gt;slide 4&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Is it equal to the market exchange rate?&lt;/span&gt;No: 1.18 &amp;lt; 1.32. The market gives fewer dollars per euro than would be required. &lt;span class=&quot;tag&quot;&gt;slide 4&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Comparison in dollars&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;$5.65 vs. 4.27 × 1.18 = $5.04&lt;/div&gt;At the market exchange rate the EZ Big Mac costs less. &lt;span class=&quot;tag&quot;&gt;slide 4&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Comparison in euros&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;€4.27 vs. 5.65 / 1.18 = €4.79&lt;/div&gt;The same conclusion in the other currency. &lt;span class=&quot;tag&quot;&gt;slide 4&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;What are the implications?&lt;/span&gt;The slide poses the question without writing the answer. The Big Mac costs about 10.8% less in the EZ (5.04 / 5.65 − 1). The euro therefore appears &lt;b class=&quot;t&quot;&gt;undervalued&lt;/b&gt; relative to PPP and, on this product, the EZ is more competitive. PPP does not hold. &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/li&gt;
    &lt;/ol&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Move the sliders&lt;/h4&gt;
  &lt;div class=&quot;fig&quot; id=&quot;sim-mac&quot;&gt;
    &lt;div class=&quot;presets&quot;&gt;&lt;button type=&quot;button&quot; data-preset=&#x27;{&quot;pe&quot;:4.27,&quot;pu&quot;:5.65,&quot;E&quot;:1.18}&#x27;&gt;Slide data&lt;/button&gt;&lt;button type=&quot;button&quot; data-preset=&#x27;{&quot;pe&quot;:4.27,&quot;pu&quot;:5.65,&quot;E&quot;:1.32}&#x27;&gt;PPP E&lt;/button&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 400 204&quot; role=&quot;img&quot; aria-label=&quot;Bars of the Big Mac price in dollars and a line with the market and PPP exchange rates&quot;&gt;&lt;/svg&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;EZ price (€)&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;pe&quot; data-d=&quot;2&quot; data-p=&quot;€&quot; min=&quot;3.5&quot; max=&quot;6&quot; step=&quot;0.01&quot; value=&quot;4.27&quot;&gt;&lt;output data-o=&quot;pe&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;US price ($)&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;pu&quot; data-d=&quot;2&quot; data-p=&quot;$&quot; min=&quot;4&quot; max=&quot;7.5&quot; step=&quot;0.01&quot; value=&quot;5.65&quot;&gt;&lt;output data-o=&quot;pu&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;Market E&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;E&quot; data-d=&quot;2&quot; min=&quot;0.9&quot; max=&quot;1.6&quot; step=&quot;0.01&quot; value=&quot;1.18&quot;&gt;&lt;output data-o=&quot;E&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;readout&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Why one Big Mac is not enough &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/h4&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;A Big Mac contains a large non-tradable component&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Restaurant rent and local labour weigh on the price and cannot be arbitraged. Nobody ships hamburgers from Milan to New York to pocket the difference.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Taxes and local competition&lt;/summary&gt;&lt;div&gt;&lt;p&gt;VAT and McDonald&#x27;s differing market power across countries shift the price independently of the exchange rate.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;A single good is not a basket&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Strictly speaking, the Big Mac tests the law of one price on one product. It is used as a simple indicator of PPP, but it remains a simplification. According to Pakko and Pollard, it works almost as well as broader measures. &lt;a class=&quot;tag x&quot; href=&quot;https://ideas.repec.org/a/fip/fedlrv/y2003inovp9-28nv.85no.6.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;What is the difference between the law of one price and PPP?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Show the answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The law of one price concerns a single good; PPP is obtained when it holds for all the goods in a basket, and it therefore concerns price levels.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;A Big Mac costs €5 in the EZ and $6 in the US. What is the PPP exchange rate?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Show the answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;E = 6 / 5 = 1.20 USD/EUR.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;With the same prices, the market exchange rate is 1.30. Is the euro overvalued or undervalued?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Show the answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Overvalued, because 1.30 &amp;gt; 1.20. In dollars the EZ Big Mac costs 5 × 1.30 = $6.50, more than the American $6. The gap is 1.30 / 1.20 − 1 ≈ +8.3%.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why does PPP perform worse for services than for commodities?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Show the answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Many services are non-tradable: since they cannot be bought in one country and resold in the other, the arbitrage that should align prices is absent.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part ha&quot; id=&quot;p3&quot; data-spy&gt;
  &lt;span class=&quot;partno&quot;&gt;Part 3&lt;/span&gt;
  &lt;h2&gt;Real exchange rate and competitiveness&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Since PPP does not hold, it is used as a yardstick: how far prices move from parity tells us who is expensive and who is cheap.&lt;/p&gt;

  &lt;h3&gt;From PPP to the real exchange rate&lt;/h3&gt;
  &lt;p&gt;If PPP holds, E = P&lt;sub&gt;US&lt;/sub&gt; / P&lt;sub&gt;EZ&lt;/sub&gt;, and rearranging gives P&lt;sub&gt;EZ&lt;/sub&gt; · E / P&lt;sub&gt;US&lt;/sub&gt; = 1. However, PPP &quot;performs poorly in the real world&quot;, and the deviations describe the actual exchange rate. That ratio, which would equal 1 under PPP, therefore becomes a measure. &lt;span class=&quot;tag&quot;&gt;slide 5&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;fm&quot;&gt;&lt;span class=&quot;big&quot;&gt;E&lt;sub&gt;R&lt;/sub&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;P&lt;sub&gt;EZ&lt;/sub&gt; · E&lt;/span&gt;&lt;span&gt;P&lt;sub&gt;US&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;
    &lt;small&gt;Real exchange rate: the price of the EZ basket converted into dollars, divided by the price of the US basket.&lt;/small&gt;&lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;
    &lt;span class=&quot;lbl&quot;&gt;What it really measures &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/span&gt;
    &lt;p&gt;Working through the units: (€/EZ basket) × ($/€) / ($/US basket) = US baskets per EZ basket. The currencies cancel out, leaving how many American baskets one European basket is &quot;worth&quot;. This is why it is called &lt;em&gt;real&lt;/em&gt;: it compares goods with goods, not money with money.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3 id=&quot;comp&quot;&gt;What it means for competitiveness&lt;/h3&gt;
  &lt;p&gt;The slide closes with this question. The &lt;b class=&quot;t&quot;&gt;competitiveness&lt;/b&gt; at issue is price competitiveness: how cheap one country&#x27;s goods are relative to those of another. &lt;span class=&quot;tag&quot;&gt;slide 6&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;E&lt;sub&gt;R&lt;/sub&gt; &amp;gt; 1&lt;/button&gt;&lt;button&gt;E&lt;sub&gt;R&lt;/sub&gt; = 1&lt;/button&gt;&lt;button&gt;E&lt;sub&gt;R&lt;/sub&gt; &amp;lt; 1&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;&lt;strong&gt;EZ goods cost more than US goods.&lt;/strong&gt; &lt;span class=&quot;tag&quot;&gt;slide 6&lt;/span&gt; The EZ is less competitive: other things being equal, its exports tend to suffer and imports from the US tend to become more attractive. &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;&lt;strong&gt;PPP holds.&lt;/strong&gt; &lt;span class=&quot;tag&quot;&gt;slide 6&lt;/span&gt; The basket costs the same in the two areas: neither has a price advantage.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;&lt;strong&gt;EZ goods cost less than US goods.&lt;/strong&gt; &lt;span class=&quot;tag&quot;&gt;slide 6&lt;/span&gt; The EZ is more competitive: other things being equal, its exports are favoured. This is the Big Mac case: E&lt;sub&gt;R&lt;/sub&gt; = 4.27 × 1.18 / 5.65 ≈ 0.89. &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;fig&quot; id=&quot;sim-er&quot;&gt;
    &lt;div class=&quot;presets&quot;&gt;&lt;button type=&quot;button&quot; data-preset=&#x27;{&quot;E&quot;:1.1,&quot;pe&quot;:100,&quot;pu&quot;:110}&#x27;&gt;Set E&lt;sub&gt;R&lt;/sub&gt; = 1&lt;/button&gt;&lt;button type=&quot;button&quot; data-preset=&#x27;{&quot;E&quot;:1.3,&quot;pe&quot;:100,&quot;pu&quot;:100}&#x27;&gt;Expensive EZ&lt;/button&gt;&lt;button type=&quot;button&quot; data-preset=&#x27;{&quot;E&quot;:0.95,&quot;pe&quot;:100,&quot;pu&quot;:110}&#x27;&gt;Cheap EZ&lt;/button&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 400 122&quot; role=&quot;img&quot; aria-label=&quot;Real exchange rate scale with 1 at the centre: EZ cheaper on the left, EZ more expensive on the right&quot;&gt;&lt;/svg&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;E (USD/EUR)&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;E&quot; data-d=&quot;2&quot; min=&quot;0.9&quot; max=&quot;1.4&quot; step=&quot;0.01&quot; value=&quot;1.18&quot;&gt;&lt;output data-o=&quot;E&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;P&lt;sub&gt;EZ&lt;/sub&gt; (€)&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;pe&quot; data-d=&quot;0&quot; min=&quot;90&quot; max=&quot;115&quot; step=&quot;1&quot; value=&quot;100&quot;&gt;&lt;output data-o=&quot;pe&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;P&lt;sub&gt;US&lt;/sub&gt; ($)&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;pu&quot; data-d=&quot;0&quot; min=&quot;90&quot; max=&quot;115&quot; step=&quot;1&quot; value=&quot;110&quot;&gt;&lt;output data-o=&quot;pu&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;readout&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The three levers&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 400 176&quot; role=&quot;img&quot; aria-label=&quot;Diagram: a rise in E and a rise in P EZ raise E R; a rise in P US lowers it&quot;&gt;
      &lt;g style=&quot;fill:var(--tint);stroke:var(--deep)&quot;&gt;&lt;rect x=&quot;5&quot; y=&quot;10&quot; width=&quot;125&quot; height=&quot;42&quot; rx=&quot;8&quot;/&gt;&lt;rect x=&quot;5&quot; y=&quot;66&quot; width=&quot;125&quot; height=&quot;42&quot; rx=&quot;8&quot;/&gt;&lt;rect x=&quot;5&quot; y=&quot;122&quot; width=&quot;125&quot; height=&quot;42&quot; rx=&quot;8&quot;/&gt;&lt;rect x=&quot;255&quot; y=&quot;55&quot; width=&quot;140&quot; height=&quot;68&quot; rx=&quot;10&quot;/&gt;&lt;/g&gt;
      &lt;text x=&quot;67&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot;&gt;E rises&lt;/text&gt;&lt;text x=&quot;67&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot;&gt;P&lt;tspan dy=&quot;3&quot; font-size=&quot;10&quot;&gt;EZ&lt;/tspan&gt;&lt;tspan dy=&quot;-3&quot;&gt; rises&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;67&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot;&gt;P&lt;tspan dy=&quot;3&quot; font-size=&quot;10&quot;&gt;US&lt;/tspan&gt;&lt;tspan dy=&quot;-3&quot;&gt; rises&lt;/tspan&gt;&lt;/text&gt;
      &lt;text class=&quot;ser&quot; x=&quot;325&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot;&gt;E&lt;tspan dy=&quot;4&quot; font-size=&quot;12&quot;&gt;R&lt;/tspan&gt;&lt;/text&gt;&lt;text class=&quot;sm&quot; x=&quot;325&quot; y=&quot;107&quot; text-anchor=&quot;middle&quot;&gt;competitiveness&lt;/text&gt;
      &lt;path d=&quot;M132 31L250 76&quot; fill=&quot;none&quot; stroke=&quot;var(--loss)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;path d=&quot;M132 87L250 89&quot; fill=&quot;none&quot; stroke=&quot;var(--loss)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;path d=&quot;M132 143L250 102&quot; fill=&quot;none&quot; stroke=&quot;var(--gain)&quot; stroke-width=&quot;2.5&quot;/&gt;
      &lt;text x=&quot;190&quot; y=&quot;40&quot; style=&quot;fill:var(--loss);font-weight:600&quot;&gt;+&lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;82&quot; style=&quot;fill:var(--loss);font-weight:600&quot;&gt;+&lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;140&quot; style=&quot;fill:var(--gain);font-weight:600&quot;&gt;−&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;In red, the levers that raise E&lt;sub&gt;R&lt;/sub&gt; and take competitiveness away from the EZ; in green, the one that restores it.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;E&lt;sub&gt;R&lt;/sub&gt; over time&lt;/th&gt;&lt;th&gt;Name&lt;/th&gt;&lt;th&gt;Effect on the EZ&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;rises&lt;/td&gt;&lt;td&gt;&lt;b class=&quot;t&quot;&gt;real appreciation&lt;/b&gt;&lt;/td&gt;&lt;td&gt;loses competitiveness&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;falls&lt;/td&gt;&lt;td&gt;&lt;b class=&quot;t&quot;&gt;real depreciation&lt;/b&gt;&lt;/td&gt;&lt;td&gt;gains competitiveness&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;p&gt;The names in the table do not appear in the slides, but they are the standard ones. &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt; The ECB uses the same direction for its indicators: a positive change signals lower price competitiveness. &lt;a class=&quot;tag x&quot; href=&quot;https://data.ecb.europa.eu/key-figures/ecb-interest-rates-and-exchange-rates/harmonised-competitiveness-indicators&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/p&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;What E&lt;sub&gt;R&lt;/sub&gt; does not tell us&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt; It is a bilateral ratio: it looks only at the US, whereas the EZ trades with many partners. The version covering all partners, weighted by trade, is the real effective exchange rate. Moreover, it measures only prices: quality, innovation and productivity enter only indirectly.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;P&lt;sub&gt;EZ&lt;/sub&gt; = 100, P&lt;sub&gt;US&lt;/sub&gt; = 120, E = 1.08. What is the value of E&lt;sub&gt;R&lt;/sub&gt;? What does it mean?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Show the answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;E&lt;sub&gt;R&lt;/sub&gt; = 100 × 1.08 / 120 = 0.90. The EZ basket costs 10% less than the US basket, so the EZ is more price competitive.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;If EZ inflation rises and everything else is unchanged, what happens to EZ competitiveness?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Show the answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;P&lt;sub&gt;EZ&lt;/sub&gt; grows, so E&lt;sub&gt;R&lt;/sub&gt; rises: real appreciation and a loss of competitiveness.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why is an E&lt;sub&gt;R&lt;/sub&gt; equal to 1 the natural benchmark?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Show the answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because it is the value that would obtain if PPP held: price levels, in the same currency, coincide.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part hm&quot; id=&quot;p4&quot; data-spy&gt;
  &lt;span class=&quot;partno&quot;&gt;Part 4&lt;/span&gt;
  &lt;h2&gt;Competitiveness rate of change&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;The level is usually of less interest than the direction: is the EZ gaining or losing ground? To answer, we move from levels to growth rates.&lt;/p&gt;

  &lt;p&gt;The &lt;b class=&quot;t&quot;&gt;rate of change&lt;/b&gt; of E&lt;sub&gt;R&lt;/sub&gt; between the previous period &lt;em&gt;t−1&lt;/em&gt; and the current period &lt;em&gt;t&lt;/em&gt; is defined as follows: &lt;span class=&quot;tag&quot;&gt;slide 7&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;fm&quot;&gt;ΔE&lt;sub&gt;R&lt;/sub&gt; = &lt;span class=&quot;frac&quot;&gt;&lt;span&gt;E&lt;sub&gt;R,t&lt;/sub&gt; − E&lt;sub&gt;R,t−1&lt;/sub&gt;&lt;/span&gt;&lt;span&gt;E&lt;sub&gt;R,t−1&lt;/sub&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;In this course Δ denotes this rate, not the simple difference. The dot in ṗ&lt;sup&gt;EZ&lt;/sup&gt; and ṗ&lt;sup&gt;US&lt;/sup&gt; on the exercise slides denotes the same concept for prices, that is, &lt;b class=&quot;t&quot;&gt;inflation&lt;/b&gt; (which I also write as π here). &lt;span class=&quot;tag&quot;&gt;slide 7, 8&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;warn&quot;&gt;
    &lt;span class=&quot;lbl&quot;&gt;A formula not to use&lt;/span&gt;
    &lt;p&gt;Slide 7 has the handwritten expression ΔE&lt;sub&gt;R&lt;/sub&gt; = ΔE · ΔP&lt;sub&gt;EU&lt;/sub&gt; / ΔP&lt;sub&gt;US&lt;/sub&gt;, immediately before the move to logs. The rate of a product is &lt;em&gt;not&lt;/em&gt; the product of the rates. With the data from Exercise A it would give 5.14 × 2 / 2.9 ≈ 3.5%, whereas the correct value is 4.22%. I read it as the naive attempt that logs correct, but this is my own interpretation: ask the tutor to confirm. &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;The derivation, step by step&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;ol aria-live=&quot;polite&quot;&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Start from the level&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;E&lt;sub&gt;R&lt;/sub&gt; = E · P&lt;sub&gt;EU&lt;/sub&gt; / P&lt;sub&gt;US&lt;/sub&gt;&lt;/div&gt;A product and a ratio: awkward to vary over time. &lt;span class=&quot;tag&quot;&gt;slide 7&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Take the log&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;log(E&lt;sub&gt;R&lt;/sub&gt;) = log(E) + log(P&lt;sub&gt;EU&lt;/sub&gt;) − log(P&lt;sub&gt;US&lt;/sub&gt;)&lt;/div&gt;Logs turn products into sums and ratios into differences: log(a·b) = log a + log b. &lt;span class=&quot;tag&quot;&gt;slide 7&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Use the key property&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;Δx = ∂log(x) / ∂t&lt;/div&gt;The time derivative of the log of a variable is its growth rate, because ∂log(x)/∂t = (∂x/∂t) / x. &lt;span class=&quot;tag&quot;&gt;slide 7&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Differentiate each term&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;∂log(E&lt;sub&gt;R&lt;/sub&gt;)/∂t = ∂log(E)/∂t + [∂log(P&lt;sub&gt;EU&lt;/sub&gt;)/∂t − ∂log(P&lt;sub&gt;US&lt;/sub&gt;)/∂t]&lt;/div&gt;On the slide, the ∂ in the last term is missing by oversight. &lt;span class=&quot;tag&quot;&gt;slide 7&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;st&quot;&gt;Read off the components&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;ΔE&lt;sub&gt;R&lt;/sub&gt; = ΔE + (π&lt;sub&gt;EZ&lt;/sub&gt; − π&lt;sub&gt;US&lt;/sub&gt;)&lt;/div&gt;The change in the nominal exchange rate plus the &lt;b class=&quot;t&quot;&gt;inflation differential&lt;/b&gt; (the gap in inflation between the two areas). &lt;span class=&quot;tag&quot;&gt;slide 7, 10&lt;/span&gt;&lt;/li&gt;
    &lt;/ol&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Decompose the change&lt;/h3&gt;
  &lt;div class=&quot;fig&quot; id=&quot;sim-wf&quot;&gt;
    &lt;div class=&quot;presets&quot;&gt;&lt;button type=&quot;button&quot; data-preset=&#x27;{&quot;dE&quot;:5.14,&quot;a&quot;:2,&quot;b&quot;:2.9}&#x27;&gt;Exercise A&lt;/button&gt;&lt;button type=&quot;button&quot; data-preset=&#x27;{&quot;dE&quot;:-8.33,&quot;a&quot;:1,&quot;b&quot;:4}&#x27;&gt;Exercise B&lt;/button&gt;&lt;button type=&quot;button&quot; data-preset=&#x27;{&quot;dE&quot;:0.9,&quot;a&quot;:2,&quot;b&quot;:2.9}&#x27;&gt;Relative PPP&lt;/button&gt;&lt;/div&gt;
    &lt;svg viewBox=&quot;0 0 400 232&quot; role=&quot;img&quot; aria-label=&quot;Waterfall chart: change in the exchange rate plus EZ inflation minus US inflation equals the change in the real exchange rate&quot;&gt;&lt;/svg&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;ΔE&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;dE&quot; data-d=&quot;2&quot; data-u=&quot;%&quot; min=&quot;-12&quot; max=&quot;12&quot; step=&quot;0.01&quot; value=&quot;5.14&quot;&gt;&lt;output data-o=&quot;dE&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;π&lt;sub&gt;EZ&lt;/sub&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;a&quot; data-d=&quot;1&quot; data-u=&quot;%&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;2&quot;&gt;&lt;output data-o=&quot;a&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;π&lt;sub&gt;US&lt;/sub&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;b&quot; data-d=&quot;1&quot; data-u=&quot;%&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.1&quot; value=&quot;2.9&quot;&gt;&lt;output data-o=&quot;b&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;readout&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;The &quot;Relative PPP&quot; button shows the case in which the exchange rate exactly offsets the inflation differential: ΔE&lt;sub&gt;R&lt;/sub&gt; = 0. &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;

  &lt;h3&gt;Why it is an approximation&lt;/h3&gt;
  &lt;p&gt;The log formula is exact for infinitesimal changes. With annual data we use discrete rates, and log(1 + x) ≈ x holds well only if x is small. The exact formula is (1 + ΔE&lt;sub&gt;R&lt;/sub&gt;) = (1 + ΔE)(1 + π&lt;sub&gt;EZ&lt;/sub&gt;) / (1 + π&lt;sub&gt;US&lt;/sub&gt;). &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;fig&quot; id=&quot;sim-log&quot;&gt;
    &lt;svg viewBox=&quot;0 0 400 225&quot; role=&quot;img&quot; aria-label=&quot;Curve of the logarithm of 1 plus x compared with the straight line x&quot;&gt;&lt;/svg&gt;
    &lt;label class=&quot;ctrl&quot;&gt;&lt;span&gt;Rate x&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;x&quot; data-d=&quot;1&quot; data-u=&quot;%&quot; min=&quot;-30&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;5&quot;&gt;&lt;output data-o=&quot;x&quot;&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;readout&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Why it matters in European Economic Policy &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;EZ vs. US&lt;/button&gt;&lt;button&gt;Within the eurozone&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;p&gt;The exchange rate is free to move, so competitiveness can change through two channels: ΔE and the inflation differential. In practice ΔE often dominates, because the exchange rate moves more than prices in the short run.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;Between Italy and Germany there is no exchange rate: E is fixed, so ΔE = 0 and all that remains is&lt;/p&gt;
      &lt;div class=&quot;fm&quot;&gt;ΔE&lt;sub&gt;R&lt;/sub&gt; = π&lt;sub&gt;IT&lt;/sub&gt; − π&lt;sub&gt;DE&lt;/sub&gt;&lt;/div&gt;
      &lt;p&gt;With inflation of 3% in Italy and 1% in Germany, Italy loses about 2 points of competitiveness per year, and the loss accumulates. When facing an &lt;b class=&quot;t&quot;&gt;asymmetric shock&lt;/b&gt; (a shock that hits one country more than the others), a euro country cannot devalue: it must adjust through prices and wages. This is one of the themes of the theory of the &lt;b class=&quot;t&quot;&gt;optimum currency area&lt;/b&gt; (the conditions under which sharing a currency is worthwhile).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;ΔE = +3%, π&lt;sub&gt;EZ&lt;/sub&gt; = 2%, π&lt;sub&gt;US&lt;/sub&gt; = 4%. What is the value of ΔE&lt;sub&gt;R&lt;/sub&gt;, and what does it mean?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Show the answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;3 + 2 − 4 = +1%. E&lt;sub&gt;R&lt;/sub&gt; rises: the EZ loses about 1% of competitiveness. The inflation advantage does not offset the nominal appreciation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;Why are logs used to move to rates?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Show the answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because they turn products and ratios into sums and differences, and the derivative of the log is the growth rate. The formula becomes additive.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;When is the additive approximation less reliable?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Show the answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;With large changes: the gap grows roughly with the square of x. In Exercise B, with ΔE of about −8%, it is much wider than in Exercise A.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;p5&quot; data-spy&gt;
  &lt;span class=&quot;partno&quot;&gt;Part 5&lt;/span&gt;
  &lt;h2&gt;Exercises A and B&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;The task is the same for both: comment on the change in bilateral EZ-US competitiveness by computing the real exchange rates (1) in levels and (2) with the log / growth rate approximation. &lt;span class=&quot;tag&quot;&gt;slide 9&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Exercise A&lt;/button&gt;&lt;button&gt;Exercise B&lt;/button&gt;&lt;button&gt;Try it yourself&lt;/button&gt;&lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Data &lt;span class=&quot;tag&quot;&gt;slide 8&lt;/span&gt;&lt;/th&gt;&lt;th&gt;t−1 (Sep 2024)&lt;/th&gt;&lt;th&gt;t (Sep 2025)&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;E (USD/EUR)&lt;/td&gt;&lt;td&gt;1.11618&lt;/td&gt;&lt;td&gt;1.1736&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;P&lt;sub&gt;EZ&lt;/sub&gt;, inflation 2.0%&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;to be computed&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;P&lt;sub&gt;US&lt;/sub&gt;, inflation 2.9%&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;to be computed&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;stepper&quot;&gt;
        &lt;ol aria-live=&quot;polite&quot;&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;1 · Derive the rule for prices&lt;/span&gt;From the definition ΔP = (P&lt;sub&gt;t&lt;/sub&gt; − P&lt;sub&gt;t−1&lt;/sub&gt;) / P&lt;sub&gt;t−1&lt;/sub&gt;, isolate P&lt;sub&gt;t&lt;/sub&gt;:&lt;div class=&quot;fm&quot;&gt;P&lt;sub&gt;t&lt;/sub&gt; = P&lt;sub&gt;t−1&lt;/sub&gt; (1 + ΔP)&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;slide 8&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;2 · Compute the prices at t&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;P&lt;sub&gt;EZ,t&lt;/sub&gt; = 100 × 1.02 = 102&lt;br&gt;P&lt;sub&gt;US,t&lt;/sub&gt; = 100 × 1.029 = 102.9&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;slide 8&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;3 · Levels: E&lt;sub&gt;R&lt;/sub&gt; at t−1&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;E&lt;sub&gt;R,t−1&lt;/sub&gt; = 1.11618 × 100 / 100 = 1.11618&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;slide 10&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;4 · Levels: E&lt;sub&gt;R&lt;/sub&gt; at t&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;E&lt;sub&gt;R,t&lt;/sub&gt; = 1.1736 × 102 / 102.9 = 1.1633&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;slide 10&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;5 · Levels: the change&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;ΔE&lt;sub&gt;R&lt;/sub&gt; = (1.1633 − 1.11618) / 1.11618 = 0.0422 = 4.22%&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;slide 10&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;6 · Rates: the decomposition&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;ΔE = (1.1736 − 1.11618) / 1.11618 = 5.14%&lt;br&gt;ΔE&lt;sub&gt;R&lt;/sub&gt; = 5.14 + 2 − 2.9 = 4.24%&lt;/div&gt;The two routes differ by 0.02 points. &lt;span class=&quot;tag&quot;&gt;slide 10&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;7 · The comment&lt;/span&gt;E&lt;sub&gt;R&lt;/sub&gt; rises by about 4.2%: &lt;b class=&quot;t&quot;&gt;the EZ loses competitiveness&lt;/b&gt; relative to the US. The nominal appreciation of the euro (+5.14%) outweighs the advantage from lower EZ inflation (0.9 points). The slides do not write out the comment: this is my reading of the figures. &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/li&gt;
        &lt;/ol&gt;
        &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;figure class=&quot;fig&quot;&gt;&lt;svg data-wf=&quot;5.14,2,2.9&quot; viewBox=&quot;0 0 400 232&quot; role=&quot;img&quot; aria-label=&quot;Exercise A: plus 5.14 plus 2 minus 2.9 equals plus 4.24&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Exercise A in percentage points: red pushes E&lt;sub&gt;R&lt;/sub&gt; up (loss of competitiveness), green pushes it down.&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;div class=&quot;warn&quot;&gt;
        &lt;span class=&quot;lbl&quot;&gt;Three details the slides take for granted &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/span&gt;
        &lt;ul&gt;
          &lt;li&gt;&lt;strong&gt;With indices, the change matters, not the level.&lt;/strong&gt; Base = 100 prices are a convention, not actual costs. E&lt;sub&gt;R,t−1&lt;/sub&gt; = 1.116 does &lt;em&gt;not&lt;/em&gt; mean that the EZ costs 11.6% more: the statement &quot;E&lt;sub&gt;R&lt;/sub&gt; &amp;gt; 1 = EZ more expensive&quot; requires actual prices, as with the Big Mac.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;The dates do not fully coincide.&lt;/strong&gt; The exchange rates are for September, while inflation is the 12-month figure for August 2025. For an exercise, this is an acceptable approximation.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;The values are realistic.&lt;/strong&gt; Eurostat reports 2.0% for the eurozone and the BLS 2.9% for the US in August 2025 (see &lt;a href=&quot;#more&quot;&gt;Further reading&lt;/a&gt;). &lt;a class=&quot;tag x&quot; href=&quot;https://www.bls.gov/opub/ted/2025/consumer-prices-up-2-9-percent-from-august-2024-to-august-2025.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Data &lt;span class=&quot;tag&quot;&gt;slide 11&lt;/span&gt;&lt;/th&gt;&lt;th&gt;t−1&lt;/th&gt;&lt;th&gt;t&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;E (USD/EUR)&lt;/td&gt;&lt;td&gt;1.20&lt;/td&gt;&lt;td&gt;1.10&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;P&lt;sub&gt;EZ&lt;/sub&gt;, inflation 1%&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;to be computed&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;P&lt;sub&gt;US&lt;/sub&gt;, inflation 4%&lt;/td&gt;&lt;td&gt;110&lt;/td&gt;&lt;td&gt;to be computed&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;p&gt;The slide reports only the result: ΔE&lt;sub&gt;R&lt;/sub&gt; = −11.3%. Try it first without help and then check: the steps below are mine. &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;stepper&quot;&gt;
        &lt;ol aria-live=&quot;polite&quot;&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;1 · Rates, the quick method&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;ΔE = (1.10 − 1.20) / 1.20 = −8.33%&lt;br&gt;ΔE&lt;sub&gt;R&lt;/sub&gt; = −8.33 + 1 − 4 = −11.33%&lt;/div&gt;This is the −11.3% on the slide. &lt;span class=&quot;tag&quot;&gt;slide 11&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;2 · Levels: the prices at t&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;P&lt;sub&gt;EZ,t&lt;/sub&gt; = 100 × 1.01 = 101&lt;br&gt;P&lt;sub&gt;US,t&lt;/sub&gt; = 110 × 1.04 = 114.4&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;3 · Levels: E&lt;sub&gt;R&lt;/sub&gt;&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;E&lt;sub&gt;R,t−1&lt;/sub&gt; = 1.20 × 100 / 110 = 1.0909&lt;br&gt;E&lt;sub&gt;R,t&lt;/sub&gt; = 1.10 × 101 / 114.4 = 0.9711&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;4 · Levels: the change&lt;/span&gt;&lt;div class=&quot;fm&quot;&gt;ΔE&lt;sub&gt;R&lt;/sub&gt; = (0.9711 − 1.0909) / 1.0909 = −10.98%&lt;/div&gt;The gap with the quick method is 0.35 points, much more than in Exercise A, because ΔE is large.&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;st&quot;&gt;5 · The comment&lt;/span&gt;E&lt;sub&gt;R&lt;/sub&gt; falls by about 11%: &lt;b class=&quot;t&quot;&gt;the EZ gains competitiveness&lt;/b&gt;. This time the two channels move in the same direction: the euro depreciates (−8.33%) and EZ inflation is 3 points lower. The base of 110 for P&lt;sub&gt;US&lt;/sub&gt; does not affect the result.&lt;/li&gt;
        &lt;/ol&gt;
        &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;button class=&quot;next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;figure class=&quot;fig&quot;&gt;&lt;svg data-wf=&quot;-8.33,1,4&quot; viewBox=&quot;0 0 400 232&quot; role=&quot;img&quot; aria-label=&quot;Exercise B: minus 8.33 plus 1 minus 4 equals minus 11.33&quot;&gt;&lt;/svg&gt;
      &lt;figcaption&gt;Exercise B in percentage points.&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;
      &lt;p&gt;An invented exercise for practice, not in the slides. &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Data&lt;/th&gt;&lt;th&gt;t−1&lt;/th&gt;&lt;th&gt;t&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;E (USD/EUR)&lt;/td&gt;&lt;td&gt;1.30&lt;/td&gt;&lt;td&gt;1.25&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;P&lt;sub&gt;EZ&lt;/sub&gt;, inflation 3%&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;to be computed&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;P&lt;sub&gt;US&lt;/sub&gt;, inflation 1%&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;to be computed&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;&lt;/div&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Solution in levels&lt;/summary&gt;&lt;div&gt;&lt;p&gt;P&lt;sub&gt;EZ,t&lt;/sub&gt; = 103 and P&lt;sub&gt;US,t&lt;/sub&gt; = 101. E&lt;sub&gt;R,t−1&lt;/sub&gt; = 1.30 and E&lt;sub&gt;R,t&lt;/sub&gt; = 1.25 × 103 / 101 = 1.2748. ΔE&lt;sub&gt;R&lt;/sub&gt; = (1.2748 − 1.30) / 1.30 = −1.94%.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Solution with rates&lt;/summary&gt;&lt;div&gt;&lt;p&gt;ΔE = −3.85%. ΔE&lt;sub&gt;R&lt;/sub&gt; = −3.85 + 3 − 1 = −1.85%.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Comment&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The EZ gains a little competitiveness: the nominal depreciation is partly eroded by higher EZ inflation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The summary sheet&lt;/h3&gt;
  &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Concept&lt;/th&gt;&lt;th&gt;Formula&lt;/th&gt;&lt;th&gt;To remember&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Conversion&lt;/td&gt;&lt;td&gt;P&lt;sub&gt;EZ&lt;/sub&gt; · E or P&lt;sub&gt;US&lt;/sub&gt; / E&lt;/td&gt;&lt;td&gt;E in USD/EUR: rising = stronger euro&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Law of one price&lt;/td&gt;&lt;td&gt;P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;EZ&lt;/sub&gt; · E = P&lt;sup&gt;i&lt;/sup&gt;&lt;sub&gt;US&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;one good&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;PPP&lt;/td&gt;&lt;td&gt;E = P&lt;sub&gt;US&lt;/sub&gt; / P&lt;sub&gt;EZ&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;the whole basket&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Real exchange rate&lt;/td&gt;&lt;td&gt;E&lt;sub&gt;R&lt;/sub&gt; = P&lt;sub&gt;EZ&lt;/sub&gt; · E / P&lt;sub&gt;US&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;&amp;gt; 1 EZ more expensive, &amp;lt; 1 cheaper&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Future price&lt;/td&gt;&lt;td&gt;P&lt;sub&gt;t&lt;/sub&gt; = P&lt;sub&gt;t−1&lt;/sub&gt; (1 + ΔP)&lt;/td&gt;&lt;td&gt;from inflation to level&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Rate of change&lt;/td&gt;&lt;td&gt;ΔE&lt;sub&gt;R&lt;/sub&gt; ≈ ΔE + π&lt;sub&gt;EZ&lt;/sub&gt; − π&lt;sub&gt;US&lt;/sub&gt;&lt;/td&gt;&lt;td&gt;positive = loses competitiveness&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;In Exercise A the euro appreciates by 5.14% but E&lt;sub&gt;R&lt;/sub&gt; rises by only about 4.2%. Why less?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Show the answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because EZ inflation is 0.9 points lower than US inflation: this recovers part of the loss due to the exchange rate.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;In Exercise B the calculation in levels gives −10.98% and the one with rates −11.33%. Why, and which is exact?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Show the answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The calculation in levels is exact; the additive one is an approximation, less precise with large changes.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;In Exercise A, can we say that in 2025 the EZ is more expensive than the US because E&lt;sub&gt;R&lt;/sub&gt; = 1.16 &amp;gt; 1?&lt;/p&gt;&lt;details&gt;&lt;summary&gt;Show the answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. The prices are indices with a base of 100 chosen by convention, so the level of E&lt;sub&gt;R&lt;/sub&gt; is not a comparison of actual prices. Only the change can be commented on.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part&quot; id=&quot;more&quot; data-spy style=&quot;border-bottom:0&quot;&gt;
  &lt;span class=&quot;partno&quot;&gt;External sources&lt;/span&gt;
  &lt;h2&gt;Further reading&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;The slides cite only one reference by name, the Big Mac Index. Below are that reference, the likely sources of the data in Exercise A and some useful readings.&lt;/p&gt;
  &lt;p&gt;Everything in this section comes from the web and not from the slides. I checked the data through web search, without opening the documents in full.&lt;/p&gt;

  &lt;h3&gt;Cited in the slides&lt;/h3&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Big Mac Index&lt;/h4&gt;
      &lt;p class=&quot;who&quot;&gt;The Economist, since September 1986 &lt;span class=&quot;tag&quot;&gt;slide 4&lt;/span&gt; &lt;span class=&quot;tag x&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;What it contains:&lt;/strong&gt; Big Mac prices across countries, the implied exchange rate and the over/undervaluation of currencies. The repository has data and calculation code, with a raw index and one adjusted for GDP per capita.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it is the example on slide 4 and allows the calculation to be redone for other countries and years. The dataset is the right place to verify the July 2021 values: web search did not allow me to confirm €4.27 and $5.65.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://github.com/TheEconomist/big-mac-data&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Data and code on GitHub&lt;/a&gt; · &lt;a href=&quot;https://www.economist.com/big-mac-index&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Economist&#x27;s page&lt;/a&gt; (did not appear in the search results: address to be verified) · &lt;a href=&quot;https://en.wikipedia.org/wiki/Big_Mac_Index&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia entry&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Where the data in Exercise A may come from&lt;/h3&gt;
  &lt;p&gt;The slides do not state the source of the data: these matches are my own hypothesis.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Euro area annual inflation, August 2025&lt;/h4&gt;
      &lt;p class=&quot;who&quot;&gt;Eurostat, Euro indicators, 17 September 2025 &lt;span class=&quot;tag x&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;What it contains:&lt;/strong&gt; the final figure for eurozone HICP inflation (the European harmonised index): 2.0%, against a flash estimate of 2.1%.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it matches the 2.0% on slide 8 and shows the difference between the preliminary estimate and the final figure.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://ec.europa.eu/eurostat/web/products-euro-indicators/w/2-17092025-ap&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Eurostat release&lt;/a&gt; · &lt;a href=&quot;https://ec.europa.eu/eurostat/en/web/products-euro-indicators/w/2-02092025-ap&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Flash estimate&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Consumer prices up 2.9 percent, August 2024 - August 2025&lt;/h4&gt;
      &lt;p class=&quot;who&quot;&gt;U.S. Bureau of Labor Statistics, The Economics Daily &lt;span class=&quot;tag x&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;What it contains:&lt;/strong&gt; the 12-month change in the American Consumer Price Index.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it matches the 2.9% on slide 8. HICP and CPI are not constructed identically, so the comparison between the two is good but not perfect.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.bls.gov/opub/ted/2025/consumer-prices-up-2-9-percent-from-august-2024-to-august-2025.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BLS page&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;US dollar/Euro, monthly series&lt;/h4&gt;
      &lt;p class=&quot;who&quot;&gt;European Central Bank, ECB Data Portal, series EXR.M.USD.EUR.SP00.A &lt;span class=&quot;tag x&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;What it contains:&lt;/strong&gt; the monthly average of the dollar/euro exchange rate, since 1999.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it uses the same quotation as the course (USD per 1 EUR) and is the right place to check 1.11618 and 1.1736. The two values remain to be confirmed: the search returned only individual daily rates for September 2025, around 1.17.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://data.ecb.europa.eu/data/datasets/EXR/EXR.M.USD.EUR.SP00.A&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Series on the Data Portal&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Useful readings, not cited in the slides&lt;/h3&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;The Purchasing Power Parity Puzzle&lt;/h4&gt;
      &lt;p class=&quot;who&quot;&gt;Kenneth Rogoff, &lt;em&gt;Journal of Economic Literature&lt;/em&gt;, 34(2), 1996, pp. 647-668 &lt;span class=&quot;tag x&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;What it contains:&lt;/strong&gt; the classic survey of PPP as a long-run anchor. The &quot;puzzle&quot; is reconciling the enormous short-run volatility of real exchange rates with the slow rate at which shocks die out.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it explores the &quot;PPP performs poorly in the real world&quot; of slide 5 in greater depth.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://ideas.repec.org/a/aea/jeclit/v34y1996i2p647-668.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Record on IDEAS/RePEc&lt;/a&gt; · &lt;a href=&quot;https://web.williams.edu/Economics/macro/rogoff.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Burgernomics: A Big Mac Guide to Purchasing Power Parity&lt;/h4&gt;
      &lt;p class=&quot;who&quot;&gt;Michael R. Pakko and Patricia S. Pollard, &lt;em&gt;Federal Reserve Bank of St. Louis Review&lt;/em&gt;, 85(6), 2003, pp. 9-28 &lt;span class=&quot;tag x&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;What it contains:&lt;/strong&gt; it uses the Big Mac to explain the principles of PPP and compares the index with broader price measures. Some catalogues give the pages as 9-27.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it explains in an accessible way why &quot;McParity&quot; often fails, and it connects slides 4 and 5.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://ideas.repec.org/a/fip/fedlrv/y2003inovp9-28nv.85no.6.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Record on IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;Harmonised competitiveness indicators&lt;/h4&gt;
      &lt;p class=&quot;who&quot;&gt;European Central Bank, ECB Data Portal &lt;span class=&quot;tag x&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;What it contains:&lt;/strong&gt; measures of the price and cost competitiveness of euro countries, consistent with the real effective exchange rate of the euro against 40 trading partners.&lt;/p&gt;
      &lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it is the official version of E&lt;sub&gt;R&lt;/sub&gt; with many partners, and it has the same direction: rising = less competitiveness.&lt;/p&gt;
      &lt;p&gt;&lt;a href=&quot;https://data.ecb.europa.eu/key-figures/ecb-interest-rates-and-exchange-rates/harmonised-competitiveness-indicators&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ECB page&lt;/a&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;note&quot;&gt;
    &lt;span class=&quot;lbl&quot;&gt;Other course materials&lt;/span&gt;
    &lt;p&gt;From this session I could not list the &lt;code&gt;corso/&lt;/code&gt; folder, and the few file names I tried do not exist. Nothing on this page therefore comes from other course files. The links with the rest of the syllabus, such as optimum currency area and asymmetric shock, are &lt;span class=&quot;tag i&quot;&gt;supplement&lt;/span&gt;: check them against the lectures and the syllabus.&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer class=&quot;wrap&quot;&gt;
  &lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;
&lt;/footer&gt;

  });

  /* passi da scorrere */
  function barsArb(svg,a,b){
    var W=function(v){return v/140*380};
    svg.innerHTML=
      &#x27;&lt;text x=&quot;10&quot; y=&quot;20&quot;&gt;Good i sold in the EZ, in dollars: $&#x27;+a+&#x27;&lt;/text&gt;&#x27;+
      &#x27;&lt;rect x=&quot;10&quot; y=&quot;28&quot; height=&quot;28&quot; rx=&quot;3&quot; width=&quot;&#x27;+W(a)+&#x27;&quot; style=&quot;fill:var(--mid)&quot;/&gt;&#x27;+
      &#x27;&lt;text x=&quot;10&quot; y=&quot;84&quot;&gt;Good i sold in the US: $&#x27;+b+&#x27;&lt;/text&gt;&#x27;+
      &#x27;&lt;rect x=&quot;10&quot; y=&quot;92&quot; height=&quot;28&quot; rx=&quot;3&quot; width=&quot;&#x27;+W(b)+&#x27;&quot; style=&quot;fill:var(--deep)&quot;/&gt;&#x27;+
      &#x27;&lt;text x=&quot;10&quot; y=&quot;150&quot; style=&quot;font-weight:600&quot;&gt;&#x27;+(b-a&gt;0?&#x27;Arbitrage margin: $&#x27;+(b-a)+&#x27; per unit&#x27;:&#x27;Arbitrage margin: zero, the law of one price holds&#x27;)+&#x27;&lt;/text&gt;&#x27;;
  }
  $$(&#x27;.stepper&#x27;).forEach(function(st){
    var items=$$(&#x27;:scope &gt; ol &gt; li&#x27;,st),i=0;
    var prev=$(&#x27;.prev&#x27;,st),next=$(&#x27;.next&#x27;,st),cnt=$(&#x27;.count&#x27;,st),arb=$(&#x27;[data-arb]&#x27;,st.parentNode);
    function go(k){

      if(arb&amp;&amp;items[i].dataset.a)barsArb(arb,+items[i].dataset.a,+items[i].dataset.b);
    }
    if(prev)prev.addEventListener(&#x27;click&#x27;,function(){go(i-1)});
    if(next)next.addEventListener(&#x27;click&#x27;,function(){go(i+1)});
    go(0);
  });

  /* simulatori con cursori */
  function sim(id,render){
    var r=document.getElementById(id);
    if(!r)return;
    var ins=$$(&#x27;input[type=range]&#x27;,r);
    function go(){
      var v={};

        var o=$(&#x27;[data-o=&quot;&#x27;+el.dataset.k+&#x27;&quot;]&#x27;,r);
        if(o)o.textContent=(el.dataset.p||&#x27;&#x27;)+n(+el.value,+(el.dataset.d||0))+(el.dataset.u||&#x27;&#x27;);
      });

    }
    ins.forEach(function(el){el.addEventListener(&#x27;input&#x27;,go)});
    $$(&#x27;[data-preset]&#x27;,r).forEach(function(b){
      b.addEventListener(&#x27;click&#x27;,function(){
        var p=JSON.parse(b.dataset.preset);
        ins.forEach(function(el){if(p[el.dataset.k]!==undefined)el.value=p[el.dataset.k]});
        go();
      });

    go();
  }

  /* parte 1: convertitore */
  sim(&#x27;sim-e&#x27;,function(v,r){
    var W=function(x,m){return x/m*380};
    var d=100*v.E,e=100/v.E,ref=10+W(118,160);
    $(&#x27;svg&#x27;,r).innerHTML=
      &#x27;&lt;text x=&quot;10&quot; y=&quot;20&quot;&gt;€100 are worth $&#x27;+n(d,2)+&#x27;&lt;/text&gt;&#x27;+
      &#x27;&lt;rect x=&quot;10&quot; y=&quot;28&quot; height=&quot;28&quot; rx=&quot;3&quot; width=&quot;&#x27;+W(d,160)+&#x27;&quot; style=&quot;fill:var(--mid)&quot;/&gt;&#x27;+
      &#x27;&lt;path class=&quot;ln dash&quot; d=&quot;M&#x27;+ref+&#x27; 24V60&quot;/&gt;&#x27;+
      &#x27;&lt;text x=&quot;10&quot; y=&quot;90&quot;&gt;$100 are worth €&#x27;+n(e,2)+&#x27;&lt;/text&gt;&#x27;+
      &#x27;&lt;rect x=&quot;10&quot; y=&quot;98&quot; height=&quot;28&quot; rx=&quot;3&quot; width=&quot;&#x27;+W(e,160)+&#x27;&quot; style=&quot;fill:var(--deep)&quot;/&gt;&#x27;+
      &#x27;&lt;path class=&quot;ln dash&quot; d=&quot;M&#x27;+(10+W(100/1.18,160))+&#x27; 94V130&quot;/&gt;&#x27;+
      &#x27;&lt;text class=&quot;sm&quot; x=&quot;10&quot; y=&quot;150&quot;&gt;Dashed line: the value at E = 1.18&lt;/text&gt;&#x27;;
