    else if(v.E&lt;1.18)s=&#x27;With a lower E, one euro buys fewer dollars: relative to 1.18, the euro has &lt;b&gt;depreciated&lt;/b&gt; and the dollar has appreciated.&#x27;;
    else s=&#x27;E = 1.18: this is the market exchange rate from the Big Mac slide. Move the slider to see what happens.&#x27;;
    o.innerHTML=s;
  });

  /* parte 2: Big Mac */
  sim(&#x27;sim-mac&#x27;,function(v,r){
    var usd=v.pe*v.E,eur=v.pu/v.E,ppp=v.pu/v.pe,er=usd/v.pu,val=(v.E/ppp-1)*100;
    var m=Math.max(usd,v.pu,6),W=function(x){return x/m*380};
    var L=function(x){return 20+(clamp(x,.6,2.2)-.6)/1.6*360};
    var lab=function(x){return clamp(L(x),62,338)};
    $(&#x27;svg&#x27;,r).innerHTML=
      &#x27;&lt;text x=&quot;10&quot; y=&quot;18&quot;&gt;EZ Big Mac: €&#x27;+n(v.pe,2)+&#x27; × &#x27;+n(v.E,2)+&#x27; = $&#x27;+n(usd,2)+&#x27;&lt;/text&gt;&#x27;+
      &#x27;&lt;rect x=&quot;10&quot; y=&quot;26&quot; height=&quot;24&quot; rx=&quot;3&quot; width=&quot;&#x27;+W(usd)+&#x27;&quot; style=&quot;fill:var(--mid)&quot;/&gt;&#x27;+
      &#x27;&lt;text x=&quot;10&quot; y=&quot;74&quot;&gt;US Big Mac: $&#x27;+n(v.pu,2)+&#x27;&lt;/text&gt;&#x27;+
      &#x27;&lt;rect x=&quot;10&quot; y=&quot;82&quot; height=&quot;24&quot; rx=&quot;3&quot; width=&quot;&#x27;+W(v.pu)+&#x27;&quot; style=&quot;fill:var(--deep)&quot;/&gt;&#x27;+
      &#x27;&lt;path class=&quot;ax&quot; d=&quot;M20 164H380&quot;/&gt;&#x27;+
      &#x27;&lt;path d=&quot;M&#x27;+L(v.E)+&#x27; 154V174&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;3&quot;/&gt;&#x27;+
      &#x27;&lt;text x=&quot;&#x27;+lab(v.E)+&#x27;&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--accent);font-weight:600&quot;&gt;market &#x27;+n(v.E,2)+&#x27;&lt;/text&gt;&#x27;+
      &#x27;&lt;path d=&quot;M&#x27;+L(ppp)+&#x27; 154V174&quot; stroke=&quot;var(--deep)&quot; stroke-width=&quot;3&quot;/&gt;&#x27;+
      &#x27;&lt;text x=&quot;&#x27;+lab(ppp)+&#x27;&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--deep);font-weight:600&quot;&gt;PPP &#x27;+n(ppp,2)+&#x27;&lt;/text&gt;&#x27;;
    var w;
    if(Math.abs(val)&lt;0.5)w=&#x27;The market exchange rate almost coincides with the PPP rate: the Big Mac costs the same in the two countries.&#x27;;
    else if(val&lt;0)w=&#x27;The market gives fewer dollars per euro than PPP would require: the euro is &lt;b&gt;undervalued&lt;/b&gt; by &#x27;+n(-val,1)+&#x27;% and the Big Mac costs less in the EZ.&#x27;;
    else w=&#x27;The market gives more dollars per euro than PPP would require: the euro is &lt;b&gt;overvalued&lt;/b&gt; by &#x27;+n(val,1)+&#x27;% and the Big Mac costs more in the EZ.&#x27;;
    $(&#x27;.readout&#x27;,r).innerHTML=&#x27;PPP E = &#x27;+n(v.pu,2)+&#x27; / &#x27;+n(v.pe,2)+&#x27; = &lt;b&gt;&#x27;+n(ppp,2)+&#x27;&lt;/b&gt;. In euros the US Big Mac costs €&#x27;+n(eur,2)+&#x27;. E&lt;sub&gt;R&lt;/sub&gt; = &lt;b&gt;&#x27;+n(er,3)+&#x27;&lt;/b&gt;. &#x27;+w;
  });

  /* parte 3: real exchange rate */
  sim(&#x27;sim-er&#x27;,function(v,r){
    var er=v.pe*v.E/v.pu,L=function(x){return 200+Math.log(clamp(x,.55,1/.55))/Math.log(1/.55)*185};
    var x=L(er),lx=clamp(x,50,350);
    var tick=function(t){return &#x27;&lt;path class=&quot;ln&quot; d=&quot;M&#x27;+L(t)+&#x27; 80V94&quot;/&gt;&lt;text class=&quot;sm&quot; x=&quot;&#x27;+L(t)+&#x27;&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot;&gt;&#x27;+n(t,2)+&#x27;&lt;/text&gt;&#x27;};
    $(&#x27;svg&#x27;,r).innerHTML=
      &#x27;&lt;rect x=&quot;15&quot; y=&quot;62&quot; width=&quot;185&quot; height=&quot;18&quot; style=&quot;fill:var(--gain);opacity:.28&quot;/&gt;&#x27;+
      &#x27;&lt;rect x=&quot;200&quot; y=&quot;62&quot; width=&quot;185&quot; height=&quot;18&quot; style=&quot;fill:var(--loss);opacity:.28&quot;/&gt;&#x27;+
      &#x27;&lt;text class=&quot;sm&quot; x=&quot;15&quot; y=&quot;54&quot;&gt;EZ cheaper&lt;/text&gt;&lt;text class=&quot;sm&quot; x=&quot;385&quot; y=&quot;54&quot; text-anchor=&quot;end&quot;&gt;EZ more expensive&lt;/text&gt;&#x27;+
      tick(.6)+tick(.8)+tick(1)+tick(1.25)+tick(1.6)+
      &#x27;&lt;path d=&quot;M&#x27;+x+&#x27; 56V90&quot; stroke=&quot;var(--ink)&quot; stroke-width=&quot;3&quot;/&gt;&#x27;+
      &#x27;&lt;text x=&quot;&#x27;+lx+&#x27;&quot; y=&quot;24&quot; text-anchor=&quot;middle&quot; style=&quot;font:500 20px var(--serif);fill:var(--ink)&quot;&gt;E&lt;tspan dy=&quot;4&quot; font-size=&quot;13&quot;&gt;R&lt;/tspan&gt;&lt;tspan dy=&quot;-4&quot;&gt; = &#x27;+n(er,3)+&#x27;&lt;/tspan&gt;&lt;/text&gt;&#x27;;
    var s;
    if(Math.abs(er-1)&lt;.005)s=&#x27;E&lt;sub&gt;R&lt;/sub&gt; ≈ 1: PPP holds. The basket costs the same in the two countries, measured in the same currency.&#x27;;
    else if(er&gt;1)s=&#x27;E&lt;sub&gt;R&lt;/sub&gt; &amp;gt; 1: the EZ basket costs &#x27;+n((er-1)*100,1)+&#x27;% more than the US basket. One EZ basket is &quot;worth&quot; &#x27;+n(er,2)+&#x27; US baskets: the EZ is &lt;b&gt;less competitive&lt;/b&gt; on prices.&#x27;;
    else s=&#x27;E&lt;sub&gt;R&lt;/sub&gt; &amp;lt; 1: the EZ basket costs &#x27;+n((1-er)*100,1)+&#x27;% less than the US basket. One EZ basket is &quot;worth&quot; &#x27;+n(er,2)+&#x27; US baskets: the EZ is &lt;b&gt;more competitive&lt;/b&gt; on prices.&#x27;;
    $(&#x27;.readout&#x27;,r).innerHTML=s;
  });

  /* grafico a cascata per la scomposizione */
  function wf(svg,dE,a,b){
    var items=[[&#x27;ΔE&#x27;,dE],[&#x27;+ π EZ&#x27;,a],[&#x27;− π US&#x27;,-b]],sum=dE+a-b,cum=[0,dE,dE+a,sum];
    var M=Math.max(Math.abs(cum[1]),Math.abs(cum[2]),Math.abs(cum[3]),4)*1.1;
    var Y=function(v){return 110-v/M*80},h=&#x27;&lt;path class=&quot;ax&quot; d=&quot;M15 110H385&quot;/&gt;&#x27;,c=0;
    var col=function(v){return v&gt;=0?&#x27;var(--loss)&#x27;:&#x27;var(--gain)&#x27;};
    items.forEach(function(it,i){
      var x=25+i*90,t=Y(Math.max(c,c+it[1])),bt=Y(Math.min(c,c+it[1])),ht=Math.max(bt-t,1.5);
      h+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+t+&#x27;&quot; width=&quot;70&quot; height=&quot;&#x27;+ht+&#x27;&quot; rx=&quot;2&quot; style=&quot;fill:&#x27;+col(it[1])+&#x27;;opacity:.72&quot;/&gt;&#x27;;
      h+=&#x27;&lt;text x=&quot;&#x27;+(x+35)+&#x27;&quot; y=&quot;&#x27;+(it[1]&gt;=0?t-6:t+ht+16)+&#x27;&quot; text-anchor=&quot;middle&quot;&gt;&#x27;+sg(it[1],2)+&#x27;&lt;/text&gt;&#x27;;
      c+=it[1];
      h+=&#x27;&lt;path class=&quot;ln dash&quot; d=&quot;M&#x27;+(x+70)+&#x27; &#x27;+Y(c)+&#x27;H&#x27;+(x+90)+&#x27;&quot;/&gt;&#x27;;
      h+=&#x27;&lt;text class=&quot;sm&quot; x=&quot;&#x27;+(x+35)+&#x27;&quot; y=&quot;224&quot; text-anchor=&quot;middle&quot;&gt;&#x27;+it[0]+&#x27;&lt;/text&gt;&#x27;;
    });
    var x=295,t=Y(Math.max(0,sum)),bt=Y(Math.min(0,sum)),ht=Math.max(bt-t,1.5);
    h+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+t+&#x27;&quot; width=&quot;70&quot; height=&quot;&#x27;+ht+&#x27;&quot; rx=&quot;2&quot; style=&quot;fill:&#x27;+col(sum)+&#x27;&quot;/&gt;&#x27;;
    h+=&#x27;&lt;text x=&quot;&#x27;+(x+35)+&#x27;&quot; y=&quot;&#x27;+(sum&gt;=0?t-6:t+ht+16)+&#x27;&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;&#x27;+sg(sum,2)+&#x27;&lt;/text&gt;&#x27;;
    h+=&#x27;&lt;text class=&quot;sm&quot; x=&quot;&#x27;+(x+35)+&#x27;&quot; y=&quot;224&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600;fill:var(--ink)&quot;&gt;ΔE&lt;tspan dy=&quot;3&quot; font-size=&quot;10&quot;&gt;R&lt;/tspan&gt;&lt;/text&gt;&#x27;;
    svg.innerHTML=h;
  }
  $$(&#x27;svg[data-wf]&#x27;).forEach(function(s){
    var p=s.dataset.wf.split(&#x27;,&#x27;).map(Number);wf(s,p[0],p[1],p[2]);
  });
  sim(&#x27;sim-wf&#x27;,function(v,r){
    wf($(&#x27;svg&#x27;,r),v.dE,v.a,v.b);
    var ap=v.dE+v.a-v.b,ex=((1+v.dE/100)*(1+v.a/100)/(1+v.b/100)-1)*100;
    var s=Math.abs(ap)&lt;.005?&#x27;E&lt;sub&gt;R&lt;/sub&gt; does not change: competitiveness is unchanged.&#x27;:(ap&gt;0?&#x27;E&lt;sub&gt;R&lt;/sub&gt; rises: real appreciation, the EZ &lt;b&gt;loses&lt;/b&gt; competitiveness.&#x27;:&#x27;E&lt;sub&gt;R&lt;/sub&gt; falls: real depreciation, the EZ &lt;b&gt;gains&lt;/b&gt; competitiveness.&#x27;);
    $(&#x27;.readout&#x27;,r).innerHTML=&#x27;Approximation: &lt;b&gt;&#x27;+sg(ap,2)+&#x27;%&lt;/b&gt;. Exact calculation: &lt;b&gt;&#x27;+sg(ex,2)+&#x27;%&lt;/b&gt;. Gap: &#x27;+n(Math.abs(ap-ex),2)+&#x27; points. &#x27;+s;
  });

  /* parte 4: log contro tasso */
  (function(){
    var X=function(x){return 40+(x+.3)/.6*350},Y=function(y){return 215-(y+.36)/.66*205},pts=&#x27;&#x27;;
    for(var i=-30;i&lt;=30;i++){var u=i/100;pts+=(i===-30?&#x27;M&#x27;:&#x27;L&#x27;)+X(u).toFixed(1)+&#x27; &#x27;+Y(Math.log(1+u)).toFixed(1)}
    sim(&#x27;sim-log&#x27;,function(v,r){
      var x=v.x/100,l=Math.log(1+x);
      $(&#x27;svg&#x27;,r).innerHTML=
        &#x27;&lt;path class=&quot;ax&quot; d=&quot;M40 &#x27;+Y(0)+&#x27;H390M&#x27;+X(0)+&#x27; 10V215&quot;/&gt;&#x27;+
        &#x27;&lt;text class=&quot;sm&quot; x=&quot;388&quot; y=&quot;&#x27;+(Y(0)+18)+&#x27;&quot; text-anchor=&quot;end&quot;&gt;+30%&lt;/text&gt;&lt;text class=&quot;sm&quot; x=&quot;42&quot; y=&quot;&#x27;+(Y(0)-8)+&#x27;&quot;&gt;−30%&lt;/text&gt;&#x27;+
        &#x27;&lt;path d=&quot;M&#x27;+X(-.3)+&#x27; &#x27;+Y(-.3)+&#x27;L&#x27;+X(.3)+&#x27; &#x27;+Y(.3)+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;var(--ink2)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;6 5&quot;/&gt;&#x27;+
        &#x27;&lt;path d=&quot;&#x27;+pts+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;var(--deep)&quot; stroke-width=&quot;3&quot;/&gt;&#x27;+
        &#x27;&lt;text x=&quot;50&quot; y=&quot;26&quot; style=&quot;fill:var(--deep);font-weight:600&quot;&gt;solid line: log(1 + x)&lt;/text&gt;&#x27;+
        &#x27;&lt;text class=&quot;sm&quot; x=&quot;50&quot; y=&quot;45&quot;&gt;dashed line: x (the growth rate)&lt;/text&gt;&#x27;+
        &#x27;&lt;path d=&quot;M&#x27;+X(x)+&#x27; &#x27;+Y(x)+&#x27;L&#x27;+X(x)+&#x27; &#x27;+Y(l)+&#x27;&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;4&quot;/&gt;&#x27;+
        &#x27;&lt;circle cx=&quot;&#x27;+X(x)+&#x27;&quot; cy=&quot;&#x27;+Y(l)+&#x27;&quot; r=&quot;5&quot; style=&quot;fill:var(--accent)&quot;/&gt;&#x27;;
      $(&#x27;.readout&#x27;,r).innerHTML=&#x27;Rate x = &lt;b&gt;&#x27;+sg(v.x,1)+&#x27;%&lt;/b&gt;, log(1 + x) = &lt;b&gt;&#x27;+sg(l*100,2)+&#x27;%&lt;/b&gt;, gap &lt;b&gt;&#x27;+n(Math.abs(v.x-l*100),2)+&#x27;&lt;/b&gt; points. Around 5% the gap is about 0.1 points, then it grows quickly.&#x27;;
    });
  })();
})();
&lt;/script&gt;
