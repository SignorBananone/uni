        &lt;a href=&quot;#s7&quot;&gt;&lt;rect class=&quot;nb&quot; x=&quot;40&quot; y=&quot;336&quot; width=&quot;222&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;text x=&quot;58&quot; y=&quot;374&quot; class=&quot;num&quot; style=&quot;fill:var(--brick)&quot;&gt;7&lt;/text&gt;&lt;text x=&quot;84&quot; y=&quot;362&quot; class=&quot;t1&quot;&gt;Depreciation&lt;/text&gt;&lt;text x=&quot;84&quot; y=&quot;382&quot; class=&quot;t2&quot;&gt;useful life · metodo&lt;/text&gt;&lt;/a&gt;
        &lt;a href=&quot;#s8&quot;&gt;&lt;rect class=&quot;nb&quot; x=&quot;340&quot; y=&quot;336&quot; width=&quot;222&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;text x=&quot;358&quot; y=&quot;374&quot; class=&quot;num&quot; style=&quot;fill:var(--brick)&quot;&gt;8&lt;/text&gt;&lt;text x=&quot;384&quot; y=&quot;362&quot; class=&quot;t1&quot;&gt;Impairment&lt;/text&gt;&lt;text x=&quot;384&quot; y=&quot;382&quot; class=&quot;t2&quot;&gt;IAS 36 · indicatori&lt;/text&gt;&lt;/a&gt;
        &lt;a href=&quot;#s9&quot;&gt;&lt;rect class=&quot;nb&quot; x=&quot;640&quot; y=&quot;336&quot; width=&quot;222&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;text x=&quot;658&quot; y=&quot;374&quot; class=&quot;num&quot; style=&quot;fill:var(--brick)&quot;&gt;9&lt;/text&gt;&lt;text x=&quot;684&quot; y=&quot;362&quot; class=&quot;t1&quot;&gt;Derecognition&lt;/text&gt;&lt;text x=&quot;684&quot; y=&quot;382&quot; class=&quot;t2&quot;&gt;dismissione · gain/loss&lt;/text&gt;&lt;/a&gt;
        &lt;a href=&quot;#s10&quot;&gt;&lt;rect class=&quot;nb&quot; x=&quot;340&quot; y=&quot;470&quot; width=&quot;222&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;text x=&quot;358&quot; y=&quot;508&quot; class=&quot;num&quot; style=&quot;fill:var(--accent)&quot;&gt;10&lt;/text&gt;&lt;text x=&quot;392&quot; y=&quot;496&quot; class=&quot;t1&quot;&gt;Esempi applicativi&lt;/text&gt;&lt;text x=&quot;392&quot; y=&quot;516&quot; class=&quot;t2&quot;&gt;ispezioni · aereo · CM&lt;/text&gt;&lt;/a&gt;

&lt;!-- ============ 1 ASSET ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s1&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;Fondamenti · Conceptual Framework&lt;/span&gt;&lt;h2&gt;Che cos&#x27;è un asset?&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Prima di parlare di macchinari e fabbricati, la lezione parte dalla domanda di base: quando una risorsa può comparire nell&#x27;attivo di bilancio? La risposta sta nel &lt;span class=&quot;term&quot;&gt;Conceptual Framework&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(il &quot;quadro concettuale&quot; dello IASB: non è uno standard, ma il documento che fissa definizioni e principi da cui gli standard derivano)&lt;/span&gt;.&lt;/p&gt;

  &lt;blockquote class=&quot;def&quot;&gt;An asset is a &lt;b&gt;present economic resource controlled&lt;/b&gt; by the entity as a &lt;b&gt;result of past events&lt;/b&gt;.&lt;cite&gt;Conceptual Framework (CF) 4.3 · slide 2&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;blockquote class=&quot;def&quot;&gt;An &lt;b&gt;economic resource&lt;/b&gt; is a &lt;b&gt;right&lt;/b&gt; that has the potential to produce economic benefits.&lt;cite&gt;CF 4.4 · slide 2&lt;/cite&gt;&lt;/blockquote&gt;

  &lt;p&gt;Leggiamo la definizione pezzo per pezzo, perché ogni parola ha un ruolo:&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 230&quot; role=&quot;img&quot; aria-label=&quot;Scomposizione della definizione di asset&quot;&gt;
      &lt;g font-size=&quot;14&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;110&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;present&lt;/text&gt;
        &lt;text x=&quot;110&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;esiste oggi, alla data&lt;/text&gt;
        &lt;rect x=&quot;235&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;335&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;economic resource&lt;/text&gt;
        &lt;text x=&quot;335&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;un diritto con potenziale&lt;/text&gt;
        &lt;rect x=&quot;460&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;560&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;controlled&lt;/text&gt;
        &lt;text x=&quot;560&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;l&#x27;entità ne dispone&lt;/text&gt;
        &lt;rect x=&quot;685&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;785&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;result of past events&lt;/text&gt;
        &lt;text x=&quot;785&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;nasce da un fatto già avvenuto&lt;/text&gt;
      &lt;/g&gt;
      &lt;path d=&quot;M335,92 V140&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.6&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;rect x=&quot;160&quot; y=&quot;144&quot; width=&quot;350&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
      &lt;text x=&quot;335&quot; y=&quot;173&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;RIGHT → potential → economic benefits&lt;/text&gt;
      &lt;text x=&quot;335&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;non serve la certezza: basta il potenziale&lt;/text&gt;
      &lt;text x=&quot;560&quot; y=&quot;175&quot; font-size=&quot;12.5&quot; class=&quot;mut&quot;&gt;Es.: comprare una macchina (evento passato)&lt;/text&gt;
      &lt;text x=&quot;560&quot; y=&quot;195&quot; font-size=&quot;12.5&quot; class=&quot;mut&quot;&gt;dà oggi il diritto di usarla per produrre.&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Le quattro componenti della definizione di asset (CF 4.3–4.4).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Non tutti i diritti sono asset&lt;/h3&gt;
  &lt;p&gt;Per essere asset &lt;b&gt;dell&#x27;entità&lt;/b&gt;, i diritti devono &lt;b&gt;sia&lt;/b&gt; avere il potenziale di produrre benefici economici &lt;i&gt;per l&#x27;entità&lt;/i&gt;, oltre a quelli disponibili a chiunque altro, &lt;b&gt;sia&lt;/b&gt; essere &lt;b&gt;controllati&lt;/b&gt; dall&#x27;entità. Per questo i diritti disponibili a tutti senza costo significativo (un diritto di passaggio pubblico su un terreno, il know-how di pubblico dominio) di norma non sono asset per chi li detiene. &lt;span class=&quot;src&quot;&gt;CF 4.9 · slide 3&lt;/span&gt;&lt;/p&gt;

  &lt;h3&gt;Il bene fisico e il fascio di diritti&lt;/h3&gt;
  &lt;p&gt;In teoria ogni diritto è un asset separato. In pratica i diritti collegati si trattano come un&#x27;unica &lt;span class=&quot;term&quot;&gt;unit of account&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(l&#x27;unità a cui si applicano rilevazione e misurazione)&lt;/span&gt;. La proprietà legale di un oggetto dà, per esempio:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Il fascio di diritti&lt;/h4&gt;&lt;ol type=&quot;a&quot; style=&quot;margin:0;padding-left:1.2em&quot;&gt;&lt;li&gt;il diritto di usare l&#x27;oggetto;&lt;/li&gt;&lt;li&gt;il diritto di vendere diritti sull&#x27;oggetto;&lt;/li&gt;&lt;li&gt;il diritto di darlo in pegno (&lt;i&gt;pledge&lt;/i&gt;);&lt;/li&gt;&lt;li&gt;altri diritti non elencati.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;La chiave concettuale&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;The economic resource is the set of rights, not the physical object.&lt;/b&gt; Descrivere il fascio di diritti come &quot;il macchinario&quot; resta però la rappresentazione più concisa e comprensibile. &lt;span class=&quot;src&quot;&gt;CF 4.11–4.12 · slide 4&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le due caratteristiche chiave&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Control&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;La proprietà legale non è decisiva.&lt;/b&gt; Conta poter dirigere l&#x27;uso della risorsa e ottenerne i benefici. Un bene in leasing, per esempio, può essere controllato senza esserne proprietari. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Future Economic Benefits&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Il potenziale di contribuire, &lt;i&gt;direttamente o indirettamente&lt;/i&gt;, ai flussi di cassa e di &lt;span class=&quot;term&quot;&gt;cash equivalents&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(investimenti a breve, molto liquidi, convertibili in importi noti di denaro)&lt;/span&gt; verso l&#x27;entità. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Judgement.&lt;/b&gt; Stabilire se c&#x27;è un asset richiede giudizio su due domande: l&#x27;entità ha il &lt;b&gt;controllo&lt;/b&gt; della risorsa? Ci sono &lt;b&gt;benefici economici futuri&lt;/b&gt; attesi verso l&#x27;entità? &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Autoverifica · 1&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Un&#x27;impresa usa gratis una strada pubblica per raggiungere lo stabilimento. Quel diritto di passaggio è un suo asset?&lt;/summary&gt;&lt;div&gt;No. È un diritto disponibile a tutti senza costo significativo: non dà all&#x27;impresa benefici in più rispetto agli altri e non è controllato da lei (CF 4.9).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché il Framework dice che la risorsa economica è &quot;il fascio di diritti&quot; e non l&#x27;oggetto fisico?&lt;/summary&gt;&lt;div&gt;Perché ciò che produce benefici sono i diritti (usare, vendere, dare in pegno…), non la materia. Si descrive comunque l&#x27;oggetto fisico perché è il modo più conciso e comprensibile di rappresentare quei diritti (CF 4.11–4.12).&lt;/div&gt;&lt;/details&gt;
    &lt;p style=&quot;margin:.6em 0 0&quot;&gt;&lt;b&gt;La proprietà legale è un requisito essenziale per avere un asset?&lt;/b&gt;&lt;/p&gt;
    &lt;div class=&quot;mcq&quot;&gt;&lt;button data-why=&quot;Il requisito è il controllo; la proprietà legale non è una caratteristica chiave (slide 5).&quot;&gt;Sì, sempre&lt;/button&gt;&lt;button data-ok data-why=&quot;Conta il controllo della risorsa, non il titolo giuridico.&quot;&gt;No, conta il controllo&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;mcq-fb&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 CLASSIFICAZIONE ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s2&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;Classificazione&lt;/span&gt;&lt;h2&gt;Current, non-current, tangible, intangible&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Una volta stabilito che c&#x27;è un asset, bisogna capire &lt;i&gt;che tipo&lt;/i&gt; di asset è. Le slide usano due assi: la durata (corrente / non corrente) e la natura (materiale / immateriale).&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Current assets&lt;/button&gt;&lt;button&gt;Non-current assets&lt;/button&gt;&lt;button&gt;Tangible vs intangible&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Secondo l&#x27;&lt;b&gt;IAS 1.66&lt;/b&gt; un asset è &lt;span class=&quot;term&quot;&gt;current&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(corrente, a breve)&lt;/span&gt; quando si verifica &lt;b&gt;almeno una&lt;/b&gt; di queste condizioni:&lt;/p&gt;
      &lt;ol type=&quot;a&quot;&gt;
        &lt;li&gt;l&#x27;entità prevede di realizzarlo, venderlo o consumarlo nel suo &lt;span class=&quot;term&quot;&gt;normal operating cycle&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(il tempo tra l&#x27;acquisto delle risorse e il loro incasso in denaro)&lt;/span&gt;;&lt;/li&gt;
        &lt;li&gt;è detenuto principalmente per la &lt;b&gt;negoziazione&lt;/b&gt; (&lt;i&gt;trading&lt;/i&gt;);&lt;/li&gt;
        &lt;li&gt;prevede di realizzarlo &lt;b&gt;entro dodici mesi&lt;/b&gt; dalla data di bilancio;&lt;/li&gt;
        &lt;li&gt;è &lt;b&gt;cash o cash equivalent&lt;/b&gt; (come definiti dall&#x27;IAS 7), salvo vincoli che ne impediscano l&#x27;uso per almeno dodici mesi.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;Tutti gli altri asset sono non-current&lt;/b&gt; (IAS 1.66). È una categoria residuale: si definisce il corrente, e tutto il resto è non corrente.&lt;/p&gt;
      &lt;p&gt;L&#x27;IAS 1 usa &quot;non-current&quot; per gli asset materiali, immateriali e finanziari &lt;b&gt;di natura durevole&lt;/b&gt;, ma ammette altre descrizioni (per esempio &quot;fixed assets&quot;, immobilizzazioni) purché il significato sia chiaro (IAS 1.67). &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Tangible assets&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Risorse fisiche. Comprendono sottoclassi come i &lt;i&gt;current assets&lt;/i&gt; (es. &lt;b&gt;inventory&lt;/b&gt;, le rimanenze) e i &lt;i&gt;fixed assets&lt;/i&gt; (es. &lt;b&gt;buildings and equipment&lt;/b&gt;). Il PPE è un sottoinsieme dei tangible fixed assets.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Intangible assets&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Risorse e diritti &lt;b&gt;non fisici&lt;/b&gt; che hanno valore perché danno all&#x27;impresa un vantaggio sul mercato: &lt;i&gt;goodwill, copyrights, trademarks, patents, computer programs&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 250&quot; role=&quot;img&quot; aria-label=&quot;Albero di classificazione degli asset&quot;&gt;
      &lt;g font-size=&quot;13.5&quot;&gt;
        &lt;rect x=&quot;370&quot; y=&quot;10&quot; width=&quot;160&quot; height=&quot;40&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;ASSET&lt;/text&gt;
        &lt;path d=&quot;M450,50 V70 H215 V90 M450,70 H685 V90&quot; stroke=&quot;var(--ink2)&quot; fill=&quot;none&quot;/&gt;
        &lt;rect x=&quot;120&quot; y=&quot;90&quot; width=&quot;190&quot; height=&quot;40&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;215&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Current (IAS 1.66)&lt;/text&gt;

        &lt;rect x=&quot;760&quot; y=&quot;170&quot; width=&quot;130&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;825&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot;&gt;Intangibles&lt;/text&gt;&lt;text x=&quot;825&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;IAS 38&lt;/text&gt;

    &lt;figcaption&gt;La classificazione decide quale standard si applica. Il riferimento all&#x27;IAS 38 per gli intangibili viene dalla slide 27.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Perché classificare?&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Per chi legge il bilancio&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Le informazioni su &lt;b&gt;natura&lt;/b&gt; e &lt;b&gt;importi&lt;/b&gt; delle risorse economiche aiutano a capire punti di forza e debolezza finanziari (CF 1.13). Alcuni flussi di cassa derivano direttamente da una risorsa (un credito verso clienti diventa incasso); altri nascono solo combinando più risorse per produrre e vendere (un impianto da solo non genera cassa). Anche se quei flussi non si attribuiscono a una singola risorsa, l&#x27;utente deve sapere quali risorse sono disponibili (CF 1.14). &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Per chi redige il bilancio&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;La classificazione &lt;b&gt;determina lo standard da applicare&lt;/b&gt;, e lo standard stabilisce come l&#x27;asset va rilevato, misurato e presentato nello &lt;span class=&quot;term&quot;&gt;statement of financial position&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(stato patrimoniale)&lt;/span&gt;. Il corso si concentra su Inventories, &lt;b&gt;Property, plant and equipment&lt;/b&gt; e Investment property. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; L&#x27;IAS 1 citato nelle slide è sostituito da &lt;b&gt;IFRS 18&lt;/b&gt; &lt;i&gt;Presentation and Disclosure in Financial Statements&lt;/i&gt; per gli esercizi che iniziano dal 1° gennaio 2027; parte dei suoi paragrafi è stata ripresa in IFRS 18 e parte spostata nell&#x27;IAS 8. Le regole sulla classificazione corrente/non corrente restano, ma con una numerazione diversa. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation – IFRS 18&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Autoverifica · 2&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Un titolo detenuto per la negoziazione, che l&#x27;impresa pensa di tenere 18 mesi, è current o non-current?&lt;/summary&gt;&lt;div&gt;Current: basta una delle condizioni dell&#x27;IAS 1.66, e la (b), &quot;held primarily for the purpose of trading&quot;, è soddisfatta anche se l&#x27;orizzonte supera i 12 mesi.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché la definizione di &quot;non-current&quot; è residuale?&lt;/summary&gt;&lt;div&gt;L&#x27;IAS 1.66 definisce in positivo solo gli asset correnti; tutti gli altri sono non correnti per esclusione.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Indica due motivi per cui la classificazione è importante.&lt;/summary&gt;&lt;div&gt;(1) Informa gli utenti su natura e importi delle risorse, quindi sulle prospettive di flussi di cassa (CF 1.13–1.14). (2) Determina quale standard si applica per rilevazione, misurazione e presentazione.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 IAS 16 ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s3&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;IAS 16 · par. 2–6&lt;/span&gt;&lt;h2&gt;Definizione, overview e scope&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;blockquote class=&quot;def&quot;&gt;&lt;i&gt;Property, plant and equipment&lt;/i&gt; are &lt;b&gt;tangible items&lt;/b&gt; that:&lt;br&gt;• are held for use in the &lt;b&gt;production or supply of goods or services&lt;/b&gt;, for rental to others, or for administrative purposes; and&lt;br&gt;• are expected to be used during &lt;b&gt;more than one period&lt;/b&gt;.&lt;cite&gt;IAS 16.6 · slide 12&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Property, plant and equipment (PPE)&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(in italiano &quot;immobili, impianti e macchinari&quot;)&lt;/span&gt;: terreni, fabbricati, macchinari, automezzi, mobili, attrezzature. Tre filtri: &lt;b&gt;materiale&lt;/b&gt;, &lt;b&gt;usato&lt;/b&gt; (non venduto: altrimenti è inventory), &lt;b&gt;pluriennale&lt;/b&gt;.&lt;/p&gt;

  &lt;h3&gt;La vita di un PPE in una frase&lt;/h3&gt;
  &lt;p&gt;Il PPE è &lt;b&gt;misurato inizialmente al costo&lt;/b&gt;, poi secondo il &lt;b&gt;cost model&lt;/b&gt; o il &lt;b&gt;revaluation model&lt;/b&gt;, ed è &lt;b&gt;ammortizzato&lt;/b&gt; ripartendo il valore ammortizzabile &lt;b&gt;in modo sistematico lungo la vita utile&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 150&quot; role=&quot;img&quot; aria-label=&quot;Ciclo di vita di un PPE&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;g&gt;&lt;rect x=&quot;5&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;62&quot; rx=&quot;31&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Recognition&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;par. 7–14&lt;/text&gt;&lt;/g&gt;
        &lt;g&gt;&lt;rect x=&quot;183&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;62&quot; rx=&quot;31&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;263&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Initial: at cost&lt;/text&gt;&lt;text x=&quot;263&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;par. 15–28&lt;/text&gt;&lt;/g&gt;
        &lt;g&gt;&lt;rect x=&quot;371&quot; y=&quot;40&quot; width=&quot;170&quot; height=&quot;62&quot; rx=&quot;31&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;456&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Cost model o&lt;/text&gt;&lt;text x=&quot;456&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Revaluation model&lt;/text&gt;&lt;text x=&quot;456&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;par. 29–42&lt;/text&gt;&lt;/g&gt;
        &lt;g&gt;&lt;rect x=&quot;569&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;62&quot; rx=&quot;31&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;644&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Depreciation&lt;/text&gt;&lt;text x=&quot;644&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;+ Impairment&lt;/text&gt;&lt;text x=&quot;644&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;par. 43–66&lt;/text&gt;&lt;/g&gt;
        &lt;g&gt;&lt;rect x=&quot;747&quot; y=&quot;40&quot; width=&quot;148&quot; height=&quot;62&quot; rx=&quot;31&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;821&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Derecognition&lt;/text&gt;&lt;text x=&quot;821&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;par. 67–72&lt;/text&gt;&lt;/g&gt;
      &lt;/g&gt;
      &lt;g stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#arr)&quot;&gt;&lt;path d=&quot;M156,71 H180&quot;/&gt;&lt;path d=&quot;M344,71 H368&quot;/&gt;&lt;path d=&quot;M542,71 H566&quot;/&gt;&lt;path d=&quot;M720,71 H744&quot;/&gt;&lt;/g&gt;
      &lt;text x=&quot;450&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;i numeri di paragrafo sono quelli indicati nelle intestazioni delle slide&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Scope: dove l&#x27;IAS 16 non si applica&lt;/h3&gt;
  &lt;p&gt;L&#x27;IAS 16 si applica al PPE &lt;b&gt;salvo che un altro standard richieda o permetta un trattamento diverso&lt;/b&gt; (IAS 16.2). Non si applica a: &lt;span class=&quot;src&quot;&gt;IAS 16.3 · slide 14–15&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;a) PPE held for sale → IFRS 5&lt;/summary&gt;&lt;div&gt;Il PPE classificato come &lt;span class=&quot;term&quot;&gt;held for sale&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(destinato alla vendita: il suo valore si recupererà vendendolo, non usandolo)&lt;/span&gt; segue l&#x27;IFRS 5 &lt;i&gt;Non-current Assets Held for Sale and Discontinued Operations&lt;/i&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;b) Biological assets → IAS 41&lt;/summary&gt;&lt;div&gt;Gli asset biologici dell&#x27;attività agricola seguono l&#x27;IAS 41 &lt;i&gt;Agriculture&lt;/i&gt;, &lt;b&gt;tranne le bearer plants&lt;/b&gt; &lt;span class=&quot;gloss&quot;&gt;(piante &quot;portatrici&quot;, che producono frutti per più periodi: viti, alberi da frutto, palme da olio)&lt;/span&gt;, che rientrano nell&#x27;IAS 16. Il &lt;b&gt;prodotto&lt;/b&gt; che cresce sulle bearer plants (l&#x27;uva) resta invece in IAS 41.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;c) Exploration &amp;amp; evaluation assets → IFRS 6&lt;/summary&gt;&lt;div&gt;Rilevazione e misurazione degli asset di esplorazione e valutazione di risorse minerarie seguono l&#x27;IFRS 6 &lt;i&gt;Exploration for and Evaluation of Mineral Resources&lt;/i&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;d) Mineral rights &amp;amp; reserves&lt;/summary&gt;&lt;div&gt;Diritti minerari e riserve di petrolio, gas naturale e risorse simili &lt;b&gt;non rigenerative&lt;/b&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Attenzione al &quot;però&quot;.&lt;/b&gt; L&#x27;IAS 16 &lt;b&gt;si applica&lt;/b&gt; comunque al PPE &lt;b&gt;usato per sviluppare o mantenere&lt;/b&gt; gli asset dei punti (b)–(d): la piattaforma di perforazione è PPE anche se il giacimento è fuori scope. E l&#x27;entità che usa il &lt;b&gt;cost model&lt;/b&gt; per l&#x27;investment property (IAS 40) applica il cost model dell&#x27;IAS 16 agli investment property di proprietà (IAS 16.5). &lt;span class=&quot;src&quot;&gt;slide 15, 18&lt;/span&gt;&lt;/div&gt;

  &lt;h3&gt;Esempio: bestiame e trattore&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Il caso.&lt;/b&gt; Un&#x27;entità possiede una mandria di bovini da carne che costituisce il &lt;i&gt;breeding stock&lt;/i&gt; (il nucleo riproduttivo) della sua attività agricola. Possiede anche un &lt;b&gt;trattore con rimorchio&lt;/b&gt; usato per portare il mangime al bestiame. Quale standard si applica a trattore e rimorchio? &lt;span class=&quot;src&quot;&gt;slide 16–17&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Pensa alle tre opzioni prima di andare avanti: IAS 2 &lt;i&gt;Inventories&lt;/i&gt;, IAS 16 &lt;i&gt;PPE&lt;/i&gt;, IAS 40 &lt;i&gt;Investment Property&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Escludiamo.&lt;/b&gt; Non è &lt;b&gt;IAS 2&lt;/b&gt;: il trattore non è destinato alla vendita né consumato nel processo produttivo. Non è &lt;b&gt;IAS 40&lt;/b&gt;: non è un immobile tenuto per canoni o apprezzamento.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Risposta: IAS 16.&lt;/b&gt; È un bene materiale usato nella produzione per più di un periodo. Il bestiame da riproduzione è un &lt;i&gt;biological asset&lt;/i&gt; (IAS 41), ma l&#x27;IAS 16 si applica al PPE usato per &lt;b&gt;mantenere&lt;/b&gt; gli asset biologici. Lo standard della mandria non &quot;contagia&quot; il trattore.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;small&quot; data-lab&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Autoverifica · 3&lt;/h4&gt;
    &lt;p style=&quot;margin:.2em 0 0&quot;&gt;&lt;b&gt;Una vigna (le piante di vite) di un&#x27;azienda vinicola segue…&lt;/b&gt;&lt;/p&gt;
    &lt;div class=&quot;mcq&quot;&gt;&lt;button data-why=&quot;Le viti sono bearer plants, escluse da IAS 41 e incluse in IAS 16.&quot;&gt;IAS 41&lt;/button&gt;&lt;button data-ok data-why=&quot;Le bearer plants sono nello scope dell&#x27;IAS 16; l&#x27;uva che cresce sulla vite resta in IAS 41.&quot;&gt;IAS 16&lt;/button&gt;&lt;button data-why=&quot;Non sono destinate alla vendita.&quot;&gt;IAS 2&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;mcq-fb&quot;&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Un macchinario che l&#x27;entità ha deciso di vendere e che soddisfa i criteri dell&#x27;IFRS 5 resta in IAS 16?&lt;/summary&gt;&lt;div&gt;No: il PPE classificato held for sale esce dallo scope dell&#x27;IAS 16 (16.3a) e segue l&#x27;IFRS 5. Da quel momento cessa anche l&#x27;ammortamento (16.55).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono i tre requisiti della definizione di PPE?&lt;/summary&gt;&lt;div&gt;Bene materiale (tangible); detenuto per l&#x27;uso nella produzione/fornitura di beni o servizi, per locazione o per scopi amministrativi; utilizzo atteso per più di un periodo.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ 4 RECOGNITION ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s4&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;IAS 16 · par. 7–14&lt;/span&gt;&lt;h2&gt;Recognition&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Recognition&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(rilevazione: far entrare un elemento in bilancio, con un nome e un importo)&lt;/span&gt;. Il costo di un elemento di PPE si rileva come asset &lt;b&gt;se, e solo se&lt;/b&gt;, valgono entrambi i criteri: &lt;span class=&quot;src&quot;&gt;IAS 16.7 · slide 19&lt;/span&gt;&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 200&quot; role=&quot;img&quot; aria-label=&quot;Albero decisionale della recognition&quot;&gt;
      &lt;g font-size=&quot;13.5&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;94&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Costo sostenuto&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;acquisto, costruzione, aggiunta&lt;/text&gt;
        &lt;path d=&quot;M180,98 H220&quot; stroke=&quot;var(--ink2)&quot; marker-end=&quot;url(#arr)&quot;/&gt;
        &lt;polygon points=&quot;320,40 420,98 320,156 220,98&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot;&gt;benefici futuri&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;109&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot;&gt;probabili?&lt;/text&gt;
        &lt;path d=&quot;M420,98 H460&quot; stroke=&quot;var(--ink2)&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;sì&lt;/text&gt;
        &lt;polygon points=&quot;560,40 660,98 560,156 460,98&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;560&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot;&gt;costo misurabile&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;109&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot;&gt;attendibilmente?&lt;/text&gt;
        &lt;path d=&quot;M660,98 H700&quot; stroke=&quot;var(--ink2)&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;text x=&quot;680&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;sì&lt;/text&gt;
        &lt;rect x=&quot;702&quot; y=&quot;70&quot; width=&quot;190&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--ochre)&quot; /&gt;&lt;text x=&quot;797&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--paper)&quot;&gt;Asset (PPE)&lt;/text&gt;&lt;text x=&quot;797&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--paper)&quot;&gt;nel carrying amount&lt;/text&gt;
        &lt;path d=&quot;M320,156 V185 H560 V156&quot; stroke=&quot;var(--bad)&quot; fill=&quot;none&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--bad)&quot;&gt;no → costo a conto economico&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Spare parts&lt;/button&gt;&lt;button&gt;Unità di misura&lt;/button&gt;&lt;button&gt;Quali costi&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Ricambi (&lt;i&gt;spare parts&lt;/i&gt;), attrezzature di riserva (&lt;i&gt;stand-by equipment&lt;/i&gt;) e di manutenzione (&lt;i&gt;servicing equipment&lt;/i&gt;) sono PPE &lt;b&gt;quando soddisfano la definizione di PPE&lt;/b&gt; (cioè quando si useranno per più di un periodo); &lt;b&gt;altrimenti&lt;/b&gt; sono &lt;b&gt;inventories&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;IAS 16.8 · slide 19&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Lo standard &lt;b&gt;non stabilisce l&#x27;unità di misura&lt;/b&gt;, cioè che cosa costituisce un &quot;elemento&quot; di PPE: serve giudizio. Può essere opportuno &lt;b&gt;aggregare elementi singolarmente irrilevanti&lt;/b&gt;, come &lt;i&gt;moulds&lt;/i&gt; (forme, stampi), &lt;i&gt;tools and dies&lt;/i&gt; (utensili e stampi), e applicare i criteri al &lt;b&gt;valore aggregato&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;IAS 16.9 · slide 20&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Il principio si applica a &lt;b&gt;tutti&lt;/b&gt; i costi di PPE nel momento in cui sono sostenuti: costi &lt;b&gt;iniziali&lt;/b&gt; per acquistare o costruire, e costi &lt;b&gt;successivi&lt;/b&gt; per aggiungere, sostituire parti o fare manutenzione. Il costo può includere anche costi di leasing di asset usati per costruire o manutenere il PPE, come l&#x27;ammortamento di &lt;span class=&quot;term&quot;&gt;right-of-use assets&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(il diritto d&#x27;uso di un bene in leasing, rilevato dal locatario)&lt;/span&gt;. &lt;span class=&quot;src&quot;&gt;IAS 16.10 · slide 21&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Sostituzione di parti: il component approach&lt;/h3&gt;
  &lt;p&gt;Alcune parti richiedono una &lt;b&gt;sostituzione a intervalli regolari&lt;/b&gt;: il rivestimento di un forno dopo un certo numero di ore, i sedili e le cucine (&lt;i&gt;galleys&lt;/i&gt;) di un aereo più volte nella vita della fusoliera, oppure le pareti interne di un edificio, sostituite meno spesso o una volta sola. Se i criteri di recognition sono soddisfatti, il costo della sostituzione &lt;b&gt;entra nel carrying amount&lt;/b&gt; del bene quando è sostenuto. &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;Il &lt;span class=&quot;term&quot;&gt;carrying amount&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(valore contabile: l&#x27;importo a cui l&#x27;asset è iscritto nello stato patrimoniale, CF 5.1)&lt;/span&gt; delle parti sostituite &lt;b&gt;si elimina&lt;/b&gt; secondo le regole di derecognition (par. 67–72). E ogni parte con un costo &lt;b&gt;significativo rispetto al costo totale&lt;/b&gt; va &lt;b&gt;ammortizzata separatamente&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;IAS 16.13, 16.43 · slide 23&lt;/span&gt;&lt;/p&gt;

  &lt;h3&gt;Major inspections&lt;/h3&gt;
  &lt;p&gt;Per alcuni beni (un aereo, per esempio) la condizione per continuare a operare è sottoporli a &lt;b&gt;ispezioni generali periodiche&lt;/b&gt; (&lt;i&gt;major inspections&lt;/i&gt;), anche se non si sostituisce alcuna parte. &lt;span class=&quot;src&quot;&gt;IAS 16.14 · slide 24&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;1 · Capitalizza.&lt;/b&gt; A ogni ispezione il suo costo si rileva nel carrying amount &lt;b&gt;come se fosse una sostituzione&lt;/b&gt;, se i criteri di recognition sono soddisfatti.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;2 · Elimina la vecchia.&lt;/b&gt; L&#x27;eventuale valore residuo del costo dell&#x27;ispezione &lt;b&gt;precedente&lt;/b&gt; (distinto dalle parti fisiche) si &lt;b&gt;elimina&lt;/b&gt; (derecognition).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;3 · Anche se non era visibile.&lt;/b&gt; Questo vale &lt;b&gt;anche se&lt;/b&gt; il costo della precedente ispezione non era stato identificato al momento dell&#x27;acquisto. Se serve, si usa il &lt;b&gt;costo stimato di un&#x27;ispezione futura simile&lt;/b&gt; come indicazione del costo della componente &quot;ispezione&quot; inclusa nel prezzo originario.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;small&quot; data-lab&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;I numeri di questi meccanismi sono nella sezione &lt;a href=&quot;#s10&quot;&gt;10 · Esempi applicativi&lt;/a&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Autoverifica · 4&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Quali sono i due criteri di recognition dell&#x27;IAS 16.7?&lt;/summary&gt;&lt;div&gt;(1) È probabile che i benefici economici futuri associati all&#x27;elemento affluiranno all&#x27;entità; (2) il costo dell&#x27;elemento è misurabile in modo attendibile. Devono valere entrambi.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Un&#x27;impresa compra 300 piccoli stampi da 40 € ciascuno, usati per anni. Come può trattarli?&lt;/summary&gt;&lt;div&gt;L&#x27;IAS 16.9 consente di aggregare elementi singolarmente irrilevanti (moulds, tools and dies) e di applicare i criteri di recognition al valore aggregato (12.000 €), rilevandoli come PPE.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Si sostituiscono i sedili di un aereo. Che cosa succede ai sedili vecchi?&lt;/summary&gt;&lt;div&gt;Il costo dei nuovi sedili entra nel carrying amount se soddisfa i criteri; il carrying amount dei sedili sostituiti si elimina (derecognition, IAS 16.13), con eventuale utile o perdita a conto economico.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 INITIAL MEASUREMENT ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s5&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;IAS 16 · par. 15–28&lt;/span&gt;&lt;h2&gt;Initial measurement&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Rilevare significa dare all&#x27;elemento un &lt;b&gt;importo monetario&lt;/b&gt;; per farlo serve una &lt;span class=&quot;term&quot;&gt;measurement basis&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(base di misurazione: la caratteristica dell&#x27;elemento che si misura, per esempio historical cost, fair value o fulfilment value)&lt;/span&gt;. Applicarla a un asset produce sia una misura dell&#x27;asset sia dei relativi proventi e costi. &lt;span class=&quot;src&quot;&gt;CF 5.1, 6.1 · slide 25&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Cost &lt;span class=&quot;src&quot;&gt;IAS 16.6&lt;/span&gt;&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;L&#x27;importo di &lt;b&gt;cash o cash equivalents pagato&lt;/b&gt;, oppure il &lt;b&gt;fair value&lt;/b&gt; dell&#x27;altro corrispettivo dato per acquisire l&#x27;asset al momento dell&#x27;acquisto o della costruzione, oppure, se applicabile, l&#x27;importo attribuito secondo altri IFRS (es. IFRS 2 &lt;i&gt;Share-based payment&lt;/i&gt;, se il bene è pagato con azioni).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Fair value &lt;span class=&quot;src&quot;&gt;IAS 16.6&lt;/span&gt;&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Il prezzo che si &lt;b&gt;riceverebbe per vendere&lt;/b&gt; un asset (o si pagherebbe per trasferire una passività) in una &lt;b&gt;transazione ordinata tra operatori di mercato&lt;/b&gt; alla data di misurazione (IFRS 13 &lt;i&gt;Fair Value Measurement&lt;/i&gt;). È un prezzo di uscita, visto dal mercato.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Quale base, per quale asset&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Historical cost&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:1.1em&quot;&gt;&lt;li&gt;Inventory (IAS 2.9)&lt;/li&gt;&lt;li&gt;&lt;b&gt;PPE (IAS 16.15)&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Investment property (IAS 40.20)&lt;/li&gt;&lt;li&gt;Intangible assets (IAS 38.24)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Fair value&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:1.1em&quot;&gt;&lt;li&gt;Biological assets (IAS 41.12)&lt;/li&gt;&lt;li&gt;Asset acquisiti in una business combination (IFRS 3.18)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;slide 27&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Quando il costo storico non è banale&lt;/summary&gt;&lt;div&gt;Comprare un bene in contanti è semplice. Diventa più complesso quando il corrispettivo è &lt;b&gt;non monetario&lt;/b&gt;, &lt;b&gt;differito&lt;/b&gt;, &lt;b&gt;anticipato&lt;/b&gt;, oppure, per il PPE, quando bisogna &lt;b&gt;stimare i costi di smantellamento, rimozione e ripristino&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 28&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Quando il fair value non è banale&lt;/summary&gt;&lt;div&gt;È semplice con un &lt;b&gt;level 1&lt;/b&gt; (prezzo quotato in un mercato attivo per un bene identico). È più complesso con i &lt;b&gt;level 2 e 3&lt;/b&gt; (input osservabili indiretti, oppure input non osservabili stimati dall&#x27;entità): business combinations, permute (&lt;i&gt;barter transactions&lt;/i&gt;), contributi pubblici (&lt;i&gt;government grants&lt;/i&gt;). &lt;span class=&quot;src&quot;&gt;slide 29&lt;/span&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; la descrizione dei livelli viene dall&#x27;IFRS 13, vedi &lt;a href=&quot;#s11&quot;&gt;Per approfondire&lt;/a&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;

  &lt;h3&gt;Le tre componenti del costo&lt;/h3&gt;
  &lt;p&gt;Un PPE che soddisfa i criteri di recognition &lt;b&gt;si misura al costo&lt;/b&gt; (IAS 16.15). Il costo comprende: &lt;span class=&quot;src&quot;&gt;IAS 16.16 · slide 30–31&lt;/span&gt;&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 260&quot; role=&quot;img&quot; aria-label=&quot;Composizione del costo di un PPE&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;30&quot; width=&quot;270&quot; height=&quot;200&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
        &lt;text x=&quot;155&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;a) Purchase price&lt;/text&gt;
        &lt;text x=&quot;40&quot; y=&quot;90&quot;&gt;  prezzo di listino&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;114&quot;&gt;+ dazi all&#x27;importazione&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;138&quot;&gt;+ imposte non recuperabili&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;162&quot; style=&quot;fill:var(--bad)&quot;&gt;− sconti commerciali e abbuoni&lt;/text&gt;
        &lt;text x=&quot;155&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;(trade discounts and rebates)&lt;/text&gt;
        &lt;text x=&quot;305&quot; y=&quot;135&quot; font-size=&quot;26&quot; class=&quot;mut&quot;&gt;+&lt;/text&gt;
        &lt;rect x=&quot;330&quot; y=&quot;30&quot; width=&quot;270&quot; height=&quot;200&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
        &lt;text x=&quot;465&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;b) Directly attributable&lt;/text&gt;
        &lt;text x=&quot;350&quot; y=&quot;86&quot;&gt;• benefici ai dipendenti (IAS 19)&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;108&quot;&gt;• preparazione del sito&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;130&quot;&gt;• consegna e movimentazione&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;152&quot;&gt;• installazione e montaggio&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;174&quot;&gt;• collaudo (testing)&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;196&quot;&gt;• onorari professionali&lt;/text&gt;
        &lt;text x=&quot;615&quot; y=&quot;135&quot; font-size=&quot;26&quot; class=&quot;mut&quot;&gt;+&lt;/text&gt;
        &lt;rect x=&quot;640&quot; y=&quot;30&quot; width=&quot;245&quot; height=&quot;200&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
        &lt;text x=&quot;762&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;c) Dismantling &amp;amp;&lt;/text&gt;&lt;text x=&quot;762&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;restoration&lt;/text&gt;
        &lt;text x=&quot;660&quot; y=&quot;108&quot;&gt;stima iniziale dei costi di&lt;/text&gt;&lt;text x=&quot;660&quot; y=&quot;130&quot;&gt;smantellare, rimuovere e&lt;/text&gt;&lt;text x=&quot;660&quot; y=&quot;152&quot;&gt;ripristinare il sito, quando&lt;/text&gt;&lt;text x=&quot;660&quot; y=&quot;174&quot;&gt;nasce l&#x27;obbligo&lt;/text&gt;
        &lt;text x=&quot;762&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;(es. una piattaforma offshore)&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;&quot;Directly attributable&quot; vuol dire costi necessari a portare il bene nel &lt;b&gt;luogo e nella condizione&lt;/b&gt; per funzionare come previsto dalla direzione (IAS 16.16b–17, slide 31–32).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Laboratorio: dentro o fuori dal costo?&lt;/h3&gt;
  &lt;p&gt;Per ogni voce scegli se va &lt;b&gt;capitalizzata&lt;/b&gt; (nel costo del PPE) o &lt;b&gt;spesata&lt;/b&gt; (a conto economico). Le risposte vengono da IAS 16.16–20A (slide 31–35).&lt;/p&gt;
  &lt;div class=&quot;sorter tile&quot; id=&quot;sorter&quot;&gt;&lt;ul&gt;&lt;/ul&gt;&lt;p class=&quot;small&quot; id=&quot;sorter-score&quot; style=&quot;margin:.6em 0 0&quot;&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Quando smettere di capitalizzare&lt;/h3&gt;
  &lt;p&gt;La capitalizzazione &lt;b&gt;cessa quando il bene è nel luogo e nella condizione necessari per funzionare come previsto dalla direzione&lt;/b&gt;. I costi di utilizzo o di ricollocazione non entrano nel carrying amount; per esempio: &lt;span class=&quot;src&quot;&gt;IAS 16.20 · slide 34&lt;/span&gt;&lt;/p&gt;
  &lt;ul&gt;&lt;li&gt;costi sostenuti mentre un bene già pronto non è ancora in uso o lavora sotto capacità;&lt;/li&gt;&lt;li&gt;perdite operative iniziali, mentre cresce la domanda per l&#x27;output;&lt;/li&gt;&lt;li&gt;costi di ricollocazione o riorganizzazione delle attività.&lt;/li&gt;&lt;/ul&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Campioni prodotti durante il collaudo (IAS 16.20A).&lt;/b&gt; Se mentre si porta il bene in condizione di funzionare si producono elementi (es. campioni di prova) e li si vende, &lt;b&gt;ricavi e relativo costo vanno a profit or loss&lt;/b&gt;; il costo si misura con le regole dell&#x27;IAS 2. Non si riduce il costo del PPE. &lt;span class=&quot;src&quot;&gt;slide 35&lt;/span&gt;
  &lt;br&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; Questa regola nasce dall&#x27;emendamento &lt;i&gt;Proceeds before Intended Use&lt;/i&gt; (maggio 2020, in vigore dal 1° gennaio 2022): prima i ricavi dei campioni si deducevano dal costo di collaudo. &lt;a href=&quot;https://www.iasplus.com/en/news/2020/05/ias-16&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Measurement of cost: pagamento differito e permute&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Deferred payment&lt;/button&gt;&lt;button&gt;Exchange of assets&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Il costo è il &lt;span class=&quot;term&quot;&gt;cash price equivalent&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(il prezzo che si pagherebbe in contanti)&lt;/span&gt; alla data di recognition. Se il pagamento è &lt;b&gt;dilazionato oltre i normali termini di credito&lt;/b&gt;, la differenza tra il prezzo per contanti e il totale pagato è &lt;b&gt;interesse&lt;/b&gt; per la durata del credito, salvo capitalizzazione secondo l&#x27;IAS 23 &lt;i&gt;Borrowing Costs&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;IAS 16.23 · slide 36&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;ctrls&quot;&gt;
        &lt;label&gt;Prezzo per contanti: &lt;output id=&quot;dp-cash&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dp-c&quot; min=&quot;50000&quot; max=&quot;200000&quot; step=&quot;5000&quot; value=&quot;100000&quot;&gt;&lt;/label&gt;
        &lt;label&gt;Totale pagato a rate: &lt;output id=&quot;dp-tot&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dp-t&quot; min=&quot;50000&quot; max=&quot;260000&quot; step=&quot;5000&quot; value=&quot;121000&quot;&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;readout&quot;&gt;&lt;div&gt;&lt;span&gt;Costo del PPE&lt;/span&gt;&lt;b id=&quot;dp-ppe&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Interessi nel periodo di credito&lt;/span&gt;&lt;b id=&quot;dp-int&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Esempio didattico, non nelle slide: il bene entra al valore &quot;a pronti&quot;; il sovrapprezzo della dilazione è un costo finanziario.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Se un PPE si ottiene in cambio di asset non monetari (o di un mix di asset monetari e non monetari), il costo è il &lt;b&gt;fair value&lt;/b&gt;, &lt;b&gt;a meno che&lt;/b&gt;: &lt;span class=&quot;src&quot;&gt;IAS 16.24 · slide 37&lt;/span&gt;&lt;/p&gt;
      &lt;ol type=&quot;a&quot;&gt;&lt;li&gt;la permuta &lt;b&gt;manchi di sostanza commerciale&lt;/b&gt; (&lt;i&gt;commercial substance&lt;/i&gt;: i flussi di cassa futuri dell&#x27;entità non cambiano davvero dopo lo scambio), oppure&lt;/li&gt;&lt;li&gt;non sia misurabile attendibilmente il fair value &lt;b&gt;né&lt;/b&gt; dell&#x27;asset ricevuto &lt;b&gt;né&lt;/b&gt; di quello ceduto.&lt;/li&gt;&lt;/ol&gt;
      &lt;p&gt;In questi casi il costo è il &lt;b&gt;carrying amount dell&#x27;asset ceduto&lt;/b&gt;. La regola vale anche se l&#x27;entità non può eliminare subito l&#x27;asset ceduto.&lt;/p&gt;
      &lt;figure class=&quot;fig&quot; style=&quot;margin:.4em 0 0&quot;&gt;
        &lt;svg viewBox=&quot;0 0 700 120&quot; role=&quot;img&quot; aria-label=&quot;Permuta: decisione&quot;&gt;&lt;g font-size=&quot;13&quot;&gt;
          &lt;rect x=&quot;5&quot; y=&quot;35&quot; width=&quot;150&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Permuta&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;asset non monetario&lt;/text&gt;
          &lt;path d=&quot;M155,60 H200&quot; stroke=&quot;var(--ink2)&quot; marker-end=&quot;url(#arr)&quot;/&gt;
          &lt;rect x=&quot;202&quot; y=&quot;25&quot; width=&quot;250&quot; height=&quot;70&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;327&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;sostanza commerciale  E&lt;/text&gt;&lt;text x=&quot;327&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;fair value attendibile?&lt;/text&gt;
          &lt;path d=&quot;M452,45 L520,22&quot; stroke=&quot;var(--good)&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;text x=&quot;525&quot; y=&quot;26&quot; style=&quot;fill:var(--good)&quot; font-weight=&quot;600&quot;&gt;sì → fair value&lt;/text&gt;
          &lt;path d=&quot;M452,78 L520,100&quot; stroke=&quot;var(--bad)&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;text x=&quot;525&quot; y=&quot;106&quot; style=&quot;fill:var(--bad)&quot; font-weight=&quot;600&quot;&gt;no → carrying amount ceduto&lt;/text&gt;
        &lt;/g&gt;&lt;/svg&gt;
      &lt;/figure&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Autoverifica · 5&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;I costi di formazione del personale per usare un nuovo impianto si capitalizzano?&lt;/summary&gt;&lt;div&gt;No. I &quot;costs of conducting business … with a new class of customer (including costs of staff training)&quot; non sono costi di PPE (IAS 16.19c).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Le perdite dei primi mesi, mentre la domanda per il prodotto cresce, entrano nel costo?&lt;/summary&gt;&lt;div&gt;No: sono &quot;initial operating losses&quot; (IAS 16.20b), sostenute dopo che il bene è pronto per l&#x27;uso.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché il costo di smantellamento si include fin dall&#x27;inizio nel costo?&lt;/summary&gt;&lt;div&gt;Perché l&#x27;obbligo nasce con l&#x27;acquisto (o con l&#x27;uso del bene) ed è parte di ciò che costa avere quel bene. La stima iniziale entra nel costo (IAS 16.16c) e si ammortizza lungo la vita utile.&lt;/div&gt;&lt;/details&gt;
    &lt;p style=&quot;margin:.6em 0 0&quot;&gt;&lt;b&gt;Permuta senza sostanza commerciale: il nuovo PPE si misura…&lt;/b&gt;&lt;/p&gt;
    &lt;div class=&quot;mcq&quot;&gt;&lt;button data-why=&quot;Il fair value si usa solo se la permuta ha sostanza commerciale e il FV è attendibile.&quot;&gt;al fair value del bene ricevuto&lt;/button&gt;&lt;button data-ok data-why=&quot;IAS 16.24: senza sostanza commerciale si usa il carrying amount dell&#x27;asset dato in cambio.&quot;&gt;al carrying amount del bene ceduto&lt;/button&gt;&lt;button data-why=&quot;Nessuna regola del genere nell&#x27;IAS 16.24.&quot;&gt;a zero&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;mcq-fb&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ 6 AFTER RECOGNITION ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s6&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;6&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;IAS 16 · par. 29–42&lt;/span&gt;&lt;h2&gt;Measurement after recognition&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Dopo l&#x27;ingresso al costo, l&#x27;entità sceglie come &lt;span class=&quot;term&quot;&gt;accounting policy&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(principio contabile adottato dall&#x27;impresa)&lt;/span&gt; il &lt;b&gt;cost model&lt;/b&gt; (par. 30) o il &lt;b&gt;revaluation model&lt;/b&gt; (par. 31), e lo applica a &lt;b&gt;un&#x27;intera classe di PPE&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;IAS 16.29 · slide 38&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Cost model &lt;span class=&quot;src&quot;&gt;IAS 16.30&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;formula&quot; style=&quot;margin:.3em 0&quot;&gt;Carrying amount = &lt;b&gt;Cost&lt;/b&gt; − accumulated depreciation − accumulated impairment losses&lt;/div&gt;
      &lt;p style=&quot;margin:0&quot;&gt;Semplice e verificabile; il valore non segue il mercato.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Revaluation model &lt;span class=&quot;src&quot;&gt;IAS 16.31&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;formula&quot; style=&quot;margin:.3em 0&quot;&gt;Carrying amount = &lt;b&gt;Fair value alla data di rivalutazione&lt;/b&gt; − ammortamenti e impairment &lt;i&gt;successivi&lt;/i&gt;&lt;/div&gt;
      &lt;p style=&quot;margin:0&quot;&gt;Solo se il fair value è &lt;b&gt;misurabile attendibilmente&lt;/b&gt;; rivalutazioni con &lt;b&gt;sufficient regularity&lt;/b&gt;, così che il carrying amount non si discosti in modo rilevante dal fair value di fine periodo.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;slide 41–42&lt;/p&gt;

  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Caso speciale: fondi d&#x27;investimento e contratti assicurativi (IAS 16.29A–29B)&lt;/summary&gt;&lt;div&gt;Alcune entità gestiscono un fondo che dà agli investitori benefici legati alle quote del fondo, oppure emettono contratti assicurativi con &lt;i&gt;direct participation features&lt;/i&gt; (le prestazioni all&#x27;assicurato dipendono dal rendimento di un pool di &quot;underlying items&quot;) e detengono gli elementi sottostanti. Se il fondo o gli underlying items includono &lt;b&gt;immobili a uso proprio&lt;/b&gt; (&lt;i&gt;owner-occupied property&lt;/i&gt;), l&#x27;entità applica l&#x27;IAS 16 ma &lt;b&gt;può scegliere&lt;/b&gt; di misurarli con il &lt;b&gt;fair value model dell&#x27;IAS 40&lt;/b&gt;, in deroga al par. 29. Ai fini di questa scelta, i contratti assicurativi includono i contratti d&#x27;investimento con discretionary participation features (termini definiti nell&#x27;IFRS 17). Questi immobili formano una &lt;b&gt;classe separata di PPE&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 39–40&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Government grants (IAS 16.28)&lt;/summary&gt;&lt;div&gt;Il carrying amount può essere &lt;b&gt;ridotto dai contributi pubblici&lt;/b&gt; secondo l&#x27;IAS 20. &lt;span class=&quot;src&quot;&gt;slide 43&lt;/span&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; L&#x27;IAS 20 consente di presentare i contributi in conto impianti &lt;i&gt;o&lt;/i&gt; come risconto passivo (deferred income) &lt;i&gt;o&lt;/i&gt; a riduzione del valore del bene; nel secondo caso il contributo arriva a conto economico come minore ammortamento. &lt;a href=&quot;https://ifrs.org/issued-standards/list-of-standards/ias-20-accounting-for-government-grants-and-disclosure-of-government-assistance&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation – IAS 20&lt;/a&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Revaluation model: le regole&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Frequenza &lt;span class=&quot;src&quot;&gt;IAS 16.34&lt;/span&gt;&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Dipende da &lt;b&gt;quanto varia il fair value&lt;/b&gt;. Beni con fair value volatile: rivalutazione &lt;b&gt;annuale&lt;/b&gt;. Beni con variazioni modeste: anche &lt;b&gt;ogni 3 o 5 anni&lt;/b&gt;. Si rivaluta quando il fair value si discosta in modo rilevante dal carrying amount.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Classe intera &lt;span class=&quot;src&quot;&gt;IAS 16.36–37&lt;/span&gt;&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Se si rivaluta un elemento, si rivaluta &lt;b&gt;tutta la sua classe&lt;/b&gt; (gruppo di beni di natura e uso simili), così si evita di scegliere solo i beni che conviene rivalutare. Esempi di classi: land; land and buildings; machinery; ships; aircraft; motor vehicles; furniture and fixtures; office equipment; bearer plants. &lt;span class=&quot;src&quot;&gt;slide 44&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Dove va la differenza di rivalutazione&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 230&quot; role=&quot;img&quot; aria-label=&quot;Destinazione degli aumenti e delle diminuzioni da rivalutazione&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;420&quot; height=&quot;190&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;220&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;▲ Aumento (IAS 16.39)&lt;/text&gt;
        &lt;rect x=&quot;30&quot; y=&quot;66&quot; width=&quot;380&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;220&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;regola: OCI → equity &quot;revaluation surplus&quot;&lt;/text&gt;
        &lt;text x=&quot;220&quot; y=&quot;109&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;other comprehensive income, fuori dall&#x27;utile&lt;/text&gt;
        &lt;rect x=&quot;30&quot; y=&quot;134&quot; width=&quot;380&quot; height=&quot;60&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;
        &lt;text x=&quot;220&quot; y=&quot;158&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;eccezione: P&amp;amp;L&lt;/text&gt;
        &lt;text x=&quot;220&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;fino a stornare una diminuzione già passata a P&amp;amp;L&lt;/text&gt;
        &lt;rect x=&quot;470&quot; y=&quot;20&quot; width=&quot;420&quot; height=&quot;190&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
        &lt;text x=&quot;680&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;▼ Diminuzione (IAS 16.40)&lt;/text&gt;
        &lt;rect x=&quot;490&quot; y=&quot;66&quot; width=&quot;380&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot;/&gt;
        &lt;text x=&quot;680&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;regola: P&amp;amp;L&lt;/text&gt;
        &lt;text x=&quot;680&quot; y=&quot;109&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;riduce l&#x27;utile dell&#x27;esercizio&lt;/text&gt;
        &lt;rect x=&quot;490&quot; y=&quot;134&quot; width=&quot;380&quot; height=&quot;60&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;
        &lt;text x=&quot;680&quot; y=&quot;158&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;eccezione: OCI&lt;/text&gt;
        &lt;text x=&quot;680&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;fino al surplus esistente per quel bene (lo riduce)&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;È un&#x27;asimmetria prudenziale: le plusvalenze da rivalutazione non passano dall&#x27;utile, le minusvalenze sì, salvo compensazioni sullo stesso bene. &lt;span class=&quot;src&quot;&gt;slide 45–46&lt;/span&gt;&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Other comprehensive income (OCI)&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(altre componenti di conto economico complessivo: proventi e oneri che non transitano dall&#x27;utile d&#x27;esercizio ma vanno direttamente a una riserva di patrimonio netto)&lt;/span&gt;. &lt;span class=&quot;term&quot;&gt;Revaluation surplus&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(riserva di rivalutazione)&lt;/span&gt;.&lt;/p&gt;

  &lt;h3&gt;Simulatore: due rivalutazioni di fila&lt;/h3&gt;
  &lt;p&gt;Un macchinario ha un carrying amount di &lt;b&gt;800&lt;/b&gt;. Scegli il fair value alla prima e alla seconda rivalutazione e guarda dove finisce ogni differenza. &lt;span class=&quot;small&quot;&gt;(Esempio didattico; per semplicità si ignora l&#x27;ammortamento tra le due date.)&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;tile&quot; id=&quot;rev&quot;&gt;
    &lt;div class=&quot;ctrls&quot;&gt;
      &lt;label&gt;Fair value · rivalutazione 1: &lt;output id=&quot;rv1o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;rv1&quot; min=&quot;300&quot; max=&quot;1400&quot; step=&quot;10&quot; value=&quot;1000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Fair value · rivalutazione 2: &lt;output id=&quot;rv2o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;rv2&quot; min=&quot;300&quot; max=&quot;1400&quot; step=&quot;10&quot; value=&quot;700&quot;&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;svg id=&quot;rev-svg&quot; viewBox=&quot;0 0 860 260&quot; role=&quot;img&quot; aria-label=&quot;Grafico del simulatore di rivalutazione&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tbl&quot; id=&quot;rev-tbl&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Il destino del surplus &lt;span class=&quot;src&quot;&gt;IAS 16.41 · slide 47&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Il revaluation surplus &lt;b&gt;può&lt;/b&gt; essere trasferito &lt;b&gt;direttamente agli utili a nuovo&lt;/b&gt; (&lt;i&gt;retained earnings&lt;/i&gt;) quando il bene è eliminato (tutto in una volta, alla dismissione) oppure &lt;b&gt;gradualmente durante l&#x27;uso&lt;/b&gt;: in tal caso la quota trasferita è la &lt;b&gt;differenza tra l&#x27;ammortamento sul valore rivalutato e l&#x27;ammortamento sul costo originario&lt;/b&gt;. Questi trasferimenti &lt;b&gt;non passano dal conto economico&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Trasferimento annuo = ammortamento sul valore rivalutato − ammortamento sul costo originario&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Autoverifica · 6&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Un&#x27;impresa vuole rivalutare solo il suo capannone di Milano, non quelli di provincia. È possibile?&lt;/summary&gt;&lt;div&gt;No. Se si rivaluta un elemento si deve rivalutare l&#x27;intera classe (IAS 16.36), per esempio &quot;land and buildings&quot;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Anno 1: un impianto viene svalutato di 50 a P&amp;amp;L. Anno 2: viene rivalutato di +80. Dove vanno gli 80?&lt;/summary&gt;&lt;div&gt;50 a P&amp;amp;L, perché stornano la diminuzione precedente rilevata a conto economico (IAS 16.39); i restanti 30 vanno a OCI, nel revaluation surplus.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Ogni quanto si rivaluta?&lt;/summary&gt;&lt;div&gt;Con regolarità sufficiente a evitare differenze rilevanti dal fair value: ogni anno per beni volatili, anche ogni 3–5 anni per beni stabili (IAS 16.34).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7 DEPRECIATION ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s7&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;7&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;IAS 16 · par. 43–62A&lt;/span&gt;&lt;h2&gt;Depreciation&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;blockquote class=&quot;def&quot;&gt;&lt;b&gt;Depreciation&lt;/b&gt; is the systematic allocation of the depreciable amount of an asset over its useful life.&lt;cite&gt;IAS 16.6 · slide 48&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Depreciation&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(ammortamento; per gli intangibili si dice &lt;i&gt;amortisation&lt;/i&gt;)&lt;/span&gt; non è una valutazione: è una &lt;b&gt;ripartizione&lt;/b&gt; del costo negli esercizi in cui il bene produce benefici. La &lt;span class=&quot;term&quot;&gt;depreciable amount&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(valore ammortizzabile)&lt;/span&gt; è il costo (o il valore rivalutato) meno il &lt;span class=&quot;term&quot;&gt;residual value&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(valore residuo: quanto si incasserebbe oggi dalla cessione del bene se avesse già l&#x27;età e le condizioni di fine vita)&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Depreciable amount = &lt;b&gt;Cost&lt;/b&gt; − &lt;b&gt;Residual value&lt;/b&gt; &amp;nbsp;&amp;nbsp;·&amp;nbsp;&amp;nbsp; Quota (a quote costanti) = Depreciable amount ÷ &lt;b&gt;Useful life&lt;/b&gt;&lt;/div&gt;

  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Per componenti&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Ogni parte con costo &lt;b&gt;significativo&lt;/b&gt; rispetto al totale si ammortizza &lt;b&gt;separatamente&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;16.43&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Dove va&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;A &lt;b&gt;profit or loss&lt;/b&gt;, salvo che entri nel carrying amount di un altro asset (es. nel costo delle rimanenze prodotte). &lt;span class=&quot;src&quot;&gt;16.48&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Revisione annuale&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Residual value, useful life &lt;b&gt;e metodo&lt;/b&gt; si rivedono &lt;b&gt;almeno a ogni fine esercizio&lt;/b&gt;; i cambi sono &lt;span class=&quot;term&quot;&gt;change in accounting estimate&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(cambio di stima: effetto solo prospettico)&lt;/span&gt; secondo l&#x27;IAS 8. &lt;span class=&quot;src&quot;&gt;16.51, 16.61&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Nota sull&#x27;IAS 8.&lt;/b&gt; Le slide segnalano che il titolo dell&#x27;IAS 8, &lt;i&gt;Accounting Policies, Changes in Accounting Estimates and Errors&lt;/i&gt;, è stato cambiato dall&#x27;IFRS 18 in &lt;b&gt;&lt;i&gt;Basis of Preparation of Financial Statements&lt;/i&gt;&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 49&lt;/span&gt;&lt;/div&gt;

  &lt;h3&gt;Useful life: due modi di misurarla&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Periodo&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Il &lt;b&gt;periodo&lt;/b&gt; in cui si prevede che il bene sia disponibile per l&#x27;uso (es. 10 anni).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Unità prodotte&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Il &lt;b&gt;numero di unità di produzione&lt;/b&gt; (o simili) che si prevede di ottenere (es. 500.000 pezzi, 20.000 ore di volo). &lt;span class=&quot;src&quot;&gt;IAS 16.6 · slide 53&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Per stimarla si considerano tutti questi fattori, perché i benefici si consumano soprattutto con l&#x27;uso, ma anche per obsolescenza e &lt;i&gt;wear and tear&lt;/i&gt; (usura) mentre il bene è &lt;i&gt;idle&lt;/i&gt; (inattivo): &lt;span class=&quot;src&quot;&gt;IAS 16.56 · slide 51&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;a) Uso atteso&lt;/summary&gt;&lt;div&gt;Misurato sulla capacità o sull&#x27;output fisico atteso del bene.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;b) Usura fisica attesa&lt;/summary&gt;&lt;div&gt;Dipende dai turni di utilizzo, dal programma di riparazioni e manutenzione, dalla cura del bene quando è inattivo.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;c) Obsolescenza tecnica o commerciale&lt;/summary&gt;&lt;div&gt;Da miglioramenti nella produzione o da cambi nella domanda dell&#x27;output. Un calo atteso del prezzo di vendita dei prodotti fatti con il bene può segnalare obsolescenza, quindi una riduzione dei benefici futuri.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;d) Limiti legali o simili&lt;/summary&gt;&lt;div&gt;Per esempio la scadenza dei relativi contratti di leasing.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;

  &lt;h3&gt;Quando inizia e quando finisce&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 170&quot; role=&quot;img&quot; aria-label=&quot;Linea temporale dell&#x27;ammortamento&quot;&gt;
      &lt;line x1=&quot;30&quot; y1=&quot;80&quot; x2=&quot;870&quot; y2=&quot;80&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;rect x=&quot;230&quot; y=&quot;70&quot; width=&quot;520&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
      &lt;text x=&quot;490&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;ammortamento in corso&lt;/text&gt;
      &lt;g font-size=&quot;12.5&quot;&gt;
        &lt;circle cx=&quot;70&quot; cy=&quot;80&quot; r=&quot;7&quot; fill=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot;&gt;acquisto&lt;/text&gt;
        &lt;circle cx=&quot;230&quot; cy=&quot;80&quot; r=&quot;8&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;230&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;INIZIO&lt;/text&gt;&lt;text x=&quot;230&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot;&gt;available for use&lt;/text&gt;&lt;text x=&quot;230&quot; y=&quot;134&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;11.5&quot;&gt;luogo e condizione pronti&lt;/text&gt;
        &lt;rect x=&quot;430&quot; y=&quot;96&quot; width=&quot;120&quot; height=&quot;44&quot; rx=&quot;6&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot;&gt;bene inattivo (idle):&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;600&quot;&gt;NON si ferma*&lt;/text&gt;
        &lt;circle cx=&quot;750&quot; cy=&quot;80&quot; r=&quot;8&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;FINE: la prima tra&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot;&gt;held for sale (IFRS 5)&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;134&quot; text-anchor=&quot;middle&quot;&gt;o derecognition&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;* L&#x27;ammortamento non cessa quando il bene è inattivo o ritirato dall&#x27;uso, salvo che sia completamente ammortizzato. Con i metodi basati sull&#x27;uso (unità prodotte) però la quota può essere zero quando non si produce. &lt;span class=&quot;src&quot;&gt;IAS 16.55 · slide 50&lt;/span&gt;&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Il metodo&lt;/h3&gt;
  &lt;p&gt;Il metodo deve riflettere &lt;b&gt;il modo in cui l&#x27;entità si aspetta di consumare i benefici economici&lt;/b&gt; del bene (IAS 16.60). &lt;b&gt;Non è ammesso un metodo basato sui ricavi&lt;/b&gt; generati dall&#x27;attività che usa il bene: i ricavi dipendono da altri fattori (altri input e processi, attività di vendita, volumi, prezzi, inflazione) che non dicono nulla sul consumo del bene. &lt;span class=&quot;src&quot;&gt;IAS 16.62A · slide 52&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; L&#x27;IAS 16.62 elenca come esempi di metodi lo &lt;b&gt;straight-line&lt;/b&gt; (quote costanti), il &lt;b&gt;diminishing balance&lt;/b&gt; (quote decrescenti) e lo &lt;b&gt;units of production&lt;/b&gt; (unità prodotte). Le slide non li elencano; li usa il grafico qui sotto. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-16-property-plant-and-equipment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation – IAS 16&lt;/a&gt;&lt;/p&gt;

  &lt;div class=&quot;tile&quot; id=&quot;dep&quot;&gt;
    &lt;div class=&quot;tabs&quot; id=&quot;dep-tabs&quot; style=&quot;margin-top:0&quot;&gt;
      &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Straight-line&lt;/button&gt;&lt;button&gt;Diminishing balance&lt;/button&gt;&lt;button&gt;Units of production&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;tabpanel small&quot;&gt;Quota costante: (costo − residuo) ÷ vita utile. Adatto se il bene si consuma in modo uniforme nel tempo.&lt;/div&gt;
      &lt;div class=&quot;tabpanel small&quot;&gt;Tasso costante sul valore residuo, quindi quote alte all&#x27;inizio e basse alla fine. Il tasso è calcolato in modo da arrivare esattamente al residual value.&lt;/div&gt;
      &lt;div class=&quot;tabpanel small&quot;&gt;Quota proporzionale alle unità prodotte nell&#x27;anno (profilo di produzione di esempio). Se attivi &quot;anno 3 fermo&quot;, la quota di quell&#x27;anno è zero.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ctrls&quot;&gt;
