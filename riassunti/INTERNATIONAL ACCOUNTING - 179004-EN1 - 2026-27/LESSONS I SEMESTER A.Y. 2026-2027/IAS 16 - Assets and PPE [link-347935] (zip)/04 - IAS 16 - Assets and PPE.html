      &lt;label&gt;Costo: &lt;output id=&quot;dco&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dc&quot; min=&quot;10000&quot; max=&quot;200000&quot; step=&quot;5000&quot; value=&quot;50000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Residual value: &lt;output id=&quot;dro&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dr&quot; min=&quot;0&quot; max=&quot;40&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Useful life (anni): &lt;output id=&quot;dlo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dl&quot; min=&quot;3&quot; max=&quot;15&quot; step=&quot;1&quot; value=&quot;8&quot;&gt;&lt;/label&gt;
      &lt;label style=&quot;align-self:end&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;didle&quot;&gt; anno 3 fermo (idle)&lt;/label&gt;
    &lt;/div&gt;
    &lt;svg id=&quot;dep-svg&quot; viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;Grafico dell&#x27;ammortamento&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;small&quot; id=&quot;dep-note&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Autoverifica · 7&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Un impianto resta fermo sei mesi per calo della domanda. Si sospende l&#x27;ammortamento a quote costanti?&lt;/summary&gt;&lt;div&gt;No: l&#x27;ammortamento non cessa quando il bene è idle (IAS 16.55). Si ferma solo se il bene è completamente ammortizzato, classificato held for sale o eliminato. Con un metodo a unità prodotte la quota sarebbe invece zero.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché un ammortamento proporzionale ai ricavi non è ammesso?&lt;/summary&gt;&lt;div&gt;Perché i ricavi riflettono prezzi, volumi, inflazione, altri input e attività di vendita, non il consumo dei benefici del bene (IAS 16.62A).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A fine anno si scopre che la vita utile residua è più lunga del previsto. Si rifanno i bilanci passati?&lt;/summary&gt;&lt;div&gt;No: è un cambiamento di stima contabile (IAS 8), con effetto prospettico. Si ripartisce il valore contabile residuo sulla nuova vita residua (IAS 16.51).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 8 IMPAIRMENT ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s8&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;8&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;IAS 16.63–65 · IAS 36&lt;/span&gt;&lt;h2&gt;Impairment&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Per stabilire se un PPE ha subito una perdita di valore, l&#x27;IAS 16 rinvia all&#x27;&lt;b&gt;IAS 36 &lt;i&gt;Impairment of assets&lt;/i&gt;&lt;/b&gt;, che spiega come rivedere il carrying amount, come determinare il &lt;i&gt;recoverable amount&lt;/i&gt; e quando rilevare (o stornare) una perdita. &lt;span class=&quot;src&quot;&gt;IAS 16.63 · slide 57&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Recoverable amount = max( &lt;b&gt;Fair value less costs of disposal&lt;/b&gt; ; &lt;b&gt;Value in use&lt;/b&gt; )&lt;br&gt;&lt;span class=&quot;small&quot;&gt;Impairment loss = Carrying amount − Recoverable amount, se positivo&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Impairment loss&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(perdita per riduzione di valore)&lt;/span&gt;: l&#x27;eccedenza del carrying amount di un asset o di una &lt;span class=&quot;term&quot;&gt;cash-generating unit&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(CGU: il più piccolo gruppo di asset che genera flussi di cassa in entrata in gran parte indipendenti)&lt;/span&gt; sul suo recoverable amount. &lt;span class=&quot;term&quot;&gt;Fair value less costs of disposal&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(quanto si ricaverebbe vendendo, al netto dei costi di vendita)&lt;/span&gt;; &lt;span class=&quot;term&quot;&gt;value in use&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(valore d&#x27;uso: valore attuale dei flussi di cassa futuri attesi dall&#x27;uso del bene)&lt;/span&gt;. &lt;span class=&quot;src&quot;&gt;IAS 36.6 · slide 58&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;Il ragionamento: un asset non può stare in bilancio a più di quanto l&#x27;impresa può &lt;b&gt;recuperare&lt;/b&gt;, vendendolo o usandolo. E l&#x27;impresa sceglie la via migliore, quindi si prende il &lt;b&gt;maggiore&lt;/b&gt; dei due.&lt;/p&gt;

  &lt;div class=&quot;tile&quot; id=&quot;imp&quot;&gt;
    &lt;div class=&quot;ctrls&quot;&gt;
      &lt;label&gt;Carrying amount: &lt;output id=&quot;ica&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ic&quot; min=&quot;100&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;600&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Fair value less costs of disposal: &lt;output id=&quot;ifo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;if&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;420&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Value in use: &lt;output id=&quot;ivo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;iv&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;510&quot;&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;svg id=&quot;imp-svg&quot; viewBox=&quot;0 0 860 220&quot; role=&quot;img&quot; aria-label=&quot;Grafico del test di impairment&quot;&gt;&lt;/svg&gt;
    &lt;p id=&quot;imp-msg&quot; style=&quot;font-weight:600&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Gli indicatori: quando fare il test&lt;/h3&gt;
  &lt;p&gt;L&#x27;entità deve considerare &lt;b&gt;almeno&lt;/b&gt; queste indicazioni &lt;span class=&quot;src&quot;&gt;IAS 36.12 · slide 59–61&lt;/span&gt;:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;External&lt;/button&gt;&lt;button&gt;Internal&lt;/button&gt;&lt;button&gt;Other (internal reporting)&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;ol type=&quot;a&quot;&gt;
      &lt;li&gt;segnali osservabili che il valore del bene è sceso &lt;b&gt;molto più&lt;/b&gt; di quanto ci si aspetterebbe per il tempo o l&#x27;uso normale;&lt;/li&gt;
      &lt;li&gt;cambiamenti significativi e sfavorevoli nell&#x27;ambiente &lt;b&gt;tecnologico, di mercato, economico o legale&lt;/b&gt;;&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;tassi di interesse&lt;/b&gt; di mercato in aumento, che alzano il tasso di attualizzazione del value in use e riducono in modo rilevante il recoverable amount;&lt;/li&gt;
      &lt;li&gt;il carrying amount del patrimonio netto supera la &lt;b&gt;capitalizzazione di borsa&lt;/b&gt;.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;ol type=&quot;a&quot; start=&quot;5&quot;&gt;
      &lt;li&gt;evidenza di &lt;b&gt;obsolescenza o danno fisico&lt;/b&gt;;&lt;/li&gt;
      &lt;li&gt;cambiamenti sfavorevoli nel &lt;b&gt;modo d&#x27;uso&lt;/b&gt;: bene inattivo, piani di dismissione o ristrutturazione, vendita anticipata, vita utile riconsiderata come finita anziché indefinita;&lt;/li&gt;
      &lt;li&gt;dal reporting interno risulta che la &lt;b&gt;performance economica&lt;/b&gt; del bene è o sarà peggiore del previsto.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Prove dal reporting interno (IAS 36.14):&lt;/p&gt;&lt;ol type=&quot;a&quot;&gt;
      &lt;li&gt;flussi per acquistare, gestire o manutenere il bene &lt;b&gt;molto più alti&lt;/b&gt; del budget;&lt;/li&gt;
      &lt;li&gt;flussi netti o risultato operativo effettivi &lt;b&gt;molto peggiori&lt;/b&gt; del budget;&lt;/li&gt;
      &lt;li&gt;calo significativo dei flussi o del risultato &lt;b&gt;a budget&lt;/b&gt;, o forte aumento delle perdite attese;&lt;/li&gt;
      &lt;li&gt;perdite operative o deflussi netti quando si sommano i dati correnti a quelli di budget futuri.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Risarcimenti.&lt;/b&gt; I compensi da terzi per PPE danneggiato, perso o ceduto (es. l&#x27;assicurazione dopo un incendio) vanno a &lt;b&gt;profit or loss quando diventano esigibili&lt;/b&gt;, separati dalla svalutazione. &lt;span class=&quot;src&quot;&gt;IAS 16.65 · slide 57&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Autoverifica · 8&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;CA 500, FVLCD 380, VIU 450. C&#x27;è impairment e di quanto?&lt;/summary&gt;&lt;div&gt;Recoverable amount = max(380; 450) = 450. Impairment loss = 500 − 450 = 50.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;La BCE alza i tassi di 200 punti base. Perché può essere un indicatore di impairment?&lt;/summary&gt;&lt;div&gt;Un tasso di sconto più alto riduce il valore attuale dei flussi futuri, quindi il value in use e potenzialmente il recoverable amount (IAS 36.12c).&lt;/div&gt;&lt;/details&gt;
    &lt;p style=&quot;margin:.6em 0 0&quot;&gt;&lt;b&gt;Quale di questi è un indicatore &quot;interno&quot;?&lt;/b&gt;&lt;/p&gt;
    &lt;div class=&quot;mcq&quot;&gt;&lt;button data-why=&quot;È un indicatore esterno (36.12d).&quot;&gt;Market cap &amp;lt; patrimonio netto contabile&lt;/button&gt;&lt;button data-ok data-why=&quot;È l&#x27;indicatore (e): evidenza di obsolescenza o danno fisico.&quot;&gt;Danno fisico al macchinario&lt;/button&gt;&lt;button data-why=&quot;È esterno (36.12c).&quot;&gt;Aumento dei tassi di mercato&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;mcq-fb&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 9 DERECOGNITION ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s9&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;9&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;IAS 16 · par. 67–72&lt;/span&gt;&lt;h2&gt;Derecognition&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Derecognition&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(eliminazione contabile: togliere il bene dallo stato patrimoniale)&lt;/span&gt;. Il carrying amount di un PPE si elimina: &lt;span class=&quot;src&quot;&gt;IAS 16.67 · slide 55&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;a) On disposal&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Alla cessione (vendita, permuta, donazione…).&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;b) Nessun beneficio futuro&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Quando non ci si aspettano più benefici né dall&#x27;uso né dalla cessione.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;Gain / loss = &lt;b&gt;Net disposal proceeds&lt;/b&gt; − &lt;b&gt;Carrying amount&lt;/b&gt; &amp;nbsp;→ a profit or loss &lt;span class=&quot;src&quot;&gt;IAS 16.71&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;details class=&quot;card&quot; open&gt;&lt;summary&gt;Noleggiatori che vendono (16.68A)&lt;/summary&gt;&lt;div&gt;Chi, nell&#x27;attività ordinaria, &lt;b&gt;vende abitualmente&lt;/b&gt; beni prima tenuti per il noleggio (es. un&#x27;impresa di autonoleggio) li trasferisce a &lt;b&gt;inventories&lt;/b&gt; al carrying amount quando smettono di essere noleggiati e diventano destinati alla vendita. In questo caso &lt;b&gt;non si applica l&#x27;IFRS 5&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 55&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;card&quot; open&gt;&lt;summary&gt;Parti sostituite (16.70)&lt;/summary&gt;&lt;div&gt;Se si capitalizza una sostituzione, si elimina il carrying amount della parte sostituita &lt;b&gt;anche se non era ammortizzata separatamente&lt;/b&gt;. Se non è praticabile determinarlo, si può usare il &lt;b&gt;costo della sostituzione&lt;/b&gt; come indicazione del costo della parte sostituita all&#x27;origine. &lt;span class=&quot;src&quot;&gt;slide 56&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tile&quot;&gt;
    &lt;h4&gt;Prova: vendita di un macchinario&lt;/h4&gt;
    &lt;div class=&quot;ctrls&quot;&gt;
      &lt;label&gt;Carrying amount: &lt;output id=&quot;dgca&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dg1&quot; min=&quot;0&quot; max=&quot;100000&quot; step=&quot;1000&quot; value=&quot;35000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Prezzo di vendita: &lt;output id=&quot;dgpo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dg2&quot; min=&quot;0&quot; max=&quot;100000&quot; step=&quot;1000&quot; value=&quot;40000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Costi di vendita: &lt;output id=&quot;dgco&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dg3&quot; min=&quot;0&quot; max=&quot;10000&quot; step=&quot;500&quot; value=&quot;2000&quot;&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;readout&quot;&gt;&lt;div&gt;&lt;span&gt;Net disposal proceeds&lt;/span&gt;&lt;b id=&quot;dgn&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Gain / loss a P&amp;amp;L&lt;/span&gt;&lt;b id=&quot;dgr&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Autoverifica · 9&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Un furgone con CA 12.000 è venduto a 10.500 con 300 di spese. Risultato?&lt;/summary&gt;&lt;div&gt;Net proceeds = 10.200; loss = 10.200 − 12.000 = −1.800, a profit or loss.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Un&#x27;impresa di autonoleggio mette in vendita le auto dopo 2 anni. IFRS 5?&lt;/summary&gt;&lt;div&gt;No: per chi vende abitualmente beni prima noleggiati, questi passano a inventories al carrying amount e l&#x27;IFRS 5 non si applica (IAS 16.68A).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ 10 ESEMPI ============ --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;s10&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;10&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;IAS 16 Application · slide 63–72&lt;/span&gt;&lt;h2&gt;Esempi applicativi&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;La parte finale delle slide applica i concetti con quattro esercizi numerici. Qui sono ricostruiti e resi interattivi; dove le slide lasciano passaggi impliciti, li spiego.&lt;/p&gt;

  &lt;h3&gt;A · Major inspections: tre modi di trattare una spesa successiva&lt;/h3&gt;
  &lt;p&gt;Un bene costa &lt;b&gt;50.000&lt;/b&gt; e ha vita attesa &lt;b&gt;10 anni&lt;/b&gt;: ammortamento annuo &lt;b&gt;5.000&lt;/b&gt;, cioè il 10% che coincide anche con l&#x27;aliquota &quot;fiscale&quot; indicata nella slide. All&#x27;&lt;b&gt;anno 4&lt;/b&gt; si sostiene una spesa capitalizzabile di &lt;b&gt;25.000&lt;/b&gt; (es. un&#x27;ispezione generale o un miglioramento). Le slide confrontano tre trattamenti. &lt;span class=&quot;src&quot;&gt;slide 64–65&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; id=&quot;mi-tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;① Aliquota fissa sul costo&lt;/button&gt;&lt;button&gt;② Improve the performance&lt;/button&gt;&lt;button&gt;③ Increase the expected life&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Il costo sale a 75.000 e si continua ad applicare il &lt;b&gt;10% sul costo&lt;/b&gt; (7.500 l&#x27;anno). Risultato: il bene &lt;b&gt;non è finito di ammortizzare entro i 10 anni&lt;/b&gt;; servirebbe un 11° anno (in rosso nella slide). È il limite di un&#x27;aliquota fissa di stampo fiscale: non tiene conto che la vita residua è di soli 7 anni.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;La spesa &lt;b&gt;migliora le prestazioni&lt;/b&gt; ma non allunga la vita. Il valore residuo (35.000) + 25.000 = &lt;b&gt;60.000&lt;/b&gt; si ripartisce sui &lt;b&gt;7 anni residui&lt;/b&gt;: 8.571,43 l&#x27;anno. Il bene arriva a zero esattamente all&#x27;anno 10, con ammortamento totale 75.000.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;La spesa &lt;b&gt;allunga la vita utile&lt;/b&gt;: all&#x27;anno 4 la vita residua diventa &lt;b&gt;12 anni&lt;/b&gt; (invece di 7). Nella slide il costo di partenza di questo scenario è &lt;b&gt;45.000&lt;/b&gt; (4.500 l&#x27;anno). All&#x27;anno 4: 31.500 + 25.000 = &lt;b&gt;56.500&lt;/b&gt; ÷ 12 = 4.708,33 l&#x27;anno, fino all&#x27;anno 15 (ammortamento totale 70.000).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tile&quot;&gt;
    &lt;svg id=&quot;mi-svg&quot; viewBox=&quot;0 0 860 280&quot; role=&quot;img&quot; aria-label=&quot;Valore contabile residuo nei tre scenari&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tbl&quot; id=&quot;mi-tbl&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;La regola di fondo è la stessa di IAS 16.14 e 16.51: la spesa entra nel carrying amount e la quota si ricalcola come stima sulla vita residua (scenari ② e ③), non con un&#x27;aliquota fissa.&lt;/p&gt;

  &lt;h3 id=&quot;s10b&quot;&gt;B · Component approach: l&#x27;aereo&lt;/h3&gt;
  &lt;p&gt;Un aereo costa &lt;b&gt;1.000.000&lt;/b&gt;, vita 40 anni. In realtà è fatto di una &lt;b&gt;struttura&lt;/b&gt; (800.000, 40 anni) e di &lt;b&gt;sedili&lt;/b&gt; (200.000, 10 anni). Ogni 10 anni i sedili si sostituiscono con sedili nuovi da &lt;b&gt;250.000&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 66–69&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Senza componenti&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Aereo 1.000.000 × 2,5% = &lt;b&gt;25.000&lt;/b&gt;/anno. All&#x27;anno 11 si aggiungono i sedili nuovi: 1.250.000 × 2,5% = &lt;b&gt;31.250&lt;/b&gt;. I sedili vecchi non escono mai davvero dal costo.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Con componenti (IAS 16.43)&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Struttura 800.000 ÷ 40 = 20.000 + sedili 200.000 ÷ 10 = 20.000 → &lt;b&gt;40.000&lt;/b&gt;/anno. Dall&#x27;anno 11: 20.000 + 250.000 ÷ 10 = &lt;b&gt;45.000&lt;/b&gt;. Dopo 10 anni la struttura vale 600.000 con 30 anni residui: sempre 20.000.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tile&quot; style=&quot;margin-top:14px&quot;&gt;
    &lt;div class=&quot;tabs&quot; id=&quot;ca-tabs&quot; style=&quot;margin-top:0&quot;&gt;&lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Quota annua&lt;/button&gt;&lt;button&gt;Ammortamento cumulato&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;tabpanel small&quot;&gt;Ammortamento di ogni anno nei due approcci (anni 1–48).&lt;/div&gt;&lt;div class=&quot;tabpanel small&quot;&gt;Totale ammortizzato fino a quell&#x27;anno.&lt;/div&gt;&lt;/div&gt;
    &lt;svg id=&quot;ca-svg&quot; viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;Confronto component approach&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;readout&quot;&gt;&lt;div&gt;&lt;span&gt;Totale con componenti (40 anni)&lt;/span&gt;&lt;b&gt;1.750.000&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Totale senza componenti (48 anni)&lt;/span&gt;&lt;b&gt;1.603.750&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Che cosa insegna.&lt;/b&gt; Con i componenti si ammortizza &lt;b&gt;tutto ciò che si è speso&lt;/b&gt; (800.000 di struttura + 200.000 + 3 × 250.000 di sedili = 1.750.000) &lt;b&gt;entro la vita dell&#x27;aereo&lt;/b&gt; e al ritmo di consumo reale di ogni parte. Senza componenti l&#x27;ammortamento è troppo basso nei primi anni, i sedili sostituiti restano nel costo e la coda si trascina fino all&#x27;anno 48, oltre la vita dell&#x27;aereo.
  &lt;br&gt;&lt;span class=&quot;small&quot;&gt;Nota di lettura: nella tabella della slide 69 la base senza componenti, dopo ogni sostituzione, scende di 50.000 dall&#x27;anno successivo (1.250.000 → 1.200.000, 1.450.000 → 1.400.000, 1.650.000 → 1.600.000). La slide non spiega questo passaggio: chiedine il motivo a lezione.&lt;/span&gt;&lt;/div&gt;

  &lt;h3&gt;C · Capital maintenance: che cosa vuol dire &quot;aver guadagnato&quot;?&lt;/h3&gt;
  &lt;p&gt;Il 10/01/2019 un&#x27;impresa nasce con &lt;b&gt;100&lt;/b&gt; di cassa e 100 di equity e compra un impianto da 100 (vita 10 anni). Nell&#x27;anno: ricavi 112, costo del venduto 100, ammortamento 10 → &lt;b&gt;utile 2&lt;/b&gt;. Inflazione 5%; a fine anno sostituire l&#x27;impianto costerebbe &lt;b&gt;120&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 70&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Capital maintenance&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(mantenimento del capitale: c&#x27;è utile solo dopo aver conservato il capitale iniziale; la domanda è quale capitale)&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Financial · nominale&lt;/button&gt;&lt;button&gt;Financial · reale&lt;/button&gt;&lt;button&gt;Physical&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Capitale da mantenere: &lt;b&gt;100&lt;/b&gt; euro nominali. Equity finale 102 → &lt;b&gt;utile 2&lt;/b&gt;.&lt;/p&gt;
      &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;&lt;tr&gt;&lt;th&gt;Assets&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Equity&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Plant&lt;/td&gt;&lt;td&gt;90&lt;/td&gt;&lt;td&gt;Equity&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td&gt;12&lt;/td&gt;&lt;td&gt;Profit&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td&gt;102&lt;/td&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td&gt;102&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Cash 12 = ricavi 112 − costo del venduto 100 (l&#x27;impianto è stato pagato con i 100 iniziali). Plant 90 = 100 − ammortamento 10.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Capitale da mantenere: il &lt;b&gt;potere d&#x27;acquisto&lt;/b&gt; dei 100 iniziali, cioè 100 × 1,05 = &lt;b&gt;105&lt;/b&gt;. Equity finale 102 &amp;lt; 105 → in termini reali l&#x27;impresa ha &lt;b&gt;perso 3&lt;/b&gt;. I 2 di utile nominale sono solo inflazione.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Il calcolo −3 non è nelle slide (che riportano solo il valore 105): è la conseguenza diretta del confronto.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Capitale da mantenere: la &lt;b&gt;capacità produttiva&lt;/b&gt;, cioè un impianto che oggi costa 120. L&#x27;impianto si porta a costo corrente: 120 − 12 di ammortamento = &lt;b&gt;108&lt;/b&gt;. L&#x27;ammortamento sale a 12 (120 ÷ 10) → &lt;b&gt;utile 0&lt;/b&gt;. La differenza 120 − 100 = &lt;b&gt;20&lt;/b&gt; va a una &lt;b&gt;CM Reserve&lt;/b&gt; (riserva di mantenimento del capitale) e non è distribuibile.&lt;/p&gt;
      &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;&lt;tr&gt;&lt;th&gt;Assets&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Equity&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Plant&lt;/td&gt;&lt;td&gt;108&lt;/td&gt;&lt;td&gt;Equity&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td&gt;12&lt;/td&gt;&lt;td&gt;CM Reserve&lt;/td&gt;&lt;td&gt;20&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Conto economico: ricavi 112 − costo del venduto 100 − ammortamento 12 = 0.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt; I due concetti di capitale, financial e physical, sono descritti nel Capitolo 8 del Conceptual Framework, che non impone nessuno dei due; il concetto physical richiede una misurazione a costo corrente. &lt;a href=&quot;https://standards.aasb.gov.au/node/342&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AASB – CF Chapter 8&lt;/a&gt;&lt;/p&gt;

  &lt;h3&gt;D · Revaluation model: le scritture&lt;/h3&gt;
  &lt;p&gt;Le slide riassumono il modello così: a ogni periodo in cui il valore cambia in modo rilevante si &lt;b&gt;aggiorna il valore&lt;/b&gt;, si &lt;b&gt;ammortizza sul nuovo valore&lt;/b&gt; e si rileva una &lt;b&gt;riserva&lt;/b&gt; nel patrimonio netto (CM Reserve o Revaluation Reserve). Effetti: &lt;b&gt;aumenta l&#x27;attivo, aumenta l&#x27;equity, aumenta l&#x27;ammortamento&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 71–72&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Situazione.&lt;/b&gt; Un fabbricato ha valore contabile &lt;b&gt;0&lt;/b&gt; (per esempio, completamente ammortizzato) e fair value &lt;b&gt;1.000&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Anno 1 · scritture&lt;/b&gt;&lt;/p&gt;&lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;&lt;tr&gt;&lt;th&gt;Conto&lt;/th&gt;&lt;th&gt;Dare&lt;/th&gt;&lt;th&gt;Avere&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Building&lt;/td&gt;&lt;td&gt;1.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&amp;nbsp;&amp;nbsp;Revaluation reserve&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;1.000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Depreciation&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&amp;nbsp;&amp;nbsp;Building&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Revaluation reserve&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&amp;nbsp;&amp;nbsp;Distributable revaluation reserve&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;Il giroconto di 30 applica l&#x27;IAS 16.41: ammortamento sul valore rivalutato (30) − ammortamento sul costo originario (0) = 30 di riserva che diventa disponibile.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Fine anno 1&lt;/b&gt;: Buildings &lt;b&gt;970&lt;/b&gt; · Revaluation reserve &lt;b&gt;970&lt;/b&gt; · Distributable revaluation reserve &lt;b&gt;30&lt;/b&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Lo schema della slide non riporta il risultato d&#x27;esercizio (−30 di ammortamento): è quello che riporta in pari attivo (970) e passivo (970 + 30).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Anno 2&lt;/b&gt;: stesse scritture (ammortamento 30; giroconto 30). Fine anno 2: Buildings &lt;b&gt;940&lt;/b&gt; · Revaluation reserve &lt;b&gt;940&lt;/b&gt; · Distributable revaluation reserve &lt;b&gt;60&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;E se il valore scende?&lt;/b&gt; Una &lt;b&gt;svalutazione&lt;/b&gt; (&lt;i&gt;impairment&lt;/i&gt;) va a conto economico &lt;b&gt;per la parte che eccede le rivalutazioni precedenti&lt;/b&gt;; fino a quell&#x27;importo riduce la riserva. È la regola dell&#x27;IAS 16.40 vista nella sezione 6, combinata con l&#x27;&lt;i&gt;impairment test&lt;/i&gt; dell&#x27;IAS 36.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;small&quot; data-lab&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Autoverifica · 10&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Nello scenario ② (improve the performance), da dove viene 8.571,43?&lt;/summary&gt;&lt;div&gt;Valore residuo a fine anno 3 = 35.000; + 25.000 = 60.000; vita residua dall&#x27;anno 4 = 7 anni; 60.000 ÷ 7 = 8.571,43.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Perché con il component approach l&#x27;ammortamento dei primi 10 anni è più alto (40.000 contro 25.000)?&lt;/summary&gt;&lt;div&gt;Perché i sedili (200.000) si consumano in 10 anni, non in 40: ammortizzandoli a parte, la quota riflette il consumo reale.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Con il physical capital maintenance, perché l&#x27;utile passa da 2 a 0?&lt;/summary&gt;&lt;div&gt;Perché l&#x27;ammortamento si calcola sul costo di sostituzione (12 invece di 10) e i 20 di rivalutazione vanno a riserva: per mantenere la capacità produttiva servono 120, e l&#x27;impresa ha esattamente 120 di attivo.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 11 PER APPROFONDIRE ============ --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;s11&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;↗&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;Fonti esterne&lt;/span&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Le slide non citano autori o manuali: rimandano al &lt;b&gt;Conceptual Framework&lt;/b&gt; e a numerosi &lt;b&gt;standard IASB&lt;/b&gt;. Per ciascuno ho cercato una fonte affidabile, di solito il sito dell&#x27;IFRS Foundation, che pubblica i testi (la lettura integrale richiede una registrazione gratuita). &lt;b&gt;Tutto in questa sezione è &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/b&gt;, salvo il &quot;perché conta&quot;, che collega la fonte alla lezione.&lt;/p&gt;

  &lt;h3&gt;Il quadro e lo standard della lezione&lt;/h3&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-16-property-plant-and-equipment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 16 &lt;i&gt;Property, Plant and Equipment&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Pagina ufficiale dell&#x27;IFRS Foundation; l&#x27;edizione attuale è la &quot;2026 Issued&quot;. Lo standard sostituì l&#x27;IAS 16 del 1982. Riassunto e storia degli emendamenti su &lt;a href=&quot;https://www.iasplus.com/standard/ias16.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte)&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è la fonte di tutti i paragrafi citati nelle slide (6, 7–14, 15–28, 29–42, 43–62A, 63–65, 67–72).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/conceptual-framework/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Conceptual Framework for Financial Reporting (2018)&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Definisce asset, passività, equity, proventi e oneri, con i criteri di recognition e le basi di misurazione. Rispetto al 2010 la definizione di asset è passata da &quot;risorsa da cui ci si &lt;i&gt;aspettano&lt;/i&gt; benefici&quot; a &quot;&lt;b&gt;present economic resource&lt;/b&gt;&quot; con il solo &lt;i&gt;potenziale&lt;/i&gt; di produrli, per evitare soglie di probabilità implicite (&lt;a href=&quot;https://accaglobal.com/pk/en/student/exam-support-resources/professional-exams-study-resources/strategic-business-reporting/technical-articles/conceptual-framework.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;articolo tecnico ACCA&lt;/a&gt;). Il Capitolo 8 tratta capital e capital maintenance (&lt;a href=&quot;https://standards.aasb.gov.au/node/342&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo AASB&lt;/a&gt;).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: le sezioni 1–2 e l&#x27;esempio C sono interamente costruiti sul Framework (CF 1.13–1.14, 4.3–4.12, 5.1, 6.1).&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Standard collegati citati nelle slide&lt;/h3&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias36.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 36 &lt;i&gt;Impairment of Assets&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Garantisce che gli asset non stiano in bilancio a più del loro recoverable amount (il maggiore tra fair value less costs of disposal e value in use). Il test si fa quando c&#x27;è un indicatore; per goodwill e intangibili a vita indefinita va fatto ogni anno.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è il rinvio di IAS 16.63 e la base della sezione 8.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.icaew.com/technical/financial-reporting/ifrs/ifrs-standards/ifrs-13-fair-value-measurement&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 13 &lt;i&gt;Fair Value Measurement&lt;/i&gt;&lt;/a&gt; (scheda ICAEW) &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Definisce il fair value e la sua gerarchia: Level 1 = prezzi quotati in mercati attivi per beni identici; Level 2 = altri input osservabili; Level 3 = input non osservabili. Una misura si classifica al livello più basso tra gli input significativi.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: spiega i &quot;level 1, 2, 3&quot; della slide 29 e la definizione di fair value di IAS 16.6.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 18 &lt;i&gt;Presentation and Disclosure in Financial Statements&lt;/i&gt;&lt;/a&gt; e &lt;a href=&quot;https://www.ifrs.org/content/ifrs/home/issued-standards/list-of-standards/ias-8-accounting-policies-changes-in-accounting-estimates-and-errors.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 8&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Emesso nell&#x27;aprile 2024, in vigore dal 1° gennaio 2027, sostituisce l&#x27;IAS 1; alcuni paragrafi dell&#x27;IAS 1 sono stati spostati nell&#x27;IAS 8, ora intitolato &lt;i&gt;Basis of Preparation of Financial Statements&lt;/i&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: spiega la correzione del titolo dell&#x27;IAS 8 nella slide 49 e il destino dell&#x27;IAS 1.66–67 citato nelle slide 7–8.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.iasplus.com/en/news/2020/05/ias-16&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Emendamento IAS 16 &lt;i&gt;Proceeds before Intended Use&lt;/i&gt; (2020)&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Pubblicato il 14 maggio 2020, in vigore dal 2022: vieta di dedurre dal costo del PPE i ricavi della vendita di elementi prodotti prima che il bene sia pronto all&#x27;uso; ricavi e costi vanno a profit or loss. Secondo KPMG riguarda soprattutto il settore estrattivo e petrolchimico.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: è l&#x27;origine dell&#x27;IAS 16.20A (slide 35).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-40-investment-property/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 40 &lt;i&gt;Investment Property&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Immobili tenuti per canoni o per l&#x27;apprezzamento del capitale; consente il fair value model o il cost model, da applicare a tutti gli investimenti immobiliari.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: richiamato da IAS 16.5 e 16.29A (slide 18, 39) e dal quiz del trattore.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/projects/completed-projects/2014/agriculture-bearer-plants/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 41 &lt;i&gt;Agriculture&lt;/i&gt;: progetto Bearer Plants (2014)&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Gli emendamenti del giugno 2014, in vigore dal 2016, hanno portato le bearer plants (viti, alberi della gomma, palme da olio) dall&#x27;IAS 41 all&#x27;IAS 16; il prodotto sulla pianta resta a fair value less costs to sell in IAS 41.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: spiega l&#x27;eccezione della slide 14.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs5.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 5 &lt;i&gt;Non-current Assets Held for Sale and Discontinued Operations&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Un asset è held for sale quando il suo valore si recupererà soprattutto con la vendita anziché con l&#x27;uso continuato; da quel momento non si ammortizza più.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: esclusione di scope (16.3a), fine dell&#x27;ammortamento (16.55), eccezione 16.68A.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://ifrs.org/issued-standards/list-of-standards/ias-20-accounting-for-government-grants-and-disclosure-of-government-assistance&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 20 &lt;i&gt;Government Grants&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;I contributi in conto impianti si presentano come deferred income oppure a riduzione del carrying amount del bene, con scelta applicata in modo coerente.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: IAS 16.28 (slide 43).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/content/ifrs/home/issued-standards/list-of-standards/ias-23-borrowing-costs.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 23 &lt;i&gt;Borrowing Costs&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Gli oneri finanziari direttamente attribuibili a un &lt;i&gt;qualifying asset&lt;/i&gt; (che richiede un periodo sostanziale per essere pronto) fanno parte del suo costo; gli altri sono costi d&#x27;esercizio. Dal 2007 non è più possibile spesarli tutti subito.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: eccezione dell&#x27;IAS 16.23 sul pagamento differito (slide 36).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 2 &lt;i&gt;Inventories&lt;/i&gt;&lt;/a&gt; · &lt;a href=&quot;https://ifrs.org/issued-standards/list-of-standards/ias-38-intangible-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 38 &lt;i&gt;Intangible Assets&lt;/i&gt;&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-3-business-combinations/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 3 &lt;i&gt;Business Combinations&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;IAS 2: costo delle rimanenze e svalutazione al valore netto di realizzo. IAS 38: rilevazione e misurazione degli intangibili (il goodwill da aggregazione segue l&#x27;IFRS 3). IFRS 3: nelle aggregazioni aziendali le attività acquisite si misurano al fair value alla data di acquisizione.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: sono le &quot;altre caselle&quot; della classificazione (slide 11, 27) e gli standard delle altre lezioni del corso su inventories e intangibles.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/content/ifrs/home/issued-standards/list-of-standards/ifrs-6-exploration-for-and-evaluation-of-mineral-resources.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 6 &lt;i&gt;Exploration for and Evaluation of Mineral Resources&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Emesso nel 2004; gli asset di esplorazione si misurano al costo e poi con cost o revaluation model, e l&#x27;entità può mantenere le politiche contabili precedenti.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: esclusione di scope 16.3c (slide 15).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;Richiami minori: &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 7&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-2-share-based-payment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 2&lt;/a&gt; · &lt;a href=&quot;https://ifrs.org/issued-standards/list-of-standards/ias-19-employee-benefits&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 19&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs17-ie.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 17 (esempi illustrativi)&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;IAS 7: definisce cash (cassa e depositi a vista) e cash equivalents (investimenti a breve, molto liquidi, convertibili in importi noti). IFRS 2: pagamenti basati su azioni. IAS 19: tutti i benefici ai dipendenti tranne quelli basati su azioni. IFRS 17: contratti assicurativi, inclusi quelli con direct participation features.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Perché conta: definiscono termini usati nelle slide 7 (cash equivalent), 26 (cost via IFRS 2), 32 (employee benefits) e 39 (fondi e contratti assicurativi).&lt;/p&gt;&lt;/div&gt;

  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Altri materiali del corso.&lt;/b&gt; Gli altri file della cartella &lt;code&gt;corso/&lt;/code&gt; non sono stati consultati per questo riassunto: i collegamenti con le altre lezioni (inventories, investment property, intangibles) si basano solo sui rimandi delle slide 11 e 27 di questa lezione.&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

(function(){
  var fmt=function(n,d){return Number(n).toLocaleString(&#x27;it-IT&#x27;,{minimumFractionDigits:d||0,maximumFractionDigits:d||0});};
  /* linguette */
  document.querySelectorAll(&#x27;.tabs&#x27;).forEach(function(t){
    var bs=t.querySelectorAll(&#x27;.tablist button&#x27;),ps=t.querySelectorAll(&#x27;.tabpanel&#x27;);
    bs.forEach(function(b,i){b.setAttribute(&#x27;role&#x27;,&#x27;tab&#x27;);b.addEventListener(&#x27;click&#x27;,function(){
      bs.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===i);ps[j].hidden=j!==i;});
      t.dispatchEvent(new CustomEvent(&#x27;tabchange&#x27;,{detail:i}));
    });});
    bs.forEach(function(x,j){x.setAttribute(&#x27;aria-selected&#x27;,j===0);ps[j].hidden=j!==0;});
  });
  /* passi */
  document.querySelectorAll(&#x27;.stepper&#x27;).forEach(function(s){
    var st=s.querySelectorAll(&#x27;.step&#x27;),i=0,dots=s.querySelector(&#x27;.dots&#x27;),pv=s.querySelector(&#x27;[data-prev]&#x27;),nx=s.querySelector(&#x27;[data-next]&#x27;),lab=s.querySelector(&#x27;[data-lab]&#x27;);
    st.forEach(function(){dots.appendChild(document.createElement(&#x27;i&#x27;));});
    function show(){st.forEach(function(x,j){x.hidden=j!==i;});dots.querySelectorAll(&#x27;i&#x27;).forEach(function(d,j){d.className=j&lt;=i?&#x27;on&#x27;:&#x27;&#x27;;});pv.disabled=i===0;nx.disabled=i===st.length-1;if(lab)lab.textContent=(i+1)+&#x27; / &#x27;+st.length;}
    pv.addEventListener(&#x27;click&#x27;,function(){if(i&gt;0){i--;show();}});nx.addEventListener(&#x27;click&#x27;,function(){if(i&lt;st.length-1){i++;show();}});show();
  });
  /* domande a scelta */
  document.querySelectorAll(&#x27;.mcq&#x27;).forEach(function(m){
    var fb=m.nextElementSibling;
    m.querySelectorAll(&#x27;button&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      m.querySelectorAll(&#x27;button&#x27;).forEach(function(x){x.classList.remove(&#x27;right&#x27;,&#x27;wrong&#x27;);});
      var ok=b.hasAttribute(&#x27;data-ok&#x27;);b.classList.add(ok?&#x27;right&#x27;:&#x27;wrong&#x27;);
      if(fb)fb.textContent=(ok?&#x27;✓ Esatto. &#x27;:&#x27;✗ Non proprio. &#x27;)+(b.getAttribute(&#x27;data-why&#x27;)||&#x27;&#x27;);
    });});
  });
  /* sezione attiva nel menu */
  var links=document.querySelectorAll(&#x27;nav.toc a&#x27;);
  if(&#x27;IntersectionObserver&#x27; in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(a){a.classList.toggle(&#x27;on&#x27;,a.getAttribute(&#x27;href&#x27;)===&#x27;#&#x27;+e.target.id);});}});},{rootMargin:&#x27;-40% 0px -55% 0px&#x27;});
    document.querySelectorAll(&#x27;section.part&#x27;).forEach(function(s){io.observe(s);});
  }
  window.__fmt=fmt;
})();
&lt;/script&gt;
&lt;script&gt;
(function(){
  var f=window.__fmt,NS=&#x27;http://www.w3.org/2000/svg&#x27;;
  function $(id){return document.getElementById(id);}
  function el(p,tag,a,txt){var e=document.createElementNS(NS,tag);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e;}
  function clear(s){while(s.firstChild)s.removeChild(s.firstChild);}
  function css(v){return &#x27;var(--&#x27;+v+&#x27;)&#x27;;}

  /* ---------- sorter costi ---------- */
  var items=[
    [&#x27;Dazi all\&#x27;importazione sul macchinario&#x27;,1,&#x27;IAS 16.16a: fanno parte del purchase price.&#x27;],
    [&#x27;Trasporto e consegna iniziale&#x27;,1,&#x27;IAS 16.17c: initial delivery and handling costs.&#x27;],
    [&#x27;Installazione e montaggio&#x27;,1,&#x27;IAS 16.17d.&#x27;],
    [&#x27;Stipendi degli operai che montano l\&#x27;impianto&#x27;,1,&#x27;IAS 16.17a: employee benefits che derivano direttamente dalla costruzione o acquisizione.&#x27;],
    [&#x27;Collaudo per verificare che l\&#x27;impianto funzioni&#x27;,1,&#x27;IAS 16.17e: costs of testing.&#x27;],
    [&#x27;Stima dei costi di smantellamento a fine vita&#x27;,1,&#x27;IAS 16.16c: stima iniziale di smantellamento e ripristino.&#x27;],
    [&#x27;Pubblicità per lanciare il prodotto fatto con l\&#x27;impianto&#x27;,0,&#x27;IAS 16.19b: costi di introduzione di un nuovo prodotto.&#x27;],
    [&#x27;Inaugurazione del nuovo stabilimento&#x27;,0,&#x27;IAS 16.19a: costs of opening a new facility.&#x27;],
    [&#x27;Formazione del personale sul nuovo impianto&#x27;,0,&#x27;IAS 16.19c: staff training.&#x27;],
    [&#x27;Spese generali amministrative&#x27;,0,&#x27;IAS 16.19d: administration and general overhead.&#x27;],
    [&#x27;Perdite dei primi mesi mentre la domanda cresce&#x27;,0,&#x27;IAS 16.20b: initial operating losses.&#x27;],
    [&#x27;Spostare l\&#x27;impianto in un\&#x27;altra sede dopo 3 anni&#x27;,0,&#x27;IAS 16.20c: costs of relocating.&#x27;]
  ];
  var ul=document.querySelector(&#x27;#sorter ul&#x27;),score={};
  items.forEach(function(it,i){
    var li=document.createElement(&#x27;li&#x27;);
    li.innerHTML=&#x27;&lt;span&gt;&#x27;+it[0]+&#x27;&lt;/span&gt;&lt;span class=&quot;mcq&quot; style=&quot;margin:0&quot;&gt;&lt;button data-v=&quot;1&quot;&gt;Nel costo&lt;/button&gt;&lt;button data-v=&quot;0&quot;&gt;Fuori (P&amp;amp;L)&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&#x27;;
    li.querySelectorAll(&#x27;button&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      var ok=+b.dataset.v===it[1];li.querySelectorAll(&#x27;button&#x27;).forEach(function(x){x.className=&#x27;&#x27;;});b.className=ok?&#x27;right&#x27;:&#x27;wrong&#x27;;
      var fb=li.querySelector(&#x27;.fb&#x27;);fb.className=&#x27;fb &#x27;+(ok?&#x27;ok&#x27;:&#x27;ko&#x27;);fb.textContent=(ok?&#x27;✓ &#x27;:&#x27;✗ &#x27;)+(it[1]?&#x27;Si capitalizza. &#x27;:&#x27;Non si capitalizza. &#x27;)+it[2];
      score[i]=ok;var n=0,c=0;for(var k in score){n++;if(score[k])c++;}
      $(&#x27;sorter-score&#x27;).textContent=&#x27;Risposte corrette: &#x27;+c+&#x27; su &#x27;+n+&#x27; date (&#x27;+items.length+&#x27; voci).&#x27;;
    });});
    ul.appendChild(li);
  });

  /* ---------- pagamento differito ---------- */
  function dp(){var c=+$(&#x27;dp-c&#x27;).value,t=+$(&#x27;dp-t&#x27;).value;$(&#x27;dp-cash&#x27;).textContent=f(c);$(&#x27;dp-tot&#x27;).textContent=f(t);
    $(&#x27;dp-ppe&#x27;).textContent=f(c);$(&#x27;dp-int&#x27;).textContent=t&gt;=c?f(t-c):&#x27;— (totale &lt; prezzo a pronti?)&#x27;;}
  [&#x27;dp-c&#x27;,&#x27;dp-t&#x27;].forEach(function(id){$(id).addEventListener(&#x27;input&#x27;,dp);});dp();
