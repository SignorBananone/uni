      &lt;div class=&quot;tabpanel small&quot;&gt;Constant charge: (cost − residual value) ÷ useful life. Suitable when the asset is consumed evenly over time.&lt;/div&gt;
      &lt;div class=&quot;tabpanel small&quot;&gt;Constant rate applied to the carrying amount, so charges are high at the start and low at the end. The rate is calculated so as to arrive exactly at the residual value.&lt;/div&gt;
      &lt;div class=&quot;tabpanel small&quot;&gt;Charge proportional to the units produced in the year (sample production profile). If you tick &quot;year 3 idle&quot;, the charge for that year is zero.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ctrls&quot;&gt;
      &lt;label&gt;Cost: &lt;output id=&quot;dco&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dc&quot; min=&quot;10000&quot; max=&quot;200000&quot; step=&quot;5000&quot; value=&quot;50000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Residual value: &lt;output id=&quot;dro&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dr&quot; min=&quot;0&quot; max=&quot;40&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Useful life (years): &lt;output id=&quot;dlo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dl&quot; min=&quot;3&quot; max=&quot;15&quot; step=&quot;1&quot; value=&quot;8&quot;&gt;&lt;/label&gt;
      &lt;label style=&quot;align-self:end&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;didle&quot;&gt; year 3 idle&lt;/label&gt;
    &lt;/div&gt;
    &lt;svg id=&quot;dep-svg&quot; viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;Depreciation chart&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;small&quot; id=&quot;dep-note&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Self-check · 7&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;A plant is idle for six months owing to a fall in demand. Is straight-line depreciation suspended?&lt;/summary&gt;&lt;div&gt;No: depreciation does not cease when the asset is idle (IAS 16.55). It stops only if the asset is fully depreciated, classified as held for sale or derecognised. Under a units-of-production method, however, the charge would be zero.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is depreciation proportional to revenue not permitted?&lt;/summary&gt;&lt;div&gt;Because revenue reflects prices, volumes, inflation, other inputs and selling activities, not the consumption of the asset&#x27;s economic benefits (IAS 16.62A).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;At year-end it emerges that the remaining useful life is longer than expected. Are prior financial statements restated?&lt;/summary&gt;&lt;div&gt;No: it is a change in accounting estimate (IAS 8), with prospective effect. The remaining carrying amount is allocated over the new remaining life (IAS 16.51).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 8 IMPAIRMENT ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s8&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;8&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;IAS 16.63–65 · IAS 36&lt;/span&gt;&lt;h2&gt;Impairment&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;To determine whether an item of PPE is impaired, IAS 16 refers to &lt;b&gt;IAS 36 &lt;i&gt;Impairment of Assets&lt;/i&gt;&lt;/b&gt;, which explains how to review the carrying amount, how to determine the &lt;i&gt;recoverable amount&lt;/i&gt;, and when to recognise (or reverse) an impairment loss. &lt;span class=&quot;src&quot;&gt;IAS 16.63 · slide 57&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Recoverable amount = max( &lt;b&gt;Fair value less costs of disposal&lt;/b&gt; ; &lt;b&gt;Value in use&lt;/b&gt; )&lt;br&gt;&lt;span class=&quot;small&quot;&gt;Impairment loss = Carrying amount − Recoverable amount, if positive&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Impairment loss&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(the loss arising from a reduction in value)&lt;/span&gt;: the amount by which the carrying amount of an asset or a &lt;span class=&quot;term&quot;&gt;cash-generating unit&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(CGU: the smallest identifiable group of assets that generates cash inflows largely independent of those from other assets)&lt;/span&gt; exceeds its recoverable amount. &lt;span class=&quot;term&quot;&gt;Fair value less costs of disposal&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(what would be obtained from selling the asset, net of costs of disposal)&lt;/span&gt;; &lt;span class=&quot;term&quot;&gt;value in use&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(the present value of the future cash flows expected to be derived from the asset)&lt;/span&gt;. &lt;span class=&quot;src&quot;&gt;IAS 36.6 · slide 58&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;The reasoning: an asset cannot be carried at more than the amount the entity can &lt;b&gt;recover&lt;/b&gt;, by selling or using it. And the entity will choose the better route, so the &lt;b&gt;higher&lt;/b&gt; of the two is taken.&lt;/p&gt;

  &lt;div class=&quot;tile&quot; id=&quot;imp&quot;&gt;
    &lt;div class=&quot;ctrls&quot;&gt;
      &lt;label&gt;Carrying amount: &lt;output id=&quot;ica&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ic&quot; min=&quot;100&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;600&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Fair value less costs of disposal: &lt;output id=&quot;ifo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;if&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;420&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Value in use: &lt;output id=&quot;ivo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;iv&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;510&quot;&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;svg id=&quot;imp-svg&quot; viewBox=&quot;0 0 860 220&quot; role=&quot;img&quot; aria-label=&quot;Impairment test chart&quot;&gt;&lt;/svg&gt;
    &lt;p id=&quot;imp-msg&quot; style=&quot;font-weight:600&quot;&gt;&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;The indicators: when to perform the test&lt;/h3&gt;
  &lt;p&gt;The entity must consider, &lt;b&gt;as a minimum&lt;/b&gt;, the following indications &lt;span class=&quot;src&quot;&gt;IAS 36.12 · slides 59–61&lt;/span&gt;:&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;External&lt;/button&gt;&lt;button&gt;Internal&lt;/button&gt;&lt;button&gt;Other (internal reporting)&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;ol type=&quot;a&quot;&gt;
      &lt;li&gt;observable indications that the asset&#x27;s value has declined &lt;b&gt;significantly more&lt;/b&gt; than would be expected as a result of the passage of time or normal use;&lt;/li&gt;
      &lt;li&gt;significant changes with an adverse effect in the &lt;b&gt;technological, market, economic or legal&lt;/b&gt; environment;&lt;/li&gt;
      &lt;li&gt;increases in market &lt;b&gt;interest rates&lt;/b&gt; that raise the discount rate used in calculating value in use and materially decrease the recoverable amount;&lt;/li&gt;
      &lt;li&gt;the carrying amount of the entity&#x27;s net assets exceeds its &lt;b&gt;market capitalisation&lt;/b&gt;.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;ol type=&quot;a&quot; start=&quot;5&quot;&gt;
      &lt;li&gt;evidence of &lt;b&gt;obsolescence or physical damage&lt;/b&gt;;&lt;/li&gt;
      &lt;li&gt;adverse changes in the &lt;b&gt;manner of use&lt;/b&gt;: the asset becoming idle, plans to discontinue or restructure, disposal before the previously expected date, reassessment of useful life as finite rather than indefinite;&lt;/li&gt;
      &lt;li&gt;internal reporting indicates that the &lt;b&gt;economic performance&lt;/b&gt; of the asset is, or will be, worse than expected.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Evidence from internal reporting (IAS 36.14):&lt;/p&gt;&lt;ol type=&quot;a&quot;&gt;
      &lt;li&gt;cash flows for acquiring, operating or maintaining the asset are &lt;b&gt;significantly higher&lt;/b&gt; than budgeted;&lt;/li&gt;
      &lt;li&gt;actual net cash flows or operating profit are &lt;b&gt;significantly worse&lt;/b&gt; than budgeted;&lt;/li&gt;
      &lt;li&gt;a significant decline in &lt;b&gt;budgeted&lt;/b&gt; net cash flows or operating profit, or a significant increase in budgeted losses;&lt;/li&gt;
      &lt;li&gt;operating losses or net cash outflows when current period amounts are aggregated with budgeted amounts for the future.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Compensation.&lt;/b&gt; Compensation from third parties for PPE that was impaired, lost or given up (e.g. insurance after a fire) is recognised in &lt;b&gt;profit or loss when it becomes receivable&lt;/b&gt;, separately from the impairment. &lt;span class=&quot;src&quot;&gt;IAS 16.65 · slide 57&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Self-check · 8&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;CA 500, FVLCD 380, VIU 450. Is there an impairment, and how much?&lt;/summary&gt;&lt;div&gt;Recoverable amount = max(380; 450) = 450. Impairment loss = 500 − 450 = 50.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;The ECB raises interest rates by 200 basis points. Why can this be an impairment indicator?&lt;/summary&gt;&lt;div&gt;A higher discount rate reduces the present value of future cash flows, and hence value in use and potentially the recoverable amount (IAS 36.12c).&lt;/div&gt;&lt;/details&gt;
    &lt;p style=&quot;margin:.6em 0 0&quot;&gt;&lt;b&gt;Which of these is an &quot;internal&quot; indicator?&lt;/b&gt;&lt;/p&gt;
    &lt;div class=&quot;mcq&quot;&gt;&lt;button data-why=&quot;It is an external indicator (36.12d).&quot;&gt;Market cap &amp;lt; book value of equity&lt;/button&gt;&lt;button data-ok data-why=&quot;It is indicator (e): evidence of obsolescence or physical damage.&quot;&gt;Physical damage to the machine&lt;/button&gt;&lt;button data-why=&quot;It is external (36.12c).&quot;&gt;Rise in market interest rates&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;mcq-fb&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 9 DERECOGNITION ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s9&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;9&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;IAS 16 · paras 67–72&lt;/span&gt;&lt;h2&gt;Derecognition&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Derecognition&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(the removal of the asset from the statement of financial position)&lt;/span&gt;. The carrying amount of an item of PPE is derecognised: &lt;span class=&quot;src&quot;&gt;IAS 16.67 · slide 55&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;a) On disposal&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Upon disposal (sale, exchange, donation…).&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;b) No future benefits&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;When no future economic benefits are expected from its use or disposal.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;Gain / loss = &lt;b&gt;Net disposal proceeds&lt;/b&gt; − &lt;b&gt;Carrying amount&lt;/b&gt; &amp;nbsp;→ to profit or loss &lt;span class=&quot;src&quot;&gt;IAS 16.71&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;details class=&quot;card&quot; open&gt;&lt;summary&gt;Rental entities that sell (16.68A)&lt;/summary&gt;&lt;div&gt;An entity that, in the course of its ordinary activities, &lt;b&gt;routinely sells&lt;/b&gt; items previously held for rental to others (e.g. a car rental company) transfers them to &lt;b&gt;inventories&lt;/b&gt; at their carrying amount when they cease to be rented and become held for sale. In this case &lt;b&gt;IFRS 5 does not apply&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 55&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;card&quot; open&gt;&lt;summary&gt;Replaced parts (16.70)&lt;/summary&gt;&lt;div&gt;If a replacement is capitalised, the carrying amount of the replaced part is derecognised &lt;b&gt;regardless of whether it had been depreciated separately&lt;/b&gt;. If it is not practicable to determine it, the &lt;b&gt;cost of the replacement&lt;/b&gt; may be used as an indication of what the cost of the replaced part was at the time it was acquired. &lt;span class=&quot;src&quot;&gt;slide 56&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tile&quot;&gt;
    &lt;h4&gt;Try it: sale of a machine&lt;/h4&gt;
    &lt;div class=&quot;ctrls&quot;&gt;
      &lt;label&gt;Carrying amount: &lt;output id=&quot;dgca&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dg1&quot; min=&quot;0&quot; max=&quot;100000&quot; step=&quot;1000&quot; value=&quot;35000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Selling price: &lt;output id=&quot;dgpo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dg2&quot; min=&quot;0&quot; max=&quot;100000&quot; step=&quot;1000&quot; value=&quot;40000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Costs of disposal: &lt;output id=&quot;dgco&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dg3&quot; min=&quot;0&quot; max=&quot;10000&quot; step=&quot;500&quot; value=&quot;2000&quot;&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;readout&quot;&gt;&lt;div&gt;&lt;span&gt;Net disposal proceeds&lt;/span&gt;&lt;b id=&quot;dgn&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Gain / loss in P&amp;amp;L&lt;/span&gt;&lt;b id=&quot;dgr&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Self-check · 9&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;A van with a CA of 12,000 is sold for 10,500 with 300 of selling costs. Result?&lt;/summary&gt;&lt;div&gt;Net proceeds = 10,200; loss = 10,200 − 12,000 = −1,800, in profit or loss.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A car rental company puts its cars up for sale after 2 years. IFRS 5?&lt;/summary&gt;&lt;div&gt;No: for an entity that routinely sells items previously held for rental, these are transferred to inventories at their carrying amount and IFRS 5 does not apply (IAS 16.68A).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ 10 ESEMPI ============ --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;s10&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;10&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;IAS 16 Application · slides 63–72&lt;/span&gt;&lt;h2&gt;Worked examples&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;The final part of the slides applies the concepts through four numerical exercises. They are reconstructed here and made interactive; where the slides leave steps implicit, I explain them.&lt;/p&gt;

  &lt;h3&gt;A · Major inspections: three ways of treating subsequent expenditure&lt;/h3&gt;
  &lt;p&gt;An asset costs &lt;b&gt;50,000&lt;/b&gt; and has an expected life of &lt;b&gt;10 years&lt;/b&gt;: annual depreciation of &lt;b&gt;5,000&lt;/b&gt;, i.e. 10%, which also coincides with the &quot;tax&quot; rate shown in the slide. In &lt;b&gt;year 4&lt;/b&gt;, capitalisable expenditure of &lt;b&gt;25,000&lt;/b&gt; is incurred (e.g. a major inspection or an improvement). The slides compare three treatments. &lt;span class=&quot;src&quot;&gt;slides 64–65&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;tabs&quot; id=&quot;mi-tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;① Fixed rate on cost&lt;/button&gt;&lt;button&gt;② Improve the performance&lt;/button&gt;&lt;button&gt;③ Increase the expected life&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Cost rises to 75,000 and the &lt;b&gt;10% rate on cost&lt;/b&gt; continues to be applied (7,500 per year). Result: the asset is &lt;b&gt;not fully depreciated within the 10 years&lt;/b&gt;; an 11th year would be needed (in red in the slide). This is the limitation of a fixed, tax-style rate: it ignores the fact that the remaining life is only 7 years.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;The expenditure &lt;b&gt;improves performance&lt;/b&gt; but does not extend the life. The carrying amount (35,000) + 25,000 = &lt;b&gt;60,000&lt;/b&gt; is allocated over the &lt;b&gt;remaining 7 years&lt;/b&gt;: 8,571.43 per year. The asset reaches zero exactly in year 10, with total depreciation of 75,000.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;The expenditure &lt;b&gt;extends the useful life&lt;/b&gt;: in year 4 the remaining life becomes &lt;b&gt;12 years&lt;/b&gt; (instead of 7). In the slide, the starting cost for this scenario is &lt;b&gt;45,000&lt;/b&gt; (4,500 per year). In year 4: 31,500 + 25,000 = &lt;b&gt;56,500&lt;/b&gt; ÷ 12 = 4,708.33 per year, up to year 15 (total depreciation 70,000).&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tile&quot;&gt;
    &lt;svg id=&quot;mi-svg&quot; viewBox=&quot;0 0 860 280&quot; role=&quot;img&quot; aria-label=&quot;Remaining carrying amount in the three scenarios&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tbl&quot; id=&quot;mi-tbl&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;The underlying rule is the same as in IAS 16.14 and 16.51: the expenditure is added to the carrying amount and the charge is recalculated as an estimate over the remaining life (scenarios ② and ③), not with a fixed rate.&lt;/p&gt;

  &lt;h3 id=&quot;s10b&quot;&gt;B · Component approach: the aircraft&lt;/h3&gt;
  &lt;p&gt;An aircraft costs &lt;b&gt;1,000,000&lt;/b&gt;, with a life of 40 years. In reality it consists of a &lt;b&gt;structure&lt;/b&gt; (800,000, 40 years) and &lt;b&gt;seats&lt;/b&gt; (200,000, 10 years). Every 10 years the seats are replaced with new seats costing &lt;b&gt;250,000&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slides 66–69&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Without components&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Aircraft 1,000,000 × 2.5% = &lt;b&gt;25,000&lt;/b&gt;/year. In year 11 the new seats are added: 1,250,000 × 2.5% = &lt;b&gt;31,250&lt;/b&gt;. The old seats never really leave the cost base.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;With components (IAS 16.43)&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Structure 800,000 ÷ 40 = 20,000 + seats 200,000 ÷ 10 = 20,000 → &lt;b&gt;40,000&lt;/b&gt;/year. From year 11: 20,000 + 250,000 ÷ 10 = &lt;b&gt;45,000&lt;/b&gt;. After 10 years the structure is carried at 600,000 with 30 years remaining: still 20,000.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tile&quot; style=&quot;margin-top:14px&quot;&gt;
    &lt;div class=&quot;tabs&quot; id=&quot;ca-tabs&quot; style=&quot;margin-top:0&quot;&gt;&lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Annual charge&lt;/button&gt;&lt;button&gt;Accumulated depreciation&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;tabpanel small&quot;&gt;Depreciation for each year under the two approaches (years 1–48).&lt;/div&gt;&lt;div class=&quot;tabpanel small&quot;&gt;Total depreciated up to that year.&lt;/div&gt;&lt;/div&gt;
    &lt;svg id=&quot;ca-svg&quot; viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;Component approach comparison&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;readout&quot;&gt;&lt;div&gt;&lt;span&gt;Total with components (40 years)&lt;/span&gt;&lt;b&gt;1,750,000&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Total without components (48 years)&lt;/span&gt;&lt;b&gt;1,603,750&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;The lesson.&lt;/b&gt; With components, &lt;b&gt;everything that was spent&lt;/b&gt; (800,000 of structure + 200,000 + 3 × 250,000 of seats = 1,750,000) is depreciated &lt;b&gt;within the life of the aircraft&lt;/b&gt; and at the actual rate of consumption of each part. Without components, depreciation is too low in the early years, the replaced seats remain in cost, and the tail drags on until year 48, beyond the life of the aircraft.
  &lt;br&gt;&lt;span class=&quot;small&quot;&gt;Reading note: in the table on slide 69, the base without components drops by 50,000 from the year following each replacement (1,250,000 → 1,200,000, 1,450,000 → 1,400,000, 1,650,000 → 1,600,000). The slide does not explain this step: ask about it in class.&lt;/span&gt;&lt;/div&gt;

  &lt;h3&gt;C · Capital maintenance: what does &quot;having earned a profit&quot; mean?&lt;/h3&gt;
  &lt;p&gt;On 10/01/2019 a company is set up with &lt;b&gt;100&lt;/b&gt; of cash and 100 of equity and buys a plant for 100 (life 10 years). During the year: revenue 112, cost of sales 100, depreciation 10 → &lt;b&gt;profit 2&lt;/b&gt;. Inflation 5%; at year-end, replacing the plant would cost &lt;b&gt;120&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 70&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Capital maintenance&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(a profit is earned only after the opening capital has been maintained; the question is which capital)&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Financial · nominal&lt;/button&gt;&lt;button&gt;Financial · real&lt;/button&gt;&lt;button&gt;Physical&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Capital to be maintained: &lt;b&gt;100&lt;/b&gt; nominal euros. Closing equity 102 → &lt;b&gt;profit 2&lt;/b&gt;.&lt;/p&gt;
      &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;&lt;tr&gt;&lt;th&gt;Assets&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Equity&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Plant&lt;/td&gt;&lt;td&gt;90&lt;/td&gt;&lt;td&gt;Equity&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td&gt;12&lt;/td&gt;&lt;td&gt;Profit&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;102&lt;/td&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;102&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Cash 12 = revenue 112 − cost of sales 100 (the plant was paid for with the initial 100). Plant 90 = 100 − depreciation 10.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;Capital to be maintained: the &lt;b&gt;purchasing power&lt;/b&gt; of the initial 100, i.e. 100 × 1.05 = &lt;b&gt;105&lt;/b&gt;. Closing equity 102 &amp;lt; 105 → in real terms the company has &lt;b&gt;lost 3&lt;/b&gt;. The nominal profit of 2 is merely inflation.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;The −3 calculation is not in the slides (which show only the figure 105): it follows directly from the comparison.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Capital to be maintained: &lt;b&gt;productive capacity&lt;/b&gt;, i.e. a plant that now costs 120. The plant is carried at current cost: 120 − 12 of depreciation = &lt;b&gt;108&lt;/b&gt;. Depreciation rises to 12 (120 ÷ 10) → &lt;b&gt;profit 0&lt;/b&gt;. The difference 120 − 100 = &lt;b&gt;20&lt;/b&gt; goes to a &lt;b&gt;CM Reserve&lt;/b&gt; (capital maintenance reserve) and is not distributable.&lt;/p&gt;
      &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;&lt;tr&gt;&lt;th&gt;Assets&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Equity&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Plant&lt;/td&gt;&lt;td&gt;108&lt;/td&gt;&lt;td&gt;Equity&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Cash&lt;/td&gt;&lt;td&gt;12&lt;/td&gt;&lt;td&gt;CM Reserve&lt;/td&gt;&lt;td&gt;20&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Income statement: revenue 112 − cost of sales 100 − depreciation 12 = 0.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; The two concepts of capital, financial and physical, are described in Chapter 8 of the Conceptual Framework, which does not prescribe either; the physical concept requires measurement at current cost. &lt;a href=&quot;https://standards.aasb.gov.au/node/342&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AASB – CF Chapter 8&lt;/a&gt;&lt;/p&gt;

  &lt;h3&gt;D · Revaluation model: the journal entries&lt;/h3&gt;
  &lt;p&gt;The slides summarise the model as follows: in each period in which the value changes materially, the &lt;b&gt;value is updated&lt;/b&gt;, &lt;b&gt;depreciation is charged on the new value&lt;/b&gt;, and a &lt;b&gt;reserve&lt;/b&gt; is recognised in equity (CM Reserve or Revaluation Reserve). Effects: &lt;b&gt;assets increase, equity increases, depreciation increases&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slides 71–72&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Situation.&lt;/b&gt; A building has a carrying amount of &lt;b&gt;0&lt;/b&gt; (for example, fully depreciated) and a fair value of &lt;b&gt;1,000&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Year 1 · journal entries&lt;/b&gt;&lt;/p&gt;&lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tbl&quot;&gt;&lt;tr&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th&gt;Debit&lt;/th&gt;&lt;th&gt;Credit&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Building&lt;/td&gt;&lt;td&gt;1,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&amp;nbsp;&amp;nbsp;Revaluation reserve&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;1,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Depreciation&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&amp;nbsp;&amp;nbsp;Building&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Revaluation reserve&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&amp;nbsp;&amp;nbsp;Distributable revaluation reserve&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;The transfer of 30 applies IAS 16.41: depreciation on the revalued amount (30) − depreciation on original cost (0) = 30 of reserve that becomes available.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;End of year 1&lt;/b&gt;: Buildings &lt;b&gt;970&lt;/b&gt; · Revaluation reserve &lt;b&gt;970&lt;/b&gt; · Distributable revaluation reserve &lt;b&gt;30&lt;/b&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;The slide&#x27;s layout does not show the result for the year (−30 of depreciation): this is what balances assets (970) and equity and liabilities (970 + 30).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Year 2&lt;/b&gt;: same entries (depreciation 30; transfer 30). End of year 2: Buildings &lt;b&gt;940&lt;/b&gt; · Revaluation reserve &lt;b&gt;940&lt;/b&gt; · Distributable revaluation reserve &lt;b&gt;60&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;And if the value falls?&lt;/b&gt; A &lt;b&gt;write-down&lt;/b&gt; (&lt;i&gt;impairment&lt;/i&gt;) is recognised in profit or loss &lt;b&gt;to the extent that it exceeds previous revaluations&lt;/b&gt;; up to that amount it reduces the reserve. This is the IAS 16.40 rule seen in section 6, combined with the IAS 36 &lt;i&gt;impairment test&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;small&quot; data-lab&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Self-check · 10&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;In scenario ② (improve the performance), where does 8,571.43 come from?&lt;/summary&gt;&lt;div&gt;Carrying amount at the end of year 3 = 35,000; + 25,000 = 60,000; remaining life from year 4 = 7 years; 60,000 ÷ 7 = 8,571.43.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is depreciation in the first 10 years higher under the component approach (40,000 versus 25,000)?&lt;/summary&gt;&lt;div&gt;Because the seats (200,000) are consumed over 10 years, not 40: by depreciating them separately, the charge reflects actual consumption.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Under physical capital maintenance, why does profit fall from 2 to 0?&lt;/summary&gt;&lt;div&gt;Because depreciation is calculated on replacement cost (12 instead of 10) and the 20 of revaluation goes to a reserve: maintaining productive capacity requires 120, and the company has exactly 120 of assets.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 11 PER APPROFONDIRE ============ --&gt;
&lt;section class=&quot;part terra&quot; id=&quot;s11&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;↗&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;External sources&lt;/span&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;The slides do not cite authors or textbooks: they refer to the &lt;b&gt;Conceptual Framework&lt;/b&gt; and to numerous &lt;b&gt;IASB standards&lt;/b&gt;. For each one I looked for a reliable source, usually the IFRS Foundation website, which publishes the texts (full access requires free registration). &lt;b&gt;Everything in this section is &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/b&gt;, except the &quot;why it matters&quot; notes, which link the source to the lecture.&lt;/p&gt;

  &lt;h3&gt;The framework and the standard of the lecture&lt;/h3&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-16-property-plant-and-equipment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 16 &lt;i&gt;Property, Plant and Equipment&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Official IFRS Foundation page; the current edition is the &quot;2026 Issued&quot;. The standard superseded the 1982 IAS 16. Summary and amendment history on &lt;a href=&quot;https://www.iasplus.com/standard/ias16.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte)&lt;/a&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the source of all the paragraphs cited in the slides (6, 7–14, 15–28, 29–42, 43–62A, 63–65, 67–72).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/conceptual-framework/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Conceptual Framework for Financial Reporting (2018)&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Defines assets, liabilities, equity, income and expenses, together with recognition criteria and measurement bases. Compared with 2010, the definition of an asset moved from &quot;a resource from which future economic benefits are &lt;i&gt;expected&lt;/i&gt; to flow&quot; to a &quot;&lt;b&gt;present economic resource&lt;/b&gt;&quot; with merely the &lt;i&gt;potential&lt;/i&gt; to produce them, to avoid implicit probability thresholds (&lt;a href=&quot;https://accaglobal.com/pk/en/student/exam-support-resources/professional-exams-study-resources/strategic-business-reporting/technical-articles/conceptual-framework.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ACCA technical article&lt;/a&gt;). Chapter 8 covers capital and capital maintenance (&lt;a href=&quot;https://standards.aasb.gov.au/node/342&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AASB text&lt;/a&gt;).&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: sections 1–2 and example C are built entirely on the Framework (CF 1.13–1.14, 4.3–4.12, 5.1, 6.1).&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Related standards cited in the slides&lt;/h3&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias36.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 36 &lt;i&gt;Impairment of Assets&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Ensures that assets are not carried at more than their recoverable amount (the higher of fair value less costs of disposal and value in use). The test is performed when there is an indicator; for goodwill and intangibles with indefinite useful lives it must be performed annually.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the cross-reference in IAS 16.63 and the basis of section 8.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.icaew.com/technical/financial-reporting/ifrs/ifrs-standards/ifrs-13-fair-value-measurement&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 13 &lt;i&gt;Fair Value Measurement&lt;/i&gt;&lt;/a&gt; (ICAEW factsheet) &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Defines fair value and its hierarchy: Level 1 = quoted prices in active markets for identical assets; Level 2 = other observable inputs; Level 3 = unobservable inputs. A measurement is categorised at the lowest level of input that is significant to it.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explains the &quot;Level 1, 2, 3&quot; on slide 29 and the definition of fair value in IAS 16.6.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 18 &lt;i&gt;Presentation and Disclosure in Financial Statements&lt;/i&gt;&lt;/a&gt; and &lt;a href=&quot;https://www.ifrs.org/content/ifrs/home/issued-standards/list-of-standards/ias-8-accounting-policies-changes-in-accounting-estimates-and-errors.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 8&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Issued in April 2024 and effective from 1 January 2027, it replaces IAS 1; some IAS 1 paragraphs have been moved to IAS 8, now titled &lt;i&gt;Basis of Preparation of Financial Statements&lt;/i&gt;.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explains the correction to the title of IAS 8 on slide 49 and what happened to IAS 1.66–67, cited on slides 7–8.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.iasplus.com/en/news/2020/05/ias-16&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 16 amendment &lt;i&gt;Proceeds before Intended Use&lt;/i&gt; (2020)&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Published on 14 May 2020, effective from 2022: it prohibits deducting from the cost of PPE the proceeds from selling items produced before the asset is available for use; proceeds and costs are recognised in profit or loss. According to KPMG, it mainly affects the extractive and petrochemical industries.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it is the origin of IAS 16.20A (slide 35).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-40-investment-property/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 40 &lt;i&gt;Investment Property&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Property held to earn rentals or for capital appreciation; permits the fair value model or the cost model, to be applied to all investment property.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: referred to in IAS 16.5 and 16.29A (slides 18, 39) and in the tractor quiz.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/projects/completed-projects/2014/agriculture-bearer-plants/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 41 &lt;i&gt;Agriculture&lt;/i&gt;: Bearer Plants project (2014)&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;The June 2014 amendments, effective from 2016, moved bearer plants (grape vines, rubber trees, oil palms) from IAS 41 to IAS 16; the produce growing on the plant remains at fair value less costs to sell under IAS 41.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: it explains the exception on slide 14.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs5.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 5 &lt;i&gt;Non-current Assets Held for Sale and Discontinued Operations&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;An asset is held for sale when its carrying amount will be recovered principally through a sale transaction rather than through continuing use; from that point it is no longer depreciated.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: scope exclusion (16.3a), cessation of depreciation (16.55), exception in 16.68A.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://ifrs.org/issued-standards/list-of-standards/ias-20-accounting-for-government-grants-and-disclosure-of-government-assistance&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 20 &lt;i&gt;Government Grants&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Grants related to assets are presented either as deferred income or by deducting the grant from the carrying amount of the asset, with the choice applied consistently.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: IAS 16.28 (slide 43).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/content/ifrs/home/issued-standards/list-of-standards/ias-23-borrowing-costs.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 23 &lt;i&gt;Borrowing Costs&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Borrowing costs directly attributable to a &lt;i&gt;qualifying asset&lt;/i&gt; (one that necessarily takes a substantial period of time to get ready) form part of its cost; other borrowing costs are expensed. Since 2007 it has no longer been possible to expense them all immediately.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: the exception in IAS 16.23 on deferred payment (slide 36).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 2 &lt;i&gt;Inventories&lt;/i&gt;&lt;/a&gt; · &lt;a href=&quot;https://ifrs.org/issued-standards/list-of-standards/ias-38-intangible-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 38 &lt;i&gt;Intangible Assets&lt;/i&gt;&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-3-business-combinations/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 3 &lt;i&gt;Business Combinations&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;IAS 2: cost of inventories and write-down to net realisable value. IAS 38: recognition and measurement of intangibles (goodwill arising on a business combination falls under IFRS 3). IFRS 3: in business combinations, identifiable assets acquired are measured at fair value at the acquisition date.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: they are the &quot;other boxes&quot; of the classification (slides 11, 27) and the standards covered in the course&#x27;s other lectures on inventories and intangibles.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/content/ifrs/home/issued-standards/list-of-standards/ifrs-6-exploration-for-and-evaluation-of-mineral-resources.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 6 &lt;i&gt;Exploration for and Evaluation of Mineral Resources&lt;/i&gt;&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Issued in 2004; exploration assets are measured at cost and subsequently under the cost or revaluation model, and the entity may retain its previous accounting policies.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: scope exclusion 16.3c (slide 15).&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;res&quot;&gt;&lt;h4&gt;Minor references: &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 7&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-2-share-based-payment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 2&lt;/a&gt; · &lt;a href=&quot;https://ifrs.org/issued-standards/list-of-standards/ias-19-employee-benefits&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 19&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs17-ie.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 17 (illustrative examples)&lt;/a&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;IAS 7: defines cash (cash on hand and demand deposits) and cash equivalents (short-term, highly liquid investments readily convertible to known amounts of cash). IFRS 2: share-based payments. IAS 19: all employee benefits except share-based ones. IFRS 17: insurance contracts, including those with direct participation features.&lt;/p&gt;&lt;p class=&quot;why&quot;&gt;Why it matters: they define terms used on slides 7 (cash equivalent), 26 (cost via IFRS 2), 32 (employee benefits) and 39 (funds and insurance contracts).&lt;/p&gt;&lt;/div&gt;
