        &lt;a href=&quot;#s8&quot;&gt;&lt;rect class=&quot;nb&quot; x=&quot;340&quot; y=&quot;336&quot; width=&quot;222&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;text x=&quot;358&quot; y=&quot;374&quot; class=&quot;num&quot; style=&quot;fill:var(--brick)&quot;&gt;8&lt;/text&gt;&lt;text x=&quot;384&quot; y=&quot;362&quot; class=&quot;t1&quot;&gt;Impairment&lt;/text&gt;&lt;text x=&quot;384&quot; y=&quot;382&quot; class=&quot;t2&quot;&gt;IAS 36 · indicators&lt;/text&gt;&lt;/a&gt;
        &lt;a href=&quot;#s9&quot;&gt;&lt;rect class=&quot;nb&quot; x=&quot;640&quot; y=&quot;336&quot; width=&quot;222&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;text x=&quot;658&quot; y=&quot;374&quot; class=&quot;num&quot; style=&quot;fill:var(--brick)&quot;&gt;9&lt;/text&gt;&lt;text x=&quot;684&quot; y=&quot;362&quot; class=&quot;t1&quot;&gt;Derecognition&lt;/text&gt;&lt;text x=&quot;684&quot; y=&quot;382&quot; class=&quot;t2&quot;&gt;disposal · gain/loss&lt;/text&gt;&lt;/a&gt;

&lt;!-- ============ 1 ASSET ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s1&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;Foundations · Conceptual Framework&lt;/span&gt;&lt;h2&gt;What is an asset?&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Before turning to machinery and buildings, the lecture starts from the basic question: when can a resource appear among the assets in the statement of financial position? The answer lies in the &lt;span class=&quot;term&quot;&gt;Conceptual Framework&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(the IASB&#x27;s framework: not a standard, but the document that sets out the definitions and principles from which the standards are derived)&lt;/span&gt;.&lt;/p&gt;

  &lt;blockquote class=&quot;def&quot;&gt;An asset is a &lt;b&gt;present economic resource controlled&lt;/b&gt; by the entity as a &lt;b&gt;result of past events&lt;/b&gt;.&lt;cite&gt;Conceptual Framework (CF) 4.3 · slide 2&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;blockquote class=&quot;def&quot;&gt;An &lt;b&gt;economic resource&lt;/b&gt; is a &lt;b&gt;right&lt;/b&gt; that has the potential to produce economic benefits.&lt;cite&gt;CF 4.4 · slide 2&lt;/cite&gt;&lt;/blockquote&gt;

  &lt;p&gt;Let us read the definition element by element, since every word plays a role:&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 230&quot; role=&quot;img&quot; aria-label=&quot;Breakdown of the definition of an asset&quot;&gt;
      &lt;g font-size=&quot;14&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;110&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;present&lt;/text&gt;
        &lt;text x=&quot;110&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;exists now, at the reporting date&lt;/text&gt;
        &lt;rect x=&quot;235&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;335&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;economic resource&lt;/text&gt;
        &lt;text x=&quot;335&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;a right with potential&lt;/text&gt;
        &lt;rect x=&quot;460&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;560&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;controlled&lt;/text&gt;
        &lt;text x=&quot;560&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;the entity can direct it&lt;/text&gt;
        &lt;rect x=&quot;685&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;785&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;result of past events&lt;/text&gt;
        &lt;text x=&quot;785&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;arises from an event that has occurred&lt;/text&gt;
      &lt;/g&gt;
      &lt;path d=&quot;M335,92 V140&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.6&quot; marker-end=&quot;url(#arr)&quot;/&gt;
      &lt;rect x=&quot;160&quot; y=&quot;144&quot; width=&quot;350&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
      &lt;text x=&quot;335&quot; y=&quot;173&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;RIGHT → potential → economic benefits&lt;/text&gt;
      &lt;text x=&quot;335&quot; y=&quot;196&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;certainty is not required: potential is enough&lt;/text&gt;
      &lt;text x=&quot;560&quot; y=&quot;175&quot; font-size=&quot;12.5&quot; class=&quot;mut&quot;&gt;E.g. buying a machine (past event)&lt;/text&gt;
      &lt;text x=&quot;560&quot; y=&quot;195&quot; font-size=&quot;12.5&quot; class=&quot;mut&quot;&gt;gives a present right to use it in production.&lt;/text&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;The four components of the definition of an asset (CF 4.3–4.4).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Not all rights are assets&lt;/h3&gt;
  &lt;p&gt;To be assets &lt;b&gt;of the entity&lt;/b&gt;, rights must &lt;b&gt;both&lt;/b&gt; have the potential to produce economic benefits &lt;i&gt;for the entity&lt;/i&gt; beyond those available to all other parties, &lt;b&gt;and&lt;/b&gt; be &lt;b&gt;controlled&lt;/b&gt; by the entity. For this reason, rights available to all parties without significant cost (a public right of way over land, know-how in the public domain) are typically not assets for the entities that hold them. &lt;span class=&quot;src&quot;&gt;CF 4.9 · slide 3&lt;/span&gt;&lt;/p&gt;

  &lt;h3&gt;The physical object and the bundle of rights&lt;/h3&gt;
  &lt;p&gt;In principle, each right is a separate asset. In practice, related rights are treated as a single &lt;span class=&quot;term&quot;&gt;unit of account&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(the unit to which recognition and measurement are applied)&lt;/span&gt;. Legal ownership of a physical object gives rise, for example, to:&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;The bundle of rights&lt;/h4&gt;&lt;ol type=&quot;a&quot; style=&quot;margin:0;padding-left:1.2em&quot;&gt;&lt;li&gt;the right to use the object;&lt;/li&gt;&lt;li&gt;the right to sell rights over the object;&lt;/li&gt;&lt;li&gt;the right to pledge the object (&lt;i&gt;pledge&lt;/i&gt;);&lt;/li&gt;&lt;li&gt;other rights not listed.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;The conceptual key&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;The economic resource is the set of rights, not the physical object.&lt;/b&gt; Nevertheless, describing the bundle of rights as &quot;the machine&quot; remains the most concise and understandable representation. &lt;span class=&quot;src&quot;&gt;CF 4.11–4.12 · slide 4&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;The two key characteristics&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Control&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;Legal ownership is not decisive.&lt;/b&gt; What matters is the ability to direct the use of the resource and obtain the benefits from it. A leased asset, for example, can be controlled without being owned. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Future Economic Benefits&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;The potential to contribute, &lt;i&gt;directly or indirectly&lt;/i&gt;, to the flow of cash and &lt;span class=&quot;term&quot;&gt;cash equivalents&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(short-term, highly liquid investments readily convertible to known amounts of cash)&lt;/span&gt; to the entity. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Judgement.&lt;/b&gt; Determining whether an asset exists requires judgement on two questions: does the entity have &lt;b&gt;control&lt;/b&gt; of the resource? Are &lt;b&gt;future economic benefits&lt;/b&gt; expected to flow to the entity? &lt;span class=&quot;src&quot;&gt;slide 6&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Self-check · 1&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;A company uses a public road free of charge to reach its plant. Is that right of way one of its assets?&lt;/summary&gt;&lt;div&gt;No. It is a right available to all parties without significant cost: it gives the company no benefits beyond those available to others, and the company does not control it (CF 4.9).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why does the Framework state that the economic resource is &quot;the bundle of rights&quot; rather than the physical object?&lt;/summary&gt;&lt;div&gt;Because it is the rights (to use, sell, pledge…) that produce benefits, not the physical matter. The physical object is still what is described, because it is the most concise and understandable way of representing those rights (CF 4.11–4.12).&lt;/div&gt;&lt;/details&gt;
    &lt;p style=&quot;margin:.6em 0 0&quot;&gt;&lt;b&gt;Is legal ownership an essential requirement for an asset?&lt;/b&gt;&lt;/p&gt;
    &lt;div class=&quot;mcq&quot;&gt;&lt;button data-why=&quot;The requirement is control; legal ownership is not a key characteristic (slide 5).&quot;&gt;Yes, always&lt;/button&gt;&lt;button data-ok data-why=&quot;What matters is control of the resource, not legal title.&quot;&gt;No, control is what matters&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;mcq-fb&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2 CLASSIFICAZIONE ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s2&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;Classification&lt;/span&gt;&lt;h2&gt;Current, non-current, tangible, intangible&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Once it has been established that an asset exists, the next step is to determine &lt;i&gt;what kind&lt;/i&gt; of asset it is. The slides use two dimensions: duration (current / non-current) and nature (tangible / intangible).&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Current assets&lt;/button&gt;&lt;button&gt;Non-current assets&lt;/button&gt;&lt;button&gt;Tangible vs intangible&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Under &lt;b&gt;IAS 1.66&lt;/b&gt;, an asset is &lt;span class=&quot;term&quot;&gt;current&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(short-term)&lt;/span&gt; when &lt;b&gt;at least one&lt;/b&gt; of the following conditions is met:&lt;/p&gt;
      &lt;ol type=&quot;a&quot;&gt;
        &lt;li&gt;the entity expects to realise it, or intends to sell or consume it, in its &lt;span class=&quot;term&quot;&gt;normal operating cycle&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(the time between the acquisition of resources and their realisation in cash)&lt;/span&gt;;&lt;/li&gt;
        &lt;li&gt;it is held primarily for the purpose of &lt;b&gt;trading&lt;/b&gt;;&lt;/li&gt;
        &lt;li&gt;the entity expects to realise it &lt;b&gt;within twelve months&lt;/b&gt; after the reporting period;&lt;/li&gt;
        &lt;li&gt;it is &lt;b&gt;cash or a cash equivalent&lt;/b&gt; (as defined in IAS 7), unless it is restricted from being used for at least twelve months.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;span class=&quot;src&quot;&gt;slide 7&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;&lt;b&gt;All other assets are non-current&lt;/b&gt; (IAS 1.66). It is a residual category: current assets are defined, and everything else is non-current.&lt;/p&gt;
      &lt;p&gt;IAS 1 uses &quot;non-current&quot; for tangible, intangible and financial assets &lt;b&gt;of a long-term nature&lt;/b&gt;, but permits alternative descriptions (for example &quot;fixed assets&quot;) as long as the meaning is clear (IAS 1.67). &lt;span class=&quot;src&quot;&gt;slide 8&lt;/span&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Tangible assets&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Physical resources. They include subclasses such as &lt;i&gt;current assets&lt;/i&gt; (e.g. &lt;b&gt;inventory&lt;/b&gt;) and &lt;i&gt;fixed assets&lt;/i&gt; (e.g. &lt;b&gt;buildings and equipment&lt;/b&gt;). PPE is a subset of tangible fixed assets.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Intangible assets&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;&lt;b&gt;Non-physical&lt;/b&gt; resources and rights that have value because they give the business an advantage in the marketplace: &lt;i&gt;goodwill, copyrights, trademarks, patents, computer programs&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;span class=&quot;src&quot;&gt;slide 9&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 250&quot; role=&quot;img&quot; aria-label=&quot;Asset classification tree&quot;&gt;
      &lt;g font-size=&quot;13.5&quot;&gt;
        &lt;rect x=&quot;370&quot; y=&quot;10&quot; width=&quot;160&quot; height=&quot;40&quot; rx=&quot;8&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;ASSET&lt;/text&gt;
        &lt;path d=&quot;M450,50 V70 H215 V90 M450,70 H685 V90&quot; stroke=&quot;var(--ink2)&quot; fill=&quot;none&quot;/&gt;
        &lt;rect x=&quot;120&quot; y=&quot;90&quot; width=&quot;190&quot; height=&quot;40&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;215&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Current (IAS 1.66)&lt;/text&gt;
        &lt;rect x=&quot;590&quot; y=&quot;90&quot; width=&quot;190&quot; height=&quot;40&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot;/&gt;&lt;text x=&quot;685&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Non-current (residual)&lt;/text&gt;
        &lt;path d=&quot;M215,130 V170 M685,130 V150 H520 V170 M685,150 V170 M685,150 H850 V170&quot; stroke=&quot;var(--ink2)&quot; fill=&quot;none&quot;/&gt;
        &lt;rect x=&quot;120&quot; y=&quot;170&quot; width=&quot;190&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;215&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot;&gt;Inventories&lt;/text&gt;&lt;text x=&quot;215&quot; y=&quot;214&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;IAS 2&lt;/text&gt;
        &lt;rect x=&quot;430&quot; y=&quot;170&quot; width=&quot;180&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;520&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Property, plant &amp;amp; eq.&lt;/text&gt;&lt;text x=&quot;520&quot; y=&quot;214&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;IAS 16 ← this lecture&lt;/text&gt;
        &lt;rect x=&quot;625&quot; y=&quot;170&quot; width=&quot;120&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;685&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot;&gt;Investment&lt;/text&gt;&lt;text x=&quot;685&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;property · IAS 40&lt;/text&gt;
        &lt;rect x=&quot;760&quot; y=&quot;170&quot; width=&quot;130&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;825&quot; y=&quot;194&quot; text-anchor=&quot;middle&quot;&gt;Intangibles&lt;/text&gt;&lt;text x=&quot;825&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;IAS 38&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;Classification determines which standard applies. The reference to IAS 38 for intangibles comes from slide 27.&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Why classify?&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;For users of financial statements&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Information about the &lt;b&gt;nature&lt;/b&gt; and &lt;b&gt;amounts&lt;/b&gt; of economic resources helps users identify the entity&#x27;s financial strengths and weaknesses (CF 1.13). Some cash flows result directly from a single resource (a trade receivable is collected in cash); others arise only from combining several resources to produce and sell (a plant on its own does not generate cash). Even where those cash flows cannot be attributed to individual resources, users need to know which resources are available (CF 1.14). &lt;span class=&quot;src&quot;&gt;slide 10&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;For preparers of financial statements&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Classification &lt;b&gt;determines the applicable standard&lt;/b&gt;, and the standard sets out how the asset is recognised, measured and presented in the &lt;span class=&quot;term&quot;&gt;statement of financial position&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(balance sheet)&lt;/span&gt;. The course focuses on Inventories, &lt;b&gt;Property, plant and equipment&lt;/b&gt; and Investment property. &lt;span class=&quot;src&quot;&gt;slide 11&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;extbox&quot;&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; IAS 1, cited in the slides, is superseded by &lt;b&gt;IFRS 18&lt;/b&gt; &lt;i&gt;Presentation and Disclosure in Financial Statements&lt;/i&gt; for annual periods beginning on or after 1 January 2027; some of its paragraphs have been carried over into IFRS 18 and others moved to IAS 8. The current/non-current classification requirements remain, but with different paragraph numbering. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation – IFRS 18&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Self-check · 2&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;A security held for trading, which the company expects to hold for 18 months, is it current or non-current?&lt;/summary&gt;&lt;div&gt;Current: one of the IAS 1.66 conditions is sufficient, and condition (b), &quot;held primarily for the purpose of trading&quot;, is met even if the holding horizon exceeds 12 months.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is the definition of &quot;non-current&quot; residual?&lt;/summary&gt;&lt;div&gt;IAS 1.66 positively defines only current assets; all other assets are non-current by exclusion.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Give two reasons why classification matters.&lt;/summary&gt;&lt;div&gt;(1) It informs users about the nature and amounts of resources, and therefore about cash-flow prospects (CF 1.13–1.14). (2) It determines which standard applies for recognition, measurement and presentation.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3 IAS 16 ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s3&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;IAS 16 · paras 2–6&lt;/span&gt;&lt;h2&gt;Definition, overview and scope&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;blockquote class=&quot;def&quot;&gt;&lt;i&gt;Property, plant and equipment&lt;/i&gt; are &lt;b&gt;tangible items&lt;/b&gt; that:&lt;br&gt;• are held for use in the &lt;b&gt;production or supply of goods or services&lt;/b&gt;, for rental to others, or for administrative purposes; and&lt;br&gt;• are expected to be used during &lt;b&gt;more than one period&lt;/b&gt;.&lt;cite&gt;IAS 16.6 · slide 12&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Property, plant and equipment (PPE)&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(often referred to as &quot;fixed assets&quot;)&lt;/span&gt;: land, buildings, machinery, motor vehicles, furniture, equipment. Three filters: &lt;b&gt;tangible&lt;/b&gt;, &lt;b&gt;used&lt;/b&gt; (not sold: otherwise it is inventory), &lt;b&gt;multi-period&lt;/b&gt;.&lt;/p&gt;

  &lt;h3&gt;The life of a PPE item in one sentence&lt;/h3&gt;
  &lt;p&gt;PPE is &lt;b&gt;initially measured at cost&lt;/b&gt;, subsequently under either the &lt;b&gt;cost model&lt;/b&gt; or the &lt;b&gt;revaluation model&lt;/b&gt;, and is &lt;b&gt;depreciated&lt;/b&gt; by allocating its depreciable amount &lt;b&gt;on a systematic basis over its useful life&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 150&quot; role=&quot;img&quot; aria-label=&quot;Life cycle of a PPE item&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;g&gt;&lt;rect x=&quot;5&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;62&quot; rx=&quot;31&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Recognition&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;paras 7–14&lt;/text&gt;&lt;/g&gt;
        &lt;g&gt;&lt;rect x=&quot;183&quot; y=&quot;40&quot; width=&quot;160&quot; height=&quot;62&quot; rx=&quot;31&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;263&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Initial: at cost&lt;/text&gt;&lt;text x=&quot;263&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;paras 15–28&lt;/text&gt;&lt;/g&gt;
        &lt;g&gt;&lt;rect x=&quot;371&quot; y=&quot;40&quot; width=&quot;170&quot; height=&quot;62&quot; rx=&quot;31&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;456&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Cost model or&lt;/text&gt;&lt;text x=&quot;456&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Revaluation model&lt;/text&gt;&lt;text x=&quot;456&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;paras 29–42&lt;/text&gt;&lt;/g&gt;
        &lt;g&gt;&lt;rect x=&quot;569&quot; y=&quot;40&quot; width=&quot;150&quot; height=&quot;62&quot; rx=&quot;31&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;644&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Depreciation&lt;/text&gt;&lt;text x=&quot;644&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;+ Impairment&lt;/text&gt;&lt;text x=&quot;644&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;paras 43–66&lt;/text&gt;&lt;/g&gt;
        &lt;g&gt;&lt;rect x=&quot;747&quot; y=&quot;40&quot; width=&quot;148&quot; height=&quot;62&quot; rx=&quot;31&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;821&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Derecognition&lt;/text&gt;&lt;text x=&quot;821&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;paras 67–72&lt;/text&gt;&lt;/g&gt;
      &lt;/g&gt;
      &lt;g stroke=&quot;var(--ink2)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#arr)&quot;&gt;&lt;path d=&quot;M156,71 H180&quot;/&gt;&lt;path d=&quot;M344,71 H368&quot;/&gt;&lt;path d=&quot;M542,71 H566&quot;/&gt;&lt;path d=&quot;M720,71 H744&quot;/&gt;&lt;/g&gt;
      &lt;text x=&quot;450&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;paragraph numbers are those shown in the slide headings&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Scope: where IAS 16 does not apply&lt;/h3&gt;
  &lt;p&gt;IAS 16 applies to PPE &lt;b&gt;except when another standard requires or permits a different accounting treatment&lt;/b&gt; (IAS 16.2). It does not apply to: &lt;span class=&quot;src&quot;&gt;IAS 16.3 · slides 14–15&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;a) PPE held for sale → IFRS 5&lt;/summary&gt;&lt;div&gt;PPE classified as &lt;span class=&quot;term&quot;&gt;held for sale&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(its carrying amount will be recovered principally through sale rather than through continuing use)&lt;/span&gt; falls under IFRS 5 &lt;i&gt;Non-current Assets Held for Sale and Discontinued Operations&lt;/i&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;b) Biological assets → IAS 41&lt;/summary&gt;&lt;div&gt;Biological assets related to agricultural activity fall under IAS 41 &lt;i&gt;Agriculture&lt;/i&gt;, &lt;b&gt;except bearer plants&lt;/b&gt; &lt;span class=&quot;gloss&quot;&gt;(plants that bear produce over more than one period: vines, fruit trees, oil palms)&lt;/span&gt;, which fall within IAS 16. The &lt;b&gt;produce&lt;/b&gt; growing on bearer plants (the grapes), however, remains within IAS 41.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;c) Exploration &amp;amp; evaluation assets → IFRS 6&lt;/summary&gt;&lt;div&gt;Recognition and measurement of exploration and evaluation assets for mineral resources fall under IFRS 6 &lt;i&gt;Exploration for and Evaluation of Mineral Resources&lt;/i&gt;.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;d) Mineral rights &amp;amp; reserves&lt;/summary&gt;&lt;div&gt;Mineral rights and mineral reserves such as oil, natural gas and similar &lt;b&gt;non-regenerative&lt;/b&gt; resources.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Mind the &quot;however&quot;.&lt;/b&gt; IAS 16 nonetheless &lt;b&gt;applies&lt;/b&gt; to PPE &lt;b&gt;used to develop or maintain&lt;/b&gt; the assets in items (b)–(d): a drilling rig is PPE even though the reserve itself is out of scope. Moreover, an entity using the &lt;b&gt;cost model&lt;/b&gt; for investment property (IAS 40) applies the IAS 16 cost model to owned investment property (IAS 16.5). &lt;span class=&quot;src&quot;&gt;slides 15, 18&lt;/span&gt;&lt;/div&gt;

  &lt;h3&gt;Example: livestock and tractor&lt;/h3&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;The case.&lt;/b&gt; An entity owns a herd of beef cattle that forms the &lt;i&gt;breeding stock&lt;/i&gt; of its agricultural activity. It also owns a &lt;b&gt;tractor and trailer&lt;/b&gt; used to carry feed to the livestock. Which standard applies to the tractor and trailer? &lt;span class=&quot;src&quot;&gt;slides 16–17&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Consider the three options before moving on: IAS 2 &lt;i&gt;Inventories&lt;/i&gt;, IAS 16 &lt;i&gt;PPE&lt;/i&gt;, IAS 40 &lt;i&gt;Investment Property&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Ruling out.&lt;/b&gt; It is not &lt;b&gt;IAS 2&lt;/b&gt;: the tractor is neither held for sale nor consumed in the production process. It is not &lt;b&gt;IAS 40&lt;/b&gt;: it is not property held to earn rentals or for capital appreciation.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;Answer: IAS 16.&lt;/b&gt; It is a tangible item used in production for more than one period. The breeding stock is a &lt;i&gt;biological asset&lt;/i&gt; (IAS 41), but IAS 16 applies to PPE used to &lt;b&gt;maintain&lt;/b&gt; biological assets. The standard applying to the herd does not &quot;carry over&quot; to the tractor.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;small&quot; data-lab&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Self-check · 3&lt;/h4&gt;
    &lt;p style=&quot;margin:.2em 0 0&quot;&gt;&lt;b&gt;A vineyard (the vines) of a wine producer falls under…&lt;/b&gt;&lt;/p&gt;
    &lt;div class=&quot;mcq&quot;&gt;&lt;button data-why=&quot;Vines are bearer plants, excluded from IAS 41 and included in IAS 16.&quot;&gt;IAS 41&lt;/button&gt;&lt;button data-ok data-why=&quot;Bearer plants are within the scope of IAS 16; the grapes growing on the vine remain within IAS 41.&quot;&gt;IAS 16&lt;/button&gt;&lt;button data-why=&quot;They are not held for sale.&quot;&gt;IAS 2&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;mcq-fb&quot;&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Does a machine that the entity has decided to sell, and that meets the IFRS 5 criteria, remain within IAS 16?&lt;/summary&gt;&lt;div&gt;No: PPE classified as held for sale leaves the scope of IAS 16 (16.3a) and falls under IFRS 5. From that point, depreciation also ceases (16.55).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;What are the three requirements of the definition of PPE?&lt;/summary&gt;&lt;div&gt;A tangible item; held for use in the production or supply of goods or services, for rental to others or for administrative purposes; expected to be used during more than one period.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ 4 RECOGNITION ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s4&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;IAS 16 · paras 7–14&lt;/span&gt;&lt;h2&gt;Recognition&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Recognition&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(the process of incorporating an item in the financial statements, with a description and a monetary amount)&lt;/span&gt;. The cost of an item of PPE is recognised as an asset &lt;b&gt;if, and only if&lt;/b&gt;, both criteria are met: &lt;span class=&quot;src&quot;&gt;IAS 16.7 · slide 19&lt;/span&gt;&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 200&quot; role=&quot;img&quot; aria-label=&quot;Recognition decision tree&quot;&gt;
      &lt;g font-size=&quot;13.5&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;70&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;95&quot; y=&quot;94&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Cost incurred&lt;/text&gt;&lt;text x=&quot;95&quot; y=&quot;113&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;acquisition, construction, addition&lt;/text&gt;
        &lt;path d=&quot;M180,98 H220&quot; stroke=&quot;var(--ink2)&quot; marker-end=&quot;url(#arr)&quot;/&gt;
        &lt;polygon points=&quot;320,40 420,98 320,156 220,98&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot;&gt;future benefits&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;109&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot;&gt;probable?&lt;/text&gt;
        &lt;path d=&quot;M420,98 H460&quot; stroke=&quot;var(--ink2)&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;yes&lt;/text&gt;
        &lt;polygon points=&quot;560,40 660,98 560,156 460,98&quot; fill=&quot;var(--ochre-bg)&quot; stroke=&quot;var(--ochre)&quot;/&gt;&lt;text x=&quot;560&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot;&gt;cost measurable&lt;/text&gt;&lt;text x=&quot;560&quot; y=&quot;109&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot;&gt;reliably?&lt;/text&gt;
        &lt;path d=&quot;M660,98 H700&quot; stroke=&quot;var(--ink2)&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;text x=&quot;680&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;mut&quot;&gt;yes&lt;/text&gt;
        &lt;rect x=&quot;702&quot; y=&quot;70&quot; width=&quot;190&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;var(--ochre)&quot; /&gt;&lt;text x=&quot;797&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--paper)&quot;&gt;Asset (PPE)&lt;/text&gt;&lt;text x=&quot;797&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--paper)&quot;&gt;in the carrying amount&lt;/text&gt;
        &lt;path d=&quot;M320,156 V185 H560 V156&quot; stroke=&quot;var(--bad)&quot; fill=&quot;none&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--bad)&quot;&gt;no → expensed in profit or loss&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
  &lt;/figure&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Spare parts&lt;/button&gt;&lt;button&gt;Unit of measure&lt;/button&gt;&lt;button&gt;Which costs&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;i&gt;Spare parts&lt;/i&gt;, &lt;i&gt;stand-by equipment&lt;/i&gt; and &lt;i&gt;servicing equipment&lt;/i&gt; are PPE &lt;b&gt;when they meet the definition of PPE&lt;/b&gt; (i.e. when they will be used during more than one period); &lt;b&gt;otherwise&lt;/b&gt; they are &lt;b&gt;inventories&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;IAS 16.8 · slide 19&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;The standard &lt;b&gt;does not prescribe the unit of measure&lt;/b&gt; for recognition, i.e. what constitutes an &quot;item&quot; of PPE: judgement is required. It may be appropriate to &lt;b&gt;aggregate individually insignificant items&lt;/b&gt;, such as &lt;i&gt;moulds&lt;/i&gt;, &lt;i&gt;tools and dies&lt;/i&gt;, and to apply the criteria to the &lt;b&gt;aggregate value&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;IAS 16.9 · slide 20&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;The principle applies to &lt;b&gt;all&lt;/b&gt; PPE costs at the time they are incurred: &lt;b&gt;initial&lt;/b&gt; costs to acquire or construct, and &lt;b&gt;subsequent&lt;/b&gt; costs to add to, replace part of, or service the item. Cost may also include costs of leases of assets used to construct, add to, replace part of or service PPE, such as depreciation of &lt;span class=&quot;term&quot;&gt;right-of-use assets&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(the lessee&#x27;s right to use a leased asset)&lt;/span&gt;. &lt;span class=&quot;src&quot;&gt;IAS 16.10 · slide 21&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Replacement of parts: the component approach&lt;/h3&gt;
  &lt;p&gt;Some parts require &lt;b&gt;replacement at regular intervals&lt;/b&gt;: a furnace lining after a specified number of hours of use, aircraft interiors such as seats and &lt;i&gt;galleys&lt;/i&gt; several times during the life of the airframe, or the interior walls of a building, replaced less frequently or only once. If the recognition criteria are met, the cost of the replacement is &lt;b&gt;recognised in the carrying amount&lt;/b&gt; of the item when incurred. &lt;span class=&quot;src&quot;&gt;slide 22&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;The &lt;span class=&quot;term&quot;&gt;carrying amount&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(the amount at which the asset is recognised in the statement of financial position, CF 5.1)&lt;/span&gt; of the replaced parts &lt;b&gt;is derecognised&lt;/b&gt; in accordance with the derecognition provisions (paras 67–72). In addition, each part with a cost that is &lt;b&gt;significant in relation to the total cost&lt;/b&gt; must be &lt;b&gt;depreciated separately&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;IAS 16.13, 16.43 · slide 23&lt;/span&gt;&lt;/p&gt;

  &lt;h3&gt;Major inspections&lt;/h3&gt;
  &lt;p&gt;For some items (an aircraft, for example), a condition of continuing to operate is performing &lt;b&gt;regular major inspections&lt;/b&gt; for faults, regardless of whether parts are replaced. &lt;span class=&quot;src&quot;&gt;IAS 16.14 · slide 24&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;stepper&quot;&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;1 · Capitalise.&lt;/b&gt; When each major inspection is performed, its cost is recognised in the carrying amount &lt;b&gt;as a replacement&lt;/b&gt;, if the recognition criteria are met.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;2 · Remove the old one.&lt;/b&gt; Any remaining carrying amount of the cost of the &lt;b&gt;previous&lt;/b&gt; inspection (as distinct from physical parts) is &lt;b&gt;derecognised&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;b&gt;3 · Even if it was not visible.&lt;/b&gt; This applies &lt;b&gt;regardless of whether&lt;/b&gt; the cost of the previous inspection was identified in the transaction in which the item was acquired. If necessary, the &lt;b&gt;estimated cost of a future similar inspection&lt;/b&gt; may be used as an indication of the cost of the inspection component included in the original price.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;btn&quot; data-prev&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;span class=&quot;small&quot; data-lab&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next →&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;The figures for these mechanisms are in section &lt;a href=&quot;#s10&quot;&gt;10 · Worked examples&lt;/a&gt;.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Self-check · 4&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;What are the two recognition criteria in IAS 16.7?&lt;/summary&gt;&lt;div&gt;(1) It is probable that future economic benefits associated with the item will flow to the entity; (2) the cost of the item can be measured reliably. Both must be met.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;A company buys 300 small moulds at €40 each, used for several years. How can it account for them?&lt;/summary&gt;&lt;div&gt;IAS 16.9 permits aggregating individually insignificant items (moulds, tools and dies) and applying the recognition criteria to the aggregate value (€12,000), recognising them as PPE.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;The seats of an aircraft are replaced. What happens to the old seats?&lt;/summary&gt;&lt;div&gt;The cost of the new seats is included in the carrying amount if it meets the criteria; the carrying amount of the replaced seats is derecognised (IAS 16.13), with any gain or loss in profit or loss.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5 INITIAL MEASUREMENT ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s5&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;IAS 16 · paras 15–28&lt;/span&gt;&lt;h2&gt;Initial measurement&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;Recognition requires assigning the item a &lt;b&gt;monetary amount&lt;/b&gt;; this calls for a &lt;span class=&quot;term&quot;&gt;measurement basis&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(the identified feature of an item being measured, for example historical cost, fair value or fulfilment value)&lt;/span&gt;. Applying a measurement basis to an asset produces a measure both of the asset and of the related income and expenses. &lt;span class=&quot;src&quot;&gt;CF 5.1, 6.1 · slide 25&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Cost &lt;span class=&quot;src&quot;&gt;IAS 16.6&lt;/span&gt;&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;The amount of &lt;b&gt;cash or cash equivalents paid&lt;/b&gt;, or the &lt;b&gt;fair value&lt;/b&gt; of the other consideration given to acquire an asset at the time of its acquisition or construction, or, where applicable, the amount attributed to that asset when initially recognised in accordance with other IFRSs (e.g. IFRS 2 &lt;i&gt;Share-based Payment&lt;/i&gt;, if the item is paid for with shares).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Fair value &lt;span class=&quot;src&quot;&gt;IAS 16.6&lt;/span&gt;&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;The price that would be &lt;b&gt;received to sell&lt;/b&gt; an asset (or paid to transfer a liability) in an &lt;b&gt;orderly transaction between market participants&lt;/b&gt; at the measurement date (IFRS 13 &lt;i&gt;Fair Value Measurement&lt;/i&gt;). It is an exit price, from the market&#x27;s perspective.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Which basis, for which asset&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Historical cost&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:1.1em&quot;&gt;&lt;li&gt;Inventory (IAS 2.9)&lt;/li&gt;&lt;li&gt;&lt;b&gt;PPE (IAS 16.15)&lt;/b&gt;&lt;/li&gt;&lt;li&gt;Investment property (IAS 40.20)&lt;/li&gt;&lt;li&gt;Intangible assets (IAS 38.24)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Fair value&lt;/h4&gt;&lt;ul style=&quot;margin:0;padding-left:1.1em&quot;&gt;&lt;li&gt;Biological assets (IAS 41.12)&lt;/li&gt;&lt;li&gt;Assets acquired in a business combination (IFRS 3.18)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;slide 27&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;When historical cost is not straightforward&lt;/summary&gt;&lt;div&gt;Buying an item for cash is simple. It becomes more complex when the consideration is &lt;b&gt;non-monetary&lt;/b&gt;, &lt;b&gt;deferred&lt;/b&gt; or &lt;b&gt;paid in advance&lt;/b&gt;, or, for PPE, when &lt;b&gt;dismantling, removal and restoration costs must be estimated&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 28&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;When fair value is not straightforward&lt;/summary&gt;&lt;div&gt;It is simple with a &lt;b&gt;Level 1&lt;/b&gt; input (quoted price in an active market for an identical asset). It is more complex with &lt;b&gt;Levels 2 and 3&lt;/b&gt; (indirectly observable inputs, or unobservable inputs estimated by the entity): business combinations, &lt;i&gt;barter transactions&lt;/i&gt;, &lt;i&gt;government grants&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;slide 29&lt;/span&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; the description of the levels comes from IFRS 13, see &lt;a href=&quot;#s11&quot;&gt;Further reading&lt;/a&gt;.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;

  &lt;h3&gt;The three components of cost&lt;/h3&gt;
  &lt;p&gt;An item of PPE that qualifies for recognition &lt;b&gt;is measured at its cost&lt;/b&gt; (IAS 16.15). Cost comprises: &lt;span class=&quot;src&quot;&gt;IAS 16.16 · slides 30–31&lt;/span&gt;&lt;/p&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 260&quot; role=&quot;img&quot; aria-label=&quot;Components of the cost of a PPE item&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;rect x=&quot;20&quot; y=&quot;30&quot; width=&quot;270&quot; height=&quot;200&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
        &lt;text x=&quot;155&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;a) Purchase price&lt;/text&gt;
        &lt;text x=&quot;40&quot; y=&quot;90&quot;&gt;  list price&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;114&quot;&gt;+ import duties&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;138&quot;&gt;+ non-refundable taxes&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;162&quot; style=&quot;fill:var(--bad)&quot;&gt;− trade discounts and rebates&lt;/text&gt;
        &lt;text x=&quot;155&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;(trade discounts and rebates)&lt;/text&gt;
        &lt;text x=&quot;305&quot; y=&quot;135&quot; font-size=&quot;26&quot; class=&quot;mut&quot;&gt;+&lt;/text&gt;
        &lt;rect x=&quot;330&quot; y=&quot;30&quot; width=&quot;270&quot; height=&quot;200&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
        &lt;text x=&quot;465&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;b) Directly attributable&lt;/text&gt;
        &lt;text x=&quot;350&quot; y=&quot;86&quot;&gt;• employee benefits (IAS 19)&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;108&quot;&gt;• site preparation&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;130&quot;&gt;• delivery and handling&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;152&quot;&gt;• installation and assembly&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;174&quot;&gt;• testing&lt;/text&gt;&lt;text x=&quot;350&quot; y=&quot;196&quot;&gt;• professional fees&lt;/text&gt;
        &lt;text x=&quot;615&quot; y=&quot;135&quot; font-size=&quot;26&quot; class=&quot;mut&quot;&gt;+&lt;/text&gt;
        &lt;rect x=&quot;640&quot; y=&quot;30&quot; width=&quot;245&quot; height=&quot;200&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
        &lt;text x=&quot;762&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;c) Dismantling &amp;amp;&lt;/text&gt;&lt;text x=&quot;762&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;restoration&lt;/text&gt;
        &lt;text x=&quot;660&quot; y=&quot;108&quot;&gt;initial estimate of the costs&lt;/text&gt;&lt;text x=&quot;660&quot; y=&quot;130&quot;&gt;of dismantling, removing and&lt;/text&gt;&lt;text x=&quot;660&quot; y=&quot;152&quot;&gt;restoring the site, when the&lt;/text&gt;&lt;text x=&quot;660&quot; y=&quot;174&quot;&gt;obligation arises&lt;/text&gt;
        &lt;text x=&quot;762&quot; y=&quot;205&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;12&quot;&gt;(e.g. an offshore platform)&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;&quot;Directly attributable&quot; means costs necessary to bring the asset to the &lt;b&gt;location and condition&lt;/b&gt; necessary for it to be capable of operating in the manner intended by management (IAS 16.16b–17, slides 31–32).&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;Workshop: in or out of cost?&lt;/h3&gt;
  &lt;p&gt;For each item, choose whether it should be &lt;b&gt;capitalised&lt;/b&gt; (included in the cost of PPE) or &lt;b&gt;expensed&lt;/b&gt; (in profit or loss). The answers are based on IAS 16.16–20A (slides 31–35).&lt;/p&gt;
  &lt;div class=&quot;sorter tile&quot; id=&quot;sorter&quot;&gt;&lt;ul&gt;&lt;/ul&gt;&lt;p class=&quot;small&quot; id=&quot;sorter-score&quot; style=&quot;margin:.6em 0 0&quot;&gt;&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;When to stop capitalising&lt;/h3&gt;
  &lt;p&gt;Capitalisation &lt;b&gt;ceases when the item is in the location and condition necessary for it to be capable of operating in the manner intended by management&lt;/b&gt;. Costs of using or redeploying the item are not included in the carrying amount; for example: &lt;span class=&quot;src&quot;&gt;IAS 16.20 · slide 34&lt;/span&gt;&lt;/p&gt;
  &lt;ul&gt;&lt;li&gt;costs incurred while an item capable of operating as intended has yet to be brought into use or is operated at less than full capacity;&lt;/li&gt;&lt;li&gt;initial operating losses, such as those incurred while demand for the item&#x27;s output builds up;&lt;/li&gt;&lt;li&gt;costs of relocating or reorganising part or all of the entity&#x27;s operations.&lt;/li&gt;&lt;/ul&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Samples produced during testing (IAS 16.20A).&lt;/b&gt; If items (e.g. test samples) are produced while bringing the asset to the location and condition necessary for it to operate, and are sold, &lt;b&gt;the proceeds and the related cost are recognised in profit or loss&lt;/b&gt;; the cost is measured applying IAS 2. The cost of the PPE is not reduced. &lt;span class=&quot;src&quot;&gt;slide 35&lt;/span&gt;
  &lt;br&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; This rule stems from the amendment &lt;i&gt;Proceeds before Intended Use&lt;/i&gt; (May 2020, effective from 1 January 2022): previously, the proceeds from samples were deducted from the cost of testing. &lt;a href=&quot;https://www.iasplus.com/en/news/2020/05/ias-16&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Measurement of cost: deferred payment and exchanges&lt;/h3&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Deferred payment&lt;/button&gt;&lt;button&gt;Exchange of assets&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;Cost is the &lt;span class=&quot;term&quot;&gt;cash price equivalent&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(the price that would be paid in cash)&lt;/span&gt; at the recognition date. If payment is &lt;b&gt;deferred beyond normal credit terms&lt;/b&gt;, the difference between the cash price equivalent and the total payment is recognised as &lt;b&gt;interest&lt;/b&gt; over the period of credit, unless it is capitalised in accordance with IAS 23 &lt;i&gt;Borrowing Costs&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;IAS 16.23 · slide 36&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;ctrls&quot;&gt;
        &lt;label&gt;Cash price: &lt;output id=&quot;dp-cash&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dp-c&quot; min=&quot;50000&quot; max=&quot;200000&quot; step=&quot;5000&quot; value=&quot;100000&quot;&gt;&lt;/label&gt;
        &lt;label&gt;Total paid in instalments: &lt;output id=&quot;dp-tot&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dp-t&quot; min=&quot;50000&quot; max=&quot;260000&quot; step=&quot;5000&quot; value=&quot;121000&quot;&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;readout&quot;&gt;&lt;div&gt;&lt;span&gt;Cost of PPE&lt;/span&gt;&lt;b id=&quot;dp-ppe&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Interest over the credit period&lt;/span&gt;&lt;b id=&quot;dp-int&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;Teaching example, not in the slides: the asset is recognised at its &quot;cash&quot; value; the premium for deferral is a finance cost.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot;&gt;
      &lt;p&gt;If an item of PPE is acquired in exchange for non-monetary assets (or a combination of monetary and non-monetary assets), its cost is measured at &lt;b&gt;fair value&lt;/b&gt;, &lt;b&gt;unless&lt;/b&gt;: &lt;span class=&quot;src&quot;&gt;IAS 16.24 · slide 37&lt;/span&gt;&lt;/p&gt;
      &lt;ol type=&quot;a&quot;&gt;&lt;li&gt;the exchange transaction &lt;b&gt;lacks commercial substance&lt;/b&gt; (&lt;i&gt;commercial substance&lt;/i&gt;: the entity&#x27;s future cash flows do not genuinely change as a result of the exchange), or&lt;/li&gt;&lt;li&gt;the fair value of &lt;b&gt;neither&lt;/b&gt; the asset received &lt;b&gt;nor&lt;/b&gt; the asset given up is reliably measurable.&lt;/li&gt;&lt;/ol&gt;
      &lt;p&gt;In these cases, cost is measured at the &lt;b&gt;carrying amount of the asset given up&lt;/b&gt;. The rule applies even if the entity cannot immediately derecognise the asset given up.&lt;/p&gt;
      &lt;figure class=&quot;fig&quot; style=&quot;margin:.4em 0 0&quot;&gt;
        &lt;svg viewBox=&quot;0 0 700 120&quot; role=&quot;img&quot; aria-label=&quot;Exchange of assets: decision&quot;&gt;&lt;g font-size=&quot;13&quot;&gt;
          &lt;rect x=&quot;5&quot; y=&quot;35&quot; width=&quot;150&quot; height=&quot;50&quot; rx=&quot;8&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Exchange&lt;/text&gt;&lt;text x=&quot;80&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;mut&quot;&gt;non-monetary asset&lt;/text&gt;
          &lt;path d=&quot;M155,60 H200&quot; stroke=&quot;var(--ink2)&quot; marker-end=&quot;url(#arr)&quot;/&gt;
          &lt;rect x=&quot;202&quot; y=&quot;25&quot; width=&quot;250&quot; height=&quot;70&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;327&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;commercial substance  AND&lt;/text&gt;&lt;text x=&quot;327&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot;&gt;reliable fair value?&lt;/text&gt;
          &lt;path d=&quot;M452,45 L520,22&quot; stroke=&quot;var(--good)&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;text x=&quot;525&quot; y=&quot;26&quot; style=&quot;fill:var(--good)&quot; font-weight=&quot;600&quot;&gt;yes → fair value&lt;/text&gt;
          &lt;path d=&quot;M452,78 L520,100&quot; stroke=&quot;var(--bad)&quot; marker-end=&quot;url(#arr)&quot;/&gt;&lt;text x=&quot;525&quot; y=&quot;106&quot; style=&quot;fill:var(--bad)&quot; font-weight=&quot;600&quot;&gt;no → carrying amount given up&lt;/text&gt;
        &lt;/g&gt;&lt;/svg&gt;
      &lt;/figure&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Self-check · 5&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;Are staff training costs for operating a new plant capitalised?&lt;/summary&gt;&lt;div&gt;No. &quot;Costs of conducting business … with a new class of customer (including costs of staff training)&quot; are not costs of PPE (IAS 16.19c).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Are the losses of the first months, while demand for the product builds up, included in cost?&lt;/summary&gt;&lt;div&gt;No: they are &quot;initial operating losses&quot; (IAS 16.20b), incurred after the item is ready for use.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Why is the dismantling cost included in cost from the outset?&lt;/summary&gt;&lt;div&gt;Because the obligation arises on acquisition (or through use of the item) and is part of what it costs to have that item. The initial estimate is included in cost (IAS 16.16c) and depreciated over the useful life.&lt;/div&gt;&lt;/details&gt;
    &lt;p style=&quot;margin:.6em 0 0&quot;&gt;&lt;b&gt;Exchange lacking commercial substance: the new PPE is measured…&lt;/b&gt;&lt;/p&gt;
    &lt;div class=&quot;mcq&quot;&gt;&lt;button data-why=&quot;Fair value is used only if the exchange has commercial substance and the FV is reliable.&quot;&gt;at the fair value of the asset received&lt;/button&gt;&lt;button data-ok data-why=&quot;IAS 16.24: without commercial substance, the carrying amount of the asset given up is used.&quot;&gt;at the carrying amount of the asset given up&lt;/button&gt;&lt;button data-why=&quot;IAS 16.24 contains no such rule.&quot;&gt;at zero&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;mcq-fb&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;
&lt;!-- ============ 6 AFTER RECOGNITION ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s6&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;6&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;IAS 16 · paras 29–42&lt;/span&gt;&lt;h2&gt;Measurement after recognition&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p&gt;After initial recognition at cost, the entity chooses as its &lt;span class=&quot;term&quot;&gt;accounting policy&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(the specific principles applied by the entity in preparing its financial statements)&lt;/span&gt; either the &lt;b&gt;cost model&lt;/b&gt; (para. 30) or the &lt;b&gt;revaluation model&lt;/b&gt; (para. 31), and applies that policy to &lt;b&gt;an entire class of PPE&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;IAS 16.29 · slide 38&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Cost model &lt;span class=&quot;src&quot;&gt;IAS 16.30&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;formula&quot; style=&quot;margin:.3em 0&quot;&gt;Carrying amount = &lt;b&gt;Cost&lt;/b&gt; − accumulated depreciation − accumulated impairment losses&lt;/div&gt;
      &lt;p style=&quot;margin:0&quot;&gt;Simple and verifiable; the value does not track the market.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Revaluation model &lt;span class=&quot;src&quot;&gt;IAS 16.31&lt;/span&gt;&lt;/h4&gt;
      &lt;div class=&quot;formula&quot; style=&quot;margin:.3em 0&quot;&gt;Carrying amount = &lt;b&gt;Fair value at the date of revaluation&lt;/b&gt; − &lt;i&gt;subsequent&lt;/i&gt; depreciation and impairment&lt;/div&gt;
      &lt;p style=&quot;margin:0&quot;&gt;Only if fair value can be &lt;b&gt;measured reliably&lt;/b&gt;; revaluations are made with &lt;b&gt;sufficient regularity&lt;/b&gt; to ensure that the carrying amount does not differ materially from fair value at the end of the reporting period.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small&quot;&gt;slides 41–42&lt;/p&gt;

  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Special case: investment funds and insurance contracts (IAS 16.29A–29B)&lt;/summary&gt;&lt;div&gt;Some entities operate an investment fund that provides investors with benefits determined by units in the fund, or issue insurance contracts with &lt;i&gt;direct participation features&lt;/i&gt; (benefits to policyholders depend on the return on a pool of &quot;underlying items&quot;) and hold those underlying items. If the fund or the underlying items include &lt;b&gt;owner-occupied property&lt;/b&gt;, the entity applies IAS 16 but &lt;b&gt;may elect&lt;/b&gt; to measure it using the &lt;b&gt;fair value model in IAS 40&lt;/b&gt;, as an exception to para. 29. For the purposes of this election, insurance contracts include investment contracts with discretionary participation features (terms defined in IFRS 17). This property forms a &lt;b&gt;separate class of PPE&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slides 39–40&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Government grants (IAS 16.28)&lt;/summary&gt;&lt;div&gt;The carrying amount may be &lt;b&gt;reduced by government grants&lt;/b&gt; in accordance with IAS 20. &lt;span class=&quot;src&quot;&gt;slide 43&lt;/span&gt; &lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; IAS 20 permits grants related to assets to be presented &lt;i&gt;either&lt;/i&gt; as deferred income &lt;i&gt;or&lt;/i&gt; by deducting the grant from the carrying amount of the asset; in the latter case, the grant is recognised in profit or loss through a reduced depreciation charge. &lt;a href=&quot;https://ifrs.org/issued-standards/list-of-standards/ias-20-accounting-for-government-grants-and-disclosure-of-government-assistance&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation – IAS 20&lt;/a&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;Revaluation model: the rules&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Frequency &lt;span class=&quot;src&quot;&gt;IAS 16.34&lt;/span&gt;&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Depends on &lt;b&gt;changes in fair value&lt;/b&gt;. Items with volatile fair values: &lt;b&gt;annual&lt;/b&gt; revaluation. Items with insignificant changes: revaluation &lt;b&gt;every 3 or 5 years&lt;/b&gt; may suffice. A revaluation is needed when fair value differs materially from the carrying amount.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Entire class &lt;span class=&quot;src&quot;&gt;IAS 16.36–37&lt;/span&gt;&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;If an item is revalued, &lt;b&gt;the entire class&lt;/b&gt; to which it belongs (a grouping of assets of a similar nature and use) is revalued, which prevents selective revaluation of assets. Examples of classes: land; land and buildings; machinery; ships; aircraft; motor vehicles; furniture and fixtures; office equipment; bearer plants. &lt;span class=&quot;src&quot;&gt;slide 44&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Where the revaluation difference goes&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 230&quot; role=&quot;img&quot; aria-label=&quot;Treatment of revaluation increases and decreases&quot;&gt;
      &lt;g font-size=&quot;13&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;420&quot; height=&quot;190&quot; rx=&quot;12&quot; fill=&quot;var(--sage-bg)&quot; stroke=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;220&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;▲ Increase (IAS 16.39)&lt;/text&gt;
        &lt;rect x=&quot;30&quot; y=&quot;66&quot; width=&quot;380&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot;/&gt;
        &lt;text x=&quot;220&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;rule: OCI → equity &quot;revaluation surplus&quot;&lt;/text&gt;
        &lt;text x=&quot;220&quot; y=&quot;109&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;other comprehensive income, outside profit&lt;/text&gt;
        &lt;rect x=&quot;30&quot; y=&quot;134&quot; width=&quot;380&quot; height=&quot;60&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;
        &lt;text x=&quot;220&quot; y=&quot;158&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;exception: P&amp;amp;L&lt;/text&gt;
        &lt;text x=&quot;220&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;to the extent it reverses a decrease previously in P&amp;amp;L&lt;/text&gt;
        &lt;rect x=&quot;470&quot; y=&quot;20&quot; width=&quot;420&quot; height=&quot;190&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
        &lt;text x=&quot;680&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;▼ Decrease (IAS 16.40)&lt;/text&gt;
        &lt;rect x=&quot;490&quot; y=&quot;66&quot; width=&quot;380&quot; height=&quot;56&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot;/&gt;
        &lt;text x=&quot;680&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;rule: P&amp;amp;L&lt;/text&gt;
        &lt;text x=&quot;680&quot; y=&quot;109&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;reduces profit for the period&lt;/text&gt;
        &lt;rect x=&quot;490&quot; y=&quot;134&quot; width=&quot;380&quot; height=&quot;60&quot; rx=&quot;8&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--brick)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;
        &lt;text x=&quot;680&quot; y=&quot;158&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;exception: OCI&lt;/text&gt;
        &lt;text x=&quot;680&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;mut&quot;&gt;up to the existing surplus for that asset (reduces it)&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;This is a prudential asymmetry: revaluation gains do not pass through profit, whereas losses do, unless offset on the same asset. &lt;span class=&quot;src&quot;&gt;slides 45–46&lt;/span&gt;&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Other comprehensive income (OCI)&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(items of income and expense that are not recognised in profit or loss but are taken directly to an equity reserve)&lt;/span&gt;. &lt;span class=&quot;term&quot;&gt;Revaluation surplus&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(the equity reserve arising from revaluation)&lt;/span&gt;.&lt;/p&gt;

  &lt;h3&gt;Simulator: two successive revaluations&lt;/h3&gt;
  &lt;p&gt;A machine has a carrying amount of &lt;b&gt;800&lt;/b&gt;. Choose the fair value at the first and second revaluation and see where each difference ends up. &lt;span class=&quot;small&quot;&gt;(Teaching example; for simplicity, depreciation between the two dates is ignored.)&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;tile&quot; id=&quot;rev&quot;&gt;
    &lt;div class=&quot;ctrls&quot;&gt;
      &lt;label&gt;Fair value · revaluation 1: &lt;output id=&quot;rv1o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;rv1&quot; min=&quot;300&quot; max=&quot;1400&quot; step=&quot;10&quot; value=&quot;1000&quot;&gt;&lt;/label&gt;
      &lt;label&gt;Fair value · revaluation 2: &lt;output id=&quot;rv2o&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;rv2&quot; min=&quot;300&quot; max=&quot;1400&quot; step=&quot;10&quot; value=&quot;700&quot;&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;svg id=&quot;rev-svg&quot; viewBox=&quot;0 0 860 260&quot; role=&quot;img&quot; aria-label=&quot;Revaluation simulator chart&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tbl&quot; id=&quot;rev-tbl&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;What happens to the surplus &lt;span class=&quot;src&quot;&gt;IAS 16.41 · slide 47&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;The revaluation surplus &lt;b&gt;may&lt;/b&gt; be transferred &lt;b&gt;directly to retained earnings&lt;/b&gt; when the asset is derecognised (all at once, on disposal) or &lt;b&gt;gradually as the asset is used&lt;/b&gt;: in that case, the amount transferred is the &lt;b&gt;difference between depreciation based on the revalued carrying amount and depreciation based on the original cost&lt;/b&gt;. These transfers are &lt;b&gt;not made through profit or loss&lt;/b&gt;.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Annual transfer = depreciation on revalued amount − depreciation on original cost&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h4&gt;Self-check · 6&lt;/h4&gt;
    &lt;details&gt;&lt;summary&gt;A company wants to revalue only its Milan warehouse, not those in the provinces. Is this possible?&lt;/summary&gt;&lt;div&gt;No. If one item is revalued, the entire class must be revalued (IAS 16.36), for example &quot;land and buildings&quot;.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Year 1: a plant is written down by 50 through P&amp;amp;L. Year 2: it is revalued by +80. Where do the 80 go?&lt;/summary&gt;&lt;div&gt;50 to P&amp;amp;L, because they reverse the previous decrease recognised in profit or loss (IAS 16.39); the remaining 30 go to OCI, in the revaluation surplus.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;How often are revaluations made?&lt;/summary&gt;&lt;div&gt;With sufficient regularity to avoid material differences from fair value: annually for volatile items, every 3–5 years for stable items (IAS 16.34).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7 DEPRECIATION ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s7&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;span class=&quot;sec-num&quot;&gt;7&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;sec-tag&quot;&gt;IAS 16 · paras 43–62A&lt;/span&gt;&lt;h2&gt;Depreciation&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;blockquote class=&quot;def&quot;&gt;&lt;b&gt;Depreciation&lt;/b&gt; is the systematic allocation of the depreciable amount of an asset over its useful life.&lt;cite&gt;IAS 16.6 · slide 48&lt;/cite&gt;&lt;/blockquote&gt;
  &lt;p&gt;&lt;span class=&quot;term&quot;&gt;Depreciation&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(for intangibles the term is &lt;i&gt;amortisation&lt;/i&gt;)&lt;/span&gt; is not a valuation: it is an &lt;b&gt;allocation&lt;/b&gt; of cost to the periods in which the asset generates benefits. The &lt;span class=&quot;term&quot;&gt;depreciable amount&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(the amount to be depreciated)&lt;/span&gt; is cost (or revalued amount) less &lt;span class=&quot;term&quot;&gt;residual value&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(the amount the entity would currently obtain from disposal of the asset if it were already of the age and in the condition expected at the end of its useful life)&lt;/span&gt;.&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;Depreciable amount = &lt;b&gt;Cost&lt;/b&gt; − &lt;b&gt;Residual value&lt;/b&gt; &amp;nbsp;&amp;nbsp;·&amp;nbsp;&amp;nbsp; Charge (straight-line) = Depreciable amount ÷ &lt;b&gt;Useful life&lt;/b&gt;&lt;/div&gt;

  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;By component&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Each part with a cost that is &lt;b&gt;significant&lt;/b&gt; in relation to the total is depreciated &lt;b&gt;separately&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;16.43&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Where it goes&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;To &lt;b&gt;profit or loss&lt;/b&gt;, unless it is included in the carrying amount of another asset (e.g. in the cost of inventories produced). &lt;span class=&quot;src&quot;&gt;16.48&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Annual review&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;Residual value, useful life &lt;b&gt;and method&lt;/b&gt; are reviewed &lt;b&gt;at least at each financial year-end&lt;/b&gt;; changes are accounted for as a &lt;span class=&quot;term&quot;&gt;change in accounting estimate&lt;/span&gt; &lt;span class=&quot;gloss&quot;&gt;(prospective effect only)&lt;/span&gt; under IAS 8. &lt;span class=&quot;src&quot;&gt;16.51, 16.61&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Note on IAS 8.&lt;/b&gt; The slides point out that the title of IAS 8, &lt;i&gt;Accounting Policies, Changes in Accounting Estimates and Errors&lt;/i&gt;, has been changed by IFRS 18 to &lt;b&gt;&lt;i&gt;Basis of Preparation of Financial Statements&lt;/i&gt;&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 49&lt;/span&gt;&lt;/div&gt;

  &lt;h3&gt;Useful life: two ways of measuring it&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Period&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;The &lt;b&gt;period&lt;/b&gt; over which the asset is expected to be available for use (e.g. 10 years).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Units produced&lt;/h4&gt;&lt;p style=&quot;margin:0&quot;&gt;The &lt;b&gt;number of production or similar units&lt;/b&gt; expected to be obtained (e.g. 500,000 pieces, 20,000 flight hours). &lt;span class=&quot;src&quot;&gt;IAS 16.6 · slide 53&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;To estimate it, all the following factors are considered, because benefits are consumed mainly through use, but also through obsolescence and &lt;i&gt;wear and tear&lt;/i&gt; while the asset remains &lt;i&gt;idle&lt;/i&gt;: &lt;span class=&quot;src&quot;&gt;IAS 16.56 · slide 51&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;a) Expected usage&lt;/summary&gt;&lt;div&gt;Assessed by reference to the asset&#x27;s expected capacity or physical output.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;b) Expected physical wear and tear&lt;/summary&gt;&lt;div&gt;Depends on the number of shifts for which the asset is used, the repair and maintenance programme, and the care and maintenance of the asset while idle.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;c) Technical or commercial obsolescence&lt;/summary&gt;&lt;div&gt;Arising from changes or improvements in production, or from a change in market demand for the output. Expected future reductions in the selling price of an item produced using the asset may indicate obsolescence, and hence a reduction of future economic benefits.&lt;/div&gt;&lt;/details&gt;
    &lt;details class=&quot;card&quot;&gt;&lt;summary&gt;d) Legal or similar limits&lt;/summary&gt;&lt;div&gt;For example, the expiry dates of related leases.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;

  &lt;h3&gt;When it starts and when it ends&lt;/h3&gt;
  &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 900 170&quot; role=&quot;img&quot; aria-label=&quot;Depreciation timeline&quot;&gt;
      &lt;line x1=&quot;30&quot; y1=&quot;80&quot; x2=&quot;870&quot; y2=&quot;80&quot; stroke=&quot;var(--rule)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;rect x=&quot;230&quot; y=&quot;70&quot; width=&quot;520&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;
      &lt;text x=&quot;490&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;depreciation in progress&lt;/text&gt;
      &lt;g font-size=&quot;12.5&quot;&gt;
        &lt;circle cx=&quot;70&quot; cy=&quot;80&quot; r=&quot;7&quot; fill=&quot;var(--ink2)&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot;&gt;acquisition&lt;/text&gt;
        &lt;circle cx=&quot;230&quot; cy=&quot;80&quot; r=&quot;8&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;230&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;START&lt;/text&gt;&lt;text x=&quot;230&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot;&gt;available for use&lt;/text&gt;&lt;text x=&quot;230&quot; y=&quot;134&quot; text-anchor=&quot;middle&quot; class=&quot;mut&quot; font-size=&quot;11.5&quot;&gt;location and condition ready&lt;/text&gt;
        &lt;rect x=&quot;430&quot; y=&quot;96&quot; width=&quot;120&quot; height=&quot;44&quot; rx=&quot;6&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;490&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot;&gt;asset idle:&lt;/text&gt;&lt;text x=&quot;490&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;600&quot;&gt;does NOT stop*&lt;/text&gt;
        &lt;circle cx=&quot;750&quot; cy=&quot;80&quot; r=&quot;8&quot; fill=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;750&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;END: the earlier of&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot;&gt;held for sale (IFRS 5)&lt;/text&gt;&lt;text x=&quot;750&quot; y=&quot;134&quot; text-anchor=&quot;middle&quot;&gt;or derecognition&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;* Depreciation does not cease when the asset becomes idle or is retired from active use, unless the asset is fully depreciated. However, under usage methods (units of production), the depreciation charge can be zero while there is no production. &lt;span class=&quot;src&quot;&gt;IAS 16.55 · slide 50&lt;/span&gt;&lt;/figcaption&gt;
  &lt;/figure&gt;

  &lt;h3&gt;The method&lt;/h3&gt;
  &lt;p&gt;The method must reflect &lt;b&gt;the pattern in which the asset&#x27;s future economic benefits are expected to be consumed&lt;/b&gt; by the entity (IAS 16.60). &lt;b&gt;A depreciation method based on revenue&lt;/b&gt; generated by an activity that includes the use of an asset &lt;b&gt;is not appropriate&lt;/b&gt;: revenue reflects other factors (other inputs and processes, selling activities, changes in sales volumes and prices, inflation) that say nothing about the consumption of the asset. &lt;span class=&quot;src&quot;&gt;IAS 16.62A · slide 52&lt;/span&gt;&lt;/p&gt;
  &lt;p&gt;&lt;span class=&quot;ext&quot;&gt;external source&lt;/span&gt; IAS 16.62 lists as examples of methods the &lt;b&gt;straight-line&lt;/b&gt; method, the &lt;b&gt;diminishing balance&lt;/b&gt; method and the &lt;b&gt;units of production&lt;/b&gt; method. The slides do not list them; they are used in the chart below. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-16-property-plant-and-equipment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation – IAS 16&lt;/a&gt;&lt;/p&gt;

  &lt;div class=&quot;tile&quot; id=&quot;dep&quot;&gt;
    &lt;div class=&quot;tabs&quot; id=&quot;dep-tabs&quot; style=&quot;margin-top:0&quot;&gt;
      &lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Straight-line&lt;/button&gt;&lt;button&gt;Diminishing balance&lt;/button&gt;&lt;button&gt;Units of production&lt;/button&gt;&lt;/div&gt;
