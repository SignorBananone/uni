&lt;polyline points=&quot;40,118 300,110 340,80 560,52 730,40&quot; fill=&quot;none&quot; style=&quot;stroke:var(--acc);stroke-width:3&quot;/&gt;
&lt;text x=&quot;600&quot; y=&quot;34&quot; font-size=&quot;12&quot;&gt;loss recognised&lt;/text&gt;
&lt;text x=&quot;150&quot; y=&quot;100&quot; font-size=&quot;12&quot; style=&quot;fill:var(--acc)&quot;&gt;expected loss: gradual provisioning&lt;/text&gt;
&lt;text x=&quot;330&quot; y=&quot;122&quot; font-size=&quot;12&quot; class=&quot;lbl&quot;&gt;incurred loss: nothing until the trigger event&lt;/text&gt;
&lt;/svg&gt;

&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Loss allowance&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[5.5.1]&lt;/span&gt;&lt;br&gt;An allowance for &lt;span class=&quot;term&quot;&gt;expected credit losses (ECL)&lt;/span&gt; to be recognised on financial assets at AC and at FVOCI (debt), lease receivables, &lt;em&gt;contract assets&lt;/em&gt;, loan commitments and financial guarantee contracts.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Objective&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[5.5.4; 5.5.8]&lt;/span&gt;&lt;br&gt;To recognise &lt;b&gt;lifetime&lt;/b&gt; ECL for all instruments for which there has been a &lt;b&gt;significant increase in credit risk&lt;/b&gt; since initial recognition, assessed on an individual or collective basis, using reasonable and supportable information, including &lt;em&gt;forward-looking&lt;/em&gt; information. Changes in the allowance go to &lt;b&gt;P&amp;amp;L&lt;/b&gt; as an impairment gain or loss.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;More discretion, more transparency&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Earlier recognition increases preparers&#x27; &lt;b&gt;discretion&lt;/b&gt;: for this reason IFRS 9 (together with IFRS 7) requires &lt;b&gt;quantitative and qualitative&lt;/b&gt; disclosures in the notes on the estimates of future losses and cash flow projections.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;A single model&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;IAS 39 had &lt;b&gt;several&lt;/b&gt; estimation &lt;b&gt;models&lt;/b&gt; depending on the category; IFRS 9 introduces a &lt;b&gt;single approach&lt;/b&gt; for all financial assets subject to impairment.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The logical sequence&lt;/h3&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;&lt;b&gt;Write-off?&lt;/b&gt; If there are no reasonable expectations of recovering the asset (or part of it), the gross carrying amount is &lt;b&gt;reduced directly&lt;/b&gt;: a write-off is a &lt;b&gt;derecognition&lt;/b&gt; event [5.4.4].&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Has credit risk increased significantly?&lt;/b&gt; At each reporting date the entity compares the &lt;b&gt;risk of a default&lt;/b&gt; occurring over the expected life at the reporting date with that at initial recognition, using information available &lt;em&gt;without undue cost or effort&lt;/em&gt; [5.5.9]. It is the change in the risk of default that matters, not the change in the amount of expected losses. &lt;b&gt;No precise threshold&lt;/b&gt; is set: the entity chooses it based on its instruments and internal risk management systems.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;No → 12-month ECL&lt;/b&gt; [5.5.5]: the allowance equals the expected losses from default events possible within the next &lt;b&gt;12 months&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Yes → lifetime ECL&lt;/b&gt; [5.5.3]: the allowance equals the expected losses over the &lt;b&gt;entire life&lt;/b&gt; of the instrument.&lt;/li&gt;
&lt;/ol&gt;
&lt;div class=&quot;note&quot;&gt;In practice this framework is called the &lt;b&gt;three-stage model&lt;/b&gt; (a term not used in the slides, but found in BNP Paribas&#x27;s financial statements): &lt;b&gt;stage 1&lt;/b&gt; = performing, 12-month ECL; &lt;b&gt;stage 2&lt;/b&gt; = significant increase in credit risk, lifetime ECL; &lt;b&gt;stage 3&lt;/b&gt; = &lt;em&gt;credit-impaired&lt;/em&gt;, lifetime ECL and interest calculated on the net carrying amount (IFRS 9 – 5.4.1(b)). IFRS 9 also provides a rebuttable presumption of a significant increase when payments are more than &lt;b&gt;30 days past due&lt;/b&gt; (5.5.11).&lt;/div&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Expected credit losses&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[App. A; 5.5.17]&lt;/span&gt;&lt;br&gt;The &lt;b&gt;weighted average of credit losses&lt;/b&gt;, with the respective risks of default as weights. The measurement must reflect: an &lt;b&gt;unbiased and probability-weighted&lt;/b&gt; amount (across a range of possible outcomes); the &lt;b&gt;time value of money&lt;/b&gt;; reasonable and supportable information about past events, &lt;b&gt;current conditions and forecasts&lt;/b&gt; of economic conditions. Discounting uses the &lt;b&gt;EIR&lt;/b&gt; determined at initial recognition.&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;In banking practice (supplement), ECL is calculated as discounted &lt;b&gt;PD × LGD × EAD&lt;/b&gt;: &lt;em&gt;probability of default&lt;/em&gt;, &lt;em&gt;loss given default&lt;/em&gt; (the share lost in the event of default), &lt;em&gt;exposure at default&lt;/em&gt; (the exposure at the time of default).&lt;/p&gt;

&lt;div class=&quot;widget&quot; id=&quot;ecl&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Slider simulator · simplified model for teaching purposes&lt;/div&gt;
&lt;h4&gt;How large is the allowance? It depends on the stage&lt;/h4&gt;
&lt;label class=&quot;rng&quot;&gt;Exposure (EAD, €)&lt;input type=&quot;range&quot; min=&quot;10000&quot; max=&quot;500000&quot; step=&quot;10000&quot; value=&quot;100000&quot; data-k=&quot;ead&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;LGD&lt;input type=&quot;range&quot; min=&quot;10&quot; max=&quot;90&quot; step=&quot;5&quot; value=&quot;45&quot; data-k=&quot;lgd&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Annual PD at initial recognition&lt;input type=&quot;range&quot; min=&quot;0.2&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;1&quot; data-k=&quot;p0&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Annual PD today&lt;input type=&quot;range&quot; min=&quot;0.2&quot; max=&quot;30&quot; step=&quot;0.1&quot; value=&quot;1.5&quot; data-k=&quot;p1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Remaining life (years)&lt;input type=&quot;range&quot; min=&quot;1&quot; max=&quot;10&quot; step=&quot;1&quot; value=&quot;5&quot; data-k=&quot;n&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;“Significant increase” threshold chosen by the entity (× initial PD)&lt;input type=&quot;range&quot; min=&quot;1.5&quot; max=&quot;4&quot; step=&quot;0.1&quot; value=&quot;2&quot; data-k=&quot;th&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;p class=&quot;small&quot;&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-imp&gt; A &lt;em&gt;credit-impairment&lt;/em&gt; event has occurred (e.g. default, significant financial difficulty)&lt;/label&gt;&lt;/p&gt;
&lt;div class=&quot;kpi&quot;&gt;&lt;div&gt;&lt;span&gt;Stage&lt;/span&gt;&lt;b data-st&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;12-month ECL&lt;/span&gt;&lt;b data-e12&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Lifetime ECL&lt;/span&gt;&lt;b data-elt&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Allowance to recognise&lt;/span&gt;&lt;b data-fd&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 640 120&quot; data-bars aria-label=&quot;Comparison between 12-month and lifetime ECL&quot;&gt;&lt;/svg&gt;
&lt;p class=&quot;small muted&quot;&gt;Discount EIR 5%; PD constant over the years; constant EAD. Lifetime ECL = Σ marginal PD&lt;sub&gt;t&lt;/sub&gt; × LGD × EAD / (1+EIR)&lt;sup&gt;t&lt;/sup&gt;. With an impairment event, PD is set to 100%.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Credit-impaired financial asset &lt;span class=&quot;ref&quot;&gt;[App. A]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;An asset is &lt;span class=&quot;term&quot;&gt;credit-impaired&lt;/span&gt; when &lt;b&gt;one or more events&lt;/b&gt; that have a detrimental impact on the estimated future cash flows have occurred. Observable evidence:&lt;/p&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;card small&quot;&gt;1 · &lt;b&gt;Significant financial difficulty&lt;/b&gt; of the issuer or the borrower&lt;/div&gt;
&lt;div class=&quot;card small&quot;&gt;2 · A &lt;b&gt;breach of contract&lt;/b&gt;, such as a default or past-due event&lt;/div&gt;
&lt;div class=&quot;card small&quot;&gt;3 · &lt;b&gt;Concessions&lt;/b&gt; granted by the lender for reasons relating to the borrower&#x27;s financial difficulty that it would not otherwise consider (&lt;em&gt;forbearance&lt;/em&gt;)&lt;/div&gt;
&lt;div class=&quot;card small&quot;&gt;4 · It becomes probable that the borrower will enter &lt;b&gt;bankruptcy&lt;/b&gt; or other financial reorganisation&lt;/div&gt;
&lt;div class=&quot;card small&quot;&gt;5 · The &lt;b&gt;disappearance of an active market&lt;/b&gt; for the asset because of financial difficulties&lt;/div&gt;
&lt;div class=&quot;card small&quot;&gt;6 · Purchase or origination at a &lt;b&gt;deep discount&lt;/b&gt; that reflects incurred credit losses&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;It may not be possible to identify a single event: impairment may be caused by the &lt;b&gt;combined effect&lt;/b&gt; of several events.&lt;/p&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;POCI – purchased or originated credit-impaired &lt;span class=&quot;ref&quot;&gt;[5.5.13-5.5.14]&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;For assets already credit-impaired at purchase/origination (e.g. a portfolio of non-performing loans bought at a discount), only the &lt;b&gt;cumulative changes&lt;/b&gt; in lifetime ECL since initial recognition are recognised as an allowance. At each reporting date the change goes to P&amp;amp;L as an impairment gain or loss; an improvement is an &lt;b&gt;impairment gain&lt;/b&gt; even if ECL fall below those included in the estimated cash flows at origination.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Impairment&lt;/h3&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;1. On initial recognition of a performing mortgage, what allowance is recognised?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;None: there is no loss yet&lt;/button&gt;&lt;button data-ok&gt;12-month ECL&lt;/button&gt;&lt;button&gt;Lifetime ECL&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;This is the real novelty compared with incurred loss: even a sound loan has expected losses (5.5.5).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;2. To determine whether there has been a significant increase in credit risk, one compares…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;the amount of ECL today and at initial recognition&lt;/button&gt;&lt;button data-ok&gt;the risk of default over the expected life today and at initial recognition&lt;/button&gt;&lt;button&gt;the current rating against the threshold set by IFRS 9&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;5.5.9: the change in the risk of default is used, not the change in ECL; IFRS 9 does not set a numerical threshold.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;3. A write-off is…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;an increase in the loss allowance&lt;/button&gt;&lt;button data-ok&gt;a derecognition event (in full or in part)&lt;/button&gt;&lt;button&gt;a reclassification to FVTPL&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;IFRS 9 – 5.4.4.&lt;/p&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Open question: why should the expected loss model reduce procyclicality?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because losses are provisioned gradually, based on forecasts, before the crisis hits, instead of being concentrated at the worst point of the cycle. The flip side: forward-looking forecasts are discretionary and, if they deteriorate abruptly (mass transfers to stage 2), they can still amplify the effects.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 7 HEDGE ============ --&gt;
&lt;section id=&quot;s-hedge&quot; class=&quot;part sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Part 7&lt;/div&gt;&lt;h2&gt;Hedge accounting &lt;span class=&quot;ref&quot;&gt;[IFRS 9 – 6.1-6.5.16]&lt;/span&gt;&lt;/h2&gt;&lt;/header&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Objective&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[6.1.1]&lt;/span&gt;&lt;br&gt;To represent in the financial statements the &lt;b&gt;effect of an entity&#x27;s risk management activities&lt;/b&gt; that use financial instruments to manage exposures arising from particular risks that could affect P&amp;amp;L (or OCI, for equity investments under the OCI option), conveying the &lt;b&gt;purpose and effect&lt;/b&gt; of hedging instruments.&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;Why is special accounting needed? Without hedge accounting, the hedging derivative is at FVTPL while the hedged item may be at amortised cost or not yet on the balance sheet (a forecast transaction): profit or loss would show volatility that does not exist economically. Hedge accounting “aligns the timing” of the two effects.&lt;/div&gt;

&lt;h3&gt;What can hedge and what can be hedged&lt;/h3&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Hedging instruments &lt;span class=&quot;ref&quot;&gt;[6.2.1-6.2.2]&lt;/span&gt;&lt;/h4&gt;&lt;ul class=&quot;small&quot;&gt;
&lt;li&gt;A &lt;b&gt;derivative at FVTPL&lt;/b&gt;, except for some &lt;b&gt;written options&lt;/b&gt;: these qualify only if they offset a purchased option, including one embedded in another instrument (e.g. a written call hedging a callable liability) [B6.2.4].&lt;/li&gt;
&lt;li&gt;A &lt;b&gt;non-derivative financial asset or liability at FVTPL&lt;/b&gt;, except liabilities designated at FVTPL with own credit risk presented in OCI.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Hedged items &lt;span class=&quot;ref&quot;&gt;[6.3.1]&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;IFRS 9 has &lt;b&gt;broadened&lt;/b&gt; the eligible hedged items: a &lt;b&gt;recognised&lt;/b&gt; asset or liability, an &lt;b&gt;unrecognised firm commitment&lt;/b&gt;, a &lt;b&gt;highly probable forecast transaction&lt;/b&gt; or a &lt;b&gt;net investment in a foreign operation&lt;/b&gt;. It may be a &lt;b&gt;single item&lt;/b&gt;, a &lt;b&gt;group&lt;/b&gt; or a &lt;b&gt;component&lt;/b&gt; of these (e.g. only the foreign exchange risk of a purchase).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;The slides also note that the hybrid instrument is &lt;b&gt;measured in its entirety&lt;/b&gt; (amortised cost or fair value), whereas IAS 39 separated the host and the embedded derivative. &lt;span class=&quot;muted&quot;&gt;Clarification (supplement): this applies when the host is a financial asset within IFRS 9 (4.3.2); if the host is a liability or a non-financial contract, separation remains possible under the conditions of 4.3.3.&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Qualifying criteria &lt;span class=&quot;ref&quot;&gt;[6.4.1]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;A hedging relationship qualifies &lt;b&gt;only if all&lt;/b&gt; the criteria are met:&lt;/p&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;&lt;b&gt;Only eligible instruments and items&lt;/b&gt; (eligible hedging instruments and hedged items).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Formal designation and documentation at inception&lt;/b&gt; of the relationship and of the risk management objective and strategy: identification of the instrument, the hedged item, the nature of the risk, and how effectiveness will be assessed (including sources of ineffectiveness and how the &lt;span class=&quot;term&quot;&gt;hedge ratio&lt;/span&gt; — the ratio between the quantity of the hedged item and the quantity of the instrument — is determined).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Effectiveness requirements&lt;/b&gt; (changes in the fair value or cash flows of the instrument offset those of the hedged item):
&lt;ul&gt;&lt;li&gt;there is an &lt;b&gt;economic relationship&lt;/b&gt; between the hedged item and the instrument: their values move in &lt;b&gt;opposite directions&lt;/b&gt; in response to the hedged risk (as the Italian accounting standard OIC 32 also specifies);&lt;/li&gt;
&lt;li&gt;the effect of &lt;b&gt;credit risk does not dominate&lt;/b&gt; the value changes;&lt;/li&gt;
&lt;li&gt;the &lt;b&gt;hedge ratio&lt;/b&gt; is the one actually used for risk management purposes (an imperfect hedge is permitted if external conditions require it).&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;When effectiveness is assessed &lt;span class=&quot;ref&quot;&gt;[B6.4.12]&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;At inception and on an ongoing basis: &lt;b&gt;at least at each reporting date&lt;/b&gt; or upon a significant change in circumstances, whichever comes first. The assessment is only &lt;b&gt;prospective&lt;/b&gt; (forward-looking).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Farewell to 80-125%&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;IAS 39 considered a hedge effective only if the change in the instrument was between &lt;b&gt;80% and 125%&lt;/b&gt; of that of the hedged item. &lt;b&gt;IFRS 9 sets no quantitative thresholds&lt;/b&gt;: more flexibility, but more care required from the entity in defining effectiveness.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The three types of relationship &lt;span class=&quot;ref&quot;&gt;[6.5.2]&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Fair value hedge&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Cash flow hedge&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Net investment hedge&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Definition [6.5.2(a)]:&lt;/b&gt; a hedge of the exposure to &lt;b&gt;changes in fair value&lt;/b&gt; of a recognised asset or liability, an unrecognised firm commitment, or a component thereof, that are attributable to a particular risk and could affect P&amp;amp;L.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Accounting (supplement, IFRS 9 – 6.5.8):&lt;/b&gt; the gain/loss on the instrument goes to &lt;b&gt;P&amp;amp;L&lt;/b&gt;; the carrying amount of the hedged item is adjusted for the change attributable to the hedged risk, also in P&amp;amp;L. The two effects offset and only the ineffectiveness remains in P&amp;amp;L.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;&lt;b&gt;Example:&lt;/b&gt; a company issues a fixed-rate bond and enters into an &lt;em&gt;interest rate swap&lt;/em&gt; (receive fixed, pay floating) to “convert” it to floating.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;&lt;b&gt;Special case [6.5.3]:&lt;/b&gt; if the hedged item is an equity investment under the OCI option, the hedged exposure must be one that could affect OCI, and only in that case does ineffectiveness go to OCI.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Definition [6.5.2(b)]:&lt;/b&gt; a hedge of the exposure to &lt;b&gt;variability in cash flows&lt;/b&gt; attributable to a particular risk associated with a recognised asset or liability (e.g. future interest on floating-rate debt) or a &lt;b&gt;highly probable forecast transaction&lt;/b&gt;, that could affect P&amp;amp;L.&lt;/p&gt;
&lt;table class=&quot;small&quot;&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Effective&lt;/b&gt; portion of the gain/loss on the instrument [6.5.11(b)]&lt;/td&gt;&lt;td&gt;→ &lt;b&gt;OCI&lt;/b&gt; (cash flow hedge reserve)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Remaining portion = &lt;b&gt;ineffectiveness&lt;/b&gt; [6.5.11(c)]&lt;/td&gt;&lt;td&gt;→ &lt;b&gt;Profit or loss&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p class=&quot;small&quot;&gt;&lt;b&gt;Example:&lt;/b&gt; a European company expects to pay 1 million dollars for raw materials in 6 months and buys dollars forward (&lt;em&gt;forward&lt;/em&gt;). The OCI reserve is reclassified when the hedged transaction affects P&amp;amp;L.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;A hedge of the &lt;b&gt;net investment in a foreign operation&lt;/b&gt; (also governed by &lt;b&gt;IAS 21&lt;/b&gt; and IFRIC 16): a parent holds investments in foreign entities that use a currency different from the presentation currency of the consolidated financial statements and hedges the foreign exchange risk (e.g. with borrowing in the subsidiary&#x27;s currency).&lt;/p&gt;
&lt;table class=&quot;small&quot;&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Effective&lt;/b&gt; portion [6.5.13(a)]&lt;/td&gt;&lt;td&gt;→ &lt;b&gt;OCI&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Ineffective&lt;/b&gt; portion [6.5.13(b)]&lt;/td&gt;&lt;td&gt;→ &lt;b&gt;Profit or loss&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;widget&quot; id=&quot;hdg&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Slider simulator&lt;/div&gt;
&lt;h4&gt;Where do the changes in value end up?&lt;/h4&gt;
&lt;div style=&quot;margin-bottom:.5rem&quot;&gt;&lt;button class=&quot;btn on&quot; data-ty=&quot;cfh&quot;&gt;Cash flow hedge&lt;/button&gt; &lt;button class=&quot;btn&quot; data-ty=&quot;fvh&quot;&gt;Fair value hedge&lt;/button&gt;&lt;/div&gt;
&lt;label class=&quot;rng&quot;&gt;Cumulative change in the hedging instrument (derivative)&lt;input type=&quot;range&quot; min=&quot;-200&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;110&quot; data-k=&quot;hi&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Cumulative change in the hedged item (hedged risk)&lt;input type=&quot;range&quot; min=&quot;-200&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;-100&quot; data-k=&quot;it&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;svg viewBox=&quot;0 0 640 150&quot; data-hb aria-label=&quot;Bars: instrument, hedged item, OCI, profit or loss&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;res small&quot; data-hr&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Rebalancing &lt;span class=&quot;ref&quot;&gt;[6.5.5; B6.5.7]&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;If the relationship no longer meets the hedge ratio requirement but the &lt;b&gt;risk management objective remains the same&lt;/b&gt;, the entity &lt;b&gt;adjusts the hedge ratio&lt;/b&gt; (the designated quantities of the hedged item or instrument) so that it qualifies again. Adjustments made for other purposes are not rebalancing.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Discontinuing &lt;span class=&quot;ref&quot;&gt;[6.5.6]&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Hedge accounting is discontinued &lt;b&gt;prospectively&lt;/b&gt; only when the relationship (or part of it) &lt;b&gt;ceases to meet the qualifying criteria&lt;/b&gt;, after any rebalancing: including when the instrument expires or is sold, terminated or exercised. Replacement or &lt;em&gt;rollover&lt;/em&gt; consistent with the documented objective does not count as expiration. Discontinuation may affect the whole relationship or only part of it. It cannot be discontinued voluntarily if the criteria are still met.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Hedge accounting&lt;/h3&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;1. In a cash flow hedge the instrument gains 120 and the hedged item loses 100. What goes to OCI?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;120&lt;/button&gt;&lt;button data-ok&gt;100 (and 20 to P&amp;amp;L as ineffectiveness)&lt;/button&gt;&lt;button&gt;20&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;The reserve is the lower of the two cumulative changes in absolute terms (6.5.11(a)): the excess (over-hedge) is ineffectiveness in P&amp;amp;L. Try it in the simulator.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;2. What quantitative effectiveness requirement does IFRS 9 impose?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;80-125%&lt;/button&gt;&lt;button&gt;90-110%&lt;/button&gt;&lt;button data-ok&gt;None&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;IFRS 9 abandoned the 80-125% band of IAS 39: an economic relationship, non-dominant credit risk and a consistent hedge ratio are required.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;3. A highly probable forecast transaction in a foreign currency is hedged with…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;a fair value hedge&lt;/button&gt;&lt;button data-ok&gt;a cash flow hedge&lt;/button&gt;&lt;button&gt;a net investment hedge&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;The risk concerns the variability of future cash flows (6.5.2(b)).&lt;/p&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Open question: what is the difference between rebalancing and discontinuing?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Rebalancing keeps the relationship alive by adjusting the quantities to restore the hedge ratio, when the risk management objective has not changed. Discontinuing ends the relationship (in whole or in part) because the criteria are no longer met, for example because the derivative has expired or been sold, or the objective has changed.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 8 BNP ============ --&gt;
&lt;section id=&quot;s-bnp&quot; class=&quot;part slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Part 8&lt;/div&gt;&lt;h2&gt;The BNP Paribas case · 2025 consolidated financial statements&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;The slides close with the notes to BNP Paribas&#x27;s consolidated financial statements at 31.12.2025 (&lt;em&gt;unaudited&lt;/em&gt; figures, in millions of euros). It is an example of &lt;b&gt;IFRS 7 disclosures&lt;/b&gt; applied to the IFRS 9 categories. Amounts in millions of euros.&lt;/p&gt;

&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;4.a FVTPL&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Trading derivatives&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;4.b Hedging derivatives&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;4.c FVOCI&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;div class=&quot;kpi&quot;&gt;&lt;div&gt;&lt;span&gt;FVTPL assets 2025&lt;/span&gt;&lt;b&gt;575,603&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;of which held for trading&lt;/span&gt;&lt;b&gt;560,973&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;FVTPL liabilities 2025&lt;/span&gt;&lt;b&gt;585,713&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;of which designated (FVO)&lt;/span&gt;&lt;b&gt;132,554&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;Assets and liabilities at FVTPL comprise &lt;b&gt;trading&lt;/b&gt; transactions (including derivatives), those &lt;b&gt;designated&lt;/b&gt; at FVTPL on issue, and non-trading instruments that cannot be held at AC or FVOCI. The &lt;b&gt;designated liabilities&lt;/b&gt; are mainly structured debt securities issued for customers with &lt;b&gt;significant embedded derivatives&lt;/b&gt;, managed together with the economic hedging derivatives: this is the fair value option used to avoid an accounting mismatch (Part 5). Redemption value: 134,398 (2024: 110,823).&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;The “other” FVTPL assets (14,630) are debt instruments that fail the business model or SPPI test and equity instruments for which the group has &lt;b&gt;not&lt;/b&gt; elected the “fair value through equity” option: exactly the logic of the classifier in Part 5.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;
&lt;div class=&quot;kpi&quot;&gt;&lt;div&gt;&lt;span&gt;Positive fair value 2025&lt;/span&gt;&lt;b&gt;274,625&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Negative fair value 2025&lt;/span&gt;&lt;b&gt;252,726&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Total notional 2025&lt;/span&gt;&lt;b&gt;38,474,824&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;Trading derivatives arise from &lt;em&gt;market making&lt;/em&gt; and arbitrage (“plain” credit default swaps and structured transactions for clients), with net positions subject to limits. Some derivatives economically hedge assets or liabilities but &lt;b&gt;without&lt;/b&gt; a documented relationship or without meeting the hedge accounting requirements: they therefore remain trading derivatives. The &lt;b&gt;notional amount&lt;/b&gt; (24,153,385 for interest rate derivatives alone) indicates the volume of activity, &lt;b&gt;not the risk&lt;/b&gt;: it is much larger than the fair value. In &lt;em&gt;client clearing&lt;/em&gt;, the group guarantees to central counterparties the default risk of its clients for a notional amount of €1,405 billion.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;
&lt;div style=&quot;margin:.4rem 0&quot;&gt;&lt;button class=&quot;btn on&quot; data-y=&quot;2025&quot;&gt;2025&lt;/button&gt; &lt;button class=&quot;btn&quot; data-y=&quot;2024&quot;&gt;2024&lt;/button&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 640 170&quot; id=&quot;bnpch&quot; aria-label=&quot;Notional amounts of hedging derivatives by type of relationship&quot;&gt;&lt;/svg&gt;
&lt;p class=&quot;small&quot;&gt;&lt;b&gt;Fair value hedges&lt;/b&gt; dominate (mainly interest rate derivatives hedging securities, deposits and portfolios). In 2025 the group also has 1,340/2,375 of positive/negative fair value on cash flow hedge derivatives; changes recognised directly in equity for CFHs amount to &lt;b&gt;372&lt;/b&gt; (2024: 48). For discontinued fair value hedging relationships, the remeasurement adjustments still to be amortised over the remaining life of the hedged items are 831 on the asset side and −77 on the liability side (portfolios) and 93 (identified instruments).&lt;/p&gt;
&lt;p class=&quot;small muted&quot;&gt;Maturities of FVH notionals 2025: &amp;lt;1 year 300,017 · 1-5 years 491,093 · &amp;gt;5 years 344,242.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table class=&quot;small&quot;&gt;&lt;tr&gt;&lt;th&gt;FVOCI&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;FV 2025&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;of which in equity&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;FV 2024&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;of which in equity&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Debt securities&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;77,940&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(327)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;71,430&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(1,285)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Equity securities&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,420&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;374&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,610&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;489&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Total&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;79,360&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;47&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;73,040&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;(796)&lt;/th&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;Links to the theory: 6 million of FVOCI debt securities are in &lt;b&gt;stage 3&lt;/b&gt;, and the related impairment (3 million) was charged to profit or loss against the negative equity reserve. The OCI option for &lt;b&gt;equity instruments&lt;/b&gt; is used for strategic investments and shares held as an operational requirement; on sale, the net gain of 36 million was transferred to &lt;b&gt;retained earnings&lt;/b&gt;, not to profit or loss (no recycling).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Reading the financial statements&lt;/h3&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;1. Why does BNP Paribas transfer the gain on the sale of FVOCI equity instruments to “retained earnings” and not to P&amp;amp;L?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;As a matter of prudence&lt;/button&gt;&lt;button data-ok&gt;Because IFRS 9 prohibits recycling for equity instruments at FVOCI&lt;/button&gt;&lt;button&gt;Because they are treasury shares&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;IFRS 9 – 5.7.5 and B5.7.1: the amount in OCI is never reclassified to P&amp;amp;L; it may be transferred within equity.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;2. The notional amount of derivatives (38,474,824 million) measures…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;the maximum possible loss&lt;/button&gt;&lt;button data-ok&gt;the volume of activity, not market risk&lt;/button&gt;&lt;button&gt;the net fair value&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;The note itself says so: notional amounts indicate volume, not market risks.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ FONTI ============ --&gt;
&lt;section id=&quot;s-fonti&quot; class=&quot;part ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Further reading&lt;/div&gt;&lt;h2&gt;Authors, texts, standards and websites cited in the slides&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;Each entry was looked up on the web: the descriptions are an &lt;b&gt;external source&lt;/b&gt;, distinct from the content of the slides, with a link to the source. Verified in November 2026.&lt;/p&gt;
&lt;div class=&quot;note course&quot;&gt;This summary was meant to link this lecture to the other files in the &lt;em&gt;corso/&lt;/em&gt; folder. The available reading tool cannot list folders, so the other materials were not consulted: the cross-references to other standards (IFRS 10, IAS 27, IAS 28, IFRS 16, IAS 19, IFRS 2, IFRS 3, IAS 37, IFRS 15, IFRS 17, IAS 21, IAS 7, IAS 1/IFRS 18) come from the slides themselves.&lt;/div&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;External source · IFRS Foundation&lt;/div&gt;&lt;h4&gt;IAS 32 &lt;em&gt;Financial Instruments: Presentation&lt;/em&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Official page of the standard. Originally issued in 1995 as &lt;em&gt;Disclosure and Presentation&lt;/em&gt;; it now deals with presentation, while recognition/measurement and disclosure are in IFRS 9 and IFRS 7. It is the reference for the debt/equity distinction.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://ifrs.org/issued-standards/list-of-standards/ias-32-financial-instruments-presentation&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IAS 32&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;External source · IFRS Foundation&lt;/div&gt;&lt;h4&gt;IFRS 9 &lt;em&gt;Financial Instruments&lt;/em&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Official page, with the text and amendments. Effective for annual periods beginning on or after 1 January 2018. It is the primary source of all the paragraphs cited in Parts 3-7.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-9-financial-instruments/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IFRS 9&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;External source · IFRS Foundation / Deloitte IAS Plus&lt;/div&gt;&lt;h4&gt;IFRS 7 &lt;em&gt;Financial Instruments: Disclosures&lt;/em&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Issued in August 2005, effective from 2007: it requires disclosures on the significance of financial instruments and on the nature and extent of the risks (credit, liquidity, market). It took over the disclosures previously contained in IAS 32. Relevant for reading notes such as those of BNP Paribas.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-7-financial-instruments-disclosures/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IFRS 7&lt;/a&gt; · &lt;a class=&quot;small&quot; href=&quot;https://www.iasplus.com/en/standards/ifrs/ifrs7&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – summary&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;External source · Deloitte IAS Plus&lt;/div&gt;&lt;h4&gt;IAS 39 &lt;em&gt;Recognition and Measurement&lt;/em&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Summary and history of the standard (1998, reissued in 2004), noting that IFRS 9 has replaced its classification, measurement, impairment, hedge accounting and derecognition requirements. Useful for understanding the “before” from which Part 3 starts.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://www.iasplus.com/standard/ias39.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – IAS 39&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;External source · Deloitte IAS Plus&lt;/div&gt;&lt;h4&gt;IFRIC 2, 16, 17, 19&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Index of interpretations: IFRIC 16 (2008) on hedges of a net investment in a foreign operation; IFRIC 17 (effective from 1 July 2009) on non-cash distributions; IFRIC 19 (effective from 1 July 2010) on extinguishing liabilities with equity instruments; IFRIC 2 on members&#x27; shares in cooperatives.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://www.iasplus.com/en/standards/ifric&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – IFRIC Interpretations&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;External source · IFRS Foundation&lt;/div&gt;&lt;h4&gt;FICE project – Exposure Draft IASB/ED/2023/5&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Draft of 29 November 2023 (comments until 29 March 2024) amending IAS 32, IFRS 7 and IAS 1. In 2025-2026 the IASB continued its redeliberations (e.g. reclassification between liabilities and equity; measurement of obligations to purchase own equity instruments); no final standard had been issued as of the latest update found (September 2026).&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://ifrs.org/projects/work-plan/financial-instruments-with-characteristics-of-equity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – project page&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;External source · IFRS Foundation&lt;/div&gt;&lt;h4&gt;IFRS 18 &lt;em&gt;Presentation and Disclosure in Financial Statements&lt;/em&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Issued in April 2024, it replaces IAS 1 for annual periods beginning on or after &lt;b&gt;1 January 2027&lt;/b&gt; (earlier application permitted). It explains why the slides update the IAS 32.34 reference on treasury shares.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IFRS 18&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;External source · IFRS Foundation · EUR-Lex&lt;/div&gt;&lt;h4&gt;Interest Rate Benchmark Reform – Phase 2 and Reg. (EU) 2021/25&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;The IASB issued the amendments on 27 August 2020 (IFRS 9, IAS 39, IFRS 7, IFRS 4, IFRS 16), effective from 2021; Regulation (EU) 2021/25 of 13 January 2021 endorsed them in the EU. Legal basis for paragraphs 5.4.5-5.4.9.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://www.ifrs.org/news-and-events/news/2020/08/iasb-to-issue-interest-rate-benchmark-reform-phase-2/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – announcement&lt;/a&gt; · &lt;a class=&quot;small&quot; href=&quot;https://eur-lex.europa.eu/eli/reg/2021/25/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex – Reg. 2021/25&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;External source · IFRS Foundation&lt;/div&gt;&lt;h4&gt;Amendments to IFRS 9 and IFRS 7 (May 2024)&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Not cited in the slides but useful: issued on 30 May 2024, effective from 1 January 2026. They clarify the SPPI test for cash flows linked to ESG targets and other contingent features, the derecognition of liabilities settled through electronic payment systems, and new disclosures on equity instruments at FVOCI.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://www.ifrs.org/content/ifrs/home/news-and-events/news/2024/05/iasb-issues-amendments-cmfi-ifrs7-ifrs9.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – announcement&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;External source · IFRS Foundation&lt;/div&gt;&lt;h4&gt;IAS 21 &lt;em&gt;The Effects of Changes in Foreign Exchange Rates&lt;/em&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Defines the net investment in a foreign operation (the entity&#x27;s interest in the net assets of that operation) referred to by the net investment hedge; IAS 21 does not deal with hedge accounting, which it refers to IFRS 9/IAS 39 and IFRIC 16.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://ifrs.org/content/dam/ifrs/publications/html-standards/english/2024/issued/ias21.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IAS 21 text&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;External source · OIC Foundation&lt;/div&gt;&lt;h4&gt;OIC 32 &lt;em&gt;Strumenti finanziari derivati&lt;/em&gt; (Derivative financial instruments)&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;The “Italian accounting standard” referred to in the slides on the economic relationship in hedging. Issued in 2016, amended in 2017-2018 and subject to a &lt;em&gt;post-implementation review&lt;/em&gt;; on 1 April 2026 the OIC put new amendments out for consultation.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://fondazioneoic.eu/wp-content/uploads/2019/01/2022-05-OIC-32-Strumenti-finanziari-derivati.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fondazioneoic.eu – OIC 32 (PDF)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;External source · library catalogue&lt;/div&gt;&lt;h4&gt;D. Alexander, S. Archer – &lt;em&gt;International Accounting/Financial Reporting Standards Guide&lt;/em&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;A practical IFRS handbook published by CCH (Wolters Kluwer group), with annual editions; the slides reuse its trade date/settlement date example (2017 ed.). The link is to a catalogue record: no publisher page was found.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://search.library.uitm.edu.my/Record/wils-548113/Description&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;catalogue record&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;External source · BNP Paribas Investor Relations&lt;/div&gt;&lt;h4&gt;BNP Paribas – Consolidated financial statements 2025&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Consolidated financial statements at 31.12.2025 (&lt;em&gt;unaudited&lt;/em&gt; version, approved by the Board of Directors on 4 February 2026), from which the tables in Part 8 are taken; the audited version is in the 2025 Universal Registration Document.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://invest.bnpparibas/en/document/4q25-cfsu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;invest.bnpparibas – document&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;External source · IFRS Foundation&lt;/div&gt;&lt;h4&gt;The other standards referred to&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;IFRS 10, IAS 27, IAS 28, IAS 19, IFRS 2, IFRS 3, IFRS 15, IFRS 16, IFRS 17, IAS 37, IAS 7: they appear in the slides as scope exclusions. Their text is in the official index of issued standards (free access with registration).&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – list of standards&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Summary written by Claude from the slides: always check against the material.&lt;/div&gt;&lt;/footer&gt;
