&lt;a href=&quot;#s-ias32&quot;&gt;&lt;rect class=&quot;n-box&quot; x=&quot;15&quot; y=&quot;352&quot; width=&quot;150&quot; height=&quot;68&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;380&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Debt vs equity&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;398&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;definitions, fixed-for-fixed&lt;/text&gt;&lt;/a&gt;

&lt;a href=&quot;#s-rilevazione&quot;&gt;&lt;rect class=&quot;n-box&quot; x=&quot;335&quot; y=&quot;352&quot; width=&quot;150&quot; height=&quot;68&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;410&quot; y=&quot;378&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Recognition &amp;amp;&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;394&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;derecognition&lt;/text&gt;&lt;text x=&quot;410&quot; y=&quot;411&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;trade/settlement date&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s-classificazione&quot;&gt;&lt;rect class=&quot;n-box&quot; x=&quot;495&quot; y=&quot;352&quot; width=&quot;150&quot; height=&quot;68&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;378&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Classification &amp;amp;&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;394&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;measurement&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;411&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;AC · FVOCI · FVTPL&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#s-impairment&quot;&gt;&lt;rect class=&quot;n-box&quot; x=&quot;655&quot; y=&quot;352&quot; width=&quot;150&quot; height=&quot;68&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;730&quot; y=&quot;382&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Impairment&lt;/text&gt;&lt;text x=&quot;730&quot; y=&quot;400&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;expected credit loss&lt;/text&gt;&lt;/a&gt;

&lt;!-- ============ 1 QUADRO ============ --&gt;
&lt;section id=&quot;s-quadro&quot; class=&quot;part slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Part 1&lt;/div&gt;&lt;h2&gt;The regulatory framework&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Financial instruments&lt;/span&gt; (receivables, debt securities, shares, payables, derivatives…) are governed by several standards that divide the work between them. The lecture considers four:&lt;/p&gt;
&lt;div class=&quot;grid g4&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;IAS 32&lt;/span&gt;&lt;h4&gt;Presentation&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;How to &lt;b&gt;present&lt;/b&gt; an instrument: liability or equity? When should assets and liabilities be offset? Where do interest and dividends go?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;IFRS 9&lt;/span&gt;&lt;h4&gt;Financial Instruments&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;When to &lt;b&gt;recognise&lt;/b&gt; and derecognise, how to &lt;b&gt;classify and measure&lt;/b&gt;, how to calculate &lt;b&gt;impairment&lt;/b&gt; and how to apply &lt;b&gt;hedge accounting&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;IFRS 7&lt;/span&gt;&lt;h4&gt;Disclosures&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;What &lt;b&gt;information to disclose in the notes&lt;/b&gt; about the significance of instruments and the related risks (credit, liquidity, market).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;IAS 39&lt;/span&gt;&lt;h4&gt;Recognition &amp;amp; Measurement&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;The predecessor of IFRS 9, which &lt;b&gt;almost entirely superseded it from 1 January 2018&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Related IFRIC Interpretations (cited in the slides)&lt;/summary&gt;&lt;div&gt;
&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;term&quot;&gt;IFRIC Interpretations&lt;/span&gt; are documents issued by the IFRS Interpretations Committee that clarify specific application issues.&lt;/p&gt;
&lt;ul class=&quot;small&quot;&gt;
&lt;li&gt;&lt;b&gt;IFRIC 2&lt;/b&gt; – &lt;em&gt;Members&#x27; Shares in Cooperative Entities and Similar Instruments&lt;/em&gt;: when members&#x27; shares in a cooperative are equity and when they are liabilities (redeemable on demand).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;IFRIC 16&lt;/b&gt; – &lt;em&gt;Hedges of a Net Investment in a Foreign Operation&lt;/em&gt;: hedging the net investment in a foreign operation (see Part 7).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;IFRIC 17&lt;/b&gt; – &lt;em&gt;Distributions of Non-cash Assets to Owners&lt;/em&gt;: dividends paid in assets other than cash.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;IFRIC 19&lt;/b&gt; – &lt;em&gt;Extinguishing Financial Liabilities with Equity Instruments&lt;/em&gt;: extinguishing a liability by issuing shares (&lt;em&gt;debt-for-equity swap&lt;/em&gt;).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;note&quot;&gt;A useful rule: &lt;b&gt;IAS 32 looks at the instrument from the issuer&#x27;s side&lt;/b&gt; (is it my liability or a share of my equity?), &lt;b&gt;IFRS 9 from the side of the holder or the obligor&lt;/b&gt; (how do I measure it over time?). The slides stress that “all financial instruments within IFRS 9 fall within the scope of IAS 32”.&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 2 IAS 32 ============ --&gt;
&lt;section id=&quot;s-ias32&quot; class=&quot;part slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Part 2&lt;/div&gt;&lt;h2&gt;IAS 32 – &lt;em&gt;Financial Instruments: Presentation&lt;/em&gt;&lt;/h2&gt;&lt;/header&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Objective&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[IAS 32.2]&lt;/span&gt;&lt;br&gt;To establish principles for presenting financial instruments as &lt;b&gt;liabilities or equity&lt;/b&gt; and for &lt;b&gt;offsetting&lt;/b&gt; financial assets and financial liabilities. It applies, &lt;em&gt;from the perspective of the issuer&lt;/em&gt;, to the classification into financial assets, financial liabilities and equity instruments; to the classification of related interest, dividends, losses and gains; and to the circumstances in which offsetting is permitted.&lt;/div&gt;

&lt;h3&gt;Scope: everything, except…&lt;/h3&gt;
&lt;p&gt;IAS 32 is applied by &lt;b&gt;all entities to all types of financial instruments&lt;/b&gt;, subject to the exclusions (paras 4-10), which refer to other standards. Browse the tabs:&lt;/p&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Investments&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Employee benefits&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Insurance contracts&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Share-based payment&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;Interests in &lt;b&gt;subsidiaries, associates and joint ventures&lt;/b&gt; accounted for under &lt;b&gt;IFRS 10&lt;/b&gt; (consolidated statements), &lt;b&gt;IAS 27&lt;/b&gt; (separate financial statements) or &lt;b&gt;IAS 28&lt;/b&gt; (associates and JVs). Exception to the exception: where those standards require or permit the use of IFRS 9, IAS 32 also applies; and IAS 32 always applies to &lt;b&gt;derivatives&lt;/b&gt; linked to such interests.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Employers&#x27; rights and obligations under &lt;b&gt;employee benefit plans&lt;/b&gt;, governed by &lt;b&gt;IAS 19&lt;/b&gt; &lt;em&gt;Employee Benefits&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Insurance contracts&lt;/b&gt; as defined in &lt;b&gt;IFRS 17&lt;/b&gt; (and investment contracts with &lt;em&gt;discretionary participation features&lt;/em&gt;). However, IAS 32 applies to: embedded derivatives that must be separated under IFRS 9; distinct investment components; financial guarantee contracts if the issuer applies IFRS 9; credit cards and similar arrangements falling within IFRS 9 [IFRS 17.7(h)]; contracts that limit compensation to the amount owed, if the entity elects to apply IFRS 9 [IFRS 17.8A].&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Financial instruments, contracts and obligations under &lt;b&gt;share-based payment&lt;/b&gt; transactions, governed by &lt;b&gt;IFRS 2&lt;/b&gt; &lt;em&gt;Share-based Payment&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Key definitions &lt;span class=&quot;ref&quot;&gt;[IAS 32.11]&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Financial instrument&lt;/b&gt;&lt;br&gt;Any &lt;b&gt;contract&lt;/b&gt; that gives rise to a &lt;b&gt;financial asset of one entity&lt;/b&gt; and, symmetrically, a &lt;b&gt;financial liability or equity instrument of another entity&lt;/b&gt;.&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 760 150&quot; role=&quot;img&quot; aria-label=&quot;Diagram: a contract gives rise to a financial asset on one side and a liability or equity on the other&quot;&gt;
&lt;rect class=&quot;n-acc&quot; x=&quot;290&quot; y=&quot;8&quot; width=&quot;180&quot; height=&quot;40&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;33&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Contract&lt;/text&gt;
&lt;path class=&quot;edge&quot; d=&quot;M330 48 L140 92&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;edge&quot; d=&quot;M430 48 L620 92&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect class=&quot;n-box&quot; x=&quot;30&quot; y=&quot;94&quot; width=&quot;220&quot; height=&quot;48&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Entity A&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;133&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;financial asset&lt;/text&gt;
&lt;rect class=&quot;n-box&quot; x=&quot;510&quot; y=&quot;94&quot; width=&quot;220&quot; height=&quot;48&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;620&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Entity B&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;133&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;financial liability or equity&lt;/text&gt;
&lt;text x=&quot;380&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;lbl&quot;&gt;e.g. A holds a bond / a share issued by B&lt;/text&gt;
&lt;/svg&gt;

&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--good)&quot;&gt;&lt;h4&gt;Financial asset&lt;/h4&gt;&lt;ul class=&quot;small&quot;&gt;
&lt;li&gt;&lt;b&gt;cash&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;an &lt;b&gt;equity instrument of another entity&lt;/b&gt; (e.g. shares held);&lt;/li&gt;
&lt;li&gt;a &lt;b&gt;contractual right&lt;/b&gt; to receive cash/another financial asset, or to exchange financial assets/liabilities under conditions that are &lt;b&gt;potentially favourable&lt;/b&gt;;&lt;/li&gt;
&lt;li&gt;a contract that will be settled in the entity&#x27;s &lt;b&gt;own equity instruments&lt;/b&gt; and is: a &lt;em&gt;non-derivative&lt;/em&gt; for which the entity will receive a &lt;b&gt;variable number&lt;/b&gt; of its own shares, or a &lt;em&gt;derivative&lt;/em&gt; not settled “fixed amount for fixed number”.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--bad)&quot;&gt;&lt;h4&gt;Financial liability&lt;/h4&gt;&lt;ul class=&quot;small&quot;&gt;
&lt;li&gt;a &lt;b&gt;contractual obligation&lt;/b&gt; to deliver cash/another financial asset, or to exchange under conditions that are &lt;b&gt;potentially unfavourable&lt;/b&gt;;&lt;/li&gt;
&lt;li&gt;a contract that will be settled in the entity&#x27;s &lt;b&gt;own equity instruments&lt;/b&gt; and is: a &lt;em&gt;non-derivative&lt;/em&gt; that obliges the entity to deliver a &lt;b&gt;variable number&lt;/b&gt; of its own shares, or a &lt;em&gt;derivative&lt;/em&gt; that is not “fixed-for-fixed”.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--ts)&quot;&gt;&lt;h4&gt;Equity instrument&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Any contract that evidences a &lt;b&gt;residual interest&lt;/b&gt; in the assets of an entity &lt;b&gt;after deducting all of its liabilities&lt;/b&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;It is equity &lt;b&gt;if, and only if&lt;/b&gt; [IAS 32.16]: (a) there is &lt;b&gt;no contractual obligation&lt;/b&gt; to deliver cash or to exchange under unfavourable conditions; (b) if settled in the entity&#x27;s own shares, it is a non-derivative with no obligation to deliver a variable number of shares, or a derivative settled only by exchanging a &lt;b&gt;fixed amount&lt;/b&gt; for a &lt;b&gt;fixed number&lt;/b&gt; of its own shares.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;note&quot;&gt;Why does &lt;span class=&quot;term&quot;&gt;fixed-for-fixed&lt;/span&gt; (a fixed amount for a fixed number of shares) matter? If I must deliver a &lt;b&gt;variable&lt;/b&gt; number of shares worth, say, €1,000, I am using my shares as a “currency”: the creditor always receives €1,000 and does not share in the entity&#x27;s residual risk, so economically it is a liability. If instead I deliver 100 shares for a fixed €1,000 (as in a classic warrant), the recipient bears the risk of the share&#x27;s value like a shareholder: it is equity. Classic example: &lt;b&gt;mandatorily redeemable preference shares&lt;/b&gt; with a fixed redemption date are liabilities even though they are called “shares”, because there is an obligation to pay.&lt;/div&gt;

&lt;div class=&quot;widget tree&quot; id=&quot;tree-de&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Interactive tool&lt;/div&gt;&lt;h4&gt;Debt or equity? Classify an instrument from the issuer&#x27;s side&lt;/h4&gt;
&lt;div class=&quot;tbody&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;ias32-der&quot;&gt;Derivatives and embedded derivatives &lt;span class=&quot;ref&quot;&gt;[IFRS 9 – App. A; 4.3.1]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;The IAS 32 slides refer to the definition of a &lt;span class=&quot;term&quot;&gt;derivative&lt;/span&gt; contained in IFRS 9. &lt;b&gt;All three&lt;/b&gt; characteristics are required:&lt;/p&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;&lt;b&gt;Its value changes in response to a variable&lt;/b&gt; (the &lt;span class=&quot;term&quot;&gt;underlying&lt;/span&gt;): interest rate, financial instrument price, commodity price, foreign exchange rate, index, credit rating… If the variable is non-financial, it must not be specific to a party to the contract.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;No initial net investment&lt;/b&gt;, or one that is &lt;b&gt;smaller&lt;/b&gt; than would be required for contracts with a similar response to changes in market factors (the typical leverage of derivatives).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;It is settled at a future date.&lt;/b&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Trading derivative&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Purpose: &lt;b&gt;to profit from changes in fair value&lt;/b&gt;, i.e. from taking positions on the parameters (indices, rates, currencies) from which its value derives.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Hedging derivative&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Purpose: &lt;b&gt;to manage the risk&lt;/b&gt; of adverse changes in the &lt;b&gt;fair value&lt;/b&gt; or &lt;b&gt;cash flows&lt;/b&gt; of the hedged asset or liability (Part 7).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Embedded derivative&lt;/b&gt;&lt;br&gt;A component of a &lt;span class=&quot;term&quot;&gt;hybrid contract&lt;/span&gt; that also includes a non-derivative &lt;b&gt;host&lt;/b&gt; contract, with the effect that some of the cash flows of the combined instrument vary in a way similar to a stand-alone derivative. Example: a bond whose coupon is indexed to an equity index, or a convertible loan.&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;term&quot;&gt;Fair value&lt;/span&gt; is the price that would be received to sell an asset, or paid to transfer a liability, in an orderly transaction between market participants at the measurement date (IFRS 13 definition, not contained in the slides).&lt;/div&gt;

&lt;h3 id=&quot;ias32-treasury&quot;&gt;Treasury shares &lt;span class=&quot;ref&quot;&gt;[IAS 32.33-34]&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div&gt;&lt;p&gt;&lt;span class=&quot;term&quot;&gt;Treasury shares&lt;/span&gt; (&lt;em&gt;own shares&lt;/em&gt;) reacquired by the entity, or by other members of the consolidated group:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;are &lt;b&gt;deducted from equity&lt;/b&gt;, not recognised as assets;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;no gain or loss&lt;/b&gt; is recognised in profit or loss on their purchase, sale, issue or cancellation;&lt;/li&gt;
&lt;li&gt;consideration paid or received is recognised &lt;b&gt;directly in equity&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;
&lt;p class=&quot;small&quot;&gt;&lt;b&gt;Exception [IAS 32.33A]:&lt;/b&gt; if the treasury shares are held in an investment fund managed by the entity or as &lt;em&gt;underlying items&lt;/em&gt; of insurance contracts with direct participation features, the entity may elect (irrevocably, instrument by instrument) not to deduct them and to treat them as financial assets at FVTPL.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Example&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;A company with share capital and reserves of 10,000 buys back its own shares for 300, then resells them for 350.&lt;/p&gt;
&lt;table class=&quot;small&quot;&gt;&lt;tr&gt;&lt;th&gt;Event&lt;/th&gt;&lt;th&gt;Effect&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Purchase 300&lt;/td&gt;&lt;td&gt;Equity −300 (negative reserve for treasury shares), cash −300&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sale at 350&lt;/td&gt;&lt;td&gt;Equity +350 (the +50 remains in a reserve), cash +350. &lt;b&gt;No gain in P&amp;amp;L.&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p class=&quot;small&quot;&gt;Presentation: under &lt;b&gt;IFRS 18&lt;/b&gt; (which replaces IAS 1) the amount is presented separately in the statement of financial position or in the statement of changes in equity, or disclosed in the notes.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Interest, dividends, gains and losses &lt;span class=&quot;ref&quot;&gt;[IAS 32.35]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;The classification of the instrument &lt;b&gt;determines&lt;/b&gt; the classification of its returns:&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 760 130&quot; role=&quot;img&quot; aria-label=&quot;If the instrument is a liability, its returns go to profit or loss; if it is equity, they go to equity&quot;&gt;
&lt;rect class=&quot;n-box&quot; x=&quot;10&quot; y=&quot;15&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Financial liability&lt;/text&gt;
&lt;path class=&quot;edge&quot; d=&quot;M230 37 L300 37&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect class=&quot;n-acc&quot; x=&quot;302&quot; y=&quot;10&quot; width=&quot;440&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;522&quot; y=&quot;33&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;interest, dividends, gains and losses&lt;/text&gt;&lt;text x=&quot;522&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;→ income/expense in profit or loss&lt;/text&gt;
&lt;rect class=&quot;n-box&quot; x=&quot;10&quot; y=&quot;75&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Equity instrument&lt;/text&gt;
&lt;path class=&quot;edge&quot; d=&quot;M230 97 L300 97&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect class=&quot;n-acc&quot; x=&quot;302&quot; y=&quot;70&quot; width=&quot;440&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;522&quot; y=&quot;93&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;distributions to holders and transaction costs&lt;/text&gt;&lt;text x=&quot;522&quot; y=&quot;111&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;→ directly in equity (as a deduction)&lt;/text&gt;
&lt;/svg&gt;
&lt;p class=&quot;small&quot;&gt;Consequence: “dividends” on preference shares classified as liabilities are &lt;b&gt;interest expense&lt;/b&gt; in profit or loss; the costs of a share issue (notary, banks) reduce equity and do not pass through profit or loss.&lt;/p&gt;

&lt;h3&gt;Offsetting &lt;span class=&quot;ref&quot;&gt;[IAS 32.42]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;A financial asset and a financial liability are &lt;b&gt;offset&lt;/b&gt; and the net amount presented &lt;b&gt;if, and only if&lt;/b&gt;, the entity:&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;(a)&lt;/b&gt; &lt;b&gt;currently&lt;/b&gt; has a &lt;b&gt;legally enforceable right&lt;/b&gt; to set off the amounts; &lt;b&gt;and&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;(b)&lt;/b&gt; &lt;b&gt;intends&lt;/b&gt; either to settle on a net basis, or to realise the asset and settle the liability simultaneously.&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;If a transfer of assets does &lt;b&gt;not&lt;/b&gt; meet the derecognition tests, the transferred asset and the associated liability are &lt;b&gt;not offset&lt;/b&gt;. This is the case of the &lt;span class=&quot;term&quot;&gt;assignment of receivables “subject to collection” (&lt;em&gt;salvo buon fine&lt;/em&gt;, sbf)&lt;/span&gt;: the collection risk remains with the transferor, so the receivable stays among the assets and the advance received from the bank is recognised among the liabilities.&lt;/p&gt;

&lt;h3&gt;Proposed amendments: the FICE project&lt;/h3&gt;
&lt;p&gt;On &lt;b&gt;29 November 2023&lt;/b&gt; the IASB published an &lt;span class=&quot;term&quot;&gt;Exposure Draft&lt;/span&gt; (consultation draft) to address the challenges posed by instruments with &lt;b&gt;characteristics of both debt and equity&lt;/b&gt;. IAS 32 works well for most instruments, but these have become more complex, and divergent practice among entities makes it difficult for investors to compare financial position and performance. The proposals would amend IAS 32, IFRS 7 and IAS 1:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;b&gt;clarifying the classification principles&lt;/b&gt; of IAS 32 for distinguishing debt from equity;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;new disclosures&lt;/b&gt; on the complexities of hybrid instruments;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;new presentation&lt;/b&gt; of the amounts (profit and total comprehensive income) attributable to &lt;b&gt;ordinary shareholders&lt;/b&gt;, separately from those attributable to other holders of equity instruments.&lt;/li&gt;&lt;/ul&gt;
&lt;p class=&quot;small muted&quot;&gt;Project status updated with an external source in the &lt;a href=&quot;#s-fonti&quot;&gt;Further reading&lt;/a&gt; section.&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · IAS 32&lt;/h3&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;1. An entity issues preference shares that it must mandatorily redeem at par in 5 years. How does it classify them?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Equity, because they are shares&lt;/button&gt;&lt;button data-ok&gt;Financial liability&lt;/button&gt;&lt;button&gt;A 50/50 compound instrument&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;There is a &lt;b&gt;contractual obligation to deliver cash&lt;/b&gt;: condition (a) of IAS 32.16 is not met. Legal form does not matter; substance does.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;2. An entity buys back its own shares for 500 and resells them for 450. What does it recognise in profit or loss?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;A loss of 50&lt;/button&gt;&lt;button data-ok&gt;Nothing: the difference remains in equity&lt;/button&gt;&lt;button&gt;A loss of 500 on the buy-back&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;IAS 32.33: no gain or loss on transactions in treasury shares; the consideration goes directly to equity.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;3. Which pair of conditions permits offsetting?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Same counterparty and same maturity&lt;/button&gt;&lt;button data-ok&gt;A currently enforceable legal right + the intention to settle net (or simultaneously)&lt;/button&gt;&lt;button&gt;Only the intention to settle net&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;Both are required (IAS 32.42). Intention alone, or the same counterparty, is not enough.&lt;/p&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Open question: is a warrant giving the right to receive 100 of the issuer&#x27;s shares for €10 each equity or a liability for the issuer?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It is &lt;b&gt;equity&lt;/b&gt;: it is a derivative settled by exchanging a &lt;b&gt;fixed amount&lt;/b&gt; of cash (€1,000) for a &lt;b&gt;fixed number&lt;/b&gt; of own shares (100). If the number of shares were variable (e.g. “shares worth €1,000”), it would be a derivative financial liability (or asset).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 3 PERCHE IFRS 9 ============ --&gt;
&lt;section id=&quot;s-perche&quot; class=&quot;part ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Part 3&lt;/div&gt;&lt;h2&gt;IFRS 9 – why it replaced IAS 39&lt;/h2&gt;&lt;/header&gt;
&lt;p class=&quot;lead&quot;&gt;From &lt;b&gt;1 January 2018&lt;/b&gt; IFRS 9 almost entirely replaced IAS 39 as the reference standard for the &lt;em&gt;recognition and measurement&lt;/em&gt; of financial instruments.&lt;/p&gt;
&lt;h3&gt;The reasons for the change&lt;/h3&gt;
&lt;p&gt;Step through the stages: each one is a shortcoming of IAS 39 that the 2008 financial crisis brought to light.&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;why-steps&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Step-through&lt;/div&gt;
&lt;div class=&quot;stepview&quot;&gt;&lt;/div&gt;
&lt;div style=&quot;display:flex;gap:.5rem;align-items:center;margin-top:.8rem&quot;&gt;&lt;button class=&quot;btn&quot; data-d=&quot;-1&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-d=&quot;1&quot;&gt;Next →&lt;/button&gt;&lt;span class=&quot;small muted&quot; data-pos&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The three pillars of the new standard&lt;/h3&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;a class=&quot;card&quot; href=&quot;#s-classificazione&quot; style=&quot;text-decoration:none;color:inherit;border-top:4px solid oklch(60% 0.12 85)&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Pillar 1&lt;/span&gt;&lt;h4&gt;Classification &amp;amp; Measurement&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;A logical approach that reflects the &lt;b&gt;business model&lt;/b&gt; and the &lt;b&gt;cash flow characteristics&lt;/b&gt;.&lt;/p&gt;&lt;/a&gt;
&lt;a class=&quot;card&quot; href=&quot;#s-impairment&quot; style=&quot;text-decoration:none;color:inherit;border-top:4px solid oklch(55% 0.14 25)&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Pillar 2&lt;/span&gt;&lt;h4&gt;Impairment test&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;An &lt;b&gt;expected loss model&lt;/b&gt; applicable to all financial instruments.&lt;/p&gt;&lt;/a&gt;
&lt;a class=&quot;card&quot; href=&quot;#s-hedge&quot; style=&quot;text-decoration:none;color:inherit;border-top:4px solid oklch(55% 0.1 150)&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Pillar 3&lt;/span&gt;&lt;h4&gt;Hedge accounting&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Accounting for hedging &lt;b&gt;derivatives&lt;/b&gt; that is more closely aligned with risk management.&lt;/p&gt;&lt;/a&gt;
&lt;/div&gt;

&lt;h3&gt;From four categories to three&lt;/h3&gt;
&lt;p&gt;IFRS 9 eliminates the four-way classification of IAS 39 and reduces the number of financial asset categories.&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-label=&quot;Indicative mapping between the four IAS 39 categories and the three IFRS 9 categories&quot;&gt;
&lt;text x=&quot;130&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;IAS 39&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;IFRS 9&lt;/text&gt;
&lt;rect class=&quot;n-box&quot; x=&quot;20&quot; y=&quot;35&quot; width=&quot;220&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Held to maturity (HTM)&lt;/text&gt;
&lt;rect class=&quot;n-box&quot; x=&quot;20&quot; y=&quot;85&quot; width=&quot;220&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Loans and receivables (L&amp;amp;R)&lt;/text&gt;
&lt;rect class=&quot;n-box&quot; x=&quot;20&quot; y=&quot;135&quot; width=&quot;220&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Available for sale (AFS)&lt;/text&gt;
&lt;rect class=&quot;n-box&quot; x=&quot;20&quot; y=&quot;185&quot; width=&quot;220&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Fair value through P&amp;amp;L&lt;/text&gt;
&lt;rect class=&quot;n-acc&quot; x=&quot;520&quot; y=&quot;55&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;630&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Amortised Cost (AC)&lt;/text&gt;
&lt;rect class=&quot;n-acc&quot; x=&quot;520&quot; y=&quot;125&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;630&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;FVOCI&lt;/text&gt;
&lt;rect class=&quot;n-acc&quot; x=&quot;520&quot; y=&quot;190&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;630&quot; y=&quot;217&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;FVTPL&lt;/text&gt;
&lt;path class=&quot;edge d&quot; d=&quot;M240 55 L518 75&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;edge d&quot; d=&quot;M240 105 L518 80&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;path class=&quot;edge d&quot; d=&quot;M240 155 L518 147&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;edge d&quot; d=&quot;M240 205 L518 212&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;text class=&quot;lbl&quot; x=&quot;380&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot;&gt;indicative mapping only: under IFRS 9 the business model and SPPI test decide, not the label&lt;/text&gt;
&lt;/svg&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Objective of IFRS 9&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[IFRS 9 – 1.1]&lt;/span&gt;&lt;br&gt;To establish principles for the financial reporting of financial assets and financial liabilities that will present relevant and useful information to users for their assessment of the &lt;b&gt;amounts, timing and uncertainty&lt;/b&gt; of the entity&#x27;s future cash flows.&lt;/div&gt;

&lt;details&gt;&lt;summary&gt;Scope of IFRS 9: the exclusions [IFRS 9 – 2.1]&lt;/summary&gt;&lt;div&gt;
&lt;p class=&quot;small&quot;&gt;It applies to all entities and to all financial instruments, &lt;b&gt;except&lt;/b&gt;:&lt;/p&gt;
&lt;ul class=&quot;small&quot;&gt;
&lt;li&gt;interests in subsidiaries, associates and JVs accounted for under IFRS 10, IAS 27, IAS 28 (but IFRS 9 applies to derivatives on such interests, unless they are the entity&#x27;s own equity under IAS 32);&lt;/li&gt;
&lt;li&gt;rights and obligations under &lt;b&gt;leases&lt;/b&gt; (IFRS 16);&lt;/li&gt;
&lt;li&gt;&lt;b&gt;employee benefit&lt;/b&gt; plans (IAS 19);&lt;/li&gt;
&lt;li&gt;instruments issued by the entity that are &lt;b&gt;equity under IAS 32&lt;/b&gt; (including options and warrants);&lt;/li&gt;
&lt;li&gt;IFRS 17 insurance contracts (with the same exceptions seen for IAS 32: embedded derivatives, investment components, financial guarantees, credit cards, contracts under IFRS 17.8A);&lt;/li&gt;
&lt;li&gt;&lt;b&gt;forward&lt;/b&gt; contracts between an acquirer and a seller for a future &lt;b&gt;business combination&lt;/b&gt; (IFRS 3);&lt;/li&gt;
&lt;li&gt;&lt;b&gt;loan commitments&lt;/b&gt; other than those described in the standard;&lt;/li&gt;
&lt;li&gt;share-based payments (IFRS 2);&lt;/li&gt;
&lt;li&gt;rights to reimbursement of expenditure required to settle a liability recognised as a &lt;b&gt;provision&lt;/b&gt; (IAS 37);&lt;/li&gt;
&lt;li&gt;rights and obligations within the scope of &lt;b&gt;IFRS 15&lt;/b&gt; (revenue from contracts with customers), except those that IFRS 15 refers to IFRS 9.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Why IFRS 9&lt;/h3&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;1. What was the main criticism of the IAS 39 impairment model?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;It recognised losses too early&lt;/button&gt;&lt;button data-ok&gt;It recognised losses only once the loss event had occurred (incurred loss): too late and procyclically&lt;/button&gt;&lt;button&gt;It did not allow receivables to be impaired&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;The &lt;em&gt;incurred loss&lt;/em&gt; model waited for a &lt;em&gt;trigger event&lt;/em&gt; (never precisely defined): losses emerged late, amplifying the economic cycle.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;2. Which of these is NOT a financial asset category under IFRS 9?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Amortised cost&lt;/button&gt;&lt;button data-ok&gt;Available for sale&lt;/button&gt;&lt;button&gt;FVTPL&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;AFS is an IAS 39 category, eliminated together with HTM and L&amp;amp;R.&lt;/p&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Open question: in what sense can fair value accounting “accelerate the procyclical effect”?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In a crisis, markets become illiquid and prices collapse: measuring at fair value brings out losses that reduce banks&#x27; capital; banks then sell assets and cut lending, depressing prices further. Moreover, without an active market, fair value measurements become unreliable.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 4 RECOGNITION ============ --&gt;
&lt;section id=&quot;s-rilevazione&quot; class=&quot;part sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Part 4&lt;/div&gt;&lt;h2&gt;Recognition and derecognition &lt;span class=&quot;ref&quot;&gt;[IFRS 9 – 3.1-3.3]&lt;/span&gt;&lt;/h2&gt;&lt;/header&gt;

&lt;h3&gt;Initial recognition&lt;/h3&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;When?&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[3.1.1]&lt;/span&gt;&lt;br&gt;A financial asset or financial liability is recognised &lt;b&gt;when, and only when, the entity becomes party to the contractual provisions&lt;/b&gt; of the instrument.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;At what amount?&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[5.1.1]&lt;/span&gt;&lt;br&gt;&lt;b&gt;Fair value&lt;/b&gt;, plus or minus — if the instrument is &lt;b&gt;not&lt;/b&gt; at FVTPL — &lt;span class=&quot;term&quot;&gt;transaction costs&lt;/span&gt; (fees, brokerage commissions) that are &lt;b&gt;directly attributable&lt;/b&gt;.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;Why are transaction costs not capitalised at FVTPL? Because they would disappear anyway at the first fair value remeasurement: they are expensed immediately in profit or loss. For AC and FVOCI, instead, they are included in the cost and “spread” using the effective interest rate (Part 5).&lt;/div&gt;

&lt;h3&gt;Regular way purchase or sale: trade date or settlement date &lt;span class=&quot;ref&quot;&gt;[3.1.2; B3.1.3-B3.1.6]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;A &lt;span class=&quot;term&quot;&gt;regular way&lt;/span&gt; purchase or sale (within the time frame established by market convention) is recognised using &lt;b&gt;trade date accounting&lt;/b&gt; or &lt;b&gt;settlement date accounting&lt;/b&gt;, applying &lt;b&gt;the same method consistently&lt;/b&gt; to all assets classified in the same way.&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Trade date&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;The date on which the entity &lt;b&gt;commits&lt;/b&gt; to purchase or sell. The asset to be received and the liability to pay for it are recognised; on a sale, the asset is derecognised, and the gain/loss and a receivable from the buyer are recognised. Interest generally does not accrue until the settlement date.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Settlement date&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;The date on which the asset is &lt;b&gt;delivered&lt;/b&gt;. The asset is recognised when received and derecognised when delivered. Changes in fair value between trade date and settlement date are accounted for &lt;b&gt;in the same way as for the acquired asset&lt;/b&gt; (i.e. according to its category).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;widget&quot; id=&quot;tsd&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Interactive example · from Alexander &amp;amp; Archer (2017), used in the slides&lt;/div&gt;
&lt;h4&gt;Purchase at 1,000 on 29.12.X1 · fair value 1,002 at 31.12.X1 (year-end) · 1,003 at 4.1.X2 (settlement)&lt;/h4&gt;
&lt;div style=&quot;display:flex;flex-wrap:wrap;gap:1rem;margin:.4rem 0&quot;&gt;
&lt;div&gt;&lt;div class=&quot;small muted&quot;&gt;Method&lt;/div&gt;&lt;button class=&quot;btn on&quot; data-m=&quot;t&quot;&gt;Trade date&lt;/button&gt; &lt;button class=&quot;btn&quot; data-m=&quot;s&quot;&gt;Settlement date&lt;/button&gt;&lt;/div&gt;

&lt;h3&gt;Derecognition of financial assets &lt;span class=&quot;ref&quot;&gt;[3.2.3-3.2.9]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;An asset is derecognised (&lt;span class=&quot;term&quot;&gt;derecognition&lt;/span&gt;: removal from the statement of financial position) &lt;b&gt;when, and only when&lt;/b&gt;:&lt;/p&gt;
&lt;ol&gt;&lt;li&gt;the contractual rights to the cash flows &lt;b&gt;expire&lt;/b&gt;, or&lt;/li&gt;
&lt;li&gt;the entity &lt;b&gt;transfers&lt;/b&gt; the asset and the transfer &lt;b&gt;qualifies&lt;/b&gt; for derecognition. A transfer occurs if the entity: (a) transfers the contractual rights to receive the cash flows, &lt;b&gt;or&lt;/b&gt; (b) retains those rights but assumes an obligation to pay them to others under an arrangement that meets three conditions (&lt;span class=&quot;term&quot;&gt;pass-through arrangement&lt;/span&gt;).&lt;/li&gt;&lt;/ol&gt;
&lt;details&gt;&lt;summary&gt;The three pass-through conditions [3.2.5]&lt;/summary&gt;&lt;div&gt;
&lt;ol class=&quot;small&quot;&gt;
&lt;li&gt;&lt;b&gt;No obligation to pay&lt;/b&gt; the eventual recipients amounts unless it collects equivalent amounts from the original asset (short-term advances with full recovery plus interest at market rates are permitted).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prohibition on selling or pledging&lt;/b&gt; the original asset, other than as security to the eventual recipients.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Obligation to remit collected cash flows without material delay&lt;/b&gt;; in the meantime, it may only invest them in cash or cash equivalents (IAS 7), also passing interest earned on to the eventual recipients.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h4&gt;The core of the test: risks and rewards&lt;/h4&gt;
&lt;p&gt;The entity has &lt;b&gt;retained&lt;/b&gt; substantially all the risks and rewards if its exposure to the variability in the present value of the future net cash flows &lt;b&gt;does not change significantly&lt;/b&gt; as a result of the transfer (e.g. a sale with an agreement to repurchase at a fixed price or at the sale price plus a lender&#x27;s return). It has &lt;b&gt;transferred&lt;/b&gt; them if such exposure is no longer significant (e.g. a sale subject only to an option to repurchase at fair value at the time of repurchase, or the transfer of a fully proportionate share such as a &lt;em&gt;loan sub-participation&lt;/em&gt;) [3.2.7].&lt;/p&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--good)&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Yes&lt;/span&gt;&lt;p class=&quot;small&quot;&gt;&lt;b&gt;Substantially all&lt;/b&gt; transferred → &lt;b&gt;derecognition&lt;/b&gt;; any rights and obligations created or retained are recognised separately.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--ts)&quot;&gt;&lt;span class=&quot;tag&quot;&gt;No&lt;/span&gt;&lt;p class=&quot;small&quot;&gt;&lt;b&gt;Substantially all&lt;/b&gt; retained → the asset &lt;b&gt;remains on the balance sheet&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--acc)&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Partly&lt;/span&gt;&lt;p class=&quot;small&quot;&gt;Neither transferred nor retained → &lt;b&gt;control&lt;/b&gt; is decisive: if the transferee can sell the asset in its entirety to a third party, unilaterally and without restrictions, control has not been retained [3.2.9].&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;When derecognition occurs: the gain or loss &lt;span class=&quot;ref&quot;&gt;[3.2.12]&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;On derecognition of the asset in its entirety, the difference between the &lt;b&gt;carrying amount&lt;/b&gt; (measured at the date of derecognition) and the &lt;b&gt;consideration received&lt;/b&gt; (including any new asset obtained less any new liability assumed) is recognised in &lt;b&gt;profit or loss&lt;/b&gt;.&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;gl&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Slider calculator&lt;/div&gt;
&lt;label class=&quot;rng&quot;&gt;Carrying amount&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;1000&quot; data-k=&quot;ca&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Cash received&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;950&quot; data-k=&quot;cash&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;New asset obtained&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;300&quot; step=&quot;5&quot; value=&quot;40&quot; data-k=&quot;na&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;New liability assumed&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;300&quot; step=&quot;5&quot; value=&quot;10&quot; data-k=&quot;nl&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;small&quot;&gt;Gain/loss in profit or loss = (cash + new asset − new liability) − carrying amount&lt;/span&gt;&lt;div class=&quot;big&quot; data-out&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;details&gt;&lt;summary&gt;Transfer of part of a larger asset [3.2.13-3.2.14] · worked example&lt;/summary&gt;&lt;div&gt;
&lt;p class=&quot;small&quot;&gt;The carrying amount of the whole asset is allocated between the part derecognised and the part retained on the basis of their &lt;b&gt;relative fair values&lt;/b&gt; at the date of transfer (a retained &lt;em&gt;servicing asset&lt;/em&gt; is treated as a part that continues to be recognised). If there is no price for the part retained, the best estimate of its fair value is: &lt;b&gt;FV of the asset as a whole − consideration received for the part transferred&lt;/b&gt;.&lt;/p&gt;
&lt;table class=&quot;small&quot;&gt;&lt;tr&gt;&lt;th&gt;Data&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Carrying amount of the loan portfolio&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fair value of the whole portfolio&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,150&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Consideration for a proportionate share transferred (60%)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;690&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FV of part retained = 1,150 − 690&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;460&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Carrying amount allocated to the part transferred = 1,000 × 690/1,150&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;600&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Gain in P&amp;amp;L = 690 − 600&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;90&lt;/th&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p class=&quot;small muted&quot;&gt;Figures invented for teaching purposes.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Transfers that do NOT qualify &lt;span class=&quot;ref&quot;&gt;[3.2.15]&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;If the entity has retained substantially all the risks and rewards, it &lt;b&gt;continues to recognise the asset in its entirety&lt;/b&gt; and recognises a &lt;b&gt;financial liability&lt;/b&gt; for the consideration received. In subsequent periods it recognises income on the asset and expense on the liability. This is the logic of the sbf assignment seen under IAS 32: in substance, a secured borrowing.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Continuing involvement &lt;span class=&quot;ref&quot;&gt;[3.2.16-3.2.17]&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;If risks and rewards are only partly transferred and control is retained, the asset remains on the balance sheet &lt;b&gt;to the extent that the entity remains exposed&lt;/b&gt; to changes in its value, together with an &lt;b&gt;associated liability&lt;/b&gt;. The net of the two is: the amortised cost of the rights and obligations retained (if the asset is at AC) or their fair value on a stand-alone basis (if the asset is at fair value).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;a) Guarantee&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;b) Option&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;c) Cash-settled option&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;&lt;p class=&quot;small&quot;&gt;If the involvement takes the form of a &lt;b&gt;guarantee&lt;/b&gt; of the transferred asset, its extent is the &lt;b&gt;lower&lt;/b&gt; of the amount of the asset and the maximum amount of consideration that could be required to be repaid (&lt;em&gt;guarantee amount&lt;/em&gt;). E.g. receivables of 1,000 transferred with a guarantee of losses up to 50 → continuing involvement of 50.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p class=&quot;small&quot;&gt;If it is a &lt;b&gt;written or purchased option&lt;/b&gt; (or both), the extent is the &lt;b&gt;amount of the asset that the entity may repurchase&lt;/b&gt;. With a &lt;em&gt;written put&lt;/em&gt; on an asset measured at fair value, the extent is limited to the &lt;b&gt;lower of the fair value of the asset and the option exercise price&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p class=&quot;small&quot;&gt;If it is a &lt;b&gt;cash-settled&lt;/b&gt; option or similar provision, the extent is measured in the same way as for non-cash-settled options in case (b).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Derecognition of financial liabilities &lt;span class=&quot;ref&quot;&gt;[3.3.1-3.3.5]&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div&gt;&lt;p&gt;A liability (or part of it) is derecognised &lt;b&gt;when, and only when, it is extinguished&lt;/b&gt;: the obligation is &lt;em&gt;discharged&lt;/em&gt;, &lt;em&gt;cancelled&lt;/em&gt; or &lt;em&gt;expires&lt;/em&gt;.&lt;/p&gt;&lt;p&gt;The difference between the &lt;b&gt;carrying amount&lt;/b&gt; of the liability extinguished or transferred and the &lt;b&gt;consideration paid&lt;/b&gt; (including any non-cash assets transferred or liabilities assumed) is recognised in &lt;b&gt;profit or loss&lt;/b&gt; [3.3.3].&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;&lt;b&gt;Example:&lt;/b&gt; a bond issued with a carrying amount of 1,000 repurchased on the market at 970 → gain of 30.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Exception [3.3.5]&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;If a fund managed by the entity, or the &lt;em&gt;underlying items&lt;/em&gt; of insurance contracts with direct participation features, repurchase a liability of the entity (e.g. one of its bonds), the entity may elect — irrevocably, instrument by instrument — &lt;b&gt;not to derecognise it&lt;/b&gt; and to treat the repurchased instrument as an asset at FVTPL. This mirrors the IAS 32.33A exception for treasury shares.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Recognition and derecognition&lt;/h3&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;1. An asset classified at FVTPL is purchased for 1,000 plus 15 of fees. What is its initial carrying amount?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;1,015&lt;/button&gt;&lt;button data-ok&gt;1,000, with 15 expensed in profit or loss&lt;/button&gt;&lt;button&gt;985&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;At FVTPL transaction costs are not capitalised (IFRS 9 – 5.1.1).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;2. A bank sells a security with a commitment to repurchase it in 3 months at a fixed price (repo). What happens?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Derecognition, because the security has been sold&lt;/button&gt;&lt;button data-ok&gt;The security remains on the balance sheet and a liability is recognised for the consideration received&lt;/button&gt;&lt;button&gt;Continuing involvement for half&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;With a repurchase at a fixed price the bank retains substantially all the risks and rewards (3.2.7): the transfer does not qualify (3.2.15).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;3. Under settlement date accounting, where does the +2 change in fair value between trade date and year-end go for an asset at FVOCI?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;To profit or loss&lt;/button&gt;&lt;button data-ok&gt;To OCI (equity), with a receivable of 2 on the asset side&lt;/button&gt;&lt;button&gt;It is not recognised&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;B3.1.6: the change is accounted for in the same way as for the acquired asset. For AC, instead, nothing is recognised.&lt;/p&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Open question: why, in the flowchart, does “Yes” to the question on transferring the rights skip the pass-through test?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because if the entity has transferred the contractual rights to receive the cash flows, it has already made a “transfer” under 3.2.4(a); the pass-through test (3.2.5) is only needed when the rights are retained but the cash flows are passed on to others. In both cases the next step is the risks and rewards test.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 5 CLASSIFICATION ============ --&gt;
&lt;section id=&quot;s-classificazione&quot; class=&quot;part ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Part 5&lt;/div&gt;&lt;h2&gt;Classification and measurement&lt;/h2&gt;&lt;/header&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;The general rule&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[IFRS 9 – 4.1.1]&lt;/span&gt;&lt;br&gt;Financial assets are classified as subsequently measured at &lt;b&gt;amortised cost (AC)&lt;/b&gt;, &lt;b&gt;fair value through other comprehensive income (FVOCI)&lt;/b&gt; or &lt;b&gt;fair value through profit or loss (FVTPL)&lt;/b&gt;, on the basis of &lt;b&gt;both&lt;/b&gt;: (a) the entity&#x27;s &lt;b&gt;business model&lt;/b&gt; for managing them and (b) the &lt;b&gt;contractual cash flow characteristics&lt;/b&gt; of the asset.&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;Glossary: &lt;span class=&quot;term&quot;&gt;OCI – other comprehensive income&lt;/span&gt; is the part of total comprehensive income that does not pass through the income statement but goes directly to an equity reserve; &lt;span class=&quot;term&quot;&gt;profit or loss (P&amp;amp;L)&lt;/span&gt; is the income statement.&lt;/p&gt;

&lt;h3&gt;Test 1 · The business model &lt;span class=&quot;ref&quot;&gt;[B4.1.2-B4.1.2C]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;The business model is the &lt;b&gt;way in which the entity manages its financial instruments in order to generate cash flows&lt;/b&gt;. In essence, two questions: are the instruments held &lt;b&gt;only to collect the cash flows&lt;/b&gt;? Or also to &lt;b&gt;sell them&lt;/b&gt;?&lt;/p&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Portfolio level&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;It is determined not for individual assets but for &lt;b&gt;homogeneous portfolios&lt;/b&gt;; an entity may have more than one business model and therefore different sub-portfolios.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;A fact, not an assertion&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;It is &lt;em&gt;a matter of fact&lt;/em&gt;, observable through the activities undertaken. It requires &lt;b&gt;judgement&lt;/b&gt; and &lt;b&gt;all relevant evidence&lt;/b&gt; available at the assessment date, not a single factor.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Typical evidence&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;How performance is &lt;b&gt;evaluated and reported&lt;/b&gt; to key management personnel; which &lt;b&gt;risks&lt;/b&gt; affect performance and how they are managed; how &lt;b&gt;managers are compensated&lt;/b&gt; (on fair value or on cash flows collected?).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Hold to collect&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Hold to collect and sell&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Other (trading)&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Holding to collect contractual cash flows&lt;/b&gt; (&lt;em&gt;held to collect&lt;/em&gt;, HTC): the assets are managed to realise cash flows by collecting contractual payments over the life of the instrument. To assess this, the entity considers the &lt;b&gt;frequency, value and timing of past sales&lt;/b&gt;, the reasons for them and expectations about future sales. However, sales &lt;b&gt;in themselves do not determine&lt;/b&gt; the business model: they must be considered in the context of the reasons for them and of the conditions at the time compared with current conditions. Example: a bank that originates mortgages and holds them to maturity.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Collecting cash flows and selling&lt;/b&gt; (HTC&amp;amp;S): both activities are integral to achieving the objective. Example: a bank&#x27;s treasury holding government bonds to manage liquidity, selling them when needed.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Anything that is neither HTC nor HTC&amp;amp;S, in particular &lt;b&gt;trading&lt;/b&gt; (&lt;em&gt;held for trading&lt;/em&gt;) or management on a fair value basis: leads to &lt;b&gt;FVTPL&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Test 2 · SPPI test &lt;span class=&quot;ref&quot;&gt;[B4.1.7]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;The composition of the cash flows expected from the instrument is analysed. If they are &lt;b&gt;solely&lt;/b&gt; repayments of &lt;b&gt;principal&lt;/b&gt; and/or &lt;b&gt;interest&lt;/b&gt; accrued on the principal amount outstanding, the &lt;span class=&quot;term&quot;&gt;SPPI test – Solely Payments of Principal and Interest&lt;/span&gt; is passed.&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--good)&quot;&gt;&lt;h4&gt;Usually passes&lt;/h4&gt;&lt;ul class=&quot;small&quot;&gt;&lt;li&gt;Fixed-rate or floating-rate loan (e.g. Euribor + spread)&lt;/li&gt;&lt;li&gt;“Plain vanilla” bond&lt;/li&gt;&lt;li&gt;Trade receivables&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--bad)&quot;&gt;&lt;h4&gt;Usually fails&lt;/h4&gt;&lt;ul class=&quot;small&quot;&gt;&lt;li&gt;Shares (no principal to repay and no interest)&lt;/li&gt;&lt;li&gt;Convertible bonds, coupons linked to equity or commodity indices&lt;/li&gt;&lt;li&gt;Derivatives&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;Under IFRS 9, “interest” includes consideration for the time value of money, credit risk, other basic lending risks and costs, and a profit margin (IFRS 9 – 4.1.3(b), not reported in the slides). The IASB amendments of May 2024 clarified how to apply the test to cash flows linked to ESG targets: see &lt;a href=&quot;#s-fonti&quot;&gt;Further reading&lt;/a&gt;.&lt;/div&gt;

&lt;div class=&quot;widget&quot; id=&quot;clf&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Interactive tool&lt;/div&gt;&lt;h4&gt;Which category does the asset fall into?&lt;/h4&gt;
&lt;div class=&quot;grid g3&quot; style=&quot;gap:.6rem&quot;&gt;
&lt;label class=&quot;small&quot;&gt;Type of instrument&lt;br&gt;&lt;select data-k=&quot;t&quot;&gt;&lt;option value=&quot;d&quot;&gt;Debt instrument (loan, bond)&lt;/option&gt;&lt;option value=&quot;e&quot;&gt;Equity instrument (shares)&lt;/option&gt;&lt;option value=&quot;x&quot;&gt;Derivative&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
&lt;label class=&quot;small&quot;&gt;Business model&lt;br&gt;&lt;select data-k=&quot;bm&quot;&gt;&lt;option value=&quot;htc&quot;&gt;Hold to collect&lt;/option&gt;&lt;option value=&quot;hts&quot;&gt;Hold to collect and sell&lt;/option&gt;&lt;option value=&quot;oth&quot;&gt;Trading / other&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
&lt;label class=&quot;small&quot;&gt;SPPI test outcome&lt;br&gt;&lt;select data-k=&quot;sppi&quot;&gt;&lt;option value=&quot;1&quot;&gt;Passed&lt;/option&gt;&lt;option value=&quot;0&quot;&gt;Failed&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;p class=&quot;small&quot; style=&quot;margin:.6rem 0 0&quot;&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;fvo&quot;&gt; Fair value option to eliminate an &lt;em&gt;accounting mismatch&lt;/em&gt; [4.1.5]&lt;/label&gt;&lt;br&gt;
&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;oci&quot;&gt; Irrevocable OCI election for non-trading equity [4.1.4]&lt;/label&gt;&lt;/p&gt;
&lt;div class=&quot;res&quot;&gt;&lt;div class=&quot;big&quot; data-cat&gt;&lt;/div&gt;&lt;p class=&quot;small&quot; data-exp style=&quot;margin:.3rem 0 0&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Amortised cost (AC) &lt;span class=&quot;ref&quot;&gt;[4.1.2]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;An asset is measured at amortised cost if &lt;b&gt;both&lt;/b&gt;: (a) it is held within a &lt;b&gt;hold to collect&lt;/b&gt; business model; (b) its contractual terms give rise on specified dates to cash flows that are &lt;b&gt;solely principal and interest&lt;/b&gt; (SPPI test passed).&lt;/p&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Initial measurement&lt;/th&gt;&lt;th&gt;Subsequent measurement&lt;/th&gt;&lt;th&gt;Gains and losses&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fair value + transaction costs [5.1.1]&lt;/td&gt;&lt;td&gt;Amortised cost [5.2.1(a)]&lt;/td&gt;&lt;td&gt;In P&amp;amp;L when the asset is derecognised, reclassified, through the amortisation process or on impairment [5.7.2]&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Effective interest method&lt;/b&gt;&lt;br&gt;The method used to calculate the amortised cost of a financial asset or liability and to allocate interest income/expense in profit or loss over the relevant period [App. A]. Fees, points, transaction costs, premiums and discounts included in the effective rate are amortised over the expected life [B5.4.4].&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Effective interest rate (EIR)&lt;/b&gt;&lt;br&gt;The rate that &lt;b&gt;exactly discounts&lt;/b&gt; estimated future cash flows through the expected life to the &lt;b&gt;gross carrying amount&lt;/b&gt; of the asset (or to the amortised cost of the liability) [App. A].&lt;/div&gt;
&lt;/div&gt;
&lt;p style=&quot;text-align:center;font-family:var(--serif);font-size:1.15rem&quot;&gt;Initial amount = Σ&lt;sub&gt;t=1..n&lt;/sub&gt; cash flow&lt;sub&gt;t&lt;/sub&gt; / (1 + EIR)&lt;sup&gt;t&lt;/sup&gt; &amp;nbsp;·&amp;nbsp; CA&lt;sub&gt;t&lt;/sub&gt; = CA&lt;sub&gt;t−1&lt;/sub&gt; + CA&lt;sub&gt;t−1&lt;/sub&gt;·EIR − coupon received&lt;/p&gt;

&lt;div class=&quot;widget&quot; id=&quot;eir&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Slider chart&lt;/div&gt;&lt;h4&gt;Amortised cost of a bond with a nominal value of 1,000&lt;/h4&gt;
&lt;label class=&quot;rng&quot;&gt;Annual coupon (%)&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.25&quot; value=&quot;4&quot; data-k=&quot;c&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Purchase price (% of nominal)&lt;input type=&quot;range&quot; min=&quot;85&quot; max=&quot;115&quot; step=&quot;0.5&quot; value=&quot;95&quot; data-k=&quot;p&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Transaction costs (€)&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;40&quot; step=&quot;1&quot; value=&quot;10&quot; data-k=&quot;tc&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Term (years)&lt;input type=&quot;range&quot; min=&quot;2&quot; max=&quot;10&quot; step=&quot;1&quot; value=&quot;5&quot; data-k=&quot;n&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;div class=&quot;kpi&quot;&gt;&lt;div&gt;&lt;span&gt;Initial carrying amount&lt;/span&gt;&lt;b data-v0&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Effective interest rate (EIR)&lt;/span&gt;&lt;b data-r&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Total interest in P&amp;amp;L&lt;/span&gt;&lt;b data-it&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 640 200&quot; data-ch aria-label=&quot;Amortised cost converging towards the nominal value&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table class=&quot;small&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Year&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Opening CA&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Interest at EIR&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Coupon received&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Closing CA&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody data-tb&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;small muted&quot;&gt;The carrying amount converges to the nominal value: the discount (or premium) and the transaction costs are “spread” as interest. If you buy below par, the interest in P&amp;amp;L exceeds the coupons.&lt;/p&gt;
&lt;/div&gt;

&lt;details&gt;&lt;summary&gt;Interest rate benchmark reform (IBOR Phase 2) [5.4.5-5.4.9]&lt;/summary&gt;&lt;div&gt;
&lt;p class=&quot;small&quot;&gt;Context: the replacement of interbank offered rates (e.g. LIBOR, EONIA) with alternative benchmark rates. On &lt;b&gt;27 August 2020&lt;/b&gt; the IASB published &lt;em&gt;Interest Rate Benchmark Reform – Phase 2&lt;/em&gt; (amendments to IFRS 9, IAS 39, IFRS 7, IFRS 4, IFRS 16), endorsed in the EU by &lt;b&gt;Regulation (EU) 2021/25&lt;/b&gt; of 13 January 2021, to avoid sudden impacts on profit or loss and unnecessary discontinuation of hedging relationships.&lt;/p&gt;
&lt;ol class=&quot;steps small&quot;&gt;
&lt;li&gt;&lt;b&gt;When it applies:&lt;/b&gt; only if the basis for determining the contractual cash flows changes &lt;b&gt;as a result of the reform&lt;/b&gt;: by amending the contractual terms, in a way not contemplated by the contract (e.g. the method for calculating the benchmark changes), or by activating an existing clause (e.g. a &lt;em&gt;fallback clause&lt;/em&gt;) [5.4.6].&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practical expedient:&lt;/b&gt; the change is treated as a revision of a floating rate (B5.4.5), i.e. the EIR is updated with no gain or loss, if and only if it is a &lt;b&gt;direct consequence&lt;/b&gt; of the reform &lt;b&gt;and&lt;/b&gt; the new basis is &lt;b&gt;economically equivalent&lt;/b&gt; to the previous one [5.4.7].&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Examples of equivalence:&lt;/b&gt; replacement of the benchmark with an alternative rate plus a &lt;b&gt;fixed spread&lt;/b&gt; to compensate for the basis difference; changes to reset periods and dates or to the number of days between coupon payments; addition of a fallback clause [5.4.8].&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Additional changes:&lt;/b&gt; the expedient is first applied to the changes required by the reform, then the ordinary rules to the others (modification without derecognition: 5.4.3 or B5.4.6; with derecognition: derecognition rules) [5.4.9].&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;FVOCI &lt;span class=&quot;ref&quot;&gt;[4.1.2A]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;An asset is measured at FVOCI if &lt;b&gt;both&lt;/b&gt;: (a) it is held within a business model whose objective is achieved &lt;b&gt;both&lt;/b&gt; by collecting contractual cash flows &lt;b&gt;and&lt;/b&gt; by selling; (b) it passes the &lt;b&gt;SPPI test&lt;/b&gt;.&lt;/p&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Initial measurement&lt;/th&gt;&lt;th&gt;Subsequent measurement&lt;/th&gt;&lt;th&gt;Gains and losses&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fair value + transaction costs [5.1.1]&lt;/td&gt;&lt;td&gt;Fair value [5.2.1(b)]&lt;/td&gt;&lt;td&gt;In &lt;b&gt;OCI&lt;/b&gt;, except impairment and foreign exchange differences (in P&amp;amp;L), until derecognition or reclassification [5.7.10]; interest at EIR goes to P&amp;amp;L&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Debt at FVOCI: with “recycling”&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;On sale, the accumulated OCI reserve is &lt;b&gt;reclassified to profit or loss&lt;/b&gt; (&lt;em&gt;reclassification adjustment&lt;/em&gt;). In P&amp;amp;L the result is the same as under amortised cost; in the statement of financial position the asset is at fair value.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Equity at FVOCI: without recycling&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Shares do not pass the SPPI test, so in general they &lt;b&gt;cannot be held at FVOCI&lt;/b&gt;. However, for individual non-trading equity investments, an &lt;b&gt;irrevocable election at initial recognition&lt;/b&gt; can be made to present changes in fair value in OCI [4.1.4; 5.7.1(b); 5.7.5]. The gains will never pass through profit or loss: this has &lt;b&gt;displeased investors in innovative companies&lt;/b&gt;, who would have preferred to report in P&amp;amp;L the capital gains expected on disposal.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;FVTPL &lt;span class=&quot;ref&quot;&gt;[4.1.4-4.1.5]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;The residual category: all instruments other than eligible debt instruments, and those whose cash flows &lt;b&gt;fail the SPPI test&lt;/b&gt;. In addition, the &lt;b&gt;fair value option&lt;/b&gt;: at initial recognition an asset may be irrevocably designated at FVTPL if doing so eliminates or significantly reduces an &lt;span class=&quot;term&quot;&gt;accounting mismatch&lt;/span&gt; (a measurement or recognition inconsistency: e.g. an asset at AC funded by a liability measured at fair value).&lt;/p&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Initial measurement&lt;/th&gt;&lt;th&gt;Subsequent measurement&lt;/th&gt;&lt;th&gt;Gains and losses&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fair value [5.1.1] — transaction costs go &lt;b&gt;immediately to profit or loss&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Fair value [5.2.1(c)]&lt;/td&gt;&lt;td&gt;In &lt;b&gt;profit or loss&lt;/b&gt; [5.7.1]&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;

&lt;h3&gt;Financial liabilities&lt;/h3&gt;
&lt;p&gt;Liabilities are normally at &lt;b&gt;amortised cost&lt;/b&gt;; trading liabilities (including derivative liabilities) at FVTPL. A liability may be &lt;b&gt;designated at FVTPL&lt;/b&gt; at initial recognition, irrevocably, if [4.2.2]: it eliminates or reduces an accounting mismatch; &lt;b&gt;or&lt;/b&gt; a group of liabilities (or of assets and liabilities) is managed and its performance evaluated on a fair value basis in accordance with a documented risk management or investment strategy, with information provided internally to key management personnel (e.g. board of directors, CEO). In addition, if a contract contains embedded derivatives and the host is not an asset within IFRS 9, &lt;b&gt;the entire hybrid contract&lt;/b&gt; may be designated at FVTPL [4.3.5].&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;ocr&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;The own credit paradox · IFRS 9 – 5.7.7&lt;/div&gt;
&lt;h4&gt;Liability designated at FVTPL: what goes to OCI and what to P&amp;amp;L&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;If &lt;b&gt;your&lt;/b&gt; credit risk worsens, the fair value of your debt falls and — paradoxically — you would recognise a gain. For this reason IFRS 9 requires the part of the change attributable to &lt;b&gt;own credit risk&lt;/b&gt; to be presented in &lt;b&gt;OCI&lt;/b&gt;; the rest in &lt;b&gt;P&amp;amp;L&lt;/b&gt;.&lt;/p&gt;
&lt;label class=&quot;rng&quot;&gt;Total change in the fair value of the liability&lt;input type=&quot;range&quot; min=&quot;-200&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;-60&quot; data-k=&quot;tot&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;…of which attributable to own credit risk&lt;input type=&quot;range&quot; min=&quot;-200&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;-45&quot; data-k=&quot;cr&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;div class=&quot;kpi&quot;&gt;&lt;div&gt;&lt;span&gt;Effect in OCI&lt;/span&gt;&lt;b data-oci&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Effect in P&amp;amp;L&lt;/span&gt;&lt;b data-pl&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;small muted&quot; data-txt&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;The two summary tables from the slides&lt;/h3&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table class=&quot;small&quot;&gt;&lt;tr&gt;&lt;th&gt;Assets&lt;/th&gt;&lt;th&gt;Initial&lt;/th&gt;&lt;th&gt;Subsequent&lt;/th&gt;&lt;th&gt;Recognition&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Amortised cost&lt;/td&gt;&lt;td&gt;FV + costs&lt;/td&gt;&lt;td&gt;Amortised cost&lt;/td&gt;&lt;td&gt;Profit or loss&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FVOCI&lt;/td&gt;&lt;td&gt;FV + costs&lt;/td&gt;&lt;td&gt;Fair value&lt;/td&gt;&lt;td&gt;Equity (OCI)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FVTPL&lt;/td&gt;&lt;td&gt;FV&lt;/td&gt;&lt;td&gt;Fair value&lt;/td&gt;&lt;td&gt;Profit or loss&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table class=&quot;small&quot;&gt;&lt;tr&gt;&lt;th&gt;Liabilities&lt;/th&gt;&lt;th&gt;Initial&lt;/th&gt;&lt;th&gt;Subsequent&lt;/th&gt;&lt;th&gt;Recognition&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Trading (FVTPL)&lt;/td&gt;&lt;td&gt;FV&lt;/td&gt;&lt;td&gt;Fair value&lt;/td&gt;&lt;td&gt;Profit or loss&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Non-trading&lt;/td&gt;&lt;td&gt;FV + costs&lt;/td&gt;&lt;td&gt;Amortised cost&lt;/td&gt;&lt;td&gt;Profit or loss&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Reclassification &lt;span class=&quot;ref&quot;&gt;[4.4.1-4.4.2; 5.6]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;&lt;b&gt;When, and only when, the entity changes its business model&lt;/b&gt;, it reclassifies all affected assets. &lt;b&gt;Liabilities are never reclassified&lt;/b&gt;. The rule limits &lt;b&gt;earnings management&lt;/b&gt; (changing the business model at period-end to improve the result). Reclassification takes effect from the &lt;b&gt;first reporting period following&lt;/b&gt; the change (annual or quarterly), prospectively.&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;rcl&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Choose the reclassification&lt;/div&gt;
&lt;div style=&quot;display:flex;flex-wrap:wrap;gap:.4rem&quot; data-btns&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;div class=&quot;big&quot; data-h&gt;&lt;/div&gt;&lt;p data-t style=&quot;margin:.3rem 0 0&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · Classification and measurement&lt;/h3&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;1. A government bond passes the SPPI test and is held by the treasury to collect coupons and to sell when liquidity is needed. Category?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;AC&lt;/button&gt;&lt;button data-ok&gt;FVOCI&lt;/button&gt;&lt;button&gt;FVTPL&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;HTC&amp;amp;S business model + SPPI passed = FVOCI (4.1.2A).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;2. An entity elected the OCI option for a minority equity investment and sells it at a gain. Where does the gain go?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;To profit or loss at the time of sale&lt;/button&gt;&lt;button data-ok&gt;It remains in equity: no recycling to P&amp;amp;L&lt;/button&gt;&lt;button&gt;Half in OCI and half in P&amp;amp;L&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;For equity at FVOCI there is no recycling; only dividends go to P&amp;amp;L. The reserve may be transferred to retained earnings (as BNP Paribas does, Part 8).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;3. Can a financial liability be reclassified from amortised cost to FVTPL?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Yes, if the business model changes&lt;/button&gt;&lt;button data-ok&gt;No, never&lt;/button&gt;&lt;button&gt;Yes, by board resolution&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;IFRS 9 – 4.4.2: liabilities are not reclassified.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;4. A bond purchased below par at amortised cost: compared with the coupons received, the interest in P&amp;amp;L is…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Equal&lt;/button&gt;&lt;button data-ok&gt;Higher&lt;/button&gt;&lt;button&gt;Lower&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;The discount is amortised using the EIR and adds to the coupons as income (try it in the chart above).&lt;/p&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Open question: why are sales alone not enough to rule out hold to collect?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because the business model concerns the objective of managing the portfolio. Sales that are infrequent, insignificant or due to an increase in credit risk may be consistent with collecting cash flows; they must be considered together with their reasons and the conditions at the time (B4.1.2C).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 6 IMPAIRMENT ============ --&gt;
&lt;section id=&quot;s-impairment&quot; class=&quot;part brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Part 6&lt;/div&gt;&lt;h2&gt;Impairment test: from &lt;em&gt;incurred&lt;/em&gt; to &lt;em&gt;expected loss&lt;/em&gt; &lt;span class=&quot;ref&quot;&gt;[IFRS 9 – 5.5]&lt;/span&gt;&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;After the 2008 crisis, the IAS 39 &lt;span class=&quot;term&quot;&gt;incurred loss&lt;/span&gt; method (an asset is impaired only when the loss has already occurred) was criticised for the &lt;b&gt;delay&lt;/b&gt; with which losses emerged. IFRS 9 introduces the &lt;span class=&quot;term&quot;&gt;expected loss&lt;/span&gt; model: losses are estimated on a &lt;b&gt;forward-looking basis&lt;/b&gt;, and credit risk is already assessed at initial recognition, when the effective yield is determined.&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 760 170&quot; role=&quot;img&quot; aria-label=&quot;Timing comparison: under incurred loss the loss is recognised after default, under expected loss gradually beforehand&quot;&gt;
&lt;line class=&quot;axis&quot; x1=&quot;40&quot; y1=&quot;130&quot; x2=&quot;730&quot; y2=&quot;130&quot;/&gt;
&lt;text class=&quot;lbl&quot; x=&quot;40&quot; y=&quot;150&quot;&gt;origination&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;560&quot; y=&quot;150&quot;&gt;default&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;700&quot; y=&quot;150&quot;&gt;time&lt;/text&gt;
&lt;line x1=&quot;560&quot; y1=&quot;20&quot; x2=&quot;560&quot; y2=&quot;130&quot; style=&quot;stroke:var(--bad);stroke-dasharray:4 4&quot;/&gt;
&lt;polyline points=&quot;40,128 560,128 565,40 730,40&quot; fill=&quot;none&quot; style=&quot;stroke:var(--muted);stroke-width:2.5&quot;/&gt;
