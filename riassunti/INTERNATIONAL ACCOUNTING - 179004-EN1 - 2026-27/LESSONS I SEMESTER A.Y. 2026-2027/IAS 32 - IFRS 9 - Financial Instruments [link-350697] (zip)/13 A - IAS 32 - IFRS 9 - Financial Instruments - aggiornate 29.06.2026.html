&lt;!-- ============ 1 QUADRO ============ --&gt;
&lt;section id=&quot;s-quadro&quot; class=&quot;part slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Parte 1&lt;/div&gt;&lt;h2&gt;Il quadro normativo&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;Gli &lt;span class=&quot;term&quot;&gt;financial instruments&lt;/span&gt; (strumenti finanziari: crediti, titoli, azioni, debiti, derivati…) sono disciplinati da più principi che si dividono il lavoro. La lezione ne considera quattro:&lt;/p&gt;
&lt;div class=&quot;grid g4&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;IAS 32&lt;/span&gt;&lt;h4&gt;Presentation&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Come &lt;b&gt;presentare&lt;/b&gt; uno strumento: passività o patrimonio netto? Quando compensare attività e passività? Dove vanno interessi e dividendi?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;IFRS 9&lt;/span&gt;&lt;h4&gt;Financial Instruments&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Quando &lt;b&gt;rilevare&lt;/b&gt; ed eliminare, come &lt;b&gt;classificare e misurare&lt;/b&gt;, come calcolare l&#x27;&lt;b&gt;impairment&lt;/b&gt; e come fare &lt;b&gt;hedge accounting&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;IFRS 7&lt;/span&gt;&lt;h4&gt;Disclosures&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Quali &lt;b&gt;informazioni in nota&lt;/b&gt; dare su rilevanza degli strumenti e rischi (credito, liquidità, mercato).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;IAS 39&lt;/span&gt;&lt;h4&gt;Recognition &amp;amp; Measurement&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Il predecessore di IFRS 9, che lo ha sostituito &lt;b&gt;quasi completamente dal 1° gennaio 2018&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Le interpretazioni IFRIC collegate (citate nelle slide)&lt;/summary&gt;&lt;div&gt;
&lt;p class=&quot;small&quot;&gt;Le &lt;span class=&quot;term&quot;&gt;IFRIC Interpretations&lt;/span&gt; sono documenti dell&#x27;IFRS Interpretations Committee che chiariscono casi specifici di applicazione.&lt;/p&gt;
&lt;ul class=&quot;small&quot;&gt;
&lt;li&gt;&lt;b&gt;IFRIC 2&lt;/b&gt; – &lt;em&gt;Members&#x27; Shares in Cooperative Entities and Similar Instruments&lt;/em&gt;: quando le quote dei soci di una cooperativa sono equity e quando passività (rimborsabili su richiesta).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;IFRIC 16&lt;/b&gt; – &lt;em&gt;Hedges of a Net Investment in a Foreign Operation&lt;/em&gt;: la copertura dell&#x27;investimento netto in una gestione estera (vedi Parte 7).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;IFRIC 17&lt;/b&gt; – &lt;em&gt;Distributions of Non-cash Assets to Owners&lt;/em&gt;: dividendi pagati in beni diversi dal denaro.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;IFRIC 19&lt;/b&gt; – &lt;em&gt;Extinguishing Financial Liabilities with Equity Instruments&lt;/em&gt;: estinguere un debito emettendo azioni (&lt;em&gt;debt-for-equity swap&lt;/em&gt;).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;note&quot;&gt;Una regola utile: &lt;b&gt;IAS 32 guarda lo strumento dal lato di chi lo emette&lt;/b&gt; (è un mio debito o una quota del mio capitale?), &lt;b&gt;IFRS 9 dal lato di chi lo detiene o lo deve&lt;/b&gt; (come lo valuto nel tempo?). Le slide sottolineano che «tutti gli strumenti finanziari di IFRS 9 rientrano nell&#x27;applicazione dello IAS 32».&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 2 IAS 32 ============ --&gt;
&lt;section id=&quot;s-ias32&quot; class=&quot;part slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Parte 2&lt;/div&gt;&lt;h2&gt;IAS 32 – &lt;em&gt;Financial Instruments: Presentation&lt;/em&gt;&lt;/h2&gt;&lt;/header&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Objective&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[IAS 32.2]&lt;/span&gt;&lt;br&gt;Stabilire principi per presentare gli strumenti finanziari come &lt;b&gt;passività o patrimonio netto (equity)&lt;/b&gt; e per la &lt;b&gt;compensazione (offsetting)&lt;/b&gt; di attività e passività finanziarie. Si applica, &lt;em&gt;dalla prospettiva dell&#x27;emittente&lt;/em&gt;, alla classificazione in financial assets, financial liabilities ed equity instruments; alla classificazione di interessi, dividendi, perdite e utili; ai casi di compensazione.&lt;/div&gt;

&lt;h3&gt;Scope: tutto, tranne…&lt;/h3&gt;
&lt;p&gt;IAS 32 si applica da &lt;b&gt;tutte le entità a tutti i tipi di strumenti finanziari&lt;/b&gt;, salvo le esclusioni (par. 4-10), che rinviano ad altri principi. Scorri le linguette:&lt;/p&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Partecipazioni&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Benefici ai dipendenti&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Contratti assicurativi&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Share-based payment&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot;&gt;&lt;p&gt;Interessi in &lt;b&gt;subsidiaries, associates e joint ventures&lt;/b&gt; contabilizzati secondo &lt;b&gt;IFRS 10&lt;/b&gt; (consolidato), &lt;b&gt;IAS 27&lt;/b&gt; (bilancio separato) o &lt;b&gt;IAS 28&lt;/b&gt; (collegate e JV). Eccezione all&#x27;eccezione: se quei principi richiedono/permettono di usare IFRS 9, si applica anche IAS 32; e IAS 32 si applica sempre ai &lt;b&gt;derivati&lt;/b&gt; legati a tali partecipazioni.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Diritti e obblighi del datore di lavoro nei &lt;b&gt;piani per benefici ai dipendenti&lt;/b&gt;, disciplinati da &lt;b&gt;IAS 19&lt;/b&gt; &lt;em&gt;Employee Benefits&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Contratti assicurativi&lt;/b&gt; definiti da &lt;b&gt;IFRS 17&lt;/b&gt; (e contratti d&#x27;investimento con &lt;em&gt;discretionary participation features&lt;/em&gt;). IAS 32 però si applica a: derivati incorporati da scorporare secondo IFRS 9; componenti d&#x27;investimento separate; contratti di garanzia finanziaria se l&#x27;emittente applica IFRS 9; carte di credito e simili che rientrano in IFRS 9 [IFRS 17.7(h)]; contratti che limitano l&#x27;indennizzo all&#x27;importo dovuto, se l&#x27;entità sceglie IFRS 9 [IFRS 17.8A].&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; role=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Strumenti, contratti e obblighi in operazioni di &lt;b&gt;pagamento basato su azioni&lt;/b&gt;, disciplinati da &lt;b&gt;IFRS 2&lt;/b&gt; &lt;em&gt;Share-based Payment&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Le definizioni chiave &lt;span class=&quot;ref&quot;&gt;[IAS 32.11]&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Financial instrument&lt;/b&gt;&lt;br&gt;Qualsiasi &lt;b&gt;contratto&lt;/b&gt; che dà origine a un&#x27;&lt;b&gt;attività finanziaria per un&#x27;entità&lt;/b&gt; e, simmetricamente, a una &lt;b&gt;passività finanziaria o a uno strumento di capitale per un&#x27;altra entità&lt;/b&gt;.&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 760 150&quot; role=&quot;img&quot; aria-label=&quot;Schema: un contratto genera un&#x27;attività finanziaria da una parte e una passività o equity dall&#x27;altra&quot;&gt;
&lt;rect class=&quot;n-acc&quot; x=&quot;290&quot; y=&quot;8&quot; width=&quot;180&quot; height=&quot;40&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;33&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;Contratto&lt;/text&gt;
&lt;path class=&quot;edge&quot; d=&quot;M330 48 L140 92&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;edge&quot; d=&quot;M430 48 L620 92&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect class=&quot;n-box&quot; x=&quot;30&quot; y=&quot;94&quot; width=&quot;220&quot; height=&quot;48&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;140&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Entità A&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;133&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;financial asset&lt;/text&gt;
&lt;rect class=&quot;n-box&quot; x=&quot;510&quot; y=&quot;94&quot; width=&quot;220&quot; height=&quot;48&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;620&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Entità B&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;133&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;financial liability oppure equity&lt;/text&gt;
&lt;text x=&quot;380&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;lbl&quot;&gt;es. A detiene un&#x27;obbligazione / un&#x27;azione emessa da B&lt;/text&gt;
&lt;/svg&gt;

&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--good)&quot;&gt;&lt;h4&gt;Financial asset&lt;/h4&gt;&lt;ul class=&quot;small&quot;&gt;
&lt;li&gt;&lt;b&gt;cassa&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;&lt;b&gt;strumento di capitale di un&#x27;altra entità&lt;/b&gt; (es. azioni possedute);&lt;/li&gt;
&lt;li&gt;&lt;b&gt;diritto contrattuale&lt;/b&gt; a ricevere cassa/altra attività finanziaria, o a scambiare attività/passività finanziarie a condizioni &lt;b&gt;potenzialmente favorevoli&lt;/b&gt;;&lt;/li&gt;
&lt;li&gt;contratto regolato in &lt;b&gt;azioni proprie&lt;/b&gt; che è: un &lt;em&gt;non-derivative&lt;/em&gt; per cui l&#x27;entità riceverà un &lt;b&gt;numero variabile&lt;/b&gt; di azioni proprie, o un &lt;em&gt;derivative&lt;/em&gt; non regolato «importo fisso contro numero fisso».&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--bad)&quot;&gt;&lt;h4&gt;Financial liability&lt;/h4&gt;&lt;ul class=&quot;small&quot;&gt;
&lt;li&gt;&lt;b&gt;obbligazione contrattuale&lt;/b&gt; a consegnare cassa/altra attività finanziaria, o a scambiare a condizioni &lt;b&gt;potenzialmente sfavorevoli&lt;/b&gt;;&lt;/li&gt;
&lt;li&gt;contratto regolato in &lt;b&gt;azioni proprie&lt;/b&gt; che è: un &lt;em&gt;non-derivative&lt;/em&gt; che obbliga a consegnare un &lt;b&gt;numero variabile&lt;/b&gt; di azioni proprie, o un &lt;em&gt;derivative&lt;/em&gt; non «fixed-for-fixed».&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--ts)&quot;&gt;&lt;h4&gt;Equity instrument&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Qualsiasi contratto che evidenzia un &lt;b&gt;interesse residuo&lt;/b&gt; nelle attività dell&#x27;entità &lt;b&gt;dopo aver dedotto tutte le passività&lt;/b&gt;.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;È equity &lt;b&gt;se e solo se&lt;/b&gt; [IAS 32.16]: (a) non c&#x27;è &lt;b&gt;alcuna obbligazione contrattuale&lt;/b&gt; a consegnare cassa o a scambiare a condizioni sfavorevoli; (b) se regolato in azioni proprie, è un non-derivato senza obbligo di consegnare un numero variabile di azioni, o un derivato regolato solo scambiando un &lt;b&gt;importo fisso&lt;/b&gt; per un &lt;b&gt;numero fisso&lt;/b&gt; di azioni proprie.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;note&quot;&gt;Perché il &lt;span class=&quot;term&quot;&gt;fixed-for-fixed&lt;/span&gt; (importo fisso contro numero fisso di azioni) conta? Se devo consegnare un numero &lt;b&gt;variabile&lt;/b&gt; di azioni pari, ad esempio, a 1.000 € di valore, uso le mie azioni come una «moneta»: il creditore riceve sempre 1.000 € e non partecipa al rischio residuo dell&#x27;impresa, quindi economicamente è un debito. Se invece consegno 100 azioni contro 1.000 € fissi (come in un warrant classico), chi le riceve sopporta il rischio del valore dell&#x27;azione come un socio: è equity. Esempio classico: le &lt;b&gt;azioni privilegiate rimborsabili obbligatoriamente&lt;/b&gt; a una data fissa sono passività anche se si chiamano «azioni», perché c&#x27;è un obbligo di pagare.&lt;/div&gt;

&lt;div class=&quot;widget tree&quot; id=&quot;tree-de&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Strumento interattivo&lt;/div&gt;&lt;h4&gt;Debito o equity? Classifica uno strumento dal lato dell&#x27;emittente&lt;/h4&gt;
&lt;div class=&quot;tbody&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3 id=&quot;ias32-der&quot;&gt;Derivative ed embedded derivative &lt;span class=&quot;ref&quot;&gt;[IFRS 9 – App. A; 4.3.1]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Le slide di IAS 32 richiamano la definizione di &lt;span class=&quot;term&quot;&gt;derivative&lt;/span&gt; (strumento derivato) contenuta in IFRS 9. Servono &lt;b&gt;tutte e tre&lt;/b&gt; le caratteristiche:&lt;/p&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;&lt;b&gt;Il valore cambia in risposta a una variabile&lt;/b&gt; (l&#x27;&lt;span class=&quot;term&quot;&gt;underlying&lt;/span&gt;, sottostante): tasso d&#x27;interesse, prezzo di uno strumento o di una commodity, cambio, indice, rating… Se la variabile è non finanziaria, non dev&#x27;essere specifica di una parte del contratto.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Nessun investimento netto iniziale&lt;/b&gt;, o uno &lt;b&gt;inferiore&lt;/b&gt; a quello richiesto da contratti con risposta simile ai fattori di mercato (la leva tipica dei derivati).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;È regolato a una data futura.&lt;/b&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Derivato di negoziazione (trading)&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Scopo: &lt;b&gt;trarre profitto dall&#x27;andamento del fair value&lt;/b&gt;, cioè dal posizionamento sui parametri (indici, tassi, valute) da cui deriva il valore.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Derivato di copertura (hedging)&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Scopo: &lt;b&gt;fronteggiare rischi&lt;/b&gt; di variazioni avverse nel &lt;b&gt;fair value&lt;/b&gt; o nei &lt;b&gt;cash flows&lt;/b&gt; dell&#x27;attività o passività coperta (Parte 7).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Embedded derivative&lt;/b&gt;&lt;br&gt;Componente di un &lt;span class=&quot;term&quot;&gt;hybrid contract&lt;/span&gt; (contratto ibrido) che include anche un &lt;b&gt;host&lt;/b&gt; non derivato (il contratto «ospite»), tale che alcuni flussi dello strumento combinato variano come quelli di un derivato autonomo. Esempio: un&#x27;obbligazione la cui cedola è indicizzata a un indice azionario, o un prestito convertibile.&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;Il &lt;span class=&quot;term&quot;&gt;fair value&lt;/span&gt; (valore equo) è il prezzo che si riceverebbe per vendere un&#x27;attività, o si pagherebbe per trasferire una passività, in una transazione ordinaria tra operatori di mercato alla data di valutazione (definizione di IFRS 13, non contenuta nelle slide).&lt;/div&gt;

&lt;h3 id=&quot;ias32-treasury&quot;&gt;Treasury shares &lt;span class=&quot;ref&quot;&gt;[IAS 32.33-34]&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div&gt;&lt;p&gt;Le &lt;span class=&quot;term&quot;&gt;treasury shares&lt;/span&gt; (&lt;em&gt;azioni proprie&lt;/em&gt;) riacquistate dall&#x27;entità, o da altre società del gruppo consolidato:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;sono &lt;b&gt;dedotte dal patrimonio netto&lt;/b&gt;, non iscritte come attività;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;nessun utile o perdita&lt;/b&gt; a conto economico su acquisto, vendita, emissione o annullamento;&lt;/li&gt;
&lt;li&gt;il corrispettivo pagato o ricevuto è rilevato &lt;b&gt;direttamente a equity&lt;/b&gt;.&lt;/li&gt;&lt;/ul&gt;
&lt;p class=&quot;small&quot;&gt;&lt;b&gt;Eccezione [IAS 32.33A]:&lt;/b&gt; se le azioni proprie sono detenute in un fondo d&#x27;investimento gestito dall&#x27;entità o come &lt;em&gt;underlying items&lt;/em&gt; di contratti assicurativi a partecipazione diretta, l&#x27;entità può scegliere (in modo irrevocabile, strumento per strumento) di non dedurle e trattarle come attività finanziarie a FVTPL.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Esempio&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Una società con capitale e riserve di 10.000 riacquista azioni proprie per 300, poi le rivende a 350.&lt;/p&gt;
&lt;table class=&quot;small&quot;&gt;&lt;tr&gt;&lt;th&gt;Evento&lt;/th&gt;&lt;th&gt;Effetto&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Acquisto 300&lt;/td&gt;&lt;td&gt;Equity −300 (riserva negativa per azioni proprie), cassa −300&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Vendita a 350&lt;/td&gt;&lt;td&gt;Equity +350 (i +50 restano in una riserva), cassa +350. &lt;b&gt;Nessun utile a P&amp;amp;L.&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p class=&quot;small&quot;&gt;Presentazione: con &lt;b&gt;IFRS 18&lt;/b&gt; (che sostituisce IAS 1) l&#x27;importo è presentato separatamente nel prospetto della situazione patrimoniale-finanziaria o nel prospetto delle variazioni di patrimonio netto, oppure indicato nelle note.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Interessi, dividendi, utili e perdite &lt;span class=&quot;ref&quot;&gt;[IAS 32.35]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;La classificazione dello strumento &lt;b&gt;trascina con sé&lt;/b&gt; quella dei suoi rendimenti:&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 760 130&quot; role=&quot;img&quot; aria-label=&quot;Se lo strumento è passività i rendimenti vanno a conto economico; se è equity vanno a patrimonio netto&quot;&gt;
&lt;rect class=&quot;n-box&quot; x=&quot;10&quot; y=&quot;15&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Financial liability&lt;/text&gt;
&lt;path class=&quot;edge&quot; d=&quot;M230 37 L300 37&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect class=&quot;n-acc&quot; x=&quot;302&quot; y=&quot;10&quot; width=&quot;440&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;522&quot; y=&quot;33&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;interessi, dividendi, utili e perdite&lt;/text&gt;&lt;text x=&quot;522&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;→ proventi/oneri in profit or loss&lt;/text&gt;
&lt;rect class=&quot;n-box&quot; x=&quot;10&quot; y=&quot;75&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Equity instrument&lt;/text&gt;
&lt;path class=&quot;edge&quot; d=&quot;M230 97 L300 97&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect class=&quot;n-acc&quot; x=&quot;302&quot; y=&quot;70&quot; width=&quot;440&quot; height=&quot;54&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;522&quot; y=&quot;93&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;distribuzioni ai detentori e costi di transazione&lt;/text&gt;&lt;text x=&quot;522&quot; y=&quot;111&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;→ direttamente in equity (in diminuzione)&lt;/text&gt;
&lt;/svg&gt;
&lt;p class=&quot;small&quot;&gt;Conseguenza: i «dividendi» su azioni privilegiate classificate come passività sono &lt;b&gt;interessi passivi&lt;/b&gt; a conto economico; i costi di un aumento di capitale (notaio, banche) riducono il patrimonio netto, non passano dal conto economico.&lt;/p&gt;

&lt;h3&gt;Offsetting &lt;span class=&quot;ref&quot;&gt;[IAS 32.42]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Un&#x27;attività e una passività finanziaria si &lt;b&gt;compensano&lt;/b&gt; e si presenta il saldo netto &lt;b&gt;se e solo se&lt;/b&gt; l&#x27;entità:&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;(a)&lt;/b&gt; ha &lt;b&gt;attualmente&lt;/b&gt; un &lt;b&gt;diritto legalmente esercitabile&lt;/b&gt; di compensare gli importi; &lt;b&gt;e&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;box&quot;&gt;&lt;b&gt;(b)&lt;/b&gt; &lt;b&gt;intende&lt;/b&gt; regolare su base netta, oppure realizzare l&#x27;attività ed estinguere la passività simultaneamente.&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Se un trasferimento di attività &lt;b&gt;non&lt;/b&gt; supera i test di derecognition, attività trasferita e passività associata &lt;b&gt;non si compensano&lt;/b&gt;. È il caso della &lt;span class=&quot;term&quot;&gt;cessione di crediti «salvo buon fine» (sbf)&lt;/span&gt;: il rischio d&#x27;incasso resta al cedente, quindi il credito resta tra le attività e l&#x27;anticipo ricevuto dalla banca va tra le passività.&lt;/p&gt;

&lt;h3&gt;Proposed amendments: il progetto FICE&lt;/h3&gt;
&lt;p&gt;L&#x27;IASB ha pubblicato il &lt;b&gt;29 novembre 2023&lt;/b&gt; un &lt;span class=&quot;term&quot;&gt;Exposure Draft&lt;/span&gt; (bozza in consultazione) per affrontare le difficoltà con gli strumenti che hanno &lt;b&gt;caratteristiche sia di debito sia di capitale&lt;/b&gt;. IAS 32 funziona bene per la maggior parte degli strumenti, ma questi sono diventati più complessi e le soluzioni divergenti delle imprese rendono difficile per gli investitori confrontare posizione e performance. Le proposte modificherebbero IAS 32, IFRS 7 e IAS 1:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;b&gt;chiarire i principi di classificazione&lt;/b&gt; di IAS 32 per distinguere debito ed equity;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;nuove disclosure&lt;/b&gt; sulle complessità degli strumenti ibridi;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;nuova presentazione&lt;/b&gt; degli importi (profit e total comprehensive income) attribuibili agli &lt;b&gt;azionisti ordinari&lt;/b&gt;, separati da quelli attribuibili ad altri titolari di strumenti di equity.&lt;/li&gt;&lt;/ul&gt;
&lt;p class=&quot;small muted&quot;&gt;Stato del progetto aggiornato con fonte esterna nella sezione &lt;a href=&quot;#s-fonti&quot;&gt;Per approfondire&lt;/a&gt;.&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · IAS 32&lt;/h3&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;1. Un&#x27;entità emette azioni privilegiate che deve rimborsare obbligatoriamente tra 5 anni al valore nominale. Come le classifica?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Equity, perché sono azioni&lt;/button&gt;&lt;button data-ok&gt;Financial liability&lt;/button&gt;&lt;button&gt;Strumento composto al 50%&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;C&#x27;è un&#x27;&lt;b&gt;obbligazione contrattuale a consegnare cassa&lt;/b&gt;: manca la condizione (a) di IAS 32.16. La forma giuridica non conta, conta la sostanza.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;2. Un&#x27;entità riacquista azioni proprie a 500 e le rivende a 450. Che cosa rileva a conto economico?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Una perdita di 50&lt;/button&gt;&lt;button data-ok&gt;Nulla: la differenza resta nel patrimonio netto&lt;/button&gt;&lt;button&gt;Una perdita di 500 al riacquisto&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;IAS 32.33: nessun utile o perdita sulle operazioni su azioni proprie; il corrispettivo va direttamente a equity.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;3. Quale coppia di condizioni permette l&#x27;offsetting?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Stessa controparte e stessa scadenza&lt;/button&gt;&lt;button data-ok&gt;Diritto legale attualmente esercitabile + intenzione di regolare al netto (o simultaneamente)&lt;/button&gt;&lt;button&gt;Solo l&#x27;intenzione di regolare al netto&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;Servono entrambe (IAS 32.42). La sola intenzione o la stessa controparte non bastano.&lt;/p&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Domanda aperta: un warrant che dà diritto a ricevere 100 azioni dell&#x27;emittente pagando 10 € l&#x27;una è equity o passività per l&#x27;emittente?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;È &lt;b&gt;equity&lt;/b&gt;: è un derivato regolato scambiando un &lt;b&gt;importo fisso&lt;/b&gt; di cassa (1.000 €) con un &lt;b&gt;numero fisso&lt;/b&gt; di azioni proprie (100). Se il numero di azioni fosse variabile (es. «azioni per un valore di 1.000 €»), sarebbe una passività (o attività) finanziaria derivata.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 3 PERCHE IFRS 9 ============ --&gt;
&lt;section id=&quot;s-perche&quot; class=&quot;part ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Parte 3&lt;/div&gt;&lt;h2&gt;IFRS 9 – perché ha sostituito IAS 39&lt;/h2&gt;&lt;/header&gt;
&lt;p class=&quot;lead&quot;&gt;Dal &lt;b&gt;1° gennaio 2018&lt;/b&gt; IFRS 9 ha sostituito quasi completamente IAS 39 come principio di riferimento per la &lt;em&gt;recognition and measurement&lt;/em&gt; degli strumenti finanziari.&lt;/p&gt;
&lt;h3&gt;Le ragioni del cambiamento&lt;/h3&gt;
&lt;p&gt;Scorri i passi: ognuno è un difetto di IAS 39 che la crisi finanziaria del 2008 ha reso evidente.&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;why-steps&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Passi da scorrere&lt;/div&gt;
&lt;div class=&quot;stepview&quot;&gt;&lt;/div&gt;
&lt;div style=&quot;display:flex;gap:.5rem;align-items:center;margin-top:.8rem&quot;&gt;&lt;button class=&quot;btn&quot; data-d=&quot;-1&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-d=&quot;1&quot;&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;small muted&quot; data-pos&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;I tre pilastri del nuovo principio&lt;/h3&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;a class=&quot;card&quot; href=&quot;#s-classificazione&quot; style=&quot;text-decoration:none;color:inherit;border-top:4px solid oklch(60% 0.12 85)&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Pilastro 1&lt;/span&gt;&lt;h4&gt;Classification &amp;amp; Measurement&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Approccio logico che riflette il &lt;b&gt;business model&lt;/b&gt; e le &lt;b&gt;caratteristiche dei cash flows&lt;/b&gt;.&lt;/p&gt;&lt;/a&gt;
&lt;a class=&quot;card&quot; href=&quot;#s-impairment&quot; style=&quot;text-decoration:none;color:inherit;border-top:4px solid oklch(55% 0.14 25)&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Pilastro 2&lt;/span&gt;&lt;h4&gt;Impairment test&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;b&gt;Expected loss model&lt;/b&gt; applicabile a tutti gli strumenti finanziari.&lt;/p&gt;&lt;/a&gt;
&lt;a class=&quot;card&quot; href=&quot;#s-hedge&quot; style=&quot;text-decoration:none;color:inherit;border-top:4px solid oklch(55% 0.1 150)&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Pilastro 3&lt;/span&gt;&lt;h4&gt;Hedge accounting&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Contabilizzazione dei &lt;b&gt;derivati&lt;/b&gt; di copertura più vicina al risk management.&lt;/p&gt;&lt;/a&gt;
&lt;/div&gt;

&lt;h3&gt;Da quattro a tre categorie&lt;/h3&gt;
&lt;p&gt;IFRS 9 elimina la «quadripartizione» di IAS 39 e riduce le categorie delle attività finanziarie.&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-label=&quot;Corrispondenza indicativa tra le quattro categorie IAS 39 e le tre categorie IFRS 9&quot;&gt;
&lt;text x=&quot;130&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;IAS 39&lt;/text&gt;&lt;text x=&quot;630&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;IFRS 9&lt;/text&gt;
&lt;rect class=&quot;n-box&quot; x=&quot;20&quot; y=&quot;35&quot; width=&quot;220&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Held to maturity (HTM)&lt;/text&gt;
&lt;rect class=&quot;n-box&quot; x=&quot;20&quot; y=&quot;85&quot; width=&quot;220&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Loans and receivables (L&amp;amp;R)&lt;/text&gt;
&lt;rect class=&quot;n-box&quot; x=&quot;20&quot; y=&quot;135&quot; width=&quot;220&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Available for sale (AFS)&lt;/text&gt;
&lt;rect class=&quot;n-box&quot; x=&quot;20&quot; y=&quot;185&quot; width=&quot;220&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;Fair value through P&amp;amp;L&lt;/text&gt;
&lt;rect class=&quot;n-acc&quot; x=&quot;520&quot; y=&quot;55&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;630&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Amortised Cost (AC)&lt;/text&gt;
&lt;rect class=&quot;n-acc&quot; x=&quot;520&quot; y=&quot;125&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;630&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;FVOCI&lt;/text&gt;
&lt;rect class=&quot;n-acc&quot; x=&quot;520&quot; y=&quot;190&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;630&quot; y=&quot;217&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;FVTPL&lt;/text&gt;
&lt;path class=&quot;edge d&quot; d=&quot;M240 55 L518 75&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;edge d&quot; d=&quot;M240 105 L518 80&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;path class=&quot;edge d&quot; d=&quot;M240 155 L518 147&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path class=&quot;edge d&quot; d=&quot;M240 205 L518 212&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;text class=&quot;lbl&quot; x=&quot;380&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot;&gt;corrispondenza solo indicativa: in IFRS 9 decidono business model e SPPI test, non l&#x27;etichetta&lt;/text&gt;
&lt;/svg&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Objective di IFRS 9&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[IFRS 9 – 1.1]&lt;/span&gt;&lt;br&gt;Stabilire principi per il financial reporting di attività e passività finanziarie che diano informazioni rilevanti e utili per valutare &lt;b&gt;importo, tempistica e incertezza&lt;/b&gt; (&lt;em&gt;amounts, timing and uncertainty&lt;/em&gt;) dei flussi di cassa futuri dell&#x27;entità.&lt;/div&gt;

&lt;details&gt;&lt;summary&gt;Scope di IFRS 9: le esclusioni [IFRS 9 – 2.1]&lt;/summary&gt;&lt;div&gt;
&lt;p class=&quot;small&quot;&gt;Si applica a tutte le entità e a tutti gli strumenti finanziari, &lt;b&gt;eccetto&lt;/b&gt;:&lt;/p&gt;
&lt;ul class=&quot;small&quot;&gt;
&lt;li&gt;partecipazioni in controllate, collegate e JV contabilizzate secondo IFRS 10, IAS 27, IAS 28 (ma IFRS 9 si applica ai derivati su tali partecipazioni, salvo che siano equity dell&#x27;entità secondo IAS 32);&lt;/li&gt;
&lt;li&gt;diritti e obblighi derivanti da &lt;b&gt;leasing&lt;/b&gt; (IFRS 16);&lt;/li&gt;
&lt;li&gt;piani per &lt;b&gt;benefici ai dipendenti&lt;/b&gt; (IAS 19);&lt;/li&gt;
&lt;li&gt;strumenti emessi dall&#x27;entità che sono &lt;b&gt;equity secondo IAS 32&lt;/b&gt; (incluse opzioni e warrant);&lt;/li&gt;
&lt;li&gt;contratti assicurativi IFRS 17 (con le stesse eccezioni viste per IAS 32: derivati incorporati, componenti d&#x27;investimento, garanzie finanziarie, carte di credito, contratti ex IFRS 17.8A);&lt;/li&gt;
&lt;li&gt;&lt;b&gt;forward&lt;/b&gt; tra acquirente e venditore per una futura &lt;b&gt;business combination&lt;/b&gt; (IFRS 3);&lt;/li&gt;
&lt;li&gt;&lt;b&gt;loan commitments&lt;/b&gt; diversi da quelli descritti nel principio;&lt;/li&gt;
&lt;li&gt;pagamenti basati su azioni (IFRS 2);&lt;/li&gt;
&lt;li&gt;diritti a rimborsi per spese necessarie a estinguere una passività rilevata come &lt;b&gt;accantonamento&lt;/b&gt; (IAS 37);&lt;/li&gt;
&lt;li&gt;diritti e obblighi nell&#x27;ambito di &lt;b&gt;IFRS 15&lt;/b&gt; (ricavi da contratti con clienti), salvo quelli che IFRS 15 rinvia a IFRS 9.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Perché IFRS 9&lt;/h3&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;1. Qual era la critica principale al modello di impairment di IAS 39?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Rilevava le perdite troppo presto&lt;/button&gt;&lt;button data-ok&gt;Rilevava le perdite solo a evento avvenuto (incurred loss), troppo tardi e in modo prociclico&lt;/button&gt;&lt;button&gt;Non permetteva di svalutare i crediti&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;L&#x27;&lt;em&gt;incurred loss&lt;/em&gt; attendeva un &lt;em&gt;trigger event&lt;/em&gt; (mai definito con precisione): le perdite emergevano in ritardo, amplificando il ciclo economico.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;2. Quale di queste NON è una categoria di attività finanziarie in IFRS 9?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Amortised cost&lt;/button&gt;&lt;button data-ok&gt;Available for sale&lt;/button&gt;&lt;button&gt;FVTPL&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;AFS è una categoria di IAS 39, eliminata insieme a HTM e L&amp;amp;R.&lt;/p&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Domanda aperta: in che senso il fair value accounting può «accelerare l&#x27;effetto prociclico»?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In una crisi i mercati diventano illiquidi e i prezzi crollano: valutare a fair value fa emergere perdite che riducono il capitale delle banche, che allora vendono attività e riducono il credito, deprimendo ancora i prezzi. Senza un mercato attivo, inoltre, i valori di fair value diventano poco affidabili.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 4 RECOGNITION ============ --&gt;
&lt;section id=&quot;s-rilevazione&quot; class=&quot;part sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Parte 4&lt;/div&gt;&lt;h2&gt;Recognition e derecognition &lt;span class=&quot;ref&quot;&gt;[IFRS 9 – 3.1-3.3]&lt;/span&gt;&lt;/h2&gt;&lt;/header&gt;

&lt;h3&gt;Initial recognition&lt;/h3&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Quando?&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[3.1.1]&lt;/span&gt;&lt;br&gt;Un&#x27;attività o passività finanziaria si rileva &lt;b&gt;quando, e solo quando, l&#x27;entità diventa parte delle clausole contrattuali&lt;/b&gt; dello strumento.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;A quale valore?&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[5.1.1]&lt;/span&gt;&lt;br&gt;&lt;b&gt;Fair value&lt;/b&gt;, più o meno — se lo strumento &lt;b&gt;non&lt;/b&gt; è a FVTPL — i &lt;span class=&quot;term&quot;&gt;transaction costs&lt;/span&gt; (costi di transazione: commissioni, spese di intermediazione) &lt;b&gt;direttamente attribuibili&lt;/b&gt;.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;Perché i costi di transazione non si capitalizzano a FVTPL? Perché alla prima valutazione a fair value sparirebbero comunque: sono spesati subito a conto economico. Per AC e FVOCI invece entrano nel costo e vengono «spalmati» con il tasso d&#x27;interesse effettivo (Parte 5).&lt;/div&gt;

&lt;h3&gt;Regular way purchase or sale: trade date o settlement date &lt;span class=&quot;ref&quot;&gt;[3.1.2; B3.1.3-B3.1.6]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Un acquisto/vendita &lt;span class=&quot;term&quot;&gt;regular way&lt;/span&gt; (secondo le tempistiche standard del mercato) si rileva con la &lt;b&gt;trade date accounting&lt;/b&gt; o la &lt;b&gt;settlement date accounting&lt;/b&gt;, applicando &lt;b&gt;lo stesso metodo in modo coerente&lt;/b&gt; a tutte le attività classificate nello stesso modo.&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Trade date&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Data in cui l&#x27;entità &lt;b&gt;si impegna&lt;/b&gt; a comprare o vendere. Si rilevano l&#x27;attività da ricevere e la passività per pagarla; in vendita si elimina l&#x27;attività, si rileva l&#x27;utile/perdita e il credito verso l&#x27;acquirente. Gli interessi di norma maturano solo dalla settlement date.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Settlement date&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Data in cui l&#x27;attività è &lt;b&gt;consegnata&lt;/b&gt;. Si rileva l&#x27;attività quando è ricevuta e la si elimina quando è consegnata. Le variazioni di fair value tra trade e settlement date si contabilizzano &lt;b&gt;come per l&#x27;attività acquistata&lt;/b&gt; (cioè secondo la sua categoria).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;widget&quot; id=&quot;tsd&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Esempio interattivo · da Alexander &amp;amp; Archer (2017), ripreso nelle slide&lt;/div&gt;
&lt;h4&gt;Acquisto a 1.000 il 29.12.X1 · fair value 1.002 al 31.12.X1 (chiusura) · 1.003 al 4.1.X2 (regolamento)&lt;/h4&gt;
&lt;div style=&quot;display:flex;flex-wrap:wrap;gap:1rem;margin:.4rem 0&quot;&gt;
&lt;div&gt;&lt;div class=&quot;small muted&quot;&gt;Metodo&lt;/div&gt;&lt;button class=&quot;btn on&quot; data-m=&quot;t&quot;&gt;Trade date&lt;/button&gt; &lt;button class=&quot;btn&quot; data-m=&quot;s&quot;&gt;Settlement date&lt;/button&gt;&lt;/div&gt;
&lt;div&gt;&lt;div class=&quot;small muted&quot;&gt;Categoria (etichette IAS 39 → IFRS 9)&lt;/div&gt;&lt;button class=&quot;btn on&quot; data-c=&quot;0&quot;&gt;HTM → AC&lt;/button&gt; &lt;button class=&quot;btn&quot; data-c=&quot;1&quot;&gt;AFS → FVOCI&lt;/button&gt; &lt;button class=&quot;btn&quot; data-c=&quot;2&quot;&gt;FVTPL&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Saldi (parentesi = avere)&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;29.12.X1&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;31.12.X1&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;4.1.X2&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody data-body&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;small&quot; data-com&gt;&lt;/p&gt;
&lt;p class=&quot;small muted&quot;&gt;Nella tabella «settlement date» delle slide la riga del 4.1.X2 è etichettata «Receivable»: a quella data l&#x27;attività è ricevuta, qui è indicata come «Financial asset». I saldi non mostrano la cassa pagata al regolamento.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Derecognition delle attività finanziarie &lt;span class=&quot;ref&quot;&gt;[3.2.3-3.2.9]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Un&#x27;attività si elimina (&lt;span class=&quot;term&quot;&gt;derecognition&lt;/span&gt;: cancellazione dallo stato patrimoniale) &lt;b&gt;quando, e solo quando&lt;/b&gt;:&lt;/p&gt;
&lt;ol&gt;&lt;li&gt;i diritti contrattuali ai flussi di cassa &lt;b&gt;scadono&lt;/b&gt; (&lt;em&gt;expire&lt;/em&gt;), oppure&lt;/li&gt;
&lt;li&gt;l&#x27;entità &lt;b&gt;trasferisce&lt;/b&gt; l&#x27;attività e il trasferimento &lt;b&gt;qualifica&lt;/b&gt; per la derecognition. Si ha trasferimento se l&#x27;entità: (a) trasferisce i diritti a ricevere i flussi, &lt;b&gt;oppure&lt;/b&gt; (b) li mantiene ma assume l&#x27;obbligo di girarli ad altri in un accordo che rispetta tre condizioni (&lt;span class=&quot;term&quot;&gt;pass-through arrangement&lt;/span&gt;).&lt;/li&gt;&lt;/ol&gt;
&lt;details&gt;&lt;summary&gt;Le tre condizioni del pass-through [3.2.5]&lt;/summary&gt;&lt;div&gt;
&lt;ol class=&quot;small&quot;&gt;
&lt;li&gt;&lt;b&gt;Nessun obbligo di pagare&lt;/b&gt; ai beneficiari finali importi che non incassa dall&#x27;attività originaria (anticipi a breve con pieno recupero più interessi a tassi di mercato sono ammessi).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Divieto di vendere o dare in pegno&lt;/b&gt; l&#x27;attività originaria, se non come garanzia a favore dei beneficiari finali.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Obbligo di girare i flussi incassati senza ritardi significativi&lt;/b&gt;; nel frattempo può reinvestirli solo in cassa o equivalenti (IAS 7), passando anche gli interessi maturati ai beneficiari.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h4&gt;Il cuore del test: rischi e benefici (risks and rewards)&lt;/h4&gt;
&lt;p&gt;L&#x27;entità ha &lt;b&gt;mantenuto&lt;/b&gt; sostanzialmente tutti i rischi e benefici se la sua esposizione alla variabilità del valore attuale dei flussi netti futuri &lt;b&gt;non cambia in modo significativo&lt;/b&gt; con il trasferimento (es. vendita con patto di riacquisto a prezzo fisso o al prezzo di vendita più un rendimento da prestatore). Li ha &lt;b&gt;trasferiti&lt;/b&gt; se tale esposizione non è più significativa (es. vendita con sola opzione di riacquisto al fair value del momento, o cessione di una quota pienamente proporzionale come una &lt;em&gt;loan sub-participation&lt;/em&gt;) [3.2.7].&lt;/p&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--good)&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Sì&lt;/span&gt;&lt;p class=&quot;small&quot;&gt;Trasferiti &lt;b&gt;sostanzialmente tutti&lt;/b&gt; → &lt;b&gt;derecognition&lt;/b&gt;; si rilevano separatamente diritti e obblighi creati o mantenuti.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--ts)&quot;&gt;&lt;span class=&quot;tag&quot;&gt;No&lt;/span&gt;&lt;p class=&quot;small&quot;&gt;Mantenuti &lt;b&gt;sostanzialmente tutti&lt;/b&gt; → l&#x27;attività &lt;b&gt;resta in bilancio&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--acc)&quot;&gt;&lt;span class=&quot;tag&quot;&gt;In parte&lt;/span&gt;&lt;p class=&quot;small&quot;&gt;Né trasferiti né mantenuti → conta il &lt;b&gt;controllo&lt;/b&gt;: se il cessionario può vendere l&#x27;attività intera a un terzo, unilateralmente e senza restrizioni, il controllo non è mantenuto [3.2.9].&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Quando la derecognition avviene: l&#x27;utile o la perdita &lt;span class=&quot;ref&quot;&gt;[3.2.12]&lt;/span&gt;&lt;/h4&gt;
&lt;p&gt;Eliminando l&#x27;attività per intero, va a &lt;b&gt;profit or loss&lt;/b&gt; la differenza tra il &lt;b&gt;carrying amount&lt;/b&gt; (valore contabile alla data di eliminazione) e il &lt;b&gt;corrispettivo ricevuto&lt;/b&gt; (inclusa ogni nuova attività ottenuta, meno ogni nuova passività assunta).&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;gl&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Calcolatore con cursori&lt;/div&gt;
&lt;label class=&quot;rng&quot;&gt;Carrying amount&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;1000&quot; data-k=&quot;ca&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Cassa ricevuta&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;950&quot; data-k=&quot;cash&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Nuova attività ottenuta&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;300&quot; step=&quot;5&quot; value=&quot;40&quot; data-k=&quot;na&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Nuova passività assunta&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;300&quot; step=&quot;5&quot; value=&quot;10&quot; data-k=&quot;nl&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;small&quot;&gt;Utile/perdita a conto economico = (cassa + nuova attività − nuova passività) − carrying amount&lt;/span&gt;&lt;div class=&quot;big&quot; data-out&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;details&gt;&lt;summary&gt;Trasferimento di una parte di un&#x27;attività più grande [3.2.13-3.2.14] · esempio svolto&lt;/summary&gt;&lt;div&gt;
&lt;p class=&quot;small&quot;&gt;Il carrying amount dell&#x27;attività intera si ripartisce tra parte eliminata e parte mantenuta in base ai &lt;b&gt;fair value relativi&lt;/b&gt; alla data del trasferimento (un &lt;em&gt;servicing asset&lt;/em&gt; mantenuto conta come parte mantenuta). Se manca un prezzo per la parte mantenuta, la sua migliore stima di fair value è: &lt;b&gt;FV dell&#x27;attività intera − corrispettivo ricevuto per la parte ceduta&lt;/b&gt;.&lt;/p&gt;
&lt;table class=&quot;small&quot;&gt;&lt;tr&gt;&lt;th&gt;Dati&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Carrying amount del portafoglio prestiti&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.000&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fair value dell&#x27;intero portafoglio&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.150&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Corrispettivo per una quota proporzionale ceduta (60%)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;690&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FV parte mantenuta = 1.150 − 690&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;460&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Carrying amount allocato alla parte ceduta = 1.000 × 690/1.150&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;600&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Utile a P&amp;amp;L = 690 − 600&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;90&lt;/th&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p class=&quot;small muted&quot;&gt;Numeri inventati a scopo didattico.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Trasferimenti che NON qualificano &lt;span class=&quot;ref&quot;&gt;[3.2.15]&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Se l&#x27;entità ha mantenuto sostanzialmente tutti i rischi e benefici, &lt;b&gt;continua a rilevare l&#x27;attività per intero&lt;/b&gt; e rileva una &lt;b&gt;passività finanziaria&lt;/b&gt; per il corrispettivo ricevuto. Nei periodi successivi rileva i proventi sull&#x27;attività e gli oneri sulla passività. È la logica della cessione sbf vista in IAS 32: in sostanza un finanziamento garantito.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Continuing involvement &lt;span class=&quot;ref&quot;&gt;[3.2.16-3.2.17]&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Se rischi e benefici sono solo in parte trasferiti e il controllo è mantenuto, l&#x27;attività resta in bilancio &lt;b&gt;nella misura in cui l&#x27;entità resta esposta&lt;/b&gt; alle variazioni del suo valore, insieme a una &lt;b&gt;passività associata&lt;/b&gt;. Il netto tra le due è: il costo ammortizzato dei diritti e obblighi mantenuti (se l&#x27;attività è ad AC) oppure il loro fair value considerato a sé (se l&#x27;attività è a fair value).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;a) Garanzia&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;b) Opzione&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;c) Opzione cash-settled&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;&lt;p class=&quot;small&quot;&gt;Se il coinvolgimento è una &lt;b&gt;garanzia&lt;/b&gt; sull&#x27;attività trasferita, la misura è il &lt;b&gt;minore&lt;/b&gt; tra l&#x27;importo dell&#x27;attività e il massimo del corrispettivo che potrebbe dover restituire (&lt;em&gt;guarantee amount&lt;/em&gt;). Es.: crediti per 1.000 ceduti garantendo perdite fino a 50 → continuing involvement 50.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p class=&quot;small&quot;&gt;Se è un&#x27;&lt;b&gt;opzione scritta o acquistata&lt;/b&gt; (o entrambe), la misura è l&#x27;&lt;b&gt;importo dell&#x27;attività che l&#x27;entità può riacquistare&lt;/b&gt;. Con una &lt;em&gt;written put&lt;/em&gt; su un&#x27;attività a fair value, la misura è limitata al &lt;b&gt;minore tra fair value dell&#x27;attività e prezzo d&#x27;esercizio&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p class=&quot;small&quot;&gt;Se è un&#x27;opzione &lt;b&gt;regolata per cassa&lt;/b&gt; o simile, la misura si determina come per le opzioni non cash-settled del caso (b).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Derecognition delle passività finanziarie &lt;span class=&quot;ref&quot;&gt;[3.3.1-3.3.5]&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div&gt;&lt;p&gt;Una passività (o parte di essa) si elimina &lt;b&gt;quando, e solo quando, è estinta&lt;/b&gt;: l&#x27;obbligo è &lt;em&gt;extinguished&lt;/em&gt;, &lt;em&gt;discharged&lt;/em&gt; (adempiuto), &lt;em&gt;cancelled&lt;/em&gt; o &lt;em&gt;expired&lt;/em&gt;.&lt;/p&gt;&lt;p&gt;La differenza tra il &lt;b&gt;carrying amount&lt;/b&gt; della passività estinta o trasferita e il &lt;b&gt;corrispettivo pagato&lt;/b&gt; (incluse attività non monetarie trasferite o passività assunte) va a &lt;b&gt;profit or loss&lt;/b&gt; [3.3.3].&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;&lt;b&gt;Esempio:&lt;/b&gt; obbligazione emessa con carrying amount 1.000 riacquistata sul mercato a 970 → utile 30.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Eccezione [3.3.5]&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Se un fondo gestito dall&#x27;entità, o gli &lt;em&gt;underlying items&lt;/em&gt; di contratti assicurativi a partecipazione diretta, riacquistano una passività dell&#x27;entità (es. un suo bond), l&#x27;entità può scegliere — in modo irrevocabile, strumento per strumento — di &lt;b&gt;non eliminarla&lt;/b&gt; e di trattare lo strumento riacquistato come attività a FVTPL. È lo specchio dell&#x27;eccezione IAS 32.33A sulle azioni proprie.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Recognition e derecognition&lt;/h3&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;1. Un&#x27;attività classificata a FVTPL viene acquistata a 1.000 più 15 di commissioni. Qual è il valore di prima iscrizione?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;1.015&lt;/button&gt;&lt;button data-ok&gt;1.000, con 15 spesati a conto economico&lt;/button&gt;&lt;button&gt;985&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;A FVTPL i costi di transazione non si capitalizzano (IFRS 9 – 5.1.1).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;2. Una banca vende un titolo con l&#x27;impegno di riacquistarlo tra 3 mesi a prezzo fisso (repo). Cosa succede?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Derecognition, perché il titolo è stato venduto&lt;/button&gt;&lt;button data-ok&gt;Il titolo resta in bilancio e si rileva una passività per il corrispettivo ricevuto&lt;/button&gt;&lt;button&gt;Continuing involvement per metà&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;Con il riacquisto a prezzo fisso la banca mantiene sostanzialmente tutti i rischi e benefici (3.2.7): il trasferimento non qualifica (3.2.15).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;3. Con la settlement date accounting, dove vanno i +2 di variazione di fair value tra trade date e chiusura per un&#x27;attività a FVOCI?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;A conto economico&lt;/button&gt;&lt;button data-ok&gt;In OCI (patrimonio netto), con un credito di 2 in attivo&lt;/button&gt;&lt;button&gt;Non si rilevano&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;B3.1.6: la variazione si contabilizza come per l&#x27;attività acquistata. Per l&#x27;AC invece non si rileva nulla.&lt;/p&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Domanda aperta: perché nel diagramma «Sì» alla domanda sul trasferimento dei diritti salta il test pass-through?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché se l&#x27;entità ha trasferito i diritti contrattuali a ricevere i flussi ha già realizzato un «trasferimento» ai sensi di 3.2.4(a); il test pass-through (3.2.5) serve solo quando i diritti vengono mantenuti ma i flussi sono girati ad altri. In entrambi i casi si passa poi al test su rischi e benefici.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 5 CLASSIFICATION ============ --&gt;
&lt;section id=&quot;s-classificazione&quot; class=&quot;part ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Parte 5&lt;/div&gt;&lt;h2&gt;Classification and measurement&lt;/h2&gt;&lt;/header&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;La regola generale&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[IFRS 9 – 4.1.1]&lt;/span&gt;&lt;br&gt;Le attività finanziarie si classificano come misurate successivamente al &lt;b&gt;costo ammortizzato (AC)&lt;/b&gt;, al &lt;b&gt;fair value through other comprehensive income (FVOCI)&lt;/b&gt; o al &lt;b&gt;fair value through profit or loss (FVTPL)&lt;/b&gt;, sulla base di &lt;b&gt;entrambi&lt;/b&gt;: (a) il &lt;b&gt;business model&lt;/b&gt; dell&#x27;entità per gestirle e (b) le &lt;b&gt;caratteristiche dei flussi contrattuali&lt;/b&gt; dell&#x27;attività.&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;Glossario: &lt;span class=&quot;term&quot;&gt;OCI – other comprehensive income&lt;/span&gt; è la parte del risultato complessivo che non passa dal conto economico ma va direttamente in una riserva di patrimonio netto; &lt;span class=&quot;term&quot;&gt;profit or loss (P&amp;amp;L)&lt;/span&gt; è il conto economico.&lt;/p&gt;

&lt;h3&gt;Test 1 · Il business model &lt;span class=&quot;ref&quot;&gt;[B4.1.2-B4.1.2C]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Il business model è il &lt;b&gt;modo in cui l&#x27;entità gestisce gli strumenti finanziari per generare flussi di cassa&lt;/b&gt;. In sostanza due domande: gli strumenti sono detenuti &lt;b&gt;solo per incassare i flussi&lt;/b&gt;? O anche per &lt;b&gt;venderli&lt;/b&gt;?&lt;/p&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Livello di portafoglio&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Non si definisce per singola attività ma per &lt;b&gt;portafogli omogenei&lt;/b&gt;; un&#x27;entità può avere più business model e quindi sotto-portafogli diversi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Un fatto, non un&#x27;affermazione&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;È &lt;em&gt;a matter of fact&lt;/em&gt;, osservabile dalle attività svolte. Serve &lt;b&gt;giudizio&lt;/b&gt; e &lt;b&gt;tutte le evidenze&lt;/b&gt; disponibili alla data di valutazione, non un singolo fattore.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Le evidenze tipiche&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Come la performance è &lt;b&gt;valutata e comunicata&lt;/b&gt; al key management; quali &lt;b&gt;rischi&lt;/b&gt; incidono e come sono gestiti; come sono &lt;b&gt;remunerati i manager&lt;/b&gt; (su fair value o su flussi incassati?).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Hold to collect&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Hold to collect and sell&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Altri (trading)&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Detenere per incassare i flussi contrattuali&lt;/b&gt; (&lt;em&gt;held to collect&lt;/em&gt;, HTC): le attività sono gestite per realizzare i flussi incassando i pagamenti contrattuali lungo la vita dello strumento. Per verificarlo si considerano &lt;b&gt;frequenza, valore e tempistica delle vendite passate&lt;/b&gt;, le loro ragioni e le attese di vendite future. Ma le vendite &lt;b&gt;da sole non determinano&lt;/b&gt; il business model: vanno lette nel contesto delle ragioni e delle condizioni del momento rispetto a quelle attuali. Esempio: una banca che eroga mutui e li tiene fino a scadenza.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Incassare i flussi e vendere&lt;/b&gt; (HTC&amp;amp;S): entrambe le attività sono essenziali per l&#x27;obiettivo. Esempio: la tesoreria di una banca che detiene titoli di Stato per gestire la liquidità, vendendoli quando serve.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Tutto ciò che non è HTC né HTC&amp;amp;S, in particolare la &lt;b&gt;negoziazione&lt;/b&gt; (&lt;em&gt;held for trading&lt;/em&gt;) o la gestione su base fair value: conduce a &lt;b&gt;FVTPL&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Test 2 · SPPI test &lt;span class=&quot;ref&quot;&gt;[B4.1.7]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Si analizza la composizione dei flussi attesi dallo strumento. Se sono &lt;b&gt;solo&lt;/b&gt; rimborso del &lt;b&gt;capitale&lt;/b&gt; e/o maturazione di &lt;b&gt;interessi&lt;/b&gt; sul capitale residuo, lo &lt;span class=&quot;term&quot;&gt;SPPI test – Solely Payments of Principal and Interest&lt;/span&gt; è superato.&lt;/p&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--good)&quot;&gt;&lt;h4&gt;Di solito supera&lt;/h4&gt;&lt;ul class=&quot;small&quot;&gt;&lt;li&gt;Mutuo a tasso fisso o variabile (es. Euribor + spread)&lt;/li&gt;&lt;li&gt;Obbligazione «plain vanilla»&lt;/li&gt;&lt;li&gt;Crediti commerciali&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--bad)&quot;&gt;&lt;h4&gt;Di solito non supera&lt;/h4&gt;&lt;ul class=&quot;small&quot;&gt;&lt;li&gt;Azioni (nessun capitale da rimborsare né interesse)&lt;/li&gt;&lt;li&gt;Obbligazioni convertibili, cedole legate a indici azionari o commodity&lt;/li&gt;&lt;li&gt;Derivati&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;Nell&#x27;«interesse» IFRS 9 include il compenso per valore temporale del denaro, rischio di credito, altri rischi e costi tipici di un prestito e un margine di profitto (IFRS 9 – 4.1.3(b), non riportato nelle slide). Le modifiche IASB di maggio 2024 hanno chiarito come applicare il test a flussi legati a obiettivi ESG: vedi &lt;a href=&quot;#s-fonti&quot;&gt;Per approfondire&lt;/a&gt;.&lt;/div&gt;

&lt;div class=&quot;widget&quot; id=&quot;clf&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Strumento interattivo&lt;/div&gt;&lt;h4&gt;In quale categoria finisce l&#x27;attività?&lt;/h4&gt;
&lt;div class=&quot;grid g3&quot; style=&quot;gap:.6rem&quot;&gt;
&lt;label class=&quot;small&quot;&gt;Tipo di strumento&lt;br&gt;&lt;select data-k=&quot;t&quot;&gt;&lt;option value=&quot;d&quot;&gt;Strumento di debito (prestito, bond)&lt;/option&gt;&lt;option value=&quot;e&quot;&gt;Strumento di capitale (azioni)&lt;/option&gt;&lt;option value=&quot;x&quot;&gt;Derivato&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
&lt;label class=&quot;small&quot;&gt;Business model&lt;br&gt;&lt;select data-k=&quot;bm&quot;&gt;&lt;option value=&quot;htc&quot;&gt;Hold to collect&lt;/option&gt;&lt;option value=&quot;hts&quot;&gt;Hold to collect and sell&lt;/option&gt;&lt;option value=&quot;oth&quot;&gt;Trading / altro&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
&lt;label class=&quot;small&quot;&gt;Esito SPPI test&lt;br&gt;&lt;select data-k=&quot;sppi&quot;&gt;&lt;option value=&quot;1&quot;&gt;Superato&lt;/option&gt;&lt;option value=&quot;0&quot;&gt;Non superato&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;p class=&quot;small&quot; style=&quot;margin:.6rem 0 0&quot;&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;fvo&quot;&gt; Fair value option per eliminare un &lt;em&gt;accounting mismatch&lt;/em&gt; [4.1.5]&lt;/label&gt;&lt;br&gt;
&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;oci&quot;&gt; Scelta irrevocabile OCI per azioni non di trading [4.1.4]&lt;/label&gt;&lt;/p&gt;
&lt;div class=&quot;res&quot;&gt;&lt;div class=&quot;big&quot; data-cat&gt;&lt;/div&gt;&lt;p class=&quot;small&quot; data-exp style=&quot;margin:.3rem 0 0&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Amortised cost (AC) &lt;span class=&quot;ref&quot;&gt;[4.1.2]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Un&#x27;attività si misura al costo ammortizzato se &lt;b&gt;entrambe&lt;/b&gt;: (a) è detenuta in un business model &lt;b&gt;hold to collect&lt;/b&gt;; (b) i termini contrattuali generano a date specificate flussi che sono &lt;b&gt;solo capitale e interessi&lt;/b&gt; (SPPI superato).&lt;/p&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Initial measurement&lt;/th&gt;&lt;th&gt;Subsequent measurement&lt;/th&gt;&lt;th&gt;Gains and losses&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fair value + transaction costs [5.1.1]&lt;/td&gt;&lt;td&gt;Amortised cost [5.2.1(a)]&lt;/td&gt;&lt;td&gt;A P&amp;amp;L quando l&#x27;attività è eliminata, riclassificata, tramite il processo di ammortamento o per l&#x27;impairment [5.7.2]&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Effective interest method&lt;/b&gt;&lt;br&gt;Metodo per calcolare il costo ammortizzato di un&#x27;attività o passività e per allocare gli interessi attivi/passivi a conto economico nel periodo [App. A]. Commissioni, punti, costi di transazione, premi e sconti inclusi nel tasso effettivo si ammortizzano lungo la vita attesa [B5.4.4].&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Effective interest rate (EIR)&lt;/b&gt;&lt;br&gt;Il tasso che &lt;b&gt;attualizza esattamente&lt;/b&gt; i flussi futuri stimati lungo la vita attesa al &lt;b&gt;gross carrying amount&lt;/b&gt; dell&#x27;attività (o al costo ammortizzato della passività) [App. A].&lt;/div&gt;
&lt;/div&gt;
&lt;p style=&quot;text-align:center;font-family:var(--serif);font-size:1.15rem&quot;&gt;Valore iniziale = Σ&lt;sub&gt;t=1..n&lt;/sub&gt; flusso&lt;sub&gt;t&lt;/sub&gt; / (1 + EIR)&lt;sup&gt;t&lt;/sup&gt; &amp;nbsp;·&amp;nbsp; CA&lt;sub&gt;t&lt;/sub&gt; = CA&lt;sub&gt;t−1&lt;/sub&gt; + CA&lt;sub&gt;t−1&lt;/sub&gt;·EIR − cedola incassata&lt;/p&gt;

&lt;div class=&quot;widget&quot; id=&quot;eir&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Grafico con cursori&lt;/div&gt;&lt;h4&gt;Costo ammortizzato di un&#x27;obbligazione da 1.000 di nominale&lt;/h4&gt;
&lt;label class=&quot;rng&quot;&gt;Cedola annua (%)&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.25&quot; value=&quot;4&quot; data-k=&quot;c&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Prezzo d&#x27;acquisto (% del nominale)&lt;input type=&quot;range&quot; min=&quot;85&quot; max=&quot;115&quot; step=&quot;0.5&quot; value=&quot;95&quot; data-k=&quot;p&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Costi di transazione (€)&lt;input type=&quot;range&quot; min=&quot;0&quot; max=&quot;40&quot; step=&quot;1&quot; value=&quot;10&quot; data-k=&quot;tc&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Durata (anni)&lt;input type=&quot;range&quot; min=&quot;2&quot; max=&quot;10&quot; step=&quot;1&quot; value=&quot;5&quot; data-k=&quot;n&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;div class=&quot;kpi&quot;&gt;&lt;div&gt;&lt;span&gt;Valore d&#x27;iscrizione&lt;/span&gt;&lt;b data-v0&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Tasso effettivo (EIR)&lt;/span&gt;&lt;b data-r&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Interessi totali a P&amp;amp;L&lt;/span&gt;&lt;b data-it&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 640 200&quot; data-ch aria-label=&quot;Andamento del costo ammortizzato verso il valore nominale&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table class=&quot;small&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Anno&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;CA iniziale&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Interessi a EIR&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Cedola incassata&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;CA finale&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody data-tb&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;small muted&quot;&gt;Il valore contabile converge al nominale: lo sconto (o il premio) e i costi di transazione vengono «spalmati» come interessi. Se compri sotto la pari, gli interessi a P&amp;amp;L superano le cedole.&lt;/p&gt;
&lt;/div&gt;

&lt;details&gt;&lt;summary&gt;Interest rate benchmark reform (IBOR Phase 2) [5.4.5-5.4.9]&lt;/summary&gt;&lt;div&gt;
&lt;p class=&quot;small&quot;&gt;Contesto: la sostituzione dei tassi di riferimento interbancari (es. LIBOR, EONIA) con tassi alternativi. L&#x27;IASB ha pubblicato il &lt;b&gt;27 agosto 2020&lt;/b&gt; &lt;em&gt;Interest Rate Benchmark Reform – Phase 2&lt;/em&gt; (modifiche a IFRS 9, IAS 39, IFRS 7, IFRS 4, IFRS 16), recepite nell&#x27;UE dal &lt;b&gt;Regolamento (UE) 2021/25&lt;/b&gt; del 13 gennaio 2021, per evitare impatti improvvisi sul conto economico e interruzioni non necessarie delle coperture.&lt;/p&gt;
&lt;ol class=&quot;steps small&quot;&gt;
&lt;li&gt;&lt;b&gt;Quando si applica:&lt;/b&gt; solo se cambia la base di determinazione dei flussi &lt;b&gt;a causa della riforma&lt;/b&gt;: modificando i termini contrattuali, in un modo non previsto dal contratto (es. cambia il metodo di calcolo del benchmark), o attivando una clausola esistente (es. una &lt;em&gt;fallback clause&lt;/em&gt;) [5.4.6].&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Practical expedient:&lt;/b&gt; il cambiamento si tratta come una revisione di un tasso variabile (B5.4.5), cioè si aggiorna l&#x27;EIR senza utili o perdite, se e solo se è &lt;b&gt;conseguenza diretta&lt;/b&gt; della riforma &lt;b&gt;e&lt;/b&gt; la nuova base è &lt;b&gt;economicamente equivalente&lt;/b&gt; alla precedente [5.4.7].&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Esempi di equivalenza:&lt;/b&gt; sostituzione del benchmark con un tasso alternativo più uno &lt;b&gt;spread fisso&lt;/b&gt; che compensa la differenza di base; modifiche a periodi e date di reset o ai giorni tra cedole; aggiunta di una clausola di fallback [5.4.8].&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Modifiche ulteriori:&lt;/b&gt; prima si applica l&#x27;expedient alle modifiche richieste dalla riforma, poi le regole ordinarie alle altre (modifica senza derecognition: 5.4.3 o B5.4.6; con derecognition: regole di eliminazione) [5.4.9].&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;FVOCI &lt;span class=&quot;ref&quot;&gt;[4.1.2A]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Un&#x27;attività si misura a FVOCI se &lt;b&gt;entrambe&lt;/b&gt;: (a) è detenuta in un business model il cui obiettivo è raggiunto &lt;b&gt;sia&lt;/b&gt; incassando i flussi contrattuali &lt;b&gt;sia&lt;/b&gt; vendendo; (b) supera lo &lt;b&gt;SPPI test&lt;/b&gt;.&lt;/p&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Initial measurement&lt;/th&gt;&lt;th&gt;Subsequent measurement&lt;/th&gt;&lt;th&gt;Gains and losses&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fair value + transaction costs [5.1.1]&lt;/td&gt;&lt;td&gt;Fair value [5.2.1(b)]&lt;/td&gt;&lt;td&gt;In &lt;b&gt;OCI&lt;/b&gt;, tranne impairment e differenze di cambio (a P&amp;amp;L), fino a derecognition o riclassificazione [5.7.10]; gli interessi a EIR vanno a P&amp;amp;L&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Debito a FVOCI: con «recycling»&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Alla vendita la riserva OCI accumulata è &lt;b&gt;riversata a conto economico&lt;/b&gt; (&lt;em&gt;reclassification adjustment&lt;/em&gt;). A P&amp;amp;L il risultato è lo stesso che si avrebbe al costo ammortizzato; in stato patrimoniale l&#x27;attività è a fair value.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Azioni a FVOCI: senza recycling&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Le azioni non superano lo SPPI, quindi in generale &lt;b&gt;non possono stare in FVOCI&lt;/b&gt;. Però per singoli investimenti azionari non di trading si può fare una &lt;b&gt;scelta irrevocabile alla prima iscrizione&lt;/b&gt; di presentare le variazioni di fair value in OCI [4.1.4; 5.7.1(b); 5.7.5]. Le plusvalenze non passeranno mai dal conto economico: questo ha &lt;b&gt;scontentato gli investitori in imprese innovative&lt;/b&gt;, che avrebbero preferito far emergere a P&amp;amp;L i capital gain sperati alla cessione.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;FVTPL &lt;span class=&quot;ref&quot;&gt;[4.1.4-4.1.5]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Categoria residuale: tutti gli strumenti diversi da quelli di debito idonei, e quelli i cui flussi &lt;b&gt;non superano lo SPPI test&lt;/b&gt;. Inoltre &lt;b&gt;fair value option&lt;/b&gt;: alla prima iscrizione si può designare irrevocabilmente un&#x27;attività a FVTPL se ciò elimina o riduce significativamente un &lt;span class=&quot;term&quot;&gt;accounting mismatch&lt;/span&gt; (incoerenza di misurazione o rilevazione: es. un&#x27;attività ad AC finanziata da una passività valutata a fair value).&lt;/p&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Initial measurement&lt;/th&gt;&lt;th&gt;Subsequent measurement&lt;/th&gt;&lt;th&gt;Gains and losses&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Fair value [5.1.1] — i costi di transazione vanno &lt;b&gt;subito a conto economico&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Fair value [5.2.1(c)]&lt;/td&gt;&lt;td&gt;In &lt;b&gt;profit or loss&lt;/b&gt; [5.7.1]&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;

&lt;h3&gt;Passività finanziarie&lt;/h3&gt;
&lt;p&gt;Le passività sono di norma al &lt;b&gt;costo ammortizzato&lt;/b&gt;; quelle di trading (inclusi i derivati passivi) a FVTPL. Una passività si può &lt;b&gt;designare a FVTPL&lt;/b&gt; alla prima iscrizione, in modo irrevocabile, se [4.2.2]: elimina o riduce un accounting mismatch; &lt;b&gt;oppure&lt;/b&gt; un gruppo di passività (o di attività e passività) è gestito e valutato a fair value secondo una strategia documentata di risk management o d&#x27;investimento, con informativa interna al key management (es. consiglio di amministrazione, CEO). Inoltre, se un contratto contiene derivati incorporati e l&#x27;host non è un&#x27;attività di IFRS 9, si può designare &lt;b&gt;l&#x27;intero contratto ibrido&lt;/b&gt; a FVTPL [4.3.5].&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;ocr&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Il paradosso del proprio merito di credito · IFRS 9 – 5.7.7&lt;/div&gt;
&lt;h4&gt;Passività designata a FVTPL: cosa va in OCI e cosa a P&amp;amp;L&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;Se il &lt;b&gt;tuo&lt;/b&gt; rischio di credito peggiora, il fair value del tuo debito scende e — paradossalmente — rileveresti un utile. Per questo IFRS 9 impone che la parte di variazione dovuta al &lt;b&gt;proprio rischio di credito&lt;/b&gt; vada in &lt;b&gt;OCI&lt;/b&gt;; il resto a &lt;b&gt;P&amp;amp;L&lt;/b&gt;.&lt;/p&gt;
&lt;label class=&quot;rng&quot;&gt;Variazione totale del fair value della passività&lt;input type=&quot;range&quot; min=&quot;-200&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;-60&quot; data-k=&quot;tot&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;…di cui dovuta al proprio rischio di credito&lt;input type=&quot;range&quot; min=&quot;-200&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;-45&quot; data-k=&quot;cr&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;div class=&quot;kpi&quot;&gt;&lt;div&gt;&lt;span&gt;Effetto in OCI&lt;/span&gt;&lt;b data-oci&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Effetto a P&amp;amp;L&lt;/span&gt;&lt;b data-pl&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;small muted&quot; data-txt&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Le due tabelle riassuntive delle slide&lt;/h3&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table class=&quot;small&quot;&gt;&lt;tr&gt;&lt;th&gt;Attività&lt;/th&gt;&lt;th&gt;Iniziale&lt;/th&gt;&lt;th&gt;Successiva&lt;/th&gt;&lt;th&gt;Rilevazione&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Amortised cost&lt;/td&gt;&lt;td&gt;FV + costi&lt;/td&gt;&lt;td&gt;Costo ammortizzato&lt;/td&gt;&lt;td&gt;Conto economico&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FVOCI&lt;/td&gt;&lt;td&gt;FV + costi&lt;/td&gt;&lt;td&gt;Fair value&lt;/td&gt;&lt;td&gt;Patrimonio netto (OCI)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FVTPL&lt;/td&gt;&lt;td&gt;FV&lt;/td&gt;&lt;td&gt;Fair value&lt;/td&gt;&lt;td&gt;Conto economico&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table class=&quot;small&quot;&gt;&lt;tr&gt;&lt;th&gt;Passività&lt;/th&gt;&lt;th&gt;Iniziale&lt;/th&gt;&lt;th&gt;Successiva&lt;/th&gt;&lt;th&gt;Rilevazione&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Trading (FVTPL)&lt;/td&gt;&lt;td&gt;FV&lt;/td&gt;&lt;td&gt;Fair value&lt;/td&gt;&lt;td&gt;Conto economico&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Non trading&lt;/td&gt;&lt;td&gt;FV + costi&lt;/td&gt;&lt;td&gt;Costo ammortizzato&lt;/td&gt;&lt;td&gt;Conto economico&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Reclassification &lt;span class=&quot;ref&quot;&gt;[4.4.1-4.4.2; 5.6]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;&lt;b&gt;Quando, e solo quando, l&#x27;entità cambia il business model&lt;/b&gt;, riclassifica tutte le attività interessate. Le &lt;b&gt;passività non si riclassificano mai&lt;/b&gt;. La regola limita le &lt;b&gt;politiche di bilancio&lt;/b&gt; (cambiare business model a fine periodo per migliorare il risultato). La riclassificazione produce effetti dal &lt;b&gt;primo reporting period successivo&lt;/b&gt; al cambiamento (annuale o trimestrale), in modo prospettico.&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;rcl&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Scegli la riclassificazione&lt;/div&gt;
&lt;div style=&quot;display:flex;flex-wrap:wrap;gap:.4rem&quot; data-btns&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;div class=&quot;big&quot; data-h&gt;&lt;/div&gt;&lt;p data-t style=&quot;margin:.3rem 0 0&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Classification and measurement&lt;/h3&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;1. Un titolo di Stato supera lo SPPI test ed è detenuto dalla tesoreria per incassare cedole e vendere quando serve liquidità. Categoria?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;AC&lt;/button&gt;&lt;button data-ok&gt;FVOCI&lt;/button&gt;&lt;button&gt;FVTPL&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;Business model HTC&amp;amp;S + SPPI superato = FVOCI (4.1.2A).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;2. Un&#x27;entità ha scelto l&#x27;opzione OCI per una partecipazione azionaria minoritaria e la vende con una plusvalenza. Dove va la plusvalenza?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;A conto economico al momento della vendita&lt;/button&gt;&lt;button data-ok&gt;Resta nel patrimonio netto: nessun recycling a P&amp;amp;L&lt;/button&gt;&lt;button&gt;Metà in OCI e metà a P&amp;amp;L&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;Per le azioni a FVOCI non c&#x27;è recycling; a P&amp;amp;L vanno solo i dividendi. La riserva può essere girata a utili portati a nuovo (come fa BNP Paribas, Parte 8).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;3. Si può riclassificare una passività finanziaria da costo ammortizzato a FVTPL?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Sì, se cambia il business model&lt;/button&gt;&lt;button data-ok&gt;No, mai&lt;/button&gt;&lt;button&gt;Sì, con delibera del CdA&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;IFRS 9 – 4.4.2: le passività non si riclassificano.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;4. Un&#x27;obbligazione acquistata sotto la pari al costo ammortizzato: gli interessi a P&amp;amp;L rispetto alle cedole incassate sono…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Uguali&lt;/button&gt;&lt;button data-ok&gt;Maggiori&lt;/button&gt;&lt;button&gt;Minori&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;Lo sconto viene ammortizzato con l&#x27;EIR e si aggiunge alle cedole come provento (prova nel grafico sopra).&lt;/p&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Domanda aperta: perché le vendite da sole non bastano a escludere l&#x27;hold to collect?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché il business model riguarda l&#x27;obiettivo di gestione del portafoglio. Vendite rare, non significative o dovute a un aumento del rischio di credito possono essere coerenti con l&#x27;incasso dei flussi; vanno lette insieme alle loro ragioni e alle condizioni del momento (B4.1.2C).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 6 IMPAIRMENT ============ --&gt;
&lt;section id=&quot;s-impairment&quot; class=&quot;part brick&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Parte 6&lt;/div&gt;&lt;h2&gt;Impairment test: dall&#x27;&lt;em&gt;incurred&lt;/em&gt; all&#x27;&lt;em&gt;expected loss&lt;/em&gt; &lt;span class=&quot;ref&quot;&gt;[IFRS 9 – 5.5]&lt;/span&gt;&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;Dopo la crisi del 2008 il metodo dell&#x27;&lt;span class=&quot;term&quot;&gt;incurred loss&lt;/span&gt; di IAS 39 (si svaluta solo quando la perdita si è già manifestata) è stato criticato per il &lt;b&gt;ritardo&lt;/b&gt; con cui le perdite emergevano. IFRS 9 introduce l&#x27;&lt;span class=&quot;term&quot;&gt;expected loss&lt;/span&gt;: le perdite si stimano in &lt;b&gt;chiave prospettica&lt;/b&gt;, e la valutazione del rischio di credito si fa già alla prima iscrizione, quando si determina il rendimento effettivo.&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 760 170&quot; role=&quot;img&quot; aria-label=&quot;Confronto temporale: con incurred loss la perdita si rileva dopo il default, con expected loss gradualmente prima&quot;&gt;
&lt;line class=&quot;axis&quot; x1=&quot;40&quot; y1=&quot;130&quot; x2=&quot;730&quot; y2=&quot;130&quot;/&gt;
&lt;text class=&quot;lbl&quot; x=&quot;40&quot; y=&quot;150&quot;&gt;erogazione&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;560&quot; y=&quot;150&quot;&gt;default&lt;/text&gt;&lt;text class=&quot;lbl&quot; x=&quot;700&quot; y=&quot;150&quot;&gt;tempo&lt;/text&gt;
&lt;line x1=&quot;560&quot; y1=&quot;20&quot; x2=&quot;560&quot; y2=&quot;130&quot; style=&quot;stroke:var(--bad);stroke-dasharray:4 4&quot;/&gt;
&lt;polyline points=&quot;40,128 560,128 565,40 730,40&quot; fill=&quot;none&quot; style=&quot;stroke:var(--muted);stroke-width:2.5&quot;/&gt;
&lt;polyline points=&quot;40,118 300,110 340,80 560,52 730,40&quot; fill=&quot;none&quot; style=&quot;stroke:var(--acc);stroke-width:3&quot;/&gt;
&lt;text x=&quot;600&quot; y=&quot;34&quot; font-size=&quot;12&quot;&gt;perdita rilevata&lt;/text&gt;
&lt;text x=&quot;150&quot; y=&quot;100&quot; font-size=&quot;12&quot; style=&quot;fill:var(--acc)&quot;&gt;expected loss: accantonamento graduale&lt;/text&gt;
&lt;text x=&quot;330&quot; y=&quot;122&quot; font-size=&quot;12&quot; class=&quot;lbl&quot;&gt;incurred loss: nulla fino al trigger event&lt;/text&gt;
&lt;/svg&gt;

&lt;div class=&quot;grid g2&quot;&gt;
