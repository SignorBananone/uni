&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Loss allowance&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[5.5.1]&lt;/span&gt;&lt;br&gt;Fondo per le perdite attese su crediti (&lt;span class=&quot;term&quot;&gt;expected credit losses, ECL&lt;/span&gt;) da rilevare su attività finanziarie ad AC e a FVOCI (debito), crediti per leasing, &lt;em&gt;contract assets&lt;/em&gt;, impegni a erogare finanziamenti e garanzie finanziarie.&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Objective&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[5.5.4; 5.5.8]&lt;/span&gt;&lt;br&gt;Rilevare le ECL &lt;b&gt;lifetime&lt;/b&gt; per tutti gli strumenti con un &lt;b&gt;aumento significativo del rischio di credito&lt;/b&gt; dalla prima iscrizione, a livello individuale o collettivo, usando informazioni ragionevoli e dimostrabili anche &lt;em&gt;forward-looking&lt;/em&gt;. Le variazioni del fondo vanno a &lt;b&gt;P&amp;amp;L&lt;/b&gt; come impairment gain or loss.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Più discrezionalità, più trasparenza&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Anticipare la rilevazione aumenta la &lt;b&gt;discrezionalità&lt;/b&gt; dei redattori: per questo IFRS 9 (con IFRS 7) richiede in nota riferimenti &lt;b&gt;quantitativi e qualitativi&lt;/b&gt; sulle stime delle perdite future e sulle proiezioni dei flussi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Un solo modello&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;IAS 39 aveva &lt;b&gt;più modelli&lt;/b&gt; di stima a seconda della categoria; IFRS 9 introduce un &lt;b&gt;approccio unico&lt;/b&gt; per tutte le attività finanziarie soggette a impairment.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Il percorso logico&lt;/h3&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;&lt;b&gt;Write-off?&lt;/b&gt; Se non ci sono ragionevoli aspettative di recuperare l&#x27;attività (o una parte), il gross carrying amount si &lt;b&gt;riduce direttamente&lt;/b&gt;: il write-off è un evento di &lt;b&gt;derecognition&lt;/b&gt; [5.4.4].&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Il rischio di credito è aumentato significativamente?&lt;/b&gt; A ogni data di bilancio si confronta il &lt;b&gt;rischio di default&lt;/b&gt; lungo la vita attesa alla data di bilancio con quello alla prima iscrizione, usando informazioni disponibili &lt;em&gt;without undue cost or effort&lt;/em&gt; [5.5.9]. Si guarda la variazione del rischio di default, non dell&#x27;importo delle perdite attese. &lt;b&gt;Nessuna soglia precisa&lt;/b&gt; è fissata: la sceglie l&#x27;entità in base agli strumenti e ai sistemi interni di risk management.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;No → 12-month ECL&lt;/b&gt; [5.5.5]: il fondo è pari alle perdite attese da eventi di default possibili nei &lt;b&gt;12 mesi&lt;/b&gt; successivi.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Sì → lifetime ECL&lt;/b&gt; [5.5.3]: il fondo è pari alle perdite attese lungo &lt;b&gt;tutta la vita&lt;/b&gt; dello strumento.&lt;/li&gt;
&lt;/ol&gt;
&lt;div class=&quot;note&quot;&gt;Nella prassi questo schema si chiama &lt;b&gt;modello a tre stage&lt;/b&gt; (termine non usato nelle slide, ma presente nel bilancio BNP Paribas): &lt;b&gt;stage 1&lt;/b&gt; = in bonis, 12-month ECL; &lt;b&gt;stage 2&lt;/b&gt; = aumento significativo del rischio, lifetime ECL; &lt;b&gt;stage 3&lt;/b&gt; = &lt;em&gt;credit-impaired&lt;/em&gt;, lifetime ECL e interessi calcolati sul valore netto (IFRS 9 – 5.4.1(b)). IFRS 9 prevede anche una presunzione relativa di aumento significativo oltre i &lt;b&gt;30 giorni di scaduto&lt;/b&gt; (5.5.11).&lt;/div&gt;

&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Expected credit losses&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[App. A; 5.5.17]&lt;/span&gt;&lt;br&gt;La &lt;b&gt;media ponderata delle perdite su crediti&lt;/b&gt;, con i rischi di default come pesi. La misura deve riflettere: un importo &lt;b&gt;non distorto e ponderato per le probabilità&lt;/b&gt; (su una gamma di scenari possibili); il &lt;b&gt;valore temporale del denaro&lt;/b&gt;; informazioni ragionevoli e dimostrabili su eventi passati, &lt;b&gt;condizioni correnti e previsioni&lt;/b&gt; economiche. L&#x27;attualizzazione usa l&#x27;&lt;b&gt;EIR&lt;/b&gt; determinato alla prima iscrizione.&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;Nella prassi bancaria (integrazione) l&#x27;ECL si calcola come &lt;b&gt;PD × LGD × EAD&lt;/b&gt; attualizzato: &lt;em&gt;probability of default&lt;/em&gt; (probabilità di insolvenza), &lt;em&gt;loss given default&lt;/em&gt; (quota persa in caso di insolvenza), &lt;em&gt;exposure at default&lt;/em&gt; (esposizione al momento dell&#x27;insolvenza).&lt;/p&gt;

&lt;div class=&quot;widget&quot; id=&quot;ecl&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Simulatore con cursori · modello semplificato a scopo didattico&lt;/div&gt;
&lt;h4&gt;Quanto vale il fondo? Dipende dallo stage&lt;/h4&gt;
&lt;label class=&quot;rng&quot;&gt;Esposizione (EAD, €)&lt;input type=&quot;range&quot; min=&quot;10000&quot; max=&quot;500000&quot; step=&quot;10000&quot; value=&quot;100000&quot; data-k=&quot;ead&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;LGD&lt;input type=&quot;range&quot; min=&quot;10&quot; max=&quot;90&quot; step=&quot;5&quot; value=&quot;45&quot; data-k=&quot;lgd&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;PD annua alla prima iscrizione&lt;input type=&quot;range&quot; min=&quot;0.2&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;1&quot; data-k=&quot;p0&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;PD annua oggi&lt;input type=&quot;range&quot; min=&quot;0.2&quot; max=&quot;30&quot; step=&quot;0.1&quot; value=&quot;1.5&quot; data-k=&quot;p1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Vita residua (anni)&lt;input type=&quot;range&quot; min=&quot;1&quot; max=&quot;10&quot; step=&quot;1&quot; value=&quot;5&quot; data-k=&quot;n&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Soglia di «aumento significativo» scelta dall&#x27;entità (× PD iniziale)&lt;input type=&quot;range&quot; min=&quot;1.5&quot; max=&quot;4&quot; step=&quot;0.1&quot; value=&quot;2&quot; data-k=&quot;th&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;p class=&quot;small&quot;&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-imp&gt; Si è verificato un evento di &lt;em&gt;credit-impairment&lt;/em&gt; (es. default, difficoltà finanziarie significative)&lt;/label&gt;&lt;/p&gt;
&lt;div class=&quot;kpi&quot;&gt;&lt;div&gt;&lt;span&gt;Stage&lt;/span&gt;&lt;b data-st&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;12-month ECL&lt;/span&gt;&lt;b data-e12&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Lifetime ECL&lt;/span&gt;&lt;b data-elt&gt;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Fondo da rilevare&lt;/span&gt;&lt;b data-fd&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 640 120&quot; data-bars aria-label=&quot;Confronto tra 12-month e lifetime ECL&quot;&gt;&lt;/svg&gt;
&lt;p class=&quot;small muted&quot;&gt;EIR di attualizzazione 5%; PD costante negli anni; EAD costante. Lifetime ECL = Σ PD marginale&lt;sub&gt;t&lt;/sub&gt; × LGD × EAD / (1+EIR)&lt;sup&gt;t&lt;/sup&gt;. Con un evento di impairment la PD è posta al 100%.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Credit-impaired financial asset &lt;span class=&quot;ref&quot;&gt;[App. A]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Un&#x27;attività è &lt;span class=&quot;term&quot;&gt;credit-impaired&lt;/span&gt; quando si sono verificati &lt;b&gt;uno o più eventi&lt;/b&gt; con impatto negativo sui flussi futuri stimati. Evidenze osservabili:&lt;/p&gt;
&lt;div class=&quot;grid g3&quot;&gt;
&lt;div class=&quot;card small&quot;&gt;1 · &lt;b&gt;Significative difficoltà finanziarie&lt;/b&gt; dell&#x27;emittente o del debitore&lt;/div&gt;
&lt;div class=&quot;card small&quot;&gt;2 · &lt;b&gt;Violazione del contratto&lt;/b&gt;, come un default o uno scaduto&lt;/div&gt;
&lt;div class=&quot;card small&quot;&gt;3 · &lt;b&gt;Concessioni&lt;/b&gt; fatte dal creditore per ragioni legate alle difficoltà del debitore, che altrimenti non avrebbe fatto (le &lt;em&gt;forbearance&lt;/em&gt;)&lt;/div&gt;
&lt;div class=&quot;card small&quot;&gt;4 · Diventa probabile il &lt;b&gt;fallimento&lt;/b&gt; o un&#x27;altra riorganizzazione finanziaria&lt;/div&gt;
&lt;div class=&quot;card small&quot;&gt;5 · &lt;b&gt;Scomparsa di un mercato attivo&lt;/b&gt; per l&#x27;attività a causa di difficoltà finanziarie&lt;/div&gt;
&lt;div class=&quot;card small&quot;&gt;6 · Acquisto od origine con &lt;b&gt;forte sconto&lt;/b&gt; che riflette perdite già sostenute&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;Può non esserci un singolo evento: l&#x27;impairment può derivare dall&#x27;&lt;b&gt;effetto combinato&lt;/b&gt; di più eventi.&lt;/p&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;POCI – purchased or originated credit-impaired &lt;span class=&quot;ref&quot;&gt;[5.5.13-5.5.14]&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Per le attività già deteriorate all&#x27;acquisto/origine (es. un portafoglio di crediti in sofferenza comprato a sconto) si rilevano come fondo solo le &lt;b&gt;variazioni cumulate&lt;/b&gt; delle lifetime ECL dalla prima iscrizione. A ogni data di bilancio la variazione va a P&amp;amp;L come impairment gain or loss; un miglioramento è un &lt;b&gt;impairment gain&lt;/b&gt; anche se le ECL scendono sotto quelle incorporate nei flussi stimati all&#x27;origine.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Impairment&lt;/h3&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;1. Alla prima iscrizione di un mutuo in bonis, quale fondo si rileva?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Nessuno: non c&#x27;è ancora una perdita&lt;/button&gt;&lt;button data-ok&gt;12-month ECL&lt;/button&gt;&lt;button&gt;Lifetime ECL&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;È la vera novità rispetto all&#x27;incurred loss: anche un credito sano ha perdite attese (5.5.5).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;2. Per stabilire se c&#x27;è un aumento significativo del rischio di credito si confronta…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;l&#x27;importo delle ECL oggi e alla prima iscrizione&lt;/button&gt;&lt;button data-ok&gt;il rischio di default lungo la vita attesa oggi e alla prima iscrizione&lt;/button&gt;&lt;button&gt;il rating attuale con la soglia fissata da IFRS 9&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;5.5.9: si usa la variazione del rischio di default, non delle ECL; IFRS 9 non fissa una soglia numerica.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;3. Un write-off è…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;un aumento del fondo svalutazione&lt;/button&gt;&lt;button data-ok&gt;un evento di derecognition (totale o parziale)&lt;/button&gt;&lt;button&gt;una riclassificazione a FVTPL&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;IFRS 9 – 5.4.4.&lt;/p&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Domanda aperta: perché il modello expected loss dovrebbe ridurre la prociclicità?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché le perdite si accantonano gradualmente, in base alle previsioni, prima che la crisi colpisca, invece di concentrarsi tutte nel momento peggiore del ciclo. Il rovescio della medaglia: le previsioni forward-looking sono discrezionali e, se peggiorano bruscamente (passaggi in massa allo stage 2), possono comunque amplificare gli effetti.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 7 HEDGE ============ --&gt;
&lt;section id=&quot;s-hedge&quot; class=&quot;part sage&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Parte 7&lt;/div&gt;&lt;h2&gt;Hedge accounting &lt;span class=&quot;ref&quot;&gt;[IFRS 9 – 6.1-6.5.16]&lt;/span&gt;&lt;/h2&gt;&lt;/header&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Objective&lt;/b&gt; &lt;span class=&quot;ref&quot;&gt;[6.1.1]&lt;/span&gt;&lt;br&gt;Rappresentare in bilancio l&#x27;&lt;b&gt;effetto della gestione dei rischi&lt;/b&gt; dell&#x27;entità che usa strumenti finanziari per gestire esposizioni a rischi specifici che potrebbero influire sul P&amp;amp;L (o sull&#x27;OCI, per le azioni con opzione OCI), facendo capire &lt;b&gt;scopo ed effetto&lt;/b&gt; degli strumenti di copertura.&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;Perché serve una contabilità speciale? Senza hedge accounting il derivato di copertura sta a FVTPL mentre l&#x27;elemento coperto è magari al costo ammortizzato o non è ancora in bilancio (una transazione futura): il conto economico mostrerebbe una volatilità che economicamente non esiste. L&#x27;hedge accounting «allinea i tempi» dei due effetti.&lt;/div&gt;

&lt;h3&gt;Cosa può coprire e cosa può essere coperto&lt;/h3&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Hedging instruments &lt;span class=&quot;ref&quot;&gt;[6.2.1-6.2.2]&lt;/span&gt;&lt;/h4&gt;&lt;ul class=&quot;small&quot;&gt;
&lt;li&gt;Un &lt;b&gt;derivato a FVTPL&lt;/b&gt;, eccetto alcune &lt;b&gt;opzioni vendute&lt;/b&gt; (&lt;em&gt;written options&lt;/em&gt;): queste qualificano solo se compensano un&#x27;opzione acquistata, anche incorporata (es. una call venduta a copertura di una passività rimborsabile anticipatamente) [B6.2.4].&lt;/li&gt;
&lt;li&gt;Un&#x27;&lt;b&gt;attività o passività finanziaria non derivata a FVTPL&lt;/b&gt;, salvo le passività designate a FVTPL con il proprio rischio di credito in OCI.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Hedged items &lt;span class=&quot;ref&quot;&gt;[6.3.1]&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;IFRS 9 ha &lt;b&gt;ampliato&lt;/b&gt; gli elementi coperti ammessi: un&#x27;attività o passività &lt;b&gt;rilevata&lt;/b&gt;, un &lt;b&gt;impegno irrevocabile non rilevato&lt;/b&gt; (&lt;em&gt;firm commitment&lt;/em&gt;), una &lt;b&gt;transazione futura altamente probabile&lt;/b&gt; (&lt;em&gt;forecast transaction&lt;/em&gt;) o un &lt;b&gt;investimento netto in una gestione estera&lt;/b&gt;. Può essere un &lt;b&gt;singolo elemento&lt;/b&gt;, un &lt;b&gt;gruppo&lt;/b&gt; o una &lt;b&gt;componente&lt;/b&gt; di essi (es. solo il rischio di cambio di un acquisto).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;Le slide segnalano anche che lo strumento ibrido va &lt;b&gt;valutato nella sua interezza&lt;/b&gt; (costo ammortizzato o fair value), mentre IAS 39 separava host e derivato incorporato. &lt;span class=&quot;muted&quot;&gt;Precisazione (integrazione): questo vale quando l&#x27;host è un&#x27;attività finanziaria di IFRS 9 (4.3.2); se l&#x27;host è una passività o un contratto non finanziario, lo scorporo resta possibile alle condizioni di 4.3.3.&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Qualifying criteria &lt;span class=&quot;ref&quot;&gt;[6.4.1]&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Una relazione di copertura qualifica &lt;b&gt;solo se tutti&lt;/b&gt; i criteri sono rispettati:&lt;/p&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;&lt;b&gt;Solo strumenti ed elementi ammissibili&lt;/b&gt; (eligible hedging instruments e hedged items).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Designazione formale e documentazione all&#x27;inizio&lt;/b&gt; della relazione e dell&#x27;obiettivo e strategia di risk management: identificazione di strumento, elemento coperto, natura del rischio, e di come si valuterà l&#x27;efficacia (incluse le fonti di inefficacia e la determinazione dell&#x27;&lt;span class=&quot;term&quot;&gt;hedge ratio&lt;/span&gt;, il rapporto tra quantità coperta e quantità dello strumento).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Requisiti di efficacia&lt;/b&gt; (le variazioni di fair value o flussi dello strumento compensano quelle dell&#x27;elemento coperto):
&lt;ul&gt;&lt;li&gt;esiste una &lt;b&gt;relazione economica&lt;/b&gt; tra elemento coperto e strumento: i valori si muovono in &lt;b&gt;direzione opposta&lt;/b&gt; in relazione al rischio coperto (come precisa anche il principio contabile italiano, OIC 32);&lt;/li&gt;
&lt;li&gt;l&#x27;effetto del &lt;b&gt;rischio di credito non domina&lt;/b&gt; le variazioni di valore;&lt;/li&gt;
&lt;li&gt;l&#x27;&lt;b&gt;hedge ratio&lt;/b&gt; è quello effettivamente usato nella gestione del rischio (è ammessa una copertura imperfetta se condizioni esterne la impongono).&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Quando si verifica l&#x27;efficacia &lt;span class=&quot;ref&quot;&gt;[B6.4.12]&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;All&#x27;inizio e su base continuativa: &lt;b&gt;almeno a ogni data di bilancio&lt;/b&gt; o al verificarsi di un cambiamento significativo, se prima. La valutazione è solo &lt;b&gt;prospettica&lt;/b&gt; (forward-looking).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Addio all&#x27;80-125%&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;IAS 39 considerava efficace la copertura solo se la variazione dello strumento era tra l&#x27;&lt;b&gt;80% e il 125%&lt;/b&gt; di quella dell&#x27;elemento coperto. &lt;b&gt;IFRS 9 non fissa parametri quantitativi&lt;/b&gt;: più flessibilità, ma più attenzione alla definizione di efficacia da parte dell&#x27;impresa.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;I tre tipi di relazione &lt;span class=&quot;ref&quot;&gt;[6.5.2]&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;Fair value hedge&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Cash flow hedge&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Net investment hedge&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;&lt;p&gt;&lt;b&gt;Definizione [6.5.2(a)]:&lt;/b&gt; copertura dell&#x27;esposizione alle &lt;b&gt;variazioni di fair value&lt;/b&gt; di un&#x27;attività o passività rilevata, di un impegno irrevocabile non rilevato o di una loro componente, attribuibili a un rischio particolare e che potrebbero influire sul P&amp;amp;L.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Contabilizzazione (integrazione, IFRS 9 – 6.5.8):&lt;/b&gt; utile/perdita sullo strumento a &lt;b&gt;P&amp;amp;L&lt;/b&gt;; il valore dell&#x27;elemento coperto è rettificato per la variazione dovuta al rischio coperto, anch&#x27;essa a P&amp;amp;L. I due effetti si compensano e resta a P&amp;amp;L solo l&#x27;inefficacia.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;&lt;b&gt;Esempio:&lt;/b&gt; un&#x27;impresa emette un bond a tasso fisso e stipula un &lt;em&gt;interest rate swap&lt;/em&gt; (riceve fisso, paga variabile) per «trasformarlo» in variabile.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;&lt;b&gt;Caso speciale [6.5.3]:&lt;/b&gt; se l&#x27;elemento coperto è un&#x27;azione con opzione OCI, l&#x27;esposizione coperta deve poter influire sull&#x27;OCI, e solo in quel caso l&#x27;inefficacia va in OCI.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Definizione [6.5.2(b)]:&lt;/b&gt; copertura dell&#x27;esposizione alla &lt;b&gt;variabilità dei flussi di cassa&lt;/b&gt; attribuibile a un rischio particolare associato a un&#x27;attività o passività rilevata (es. interessi futuri su un debito a tasso variabile) o a una &lt;b&gt;transazione futura altamente probabile&lt;/b&gt;, che potrebbe influire sul P&amp;amp;L.&lt;/p&gt;
&lt;table class=&quot;small&quot;&gt;&lt;tr&gt;&lt;td&gt;Parte &lt;b&gt;efficace&lt;/b&gt; dell&#x27;utile/perdita sullo strumento [6.5.11(b)]&lt;/td&gt;&lt;td&gt;→ &lt;b&gt;OCI&lt;/b&gt; (riserva di cash flow hedge)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Parte residua = &lt;b&gt;inefficacia&lt;/b&gt; [6.5.11(c)]&lt;/td&gt;&lt;td&gt;→ &lt;b&gt;Profit or loss&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p class=&quot;small&quot;&gt;&lt;b&gt;Esempio:&lt;/b&gt; un&#x27;impresa europea prevede di pagare tra 6 mesi 1 milione di dollari di materie prime e compra dollari a termine (&lt;em&gt;forward&lt;/em&gt;). La riserva in OCI si riversa quando la transazione coperta incide sul P&amp;amp;L.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;&lt;p&gt;Copertura dell&#x27;&lt;b&gt;investimento netto in una gestione estera&lt;/b&gt; (regolata anche da &lt;b&gt;IAS 21&lt;/b&gt; e IFRIC 16): una capogruppo possiede partecipazioni in società estere che usano una valuta diversa da quella del bilancio consolidato e si copre dal rischio di cambio (es. con un finanziamento nella valuta della controllata).&lt;/p&gt;
&lt;table class=&quot;small&quot;&gt;&lt;tr&gt;&lt;td&gt;Parte &lt;b&gt;efficace&lt;/b&gt; [6.5.13(a)]&lt;/td&gt;&lt;td&gt;→ &lt;b&gt;OCI&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Parte &lt;b&gt;inefficace&lt;/b&gt; [6.5.13(b)]&lt;/td&gt;&lt;td&gt;→ &lt;b&gt;Profit or loss&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;widget&quot; id=&quot;hdg&quot;&gt;
&lt;div class=&quot;wt&quot;&gt;Simulatore con cursori&lt;/div&gt;
&lt;h4&gt;Dove finiscono le variazioni di valore?&lt;/h4&gt;
&lt;div style=&quot;margin-bottom:.5rem&quot;&gt;&lt;button class=&quot;btn on&quot; data-ty=&quot;cfh&quot;&gt;Cash flow hedge&lt;/button&gt; &lt;button class=&quot;btn&quot; data-ty=&quot;fvh&quot;&gt;Fair value hedge&lt;/button&gt;&lt;/div&gt;
&lt;label class=&quot;rng&quot;&gt;Variazione cumulata dello strumento di copertura (derivato)&lt;input type=&quot;range&quot; min=&quot;-200&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;110&quot; data-k=&quot;hi&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label class=&quot;rng&quot;&gt;Variazione cumulata dell&#x27;elemento coperto (rischio coperto)&lt;input type=&quot;range&quot; min=&quot;-200&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;-100&quot; data-k=&quot;it&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
&lt;svg viewBox=&quot;0 0 640 150&quot; data-hb aria-label=&quot;Barre: strumento, elemento coperto, OCI, conto economico&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;res small&quot; data-hr&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Rebalancing &lt;span class=&quot;ref&quot;&gt;[6.5.5; B6.5.7]&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Se la relazione non rispetta più il requisito sull&#x27;hedge ratio ma l&#x27;&lt;b&gt;obiettivo di risk management è lo stesso&lt;/b&gt;, si &lt;b&gt;aggiusta l&#x27;hedge ratio&lt;/b&gt; (le quantità designate di elemento coperto o strumento) per tornare a qualificare. Modifiche fatte per altri scopi non sono rebalancing.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;box&quot;&gt;&lt;h4&gt;Discontinuing &lt;span class=&quot;ref&quot;&gt;[6.5.6]&lt;/span&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Si interrompe l&#x27;hedge accounting &lt;b&gt;prospetticamente&lt;/b&gt; solo quando la relazione (o una parte) &lt;b&gt;non rispetta più i criteri&lt;/b&gt;, dopo l&#x27;eventuale rebalancing: incluso quando lo strumento scade, è venduto, chiuso o esercitato. Sostituzione o rinnovo (&lt;em&gt;rollover&lt;/em&gt;) coerenti con l&#x27;obiettivo documentato non contano come scadenza. L&#x27;interruzione può riguardare tutta la relazione o solo una parte. Non si può interrompere volontariamente se i criteri sono ancora rispettati.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Hedge accounting&lt;/h3&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;1. In un cash flow hedge lo strumento guadagna 120 e l&#x27;elemento coperto perde 100. Cosa va in OCI?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;120&lt;/button&gt;&lt;button data-ok&gt;100 (e 20 a P&amp;amp;L come inefficacia)&lt;/button&gt;&lt;button&gt;20&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;La riserva è il minore tra le due variazioni cumulate in valore assoluto (6.5.11(a)): l&#x27;eccesso (over-hedge) è inefficacia a P&amp;amp;L. Provalo nel simulatore.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;2. Quale requisito quantitativo di efficacia impone IFRS 9?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;80-125%&lt;/button&gt;&lt;button&gt;90-110%&lt;/button&gt;&lt;button data-ok&gt;Nessuno&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;IFRS 9 ha abbandonato la banda 80-125% di IAS 39: servono relazione economica, credito non dominante e hedge ratio coerente.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;3. Una transazione futura altamente probabile in valuta si copre con…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;un fair value hedge&lt;/button&gt;&lt;button data-ok&gt;un cash flow hedge&lt;/button&gt;&lt;button&gt;un net investment hedge&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;Il rischio è sulla variabilità dei flussi futuri (6.5.2(b)).&lt;/p&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Domanda aperta: che differenza c&#x27;è tra rebalancing e discontinuing?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il rebalancing mantiene in vita la relazione aggiustando le quantità per ripristinare l&#x27;hedge ratio, quando l&#x27;obiettivo di risk management non è cambiato. Il discontinuing chiude (in tutto o in parte) la relazione perché i criteri non sono più rispettati, ad esempio perché il derivato è scaduto o venduto, o l&#x27;obiettivo è cambiato.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ 8 BNP ============ --&gt;
&lt;section id=&quot;s-bnp&quot; class=&quot;part slate&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Parte 8&lt;/div&gt;&lt;h2&gt;Il caso BNP Paribas · bilancio consolidato 2025&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;Le slide chiudono con le note al bilancio consolidato di BNP Paribas al 31.12.2025 (dati &lt;em&gt;unaudited&lt;/em&gt;, in milioni di euro). È un esempio di &lt;b&gt;informativa IFRS 7&lt;/b&gt; applicata alle categorie di IFRS 9. Importi in milioni di euro.&lt;/p&gt;

&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot;&gt;4.a FVTPL&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Derivati di trading&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;4.b Derivati di copertura&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;4.c FVOCI&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;div class=&quot;kpi&quot;&gt;&lt;div&gt;&lt;span&gt;Attività FVTPL 2025&lt;/span&gt;&lt;b&gt;575.603&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;di cui held for trading&lt;/span&gt;&lt;b&gt;560.973&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Passività FVTPL 2025&lt;/span&gt;&lt;b&gt;585.713&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;di cui designate (FVO)&lt;/span&gt;&lt;b&gt;132.554&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;Le attività e passività a FVTPL comprendono le operazioni di &lt;b&gt;trading&lt;/b&gt; (inclusi i derivati), quelle &lt;b&gt;designate&lt;/b&gt; a FVTPL all&#x27;emissione e gli strumenti non di trading che non possono stare ad AC o FVOCI. Le &lt;b&gt;passività designate&lt;/b&gt; sono soprattutto titoli di debito strutturati per la clientela con &lt;b&gt;derivati incorporati significativi&lt;/b&gt;, gestiti insieme ai derivati di copertura economica: è la fair value option per evitare l&#x27;accounting mismatch (Parte 5). Valore di rimborso: 134.398 (2024: 110.823).&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;Gli «altri» attivi a FVTPL (14.630) sono strumenti di debito che non superano business model o SPPI test e azioni per cui il gruppo &lt;b&gt;non&lt;/b&gt; ha scelto l&#x27;opzione «fair value through equity»: esattamente la logica del classificatore della Parte 5.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;
&lt;div class=&quot;kpi&quot;&gt;&lt;div&gt;&lt;span&gt;Fair value positivo 2025&lt;/span&gt;&lt;b&gt;274.625&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Fair value negativo 2025&lt;/span&gt;&lt;b&gt;252.726&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Nozionale totale 2025&lt;/span&gt;&lt;b&gt;38.474.824&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;I derivati di trading derivano da &lt;em&gt;market making&lt;/em&gt; e arbitraggio (credit default swap «ordinari» e operazioni strutturate per i clienti), con posizioni nette soggette a limiti. Alcuni derivati coprono economicamente attività o passività ma &lt;b&gt;senza&lt;/b&gt; relazione documentata o senza i requisiti dell&#x27;hedge accounting: restano quindi derivati di trading. Il &lt;b&gt;nozionale&lt;/b&gt; (24.153.385 sui soli tassi d&#x27;interesse) indica il volume di attività, &lt;b&gt;non il rischio&lt;/b&gt;: è molto maggiore del fair value. Nel &lt;em&gt;client clearing&lt;/em&gt; il gruppo garantisce verso le controparti centrali il rischio di default dei clienti per un nozionale di 1.405 miliardi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;
&lt;div style=&quot;margin:.4rem 0&quot;&gt;&lt;button class=&quot;btn on&quot; data-y=&quot;2025&quot;&gt;2025&lt;/button&gt; &lt;button class=&quot;btn&quot; data-y=&quot;2024&quot;&gt;2024&lt;/button&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 640 170&quot; id=&quot;bnpch&quot; aria-label=&quot;Nozionali dei derivati di copertura per tipo di relazione&quot;&gt;&lt;/svg&gt;
&lt;p class=&quot;small&quot;&gt;Il &lt;b&gt;fair value hedge&lt;/b&gt; domina (soprattutto derivati su tassi a copertura di titoli, depositi e portafogli). Nel 2025 il gruppo ha anche 1.340/2.375 di fair value positivo/negativo sui derivati di cash flow hedge; le variazioni rilevate direttamente a patrimonio netto per i CFH sono &lt;b&gt;372&lt;/b&gt; (2024: 48). Per le relazioni di fair value hedge interrotte, le rivalutazioni ancora da ammortizzare sulla vita residua degli elementi coperti sono 831 in attivo e −77 in passivo (portafogli) e 93 (strumenti identificati).&lt;/p&gt;
&lt;p class=&quot;small muted&quot;&gt;Scadenze dei nozionali FVH 2025: &amp;lt;1 anno 300.017 · 1-5 anni 491.093 · &amp;gt;5 anni 344.242.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot; hidden&gt;
&lt;div class=&quot;tscroll&quot;&gt;&lt;table class=&quot;small&quot;&gt;&lt;tr&gt;&lt;th&gt;FVOCI&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;FV 2025&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;di cui a equity&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;FV 2024&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;di cui a equity&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Titoli di debito&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;77.940&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(327)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;71.430&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(1.285)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Titoli di capitale&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.420&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;374&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.610&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;489&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Totale&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;79.360&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;47&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;73.040&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;(796)&lt;/th&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;Collegamenti con la teoria: 6 milioni di titoli di debito FVOCI sono in &lt;b&gt;stage 3&lt;/b&gt;, e l&#x27;impairment relativo (3 milioni) è stato imputato a conto economico in contropartita della riserva negativa a patrimonio. L&#x27;opzione OCI per le &lt;b&gt;azioni&lt;/b&gt; è usata per partecipazioni strategiche e azioni detenute per obbligo operativo; alla vendita l&#x27;utile netto di 36 milioni è stato girato agli &lt;b&gt;utili portati a nuovo&lt;/b&gt;, non al conto economico (nessun recycling).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · Lettura del bilancio&lt;/h3&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;1. Perché BNP Paribas trasferisce a «retained earnings» e non a P&amp;amp;L l&#x27;utile sulla vendita di azioni FVOCI?&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;Per scelta di prudenza&lt;/button&gt;&lt;button data-ok&gt;Perché per le azioni a FVOCI IFRS 9 vieta il recycling&lt;/button&gt;&lt;button&gt;Perché sono azioni proprie&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;IFRS 9 – 5.7.5 e B5.7.1: l&#x27;importo in OCI non si riversa mai a P&amp;amp;L; può essere trasferito all&#x27;interno del patrimonio netto.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;&lt;p class=&quot;qq&quot;&gt;2. Il nozionale dei derivati (38.474.824 milioni) misura…&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button&gt;la perdita massima possibile&lt;/button&gt;&lt;button data-ok&gt;il volume dell&#x27;attività, non il rischio di mercato&lt;/button&gt;&lt;button&gt;il fair value netto&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;Lo dice la nota stessa: i nozionali indicano il volume, non i rischi di mercato.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;!-- ============ FONTI ============ --&gt;
&lt;section id=&quot;s-fonti&quot; class=&quot;part ochre&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;header&gt;&lt;div class=&quot;num&quot;&gt;Per approfondire&lt;/div&gt;&lt;h2&gt;Autori, testi, norme e siti citati nelle slide&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;Ogni voce è cercata sul web: le descrizioni sono &lt;b&gt;fonte esterna&lt;/b&gt;, distinta dal contenuto delle slide, con il link della fonte. Verificate a novembre 2026.&lt;/p&gt;
&lt;div class=&quot;note course&quot;&gt;Il riassunto avrebbe dovuto collegare questa lezione agli altri file della cartella &lt;em&gt;corso/&lt;/em&gt;. Lo strumento di lettura disponibile non permette di elencare le cartelle, quindi gli altri materiali non sono stati consultati: i rinvii ad altri principi (IFRS 10, IAS 27, IAS 28, IFRS 16, IAS 19, IFRS 2, IFRS 3, IAS 37, IFRS 15, IFRS 17, IAS 21, IAS 7, IAS 1/IFRS 18) vengono dalle slide stesse.&lt;/div&gt;
&lt;div class=&quot;grid g2&quot;&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;Fonte esterna · IFRS Foundation&lt;/div&gt;&lt;h4&gt;IAS 32 &lt;em&gt;Financial Instruments: Presentation&lt;/em&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Pagina ufficiale del principio. Nato nel 1995 come &lt;em&gt;Disclosure and Presentation&lt;/em&gt;; oggi tratta la presentazione, mentre rilevazione/misurazione e disclosure stanno in IFRS 9 e IFRS 7. È il riferimento per la distinzione debito/equity.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://ifrs.org/issued-standards/list-of-standards/ias-32-financial-instruments-presentation&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IAS 32&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;Fonte esterna · IFRS Foundation&lt;/div&gt;&lt;h4&gt;IFRS 9 &lt;em&gt;Financial Instruments&lt;/em&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Pagina ufficiale, con il testo e le modifiche. In vigore per gli esercizi dal 1° gennaio 2018. È la fonte primaria di tutti i paragrafi citati nelle Parti 3-7.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-9-financial-instruments/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IFRS 9&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;Fonte esterna · IFRS Foundation / Deloitte IAS Plus&lt;/div&gt;&lt;h4&gt;IFRS 7 &lt;em&gt;Financial Instruments: Disclosures&lt;/em&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Emesso nell&#x27;agosto 2005, in vigore dal 2007: chiede informazioni sulla rilevanza degli strumenti e su natura ed entità dei rischi (credito, liquidità, mercato). Ha ripreso le disclosure prima contenute in IAS 32. Conta per leggere note come quelle di BNP Paribas.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-7-financial-instruments-disclosures/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IFRS 7&lt;/a&gt; · &lt;a class=&quot;small&quot; href=&quot;https://www.iasplus.com/en/standards/ifrs/ifrs7&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – sintesi&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;Fonte esterna · Deloitte IAS Plus&lt;/div&gt;&lt;h4&gt;IAS 39 &lt;em&gt;Recognition and Measurement&lt;/em&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Sintesi e storia del principio (1998, riemesso nel 2004), con l&#x27;indicazione che IFRS 9 ne ha sostituito classificazione, misurazione, impairment, hedge accounting e derecognition. Utile per capire il «prima» da cui parte la Parte 3.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://www.iasplus.com/standard/ias39.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – IAS 39&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;Fonte esterna · Deloitte IAS Plus&lt;/div&gt;&lt;h4&gt;IFRIC 2, 16, 17, 19&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Indice delle interpretazioni: IFRIC 16 (2008) sulle coperture dell&#x27;investimento netto estero; IFRIC 17 (in vigore dal 1° luglio 2009) sulle distribuzioni non monetarie; IFRIC 19 (in vigore dal 1° luglio 2010) sull&#x27;estinzione di passività con strumenti di capitale; IFRIC 2 sulle quote delle cooperative.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://www.iasplus.com/en/standards/ifric&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus – IFRIC Interpretations&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;Fonte esterna · IFRS Foundation&lt;/div&gt;&lt;h4&gt;Progetto FICE – Exposure Draft IASB/ED/2023/5&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Bozza del 29 novembre 2023 (commenti fino al 29 marzo 2024) che modifica IAS 32, IFRS 7 e IAS 1. Nel 2025-2026 l&#x27;IASB ha proseguito le ridiscussioni (es. riclassificazione tra passività ed equity; misura dell&#x27;obbligo di riacquistare azioni proprie); nessun principio definitivo risultava emesso all&#x27;ultimo aggiornamento trovato (settembre 2026).&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://ifrs.org/projects/work-plan/financial-instruments-with-characteristics-of-equity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – pagina del progetto&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;Fonte esterna · IFRS Foundation&lt;/div&gt;&lt;h4&gt;IFRS 18 &lt;em&gt;Presentation and Disclosure in Financial Statements&lt;/em&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Emesso ad aprile 2024, sostituisce IAS 1 per gli esercizi dal &lt;b&gt;1° gennaio 2027&lt;/b&gt; (applicazione anticipata ammessa). Spiega perché le slide aggiornano il riferimento di IAS 32.34 sulle azioni proprie.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – IFRS 18&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;Fonte esterna · IFRS Foundation · EUR-Lex&lt;/div&gt;&lt;h4&gt;Interest Rate Benchmark Reform – Phase 2 e Reg. (UE) 2021/25&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;L&#x27;IASB ha emesso le modifiche il 27 agosto 2020 (IFRS 9, IAS 39, IFRS 7, IFRS 4, IFRS 16), in vigore dal 2021; il Regolamento (UE) 2021/25 del 13 gennaio 2021 le ha recepite nell&#x27;UE. Base normativa dei paragrafi 5.4.5-5.4.9.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://www.ifrs.org/news-and-events/news/2020/08/iasb-to-issue-interest-rate-benchmark-reform-phase-2/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – annuncio&lt;/a&gt; · &lt;a class=&quot;small&quot; href=&quot;https://eur-lex.europa.eu/eli/reg/2021/25/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex – Reg. 2021/25&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;Fonte esterna · IFRS Foundation&lt;/div&gt;&lt;h4&gt;Modifiche a IFRS 9 e IFRS 7 (maggio 2024)&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Non citate nelle slide ma utili: emesse il 30 maggio 2024, in vigore dal 1° gennaio 2026. Chiariscono lo SPPI test per flussi legati a obiettivi ESG e altre clausole contingenti, la derecognition di passività regolate con pagamenti elettronici e nuove disclosure sulle azioni a FVOCI.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://www.ifrs.org/content/ifrs/home/news-and-events/news/2024/05/iasb-issues-amendments-cmfi-ifrs7-ifrs9.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – annuncio&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;Fonte esterna · IFRS Foundation&lt;/div&gt;&lt;h4&gt;IAS 21 &lt;em&gt;The Effects of Changes in Foreign Exchange Rates&lt;/em&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Definisce l&#x27;investimento netto in una gestione estera (quota dell&#x27;entità nelle attività nette della gestione) richiamato dal net investment hedge; IAS 21 non disciplina l&#x27;hedge accounting, che rinvia a IFRS 9/IAS 39 e IFRIC 16.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://ifrs.org/content/dam/ifrs/publications/html-standards/english/2024/issued/ias21.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – testo IAS 21&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;Fonte esterna · Fondazione OIC&lt;/div&gt;&lt;h4&gt;OIC 32 &lt;em&gt;Strumenti finanziari derivati&lt;/em&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Il «principio contabile italiano» richiamato nelle slide sulla relazione economica della copertura. Emesso nel 2016, modificato nel 2017-2018 e oggetto di &lt;em&gt;post-implementation review&lt;/em&gt;; il 1° aprile 2026 l&#x27;OIC ha messo in consultazione nuove modifiche.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://fondazioneoic.eu/wp-content/uploads/2019/01/2022-05-OIC-32-Strumenti-finanziari-derivati.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fondazioneoic.eu – OIC 32 (PDF)&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;Fonte esterna · catalogo bibliotecario&lt;/div&gt;&lt;h4&gt;D. Alexander, S. Archer – &lt;em&gt;International Accounting/Financial Reporting Standards Guide&lt;/em&gt;&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Manuale pratico sugli IFRS pubblicato da CCH (gruppo Wolters Kluwer), con edizioni annuali; le slide ne riprendono l&#x27;esempio trade date/settlement date (ed. 2017). Il link è a una scheda di catalogo: non è stata trovata una pagina dell&#x27;editore.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://search.library.uitm.edu.my/Record/wils-548113/Description&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda di catalogo&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;Fonte esterna · BNP Paribas Investor Relations&lt;/div&gt;&lt;h4&gt;BNP Paribas – Consolidated financial statements 2025&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Bilancio consolidato al 31.12.2025 (versione &lt;em&gt;unaudited&lt;/em&gt;, approvata dal CdA il 4 febbraio 2026), da cui vengono le tabelle della Parte 8; la versione certificata è nel Universal Registration Document 2025.&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://invest.bnpparibas/en/document/4q25-cfsu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;invest.bnpparibas – documento&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;div class=&quot;src&quot;&gt;Fonte esterna · IFRS Foundation&lt;/div&gt;&lt;h4&gt;Gli altri principi richiamati&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;IFRS 10, IAS 27, IAS 28, IAS 19, IFRS 2, IFRS 3, IFRS 15, IFRS 16, IFRS 17, IAS 37, IAS 7: compaiono nelle slide come esclusioni dallo scope. Il loro testo è nell&#x27;indice ufficiale dei principi emessi (accesso gratuito con registrazione).&lt;/p&gt;&lt;a class=&quot;small&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org – list of standards&lt;/a&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/div&gt;&lt;/footer&gt;
