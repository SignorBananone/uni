&lt;!-- ============ DEFINIZIONI ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s-def&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Part 1 · Foundations&lt;/span&gt;
  &lt;h2&gt;Definitions, objective and core principle&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Before measuring revenue we need to know what a &lt;em class=&quot;t&quot;&gt;contract&lt;/em&gt; is, who the &lt;em class=&quot;t&quot;&gt;customer&lt;/em&gt; is, and what it means to “transfer” a good. The standard starts from a short glossary (Appendix A) and a single principle.&lt;/p&gt;

  &lt;h3&gt;The Appendix A glossary&lt;/h3&gt;
  &lt;p class=&quot;note&quot;&gt;Tap an item to open the definition and its explanation. &lt;span class=&quot;src&quot;&gt;Slides 2-3&lt;/span&gt;&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;Contract&lt;/summary&gt;&lt;div&gt;An agreement between two or more parties that creates &lt;b&gt;enforceable rights and obligations&lt;/b&gt; (i.e. rights and obligations a court would uphold). Legal substance matters, not form: a contract may also be oral or implied by customary business practices.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Contract asset&lt;/summary&gt;&lt;div&gt;An entity&#x27;s right to consideration for goods/services it has &lt;b&gt;already transferred&lt;/b&gt;, when that right is &lt;b&gt;conditioned on something other than the passage of time&lt;/b&gt; (e.g. the entity&#x27;s future performance). If the only condition is the passage of time, it is a &lt;i&gt;receivable&lt;/i&gt; instead.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Contract liability&lt;/summary&gt;&lt;div&gt;An obligation to transfer goods/services for which the entity has &lt;b&gt;already received&lt;/b&gt; consideration (or the amount is already due). It is the classic “customer advance” / deferred revenue.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Income&lt;/summary&gt;&lt;div&gt;Increases in economic benefits during the period, in the form of inflows or enhancements of assets or decreases of liabilities, that &lt;b&gt;increase equity&lt;/b&gt;, other than contributions from equity participants. This is the “broad” definition.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Revenue&lt;/summary&gt;&lt;div&gt;The &lt;i&gt;income&lt;/i&gt; arising in the course of the entity&#x27;s &lt;b&gt;ordinary activities&lt;/b&gt;. A gain on the sale of an old warehouse is income but not revenue.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Performance obligation&lt;/summary&gt;&lt;div&gt;A promise to transfer (a) a good or service (or bundle) that is &lt;b&gt;distinct&lt;/b&gt;, or (b) a &lt;b&gt;series&lt;/b&gt; of distinct goods/services that are substantially the same and have the same pattern of transfer. It is the standard&#x27;s “unit of account”: revenue is recognised per performance obligation (PO).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Stand-alone selling price (SSP)&lt;/summary&gt;&lt;div&gt;The price at which the entity would sell that good/service &lt;b&gt;separately&lt;/b&gt; to a customer. It is used to allocate the price across POs (step 4).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Transaction price&lt;/summary&gt;&lt;div&gt;The amount of consideration to which the entity &lt;b&gt;expects to be entitled&lt;/b&gt; in exchange for the goods/services, &lt;b&gt;excluding amounts collected on behalf of third parties&lt;/b&gt; (e.g. VAT and some sales taxes).&lt;/div&gt;&lt;/details&gt;

  &lt;svg class=&quot;fig&quot; viewBox=&quot;0 0 760 170&quot; role=&quot;img&quot; aria-label=&quot;Income contains revenue&quot;&gt;
    &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;740&quot; height=&quot;150&quot; rx=&quot;16&quot; class=&quot;fillc&quot;/&gt;
    &lt;text x=&quot;30&quot; y=&quot;38&quot; style=&quot;font-weight:600&quot;&gt;Income&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;30&quot; y=&quot;56&quot;&gt;increases in equity other than owner contributions&lt;/text&gt;
    &lt;rect x=&quot;300&quot; y=&quot;40&quot; width=&quot;430&quot; height=&quot;104&quot; rx=&quot;12&quot; class=&quot;box&quot;/&gt;
    &lt;text x=&quot;320&quot; y=&quot;66&quot; style=&quot;font-weight:600&quot;&gt;Revenue = income from ordinary activities&lt;/text&gt;
    &lt;text class=&quot;s&quot; x=&quot;320&quot; y=&quot;88&quot;&gt;sales of goods, rendering of services, licences…&lt;/text&gt;
    &lt;text class=&quot;s&quot; x=&quot;320&quot; y=&quot;108&quot;&gt;→ IFRS 15 deals with revenue from &lt;tspan style=&quot;font-weight:600&quot;&gt;contracts with customers&lt;/tspan&gt;&lt;/text&gt;
    &lt;text class=&quot;s&quot; x=&quot;30&quot; y=&quot;100&quot;&gt;e.g. gains on disposal&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;30&quot; y=&quot;116&quot;&gt;of non-current assets (not revenue)&lt;/text&gt;
  &lt;/svg&gt;

  &lt;h3&gt;Objective (paras 1-4)&lt;/h3&gt;
  &lt;div class=&quot;quote&quot;&gt;The standard establishes the principles for reporting useful information to users of financial statements about the &lt;b&gt;nature, amount, timing and uncertainty&lt;/b&gt; of revenue and cash flows arising from a contract with a customer.&lt;span class=&quot;src&quot;&gt;IFRS 15.1 · slide 4&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Nature&lt;/h4&gt;what kind of revenue (goods, services, licences…)&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Amount&lt;/h4&gt;how much: the expected consideration&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Timing&lt;/h4&gt;when: at a point in time or over time&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Uncertainty&lt;/h4&gt;how uncertain: variable consideration, returns, collectability&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quote&quot; style=&quot;border:2px solid var(--accent);background:var(--accent-bg)&quot;&gt;&lt;b&gt;Core principle:&lt;/b&gt; an entity recognises revenue to depict the &lt;b&gt;transfer of promised goods or services&lt;/b&gt; to customers in an amount that reflects the &lt;b&gt;consideration to which it expects to be entitled&lt;/b&gt; in exchange.&lt;span class=&quot;src&quot;&gt;IFRS 15.2 · slide 4&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Two key words: &lt;b&gt;transfer&lt;/b&gt; (the &lt;i&gt;when&lt;/i&gt;, which the standard links to the passing of &lt;i&gt;control&lt;/i&gt;) and &lt;b&gt;expected entitlement&lt;/b&gt; (the &lt;i&gt;how much&lt;/i&gt;: not the list price, but what the entity legitimately expects to collect).&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Consistency (15.3)&lt;/h4&gt;The entity considers the terms of the contract and &lt;b&gt;all relevant facts and circumstances&lt;/b&gt;; the standard (including any &lt;i&gt;practical expedients&lt;/i&gt;, i.e. permitted simplifications) must be applied consistently to contracts with similar characteristics and in similar circumstances.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Portfolio approach (15.4)&lt;/h4&gt;The standard is written for an &lt;b&gt;individual contract&lt;/b&gt;. As a practical expedient it may be applied to a &lt;i&gt;portfolio&lt;/i&gt; of contracts or POs with similar characteristics, if the effects on the financial statements &lt;b&gt;would not differ materially&lt;/b&gt;. Estimates and assumptions must reflect the size and composition of the portfolio.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;The standard itself summarises the model in &lt;b&gt;five steps&lt;/b&gt; (1 contract · 2 performance obligations · 3 transaction price · 4 allocation · 5 recognition). It has been mandatory for annual periods beginning on or after 1 January 2018 and replaced IAS 11, IAS 18, IFRIC 13, IFRIC 15, IFRIC 18 and SIC-31. The slides follow this structure without naming it explicitly. — &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-15-revenue-from-contracts-with-customers.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IFRS 15&lt;/a&gt;&lt;/div&gt;

  &lt;svg class=&quot;fig&quot; viewBox=&quot;0 0 860 130&quot; role=&quot;img&quot; aria-label=&quot;The five-step model&quot;&gt;
    &lt;g style=&quot;--c:var(--ochre)&quot;&gt;&lt;rect class=&quot;fillc&quot; x=&quot;5&quot; y=&quot;20&quot; width=&quot;158&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;84&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;1 · Contract&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;84&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot;&gt;does it exist? 5 criteria&lt;/text&gt;&lt;/g&gt;
    &lt;g style=&quot;--c:var(--ochre)&quot;&gt;&lt;rect class=&quot;fillc&quot; x=&quot;178&quot; y=&quot;20&quot; width=&quot;158&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;257&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;2 · PO&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;257&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot;&gt;which distinct promises?&lt;/text&gt;&lt;/g&gt;
    &lt;g style=&quot;--c:var(--brick)&quot;&gt;&lt;rect class=&quot;fillc&quot; x=&quot;351&quot; y=&quot;20&quot; width=&quot;158&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;3 · Price&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;430&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot;&gt;what am I entitled to?&lt;/text&gt;&lt;/g&gt;
    &lt;g style=&quot;--c:var(--brick)&quot;&gt;&lt;rect class=&quot;fillc&quot; x=&quot;524&quot; y=&quot;20&quot; width=&quot;158&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;603&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;4 · Allocation&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;603&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot;&gt;how much to each PO?&lt;/text&gt;&lt;/g&gt;
    &lt;g style=&quot;--c:var(--slate)&quot;&gt;&lt;rect class=&quot;fillc&quot; x=&quot;697&quot; y=&quot;20&quot; width=&quot;158&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;776&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;5 · Revenue&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;776&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot;&gt;when? control&lt;/text&gt;&lt;/g&gt;
  &lt;/svg&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. What is the difference between income and revenue?&lt;/summary&gt;&lt;div&gt;Revenue is the subset of income that arises from ordinary activities. Income also includes, for example, occasional gains.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. A right to payment from a customer that only requires 30 days to pass: contract asset or receivable?&lt;/summary&gt;&lt;div&gt;Receivable: the right is unconditional; only the passage of time is required. It is a contract asset when the right still depends on something else (e.g. future performance).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Does the transaction price include the VAT charged to the customer?&lt;/summary&gt;&lt;div&gt;No: amounts collected on behalf of third parties (such as some sales taxes) are excluded.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. When is the portfolio approach permitted?&lt;/summary&gt;&lt;div&gt;When the entity reasonably expects that the effect on the financial statements would not differ materially from applying the standard contract by contract (IFRS 15.4).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ SCOPE ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s-scope&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Part 2 · Scope&lt;/span&gt;
  &lt;h2&gt;Scope: which contracts are covered&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;IFRS 15 applies to &lt;b&gt;all contracts with customers&lt;/b&gt;, with four exceptions, and &lt;b&gt;only if the counterparty is genuinely a customer&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;Slides 6-7 · IFRS 15.5-6&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Exclusions (15.5)&lt;/h4&gt;
      &lt;ol class=&quot;alpha&quot;&gt;
        &lt;li&gt;&lt;b&gt;Lease&lt;/b&gt; contracts → IFRS 16 &lt;i&gt;Leases&lt;/i&gt;;&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Insurance contracts&lt;/b&gt; → IFRS 17 (although an entity may elect to apply IFRS 15 to insurance contracts whose primary purpose is the provision of services for a fixed fee, IFRS 17.8);&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Financial instruments&lt;/b&gt; and other contractual rights/obligations within the scope of IFRS 9, IFRS 10, IFRS 11, IAS 27, IAS 28;&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Non-monetary exchanges&lt;/b&gt; between entities in the same line of business to facilitate sales to customers: e.g. two oil companies swapping oil to serve customers in different locations.&lt;/li&gt;
      &lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Who is the customer (15.6)&lt;/h4&gt;
      &lt;p&gt;A &lt;i&gt;customer&lt;/i&gt; is a party that has contracted with the entity to obtain goods or services that are an &lt;b&gt;output of the entity&#x27;s ordinary activities&lt;/b&gt; in exchange for consideration.&lt;/p&gt;
      &lt;p&gt;A party that participates in an activity &lt;b&gt;sharing in its risks and benefits&lt;/b&gt; is &lt;b&gt;not&lt;/b&gt; a customer (e.g. joint development of an asset under a &lt;i&gt;collaboration arrangement&lt;/i&gt;): there is no exchange here, only a partnership.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Try it: IFRS 15 or not?&lt;/h3&gt;
  &lt;p class=&quot;note&quot;&gt;Pick a case: the page tells you which standard applies and why.&lt;/p&gt;
  &lt;div id=&quot;scopeBtns&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;out&quot; id=&quot;scopeOut&quot; aria-live=&quot;polite&quot;&gt;Select a case.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Why is an oil swap between two companies not IFRS 15 revenue?&lt;/summary&gt;&lt;div&gt;It is a non-monetary exchange between entities in the same line of business to facilitate sales to end customers: there is no sale to a customer, only a repositioning of inventory (15.5d).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Two pharmaceutical companies jointly develop a molecule, sharing costs and future profits. Is there a customer?&lt;/summary&gt;&lt;div&gt;No: the counterparty shares in the risks and benefits of the activity instead of acquiring an output of ordinary activities (15.6).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. A software company also leases office space to third parties: does the rental income fall under IFRS 15?&lt;/summary&gt;&lt;div&gt;No, leases fall under IFRS 16 (15.5a).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ STEP 1 ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s-contratto&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Step 1 · paras 9-16&lt;/span&gt;
  &lt;h2&gt;Identify the contract&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;An entity accounts for a contract with a customer &lt;b&gt;only when all five&lt;/b&gt; criteria in IFRS 15.9 are met. &lt;span class=&quot;src&quot;&gt;Slides 8-14&lt;/span&gt;&lt;/p&gt;

  &lt;h3&gt;Interactive checklist of the 5 criteria&lt;/h3&gt;
  &lt;div class=&quot;card chk&quot; id=&quot;chk&quot;&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;a&quot;&gt;&lt;b&gt;(a) Approval and commitment&lt;/b&gt;: the parties have approved the contract (in writing, orally or in accordance with customary business practices) and are committed to performing their obligations.&lt;/label&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;b&quot;&gt;&lt;b&gt;(b) Identifiable rights&lt;/b&gt;: each party&#x27;s rights regarding the goods/services can be identified.&lt;/label&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;c&quot;&gt;&lt;b&gt;(c) Identifiable payment terms&lt;/b&gt;.&lt;/label&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;d&quot;&gt;&lt;b&gt;(d) Commercial substance&lt;/b&gt;: the risk, timing or amount of future cash flows is expected to change as a result of the contract.&lt;/label&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;e&quot;&gt;&lt;b&gt;(e) Probable collectability&lt;/b&gt;: it is probable that the entity will collect the consideration to which it will be entitled, considering only the customer&#x27;s &lt;i&gt;ability and intention&lt;/i&gt; to pay when due.&lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;out bad&quot; id=&quot;chkOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;tint&quot;&gt;&lt;b&gt;Note on (e).&lt;/b&gt; The amount “to which the entity will be entitled” may be &lt;b&gt;lower than the stated price&lt;/b&gt; if the consideration is variable because the entity expects to offer a &lt;i&gt;price concession&lt;/i&gt; (para. 52). Collectability is therefore assessed on the expected amount, not on the list price.&lt;/div&gt;

  &lt;h3&gt;Form, duration and “contracts that do not exist”&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Form (15.10)&lt;/h4&gt;Contracts may be &lt;b&gt;written, oral or implied&lt;/b&gt; by customary business practices. Enforceability is a &lt;b&gt;matter of law&lt;/b&gt;; practices and processes vary across jurisdictions, industries and entities, and even across classes of customers.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Duration (15.11)&lt;/h4&gt;The standard is applied to the &lt;b&gt;contractual period&lt;/b&gt;: the period in which the parties have &lt;b&gt;present enforceable&lt;/b&gt; rights and obligations, even if the contract renews automatically or can be terminated at any time.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Wholly unperformed (15.12)&lt;/h4&gt;A contract &lt;b&gt;does not exist&lt;/b&gt; if each party has the unilateral right to terminate, without compensation, a &lt;b&gt;wholly unperformed&lt;/b&gt; contract: (a) nothing has been transferred and (b) no consideration has been received or is yet receivable.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Reassessment (15.13-14)&lt;/h4&gt;If the criteria are met at inception, they are &lt;b&gt;not reassessed&lt;/b&gt; unless there is a significant change in facts and circumstances (e.g. a significant deterioration in the customer&#x27;s ability to pay). If they are not met, the entity &lt;b&gt;continues to assess&lt;/b&gt; them over time.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Consideration received without a valid contract (15.15-16)&lt;/h3&gt;
  &lt;svg class=&quot;fig&quot; viewBox=&quot;0 0 820 250&quot; role=&quot;img&quot; aria-label=&quot;Diagram: consideration received without an IFRS 15 contract&quot;&gt;
    &lt;rect class=&quot;box&quot; x=&quot;10&quot; y=&quot;90&quot; width=&quot;190&quot; height=&quot;70&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Cash from customer&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;105&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot;&gt;but the 15.9 criteria&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;105&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot;&gt;are not met&lt;/text&gt;
    &lt;path class=&quot;ln&quot; d=&quot;M200 125H250&quot;/&gt;
    &lt;rect class=&quot;fillc&quot; x=&quot;250&quot; y=&quot;90&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;LIABILITY&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;350&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot;&gt;measured at amount received&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;350&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot;&gt;(transfer or refund)&lt;/text&gt;
    &lt;path class=&quot;ln&quot; d=&quot;M450 110 L520 45M450 125H520M450 140 L520 205&quot;/&gt;
    &lt;rect class=&quot;box&quot; x=&quot;520&quot; y=&quot;15&quot; width=&quot;290&quot; height=&quot;60&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;535&quot; y=&quot;40&quot; style=&quot;font-weight:600&quot;&gt;(a) no remaining obligations&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;535&quot; y=&quot;60&quot;&gt;and (substantially) all received, non-refundable → REVENUE&lt;/text&gt;
    &lt;rect class=&quot;box&quot; x=&quot;520&quot; y=&quot;95&quot; width=&quot;290&quot; height=&quot;60&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;535&quot; y=&quot;120&quot; style=&quot;font-weight:600&quot;&gt;(b) contract terminated&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;535&quot; y=&quot;140&quot;&gt;and consideration non-refundable → REVENUE&lt;/text&gt;
    &lt;rect class=&quot;box&quot; x=&quot;520&quot; y=&quot;175&quot; width=&quot;290&quot; height=&quot;60&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;535&quot; y=&quot;200&quot; style=&quot;font-weight:600&quot;&gt;15.9 criteria subsequently met&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;535&quot; y=&quot;220&quot;&gt;→ the normal model applies (15.14)&lt;/text&gt;
  &lt;/svg&gt;
  &lt;p&gt;The logic is prudent: without a valid contract, the cash received has not yet been “earned”. It remains a liability representing the obligation &lt;b&gt;either to transfer the good/service in the future or to refund&lt;/b&gt; the cash.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Can an oral contract meet criterion (a)?&lt;/summary&gt;&lt;div&gt;Yes: approval may be written, oral or in accordance with customary business practices, provided it creates enforceable rights.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. A gym membership that either party can cancel at any time without penalty, before it starts and with no payments made: is there a contract?&lt;/summary&gt;&lt;div&gt;No: it is wholly unperformed and each party can terminate it without compensation (15.12).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. After signing, the customer falls into serious financial distress. What does the entity do?&lt;/summary&gt;&lt;div&gt;It reassesses the criteria, in particular collectability, for the goods/services still to be transferred (15.13).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. How is the liability for consideration received in the absence of a contract measured?&lt;/summary&gt;&lt;div&gt;At the amount of consideration received (15.16).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ STEP 2 ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s-po&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Step 2 · paras 22-30&lt;/span&gt;
  &lt;h2&gt;Performance obligations and the concept of control&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;At &lt;i&gt;contract inception&lt;/i&gt; the entity assesses the promises in the contract and identifies as a &lt;b&gt;performance obligation&lt;/b&gt; each promise to transfer: (a) a &lt;b&gt;distinct&lt;/b&gt; good/service, or (b) a &lt;b&gt;series&lt;/b&gt; of distinct goods/services that are substantially the same and have the same pattern of transfer. &lt;span class=&quot;src&quot;&gt;Slide 15 · IFRS 15.22-23&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;(a) Distinct good or service&lt;/h4&gt;Each distinct promise is a separate PO and is allocated a portion of the price. Promises that are not distinct are combined until a distinct bundle is identified.
      &lt;div class=&quot;ext&quot; style=&quot;margin-bottom:0&quot;&gt;Under IFRS 15.27 a good is distinct if (i) the customer &lt;b&gt;can benefit from it&lt;/b&gt; on its own or together with readily available resources and (ii) the promise is &lt;b&gt;separately identifiable&lt;/b&gt; from other promises in the contract (it is not, for example, an input to a combined output). — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 text on ifrs.org&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;(b) Series&lt;/h4&gt;A series has the same pattern of transfer if &lt;b&gt;both&lt;/b&gt;:
      &lt;ol class=&quot;alpha&quot;&gt;&lt;li&gt;each good/service in the series would meet the criteria in para. 35 to be a PO satisfied &lt;b&gt;over time&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;&lt;b&gt;the same method&lt;/b&gt; would be used to measure progress (paras 39-40).&lt;/li&gt;&lt;/ol&gt;
      Typical example: a daily cleaning service for one year is &lt;b&gt;one&lt;/b&gt; PO, not 365.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;What “transfer” means: control&lt;/h3&gt;
  &lt;div class=&quot;quote&quot;&gt;An asset is transferred when (or as) the customer obtains &lt;b&gt;control&lt;/b&gt; of it: the ability to &lt;b&gt;direct the use&lt;/b&gt; of, and &lt;b&gt;obtain substantially all of the remaining benefits&lt;/b&gt; from, the asset.&lt;span class=&quot;src&quot;&gt;IFRS 15.31-33 · slides 16-18&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Control also includes the ability to &lt;b&gt;prevent other entities&lt;/b&gt; from directing the use of, and obtaining the benefits from, the asset. Goods and services are assets, even if only momentarily, when they are received and used (as is the case for many services). The &lt;b&gt;benefits&lt;/b&gt; are the potential cash flows (inflows or savings in outflows), which can be obtained, for example, by:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;using it to produce goods or provide services (including public services)&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;using it to enhance the value of other assets&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;using it to settle liabilities or reduce expenses&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;selling or exchanging it&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;pledging it to secure a loan&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;simply holding it&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tint&quot;&gt;For each PO the entity determines &lt;b&gt;at contract inception&lt;/b&gt; whether it is satisfied &lt;b&gt;over time&lt;/b&gt; (paras 35-37) or &lt;b&gt;at a point in time&lt;/b&gt; (para. 38). The rule is residual: &lt;b&gt;if it is not satisfied over time, it is satisfied at a point in time&lt;/b&gt; (15.32). See &lt;a href=&quot;#s-ricon&quot;&gt;step 5&lt;/a&gt; for details.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Why are POs the standard&#x27;s unit of account?&lt;/summary&gt;&lt;div&gt;Because the price (step 4) and the timing of revenue (step 5) are determined for each PO: a contract with several distinct promises generates revenue at different times.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. What are the two elements of the definition of control?&lt;/summary&gt;&lt;div&gt;The ability to direct the use of the asset and to obtain substantially all of its remaining benefits (including the ability to prevent others from doing so).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. A monthly maintenance service for 3 years: 36 POs or one?&lt;/summary&gt;&lt;div&gt;Normally a single PO consisting of a series: distinct services that are substantially the same, each satisfied over time and measured using the same method (15.22b-23).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ STEP 3 ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s-prezzo&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Step 3 · paras 46-72&lt;/span&gt;
  &lt;h2&gt;Determine the transaction price&lt;/h2&gt;
  &lt;div class=&quot;quote&quot;&gt;When (or as) a PO is satisfied, the entity recognises as revenue the amount of the &lt;b&gt;transaction price allocated&lt;/b&gt; to that PO, excluding estimates of variable consideration that are subject to the &lt;i&gt;constraint&lt;/i&gt; (paras 56-58).&lt;span class=&quot;src&quot;&gt;IFRS 15.46 · slide 28&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;To determine it, the entity considers the &lt;b&gt;terms of the contract&lt;/b&gt; and its &lt;b&gt;customary business practices&lt;/b&gt;. The price is the amount to which the entity &lt;b&gt;expects to be entitled&lt;/b&gt;, excluding amounts collected on behalf of third parties (e.g. some sales taxes); it may include &lt;b&gt;fixed amounts, variable amounts, or both&lt;/b&gt; (15.47). The nature, timing and amount of consideration affect the estimate; the entity must consider &lt;b&gt;five effects&lt;/b&gt; (15.48): &lt;span class=&quot;src&quot;&gt;slides 29-30&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Components of the transaction price&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;tp1&quot;&gt;a · Variable consideration&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;tp2&quot;&gt;b · Constraint&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;tp3&quot;&gt;c · Financing component&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;tp4&quot;&gt;d · Non-cash&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;tp5&quot;&gt;e · Payable to customer&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;tp1&quot;&gt;&lt;p&gt;&lt;b&gt;Variable consideration&lt;/b&gt; (paras 50-55 and 59): discounts, rebates, refunds, performance bonuses, penalties, volume incentives, price concessions, returns. It must be &lt;b&gt;estimated&lt;/b&gt; and &lt;b&gt;updated at the end of each reporting period&lt;/b&gt; to faithfully represent the circumstances (15.59); changes are accounted for under paras 87-90.&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;IFRS 15.53 provides two estimation methods; the entity uses the one that better predicts the amount: the &lt;b&gt;expected value&lt;/b&gt; (probability-weighted average, suited to a large number of similar contracts) and the &lt;b&gt;most likely amount&lt;/b&gt; (the single most likely outcome, suited to binary outcomes such as “bonus yes/no”). E.g.: a € 10,000 bonus for on-time delivery, 80% probability → most likely amount = € 10,000; expected value = € 8,000. — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 on ifrs.org&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;tp2&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Constraining estimates&lt;/b&gt; of variable consideration (paras 56-58): part of the variable consideration is kept out of the price while it remains too uncertain. The slides refer to it in the measurement paragraph (15.46).&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;Under IFRS 15.56 variable consideration is included only to the extent that it is &lt;b&gt;highly probable&lt;/b&gt; that a &lt;b&gt;significant reversal&lt;/b&gt; in the amount of cumulative revenue recognised will not occur when the uncertainty is subsequently resolved. — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 on ifrs.org&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;tp3&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Significant financing component&lt;/b&gt; (paras 60-65): if payment occurs well in advance of, or well after, the transfer, the contract contains a financing arrangement. Its effects (&lt;b&gt;interest revenue or interest expense&lt;/b&gt;) are presented &lt;b&gt;separately&lt;/b&gt; from revenue from contracts with customers in the statement of comprehensive income, and only to the extent that a &lt;i&gt;contract asset&lt;/i&gt; (or receivable) or a &lt;i&gt;contract liability&lt;/i&gt; is recognised (15.65, slide 32).&lt;/p&gt;
      &lt;p&gt;Example: today I sell a good for € 1,000 payable in 3 years. Revenue is the present value (about € 864 at 5%); the difference accrues as interest income over the 3 years.&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;Practical expedient (IFRS 15.63): no adjustment is needed if, at contract inception, the entity expects the period between transfer and payment to be &lt;b&gt;one year or less&lt;/b&gt;. — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 on ifrs.org&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;tp4&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Non-cash consideration&lt;/b&gt; (paras 66-69, slide 33): if the customer pays in kind (goods, services, shares…), the consideration is measured at &lt;b&gt;fair value&lt;/b&gt; (15.66). If fair value cannot be reasonably estimated, it is measured &lt;b&gt;indirectly&lt;/b&gt; by reference to the &lt;b&gt;stand-alone selling price&lt;/b&gt; of the goods/services promised to the customer (15.67).&lt;/p&gt;
      &lt;p&gt;Example: a start-up pays for consulting services with its own shares. Revenue = fair value of the shares; if this cannot be estimated, revenue = SSP of the consulting services.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;tp5&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Consideration payable to a customer&lt;/b&gt; (paras 70-72, slides 34-35): amounts paid (or payable) to the customer or to parties that purchase from the customer, including credits, &lt;b&gt;coupons and vouchers&lt;/b&gt;. Rule: it is a &lt;b&gt;reduction of the transaction price&lt;/b&gt; and therefore of revenue, &lt;b&gt;unless&lt;/b&gt; the payment is in exchange for a &lt;b&gt;distinct&lt;/b&gt; good/service received from the customer. In that case it is an ordinary purchase, but any &lt;b&gt;excess over fair value&lt;/b&gt; reduces the price; if fair value cannot be reasonably estimated, the &lt;b&gt;entire&lt;/b&gt; amount reduces the price (15.71).&lt;/p&gt;
      &lt;p&gt;Example: a soft-drink producer pays a supermarket (its customer) € 5,000 for shelf space with a fair value of € 3,000 → € 3,000 marketing expense, € 2,000 reduction of revenue.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Calculator: consideration payable to a customer&lt;/h3&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;label class=&quot;rng&quot;&gt;Payment to the customer &lt;input type=&quot;range&quot; id=&quot;cpP&quot; min=&quot;0&quot; max=&quot;10000&quot; step=&quot;500&quot; value=&quot;5000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Fair value of the good/service received &lt;input type=&quot;range&quot; id=&quot;cpFV&quot; min=&quot;0&quot; max=&quot;10000&quot; step=&quot;500&quot; value=&quot;3000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label style=&quot;font-size:.92rem&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;cpUnk&quot;&gt;Fair value cannot be reasonably estimated (or no distinct good received)&lt;/label&gt;
    &lt;div class=&quot;out&quot; id=&quot;cpOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Refund liabilities (para. 55)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;When&lt;/h4&gt;A &lt;b&gt;refund liability&lt;/b&gt; is recognised if the entity receives consideration from a customer and &lt;b&gt;expects to refund&lt;/b&gt; some or all of it.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;How much&lt;/h4&gt;At the amount of consideration received (or receivable) to which the entity &lt;b&gt;does not expect to be entitled&lt;/b&gt;, i.e. the portion excluded from the transaction price. It must be &lt;b&gt;updated at the end of each reporting period&lt;/b&gt;. For sales with a right of return, see B20-B27 (&lt;a href=&quot;#s-casi&quot;&gt;specific cases&lt;/a&gt;).&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Which five effects must be considered in determining the transaction price?&lt;/summary&gt;&lt;div&gt;Variable consideration, constraining estimates, significant financing component, non-cash consideration, consideration payable to a customer (15.48).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Where is the interest from the financing component presented?&lt;/summary&gt;&lt;div&gt;Separately from revenue from contracts with customers, in the statement of comprehensive income (15.65).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. The customer pays with used machinery whose fair value cannot be estimated. How is revenue measured?&lt;/summary&gt;&lt;div&gt;Indirectly, by reference to the stand-alone selling price of the goods/services promised to the customer (15.67).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Is a discount voucher given to the customer a marketing expense?&lt;/summary&gt;&lt;div&gt;Normally not: it is consideration payable to a customer and reduces the transaction price, unless it pays for a distinct good/service received from the customer (15.70).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ STEP 4 ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s-alloc&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Step 4 · paras 73-90&lt;/span&gt;
  &lt;h2&gt;Allocate the price to the performance obligations&lt;/h2&gt;
  &lt;div class=&quot;quote&quot;&gt;Objective: to allocate the transaction price to each PO (or distinct good/service) in an amount that depicts the consideration to which the entity expects to be entitled in exchange for transferring it.&lt;span class=&quot;src&quot;&gt;IFRS 15.73-75 · slide 36&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;The basis is the &lt;b&gt;relative stand-alone selling price&lt;/b&gt; (relative SSP). As a formula:&lt;/p&gt;
  &lt;p class=&quot;quote&quot; style=&quot;text-align:center;font-size:1.25rem&quot;&gt;Allocated price&lt;sub&gt;i&lt;/sub&gt; = Transaction price × SSP&lt;sub&gt;i&lt;/sub&gt; / Σ SSP&lt;/p&gt;
  &lt;div class=&quot;ext&quot;&gt;If the SSP is not directly observable, IFRS 15.79 requires it to be estimated using, for example, the &lt;b&gt;adjusted market assessment approach&lt;/b&gt;, the &lt;b&gt;expected cost plus a margin approach&lt;/b&gt; or, in limited circumstances, the &lt;b&gt;residual approach&lt;/b&gt;. — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 on ifrs.org&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Workshop: allocation using relative SSPs&lt;/h3&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;label class=&quot;rng&quot;&gt;Product SSP &lt;input type=&quot;range&quot; id=&quot;aA&quot; min=&quot;100&quot; max=&quot;2000&quot; step=&quot;50&quot; value=&quot;800&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Service SSP &lt;input type=&quot;range&quot; id=&quot;aB&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;50&quot; value=&quot;300&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Licence SSP &lt;input type=&quot;range&quot; id=&quot;aC&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;50&quot; value=&quot;100&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Contract price &lt;input type=&quot;range&quot; id=&quot;aTP&quot; min=&quot;100&quot; max=&quot;4000&quot; step=&quot;50&quot; value=&quot;1000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;svg class=&quot;fig&quot; viewBox=&quot;0 0 660 120&quot; role=&quot;img&quot; aria-label=&quot;Bars: SSP and allocated price&quot;&gt;
      &lt;text class=&quot;s&quot; x=&quot;10&quot; y=&quot;16&quot;&gt;Sum of SSPs&lt;/text&gt;
      &lt;rect id=&quot;sA&quot; y=&quot;22&quot; height=&quot;28&quot; style=&quot;fill:var(--brick);opacity:.35&quot;/&gt;&lt;rect id=&quot;sB&quot; y=&quot;22&quot; height=&quot;28&quot; style=&quot;fill:var(--ochre);opacity:.35&quot;/&gt;&lt;rect id=&quot;sC&quot; y=&quot;22&quot; height=&quot;28&quot; style=&quot;fill:var(--slate);opacity:.35&quot;/&gt;
      &lt;text class=&quot;s&quot; x=&quot;10&quot; y=&quot;76&quot;&gt;Allocated transaction price&lt;/text&gt;
      &lt;rect id=&quot;rA&quot; y=&quot;82&quot; height=&quot;28&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;rect id=&quot;rB&quot; y=&quot;82&quot; height=&quot;28&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;rect id=&quot;rC&quot; y=&quot;82&quot; height=&quot;28&quot; style=&quot;fill:var(--slate)&quot;/&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;SSP&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Weight&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Allocated price&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;aTab&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;out&quot; id=&quot;aOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Allocating a discount (paras 81-83)&lt;/h3&gt;
  &lt;p&gt;A &lt;b&gt;discount&lt;/b&gt; exists if the sum of the SSPs exceeds the promised consideration. General rule: it is allocated &lt;b&gt;proportionately to all POs&lt;/b&gt; (the natural consequence of the relative SSP method). &lt;span class=&quot;src&quot;&gt;Slides 37-38&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;tint&quot;&gt;&lt;b&gt;Exception (15.82):&lt;/b&gt; the discount is allocated &lt;b&gt;entirely&lt;/b&gt; to one or more, but not all, POs if &lt;b&gt;all&lt;/b&gt; of the following criteria are met:
    &lt;ol class=&quot;alpha&quot;&gt;&lt;li&gt;the entity regularly sells each distinct good/service (or bundle) in the contract &lt;b&gt;on a stand-alone basis&lt;/b&gt;;&lt;/li&gt;
    &lt;li&gt;it also regularly sells on a stand-alone basis a &lt;b&gt;bundle of some&lt;/b&gt; of those goods at a discount to their SSPs;&lt;/li&gt;
    &lt;li&gt;the discount on that bundle is &lt;b&gt;substantially the same&lt;/b&gt; as the discount in the contract, and the analysis provides &lt;b&gt;observable evidence&lt;/b&gt; of the PO to which the discount belongs.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;Example based on the standard&#x27;s Illustrative Examples: A (SSP 40), B (55), C (45), price 100 → discount 40. If B+C are regularly sold together for 60, the whole discount of 40 is allocated to B and C: A receives 40, B and C share 60 (B 33, C 27). — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 on ifrs.org&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Allocating variable consideration (paras 84-86)&lt;/h3&gt;
  &lt;p&gt;A variable amount (and subsequent changes in it) is allocated &lt;b&gt;entirely&lt;/b&gt; to a PO, or to a distinct good within a series (22b), if &lt;b&gt;both&lt;/b&gt;: (a) the terms of the variable payment relate &lt;b&gt;specifically&lt;/b&gt; to the entity&#x27;s efforts to satisfy that PO or to a specific outcome of it; (b) allocating it entirely is consistent with the allocation objective when considering all POs and payment terms. &lt;span class=&quot;src&quot;&gt;Slide 39 · IFRS 15.85&lt;/span&gt;&lt;/p&gt;
  &lt;p class=&quot;note&quot;&gt;Example: a € 2,000 bonus linked only to early delivery of the plant, in a contract that also includes maintenance → the whole bonus is allocated to the plant.&lt;/p&gt;

  &lt;h3&gt;Changes in the transaction price (paras 87-90)&lt;/h3&gt;
  &lt;div class=&quot;steps card&quot;&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;1 · Why it changes&lt;/h4&gt;After contract inception the price may change because uncertain events are resolved or other circumstances change the expected consideration (15.87).&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;2 · Same basis as at inception&lt;/h4&gt;Changes are allocated to the POs &lt;b&gt;on the same basis as at contract inception&lt;/b&gt;. The price is not reallocated to reflect subsequent changes in SSPs (15.88).&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;3 · POs already satisfied&lt;/h4&gt;The amount allocated to POs already satisfied is recognised immediately as revenue (or as a reduction of revenue) &lt;b&gt;in the period in which the price changes&lt;/b&gt; (15.88).&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;4 · After a contract modification&lt;/h4&gt;If the change results from a contract modification, paras 18-21 apply. If instead it occurs after a modification (15.90): (a) it is allocated to the &lt;b&gt;pre-modification&lt;/b&gt; POs if it arises from variable consideration promised before the modification and the modification is accounted for under 21(a); (b) in all other cases (modification not accounted for as a separate contract, para. 20) it is allocated to the POs of the modified contract that are still &lt;b&gt;not (fully) satisfied&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;b prev&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;b next&quot;&gt;Next →&lt;/button&gt;&lt;span class=&quot;cnt note&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. A phone (SSP 600) + 12 months of service (SSP 300) sold for 720. How much is allocated to the phone?&lt;/summary&gt;&lt;div&gt;720 × 600/900 = 480; 240 to the service. The discount of 180 is allocated proportionately.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. The service SSP increases after signing: is the price reallocated?&lt;/summary&gt;&lt;div&gt;No: subsequent changes in SSPs do not lead to reallocation (15.88).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. When is the discount allocated only to some POs?&lt;/summary&gt;&lt;div&gt;When all three criteria in 15.82 are met, i.e. there is observable evidence of regular sales of that sub-bundle at the same discount.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ STEP 5 ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s-ricon&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Step 5 · paras 31-45&lt;/span&gt;
  &lt;h2&gt;Recognise revenue: over time or at a point in time&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Revenue is recognised &lt;b&gt;when (or as)&lt;/b&gt; the PO is satisfied, i.e. when the customer obtains &lt;b&gt;control&lt;/b&gt; of the asset. First question: does the PO meet one of the three &lt;i&gt;over time&lt;/i&gt; criteria? &lt;span class=&quot;src&quot;&gt;Slides 16, 19 · IFRS 15.31-35&lt;/span&gt;&lt;/p&gt;

  &lt;svg class=&quot;fig&quot; viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;Decision tree: over time / point in time&quot;&gt;
    &lt;rect class=&quot;box&quot; x=&quot;10&quot; y=&quot;20&quot; width=&quot;250&quot; height=&quot;62&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;22&quot; y=&quot;44&quot; style=&quot;font-weight:600&quot;&gt;(a) Customer simultaneously receives&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;22&quot; y=&quot;64&quot;&gt;and consumes the benefits (B3-B4)&lt;/text&gt;
    &lt;rect class=&quot;box&quot; x=&quot;10&quot; y=&quot;118&quot; width=&quot;250&quot; height=&quot;62&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;22&quot; y=&quot;142&quot; style=&quot;font-weight:600&quot;&gt;(b) Creates/enhances an asset the&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;22&quot; y=&quot;162&quot;&gt;customer controls as it is created (e.g. WIP, B5)&lt;/text&gt;
    &lt;rect class=&quot;box&quot; x=&quot;10&quot; y=&quot;216&quot; width=&quot;250&quot; height=&quot;70&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;22&quot; y=&quot;240&quot; style=&quot;font-weight:600&quot;&gt;(c) No alternative use (para. 36)&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;22&quot; y=&quot;258&quot;&gt;AND enforceable right to payment&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;22&quot; y=&quot;273&quot;&gt;for performance completed (para. 37)&lt;/text&gt;
    &lt;path class=&quot;ln&quot; d=&quot;M260 51H330M260 149H330M260 251H330M330 51V251&quot;/&gt;
    &lt;rect class=&quot;fillc&quot; x=&quot;360&quot; y=&quot;110&quot; width=&quot;150&quot; height=&quot;80&quot; rx=&quot;40&quot;/&gt;&lt;text x=&quot;435&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;At least one?&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;435&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot;&gt;(“one of the following”)&lt;/text&gt;
    &lt;path class=&quot;ln&quot; d=&quot;M330 150H360M510 150H560M560 150V70H600M560 150V230H600&quot;/&gt;
    &lt;text class=&quot;s yes&quot; x=&quot;566&quot; y=&quot;62&quot;&gt;YES&lt;/text&gt;&lt;text class=&quot;s noo&quot; x=&quot;566&quot; y=&quot;248&quot;&gt;NO&lt;/text&gt;
    &lt;rect class=&quot;box&quot; x=&quot;600&quot; y=&quot;30&quot; width=&quot;250&quot; height=&quot;80&quot; rx=&quot;10&quot; style=&quot;stroke:var(--ok)&quot;/&gt;&lt;text x=&quot;615&quot; y=&quot;58&quot; style=&quot;font-weight:600&quot;&gt;OVER TIME&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;615&quot; y=&quot;78&quot;&gt;revenue over time, measuring&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;615&quot; y=&quot;94&quot;&gt;progress (paras 39-45)&lt;/text&gt;
    &lt;rect class=&quot;box&quot; x=&quot;600&quot; y=&quot;190&quot; width=&quot;250&quot; height=&quot;80&quot; rx=&quot;10&quot; style=&quot;stroke:var(--no)&quot;/&gt;&lt;text x=&quot;615&quot; y=&quot;218&quot; style=&quot;font-weight:600&quot;&gt;AT A POINT IN TIME&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;615&quot; y=&quot;238&quot;&gt;revenue when control passes,&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;615&quot; y=&quot;254&quot;&gt;based on the indicators in 15.38&lt;/text&gt;
  &lt;/svg&gt;
  &lt;p class=&quot;note&quot;&gt;Note: on slide 19 the third criterion is labelled “(a)” again because of a typo; in the standard it is criterion &lt;b&gt;(c)&lt;/b&gt;.&lt;/p&gt;

  &lt;h3&gt;Classify it yourself&lt;/h3&gt;
  &lt;div id=&quot;otBtns&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;out&quot; id=&quot;otOut&quot; aria-live=&quot;polite&quot;&gt;Choose a situation.&lt;/div&gt;

  &lt;h3&gt;Indicators of the transfer of control at a point in time (15.38)&lt;/h3&gt;
  &lt;p&gt;If the PO is not satisfied over time, the point in time is determined using the control requirements (paras 31-34) and a non-exhaustive list of indicators: &lt;span class=&quot;src&quot;&gt;slides 20-24&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Indicators of control&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;in1&quot;&gt;a · Right to payment&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;in2&quot;&gt;b · Legal title&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;in3&quot;&gt;c · Physical possession&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;in4&quot;&gt;d · Risks &amp;amp; rewards&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;in5&quot;&gt;e · Acceptance&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;in1&quot;&gt;&lt;b&gt;Present right to payment.&lt;/b&gt; If the customer is presently obliged to pay, this may indicate that it has obtained the ability to direct the use of, and obtain the benefits from, the asset.&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;in2&quot; hidden&gt;&lt;b&gt;Legal title.&lt;/b&gt; The transfer of legal title may indicate control. If the seller retains title &lt;b&gt;solely as protection&lt;/b&gt; against the customer&#x27;s failure to pay (e.g. retention of title), this does not preclude the customer from obtaining control.&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;in3&quot; hidden&gt;&lt;b&gt;Physical possession.&lt;/b&gt; A strong but not decisive indicator. In &lt;i&gt;repurchase agreements&lt;/i&gt; and &lt;i&gt;consignment arrangements&lt;/i&gt; the customer/consignee may hold the asset while it is still controlled by the entity. Conversely, in a &lt;i&gt;bill-and-hold&lt;/i&gt; arrangement (invoiced but kept in the seller&#x27;s warehouse) the entity holds an asset the customer already controls. Guidance: B64-B76, B77-B78, B79-B82.&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;in4&quot; hidden&gt;&lt;b&gt;Significant risks and rewards of ownership.&lt;/b&gt; An indicator, no longer the decisive criterion it was under the former IAS 18. Risks that give rise to a separate PO are excluded: e.g. control of the machine has passed but the promised maintenance is still to be performed.&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;in5&quot; hidden&gt;&lt;b&gt;Customer acceptance.&lt;/b&gt; Customer acceptance may indicate control; for contractual customer acceptance clauses see B83-B86.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Over time vs point in time: the revenue profile&lt;/h3&gt;
  &lt;p&gt;A € 800,000 contract, with delivery at the end of the 8th quarter. Move the slider to see cumulative revenue recognised under the two models.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;tchart&quot;&gt;
    &lt;svg class=&quot;fig&quot; viewBox=&quot;0 0 600 250&quot; role=&quot;img&quot; aria-label=&quot;Chart of cumulative revenue&quot;&gt;
      &lt;path class=&quot;ln&quot; d=&quot;M50 220H580M50 220V30&quot;/&gt;
      &lt;text class=&quot;s&quot; x=&quot;10&quot; y=&quot;44&quot;&gt;100%&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;18&quot; y=&quot;134&quot;&gt;50%&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;26&quot; y=&quot;224&quot;&gt;0&lt;/text&gt;
      &lt;path d=&quot;M50 130H570M50 40H570&quot; style=&quot;stroke:var(--rule);stroke-dasharray:3 4&quot;/&gt;
      &lt;g class=&quot;s&quot;&gt;&lt;text x=&quot;50&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot;&gt;Q0&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot;&gt;Q2&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot;&gt;Q4&lt;/text&gt;&lt;text x=&quot;440&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot;&gt;Q6&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot;&gt;Q8&lt;/text&gt;&lt;/g&gt;
      &lt;path id=&quot;otPath&quot; style=&quot;fill:none;stroke:var(--slate);stroke-width:3&quot;/&gt;
      &lt;path d=&quot;M50 220H570V40&quot; style=&quot;fill:none;stroke:var(--brick);stroke-width:3;stroke-dasharray:7 5&quot;/&gt;
      &lt;line id=&quot;mk&quot; y1=&quot;30&quot; y2=&quot;220&quot; style=&quot;stroke:var(--ink);stroke-width:1;opacity:.5&quot;/&gt;
      &lt;circle id=&quot;d1&quot; r=&quot;6&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;circle id=&quot;d2&quot; r=&quot;6&quot; style=&quot;fill:var(--brick)&quot;/&gt;
      &lt;text x=&quot;360&quot; y=&quot;60&quot; style=&quot;fill:var(--slate);font-weight:600&quot;&gt;over time (input method)&lt;/text&gt;
      &lt;text x=&quot;360&quot; y=&quot;200&quot; style=&quot;fill:var(--brick);font-weight:600&quot;&gt;point in time&lt;/text&gt;
    &lt;/svg&gt;
    &lt;label class=&quot;rng&quot;&gt;Quarter &lt;input type=&quot;range&quot; id=&quot;tq&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;1&quot; value=&quot;3&quot; data-fmt=&quot;n&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;out&quot; id=&quot;tOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Measuring progress (paras 39-43)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Objective and rules&lt;/h4&gt;&lt;ul&gt;
      &lt;li&gt;Depict the entity&#x27;s performance in transferring control (15.39).&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;A single method&lt;/b&gt; for each PO, applied consistently to similar POs; &lt;b&gt;remeasured at the end of each reporting period&lt;/b&gt; (15.40).&lt;/li&gt;
      &lt;li&gt;The method is chosen considering the &lt;b&gt;nature&lt;/b&gt; of the good/service (15.41).&lt;/li&gt;
      &lt;li&gt;Goods/services whose control does &lt;b&gt;not&lt;/b&gt; pass to the customer are excluded; those that do pass are included (15.42).&lt;/li&gt;
      &lt;li&gt;Revisions to the measure are a &lt;b&gt;change in accounting estimate&lt;/b&gt; under IAS 8, hence applied prospectively (15.43).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Output vs input methods (B14-B19)&lt;/h4&gt;
      &lt;p&gt;&lt;b&gt;Output methods&lt;/b&gt;: measure the value transferred to the customer.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Input methods&lt;/b&gt;: measure the entity&#x27;s efforts relative to the total expected efforts.&lt;/p&gt;
      &lt;div class=&quot;ext&quot; style=&quot;margin:6px 0 0&quot;&gt;Examples from the standard: output = surveys of performance completed, &lt;i&gt;milestones&lt;/i&gt; reached, units produced or delivered; input = resources consumed, labour hours, costs incurred (&lt;i&gt;cost-to-cost&lt;/i&gt;), machine hours. — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 on ifrs.org&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Cost-to-cost calculator with a change in estimate&lt;/h3&gt;
  &lt;p class=&quot;note&quot;&gt;Progress = cumulative costs incurred / estimated total costs. Cumulative revenue = progress × price. Revenue for the year is the difference between cumulative amounts (&lt;i&gt;cumulative catch-up&lt;/i&gt;).&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;label class=&quot;rng&quot;&gt;Contract price &lt;input type=&quot;range&quot; id=&quot;cp&quot; min=&quot;5000&quot; max=&quot;20000&quot; step=&quot;500&quot; value=&quot;10000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Year 1 · estimated total costs &lt;input type=&quot;range&quot; id=&quot;ce1&quot; min=&quot;1000&quot; max=&quot;20000&quot; step=&quot;500&quot; value=&quot;8000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Year 1 · costs incurred &lt;input type=&quot;range&quot; id=&quot;c1&quot; min=&quot;0&quot; max=&quot;20000&quot; step=&quot;250&quot; value=&quot;2000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;bar&quot;&gt;&lt;span id=&quot;ccBar1&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;label class=&quot;rng&quot;&gt;Year 2 · estimated total costs (revised) &lt;input type=&quot;range&quot; id=&quot;ce2&quot; min=&quot;1000&quot; max=&quot;25000&quot; step=&quot;500&quot; value=&quot;10000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Year 2 · cumulative costs &lt;input type=&quot;range&quot; id=&quot;c2&quot; min=&quot;0&quot; max=&quot;25000&quot; step=&quot;250&quot; value=&quot;6000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;bar&quot;&gt;&lt;span id=&quot;ccBar2&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;out&quot; id=&quot;ccOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;If estimated costs exceed the price, the contract is &lt;i&gt;onerous&lt;/i&gt; (loss-making): IFRS 15 does not deal with the expected loss, which falls under IAS 37 &lt;i&gt;Provisions&lt;/i&gt;. — &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-37-provisions-contingent-liabilities-and-contingent-assets.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IAS 37&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Which “residual” rule links over time and point in time?&lt;/summary&gt;&lt;div&gt;If a PO is not satisfied over time (none of the three criteria in 15.35 is met), it is satisfied at a point in time (15.32).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. The seller retains title until payment, but the customer is already using the asset. Who has control?&lt;/summary&gt;&lt;div&gt;Probably the customer: title retained solely to protect the receivable does not prevent control from passing (15.38b).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Bill-and-hold: the good is still in the seller&#x27;s warehouse. Can revenue be recognised?&lt;/summary&gt;&lt;div&gt;Yes, if the customer already has control of it: physical possession and control may not coincide (15.38c, B79-B82).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. At the end of year 2 the estimate of total costs increases: are the year 1 accounts reopened?&lt;/summary&gt;&lt;div&gt;No: it is a change in estimate (IAS 8), recognised prospectively by updating cumulative revenue in the current year (15.43).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;5. Why are risks and rewards only an indicator?&lt;/summary&gt;&lt;div&gt;Because IFRS 15 is based on control; risks &amp;amp; rewards are one of five indicators, and those that give rise to a separate PO are excluded (15.38d).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ CONTRACT COSTS ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s-costi&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Part 8 · paras 91-104&lt;/span&gt;
  &lt;h2&gt;Contract costs: when a cost becomes an asset&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;IFRS 15 is not only about revenue: it also specifies when contract-related costs are &lt;b&gt;capitalised&lt;/b&gt; (recognised as an asset) and then expensed in profit or loss together with the revenue they generate. &lt;span class=&quot;src&quot;&gt;Slides 42-46&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Incremental costs of obtaining a contract (15.91)&lt;/h4&gt;
      &lt;b&gt;Incremental&lt;/b&gt; costs of obtaining a contract (costs that would not have been incurred without it, e.g. a sales commission paid only if the customer signs) are recognised as an asset &lt;b&gt;if the entity expects to recover them&lt;/b&gt;.
      &lt;div class=&quot;ext&quot; style=&quot;margin-bottom:0&quot;&gt;Costs incurred regardless of whether the contract is obtained (e.g. legal fees for negotiations) are expensed as incurred unless they are explicitly chargeable to the customer (15.92). Practical expedient (15.94): if the amortisation period would be ≤ 1 year, they may be expensed immediately. — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 on ifrs.org&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Costs to fulfil a contract (15.95)&lt;/h4&gt;
      If they are not within the scope of another standard (IAS 2 &lt;i&gt;Inventories&lt;/i&gt;, IAS 16 &lt;i&gt;Property, Plant and Equipment&lt;/i&gt;, IAS 38 &lt;i&gt;Intangible Assets&lt;/i&gt;), they are capitalised only if &lt;b&gt;all&lt;/b&gt; of the following apply:
      &lt;ol class=&quot;alpha&quot;&gt;&lt;li&gt;they relate &lt;b&gt;directly&lt;/b&gt; to a contract, or to an anticipated contract that can be specifically identified (e.g. a renewal, design work for a contract not yet approved);&lt;/li&gt;&lt;li&gt;they &lt;b&gt;generate or enhance resources&lt;/b&gt; that will be used in satisfying future POs;&lt;/li&gt;&lt;li&gt;they are expected to be &lt;b&gt;recovered&lt;/b&gt;.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Direct costs (15.97)&lt;/h4&gt;&lt;ol class=&quot;alpha&quot;&gt;&lt;li&gt;direct labour (wages of employees providing the service);&lt;/li&gt;&lt;li&gt;direct materials;&lt;/li&gt;&lt;li&gt;allocations of costs that relate directly to the contract (contract management and supervision, insurance, depreciation of tools, equipment and &lt;i&gt;right-of-use assets&lt;/i&gt;);&lt;/li&gt;&lt;li&gt;costs explicitly chargeable to the customer;&lt;/li&gt;&lt;li&gt;other costs incurred only because the entity entered into the contract (e.g. subcontractors).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Always expensed when incurred (15.98)&lt;/h4&gt;&lt;ol class=&quot;alpha&quot;&gt;&lt;li&gt;general and administrative costs (unless explicitly chargeable to the customer → para. 97);&lt;/li&gt;&lt;li&gt;wasted materials, labour or other resources not reflected in the price;&lt;/li&gt;&lt;li&gt;costs that relate to POs already (partially) satisfied, i.e. to past performance;&lt;/li&gt;&lt;li&gt;costs that cannot be distinguished between satisfied and unsatisfied POs.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Game: asset or expense?&lt;/h3&gt;
  &lt;div class=&quot;card sorter&quot;&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;A&quot; data-why=&quot;Incremental cost of obtaining the contract, recoverable (15.91).&quot;&gt;&lt;span&gt;5% commission to the salesperson, payable only when the contract is signed&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;b&quot; data-v=&quot;A&quot;&gt;Asset&lt;/button&gt;&lt;button class=&quot;b&quot; data-v=&quot;E&quot;&gt;Expense&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot; hidden&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;E&quot; data-why=&quot;Incurred regardless of whether the contract is signed: not incremental (15.92, external source).&quot;&gt;&lt;span&gt;Lawyer&#x27;s fee for the negotiations, payable even if the customer does not sign&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;b&quot; data-v=&quot;A&quot;&gt;Asset&lt;/button&gt;&lt;button class=&quot;b&quot; data-v=&quot;E&quot;&gt;Expense&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot; hidden&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;A&quot; data-why=&quot;Cost to fulfil a specific anticipated contract, generating resources for future POs (15.95a).&quot;&gt;&lt;span&gt;Design of a plant for a specific contract not yet approved&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;b&quot; data-v=&quot;A&quot;&gt;Asset&lt;/button&gt;&lt;button class=&quot;b&quot; data-v=&quot;E&quot;&gt;Expense&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot; hidden&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;E&quot; data-why=&quot;General and administrative costs not chargeable to the customer (15.98a).&quot;&gt;&lt;span&gt;Share of the head-office rent&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;b&quot; data-v=&quot;A&quot;&gt;Asset&lt;/button&gt;&lt;button class=&quot;b&quot; data-v=&quot;E&quot;&gt;Expense&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot; hidden&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;E&quot; data-why=&quot;Waste not reflected in the price (15.98b).&quot;&gt;&lt;span&gt;Materials scrapped because of a production error&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;b&quot; data-v=&quot;A&quot;&gt;Asset&lt;/button&gt;&lt;button class=&quot;b&quot; data-v=&quot;E&quot;&gt;Expense&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot; hidden&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;E&quot; data-why=&quot;Relates to performance already completed, i.e. to satisfied POs (15.98c).&quot;&gt;&lt;span&gt;Technicians&#x27; salaries for the service already provided this month&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;b&quot; data-v=&quot;A&quot;&gt;Asset&lt;/button&gt;&lt;button class=&quot;b&quot; data-v=&quot;E&quot;&gt;Expense&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot; hidden&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Amortisation and impairment (paras 99-104)&lt;/h3&gt;
  &lt;p&gt;The asset arising from capitalised costs is &lt;b&gt;amortised on a systematic basis&lt;/b&gt; consistent with the transfer of the goods/services to which it relates, including those under anticipated contracts (15.99). If there is a significant change in the expected timing, amortisation is updated as a change in estimate under IAS 8 (15.100). &lt;span class=&quot;src&quot;&gt;Slide 46&lt;/span&gt;&lt;/p&gt;
  &lt;p class=&quot;quote&quot; style=&quot;text-align:center&quot;&gt;Impairment loss = max { 0 ; Carrying amount − (Remaining expected consideration − Direct costs not yet expensed) }&lt;span class=&quot;src&quot;&gt;IFRS 15.101&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;label class=&quot;rng&quot;&gt;Carrying amount of the asset &lt;input type=&quot;range&quot; id=&quot;iCA&quot; min=&quot;0&quot; max=&quot;10000&quot; step=&quot;250&quot; value=&quot;4000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Remaining expected consideration &lt;input type=&quot;range&quot; id=&quot;iR&quot; min=&quot;0&quot; max=&quot;20000&quot; step=&quot;250&quot; value=&quot;9000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Direct costs not yet expensed &lt;input type=&quot;range&quot; id=&quot;iC&quot; min=&quot;0&quot; max=&quot;20000&quot; step=&quot;250&quot; value=&quot;6000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;out&quot; id=&quot;iOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. What is the key test for capitalising a cost of obtaining a contract?&lt;/summary&gt;&lt;div&gt;It must be incremental (not incurred without the contract) and recoverable (15.91).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Do costs to fulfil a contract already covered by IAS 2 follow IFRS 15.95?&lt;/summary&gt;&lt;div&gt;No: IFRS 15.95 applies only if the costs are not within the scope of another standard (IAS 2, IAS 16, IAS 38…).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. How is the asset arising from contract costs amortised?&lt;/summary&gt;&lt;div&gt;On a systematic basis consistent with the transfer to the customer of the related goods/services (15.99).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PRESENTATION ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s-present&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Part 9 · paras 105-109&lt;/span&gt;
  &lt;h2&gt;Presentation: contract asset, contract liability, receivable&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;When either party has performed, the contract is presented in the statement of financial position as a &lt;b&gt;contract asset&lt;/b&gt; or a &lt;b&gt;contract liability&lt;/b&gt;, depending on who “went first”: the entity by performing or the customer by paying. &lt;b&gt;Unconditional&lt;/b&gt; rights are presented separately as a &lt;b&gt;receivable&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;Slides 47-49&lt;/span&gt;&lt;/p&gt;
  &lt;svg class=&quot;fig&quot; viewBox=&quot;0 0 860 210&quot; role=&quot;img&quot; aria-label=&quot;Who performs first&quot;&gt;
    &lt;rect class=&quot;fillc&quot; x=&quot;10&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;170&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;25&quot; y=&quot;48&quot; style=&quot;font-weight:600&quot;&gt;The customer pays first&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;25&quot; y=&quot;72&quot;&gt;(or payment is due, if earlier)&lt;/text&gt;&lt;text x=&quot;25&quot; y=&quot;110&quot; style=&quot;font-weight:600;fill:var(--brick)&quot;&gt;CONTRACT LIABILITY&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;25&quot; y=&quot;134&quot;&gt;obligation to transfer goods/services&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;25&quot; y=&quot;152&quot;&gt;for which payment was received (15.106)&lt;/text&gt;
    &lt;rect class=&quot;fillc&quot; x=&quot;295&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;170&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;48&quot; style=&quot;font-weight:600&quot;&gt;The entity performs first&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;310&quot; y=&quot;72&quot;&gt;right still conditional&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;110&quot; style=&quot;font-weight:600;fill:var(--slate)&quot;&gt;CONTRACT ASSET&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;310&quot; y=&quot;134&quot;&gt;impairment as for IFRS 9 assets&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;310&quot; y=&quot;152&quot;&gt;(15.107)&lt;/text&gt;
    &lt;rect class=&quot;fillc&quot; x=&quot;580&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;170&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;595&quot; y=&quot;48&quot; style=&quot;font-weight:600&quot;&gt;Only time must pass&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;595&quot; y=&quot;72&quot;&gt;unconditional right&lt;/text&gt;&lt;text x=&quot;595&quot; y=&quot;110&quot; style=&quot;font-weight:600;fill:var(--sage)&quot;&gt;RECEIVABLE&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;595&quot; y=&quot;134&quot;&gt;accounted for under IFRS 9&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;595&quot; y=&quot;152&quot;&gt;even if subject to future refund&lt;/text&gt;
  &lt;/svg&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;Receivable (15.108):&lt;/b&gt; unconditional right = only the passage of time is required. On initial recognition, any difference between the receivable measured under IFRS 9 and the revenue recognised is presented as an &lt;b&gt;expense&lt;/b&gt; (e.g. an impairment loss).&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Contract asset:&lt;/b&gt; impairment is measured, presented and disclosed as for financial assets under IFRS 9 (see 113b).&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h3&gt;Step by step: two scenarios&lt;/h3&gt;
  &lt;div class=&quot;steps card&quot;&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;Scenario A · 1 January — customer advance&lt;/h4&gt;&lt;p&gt;A € 1,000 contract for a good to be delivered on 31 March; the customer pays in advance on 1 January.&lt;/p&gt;&lt;div class=&quot;je&quot;&gt;Dr Cash                 1,000
   Cr Contract liability       1,000&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;Scenario A · 31 March — delivery&lt;/h4&gt;&lt;p&gt;Control passes: the liability is settled through performance.&lt;/p&gt;&lt;div class=&quot;je&quot;&gt;Dr Contract liability   1,000
   Cr Revenue                  1,000&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;Scenario B · delivery of product X&lt;/h4&gt;&lt;p&gt;Contract: X (€ 400 allocated) and Y (€ 600), price € 1,000 payable &lt;b&gt;only after both have been delivered&lt;/b&gt;. I deliver X: I am entitled to consideration, but the right is &lt;b&gt;conditional&lt;/b&gt; on delivering Y.&lt;/p&gt;&lt;div class=&quot;je&quot;&gt;Dr Contract asset         400
   Cr Revenue                    400&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;Scenario B · delivery of product Y&lt;/h4&gt;&lt;p&gt;The right to the full amount is now unconditional: the contract asset becomes a receivable.&lt;/p&gt;&lt;div class=&quot;je&quot;&gt;Dr Receivable           1,000
   Cr Contract asset             400
   Cr Revenue                    600&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;Scenario B · collection&lt;/h4&gt;&lt;div class=&quot;je&quot;&gt;Dr Cash                 1,000
   Cr Receivable               1,000&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Teaching example constructed on the basis of paras 105-108.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;b prev&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;b next&quot;&gt;Next →&lt;/button&gt;&lt;span class=&quot;cnt note&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. When is the contract liability recognised if payment is due on the 10th and received on the 20th?&lt;/summary&gt;&lt;div&gt;On the 10th: when the payment is made or becomes due, whichever is earlier (15.106).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Contract asset and receivable: what is the difference?&lt;/summary&gt;&lt;div&gt;A contract asset is a right conditioned on something other than the passage of time (e.g. future performance); a receivable is unconditional.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Which standard governs the impairment of contract assets and receivables?&lt;/summary&gt;&lt;div&gt;IFRS 9 (15.107-108).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ DISCLOSURE ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s-disclo&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Part 10 · paras 110-128&lt;/span&gt;
  &lt;h2&gt;Disclosure: what to report in the notes&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;The aim mirrors the &lt;i&gt;objective&lt;/i&gt;: to provide sufficient information to understand the &lt;b&gt;nature, amount, timing and uncertainty&lt;/b&gt; of revenue and cash flows. Qualitative and quantitative information is required on three areas (15.110). &lt;span class=&quot;src&quot;&gt;Slides 50-53&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;(a) Contracts with customers&lt;/h4&gt;paras 113-122&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;(b) Significant judgements&lt;/h4&gt;and changes in them in applying the standard · paras 123-126&lt;/div&gt;
