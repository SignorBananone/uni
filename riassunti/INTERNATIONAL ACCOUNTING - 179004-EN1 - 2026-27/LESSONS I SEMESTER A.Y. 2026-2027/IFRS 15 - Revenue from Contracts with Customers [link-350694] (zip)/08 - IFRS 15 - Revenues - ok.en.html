    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;(c) Assets from contract costs&lt;/h4&gt;to obtain or fulfil (paras 91, 95) · paras 127-128&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Disclosure&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;ds1&quot;&gt;Amounts (113)&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;ds2&quot;&gt;Disaggregation (114)&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;ds3&quot;&gt;Contract balances (116)&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ds1&quot;&gt;Unless presented separately in the statement of comprehensive income: (a) &lt;b&gt;revenue from contracts with customers&lt;/b&gt;, separately from other sources of revenue; (b) &lt;b&gt;impairment losses&lt;/b&gt; (IFRS 9) on receivables and contract assets arising from contracts with customers, separately from those on other contracts.&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ds2&quot; hidden&gt;&lt;b&gt;Disaggregation of revenue&lt;/b&gt; into categories that depict how economic factors affect the nature, amount, timing and uncertainty of revenue and cash flows; guidance in B87-B89.
      &lt;div class=&quot;ext&quot; style=&quot;margin-bottom:0&quot;&gt;B89 lists possible categories: type of good/service, geographical region, market or type of customer, type of contract, contract duration, timing of transfer (point in time / over time), sales channels. — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 on ifrs.org&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ds3&quot; hidden&gt;(a) &lt;b&gt;opening and closing&lt;/b&gt; balances of receivables, contract assets and contract liabilities; (b) revenue recognised in the period that was included in the &lt;b&gt;contract liability balance at the beginning of the period&lt;/b&gt;; (c) revenue recognised in the period from POs satisfied (or partially satisfied) in &lt;b&gt;previous periods&lt;/b&gt; (e.g. changes in the price).&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Why is a reconciliation of contract balances required?&lt;/summary&gt;&lt;div&gt;To show the relationship between performance and payments: how much revenue comes from advances already received and how much from past performance, i.e. the timing of cash flows.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Are credit losses on customer receivables combined with those on other contracts?&lt;/summary&gt;&lt;div&gt;No, they must be disclosed separately (15.113b).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ CASI PARTICOLARI ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s-casi&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Part 11 · Application guidance (Appendix B)&lt;/span&gt;
  &lt;h2&gt;Specific cases&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Appendix B applies the model to common situations. The slides cover four of them. &lt;span class=&quot;src&quot;&gt;Slides 54-64&lt;/span&gt;&lt;/p&gt;

  &lt;h3&gt;Sale with a right of return (B20-B27)&lt;/h3&gt;
  &lt;p&gt;The customer may return the product and receive (a) a full or partial refund, (b) a credit to be applied against future purchases, (c) another product in exchange. The entity recognises &lt;b&gt;all three&lt;/b&gt; of the following (B21):&lt;/p&gt;
  &lt;ol class=&quot;alpha&quot;&gt;&lt;li&gt;&lt;b&gt;revenue&lt;/b&gt; only for the products that are expected &lt;b&gt;not&lt;/b&gt; to be returned;&lt;/li&gt;&lt;li&gt;a &lt;b&gt;refund liability&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;an &lt;b&gt;asset&lt;/b&gt; (with a corresponding adjustment to cost of sales) for its right to recover products from the customer.&lt;/li&gt;&lt;/ol&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;label class=&quot;rng&quot;&gt;Units sold &lt;input type=&quot;range&quot; id=&quot;rq&quot; min=&quot;10&quot; max=&quot;500&quot; step=&quot;10&quot; value=&quot;100&quot; data-fmt=&quot;n&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Unit price &lt;input type=&quot;range&quot; id=&quot;rp&quot; min=&quot;10&quot; max=&quot;500&quot; step=&quot;10&quot; value=&quot;100&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Unit cost &lt;input type=&quot;range&quot; id=&quot;rc&quot; min=&quot;5&quot; max=&quot;400&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Expected returns &lt;input type=&quot;range&quot; id=&quot;rr&quot; min=&quot;0&quot; max=&quot;40&quot; step=&quot;1&quot; value=&quot;5&quot; data-fmt=&quot;pct&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;out&quot; id=&quot;rOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Simplified example: it ignores any costs of recovering the products and any decrease in the value of returned products.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;Exchanges for another product of the same type, quality, condition and price (e.g. another colour or size, B26) &lt;b&gt;are not returns&lt;/b&gt;. Returning a &lt;b&gt;faulty&lt;/b&gt; product in exchange for a functioning one is accounted for under the guidance on &lt;b&gt;warranties&lt;/b&gt; (B27).&lt;/p&gt;

  &lt;h3&gt;Warranties (B28-B33)&lt;/h3&gt;
  &lt;p&gt;Warranties may provide only &lt;b&gt;assurance&lt;/b&gt; (that the product will function as the parties intended because it complies with agreed-upon specifications) or also an &lt;b&gt;additional service&lt;/b&gt;. Factors to consider (B31): whether the warranty is &lt;b&gt;required by law&lt;/b&gt; (which indicates it is not a PO), the &lt;b&gt;length of the coverage period&lt;/b&gt; (the longer it is, the more likely it is a service), and the &lt;b&gt;nature of the tasks&lt;/b&gt; (e.g. return shipping of the faulty item serves the assurance purpose and is therefore not a PO). &lt;span class=&quot;src&quot;&gt;Slides 57-60&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;wtree&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

  &lt;h3&gt;Licensing (B52-B56)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;What it is&lt;/h4&gt;A licence establishes a customer&#x27;s rights to the entity&#x27;s &lt;b&gt;intellectual property&lt;/b&gt;: (a) software and technology; (b) motion pictures, music and other media; (c) &lt;i&gt;franchises&lt;/i&gt;; (d) patents, trademarks and copyrights (B52).&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Distinct or not?&lt;/h4&gt;Additional promises may be explicit or implied (customary practices, published policies, specific statements, para. 24); paras 22-30 apply (B53). If the licence is &lt;b&gt;not distinct&lt;/b&gt;, the licence and the other goods form &lt;b&gt;a single PO&lt;/b&gt; (B54). Examples: a licence that is &lt;b&gt;integral&lt;/b&gt; to a tangible good and essential to its functionality; a licence the customer can benefit from &lt;b&gt;only in conjunction with a related service&lt;/b&gt; (e.g. online access to content).&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;IFRS 15.B56-B62 (beyond the slides) distinguish a &lt;b&gt;right to access&lt;/b&gt; the IP as it exists throughout the licence period (revenue over time) from a &lt;b&gt;right to use&lt;/b&gt; the IP as it exists when the licence is granted (revenue at a point in time). — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 on ifrs.org&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Repurchase agreements (B64-B65)&lt;/h3&gt;
  &lt;p&gt;A contract in which the entity sells an asset and also &lt;b&gt;promises or has the option&lt;/b&gt; to repurchase it (in the same or another contract): the same asset, an asset that is substantially the same, or another asset of which the asset originally sold is a component. Three forms:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Forward&lt;/h4&gt;the entity&#x27;s obligation to repurchase&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Call option&lt;/h4&gt;the entity&#x27;s right to repurchase&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Put option&lt;/h4&gt;the entity&#x27;s obligation to repurchase at the customer&#x27;s request&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;Under B66-B69, with a forward or a call option the customer &lt;b&gt;does not obtain control&lt;/b&gt; (its ability to direct the use of the asset is limited): the contract is accounted for as a &lt;b&gt;lease&lt;/b&gt; (IFRS 16) if the repurchase price is lower than the original selling price, or as a &lt;b&gt;financing arrangement&lt;/b&gt; if it is equal to or higher. A put option is assessed based on whether the customer has a significant economic incentive to exercise it (B70-B76). — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 on ifrs.org&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. 100 units at € 100, expected returns 5%. How much revenue?&lt;/summary&gt;&lt;div&gt;€ 9,500, with a refund liability of € 500 and an asset for the right to recover products equal to the cost of the 5 units expected to be returned.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. A mandatory two-year statutory warranty: is it a PO?&lt;/summary&gt;&lt;div&gt;Normally not: it is an assurance-type warranty, and an IAS 37 provision is recognised (B30-B31a).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. An extended warranty sold separately for € 80: how is it accounted for?&lt;/summary&gt;&lt;div&gt;It is a service-type warranty, hence a distinct PO: a portion of the price is allocated to it and recognised over the coverage period (B29).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. A customer exchanges a size M shirt for a size L at the same price: is it a return?&lt;/summary&gt;&lt;div&gt;No (B26).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;5. What are the three forms of repurchase agreement?&lt;/summary&gt;&lt;div&gt;Forward (obligation), call option (entity&#x27;s right), put option (obligation at the customer&#x27;s request).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ APPROFONDIRE ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s-approf&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Further reading&lt;/span&gt;
  &lt;h2&gt;Further reading: rules and standards cited in the slides&lt;/h2&gt;
  &lt;p&gt;The slides do not cite authors or studies, but they refer to many standards. Each card is an &lt;b&gt;external source&lt;/b&gt; found through a web search: always check the version currently in force.&lt;/p&gt;
  &lt;div class=&quot;grid2 refs&quot;&gt;
    &lt;div class=&quot;card brick&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-15-revenue-from-contracts-with-customers.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 Revenue from Contracts with Customers&lt;/a&gt;&lt;/h4&gt;&lt;span class=&quot;pill&quot;&gt;External source · ifrs.org&lt;/span&gt;&lt;p&gt;Official IFRS Foundation page: summary, amendments (Clarifications of April 2016) and access to the text. Effective for annual periods beginning on or after 1/1/2018; it replaced IAS 11, IAS 18 and several interpretations. It is the text the slides are based on: useful for paragraphs not shown (e.g. 26-30 on “distinct”, 50-58 on variable consideration) and for the &lt;i&gt;Illustrative Examples&lt;/i&gt;.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Full HTML text: &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2026 edition on ifrs.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card brick&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.iasplus.com/en/standards/ifrs/ifrs15&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte) · IFRS 15&lt;/a&gt;&lt;/h4&gt;&lt;span class=&quot;pill&quot;&gt;External source · iasplus.com&lt;/span&gt;&lt;p&gt;Summary page with history, key dates and an overview of the five-step model: handy for a quick review.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card brick&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.fondazioneoic.eu/commission-regulation-eu-no-2016-1905-adopts-ifrs-15-revenue-from-contracts-with-customers/?lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Commission Regulation (EU) 2016/1905&lt;/a&gt;&lt;/h4&gt;&lt;span class=&quot;pill&quot;&gt;External source · Fondazione OIC&lt;/span&gt;&lt;p&gt;The regulation of 22 September 2016 by which the Commission endorsed IFRS 15 in the EU (OJ L 295 of 29/10/2016). It matters because in Europe IFRSs apply only after &lt;i&gt;endorsement&lt;/i&gt;: the official Italian version is titled “Ricavi provenienti da contratti con i clienti”.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card slate&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-16-leases.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 16 Leases&lt;/a&gt;&lt;/h4&gt;&lt;span class=&quot;pill&quot;&gt;External source · ifrs.org&lt;/span&gt;&lt;p&gt;Scope exclusion (a) and the destination of repurchase agreements with a forward/call at a lower price. Single lessee accounting model: almost all leases on the balance sheet; effective from 2019.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card slate&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-9-financial-instruments/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 9 Financial Instruments&lt;/a&gt;&lt;/h4&gt;&lt;span class=&quot;pill&quot;&gt;External source · ifrs.org&lt;/span&gt;&lt;p&gt;Scope exclusion (c) and, above all, the rules for measuring &lt;b&gt;receivables&lt;/b&gt; and for the &lt;b&gt;impairment&lt;/b&gt; of receivables and contract assets (15.107-108, 113b). Classification, measurement, impairment, hedge accounting.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card slate&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-37-provisions-contingent-liabilities-and-contingent-assets.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 37 Provisions, Contingent Liabilities and Contingent Assets&lt;/a&gt;&lt;/h4&gt;&lt;span class=&quot;pill&quot;&gt;External source · ifrs.org&lt;/span&gt;&lt;p&gt;Applies to &lt;b&gt;assurance-type warranties&lt;/b&gt; (B30) and to onerous contracts. A provision is a liability of uncertain timing or amount, recognised when an outflow is probable.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card ochre&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-8-accounting-policies-changes-in-accounting-estimates-and-errors.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 8 Accounting Policies, Changes in Accounting Estimates and Errors&lt;/a&gt;&lt;/h4&gt;&lt;span class=&quot;pill&quot;&gt;External source · ifrs.org&lt;/span&gt;&lt;p&gt;Referred to for revisions of the measure of progress (15.43) and of the amortisation of contract costs (15.100): changes in estimates are recognised &lt;b&gt;prospectively&lt;/b&gt;, whereas changes in accounting policies and errors are normally applied retrospectively.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card ochre&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.iasplus.com/en/standards/ifrs&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 17, IFRS 10, IFRS 11, IAS 27, IAS 28, IAS 2, IAS 16, IAS 38&lt;/a&gt;&lt;/h4&gt;&lt;span class=&quot;pill&quot;&gt;External source · IAS Plus index&lt;/span&gt;&lt;p&gt;The other standards cited: IFRS 17 (insurance contracts, replacing IFRS 4) and IFRS 10/11, IAS 27/28 (investments) delimit the scope; IAS 2 (inventories), IAS 16 (property, plant and equipment) and IAS 38 (intangible assets) take precedence for costs to fulfil a contract (15.95). The IAS Plus index links to the summary page for each; the official text is on ifrs.org.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;I could not consult the other files in the &lt;i&gt;corso/&lt;/i&gt; folder (lectures, exercises, syllabus): the links to other lectures above are inferred from the slides&#x27; references to other standards, not from those materials.&lt;/p&gt;
&lt;/section&gt;
&lt;/main&gt;
&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Summary written by Claude from the slides: always check against the material.&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
const $=(s,r=document)=&gt;r.querySelector(s),$$=(s,r=document)=&gt;Array.from(r.querySelectorAll(s));
const eur=v=&gt;&#x27;€ &#x27;+Math.round(v).toLocaleString(&#x27;en-GB&#x27;);
const pct=v=&gt;(v*100).toLocaleString(&#x27;en-GB&#x27;,{maximumFractionDigits:1})+&#x27;%&#x27;;
function bindRange(id,fn){const el=document.getElementById(id);if(!el)return;const o=el.parentElement.querySelector(&#x27;output&#x27;);const up=()=&gt;{if(o)o.textContent=el.dataset.fmt===&#x27;pct&#x27;?el.value+&#x27;%&#x27;:el.dataset.fmt===&#x27;n&#x27;?el.value:eur(+el.value);fn&amp;&amp;fn()};el.addEventListener(&#x27;input&#x27;,up);up();}
const V=id=&gt;+document.getElementById(id).value;

/* tabs */
$$(&#x27;.tabs&#x27;).forEach(t=&gt;{const tabs=$$(&#x27;[role=tab]&#x27;,t);tabs.forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{tabs.forEach(x=&gt;{x.setAttribute(&#x27;aria-selected&#x27;,x===b);document.getElementById(x.getAttribute(&#x27;aria-controls&#x27;)).hidden=x!==b;});}));});

/* steppers */
$$(&#x27;.steps&#x27;).forEach(s=&gt;{const st=$$(&#x27;.st&#x27;,s);let i=0;const dots=$(&#x27;.dots&#x27;,s);st.forEach(()=&gt;dots.appendChild(document.createElement(&#x27;i&#x27;)));const lab=$(&#x27;.cnt&#x27;,s);
 const show=()=&gt;{st.forEach((x,k)=&gt;x.classList.toggle(&#x27;on&#x27;,k===i));$$(&#x27;i&#x27;,dots).forEach((d,k)=&gt;d.classList.toggle(&#x27;on&#x27;,k===i));if(lab)lab.textContent=(i+1)+&#x27; / &#x27;+st.length;};
 $(&#x27;.prev&#x27;,s).onclick=()=&gt;{i=Math.max(0,i-1);show()};$(&#x27;.next&#x27;,s).onclick=()=&gt;{i=Math.min(st.length-1,i+1);show()};show();});

/* nav highlight */
const links=$$(&#x27;nav.toc a&#x27;);const secs=links.map(a=&gt;document.querySelector(a.getAttribute(&#x27;href&#x27;))).filter(Boolean);
if(&#x27;IntersectionObserver&#x27; in window){const io=new IntersectionObserver(es=&gt;{es.forEach(e=&gt;{if(e.isIntersecting){links.forEach(a=&gt;a.classList.toggle(&#x27;on&#x27;,a.getAttribute(&#x27;href&#x27;)===&#x27;#&#x27;+e.target.id));}})},{rootMargin:&#x27;-40% 0px -55% 0px&#x27;});secs.forEach(s=&gt;io.observe(s));}

/* scope */
const cases=[
 [&#x27;Sale of machinery to a customer&#x27;,&#x27;IFRS 15 ✓ — the customer acquires an output of the entity\&#x27;s ordinary activities in exchange for consideration.&#x27;,1],
 [&#x27;Leasing an office to third parties&#x27;,&#x27;Excluded → IFRS 16 Leases (15.5a).&#x27;,0],
 [&#x27;Insurance policy issued by an insurer&#x27;,&#x27;Excluded → IFRS 17 Insurance Contracts (15.5b), except for the option for fixed-fee service contracts (IFRS 17.8).&#x27;,0],
 [&#x27;Interest on a loan granted&#x27;,&#x27;Excluded → IFRS 9 Financial Instruments (15.5c).&#x27;,0],
 [&#x27;Oil swap between two companies to serve customers&#x27;,&#x27;Excluded: non-monetary exchange within the same line of business to facilitate sales (15.5d).&#x27;,0],
 [&#x27;Joint development of a drug sharing risks and benefits&#x27;,&#x27;Outside IFRS 15: the counterparty is a partner, not a customer (15.6).&#x27;,0],
 [&#x27;Annual cloud software subscription&#x27;,&#x27;IFRS 15 ✓ — a service provided to a customer; typically a PO satisfied over time.&#x27;,1]];
const sb=$(&#x27;#scopeBtns&#x27;);if(sb){cases.forEach(c=&gt;{const b=document.createElement(&#x27;button&#x27;);b.className=&#x27;b&#x27;;b.textContent=c[0];b.onclick=()=&gt;{$$(&#x27;button&#x27;,sb).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));b.classList.add(&#x27;on&#x27;);const o=$(&#x27;#scopeOut&#x27;);o.textContent=c[1];o.className=&#x27;out &#x27;+(c[2]?&#x27;good&#x27;:&#x27;bad&#x27;);};sb.appendChild(b);});}

/* checklist */
const chk=$(&#x27;#chk&#x27;);if(chk){const up=()=&gt;{const n=$$(&#x27;input:checked&#x27;,chk).length,o=$(&#x27;#chkOut&#x27;);if(n===5){o.className=&#x27;out good&#x27;;o.textContent=&#x27;All 5 criteria are met: there is a contract for IFRS 15 purposes. Move on to step 2.&#x27;;}else{o.className=&#x27;out bad&#x27;;o.textContent=`Criteria met: ${n}/5. No IFRS 15 contract: any consideration received is recognised as a liability (15.15-16) and the criteria continue to be assessed (15.14).`;}};$$(&#x27;input&#x27;,chk).forEach(i=&gt;i.addEventListener(&#x27;change&#x27;,up));up();}

/* over-time quiz */
const ot=$(&#x27;#otBtns&#x27;);if(ot){const items=[
 [&#x27;Daily cleaning of the customer\&#x27;s offices&#x27;,&#x27;Over time — criterion (a): the customer simultaneously receives and consumes the benefits.&#x27;],
 [&#x27;Construction of a warehouse on the customer\&#x27;s land&#x27;,&#x27;Over time — criterion (b): performance creates an asset that the customer controls as it is created.&#x27;],
 [&#x27;Custom machinery, unusable by others, with a right to payment for work performed&#x27;,&#x27;Over time — criterion (c): no alternative use + enforceable right to payment.&#x27;],
