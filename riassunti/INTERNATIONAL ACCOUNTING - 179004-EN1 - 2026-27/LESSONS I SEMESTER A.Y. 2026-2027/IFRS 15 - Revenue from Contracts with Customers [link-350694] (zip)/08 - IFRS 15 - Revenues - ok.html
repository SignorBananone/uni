      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;ds3&quot;&gt;Contract balances (116)&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ds1&quot;&gt;Salvo presentazione separata nel conto economico complessivo: (a) &lt;b&gt;ricavi da contratti con clienti&lt;/b&gt;, separati dalle altre fonti di ricavo; (b) &lt;b&gt;impairment losses&lt;/b&gt; (IFRS 9) su crediti e contract asset da contratti con clienti, separate da quelle di altri contratti.&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ds2&quot; hidden&gt;&lt;b&gt;Disaggregation of revenue&lt;/b&gt; (scomposizione dei ricavi) in categorie che mostrano come i fattori economici influenzano natura, importo, tempistica e incertezza dei ricavi e dei flussi; guida in B87-B89.
      &lt;div class=&quot;ext&quot; style=&quot;margin-bottom:0&quot;&gt;B89 cita come categorie possibili: tipo di bene/servizio, area geografica, mercato o tipo di cliente, tipo di contratto, durata, momento del trasferimento (point in time / over time), canali di vendita. — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 su ifrs.org&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;ds3&quot; hidden&gt;(a) saldi di &lt;b&gt;apertura e chiusura&lt;/b&gt; di crediti, contract asset e contract liability; (b) ricavi del periodo che erano nella &lt;b&gt;contract liability di inizio periodo&lt;/b&gt;; (c) ricavi del periodo da PO soddisfatte (anche in parte) in &lt;b&gt;periodi precedenti&lt;/b&gt; (es. variazioni del prezzo).&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Perché si chiede la riconciliazione dei contract balances?&lt;/summary&gt;&lt;div&gt;Per mostrare il legame tra prestazione e pagamenti: quanto ricavo viene da anticipi già incassati e quanto da prestazioni passate, cioè la tempistica dei flussi.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Le perdite su crediti da clienti si mescolano con quelle su altri contratti?&lt;/summary&gt;&lt;div&gt;No, vanno indicate separatamente (15.113b).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ CASI PARTICOLARI ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s-casi&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Parte 11 · Application guidance (Appendix B)&lt;/span&gt;
  &lt;h2&gt;Casi particolari&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;L&#x27;Appendix B applica il modello a situazioni frequenti. Le slide ne trattano quattro. &lt;span class=&quot;src&quot;&gt;Slide 54-64&lt;/span&gt;&lt;/p&gt;

  &lt;h3&gt;Sale with a right of return (B20-B27)&lt;/h3&gt;
  &lt;p&gt;Il cliente può restituire il prodotto e ottenere (a) un rimborso totale o parziale, (b) un credito da usare su acquisti futuri, (c) un altro prodotto. Si rilevano &lt;b&gt;tutti e tre&lt;/b&gt; (B21):&lt;/p&gt;
  &lt;ol class=&quot;alpha&quot;&gt;&lt;li&gt;&lt;b&gt;ricavo&lt;/b&gt; solo per i prodotti che si prevede &lt;b&gt;non&lt;/b&gt; tornino indietro;&lt;/li&gt;&lt;li&gt;una &lt;b&gt;refund liability&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;un&#x27;&lt;b&gt;attività&lt;/b&gt; (con rettifica del costo del venduto) per il diritto a recuperare i prodotti dal cliente.&lt;/li&gt;&lt;/ol&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;label class=&quot;rng&quot;&gt;Unità vendute &lt;input type=&quot;range&quot; id=&quot;rq&quot; min=&quot;10&quot; max=&quot;500&quot; step=&quot;10&quot; value=&quot;100&quot; data-fmt=&quot;n&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Prezzo unitario &lt;input type=&quot;range&quot; id=&quot;rp&quot; min=&quot;10&quot; max=&quot;500&quot; step=&quot;10&quot; value=&quot;100&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Costo unitario &lt;input type=&quot;range&quot; id=&quot;rc&quot; min=&quot;5&quot; max=&quot;400&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Resi attesi &lt;input type=&quot;range&quot; id=&quot;rr&quot; min=&quot;0&quot; max=&quot;40&quot; step=&quot;1&quot; value=&quot;5&quot; data-fmt=&quot;pct&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;out&quot; id=&quot;rOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Esempio semplificato: ignora eventuali costi di recupero e la riduzione di valore dei prodotti restituiti.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;b&gt;Non sono resi&lt;/b&gt; gli scambi con un prodotto dello stesso tipo, qualità, condizione e prezzo (es. altro colore o taglia, B26). La restituzione di un prodotto &lt;b&gt;difettoso&lt;/b&gt; in cambio di uno funzionante segue la guida sulle &lt;b&gt;warranties&lt;/b&gt; (B27).&lt;/p&gt;

  &lt;h3&gt;Warranties (B28-B33)&lt;/h3&gt;
  &lt;p&gt;Le garanzie possono dare solo &lt;b&gt;assurance&lt;/b&gt; (assicurazione che il prodotto funziona secondo le specifiche concordate) oppure anche un &lt;b&gt;servizio aggiuntivo&lt;/b&gt;. Fattori da valutare (B31): &lt;b&gt;obbligo di legge&lt;/b&gt; (indica che non è una PO), &lt;b&gt;durata&lt;/b&gt; (più è lunga, più è probabile un servizio), &lt;b&gt;natura dei compiti&lt;/b&gt; (es. la spedizione di ritorno del pezzo difettoso serve all&#x27;assurance, quindi non è una PO). &lt;span class=&quot;src&quot;&gt;Slide 57-60&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;wtree&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

  &lt;h3&gt;Licensing (B52-B56)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Che cos&#x27;è&lt;/h4&gt;Una licenza stabilisce i diritti del cliente sulla &lt;b&gt;proprietà intellettuale&lt;/b&gt; dell&#x27;impresa: (a) software e tecnologia; (b) film, musica e altri media; (c) &lt;i&gt;franchises&lt;/i&gt;; (d) brevetti, marchi e copyright (B52).&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Distinta o no?&lt;/h4&gt;Le promesse aggiuntive possono essere esplicite o implicite (prassi, politiche pubblicate, dichiarazioni, par. 24); si applicano i par. 22-30 (B53). Se la licenza &lt;b&gt;non è distinta&lt;/b&gt;, licenza e altri beni sono &lt;b&gt;una sola PO&lt;/b&gt; (B54). Esempi: licenza &lt;b&gt;integrata&lt;/b&gt; in un bene tangibile e indispensabile al suo funzionamento; licenza utilizzabile &lt;b&gt;solo insieme a un servizio&lt;/b&gt; (es. accesso online a contenuti).&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;IFRS 15.B56-B62 (oltre le slide) distinguono il &lt;b&gt;right to access&lt;/b&gt; la IP così com&#x27;è nel tempo (ricavo over time) dal &lt;b&gt;right to use&lt;/b&gt; la IP com&#x27;è al momento della concessione (ricavo at a point in time). — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 su ifrs.org&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Repurchase agreements (B64-B65)&lt;/h3&gt;
  &lt;p&gt;Contratto in cui l&#x27;impresa vende un asset e &lt;b&gt;promette o ha l&#x27;opzione&lt;/b&gt; di riacquistarlo (nello stesso o in un altro contratto): lo stesso asset, uno sostanzialmente uguale o un asset di cui quello venduto è componente. Tre forme:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Forward&lt;/h4&gt;obbligo dell&#x27;impresa di riacquistare&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Call option&lt;/h4&gt;diritto dell&#x27;impresa di riacquistare&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Put option&lt;/h4&gt;obbligo di riacquistare su richiesta del cliente&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;Secondo B66-B69, con forward o call il cliente &lt;b&gt;non ottiene il control&lt;/b&gt; (la sua capacità di disporre del bene è limitata): il contratto si tratta come &lt;b&gt;lease&lt;/b&gt; (IFRS 16) se il prezzo di riacquisto è inferiore a quello di vendita, oppure come &lt;b&gt;accordo di finanziamento&lt;/b&gt; se è pari o superiore. La put si valuta in base all&#x27;incentivo economico del cliente a esercitarla (B70-B76). — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 su ifrs.org&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. 100 unità a € 100, resi attesi 5%. Quanto ricavo?&lt;/summary&gt;&lt;div&gt;€ 9.500, con refund liability di € 500 e un&#x27;attività per il diritto di recupero pari al costo delle 5 unità attese di ritorno.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Garanzia legale biennale obbligatoria: è una PO?&lt;/summary&gt;&lt;div&gt;Di norma no: è assurance-type, si rileva un accantonamento IAS 37 (B30-B31a).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Estensione di garanzia venduta a parte a € 80: come si tratta?&lt;/summary&gt;&lt;div&gt;È una service-type warranty, quindi una PO distinta: le si alloca una quota del prezzo, riconosciuta nel periodo di copertura (B29).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Un cliente cambia una maglia M con una L dello stesso prezzo: è un reso?&lt;/summary&gt;&lt;div&gt;No (B26).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;5. Quali sono le tre forme di repurchase agreement?&lt;/summary&gt;&lt;div&gt;Forward (obbligo), call option (diritto dell&#x27;impresa), put option (obbligo su richiesta del cliente).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ APPROFONDIRE ============ --&gt;
&lt;section class=&quot;part&quot; id=&quot;s-approf&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Per approfondire&lt;/span&gt;
  &lt;h2&gt;Per approfondire: norme e standard citati nelle slide&lt;/h2&gt;
  &lt;p&gt;Le slide non citano autori o studi, ma rimandano a numerosi standard. Ciascuna scheda è &lt;b&gt;fonte esterna&lt;/b&gt; trovata con ricerca web: verifica sempre la versione in vigore.&lt;/p&gt;
  &lt;div class=&quot;grid2 refs&quot;&gt;
    &lt;div class=&quot;card brick&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-15-revenue-from-contracts-with-customers.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 Revenue from Contracts with Customers&lt;/a&gt;&lt;/h4&gt;&lt;span class=&quot;pill&quot;&gt;Fonte esterna · ifrs.org&lt;/span&gt;&lt;p&gt;Pagina ufficiale IFRS Foundation: sintesi, emendamenti (Clarifications di aprile 2016) e accesso al testo. In vigore dagli esercizi che iniziano dal 1/1/2018; ha sostituito IAS 11, IAS 18 e alcune interpretazioni. È il testo da cui sono tratte le slide: utile per i paragrafi non mostrati (es. 26-30 sul “distinct”, 50-58 sul variabile) e per gli &lt;i&gt;Illustrative Examples&lt;/i&gt;.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Testo completo HTML: &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;edizione 2026 su ifrs.org&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card brick&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.iasplus.com/en/standards/ifrs/ifrs15&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte) · IFRS 15&lt;/a&gt;&lt;/h4&gt;&lt;span class=&quot;pill&quot;&gt;Fonte esterna · iasplus.com&lt;/span&gt;&lt;p&gt;Scheda di sintesi con storia, date e riepilogo del modello a cinque step: comoda per un ripasso veloce.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card brick&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.fondazioneoic.eu/commission-regulation-eu-no-2016-1905-adopts-ifrs-15-revenue-from-contracts-with-customers/?lang=en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Regolamento (UE) 2016/1905&lt;/a&gt;&lt;/h4&gt;&lt;span class=&quot;pill&quot;&gt;Fonte esterna · Fondazione OIC&lt;/span&gt;&lt;p&gt;Il regolamento del 22 settembre 2016 con cui la Commissione ha omologato l&#x27;IFRS 15 nell&#x27;UE (GU L 295 del 29/10/2016). Conta perché in Europa gli IFRS si applicano solo dopo l&#x27;&lt;i&gt;endorsement&lt;/i&gt;: la versione italiana ufficiale è “Ricavi provenienti da contratti con i clienti”.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card slate&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-16-leases.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 16 Leases&lt;/a&gt;&lt;/h4&gt;&lt;span class=&quot;pill&quot;&gt;Fonte esterna · ifrs.org&lt;/span&gt;&lt;p&gt;Esclusione (a) dello scope e destinazione dei repurchase agreements con forward/call a prezzo inferiore. Modello unico per il locatario: quasi tutti i lease in bilancio; in vigore dal 2019.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card slate&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-9-financial-instruments/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 9 Financial Instruments&lt;/a&gt;&lt;/h4&gt;&lt;span class=&quot;pill&quot;&gt;Fonte esterna · ifrs.org&lt;/span&gt;&lt;p&gt;Esclusione (c) dello scope e, soprattutto, regola per misurare &lt;b&gt;receivables&lt;/b&gt; e per l&#x27;&lt;b&gt;impairment&lt;/b&gt; di crediti e contract asset (15.107-108, 113b). Classificazione, misurazione, impairment, hedge accounting.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card slate&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-37-provisions-contingent-liabilities-and-contingent-assets.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 37 Provisions, Contingent Liabilities and Contingent Assets&lt;/a&gt;&lt;/h4&gt;&lt;span class=&quot;pill&quot;&gt;Fonte esterna · ifrs.org&lt;/span&gt;&lt;p&gt;Si applica alle &lt;b&gt;assurance-type warranties&lt;/b&gt; (B30) e ai contratti onerosi. Una provision è una passività di importo o scadenza incerti, rilevata quando l&#x27;uscita è probabile.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card ochre&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-8-accounting-policies-changes-in-accounting-estimates-and-errors.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 8 Accounting Policies, Changes in Accounting Estimates and Errors&lt;/a&gt;&lt;/h4&gt;&lt;span class=&quot;pill&quot;&gt;Fonte esterna · ifrs.org&lt;/span&gt;&lt;p&gt;Richiamato per le revisioni della misura del progresso (15.43) e dell&#x27;ammortamento dei contract costs (15.100): i cambi di stima si rilevano &lt;b&gt;prospetticamente&lt;/b&gt;, mentre cambi di principio ed errori di norma retroattivamente.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card ochre&quot;&gt;&lt;h4&gt;&lt;a href=&quot;https://www.iasplus.com/en/standards/ifrs&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 17, IFRS 10, IFRS 11, IAS 27, IAS 28, IAS 2, IAS 16, IAS 38&lt;/a&gt;&lt;/h4&gt;&lt;span class=&quot;pill&quot;&gt;Fonte esterna · indice IAS Plus&lt;/span&gt;&lt;p&gt;Gli altri standard citati: IFRS 17 (contratti assicurativi, sostituisce IFRS 4) e IFRS 10/11, IAS 27/28 (partecipazioni) delimitano lo scope; IAS 2 (rimanenze), IAS 16 (immobili, impianti e macchinari) e IAS 38 (intangibili) hanno la precedenza sui costi per adempiere (15.95). L&#x27;indice IAS Plus collega le schede di sintesi di ciascuno; il testo ufficiale è su ifrs.org.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;Non ho potuto consultare gli altri file della cartella &lt;i&gt;corso/&lt;/i&gt; (lezioni, esercizi, programma): i collegamenti con le altre lezioni qui sopra sono dedotti dai rimandi delle slide agli altri standard, non da quei materiali.&lt;/p&gt;
&lt;/section&gt;
&lt;/main&gt;
&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/div&gt;&lt;/footer&gt;

&lt;script&gt;
(function(){
const $=(s,r=document)=&gt;r.querySelector(s),$$=(s,r=document)=&gt;Array.from(r.querySelectorAll(s));
const eur=v=&gt;&#x27;€ &#x27;+Math.round(v).toLocaleString(&#x27;it-IT&#x27;);
const pct=v=&gt;(v*100).toLocaleString(&#x27;it-IT&#x27;,{maximumFractionDigits:1})+&#x27;%&#x27;;
function bindRange(id,fn){const el=document.getElementById(id);if(!el)return;const o=el.parentElement.querySelector(&#x27;output&#x27;);const up=()=&gt;{if(o)o.textContent=el.dataset.fmt===&#x27;pct&#x27;?el.value+&#x27;%&#x27;:el.dataset.fmt===&#x27;n&#x27;?el.value:eur(+el.value);fn&amp;&amp;fn()};el.addEventListener(&#x27;input&#x27;,up);up();}
const V=id=&gt;+document.getElementById(id).value;

/* tabs */
$$(&#x27;.tabs&#x27;).forEach(t=&gt;{const tabs=$$(&#x27;[role=tab]&#x27;,t);tabs.forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{tabs.forEach(x=&gt;{x.setAttribute(&#x27;aria-selected&#x27;,x===b);document.getElementById(x.getAttribute(&#x27;aria-controls&#x27;)).hidden=x!==b;});}));});

/* steppers */
$$(&#x27;.steps&#x27;).forEach(s=&gt;{const st=$$(&#x27;.st&#x27;,s);let i=0;const dots=$(&#x27;.dots&#x27;,s);st.forEach(()=&gt;dots.appendChild(document.createElement(&#x27;i&#x27;)));const lab=$(&#x27;.cnt&#x27;,s);
 const show=()=&gt;{st.forEach((x,k)=&gt;x.classList.toggle(&#x27;on&#x27;,k===i));$$(&#x27;i&#x27;,dots).forEach((d,k)=&gt;d.classList.toggle(&#x27;on&#x27;,k===i));if(lab)lab.textContent=(i+1)+&#x27; / &#x27;+st.length;};
 $(&#x27;.prev&#x27;,s).onclick=()=&gt;{i=Math.max(0,i-1);show()};$(&#x27;.next&#x27;,s).onclick=()=&gt;{i=Math.min(st.length-1,i+1);show()};show();});

/* nav highlight */
const links=$$(&#x27;nav.toc a&#x27;);const secs=links.map(a=&gt;document.querySelector(a.getAttribute(&#x27;href&#x27;))).filter(Boolean);
if(&#x27;IntersectionObserver&#x27; in window){const io=new IntersectionObserver(es=&gt;{es.forEach(e=&gt;{if(e.isIntersecting){links.forEach(a=&gt;a.classList.toggle(&#x27;on&#x27;,a.getAttribute(&#x27;href&#x27;)===&#x27;#&#x27;+e.target.id));}})},{rootMargin:&#x27;-40% 0px -55% 0px&#x27;});secs.forEach(s=&gt;io.observe(s));}

/* scope */
const cases=[
 [&#x27;Vendita di macchinari a un cliente&#x27;,&#x27;IFRS 15 ✓ — il cliente acquista un output delle attività ordinarie in cambio di corrispettivo.&#x27;,1],
 [&#x27;Affitto di un ufficio a terzi&#x27;,&#x27;Escluso → IFRS 16 Leases (15.5a).&#x27;,0],
 [&#x27;Polizza assicurativa emessa da una compagnia&#x27;,&#x27;Escluso → IFRS 17 Insurance Contracts (15.5b), salvo la scelta per servizi a compenso fisso (IFRS 17.8).&#x27;,0],
 [&#x27;Interessi su un finanziamento concesso&#x27;,&#x27;Escluso → IFRS 9 Financial Instruments (15.5c).&#x27;,0],
 [&#x27;Permuta di petrolio tra due compagnie per servire i clienti&#x27;,&#x27;Escluso: scambio non monetario nello stesso settore per facilitare vendite (15.5d).&#x27;,0],
 [&#x27;Co-sviluppo di un farmaco con condivisione di rischi e benefici&#x27;,&#x27;Fuori da IFRS 15: la controparte è un partner, non un customer (15.6).&#x27;,0],
 [&#x27;Abbonamento annuale a un software in cloud&#x27;,&#x27;IFRS 15 ✓ — servizio fornito a un cliente; tipicamente una PO over time.&#x27;,1]];
const sb=$(&#x27;#scopeBtns&#x27;);if(sb){cases.forEach(c=&gt;{const b=document.createElement(&#x27;button&#x27;);b.className=&#x27;b&#x27;;b.textContent=c[0];b.onclick=()=&gt;{$$(&#x27;button&#x27;,sb).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));b.classList.add(&#x27;on&#x27;);const o=$(&#x27;#scopeOut&#x27;);o.textContent=c[1];o.className=&#x27;out &#x27;+(c[2]?&#x27;good&#x27;:&#x27;bad&#x27;);};sb.appendChild(b);});}

/* checklist */
const chk=$(&#x27;#chk&#x27;);if(chk){const up=()=&gt;{const n=$$(&#x27;input:checked&#x27;,chk).length,o=$(&#x27;#chkOut&#x27;);if(n===5){o.className=&#x27;out good&#x27;;o.textContent=&#x27;Tutti e 5 i criteri soddisfatti: c\&#x27;è un contratto ai fini IFRS 15. Si passa allo step 2.&#x27;;}else{o.className=&#x27;out bad&#x27;;o.textContent=`Criteri soddisfatti: ${n}/5. Nessun contratto IFRS 15: eventuali incassi vanno a passività (15.15-16) e si continua a verificare i criteri (15.14).`;}};$$(&#x27;input&#x27;,chk).forEach(i=&gt;i.addEventListener(&#x27;change&#x27;,up));up();}

/* over-time quiz */
const ot=$(&#x27;#otBtns&#x27;);if(ot){const items=[
 [&#x27;Pulizia giornaliera degli uffici del cliente&#x27;,&#x27;Over time — criterio (a): il cliente riceve e consuma i benefici man mano.&#x27;],
 [&#x27;Costruzione di un capannone sul terreno del cliente&#x27;,&#x27;Over time — criterio (b): la prestazione crea un asset che il cliente controlla man mano.&#x27;],
 [&#x27;Macchinario su misura, inutilizzabile per altri, con diritto al pagamento per il lavoro svolto&#x27;,&#x27;Over time — criterio (c): nessun uso alternativo + diritto azionabile al pagamento.&#x27;],
 [&#x27;Vendita di un\&#x27;auto di serie in concessionaria&#x27;,&#x27;Point in time — nessun criterio over time; il control passa alla consegna (indicatori del 15.38).&#x27;],
 [&#x27;Revisione legale annuale del bilancio&#x27;,&#x27;Over time — tipicamente (c) (o (a)): il lavoro è specifico per il cliente e il revisore ha diritto al compenso maturato.&#x27;]];
 items.forEach(c=&gt;{const b=document.createElement(&#x27;button&#x27;);b.className=&#x27;b&#x27;;b.textContent=c[0];b.onclick=()=&gt;{$$(&#x27;button&#x27;,ot).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));b.classList.add(&#x27;on&#x27;);const o=$(&#x27;#otOut&#x27;);o.textContent=c[1];o.className=&#x27;out &#x27;+(c[1].startsWith(&#x27;Over&#x27;)?&#x27;good&#x27;:&#x27;bad&#x27;);};ot.appendChild(b);});}

/* timing chart */
const tc=$(&#x27;#tchart&#x27;);if(tc){const X=t=&gt;50+t*65,Y=p=&gt;220-p*180,P=t=&gt;{const u=t/8;return 3*u*u-2*u*u*u};let d=&#x27;&#x27;;for(let k=0;k&lt;=80;k++){const t=k/10;d+=(k?&#x27;L&#x27;:&#x27;M&#x27;)+X(t).toFixed(1)+&#x27; &#x27;+Y(P(t)).toFixed(1);}$(&#x27;#otPath&#x27;).setAttribute(&#x27;d&#x27;,d);
 bindRange(&#x27;tq&#x27;,()=&gt;{const t=V(&#x27;tq&#x27;);const p=P(t),price=800000;$(&#x27;#mk&#x27;).setAttribute(&#x27;x1&#x27;,X(t));$(&#x27;#mk&#x27;).setAttribute(&#x27;x2&#x27;,X(t));$(&#x27;#d1&#x27;).setAttribute(&#x27;cx&#x27;,X(t));$(&#x27;#d1&#x27;).setAttribute(&#x27;cy&#x27;,Y(p));$(&#x27;#d2&#x27;).setAttribute(&#x27;cx&#x27;,X(t));$(&#x27;#d2&#x27;).setAttribute(&#x27;cy&#x27;,Y(t&gt;=8?1:0));$(&#x27;#tOut&#x27;).innerHTML=`Fine trimestre ${t}: &lt;b&gt;over time&lt;/b&gt; ricavi cumulati ${eur(p*price)} (${pct(p)}) · &lt;b&gt;point in time&lt;/b&gt; ${eur(t&gt;=8?price:0)}`;});}

/* cost-to-cost */
if($(&#x27;#c1&#x27;)){const f=()=&gt;{const price=V(&#x27;cp&#x27;),e1=V(&#x27;ce1&#x27;),c1=Math.min(V(&#x27;c1&#x27;),e1),e2=V(&#x27;ce2&#x27;),c2=Math.min(Math.max(V(&#x27;c2&#x27;),c1),e2);const p1=c1/e1,p2=c2/e2;const r1=p1*price,r2=p2*price;
 $(&#x27;#ccBar1&#x27;).style.width=(p1*100)+&#x27;%&#x27;;$(&#x27;#ccBar2&#x27;).style.width=(p2*100)+&#x27;%&#x27;;
 $(&#x27;#ccOut&#x27;).innerHTML=`Anno 1: progresso ${pct(p1)} → ricavo ${eur(r1)}&lt;br&gt;Anno 2: progresso cumulato ${pct(p2)} → ricavi cumulati ${eur(r2)} → &lt;b&gt;ricavo dell&#x27;anno 2 = ${eur(r2-r1)}&lt;/b&gt; (cumulative catch-up: cambio di stima prospettico, IAS 8)`+(e2&gt;price?`&lt;br&gt;&lt;span style=&quot;color:var(--no)&quot;&gt;Costi stimati &amp;gt; prezzo: contratto in perdita (onerous) — vedi IAS 37.&lt;/span&gt;`:&#x27;&#x27;);};[&#x27;cp&#x27;,&#x27;ce1&#x27;,&#x27;c1&#x27;,&#x27;ce2&#x27;,&#x27;c2&#x27;].forEach(i=&gt;bindRange(i,f));}

/* consideration payable */
if($(&#x27;#cpP&#x27;)){const f=()=&gt;{const p=V(&#x27;cpP&#x27;),fv=V(&#x27;cpFV&#x27;),unk=$(&#x27;#cpUnk&#x27;).checked;let red,buy;if(unk){red=p;buy=0}else{buy=Math.min(p,fv);red=Math.max(0,p-fv)}$(&#x27;#cpOut&#x27;).innerHTML=`Acquisto contabilizzato come da fornitore: &lt;b&gt;${eur(buy)}&lt;/b&gt; · Riduzione del transaction price (e dei ricavi): &lt;b&gt;${eur(red)}&lt;/b&gt;`;};bindRange(&#x27;cpP&#x27;,f);bindRange(&#x27;cpFV&#x27;,f);$(&#x27;#cpUnk&#x27;).addEventListener(&#x27;change&#x27;,f);}

/* allocation */
if($(&#x27;#aA&#x27;)){const f=()=&gt;{const a=V(&#x27;aA&#x27;),b=V(&#x27;aB&#x27;),c=V(&#x27;aC&#x27;),tp=V(&#x27;aTP&#x27;);const s=a+b+c;const al=[a,b,c].map(x=&gt;x/s*tp);const disc=s-tp;
 const W=640;let x=10;[&#x27;#rA&#x27;,&#x27;#rB&#x27;,&#x27;#rC&#x27;].forEach((id,k)=&gt;{const w=al[k]/Math.max(s,tp)*W;$(id).setAttribute(&#x27;x&#x27;,x);$(id).setAttribute(&#x27;width&#x27;,Math.max(0,w));x+=w;});
 let x2=10;[&#x27;#sA&#x27;,&#x27;#sB&#x27;,&#x27;#sC&#x27;].forEach((id,k)=&gt;{const w=[a,b,c][k]/Math.max(s,tp)*W;$(id).setAttribute(&#x27;x&#x27;,x2);$(id).setAttribute(&#x27;width&#x27;,w);x2+=w;});
 $(&#x27;#aTab&#x27;).innerHTML=[&#x27;Prodotto&#x27;,&#x27;Servizio&#x27;,&#x27;Licenza&#x27;].map((n,k)=&gt;`&lt;tr&gt;&lt;td&gt;${n}&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;${eur([a,b,c][k])}&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;${pct([a,b,c][k]/s)}&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;b&gt;${eur(al[k])}&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)+`&lt;tr&gt;&lt;th&gt;Totale&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;${eur(s)}&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;100%&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;${eur(tp)}&lt;/th&gt;&lt;/tr&gt;`;
 $(&#x27;#aOut&#x27;).textContent=disc&gt;0?`Sconto implicito ${eur(disc)} (${pct(disc/s)}) ripartito in proporzione alle SSP, salvo evidenze osservabili (15.82).`:disc&lt;0?`Il prezzo supera la somma delle SSP di ${eur(-disc)}: il “premio” si ripartisce comunque in proporzione.`:&#x27;Nessuno sconto: prezzo = somma delle SSP.&#x27;;};[&#x27;aA&#x27;,&#x27;aB&#x27;,&#x27;aC&#x27;,&#x27;aTP&#x27;].forEach(i=&gt;bindRange(i,f));}

/* sorter */
$$(&#x27;.sorter .item&#x27;).forEach(it=&gt;{const ans=it.dataset.a;$$(&#x27;button&#x27;,it).forEach(b=&gt;b.onclick=()=&gt;{$$(&#x27;button&#x27;,it).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));b.classList.add(&#x27;on&#x27;);const fb=$(&#x27;.fb&#x27;,it);fb.hidden=false;fb.innerHTML=(b.dataset.v===ans?&#x27;&lt;b style=&quot;color:var(--ok)&quot;&gt;Giusto.&lt;/b&gt; &#x27;:&#x27;&lt;b style=&quot;color:var(--no)&quot;&gt;No.&lt;/b&gt; &#x27;)+it.dataset.why;});});

/* impairment */
if($(&#x27;#iCA&#x27;)){const f=()=&gt;{const ca=V(&#x27;iCA&#x27;),r=V(&#x27;iR&#x27;),c=V(&#x27;iC&#x27;);const lim=r-c;const imp=Math.max(0,ca-lim);$(&#x27;#iOut&#x27;).innerHTML=`Limite recuperabile = ${eur(r)} − ${eur(c)} = &lt;b&gt;${eur(lim)}&lt;/b&gt; → impairment loss a conto economico: &lt;b&gt;${eur(imp)}&lt;/b&gt;`;$(&#x27;#iOut&#x27;).className=&#x27;out &#x27;+(imp&gt;0?&#x27;bad&#x27;:&#x27;good&#x27;);};[&#x27;iCA&#x27;,&#x27;iR&#x27;,&#x27;iC&#x27;].forEach(i=&gt;bindRange(i,f));}

/* returns */
if($(&#x27;#rq&#x27;)){const f=()=&gt;{const q=V(&#x27;rq&#x27;),p=V(&#x27;rp&#x27;),c=V(&#x27;rc&#x27;),r=V(&#x27;rr&#x27;)/100;const ret=Math.round(q*r);const rev=(q-ret)*p,rl=ret*p,as=ret*c,cos=(q-ret)*c;
 $(&#x27;#rOut&#x27;).innerHTML=`Resi attesi: ${ret} unità&lt;div class=&quot;je&quot;&gt;Dr Cassa / Crediti          ${eur(q*p)}
   Cr Revenue                       ${eur(rev)}
   Cr Refund liability              ${eur(rl)}
Dr Cost of sales              ${eur(cos)}
Dr Asset (diritto a recuperare) ${eur(as)}
   Cr Inventories                   ${eur(q*c)}&lt;/div&gt;`;};[&#x27;rq&#x27;,&#x27;rp&#x27;,&#x27;rc&#x27;,&#x27;rr&#x27;].forEach(i=&gt;bindRange(i,f));}

/* warranty tree */
const wt=$(&#x27;#wtree&#x27;);if(wt){const nodes={
 q1:[&#x27;Il cliente può acquistare la garanzia separatamente (prezzata o negoziata a parte)?&#x27;,[[&#x27;Sì&#x27;,&#x27;r1&#x27;],[&#x27;No&#x27;,&#x27;q2&#x27;]]],
 q2:[&#x27;La garanzia (o una sua parte) fornisce un servizio in più rispetto all\&#x27;assurance di conformità alle specifiche? Valuta: obbligo di legge, durata, natura dei compiti.&#x27;,[[&#x27;Sì&#x27;,&#x27;r2&#x27;],[&#x27;No&#x27;,&#x27;r3&#x27;]]],
 r1:[&#x27;&lt;b&gt;Service-type warranty&lt;/b&gt;: è una performance obligation distinta (15.B29) → le si alloca una quota del transaction price (par. 73-86) e il ricavo si riconosce mentre il servizio viene reso.&#x27;],
