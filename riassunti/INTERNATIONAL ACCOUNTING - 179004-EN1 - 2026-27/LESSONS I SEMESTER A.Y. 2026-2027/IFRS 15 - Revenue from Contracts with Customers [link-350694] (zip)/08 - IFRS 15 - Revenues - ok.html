&lt;!-- ============ DEFINIZIONI ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s-def&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Parte 1 · Fondamenta&lt;/span&gt;
  &lt;h2&gt;Definizioni, obiettivo e core principle&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Prima di contare i ricavi bisogna sapere che cosa è un &lt;em class=&quot;t&quot;&gt;contract&lt;/em&gt; (contratto), chi è il &lt;em class=&quot;t&quot;&gt;customer&lt;/em&gt; (cliente) e che cosa significa “trasferire” un bene. Lo standard parte da un piccolo vocabolario (Appendix A) e da un principio unico.&lt;/p&gt;

  &lt;h3&gt;Il vocabolario dell&#x27;Appendix A&lt;/h3&gt;
  &lt;p class=&quot;note&quot;&gt;Tocca una scheda per aprire la definizione e la spiegazione. &lt;span class=&quot;src&quot;&gt;Slide 2-3&lt;/span&gt;&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;Contract — contratto&lt;/summary&gt;&lt;div&gt;Accordo tra due o più parti che crea &lt;b&gt;diritti e obbligazioni azionabili&lt;/b&gt; (&lt;i&gt;enforceable rights and obligations&lt;/i&gt;, cioè che un giudice farebbe rispettare). Conta la sostanza giuridica, non la forma: vale anche orale o implicito nelle prassi.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Contract asset — attività derivante da contratto&lt;/summary&gt;&lt;div&gt;Diritto a un corrispettivo per beni/servizi &lt;b&gt;già trasferiti&lt;/b&gt;, quando il diritto è &lt;b&gt;condizionato a qualcosa di diverso dal solo passare del tempo&lt;/b&gt; (es. la futura prestazione dell&#x27;impresa). Se l&#x27;unica condizione è il tempo, è invece un &lt;i&gt;receivable&lt;/i&gt; (credito).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Contract liability — passività derivante da contratto&lt;/summary&gt;&lt;div&gt;Obbligazione di trasferire beni/servizi per cui l&#x27;impresa ha &lt;b&gt;già ricevuto&lt;/b&gt; il corrispettivo (o questo è già dovuto). È il classico “acconto da clienti” / ricavo differito.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Income — proventi&lt;/summary&gt;&lt;div&gt;Aumenti di benefici economici nel periodo, sotto forma di entrate o incrementi di attività o riduzioni di passività, che fanno &lt;b&gt;crescere il patrimonio netto&lt;/b&gt;, esclusi gli apporti dei soci. È la definizione “larga”.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Revenue — ricavo&lt;/summary&gt;&lt;div&gt;È l&#x27;&lt;i&gt;income&lt;/i&gt; che nasce nel corso delle &lt;b&gt;attività ordinarie&lt;/b&gt; (&lt;i&gt;ordinary activities&lt;/i&gt;) dell&#x27;impresa. Una plusvalenza dalla vendita di un vecchio capannone è income ma non revenue.&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Performance obligation — obbligazione di fare/dare&lt;/summary&gt;&lt;div&gt;La promessa di trasferire (a) un bene o servizio (o pacchetto) &lt;b&gt;distinct&lt;/b&gt; (distinto), oppure (b) una &lt;b&gt;serie&lt;/b&gt; di beni/servizi distinti sostanzialmente uguali e con lo stesso schema di trasferimento. È l&#x27;“unità di conto” dello standard: i ricavi si riconoscono per performance obligation (PO).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Stand-alone selling price (SSP) — prezzo di vendita a sé stante&lt;/summary&gt;&lt;div&gt;Il prezzo a cui l&#x27;impresa venderebbe quel bene/servizio &lt;b&gt;da solo&lt;/b&gt; a un cliente. Serve per ripartire il prezzo tra le PO (step 4).&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary&gt;Transaction price — prezzo della transazione&lt;/summary&gt;&lt;div&gt;L&#x27;ammontare di corrispettivo a cui l&#x27;impresa &lt;b&gt;si aspetta di avere diritto&lt;/b&gt; in cambio dei beni/servizi, &lt;b&gt;esclusi gli importi incassati per conto terzi&lt;/b&gt; (es. IVA e alcune imposte sulle vendite).&lt;/div&gt;&lt;/details&gt;

  &lt;svg class=&quot;fig&quot; viewBox=&quot;0 0 760 170&quot; role=&quot;img&quot; aria-label=&quot;Income contiene revenue&quot;&gt;
    &lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;740&quot; height=&quot;150&quot; rx=&quot;16&quot; class=&quot;fillc&quot;/&gt;
    &lt;text x=&quot;30&quot; y=&quot;38&quot; style=&quot;font-weight:600&quot;&gt;Income&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;30&quot; y=&quot;56&quot;&gt;aumenti di equity diversi dagli apporti dei soci&lt;/text&gt;
    &lt;rect x=&quot;300&quot; y=&quot;40&quot; width=&quot;430&quot; height=&quot;104&quot; rx=&quot;12&quot; class=&quot;box&quot;/&gt;
    &lt;text x=&quot;320&quot; y=&quot;66&quot; style=&quot;font-weight:600&quot;&gt;Revenue = income da attività ordinarie&lt;/text&gt;
    &lt;text class=&quot;s&quot; x=&quot;320&quot; y=&quot;88&quot;&gt;vendite di prodotti, prestazioni di servizi, licenze…&lt;/text&gt;
    &lt;text class=&quot;s&quot; x=&quot;320&quot; y=&quot;108&quot;&gt;→ IFRS 15 si occupa di quella da &lt;tspan style=&quot;font-weight:600&quot;&gt;contratti con clienti&lt;/tspan&gt;&lt;/text&gt;
    &lt;text class=&quot;s&quot; x=&quot;30&quot; y=&quot;100&quot;&gt;es. plusvalenze da cessione&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;30&quot; y=&quot;116&quot;&gt;di immobilizzazioni (non revenue)&lt;/text&gt;
  &lt;/svg&gt;

  &lt;h3&gt;Objective (par. 1-4)&lt;/h3&gt;
  &lt;div class=&quot;quote&quot;&gt;Lo standard stabilisce i principi per dare agli utenti del bilancio informazioni utili su &lt;b&gt;natura, importo, tempistica e incertezza&lt;/b&gt; dei ricavi e dei flussi di cassa che nascono da un contratto con un cliente.&lt;span class=&quot;src&quot;&gt;IFRS 15.1 · slide 4&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Nature&lt;/h4&gt;che tipo di ricavo (prodotti, servizi, licenze…)&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Amount&lt;/h4&gt;quanto: il corrispettivo atteso&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Timing&lt;/h4&gt;quando: in un momento o lungo il tempo&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Uncertainty&lt;/h4&gt;quanto è incerto: corrispettivi variabili, resi, incassabilità&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quote&quot; style=&quot;border:2px solid var(--accent);background:var(--accent-bg)&quot;&gt;&lt;b&gt;Core principle:&lt;/b&gt; l&#x27;impresa riconosce i ricavi in modo da rappresentare il &lt;b&gt;trasferimento dei beni o servizi promessi&lt;/b&gt; ai clienti, per un importo che riflette il &lt;b&gt;corrispettivo a cui si aspetta di avere diritto&lt;/b&gt; in cambio.&lt;span class=&quot;src&quot;&gt;IFRS 15.2 · slide 4&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Due parole chiave: &lt;b&gt;trasferimento&lt;/b&gt; (il &lt;i&gt;quando&lt;/i&gt;, che lo standard lega al passaggio del &lt;i&gt;control&lt;/i&gt;) e &lt;b&gt;diritto atteso&lt;/b&gt; (il &lt;i&gt;quanto&lt;/i&gt;, non il prezzo di listino ma ciò che ci si aspetta di incassare legittimamente).&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Coerenza (15.3)&lt;/h4&gt;Si considerano i termini del contratto e &lt;b&gt;tutti i fatti e circostanze rilevanti&lt;/b&gt;; lo standard (compresi i &lt;i&gt;practical expedients&lt;/i&gt;, cioè semplificazioni ammesse) va applicato in modo coerente a contratti simili in circostanze simili.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Portfolio approach (15.4)&lt;/h4&gt;Lo standard è scritto per il &lt;b&gt;singolo contratto&lt;/b&gt;. Come semplificazione si può applicare a un &lt;i&gt;portfolio&lt;/i&gt; (gruppo) di contratti o PO simili, se gli effetti sul bilancio &lt;b&gt;non differiscono in modo materiale&lt;/b&gt;. Stime e ipotesi devono riflettere dimensione e composizione del portafoglio.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;Il modello è riassunto dallo stesso standard in &lt;b&gt;cinque step&lt;/b&gt; (1 contratto · 2 performance obligation · 3 transaction price · 4 allocazione · 5 riconoscimento) ed è obbligatorio dagli esercizi che iniziano il 1° gennaio 2018; ha sostituito IAS 11, IAS 18, IFRIC 13, IFRIC 15, IFRIC 18 e SIC-31. Le slide seguono questo schema senza nominarlo esplicitamente. — &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-15-revenue-from-contracts-with-customers.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IFRS 15&lt;/a&gt;&lt;/div&gt;

  &lt;svg class=&quot;fig&quot; viewBox=&quot;0 0 860 130&quot; role=&quot;img&quot; aria-label=&quot;Il modello a cinque step&quot;&gt;
    &lt;g style=&quot;--c:var(--ochre)&quot;&gt;&lt;rect class=&quot;fillc&quot; x=&quot;5&quot; y=&quot;20&quot; width=&quot;158&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;84&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;1 · Contratto&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;84&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot;&gt;esiste? 5 criteri&lt;/text&gt;&lt;/g&gt;
    &lt;g style=&quot;--c:var(--ochre)&quot;&gt;&lt;rect class=&quot;fillc&quot; x=&quot;178&quot; y=&quot;20&quot; width=&quot;158&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;257&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;2 · PO&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;257&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot;&gt;quali promesse distinte?&lt;/text&gt;&lt;/g&gt;
    &lt;g style=&quot;--c:var(--brick)&quot;&gt;&lt;rect class=&quot;fillc&quot; x=&quot;351&quot; y=&quot;20&quot; width=&quot;158&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;430&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;3 · Prezzo&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;430&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot;&gt;quanto mi spetta?&lt;/text&gt;&lt;/g&gt;
    &lt;g style=&quot;--c:var(--brick)&quot;&gt;&lt;rect class=&quot;fillc&quot; x=&quot;524&quot; y=&quot;20&quot; width=&quot;158&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;603&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;4 · Allocazione&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;603&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot;&gt;quanto a ciascuna PO?&lt;/text&gt;&lt;/g&gt;
    &lt;g style=&quot;--c:var(--slate)&quot;&gt;&lt;rect class=&quot;fillc&quot; x=&quot;697&quot; y=&quot;20&quot; width=&quot;158&quot; height=&quot;90&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;776&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;5 · Ricavo&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;776&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot;&gt;quando? control&lt;/text&gt;&lt;/g&gt;
  &lt;/svg&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Qual è la differenza tra income e revenue?&lt;/summary&gt;&lt;div&gt;Revenue è il sottoinsieme dell&#x27;income che nasce dalle attività ordinarie. L&#x27;income comprende anche, ad esempio, plusvalenze occasionali.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Un credito verso cliente per cui manca solo il trascorrere di 30 giorni è contract asset o receivable?&lt;/summary&gt;&lt;div&gt;Receivable: il diritto è incondizionato, serve solo il passare del tempo. Contract asset quando il diritto dipende ancora da altro (es. una prestazione futura).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Il transaction price include l&#x27;IVA addebitata al cliente?&lt;/summary&gt;&lt;div&gt;No: gli importi incassati per conto terzi (come alcune imposte sulle vendite) sono esclusi.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Quando è ammesso il portfolio approach?&lt;/summary&gt;&lt;div&gt;Quando l&#x27;impresa si attende ragionevolmente che l&#x27;effetto sul bilancio non differisca in modo materiale dall&#x27;applicazione contratto per contratto (IFRS 15.4).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ SCOPE ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s-scope&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Parte 2 · Ambito&lt;/span&gt;
  &lt;h2&gt;Scope: quali contratti rientrano&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;IFRS 15 si applica a &lt;b&gt;tutti i contratti con clienti&lt;/b&gt;, salvo quattro esclusioni, e &lt;b&gt;solo se la controparte è davvero un customer&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;Slide 6-7 · IFRS 15.5-6&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Esclusioni (15.5)&lt;/h4&gt;
      &lt;ol class=&quot;alpha&quot;&gt;
        &lt;li&gt;&lt;b&gt;Lease&lt;/b&gt; (contratti di locazione) → IFRS 16 &lt;i&gt;Leases&lt;/i&gt;;&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Insurance contracts&lt;/b&gt; → IFRS 17 (ma si può scegliere IFRS 15 per contratti assicurativi il cui scopo principale è fornire servizi a compenso fisso, IFRS 17.8);&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Financial instruments&lt;/b&gt; e diritti/obbligazioni contrattuali di IFRS 9, IFRS 10, IFRS 11, IAS 27, IAS 28;&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Non-monetary exchanges&lt;/b&gt; (permute non monetarie) tra imprese dello stesso settore per facilitare vendite a clienti: es. due compagnie petrolifere che si scambiano petrolio per servire clienti in luoghi diversi.&lt;/li&gt;
      &lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Chi è il customer (15.6)&lt;/h4&gt;
      &lt;p&gt;Il &lt;i&gt;customer&lt;/i&gt; è chi ha contratto con l&#x27;impresa per ottenere beni o servizi che sono &lt;b&gt;output delle attività ordinarie&lt;/b&gt;, in cambio di un corrispettivo.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Non&lt;/b&gt; è customer chi partecipa a un&#x27;attività &lt;b&gt;condividendone rischi e benefici&lt;/b&gt; (es. sviluppo congiunto di un asset in un &lt;i&gt;collaboration arrangement&lt;/i&gt;, accordo di collaborazione): qui non c&#x27;è uno scambio, c&#x27;è una partnership.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Prova tu: IFRS 15 o no?&lt;/h3&gt;
  &lt;p class=&quot;note&quot;&gt;Scegli un caso: la pagina dice quale standard si applica e perché.&lt;/p&gt;
  &lt;div id=&quot;scopeBtns&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;out&quot; id=&quot;scopeOut&quot; aria-live=&quot;polite&quot;&gt;Seleziona un caso.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Perché una permuta di petrolio tra due compagnie non è un ricavo IFRS 15?&lt;/summary&gt;&lt;div&gt;È uno scambio non monetario tra imprese dello stesso settore per facilitare le vendite ai clienti finali: non c&#x27;è vendita a un customer, solo un riposizionamento delle scorte (15.5d).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Due case farmaceutiche sviluppano insieme una molecola dividendo costi e futuri profitti. C&#x27;è un customer?&lt;/summary&gt;&lt;div&gt;No: la controparte condivide rischi e benefici dell&#x27;attività invece di acquistare un output delle attività ordinarie (15.6).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Una società di software affitta anche uffici a terzi: i canoni seguono IFRS 15?&lt;/summary&gt;&lt;div&gt;No, i lease ricadono in IFRS 16 (15.5a).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ STEP 1 ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s-contratto&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Step 1 · par. 9-16&lt;/span&gt;
  &lt;h2&gt;Identificare il contratto&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Si contabilizza un contratto con un cliente &lt;b&gt;solo quando tutti e cinque&lt;/b&gt; i criteri di IFRS 15.9 sono soddisfatti. &lt;span class=&quot;src&quot;&gt;Slide 8-14&lt;/span&gt;&lt;/p&gt;

  &lt;h3&gt;Checklist interattiva dei 5 criteri&lt;/h3&gt;
  &lt;div class=&quot;card chk&quot; id=&quot;chk&quot;&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;a&quot;&gt;&lt;b&gt;(a) Approvazione e impegno&lt;/b&gt;: le parti hanno approvato il contratto (per iscritto, oralmente o secondo prassi) e sono impegnate ad adempiere.&lt;/label&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;b&quot;&gt;&lt;b&gt;(b) Diritti identificabili&lt;/b&gt;: si identificano i diritti di ciascuna parte sui beni/servizi.&lt;/label&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;c&quot;&gt;&lt;b&gt;(c) Termini di pagamento identificabili&lt;/b&gt;.&lt;/label&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;d&quot;&gt;&lt;b&gt;(d) Commercial substance&lt;/b&gt; (sostanza commerciale): rischio, tempistica o importo dei flussi futuri cambiano per effetto del contratto.&lt;/label&gt;
    &lt;label&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;e&quot;&gt;&lt;b&gt;(e) Collectability probabile&lt;/b&gt;: è probabile incassare il corrispettivo a cui si avrà diritto, guardando solo a &lt;i&gt;capacità e intenzione&lt;/i&gt; del cliente di pagare alla scadenza.&lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;out bad&quot; id=&quot;chkOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;tint&quot;&gt;&lt;b&gt;Attenzione su (e).&lt;/b&gt; L&#x27;importo “a cui si avrà diritto” può essere &lt;b&gt;inferiore al prezzo scritto&lt;/b&gt; se il corrispettivo è variabile perché l&#x27;impresa prevede di concedere una &lt;i&gt;price concession&lt;/i&gt; (sconto a posteriori, par. 52). Quindi la collectability si valuta sull&#x27;importo atteso, non sul listino.&lt;/div&gt;

  &lt;h3&gt;Forma, durata e “contratti che non esistono”&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Forma (15.10)&lt;/h4&gt;Contratti &lt;b&gt;scritti, orali o impliciti&lt;/b&gt; nelle prassi commerciali. L&#x27;azionabilità è una questione &lt;b&gt;di diritto&lt;/b&gt;; prassi e processi variano per giurisdizione, settore, impresa e perfino per classe di clienti.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Durata (15.11)&lt;/h4&gt;Si applica lo standard alla &lt;b&gt;contractual period&lt;/b&gt;: il periodo in cui le parti hanno diritti e obbligazioni &lt;b&gt;attuali e azionabili&lt;/b&gt;, anche se il contratto si rinnova automaticamente o è risolvibile in ogni momento.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Wholly unperformed (15.12)&lt;/h4&gt;Il contratto &lt;b&gt;non esiste&lt;/b&gt; se ciascuna parte può risolvere unilateralmente, senza indennizzi, un contratto &lt;b&gt;totalmente ineseguito&lt;/b&gt;: (a) nulla è stato trasferito e (b) nulla è stato incassato né è ancora dovuto.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Rivalutazione (15.13-14)&lt;/h4&gt;Se i criteri sono soddisfatti all&#x27;inizio, &lt;b&gt;non si rivalutano&lt;/b&gt; salvo cambiamenti significativi (es. il cliente peggiora molto la sua capacità di pagare). Se non sono soddisfatti, si &lt;b&gt;continua a verificarli&lt;/b&gt; nel tempo.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Incassi senza contratto valido (15.15-16)&lt;/h3&gt;
  &lt;svg class=&quot;fig&quot; viewBox=&quot;0 0 820 250&quot; role=&quot;img&quot; aria-label=&quot;Diagramma: corrispettivo ricevuto senza contratto IFRS 15&quot;&gt;
    &lt;rect class=&quot;box&quot; x=&quot;10&quot; y=&quot;90&quot; width=&quot;190&quot; height=&quot;70&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Incasso dal cliente&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;105&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot;&gt;ma i criteri del 15.9&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;105&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot;&gt;non sono soddisfatti&lt;/text&gt;
    &lt;path class=&quot;ln&quot; d=&quot;M200 125H250&quot;/&gt;
    &lt;rect class=&quot;fillc&quot; x=&quot;250&quot; y=&quot;90&quot; width=&quot;200&quot; height=&quot;70&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;350&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;LIABILITY&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;350&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot;&gt;misurata all&#x27;importo ricevuto&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;350&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot;&gt;(trasferire o rimborsare)&lt;/text&gt;
    &lt;path class=&quot;ln&quot; d=&quot;M450 110 L520 45M450 125H520M450 140 L520 205&quot;/&gt;
    &lt;rect class=&quot;box&quot; x=&quot;520&quot; y=&quot;15&quot; width=&quot;290&quot; height=&quot;60&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;535&quot; y=&quot;40&quot; style=&quot;font-weight:600&quot;&gt;(a) nessuna obbligazione residua&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;535&quot; y=&quot;60&quot;&gt;e incassato (quasi) tutto, non rimborsabile → REVENUE&lt;/text&gt;
    &lt;rect class=&quot;box&quot; x=&quot;520&quot; y=&quot;95&quot; width=&quot;290&quot; height=&quot;60&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;535&quot; y=&quot;120&quot; style=&quot;font-weight:600&quot;&gt;(b) contratto risolto&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;535&quot; y=&quot;140&quot;&gt;e incasso non rimborsabile → REVENUE&lt;/text&gt;
    &lt;rect class=&quot;box&quot; x=&quot;520&quot; y=&quot;175&quot; width=&quot;290&quot; height=&quot;60&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;535&quot; y=&quot;200&quot; style=&quot;font-weight:600&quot;&gt;criteri 15.9 poi soddisfatti&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;535&quot; y=&quot;220&quot;&gt;→ si applica il modello normale (15.14)&lt;/text&gt;
  &lt;/svg&gt;
  &lt;p&gt;Logica prudente: senza un contratto valido, il denaro ricevuto non è ancora “guadagnato”. Resta una passività che rappresenta l&#x27;obbligo di &lt;b&gt;dare il bene/servizio in futuro oppure restituire&lt;/b&gt; il denaro.&lt;/p&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Un contratto verbale può soddisfare il criterio (a)?&lt;/summary&gt;&lt;div&gt;Sì: l&#x27;approvazione può essere scritta, orale o secondo le prassi commerciali, purché crei diritti azionabili.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Abbonamento in palestra disdicibile da entrambe le parti in qualsiasi momento senza penali, prima dell&#x27;inizio e senza pagamenti: c&#x27;è un contratto?&lt;/summary&gt;&lt;div&gt;No: è wholly unperformed e ciascuna parte può risolverlo senza indennizzo (15.12).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Dopo la firma il cliente entra in crisi finanziaria grave. Cosa fa l&#x27;impresa?&lt;/summary&gt;&lt;div&gt;Rivaluta i criteri, in particolare la collectability, per i beni/servizi ancora da trasferire (15.13).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Come si misura la passività per incassi ricevuti in assenza di contratto?&lt;/summary&gt;&lt;div&gt;All&#x27;importo del corrispettivo ricevuto (15.16).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ STEP 2 ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s-po&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Step 2 · par. 22-30&lt;/span&gt;
  &lt;h2&gt;Performance obligations e il concetto di control&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;All&#x27;inizio del contratto (&lt;i&gt;contract inception&lt;/i&gt;) l&#x27;impresa esamina le promesse e identifica come &lt;b&gt;performance obligation&lt;/b&gt; ciascuna promessa di trasferire: (a) un bene/servizio &lt;b&gt;distinct&lt;/b&gt;, oppure (b) una &lt;b&gt;serie&lt;/b&gt; di beni/servizi distinti sostanzialmente uguali con lo stesso schema di trasferimento. &lt;span class=&quot;src&quot;&gt;Slide 15 · IFRS 15.22-23&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;(a) Bene o servizio distinto&lt;/h4&gt;Ogni promessa distinta è una PO separata e riceve una parte del prezzo. Ciò che non è distinto si raggruppa finché si ottiene un pacchetto distinto.
      &lt;div class=&quot;ext&quot; style=&quot;margin-bottom:0&quot;&gt;Secondo IFRS 15.27 un bene è distinto se (i) il cliente &lt;b&gt;può trarne beneficio&lt;/b&gt; da solo o con risorse facilmente disponibili e (ii) la promessa è &lt;b&gt;separatamente identificabile&lt;/b&gt; nel contratto (non è, ad esempio, un input di un prodotto combinato). — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo IFRS 15 su ifrs.org&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;(b) Series — la “serie”&lt;/h4&gt;Una serie ha lo stesso schema di trasferimento se &lt;b&gt;entrambi&lt;/b&gt;:
      &lt;ol class=&quot;alpha&quot;&gt;&lt;li&gt;ogni bene/servizio della serie soddisferebbe i criteri del par. 35 per essere una PO &lt;b&gt;over time&lt;/b&gt;;&lt;/li&gt;&lt;li&gt;si userebbe &lt;b&gt;lo stesso metodo&lt;/b&gt; di misura dei progressi (par. 39-40).&lt;/li&gt;&lt;/ol&gt;
      Esempio tipico: un servizio di pulizia giornaliero per un anno è &lt;b&gt;una&lt;/b&gt; PO, non 365.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Che cosa vuol dire “trasferire”: il control&lt;/h3&gt;
  &lt;div class=&quot;quote&quot;&gt;Un&#x27;attività è trasferita quando (o man mano che) il cliente ne ottiene il &lt;b&gt;control&lt;/b&gt;: la capacità di &lt;b&gt;dirigerne l&#x27;uso&lt;/b&gt; e di &lt;b&gt;ottenerne sostanzialmente tutti i benefici residui&lt;/b&gt;.&lt;span class=&quot;src&quot;&gt;IFRS 15.31-33 · slide 16-18&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Il control comprende anche la capacità di &lt;b&gt;impedire ad altri&lt;/b&gt; di dirigerne l&#x27;uso e trarne benefici. Beni e servizi sono attività anche solo per un istante, quando vengono ricevuti e usati (come accade per molti servizi). I &lt;b&gt;benefici&lt;/b&gt; sono i flussi di cassa potenziali (entrate o minori uscite), ottenibili ad esempio:&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;usandolo per produrre beni o servizi (anche pubblici)&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;usandolo per accrescere il valore di altre attività&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;usandolo per estinguere passività o ridurre costi&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;vendendolo o scambiandolo&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;dandolo in pegno a garanzia di un prestito&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;semplicemente detenendolo&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tint&quot;&gt;Per ogni PO l&#x27;impresa decide &lt;b&gt;all&#x27;inizio del contratto&lt;/b&gt; se è soddisfatta &lt;b&gt;over time&lt;/b&gt; (par. 35-37) o &lt;b&gt;at a point in time&lt;/b&gt; (par. 38). La regola è residuale: &lt;b&gt;se non è over time, è at a point in time&lt;/b&gt; (15.32). Approfondimento nello &lt;a href=&quot;#s-ricon&quot;&gt;step 5&lt;/a&gt;.&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Perché le PO sono l&#x27;unità di conto dello standard?&lt;/summary&gt;&lt;div&gt;Perché prezzo (step 4) e momento del ricavo (step 5) si determinano per ciascuna PO: un contratto con più promesse distinte genera ricavi in tempi diversi.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Quali sono i due elementi della definizione di control?&lt;/summary&gt;&lt;div&gt;Capacità di dirigere l&#x27;uso dell&#x27;attività e di ottenerne sostanzialmente tutti i benefici residui (inclusa la capacità di impedirlo ad altri).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Un servizio mensile di manutenzione per 3 anni: 36 PO o una?&lt;/summary&gt;&lt;div&gt;Di norma una sola PO costituita da una serie: servizi distinti, sostanzialmente uguali, ciascuno over time e misurati con lo stesso metodo (15.22b-23).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ STEP 3 ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s-prezzo&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Step 3 · par. 46-72&lt;/span&gt;
  &lt;h2&gt;Determinare il transaction price&lt;/h2&gt;
  &lt;div class=&quot;quote&quot;&gt;Quando (o man mano che) una PO è soddisfatta, l&#x27;impresa riconosce come ricavo l&#x27;importo del &lt;b&gt;transaction price allocato&lt;/b&gt; a quella PO, escluse le stime di corrispettivo variabile soggette a &lt;i&gt;constraint&lt;/i&gt; (par. 56-58).&lt;span class=&quot;src&quot;&gt;IFRS 15.46 · slide 28&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;Per determinarlo si guardano i &lt;b&gt;termini del contratto&lt;/b&gt; e le &lt;b&gt;prassi commerciali&lt;/b&gt; dell&#x27;impresa. Il prezzo è ciò a cui l&#x27;impresa &lt;b&gt;si aspetta di avere diritto&lt;/b&gt;, esclusi gli importi per conto terzi (es. alcune imposte sulle vendite); può avere parte &lt;b&gt;fissa, variabile o entrambe&lt;/b&gt; (15.47). Natura, tempistica e importo del corrispettivo influenzano la stima; vanno considerati &lt;b&gt;cinque effetti&lt;/b&gt; (15.48): &lt;span class=&quot;src&quot;&gt;slide 29-30&lt;/span&gt;&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Componenti del transaction price&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;tp1&quot;&gt;a · Variable consideration&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;tp2&quot;&gt;b · Constraint&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;tp3&quot;&gt;c · Financing component&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;tp4&quot;&gt;d · Non-cash&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;tp5&quot;&gt;e · Payable to customer&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;tp1&quot;&gt;&lt;p&gt;&lt;b&gt;Variable consideration&lt;/b&gt; (corrispettivo variabile, par. 50-55 e 59): sconti, rimborsi, bonus di performance, penali, premi a volume, concessioni di prezzo, resi. Va &lt;b&gt;stimato&lt;/b&gt; e &lt;b&gt;aggiornato a ogni chiusura&lt;/b&gt; per rappresentare fedelmente le circostanze (15.59); le variazioni seguono i par. 87-90.&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;IFRS 15.53 prevede due metodi di stima, scegliendo quello che prevede meglio l&#x27;importo: &lt;b&gt;expected value&lt;/b&gt; (media ponderata per le probabilità, adatta a molti contratti simili) e &lt;b&gt;most likely amount&lt;/b&gt; (l&#x27;esito singolo più probabile, adatto a esiti binari come “bonus sì/no”). Es.: bonus di € 10.000 se la consegna è puntuale, probabilità 80% → most likely amount = € 10.000; expected value = € 8.000. — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 su ifrs.org&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;tp2&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Constraining estimates&lt;/b&gt; (limite alle stime, par. 56-58): parte del corrispettivo variabile resta fuori dal prezzo finché è troppo incerta. Le slide lo richiamano nella definizione di misurazione (15.46).&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;Secondo IFRS 15.56 si include il variabile solo nella misura in cui è &lt;b&gt;altamente probabile&lt;/b&gt; (&lt;i&gt;highly probable&lt;/i&gt;) che non ci sarà un &lt;b&gt;significativo storno&lt;/b&gt; dei ricavi cumulati quando l&#x27;incertezza si risolve. — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 su ifrs.org&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;tp3&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Significant financing component&lt;/b&gt; (componente finanziaria significativa, par. 60-65): se il pagamento è molto anticipato o molto dilazionato rispetto al trasferimento, il contratto contiene un finanziamento. Gli effetti (&lt;b&gt;interest revenue o interest expense&lt;/b&gt;) si presentano &lt;b&gt;separatamente&lt;/b&gt; dai ricavi da contratti con clienti nel prospetto di conto economico complessivo, e solo nella misura in cui è rilevato un &lt;i&gt;contract asset&lt;/i&gt; (o credito) o una &lt;i&gt;contract liability&lt;/i&gt; (15.65, slide 32).&lt;/p&gt;
      &lt;p&gt;Esempio: vendo oggi un bene a € 1.000 incassabili fra 3 anni. Il ricavo è il valore attuale (circa € 864 al 5%); la differenza matura come interesse attivo nei 3 anni.&lt;/p&gt;
      &lt;div class=&quot;ext&quot;&gt;Practical expedient (IFRS 15.63): non serve rettificare se all&#x27;inizio si prevede che tra trasferimento e pagamento passi &lt;b&gt;un anno o meno&lt;/b&gt;. — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 su ifrs.org&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;tp4&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Non-cash consideration&lt;/b&gt; (corrispettivo non monetario, par. 66-69, slide 33): se il cliente paga in natura (beni, servizi, azioni…), lo si misura al &lt;b&gt;fair value&lt;/b&gt; (15.66). Se il fair value non è stimabile ragionevolmente, si misura &lt;b&gt;indirettamente&lt;/b&gt; con lo &lt;b&gt;stand-alone selling price&lt;/b&gt; dei beni/servizi promessi al cliente (15.67).&lt;/p&gt;
      &lt;p&gt;Esempio: una start-up paga una consulenza con proprie azioni. Ricavo = fair value delle azioni; se non è stimabile, ricavo = SSP della consulenza.&lt;/p&gt;&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;tp5&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Consideration payable to a customer&lt;/b&gt; (corrispettivo da pagare al cliente, par. 70-72, slide 34-35): somme pagate (o da pagare) al cliente o a chi compra dal cliente, compresi crediti, &lt;b&gt;coupon e voucher&lt;/b&gt;. Regola: è una &lt;b&gt;riduzione del transaction price&lt;/b&gt; e quindi dei ricavi, &lt;b&gt;salvo&lt;/b&gt; che paghi un bene/servizio &lt;b&gt;distinto&lt;/b&gt; ricevuto dal cliente. In quel caso è un normale acquisto, ma l&#x27;&lt;b&gt;eccedenza sul fair value&lt;/b&gt; riduce il prezzo; se il fair value non è stimabile, &lt;b&gt;tutto&lt;/b&gt; riduce il prezzo (15.71).&lt;/p&gt;
      &lt;p&gt;Esempio: un produttore di bibite paga a un supermercato (suo cliente) € 5.000 per spazio espositivo il cui fair value è € 3.000 → € 3.000 costo di marketing, € 2.000 riduzione dei ricavi.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Calcolatore: consideration payable to a customer&lt;/h3&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;label class=&quot;rng&quot;&gt;Pagamento al cliente &lt;input type=&quot;range&quot; id=&quot;cpP&quot; min=&quot;0&quot; max=&quot;10000&quot; step=&quot;500&quot; value=&quot;5000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Fair value del bene/servizio ricevuto &lt;input type=&quot;range&quot; id=&quot;cpFV&quot; min=&quot;0&quot; max=&quot;10000&quot; step=&quot;500&quot; value=&quot;3000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label style=&quot;font-size:.92rem&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;cpUnk&quot;&gt;Fair value non stimabile ragionevolmente (oppure nessun bene distinto ricevuto)&lt;/label&gt;
    &lt;div class=&quot;out&quot; id=&quot;cpOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Refund liabilities (par. 55)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Quando&lt;/h4&gt;Si rileva una &lt;b&gt;refund liability&lt;/b&gt; (passività per rimborsi) se l&#x27;impresa riceve il corrispettivo e &lt;b&gt;si aspetta di restituirne&lt;/b&gt; una parte o tutto.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Quanto&lt;/h4&gt;All&#x27;importo ricevuto (o da ricevere) a cui l&#x27;impresa &lt;b&gt;non si aspetta di avere diritto&lt;/b&gt;, cioè la parte esclusa dal transaction price. Va &lt;b&gt;aggiornata a ogni chiusura&lt;/b&gt;. Per le vendite con diritto di reso si veda B20-B27 (&lt;a href=&quot;#s-casi&quot;&gt;casi particolari&lt;/a&gt;).&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Quali cinque effetti vanno considerati nel determinare il transaction price?&lt;/summary&gt;&lt;div&gt;Variable consideration, constraint sulle stime, significant financing component, non-cash consideration, consideration payable to a customer (15.48).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Dove si presentano gli interessi della componente finanziaria?&lt;/summary&gt;&lt;div&gt;Separatamente dai ricavi da contratti con clienti, nel prospetto di conto economico complessivo (15.65).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Il cliente paga con macchinari usati di cui non si riesce a stimare il fair value. Come si misura il ricavo?&lt;/summary&gt;&lt;div&gt;Indirettamente, con lo stand-alone selling price dei beni/servizi promessi al cliente (15.67).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Un voucher di sconto dato al cliente è un costo di marketing?&lt;/summary&gt;&lt;div&gt;Di norma no: è consideration payable to a customer e riduce il transaction price, salvo che remuneri un bene/servizio distinto ricevuto dal cliente (15.70).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ STEP 4 ============ --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s-alloc&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Step 4 · par. 73-90&lt;/span&gt;
  &lt;h2&gt;Allocare il prezzo alle performance obligations&lt;/h2&gt;
  &lt;div class=&quot;quote&quot;&gt;Obiettivo: allocare il transaction price a ciascuna PO (o bene/servizio distinto) per un importo che rappresenti il corrispettivo a cui l&#x27;impresa si aspetta di avere diritto in cambio di quel trasferimento.&lt;span class=&quot;src&quot;&gt;IFRS 15.73-75 · slide 36&lt;/span&gt;&lt;/div&gt;
  &lt;p&gt;La base è il &lt;b&gt;rapporto tra gli stand-alone selling price&lt;/b&gt; (relative SSP). In formula:&lt;/p&gt;
  &lt;p class=&quot;quote&quot; style=&quot;text-align:center;font-size:1.25rem&quot;&gt;Prezzo allocato&lt;sub&gt;i&lt;/sub&gt; = Transaction price × SSP&lt;sub&gt;i&lt;/sub&gt; / Σ SSP&lt;/p&gt;
  &lt;div class=&quot;ext&quot;&gt;Se la SSP non è osservabile, IFRS 15.79 la fa stimare con, ad esempio, l&#x27;&lt;b&gt;adjusted market assessment approach&lt;/b&gt; (prezzo di mercato rettificato), l&#x27;&lt;b&gt;expected cost plus a margin approach&lt;/b&gt; (costo atteso più margine) o, in casi limitati, il &lt;b&gt;residual approach&lt;/b&gt; (residuo). — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 su ifrs.org&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Laboratorio: allocazione con relative SSP&lt;/h3&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;label class=&quot;rng&quot;&gt;SSP prodotto &lt;input type=&quot;range&quot; id=&quot;aA&quot; min=&quot;100&quot; max=&quot;2000&quot; step=&quot;50&quot; value=&quot;800&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;SSP servizio &lt;input type=&quot;range&quot; id=&quot;aB&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;50&quot; value=&quot;300&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;SSP licenza &lt;input type=&quot;range&quot; id=&quot;aC&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;50&quot; value=&quot;100&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Prezzo del contratto &lt;input type=&quot;range&quot; id=&quot;aTP&quot; min=&quot;100&quot; max=&quot;4000&quot; step=&quot;50&quot; value=&quot;1000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;svg class=&quot;fig&quot; viewBox=&quot;0 0 660 120&quot; role=&quot;img&quot; aria-label=&quot;Barre: SSP e prezzo allocato&quot;&gt;
      &lt;text class=&quot;s&quot; x=&quot;10&quot; y=&quot;16&quot;&gt;Somma delle SSP&lt;/text&gt;
      &lt;rect id=&quot;sA&quot; y=&quot;22&quot; height=&quot;28&quot; style=&quot;fill:var(--brick);opacity:.35&quot;/&gt;&lt;rect id=&quot;sB&quot; y=&quot;22&quot; height=&quot;28&quot; style=&quot;fill:var(--ochre);opacity:.35&quot;/&gt;&lt;rect id=&quot;sC&quot; y=&quot;22&quot; height=&quot;28&quot; style=&quot;fill:var(--slate);opacity:.35&quot;/&gt;
      &lt;text class=&quot;s&quot; x=&quot;10&quot; y=&quot;76&quot;&gt;Transaction price allocato&lt;/text&gt;
      &lt;rect id=&quot;rA&quot; y=&quot;82&quot; height=&quot;28&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;rect id=&quot;rB&quot; y=&quot;82&quot; height=&quot;28&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;rect id=&quot;rC&quot; y=&quot;82&quot; height=&quot;28&quot; style=&quot;fill:var(--slate)&quot;/&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Elemento&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;SSP&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Peso&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Prezzo allocato&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;aTab&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;out&quot; id=&quot;aOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Allocazione di uno sconto (par. 81-83)&lt;/h3&gt;
  &lt;p&gt;C&#x27;è uno &lt;b&gt;sconto&lt;/b&gt; se la somma delle SSP supera il corrispettivo promesso. Regola generale: si ripartisce &lt;b&gt;proporzionalmente a tutte le PO&lt;/b&gt; (è la naturale conseguenza delle relative SSP). &lt;span class=&quot;src&quot;&gt;Slide 37-38&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;tint&quot;&gt;&lt;b&gt;Eccezione (15.82):&lt;/b&gt; lo sconto va &lt;b&gt;interamente&lt;/b&gt; a una o più PO (ma non a tutte) se &lt;b&gt;tutti&lt;/b&gt; i criteri sono soddisfatti:
    &lt;ol class=&quot;alpha&quot;&gt;&lt;li&gt;l&#x27;impresa vende regolarmente &lt;b&gt;da soli&lt;/b&gt; ciascun bene/servizio (o pacchetto) del contratto;&lt;/li&gt;
    &lt;li&gt;vende regolarmente da sé anche un &lt;b&gt;pacchetto di alcuni&lt;/b&gt; di questi beni con uno sconto rispetto alle SSP;&lt;/li&gt;
    &lt;li&gt;lo sconto di quel pacchetto è &lt;b&gt;sostanzialmente uguale&lt;/b&gt; a quello del contratto e l&#x27;analisi fornisce &lt;b&gt;evidenza osservabile&lt;/b&gt; della PO a cui lo sconto appartiene.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;Esempio ispirato agli Illustrative Examples dello standard: A (SSP 40), B (55), C (45), prezzo 100 → sconto 40. Se B+C si vendono abitualmente insieme a 60, lo sconto di 40 è tutto su B e C: A riceve 40, B e C si dividono 60 (B 33, C 27). — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 su ifrs.org&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Allocazione del corrispettivo variabile (par. 84-86)&lt;/h3&gt;
  &lt;p&gt;Un importo variabile (e le sue variazioni) va &lt;b&gt;interamente&lt;/b&gt; a una PO, o a un bene distinto all&#x27;interno di una serie (22b), se &lt;b&gt;entrambi&lt;/b&gt;: (a) i termini del pagamento variabile riguardano &lt;b&gt;specificamente&lt;/b&gt; gli sforzi per quella PO o un suo esito specifico; (b) l&#x27;attribuzione integrale è coerente con l&#x27;obiettivo di allocazione considerando tutte le PO e i termini di pagamento. &lt;span class=&quot;src&quot;&gt;Slide 39 · IFRS 15.85&lt;/span&gt;&lt;/p&gt;
  &lt;p class=&quot;note&quot;&gt;Esempio: bonus di € 2.000 legato solo alla consegna anticipata dell&#x27;impianto, in un contratto che comprende anche la manutenzione → il bonus va tutto all&#x27;impianto.&lt;/p&gt;

  &lt;h3&gt;Variazioni del transaction price (par. 87-90)&lt;/h3&gt;
  &lt;div class=&quot;steps card&quot;&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;1 · Perché cambia&lt;/h4&gt;Dopo l&#x27;inizio del contratto il prezzo può cambiare per la risoluzione di eventi incerti o per altre circostanze che modificano il corrispettivo atteso (15.87).&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;2 · Stessa base dell&#x27;inizio&lt;/h4&gt;Le variazioni si allocano alle PO &lt;b&gt;con le stesse proporzioni usate all&#x27;inizio&lt;/b&gt;. Non si rialloca per riflettere variazioni successive delle SSP (15.88).&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;3 · PO già soddisfatte&lt;/h4&gt;La quota che cade su PO già soddisfatte si rileva subito come ricavo (o riduzione di ricavo) &lt;b&gt;nel periodo in cui il prezzo cambia&lt;/b&gt; (15.88).&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;4 · Dopo una contract modification&lt;/h4&gt;Se la variazione deriva da una modifica del contratto si applicano i par. 18-21. Se invece avviene dopo una modifica (15.90): (a) va alle PO &lt;b&gt;pre-modifica&lt;/b&gt; se deriva da un variabile promesso prima e la modifica è contabilizzata secondo 21(a); (b) negli altri casi (modifica non trattata come contratto separato, par. 20) va alle PO del contratto modificato ancora &lt;b&gt;non (completamente) soddisfatte&lt;/b&gt;.&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;b prev&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;b next&quot;&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;cnt note&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Telefono (SSP 600) + 12 mesi di servizio (SSP 300) venduti a 720. Quanto va al telefono?&lt;/summary&gt;&lt;div&gt;720 × 600/900 = 480; al servizio 240. Lo sconto di 180 è ripartito in proporzione.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. La SSP del servizio sale dopo la firma: si rialloca il prezzo?&lt;/summary&gt;&lt;div&gt;No: le variazioni successive delle SSP non comportano riallocazione (15.88).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Quando lo sconto si alloca solo ad alcune PO?&lt;/summary&gt;&lt;div&gt;Quando sono soddisfatti tutti e tre i criteri del 15.82, cioè esiste evidenza osservabile di vendite abituali di quel sotto-pacchetto con lo stesso sconto.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ STEP 5 ============ --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s-ricon&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Step 5 · par. 31-45&lt;/span&gt;
  &lt;h2&gt;Riconoscere il ricavo: over time o at a point in time&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Il ricavo si riconosce &lt;b&gt;quando (o man mano che)&lt;/b&gt; la PO è soddisfatta, cioè quando il cliente ottiene il &lt;b&gt;control&lt;/b&gt; dell&#x27;asset. Prima domanda: la PO soddisfa uno dei tre criteri &lt;i&gt;over time&lt;/i&gt;? &lt;span class=&quot;src&quot;&gt;Slide 16, 19 · IFRS 15.31-35&lt;/span&gt;&lt;/p&gt;

  &lt;svg class=&quot;fig&quot; viewBox=&quot;0 0 860 300&quot; role=&quot;img&quot; aria-label=&quot;Albero decisionale over time / point in time&quot;&gt;
    &lt;rect class=&quot;box&quot; x=&quot;10&quot; y=&quot;20&quot; width=&quot;250&quot; height=&quot;62&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;22&quot; y=&quot;44&quot; style=&quot;font-weight:600&quot;&gt;(a) Il cliente riceve e consuma&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;22&quot; y=&quot;64&quot;&gt;i benefici man mano (B3-B4)&lt;/text&gt;
    &lt;rect class=&quot;box&quot; x=&quot;10&quot; y=&quot;118&quot; width=&quot;250&quot; height=&quot;62&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;22&quot; y=&quot;142&quot; style=&quot;font-weight:600&quot;&gt;(b) Crea/migliora un asset che il&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;22&quot; y=&quot;162&quot;&gt;cliente controlla man mano (es. WIP, B5)&lt;/text&gt;
    &lt;rect class=&quot;box&quot; x=&quot;10&quot; y=&quot;216&quot; width=&quot;250&quot; height=&quot;70&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;22&quot; y=&quot;240&quot; style=&quot;font-weight:600&quot;&gt;(c) Nessun alternative use (par. 36)&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;22&quot; y=&quot;258&quot;&gt;E diritto azionabile al pagamento&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;22&quot; y=&quot;273&quot;&gt;per la prestazione svolta (par. 37)&lt;/text&gt;
    &lt;path class=&quot;ln&quot; d=&quot;M260 51H330M260 149H330M260 251H330M330 51V251&quot;/&gt;
    &lt;rect class=&quot;fillc&quot; x=&quot;360&quot; y=&quot;110&quot; width=&quot;150&quot; height=&quot;80&quot; rx=&quot;40&quot;/&gt;&lt;text x=&quot;435&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; style=&quot;font-weight:600&quot;&gt;Almeno uno?&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;435&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot;&gt;(“one of the following”)&lt;/text&gt;
    &lt;path class=&quot;ln&quot; d=&quot;M330 150H360M510 150H560M560 150V70H600M560 150V230H600&quot;/&gt;
    &lt;text class=&quot;s yes&quot; x=&quot;566&quot; y=&quot;62&quot;&gt;SÌ&lt;/text&gt;&lt;text class=&quot;s noo&quot; x=&quot;566&quot; y=&quot;248&quot;&gt;NO&lt;/text&gt;
    &lt;rect class=&quot;box&quot; x=&quot;600&quot; y=&quot;30&quot; width=&quot;250&quot; height=&quot;80&quot; rx=&quot;10&quot; style=&quot;stroke:var(--ok)&quot;/&gt;&lt;text x=&quot;615&quot; y=&quot;58&quot; style=&quot;font-weight:600&quot;&gt;OVER TIME&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;615&quot; y=&quot;78&quot;&gt;ricavo lungo il tempo, misurando&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;615&quot; y=&quot;94&quot;&gt;il progresso (par. 39-45)&lt;/text&gt;
    &lt;rect class=&quot;box&quot; x=&quot;600&quot; y=&quot;190&quot; width=&quot;250&quot; height=&quot;80&quot; rx=&quot;10&quot; style=&quot;stroke:var(--no)&quot;/&gt;&lt;text x=&quot;615&quot; y=&quot;218&quot; style=&quot;font-weight:600&quot;&gt;AT A POINT IN TIME&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;615&quot; y=&quot;238&quot;&gt;ricavo al passaggio del control,&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;615&quot; y=&quot;254&quot;&gt;guardando gli indicatori del 15.38&lt;/text&gt;
  &lt;/svg&gt;
  &lt;p class=&quot;note&quot;&gt;Nota: nella slide 19 il terzo criterio è etichettato di nuovo “(a)” per un refuso; nello standard è il criterio &lt;b&gt;(c)&lt;/b&gt;.&lt;/p&gt;

  &lt;h3&gt;Classifica tu&lt;/h3&gt;
  &lt;div id=&quot;otBtns&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;out&quot; id=&quot;otOut&quot; aria-live=&quot;polite&quot;&gt;Scegli una situazione.&lt;/div&gt;

  &lt;h3&gt;Indicatori del passaggio di control at a point in time (15.38)&lt;/h3&gt;
  &lt;p&gt;Se la PO non è over time, il momento si individua con i requisiti di control (par. 31-34) e con indicatori non esaustivi: &lt;span class=&quot;src&quot;&gt;slide 20-24&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Indicatori del control&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;in1&quot;&gt;a · Right to payment&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;in2&quot;&gt;b · Legal title&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;in3&quot;&gt;c · Physical possession&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;in4&quot;&gt;d · Risks &amp;amp; rewards&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;in5&quot;&gt;e · Acceptance&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;in1&quot;&gt;&lt;b&gt;Present right to payment.&lt;/b&gt; Se il cliente è già obbligato a pagare, può indicare che ha ottenuto la capacità di dirigere l&#x27;uso e trarre i benefici dell&#x27;asset.&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;in2&quot; hidden&gt;&lt;b&gt;Legal title&lt;/b&gt; (titolo di proprietà). Il trasferimento della proprietà giuridica può indicare il control. Se il venditore trattiene il titolo &lt;b&gt;solo a garanzia&lt;/b&gt; del pagamento (es. riserva di proprietà), questo non impedisce al cliente di ottenere il control.&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;in3&quot; hidden&gt;&lt;b&gt;Physical possession&lt;/b&gt; (possesso fisico). Indizio forte ma non decisivo. Nei &lt;i&gt;repurchase agreements&lt;/i&gt; (patti di riacquisto) e nei &lt;i&gt;consignment arrangements&lt;/i&gt; (conto deposito) il cliente/consegnatario può avere il bene che però resta controllato dall&#x27;impresa. Al contrario nel &lt;i&gt;bill-and-hold&lt;/i&gt; (fatturo ma tengo in magazzino) l&#x27;impresa ha il bene che il cliente controlla già. Guida: B64-B76, B77-B78, B79-B82.&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;in4&quot; hidden&gt;&lt;b&gt;Significant risks and rewards of ownership&lt;/b&gt; (rischi e benefici significativi della proprietà). Indicatore e non più criterio decisivo, come era nel vecchio IAS 18. Vanno esclusi i rischi che danno origine a una PO separata: es. il control del macchinario è passato ma resta da fare la manutenzione promessa.&lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; id=&quot;in5&quot; hidden&gt;&lt;b&gt;Customer acceptance&lt;/b&gt; (accettazione). L&#x27;accettazione del cliente può indicare il control; per le clausole contrattuali di accettazione si veda B83-B86.&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Over time vs point in time: il profilo dei ricavi&lt;/h3&gt;
  &lt;p&gt;Contratto da € 800.000, consegna alla fine dell&#x27;8° trimestre. Sposta il cursore per vedere i ricavi cumulati riconosciuti nei due modelli.&lt;/p&gt;
  &lt;div class=&quot;card&quot; id=&quot;tchart&quot;&gt;
    &lt;svg class=&quot;fig&quot; viewBox=&quot;0 0 600 250&quot; role=&quot;img&quot; aria-label=&quot;Grafico ricavi cumulati&quot;&gt;
      &lt;path class=&quot;ln&quot; d=&quot;M50 220H580M50 220V30&quot;/&gt;
      &lt;text class=&quot;s&quot; x=&quot;10&quot; y=&quot;44&quot;&gt;100%&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;18&quot; y=&quot;134&quot;&gt;50%&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;26&quot; y=&quot;224&quot;&gt;0&lt;/text&gt;
      &lt;path d=&quot;M50 130H570M50 40H570&quot; style=&quot;stroke:var(--rule);stroke-dasharray:3 4&quot;/&gt;
      &lt;g class=&quot;s&quot;&gt;&lt;text x=&quot;50&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot;&gt;T0&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot;&gt;T2&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot;&gt;T4&lt;/text&gt;&lt;text x=&quot;440&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot;&gt;T6&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot;&gt;T8&lt;/text&gt;&lt;/g&gt;
      &lt;path id=&quot;otPath&quot; style=&quot;fill:none;stroke:var(--slate);stroke-width:3&quot;/&gt;
      &lt;path d=&quot;M50 220H570V40&quot; style=&quot;fill:none;stroke:var(--brick);stroke-width:3;stroke-dasharray:7 5&quot;/&gt;
      &lt;line id=&quot;mk&quot; y1=&quot;30&quot; y2=&quot;220&quot; style=&quot;stroke:var(--ink);stroke-width:1;opacity:.5&quot;/&gt;
      &lt;circle id=&quot;d1&quot; r=&quot;6&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;circle id=&quot;d2&quot; r=&quot;6&quot; style=&quot;fill:var(--brick)&quot;/&gt;
      &lt;text x=&quot;360&quot; y=&quot;60&quot; style=&quot;fill:var(--slate);font-weight:600&quot;&gt;over time (input method)&lt;/text&gt;
      &lt;text x=&quot;360&quot; y=&quot;200&quot; style=&quot;fill:var(--brick);font-weight:600&quot;&gt;point in time&lt;/text&gt;
    &lt;/svg&gt;
    &lt;label class=&quot;rng&quot;&gt;Trimestre &lt;input type=&quot;range&quot; id=&quot;tq&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;1&quot; value=&quot;3&quot; data-fmt=&quot;n&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;out&quot; id=&quot;tOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Misurare il progresso (par. 39-43)&lt;/h3&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Obiettivo e regole&lt;/h4&gt;&lt;ul&gt;
      &lt;li&gt;Rappresentare la prestazione nel trasferire il control (15.39).&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Un solo metodo&lt;/b&gt; per ciascuna PO, applicato coerentemente a PO simili; &lt;b&gt;rimisurato a ogni chiusura&lt;/b&gt; (15.40).&lt;/li&gt;
      &lt;li&gt;Si sceglie considerando la &lt;b&gt;natura&lt;/b&gt; del bene/servizio (15.41).&lt;/li&gt;
      &lt;li&gt;Si escludono i beni/servizi il cui control &lt;b&gt;non&lt;/b&gt; passa al cliente; si includono quelli che passano (15.42).&lt;/li&gt;
      &lt;li&gt;Le revisioni della misura sono un &lt;b&gt;change in accounting estimate&lt;/b&gt; secondo IAS 8, quindi con effetto prospettico (15.43).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Output vs input methods (B14-B19)&lt;/h4&gt;
      &lt;p&gt;&lt;b&gt;Output methods&lt;/b&gt;: misurano il valore trasferito al cliente.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Input methods&lt;/b&gt;: misurano gli sforzi dell&#x27;impresa rispetto al totale previsto.&lt;/p&gt;
      &lt;div class=&quot;ext&quot; style=&quot;margin:6px 0 0&quot;&gt;Esempi dallo standard: output = rilievi della prestazione completata, &lt;i&gt;milestones&lt;/i&gt; raggiunte, unità prodotte o consegnate; input = risorse consumate, ore di lavoro, costi sostenuti (&lt;i&gt;cost-to-cost&lt;/i&gt;), ore macchina. — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 su ifrs.org&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Calcolatore cost-to-cost con cambio di stima&lt;/h3&gt;
  &lt;p class=&quot;note&quot;&gt;Progresso = costi sostenuti cumulati / costi totali stimati. Ricavi cumulati = progresso × prezzo. Il ricavo dell&#x27;anno è la differenza tra cumulati (&lt;i&gt;cumulative catch-up&lt;/i&gt;).&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;label class=&quot;rng&quot;&gt;Prezzo del contratto &lt;input type=&quot;range&quot; id=&quot;cp&quot; min=&quot;5000&quot; max=&quot;20000&quot; step=&quot;500&quot; value=&quot;10000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Anno 1 · costi totali stimati &lt;input type=&quot;range&quot; id=&quot;ce1&quot; min=&quot;1000&quot; max=&quot;20000&quot; step=&quot;500&quot; value=&quot;8000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Anno 1 · costi sostenuti &lt;input type=&quot;range&quot; id=&quot;c1&quot; min=&quot;0&quot; max=&quot;20000&quot; step=&quot;250&quot; value=&quot;2000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;bar&quot;&gt;&lt;span id=&quot;ccBar1&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;label class=&quot;rng&quot;&gt;Anno 2 · costi totali stimati (rivisti) &lt;input type=&quot;range&quot; id=&quot;ce2&quot; min=&quot;1000&quot; max=&quot;25000&quot; step=&quot;500&quot; value=&quot;10000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Anno 2 · costi cumulati &lt;input type=&quot;range&quot; id=&quot;c2&quot; min=&quot;0&quot; max=&quot;25000&quot; step=&quot;250&quot; value=&quot;6000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;bar&quot;&gt;&lt;span id=&quot;ccBar2&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;out&quot; id=&quot;ccOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;Se i costi stimati superano il prezzo, il contratto è &lt;i&gt;onerous&lt;/i&gt; (in perdita): IFRS 15 non tratta la perdita attesa, che segue IAS 37 &lt;i&gt;Provisions&lt;/i&gt;. — &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-37-provisions-contingent-liabilities-and-contingent-assets.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org · IAS 37&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Quale regola “residuale” lega over time e point in time?&lt;/summary&gt;&lt;div&gt;Se una PO non è soddisfatta over time (nessuno dei tre criteri del 15.35), è soddisfatta at a point in time (15.32).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Il venditore trattiene la proprietà fino al pagamento, ma il cliente usa già il bene. Chi ha il control?&lt;/summary&gt;&lt;div&gt;Probabilmente il cliente: il titolo trattenuto solo a protezione del credito non impedisce il passaggio del control (15.38b).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Bill-and-hold: il bene è ancora nel magazzino del venditore. Si può riconoscere il ricavo?&lt;/summary&gt;&lt;div&gt;Sì, se il cliente ne ha già il control: possesso fisico e control possono non coincidere (15.38c, B79-B82).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. A fine anno 2 la stima dei costi totali cresce: si riaprono i conti dell&#x27;anno 1?&lt;/summary&gt;&lt;div&gt;No: è un cambiamento di stima (IAS 8), si rileva prospetticamente aggiornando i ricavi cumulati nell&#x27;anno in corso (15.43).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;5. Perché i rischi e benefici sono solo un indicatore?&lt;/summary&gt;&lt;div&gt;Perché IFRS 15 si basa sul control; i risks &amp; rewards sono uno dei cinque indizi e vanno esclusi quelli che generano una PO separata (15.38d).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ CONTRACT COSTS ============ --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s-costi&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Parte 8 · par. 91-104&lt;/span&gt;
  &lt;h2&gt;Contract costs: quando un costo diventa un&#x27;attività&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;IFRS 15 non parla solo di ricavi: dice anche quando i costi legati al contratto si &lt;b&gt;capitalizzano&lt;/b&gt; (si iscrivono come attività) per poi andare a conto economico insieme ai ricavi che generano. &lt;span class=&quot;src&quot;&gt;Slide 42-46&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Incremental costs of obtaining a contract (15.91)&lt;/h4&gt;
      Costi &lt;b&gt;incrementali&lt;/b&gt; per ottenere il contratto (che non si sarebbero sostenuti senza di esso, es. la provvigione al venditore pagata solo se il cliente firma): si iscrivono come attività &lt;b&gt;se l&#x27;impresa prevede di recuperarli&lt;/b&gt;.
      &lt;div class=&quot;ext&quot; style=&quot;margin-bottom:0&quot;&gt;I costi sostenuti comunque, anche se il contratto non si firma (es. spese legali di trattativa), sono costi d&#x27;esercizio salvo che siano esplicitamente addebitabili al cliente (15.92). Practical expedient (15.94): se il periodo di ammortamento sarebbe ≤ 1 anno, si possono spesare subito. — &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs15.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 15 su ifrs.org&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Costs to fulfil a contract (15.95)&lt;/h4&gt;
      Se non rientrano in un altro standard (IAS 2 &lt;i&gt;Inventories&lt;/i&gt;, IAS 16 &lt;i&gt;Property, Plant and Equipment&lt;/i&gt;, IAS 38 &lt;i&gt;Intangible Assets&lt;/i&gt;), si capitalizzano solo se &lt;b&gt;tutti&lt;/b&gt;:
      &lt;ol class=&quot;alpha&quot;&gt;&lt;li&gt;riguardano &lt;b&gt;direttamente&lt;/b&gt; un contratto, anche anticipato e specificamente identificabile (es. rinnovo, progettazione per un contratto non ancora approvato);&lt;/li&gt;&lt;li&gt;&lt;b&gt;generano o migliorano risorse&lt;/b&gt; che serviranno a soddisfare PO future;&lt;/li&gt;&lt;li&gt;si prevede di &lt;b&gt;recuperarli&lt;/b&gt;.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Costi diretti (15.97)&lt;/h4&gt;&lt;ol class=&quot;alpha&quot;&gt;&lt;li&gt;direct labour (salari di chi presta il servizio);&lt;/li&gt;&lt;li&gt;direct materials;&lt;/li&gt;&lt;li&gt;allocazioni di costi direttamente legati al contratto (gestione e supervisione, assicurazioni, ammortamento di attrezzature e &lt;i&gt;right-of-use assets&lt;/i&gt;);&lt;/li&gt;&lt;li&gt;costi esplicitamente addebitabili al cliente;&lt;/li&gt;&lt;li&gt;altri costi sostenuti solo perché si è firmato il contratto (es. subappaltatori).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Sempre a costo quando sostenuti (15.98)&lt;/h4&gt;&lt;ol class=&quot;alpha&quot;&gt;&lt;li&gt;costi generali e amministrativi (salvo addebitabili al cliente → par. 97);&lt;/li&gt;&lt;li&gt;sprechi di materiali, lavoro o altre risorse non riflessi nel prezzo;&lt;/li&gt;&lt;li&gt;costi legati a PO già (in parte) soddisfatte, cioè a prestazioni passate;&lt;/li&gt;&lt;li&gt;costi che non si riesce ad attribuire a PO soddisfatte o non soddisfatte.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Gioco: attività o costo?&lt;/h3&gt;
  &lt;div class=&quot;card sorter&quot;&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;A&quot; data-why=&quot;Costo incrementale per ottenere il contratto, recuperabile (15.91).&quot;&gt;&lt;span&gt;Provvigione del 5% al commerciale, dovuta solo a firma del contratto&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;b&quot; data-v=&quot;A&quot;&gt;Attività&lt;/button&gt;&lt;button class=&quot;b&quot; data-v=&quot;E&quot;&gt;Costo&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot; hidden&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;E&quot; data-why=&quot;Sostenuto a prescindere dalla firma: non è incrementale (15.92, fonte esterna).&quot;&gt;&lt;span&gt;Parcella dell&#x27;avvocato per la trattativa, dovuta anche se il cliente non firma&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;b&quot; data-v=&quot;A&quot;&gt;Attività&lt;/button&gt;&lt;button class=&quot;b&quot; data-v=&quot;E&quot;&gt;Costo&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot; hidden&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;A&quot; data-why=&quot;Costo per adempiere relativo a un contratto anticipato specifico, che crea risorse per PO future (15.95a).&quot;&gt;&lt;span&gt;Progettazione di un impianto per un contratto specifico non ancora approvato&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;b&quot; data-v=&quot;A&quot;&gt;Attività&lt;/button&gt;&lt;button class=&quot;b&quot; data-v=&quot;E&quot;&gt;Costo&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot; hidden&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;E&quot; data-why=&quot;Costi generali e amministrativi non addebitabili al cliente (15.98a).&quot;&gt;&lt;span&gt;Quota dell&#x27;affitto della sede direzionale&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;b&quot; data-v=&quot;A&quot;&gt;Attività&lt;/button&gt;&lt;button class=&quot;b&quot; data-v=&quot;E&quot;&gt;Costo&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot; hidden&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;E&quot; data-why=&quot;Spreco non riflesso nel prezzo (15.98b).&quot;&gt;&lt;span&gt;Materiali buttati per un errore di produzione&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;b&quot; data-v=&quot;A&quot;&gt;Attività&lt;/button&gt;&lt;button class=&quot;b&quot; data-v=&quot;E&quot;&gt;Costo&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot; hidden&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot; data-a=&quot;E&quot; data-why=&quot;Si riferisce a prestazioni già rese, cioè a PO soddisfatte (15.98c).&quot;&gt;&lt;span&gt;Stipendi dei tecnici per il servizio già erogato nel mese&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;b&quot; data-v=&quot;A&quot;&gt;Attività&lt;/button&gt;&lt;button class=&quot;b&quot; data-v=&quot;E&quot;&gt;Costo&lt;/button&gt;&lt;/span&gt;&lt;div class=&quot;fb&quot; hidden&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Amortisation e impairment (par. 99-104)&lt;/h3&gt;
  &lt;p&gt;L&#x27;attività da costi capitalizzati si &lt;b&gt;ammortizza sistematicamente&lt;/b&gt; in coerenza con il trasferimento dei beni/servizi a cui si riferisce, anche per contratti anticipati (15.99). Se cambia in modo significativo la tempistica attesa, si aggiorna l&#x27;ammortamento come cambio di stima IAS 8 (15.100). &lt;span class=&quot;src&quot;&gt;Slide 46&lt;/span&gt;&lt;/p&gt;
  &lt;p class=&quot;quote&quot; style=&quot;text-align:center&quot;&gt;Impairment loss = max { 0 ; Valore contabile − (Corrispettivo residuo atteso − Costi diretti ancora da spesare) }&lt;span class=&quot;src&quot;&gt;IFRS 15.101&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;label class=&quot;rng&quot;&gt;Valore contabile dell&#x27;attività &lt;input type=&quot;range&quot; id=&quot;iCA&quot; min=&quot;0&quot; max=&quot;10000&quot; step=&quot;250&quot; value=&quot;4000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Corrispettivo residuo atteso &lt;input type=&quot;range&quot; id=&quot;iR&quot; min=&quot;0&quot; max=&quot;20000&quot; step=&quot;250&quot; value=&quot;9000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;label class=&quot;rng&quot;&gt;Costi diretti non ancora spesati &lt;input type=&quot;range&quot; id=&quot;iC&quot; min=&quot;0&quot; max=&quot;20000&quot; step=&quot;250&quot; value=&quot;6000&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/label&gt;
    &lt;div class=&quot;out&quot; id=&quot;iOut&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Qual è il test chiave per capitalizzare un costo per ottenere il contratto?&lt;/summary&gt;&lt;div&gt;Deve essere incrementale (non sostenuto senza il contratto) e recuperabile (15.91).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. I costi per adempiere già coperti da IAS 2 seguono IFRS 15.95?&lt;/summary&gt;&lt;div&gt;No: IFRS 15.95 si applica solo se i costi non rientrano in un altro standard (IAS 2, IAS 16, IAS 38…).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Come si ammortizza l&#x27;attività da costi contrattuali?&lt;/summary&gt;&lt;div&gt;Su base sistematica coerente con il trasferimento al cliente dei beni/servizi correlati (15.99).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ PRESENTATION ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s-present&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Parte 9 · par. 105-109&lt;/span&gt;
  &lt;h2&gt;Presentation: contract asset, contract liability, receivable&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Quando una delle parti ha adempiuto, il contratto si presenta in stato patrimoniale come &lt;b&gt;contract asset&lt;/b&gt; o &lt;b&gt;contract liability&lt;/b&gt;, a seconda di chi ha “fatto prima”: l&#x27;impresa con la prestazione o il cliente con il pagamento. I diritti &lt;b&gt;incondizionati&lt;/b&gt; vanno a parte come &lt;b&gt;receivable&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;Slide 47-49&lt;/span&gt;&lt;/p&gt;
  &lt;svg class=&quot;fig&quot; viewBox=&quot;0 0 860 210&quot; role=&quot;img&quot; aria-label=&quot;Chi adempie per primo&quot;&gt;
    &lt;rect class=&quot;fillc&quot; x=&quot;10&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;170&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;25&quot; y=&quot;48&quot; style=&quot;font-weight:600&quot;&gt;Paga prima il cliente&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;25&quot; y=&quot;72&quot;&gt;(o il pagamento è dovuto, se prima)&lt;/text&gt;&lt;text x=&quot;25&quot; y=&quot;110&quot; style=&quot;font-weight:600;fill:var(--brick)&quot;&gt;CONTRACT LIABILITY&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;25&quot; y=&quot;134&quot;&gt;obbligo di trasferire beni/servizi&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;25&quot; y=&quot;152&quot;&gt;per cui si è già incassato (15.106)&lt;/text&gt;
    &lt;rect class=&quot;fillc&quot; x=&quot;295&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;170&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;310&quot; y=&quot;48&quot; style=&quot;font-weight:600&quot;&gt;Adempie prima l&#x27;impresa&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;310&quot; y=&quot;72&quot;&gt;diritto ancora condizionato&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;110&quot; style=&quot;font-weight:600;fill:var(--slate)&quot;&gt;CONTRACT ASSET&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;310&quot; y=&quot;134&quot;&gt;impairment come attività IFRS 9&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;310&quot; y=&quot;152&quot;&gt;(15.107)&lt;/text&gt;
    &lt;rect class=&quot;fillc&quot; x=&quot;580&quot; y=&quot;20&quot; width=&quot;270&quot; height=&quot;170&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;595&quot; y=&quot;48&quot; style=&quot;font-weight:600&quot;&gt;Manca solo il tempo&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;595&quot; y=&quot;72&quot;&gt;diritto incondizionato&lt;/text&gt;&lt;text x=&quot;595&quot; y=&quot;110&quot; style=&quot;font-weight:600;fill:var(--sage)&quot;&gt;RECEIVABLE&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;595&quot; y=&quot;134&quot;&gt;contabilizzato secondo IFRS 9&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;595&quot; y=&quot;152&quot;&gt;anche se soggetto a futuro rimborso&lt;/text&gt;
  &lt;/svg&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;Receivable (15.108):&lt;/b&gt; diritto incondizionato = serve solo il passare del tempo. Alla rilevazione iniziale, la differenza tra il credito misurato secondo IFRS 9 e il ricavo rilevato è un &lt;b&gt;costo&lt;/b&gt; (es. impairment loss).&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Contract asset:&lt;/b&gt; impairment misurato, presentato e informato come per le attività finanziarie IFRS 9 (vedi 113b).&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h3&gt;Passo per passo: due scenari&lt;/h3&gt;
  &lt;div class=&quot;steps card&quot;&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;Scenario A · 1 gennaio — anticipo del cliente&lt;/h4&gt;&lt;p&gt;Contratto di € 1.000 per un bene da consegnare il 31 marzo; il cliente paga in anticipo il 1° gennaio.&lt;/p&gt;&lt;div class=&quot;je&quot;&gt;Dr Cassa                1.000
   Cr Contract liability       1.000&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;Scenario A · 31 marzo — consegna&lt;/h4&gt;&lt;p&gt;Il control passa: la passività si estingue con la prestazione.&lt;/p&gt;&lt;div class=&quot;je&quot;&gt;Dr Contract liability   1.000
   Cr Revenue                  1.000&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;Scenario B · consegna del prodotto X&lt;/h4&gt;&lt;p&gt;Contratto: X (allocati € 400) e Y (€ 600), prezzo € 1.000 pagabile &lt;b&gt;solo dopo la consegna di entrambi&lt;/b&gt;. Consegno X: ho diritto a un corrispettivo, ma &lt;b&gt;condizionato&lt;/b&gt; alla consegna di Y.&lt;/p&gt;&lt;div class=&quot;je&quot;&gt;Dr Contract asset         400
   Cr Revenue                    400&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;Scenario B · consegna del prodotto Y&lt;/h4&gt;&lt;p&gt;Ora il diritto è incondizionato per l&#x27;intero importo: il contract asset si trasforma in receivable.&lt;/p&gt;&lt;div class=&quot;je&quot;&gt;Dr Receivable           1.000
   Cr Contract asset             400
   Cr Revenue                    600&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;st&quot;&gt;&lt;h4&gt;Scenario B · incasso&lt;/h4&gt;&lt;div class=&quot;je&quot;&gt;Dr Cassa                1.000
   Cr Receivable               1.000&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Esempio costruito per la didattica sulla base dei par. 105-108.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;stepnav&quot;&gt;&lt;button class=&quot;b prev&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;b next&quot;&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;cnt note&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Quando si rileva la contract liability se il pagamento è dovuto il 10 e incassato il 20?&lt;/summary&gt;&lt;div&gt;Il 10: quando il pagamento è dovuto o effettuato, se prima (15.106).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Contract asset e receivable: qual è la differenza?&lt;/summary&gt;&lt;div&gt;Il contract asset è un diritto condizionato a qualcosa di diverso dal tempo (es. una prestazione futura); il receivable è incondizionato.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Quale standard governa l&#x27;impairment di contract asset e crediti?&lt;/summary&gt;&lt;div&gt;IFRS 9 (15.107-108).&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ DISCLOSURE ============ --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s-disclo&quot;&gt;
  &lt;span class=&quot;tag&quot;&gt;Parte 10 · par. 110-128&lt;/span&gt;
  &lt;h2&gt;Disclosure: che cosa raccontare in nota&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Lo scopo riprende l&#x27;&lt;i&gt;objective&lt;/i&gt;: dare informazioni sufficienti per capire &lt;b&gt;natura, importo, tempistica e incertezza&lt;/b&gt; di ricavi e flussi di cassa. Servono informazioni qualitative e quantitative su tre blocchi (15.110). &lt;span class=&quot;src&quot;&gt;Slide 50-53&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;grid3&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;(a) Contratti con clienti&lt;/h4&gt;par. 113-122&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;(b) Judgements significativi&lt;/h4&gt;e loro cambiamenti nell&#x27;applicare lo standard · par. 123-126&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;(c) Attività da costi contrattuali&lt;/h4&gt;per ottenere o adempiere (par. 91, 95) · par. 127-128&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div role=&quot;tablist&quot; aria-label=&quot;Disclosure&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;ds1&quot;&gt;Importi (113)&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;ds2&quot;&gt;Disaggregation (114)&lt;/button&gt;
