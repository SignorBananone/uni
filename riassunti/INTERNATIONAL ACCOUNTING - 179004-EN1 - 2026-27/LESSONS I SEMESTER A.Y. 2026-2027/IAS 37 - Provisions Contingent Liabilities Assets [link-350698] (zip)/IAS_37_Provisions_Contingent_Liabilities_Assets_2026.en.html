    &lt;/svg&gt;
    &lt;/figure&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s4&quot;&gt;
    &lt;h3&gt;4 · Contingent liabilities and contingent assets &lt;span class=&quot;par&quot;&gt;paras 27–35&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h4 style=&quot;margin-top:0&quot;&gt;Contingent liabilities &lt;span class=&quot;small&quot;&gt;(paras 27–30)&lt;/span&gt;&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Not recognised&lt;/strong&gt; in the &lt;span class=&quot;t&quot;&gt;statement of financial position&lt;/span&gt;.&lt;/p&gt;
        &lt;ul class=&quot;tight&quot;&gt;
          &lt;li&gt;&lt;strong&gt;Possible obligation&lt;/strong&gt;: its existence depends on uncertain future events.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Present obligation&lt;/strong&gt;, but the outflow is not probable or the amount cannot be measured reliably.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Disclosure&lt;/strong&gt;: required unless the possibility of an outflow is &lt;em&gt;remote&lt;/em&gt;.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Reassessment&lt;/strong&gt;: if an outflow becomes probable, a provision is recognised &lt;em&gt;in that period&lt;/em&gt; (not retrospectively).&lt;/li&gt;
        &lt;/ul&gt;
        &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;“Not recognised” does not mean “not important”: contingent liabilities are crucial for understanding risk.&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h4 style=&quot;margin-top:0&quot;&gt;Contingent assets &lt;span class=&quot;small&quot;&gt;(paras 31–35)&lt;/span&gt;&lt;/h4&gt;
        &lt;figure class=&quot;fig&quot; style=&quot;margin:6px 0&quot;&gt;
        &lt;svg viewBox=&quot;0 0 360 120&quot; role=&quot;img&quot; aria-label=&quot;Contingent asset scale&quot;&gt;
          &lt;g font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;
          &lt;rect x=&quot;2&quot; y=&quot;10&quot; width=&quot;105&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;54&quot; y=&quot;35&quot; font-weight=&quot;700&quot;&gt;POSSIBLE&lt;/text&gt;&lt;text x=&quot;54&quot; y=&quot;52&quot;&gt;no recognition&lt;/text&gt;&lt;text x=&quot;54&quot; y=&quot;67&quot;&gt;no disclosure&lt;/text&gt;
          &lt;rect x=&quot;127&quot; y=&quot;10&quot; width=&quot;105&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot;/&gt;&lt;text x=&quot;179&quot; y=&quot;35&quot; font-weight=&quot;700&quot;&gt;PROBABLE&lt;/text&gt;&lt;text x=&quot;179&quot; y=&quot;52&quot;&gt;no recognition&lt;/text&gt;&lt;text x=&quot;179&quot; y=&quot;67&quot;&gt;disclose&lt;/text&gt;
          &lt;rect x=&quot;252&quot; y=&quot;10&quot; width=&quot;105&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;&lt;text x=&quot;304&quot; y=&quot;35&quot; font-weight=&quot;700&quot;&gt;VIRTUALLY&lt;/text&gt;&lt;text x=&quot;304&quot; y=&quot;50&quot; font-weight=&quot;700&quot;&gt;CERTAIN&lt;/text&gt;&lt;text x=&quot;304&quot; y=&quot;67&quot;&gt;recognise&lt;/text&gt;
          &lt;path d=&quot;M108,45 h17 M233,45 h17&quot; stroke=&quot;var(--soft)&quot; marker-end=&quot;url(#ar)&quot;/&gt;
          &lt;text x=&quot;180&quot; y=&quot;105&quot; fill=&quot;var(--soft)&quot; font-style=&quot;italic&quot;&gt;the more certain, the further it “leaves” the notes&lt;/text&gt;&lt;/g&gt;
        &lt;/svg&gt;&lt;/figure&gt;
        &lt;p&gt;When the inflow is &lt;span class=&quot;t&quot;&gt;virtually certain&lt;/span&gt;, the asset is &lt;strong&gt;no longer contingent&lt;/strong&gt; and the asset and related income are recognised.&lt;/p&gt;
        &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;The asymmetry is intentional: uncertain gains are not recognised until they are virtually certain. But &lt;span class=&quot;t&quot;&gt;prudence&lt;/span&gt; in IFRS does not mean systematic understatement: it means &lt;strong&gt;exercising caution under conditions of uncertainty&lt;/strong&gt;.&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;The IASB Conceptual Framework (2018) defines prudence precisely as “the exercise of caution” in support of &lt;em&gt;neutrality&lt;/em&gt;: it does not permit the understatement of assets or the overstatement of liabilities.&lt;/p&gt;

    &lt;h4&gt;Recognition map &lt;span class=&quot;small&quot;&gt;(paras 14, 27–35)&lt;/span&gt;&lt;/h4&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Situation&lt;/th&gt;&lt;th&gt;Statement of financial position&lt;/th&gt;&lt;th&gt;Notes&lt;/th&gt;&lt;th&gt;Key threshold&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Provision&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Recognise the liability&lt;/td&gt;&lt;td&gt;Movements and uncertainties&lt;/td&gt;&lt;td&gt;Present obligation + probable outflow + reliable estimate&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Contingent liability&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Do not recognise&lt;/td&gt;&lt;td&gt;Disclose unless remote&lt;/td&gt;&lt;td&gt;Possible obligation or outflow not probable&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Contingent asset&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Do not recognise&lt;/td&gt;&lt;td&gt;Disclose if inflow probable&lt;/td&gt;&lt;td&gt;Possible asset&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Asset no longer contingent&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Recognise asset / income&lt;/td&gt;&lt;td&gt;Ordinary IFRS disclosure&lt;/td&gt;&lt;td&gt;Inflow virtually certain&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Recognition and disclosure are two different questions: &lt;strong&gt;decide recognition first, then disclosure&lt;/strong&gt;.&lt;/div&gt;

    &lt;h4&gt;Mini-case: litigation &lt;span class=&quot;small&quot;&gt;(paras 14, 23, 40)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slides&lt;/span&gt;A company is sued for €1 million. External lawyers estimate a 45% probability of losing and 55% of winning. Present obligation? Assume yes. Probable outflow? No (45% &amp;lt; 50%). &lt;strong&gt;Conclusion: no provision; disclosure of a contingent liability unless the outflow is remote.&lt;/strong&gt;&lt;/p&gt;
    &lt;div class=&quot;lab&quot;&gt;
      &lt;h4&gt;Lab · change the lawyers’ opinion&lt;/h4&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;litP&quot;&gt;Probability of losing&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;litP&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;45&quot;&gt;&lt;output id=&quot;litPo&quot;&gt;45%&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;litA&quot;&gt;Amount claimed&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;litA&quot; min=&quot;100000&quot; max=&quot;3000000&quot; step=&quot;100000&quot; value=&quot;1000000&quot;&gt;&lt;output id=&quot;litAo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;result&quot; id=&quot;litR&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;If losing the case becomes probable, the measurement is &lt;strong&gt;not&lt;/strong&gt; “probability × amount”: for a single obligation the starting point is the &lt;em&gt;most likely outcome&lt;/em&gt; (para. 40). With a 60% probability of losing €1 million, the provision is close to €1 million, not €600,000 — see &lt;a href=&quot;#s5&quot;&gt;Part C&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part B&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. In December the board approves a major maintenance budget for next year. Provision at 31 December?&lt;/summary&gt;&lt;div&gt;No: it is a future action that the entity can still avoid. There is no present obligation arising from a past event.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. What does “probable” mean in IAS 37?&lt;/summary&gt;&lt;div&gt;&lt;em&gt;More likely than not&lt;/em&gt;: a probability of outflow above 50%.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. A company estimates a 70% chance of winning a lawsuit and receiving €500,000. What does it do?&lt;/summary&gt;&lt;div&gt;It is a contingent asset with a &lt;strong&gt;probable&lt;/strong&gt; inflow: not recognised, but disclosed in the notes. It would be recognised only if virtually certain.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. A contingent liability becomes probable in the following period. Are the prior-period financial statements reopened?&lt;/summary&gt;&lt;div&gt;No: the provision is recognised in the period in which the change in probability occurs (reassessment).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;5. The amount is highly uncertain (range 2–6 million). Can the provision be left unrecognised?&lt;/summary&gt;&lt;div&gt;Normally not: measurement uncertainty does not prevent recognition. The best estimate within the range is used; only in extremely rare cases does the entity move to disclosure.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;!-- ============ PARTE C ============ --&gt;
&lt;div class=&quot;part p-c&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;n&quot;&gt;C&lt;/span&gt;&lt;h2&gt;Measurement: how much is the provision?&lt;/h2&gt;&lt;/div&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s5&quot;&gt;
    &lt;h3&gt;5 · Best estimate, risks and discounting &lt;span class=&quot;par&quot;&gt;paras 36–52&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slides&lt;/span&gt;A provision is measured at the &lt;span class=&quot;t&quot;&gt;best estimate&lt;/span&gt; of the expenditure required to settle the present obligation &lt;strong&gt;at the reporting date&lt;/strong&gt;.&lt;/p&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;p style=&quot;margin:0;font-family:var(--serif);font-size:1.15rem&quot;&gt;Think of the amount the entity would &lt;em&gt;rationally&lt;/em&gt; pay to settle the obligation today, or to transfer it to a third party.&lt;/p&gt;&lt;/div&gt;
    &lt;ul class=&quot;tight&quot;&gt;
      &lt;li&gt;Management’s judgement is used, supported by experience, independent expert reports and &lt;strong&gt;events after the reporting period&lt;/strong&gt; that confirm conditions existing at the end of the period.&lt;/li&gt;
      &lt;li&gt;The aim is a &lt;strong&gt;realistic&lt;/strong&gt; estimate, not a deliberately conservative “cushion”.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;The link is to IAS 10: an event after the reporting date that provides evidence of conditions existing at 31 December (e.g. a judgment delivered in February on a case already pending) is an &lt;em&gt;adjusting event&lt;/em&gt; and updates the estimate.&lt;/p&gt;

    &lt;h4&gt;Many obligations vs a single one &lt;span class=&quot;small&quot;&gt;(paras 39–40)&lt;/span&gt;&lt;/h4&gt;
    &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-tabs&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-tab=&quot;m1&quot;&gt;Large population&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-tab=&quot;m2&quot;&gt;Single obligation&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; id=&quot;m1&quot;&gt;&lt;p&gt;The &lt;span class=&quot;t&quot;&gt;expected value&lt;/span&gt; is used: possible outcomes are weighted by their associated probabilities. Typical example: &lt;strong&gt;product warranties&lt;/strong&gt;.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;Expected value = Σ (probability&lt;sub&gt;i&lt;/sub&gt; × cost&lt;sub&gt;i&lt;/sub&gt;) × number of units&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; id=&quot;m2&quot; hidden&gt;&lt;p&gt;The &lt;span class=&quot;t&quot;&gt;most likely outcome&lt;/span&gt; may be the best estimate, but &lt;strong&gt;other possible outcomes must also be considered&lt;/strong&gt;. Typical example: &lt;strong&gt;a lawsuit&lt;/strong&gt;.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;If the other outcomes are mostly higher (or lower) than the most likely one, the best estimate shifts towards them. Example: repair of a plant, most likely outcome €1,000 but a real risk of having to redo the work → estimate &amp;gt; €1,000.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Same standard, different evidence: the &lt;span class=&quot;t&quot;&gt;unit of account&lt;/span&gt; changes the way uncertainty is translated into numbers.&lt;/div&gt;

    &lt;div class=&quot;lab&quot; id=&quot;warr&quot;&gt;
      &lt;h4&gt;Mini-case: warranty provision &lt;span class=&quot;small&quot;&gt;(paras 24, 39)&lt;/span&gt;&lt;/h4&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag sl&quot;&gt;slides&lt;/span&gt;1,000 products sold under warranty: 75% no defects (€0), 20% minor defects (€100), 5% major defects (€400). Move the sliders.&lt;/p&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;wN&quot;&gt;Products sold&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wN&quot; min=&quot;100&quot; max=&quot;5000&quot; step=&quot;100&quot; value=&quot;1000&quot;&gt;&lt;output id=&quot;wNo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;wP1&quot;&gt;% minor defects&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wP1&quot; min=&quot;0&quot; max=&quot;60&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;wP1o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;wC1&quot;&gt;Cost of minor defect&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wC1&quot; min=&quot;0&quot; max=&quot;300&quot; step=&quot;10&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;wC1o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;wP2&quot;&gt;% major defects&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wP2&quot; min=&quot;0&quot; max=&quot;30&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;wP2o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;wC2&quot;&gt;Cost of major defect&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wC2&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;20&quot; value=&quot;400&quot;&gt;&lt;output id=&quot;wC2o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 600 46&quot; id=&quot;wBar&quot; role=&quot;img&quot; aria-label=&quot;Probability breakdown&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;result&quot; id=&quot;wRes&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h4&gt;Risks and uncertainties &lt;span class=&quot;small&quot;&gt;(paras 42–44)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Risks and uncertainties are reflected in measurement, but uncertainty &lt;strong&gt;does not justify excessive provisions&lt;/strong&gt;.&lt;/p&gt;
    &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 700 120&quot; role=&quot;img&quot; aria-label=&quot;Balance between understatement and overstatement&quot;&gt;
      &lt;line x1=&quot;350&quot; y1=&quot;20&quot; x2=&quot;350&quot; y2=&quot;95&quot; stroke=&quot;var(--soft)&quot;/&gt;
      &lt;polygon points=&quot;335,100 365,100 350,85&quot; fill=&quot;var(--soft)&quot;/&gt;
      &lt;line x1=&quot;90&quot; y1=&quot;40&quot; x2=&quot;610&quot; y2=&quot;40&quot; stroke=&quot;var(--sla)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;rect x=&quot;40&quot; y=&quot;48&quot; width=&quot;230&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;
      &lt;text x=&quot;155&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;Avoid understatement&lt;/text&gt;
      &lt;text x=&quot;155&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--soft)&quot;&gt;do not ignore adverse outcomes&lt;/text&gt;
      &lt;rect x=&quot;430&quot; y=&quot;48&quot; width=&quot;230&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot;/&gt;
      &lt;text x=&quot;545&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;Avoid overstatement&lt;/text&gt;
      &lt;text x=&quot;545&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--soft)&quot;&gt;no hidden reserves&lt;/text&gt;
      &lt;text x=&quot;350&quot; y=&quot;14&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;var(--ink)&quot;&gt;neutral · evidence-based · transparent&lt;/text&gt;
    &lt;/svg&gt;&lt;/figure&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;&lt;em&gt;Hidden reserves&lt;/em&gt; are provisions inflated in good years and “released” in bad years to smooth profit: this is the &lt;em&gt;earnings management&lt;/em&gt; technique known as “cookie jar reserves”.&lt;/p&gt;

    &lt;h4&gt;Present value and discounting &lt;span class=&quot;small&quot;&gt;(paras 45–47, 60)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Where the effect of the &lt;span class=&quot;t&quot;&gt;time value of money&lt;/span&gt; is material, the provision is measured at its &lt;span class=&quot;t&quot;&gt;present value&lt;/span&gt;.&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Discount rate&lt;/h4&gt;&lt;p&gt;A &lt;strong&gt;pre-tax rate&lt;/strong&gt; that reflects current market assessments of the time value of money and the &lt;strong&gt;risks specific to the liability&lt;/strong&gt;, to the extent that they are not already reflected in the cash flows.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Subsequent periods&lt;/h4&gt;&lt;p&gt;The carrying amount &lt;strong&gt;increases with the passage of time&lt;/strong&gt;. The &lt;span class=&quot;t&quot;&gt;unwinding of the discount&lt;/span&gt; is recognised as a &lt;strong&gt;borrowing cost&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Do not count risk twice: either in the expected cash flows or in the rate — &lt;strong&gt;not in both&lt;/strong&gt;.&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;PV = C / (1 + r)&lt;sup&gt;n&lt;/sup&gt; &amp;nbsp;&amp;nbsp;·&amp;nbsp;&amp;nbsp; unwinding&lt;sub&gt;t&lt;/sub&gt; = PV&lt;sub&gt;t−1&lt;/sub&gt; × r&lt;/div&gt;

    &lt;div class=&quot;lab&quot; id=&quot;pv&quot;&gt;
      &lt;h4&gt;Lab · the provision that grows over time&lt;/h4&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pvC&quot;&gt;Future outflow (C)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pvC&quot; min=&quot;100000&quot; max=&quot;3000000&quot; step=&quot;50000&quot; value=&quot;1000000&quot;&gt;&lt;output id=&quot;pvCo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pvN&quot;&gt;Years to outflow (n)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pvN&quot; min=&quot;1&quot; max=&quot;20&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;pvNo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pvR&quot;&gt;Pre-tax rate (r)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pvR&quot; min=&quot;0&quot; max=&quot;12&quot; step=&quot;0.5&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;pvRo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 640 230&quot; id=&quot;pvChart&quot; role=&quot;img&quot; aria-label=&quot;Carrying amount of the provision by year&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;result&quot; id=&quot;pvRes&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;The bars show the provision balance at year-end; the dark portion is the unwinding for the year (Dr Finance cost / Cr Provision).&lt;/p&gt;
    &lt;/div&gt;

    &lt;h4&gt;Future events and expected disposals of assets &lt;span class=&quot;small&quot;&gt;(paras 48–52)&lt;/span&gt;&lt;/h4&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Future events&lt;/h4&gt;&lt;p&gt;Reflected in the estimate where there is &lt;strong&gt;sufficient objective evidence&lt;/strong&gt; that they will occur. E.g. an expected technological change that will reduce restoration costs.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Expected disposal gains&lt;/h4&gt;&lt;p&gt;The provision is &lt;strong&gt;not&lt;/strong&gt; reduced for gains expected from the disposal of assets. The disposal is accounted for under the relevant IFRS.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Estimate the obligation “for what it is”. Do not offset unrelated expected gains against the liability.&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s6&quot;&gt;
    &lt;h3&gt;6 · Reimbursements, review and use &lt;span class=&quot;par&quot;&gt;paras 53–62&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slides&lt;/span&gt;Sometimes a third party (typically an insurer or a supplier) will reimburse some or all of the expenditure.&lt;/p&gt;
    &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 720 110&quot; role=&quot;img&quot; aria-label=&quot;Reimbursement flow&quot;&gt;
      &lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;
      &lt;rect x=&quot;5&quot; y=&quot;15&quot; width=&quot;200&quot; height=&quot;74&quot; rx=&quot;12&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;45&quot; font-weight=&quot;700&quot;&gt;PROVISION&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;65&quot;&gt;for the full obligation&lt;/text&gt;
      &lt;rect x=&quot;255&quot; y=&quot;15&quot; width=&quot;220&quot; height=&quot;74&quot; rx=&quot;12&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;&lt;text x=&quot;365&quot; y=&quot;40&quot; font-weight=&quot;700&quot;&gt;REIMBURSEMENT ASSET&lt;/text&gt;&lt;text x=&quot;365&quot; y=&quot;58&quot;&gt;separate, only if&lt;/text&gt;&lt;text x=&quot;365&quot; y=&quot;75&quot;&gt;virtually certain&lt;/text&gt;
      &lt;rect x=&quot;525&quot; y=&quot;15&quot; width=&quot;190&quot; height=&quot;74&quot; rx=&quot;12&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;&lt;text x=&quot;620&quot; y=&quot;50&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;Asset ≤ Provision&lt;/text&gt;
      &lt;path d=&quot;M206,52 h46 M476,52 h46&quot; stroke=&quot;var(--soft)&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;/g&gt;
    &lt;/svg&gt;&lt;/figure&gt;
    &lt;p&gt;In the statement of financial position there is &lt;strong&gt;no offsetting&lt;/strong&gt; (gross liability + separate asset); in profit or loss the expense relating to the provision &lt;strong&gt;may&lt;/strong&gt; be presented net of the reimbursement.&lt;/p&gt;
    &lt;div class=&quot;lab&quot; id=&quot;reimb&quot;&gt;
      &lt;h4&gt;Lab · insurance policy&lt;/h4&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;rbP&quot;&gt;Provision (obligation)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rbP&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;500&quot;&gt;&lt;output id=&quot;rbPo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;rbR&quot;&gt;Expected reimbursement&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rbR&quot; min=&quot;0&quot; max=&quot;1200&quot; step=&quot;10&quot; value=&quot;300&quot;&gt;&lt;output id=&quot;rbRo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn on&quot; id=&quot;rbVC&quot; type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;Reimbursement virtually certain: yes&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;result&quot; id=&quot;rbRes&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h4&gt;Review and use of provisions &lt;span class=&quot;small&quot;&gt;(paras 59–62)&lt;/span&gt;&lt;/h4&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Review&lt;/h4&gt;&lt;p&gt;At each reporting date the provision is adjusted to reflect the current best estimate.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Reverse&lt;/h4&gt;&lt;p&gt;If an outflow is no longer probable, the provision is reversed (&lt;span class=&quot;t&quot;&gt;reversal&lt;/span&gt;, with income in profit or loss).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Use&lt;/h4&gt;&lt;p&gt;A provision is used &lt;strong&gt;only&lt;/strong&gt; for the expenditure for which it was originally recognised.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;A provision is a &lt;strong&gt;“living estimate”&lt;/strong&gt;: it changes with the evidence, but cannot be recycled to manage earnings.&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Example: why a provision cannot be “recycled”&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;A €40,000 warranty provision turns out to be excessive: only €25,000 is needed. The €15,000 excess cannot be used to pay an environmental fine that was not provided for (the cost of the fine would never appear in profit or loss). The €15,000 is reversed and the cost of the fine is recognised separately.&lt;/div&gt;&lt;/details&gt;
  &lt;/section&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part C&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Why is the expected value used for warranties and the most likely outcome for a lawsuit?&lt;/summary&gt;&lt;div&gt;With many similar obligations, the law of large numbers makes the weighted average a reliable estimate of the total. With a single obligation there will be only one outcome: the average may not correspond to any actual outcome, so the starting point is the most likely one, while considering the others.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Outflow of €500,000 in 4 years, pre-tax rate 6%. Initial amount and first-year unwinding?&lt;/summary&gt;&lt;div&gt;PV = 500,000 / 1.06⁴ ≈ &lt;strong&gt;€396,047&lt;/strong&gt;. Year-1 unwinding ≈ 396,047 × 6% ≈ &lt;strong&gt;€23,763&lt;/strong&gt;, recognised as a borrowing cost.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Risk is already included in the cash flows (weighted pessimistic scenarios). What rate do I use?&lt;/summary&gt;&lt;div&gt;A rate that does &lt;strong&gt;not&lt;/strong&gt; include that risk again (typically close to the risk-free rate): otherwise the risk would be counted twice.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Provision of €800, virtually certain insurance reimbursement of €900. How much is the asset?&lt;/summary&gt;&lt;div&gt;At most €800: the reimbursement asset cannot exceed the provision.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;5. Can a clean-up provision be reduced by the price expected from selling the land?&lt;/summary&gt;&lt;div&gt;No: gains expected from disposals do not reduce the provision; the sale follows the relevant IFRS.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;!-- ============ PARTE D ============ --&gt;
&lt;div class=&quot;part p-d&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;n&quot;&gt;D&lt;/span&gt;&lt;h2&gt;Applications, disclosure and developments&lt;/h2&gt;&lt;/div&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s7&quot;&gt;
    &lt;h3&gt;7 · Future losses, onerous contracts, restructuring &lt;span class=&quot;par&quot;&gt;paras 63–83&lt;/span&gt;&lt;/h3&gt;

    &lt;h4&gt;Future operating losses &lt;span class=&quot;small&quot;&gt;(paras 63–65)&lt;/span&gt;&lt;/h4&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;p style=&quot;margin:0;font-family:var(--serif);font-size:1.25rem;font-weight:600&quot;&gt;NO provision for future operating losses.&lt;/p&gt;&lt;/div&gt;
    &lt;p&gt;Why? Future losses, on their own, are not a present obligation arising from a past event: the entity could still change strategy or close down.&lt;/p&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Expected operating losses may, however, indicate that assets are &lt;strong&gt;impaired&lt;/strong&gt;: this points to &lt;strong&gt;IAS 36&lt;/strong&gt;, not to an IAS 37 provision.&lt;/div&gt;

    &lt;h4 id=&quot;onerous&quot; style=&quot;scroll-margin-top:60px&quot;&gt;Onerous contracts &lt;span class=&quot;small&quot;&gt;(paras 66–69, 68A)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;A contract is &lt;span class=&quot;t&quot;&gt;onerous&lt;/span&gt; when the &lt;strong&gt;unavoidable costs&lt;/strong&gt; of meeting its obligations exceed the &lt;strong&gt;economic benefits expected&lt;/strong&gt; under it. The present obligation is the contract itself (already signed).&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Least net cost of exit&lt;/h4&gt;&lt;p&gt;The &lt;strong&gt;lower&lt;/strong&gt; of:&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;the net cost of fulfilling the contract&lt;/li&gt;&lt;li&gt;any compensation or penalties arising from failure to fulfil it&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Cost of fulfilling (para. 68A)&lt;/h4&gt;&lt;p&gt;Comprises both:&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;&lt;strong&gt;incremental costs&lt;/strong&gt; (e.g. materials, direct labour)&lt;/li&gt;&lt;li&gt;&lt;strong&gt;an allocation of other costs that relate directly&lt;/strong&gt; to fulfilling contracts (e.g. a share of the depreciation of the equipment used)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;Para. 68A was introduced by the amendment “Onerous Contracts — Cost of Fulfilling a Contract” (2020), effective from 2022, to settle a debate: previously some entities included only incremental costs.&lt;/p&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Before a separate provision for an onerous contract is recognised, any &lt;strong&gt;impairment loss&lt;/strong&gt; on the assets used in fulfilling the contract is recognised.&lt;/div&gt;

    &lt;div class=&quot;lab&quot; id=&quot;oner&quot;&gt;
      &lt;h4&gt;Mini-case: onerous contract &lt;span class=&quot;small&quot;&gt;(slide 23)&lt;/span&gt;&lt;/h4&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag sl&quot;&gt;slides&lt;/span&gt;Fixed-price contract: revenue €500, estimated direct costs €560, exit penalty €40 → provision €40. Try changing the numbers.&lt;/p&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;onR&quot;&gt;Contract revenue&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;onR&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;500&quot;&gt;&lt;output id=&quot;onRo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;onC&quot;&gt;Costs of fulfilling&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;onC&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;560&quot;&gt;&lt;output id=&quot;onCo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;onP&quot;&gt;Exit penalty&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;onP&quot; min=&quot;0&quot; max=&quot;300&quot; step=&quot;5&quot; value=&quot;40&quot;&gt;&lt;output id=&quot;onPo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 600 120&quot; id=&quot;onChart&quot; role=&quot;img&quot; aria-label=&quot;Comparison between fulfilling and exiting&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;result&quot; id=&quot;onRes&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;The obligation is measured at the &lt;strong&gt;least net cost of exit&lt;/strong&gt;: this is why an onerous contract is not simply “expected loss = provision”.&lt;/div&gt;

    &lt;h4&gt;Restructuring: when does the provision arise? &lt;span class=&quot;small&quot;&gt;(paras 70–79)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;A &lt;span class=&quot;t&quot;&gt;restructuring&lt;/span&gt; is a programme that is planned and controlled by management and materially changes either the scope of a business or the manner in which it is conducted. &lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;Examples: sale or termination of a line of business, closure of business locations, elimination of a layer of management, fundamental reorganisations.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;A constructive obligation is required; a management plan alone is not enough.&lt;/strong&gt; Step through the stages:&lt;/p&gt;
    &lt;div class=&quot;lab stepper&quot;&gt;
      &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;steps&quot;&gt;
        &lt;div&gt;&lt;h4&gt;Step 1 · Detailed formal plan&lt;/h4&gt;&lt;p&gt;The plan identifies at least: the &lt;strong&gt;business&lt;/strong&gt; concerned, the &lt;strong&gt;locations&lt;/strong&gt;, the &lt;strong&gt;employees&lt;/strong&gt; (function and approximate number of employees to be compensated), the &lt;strong&gt;expenditure&lt;/strong&gt; to be incurred, and the &lt;strong&gt;timing&lt;/strong&gt; of implementation.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;With only the plan, we are still in the realm of intentions: &lt;em&gt;no provision&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h4&gt;Step 2 · Valid expectation&lt;/h4&gt;&lt;p&gt;A valid expectation is created in those affected because implementation &lt;strong&gt;has started&lt;/strong&gt; (e.g. dismantling plant, selling assets) &lt;strong&gt;or&lt;/strong&gt; its &lt;strong&gt;main features have been announced&lt;/strong&gt; to those affected by it.&lt;/p&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h4&gt;Step 3 · Provision recognised&lt;/h4&gt;&lt;p&gt;There is now a constructive obligation: the provision is recognised, provided the outflow is probable and can be estimated.&lt;/p&gt;&lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;A board decision before the reporting date is &lt;strong&gt;not enough&lt;/strong&gt; if those affected have not been given a valid expectation by the reporting date.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h4&gt;Restructuring: what to include? &lt;span class=&quot;small&quot;&gt;(paras 80–83)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;The provision covers the &lt;strong&gt;direct expenditures&lt;/strong&gt; necessarily entailed by the restructuring and &lt;strong&gt;not associated with the ongoing activities&lt;/strong&gt;. Classify the items:&lt;/p&gt;
    &lt;div class=&quot;lab sort&quot; id=&quot;sortR&quot;&gt;
      &lt;h4&gt;Include or exclude?&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li data-a=&quot;in&quot;&gt;&lt;span&gt;Termination benefits for redundant employees&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;in&quot;&gt;Include&lt;/button&gt; &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;out&quot;&gt;Exclude&lt;/button&gt; &lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
        &lt;li data-a=&quot;out&quot;&gt;&lt;span&gt;Retraining of continuing staff&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;in&quot;&gt;Include&lt;/button&gt; &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;out&quot;&gt;Exclude&lt;/button&gt; &lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
        &lt;li data-a=&quot;out&quot;&gt;&lt;span&gt;Relocating continuing staff&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;in&quot;&gt;Include&lt;/button&gt; &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;out&quot;&gt;Exclude&lt;/button&gt; &lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
        &lt;li data-a=&quot;in&quot;&gt;&lt;span&gt;Penalties for early termination of the lease on the closed site&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;in&quot;&gt;Include&lt;/button&gt; &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;out&quot;&gt;Exclude&lt;/button&gt; &lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
        &lt;li data-a=&quot;out&quot;&gt;&lt;span&gt;Marketing campaign for the new brand&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;in&quot;&gt;Include&lt;/button&gt; &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;out&quot;&gt;Exclude&lt;/button&gt; &lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
        &lt;li data-a=&quot;out&quot;&gt;&lt;span&gt;New information system and new distribution network&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;in&quot;&gt;Include&lt;/button&gt; &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;out&quot;&gt;Exclude&lt;/button&gt; &lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
        &lt;li data-a=&quot;out&quot;&gt;&lt;span&gt;Operating losses expected up to closure&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;in&quot;&gt;Include&lt;/button&gt; &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;out&quot;&gt;Exclude&lt;/button&gt; &lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;The “include” items in this exercise are examples of direct exit costs; the “exclude” items are those listed in the slides.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;The provision covers &lt;strong&gt;exiting the old activity&lt;/strong&gt;, not the cost of running the new one.&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s8&quot;&gt;
    &lt;h3&gt;8 · Environmental obligations, decommissioning and climate &lt;span class=&quot;par&quot;&gt;IAS 37 + IFRIC 1 · IFRIC AD 2024&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slides&lt;/span&gt;Typical pattern: an entity uses an asset today but will have to restore the site at the end of its useful life (oil platforms, power stations, quarries, landfills).&lt;/p&gt;
    &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 720 110&quot; role=&quot;img&quot; aria-label=&quot;Decommissioning flow&quot;&gt;
      &lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;
      &lt;rect x=&quot;5&quot; y=&quot;12&quot; width=&quot;210&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;38&quot; font-weight=&quot;700&quot;&gt;Past event&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;57&quot;&gt;construction / disturbance&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;74&quot;&gt;of the site creates the obligation&lt;/text&gt;
      &lt;rect x=&quot;260&quot; y=&quot;12&quot; width=&quot;210&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;&lt;text x=&quot;365&quot; y=&quot;38&quot; font-weight=&quot;700&quot;&gt;Provision&lt;/text&gt;&lt;text x=&quot;365&quot; y=&quot;57&quot;&gt;present value of the&lt;/text&gt;&lt;text x=&quot;365&quot; y=&quot;74&quot;&gt;restoration expenditure&lt;/text&gt;
      &lt;rect x=&quot;515&quot; y=&quot;12&quot; width=&quot;200&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;&lt;text x=&quot;615&quot; y=&quot;45&quot; font-weight=&quot;700&quot;&gt;Related asset&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;65&quot;&gt;IAS 16 (cost of the plant)&lt;/text&gt;
      &lt;path d=&quot;M216,52 h41 M471,52 h41&quot; stroke=&quot;var(--soft)&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;/g&gt;
    &lt;/svg&gt;&lt;/figure&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;&lt;strong&gt;IFRIC 1&lt;/strong&gt; deals with subsequent changes in decommissioning, restoration and similar liabilities. The accounting may also adjust the related asset, depending on the measurement model.&lt;/div&gt;

    &lt;p&gt;Follow a numerical example step by step &lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;(figures invented for illustration):&lt;/p&gt;
    &lt;div class=&quot;lab stepper&quot;&gt;
      &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;steps&quot;&gt;
        &lt;div&gt;&lt;h4&gt;1 Jan, year 1 · Initial recognition&lt;/h4&gt;&lt;p&gt;Plant constructed. Estimated restoration cost €1,000,000 in 10 years, rate 5%. PV = 1,000,000 / 1.05¹⁰ = &lt;strong&gt;€613,913&lt;/strong&gt;. The dismantling cost is included in the cost of the plant (IAS 16).&lt;/p&gt;&lt;div class=&quot;je&quot;&gt;Dr  Plant (PP&amp;amp;E)                   613,913
    Cr  Decommissioning provision      613,913&lt;/div&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h4&gt;31 Dec, year 1 · Unwinding and depreciation&lt;/h4&gt;&lt;p&gt;The provision increases by 613,913 × 5% = &lt;strong&gt;€30,696&lt;/strong&gt; (borrowing cost). The capitalised component is depreciated over 10 years: €61,391.&lt;/p&gt;&lt;div class=&quot;je&quot;&gt;Dr  Finance costs                   30,696
    Cr  Decommissioning provision       30,696
Dr  Depreciation expense            61,391
    Cr  Accumulated depreciation        61,391&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;Provision balance: €644,609 (= 1,000,000 / 1.05⁹).&lt;/p&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h4&gt;Start of year 2 · Change in estimate (IFRIC 1)&lt;/h4&gt;&lt;p&gt;New regulations: restoration will cost &lt;strong&gt;€1,200,000&lt;/strong&gt;. New PV with 9 years remaining: 1,200,000 / 1.05⁹ = €773,531. Increase: &lt;strong&gt;€128,922&lt;/strong&gt;.&lt;/p&gt;&lt;p&gt;Under the &lt;strong&gt;cost model&lt;/strong&gt; the change is added to (or deducted from) the cost of the asset and depreciated prospectively over its remaining useful life; it is not recognised immediately in profit or loss.&lt;/p&gt;&lt;div class=&quot;je&quot;&gt;Dr  Plant (PP&amp;amp;E)                   128,922
    Cr  Decommissioning provision      128,922&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;Under the &lt;em&gt;revaluation model&lt;/em&gt;, by contrast, the change goes through OCI and the revaluation surplus — &lt;a href=&quot;https://www.icaew.com/technical/corporate-reporting/ifrs/ifrs-standards/ifric-1-changes-in-existing-decommissioning-restoration&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW, IFRIC 1&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h4&gt;End of year 10 · Settlement&lt;/h4&gt;&lt;p&gt;Thanks to the annual unwinding, the provision has reached €1,200,000. The payment brings it to zero.&lt;/p&gt;&lt;div class=&quot;je&quot;&gt;Dr  Decommissioning provision    1,200,000
    Cr  Cash                         1,200,000&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;If the actual expenditure differs, the difference goes to profit or loss.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h4&gt;Climate-related commitments: a reasoning case &lt;span class=&quot;small&quot;&gt;(IFRIC Agenda Decision 2024)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;A public commitment to &lt;span class=&quot;t&quot;&gt;net-zero&lt;/span&gt; emissions or to &lt;span class=&quot;t&quot;&gt;emissions offset&lt;/span&gt; &lt;strong&gt;may&lt;/strong&gt; create a constructive obligation — but only if the facts create a valid expectation in other parties.&lt;/p&gt;
    &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 720 120&quot; role=&quot;img&quot; aria-label=&quot;Reasoning on climate commitments&quot;&gt;
      &lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;
      &lt;rect x=&quot;5&quot; y=&quot;12&quot; width=&quot;210&quot; height=&quot;84&quot; rx=&quot;12&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;40&quot; font-weight=&quot;700&quot;&gt;Public statement&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;60&quot;&gt;may create a&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;77&quot;&gt;constructive obligation&lt;/text&gt;
      &lt;rect x=&quot;260&quot; y=&quot;12&quot; width=&quot;210&quot; height=&quot;84&quot; rx=&quot;12&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;&lt;text x=&quot;365&quot; y=&quot;40&quot; font-weight=&quot;700&quot;&gt;But no past event&lt;/text&gt;&lt;text x=&quot;365&quot; y=&quot;60&quot;&gt;future operating actions&lt;/text&gt;&lt;text x=&quot;365&quot; y=&quot;77&quot;&gt;remain avoidable&lt;/text&gt;
      &lt;rect x=&quot;515&quot; y=&quot;12&quot; width=&quot;200&quot; height=&quot;84&quot; rx=&quot;12&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;&lt;text x=&quot;615&quot; y=&quot;40&quot; font-weight=&quot;700&quot;&gt;Past emissions&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;60&quot;&gt;may trigger&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;77&quot;&gt;a provision&lt;/text&gt;
      &lt;path d=&quot;M216,54 h41 M471,54 h41&quot; stroke=&quot;var(--soft)&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;/g&gt;
    &lt;/svg&gt;&lt;/figure&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;A commitment can be credible and yet &lt;strong&gt;fail the past-event test&lt;/strong&gt; at the date it is announced.&lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;In practice: the cost of &lt;em&gt;reducing&lt;/em&gt; future emissions (new plant, processes) is not a provision, because it is avoidable. If, however, the entity has committed to &lt;em&gt;offsetting&lt;/em&gt; its emissions and these have already occurred, each tonne emitted is an obligating event. &lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;The Committee concluded that IAS 37 provides an adequate basis and did not add a standard-setting project — &lt;a href=&quot;https://www.ifrs.org/projects/work-plan/climate-related-commitments-ias-37/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, Climate-related Commitments (IAS 37)&lt;/a&gt;.&lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s9&quot;&gt;
    &lt;h3&gt;9 · Disclosure and method &lt;span class=&quot;par&quot;&gt;paras 84–92&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;For each class of provision&lt;/h4&gt;&lt;ul class=&quot;tight&quot;&gt;
        &lt;li&gt;Carrying amount at the beginning and end of the period&lt;/li&gt;&lt;li&gt;Additional provisions, amounts used and reversals&lt;/li&gt;&lt;li&gt;Effect of unwinding and of changes in the discount rate&lt;/li&gt;&lt;li&gt;Nature of the obligation and expected timing&lt;/li&gt;&lt;li&gt;Uncertainties and major assumptions&lt;/li&gt;&lt;li&gt;Expected reimbursements&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Contingencies&lt;/h4&gt;&lt;ul class=&quot;tight&quot;&gt;
        &lt;li&gt;&lt;strong&gt;Contingent liabilities&lt;/strong&gt;: nature, estimated financial effect, uncertainties, possible reimbursements — unless the outflow is remote&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Contingent assets&lt;/strong&gt;: disclosure when the inflow is probable&lt;/li&gt;
        &lt;li&gt;In extremely rare cases, details that would be &lt;strong&gt;seriously prejudicial&lt;/strong&gt; (e.g. in an ongoing lawsuit) may be omitted, but the general nature of the dispute and the reason for the omission must be disclosed&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;Example of a provisions reconciliation in the notes (€ thousands):&lt;/p&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Movement&lt;/th&gt;&lt;th&gt;Warranties&lt;/th&gt;&lt;th&gt;Site restoration&lt;/th&gt;&lt;th&gt;Litigation&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Opening balance&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;td&gt;614&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;+ Additional provisions&lt;/td&gt;&lt;td&gt;40&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;300&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;− Amounts used&lt;/td&gt;&lt;td&gt;(35)&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;− Reversals&lt;/td&gt;&lt;td&gt;(10)&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;+ Unwinding&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;31&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Closing balance&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;115&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;645&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;300&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Disclosure is where IAS 37 turns uncertainty into decision-useful information for investors.&lt;/div&gt;

    &lt;h4 id=&quot;tre-domande&quot;&gt;Three questions to ask in class&lt;/h4&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;1. What happened before the reporting date?&lt;/h4&gt;&lt;p&gt;Identify the obligating event.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;2. Can the entity still avoid the outflow?&lt;/h4&gt;&lt;p&gt;Distinguish a present obligation from a future intention.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;3. How should uncertainty be reflected?&lt;/h4&gt;&lt;p&gt;Recognition threshold, probability, measurement and disclosure.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;According to the slides, these questions make the standard easier to teach than reading the paragraphs in sequence.&lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s10&quot;&gt;
    &lt;h3&gt;10 · Ongoing developments (not yet effective) &lt;span class=&quot;par&quot;&gt;IASB project – 2026&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slides&lt;/span&gt;IAS 37 is the subject of the IASB project &lt;strong&gt;“Provisions—Targeted Improvements”&lt;/strong&gt;. The existing standard remains in force.&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Recognition&lt;/h4&gt;&lt;p&gt;Clarify when a present obligation arises, including for &lt;span class=&quot;t&quot;&gt;levies&lt;/span&gt; and similar obligations.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Costs&lt;/h4&gt;&lt;p&gt;Clarify which costs to include in measuring certain obligations.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Discount rate&lt;/h4&gt;&lt;p&gt;Greater consistency in discounting long-term provisions.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;As of September 2026 these are proposals under review (&lt;em&gt;redeliberations&lt;/em&gt;), not requirements to be applied. The IASB work plan indicates final amendments as the next milestone.&lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;&lt;em&gt;Levies&lt;/em&gt; are charges imposed by governments other than income taxes (e.g. contributions to bank resolution funds); they are currently addressed by the interpretation IFRIC 21.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;The Exposure Draft was published on 12 November 2024 (comments due by 12 March 2025). According to the IASB update for the November 2026 CMAC meeting, the final amendments are now expected in the &lt;strong&gt;first half of 2027&lt;/strong&gt; — &lt;a href=&quot;https://www.ifrs.org/projects/work-plan/provisions/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, Provisions—Targeted Improvements&lt;/a&gt;; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/meetings/2026/november/cmac/ap1-iasb-update.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IASB Update, CMAC November 2026 (PDF)&lt;/a&gt;. Always check the current status on the project page.&lt;/p&gt;
  &lt;/section&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part D&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. A division will lose €2 million next year. Provision?&lt;/summary&gt;&lt;div&gt;No: no provision for future operating losses. Instead, assess whether the division’s assets are impaired under IAS 36.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Contract: revenue €300, costs of fulfilling €380, penalty €100. Provision?&lt;/summary&gt;&lt;div&gt;Loss if fulfilled: €80; penalty: €100. Least net cost = &lt;strong&gt;€80&lt;/strong&gt; (impairment of the dedicated assets is tested first).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. The board resolves to close a plant on 15 December; employees are informed on 10 January. Provision at 31 December?&lt;/summary&gt;&lt;div&gt;No: at the reporting date there is no valid expectation (neither implementation has started nor has an announcement been made). At most it is a non-adjusting event after the reporting period to be described in the notes.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Under the cost model, where does an increase in the estimate of a decommissioning provision go?&lt;/summary&gt;&lt;div&gt;It is added to the cost of the related asset (IFRIC 1) and depreciated over its remaining useful life.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;5. A company announces “net zero by 2040”. Must it recognise the cost of new clean plant today?&lt;/summary&gt;&lt;div&gt;No: even if the announcement may create a constructive obligation, those costs relate to avoidable future actions; there is no past event.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;6. Can all information about a lawsuit be omitted to avoid harming the entity’s position?&lt;/summary&gt;&lt;div&gt;Only in extremely rare cases may seriously prejudicial details be omitted, and the general nature of the dispute and the reason for the omission must still be disclosed.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;part&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;section class=&quot;topic&quot; id=&quot;approfondire&quot;&gt;
    &lt;h3 style=&quot;border-top-color:var(--acc)&quot;&gt;Further reading&lt;/h3&gt;
    &lt;p&gt;References cited in the slides (slide 34 and in the text). All descriptions and links below are &lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;: they come from web searches, not from the slides.&lt;/p&gt;
    &lt;div class=&quot;ext-list&quot;&gt;
      &lt;div&gt;&lt;h4&gt;IAS 37 — Provisions, Contingent Liabilities and Contingent Assets (IFRS Foundation)&lt;/h4&gt;
        &lt;p&gt;Official page of the standard: text, summary and supporting implementation material (illustrative examples, non-mandatory decision tree). &lt;span class=&quot;why&quot;&gt;It matters because it is the primary authoritative reference: the paragraph numbers in the slides refer to this text.&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-37-provisions-contingent-liabilities-and-contingent-assets.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IAS 37&lt;/a&gt; · summary and history: &lt;a href=&quot;https://www.iasplus.com/standard/ias37.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;Commission Regulation (EU) 2023/1803&lt;/h4&gt;
        &lt;p&gt;Regulation of 13 August 2023 adopting, in a single consolidated text, the international accounting standards in accordance with Regulation (EC) No 1606/2002; its annex also contains IAS 37. It has since been amended (e.g. Regulation (EU) 2026/338 for IFRS 18). &lt;span class=&quot;why&quot;&gt;It matters because in the EU IAS 37 applies in its endorsed version: the slides cite the consolidated text as at 8 March 2026.&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2023/1803/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex — Reg. (EU) 2023/1803&lt;/a&gt; · &lt;a href=&quot;https://www.efta.int/eea-lex/32023r1803&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EEA-Lex entry (EFTA)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;IFRS Interpretations Committee — Climate-related Commitments (IAS 37), Agenda Decision, April 2024&lt;/h4&gt;
        &lt;p&gt;The Committee examined when a public commitment to reduce or offset emissions gives rise to a provision; it concluded its work in March 2024 and the IASB did not object in April 2024. Conclusion: IAS 37 provides an adequate basis, no standard-setting project. &lt;span class=&quot;why&quot;&gt;It matters as an official example of applying the constructive obligation + past event test; agenda decisions are not mandatory but are highly persuasive in practice.&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/projects/work-plan/climate-related-commitments-ias-37/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — Climate-related Commitments project&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/news-and-events/updates/ifric/2024/ifric-update-march-2024/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRIC Update March 2024&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;IASB — Provisions—Targeted Improvements&lt;/h4&gt;
        &lt;p&gt;Maintenance project on IAS 37: Exposure Draft of 12 November 2024 covering three aspects (the present obligation requirement, costs to include, discount rate). In 2026 it is in the redeliberation phase; according to late-2026 documents, final amendments are expected in the first half of 2027. &lt;span class=&quot;why&quot;&gt;It matters because it will change some of the rules covered in class: for now the current text remains in force.&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/projects/work-plan/provisions/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — project page&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/news/2026/07/work-plan-analysis&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus — work plan analysis (June 2026)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;IFRIC 1 — Changes in Existing Decommissioning, Restoration and Similar Liabilities&lt;/h4&gt;
        &lt;p&gt;Interpretation issued in May 2004: it addresses changes in a decommissioning liability resulting from revisions to the timing/amount of costs or from changes in the market discount rate. Under the cost model the changes adjust the cost of the asset; under the revaluation model they go through OCI/revaluation surplus. &lt;span class=&quot;why&quot;&gt;It matters because it complements IAS 37 for decommissioning provisions, a very common exam topic.&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifric-1-changes-in-existing-decommissioning-restoration-and-similar-liabilities.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IFRIC 1&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/standards/ifric/ifric1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus — IFRIC 1&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;Related standards cited in the slides: IAS 36 and IAS 16&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;IAS 36 — Impairment of Assets&lt;/strong&gt;: prevents assets from being carried above their recoverable amount (the higher of fair value less costs of disposal and value in use); this is where future operating losses and the impairment test required before recognising an onerous contract provision belong. &lt;strong&gt;IAS 16 — Property, Plant and Equipment&lt;/strong&gt;: includes in initial cost the estimated costs of dismantling and restoration, measured in accordance with IAS 37. &lt;span class=&quot;why&quot;&gt;They matter because the slides refer to these standards at the boundaries of IAS 37.&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;external source&lt;/span&gt;&lt;a href=&quot;https://www.iasplus.com/standard/ias36.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus — IAS 36&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-36-impairment-of-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IAS 36&lt;/a&gt; · &lt;a href=&quot;https://www.crowe.com/vn/insights/ifrs-publication/capitalisation-of-decommissioning-and-restoration-obligations-under-ias-16&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Crowe — capitalisation of restoration costs under IAS 16&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;Links to other lectures: this page cites the standards the lecture refers to (IAS 16, IAS 36, IFRS 9, IFRS 15, IAS 19…). The other files in the &lt;code&gt;corso/&lt;/code&gt; folder were not consulted for this summary: for specific links to other lectures, refer to the course syllabus.&lt;/p&gt;
  &lt;/section&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;/main&gt;

&lt;script&gt;
(function(){
  var E=window.__eur;function $(id){return document.getElementById(id);}
  function on(ids,fn){ids.forEach(function(i){$(i).addEventListener(&#x27;input&#x27;,fn);});fn();}
  var NS=&#x27;http://www.w3.org/2000/svg&#x27;;
  function el(tag,attrs,txt){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;return e;}

  // ---- probability scale
  on([&#x27;probR&#x27;],function(){
    var p=+$(&#x27;probR&#x27;).value;$(&#x27;probO&#x27;).textContent=p+&#x27;%&#x27;;
    var x=p*7;$(&#x27;probL&#x27;).setAttribute(&#x27;x1&#x27;,x);$(&#x27;probL&#x27;).setAttribute(&#x27;x2&#x27;,x);
    var L,A;
    if(p&gt;50)L=&#x27;&lt;strong&gt;Probable&lt;/strong&gt; → a &lt;strong&gt;provision&lt;/strong&gt; is recognised (if there is also a present obligation and a reliable estimate).&#x27;;
    else if(p&gt;5)L=&#x27;&lt;strong&gt;Possible&lt;/strong&gt; → no recognition, &lt;strong&gt;disclosure&lt;/strong&gt; as a contingent liability.&#x27;;
    else L=&#x27;&lt;strong&gt;Remote&lt;/strong&gt; → neither recognition nor disclosure.&#x27;;
    if(p&gt;=95)A=&#x27;&lt;strong&gt;Virtually certain&lt;/strong&gt; → no longer contingent: the &lt;strong&gt;asset and income&lt;/strong&gt; are recognised.&#x27;;
    else if(p&gt;50)A=&#x27;&lt;strong&gt;Probable&lt;/strong&gt; → no recognition, &lt;strong&gt;disclosure&lt;/strong&gt; as a contingent asset.&#x27;;
    else A=&#x27;&lt;strong&gt;Possible&lt;/strong&gt; → neither recognition nor disclosure.&#x27;;
    $(&#x27;probRes&#x27;).innerHTML=&#x27;If it is an &lt;em&gt;outflow&lt;/em&gt;: &#x27;+L+&#x27;&lt;br&gt;If it is an &lt;em&gt;inflow&lt;/em&gt;: &#x27;+A+&#x27;&lt;br&gt;&lt;span class=&quot;small&quot;&gt;Note the asymmetry: at &#x27;+p+&#x27;% a liability and an asset receive different treatments.&lt;/span&gt;&#x27;;
  });

  // ---- decision tree
  var T={
    q1:{q:&#x27;Is there a present obligation (legal or constructive) arising from a past event?&#x27;,a:[[&#x27;Yes&#x27;,&#x27;q2&#x27;],[&#x27;No, but it is possible&#x27;,&#x27;q1b&#x27;],[&#x27;No&#x27;,&#x27;r0&#x27;]]},
    q1b:{q:&#x27;Is the possibility of an outflow of resources remote?&#x27;,a:[[&#x27;Yes&#x27;,&#x27;rRem&#x27;],[&#x27;No&#x27;,&#x27;rCL&#x27;]]},
    q2:{q:&#x27;Is an outflow of resources probable (more than 50%)?&#x27;,a:[[&#x27;Yes&#x27;,&#x27;q3&#x27;],[&#x27;No&#x27;,&#x27;q1b&#x27;]]},
    q3:{q:&#x27;Can the amount be estimated with sufficient reliability?&#x27;,a:[[&#x27;Yes&#x27;,&#x27;rP&#x27;],[&#x27;No (extremely rare case)&#x27;,&#x27;rCL&#x27;]]},
    r0:{r:&#x27;&lt;span class=&quot;big&quot;&gt;Nothing&lt;/span&gt;&lt;br&gt;There is neither an obligation nor a possible obligation: no recognition, no disclosure.&#x27;},
    rRem:{r:&#x27;&lt;span class=&quot;big&quot;&gt;Nothing&lt;/span&gt;&lt;br&gt;Remote outflow: no recognition and no disclosure.&#x27;},
    rCL:{r:&#x27;&lt;span class=&quot;big&quot;&gt;Contingent liability&lt;/span&gt;&lt;br&gt;No provision; disclosure in the notes (nature, estimate of financial effect, uncertainties, reimbursements).&#x27;},
    rP:{r:&#x27;&lt;span class=&quot;big&quot;&gt;Provision&lt;/span&gt;&lt;br&gt;The liability is recognised at the best estimate (at present value where applicable) and information on movements is disclosed.&#x27;}
  },path=[];
  function tree(k){var n=T[k];$(&#x27;treeB&#x27;).innerHTML=&#x27;&#x27;;
    if(n.r){$(&#x27;treeQ&#x27;).textContent=&#x27;Outcome&#x27;;$(&#x27;treeR&#x27;).hidden=false;$(&#x27;treeR&#x27;).innerHTML=n.r;
      var b=document.createElement(&#x27;button&#x27;);b.className=&#x27;btn&#x27;;b.type=&#x27;button&#x27;;b.textContent=&#x27;↺ Start again&#x27;;b.onclick=function(){path=[];tree(&#x27;q1&#x27;);};$(&#x27;treeB&#x27;).appendChild(b);}
    else{$(&#x27;treeR&#x27;).hidden=true;$(&#x27;treeQ&#x27;).textContent=n.q;
      n.a.forEach(function(a){var b=document.createElement(&#x27;button&#x27;);b.className=&#x27;btn&#x27;;b.type=&#x27;button&#x27;;b.textContent=a[0];
        b.onclick=function(){path.push(a[0]);tree(a[1]);};$(&#x27;treeB&#x27;).appendChild(b);});}
    $(&#x27;treePath&#x27;).textContent=path.length?&#x27;Path: &#x27;+path.join(&#x27; → &#x27;):&#x27;&#x27;;
  }
  tree(&#x27;q1&#x27;);

  // ---- litigation
  on([&#x27;litP&#x27;,&#x27;litA&#x27;],function(){
    var p=+$(&#x27;litP&#x27;).value,a=+$(&#x27;litA&#x27;).value;$(&#x27;litPo&#x27;).textContent=p+&#x27;%&#x27;;$(&#x27;litAo&#x27;).textContent=E(a);
    var r;
    if(p&gt;50)r=&#x27;&lt;span class=&quot;big&quot;&gt;Provision&lt;/span&gt;&lt;br&gt;Probable outflow (&#x27;+p+&#x27;% &amp;gt; 50%). Single obligation: the starting point is the most likely outcome, i.e. approximately &lt;strong&gt;&#x27;+E(a)+&#x27;&lt;/strong&gt;, while also considering other possible outcomes. &lt;span class=&quot;small&quot;&gt;(The expected value of &#x27;+E(a*p/100)+&#x27; would understate an outcome that, if it occurs, is worth the full amount.)&lt;/span&gt;&#x27;;
    else if(p&gt;5)r=&#x27;&lt;span class=&quot;big&quot;&gt;Contingent liability&lt;/span&gt;&lt;br&gt;Outflow not probable (&#x27;+p+&#x27;% ≤ 50%): no provision, disclosure in the notes with an estimate of the financial effect (up to &#x27;+E(a)+&#x27;).&#x27;;
    else r=&#x27;&lt;span class=&quot;big&quot;&gt;Nothing&lt;/span&gt;&lt;br&gt;Remote possibility (&#x27;+p+&#x27;%): neither provision nor disclosure.&#x27;;
    $(&#x27;litR&#x27;).innerHTML=r;
  });

  // ---- warranty
  on([&#x27;wN&#x27;,&#x27;wP1&#x27;,&#x27;wC1&#x27;,&#x27;wP2&#x27;,&#x27;wC2&#x27;],function(){
    var n=+$(&#x27;wN&#x27;).value,p1=+$(&#x27;wP1&#x27;).value,c1=+$(&#x27;wC1&#x27;).value,p2=+$(&#x27;wP2&#x27;).value,c2=+$(&#x27;wC2&#x27;).value;
    if(p1+p2&gt;100){p2=100-p1;$(&#x27;wP2&#x27;).value=p2;}
    var p0=100-p1-p2;
    $(&#x27;wNo&#x27;).textContent=n.toLocaleString(&#x27;en-GB&#x27;);$(&#x27;wP1o&#x27;).textContent=p1+&#x27;%&#x27;;$(&#x27;wC1o&#x27;).textContent=E(c1);$(&#x27;wP2o&#x27;).textContent=p2+&#x27;%&#x27;;$(&#x27;wC2o&#x27;).textContent=E(c2);
    var unit=p1/100*c1+p2/100*c2,tot=n*unit;
    var s=$(&#x27;wBar&#x27;);s.innerHTML=&#x27;&#x27;;
    var segs=[[p0,&#x27;var(--rule)&#x27;,&#x27;no defect &#x27;+p0+&#x27;%&#x27;],[p1,&#x27;var(--sla-bg)&#x27;,&#x27;minor &#x27;+p1+&#x27;%&#x27;],[p2,&#x27;var(--sla)&#x27;,&#x27;major &#x27;+p2+&#x27;%&#x27;]],x=0;
    segs.forEach(function(g){var w=g[0]*6;if(w&gt;0){s.appendChild(el(&#x27;rect&#x27;,{x:x,y:4,width:w,height:24,fill:g[1],stroke:&#x27;var(--paper)&#x27;}));
      if(w&gt;60)s.appendChild(el(&#x27;text&#x27;,{x:x+6,y:20,&#x27;font-size&#x27;:11,fill:g[1]===&#x27;var(--sla)&#x27;?&#x27;var(--paper)&#x27;:&#x27;var(--ink)&#x27;},g[2]));}x+=w;});
    s.appendChild(el(&#x27;text&#x27;,{x:0,y:42,&#x27;font-size&#x27;:10,fill:&#x27;var(--soft)&#x27;},&#x27;composition of the product population&#x27;));
    $(&#x27;wRes&#x27;).innerHTML=&#x27;Expected cost per product = &#x27;+p1+&#x27;% × &#x27;+E(c1)+&#x27; + &#x27;+p2+&#x27;% × &#x27;+E(c2)+&#x27; = &lt;strong&gt;&#x27;+E(unit)+&#x27;&lt;/strong&gt;&lt;br&gt;Provision = &#x27;+n.toLocaleString(&#x27;en-GB&#x27;)+&#x27; × &#x27;+E(unit)+&#x27; = &lt;span class=&quot;big&quot;&gt;&#x27;+E(tot)+&#x27;&lt;/span&gt;&#x27;;
  });

  // ---- present value chart
  on([&#x27;pvC&#x27;,&#x27;pvN&#x27;,&#x27;pvR&#x27;],function(){
    var C=+$(&#x27;pvC&#x27;).value,n=+$(&#x27;pvN&#x27;).value,r=+$(&#x27;pvR&#x27;).value/100;
    $(&#x27;pvCo&#x27;).textContent=E(C);$(&#x27;pvNo&#x27;).textContent=n+(n===1?&#x27; year&#x27;:&#x27; years&#x27;);$(&#x27;pvRo&#x27;).textContent=(r*100).toLocaleString(&#x27;en-GB&#x27;)+&#x27;%&#x27;;
    var s=$(&#x27;pvChart&#x27;);s.innerHTML=&#x27;&#x27;;var W=600,H=180,x0=34,bw=(W-x0)/(n+1);
    s.appendChild(el(&#x27;line&#x27;,{x1:x0,y1:H,x2:W+10,y2:H,stroke:&#x27;var(--rule)&#x27;}));
    s.appendChild(el(&#x27;line&#x27;,{x1:x0,y1:H-H*0.95,x2:W+10,y2:H-H*0.95,stroke:&#x27;var(--soft)&#x27;,&#x27;stroke-dasharray&#x27;:&#x27;3 4&#x27;}));
    s.appendChild(el(&#x27;text&#x27;,{x:W+10,y:H-H*0.95-4,&#x27;font-size&#x27;:10,&#x27;text-anchor&#x27;:&#x27;end&#x27;,fill:&#x27;var(--soft)&#x27;},&#x27;C = &#x27;+E(C)));
    var pv0=C/Math.pow(1+r,n),tot=0;
    for(var t=0;t&lt;=n;t++){
      var v=C/Math.pow(1+r,n-t),prev=t?C/Math.pow(1+r,n-t+1):v,u=v-prev;tot+=t?u:0;
      var h=v/C*H*0.95,hu=u/C*H*0.95,x=x0+t*bw+bw*0.15,w=bw*0.7;
      s.appendChild(el(&#x27;rect&#x27;,{x:x,y:H-h,width:w,height:h-hu,fill:&#x27;var(--sla-bg)&#x27;,stroke:&#x27;var(--sla)&#x27;}));
      if(hu&gt;0.5)s.appendChild(el(&#x27;rect&#x27;,{x:x,y:H-h,width:w,height:hu,fill:&#x27;var(--sla)&#x27;}));
      if(n&lt;=12||t%2===0)s.appendChild(el(&#x27;text&#x27;,{x:x+w/2,y:H+14,&#x27;font-size&#x27;:10,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,fill:&#x27;var(--soft)&#x27;},t===0?&#x27;today&#x27;:&#x27;y&#x27;+t));
    }
    s.appendChild(el(&#x27;text&#x27;,{x:x0,y:H+34,&#x27;font-size&#x27;:10.5,fill:&#x27;var(--soft)&#x27;},&#x27;bar = provision balance · dark portion = unwinding for the year&#x27;));
    var u1=pv0*r;
    $(&#x27;pvRes&#x27;).innerHTML=&#x27;Initial recognition (PV): &lt;span class=&quot;big&quot;&gt;&#x27;+E(pv0)+&#x27;&lt;/span&gt;&lt;br&gt;Year-1 unwinding: &#x27;+E(u1)+&#x27; · total unwinding over &#x27;+n+&#x27; years: &#x27;+E(C-pv0)+&#x27; (all borrowing costs).&lt;br&gt;&lt;span class=&quot;small&quot;&gt;The discount relative to the nominal amount is &#x27;+Math.round((1-pv0/C)*100)+&#x27;%: this is why discounting is required when the effect is material.&lt;/span&gt;&#x27;;
  });

  // ---- reimbursement
  var vc=true;
  $(&#x27;rbVC&#x27;).addEventListener(&#x27;click&#x27;,function(){vc=!vc;this.classList.toggle(&#x27;on&#x27;,vc);this.setAttribute(&#x27;aria-pressed&#x27;,vc);this.textContent=&#x27;Reimbursement virtually certain: &#x27;+(vc?&#x27;yes&#x27;:&#x27;no&#x27;);rb();});
  function rb(){var P=+$(&#x27;rbP&#x27;).value,R=+$(&#x27;rbR&#x27;).value;$(&#x27;rbPo&#x27;).textContent=E(P);$(&#x27;rbRo&#x27;).textContent=E(R);
    var A=vc?Math.min(P,R):0;
    var t=&#x27;Liability (provision): &lt;strong&gt;&#x27;+E(P)+&#x27;&lt;/strong&gt; — always in full.&lt;br&gt;Separate asset (reimbursement asset): &lt;span class=&quot;big&quot;&gt;&#x27;+E(A)+&#x27;&lt;/span&gt;&#x27;;
    if(!vc&amp;&amp;R&gt;0)t+=&#x27;&lt;br&gt;&lt;span class=&quot;small&quot;&gt;The reimbursement is not virtually certain: no asset (at most, if probable, disclosure as a contingent asset).&lt;/span&gt;&#x27;;
    else if(R&gt;P)t+=&#x27;&lt;br&gt;&lt;span class=&quot;small&quot;&gt;The expected reimbursement exceeds the provision: the asset is capped at &#x27;+E(P)+&#x27;.&lt;/span&gt;&#x27;;
    t+=&#x27;&lt;br&gt;Net expense that may be presented in profit or loss: &#x27;+E(P-A);
    $(&#x27;rbRes&#x27;).innerHTML=t;}
  [&#x27;rbP&#x27;,&#x27;rbR&#x27;].forEach(function(i){$(i).addEventListener(&#x27;input&#x27;,rb);});rb();

  // ---- onerous contract
  on([&#x27;onR&#x27;,&#x27;onC&#x27;,&#x27;onP&#x27;],function(){
    var R=+$(&#x27;onR&#x27;).value,C=+$(&#x27;onC&#x27;).value,P=+$(&#x27;onP&#x27;).value;$(&#x27;onRo&#x27;).textContent=E(R);$(&#x27;onCo&#x27;).textContent=E(C);$(&#x27;onPo&#x27;).textContent=E(P);
    var loss=Math.max(C-R,0),s=$(&#x27;onChart&#x27;);s.innerHTML=&#x27;&#x27;;
    var mx=Math.max(loss,P,1),sc=380/mx;
    [[&#x27;Loss if fulfilled&#x27;,loss],[&#x27;Exit penalty&#x27;,P]].forEach(function(b,i){var y=14+i*46;
      s.appendChild(el(&#x27;text&#x27;,{x:0,y:y+18,&#x27;font-size&#x27;:12,fill:&#x27;var(--ink)&#x27;},b[0]));
      var least=C&gt;R&amp;&amp;b[1]===Math.min(loss,P);
      s.appendChild(el(&#x27;rect&#x27;,{x:150,y:y,width:Math.max(b[1]*sc,1),height:28,rx:6,fill:least?&#x27;var(--brk)&#x27;:&#x27;var(--brk-bg)&#x27;,stroke:&#x27;var(--brk)&#x27;}));
      s.appendChild(el(&#x27;text&#x27;,{x:156+Math.max(b[1]*sc,1),y:y+19,&#x27;font-size&#x27;:12,fill:&#x27;var(--ink)&#x27;},E(b[1])));});
    s.appendChild(el(&#x27;text&#x27;,{x:150,y:112,&#x27;font-size&#x27;:10.5,fill:&#x27;var(--soft)&#x27;},&#x27;solid bar = least net cost of exit&#x27;));
    var t;
    if(C&lt;=R)t=&#x27;&lt;span class=&quot;big&quot;&gt;No provision&lt;/span&gt;&lt;br&gt;Costs (&#x27;+E(C)+&#x27;) do not exceed revenue (&#x27;+E(R)+&#x27;): the contract is not onerous; it remains an executory contract outside IAS 37.&#x27;;
    else{var m=Math.min(loss,P);t=&#x27;&lt;strong&gt;Onerous&lt;/strong&gt; contract. Net cost of fulfilling = &#x27;+E(C)+&#x27; − &#x27;+E(R)+&#x27; = &#x27;+E(loss)+&#x27;; penalty = &#x27;+E(P)+&#x27;.&lt;br&gt;Provision = the lower of the two = &lt;span class=&quot;big&quot;&gt;&#x27;+E(m)+&#x27;&lt;/span&gt; (&#x27;+(loss&lt;=P?&#x27;fulfilling is cheaper&#x27;:&#x27;exiting and paying the penalty is cheaper&#x27;)+&#x27;).&#x27;;}
    $(&#x27;onRes&#x27;).innerHTML=t;
  });

  // ---- restructuring sort
  document.querySelectorAll(&#x27;#sortR li&#x27;).forEach(function(li){
    li.querySelectorAll(&#x27;button&#x27;).forEach(function(b){b.addEventListener(&#x27;click&#x27;,function(){
      var okk=b.dataset.v===li.dataset.a,fb=li.querySelector(&#x27;.fb&#x27;);
      li.querySelectorAll(&#x27;button&#x27;).forEach(function(x){x.classList.remove(&#x27;on&#x27;);});b.classList.add(&#x27;on&#x27;);
      fb.className=&#x27;fb &#x27;+(okk?&#x27;ok&#x27;:&#x27;ko&#x27;);fb.textContent=okk?&#x27;✓ correct&#x27;:&#x27;✗ try again&#x27;;
    });});
  });
})();
