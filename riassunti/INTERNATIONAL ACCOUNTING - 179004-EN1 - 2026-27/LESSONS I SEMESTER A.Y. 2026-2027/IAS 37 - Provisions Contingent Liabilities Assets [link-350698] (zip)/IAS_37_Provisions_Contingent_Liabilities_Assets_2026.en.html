    &lt;a href=&quot;#s6&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;400&quot; width=&quot;230&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot;/&gt;&lt;text x=&quot;155&quot; y=&quot;424&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;6 · Reimbursements &amp;amp; review&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;442&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--soft)&quot;&gt;living estimate&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s7&quot;&gt;&lt;rect x=&quot;300&quot; y=&quot;400&quot; width=&quot;245&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;&lt;text x=&quot;422&quot; y=&quot;424&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;7–8 · Specific cases&lt;/text&gt;&lt;text x=&quot;422&quot; y=&quot;442&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--soft)&quot;&gt;onerous · restructuring · restoration · climate&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s9&quot;&gt;&lt;rect x=&quot;645&quot; y=&quot;400&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;&lt;text x=&quot;755&quot; y=&quot;424&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;9 · Disclosure&lt;/text&gt;&lt;text x=&quot;755&quot; y=&quot;442&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--soft)&quot;&gt;notes · decision tree&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s10&quot;&gt;&lt;rect x=&quot;650&quot; y=&quot;30&quot; width=&quot;215&quot; height=&quot;64&quot; rx=&quot;12&quot; fill=&quot;none&quot; stroke=&quot;var(--brk)&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text x=&quot;757&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;10 · IASB developments&lt;/text&gt;&lt;text x=&quot;757&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--soft)&quot;&gt;Targeted Improvements&lt;/text&gt;&lt;/a&gt;
    &lt;path d=&quot;M650,62 L598,62&quot; stroke=&quot;var(--brk)&quot; stroke-dasharray=&quot;4 4&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;text x=&quot;603&quot; y=&quot;52&quot; font-size=&quot;10.5&quot; fill=&quot;var(--soft)&quot; font-style=&quot;italic&quot;&gt;revises&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Colours: &lt;span style=&quot;color:var(--sal)&quot;&gt;sage&lt;/span&gt; = foundations · &lt;span style=&quot;color:var(--ocr)&quot;&gt;ochre&lt;/span&gt; = recognition · &lt;span style=&quot;color:var(--sla)&quot;&gt;slate&lt;/span&gt; = measurement · &lt;span style=&quot;color:var(--brk)&quot;&gt;brick&lt;/span&gt; = applications, disclosure and developments.&lt;/figcaption&gt;
  &lt;/figure&gt;
&lt;/section&gt;

&lt;/div&gt;

&lt;!-- ============ PARTE A ============ --&gt;
&lt;div class=&quot;part p-a&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;n&quot;&gt;A&lt;/span&gt;&lt;h2&gt;Foundations: what IAS 37 is about&lt;/h2&gt;&lt;/div&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s1&quot;&gt;
    &lt;h3&gt;1 · Objective and scope &lt;span class=&quot;par&quot;&gt;paras 1–9&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slides&lt;/span&gt;IAS 37 sets out the &lt;span class=&quot;t&quot;&gt;accounting&lt;/span&gt; (recognition and measurement) and &lt;span class=&quot;t&quot;&gt;disclosure&lt;/span&gt; (information in the notes) requirements for &lt;strong&gt;obligations and possible rights whose outcome is uncertain&lt;/strong&gt;.&lt;/p&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;IAS 37 separates two different kinds of uncertainty: uncertainty &lt;em&gt;about an obligation that already exists&lt;/em&gt; (→ a &lt;span class=&quot;t&quot;&gt;provision&lt;/span&gt;) and uncertainty &lt;em&gt;about whether the obligation exists at all&lt;/em&gt; (→ often a &lt;span class=&quot;t&quot;&gt;contingent liability&lt;/span&gt;).&lt;/div&gt;

    &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 760 170&quot; role=&quot;img&quot; aria-label=&quot;Two types of uncertainty&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;350&quot; height=&quot;130&quot; rx=&quot;14&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;
      &lt;rect x=&quot;400&quot; y=&quot;20&quot; width=&quot;350&quot; height=&quot;130&quot; rx=&quot;14&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sal)&quot; stroke-dasharray=&quot;6 5&quot;/&gt;
      &lt;text x=&quot;185&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;“I owe, but not sure how much/when”&lt;/text&gt;
      &lt;text x=&quot;185&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--soft)&quot;&gt;The obligation exists: uncertainty about&lt;/text&gt;
      &lt;text x=&quot;185&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--soft)&quot;&gt;timing and/or amount&lt;/text&gt;
      &lt;text x=&quot;185&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;var(--sal)&quot;&gt;→ PROVISION (recognised)&lt;/text&gt;
      &lt;text x=&quot;575&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;“Maybe I owe, maybe not”&lt;/text&gt;
      &lt;text x=&quot;575&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--soft)&quot;&gt;Uncertainty about the existence&lt;/text&gt;
      &lt;text x=&quot;575&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--soft)&quot;&gt;of the obligation or of the outflow&lt;/text&gt;
      &lt;text x=&quot;575&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;var(--sal)&quot;&gt;→ CONTINGENT LIABILITY (notes)&lt;/text&gt;
    &lt;/svg&gt;
    &lt;/figure&gt;

    &lt;h4&gt;When another standard applies&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slides&lt;/span&gt;IAS 37 is a “residual” standard: it applies to provisions, contingent liabilities and contingent assets &lt;em&gt;unless another IFRS contains specific requirements&lt;/em&gt;. Use the tabs to compare.&lt;/p&gt;
    &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-tabs&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-tab=&quot;sc1&quot;&gt;IAS 37 applies&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-tab=&quot;sc2&quot;&gt;Another standard prevails&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-tab=&quot;sc3&quot;&gt;Executory contracts&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; id=&quot;sc1&quot;&gt;&lt;ul class=&quot;tight&quot;&gt;
      &lt;li&gt;&lt;strong&gt;Warranties / refunds&lt;/strong&gt; — product warranties, refund policies.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Litigation / environmental obligations&lt;/strong&gt; — lawsuits, environmental clean-up.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Restructuring / onerous contracts&lt;/strong&gt; — restructurings, loss-making contracts.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Decommissioning obligations&lt;/strong&gt; — dismantling of plant and site restoration.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; id=&quot;sc2&quot; hidden&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Subject&lt;/th&gt;&lt;th&gt;Standard&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Financial instruments (e.g. financial guarantees)&lt;/td&gt;&lt;td&gt;IFRS 9&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Revenue contracts&lt;/td&gt;&lt;td&gt;IFRS 15&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Income taxes / employee benefits&lt;/td&gt;&lt;td&gt;IAS 12 / IAS 19&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Leases / insurance&lt;/td&gt;&lt;td&gt;IFRS 16 / IFRS 17&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;These standards have their own criteria (e.g. IAS 19 measures post-employment benefits such as pension plans and the Italian TFR using actuarial methods): applying IAS 37 as well would create duplication or inconsistencies.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; id=&quot;sc3&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Key exception:&lt;/strong&gt; &lt;span class=&quot;t&quot;&gt;executory contracts&lt;/span&gt; are normally outside IAS 37 &lt;em&gt;unless they become onerous&lt;/em&gt;.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;An &lt;em&gt;executory contract&lt;/em&gt; is a contract under which neither party has performed any of its obligations, or both parties have partially performed their obligations to an equal extent: e.g. a signed purchase order not yet delivered or paid for. As long as it is “balanced”, nothing is recognised; if the unavoidable costs exceed the benefits, it becomes an &lt;a href=&quot;#onerous&quot;&gt;onerous contract&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s2&quot;&gt;
    &lt;h3&gt;2 · Key definitions &lt;span class=&quot;par&quot;&gt;paras 10–22&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Provision&lt;/h4&gt;&lt;p&gt;A &lt;strong&gt;liability of uncertain timing or amount&lt;/strong&gt;. In Italian practice it corresponds to the «fondo rischi e oneri».&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Legal obligation&lt;/h4&gt;&lt;p&gt;Arises from a &lt;strong&gt;contract, legislation or other operation of law&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Constructive obligation&lt;/h4&gt;&lt;p&gt;Arises from the &lt;strong&gt;entity’s actions&lt;/strong&gt; and the &lt;strong&gt;valid expectations&lt;/strong&gt; those actions create in other parties.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Contingent liability&lt;/h4&gt;&lt;p&gt;&lt;em&gt;Either&lt;/em&gt; a &lt;strong&gt;possible obligation&lt;/strong&gt; (whose existence will be confirmed by uncertain future events) &lt;em&gt;or&lt;/em&gt; a &lt;strong&gt;present obligation that is not recognised&lt;/strong&gt; because an outflow is not probable or the amount cannot be measured with sufficient reliability.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Contingent asset&lt;/h4&gt;&lt;p&gt;A &lt;strong&gt;possible asset&lt;/strong&gt; whose existence depends on uncertain future events &lt;strong&gt;not wholly within the control&lt;/strong&gt; of the entity (e.g. damages claimed in a lawsuit that is still pending).&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h4&gt;Legal vs constructive obligation&lt;/h4&gt;
    &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-tabs&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-tab=&quot;lc1&quot;&gt;Legal&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-tab=&quot;lc2&quot;&gt;Constructive&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-tab=&quot;lc3&quot;&gt;Examples compared&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; id=&quot;lc1&quot;&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Contractual terms&lt;/li&gt;&lt;li&gt;Legislation or regulation&lt;/li&gt;&lt;li&gt;Other operation of law (e.g. civil liability for damages)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; id=&quot;lc2&quot; hidden&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Past practice, published policy or a sufficiently specific current statement&lt;/li&gt;&lt;li&gt;That creates a &lt;strong&gt;valid expectation&lt;/strong&gt; in other parties that the entity will discharge the responsibility&lt;/li&gt;&lt;/ul&gt;
      &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Management’s intention alone is &lt;strong&gt;not enough&lt;/strong&gt;: the entity must have created an expectation in other parties that it will accept the responsibility.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; id=&quot;lc3&quot; hidden&gt;&lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Situation&lt;/th&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Why&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Two-year warranty provided for in the sales contract&lt;/td&gt;&lt;td&gt;Legal&lt;/td&gt;&lt;td&gt;Contractual term&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;A shop has always refunded dissatisfied customers, even though the law does not require it, and this is widely known&lt;/td&gt;&lt;td&gt;Constructive&lt;/td&gt;&lt;td&gt;Established, publicly known practice → valid expectation&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Law requiring the clean-up of land that is already contaminated&lt;/td&gt;&lt;td&gt;Legal&lt;/td&gt;&lt;td&gt;Legislation&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;The board of directors is “thinking” of cleaning up, but has told no one&lt;/td&gt;&lt;td&gt;None&lt;/td&gt;&lt;td&gt;Mere intention, no expectation in other parties&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;The shop case echoes the illustrative examples accompanying IAS 37 (refunds policy).&lt;/p&gt;&lt;/div&gt;

    &lt;h4&gt;Provision, accrual or contingent liability?&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slides&lt;/span&gt;Three closely related items that must not be confused (paras 11–13). A &lt;span class=&quot;t&quot;&gt;trade payable / accrual&lt;/span&gt; is an amount owed to suppliers or an accrued expense: uncertainty is low.&lt;/p&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Trade payable / accrual&lt;/th&gt;&lt;th&gt;Provision&lt;/th&gt;&lt;th&gt;Contingent liability&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Present obligation&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Yes&lt;/td&gt;&lt;td&gt;Yes&lt;/td&gt;&lt;td&gt;Possible, or present but not recognised&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Uncertainty&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Low / moderate&lt;/td&gt;&lt;td&gt;Uncertain timing and/or amount&lt;/td&gt;&lt;td&gt;Uncertain existence and/or outflow&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Recognition&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Recognised&lt;/td&gt;&lt;td&gt;Recognised if IAS 37.14 is met&lt;/td&gt;&lt;td&gt;Not recognised; disclosed unless remote&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;A provision is &lt;strong&gt;not a “general reserve for bad news”&lt;/strong&gt;: it is a liability arising from a specific present obligation.&lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;Mind the terminology: in some jurisdictions the word “provision” is also used for asset write-downs (e.g. “provision for doubtful debts”). In IAS 37 it refers only to liabilities; impairment of receivables falls under IFRS 9, impairment of non-current assets under IAS 36.&lt;/p&gt;
  &lt;/section&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Self-check · Part A&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. A company signs a fixed-price supply contract; neither party has delivered anything yet. Does IAS 37 apply?&lt;/summary&gt;&lt;div&gt;No, as long as the contract remains a balanced &lt;em&gt;executory contract&lt;/em&gt;. It falls within IAS 37 only if it becomes &lt;strong&gt;onerous&lt;/strong&gt; (unavoidable costs &amp;gt; expected benefits).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. What is the difference between a legal and a constructive obligation?&lt;/summary&gt;&lt;div&gt;A legal obligation arises from a contract, legislation or operation of law; a constructive obligation arises from the entity’s conduct (practice, published policies, specific statements) that creates a valid expectation in other parties.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. “Let’s set aside 2 million for possible future problems.” Is this an IAS 37 provision?&lt;/summary&gt;&lt;div&gt;No. A provision requires a &lt;strong&gt;specific present obligation&lt;/strong&gt; arising from a past event; a general reserve “for bad news” is not permitted.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Is a financial guarantee issued in favour of a subsidiary accounted for under IAS 37?&lt;/summary&gt;&lt;div&gt;Normally not: financial guarantee contracts are financial instruments, so IFRS 9 prevails.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;!-- ============ PARTE B ============ --&gt;
&lt;div class=&quot;part p-b&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;n&quot;&gt;B&lt;/span&gt;&lt;h2&gt;Recognition: to recognise or not?&lt;/h2&gt;&lt;/div&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s3&quot;&gt;
    &lt;h3&gt;3 · The three conditions for recognising a provision &lt;span class=&quot;par&quot;&gt;paras 14–26&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slides&lt;/span&gt;A provision is recognised (&lt;span class=&quot;t&quot;&gt;recognition&lt;/span&gt; = inclusion in the statement of financial position) &lt;strong&gt;only if all three&lt;/strong&gt; conditions are met:&lt;/p&gt;
    &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 760 190&quot; role=&quot;img&quot; aria-label=&quot;Three conditions in sequence&quot;&gt;
      &lt;g font-size=&quot;13&quot; fill=&quot;var(--ink)&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--ocr-bg)&quot; stroke=&quot;var(--ocr)&quot;/&gt;
        &lt;text x=&quot;110&quot; y=&quot;55&quot; class=&quot;serif&quot; font-size=&quot;30&quot; fill=&quot;var(--ocr)&quot;&gt;1&lt;/text&gt;
        &lt;text x=&quot;110&quot; y=&quot;85&quot; font-weight=&quot;700&quot;&gt;Present obligation&lt;/text&gt;
        &lt;text x=&quot;110&quot; y=&quot;105&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;legal or constructive&lt;/text&gt;
        &lt;text x=&quot;110&quot; y=&quot;122&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;from a past event&lt;/text&gt;
        &lt;rect x=&quot;280&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--ocr-bg)&quot; stroke=&quot;var(--ocr)&quot;/&gt;
        &lt;text x=&quot;380&quot; y=&quot;55&quot; class=&quot;serif&quot; font-size=&quot;30&quot; fill=&quot;var(--ocr)&quot;&gt;2&lt;/text&gt;
        &lt;text x=&quot;380&quot; y=&quot;85&quot; font-weight=&quot;700&quot;&gt;Probable outflow&lt;/text&gt;
        &lt;text x=&quot;380&quot; y=&quot;105&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;outflow of resources&lt;/text&gt;
        &lt;text x=&quot;380&quot; y=&quot;122&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;more likely than not&lt;/text&gt;
        &lt;rect x=&quot;550&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--ocr-bg)&quot; stroke=&quot;var(--ocr)&quot;/&gt;
        &lt;text x=&quot;650&quot; y=&quot;55&quot; class=&quot;serif&quot; font-size=&quot;30&quot; fill=&quot;var(--ocr)&quot;&gt;3&lt;/text&gt;
        &lt;text x=&quot;650&quot; y=&quot;85&quot; font-weight=&quot;700&quot;&gt;Reliable estimate&lt;/text&gt;
        &lt;text x=&quot;650&quot; y=&quot;105&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;amount can be estimated&lt;/text&gt;
        &lt;text x=&quot;650&quot; y=&quot;122&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;with sufficient reliability&lt;/text&gt;
        &lt;text x=&quot;245&quot; y=&quot;88&quot; font-size=&quot;26&quot; fill=&quot;var(--ocr)&quot;&gt;+&lt;/text&gt;&lt;text x=&quot;515&quot; y=&quot;88&quot; font-size=&quot;26&quot; fill=&quot;var(--ocr)&quot;&gt;+&lt;/text&gt;
        &lt;text x=&quot;380&quot; y=&quot;175&quot; font-size=&quot;13&quot; fill=&quot;var(--soft)&quot; font-style=&quot;italic&quot;&gt;If even one is missing → no provision; the next step may be disclosure as a contingent liability.&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;Typical journal entry on recognition:&lt;/p&gt;
    &lt;div class=&quot;je&quot;&gt;Dr  Expense (profit or loss, by nature of expense)     X
    Cr  Provision (liability)                             X&lt;/div&gt;

    &lt;h4&gt;Condition 1 — present obligation and past event &lt;span class=&quot;small&quot;&gt;(paras 15–22)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;A past event gives rise to a present obligation only if it leaves the entity &lt;strong&gt;no realistic alternative&lt;/strong&gt; to settling the obligation. Such an event is called an &lt;span class=&quot;t&quot;&gt;obligating event&lt;/span&gt;.&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;✓ Past event exists&lt;/h4&gt;&lt;p&gt;The contamination has already occurred and the law requires the site to be restored. The entity can no longer avoid the expenditure.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;✗ Future action only&lt;/h4&gt;&lt;p&gt;Scheduled maintenance or future operating expenditure: the entity &lt;strong&gt;can still avoid it&lt;/strong&gt; (e.g. by selling the plant or changing its business).&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;The standard looks &lt;strong&gt;backwards&lt;/strong&gt;, to the obligating event, not forwards to management’s budget.&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Example: the mandatory overhaul of an aircraft&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;An airline is required by law to overhaul its engines every 3 years. At 31 December there is no provision: the airline could sell the aircraft or ground it, so the future expenditure is avoidable. The cost is instead dealt with under IAS 16 (a separately depreciated overhaul component). This is one of the classic illustrative examples accompanying IAS 37.&lt;/div&gt;&lt;/details&gt;

    &lt;h4&gt;Condition 2 — probable, possible or remote &lt;span class=&quot;small&quot;&gt;(paras 23–24)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;For IAS 37, &lt;span class=&quot;t&quot;&gt;probable&lt;/span&gt; means &lt;strong&gt;more likely than not&lt;/strong&gt;: a probability of outflow above 50%. Where there is a large population of similar obligations (e.g. warranties), probability is assessed &lt;strong&gt;for the class as a whole&lt;/strong&gt;, not item by item.&lt;/p&gt;

    &lt;div class=&quot;lab&quot;&gt;
      &lt;h4&gt;Lab · move the probability&lt;/h4&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;probR&quot;&gt;Probability of the event (outflow or inflow)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;probR&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;45&quot;&gt;&lt;output id=&quot;probO&quot;&gt;45%&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 700 120&quot; role=&quot;img&quot; aria-label=&quot;Probability scale&quot; style=&quot;margin-top:6px&quot;&gt;
        &lt;text x=&quot;0&quot; y=&quot;14&quot; font-size=&quot;12&quot; fill=&quot;var(--soft)&quot;&gt;Liability (outflow)&lt;/text&gt;
        &lt;rect x=&quot;0&quot; y=&quot;20&quot; width=&quot;35&quot; height=&quot;22&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;rect x=&quot;35&quot; y=&quot;20&quot; width=&quot;315&quot; height=&quot;22&quot; fill=&quot;var(--sla-bg)&quot;/&gt;&lt;rect x=&quot;350&quot; y=&quot;20&quot; width=&quot;350&quot; height=&quot;22&quot; fill=&quot;var(--ocr-bg)&quot; stroke=&quot;var(--ocr)&quot;/&gt;
        &lt;text x=&quot;4&quot; y=&quot;36&quot; font-size=&quot;10&quot; fill=&quot;var(--ink)&quot;&gt;rem.&lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;36&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;possible → disclose&lt;/text&gt;&lt;text x=&quot;525&quot; y=&quot;36&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;probable → provision&lt;/text&gt;
        &lt;text x=&quot;0&quot; y=&quot;68&quot; font-size=&quot;12&quot; fill=&quot;var(--soft)&quot;&gt;Asset (inflow)&lt;/text&gt;
        &lt;rect x=&quot;0&quot; y=&quot;74&quot; width=&quot;350&quot; height=&quot;22&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;rect x=&quot;350&quot; y=&quot;74&quot; width=&quot;315&quot; height=&quot;22&quot; fill=&quot;var(--sla-bg)&quot;/&gt;&lt;rect x=&quot;665&quot; y=&quot;74&quot; width=&quot;35&quot; height=&quot;22&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;
        &lt;text x=&quot;175&quot; y=&quot;90&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;nothing&lt;/text&gt;&lt;text x=&quot;507&quot; y=&quot;90&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;probable → disclose&lt;/text&gt;&lt;text x=&quot;682&quot; y=&quot;90&quot; font-size=&quot;9&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;v.c.&lt;/text&gt;
        &lt;text x=&quot;350&quot; y=&quot;112&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--soft)&quot;&gt;50%&lt;/text&gt;&lt;text x=&quot;35&quot; y=&quot;112&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--soft)&quot;&gt;~5%&lt;/text&gt;&lt;text x=&quot;665&quot; y=&quot;112&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--soft)&quot;&gt;~95%&lt;/text&gt;
        &lt;line id=&quot;probL&quot; x1=&quot;315&quot; x2=&quot;315&quot; y1=&quot;16&quot; y2=&quot;100&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;result&quot; id=&quot;probRes&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;beyond the slides&lt;/span&gt;IAS 37 defines only “probable” (&amp;gt;50%). The thresholds of ~5% for &lt;em&gt;remote&lt;/em&gt; and ~95% for &lt;em&gt;virtually certain&lt;/em&gt; are teaching/practice conventions, not figures from the standard: in reality, professional judgement is what counts.&lt;/p&gt;
    &lt;/div&gt;

    &lt;h4&gt;Condition 3 — reliable estimate &lt;span class=&quot;small&quot;&gt;(paras 25–26)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;&lt;strong&gt;Measurement uncertainty does not normally prevent recognition.&lt;/strong&gt; IAS 37 presumes that, except in extremely rare cases, the entity can determine a range of possible outcomes and make an estimate that is sufficiently reliable.&lt;/p&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Extremely rare case: no reliable estimate → no provision → disclosure as a contingent liability.&lt;/div&gt;

    &lt;h4&gt;Interactive decision tree&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slides&lt;/span&gt;“A decision tree for every case”: recognition first, then the journal entry. Answer the questions.&lt;/p&gt;
    &lt;div class=&quot;lab&quot; id=&quot;tree&quot;&gt;
      &lt;h4&gt;What do I do with this case?&lt;/h4&gt;
      &lt;p id=&quot;treeQ&quot; style=&quot;font-family:var(--serif);font-size:1.2rem&quot;&gt;&lt;/p&gt;
      &lt;div class=&quot;btnrow&quot; id=&quot;treeB&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;result&quot; id=&quot;treeR&quot; hidden&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot; id=&quot;treePath&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 760 210&quot; role=&quot;img&quot; aria-label=&quot;Static decision tree&quot;&gt;
      &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;
        &lt;rect x=&quot;5&quot; y=&quot;10&quot; width=&quot;170&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--ocr-bg)&quot; stroke=&quot;var(--ocr)&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;32&quot;&gt;Present obligation&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;48&quot;&gt;from a past event?&lt;/text&gt;
        &lt;rect x=&quot;200&quot; y=&quot;10&quot; width=&quot;150&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--ocr-bg)&quot; stroke=&quot;var(--ocr)&quot;/&gt;&lt;text x=&quot;275&quot; y=&quot;40&quot;&gt;Probable outflow?&lt;/text&gt;
        &lt;rect x=&quot;375&quot; y=&quot;10&quot; width=&quot;150&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--ocr-bg)&quot; stroke=&quot;var(--ocr)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;40&quot;&gt;Reliable estimate?&lt;/text&gt;
        &lt;rect x=&quot;560&quot; y=&quot;10&quot; width=&quot;190&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;&lt;text x=&quot;655&quot; y=&quot;40&quot; font-weight=&quot;700&quot;&gt;YES → PROVISION&lt;/text&gt;
        &lt;path d=&quot;M175,35 h22 M350,35 h22 M525,35 h32&quot; stroke=&quot;var(--soft)&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;
        &lt;path d=&quot;M90,60 v40 M275,60 v40 M450,60 v40&quot; stroke=&quot;var(--brk)&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;
        &lt;text x=&quot;100&quot; y=&quot;85&quot; fill=&quot;var(--brk)&quot; font-size=&quot;11&quot;&gt;NO&lt;/text&gt;&lt;text x=&quot;285&quot; y=&quot;85&quot; fill=&quot;var(--brk)&quot; font-size=&quot;11&quot;&gt;NO&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;85&quot; fill=&quot;var(--brk)&quot; font-size=&quot;11&quot;&gt;NO&lt;/text&gt;
        &lt;rect x=&quot;5&quot; y=&quot;104&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;128&quot;&gt;Possible obligation?&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;145&quot;&gt;Contingent liability&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;161&quot;&gt;(unless remote)&lt;/text&gt;
        &lt;rect x=&quot;200&quot; y=&quot;104&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;&lt;text x=&quot;275&quot; y=&quot;128&quot;&gt;No provision&lt;/text&gt;&lt;text x=&quot;275&quot; y=&quot;145&quot;&gt;Contingent liability&lt;/text&gt;&lt;text x=&quot;275&quot; y=&quot;161&quot;&gt;unless remote&lt;/text&gt;
        &lt;rect x=&quot;375&quot; y=&quot;104&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;128&quot;&gt;Extremely rare&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;145&quot;&gt;No provision;&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;161&quot;&gt;contingent liability&lt;/text&gt;
        &lt;text x=&quot;380&quot; y=&quot;200&quot; fill=&quot;var(--soft)&quot; font-style=&quot;italic&quot;&gt;IAS 37 is first a recognition problem, then a measurement problem.&lt;/text&gt;
