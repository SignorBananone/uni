      &lt;rect x=&quot;260&quot; y=&quot;12&quot; width=&quot;210&quot; height=&quot;84&quot; rx=&quot;12&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;&lt;text x=&quot;365&quot; y=&quot;40&quot; font-weight=&quot;700&quot;&gt;Ma nessun past event&lt;/text&gt;&lt;text x=&quot;365&quot; y=&quot;60&quot;&gt;le azioni operative future&lt;/text&gt;&lt;text x=&quot;365&quot; y=&quot;77&quot;&gt;restano evitabili&lt;/text&gt;
      &lt;rect x=&quot;515&quot; y=&quot;12&quot; width=&quot;200&quot; height=&quot;84&quot; rx=&quot;12&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;&lt;text x=&quot;615&quot; y=&quot;40&quot; font-weight=&quot;700&quot;&gt;Past emissions&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;60&quot;&gt;possono far scattare&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;77&quot;&gt;una provision&lt;/text&gt;
      &lt;path d=&quot;M216,54 h41 M471,54 h41&quot; stroke=&quot;var(--soft)&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;/g&gt;
    &lt;/svg&gt;&lt;/figure&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Un impegno può essere credibile e tuttavia &lt;strong&gt;fallire il test del past event&lt;/strong&gt; alla data in cui è annunciato.&lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;In pratica: il costo per &lt;em&gt;ridurre&lt;/em&gt; le emissioni future (nuovi impianti, processi) non è una provision, perché evitabile. Se invece l&#x27;impresa si è impegnata a &lt;em&gt;compensare&lt;/em&gt; le emissioni e queste sono già avvenute, ogni tonnellata emessa è un obligating event. &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;Il Comitato ha concluso che IAS 37 offre una base adeguata e non ha avviato un progetto normativo — &lt;a href=&quot;https://www.ifrs.org/projects/work-plan/climate-related-commitments-ias-37/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, Climate-related Commitments (IAS 37)&lt;/a&gt;.&lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s9&quot;&gt;
    &lt;h3&gt;9 · Disclosure e metodo &lt;span class=&quot;par&quot;&gt;par. 84–92&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Per ogni classe di provision&lt;/h4&gt;&lt;ul class=&quot;tight&quot;&gt;
        &lt;li&gt;Valore contabile di apertura e chiusura&lt;/li&gt;&lt;li&gt;Accantonamenti, utilizzi e reversal&lt;/li&gt;&lt;li&gt;Effetto dell&#x27;unwinding e dei cambi di tasso&lt;/li&gt;&lt;li&gt;Natura dell&#x27;obbligazione e timing atteso&lt;/li&gt;&lt;li&gt;Incertezze e ipotesi principali&lt;/li&gt;&lt;li&gt;Rimborsi attesi&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Contingencies&lt;/h4&gt;&lt;ul class=&quot;tight&quot;&gt;
        &lt;li&gt;&lt;strong&gt;Contingent liabilities&lt;/strong&gt;: natura, effetto finanziario stimato, incertezze, possibili rimborsi — salvo outflow remote&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Contingent assets&lt;/strong&gt;: disclosure quando l&#x27;inflow è probabile&lt;/li&gt;
        &lt;li&gt;In casi estremamente rari si possono omettere dettagli &lt;strong&gt;seriously prejudicial&lt;/strong&gt; (gravemente pregiudizievoli, es. in una causa in corso), ma si indicano natura generale e motivo&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Esempio di prospetto di movimentazione in nota (valori in € migliaia):&lt;/p&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Movimento&lt;/th&gt;&lt;th&gt;Garanzie&lt;/th&gt;&lt;th&gt;Ripristino siti&lt;/th&gt;&lt;th&gt;Contenziosi&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Saldo iniziale&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;td&gt;614&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;+ Accantonamenti&lt;/td&gt;&lt;td&gt;40&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;300&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;− Utilizzi&lt;/td&gt;&lt;td&gt;(35)&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;− Reversal&lt;/td&gt;&lt;td&gt;(10)&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;+ Unwinding&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;31&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Saldo finale&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;115&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;645&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;300&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;La disclosure è il punto in cui IAS 37 trasforma l&#x27;incertezza in informazione utile per gli investitori.&lt;/div&gt;

    &lt;h4 id=&quot;tre-domande&quot;&gt;Tre domande da fare in aula&lt;/h4&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;1. Che cosa è successo prima della chiusura?&lt;/h4&gt;&lt;p&gt;Identifica l&#x27;obligating event.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;2. L&#x27;entità può ancora evitare l&#x27;uscita?&lt;/h4&gt;&lt;p&gt;Distingui present obligation da intenzione futura.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;3. Come riflettere l&#x27;incertezza?&lt;/h4&gt;&lt;p&gt;Soglia di recognition, probabilità, measurement e disclosure.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;Secondo le slide, queste domande rendono lo standard più facile da insegnare che leggere i paragrafi in sequenza.&lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s10&quot;&gt;
    &lt;h3&gt;10 · Sviluppi in corso (non ancora in vigore) &lt;span class=&quot;par&quot;&gt;IASB project – 2026&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;IAS 37 è oggetto del progetto IASB &lt;strong&gt;«Provisions—Targeted Improvements»&lt;/strong&gt;. Lo standard esistente resta in vigore.&lt;/p&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Recognition&lt;/h4&gt;&lt;p&gt;Chiarire quando nasce una present obligation, inclusi i &lt;span class=&quot;t&quot;&gt;levies&lt;/span&gt; e obbligazioni simili.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Costs&lt;/h4&gt;&lt;p&gt;Chiarire quali costi includere nella misura di alcune obbligazioni.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Discount rate&lt;/h4&gt;&lt;p&gt;Maggiore coerenza nell&#x27;attualizzazione delle provision di lungo periodo.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;A settembre 2026 si tratta di proposte/riesami (&lt;em&gt;redeliberations&lt;/em&gt;), non di requisiti da applicare. Il work plan IASB indica come prossima tappa gli emendamenti definitivi.&lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;I &lt;em&gt;levies&lt;/em&gt; sono tributi imposti dallo Stato diversi dalle imposte sul reddito (es. contributi a fondi di risoluzione bancaria); oggi sono trattati dall&#x27;interpretazione IFRIC 21.&lt;/p&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;L&#x27;Exposure Draft è stato pubblicato il 12 novembre 2024 (commenti fino al 12 marzo 2025). Secondo l&#x27;aggiornamento IASB per il CMAC di novembre 2026, gli emendamenti definitivi sono ora attesi nel &lt;strong&gt;primo semestre 2027&lt;/strong&gt; — &lt;a href=&quot;https://www.ifrs.org/projects/work-plan/provisions/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, Provisions—Targeted Improvements&lt;/a&gt;; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/meetings/2026/november/cmac/ap1-iasb-update.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IASB Update, CMAC novembre 2026 (PDF)&lt;/a&gt;. Verifica sempre lo stato aggiornato sulla pagina del progetto.&lt;/p&gt;
  &lt;/section&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte D&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Una divisione perderà €2 milioni l&#x27;anno prossimo. Provision?&lt;/summary&gt;&lt;div&gt;No: niente provision per future operating losses. Valuta invece se le attività della divisione sono impaired secondo IAS 36.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Contratto: ricavi €300, costi per adempiere €380, penale €100. Provision?&lt;/summary&gt;&lt;div&gt;Perdita se adempio: €80; penale: €100. Least net cost = &lt;strong&gt;€80&lt;/strong&gt; (prima si verifica l&#x27;impairment delle attività dedicate).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Il CdA delibera la chiusura di uno stabilimento il 15 dicembre; l&#x27;annuncio ai dipendenti avviene il 10 gennaio. Provision al 31/12?&lt;/summary&gt;&lt;div&gt;No: alla chiusura manca la valid expectation (né avvio dell&#x27;implementazione, né annuncio). Al massimo è un evento successivo da descrivere in nota.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Con il cost model, dove va l&#x27;aumento di stima di una decommissioning provision?&lt;/summary&gt;&lt;div&gt;Si aggiunge al costo dell&#x27;attività collegata (IFRIC 1) e si ammortizza sulla vita residua.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;5. Un&#x27;impresa annuncia «net zero entro il 2040». Deve rilevare oggi il costo dei nuovi impianti puliti?&lt;/summary&gt;&lt;div&gt;No: anche se l&#x27;annuncio può creare una constructive obligation, quei costi riguardano azioni future evitabili; manca il past event.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;6. Si possono omettere tutte le informazioni su una causa per non danneggiarsi?&lt;/summary&gt;&lt;div&gt;Solo in casi estremamente rari si omettono i dettagli gravemente pregiudizievoli, ma vanno comunque indicati la natura generale della controversia e il motivo dell&#x27;omissione.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;part&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;section class=&quot;topic&quot; id=&quot;approfondire&quot;&gt;
    &lt;h3 style=&quot;border-top-color:var(--acc)&quot;&gt;Per approfondire&lt;/h3&gt;
    &lt;p&gt;Riferimenti citati nelle slide (slide 34 e nel testo). Tutte le descrizioni e i link qui sotto sono &lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;: provengono da ricerche web, non dalle slide.&lt;/p&gt;
    &lt;div class=&quot;ext-list&quot;&gt;
      &lt;div&gt;&lt;h4&gt;IAS 37 — Provisions, Contingent Liabilities and Contingent Assets (IFRS Foundation)&lt;/h4&gt;
        &lt;p&gt;Pagina ufficiale dello standard: testo, sintesi, materiale di supporto all&#x27;applicazione (illustrative examples, decision tree non vincolante). &lt;span class=&quot;why&quot;&gt;Conta perché è il riferimento normativo primario: i numeri di paragrafo delle slide rimandano a questo testo.&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-37-provisions-contingent-liabilities-and-contingent-assets.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IAS 37&lt;/a&gt; · sintesi e storia: &lt;a href=&quot;https://www.iasplus.com/standard/ias37.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;Commission Regulation (EU) 2023/1803&lt;/h4&gt;
        &lt;p&gt;Regolamento del 13 agosto 2023 che adotta in un unico testo consolidato i principi contabili internazionali ai sensi del Reg. (CE) 1606/2002; l&#x27;allegato contiene anche IAS 37. È stato poi modificato (es. Reg. (UE) 2026/338 per IFRS 18). &lt;span class=&quot;why&quot;&gt;Conta perché in UE IAS 37 si applica nella versione omologata: le slide citano il testo consolidato all&#x27;8 marzo 2026.&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2023/1803/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex — Reg. (UE) 2023/1803&lt;/a&gt; · &lt;a href=&quot;https://www.efta.int/eea-lex/32023r1803&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda EEA-Lex (EFTA)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;IFRS Interpretations Committee — Climate-related Commitments (IAS 37), Agenda Decision, aprile 2024&lt;/h4&gt;
        &lt;p&gt;Il Comitato ha esaminato quando un impegno pubblico a ridurre o compensare le emissioni genera una provision; ha concluso i lavori a marzo 2024 e lo IASB non si è opposto ad aprile 2024. Conclusione: IAS 37 fornisce una base adeguata, niente progetto normativo. &lt;span class=&quot;why&quot;&gt;Conta come esempio ufficiale di applicazione del test constructive obligation + past event; le agenda decision non sono vincolanti ma molto persuasive nella prassi.&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/projects/work-plan/climate-related-commitments-ias-37/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — progetto Climate-related Commitments&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/news-and-events/updates/ifric/2024/ifric-update-march-2024/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRIC Update marzo 2024&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;IASB — Provisions—Targeted Improvements&lt;/h4&gt;
        &lt;p&gt;Progetto di manutenzione di IAS 37: Exposure Draft del 12 novembre 2024 su tre aspetti (requisito della present obligation, costi da includere, tasso di sconto). Nel 2026 è in fase di redeliberation; nei documenti di fine 2026 gli emendamenti definitivi sono attesi nel primo semestre 2027. &lt;span class=&quot;why&quot;&gt;Conta perché cambierà alcune regole viste a lezione: per ora resta in vigore il testo attuale.&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/projects/work-plan/provisions/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — pagina del progetto&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/news/2026/07/work-plan-analysis&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus — analisi del work plan (giugno 2026)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;IFRIC 1 — Changes in Existing Decommissioning, Restoration and Similar Liabilities&lt;/h4&gt;
        &lt;p&gt;Interpretazione emessa nel maggio 2004: regola le variazioni di una passività di smantellamento dovute a revisioni di timing/importo dei costi o a cambiamenti del tasso di sconto di mercato. Con il cost model le variazioni rettificano il costo dell&#x27;attività; con il revaluation model passano per OCI/riserva di rivalutazione. &lt;span class=&quot;why&quot;&gt;Conta perché completa IAS 37 nel caso, molto frequente in esame, delle decommissioning provisions.&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifric-1-changes-in-existing-decommissioning-restoration-and-similar-liabilities.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IFRIC 1&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/standards/ifric/ifric1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus — IFRIC 1&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;Standard collegati citati nelle slide: IAS 36 e IAS 16&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;IAS 36 — Impairment of Assets&lt;/strong&gt;: impedisce di iscrivere attività sopra il loro recoverable amount (maggiore tra fair value less costs of disposal e value in use); è dove finiscono le perdite operative future e l&#x27;impairment da fare prima di un onerous contract. &lt;strong&gt;IAS 16 — Property, Plant and Equipment&lt;/strong&gt;: include nel costo iniziale la stima dei costi di smantellamento e ripristino, la cui misura segue IAS 37. &lt;span class=&quot;why&quot;&gt;Contano perché le slide rimandano a questi standard nei punti di confine.&lt;/span&gt;&lt;/p&gt;
        &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.iasplus.com/standard/ias36.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus — IAS 36&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-36-impairment-of-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IAS 36&lt;/a&gt; · &lt;a href=&quot;https://www.crowe.com/vn/insights/ifrs-publication/capitalisation-of-decommissioning-and-restoration-obligations-under-ias-16&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Crowe — capitalizzazione dei costi di ripristino in IAS 16&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;Collegamenti con le altre lezioni: questa pagina cita gli standard a cui la lezione rimanda (IAS 16, IAS 36, IFRS 9, IFRS 15, IAS 19…). Gli altri file della cartella &lt;code&gt;corso/&lt;/code&gt; non sono stati consultati per questo riassunto: per i collegamenti puntuali con le altre lezioni fai riferimento al programma del corso.&lt;/p&gt;
  &lt;/section&gt;

(function(){

    var p0=100-p1-p2;
    $(&#x27;wNo&#x27;).textContent=n.toLocaleString(&#x27;it-IT&#x27;);$(&#x27;wP1o&#x27;).textContent=p1+&#x27;%&#x27;;$(&#x27;wC1o&#x27;).textContent=E(c1);$(&#x27;wP2o&#x27;).textContent=p2+&#x27;%&#x27;;$(&#x27;wC2o&#x27;).textContent=E(c2);

    var s=$(&#x27;wBar&#x27;);s.innerHTML=&#x27;&#x27;;
    var segs=[[p0,&#x27;var(--rule)&#x27;,&#x27;nessun difetto &#x27;+p0+&#x27;%&#x27;],[p1,&#x27;var(--sla-bg)&#x27;,&#x27;minore &#x27;+p1+&#x27;%&#x27;],[p2,&#x27;var(--sla)&#x27;,&#x27;grave &#x27;+p2+&#x27;%&#x27;]],x=0;

    s.appendChild(el(&#x27;text&#x27;,{x:0,y:42,&#x27;font-size&#x27;:10,fill:&#x27;var(--soft)&#x27;},&#x27;composizione della popolazione di prodotti&#x27;));
    $(&#x27;wRes&#x27;).innerHTML=&#x27;Costo atteso per prodotto = &#x27;+p1+&#x27;% × &#x27;+E(c1)+&#x27; + &#x27;+p2+&#x27;% × &#x27;+E(c2)+&#x27; = &lt;strong&gt;&#x27;+E(unit)+&#x27;&lt;/strong&gt;&lt;br&gt;Provision = &#x27;+n.toLocaleString(&#x27;it-IT&#x27;)+&#x27; × &#x27;+E(unit)+&#x27; = &lt;span class=&quot;big&quot;&gt;&#x27;+E(tot)+&#x27;&lt;/span&gt;&#x27;;
  });

  // ---- present value chart
  on([&#x27;pvC&#x27;,&#x27;pvN&#x27;,&#x27;pvR&#x27;],function(){
    var C=+$(&#x27;pvC&#x27;).value,n=+$(&#x27;pvN&#x27;).value,r=+$(&#x27;pvR&#x27;).value/100;

    var s=$(&#x27;pvChart&#x27;);s.innerHTML=&#x27;&#x27;;var W=600,H=180,x0=34,bw=(W-x0)/(n+1);
    s.appendChild(el(&#x27;line&#x27;,{x1:x0,y1:H,x2:W+10,y2:H,stroke:&#x27;var(--rule)&#x27;}));
    s.appendChild(el(&#x27;line&#x27;,{x1:x0,y1:H-H*0.95,x2:W+10,y2:H-H*0.95,stroke:&#x27;var(--soft)&#x27;,&#x27;stroke-dasharray&#x27;:&#x27;3 4&#x27;}));
    s.appendChild(el(&#x27;text&#x27;,{x:W+10,y:H-H*0.95-4,&#x27;font-size&#x27;:10,&#x27;text-anchor&#x27;:&#x27;end&#x27;,fill:&#x27;var(--soft)&#x27;},&#x27;C = &#x27;+E(C)));
    var pv0=C/Math.pow(1+r,n),tot=0;

    });});
  });
