    &lt;a href=&quot;#s6&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;400&quot; width=&quot;230&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot;/&gt;&lt;text x=&quot;155&quot; y=&quot;424&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;6 · Rimborsi &amp;amp; revisione&lt;/text&gt;&lt;text x=&quot;155&quot; y=&quot;442&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--soft)&quot;&gt;living estimate&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s7&quot;&gt;&lt;rect x=&quot;300&quot; y=&quot;400&quot; width=&quot;245&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;&lt;text x=&quot;422&quot; y=&quot;424&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;7–8 · Casi specifici&lt;/text&gt;&lt;text x=&quot;422&quot; y=&quot;442&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--soft)&quot;&gt;onerous · restructuring · ripristino · clima&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s9&quot;&gt;&lt;rect x=&quot;645&quot; y=&quot;400&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;12&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;&lt;text x=&quot;755&quot; y=&quot;424&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;9 · Disclosure&lt;/text&gt;&lt;text x=&quot;755&quot; y=&quot;442&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--soft)&quot;&gt;nota integrativa · albero&lt;/text&gt;&lt;/a&gt;
    &lt;a href=&quot;#s10&quot;&gt;&lt;rect x=&quot;650&quot; y=&quot;30&quot; width=&quot;215&quot; height=&quot;64&quot; rx=&quot;12&quot; fill=&quot;none&quot; stroke=&quot;var(--brk)&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text x=&quot;757&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; font-size=&quot;13.5&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;10 · Sviluppi IASB&lt;/text&gt;&lt;text x=&quot;757&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;var(--soft)&quot;&gt;Targeted Improvements&lt;/text&gt;&lt;/a&gt;
    &lt;path d=&quot;M650,62 L598,62&quot; stroke=&quot;var(--brk)&quot; stroke-dasharray=&quot;4 4&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;
    &lt;text x=&quot;603&quot; y=&quot;52&quot; font-size=&quot;10.5&quot; fill=&quot;var(--soft)&quot; font-style=&quot;italic&quot;&gt;rivede&lt;/text&gt;
  &lt;/svg&gt;
  &lt;figcaption&gt;Colori: &lt;span style=&quot;color:var(--sal)&quot;&gt;salvia&lt;/span&gt; = fondamenta · &lt;span style=&quot;color:var(--ocr)&quot;&gt;ocra&lt;/span&gt; = recognition · &lt;span style=&quot;color:var(--sla)&quot;&gt;ardesia&lt;/span&gt; = measurement · &lt;span style=&quot;color:var(--brk)&quot;&gt;mattone&lt;/span&gt; = applicazioni, disclosure e sviluppi.&lt;/figcaption&gt;
  &lt;/figure&gt;
&lt;/section&gt;

&lt;/div&gt;

&lt;!-- ============ PARTE A ============ --&gt;
&lt;div class=&quot;part p-a&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;n&quot;&gt;A&lt;/span&gt;&lt;h2&gt;Fondamenta: di che cosa parla IAS 37&lt;/h2&gt;&lt;/div&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s1&quot;&gt;
    &lt;h3&gt;1 · Obiettivo e ambito di applicazione &lt;span class=&quot;par&quot;&gt;par. 1–9&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;IAS 37 fissa le regole di &lt;span class=&quot;t&quot;&gt;accounting&lt;/span&gt; (rilevazione e misurazione) e di &lt;span class=&quot;t&quot;&gt;disclosure&lt;/span&gt; (informativa in nota) per &lt;strong&gt;obbligazioni e possibili diritti il cui esito è incerto&lt;/strong&gt;.&lt;/p&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;IAS 37 separa due incertezze diverse: l&#x27;incertezza &lt;em&gt;su un&#x27;obbligazione che esiste già&lt;/em&gt; (→ una &lt;span class=&quot;t&quot;&gt;provision&lt;/span&gt;, cioè un fondo passivo) e l&#x27;incertezza &lt;em&gt;sull&#x27;esistenza stessa&lt;/em&gt; dell&#x27;obbligazione (→ spesso una &lt;span class=&quot;t&quot;&gt;contingent liability&lt;/span&gt;, passività potenziale).&lt;/div&gt;

    &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 760 170&quot; role=&quot;img&quot; aria-label=&quot;Due tipi di incertezza&quot;&gt;
      &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;350&quot; height=&quot;130&quot; rx=&quot;14&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;
      &lt;rect x=&quot;400&quot; y=&quot;20&quot; width=&quot;350&quot; height=&quot;130&quot; rx=&quot;14&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sal)&quot; stroke-dasharray=&quot;6 5&quot;/&gt;
      &lt;text x=&quot;185&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;«Devo, ma non so quanto/quando»&lt;/text&gt;
      &lt;text x=&quot;185&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--soft)&quot;&gt;L&#x27;obbligazione c&#x27;è: incertezza su&lt;/text&gt;
      &lt;text x=&quot;185&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--soft)&quot;&gt;timing e/o amount&lt;/text&gt;
      &lt;text x=&quot;185&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;var(--sal)&quot;&gt;→ PROVISION (in bilancio)&lt;/text&gt;
      &lt;text x=&quot;575&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;18&quot; font-weight=&quot;600&quot; fill=&quot;var(--ink)&quot;&gt;«Forse devo, forse no»&lt;/text&gt;
      &lt;text x=&quot;575&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--soft)&quot;&gt;Incertezza sull&#x27;esistenza&lt;/text&gt;
      &lt;text x=&quot;575&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--soft)&quot;&gt;dell&#x27;obbligazione o dell&#x27;uscita&lt;/text&gt;
      &lt;text x=&quot;575&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;var(--sal)&quot;&gt;→ CONTINGENT LIABILITY (in nota)&lt;/text&gt;
    &lt;/svg&gt;
    &lt;/figure&gt;

    &lt;h4&gt;Quando si applica un altro standard&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;IAS 37 è uno standard «residuale»: vale per provisions, contingent liabilities e contingent assets &lt;em&gt;salvo che un altro IFRS abbia regole specifiche&lt;/em&gt;. Usa le linguette per confrontare.&lt;/p&gt;
    &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-tabs&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-tab=&quot;sc1&quot;&gt;IAS 37 si applica&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-tab=&quot;sc2&quot;&gt;Prevale un altro standard&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-tab=&quot;sc3&quot;&gt;Executory contracts&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; id=&quot;sc1&quot;&gt;&lt;ul class=&quot;tight&quot;&gt;
      &lt;li&gt;&lt;strong&gt;Warranties / refunds&lt;/strong&gt; — garanzie sui prodotti, politiche di rimborso.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Litigation / environmental obligations&lt;/strong&gt; — cause legali, bonifiche ambientali.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Restructuring / onerous contracts&lt;/strong&gt; — ristrutturazioni, contratti in perdita.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Decommissioning obligations&lt;/strong&gt; — smantellamento di impianti e ripristino dei siti.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; id=&quot;sc2&quot; hidden&gt;&lt;table&gt;&lt;tr&gt;&lt;th&gt;Materia&lt;/th&gt;&lt;th&gt;Standard&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Financial instruments (es. garanzie finanziarie)&lt;/td&gt;&lt;td&gt;IFRS 9&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Revenue contracts&lt;/td&gt;&lt;td&gt;IFRS 15&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Income taxes / employee benefits&lt;/td&gt;&lt;td&gt;IAS 12 / IAS 19&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Leases / insurance&lt;/td&gt;&lt;td&gt;IFRS 16 / IFRS 17&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Questi standard hanno criteri propri (es. IAS 19 misura il TFR e i piani pensionistici con metodi attuariali): applicare IAS 37 creerebbe doppioni o incoerenze.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; id=&quot;sc3&quot; hidden&gt;&lt;p&gt;&lt;strong&gt;Key exception:&lt;/strong&gt; gli &lt;span class=&quot;t&quot;&gt;executory contracts&lt;/span&gt; sono normalmente fuori da IAS 37 &lt;em&gt;finché non diventano onerous&lt;/em&gt;.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Un &lt;em&gt;executory contract&lt;/em&gt; (contratto ad esecuzione differita) è un contratto in cui nessuna delle parti ha ancora adempiuto, o entrambe hanno adempiuto solo in parte nella stessa misura: es. un ordine d&#x27;acquisto firmato ma non ancora consegnato né pagato. Finché è «in equilibrio» non si rileva nulla; se i costi inevitabili superano i benefici, diventa un &lt;a href=&quot;#onerous&quot;&gt;onerous contract&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s2&quot;&gt;
    &lt;h3&gt;2 · Definizioni chiave &lt;span class=&quot;par&quot;&gt;par. 10–22&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Provision&lt;/h4&gt;&lt;p&gt;Una &lt;strong&gt;liability with uncertain timing or amount&lt;/strong&gt;: passività di scadenza o ammontare incerti. In italiano: «fondo rischi e oneri».&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Legal obligation&lt;/h4&gt;&lt;p&gt;Nasce da &lt;strong&gt;contratto, legislazione o altra operation of law&lt;/strong&gt; (effetto di legge).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Constructive obligation&lt;/h4&gt;&lt;p&gt;Nasce dalle &lt;strong&gt;azioni dell&#x27;entità&lt;/strong&gt; e dalle &lt;strong&gt;valid expectations&lt;/strong&gt; (aspettative legittime) che queste generano nei terzi.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Contingent liability&lt;/h4&gt;&lt;p&gt;È &lt;em&gt;o&lt;/em&gt; una &lt;strong&gt;possible obligation&lt;/strong&gt; (la cui esistenza sarà confermata da eventi futuri incerti), &lt;em&gt;o&lt;/em&gt; una &lt;strong&gt;present obligation non rilevata&lt;/strong&gt; perché l&#x27;uscita non è probabile o l&#x27;importo non è stimabile in modo sufficientemente attendibile.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Contingent asset&lt;/h4&gt;&lt;p&gt;Un &lt;strong&gt;possible asset&lt;/strong&gt; la cui esistenza dipende da eventi futuri incerti &lt;strong&gt;non interamente sotto il controllo&lt;/strong&gt; dell&#x27;entità (es. un risarcimento chiesto in una causa ancora pendente).&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h4&gt;Legal vs constructive obligation&lt;/h4&gt;
    &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-tabs&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-tab=&quot;lc1&quot;&gt;Legal&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-tab=&quot;lc2&quot;&gt;Constructive&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-tab=&quot;lc3&quot;&gt;Esempi a confronto&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; id=&quot;lc1&quot;&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Contractual terms — clausole contrattuali&lt;/li&gt;&lt;li&gt;Legislation or regulation — leggi e regolamenti&lt;/li&gt;&lt;li&gt;Other operation of law — altri effetti di legge (es. responsabilità civile per danni)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; id=&quot;lc2&quot; hidden&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;Past practice, published policy o una dichiarazione sufficientemente specifica&lt;/li&gt;&lt;li&gt;Che crea una &lt;strong&gt;valid expectation&lt;/strong&gt; nelle altre parti che l&#x27;entità si farà carico della responsabilità&lt;/li&gt;&lt;/ul&gt;
      &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;La sola intenzione del management &lt;strong&gt;non basta&lt;/strong&gt;: l&#x27;entità deve aver creato nei terzi l&#x27;aspettativa che accetterà la responsabilità.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; id=&quot;lc3&quot; hidden&gt;&lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Situazione&lt;/th&gt;&lt;th&gt;Tipo&lt;/th&gt;&lt;th&gt;Perché&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Garanzia di 2 anni prevista nel contratto di vendita&lt;/td&gt;&lt;td&gt;Legal&lt;/td&gt;&lt;td&gt;Clausola contrattuale&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Un negozio rimborsa da sempre i clienti insoddisfatti, anche se la legge non lo impone, e lo sanno tutti&lt;/td&gt;&lt;td&gt;Constructive&lt;/td&gt;&lt;td&gt;Prassi consolidata e nota → aspettativa valida&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Legge che impone la bonifica di un terreno già contaminato&lt;/td&gt;&lt;td&gt;Legal&lt;/td&gt;&lt;td&gt;Legislazione&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Il CdA «pensa» di bonificare, ma non l&#x27;ha detto a nessuno&lt;/td&gt;&lt;td&gt;Nessuna&lt;/td&gt;&lt;td&gt;Pura intenzione, nessuna aspettativa nei terzi&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Il caso del negozio richiama gli esempi illustrativi che accompagnano IAS 37 (refunds policy).&lt;/p&gt;&lt;/div&gt;

    &lt;h4&gt;Provision, accrual o contingent liability?&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;Tre oggetti vicini, da non confondere (par. 11–13). Un &lt;span class=&quot;t&quot;&gt;trade payable / accrual&lt;/span&gt; è un debito verso fornitori o un rateo: l&#x27;incertezza è bassa.&lt;/p&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Trade payable / accrual&lt;/th&gt;&lt;th&gt;Provision&lt;/th&gt;&lt;th&gt;Contingent liability&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Present obligation&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Sì&lt;/td&gt;&lt;td&gt;Sì&lt;/td&gt;&lt;td&gt;Possibile, o presente ma non rilevata&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Uncertainty&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Bassa / moderata&lt;/td&gt;&lt;td&gt;Timing e/o amount incerti&lt;/td&gt;&lt;td&gt;Esistenza e/o uscita incerte&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Recognition&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Si rileva&lt;/td&gt;&lt;td&gt;Si rileva se è soddisfatto IAS 37.14&lt;/td&gt;&lt;td&gt;Non si rileva; disclosure salvo remote&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Una provision &lt;strong&gt;non è un «fondo generico per le cattive notizie»&lt;/strong&gt;: è una passività che nasce da una specifica present obligation.&lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Attenzione al lessico: in alcuni ordinamenti la parola «provision» si usa anche per le rettifiche di attivo (es. «provision for doubtful debts»). In IAS 37 indica solo passività; le svalutazioni di crediti stanno in IFRS 9, quelle di immobilizzazioni in IAS 36.&lt;/p&gt;
  &lt;/section&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte A&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Un&#x27;azienda firma un contratto di fornitura a prezzo fisso; nessuna delle parti ha ancora consegnato nulla. Si applica IAS 37?&lt;/summary&gt;&lt;div&gt;No, finché il contratto resta un &lt;em&gt;executory contract&lt;/em&gt; equilibrato. Rientra in IAS 37 solo se diventa &lt;strong&gt;onerous&lt;/strong&gt; (costi inevitabili &amp;gt; benefici attesi).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Qual è la differenza tra legal e constructive obligation?&lt;/summary&gt;&lt;div&gt;La legal nasce da contratto, legge o operation of law; la constructive dal comportamento dell&#x27;entità (prassi, policy pubblicate, dichiarazioni specifiche) che crea una valid expectation nei terzi.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. «Accantoniamo 2 milioni per eventuali problemi futuri.» È una provision IAS 37?&lt;/summary&gt;&lt;div&gt;No. Una provision richiede una &lt;strong&gt;specifica present obligation&lt;/strong&gt; nata da un evento passato; un fondo generico «per le cattive notizie» non è ammesso.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Una garanzia finanziaria rilasciata a favore di una controllata segue IAS 37?&lt;/summary&gt;&lt;div&gt;Di norma no: i financial guarantee contracts sono strumenti finanziari, quindi prevale IFRS 9.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;!-- ============ PARTE B ============ --&gt;
&lt;div class=&quot;part p-b&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;n&quot;&gt;B&lt;/span&gt;&lt;h2&gt;Recognition: rilevare o no?&lt;/h2&gt;&lt;/div&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s3&quot;&gt;
    &lt;h3&gt;3 · Le tre condizioni per rilevare una provision &lt;span class=&quot;par&quot;&gt;par. 14–26&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;Una provision si rileva (&lt;span class=&quot;t&quot;&gt;recognition&lt;/span&gt; = iscrizione nello stato patrimoniale) &lt;strong&gt;solo se valgono tutte e tre&lt;/strong&gt; le condizioni:&lt;/p&gt;
    &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 760 190&quot; role=&quot;img&quot; aria-label=&quot;Tre condizioni in serie&quot;&gt;
      &lt;g font-size=&quot;13&quot; fill=&quot;var(--ink)&quot; text-anchor=&quot;middle&quot;&gt;
        &lt;rect x=&quot;10&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--ocr-bg)&quot; stroke=&quot;var(--ocr)&quot;/&gt;
        &lt;text x=&quot;110&quot; y=&quot;55&quot; class=&quot;serif&quot; font-size=&quot;30&quot; fill=&quot;var(--ocr)&quot;&gt;1&lt;/text&gt;
        &lt;text x=&quot;110&quot; y=&quot;85&quot; font-weight=&quot;700&quot;&gt;Present obligation&lt;/text&gt;
        &lt;text x=&quot;110&quot; y=&quot;105&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;legal o constructive&lt;/text&gt;
        &lt;text x=&quot;110&quot; y=&quot;122&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;da un evento passato&lt;/text&gt;
        &lt;rect x=&quot;280&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--ocr-bg)&quot; stroke=&quot;var(--ocr)&quot;/&gt;
        &lt;text x=&quot;380&quot; y=&quot;55&quot; class=&quot;serif&quot; font-size=&quot;30&quot; fill=&quot;var(--ocr)&quot;&gt;2&lt;/text&gt;
        &lt;text x=&quot;380&quot; y=&quot;85&quot; font-weight=&quot;700&quot;&gt;Probable outflow&lt;/text&gt;
        &lt;text x=&quot;380&quot; y=&quot;105&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;uscita di risorse&lt;/text&gt;
        &lt;text x=&quot;380&quot; y=&quot;122&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;more likely than not&lt;/text&gt;
        &lt;rect x=&quot;550&quot; y=&quot;20&quot; width=&quot;200&quot; height=&quot;120&quot; rx=&quot;14&quot; fill=&quot;var(--ocr-bg)&quot; stroke=&quot;var(--ocr)&quot;/&gt;
        &lt;text x=&quot;650&quot; y=&quot;55&quot; class=&quot;serif&quot; font-size=&quot;30&quot; fill=&quot;var(--ocr)&quot;&gt;3&lt;/text&gt;
        &lt;text x=&quot;650&quot; y=&quot;85&quot; font-weight=&quot;700&quot;&gt;Reliable estimate&lt;/text&gt;
        &lt;text x=&quot;650&quot; y=&quot;105&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;importo stimabile in modo&lt;/text&gt;
        &lt;text x=&quot;650&quot; y=&quot;122&quot; fill=&quot;var(--soft)&quot; font-size=&quot;12&quot;&gt;sufficientemente attendibile&lt;/text&gt;
        &lt;text x=&quot;245&quot; y=&quot;88&quot; font-size=&quot;26&quot; fill=&quot;var(--ocr)&quot;&gt;+&lt;/text&gt;&lt;text x=&quot;515&quot; y=&quot;88&quot; font-size=&quot;26&quot; fill=&quot;var(--ocr)&quot;&gt;+&lt;/text&gt;
        &lt;text x=&quot;380&quot; y=&quot;175&quot; font-size=&quot;13&quot; fill=&quot;var(--soft)&quot; font-style=&quot;italic&quot;&gt;Se anche una sola manca → nessuna provision; il passo successivo può essere la disclosure come contingent liability.&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Scrittura contabile tipica al momento della rilevazione:&lt;/p&gt;
    &lt;div class=&quot;je&quot;&gt;Dr  Expense (conto economico, per natura della spesa)   X
    Cr  Provision (passività)                               X&lt;/div&gt;

    &lt;h4&gt;Condizione 1 — present obligation e past event &lt;span class=&quot;small&quot;&gt;(par. 15–22)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Un evento passato crea una present obligation solo se lascia all&#x27;entità &lt;strong&gt;no realistic alternative&lt;/strong&gt; (nessuna alternativa realistica) all&#x27;adempimento. Questo evento si chiama &lt;span class=&quot;t&quot;&gt;obligating event&lt;/span&gt;.&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;✓ Past event exists&lt;/h4&gt;&lt;p&gt;La contaminazione è già avvenuta e la legge impone di ripristinare il sito. L&#x27;entità non può più evitare la spesa.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;✗ Future action only&lt;/h4&gt;&lt;p&gt;Manutenzione programmata o spese operative future: l&#x27;entità &lt;strong&gt;può ancora evitarle&lt;/strong&gt; (es. vendendo l&#x27;impianto, cambiando attività).&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Lo standard guarda &lt;strong&gt;all&#x27;indietro&lt;/strong&gt;, all&#x27;obligating event, non in avanti al budget del management.&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Esempio: la revisione obbligatoria di un aereo&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Una compagnia aerea deve per legge revisionare i motori ogni 3 anni. Al 31/12 non c&#x27;è provision: la compagnia potrebbe vendere l&#x27;aereo o lasciarlo a terra, quindi la spesa futura è evitabile. Il costo si gestisce invece in IAS 16 (componente di revisione ammortizzato). È uno degli esempi illustrativi classici che accompagnano IAS 37.&lt;/div&gt;&lt;/details&gt;

    &lt;h4&gt;Condizione 2 — probabile, possibile o remoto &lt;span class=&quot;small&quot;&gt;(par. 23–24)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Per IAS 37 &lt;span class=&quot;t&quot;&gt;probable&lt;/span&gt; significa &lt;strong&gt;more likely than not&lt;/strong&gt;: probabilità di uscita superiore al 50%. Per una popolazione ampia di obbligazioni simili (es. garanzie) la probabilità si valuta &lt;strong&gt;per la classe nel suo insieme&lt;/strong&gt;, non articolo per articolo.&lt;/p&gt;

    &lt;div class=&quot;lab&quot;&gt;
      &lt;h4&gt;Laboratorio · sposta la probabilità&lt;/h4&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;probR&quot;&gt;Probabilità dell&#x27;evento (uscita o entrata)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;probR&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;45&quot;&gt;&lt;output id=&quot;probO&quot;&gt;45%&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 700 120&quot; role=&quot;img&quot; aria-label=&quot;Scala di probabilità&quot; style=&quot;margin-top:6px&quot;&gt;
        &lt;text x=&quot;0&quot; y=&quot;14&quot; font-size=&quot;12&quot; fill=&quot;var(--soft)&quot;&gt;Passività (outflow)&lt;/text&gt;
        &lt;rect x=&quot;0&quot; y=&quot;20&quot; width=&quot;35&quot; height=&quot;22&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;rect x=&quot;35&quot; y=&quot;20&quot; width=&quot;315&quot; height=&quot;22&quot; fill=&quot;var(--sla-bg)&quot;/&gt;&lt;rect x=&quot;350&quot; y=&quot;20&quot; width=&quot;350&quot; height=&quot;22&quot; fill=&quot;var(--ocr-bg)&quot; stroke=&quot;var(--ocr)&quot;/&gt;
        &lt;text x=&quot;4&quot; y=&quot;36&quot; font-size=&quot;10&quot; fill=&quot;var(--ink)&quot;&gt;rem.&lt;/text&gt;&lt;text x=&quot;190&quot; y=&quot;36&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;possible → disclose&lt;/text&gt;&lt;text x=&quot;525&quot; y=&quot;36&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;probable → provision&lt;/text&gt;
        &lt;text x=&quot;0&quot; y=&quot;68&quot; font-size=&quot;12&quot; fill=&quot;var(--soft)&quot;&gt;Attività (inflow)&lt;/text&gt;
        &lt;rect x=&quot;0&quot; y=&quot;74&quot; width=&quot;350&quot; height=&quot;22&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;rect x=&quot;350&quot; y=&quot;74&quot; width=&quot;315&quot; height=&quot;22&quot; fill=&quot;var(--sla-bg)&quot;/&gt;&lt;rect x=&quot;665&quot; y=&quot;74&quot; width=&quot;35&quot; height=&quot;22&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;
        &lt;text x=&quot;175&quot; y=&quot;90&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;nulla&lt;/text&gt;&lt;text x=&quot;507&quot; y=&quot;90&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;probable → disclose&lt;/text&gt;&lt;text x=&quot;682&quot; y=&quot;90&quot; font-size=&quot;9&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;v.c.&lt;/text&gt;
        &lt;text x=&quot;350&quot; y=&quot;112&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--soft)&quot;&gt;50%&lt;/text&gt;&lt;text x=&quot;35&quot; y=&quot;112&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--soft)&quot;&gt;~5%&lt;/text&gt;&lt;text x=&quot;665&quot; y=&quot;112&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--soft)&quot;&gt;~95%&lt;/text&gt;
        &lt;line id=&quot;probL&quot; x1=&quot;315&quot; x2=&quot;315&quot; y1=&quot;16&quot; y2=&quot;100&quot; stroke=&quot;var(--acc)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;/svg&gt;
      &lt;div class=&quot;result&quot; id=&quot;probRes&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;IAS 37 definisce solo «probable» (&amp;gt;50%). Le soglie di ~5% per &lt;em&gt;remote&lt;/em&gt; e ~95% per &lt;em&gt;virtually certain&lt;/em&gt; sono convenzioni didattiche/di prassi, non numeri dello standard: nella realtà conta il giudizio professionale.&lt;/p&gt;
    &lt;/div&gt;

    &lt;h4&gt;Condizione 3 — reliable estimate &lt;span class=&quot;small&quot;&gt;(par. 25–26)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;&lt;strong&gt;L&#x27;incertezza di misura di norma non impedisce la rilevazione.&lt;/strong&gt; IAS 37 presume che, salvo casi estremamente rari, l&#x27;entità possa individuare un range di esiti possibili e fare una stima abbastanza attendibile.&lt;/p&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Caso estremamente raro: nessuna stima attendibile → nessuna provision → disclosure come contingent liability.&lt;/div&gt;

    &lt;h4&gt;Albero decisionale interattivo&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;«A decision tree for every case»: prima la recognition, poi la scrittura contabile. Rispondi alle domande.&lt;/p&gt;
    &lt;div class=&quot;lab&quot; id=&quot;tree&quot;&gt;
      &lt;h4&gt;Che cosa faccio con questo caso?&lt;/h4&gt;
      &lt;p id=&quot;treeQ&quot; style=&quot;font-family:var(--serif);font-size:1.2rem&quot;&gt;&lt;/p&gt;
      &lt;div class=&quot;btnrow&quot; id=&quot;treeB&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;result&quot; id=&quot;treeR&quot; hidden&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot; id=&quot;treePath&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 760 210&quot; role=&quot;img&quot; aria-label=&quot;Albero decisionale statico&quot;&gt;
      &lt;g font-size=&quot;12&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;
        &lt;rect x=&quot;5&quot; y=&quot;10&quot; width=&quot;170&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--ocr-bg)&quot; stroke=&quot;var(--ocr)&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;32&quot;&gt;Present obligation&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;48&quot;&gt;from a past event?&lt;/text&gt;
        &lt;rect x=&quot;200&quot; y=&quot;10&quot; width=&quot;150&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--ocr-bg)&quot; stroke=&quot;var(--ocr)&quot;/&gt;&lt;text x=&quot;275&quot; y=&quot;40&quot;&gt;Probable outflow?&lt;/text&gt;
        &lt;rect x=&quot;375&quot; y=&quot;10&quot; width=&quot;150&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--ocr-bg)&quot; stroke=&quot;var(--ocr)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;40&quot;&gt;Reliable estimate?&lt;/text&gt;
        &lt;rect x=&quot;560&quot; y=&quot;10&quot; width=&quot;190&quot; height=&quot;50&quot; rx=&quot;10&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;&lt;text x=&quot;655&quot; y=&quot;40&quot; font-weight=&quot;700&quot;&gt;YES → PROVISION&lt;/text&gt;
        &lt;path d=&quot;M175,35 h22 M350,35 h22 M525,35 h32&quot; stroke=&quot;var(--soft)&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;
        &lt;path d=&quot;M90,60 v40 M275,60 v40 M450,60 v40&quot; stroke=&quot;var(--brk)&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;/&gt;
        &lt;text x=&quot;100&quot; y=&quot;85&quot; fill=&quot;var(--brk)&quot; font-size=&quot;11&quot;&gt;NO&lt;/text&gt;&lt;text x=&quot;285&quot; y=&quot;85&quot; fill=&quot;var(--brk)&quot; font-size=&quot;11&quot;&gt;NO&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;85&quot; fill=&quot;var(--brk)&quot; font-size=&quot;11&quot;&gt;NO&lt;/text&gt;
        &lt;rect x=&quot;5&quot; y=&quot;104&quot; width=&quot;170&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;&lt;text x=&quot;90&quot; y=&quot;128&quot;&gt;Possible obligation?&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;145&quot;&gt;Contingent liability&lt;/text&gt;&lt;text x=&quot;90&quot; y=&quot;161&quot;&gt;(salvo remote)&lt;/text&gt;
        &lt;rect x=&quot;200&quot; y=&quot;104&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;&lt;text x=&quot;275&quot; y=&quot;128&quot;&gt;No provision&lt;/text&gt;&lt;text x=&quot;275&quot; y=&quot;145&quot;&gt;Contingent liability&lt;/text&gt;&lt;text x=&quot;275&quot; y=&quot;161&quot;&gt;salvo remote&lt;/text&gt;
        &lt;rect x=&quot;375&quot; y=&quot;104&quot; width=&quot;150&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;128&quot;&gt;Extremely rare&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;145&quot;&gt;No provision;&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;161&quot;&gt;contingent liability&lt;/text&gt;
        &lt;text x=&quot;380&quot; y=&quot;200&quot; fill=&quot;var(--soft)&quot; font-style=&quot;italic&quot;&gt;IAS 37 è prima un problema di recognition, poi di measurement.&lt;/text&gt;
      &lt;/g&gt;
    &lt;/svg&gt;
    &lt;/figure&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s4&quot;&gt;
    &lt;h3&gt;4 · Contingent liabilities e contingent assets &lt;span class=&quot;par&quot;&gt;par. 27–35&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h4 style=&quot;margin-top:0&quot;&gt;Contingent liabilities &lt;span class=&quot;small&quot;&gt;(par. 27–30)&lt;/span&gt;&lt;/h4&gt;
        &lt;p&gt;&lt;strong&gt;Non si rilevano&lt;/strong&gt; nello &lt;span class=&quot;t&quot;&gt;statement of financial position&lt;/span&gt; (stato patrimoniale).&lt;/p&gt;
        &lt;ul class=&quot;tight&quot;&gt;
          &lt;li&gt;&lt;strong&gt;Possible obligation&lt;/strong&gt;: l&#x27;esistenza dipende da eventi futuri incerti.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Present obligation&lt;/strong&gt; ma uscita non probabile, o importo non misurabile attendibilmente.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Disclosure&lt;/strong&gt;: obbligatoria salvo che la possibilità di uscita sia &lt;em&gt;remote&lt;/em&gt;.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Reassessment&lt;/strong&gt;: se l&#x27;uscita diventa probabile, si rileva una provision &lt;em&gt;in quell&#x27;esercizio&lt;/em&gt; (non retroattivamente).&lt;/li&gt;
        &lt;/ul&gt;
        &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;«Non rilevato» non vuol dire «non importante»: le contingent liabilities sono cruciali per capire il rischio.&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h4 style=&quot;margin-top:0&quot;&gt;Contingent assets &lt;span class=&quot;small&quot;&gt;(par. 31–35)&lt;/span&gt;&lt;/h4&gt;
        &lt;figure class=&quot;fig&quot; style=&quot;margin:6px 0&quot;&gt;
        &lt;svg viewBox=&quot;0 0 360 120&quot; role=&quot;img&quot; aria-label=&quot;Scala dei contingent assets&quot;&gt;
          &lt;g font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;
          &lt;rect x=&quot;2&quot; y=&quot;10&quot; width=&quot;105&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;54&quot; y=&quot;35&quot; font-weight=&quot;700&quot;&gt;POSSIBLE&lt;/text&gt;&lt;text x=&quot;54&quot; y=&quot;52&quot;&gt;no recognition&lt;/text&gt;&lt;text x=&quot;54&quot; y=&quot;67&quot;&gt;no disclosure&lt;/text&gt;
          &lt;rect x=&quot;127&quot; y=&quot;10&quot; width=&quot;105&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot;/&gt;&lt;text x=&quot;179&quot; y=&quot;35&quot; font-weight=&quot;700&quot;&gt;PROBABLE&lt;/text&gt;&lt;text x=&quot;179&quot; y=&quot;52&quot;&gt;no recognition&lt;/text&gt;&lt;text x=&quot;179&quot; y=&quot;67&quot;&gt;disclose&lt;/text&gt;
          &lt;rect x=&quot;252&quot; y=&quot;10&quot; width=&quot;105&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;&lt;text x=&quot;304&quot; y=&quot;35&quot; font-weight=&quot;700&quot;&gt;VIRTUALLY&lt;/text&gt;&lt;text x=&quot;304&quot; y=&quot;50&quot; font-weight=&quot;700&quot;&gt;CERTAIN&lt;/text&gt;&lt;text x=&quot;304&quot; y=&quot;67&quot;&gt;recognise&lt;/text&gt;
          &lt;path d=&quot;M108,45 h17 M233,45 h17&quot; stroke=&quot;var(--soft)&quot; marker-end=&quot;url(#ar)&quot;/&gt;
          &lt;text x=&quot;180&quot; y=&quot;105&quot; fill=&quot;var(--soft)&quot; font-style=&quot;italic&quot;&gt;più la certezza cresce, più si «esce» dalla nota&lt;/text&gt;&lt;/g&gt;
        &lt;/svg&gt;&lt;/figure&gt;
        &lt;p&gt;Quando l&#x27;entrata è &lt;span class=&quot;t&quot;&gt;virtually certain&lt;/span&gt; (praticamente certa), l&#x27;attività &lt;strong&gt;non è più contingent&lt;/strong&gt; e si rilevano asset e income.&lt;/p&gt;
        &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;L&#x27;asimmetria è voluta: i guadagni incerti non si rilevano prima che siano virtually certain. Ma &lt;span class=&quot;t&quot;&gt;prudence&lt;/span&gt; negli IFRS non significa sottostima sistematica: significa &lt;strong&gt;cautela in condizioni di incertezza&lt;/strong&gt;.&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Il Conceptual Framework IASB (2018) definisce la prudenza proprio come «esercizio di cautela» al servizio della &lt;em&gt;neutrality&lt;/em&gt; (neutralità): non autorizza a sottostimare attività né a gonfiare passività.&lt;/p&gt;

    &lt;h4&gt;Recognition map &lt;span class=&quot;small&quot;&gt;(par. 14, 27–35)&lt;/span&gt;&lt;/h4&gt;
    &lt;div class=&quot;tblwrap&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Situazione&lt;/th&gt;&lt;th&gt;Statement of financial position&lt;/th&gt;&lt;th&gt;Notes&lt;/th&gt;&lt;th&gt;Soglia chiave&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Provision&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Rileva la passività&lt;/td&gt;&lt;td&gt;Movimenti e incertezze&lt;/td&gt;&lt;td&gt;Present obligation + probable outflow + reliable estimate&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Contingent liability&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Non rilevare&lt;/td&gt;&lt;td&gt;Disclose salvo remote&lt;/td&gt;&lt;td&gt;Possible obligation o outflow non probabile&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Contingent asset&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Non rilevare&lt;/td&gt;&lt;td&gt;Disclose se inflow probabile&lt;/td&gt;&lt;td&gt;Possible asset&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Asset non più contingent&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Rileva asset / income&lt;/td&gt;&lt;td&gt;Disclosure IFRS ordinaria&lt;/td&gt;&lt;td&gt;Inflow virtually certain&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Recognition e disclosure sono due domande diverse: &lt;strong&gt;prima decidi la recognition, poi la disclosure&lt;/strong&gt;.&lt;/div&gt;

    &lt;h4&gt;Mini-case: litigation &lt;span class=&quot;small&quot;&gt;(par. 14, 23, 40)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;Un&#x27;azienda è citata per €1 milione. I legali esterni stimano 45% di probabilità di perdere, 55% di vincere. Present obligation? Assumiamo di sì. Outflow probabile? No (45% &amp;lt; 50%). &lt;strong&gt;Conclusione: nessuna provision; disclosure di una contingent liability salvo che l&#x27;uscita sia remote.&lt;/strong&gt;&lt;/p&gt;
    &lt;div class=&quot;lab&quot;&gt;
      &lt;h4&gt;Laboratorio · cambia il parere dei legali&lt;/h4&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;litP&quot;&gt;Probabilità di perdere&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;litP&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;45&quot;&gt;&lt;output id=&quot;litPo&quot;&gt;45%&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;litA&quot;&gt;Importo richiesto&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;litA&quot; min=&quot;100000&quot; max=&quot;3000000&quot; step=&quot;100000&quot; value=&quot;1000000&quot;&gt;&lt;output id=&quot;litAo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;result&quot; id=&quot;litR&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Se la causa diventa probabile, la misura &lt;strong&gt;non&lt;/strong&gt; è «probabilità × importo»: per una singola obbligazione si parte dal &lt;em&gt;most likely outcome&lt;/em&gt; (par. 40). Con 60% di perdere 1 milione, la provision è vicina a 1 milione, non 600.000 — vedi la &lt;a href=&quot;#s5&quot;&gt;Parte C&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte B&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Il CdA approva a dicembre un budget di manutenzione straordinaria per l&#x27;anno prossimo. Provision al 31/12?&lt;/summary&gt;&lt;div&gt;No: è un&#x27;azione futura che l&#x27;entità può ancora evitare. Manca la present obligation da un past event.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Che cosa significa «probable» in IAS 37?&lt;/summary&gt;&lt;div&gt;&lt;em&gt;More likely than not&lt;/em&gt;: probabilità di uscita superiore al 50%.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Un&#x27;impresa stima al 70% di vincere una causa e ottenere €500.000. Che cosa fa?&lt;/summary&gt;&lt;div&gt;È un contingent asset con inflow &lt;strong&gt;probabile&lt;/strong&gt;: nessuna rilevazione, ma disclosure in nota. Si rileverebbe solo se virtually certain.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Una contingent liability diventa probabile nell&#x27;esercizio successivo. Si riapre il bilancio precedente?&lt;/summary&gt;&lt;div&gt;No: si rileva la provision nell&#x27;esercizio in cui avviene il cambiamento di probabilità (reassessment).&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;5. L&#x27;importo è molto incerto (range 2–6 milioni). Si può non rilevare la provision?&lt;/summary&gt;&lt;div&gt;Di norma no: l&#x27;incertezza di misura non impedisce la rilevazione. Si sceglie la best estimate nel range; solo in casi estremamente rari si passa alla disclosure.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;!-- ============ PARTE C ============ --&gt;
&lt;div class=&quot;part p-c&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;n&quot;&gt;C&lt;/span&gt;&lt;h2&gt;Measurement: quanto vale la provision&lt;/h2&gt;&lt;/div&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s5&quot;&gt;
    &lt;h3&gt;5 · Best estimate, rischi e attualizzazione &lt;span class=&quot;par&quot;&gt;par. 36–52&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;La provision si misura alla &lt;span class=&quot;t&quot;&gt;best estimate&lt;/span&gt; (miglior stima) della spesa necessaria per estinguere la present obligation &lt;strong&gt;alla data di bilancio&lt;/strong&gt;.&lt;/p&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;p style=&quot;margin:0;font-family:var(--serif);font-size:1.15rem&quot;&gt;Pensa all&#x27;importo che l&#x27;entità pagherebbe &lt;em&gt;razionalmente&lt;/em&gt; per estinguere l&#x27;obbligazione oggi, o per trasferirla a un terzo.&lt;/p&gt;&lt;/div&gt;
    &lt;ul class=&quot;tight&quot;&gt;
      &lt;li&gt;Si usa il giudizio del management, supportato da esperienza, perizie e dagli &lt;strong&gt;events after the reporting period&lt;/strong&gt; che confermano condizioni già esistenti a fine esercizio.&lt;/li&gt;
      &lt;li&gt;L&#x27;obiettivo è una stima &lt;strong&gt;realistica&lt;/strong&gt;, non un «cuscinetto» deliberatamente conservativo.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Il collegamento è con IAS 10: un evento dopo la chiusura che fornisce prove su condizioni esistenti al 31/12 (es. sentenza emessa a febbraio su una causa già pendente) è un &lt;em&gt;adjusting event&lt;/em&gt; e aggiorna la stima.&lt;/p&gt;

    &lt;h4&gt;Molte obbligazioni vs una sola &lt;span class=&quot;small&quot;&gt;(par. 39–40)&lt;/span&gt;&lt;/h4&gt;
    &lt;div class=&quot;tabs&quot; role=&quot;tablist&quot; data-tabs&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; data-tab=&quot;m1&quot;&gt;Large population&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; data-tab=&quot;m2&quot;&gt;Single obligation&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; id=&quot;m1&quot;&gt;&lt;p&gt;Si usa l&#x27;&lt;span class=&quot;t&quot;&gt;expected value&lt;/span&gt; (valore atteso): si pesano gli esiti possibili per le rispettive probabilità. Esempio tipico: &lt;strong&gt;product warranties&lt;/strong&gt;.&lt;/p&gt;
      &lt;div class=&quot;formula&quot;&gt;Expected value = Σ (probabilità&lt;sub&gt;i&lt;/sub&gt; × costo&lt;sub&gt;i&lt;/sub&gt;) × numero di unità&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;tabpanel&quot; id=&quot;m2&quot; hidden&gt;&lt;p&gt;Il &lt;span class=&quot;t&quot;&gt;most likely outcome&lt;/span&gt; (esito più probabile) può essere la best estimate, ma &lt;strong&gt;vanno considerati anche gli altri esiti possibili&lt;/strong&gt;. Esempio tipico: &lt;strong&gt;una causa legale&lt;/strong&gt;.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Se gli altri esiti sono quasi tutti più alti (o più bassi) del più probabile, la best estimate si sposta verso di loro. Esempio: riparazione di un impianto, esito più probabile €1.000 ma rischio concreto di dover rifare il lavoro → stima &amp;gt; €1.000.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Stesso standard, evidenze diverse: la &lt;span class=&quot;t&quot;&gt;unit of account&lt;/span&gt; (unità di riferimento della misura) cambia il modo in cui l&#x27;incertezza si traduce in numeri.&lt;/div&gt;

    &lt;div class=&quot;lab&quot; id=&quot;warr&quot;&gt;
      &lt;h4&gt;Mini-case: warranty provision &lt;span class=&quot;small&quot;&gt;(par. 24, 39)&lt;/span&gt;&lt;/h4&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;1.000 prodotti venduti con garanzia: 75% nessun difetto (€0), 20% difetto minore (€100), 5% difetto grave (€400). Muovi i cursori.&lt;/p&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;wN&quot;&gt;Prodotti venduti&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wN&quot; min=&quot;100&quot; max=&quot;5000&quot; step=&quot;100&quot; value=&quot;1000&quot;&gt;&lt;output id=&quot;wNo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;wP1&quot;&gt;% difetto minore&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wP1&quot; min=&quot;0&quot; max=&quot;60&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;wP1o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;wC1&quot;&gt;Costo difetto minore&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wC1&quot; min=&quot;0&quot; max=&quot;300&quot; step=&quot;10&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;wC1o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;wP2&quot;&gt;% difetto grave&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wP2&quot; min=&quot;0&quot; max=&quot;30&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;wP2o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;wC2&quot;&gt;Costo difetto grave&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;wC2&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;20&quot; value=&quot;400&quot;&gt;&lt;output id=&quot;wC2o&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 600 46&quot; id=&quot;wBar&quot; role=&quot;img&quot; aria-label=&quot;Composizione probabilità&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;result&quot; id=&quot;wRes&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h4&gt;Risks and uncertainties &lt;span class=&quot;small&quot;&gt;(par. 42–44)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Rischi e incertezze si riflettono nella misura, ma l&#x27;incertezza &lt;strong&gt;non è una licenza per accantonare troppo&lt;/strong&gt;.&lt;/p&gt;
    &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 700 120&quot; role=&quot;img&quot; aria-label=&quot;Bilancia tra sottostima e sovrastima&quot;&gt;
      &lt;line x1=&quot;350&quot; y1=&quot;20&quot; x2=&quot;350&quot; y2=&quot;95&quot; stroke=&quot;var(--soft)&quot;/&gt;
      &lt;polygon points=&quot;335,100 365,100 350,85&quot; fill=&quot;var(--soft)&quot;/&gt;
      &lt;line x1=&quot;90&quot; y1=&quot;40&quot; x2=&quot;610&quot; y2=&quot;40&quot; stroke=&quot;var(--sla)&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;rect x=&quot;40&quot; y=&quot;48&quot; width=&quot;230&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;
      &lt;text x=&quot;155&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;Avoid understatement&lt;/text&gt;
      &lt;text x=&quot;155&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--soft)&quot;&gt;non ignorare gli esiti avversi&lt;/text&gt;
      &lt;rect x=&quot;430&quot; y=&quot;48&quot; width=&quot;230&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot;/&gt;
      &lt;text x=&quot;545&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;Avoid overstatement&lt;/text&gt;
      &lt;text x=&quot;545&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;var(--soft)&quot;&gt;niente hidden reserves&lt;/text&gt;
      &lt;text x=&quot;350&quot; y=&quot;14&quot; text-anchor=&quot;middle&quot; class=&quot;serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;var(--ink)&quot;&gt;neutral · evidence-based · transparent&lt;/text&gt;
    &lt;/svg&gt;&lt;/figure&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Le &lt;em&gt;hidden reserves&lt;/em&gt; (riserve occulte) sono fondi gonfiati in anni buoni e «rilasciati» in anni cattivi per lisciare l&#x27;utile: è la tecnica di &lt;em&gt;earnings management&lt;/em&gt; nota come «cookie jar reserves».&lt;/p&gt;

    &lt;h4&gt;Present value e discounting &lt;span class=&quot;small&quot;&gt;(par. 45–47, 60)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Se l&#x27;effetto del &lt;span class=&quot;t&quot;&gt;time value of money&lt;/span&gt; (valore temporale del denaro) è materiale, la provision si misura al &lt;span class=&quot;t&quot;&gt;present value&lt;/span&gt; (valore attuale).&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Discount rate&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Pre-tax rate&lt;/strong&gt; che riflette le valutazioni correnti di mercato del valore temporale del denaro e i &lt;strong&gt;rischi specifici della passività&lt;/strong&gt;, nella misura in cui non siano già nei flussi.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Subsequent periods&lt;/h4&gt;&lt;p&gt;Il valore contabile &lt;strong&gt;cresce col passare del tempo&lt;/strong&gt;. L&#x27;&lt;span class=&quot;t&quot;&gt;unwinding of the discount&lt;/span&gt; (rilascio dello sconto) si rileva come &lt;strong&gt;borrowing cost&lt;/strong&gt; (onere finanziario).&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Non contare il rischio due volte: o nei flussi attesi, o nel tasso — &lt;strong&gt;non in entrambi&lt;/strong&gt;.&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;PV = C / (1 + r)&lt;sup&gt;n&lt;/sup&gt; &amp;nbsp;&amp;nbsp;·&amp;nbsp;&amp;nbsp; unwinding&lt;sub&gt;t&lt;/sub&gt; = PV&lt;sub&gt;t−1&lt;/sub&gt; × r&lt;/div&gt;

    &lt;div class=&quot;lab&quot; id=&quot;pv&quot;&gt;
      &lt;h4&gt;Laboratorio · la provision che cresce nel tempo&lt;/h4&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pvC&quot;&gt;Esborso futuro (C)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pvC&quot; min=&quot;100000&quot; max=&quot;3000000&quot; step=&quot;50000&quot; value=&quot;1000000&quot;&gt;&lt;output id=&quot;pvCo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pvN&quot;&gt;Anni all&#x27;esborso (n)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pvN&quot; min=&quot;1&quot; max=&quot;20&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;pvNo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;pvR&quot;&gt;Tasso pre-tax (r)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;pvR&quot; min=&quot;0&quot; max=&quot;12&quot; step=&quot;0.5&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;pvRo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 640 230&quot; id=&quot;pvChart&quot; role=&quot;img&quot; aria-label=&quot;Valore contabile della provision per anno&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;result&quot; id=&quot;pvRes&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Le barre mostrano il saldo della provision a fine anno; la parte scura è l&#x27;unwinding dell&#x27;anno (Dr Finance cost / Cr Provision).&lt;/p&gt;
    &lt;/div&gt;

    &lt;h4&gt;Future events e expected asset disposals &lt;span class=&quot;small&quot;&gt;(par. 48–52)&lt;/span&gt;&lt;/h4&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Future events&lt;/h4&gt;&lt;p&gt;Si riflettono nella stima se c&#x27;è &lt;strong&gt;sufficiente evidenza oggettiva&lt;/strong&gt; che si verificheranno. Es.: un cambiamento tecnologico atteso che ridurrà il costo di ripristino.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Expected disposal gains&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Non&lt;/strong&gt; si riduce la provision per i guadagni attesi dalla cessione di attività. La cessione si contabilizza secondo l&#x27;IFRS pertinente.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Stima l&#x27;obbligazione «per quello che è». Non compensare nella passività guadagni attesi non collegati.&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s6&quot;&gt;
    &lt;h3&gt;6 · Reimbursements, revisione e utilizzo &lt;span class=&quot;par&quot;&gt;par. 53–62&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;A volte un terzo (tipicamente un assicuratore o un fornitore) rimborserà in tutto o in parte la spesa.&lt;/p&gt;
    &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 720 110&quot; role=&quot;img&quot; aria-label=&quot;Flusso reimbursement&quot;&gt;
      &lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;
      &lt;rect x=&quot;5&quot; y=&quot;15&quot; width=&quot;200&quot; height=&quot;74&quot; rx=&quot;12&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot;/&gt;&lt;text x=&quot;105&quot; y=&quot;45&quot; font-weight=&quot;700&quot;&gt;PROVISION&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;65&quot;&gt;per l&#x27;intera obbligazione&lt;/text&gt;
      &lt;rect x=&quot;255&quot; y=&quot;15&quot; width=&quot;220&quot; height=&quot;74&quot; rx=&quot;12&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;&lt;text x=&quot;365&quot; y=&quot;40&quot; font-weight=&quot;700&quot;&gt;REIMBURSEMENT ASSET&lt;/text&gt;&lt;text x=&quot;365&quot; y=&quot;58&quot;&gt;separato, solo se&lt;/text&gt;&lt;text x=&quot;365&quot; y=&quot;75&quot;&gt;virtually certain&lt;/text&gt;
      &lt;rect x=&quot;525&quot; y=&quot;15&quot; width=&quot;190&quot; height=&quot;74&quot; rx=&quot;12&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;&lt;text x=&quot;620&quot; y=&quot;50&quot; font-weight=&quot;700&quot; font-size=&quot;15&quot;&gt;Asset ≤ Provision&lt;/text&gt;
      &lt;path d=&quot;M206,52 h46 M476,52 h46&quot; stroke=&quot;var(--soft)&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;/g&gt;
    &lt;/svg&gt;&lt;/figure&gt;
    &lt;p&gt;Nello stato patrimoniale &lt;strong&gt;niente compensazione&lt;/strong&gt; (passività lorda + attività separata); nel conto economico il costo della provision &lt;strong&gt;può&lt;/strong&gt; essere presentato al netto del rimborso.&lt;/p&gt;
    &lt;div class=&quot;lab&quot; id=&quot;reimb&quot;&gt;
      &lt;h4&gt;Laboratorio · polizza assicurativa&lt;/h4&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;rbP&quot;&gt;Provision (obbligazione)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rbP&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;500&quot;&gt;&lt;output id=&quot;rbPo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;rbR&quot;&gt;Rimborso atteso&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;rbR&quot; min=&quot;0&quot; max=&quot;1200&quot; step=&quot;10&quot; value=&quot;300&quot;&gt;&lt;output id=&quot;rbRo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn on&quot; id=&quot;rbVC&quot; type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;Rimborso virtually certain: sì&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;result&quot; id=&quot;rbRes&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h4&gt;Review and use of provisions &lt;span class=&quot;small&quot;&gt;(par. 59–62)&lt;/span&gt;&lt;/h4&gt;
    &lt;div class=&quot;grid3&quot;&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Review&lt;/h4&gt;&lt;p&gt;A ogni data di bilancio la provision si aggiorna alla best estimate corrente.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Reverse&lt;/h4&gt;&lt;p&gt;Se l&#x27;uscita non è più probabile, la provision si storna (&lt;span class=&quot;t&quot;&gt;reversal&lt;/span&gt;, con provento a conto economico).&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;h4&gt;Use&lt;/h4&gt;&lt;p&gt;Si imputa alla provision &lt;strong&gt;solo&lt;/strong&gt; la spesa per cui era stata creata.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Una provision è una &lt;strong&gt;«living estimate»&lt;/strong&gt;: cambia con le evidenze, ma non può essere riciclata per gestire gli utili.&lt;/div&gt;
    &lt;details&gt;&lt;summary&gt;Esempio: perché non si può «riciclare» un fondo&lt;/summary&gt;&lt;div&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Un fondo garanzia di €40.000 risulta eccessivo: ne servono €25.000. Non si può usare l&#x27;eccedenza di €15.000 per pagare una multa ambientale non accantonata (il costo della multa non apparirebbe a conto economico). Si fa il reversal di €15.000 e si rileva separatamente il costo della multa.&lt;/div&gt;&lt;/details&gt;
  &lt;/section&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte C&lt;/h3&gt;
    &lt;details&gt;&lt;summary&gt;1. Perché per le garanzie si usa il valore atteso e per una causa il most likely outcome?&lt;/summary&gt;&lt;div&gt;Con molte obbligazioni simili, la legge dei grandi numeri rende la media ponderata una stima affidabile del totale. Con una sola obbligazione l&#x27;esito sarà uno solo: la media potrebbe non corrispondere a nessun esito reale, quindi si parte dal più probabile considerando gli altri.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;2. Esborso di €500.000 tra 4 anni, tasso pre-tax 6%. Valore iniziale e unwinding del primo anno?&lt;/summary&gt;&lt;div&gt;PV = 500.000 / 1,06⁴ ≈ &lt;strong&gt;€396.047&lt;/strong&gt;. Unwinding anno 1 ≈ 396.047 × 6% ≈ &lt;strong&gt;€23.763&lt;/strong&gt;, rilevato come borrowing cost.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;3. Il rischio è già incluso nei flussi (scenari pessimistici pesati). Che tasso uso?&lt;/summary&gt;&lt;div&gt;Un tasso che &lt;strong&gt;non&lt;/strong&gt; includa di nuovo quel rischio (tipicamente vicino al risk-free): altrimenti il rischio sarebbe contato due volte.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;4. Provision di €800, rimborso assicurativo virtually certain di €900. Quanto è l&#x27;attività?&lt;/summary&gt;&lt;div&gt;Al massimo €800: il reimbursement asset non può superare la provision.&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;5. Una provision per bonifica può essere ridotta del prezzo atteso dalla vendita del terreno?&lt;/summary&gt;&lt;div&gt;No: i guadagni attesi da cessioni non riducono la provision; la vendita segue l&#x27;IFRS pertinente.&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;!-- ============ PARTE D ============ --&gt;
&lt;div class=&quot;part p-d&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;n&quot;&gt;D&lt;/span&gt;&lt;h2&gt;Applicazioni, disclosure e sviluppi&lt;/h2&gt;&lt;/div&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s7&quot;&gt;
    &lt;h3&gt;7 · Perdite future, onerous contracts, restructuring &lt;span class=&quot;par&quot;&gt;par. 63–83&lt;/span&gt;&lt;/h3&gt;

    &lt;h4&gt;Future operating losses &lt;span class=&quot;small&quot;&gt;(par. 63–65)&lt;/span&gt;&lt;/h4&gt;
    &lt;div class=&quot;card tint&quot;&gt;&lt;p style=&quot;margin:0;font-family:var(--serif);font-size:1.25rem;font-weight:600&quot;&gt;NESSUNA provision per perdite operative future.&lt;/p&gt;&lt;/div&gt;
    &lt;p&gt;Perché? Le perdite future, da sole, non sono una present obligation nata da un evento passato: l&#x27;entità potrebbe ancora cambiare strategia o chiudere.&lt;/p&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Le perdite operative attese possono però indicare che le attività sono &lt;strong&gt;impaired&lt;/strong&gt; (svalutate): questo rimanda a &lt;strong&gt;IAS 36&lt;/strong&gt;, non a una provision IAS 37.&lt;/div&gt;

    &lt;h4 id=&quot;onerous&quot; style=&quot;scroll-margin-top:60px&quot;&gt;Onerous contracts &lt;span class=&quot;small&quot;&gt;(par. 66–69, 68A)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Un contratto è &lt;span class=&quot;t&quot;&gt;onerous&lt;/span&gt; quando i &lt;strong&gt;costi inevitabili&lt;/strong&gt; per adempiere superano i &lt;strong&gt;benefici economici attesi&lt;/strong&gt;. La present obligation è il contratto stesso (già firmato).&lt;/p&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Least net cost of exit&lt;/h4&gt;&lt;p&gt;Il &lt;strong&gt;minore&lt;/strong&gt; tra:&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;costo netto di adempimento del contratto&lt;/li&gt;&lt;li&gt;compensazioni / penali per inadempimento&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Cost of fulfilling (par. 68A)&lt;/h4&gt;&lt;p&gt;Comprende sia:&lt;/p&gt;&lt;ul class=&quot;tight&quot;&gt;&lt;li&gt;&lt;strong&gt;incremental costs&lt;/strong&gt; (es. materiali, manodopera diretta)&lt;/li&gt;&lt;li&gt;&lt;strong&gt;allocazione di altri costi direttamente collegati&lt;/strong&gt; (es. quota di ammortamento delle attrezzature usate)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Il par. 68A è stato introdotto con l&#x27;emendamento «Onerous Contracts — Cost of Fulfilling a Contract» (2020), in vigore dal 2022, per chiudere un dibattito: prima alcune imprese includevano solo i costi incrementali.&lt;/p&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Prima di rilevare una provision separata per contratto oneroso, si rileva l&#x27;eventuale &lt;strong&gt;impairment loss&lt;/strong&gt; sulle attività usate per adempiere al contratto.&lt;/div&gt;

    &lt;div class=&quot;lab&quot; id=&quot;oner&quot;&gt;
      &lt;h4&gt;Mini-case: onerous contract &lt;span class=&quot;small&quot;&gt;(slide 23)&lt;/span&gt;&lt;/h4&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;Contratto a prezzo fisso: ricavi €500, costi diretti stimati €560, penale di uscita €40 → provision €40. Prova a cambiare i numeri.&lt;/p&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;onR&quot;&gt;Ricavi del contratto&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;onR&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;500&quot;&gt;&lt;output id=&quot;onRo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;onC&quot;&gt;Costi per adempiere&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;onC&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;560&quot;&gt;&lt;output id=&quot;onCo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;ctrl&quot;&gt;&lt;label for=&quot;onP&quot;&gt;Penale per uscire&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;onP&quot; min=&quot;0&quot; max=&quot;300&quot; step=&quot;5&quot; value=&quot;40&quot;&gt;&lt;output id=&quot;onPo&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;svg viewBox=&quot;0 0 600 120&quot; id=&quot;onChart&quot; role=&quot;img&quot; aria-label=&quot;Confronto tra adempiere e uscire&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;result&quot; id=&quot;onRes&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;L&#x27;obbligazione si misura al &lt;strong&gt;least net cost of exit&lt;/strong&gt;: per questo un onerous contract non è semplicemente «perdita attesa = provision».&lt;/div&gt;

    &lt;h4&gt;Restructuring: quando nasce la provision? &lt;span class=&quot;small&quot;&gt;(par. 70–79)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Un &lt;span class=&quot;t&quot;&gt;restructuring&lt;/span&gt; è un programma pianificato e controllato dal management che cambia in modo significativo il perimetro dell&#x27;attività o il modo in cui è condotta. &lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Esempi: vendita o chiusura di una linea di business, chiusura di sedi, eliminazione di un livello di management, riorganizzazioni profonde.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Serve una constructive obligation, non basta un piano del management.&lt;/strong&gt; Scorri i passi:&lt;/p&gt;
    &lt;div class=&quot;lab stepper&quot;&gt;
      &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;steps&quot;&gt;
        &lt;div&gt;&lt;h4&gt;Passo 1 · Detailed formal plan&lt;/h4&gt;&lt;p&gt;Il piano identifica almeno: &lt;strong&gt;business&lt;/strong&gt; interessato, &lt;strong&gt;locations&lt;/strong&gt;, &lt;strong&gt;employees&lt;/strong&gt; (funzioni e numero approssimativo di dipendenti da compensare), &lt;strong&gt;expenditure&lt;/strong&gt; da sostenere, &lt;strong&gt;timing&lt;/strong&gt; di attuazione.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Solo con il piano siamo ancora nel campo delle intenzioni: &lt;em&gt;nessuna provision&lt;/em&gt;.&lt;/p&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h4&gt;Passo 2 · Valid expectation&lt;/h4&gt;&lt;p&gt;Nei soggetti interessati si crea un&#x27;aspettativa valida perché l&#x27;implementazione &lt;strong&gt;è iniziata&lt;/strong&gt; (es. smantellamento di impianti, vendita di attività) &lt;strong&gt;oppure&lt;/strong&gt; le &lt;strong&gt;caratteristiche principali sono state annunciate&lt;/strong&gt; a chi ne è colpito.&lt;/p&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h4&gt;Passo 3 · Provision recognised&lt;/h4&gt;&lt;p&gt;Ora c&#x27;è una constructive obligation: si rileva la provision, se l&#x27;uscita è probabile e stimabile.&lt;/p&gt;&lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;Una delibera del CdA prima della chiusura &lt;strong&gt;non basta&lt;/strong&gt; se gli interessati non hanno ricevuto una valid expectation entro la chiusura.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h4&gt;Restructuring: che cosa includere? &lt;span class=&quot;small&quot;&gt;(par. 80–83)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;La provision copre le &lt;strong&gt;direct expenditures&lt;/strong&gt; necessariamente connesse alla ristrutturazione e &lt;strong&gt;non associate alle attività che continuano&lt;/strong&gt;. Classifica le voci:&lt;/p&gt;
    &lt;div class=&quot;lab sort&quot; id=&quot;sortR&quot;&gt;
      &lt;h4&gt;Include o exclude?&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li data-a=&quot;in&quot;&gt;&lt;span&gt;Indennità di licenziamento dei dipendenti in esubero&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;in&quot;&gt;Include&lt;/button&gt; &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;out&quot;&gt;Exclude&lt;/button&gt; &lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
        &lt;li data-a=&quot;out&quot;&gt;&lt;span&gt;Formazione del personale che resta (retraining)&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;in&quot;&gt;Include&lt;/button&gt; &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;out&quot;&gt;Exclude&lt;/button&gt; &lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
        &lt;li data-a=&quot;out&quot;&gt;&lt;span&gt;Trasferimento del personale che continua (relocating)&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;in&quot;&gt;Include&lt;/button&gt; &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;out&quot;&gt;Exclude&lt;/button&gt; &lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
        &lt;li data-a=&quot;in&quot;&gt;&lt;span&gt;Penali per la risoluzione anticipata dell&#x27;affitto della sede chiusa&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;in&quot;&gt;Include&lt;/button&gt; &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;out&quot;&gt;Exclude&lt;/button&gt; &lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
        &lt;li data-a=&quot;out&quot;&gt;&lt;span&gt;Campagna di marketing per il nuovo marchio&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;in&quot;&gt;Include&lt;/button&gt; &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;out&quot;&gt;Exclude&lt;/button&gt; &lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
        &lt;li data-a=&quot;out&quot;&gt;&lt;span&gt;Nuovo sistema informativo e nuova rete distributiva&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;in&quot;&gt;Include&lt;/button&gt; &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;out&quot;&gt;Exclude&lt;/button&gt; &lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
        &lt;li data-a=&quot;out&quot;&gt;&lt;span&gt;Perdite operative previste fino alla chiusura&lt;/span&gt;&lt;span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;in&quot;&gt;Include&lt;/button&gt; &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-v=&quot;out&quot;&gt;Exclude&lt;/button&gt; &lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;Le voci «include» di questo esercizio sono esempi di costi diretti di uscita; le «exclude» sono quelle elencate nelle slide.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;La provision copre l&#x27;&lt;strong&gt;uscita dalla vecchia attività&lt;/strong&gt;, non il costo di far funzionare quella nuova.&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;topic&quot; id=&quot;s8&quot;&gt;
    &lt;h3&gt;8 · Obblighi ambientali, decommissioning e clima &lt;span class=&quot;par&quot;&gt;IAS 37 + IFRIC 1 · IFRIC AD 2024&lt;/span&gt;&lt;/h3&gt;
    &lt;p&gt;&lt;span class=&quot;tag sl&quot;&gt;slide&lt;/span&gt;Schema tipico: un&#x27;entità usa oggi un&#x27;attività ma dovrà ripristinare il sito alla fine della vita utile (piattaforme petrolifere, centrali, cave, discariche).&lt;/p&gt;
    &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 720 110&quot; role=&quot;img&quot; aria-label=&quot;Decommissioning flusso&quot;&gt;
      &lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;
      &lt;rect x=&quot;5&quot; y=&quot;12&quot; width=&quot;210&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;38&quot; font-weight=&quot;700&quot;&gt;Past event&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;57&quot;&gt;la costruzione / il disturbo&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;74&quot;&gt;del sito crea l&#x27;obbligazione&lt;/text&gt;
      &lt;rect x=&quot;260&quot; y=&quot;12&quot; width=&quot;210&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--sal-bg)&quot; stroke=&quot;var(--sal)&quot;/&gt;&lt;text x=&quot;365&quot; y=&quot;38&quot; font-weight=&quot;700&quot;&gt;Provision&lt;/text&gt;&lt;text x=&quot;365&quot; y=&quot;57&quot;&gt;present value della&lt;/text&gt;&lt;text x=&quot;365&quot; y=&quot;74&quot;&gt;spesa di ripristino&lt;/text&gt;
      &lt;rect x=&quot;515&quot; y=&quot;12&quot; width=&quot;200&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--brk-bg)&quot; stroke=&quot;var(--brk)&quot;/&gt;&lt;text x=&quot;615&quot; y=&quot;45&quot; font-weight=&quot;700&quot;&gt;Related asset&lt;/text&gt;&lt;text x=&quot;615&quot; y=&quot;65&quot;&gt;IAS 16 (costo dell&#x27;impianto)&lt;/text&gt;
      &lt;path d=&quot;M216,52 h41 M471,52 h41&quot; stroke=&quot;var(--soft)&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;/g&gt;
    &lt;/svg&gt;&lt;/figure&gt;
    &lt;div class=&quot;impact&quot;&gt;&lt;b&gt;Impact&lt;/b&gt;&lt;strong&gt;IFRIC 1&lt;/strong&gt; disciplina le variazioni successive delle passività di decommissioning, restoration e simili. La contabilizzazione può rettificare anche l&#x27;attività collegata, a seconda del modello di misurazione.&lt;/div&gt;

    &lt;p&gt;Segui un esempio numerico passo per passo &lt;span class=&quot;tag ol&quot;&gt;oltre le slide&lt;/span&gt;(numeri inventati per illustrare):&lt;/p&gt;
    &lt;div class=&quot;lab stepper&quot;&gt;
      &lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;steps&quot;&gt;
        &lt;div&gt;&lt;h4&gt;1 gen. anno 1 · Rilevazione iniziale&lt;/h4&gt;&lt;p&gt;Impianto costruito. Ripristino stimato €1.000.000 tra 10 anni, tasso 5%. PV = 1.000.000 / 1,05¹⁰ = &lt;strong&gt;€613.913&lt;/strong&gt;. Il costo di smantellamento entra nel costo dell&#x27;impianto (IAS 16).&lt;/p&gt;&lt;div class=&quot;je&quot;&gt;Dr  Impianto (PP&amp;amp;E)                613.913
    Cr  Decommissioning provision      613.913&lt;/div&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h4&gt;31 dic. anno 1 · Unwinding e ammortamento&lt;/h4&gt;&lt;p&gt;La provision cresce di 613.913 × 5% = &lt;strong&gt;€30.696&lt;/strong&gt; (borrowing cost). La componente capitalizzata si ammortizza in 10 anni: €61.391.&lt;/p&gt;&lt;div class=&quot;je&quot;&gt;Dr  Oneri finanziari               30.696
    Cr  Decommissioning provision       30.696
Dr  Ammortamento                    61.391
    Cr  Fondo ammortamento              61.391&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;Saldo provision: €644.609 (= 1.000.000 / 1,05⁹).&lt;/p&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h4&gt;Inizio anno 2 · Cambio di stima (IFRIC 1)&lt;/h4&gt;&lt;p&gt;Nuove norme: il ripristino costerà &lt;strong&gt;€1.200.000&lt;/strong&gt;. Nuovo PV con 9 anni residui: 1.200.000 / 1,05⁹ = €773.531. Aumento: &lt;strong&gt;€128.922&lt;/strong&gt;.&lt;/p&gt;&lt;p&gt;Con il &lt;strong&gt;cost model&lt;/strong&gt; la variazione si somma (o sottrae) al costo dell&#x27;attività e si ammortizza prospetticamente sulla vita residua; non va a conto economico subito.&lt;/p&gt;&lt;div class=&quot;je&quot;&gt;Dr  Impianto (PP&amp;amp;E)                128.922
    Cr  Decommissioning provision      128.922&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;tag ext&quot;&gt;fonte esterna&lt;/span&gt;Con il &lt;em&gt;revaluation model&lt;/em&gt; la variazione passa invece per OCI e la riserva di rivalutazione — &lt;a href=&quot;https://www.icaew.com/technical/corporate-reporting/ifrs/ifrs-standards/ifric-1-changes-in-existing-decommissioning-restoration&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW, IFRIC 1&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h4&gt;Fine anno 10 · Estinzione&lt;/h4&gt;&lt;p&gt;Grazie all&#x27;unwinding annuo la provision ha raggiunto €1.200.000. Il pagamento la azzera.&lt;/p&gt;&lt;div class=&quot;je&quot;&gt;Dr  Decommissioning provision    1.200.000
    Cr  Cassa                        1.200.000&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;Se la spesa effettiva differisce, la differenza va a conto economico.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn prev&quot; type=&quot;button&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn next&quot; type=&quot;button&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h4&gt;Climate-related commitments: un caso di ragionamento &lt;span class=&quot;small&quot;&gt;(IFRIC Agenda Decision 2024)&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Un impegno pubblico di &lt;span class=&quot;t&quot;&gt;net-zero&lt;/span&gt; (emissioni nette zero) o di compensazione delle emissioni (&lt;span class=&quot;t&quot;&gt;emissions offset&lt;/span&gt;) &lt;strong&gt;può&lt;/strong&gt; creare una constructive obligation — ma solo se i fatti creano una valid expectation nei terzi.&lt;/p&gt;
    &lt;figure class=&quot;fig&quot;&gt;
    &lt;svg viewBox=&quot;0 0 720 120&quot; role=&quot;img&quot; aria-label=&quot;Ragionamento climate commitments&quot;&gt;
      &lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;
      &lt;rect x=&quot;5&quot; y=&quot;12&quot; width=&quot;210&quot; height=&quot;84&quot; rx=&quot;12&quot; fill=&quot;var(--sla-bg)&quot; stroke=&quot;var(--sla)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;40&quot; font-weight=&quot;700&quot;&gt;Public statement&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;60&quot;&gt;può creare una&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;77&quot;&gt;constructive obligation&lt;/text&gt;
