&lt;h3&gt;Le quattro categorie nelle note &lt;span class=&quot;src&quot;&gt;p. 48-49, 64-65&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Categoria&lt;/th&gt;&lt;th&gt;Trattamento dichiarato&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;Fondo 2025&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;2024&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Short-term&lt;/td&gt;&lt;td&gt;Costo quando il servizio è utilizzato&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;n.d.&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;n.d.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Post-employment&lt;/td&gt;&lt;td&gt;DC: solo costo. DB: passività con PUC&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;2.940&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;2.997&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Post-employment healthcare&lt;/td&gt;&lt;td&gt;Soprattutto Belgio&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;71&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;75&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Other long-term&lt;/td&gt;&lt;td&gt;Tecnica attuariale, rivalutazioni in P&amp;amp;L&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;2.001&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1.709&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Termination&lt;/td&gt;&lt;td&gt;Sconto se oltre 12 mesi&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;174&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;328&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Share-based payment (&lt;span class=&quot;en&quot;&gt;IFRS 2&lt;/span&gt;)&lt;/td&gt;&lt;td&gt;Fuori IAS 19, ma tra i fondi del personale&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1.826&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1.434&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Provisions for employee benefits&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;7.012&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;6.543&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3&gt;Defined contribution &lt;span class=&quot;src&quot;&gt;p. 52&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Il gruppo ha convertito molti plan da DB a DC: così trasferisce il rischio. In Italia il plan BNL prevede contributi del datore (4,5% dei salari) e del dipendente (2%). I 839 milioni si dividono così: Francia 371, Italia 111, UK 78, Türkiye 53, Lussemburgo 32, USA 29, Hong Kong 28, altri 137.&lt;/p&gt;
&lt;h3&gt;Defined benefit per paese &lt;span class=&quot;src&quot;&gt;p. 55&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;div class=&quot;seg&quot; id=&quot;bn-m&quot; role=&quot;group&quot; aria-label=&quot;Grandezza&quot;&gt;&lt;button data-v=&quot;dbo&quot;&gt;PV del DBO&lt;/button&gt;&lt;button data-v=&quot;as&quot;&gt;Attività a copertura&lt;/button&gt;&lt;button data-v=&quot;net&quot;&gt;Net obligation&lt;/button&gt;&lt;/div&gt;
&lt;div id=&quot;bn-rows&quot; style=&quot;margin-top:.6rem&quot;&gt;&lt;/div&gt;&lt;p class=&quot;say&quot; id=&quot;bn-say&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;Controllo sul totale: 6.976 − 4.827 − 2.439 + 152 = −138. In bilancio: attività 3.082 e passività 2.944, perché i plan in surplus non compensano quelli in deficit. I &lt;dfn&gt;reimbursement rights&lt;/dfn&gt; sono diritti di rimborso, soprattutto verso società assicurative del gruppo come AG Insurance per il Belgio.&lt;/p&gt;
&lt;h3&gt;Roll-forward del DBO &lt;span class=&quot;src&quot;&gt;p. 56&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;div class=&quot;seg&quot; id=&quot;wf-f&quot; role=&quot;group&quot; aria-label=&quot;Filtro&quot;&gt;&lt;button data-v=&quot;all&quot;&gt;Tutte&lt;/button&gt;&lt;button data-v=&quot;pl&quot;&gt;P&amp;amp;L&lt;/button&gt;&lt;button data-v=&quot;oc&quot;&gt;OCI&lt;/button&gt;&lt;button data-v=&quot;ca&quot;&gt;Cassa&lt;/button&gt;&lt;button data-v=&quot;ot&quot;&gt;Altro&lt;/button&gt;&lt;/div&gt;
&lt;div id=&quot;wf&quot; style=&quot;margin-top:.6rem&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;say&quot; id=&quot;wf-say&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;say&quot; style=&quot;font-size:.84rem;color:var(--soft)&quot;&gt;Asse tagliato: parte da 6.600 per rendere visibili le variazioni. Il raggruppamento per colore è una scelta didattica.&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Il costo: 175 in P&amp;amp;L, −61 in OCI &lt;span class=&quot;src&quot;&gt;p. 58&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Profit or loss 2025&lt;/h4&gt;&lt;div class=&quot;scroll&quot; style=&quot;margin:0&quot;&gt;&lt;table style=&quot;min-width:0&quot;&gt;
&lt;tr&gt;&lt;td&gt;Current service cost&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;190&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Past service cost&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(14)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Interest cost&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;232&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Rendimento atteso, asset ceiling&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Interessi attivi su plan assets&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(157)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Interessi attivi su reimbursement rights&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(77)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;175&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;OCI 2025 (segno: gain +)&lt;/h4&gt;&lt;div class=&quot;scroll&quot; style=&quot;margin:0&quot;&gt;&lt;table style=&quot;min-width:0&quot;&gt;
&lt;tr&gt;&lt;td&gt;Su plan assets e reimbursement rights&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;43&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ipotesi demografiche&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(6)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ipotesi finanziarie&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;166&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Experience&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(128)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Effetto asset ceiling&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(136)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(61)&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Ecco la modifica del 2011 applicata: gli interessi attivi di 157 sono nel roll-forward delle plan assets come &lt;span class=&quot;en&quot;&gt;expected return&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;p. 57&lt;/span&gt;, mentre la differenza col rendimento effettivo sta nei remeasurements. La nota 1.k precisa che i remeasurements &lt;strong&gt;non vengono mai riclassificati&lt;/strong&gt; a conto economico &lt;span class=&quot;src&quot;&gt;p. 50&lt;/span&gt;.&lt;/p&gt;
&lt;h3&gt;Ipotesi e sensibilità &lt;span class=&quot;src&quot;&gt;p. 59-61&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Nell&#x27;Eurozona, UK e USA il tasso deriva dai rendimenti di &lt;span class=&quot;en&quot;&gt;high quality corporate bonds&lt;/span&gt; con durata coerente. Tasso medio Eurozona 3,45% (durata 8,6 anni), UK 5,57% (12,3 anni), Svizzera 1,30% (12,7 anni).&lt;/p&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Paese&lt;/th&gt;&lt;th&gt;Discount rate 2025&lt;/th&gt;&lt;th&gt;Compensation increase 2025&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Belgio&lt;/td&gt;&lt;td&gt;2,50 / 4,20%&lt;/td&gt;&lt;td&gt;2,80 / 4,30%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UK&lt;/td&gt;&lt;td&gt;4,10 / 5,60%&lt;/td&gt;&lt;td&gt;2,00 / 3,75%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Francia&lt;/td&gt;&lt;td&gt;2,80 / 4,00%&lt;/td&gt;&lt;td&gt;1,90 / 4,10%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Svizzera&lt;/td&gt;&lt;td&gt;1,10 / 1,30%&lt;/td&gt;&lt;td&gt;1,25 / 1,80%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;USA&lt;/td&gt;&lt;td&gt;4,90 / 5,00%&lt;/td&gt;&lt;td&gt;n.a.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Italia&lt;/td&gt;&lt;td&gt;3,10 / 3,40%&lt;/td&gt;&lt;td&gt;2,40 / 3,10%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Germania&lt;/td&gt;&lt;td&gt;2,40 / 4,40%&lt;/td&gt;&lt;td&gt;1,80 / 2,80%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Türkiye&lt;/td&gt;&lt;td&gt;29,80%&lt;/td&gt;&lt;td&gt;26,00%&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;Cosa succede se i tassi si muovono? (variazione del DBO, milioni)&lt;/h4&gt;
&lt;div class=&quot;seg&quot; id=&quot;se-m&quot; role=&quot;group&quot; aria-label=&quot;Scenario&quot;&gt;&lt;button data-v=&quot;dn&quot;&gt;Sconto −100 bps&lt;/button&gt;&lt;button data-v=&quot;up&quot;&gt;Sconto +100 bps&lt;/button&gt;&lt;button data-v=&quot;inf&quot;&gt;Inflazione +100 bps&lt;/button&gt;&lt;/div&gt;
&lt;div id=&quot;se-rows&quot; style=&quot;margin-top:.6rem&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;say&quot;&gt;Sconto e DBO si muovono in senso opposto, inflazione e DBO nello stesso senso. La variazione percentuale si avvicina alla &lt;span class=&quot;en&quot;&gt;duration&lt;/span&gt; (durata media dei pagamenti): la Svizzera sale di circa il 14% con −100 bps e ha una durata di 12,7 anni &lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt;. Un &lt;span class=&quot;en&quot;&gt;basis point&lt;/span&gt; (bps) è 0,01%. Percentuali calcolate qui sul DBO della p. 55.&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Copertura e rischi &lt;span class=&quot;src&quot;&gt;p. 53-54, 62-63&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Plan&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;Copertura 2025&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;2024&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Germania&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;72%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;72%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;USA&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;83%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;85%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Belgio, Fortis&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;92%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;95%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;AXA IM (acquisita dall&#x27;1/7/2025)&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;96%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;n.a.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Belgio, top-up senior manager&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;101%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;100%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Svizzera&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;109%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;105%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UK&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;125%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;124%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Francia, indennità di fine carriera&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;131%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;129%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Francia, top-up senior manager&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;565%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;442%&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 74&quot; role=&quot;img&quot; aria-label=&quot;Plan assets di gruppo: azioni 12%, titoli di stato 41%, altre obbligazioni 20%, immobili 7%, depositi 3%, altro 17%&quot;&gt;
&lt;g style=&quot;stroke:var(--paper)&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;4&quot; width=&quot;76.8&quot; height=&quot;34&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;rect x=&quot;76.8&quot; y=&quot;4&quot; width=&quot;262.4&quot; height=&quot;34&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;rect x=&quot;339.2&quot; y=&quot;4&quot; width=&quot;128&quot; height=&quot;34&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;rect x=&quot;467.2&quot; y=&quot;4&quot; width=&quot;44.8&quot; height=&quot;34&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;rect x=&quot;512&quot; y=&quot;4&quot; width=&quot;19.2&quot; height=&quot;34&quot; style=&quot;fill:var(--accent)&quot;/&gt;&lt;rect x=&quot;531.2&quot; y=&quot;4&quot; width=&quot;108.8&quot; height=&quot;34&quot; style=&quot;fill:var(--soft)&quot;/&gt;&lt;/g&gt;
&lt;text class=&quot;s&quot; x=&quot;2&quot; y=&quot;56&quot;&gt;azioni 12&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;80&quot; y=&quot;56&quot;&gt;titoli di stato 41&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;342&quot; y=&quot;56&quot;&gt;altre obbl. 20&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;465&quot; y=&quot;56&quot;&gt;immob. 7&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;510&quot; y=&quot;72&quot;&gt;dep. 3&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;560&quot; y=&quot;56&quot;&gt;altro 17&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;Composizione % delle plan assets di gruppo a fine 2025 &lt;span class=&quot;src&quot;&gt;p. 62&lt;/span&gt;. Per i plan oltre 100 milioni, l&#x27;analisi di &lt;span class=&quot;en&quot;&gt;asset and liability management&lt;/span&gt; va fatta almeno ogni tre anni &lt;span class=&quot;src&quot;&gt;p. 63&lt;/span&gt;.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;tint brick&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Focus Italia: il TFR nel bilancio di una banca&lt;/h4&gt;&lt;p&gt;In Italia i diritti maturati sono &lt;strong&gt;congelati al 31/12/2006&lt;/strong&gt; &lt;span class=&quot;src&quot;&gt;p. 54&lt;/span&gt;: 111 milioni di DBO, tutti unfunded e senza attività &lt;span class=&quot;src&quot;&gt;p. 55&lt;/span&gt;, in calo da 139. Sconto al 3,10-3,40%. Sono proprio le quote &quot;vecchie&quot; della &lt;a href=&quot;#tfr&quot;&gt;sezione 5&lt;/a&gt;. Attenzione a non confonderli con i 111 milioni di contributi DC italiani di p. 52: stesso importo, per coincidenza.&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Other long-term e termination &lt;span class=&quot;src&quot;&gt;p. 64-65&lt;/span&gt;&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Net provision 1.915 milioni&lt;/strong&gt; (466 tra premi di anzianità, time savings account e garanzie di incapacità; 1.449 di compensi differiti e loyalty scheme). Attività 86, passività 2.001.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Loyalty scheme&lt;/strong&gt; cash, dal 2013, vesting di 3-4 anni: 80% legato alla performance operativa, 20% a obiettivi di &lt;span class=&quot;en&quot;&gt;Corporate Social Responsibility&lt;/span&gt;. Per il personale soggetto a regole speciali si adatta alla direttiva europea CRD.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Termination&lt;/strong&gt;: esodi volontari e piani di adeguamento degli organici, rilevati appena c&#x27;è un accordo bilaterale o una proposta di accordo. È IAS 19.166 in pratica.&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché il Belgio ha net obligation di soli 79 con appena 217 di plan assets?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché ha 2.411 di reimbursement rights. Il DBO di 2.707 è coperto soprattutto da questi diritti, che sono esposti come attività separata.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Il DBO cala di 382 per benefit pagati dalle attività. Il risultato cambia?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: pagamento e diminuzione delle attività si compensano. Il pagamento non è un costo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché BNP mette tutto il costo DB in &quot;Salaries and employee benefits&quot;, interessi compresi?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;È la sua scelta di presentazione. Le slide di p. 39 parlano di service cost come costo operativo o finanziario; IAS 19 non impone una riga specifica &lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Con −100 bps Svizzera e UK salgono di circa il 14% e il 13%, il Belgio di circa l&#x27;8%. Perché?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Svizzera e UK hanno una duration di oltre 12 anni: pagamenti più lontani reagiscono di più allo sconto. La p. 60 non dà la duration del solo Belgio, ma per l&#x27;Eurozona indica 8,6 anni.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part brick&quot; id=&quot;controlli&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;p class=&quot;kicker&quot;&gt;Prima dell&#x27;esame&lt;/p&gt;
&lt;h2&gt;Punti delle slide da controllare&lt;/h2&gt;
&lt;p&gt;Ricalcolando e incrociando le slide sono emersi questi punti. Nessuno è una certezza sulla volontà del docente: portali a lezione.&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;strong&gt;Sconto nel PUC, p. 42.&lt;/strong&gt; Il coefficiente usa gli anni trascorsi invece di quelli residui. &lt;a href=&quot;#puc&quot;&gt;Vedi il laboratorio&lt;/a&gt;.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Tabelle pre-2013, p. 25-26.&lt;/strong&gt; &lt;span class=&quot;en&quot;&gt;Expected return&lt;/span&gt; e utili o perdite non riconosciuti non sono coerenti con p. 24 e p. 38-39. La nota di p. 26 lo fa capire solo per il corridor.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Soglia di 50 dipendenti, p. 27-30.&lt;/strong&gt; Superata per il Fondo di Tesoreria dalle norme 2026 riportate dalle fonti esterne. &lt;a href=&quot;#tfr&quot;&gt;Vedi TFR&lt;/a&gt;.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Numeri di paragrafo, p. 19-26.&lt;/strong&gt; L&#x27;intestazione dice &quot;par. 26-49&quot;, ma i contenuti citano 19.55-57 e 19.76. Cerca nello standard con il numero citato nel testo.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Presentazione del service cost, p. 39.&lt;/strong&gt; &quot;Operational or financial cost&quot; non è il trattamento di BNP Paribas (p. 58), che somma tutto nella stessa voce.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Intestazione in nota BNP, p. 61.&lt;/strong&gt; Si legge &quot;average discount rates&quot;, ma il contesto riguarda l&#x27;inflazione: probabile refuso nel documento di origine.&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part terra&quot; id=&quot;fonti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;p class=&quot;kicker&quot;&gt;Tutte fonti esterne, salvo dove indicato&lt;/p&gt;
&lt;h2&gt;Per approfondire&lt;/h2&gt;
&lt;p&gt;Le schede elencano ciò che le slide citano. I contenuti e i link vengono dalla ricerca web. Le pagine non sono state aperte per intero: fanno fede i testi originali.&lt;/p&gt;
&lt;div class=&quot;tint&quot;&gt;&lt;p&gt;&lt;strong&gt;Altri materiali del corso.&lt;/strong&gt; Con gli strumenti disponibili non è stato possibile elencare la cartella &lt;code&gt;corso/&lt;/code&gt;, quindi nessun contenuto di questa pagina viene da altri file: tutto ciò che è &quot;dalle slide&quot; proviene da &lt;code&gt;10 - IAS 19 - Employee Benefits.pdf&lt;/code&gt;. Mancano perciò i collegamenti con le altre lezioni e il riferimento completo al testo Ipsoa.&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Standard IFRS&lt;/h3&gt;
&lt;ul class=&quot;src-list&quot;&gt;
&lt;li&gt;&lt;h4&gt;IAS 19 Employee Benefits &lt;a class=&quot;ext&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-19-employee-benefits/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Pagina ufficiale dell&#x27;IFRS Foundation. Contiene il testo, le &lt;span class=&quot;en&quot;&gt;Basis for Conclusions&lt;/span&gt; e la guida applicativa. Conta perché è il riferimento per tutti i paragrafi citati. Per il dubbio della p. 42, cerca nel testo l&#x27;esempio numerico sul PUC: dovrebbe trovarsi al par. 68, ma la ricerca non lo ha confermato.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;IAS 26 Accounting and Reporting by Retirement Benefit Plans &lt;a class=&quot;ext&quot; href=&quot;https://www.iasplus.com/en/standards/ias/ias26&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Scheda IAS Plus. Tratta il plan come entità che redige un proprio bilancio, con investimenti di norma al fair value. Conta perché traccia il confine con IAS 19.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;IFRS 2 Share-based Payment &lt;a class=&quot;ext&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-2-share-based-payment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Emesso nel 2004, in vigore dal 2005. Regola i pagamenti in azioni, comprese le stock option ai dipendenti. Spiega i 1.826 milioni di BNP fuori da IAS 19.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;IAS 37 Provisions, Contingent Liabilities and Contingent Assets &lt;a class=&quot;ext&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-37-provisions-contingent-liabilities-and-contingent-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Disciplina i fondi, compresi i costi di &lt;span class=&quot;en&quot;&gt;restructuring&lt;/span&gt;, richiamati da IAS 19.165. Nel novembre 2024 l&#x27;IASB ha proposto miglioramenti mirati: verifica lo stato del progetto.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;IAS 16 Property, Plant and Equipment &lt;a class=&quot;ext&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2025/issued/ias16.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Tra i costi direttamente attribuibili elenca i benefici ai dipendenti ex IAS 19 legati alla costruzione o acquisizione dell&#x27;impianto. Conta per l&#x27;eccezione di IAS 19.11.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;IAS 2 Inventories &lt;a class=&quot;ext&quot; href=&quot;https://www.iasplus.com/en/standards/ias&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Citato da IAS 19.11 per il lavoro incluso nel costo delle rimanenze. Non ho trovato una pagina dedicata: il link porta all&#x27;indice IAS di IAS Plus.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h3&gt;Norme UE e italiane&lt;/h3&gt;
&lt;ul class=&quot;src-list&quot;&gt;
&lt;li&gt;&lt;h4&gt;Regolamento (UE) 475/2012 &lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/reg/2012/475/2012-07-01&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Del 5 giugno 2012. Adotta nell&#x27;UE le modifiche a IAS 1 e IAS 19. Conta perché segna la fine del corridor; IAS 19 modificato si applica dal 2013.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Regolamento (UE) 2019/402 &lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/reg/2019/402/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Del 13 marzo 2019, pubblicato nella GU L 72. Adotta &lt;span class=&quot;en&quot;&gt;Plan Amendment, Curtailment or Settlement&lt;/span&gt; (IASB, 7 febbraio 2018), che tocca fra gli altri i par. 57, 99, 120 e 123. Scheda di approfondimento: &lt;a href=&quot;https://www.iasplus.com/en/news/2019/03/ias-19-eu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;D.Lgs. 5 dicembre 2005, n. 252 &lt;a class=&quot;ext&quot; href=&quot;https://www.normattiva.it/eli/id/2005/12/13/005G0278/CONSOLIDATED/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Testo consolidato su Normattiva, &quot;Disciplina delle forme pensionistiche complementari&quot;, in vigore dall&#x27;1/1/2007. È la base della riforma del TFR.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Fondo di Tesoreria: nuove soglie dal 2026 &lt;a class=&quot;ext&quot; href=&quot;https://www.inps.it/it/it/inps-comunica/notizie/dettaglio-news-page.news.2026.02.fondo-di-tesoreria-nuove-soglie-dimensionali-dal-2026.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Notizia INPS sulle soglie dimensionali; dettagli anche in un &lt;a href=&quot;https://www.cgil.it/strumenti/ufficio-giuridico/tfr-e-fondo-tesoreria-inps-cosa-cambia-dal-2026-con-la-nuova-legge-di-bilancio-fxmh7qx7&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;approfondimento CGIL&lt;/a&gt;. Aggiorna le slide. Le sintesi concordano sui valori, ma per la fascia 2028-2031 conviene leggere la circolare 12/2026.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;DM 31 marzo 2020, n. 85 (FondInps) &lt;a class=&quot;ext&quot; href=&quot;https://www.normattiva.it/eli/id/2020/07/30//20G00103/CONSOLIDATED&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Individua il Fondo Cometa per il trasferimento delle posizioni FondInps. Spiega il &quot;subsequently liquidated&quot; di p. 28.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Agenzia delle Entrate, Risoluzione 133/2006 &lt;a class=&quot;ext&quot; href=&quot;https://agenziaentrate.gov.it/portale/documents/20143/306666/Risoluzione+n.+133+del+13+novembre+2006_ris_133.pdf/4b5b3529-2f16-4888-f65b-5808d1ef063d&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Riporta che, per l&#x27;IFRIC, il TFR rientra tra i piani a benefici definiti. Le slide citano l&#x27;IFRIC senza riferimenti: non ho trovato la decisione originale, quindi questa è una fonte secondaria.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Direttiva 2013/36/UE (CRD) &lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/dir/2013/36&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Testo consolidato su EUR-Lex. L&#x27;art. 94 regola la remunerazione variabile nelle banche, incluso il differimento: è il perché del compenso differito di BNP (p. 64).&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h3&gt;IASB e documenti di bilancio&lt;/h3&gt;
&lt;ul class=&quot;src-list&quot;&gt;
&lt;li&gt;&lt;h4&gt;Disclosure Initiative: Targeted Standards-level Review of Disclosures &lt;a class=&quot;ext&quot; href=&quot;https://www.ifrs.org/content/ifrs/home/projects/completed-projects/2023/standards-level-review-of-disclosures.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Pagina del progetto concluso, con la &lt;span class=&quot;en&quot;&gt;Project Summary and Feedback Statement&lt;/span&gt; del marzo 2023 da cui viene la p. 44. Include la guida per scrivere requisiti di disclosure.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Third Agenda Consultation, Feedback Statement &lt;a class=&quot;ext&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/project/third-agenda-consultation/thirdagenda-feedbackstatement-july2022.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Del luglio 2022. Illustra priorità e criteri per il piano IASB 2022-2026: sono i criteri con cui si è valutato il lavoro su IAS 19.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;BNP Paribas, Consolidated Financial Statements 2025 &lt;a class=&quot;ext&quot; href=&quot;https://invest.bnpparibas/en/document/4q25-cfsu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Documento sul sito investitori, con le note 7.a-7.e. Marcato &lt;span class=&quot;en&quot;&gt;unaudited&lt;/span&gt;, approvato dal CdA il 4 febbraio 2026: per un&#x27;analisi autonoma, cerca la versione certificata.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Esempio di PUC su CPDbox &lt;a class=&quot;ext&quot; href=&quot;https://www.cpdbox.com/ifrs-projected-unit-credit-method-ias-19-example/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Non citato nelle slide: esempio svolto utile per confrontare la convenzione di sconto. È un sito didattico, non una fonte ufficiale.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;

&lt;/div&gt;&lt;/section&gt;
