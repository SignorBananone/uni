&lt;main&gt;
&lt;section class=&quot;part slate&quot; id=&quot;quadro&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Il quadro&lt;/p&gt;
&lt;h2&gt;Che cosa regola IAS 19, e cosa no&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;IAS 19 parte da un&#x27;idea semplice: il dipendente lavora oggi, quindi il costo nasce oggi, anche se il denaro uscirà tra molti anni.&lt;/p&gt;

&lt;h3&gt;Tre principi per il costo del personale &lt;span class=&quot;src&quot;&gt;p. 2-4&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;IAS 19 &lt;span class=&quot;en&quot;&gt;Employee Benefits&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Guarda dal lato del &lt;strong&gt;datore di lavoro&lt;/strong&gt;: come rilevare ogni beneficio a favore dei dipendenti. È il tema di questa lezione.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;IAS 26 &lt;span class=&quot;en&quot;&gt;Retirement Benefit Plans&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Guarda dal lato del &lt;strong&gt;plan&lt;/strong&gt; (il piano, spesso un fondo pensione): come redige il proprio bilancio. IAS 19 non se ne occupa (IAS 19.3).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;IFRS 2 &lt;span class=&quot;en&quot;&gt;Share-based Payment&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Compensi pagati &lt;strong&gt;in azioni&lt;/strong&gt; o legati al loro valore. Sono esplicitamente esclusi da IAS 19 (IAS 19.2).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Obiettivo e definizione &lt;span class=&quot;src&quot;&gt;p. 3&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Lo standard prescrive &lt;strong&gt;accounting and disclosure&lt;/strong&gt;, cioè rilevazione e informativa in nota. I &lt;dfn&gt;employee benefits&lt;/dfn&gt; (benefici per i dipendenti) sono tutte le forme di corrispettivo date dall&#x27;entità in cambio del lavoro prestato oppure della cessazione del rapporto (IAS 19.8).&lt;/p&gt;
&lt;figure&gt;&lt;div class=&quot;scroll&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;Linea del tempo: quando il dipendente lavora nasce il costo e la passività; quando l&#x27;entità paga, la passività si chiude.&quot;&gt;
&lt;path class=&quot;ln&quot; d=&quot;M30 80H610&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;defs&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L8 4L0 8z&quot; style=&quot;fill:var(--soft)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;circle cx=&quot;120&quot; cy=&quot;80&quot; r=&quot;7&quot; style=&quot;fill:var(--accent)&quot;/&gt;&lt;circle cx=&quot;520&quot; cy=&quot;80&quot; r=&quot;7&quot; style=&quot;fill:var(--slate)&quot;/&gt;
&lt;text class=&quot;t&quot; x=&quot;120&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;Il dipendente lavora&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;120&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot;&gt;oggi&lt;/text&gt;
&lt;text class=&quot;t&quot; x=&quot;520&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;L&#x27;entità paga&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;520&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot;&gt;anche molti anni dopo&lt;/text&gt;
&lt;rect x=&quot;125&quot; y=&quot;94&quot; width=&quot;390&quot; height=&quot;24&quot; rx=&quot;4&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;111&quot; text-anchor=&quot;middle&quot;&gt;liability: il debito resta aperto fino al pagamento&lt;/text&gt;
&lt;text class=&quot;t&quot; x=&quot;120&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--accent)&quot;&gt;expense&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;120&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot;&gt;consumo il servizio&lt;/text&gt;
&lt;text class=&quot;t&quot; x=&quot;520&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot;&gt;cassa&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;520&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot;&gt;non è il momento del costo&lt;/text&gt;
&lt;/svg&gt;&lt;/div&gt;&lt;figcaption&gt;IAS 19.1: una &lt;span class=&quot;en&quot;&gt;liability&lt;/span&gt; (passività) quando il servizio è reso a fronte di benefici futuri; una &lt;span class=&quot;en&quot;&gt;expense&lt;/span&gt; (costo) quando l&#x27;entità consuma il beneficio economico del servizio.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3&gt;Da dove nasce l&#x27;obbligo &lt;span class=&quot;src&quot;&gt;p. 4&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Non serve un contratto scritto: IAS 19.4 copre tre fonti.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Formal plans o accordi formali&lt;/strong&gt; con singoli dipendenti, gruppi o loro rappresentanti.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Requisiti di legge&lt;/strong&gt; o accordi di settore che impongono contributi a piani nazionali, statali, di settore o &lt;span class=&quot;en&quot;&gt;multi-employer&lt;/span&gt; (a più datori di lavoro).&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Pratiche informali&lt;/strong&gt; che creano una &lt;dfn&gt;constructive obligation&lt;/dfn&gt; (obbligazione implicita): l&#x27;entità non ha alternative realistiche al pagamento, per esempio perché cambiare prassi danneggerebbe in modo inaccettabile il rapporto con i dipendenti.&lt;/li&gt;
&lt;/ul&gt;

&lt;h3&gt;Le quattro categorie &lt;span class=&quot;src&quot;&gt;p. 5-6&lt;/span&gt;&lt;/h3&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot;&gt;&lt;button type=&quot;button&quot;&gt;Short-term&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Post-employment&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Other long-term&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Termination&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel sage&quot;&gt;&lt;p&gt;&lt;dfn&gt;Short-term employee benefits&lt;/dfn&gt;: benefici che si prevede di liquidare interamente entro dodici mesi dalla fine dell&#x27;esercizio in cui il servizio è reso.&lt;/p&gt;&lt;p&gt;Esempi: salari e contributi sociali, ferie e malattia pagate, &lt;span class=&quot;en&quot;&gt;profit-sharing&lt;/span&gt; (partecipazione agli utili) e bonus, benefit non monetari come assistenza sanitaria, casa, auto, beni o servizi gratuiti per il personale in forza. &lt;a href=&quot;#breve&quot;&gt;Vai alla sezione 2&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel ochre&quot;&gt;&lt;p&gt;&lt;dfn&gt;Post-employment benefits&lt;/dfn&gt;: benefici pagabili dopo la fine del rapporto, diversi dai termination e dagli short-term.&lt;/p&gt;&lt;p&gt;Esempi: pensioni, capitale una tantum al pensionamento, assicurazione sulla vita e assistenza medica dopo il rapporto. &lt;a href=&quot;#post&quot;&gt;Vai alla sezione 3&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel slate&quot;&gt;&lt;p&gt;&lt;dfn&gt;Other long-term employee benefits&lt;/dfn&gt;: categoria residuale, tutto ciò che non rientra nelle altre tre.&lt;/p&gt;&lt;p&gt;Esempi: &lt;span class=&quot;en&quot;&gt;long-service&lt;/span&gt; o &lt;span class=&quot;en&quot;&gt;sabbatical leave&lt;/span&gt; (congedi legati all&#x27;anzianità o sabbatici), &lt;span class=&quot;en&quot;&gt;jubilee benefits&lt;/span&gt; (premi di anzianità), invalidità di lungo periodo. &lt;a href=&quot;#altri&quot;&gt;Vai alla sezione 6&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel brick&quot;&gt;&lt;p&gt;&lt;dfn&gt;Termination benefits&lt;/dfn&gt;: benefici dati in cambio della cessazione del rapporto, per decisione dell&#x27;entità prima del normale pensionamento oppure perché il dipendente accetta un&#x27;offerta. &lt;a href=&quot;#term&quot;&gt;Vai alla sezione 7&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Le quattro categorie a colpo d&#x27;occhio &lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt;&lt;/h4&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Cosa fa nascere l&#x27;obbligo&lt;/th&gt;&lt;th&gt;Sconto&lt;/th&gt;&lt;th&gt;Remeasurement&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Short-term&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Il servizio reso&lt;/td&gt;&lt;td&gt;No&lt;/td&gt;&lt;td&gt;Non pertinente&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Post-employment DB&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Il servizio reso&lt;/td&gt;&lt;td&gt;Sì&lt;/td&gt;&lt;td&gt;OCI&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Post-employment DC&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Il servizio reso, per il contributo dovuto&lt;/td&gt;&lt;td&gt;Di norma no&lt;/td&gt;&lt;td&gt;Non pertinente&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Other long-term&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Il servizio reso&lt;/td&gt;&lt;td&gt;Sì&lt;/td&gt;&lt;td&gt;Profit or loss&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Termination&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;La cessazione, non il servizio&lt;/td&gt;&lt;td&gt;Secondo la scadenza&lt;/td&gt;&lt;td&gt;Secondo la natura&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Un&#x27;azienda paga ogni anno un premio natalizio non previsto dal contratto, ma ormai atteso da tutti. IAS 19 lo copre?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sì, se smettere di pagarlo causerebbe un danno inaccettabile ai rapporti con i dipendenti: è una pratica informale che genera una &lt;span class=&quot;en&quot;&gt;constructive obligation&lt;/span&gt; (IAS 19.4).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Stock option ai manager: IAS 19 o IFRS 2?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;IFRS 2. IAS 19.2 esclude i benefici soggetti a IFRS 2.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Il fondo pensione aziendale redige il proprio bilancio. Quale standard usa?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;IAS 26. IAS 19 guarda al datore di lavoro, IAS 26 al plan come entità che riporta.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part sage&quot; id=&quot;breve&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;IAS 19, par. 9-25&lt;/p&gt;
&lt;h2&gt;Short-term employee benefits&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;La categoria più semplice: si paga presto, quindi niente attualizzazione e niente ipotesi attuariali.&lt;/p&gt;
&lt;p&gt;Il criterio è temporale: liquidazione prevista &lt;strong&gt;interamente entro dodici mesi dalla fine dell&#x27;esercizio&lt;/strong&gt; in cui il servizio è reso &lt;span class=&quot;src&quot;&gt;p. 7&lt;/span&gt;. Con esercizio chiuso al 31/12/2026, il limite è il 31/12/2027 &lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;

&lt;h3&gt;Rilevazione e misura: IAS 19.11 &lt;span class=&quot;src&quot;&gt;p. 8&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Si rileva l&#x27;importo &lt;dfn&gt;undiscounted&lt;/dfn&gt; (non attualizzato) che si prevede di pagare per il servizio reso. Con pagamenti così vicini, l&#x27;effetto dello sconto sarebbe trascurabile &lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt;. Il dovuto non ancora pagato è un &lt;span class=&quot;en&quot;&gt;accrued expense&lt;/span&gt; (rateo passivo), l&#x27;eccesso già pagato un &lt;span class=&quot;en&quot;&gt;prepaid expense&lt;/span&gt; (risconto attivo).&lt;/p&gt;
&lt;figure&gt;&lt;div class=&quot;scroll&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 196&quot; role=&quot;img&quot; aria-label=&quot;Schema di IAS 19.11: il beneficio dovuto si confronta con quanto già pagato. Se resta un dovuto è una passività; se l&#x27;importo pagato è maggiore è un&#x27;attività se dà rimborsi o riduzioni. In contropartita c&#x27;è un costo, salvo capitalizzazione secondo IAS 2 o IAS 16.&quot;&gt;
&lt;g class=&quot;sage&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;10&quot; y=&quot;64&quot; width=&quot;170&quot; height=&quot;60&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;95&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;Beneficio dovuto&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;95&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;meno quanto già pagato&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M180 94H230M230 94V38H262M230 94V150H262&quot;/&gt;
&lt;g class=&quot;sage&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;262&quot; y=&quot;10&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;347&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot;&gt;Resta da pagare&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;347&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot;&gt;liability, accrued expense&lt;/text&gt;
&lt;rect class=&quot;b&quot; x=&quot;262&quot; y=&quot;122&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;347&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot;&gt;Pagato di più&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;347&quot; y=&quot;164&quot; text-anchor=&quot;middle&quot;&gt;asset, prepaid expense&lt;/text&gt;&lt;/g&gt;
&lt;text class=&quot;s&quot; x=&quot;448&quot; y=&quot;141&quot;&gt;solo se porta a minori&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;448&quot; y=&quot;158&quot;&gt;pagamenti o rimborso&lt;/text&gt;
&lt;text class=&quot;t&quot; x=&quot;448&quot; y=&quot;30&quot;&gt;Contropartita:&lt;/text&gt;&lt;text x=&quot;448&quot; y=&quot;48&quot;&gt;expense&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;448&quot; y=&quot;66&quot;&gt;salvo costo di un asset&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;448&quot; y=&quot;82&quot;&gt;(IAS 2, IAS 16)&lt;/text&gt;
&lt;/svg&gt;&lt;/div&gt;&lt;figcaption&gt;Il costo può non passare subito a conto economico: il salario degli operai di produzione entra nel costo delle rimanenze, quello di chi costruisce un impianto nel costo dell&#x27;impianto &lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt;.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3 id=&quot;assenze&quot;&gt;Short-term paid absences &lt;span class=&quot;src&quot;&gt;p. 9-12&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Ferie, malattia, maternità o paternità, servizio militare, giuria: IAS 19.14 distingue due categorie secondo una domanda sola, &lt;strong&gt;il diritto si trascina nel periodo successivo?&lt;/strong&gt;&lt;/p&gt;
&lt;figure&gt;&lt;div class=&quot;scroll&quot;&gt;
&lt;svg viewBox=&quot;0 0 660 262&quot; role=&quot;img&quot; aria-label=&quot;Albero: se i giorni non usati si riportano, l&#x27;assenza è accumulating; può essere vesting o non-vesting, e si rileva passività mentre il dipendente lavora. Se non si riportano è non-accumulating e il costo si rileva all&#x27;assenza.&quot;&gt;
&lt;g class=&quot;sage&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;205&quot; y=&quot;8&quot; width=&quot;250&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;330&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot;&gt;I giorni non usati si riportano?&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M270 52V78H130V96M390 52V78H530V96&quot;/&gt;&lt;text class=&quot;s&quot; x=&quot;190&quot; y=&quot;72&quot;&gt;sì&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;460&quot; y=&quot;72&quot;&gt;no&lt;/text&gt;
&lt;g class=&quot;sage&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;30&quot; y=&quot;96&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;130&quot; y=&quot;123&quot; text-anchor=&quot;middle&quot;&gt;Accumulating&lt;/text&gt;
&lt;rect class=&quot;b&quot; x=&quot;430&quot; y=&quot;96&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;530&quot; y=&quot;123&quot; text-anchor=&quot;middle&quot;&gt;Non-accumulating&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M80 140V160M180 140V160&quot;/&gt;
&lt;g class=&quot;sage&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;6&quot; y=&quot;160&quot; width=&quot;130&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;71&quot; y=&quot;179&quot; text-anchor=&quot;middle&quot;&gt;Vesting&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;71&quot; y=&quot;195&quot; text-anchor=&quot;middle&quot;&gt;cassa all&#x27;uscita&lt;/text&gt;
&lt;rect class=&quot;b&quot; x=&quot;144&quot; y=&quot;160&quot; width=&quot;130&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;209&quot; y=&quot;179&quot; text-anchor=&quot;middle&quot;&gt;Non-vesting&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;209&quot; y=&quot;195&quot; text-anchor=&quot;middle&quot;&gt;no cassa all&#x27;uscita&lt;/text&gt;&lt;/g&gt;
&lt;text class=&quot;t&quot; x=&quot;140&quot; y=&quot;228&quot; text-anchor=&quot;middle&quot;&gt;Passività mentre il dipendente lavora&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;140&quot; y=&quot;248&quot; text-anchor=&quot;middle&quot;&gt;non-vesting: stima di chi se ne andrà (19.15)&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M530 140V166&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;530&quot; y=&quot;186&quot; text-anchor=&quot;middle&quot;&gt;Costo solo quando&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;530&quot; y=&quot;204&quot; text-anchor=&quot;middle&quot;&gt;l&#x27;assenza avviene&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;530&quot; y=&quot;226&quot; text-anchor=&quot;middle&quot;&gt;malattia, maternità, giuria,&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;530&quot; y=&quot;242&quot; text-anchor=&quot;middle&quot;&gt;servizio militare (19.18)&lt;/text&gt;
&lt;/svg&gt;&lt;/div&gt;&lt;/figure&gt;
&lt;p&gt;La misura delle assenze accumulating è l&#x27;&lt;strong&gt;additional amount&lt;/strong&gt; (19.16): quanto in più l&#x27;entità prevede di pagare per il diritto non usato a fine esercizio. &lt;span class=&quot;en&quot;&gt;Vesting&lt;/span&gt; significa che il diritto spetta comunque, indipendentemente dalla permanenza in azienda.&lt;/p&gt;
&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;Calcolatore: il caso Alfa &lt;span class=&quot;src&quot;&gt;p. 12&lt;/span&gt;&lt;/h4&gt;
&lt;div class=&quot;seg&quot; id=&quot;al-k&quot; role=&quot;group&quot; aria-label=&quot;Tipo di assenza&quot;&gt;&lt;button data-v=&quot;vest&quot;&gt;Accumulating, vesting&lt;/button&gt;&lt;button data-v=&quot;nonvest&quot;&gt;Accumulating, non-vesting&lt;/button&gt;&lt;button data-v=&quot;non&quot;&gt;Non-accumulating&lt;/button&gt;&lt;/div&gt;
&lt;label&gt;Dipendenti&lt;input id=&quot;al-n&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;20&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;al-n-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Giorni annui&lt;input id=&quot;al-d&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;30&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;al-d-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Costo al giorno&lt;input id=&quot;al-c&quot; type=&quot;range&quot; min=&quot;20&quot; max=&quot;200&quot; step=&quot;10&quot; value=&quot;50&quot;&gt;&lt;output id=&quot;al-c-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Giorni non usati&lt;input id=&quot;al-u&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;al-u-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label id=&quot;al-p-row&quot;&gt;Probabilità di usarli&lt;input id=&quot;al-p&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;80&quot;&gt;&lt;output id=&quot;al-p-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;b id=&quot;al-cost&quot;&gt;&lt;/b&gt;costo delle ferie del periodo&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;al-liab&quot;&gt;&lt;/b&gt;passività a fine periodo&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;say&quot; id=&quot;al-say&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;say&quot; style=&quot;color:var(--soft);font-size:.86rem&quot;&gt;Valori iniziali della slide: 5 × 20 × 50 = 5.000 € di costo, 1 × 4 × 50 = 200 € di passività. La probabilità è una variabile didattica aggiunta qui.&lt;/p&gt;&lt;/div&gt;

&lt;h3 id=&quot;bonus&quot;&gt;Profit-sharing e bonus plans &lt;span class=&quot;src&quot;&gt;p. 13-15&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Il costo atteso si rileva quando, e solo quando, valgono &lt;strong&gt;insieme&lt;/strong&gt; due condizioni (IAS 19.19):&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Present obligation&lt;/h4&gt;&lt;p&gt;Obbligo legale o implicito, attuale, da eventi passati. Esiste solo se l&#x27;entità non ha alternative realistiche al pagamento.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Reliable estimate&lt;/h4&gt;&lt;p&gt;Possibile solo se (19.22): il plan contiene una formula; oppure l&#x27;importo è deciso prima dell&#x27;autorizzazione del bilancio; oppure la prassi passata dà evidenza chiara.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Alcuni plan pagano solo a chi resta per un certo periodo (19.20). L&#x27;obbligo nasce comunque man mano che il lavoro aumenta l&#x27;importo, ma la misura tiene conto che qualcuno se ne andrà senza incassare.&lt;/p&gt;
&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;Dal 3% al 2,5% &lt;span class=&quot;src&quot;&gt;p. 15&lt;/span&gt;&lt;/h4&gt;
&lt;label&gt;Utile dell&#x27;anno&lt;input id=&quot;ps-p&quot; type=&quot;range&quot; min=&quot;100&quot; max=&quot;5000&quot; step=&quot;100&quot; value=&quot;1000&quot;&gt;&lt;output id=&quot;ps-p-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Quota senza uscite&lt;input id=&quot;ps-f&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;60&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;ps-f-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Quota stimata con turnover&lt;input id=&quot;ps-e&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;60&quot; value=&quot;25&quot;&gt;&lt;output id=&quot;ps-e-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;b id=&quot;ps-max&quot;&gt;&lt;/b&gt;pagamento se nessuno esce&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;ps-rec&quot;&gt;&lt;/b&gt;liability ed expense rilevate&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;ps-gap&quot;&gt;&lt;/b&gt;effetto del &lt;span class=&quot;en&quot;&gt;turnover&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;say&quot; style=&quot;color:var(--soft);font-size:.86rem&quot;&gt;Slide: 3% senza uscite, 2,5% stimato con il &lt;span class=&quot;en&quot;&gt;turnover&lt;/span&gt; (rotazione del personale), si rileva il 2,5%. L&#x27;utile di 1.000 k€ è un valore illustrativo.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Ferie riportabili ma non monetizzabili all&#x27;uscita: c&#x27;è passività?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sì. Sono accumulating non-vesting: l&#x27;obbligo esiste, ma la misura considera chi potrebbe andarsene prima di usarle (19.15).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché la malattia di solito non genera passività a fine anno?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché lavorare non aumenta il diritto futuro: se non si usa, decade. Il costo si rileva quando l&#x27;assenza avviene (19.18).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Il bonus 2026 viene deciso dal CdA prima che il bilancio sia autorizzato. Si può stimare in modo attendibile?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sì, è la seconda ipotesi di IAS 19.22. Resta però da verificare anche l&#x27;esistenza di una &lt;span class=&quot;en&quot;&gt;present obligation&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;I salari degli operai vanno sempre a costo del periodo?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: IAS 19.11 fa salvo il caso in cui un altro IFRS, come IAS 2 o IAS 16, richieda o permetta di includerli nel costo di un&#x27;attività.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;post&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Il cuore della lezione&lt;/p&gt;
&lt;h2&gt;Post-employment benefits&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;La domanda chiave non è &quot;quanto pago&quot;, ma &quot;chi sopporta il rischio se le cose vanno peggio del previsto&quot;. Da lì dipende tutta la contabilità.&lt;/p&gt;
&lt;p&gt;Comprendono &lt;strong&gt;retirement benefits&lt;/strong&gt; (pensioni, capitale al pensionamento) e &lt;strong&gt;other post-employment benefits&lt;/strong&gt; (assicurazione vita, assistenza medica) &lt;span class=&quot;src&quot;&gt;p. 16&lt;/span&gt;. Lo standard si applica sia che esista un&#x27;entità separata per raccogliere i contributi, sia che non esista. La classificazione dipende dalla &lt;dfn&gt;economic substance&lt;/dfn&gt; (sostanza economica) del plan, non dalla forma (19.27).&lt;/p&gt;

&lt;h3&gt;Defined contribution contro defined benefit &lt;span class=&quot;src&quot;&gt;p. 17-18&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Defined contribution (DC)&lt;/th&gt;&lt;th&gt;Defined benefit (DB)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Cosa promette l&#x27;entità&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Un contributo, stabilito&lt;/td&gt;&lt;td&gt;Una prestazione, concordata&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Da cosa dipende la prestazione&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Contributi versati più rendimenti&lt;/td&gt;&lt;td&gt;Dai termini del plan&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Actuarial risk&lt;/strong&gt; (il beneficio diverge dalle attese)&lt;/td&gt;&lt;td&gt;Dipendente&lt;/td&gt;&lt;td&gt;Entità&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Investment risk&lt;/strong&gt; (le attività non bastano)&lt;/td&gt;&lt;td&gt;Dipendente&lt;/td&gt;&lt;td&gt;Entità&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Costo a bilancio&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Contributi maturati nel periodo&lt;/td&gt;&lt;td&gt;Calcoli attuariali complessi&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Valutazioni periodiche&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Non servono&lt;/td&gt;&lt;td&gt;PV (valore attuale) dell&#x27;obbligazione e &lt;span class=&quot;en&quot;&gt;fair value&lt;/span&gt; (valore di mercato) delle attività&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;Chi paga se il fondo va male? &lt;span class=&quot;int&quot;&gt;simulazione didattica&lt;/span&gt;&lt;/h4&gt;
&lt;p class=&quot;say&quot;&gt;Immagina un fondo con attese di 100 al momento del pensionamento. Muovi il rendimento rispetto alle attese.&lt;/p&gt;
&lt;label&gt;Scostamento&lt;input id=&quot;ri-x&quot; type=&quot;range&quot; min=&quot;-50&quot; max=&quot;50&quot; step=&quot;5&quot; value=&quot;-20&quot;&gt;&lt;output id=&quot;ri-x-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;h4&gt;Defined benefit&lt;/h4&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;span&gt;Dipendente riceve&lt;/span&gt;&lt;span class=&quot;tr&quot;&gt;&lt;i id=&quot;ri-db-e&quot; class=&quot;ca&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;ri-db-e-v&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;span&gt;Entità aggiunge&lt;/span&gt;&lt;span class=&quot;tr&quot;&gt;&lt;i id=&quot;ri-db-c&quot; class=&quot;pl&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;ri-db-c-v&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;h4&gt;Defined contribution&lt;/h4&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;span&gt;Dipendente riceve&lt;/span&gt;&lt;span class=&quot;tr&quot;&gt;&lt;i id=&quot;ri-dc-e&quot; class=&quot;ca&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;ri-dc-e-v&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;span&gt;Entità aggiunge&lt;/span&gt;&lt;span class=&quot;tr&quot;&gt;&lt;i id=&quot;ri-dc-c&quot; class=&quot;pl&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;ri-dc-c-v&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;p class=&quot;say&quot; id=&quot;ri-say&quot;&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Le actuarial assumptions: IAS 19.76 &lt;span class=&quot;src&quot;&gt;p. 20-21&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Sono le migliori stime dell&#x27;entità sulle variabili che determineranno il costo finale.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot;&gt;&lt;button type=&quot;button&quot;&gt;Demographic&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Financial&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;p&gt;Sul &lt;em&gt;chi&lt;/em&gt; e sul &lt;em&gt;quanto a lungo&lt;/em&gt;:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;mortalità;&lt;/li&gt;&lt;li&gt;turnover, invalidità, pensionamento anticipato;&lt;/li&gt;&lt;li&gt;quota di iscritti con familiari a carico aventi diritto;&lt;/li&gt;&lt;li&gt;quota che sceglie ciascuna forma di pagamento;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;en&quot;&gt;claim rates&lt;/span&gt; (frequenza delle richieste) nei piani medici.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;p&gt;Sul &lt;em&gt;quanto&lt;/em&gt; e sul &lt;em&gt;valore oggi&lt;/em&gt;:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;en&quot;&gt;discount rate&lt;/span&gt; (tasso di attualizzazione);&lt;/li&gt;&lt;li&gt;livello dei benefici e salari futuri;&lt;/li&gt;&lt;li&gt;costi medici futuri, compresa la gestione delle pratiche;&lt;/li&gt;&lt;li&gt;imposte a carico del plan su contributi o benefici relativi al servizio passato.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Funded o unfunded &lt;span class=&quot;src&quot;&gt;p. 22&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Un DB può essere &lt;dfn&gt;unfunded&lt;/dfn&gt; (nessuna attività separata) oppure &lt;dfn&gt;funded&lt;/dfn&gt;, in tutto o in parte, con contributi a un fondo giuridicamente separato. Anche se esiste un fondo, l&#x27;entità sta in sostanza garantendo i rischi: dovrà coprire gli ammanchi. Perciò il costo di un DB &lt;strong&gt;non coincide necessariamente&lt;/strong&gt; con il contributo del periodo (19.56). La complessità nasce da due fatti: ipotesi attuariali con possibili &lt;dfn&gt;actuarial gains and losses&lt;/dfn&gt; (guadagni e perdite attuariali), e attualizzazione per pagamenti lontani (19.55).&lt;/p&gt;

&lt;h3&gt;I quattro passi di IAS 19.57 &lt;span class=&quot;src&quot;&gt;p. 23-24&lt;/span&gt;&lt;/h3&gt;
&lt;figure&gt;&lt;div class=&quot;scroll&quot;&gt;
&lt;svg id=&quot;s57&quot; viewBox=&quot;0 0 680 118&quot; role=&quot;img&quot; aria-label=&quot;Sequenza: deficit o surplus, net defined benefit liability, profit or loss, other comprehensive income&quot;&gt;
&lt;g class=&quot;ochre&quot;&gt;
&lt;g data-s=&quot;0&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;4&quot; y=&quot;14&quot; width=&quot;154&quot; height=&quot;84&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;81&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;a&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;81&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;Deficit o surplus&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;81&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;DBO − plan assets&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;1&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;176&quot; y=&quot;14&quot; width=&quot;154&quot; height=&quot;84&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;253&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;b&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;253&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;Net liability&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;253&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;con asset ceiling&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;2&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;348&quot; y=&quot;14&quot; width=&quot;154&quot; height=&quot;84&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;425&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;c&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;425&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;Profit or loss&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;425&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;service, net interest&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;3&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;520&quot; y=&quot;14&quot; width=&quot;154&quot; height=&quot;84&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;597&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;d&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;597&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;OCI&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;597&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;remeasurements&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;&lt;/svg&gt;&lt;/div&gt;&lt;/figure&gt;
&lt;div data-stepper data-svg=&quot;s57&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;a. Determinare il deficit o surplus&lt;/h4&gt;&lt;ol&gt;&lt;li&gt;Con il &lt;dfn&gt;projected unit credit method&lt;/dfn&gt; (PUC, metodo della proiezione unitaria) si stima il costo finale del beneficio maturato col servizio presente e passato.&lt;/li&gt;&lt;li&gt;Si attualizza, ottenendo il &lt;dfn&gt;defined benefit obligation&lt;/dfn&gt; (DBO, valore attuale dell&#x27;obbligazione) e il &lt;dfn&gt;current service cost&lt;/dfn&gt; (costo del servizio dell&#x27;anno).&lt;/li&gt;&lt;li&gt;Si sottrae il &lt;span class=&quot;en&quot;&gt;fair value&lt;/span&gt; delle &lt;dfn&gt;plan assets&lt;/dfn&gt; (attività al servizio del plan).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;b. Determinare la net defined benefit liability (asset)&lt;/h4&gt;&lt;p&gt;È il deficit o surplus, corretto per l&#x27;eventuale &lt;dfn&gt;asset ceiling&lt;/dfn&gt;: il tetto che limita un&#x27;attività netta.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;c. Cosa va in profit or loss (P&amp;amp;L, conto economico)&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Current service cost.&lt;/li&gt;&lt;li&gt;&lt;dfn&gt;Past service cost&lt;/dfn&gt; (effetto di modifiche al plan) e gain or loss su &lt;dfn&gt;settlement&lt;/dfn&gt; (estinzione dell&#x27;obbligazione).&lt;/li&gt;&lt;li&gt;&lt;dfn&gt;Net interest&lt;/dfn&gt; sulla net defined benefit liability (asset).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;d. Cosa va in other comprehensive income&lt;/h4&gt;&lt;p&gt;I &lt;dfn&gt;remeasurements&lt;/dfn&gt; (rimisurazioni) della net liability, in &lt;dfn&gt;other comprehensive income&lt;/dfn&gt; (OCI, altre componenti di conto economico complessivo):&lt;/p&gt;&lt;ul&gt;&lt;li&gt;actuarial gains and losses;&lt;/li&gt;&lt;li&gt;rendimento delle plan assets, escluso quanto già nel net interest;&lt;/li&gt;&lt;li&gt;variazione dell&#x27;asset ceiling, escluso quanto già nel net interest.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Con più plan rilevanti, la procedura si applica a ciascuno separatamente.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;Dal DBO alla posta in bilancio&lt;/h4&gt;
&lt;label&gt;DBO&lt;input id=&quot;nl-d&quot; type=&quot;range&quot; min=&quot;50&quot; max=&quot;150&quot; step=&quot;5&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;nl-d-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Plan assets&lt;input id=&quot;nl-a&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;125&quot;&gt;&lt;output id=&quot;nl-a-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Benefici recuperabili&lt;input id=&quot;nl-c&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;50&quot; step=&quot;5&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;nl-c-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;b id=&quot;nl-r1&quot;&gt;&lt;/b&gt;DBO&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;nl-r2&quot;&gt;&lt;/b&gt;plan assets&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;nl-r3&quot;&gt;&lt;/b&gt;effetto asset ceiling&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;nl-r4&quot;&gt;&lt;/b&gt;&lt;span id=&quot;nl-l4&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;say&quot; id=&quot;nl-say&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;say&quot; style=&quot;color:var(--soft);font-size:.86rem&quot;&gt;Valori illustrativi. La logica del tetto la conferma BNP Paribas: l&#x27;attività si iscrive se rappresenta un beneficio futuro sotto forma di minori contributi o rimborsi &lt;span class=&quot;src&quot;&gt;p. 50&lt;/span&gt;. Il surplus in Türkiye non è iscritto &lt;span class=&quot;src&quot;&gt;p. 54&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Allenati: dove va ogni voce?&lt;/h3&gt;
&lt;ul class=&quot;sort&quot;&gt;
&lt;li data-a=&quot;pl&quot; data-w=&quot;Il costo del servizio dell&#x27;anno è il cuore del costo operativo.&quot;&gt;&lt;span&gt;Current service cost&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;pl&quot;&gt;P&amp;amp;L&lt;/button&gt;&lt;button data-v=&quot;oci&quot;&gt;OCI&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;pl&quot; data-w=&quot;Una modifica al plan impatta subito il conto economico.&quot;&gt;&lt;span&gt;Past service cost&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;pl&quot;&gt;P&amp;amp;L&lt;/button&gt;&lt;button data-v=&quot;oci&quot;&gt;OCI&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;pl&quot; data-w=&quot;È un componente del costo per passaggio di tempo sulla posizione netta.&quot;&gt;&lt;span&gt;Net interest&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;pl&quot;&gt;P&amp;amp;L&lt;/button&gt;&lt;button data-v=&quot;oci&quot;&gt;OCI&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;pl&quot; data-w=&quot;Elencata tra le voci a conto economico in IAS 19.57(c).&quot;&gt;&lt;span&gt;Gain or loss su settlement&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;pl&quot;&gt;P&amp;amp;L&lt;/button&gt;&lt;button data-v=&quot;oci&quot;&gt;OCI&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;oci&quot; data-w=&quot;È il caso tipico di remeasurement.&quot;&gt;&lt;span&gt;Actuarial gains and losses&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;pl&quot;&gt;P&amp;amp;L&lt;/button&gt;&lt;button data-v=&quot;oci&quot;&gt;OCI&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;oci&quot; data-w=&quot;La parte oltre il net interest è un remeasurement.&quot;&gt;&lt;span&gt;Rendimento delle plan assets oltre il net interest&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;pl&quot;&gt;P&amp;amp;L&lt;/button&gt;&lt;button data-v=&quot;oci&quot;&gt;OCI&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;oci&quot; data-w=&quot;Anch&#x27;essa remeasurement, esclusa la quota nel net interest.&quot;&gt;&lt;span&gt;Variazione dell&#x27;asset ceiling oltre il net interest&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;pl&quot;&gt;P&amp;amp;L&lt;/button&gt;&lt;button data-v=&quot;oci&quot;&gt;OCI&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;p class=&quot;say&quot; style=&quot;font-weight:600&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;

&lt;div class=&quot;tint warn&quot;&gt;&lt;p&gt;&lt;strong&gt;Attenzione alle slide p. 25-26.&lt;/strong&gt; La tabella del &lt;span class=&quot;en&quot;&gt;service cost&lt;/span&gt; elenca &lt;span class=&quot;en&quot;&gt;expected return on assets&lt;/span&gt; e &lt;span class=&quot;en&quot;&gt;recognised actuarial gains and losses&lt;/span&gt;; la slide 26 definisce la &lt;span class=&quot;en&quot;&gt;net liability&lt;/span&gt; come DBO al netto di utili e perdite non riconosciuti. Sono concetti del regime precedente alla modifica del 2011, come ricorda la nota sul &lt;a href=&quot;#modifiche&quot;&gt;corridor approach&lt;/a&gt;. Per il regime attuale fai riferimento a p. 24.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Un plan si chiama &quot;a contribuzione&quot;, ma l&#x27;entità garantisce un rendimento minimo. Che cos&#x27;è?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Conta la sostanza. Se l&#x27;entità sopporta parte del rischio, il plan ha natura DB in tutto o in parte. BNP Paribas lo mostra in Belgio: &lt;span class=&quot;en&quot;&gt;provision&lt;/span&gt; per la garanzia di rendimento non coperta dall&#x27;assicuratore &lt;span class=&quot;src&quot;&gt;p. 53&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché il costo DB può essere diverso dal contributo versato?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché il contributo è una scelta di finanziamento, mentre il costo misura il beneficio maturato. In più, l&#x27;entità garantisce il risultato finale (19.56).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;I tassi di mercato salgono: cosa succede al DBO e dove va l&#x27;effetto?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il DBO scende, perché si attualizza di più. È un actuarial gain da ipotesi finanziarie, in OCI.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un surplus di 25 con benefici recuperabili per 10: quanto si iscrive?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Un&#x27;attività di 10. Il resto (15) è l&#x27;effetto dell&#x27;asset ceiling.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;puc&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Laboratorio&lt;/p&gt;
&lt;h2&gt;Il projected unit credit method&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;Ogni anno di servizio fa maturare una &quot;unità&quot; di beneficio. Ogni unità si misura per conto suo, e la somma costruisce l&#x27;obbligazione finale &lt;span class=&quot;src&quot;&gt;p. 19&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;Il nome contiene il metodo. &lt;strong&gt;Projected&lt;/strong&gt;: si usa il salario proiettato a fine carriera, non quello di oggi. &lt;strong&gt;Unit&lt;/strong&gt;: il beneficio finale si ripartisce per anni di servizio. &lt;strong&gt;Credit&lt;/strong&gt;: ogni anno accredita un&#x27;unità. Poi si attualizza &lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Salario finale = S × (1 + g)&lt;sup&gt;n&lt;/sup&gt; &amp;nbsp;·&amp;nbsp; Unità annua = a × salario finale&lt;br&gt;Interest cost = DBO iniziale × r &amp;nbsp;·&amp;nbsp; Current service cost = variazione del DBO − interest cost&lt;/div&gt;
&lt;p&gt;&lt;span class=&quot;en&quot;&gt;Interest cost&lt;/span&gt;: la rivalutazione del fondo accumulato a inizio periodo, perché il pagamento è più vicino. &lt;span class=&quot;en&quot;&gt;Current service cost&lt;/span&gt;: il &quot;vero&quot; beneficio maturato nel periodo &lt;span class=&quot;src&quot;&gt;p. 42&lt;/span&gt;.&lt;/p&gt;

&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;Prova i numeri &lt;span class=&quot;src&quot;&gt;p. 41-43&lt;/span&gt;&lt;/h4&gt;
&lt;div class=&quot;seg&quot;&gt;&lt;button class=&quot;btn&quot; data-set=&quot;a&quot;&gt;Esempio slide 41-42&lt;/button&gt;&lt;button class=&quot;btn&quot; data-set=&quot;b&quot;&gt;Recalculated, slide 43&lt;/button&gt;&lt;/div&gt;
&lt;label&gt;Salario annuo S&lt;input id=&quot;pu-s&quot; type=&quot;range&quot; min=&quot;20000&quot; max=&quot;150000&quot; step=&quot;1000&quot; value=&quot;50000&quot;&gt;&lt;output id=&quot;pu-s-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Crescita salari g&lt;input id=&quot;pu-g&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.5&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;pu-g-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Quota per anno a (‰)&lt;input id=&quot;pu-a&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;50&quot; step=&quot;1&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;pu-a-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Durata n (anni)&lt;input id=&quot;pu-n&quot; type=&quot;range&quot; min=&quot;3&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;pu-n-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Tasso di sconto r&lt;input id=&quot;pu-r&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;pu-r-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Anno analizzato&lt;input id=&quot;pu-t&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;5&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;pu-t-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;div class=&quot;seg&quot; id=&quot;pu-m&quot; role=&quot;group&quot; aria-label=&quot;Convenzione di sconto&quot;&gt;&lt;button data-v=&quot;slide&quot;&gt;Sconto come nella slide&lt;/button&gt;&lt;button data-v=&quot;ias&quot;&gt;Sconto sugli anni residui&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;b id=&quot;pu-f&quot;&gt;&lt;/b&gt;salario finale&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;pu-u&quot;&gt;&lt;/b&gt;unità annua&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;pu-tot&quot;&gt;&lt;/b&gt;totale a scadenza&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Analisi dell&#x27;anno&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;pu-tb&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;svg viewBox=&quot;0 0 620 250&quot; role=&quot;img&quot; aria-label=&quot;Grafico dell&#x27;obbligazione per anno: DBO iniziale, interest cost e current service cost impilati; la linea tratteggiata è il beneficio cumulato non attualizzato.&quot;&gt;&lt;g id=&quot;pu-svg&quot;&gt;&lt;/g&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;p class=&quot;say&quot; style=&quot;font-size:.84rem;color:var(--soft)&quot;&gt;&lt;span class=&quot;key&quot; style=&quot;background:var(--rule)&quot;&gt;&lt;/span&gt;DBO iniziale &lt;span class=&quot;key&quot; style=&quot;background:var(--ochre);margin-left:.6em&quot;&gt;&lt;/span&gt;interest cost &lt;span class=&quot;key&quot; style=&quot;background:var(--accent);margin-left:.6em&quot;&gt;&lt;/span&gt;current service cost · linea tratteggiata: beneficio cumulato non attualizzato&lt;/p&gt;
&lt;p class=&quot;say&quot; id=&quot;pu-say&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;say&quot; style=&quot;font-size:.84rem;color:var(--soft)&quot;&gt;Le slide mostrano l&#x27;analisi anno 3 solo per il primo esempio (A 3.152,97; B 2.207,08; C 945,89; D 110,35; E 835,54). Per il &quot;recalculated&quot; danno solo i benefici cumulati: l&#x27;analisi anno per anno è calcolata qui. Gli esempi vengono dal testo Ipsoa, pp. 267-268, citato nella slide.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;tint warn&quot;&gt;&lt;p&gt;&lt;strong&gt;Punto da controllare a lezione.&lt;/strong&gt; A p. 42 l&#x27;obbligazione di fine anno 3 si sconta per 3 anni, quella di fine anno 2 per 2 anni: il coefficiente è legato agli anni &lt;em&gt;trascorsi&lt;/em&gt;. Nel PUC si attualizza invece per il tempo che &lt;em&gt;manca&lt;/em&gt; al pagamento: a fine anno 3 restano 2 anni &lt;a class=&quot;ext&quot; href=&quot;https://www.cpdbox.com/ifrs-projected-unit-credit-method-ias-19-example/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;. Con gli anni residui l&#x27;anno 3 diventa A 3.310,62; B 2.101,98; C 1.208,64; D 105,10; E 1.103,54.&lt;/p&gt;&lt;p&gt;La prova è semplice: al termine del contratto la passività deve eguagliare i 6.083,26 € da pagare. Con la convenzione della slide si ferma a 4.766,40 €. Prova l&#x27;interruttore qui sopra e, per l&#x27;esame, chiedi al docente quale convenzione attende.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Salario 50.000, crescita 4%, 5 anni, quota 2%: qual è l&#x27;unità annua?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;50.000 × 1,04&lt;sup&gt;5&lt;/sup&gt; = 60.832,65; × 2% = 1.216,65 €.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché si usa il salario finale e non quello di oggi?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché il beneficio è legato all&#x27;ultima retribuzione. Il &quot;projected&quot; incorpora la crescita attesa, che è una ipotesi attuariale finanziaria.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;DBO di apertura 2.102 e sconto 5%: quanto vale l&#x27;interest cost?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;105,1. È il tasso applicato al DBO di apertura.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Nella convenzione ad anni residui, perché il current service cost sale ogni anno?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;L&#x27;unità non attualizzata è costante, ma l&#x27;unità di ogni anno successivo è più vicina al pagamento e quindi si sconta meno.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part brick&quot; id=&quot;tfr&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Il caso italiano&lt;/p&gt;
&lt;h2&gt;TFR: un istituto, due nature contabili&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;Il &lt;dfn&gt;Trattamento di Fine Rapporto&lt;/dfn&gt; (severance pay) dimostra che la classificazione segue il rischio: la stessa voce è un defined benefit o un defined contribution secondo data e destinazione.&lt;/p&gt;
&lt;p&gt;Il TFR è una somma che il datore di lavoro accantona ogni anno e paga alla cessazione del rapporto. Il codice civile (art. 2120) ne fissa quota e rivalutazione, e nei bilanci OIC si iscrive l&#x27;importo maturato &lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt;. Per IAS 19, invece, prima della riforma era un post-employment benefit assimilabile a un defined benefit, come confermato dall&#x27;IFRIC &lt;span class=&quot;src&quot;&gt;p. 19&lt;/span&gt;. Questo comporta &lt;strong&gt;variabili demografiche e finanziarie&lt;/strong&gt;, sconto e PUC. Anche l&#x27;Agenzia delle Entrate lo riporta nella Risoluzione 133/2006 &lt;a class=&quot;ext&quot; href=&quot;https://agenziaentrate.gov.it/portale/documents/20143/306666/Risoluzione+n.+133+del+13+novembre+2006_ris_133.pdf/4b5b3529-2f16-4888-f65b-5808d1ef063d&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;

&lt;div class=&quot;tint warn&quot;&gt;&lt;p&gt;&lt;strong&gt;Aggiornamento rispetto alle slide.&lt;/strong&gt; Il confine a 49/50 dipendenti è quello storico. Le fonti sulla legge di bilancio 2026 (L. 199/2025) e sulla circolare INPS 12/2026 riportano soglie mobili per il versamento al Fondo di Tesoreria: 60 addetti per il 2026-2027, 50 per il 2028-2031, 40 dal 2032, con regole proprie per le aziende di nuova costituzione &lt;a class=&quot;ext&quot; href=&quot;https://www.inps.it/it/it/inps-comunica/notizie/dettaglio-news-page.news.2026.02.fondo-di-tesoreria-nuove-soglie-dimensionali-dal-2026.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt; &lt;a class=&quot;ext&quot; href=&quot;https://www.cgil.it/strumenti/ufficio-giuridico/tfr-e-fondo-tesoreria-inps-cosa-cambia-dal-2026-con-la-nuova-legge-di-bilancio-fxmh7qx7&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;. La logica contabile non cambia: chi versa al Fondo ha un DC. Per l&#x27;esame usa la soglia delle slide e chiedi conferma al docente; per i casi reali controlla il testo della circolare.&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;La classificazione: prova tu &lt;span class=&quot;src&quot;&gt;p. 29-30&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;h4&gt;Quando è maturata la quota di TFR?&lt;/h4&gt;
&lt;div class=&quot;seg&quot; id=&quot;c-when&quot;&gt;&lt;button data-v=&quot;old&quot;&gt;Fino al 31/12/2006&lt;/button&gt;&lt;button data-v=&quot;new&quot;&gt;Dal 1/1/2007&lt;/button&gt;&lt;/div&gt;
&lt;div id=&quot;c-dest-row&quot; hidden&gt;&lt;h4&gt;Dove va?&lt;/h4&gt;&lt;div class=&quot;seg&quot; id=&quot;c-dest&quot;&gt;&lt;button data-v=&quot;fund&quot;&gt;Previdenza complementare&lt;/button&gt;&lt;button data-v=&quot;co&quot;&gt;Il dipendente la lascia in azienda&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div id=&quot;c-size-row&quot; hidden&gt;&lt;h4&gt;Dimensione dell&#x27;azienda (soglia delle slide)&lt;/h4&gt;&lt;div class=&quot;seg&quot; id=&quot;c-size&quot;&gt;&lt;button data-v=&quot;small&quot;&gt;Meno di 50 dipendenti&lt;/button&gt;&lt;button data-v=&quot;big&quot;&gt;Almeno 50 dipendenti&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tint&quot; id=&quot;c-out&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Tipologia&lt;/th&gt;&lt;th&gt;Rischio attuariale e di investimento&lt;/th&gt;&lt;th&gt;Classificazione&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Maturato fino al 31/12/2006&lt;/td&gt;&lt;td&gt;Azienda&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Benefit&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Dal 1/1/2007, almeno 50 dipendenti&lt;/td&gt;&lt;td&gt;Non sull&#x27;azienda&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Contribution&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Dal 1/1/2007, meno di 50, a previdenza complementare&lt;/td&gt;&lt;td&gt;Non sull&#x27;azienda&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Contribution&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Dal 1/1/2007, meno di 50, resta in azienda&lt;/td&gt;&lt;td&gt;Azienda&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Benefit&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;Da qui la prassi del bilancio IFRS: dal 2007 l&#x27;azienda continua a valutare con tecniche attuariali la parte al 31/12/2006, mentre per le quote destinate a fondi o al Fondo di Tesoreria iscrive i contributi dovuti, senza ipotesi attuariali né sconto, perché la scadenza è inferiore a 12 mesi &lt;span class=&quot;src&quot;&gt;p. 29&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;Il pezzo &quot;INPS Fund&quot; dello schema era FondInps, destinatario residuale: la legge di bilancio 2018 ne ha disposto la soppressione e il DM 85/2020 ha individuato il Fondo Cometa per il trasferimento delle posizioni &lt;a class=&quot;ext&quot; href=&quot;https://www.normattiva.it/eli/id/2020/07/30//20G00103/CONSOLIDATED&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Azienda con 200 dipendenti. Il TFR 2015 è lasciato &quot;in azienda&quot; dal dipendente. Qual è la classificazione per l&#x27;azienda?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Defined contribution: la quota va al Fondo di Tesoreria INPS e il rischio non resta all&#x27;azienda.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Stessa azienda: il TFR maturato nel 2004?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Defined benefit: la quota è rimasta in azienda con le vecchie regole, da valutare con tecniche attuariali.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché il debito verso il fondo pensione non si attualizza?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché si paga entro 12 mesi: l&#x27;effetto dello sconto non è rilevante e non servono ipotesi attuariali.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Il dipendente può cambiare idea dopo aver scelto la previdenza complementare?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Non secondo le slide: quella scelta è irrevocabile. La scelta di tenere il TFR in azienda, invece, è revocabile.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part slate&quot; id=&quot;altri&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;IAS 19, par. 153-157&lt;/p&gt;
&lt;h2&gt;Other long-term employee benefits&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;Come il defined benefit nella tecnica, ma più semplice nell&#x27;esito: nessun passaggio da OCI.&lt;/p&gt;
&lt;p&gt;Rientrano qui i benefici &lt;strong&gt;non&lt;/strong&gt; liquidabili interamente entro dodici mesi: congedi lunghi, premi di anzianità, invalidità di lungo periodo, &lt;span class=&quot;en&quot;&gt;profit-sharing&lt;/span&gt; e bonus differiti, &lt;span class=&quot;en&quot;&gt;deferred remuneration&lt;/span&gt; (retribuzione differita) &lt;span class=&quot;src&quot;&gt;p. 31&lt;/span&gt;. Il motivo della semplificazione: la misura è di solito meno incerta rispetto ai post-employment (19.154).&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Post-employment DB&lt;/h4&gt;&lt;p&gt;Service cost e net interest: &lt;strong&gt;P&amp;amp;L&lt;/strong&gt;.&lt;br&gt;Remeasurements: &lt;strong&gt;OCI&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Other long-term&lt;/h4&gt;&lt;p&gt;Service cost, net interest e remeasurements: &lt;strong&gt;tutto in P&amp;amp;L&lt;/strong&gt;, salvo che un altro IFRS li faccia entrare nel costo di un&#x27;attività (19.156).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Il caso dell&#x27;invalidità &lt;span class=&quot;src&quot;&gt;p. 32&lt;/span&gt;&lt;/h3&gt;
&lt;figure&gt;&lt;div class=&quot;scroll&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 158&quot; role=&quot;img&quot; aria-label=&quot;Albero: se il beneficio di invalidità dipende dall&#x27;anzianità, l&#x27;obbligo nasce con il servizio; se è uguale per tutti, il costo si rileva quando avviene l&#x27;evento.&quot;&gt;
&lt;g class=&quot;slate&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;170&quot; y=&quot;6&quot; width=&quot;300&quot; height=&quot;42&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;320&quot; y=&quot;32&quot; text-anchor=&quot;middle&quot;&gt;Il beneficio dipende dall&#x27;anzianità?&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M240 48V70H160V84M400 48V70H480V84&quot;/&gt;&lt;text class=&quot;s&quot; x=&quot;195&quot; y=&quot;64&quot;&gt;sì&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;440&quot; y=&quot;64&quot;&gt;no&lt;/text&gt;
&lt;g class=&quot;slate&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;20&quot; y=&quot;84&quot; width=&quot;280&quot; height=&quot;66&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;160&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;L&#x27;obbligo nasce col servizio&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;160&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot;&gt;misura: probabilità del pagamento&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;160&quot; y=&quot;143&quot; text-anchor=&quot;middle&quot;&gt;e durata attesa&lt;/text&gt;
&lt;rect class=&quot;b&quot; x=&quot;340&quot; y=&quot;84&quot; width=&quot;280&quot; height=&quot;66&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;480&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;Costo quando avviene l&#x27;evento&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;480&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot;&gt;stesso livello per ogni invalido,&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;480&quot; y=&quot;143&quot; text-anchor=&quot;middle&quot;&gt;qualunque sia l&#x27;anzianità&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/div&gt;&lt;figcaption&gt;IAS 19.157. È la stessa logica delle assenze: se lavorare aumenta il diritto, il costo matura col lavoro.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Premio per i 25 anni di servizio, rivalutazione dell&#x27;ipotesi attuariale: dove va l&#x27;effetto?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In profit or loss. Sugli other long-term non c&#x27;è OCI.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché si accetta un metodo semplificato?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché di solito la misura è meno incerta rispetto ai post-employment (19.154), quindi l&#x27;effetto dei remeasurements è più contenuto.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un bonus pagato a 30 mesi dalla chiusura dell&#x27;esercizio: quale categoria?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Other long-term: non è liquidato entro dodici mesi dalla fine dell&#x27;esercizio.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part brick&quot; id=&quot;term&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;IAS 19, par. 159-171&lt;/p&gt;
&lt;h2&gt;Termination benefits&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;L&#x27;unica categoria in cui l&#x27;obbligo non nasce dal lavoro prestato, ma dalla fine del rapporto &lt;span class=&quot;src&quot;&gt;p. 33&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;Può derivare dalla decisione dell&#x27;entità di interrompere il rapporto, o dalla decisione del dipendente di accettare un&#x27;offerta in cambio della cessazione. Spesso si accompagna a un &lt;span class=&quot;en&quot;&gt;restructuring&lt;/span&gt; (ristrutturazione aziendale), regolato da IAS 37.&lt;/p&gt;
&lt;h3&gt;Quando si rileva: the earlier of &lt;span class=&quot;src&quot;&gt;p. 34&lt;/span&gt;&lt;/h3&gt;
&lt;figure&gt;&lt;div class=&quot;scroll&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 138&quot; role=&quot;img&quot; aria-label=&quot;Si rileva alla prima di due date: quando l&#x27;offerta non è più ritirabile, oppure quando si rilevano i costi di ristrutturazione IAS 37.&quot;&gt;
&lt;g class=&quot;brick&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;14&quot; y=&quot;10&quot; width=&quot;280&quot; height=&quot;50&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;154&quot; y=&quot;32&quot; text-anchor=&quot;middle&quot;&gt;L&#x27;offerta non è più ritirabile&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;154&quot; y=&quot;49&quot; text-anchor=&quot;middle&quot;&gt;IAS 19.165(a)&lt;/text&gt;
&lt;rect class=&quot;b&quot; x=&quot;14&quot; y=&quot;78&quot; width=&quot;280&quot; height=&quot;50&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;154&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;Costi di restructuring ex IAS 37&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;154&quot; y=&quot;117&quot; text-anchor=&quot;middle&quot;&gt;con pagamento di termination benefits&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M294 35H340V103H294M340 69H392&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;g class=&quot;terra&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;392&quot; y=&quot;30&quot; width=&quot;232&quot; height=&quot;78&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;508&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot;&gt;La prima delle due&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;508&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot;&gt;si rilevano liability ed expense&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/div&gt;&lt;/figure&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot;&gt;&lt;button type=&quot;button&quot;&gt;Decide il dipendente&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Decide l&#x27;entità&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;p&gt;L&#x27;offerta non è più ritirabile dalla prima di queste date (19.166):&lt;/p&gt;&lt;ul&gt;&lt;li&gt;il dipendente accetta;&lt;/li&gt;&lt;li&gt;ha effetto una restrizione legale, regolamentare o contrattuale alla facoltà di ritiro. Se esisteva già, è il momento dell&#x27;offerta.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;p&gt;L&#x27;offerta non è più ritirabile quando l&#x27;entità ha comunicato agli interessati un piano (19.167) con &lt;strong&gt;tutti&lt;/strong&gt; questi requisiti &lt;span class=&quot;src&quot;&gt;p. 35&lt;/span&gt;:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;è improbabile che subisca modifiche significative;&lt;/li&gt;&lt;li&gt;indica numero, funzioni, sedi dei dipendenti e data di completamento, senza dover nominare i singoli;&lt;/li&gt;&lt;li&gt;fissa i benefici in modo abbastanza dettagliato da far capire a ciascuno tipo e importo.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Con i termination può servire anche contabilizzare una &lt;span class=&quot;en&quot;&gt;plan amendment&lt;/span&gt; (modifica) o una &lt;span class=&quot;en&quot;&gt;curtailment&lt;/span&gt; (riduzione) di altri benefici (19.168).&lt;/p&gt;
&lt;h3&gt;Come si misura: secondo la natura &lt;span class=&quot;src&quot;&gt;p. 36&lt;/span&gt;&lt;/h3&gt;
&lt;figure&gt;&lt;div class=&quot;scroll&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 196&quot; role=&quot;img&quot; aria-label=&quot;Albero: se il benefit è un miglioramento del post-employment si applicano quelle regole. Altrimenti, se liquidato entro 12 mesi regole short-term, se oltre regole other long-term.&quot;&gt;
&lt;g class=&quot;brick&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;140&quot; y=&quot;6&quot; width=&quot;360&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;320&quot; y=&quot;31&quot; text-anchor=&quot;middle&quot;&gt;È un miglioramento dei post-employment?&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M220 46V68H120V82M420 46V68H440V82&quot;/&gt;&lt;text class=&quot;s&quot; x=&quot;160&quot; y=&quot;62&quot;&gt;sì&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;430&quot; y=&quot;62&quot; text-anchor=&quot;end&quot;&gt;no&lt;/text&gt;
&lt;g class=&quot;ochre&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;20&quot; y=&quot;82&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;120&quot; y=&quot;111&quot; text-anchor=&quot;middle&quot;&gt;Regole post-employment&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;brick&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;300&quot; y=&quot;82&quot; width=&quot;280&quot; height=&quot;42&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;440&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;Liquidato interamente entro 12 mesi?&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M380 124V146H330V152M500 124V146H530V152&quot;/&gt;&lt;text class=&quot;s&quot; x=&quot;350&quot; y=&quot;141&quot;&gt;sì&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;525&quot; y=&quot;141&quot;&gt;no&lt;/text&gt;
&lt;g class=&quot;sage&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;240&quot; y=&quot;152&quot; width=&quot;170&quot; height=&quot;38&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;325&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot;&gt;Regole short-term&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;slate&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;440&quot; y=&quot;152&quot; width=&quot;180&quot; height=&quot;38&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;530&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot;&gt;Regole other long-term&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/div&gt;&lt;/figure&gt;
&lt;h3&gt;Cosa non è termination &lt;span class=&quot;src&quot;&gt;p. 37&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Dimissioni spontanee, senza offerta, e pensionamento obbligatorio sono post-employment. Se il beneficio è più basso quando è il dipendente a chiedere la cessazione, &lt;strong&gt;solo la differenza&lt;/strong&gt; rispetto al caso di decisione dell&#x27;entità è termination benefit (19.160).&lt;/p&gt;
&lt;ul class=&quot;sort&quot;&gt;
&lt;li data-a=&quot;term&quot; data-w=&quot;L&#x27;entità decide l&#x27;interruzione prima del pensionamento.&quot;&gt;&lt;span&gt;Licenziamento collettivo con buonuscita prima dell&#x27;età pensionabile&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;term&quot;&gt;Termination&lt;/button&gt;&lt;button data-v=&quot;post&quot;&gt;Post-employment&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;term&quot; data-w=&quot;Il dipendente accetta un&#x27;offerta in cambio della cessazione.&quot;&gt;&lt;span&gt;Incentivo all&#x27;esodo volontario accettato&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;term&quot;&gt;Termination&lt;/button&gt;&lt;button data-v=&quot;post&quot;&gt;Post-employment&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;post&quot; data-w=&quot;Richiesta del dipendente, senza offerta dell&#x27;entità.&quot;&gt;&lt;span&gt;Importo pagato a chi si dimette senza offerta&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;term&quot;&gt;Termination&lt;/button&gt;&lt;button data-v=&quot;post&quot;&gt;Post-employment&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;post&quot; data-w=&quot;19.160 lo esclude espressamente.&quot;&gt;&lt;span&gt;Pagamento dovuto per pensionamento obbligatorio&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;term&quot;&gt;Termination&lt;/button&gt;&lt;button data-v=&quot;post&quot;&gt;Post-employment&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;p class=&quot;say&quot; style=&quot;font-weight:600&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Benefit di 30 se licenziato, 10 se dimissionario. Quanto è termination benefit?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;20: la differenza. I 10 sono in sostanza post-employment (19.160). Importi illustrativi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Il piano di esuberi deve nominare ogni persona?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: basta numero, funzioni, sedi e data prevista di completamento (19.167).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quale differenza c&#x27;è tra il termination e gli altri benefici sul fatto generatore?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Gli altri nascono dal servizio reso; il termination dalla cessazione del rapporto.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part slate&quot; id=&quot;modifiche&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Evoluzione dello standard&lt;/p&gt;
&lt;h2&gt;Le modifiche: 2011, 2019 e la strada non presa del 2023&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;Via l&#x27;opzione che teneva le perdite attuariali fuori bilancio: oggi la posizione netta del plan si vede tutta.&lt;/p&gt;
&lt;h3&gt;Giugno 2011, in vigore dall&#x27;1/1/2013 &lt;span class=&quot;src&quot;&gt;p. 38-39&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Tema&lt;/th&gt;&lt;th&gt;Dopo la modifica&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Actuarial gains and losses&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Riconosciuti nello stato patrimoniale come rettifiche di patrimonio netto, non nel costo annuo a conto economico.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Corridor approach&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Eliminato.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Discount&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Rendimento atteso delle attività pari al tasso di sconto attuariale. Modifiche al plan: subito a conto economico per intero.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Costo annuo&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Due componenti: &lt;span class=&quot;en&quot;&gt;service cost&lt;/span&gt; e &lt;span class=&quot;en&quot;&gt;net interest cost&lt;/span&gt;.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Disclosure&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Più ampia e complessa, per spiegare come sono determinati i benefici.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;Nell&#x27;UE la modifica passa dal Regolamento (UE) 475/2012, citato a p. 26, che ha adottato insieme IAS 1 e IAS 19 &lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/reg/2012/475/2012-07-01&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;
&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;Che cos&#x27;era il corridor &lt;span class=&quot;src&quot;&gt;p. 38&lt;/span&gt;&lt;/h4&gt;
&lt;p class=&quot;say&quot;&gt;Si potevano non riconoscere gli utili e le perdite cumulati se erano inferiori al maggiore tra il 10% del PV dell&#x27;obbligazione e il 10% del fair value delle attività, alla fine dell&#x27;esercizio precedente.&lt;/p&gt;
&lt;label&gt;PV obbligazione&lt;input id=&quot;co-d&quot; type=&quot;range&quot; min=&quot;100&quot; max=&quot;3000&quot; step=&quot;50&quot; value=&quot;1000&quot;&gt;&lt;output id=&quot;co-d-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Fair value attività&lt;input id=&quot;co-a&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;3000&quot; step=&quot;50&quot; value=&quot;800&quot;&gt;&lt;output id=&quot;co-a-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Gain (−) o loss (+)&lt;input id=&quot;co-g&quot; type=&quot;range&quot; min=&quot;-600&quot; max=&quot;600&quot; step=&quot;10&quot; value=&quot;70&quot;&gt;&lt;output id=&quot;co-g-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;svg viewBox=&quot;0 0 620 104&quot; role=&quot;img&quot; aria-label=&quot;Linea con la fascia del corridor e il punto degli utili o perdite cumulati&quot;&gt;&lt;g id=&quot;co-svg&quot;&gt;&lt;/g&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;b id=&quot;co-c&quot;&gt;&lt;/b&gt;ampiezza del corridor&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;co-ex&quot;&gt;&lt;/b&gt;eccedenza prima del 2013&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;co-oci&quot;&gt;&lt;/b&gt;in OCI oggi&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;say&quot; id=&quot;co-say&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;say&quot; style=&quot;font-size:.86rem;color:var(--soft)&quot;&gt;Valori illustrativi. L&#x27;eccedenza non entrava per intero a conto economico in un colpo: si poteva distribuire sulla vita lavorativa residua &lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Regolamento (UE) 2019/402 &lt;span class=&quot;src&quot;&gt;p. 40&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Il problema: un plan viene modificato, ridotto o estinto a metà anno. Quali ipotesi usare per il resto dell&#x27;esercizio? La risposta: dopo l&#x27;evento si usano le &lt;strong&gt;ipotesi aggiornate&lt;/strong&gt; dalla rimisurazione della net defined benefit liability (asset) per la parte restante del periodo. Il regolamento è del 13 marzo 2019, l&#x27;amendment IASB è del febbraio 2018, e si applica dagli esercizi iniziati dall&#x27;1/1/2019 &lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/reg/2019/402/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna&lt;/a&gt;.&lt;/p&gt;
&lt;h3&gt;Disclosure: una riforma proposta e abbandonata &lt;span class=&quot;src&quot;&gt;p. 44&lt;/span&gt;&lt;/h3&gt;
&lt;div data-stepper&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Il problema&lt;/h4&gt;&lt;p&gt;Gli utenti giudicano l&#x27;informativa DB spesso inadeguata: poche informazioni sui flussi di cassa futuri, troppi dettagli poco utili (per esempio l&#x27;analisi di sensibilità completa). Per chi prepara il bilancio, è onerosa.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;La proposta&lt;/h4&gt;&lt;p&gt;Obiettivi di disclosure generali e specifici, con giudizio dell&#x27;entità; dettagli quantitativi dei prospetti; informazioni su come il DBO influenzerà i flussi futuri; via la sensibilità analitica ipotesi per ipotesi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;La decisione&lt;/h4&gt;&lt;p&gt;Dopo le riunioni di febbraio e maggio 2022 l&#x27;IASB ha deciso di &lt;strong&gt;non proseguire&lt;/strong&gt;: il &lt;span class=&quot;en&quot;&gt;fieldwork&lt;/span&gt; (la prova sul campo con le imprese) indicava miglioramenti poco significativi; sarebbero servite altre analisi per le altre categorie; l&#x27;informativa attuale aiuta già indirettamente a valutare i flussi; il lavoro non rispetterebbe i criteri di priorità della &lt;span class=&quot;en&quot;&gt;Third Agenda Consultation&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;DBO 1.000, attività 800, perdite cumulate 70: prima del 2013, si riconosceva qualcosa?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: corridor = max(100; 80) = 100, le perdite sono dentro. Oggi andrebbero tutte in OCI.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché il tasso di rendimento atteso uguale allo sconto è una vera novità?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Elimina la leva data dalle stime di rendimento: un&#x27;attesa ottimistica non abbassa più il costo. Il rendimento effettivo eccedente va in OCI. &lt;span class=&quot;int&quot;&gt;integrazione&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Cosa cambia con il Regolamento 2019/402 per chi modifica un plan a giugno?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Da giugno a dicembre usa le ipotesi aggiornate, per costo del servizio e net interest, invece di quelle di inizio anno.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part terra&quot; id=&quot;bnp&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;9&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Lettura di un bilancio vero&lt;/p&gt;
&lt;h2&gt;BNP Paribas: IAS 19 nei conti 2025&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;Tutta la teoria della lezione, in milioni di euro &lt;span class=&quot;src&quot;&gt;p. 45-65&lt;/span&gt;. Le slide usano la versione marcata &lt;span class=&quot;en&quot;&gt;unaudited figures&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;res&quot;&gt;
&lt;div&gt;&lt;b&gt;29.003&lt;/b&gt;operating expenses&lt;/div&gt;
