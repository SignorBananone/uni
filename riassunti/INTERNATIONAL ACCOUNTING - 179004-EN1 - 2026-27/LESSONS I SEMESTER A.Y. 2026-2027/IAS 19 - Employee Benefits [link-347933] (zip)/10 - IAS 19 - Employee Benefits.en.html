&lt;rect class=&quot;b dash&quot; x=&quot;60&quot; y=&quot;244&quot; width=&quot;210&quot; height=&quot;44&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;165&quot; y=&quot;263&quot; text-anchor=&quot;middle&quot;&gt;INPS Fund&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;165&quot; y=&quot;280&quot; text-anchor=&quot;middle&quot;&gt;later liquidated&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M44 120V266H60M44 151H60M44 187H60M44 223H60&quot;/&gt;
&lt;g class=&quot;slate&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;360&quot; y=&quot;76&quot; width=&quot;240&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;480&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot;&gt;Stays in company&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;480&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot;&gt;deferred remuneration, revocable&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M430 120V148M530 120V148&quot;/&gt;
&lt;g class=&quot;slate&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;340&quot; y=&quot;148&quot; width=&quot;150&quot; height=&quot;48&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;415&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot;&gt;Up to 49&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;415&quot; y=&quot;186&quot; text-anchor=&quot;middle&quot;&gt;employees&lt;/text&gt;
&lt;rect class=&quot;b&quot; x=&quot;500&quot; y=&quot;148&quot; width=&quot;150&quot; height=&quot;48&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;575&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot;&gt;At least 50&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;575&quot; y=&quot;186&quot; text-anchor=&quot;middle&quot;&gt;employees&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M415 196V218M575 196V218&quot;/&gt;
&lt;g class=&quot;sage&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;340&quot; y=&quot;218&quot; width=&quot;150&quot; height=&quot;48&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;415&quot; y=&quot;247&quot; text-anchor=&quot;middle&quot;&gt;Stays in company&lt;/text&gt;
&lt;rect class=&quot;b&quot; x=&quot;500&quot; y=&quot;218&quot; width=&quot;150&quot; height=&quot;48&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;575&quot; y=&quot;239&quot; text-anchor=&quot;middle&quot;&gt;INPS Treasury&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;575&quot; y=&quot;257&quot; text-anchor=&quot;middle&quot;&gt;Fund&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/div&gt;&lt;figcaption&gt;Reproduces the diagram on p. 28 with the thresholds given in the slides.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;tint warn&quot;&gt;&lt;p&gt;&lt;strong&gt;Update relative to the slides.&lt;/strong&gt; The 49/50 employee boundary is the historical one. Sources on the 2026 Budget Law (Law 199/2025) and INPS Circular 12/2026 report moving thresholds for payment to the Treasury Fund: 60 staff for 2026-2027, 50 for 2028-2031, 40 from 2032, with separate rules for newly established companies &lt;a class=&quot;ext&quot; href=&quot;https://www.inps.it/it/it/inps-comunica/notizie/dettaglio-news-page.news.2026.02.fondo-di-tesoreria-nuove-soglie-dimensionali-dal-2026.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt; &lt;a class=&quot;ext&quot; href=&quot;https://www.cgil.it/strumenti/ufficio-giuridico/tfr-e-fondo-tesoreria-inps-cosa-cambia-dal-2026-con-la-nuova-legge-di-bilancio-fxmh7qx7&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;. The accounting logic does not change: a company paying into the Fund has a DC plan. For the exam, use the threshold in the slides and ask the lecturer for confirmation; for real cases, check the text of the circular.&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Classification: try it yourself &lt;span class=&quot;src&quot;&gt;p. 29-30&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;h4&gt;When did the TFR amount accrue?&lt;/h4&gt;
&lt;div class=&quot;seg&quot; id=&quot;c-when&quot;&gt;&lt;button data-v=&quot;old&quot;&gt;Up to 31/12/2006&lt;/button&gt;&lt;button data-v=&quot;new&quot;&gt;From 1/1/2007&lt;/button&gt;&lt;/div&gt;
&lt;div id=&quot;c-dest-row&quot; hidden&gt;&lt;h4&gt;Where does it go?&lt;/h4&gt;&lt;div class=&quot;seg&quot; id=&quot;c-dest&quot;&gt;&lt;button data-v=&quot;fund&quot;&gt;Supplementary pension&lt;/button&gt;&lt;button data-v=&quot;co&quot;&gt;The employee leaves it in the company&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div id=&quot;c-size-row&quot; hidden&gt;&lt;h4&gt;Company size (threshold in the slides)&lt;/h4&gt;&lt;div class=&quot;seg&quot; id=&quot;c-size&quot;&gt;&lt;button data-v=&quot;small&quot;&gt;Fewer than 50 employees&lt;/button&gt;&lt;button data-v=&quot;big&quot;&gt;At least 50 employees&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tint&quot; id=&quot;c-out&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Actuarial and investment risk&lt;/th&gt;&lt;th&gt;Classification&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Accrued up to 31/12/2006&lt;/td&gt;&lt;td&gt;Company&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Benefit&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;From 1/1/2007, at least 50 employees&lt;/td&gt;&lt;td&gt;Not on the company&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Contribution&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;From 1/1/2007, fewer than 50, to supplementary pension&lt;/td&gt;&lt;td&gt;Not on the company&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Contribution&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;From 1/1/2007, fewer than 50, stays in the company&lt;/td&gt;&lt;td&gt;Company&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Benefit&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;Hence the practice in IFRS financial statements: from 2007 the company continues to measure the portion at 31/12/2006 using actuarial techniques, whereas for amounts directed to funds or to the Treasury Fund it recognises the contributions due, with no actuarial assumptions or discounting, because they fall due within 12 months &lt;span class=&quot;src&quot;&gt;p. 29&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;The &quot;INPS Fund&quot; element of the diagram was FondInps, a residual recipient: the 2018 Budget Law provided for its abolition, and Ministerial Decree 85/2020 identified the Cometa Fund for the transfer of positions &lt;a class=&quot;ext&quot; href=&quot;https://www.normattiva.it/eli/id/2020/07/30//20G00103/CONSOLIDATED&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;A company with 200 employees. The 2015 TFR is left &quot;in the company&quot; by the employee. How does the company classify it?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Defined contribution: the amount goes to the INPS Treasury Fund and the risk does not remain with the company.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Same company: the TFR accrued in 2004?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Defined benefit: the amount stayed in the company under the old rules and is measured using actuarial techniques.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is the debt to the pension fund not discounted?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because it is paid within 12 months: the effect of discounting is immaterial and no actuarial assumptions are needed.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Can the employee change their mind after choosing supplementary pension?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Not according to the slides: that choice is irrevocable. The choice to keep the TFR in the company, by contrast, is revocable.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part slate&quot; id=&quot;altri&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;IAS 19, paras 153-157&lt;/p&gt;
&lt;h2&gt;Other long-term employee benefits&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;Like defined benefit in technique, but simpler in outcome: nothing passes through OCI.&lt;/p&gt;
&lt;p&gt;This category covers benefits &lt;strong&gt;not&lt;/strong&gt; expected to be settled wholly within twelve months: long leave, seniority awards, long-term disability benefits, deferred &lt;span class=&quot;en&quot;&gt;profit-sharing&lt;/span&gt; and bonuses, &lt;span class=&quot;en&quot;&gt;deferred remuneration&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;p. 31&lt;/span&gt;. The reason for the simplification: measurement is usually less uncertain than for post-employment benefits (19.154).&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Post-employment DB&lt;/h4&gt;&lt;p&gt;Service cost and net interest: &lt;strong&gt;P&amp;amp;L&lt;/strong&gt;.&lt;br&gt;Remeasurements: &lt;strong&gt;OCI&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Other long-term&lt;/h4&gt;&lt;p&gt;Service cost, net interest and remeasurements: &lt;strong&gt;all in P&amp;amp;L&lt;/strong&gt;, unless another IFRS includes them in the cost of an asset (19.156).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;The disability case &lt;span class=&quot;src&quot;&gt;p. 32&lt;/span&gt;&lt;/h3&gt;
&lt;figure&gt;&lt;div class=&quot;scroll&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 158&quot; role=&quot;img&quot; aria-label=&quot;Decision tree: if the disability benefit depends on length of service, the obligation arises with service; if it is the same for everyone, the expense is recognised when the event occurs.&quot;&gt;
&lt;g class=&quot;slate&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;170&quot; y=&quot;6&quot; width=&quot;300&quot; height=&quot;42&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;320&quot; y=&quot;32&quot; text-anchor=&quot;middle&quot;&gt;Depends on length of service?&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M240 48V70H160V84M400 48V70H480V84&quot;/&gt;&lt;text class=&quot;s&quot; x=&quot;195&quot; y=&quot;64&quot;&gt;yes&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;440&quot; y=&quot;64&quot;&gt;no&lt;/text&gt;
&lt;g class=&quot;slate&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;20&quot; y=&quot;84&quot; width=&quot;280&quot; height=&quot;66&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;160&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;Obligation arises with service&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;160&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot;&gt;measure: probability of payment&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;160&quot; y=&quot;143&quot; text-anchor=&quot;middle&quot;&gt;and expected duration&lt;/text&gt;
&lt;rect class=&quot;b&quot; x=&quot;340&quot; y=&quot;84&quot; width=&quot;280&quot; height=&quot;66&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;480&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;Expense when the event occurs&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;480&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot;&gt;same level for every disabled employee,&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;480&quot; y=&quot;143&quot; text-anchor=&quot;middle&quot;&gt;regardless of length of service&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/div&gt;&lt;figcaption&gt;IAS 19.157. The logic is the same as for absences: if working increases the entitlement, the cost accrues with the work.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Award for 25 years of service, revision of the actuarial assumption: where does the effect go?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;To profit or loss. Other long-term benefits have no OCI.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is a simplified method accepted?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because measurement is usually less uncertain than for post-employment benefits (19.154), so the effect of remeasurements is smaller.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;A bonus paid 30 months after the end of the reporting period: which category?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Other long-term: it is not settled within twelve months after the end of the reporting period.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part brick&quot; id=&quot;term&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;IAS 19, paras 159-171&lt;/p&gt;
&lt;h2&gt;Termination benefits&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;The only category in which the obligation arises not from service rendered, but from the end of employment &lt;span class=&quot;src&quot;&gt;p. 33&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;It may result from the entity&#x27;s decision to terminate employment, or from the employee&#x27;s decision to accept an offer in exchange for termination. It often accompanies a &lt;span class=&quot;en&quot;&gt;restructuring&lt;/span&gt;, governed by IAS 37.&lt;/p&gt;
&lt;h3&gt;When to recognise: the earlier of &lt;span class=&quot;src&quot;&gt;p. 34&lt;/span&gt;&lt;/h3&gt;
&lt;figure&gt;&lt;div class=&quot;scroll&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 138&quot; role=&quot;img&quot; aria-label=&quot;Recognised at the earlier of two dates: when the offer can no longer be withdrawn, or when the IAS 37 restructuring costs are recognised.&quot;&gt;
&lt;g class=&quot;brick&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;14&quot; y=&quot;10&quot; width=&quot;280&quot; height=&quot;50&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;154&quot; y=&quot;32&quot; text-anchor=&quot;middle&quot;&gt;Offer can no longer be withdrawn&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;154&quot; y=&quot;49&quot; text-anchor=&quot;middle&quot;&gt;IAS 19.165(a)&lt;/text&gt;
&lt;rect class=&quot;b&quot; x=&quot;14&quot; y=&quot;78&quot; width=&quot;280&quot; height=&quot;50&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;154&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot;&gt;IAS 37 restructuring costs&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;154&quot; y=&quot;117&quot; text-anchor=&quot;middle&quot;&gt;involving payment of termination benefits&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M294 35H340V103H294M340 69H392&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;g class=&quot;terra&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;392&quot; y=&quot;30&quot; width=&quot;232&quot; height=&quot;78&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;508&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot;&gt;The earlier of the two&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;508&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot;&gt;liability and expense are recognised&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/div&gt;&lt;/figure&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot;&gt;&lt;button type=&quot;button&quot;&gt;The employee decides&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;The entity decides&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;p&gt;The offer can no longer be withdrawn from the earlier of these dates (19.166):&lt;/p&gt;&lt;ul&gt;&lt;li&gt;the employee accepts;&lt;/li&gt;&lt;li&gt;a legal, regulatory or contractual restriction on the ability to withdraw takes effect. If it already existed, this is the date of the offer.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;p&gt;The offer can no longer be withdrawn when the entity has communicated to those affected a plan (19.167) meeting &lt;strong&gt;all&lt;/strong&gt; of these requirements &lt;span class=&quot;src&quot;&gt;p. 35&lt;/span&gt;:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;significant changes to it are unlikely;&lt;/li&gt;&lt;li&gt;it identifies the number, job functions and locations of the employees and the expected completion date, without having to name individuals;&lt;/li&gt;&lt;li&gt;it sets out the benefits in sufficient detail for each employee to understand their type and amount.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;With termination benefits, it may also be necessary to account for a &lt;span class=&quot;en&quot;&gt;plan amendment&lt;/span&gt; or a &lt;span class=&quot;en&quot;&gt;curtailment&lt;/span&gt; of other benefits (19.168).&lt;/p&gt;
&lt;h3&gt;How to measure: according to nature &lt;span class=&quot;src&quot;&gt;p. 36&lt;/span&gt;&lt;/h3&gt;
&lt;figure&gt;&lt;div class=&quot;scroll&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 196&quot; role=&quot;img&quot; aria-label=&quot;Decision tree: if the benefit is an enhancement of post-employment benefits, those rules apply. Otherwise, short-term rules apply if it is settled within 12 months, and other long-term rules if later.&quot;&gt;
&lt;g class=&quot;brick&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;140&quot; y=&quot;6&quot; width=&quot;360&quot; height=&quot;40&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;320&quot; y=&quot;31&quot; text-anchor=&quot;middle&quot;&gt;Enhancement of post-employment benefits?&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M220 46V68H120V82M420 46V68H440V82&quot;/&gt;&lt;text class=&quot;s&quot; x=&quot;160&quot; y=&quot;62&quot;&gt;yes&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;430&quot; y=&quot;62&quot; text-anchor=&quot;end&quot;&gt;no&lt;/text&gt;
&lt;g class=&quot;ochre&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;20&quot; y=&quot;82&quot; width=&quot;200&quot; height=&quot;50&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;120&quot; y=&quot;111&quot; text-anchor=&quot;middle&quot;&gt;Post-employment rules&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;brick&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;300&quot; y=&quot;82&quot; width=&quot;280&quot; height=&quot;42&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;440&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;Settled wholly within 12 months?&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M380 124V146H330V152M500 124V146H530V152&quot;/&gt;&lt;text class=&quot;s&quot; x=&quot;350&quot; y=&quot;141&quot;&gt;yes&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;525&quot; y=&quot;141&quot;&gt;no&lt;/text&gt;
&lt;g class=&quot;sage&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;240&quot; y=&quot;152&quot; width=&quot;170&quot; height=&quot;38&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;325&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot;&gt;Short-term rules&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;slate&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;440&quot; y=&quot;152&quot; width=&quot;180&quot; height=&quot;38&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;530&quot; y=&quot;176&quot; text-anchor=&quot;middle&quot;&gt;Other long-term rules&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;/div&gt;&lt;/figure&gt;
&lt;h3&gt;What is not termination &lt;span class=&quot;src&quot;&gt;p. 37&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Voluntary resignation without an offer and mandatory retirement are post-employment. If the benefit is lower when the employee requests termination, &lt;strong&gt;only the difference&lt;/strong&gt; compared with the case of the entity&#x27;s decision is a termination benefit (19.160).&lt;/p&gt;
&lt;ul class=&quot;sort&quot;&gt;
&lt;li data-a=&quot;term&quot; data-w=&quot;The entity decides to end employment before retirement.&quot;&gt;&lt;span&gt;Collective redundancy with severance payment before retirement age&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;term&quot;&gt;Termination&lt;/button&gt;&lt;button data-v=&quot;post&quot;&gt;Post-employment&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;term&quot; data-w=&quot;The employee accepts an offer in exchange for termination.&quot;&gt;&lt;span&gt;Voluntary redundancy incentive, accepted&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;term&quot;&gt;Termination&lt;/button&gt;&lt;button data-v=&quot;post&quot;&gt;Post-employment&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;post&quot; data-w=&quot;Employee&#x27;s request, with no offer from the entity.&quot;&gt;&lt;span&gt;Amount paid to an employee who resigns without an offer&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;term&quot;&gt;Termination&lt;/button&gt;&lt;button data-v=&quot;post&quot;&gt;Post-employment&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;post&quot; data-w=&quot;19.160 expressly excludes it.&quot;&gt;&lt;span&gt;Payment due on mandatory retirement&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;term&quot;&gt;Termination&lt;/button&gt;&lt;button data-v=&quot;post&quot;&gt;Post-employment&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;p class=&quot;say&quot; style=&quot;font-weight:600&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;A benefit of 30 if dismissed, 10 if resigning. How much is a termination benefit?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;20: the difference. The 10 is in substance post-employment (19.160). Illustrative amounts.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Must the redundancy plan name each person?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: the number, job functions, locations and expected completion date suffice (19.167).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;How does termination differ from the other benefits as regards the triggering event?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The others arise from service rendered; termination benefits arise from the end of employment.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part slate&quot; id=&quot;modifiche&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Evolution of the standard&lt;/p&gt;
&lt;h2&gt;The amendments: 2011, 2019 and the road not taken in 2023&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;Gone is the option that kept actuarial losses off the balance sheet: today the plan&#x27;s net position is fully visible.&lt;/p&gt;
&lt;h3&gt;June 2011, effective from 1/1/2013 &lt;span class=&quot;src&quot;&gt;p. 38-39&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Topic&lt;/th&gt;&lt;th&gt;After the amendment&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Actuarial gains and losses&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Recognised in the statement of financial position as adjustments to equity, not in the annual expense in profit or loss.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Corridor approach&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Eliminated.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Discount&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Expected return on assets equal to the actuarial discount rate. Plan amendments: immediately and fully in profit or loss.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Annual expense&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Two components: &lt;span class=&quot;en&quot;&gt;service cost&lt;/span&gt; and &lt;span class=&quot;en&quot;&gt;net interest cost&lt;/span&gt;.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Disclosure&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Broader and more complex, to explain how benefits are determined.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;In the EU the amendment comes through Regulation (EU) 475/2012, cited on p. 26, which adopted IAS 1 and IAS 19 together &lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/reg/2012/475/2012-07-01&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;
&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;What the corridor was &lt;span class=&quot;src&quot;&gt;p. 38&lt;/span&gt;&lt;/h4&gt;
&lt;p class=&quot;say&quot;&gt;Cumulative gains and losses could go unrecognised if they were lower than the greater of 10% of the PV of the obligation and 10% of the fair value of the assets, at the end of the previous reporting period.&lt;/p&gt;
&lt;label&gt;PV of obligation&lt;input id=&quot;co-d&quot; type=&quot;range&quot; min=&quot;100&quot; max=&quot;3000&quot; step=&quot;50&quot; value=&quot;1000&quot;&gt;&lt;output id=&quot;co-d-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Fair value of assets&lt;input id=&quot;co-a&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;3000&quot; step=&quot;50&quot; value=&quot;800&quot;&gt;&lt;output id=&quot;co-a-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Gain (−) or loss (+)&lt;input id=&quot;co-g&quot; type=&quot;range&quot; min=&quot;-600&quot; max=&quot;600&quot; step=&quot;10&quot; value=&quot;70&quot;&gt;&lt;output id=&quot;co-g-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;svg viewBox=&quot;0 0 620 104&quot; role=&quot;img&quot; aria-label=&quot;Line showing the corridor band and the point of cumulative gains or losses&quot;&gt;&lt;g id=&quot;co-svg&quot;&gt;&lt;/g&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;b id=&quot;co-c&quot;&gt;&lt;/b&gt;width of the corridor&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;co-ex&quot;&gt;&lt;/b&gt;excess before 2013&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;co-oci&quot;&gt;&lt;/b&gt;in OCI today&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;say&quot; id=&quot;co-say&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;say&quot; style=&quot;font-size:.86rem;color:var(--soft)&quot;&gt;Illustrative values. The excess did not enter profit or loss all at once: it could be spread over the remaining working life &lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Regulation (EU) 2019/402 &lt;span class=&quot;src&quot;&gt;p. 40&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;The problem: a plan is amended, curtailed or settled mid-year. Which assumptions should be used for the rest of the reporting period? The answer: after the event, the &lt;strong&gt;updated assumptions&lt;/strong&gt; from the remeasurement of the net defined benefit liability (asset) are used for the remainder of the period. The Regulation dates from 13 March 2019, the IASB amendment from February 2018, and it applies to reporting periods beginning on or after 1/1/2019 &lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/reg/2019/402/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;
&lt;h3&gt;Disclosure: a reform proposed and abandoned &lt;span class=&quot;src&quot;&gt;p. 44&lt;/span&gt;&lt;/h3&gt;
&lt;div data-stepper&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;The problem&lt;/h4&gt;&lt;p&gt;Users often judge DB disclosure to be inadequate: little information on future cash flows, too many details of limited use (for example, the full sensitivity analysis). For preparers, it is burdensome.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;The proposal&lt;/h4&gt;&lt;p&gt;Overall and specific disclosure objectives, with the entity exercising judgement; quantitative details of the statements; information on how the DBO will affect future cash flows; removal of the assumption-by-assumption sensitivity analysis.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;The decision&lt;/h4&gt;&lt;p&gt;After the meetings of February and May 2022, the IASB decided &lt;strong&gt;not to proceed&lt;/strong&gt;: the &lt;span class=&quot;en&quot;&gt;fieldwork&lt;/span&gt; (the field test with companies) indicated only minor improvements; further analysis would have been required for the other categories; current disclosure already indirectly helps to assess cash flows; the work would not meet the priority criteria of the &lt;span class=&quot;en&quot;&gt;Third Agenda Consultation&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;DBO 1,000, assets 800, cumulative losses 70: before 2013, was anything recognised?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: corridor = max(100; 80) = 100, so the losses fall inside it. Today they would all go to OCI.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is setting the expected rate of return equal to the discount rate a real innovation?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It removes the leverage provided by return estimates: an optimistic expectation no longer lowers the expense. Any actual return in excess goes to OCI. &lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What does Regulation 2019/402 change for an entity that amends a plan in June?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;From June to December it uses the updated assumptions, for service cost and net interest, instead of those at the start of the year.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part terra&quot; id=&quot;bnp&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;9&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Reading real financial statements&lt;/p&gt;
&lt;h2&gt;BNP Paribas: IAS 19 in the 2025 accounts&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;All the theory from the lecture, in millions of euros &lt;span class=&quot;src&quot;&gt;p. 45-65&lt;/span&gt;. The slides use the version marked &lt;span class=&quot;en&quot;&gt;unaudited figures&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;res&quot;&gt;
&lt;div&gt;&lt;b&gt;29,003&lt;/b&gt;operating expenses&lt;/div&gt;
&lt;div&gt;&lt;b&gt;19,138&lt;/b&gt;salaries and benefits, banking activities (2/3 of operating expenses)&lt;/div&gt;
&lt;div&gt;&lt;b&gt;20,037&lt;/b&gt;total salaries and benefits, including insurance&lt;/div&gt;
&lt;div&gt;&lt;b&gt;839&lt;/b&gt;contributions to DC plans&lt;/div&gt;
&lt;div&gt;&lt;b&gt;6,976&lt;/b&gt;DBO at the end of 2025&lt;/div&gt;
&lt;div&gt;&lt;b&gt;−138&lt;/b&gt;aggregate net obligation&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;The four categories in the notes &lt;span class=&quot;src&quot;&gt;p. 48-49, 64-65&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Category&lt;/th&gt;&lt;th&gt;Stated treatment&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;Provision 2025&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;2024&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Short-term&lt;/td&gt;&lt;td&gt;Expense when the service is used&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;n.d.&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;n.d.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Post-employment&lt;/td&gt;&lt;td&gt;DC: expense only. DB: liability using PUC&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;2,940&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;2,997&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Post-employment healthcare&lt;/td&gt;&lt;td&gt;Mainly Belgium&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;71&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;75&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Other long-term&lt;/td&gt;&lt;td&gt;Actuarial technique, revaluations in P&amp;amp;L&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;2,001&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1,709&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Termination&lt;/td&gt;&lt;td&gt;Discounted if beyond 12 months&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;174&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;328&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Share-based payment (&lt;span class=&quot;en&quot;&gt;IFRS 2&lt;/span&gt;)&lt;/td&gt;&lt;td&gt;Outside IAS 19, but among personnel provisions&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1,826&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1,434&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Provisions for employee benefits&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;7,012&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;6,543&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;h3&gt;Defined contribution &lt;span class=&quot;src&quot;&gt;p. 52&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;The group has converted many plans from DB to DC, thereby transferring the risk. In Italy the BNL plan provides for contributions from the employer (4.5% of salaries) and the employee (2%). The 839 million breaks down as follows: France 371, Italy 111, UK 78, Türkiye 53, Luxembourg 32, USA 29, Hong Kong 28, others 137.&lt;/p&gt;
&lt;h3&gt;Defined benefit by country &lt;span class=&quot;src&quot;&gt;p. 55&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;div class=&quot;seg&quot; id=&quot;bn-m&quot; role=&quot;group&quot; aria-label=&quot;Measure&quot;&gt;&lt;button data-v=&quot;dbo&quot;&gt;PV of the DBO&lt;/button&gt;&lt;button data-v=&quot;as&quot;&gt;Covering assets&lt;/button&gt;&lt;button data-v=&quot;net&quot;&gt;Net obligation&lt;/button&gt;&lt;/div&gt;
&lt;div id=&quot;bn-rows&quot; style=&quot;margin-top:.6rem&quot;&gt;&lt;/div&gt;&lt;p class=&quot;say&quot; id=&quot;bn-say&quot;&gt;&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;Check on the total: 6,976 − 4,827 − 2,439 + 152 = −138. In the statement of financial position: assets of 3,082 and liabilities of 2,944, because plans in surplus are not offset against plans in deficit. &lt;dfn&gt;Reimbursement rights&lt;/dfn&gt; are rights to reimbursement, mainly from group insurance companies such as AG Insurance for Belgium.&lt;/p&gt;
&lt;h3&gt;DBO roll-forward &lt;span class=&quot;src&quot;&gt;p. 56&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;lab&quot;&gt;
&lt;div class=&quot;seg&quot; id=&quot;wf-f&quot; role=&quot;group&quot; aria-label=&quot;Filter&quot;&gt;&lt;button data-v=&quot;all&quot;&gt;All&lt;/button&gt;&lt;button data-v=&quot;pl&quot;&gt;P&amp;amp;L&lt;/button&gt;&lt;button data-v=&quot;oc&quot;&gt;OCI&lt;/button&gt;&lt;button data-v=&quot;ca&quot;&gt;Cash&lt;/button&gt;&lt;button data-v=&quot;ot&quot;&gt;Other&lt;/button&gt;&lt;/div&gt;
&lt;div id=&quot;wf&quot; style=&quot;margin-top:.6rem&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;say&quot; id=&quot;wf-say&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;say&quot; style=&quot;font-size:.84rem;color:var(--soft)&quot;&gt;Truncated axis: it starts at 6,600 to make the changes visible. The colour grouping is a teaching choice.&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;The expense: 175 in P&amp;amp;L, −61 in OCI &lt;span class=&quot;src&quot;&gt;p. 58&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Profit or loss 2025&lt;/h4&gt;&lt;div class=&quot;scroll&quot; style=&quot;margin:0&quot;&gt;&lt;table style=&quot;min-width:0&quot;&gt;
&lt;tr&gt;&lt;td&gt;Current service cost&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;190&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Past service cost&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(14)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Interest cost&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;232&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Expected return, asset ceiling&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Interest income on plan assets&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(157)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Interest income on reimbursement rights&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(77)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;175&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;OCI 2025 (sign: gain +)&lt;/h4&gt;&lt;div class=&quot;scroll&quot; style=&quot;margin:0&quot;&gt;&lt;table style=&quot;min-width:0&quot;&gt;
&lt;tr&gt;&lt;td&gt;On plan assets and reimbursement rights&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;43&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Demographic assumptions&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(6)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Financial assumptions&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;166&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Experience&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(128)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Asset ceiling effect&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(136)&lt;/td&gt;&lt;/tr&gt;
&lt;tr class=&quot;tot&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;(61)&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Here is the 2011 amendment in application: the interest income of 157 appears in the plan assets roll-forward as &lt;span class=&quot;en&quot;&gt;expected return&lt;/span&gt; &lt;span class=&quot;src&quot;&gt;p. 57&lt;/span&gt;, while the difference from the actual return lies in remeasurements. Note 1.k specifies that remeasurements are &lt;strong&gt;never reclassified&lt;/strong&gt; to profit or loss &lt;span class=&quot;src&quot;&gt;p. 50&lt;/span&gt;.&lt;/p&gt;
&lt;h3&gt;Assumptions and sensitivity &lt;span class=&quot;src&quot;&gt;p. 59-61&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;In the Eurozone, the UK and the USA the rate is derived from yields on &lt;span class=&quot;en&quot;&gt;high quality corporate bonds&lt;/span&gt; of consistent duration. Average rate in the Eurozone 3.45% (duration 8.6 years), UK 5.57% (12.3 years), Switzerland 1.30% (12.7 years).&lt;/p&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Country&lt;/th&gt;&lt;th&gt;Discount rate 2025&lt;/th&gt;&lt;th&gt;Compensation increase 2025&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Belgium&lt;/td&gt;&lt;td&gt;2.50 / 4.20%&lt;/td&gt;&lt;td&gt;2.80 / 4.30%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UK&lt;/td&gt;&lt;td&gt;4.10 / 5.60%&lt;/td&gt;&lt;td&gt;2.00 / 3.75%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;France&lt;/td&gt;&lt;td&gt;2.80 / 4.00%&lt;/td&gt;&lt;td&gt;1.90 / 4.10%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Switzerland&lt;/td&gt;&lt;td&gt;1.10 / 1.30%&lt;/td&gt;&lt;td&gt;1.25 / 1.80%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;USA&lt;/td&gt;&lt;td&gt;4.90 / 5.00%&lt;/td&gt;&lt;td&gt;n.a.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Italy&lt;/td&gt;&lt;td&gt;3.10 / 3.40%&lt;/td&gt;&lt;td&gt;2.40 / 3.10%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Germany&lt;/td&gt;&lt;td&gt;2.40 / 4.40%&lt;/td&gt;&lt;td&gt;1.80 / 2.80%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Türkiye&lt;/td&gt;&lt;td&gt;29.80%&lt;/td&gt;&lt;td&gt;26.00%&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;What happens if rates move? (change in DBO, millions)&lt;/h4&gt;
&lt;div class=&quot;seg&quot; id=&quot;se-m&quot; role=&quot;group&quot; aria-label=&quot;Scenario&quot;&gt;&lt;button data-v=&quot;dn&quot;&gt;Discount rate −100 bps&lt;/button&gt;&lt;button data-v=&quot;up&quot;&gt;Discount rate +100 bps&lt;/button&gt;&lt;button data-v=&quot;inf&quot;&gt;Inflation +100 bps&lt;/button&gt;&lt;/div&gt;
&lt;div id=&quot;se-rows&quot; style=&quot;margin-top:.6rem&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;say&quot;&gt;The discount rate and the DBO move in opposite directions, inflation and the DBO in the same direction. The percentage change approaches the &lt;span class=&quot;en&quot;&gt;duration&lt;/span&gt; (average maturity of payments): Switzerland rises by about 14% with −100 bps and has a duration of 12.7 years &lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt;. A &lt;span class=&quot;en&quot;&gt;basis point&lt;/span&gt; (bps) is 0.01%. Percentages calculated here on the DBO from p. 55.&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Funding and risks &lt;span class=&quot;src&quot;&gt;p. 53-54, 62-63&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Plan&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;Funding 2025&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;2024&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Germany&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;72%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;72%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;USA&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;83%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;85%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Belgium, Fortis&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;92%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;95%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;AXA IM (acquired from 1 July 2025)&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;96%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;n.a.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Belgium, senior manager top-up&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;101%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;100%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Switzerland&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;109%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;105%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UK&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;125%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;124%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;France, end-of-career indemnities&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;131%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;129%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;France, senior manager top-up&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;565%&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;442%&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;figure&gt;&lt;svg viewBox=&quot;0 0 640 74&quot; role=&quot;img&quot; aria-label=&quot;Group plan assets: equities 12%, government bonds 41%, other bonds 20%, real estate 7%, deposits 3%, other 17%&quot;&gt;
&lt;g style=&quot;stroke:var(--paper)&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;4&quot; width=&quot;76.8&quot; height=&quot;34&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;rect x=&quot;76.8&quot; y=&quot;4&quot; width=&quot;262.4&quot; height=&quot;34&quot; style=&quot;fill:var(--slate)&quot;/&gt;&lt;rect x=&quot;339.2&quot; y=&quot;4&quot; width=&quot;128&quot; height=&quot;34&quot; style=&quot;fill:var(--sage)&quot;/&gt;&lt;rect x=&quot;467.2&quot; y=&quot;4&quot; width=&quot;44.8&quot; height=&quot;34&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;rect x=&quot;512&quot; y=&quot;4&quot; width=&quot;19.2&quot; height=&quot;34&quot; style=&quot;fill:var(--accent)&quot;/&gt;&lt;rect x=&quot;531.2&quot; y=&quot;4&quot; width=&quot;108.8&quot; height=&quot;34&quot; style=&quot;fill:var(--soft)&quot;/&gt;&lt;/g&gt;
&lt;text class=&quot;s&quot; x=&quot;2&quot; y=&quot;56&quot;&gt;equities 12&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;80&quot; y=&quot;56&quot;&gt;government bonds 41&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;342&quot; y=&quot;56&quot;&gt;other bonds 20&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;465&quot; y=&quot;56&quot;&gt;property 7&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;510&quot; y=&quot;72&quot;&gt;dep. 3&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;560&quot; y=&quot;56&quot;&gt;other 17&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;Percentage composition of group plan assets at the end of 2025 &lt;span class=&quot;src&quot;&gt;p. 62&lt;/span&gt;. For plans above 100 million, an &lt;span class=&quot;en&quot;&gt;asset and liability management&lt;/span&gt; analysis must be carried out at least every three years &lt;span class=&quot;src&quot;&gt;p. 63&lt;/span&gt;.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;tint brick&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Focus on Italy: the TFR in a bank&#x27;s financial statements&lt;/h4&gt;&lt;p&gt;In Italy the accrued rights are &lt;strong&gt;frozen at 31/12/2006&lt;/strong&gt; &lt;span class=&quot;src&quot;&gt;p. 54&lt;/span&gt;: 111 million of DBO, all unfunded and with no assets &lt;span class=&quot;src&quot;&gt;p. 55&lt;/span&gt;, down from 139. Discount rate of 3.10-3.40%. These are precisely the &quot;old&quot; amounts of &lt;a href=&quot;#tfr&quot;&gt;section 5&lt;/a&gt;. Take care not to confuse them with the 111 million of Italian DC contributions on p. 52: the same amount, by coincidence.&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Other long-term and termination &lt;span class=&quot;src&quot;&gt;p. 64-65&lt;/span&gt;&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Net provision of 1,915 million&lt;/strong&gt; (466 for seniority awards, time savings accounts and incapacity guarantees; 1,449 for deferred compensation and loyalty schemes). Assets 86, liabilities 2,001.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Loyalty scheme&lt;/strong&gt; in cash, since 2013, with vesting over 3-4 years: 80% linked to operating performance, 20% to &lt;span class=&quot;en&quot;&gt;Corporate Social Responsibility&lt;/span&gt; objectives. For staff subject to special rules, it is adapted to the European CRD directive.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Termination&lt;/strong&gt;: voluntary departures and workforce adjustment plans, recognised as soon as there is a bilateral agreement or a proposed agreement. This is IAS 19.166 in practice.&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why does Belgium have a net obligation of only 79 with just 217 of plan assets?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because it has 2,411 of reimbursement rights. The DBO of 2,707 is covered mainly by these rights, which are presented as a separate asset.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;The DBO falls by 382 for benefits paid from the assets. Does profit or loss change?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: the payment and the decrease in assets offset each other. The payment is not an expense.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why does BNP put the whole DB expense in &quot;Salaries and employee benefits&quot;, interest included?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;It is its presentation choice. The slides on p. 39 describe service cost as an operating or financial cost; IAS 19 does not require a specific line item &lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;With −100 bps Switzerland and the UK rise by about 14% and 13%, Belgium by about 8%. Why?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Switzerland and the UK have a duration of over 12 years: more distant payments react more strongly to discounting. P. 60 does not give the duration for Belgium alone, but indicates 8.6 years for the Eurozone.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part brick&quot; id=&quot;controlli&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;p class=&quot;kicker&quot;&gt;Before the exam&lt;/p&gt;
&lt;h2&gt;Points in the slides to check&lt;/h2&gt;
&lt;p&gt;Recalculating and cross-checking the slides brought these points to light. None of them is a certainty about the lecturer&#x27;s intentions: raise them in class.&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;strong&gt;Discounting in the PUC method, p. 42.&lt;/strong&gt; The factor uses the years elapsed instead of the years remaining. &lt;a href=&quot;#puc&quot;&gt;See the lab&lt;/a&gt;.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Pre-2013 tables, p. 25-26.&lt;/strong&gt; &lt;span class=&quot;en&quot;&gt;Expected return&lt;/span&gt; and unrecognised gains or losses are not consistent with p. 24 and p. 38-39. The note on p. 26 makes this clear only for the corridor.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Threshold of 50 employees, p. 27-30.&lt;/strong&gt; Superseded for the Treasury Fund by the 2026 rules reported by external sources. &lt;a href=&quot;#tfr&quot;&gt;See TFR&lt;/a&gt;.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Paragraph numbers, p. 19-26.&lt;/strong&gt; The heading says &quot;par. 26-49&quot;, but the content cites 19.55-57 and 19.76. Search the standard using the number cited in the text.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Presentation of service cost, p. 39.&lt;/strong&gt; &quot;Operational or financial cost&quot; is not the treatment used by BNP Paribas (p. 58), which adds everything into the same line item.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Heading in the BNP note, p. 61.&lt;/strong&gt; It reads &quot;average discount rates&quot;, but the context concerns inflation: probably a typo in the source document.&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part terra&quot; id=&quot;fonti&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;p class=&quot;kicker&quot;&gt;All external sources, unless otherwise indicated&lt;/p&gt;
&lt;h2&gt;Further reading&lt;/h2&gt;
&lt;p&gt;The entries list what the slides cite. The content and links come from web research. The pages were not opened in full: the original texts are authoritative.&lt;/p&gt;
&lt;div class=&quot;tint&quot;&gt;&lt;p&gt;&lt;strong&gt;Other course materials.&lt;/strong&gt; With the tools available it was not possible to list the &lt;code&gt;corso/&lt;/code&gt; folder, so no content on this page comes from other files: everything marked &quot;from the slides&quot; comes from &lt;code&gt;10 - IAS 19 - Employee Benefits.pdf&lt;/code&gt;. Links to the other lectures and the full reference to the Ipsoa text are therefore missing.&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;IFRS Standards&lt;/h3&gt;
&lt;ul class=&quot;src-list&quot;&gt;
&lt;li&gt;&lt;h4&gt;IAS 19 Employee Benefits &lt;a class=&quot;ext&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-19-employee-benefits/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Official IFRS Foundation page. It contains the text, the &lt;span class=&quot;en&quot;&gt;Basis for Conclusions&lt;/span&gt; and the application guidance. It matters because it is the reference for all the paragraphs cited. For the doubt on p. 42, look in the text for the numerical example on the PUC method: it should be in paragraph 68, but the search did not confirm this.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;IAS 26 Accounting and Reporting by Retirement Benefit Plans &lt;a class=&quot;ext&quot; href=&quot;https://www.iasplus.com/en/standards/ias/ias26&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;IAS Plus summary. It treats the plan as an entity preparing its own financial statements, with investments normally at fair value. It matters because it draws the boundary with IAS 19.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;IFRS 2 Share-based Payment &lt;a class=&quot;ext&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-2-share-based-payment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Issued in 2004, effective from 2005. It governs share-based payments, including employee stock options. It explains BNP&#x27;s 1,826 million outside IAS 19.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;IAS 37 Provisions, Contingent Liabilities and Contingent Assets &lt;a class=&quot;ext&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-37-provisions-contingent-liabilities-and-contingent-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Governs provisions, including &lt;span class=&quot;en&quot;&gt;restructuring&lt;/span&gt; costs, referred to in IAS 19.165. In November 2024 the IASB proposed targeted improvements: check the status of the project.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;IAS 16 Property, Plant and Equipment &lt;a class=&quot;ext&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2025/issued/ias16.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Among directly attributable costs, it lists employee benefits under IAS 19 arising from the construction or acquisition of the plant. It matters for the exception in IAS 19.11.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;IAS 2 Inventories &lt;a class=&quot;ext&quot; href=&quot;https://www.iasplus.com/en/standards/ias&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Cited by IAS 19.11 for labour included in the cost of inventories. I did not find a dedicated page: the link leads to the IAS index on IAS Plus.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h3&gt;EU and Italian legislation&lt;/h3&gt;
&lt;ul class=&quot;src-list&quot;&gt;
&lt;li&gt;&lt;h4&gt;Regulation (EU) 475/2012 &lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/reg/2012/475/2012-07-01&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Of 5 June 2012. It adopts the amendments to IAS 1 and IAS 19 in the EU. It matters because it marks the end of the corridor; amended IAS 19 applies from 2013.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Regulation (EU) 2019/402 &lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/reg/2019/402/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Of 13 March 2019, published in OJ L 72. It adopts &lt;span class=&quot;en&quot;&gt;Plan Amendment, Curtailment or Settlement&lt;/span&gt; (IASB, 7 February 2018), which affects paragraphs 57, 99, 120 and 123, among others. Further summary: &lt;a href=&quot;https://www.iasplus.com/en/news/2019/03/ias-19-eu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Legislative Decree No. 252 of 5 December 2005 &lt;a class=&quot;ext&quot; href=&quot;https://www.normattiva.it/eli/id/2005/12/13/005G0278/CONSOLIDATED/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Consolidated text on Normattiva, &quot;Disciplina delle forme pensionistiche complementari&quot; (rules on supplementary pension schemes), in force from 1/1/2007. It is the basis of the TFR reform.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Treasury Fund: new thresholds from 2026 &lt;a class=&quot;ext&quot; href=&quot;https://www.inps.it/it/it/inps-comunica/notizie/dettaglio-news-page.news.2026.02.fondo-di-tesoreria-nuove-soglie-dimensionali-dal-2026.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;INPS news item on the size thresholds; details also in a &lt;a href=&quot;https://www.cgil.it/strumenti/ufficio-giuridico/tfr-e-fondo-tesoreria-inps-cosa-cambia-dal-2026-con-la-nuova-legge-di-bilancio-fxmh7qx7&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CGIL briefing&lt;/a&gt;. It updates the slides. The summaries agree on the values, but for the 2028-2031 band it is advisable to read Circular 12/2026.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Ministerial Decree No. 85 of 31 March 2020 (FondInps) &lt;a class=&quot;ext&quot; href=&quot;https://www.normattiva.it/eli/id/2020/07/30//20G00103/CONSOLIDATED&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Identifies the Cometa Fund for the transfer of FondInps positions. It explains the &quot;subsequently liquidated&quot; on p. 28.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Agenzia delle Entrate, Resolution 133/2006 &lt;a class=&quot;ext&quot; href=&quot;https://agenziaentrate.gov.it/portale/documents/20143/306666/Risoluzione+n.+133+del+13+novembre+2006_ris_133.pdf/4b5b3529-2f16-4888-f65b-5808d1ef063d&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Reports that, according to the IFRIC, the TFR falls within defined benefit plans. The slides cite the IFRIC without references: I did not find the original decision, so this is a secondary source.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Directive 2013/36/EU (CRD) &lt;a class=&quot;ext&quot; href=&quot;https://eur-lex.europa.eu/eli/dir/2013/36&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Consolidated text on EUR-Lex. Article 94 governs variable remuneration in banks, including deferral: it is the reason for BNP&#x27;s deferred compensation (p. 64).&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h3&gt;IASB and financial reporting documents&lt;/h3&gt;
&lt;ul class=&quot;src-list&quot;&gt;
&lt;li&gt;&lt;h4&gt;Disclosure Initiative: Targeted Standards-level Review of Disclosures &lt;a class=&quot;ext&quot; href=&quot;https://www.ifrs.org/content/ifrs/home/projects/completed-projects/2023/standards-level-review-of-disclosures.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Page of the completed project, with the &lt;span class=&quot;en&quot;&gt;Project Summary and Feedback Statement&lt;/span&gt; of March 2023 from which p. 44 derives. It includes the guidance for drafting disclosure requirements.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;Third Agenda Consultation, Feedback Statement &lt;a class=&quot;ext&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/project/third-agenda-consultation/thirdagenda-feedbackstatement-july2022.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Of July 2022. It sets out the priorities and criteria for the IASB&#x27;s 2022-2026 work plan: these are the criteria against which the work on IAS 19 was assessed.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;BNP Paribas, Consolidated Financial Statements 2025 &lt;a class=&quot;ext&quot; href=&quot;https://invest.bnpparibas/en/document/4q25-cfsu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Document on the investor website, with notes 7.a-7.e. Marked &lt;span class=&quot;en&quot;&gt;unaudited&lt;/span&gt;, approved by the Board of Directors on 4 February 2026: for independent analysis, look for the audited version.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;h4&gt;PUC example on CPDbox &lt;a class=&quot;ext&quot; href=&quot;https://www.cpdbox.com/ifrs-projected-unit-credit-method-ias-19-example/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;Not cited in the slides: a worked example useful for comparing the discounting convention. It is a teaching website, not an official source.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h3&gt;Text cited without full details&lt;/h3&gt;
&lt;ul class=&quot;src-list&quot;&gt;&lt;li&gt;&lt;h4&gt;&quot;Ipsoa Book&quot;, pp. 267-268 &lt;span class=&quot;src&quot;&gt;p. 41-43&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;The slides give neither title nor author, and I could not identify it with certainty. Look for it in the course syllabus.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;
