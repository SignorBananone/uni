&lt;a href=&quot;#modifiche&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;570&quot; y=&quot;335&quot; width=&quot;170&quot; height=&quot;60&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;655&quot; y=&quot;361&quot; text-anchor=&quot;middle&quot;&gt;Amendments&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;655&quot; y=&quot;380&quot; text-anchor=&quot;middle&quot;&gt;2011, 2019, 2023&lt;/text&gt;&lt;/a&gt;&lt;/g&gt;
&lt;g class=&quot;brick&quot;&gt;&lt;a href=&quot;#term&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;570&quot; y=&quot;130&quot; width=&quot;170&quot; height=&quot;60&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;655&quot; y=&quot;156&quot; text-anchor=&quot;middle&quot;&gt;Termination&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;655&quot; y=&quot;175&quot; text-anchor=&quot;middle&quot;&gt;arises from termination&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#term&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;570&quot; y=&quot;215&quot; width=&quot;170&quot; height=&quot;80&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;655&quot; y=&quot;245&quot; text-anchor=&quot;middle&quot;&gt;Earlier of&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;655&quot; y=&quot;266&quot; text-anchor=&quot;middle&quot;&gt;measured according to&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;655&quot; y=&quot;282&quot; text-anchor=&quot;middle&quot;&gt;the nature of the benefit&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#tfr&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;390&quot; y=&quot;335&quot; width=&quot;170&quot; height=&quot;60&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;475&quot; y=&quot;361&quot; text-anchor=&quot;middle&quot;&gt;TFR in Italy&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;475&quot; y=&quot;380&quot; text-anchor=&quot;middle&quot;&gt;DB or DC, case by case&lt;/text&gt;&lt;/a&gt;&lt;/g&gt;
&lt;g class=&quot;terra&quot;&gt;&lt;a href=&quot;#bnp&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;20&quot; y=&quot;440&quot; width=&quot;720&quot; height=&quot;66&quot; rx=&quot;10&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;380&quot; y=&quot;468&quot; text-anchor=&quot;middle&quot;&gt;BNP Paribas case, 2025 consolidated financial statements&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;380&quot; y=&quot;490&quot; text-anchor=&quot;middle&quot;&gt;all the categories, read in real financial statements&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#controlli&quot;&gt;&lt;rect class=&quot;b dash&quot; x=&quot;20&quot; y=&quot;530&quot; width=&quot;350&quot; height=&quot;48&quot; rx=&quot;9&quot;/&gt;&lt;text x=&quot;195&quot; y=&quot;559&quot; text-anchor=&quot;middle&quot;&gt;Points in the slides to check&lt;/text&gt;&lt;/a&gt;
&lt;a href=&quot;#fonti&quot;&gt;&lt;rect class=&quot;b dash&quot; x=&quot;390&quot; y=&quot;530&quot; width=&quot;350&quot; height=&quot;48&quot; rx=&quot;9&quot;/&gt;&lt;text x=&quot;565&quot; y=&quot;559&quot; text-anchor=&quot;middle&quot;&gt;Further reading&lt;/text&gt;&lt;/a&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;/div&gt;
&lt;figcaption&gt;Map of the lecture: every box is clickable. Dashed lines indicate a link without derivation: IAS 26 and IFRS 2 are outside the scope, and other long-term benefits borrow the defined benefit technique.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;/div&gt;&lt;/header&gt;

&lt;/ol&gt;&lt;/nav&gt;

&lt;main&gt;
&lt;section class=&quot;part slate&quot; id=&quot;quadro&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;The framework&lt;/p&gt;
&lt;h2&gt;What IAS 19 regulates, and what it does not&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;IAS 19 starts from a simple idea: the employee works today, so the cost arises today, even if the cash will leave many years from now.&lt;/p&gt;

&lt;h3&gt;Three standards for personnel costs &lt;span class=&quot;src&quot;&gt;p. 2-4&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;IAS 19 &lt;span class=&quot;en&quot;&gt;Employee Benefits&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Takes the perspective of the &lt;strong&gt;employer&lt;/strong&gt;: how to account for every benefit provided to employees. This is the subject of this lecture.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;IAS 26 &lt;span class=&quot;en&quot;&gt;Retirement Benefit Plans&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Takes the perspective of the &lt;strong&gt;plan&lt;/strong&gt; (often a pension fund): how it prepares its own financial statements. IAS 19 does not deal with this (IAS 19.3).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;IFRS 2 &lt;span class=&quot;en&quot;&gt;Share-based Payment&lt;/span&gt;&lt;/h4&gt;&lt;p&gt;Compensation paid &lt;strong&gt;in shares&lt;/strong&gt; or linked to their value. It is explicitly excluded from IAS 19 (IAS 19.2).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Objective and definition &lt;span class=&quot;src&quot;&gt;p. 3&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;The standard prescribes &lt;strong&gt;accounting and disclosure&lt;/strong&gt;, that is, recognition and disclosure in the notes. &lt;dfn&gt;Employee benefits&lt;/dfn&gt; are all forms of consideration given by the entity in exchange for service rendered by employees or for the termination of employment (IAS 19.8).&lt;/p&gt;
&lt;figure&gt;&lt;div class=&quot;scroll&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 170&quot; role=&quot;img&quot; aria-label=&quot;Timeline: when the employee works, the expense and the liability arise; when the entity pays, the liability is extinguished.&quot;&gt;
&lt;path class=&quot;ln&quot; d=&quot;M30 80H610&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;defs&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L8 4L0 8z&quot; style=&quot;fill:var(--soft)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;circle cx=&quot;120&quot; cy=&quot;80&quot; r=&quot;7&quot; style=&quot;fill:var(--accent)&quot;/&gt;&lt;circle cx=&quot;520&quot; cy=&quot;80&quot; r=&quot;7&quot; style=&quot;fill:var(--slate)&quot;/&gt;
&lt;text class=&quot;t&quot; x=&quot;120&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;The employee works&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;120&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot;&gt;today&lt;/text&gt;
&lt;text class=&quot;t&quot; x=&quot;520&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;The entity pays&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;520&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot;&gt;possibly many years later&lt;/text&gt;
&lt;rect x=&quot;125&quot; y=&quot;94&quot; width=&quot;390&quot; height=&quot;24&quot; rx=&quot;4&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;111&quot; text-anchor=&quot;middle&quot;&gt;liability: the debt remains open until payment&lt;/text&gt;
&lt;text class=&quot;t&quot; x=&quot;120&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; style=&quot;fill:var(--accent)&quot;&gt;expense&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;120&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot;&gt;the service is consumed&lt;/text&gt;
&lt;text class=&quot;t&quot; x=&quot;520&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot;&gt;cash&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;520&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot;&gt;not when the cost arises&lt;/text&gt;
&lt;/svg&gt;&lt;/div&gt;&lt;figcaption&gt;IAS 19.1: a &lt;span class=&quot;en&quot;&gt;liability&lt;/span&gt; when service has been rendered in exchange for future benefits; an &lt;span class=&quot;en&quot;&gt;expense&lt;/span&gt; when the entity consumes the economic benefit arising from that service.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3&gt;Where the obligation comes from &lt;span class=&quot;src&quot;&gt;p. 4&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;A written contract is not required: IAS 19.4 covers three sources.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Formal plans or other formal agreements&lt;/strong&gt; with individual employees, groups of employees or their representatives.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Legal requirements&lt;/strong&gt; or industry arrangements that require contributions to national, state, industry or &lt;span class=&quot;en&quot;&gt;multi-employer&lt;/span&gt; plans.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Informal practices&lt;/strong&gt; that give rise to a &lt;dfn&gt;constructive obligation&lt;/dfn&gt; (an implicit obligation): the entity has no realistic alternative to paying, for example because changing the practice would cause unacceptable damage to its relationship with employees.&lt;/li&gt;
&lt;/ul&gt;

&lt;h3&gt;The four categories &lt;span class=&quot;src&quot;&gt;p. 5-6&lt;/span&gt;&lt;/h3&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot;&gt;&lt;button type=&quot;button&quot;&gt;Short-term&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Post-employment&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Other long-term&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Termination&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel sage&quot;&gt;&lt;p&gt;&lt;dfn&gt;Short-term employee benefits&lt;/dfn&gt;: benefits expected to be settled wholly within twelve months after the end of the reporting period in which the service is rendered.&lt;/p&gt;&lt;p&gt;Examples: wages, salaries and social security contributions, paid annual leave and sick leave, &lt;span class=&quot;en&quot;&gt;profit-sharing&lt;/span&gt; and bonuses, non-monetary benefits such as medical care, housing, cars and free goods or services for current employees. &lt;a href=&quot;#breve&quot;&gt;Go to section 2&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel ochre&quot;&gt;&lt;p&gt;&lt;dfn&gt;Post-employment benefits&lt;/dfn&gt;: benefits payable after the end of employment, other than termination and short-term benefits.&lt;/p&gt;&lt;p&gt;Examples: pensions, lump sums on retirement, post-employment life insurance and medical care. &lt;a href=&quot;#post&quot;&gt;Go to section 3&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel slate&quot;&gt;&lt;p&gt;&lt;dfn&gt;Other long-term employee benefits&lt;/dfn&gt;: a residual category, covering everything that does not fall into the other three.&lt;/p&gt;&lt;p&gt;Examples: &lt;span class=&quot;en&quot;&gt;long-service&lt;/span&gt; or &lt;span class=&quot;en&quot;&gt;sabbatical leave&lt;/span&gt;, &lt;span class=&quot;en&quot;&gt;jubilee benefits&lt;/span&gt; (seniority awards), long-term disability benefits. &lt;a href=&quot;#altri&quot;&gt;Go to section 6&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;panel brick&quot;&gt;&lt;p&gt;&lt;dfn&gt;Termination benefits&lt;/dfn&gt;: benefits provided in exchange for the termination of employment, as a result of the entity&#x27;s decision before the normal retirement date or of the employee&#x27;s acceptance of an offer. &lt;a href=&quot;#term&quot;&gt;Go to section 7&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;The four categories at a glance &lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt;&lt;/h4&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;What gives rise to the obligation&lt;/th&gt;&lt;th&gt;Discounting&lt;/th&gt;&lt;th&gt;Remeasurement&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Short-term&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Service rendered&lt;/td&gt;&lt;td&gt;No&lt;/td&gt;&lt;td&gt;Not applicable&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Post-employment DB&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Service rendered&lt;/td&gt;&lt;td&gt;Yes&lt;/td&gt;&lt;td&gt;OCI&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Post-employment DC&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Service rendered, for the contribution due&lt;/td&gt;&lt;td&gt;Normally no&lt;/td&gt;&lt;td&gt;Not applicable&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Other long-term&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Service rendered&lt;/td&gt;&lt;td&gt;Yes&lt;/td&gt;&lt;td&gt;Profit or loss&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Termination&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Termination, not service&lt;/td&gt;&lt;td&gt;Depends on timing&lt;/td&gt;&lt;td&gt;Depends on nature&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;A company pays a Christmas bonus every year. It is not in the contract, but by now everyone expects it. Does IAS 19 cover it?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Yes, if ceasing to pay it would cause unacceptable damage to relations with employees: it is an informal practice that gives rise to a &lt;span class=&quot;en&quot;&gt;constructive obligation&lt;/span&gt; (IAS 19.4).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Stock options for managers: IAS 19 or IFRS 2?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;IFRS 2. IAS 19.2 excludes benefits to which IFRS 2 applies.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;The company pension fund prepares its own financial statements. Which standard does it use?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;IAS 26. IAS 19 looks at the employer, IAS 26 at the plan as a reporting entity.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part sage&quot; id=&quot;breve&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;IAS 19, paras 9-25&lt;/p&gt;
&lt;h2&gt;Short-term employee benefits&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;The simplest category: payment comes soon, so there is no discounting and there are no actuarial assumptions.&lt;/p&gt;
&lt;p&gt;The criterion is one of timing: settlement expected &lt;strong&gt;wholly within twelve months after the end of the reporting period&lt;/strong&gt; in which the service is rendered &lt;span class=&quot;src&quot;&gt;p. 7&lt;/span&gt;. For a reporting period ending on 31/12/2026, the limit is 31/12/2027 &lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;

&lt;h3&gt;Recognition and measurement: IAS 19.11 &lt;span class=&quot;src&quot;&gt;p. 8&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;The entity recognises the &lt;dfn&gt;undiscounted&lt;/dfn&gt; amount expected to be paid for the service rendered. With payments this close, the effect of discounting would be negligible &lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt;. An amount due but not yet paid is an &lt;span class=&quot;en&quot;&gt;accrued expense&lt;/span&gt;; any excess already paid is a &lt;span class=&quot;en&quot;&gt;prepaid expense&lt;/span&gt;.&lt;/p&gt;
&lt;figure&gt;&lt;div class=&quot;scroll&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 196&quot; role=&quot;img&quot; aria-label=&quot;Diagram of IAS 19.11: the benefit due is compared with the amount already paid. If an amount remains due, it is a liability; if the amount paid is greater, it is an asset to the extent that it leads to refunds or reductions. The other side of the entry is an expense, unless capitalised under IAS 2 or IAS 16.&quot;&gt;
&lt;g class=&quot;sage&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;10&quot; y=&quot;64&quot; width=&quot;170&quot; height=&quot;60&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;95&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot;&gt;Benefit due&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;95&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot;&gt;less amount already paid&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M180 94H230M230 94V38H262M230 94V150H262&quot;/&gt;
&lt;g class=&quot;sage&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;262&quot; y=&quot;10&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;347&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot;&gt;Still to be paid&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;347&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot;&gt;liability, accrued expense&lt;/text&gt;
&lt;rect class=&quot;b&quot; x=&quot;262&quot; y=&quot;122&quot; width=&quot;170&quot; height=&quot;56&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;347&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot;&gt;Overpaid&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;347&quot; y=&quot;164&quot; text-anchor=&quot;middle&quot;&gt;asset, prepaid expense&lt;/text&gt;&lt;/g&gt;
&lt;text class=&quot;s&quot; x=&quot;448&quot; y=&quot;141&quot;&gt;only if it leads to lower&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;448&quot; y=&quot;158&quot;&gt;payments or a refund&lt;/text&gt;
&lt;text class=&quot;t&quot; x=&quot;448&quot; y=&quot;30&quot;&gt;Other side of the entry:&lt;/text&gt;&lt;text x=&quot;448&quot; y=&quot;48&quot;&gt;expense&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;448&quot; y=&quot;66&quot;&gt;unless cost of an asset&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;448&quot; y=&quot;82&quot;&gt;(IAS 2, IAS 16)&lt;/text&gt;
&lt;/svg&gt;&lt;/div&gt;&lt;figcaption&gt;The cost may not reach profit or loss immediately: the wages of production workers enter the cost of inventories, and those of workers building a plant enter the cost of that plant &lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt;.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;h3 id=&quot;assenze&quot;&gt;Short-term paid absences &lt;span class=&quot;src&quot;&gt;p. 9-12&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;Annual leave, sickness, maternity or paternity leave, military service, jury duty: IAS 19.14 distinguishes two categories on the basis of a single question, &lt;strong&gt;does the entitlement carry forward to the next period?&lt;/strong&gt;&lt;/p&gt;
&lt;figure&gt;&lt;div class=&quot;scroll&quot;&gt;
&lt;svg viewBox=&quot;0 0 660 262&quot; role=&quot;img&quot; aria-label=&quot;Decision tree: if unused days are carried forward, the absence is accumulating; it can be vesting or non-vesting, and a liability is recognised while the employee works. If they are not carried forward, it is non-accumulating and the expense is recognised when the absence occurs.&quot;&gt;
&lt;g class=&quot;sage&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;205&quot; y=&quot;8&quot; width=&quot;250&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;330&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot;&gt;Are unused days carried forward?&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M270 52V78H130V96M390 52V78H530V96&quot;/&gt;&lt;text class=&quot;s&quot; x=&quot;190&quot; y=&quot;72&quot;&gt;yes&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;460&quot; y=&quot;72&quot;&gt;no&lt;/text&gt;
&lt;g class=&quot;sage&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;30&quot; y=&quot;96&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;130&quot; y=&quot;123&quot; text-anchor=&quot;middle&quot;&gt;Accumulating&lt;/text&gt;
&lt;rect class=&quot;b&quot; x=&quot;430&quot; y=&quot;96&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;530&quot; y=&quot;123&quot; text-anchor=&quot;middle&quot;&gt;Non-accumulating&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M80 140V160M180 140V160&quot;/&gt;
&lt;g class=&quot;sage&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;6&quot; y=&quot;160&quot; width=&quot;130&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;71&quot; y=&quot;179&quot; text-anchor=&quot;middle&quot;&gt;Vesting&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;71&quot; y=&quot;195&quot; text-anchor=&quot;middle&quot;&gt;cash on leaving&lt;/text&gt;
&lt;rect class=&quot;b&quot; x=&quot;144&quot; y=&quot;160&quot; width=&quot;130&quot; height=&quot;44&quot; rx=&quot;8&quot;/&gt;&lt;text x=&quot;209&quot; y=&quot;179&quot; text-anchor=&quot;middle&quot;&gt;Non-vesting&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;209&quot; y=&quot;195&quot; text-anchor=&quot;middle&quot;&gt;no cash on leaving&lt;/text&gt;&lt;/g&gt;
&lt;text class=&quot;t&quot; x=&quot;140&quot; y=&quot;228&quot; text-anchor=&quot;middle&quot;&gt;Liability as the employee works&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;140&quot; y=&quot;248&quot; text-anchor=&quot;middle&quot;&gt;non-vesting: estimate of leavers (19.15)&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M530 140V166&quot;/&gt;&lt;text class=&quot;t&quot; x=&quot;530&quot; y=&quot;186&quot; text-anchor=&quot;middle&quot;&gt;Expense only when&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;530&quot; y=&quot;204&quot; text-anchor=&quot;middle&quot;&gt;the absence occurs&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;530&quot; y=&quot;226&quot; text-anchor=&quot;middle&quot;&gt;sickness, maternity, jury duty,&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;530&quot; y=&quot;242&quot; text-anchor=&quot;middle&quot;&gt;military service (19.18)&lt;/text&gt;
&lt;/svg&gt;&lt;/div&gt;&lt;/figure&gt;
&lt;p&gt;Accumulating absences are measured at the &lt;strong&gt;additional amount&lt;/strong&gt; (19.16): the extra amount the entity expects to pay for the entitlement unused at the end of the reporting period. &lt;span class=&quot;en&quot;&gt;Vesting&lt;/span&gt; means that the entitlement is due regardless of whether the employee stays with the company.&lt;/p&gt;
&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;Calculator: the Alfa case &lt;span class=&quot;src&quot;&gt;p. 12&lt;/span&gt;&lt;/h4&gt;
&lt;div class=&quot;seg&quot; id=&quot;al-k&quot; role=&quot;group&quot; aria-label=&quot;Type of absence&quot;&gt;&lt;button data-v=&quot;vest&quot;&gt;Accumulating, vesting&lt;/button&gt;&lt;button data-v=&quot;nonvest&quot;&gt;Accumulating, non-vesting&lt;/button&gt;&lt;button data-v=&quot;non&quot;&gt;Non-accumulating&lt;/button&gt;&lt;/div&gt;
&lt;label&gt;Employees&lt;input id=&quot;al-n&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;20&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;al-n-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Days per year&lt;input id=&quot;al-d&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;30&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;al-d-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Cost per day&lt;input id=&quot;al-c&quot; type=&quot;range&quot; min=&quot;20&quot; max=&quot;200&quot; step=&quot;10&quot; value=&quot;50&quot;&gt;&lt;output id=&quot;al-c-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Unused days&lt;input id=&quot;al-u&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;al-u-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label id=&quot;al-p-row&quot;&gt;Probability of use&lt;input id=&quot;al-p&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;80&quot;&gt;&lt;output id=&quot;al-p-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;b id=&quot;al-cost&quot;&gt;&lt;/b&gt;leave expense for the period&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;al-liab&quot;&gt;&lt;/b&gt;liability at the end of the period&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;say&quot; id=&quot;al-say&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;say&quot; style=&quot;color:var(--soft);font-size:.86rem&quot;&gt;Initial values from the slide: 5 × 20 × 50 = 5,000 € of expense, 1 × 4 × 50 = 200 € of liability. The probability is a teaching variable added here.&lt;/p&gt;&lt;/div&gt;

&lt;h3 id=&quot;bonus&quot;&gt;Profit-sharing and bonus plans &lt;span class=&quot;src&quot;&gt;p. 13-15&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;The expected cost is recognised when, and only when, two conditions are met &lt;strong&gt;together&lt;/strong&gt; (IAS 19.19):&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Present obligation&lt;/h4&gt;&lt;p&gt;A present legal or constructive obligation arising from past events. It exists only if the entity has no realistic alternative to paying.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Reliable estimate&lt;/h4&gt;&lt;p&gt;Possible only if (19.22): the plan contains a formula; or the amount is determined before the financial statements are authorised for issue; or past practice gives clear evidence.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Some plans pay only those who remain for a specified period (19.20). The obligation still arises as service increases the amount, but the measurement takes into account that some employees will leave without receiving payment.&lt;/p&gt;
&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;From 3% to 2.5% &lt;span class=&quot;src&quot;&gt;p. 15&lt;/span&gt;&lt;/h4&gt;
&lt;label&gt;Profit for the year&lt;input id=&quot;ps-p&quot; type=&quot;range&quot; min=&quot;100&quot; max=&quot;5000&quot; step=&quot;100&quot; value=&quot;1000&quot;&gt;&lt;output id=&quot;ps-p-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Share with no leavers&lt;input id=&quot;ps-f&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;60&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;ps-f-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Share estimated with turnover&lt;input id=&quot;ps-e&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;60&quot; value=&quot;25&quot;&gt;&lt;output id=&quot;ps-e-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;b id=&quot;ps-max&quot;&gt;&lt;/b&gt;payment if nobody leaves&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;ps-rec&quot;&gt;&lt;/b&gt;liability and expense recognised&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;ps-gap&quot;&gt;&lt;/b&gt;effect of &lt;span class=&quot;en&quot;&gt;turnover&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;say&quot; style=&quot;color:var(--soft);font-size:.86rem&quot;&gt;Slide: 3% with no leavers, 2.5% estimated with staff &lt;span class=&quot;en&quot;&gt;turnover&lt;/span&gt;; 2.5% is recognised. The profit of 1,000 k€ is an illustrative value.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Leave that can be carried forward but not converted to cash on leaving: is there a liability?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Yes. It is accumulating and non-vesting: the obligation exists, but the measurement considers who might leave before using the days (19.15).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why does sick leave usually not give rise to a liability at year-end?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because working does not increase the future entitlement: if it is not used, it lapses. The expense is recognised when the absence occurs (19.18).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;The 2026 bonus is decided by the Board of Directors before the financial statements are authorised. Can it be estimated reliably?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Yes, this is the second case in IAS 19.22. It remains necessary, however, to verify that a &lt;span class=&quot;en&quot;&gt;present obligation&lt;/span&gt; also exists.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Are workers&#x27; wages always an expense of the period?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: IAS 19.11 makes an exception where another IFRS, such as IAS 2 or IAS 16, requires or permits their inclusion in the cost of an asset.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;post&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;The core of the lecture&lt;/p&gt;
&lt;h2&gt;Post-employment benefits&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;The key question is not &quot;how much do I pay&quot;, but &quot;who bears the risk if things turn out worse than expected&quot;. All of the accounting depends on the answer.&lt;/p&gt;
&lt;p&gt;They include &lt;strong&gt;retirement benefits&lt;/strong&gt; (pensions, lump sums on retirement) and &lt;strong&gt;other post-employment benefits&lt;/strong&gt; (life insurance, medical care) &lt;span class=&quot;src&quot;&gt;p. 16&lt;/span&gt;. The standard applies whether or not a separate entity exists to receive the contributions. Classification depends on the &lt;dfn&gt;economic substance&lt;/dfn&gt; of the plan, not on its form (19.27).&lt;/p&gt;

&lt;h3&gt;Defined contribution versus defined benefit &lt;span class=&quot;src&quot;&gt;p. 17-18&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Defined contribution (DC)&lt;/th&gt;&lt;th&gt;Defined benefit (DB)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;What the entity promises&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;A set contribution&lt;/td&gt;&lt;td&gt;An agreed benefit&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;What the benefit depends on&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Contributions paid plus returns&lt;/td&gt;&lt;td&gt;The terms of the plan&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Actuarial risk&lt;/strong&gt; (the benefit differs from expectations)&lt;/td&gt;&lt;td&gt;Employee&lt;/td&gt;&lt;td&gt;Entity&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Investment risk&lt;/strong&gt; (the assets are insufficient)&lt;/td&gt;&lt;td&gt;Employee&lt;/td&gt;&lt;td&gt;Entity&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Expense in the financial statements&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Contributions accrued in the period&lt;/td&gt;&lt;td&gt;Complex actuarial calculations&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Periodic valuations&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Not required&lt;/td&gt;&lt;td&gt;PV (present value) of the obligation and &lt;span class=&quot;en&quot;&gt;fair value&lt;/span&gt; (market value) of the assets&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;Who pays if the fund performs badly? &lt;span class=&quot;int&quot;&gt;teaching simulation&lt;/span&gt;&lt;/h4&gt;
&lt;p class=&quot;say&quot;&gt;Imagine a fund expected to be worth 100 at retirement. Move the return relative to expectations.&lt;/p&gt;
&lt;label&gt;Deviation&lt;input id=&quot;ri-x&quot; type=&quot;range&quot; min=&quot;-50&quot; max=&quot;50&quot; step=&quot;5&quot; value=&quot;-20&quot;&gt;&lt;output id=&quot;ri-x-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;h4&gt;Defined benefit&lt;/h4&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;span&gt;Employee receives&lt;/span&gt;&lt;span class=&quot;tr&quot;&gt;&lt;i id=&quot;ri-db-e&quot; class=&quot;ca&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;ri-db-e-v&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;span&gt;Entity adds&lt;/span&gt;&lt;span class=&quot;tr&quot;&gt;&lt;i id=&quot;ri-db-c&quot; class=&quot;pl&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;ri-db-c-v&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;h4&gt;Defined contribution&lt;/h4&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;span&gt;Employee receives&lt;/span&gt;&lt;span class=&quot;tr&quot;&gt;&lt;i id=&quot;ri-dc-e&quot; class=&quot;ca&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;ri-dc-e-v&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;span&gt;Entity adds&lt;/span&gt;&lt;span class=&quot;tr&quot;&gt;&lt;i id=&quot;ri-dc-c&quot; class=&quot;pl&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;ri-dc-c-v&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;p class=&quot;say&quot; id=&quot;ri-say&quot;&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Actuarial assumptions: IAS 19.76 &lt;span class=&quot;src&quot;&gt;p. 20-21&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;These are the entity&#x27;s best estimates of the variables that will determine the ultimate cost.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot;&gt;&lt;button type=&quot;button&quot;&gt;Demographic&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Financial&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;p&gt;On &lt;em&gt;who&lt;/em&gt; and &lt;em&gt;for how long&lt;/em&gt;:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;mortality;&lt;/li&gt;&lt;li&gt;turnover, disability, early retirement;&lt;/li&gt;&lt;li&gt;proportion of plan members with dependants eligible for benefits;&lt;/li&gt;&lt;li&gt;proportion choosing each form of payment;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;en&quot;&gt;claim rates&lt;/span&gt; under medical plans.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;p&gt;On &lt;em&gt;how much&lt;/em&gt; and &lt;em&gt;its value today&lt;/em&gt;:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;en&quot;&gt;discount rate&lt;/span&gt;;&lt;/li&gt;&lt;li&gt;future benefit and salary levels;&lt;/li&gt;&lt;li&gt;future medical costs, including claim handling costs;&lt;/li&gt;&lt;li&gt;taxes payable by the plan on contributions or benefits relating to past service.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Funded or unfunded &lt;span class=&quot;src&quot;&gt;p. 22&lt;/span&gt;&lt;/h3&gt;
&lt;p&gt;A DB plan can be &lt;dfn&gt;unfunded&lt;/dfn&gt; (no separate assets) or &lt;dfn&gt;funded&lt;/dfn&gt;, wholly or partly, through contributions to a legally separate fund. Even where a fund exists, the entity is in substance underwriting the risks: it will have to cover any shortfall. The DB expense therefore &lt;strong&gt;does not necessarily equal&lt;/strong&gt; the contribution for the period (19.56). The complexity stems from two facts: actuarial assumptions, with possible &lt;dfn&gt;actuarial gains and losses&lt;/dfn&gt;, and discounting for distant payments (19.55).&lt;/p&gt;

&lt;h3&gt;The four steps of IAS 19.57 &lt;span class=&quot;src&quot;&gt;p. 23-24&lt;/span&gt;&lt;/h3&gt;
&lt;figure&gt;&lt;div class=&quot;scroll&quot;&gt;
&lt;svg id=&quot;s57&quot; viewBox=&quot;0 0 680 118&quot; role=&quot;img&quot; aria-label=&quot;Sequence: deficit or surplus, net defined benefit liability, profit or loss, other comprehensive income&quot;&gt;
&lt;g class=&quot;ochre&quot;&gt;
&lt;g data-s=&quot;0&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;4&quot; y=&quot;14&quot; width=&quot;154&quot; height=&quot;84&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;81&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;a&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;81&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;Deficit or surplus&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;81&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;DBO − plan assets&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;1&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;176&quot; y=&quot;14&quot; width=&quot;154&quot; height=&quot;84&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;253&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;b&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;253&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;Net liability&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;253&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;with asset ceiling&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;2&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;348&quot; y=&quot;14&quot; width=&quot;154&quot; height=&quot;84&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;425&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;c&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;425&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;Profit or loss&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;425&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;service, net interest&lt;/text&gt;&lt;/g&gt;
&lt;g data-s=&quot;3&quot;&gt;&lt;rect class=&quot;b&quot; x=&quot;520&quot; y=&quot;14&quot; width=&quot;154&quot; height=&quot;84&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;h&quot; x=&quot;597&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot;&gt;d&lt;/text&gt;&lt;text class=&quot;t&quot; x=&quot;597&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;OCI&lt;/text&gt;&lt;text class=&quot;s&quot; x=&quot;597&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;remeasurements&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;&lt;/svg&gt;&lt;/div&gt;&lt;/figure&gt;
&lt;div data-stepper data-svg=&quot;s57&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;a. Determine the deficit or surplus&lt;/h4&gt;&lt;ol&gt;&lt;li&gt;The &lt;dfn&gt;projected unit credit method&lt;/dfn&gt; (PUC) is used to estimate the ultimate cost of the benefit earned through current and past service.&lt;/li&gt;&lt;li&gt;This cost is discounted, giving the &lt;dfn&gt;defined benefit obligation&lt;/dfn&gt; (DBO, the present value of the obligation) and the &lt;dfn&gt;current service cost&lt;/dfn&gt; (the service cost of the year).&lt;/li&gt;&lt;li&gt;The &lt;span class=&quot;en&quot;&gt;fair value&lt;/span&gt; of any &lt;dfn&gt;plan assets&lt;/dfn&gt; is deducted.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;b. Determine the net defined benefit liability (asset)&lt;/h4&gt;&lt;p&gt;This is the deficit or surplus, adjusted for any &lt;dfn&gt;asset ceiling&lt;/dfn&gt;: the limit on a net asset.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;c. What goes to profit or loss (P&amp;amp;L)&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Current service cost.&lt;/li&gt;&lt;li&gt;&lt;dfn&gt;Past service cost&lt;/dfn&gt; (the effect of plan amendments) and gain or loss on &lt;dfn&gt;settlement&lt;/dfn&gt; (extinguishment of the obligation).&lt;/li&gt;&lt;li&gt;&lt;dfn&gt;Net interest&lt;/dfn&gt; on the net defined benefit liability (asset).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;d. What goes to other comprehensive income&lt;/h4&gt;&lt;p&gt;&lt;dfn&gt;Remeasurements&lt;/dfn&gt; of the net liability, in &lt;dfn&gt;other comprehensive income&lt;/dfn&gt; (OCI):&lt;/p&gt;&lt;ul&gt;&lt;li&gt;actuarial gains and losses;&lt;/li&gt;&lt;li&gt;return on plan assets, excluding amounts already in net interest;&lt;/li&gt;&lt;li&gt;change in the asset ceiling, excluding amounts already in net interest.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Where there is more than one material plan, the procedure is applied to each separately.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;From the DBO to the statement of financial position&lt;/h4&gt;
&lt;label&gt;DBO&lt;input id=&quot;nl-d&quot; type=&quot;range&quot; min=&quot;50&quot; max=&quot;150&quot; step=&quot;5&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;nl-d-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Plan assets&lt;input id=&quot;nl-a&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;125&quot;&gt;&lt;output id=&quot;nl-a-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Recoverable benefits&lt;input id=&quot;nl-c&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;50&quot; step=&quot;5&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;nl-c-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;b id=&quot;nl-r1&quot;&gt;&lt;/b&gt;DBO&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;nl-r2&quot;&gt;&lt;/b&gt;plan assets&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;nl-r3&quot;&gt;&lt;/b&gt;asset ceiling effect&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;nl-r4&quot;&gt;&lt;/b&gt;&lt;span id=&quot;nl-l4&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;say&quot; id=&quot;nl-say&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;say&quot; style=&quot;color:var(--soft);font-size:.86rem&quot;&gt;Illustrative values. BNP Paribas confirms the logic of the ceiling: the asset is recognised if it represents a future benefit in the form of reduced contributions or refunds &lt;span class=&quot;src&quot;&gt;p. 50&lt;/span&gt;. The surplus in Türkiye is not recognised &lt;span class=&quot;src&quot;&gt;p. 54&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Practice: where does each item go?&lt;/h3&gt;
&lt;ul class=&quot;sort&quot;&gt;
&lt;li data-a=&quot;pl&quot; data-w=&quot;The service cost of the year is the core of the operating cost.&quot;&gt;&lt;span&gt;Current service cost&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;pl&quot;&gt;P&amp;amp;L&lt;/button&gt;&lt;button data-v=&quot;oci&quot;&gt;OCI&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;pl&quot; data-w=&quot;A plan amendment affects profit or loss immediately.&quot;&gt;&lt;span&gt;Past service cost&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;pl&quot;&gt;P&amp;amp;L&lt;/button&gt;&lt;button data-v=&quot;oci&quot;&gt;OCI&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;pl&quot; data-w=&quot;It is a component of cost arising from the passage of time on the net position.&quot;&gt;&lt;span&gt;Net interest&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;pl&quot;&gt;P&amp;amp;L&lt;/button&gt;&lt;button data-v=&quot;oci&quot;&gt;OCI&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;pl&quot; data-w=&quot;Listed among the profit or loss items in IAS 19.57(c).&quot;&gt;&lt;span&gt;Gain or loss on settlement&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;pl&quot;&gt;P&amp;amp;L&lt;/button&gt;&lt;button data-v=&quot;oci&quot;&gt;OCI&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;oci&quot; data-w=&quot;This is the typical case of a remeasurement.&quot;&gt;&lt;span&gt;Actuarial gains and losses&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;pl&quot;&gt;P&amp;amp;L&lt;/button&gt;&lt;button data-v=&quot;oci&quot;&gt;OCI&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;oci&quot; data-w=&quot;The part beyond net interest is a remeasurement.&quot;&gt;&lt;span&gt;Return on plan assets beyond net interest&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;pl&quot;&gt;P&amp;amp;L&lt;/button&gt;&lt;button data-v=&quot;oci&quot;&gt;OCI&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;li data-a=&quot;oci&quot; data-w=&quot;This too is a remeasurement, excluding the part in net interest.&quot;&gt;&lt;span&gt;Change in the asset ceiling beyond net interest&lt;/span&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button data-v=&quot;pl&quot;&gt;P&amp;amp;L&lt;/button&gt;&lt;button data-v=&quot;oci&quot;&gt;OCI&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;p class=&quot;say&quot; style=&quot;font-weight:600&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;

&lt;div class=&quot;tint warn&quot;&gt;&lt;p&gt;&lt;strong&gt;Caution regarding slides p. 25-26.&lt;/strong&gt; The &lt;span class=&quot;en&quot;&gt;service cost&lt;/span&gt; table lists &lt;span class=&quot;en&quot;&gt;expected return on assets&lt;/span&gt; and &lt;span class=&quot;en&quot;&gt;recognised actuarial gains and losses&lt;/span&gt;; slide 26 defines the &lt;span class=&quot;en&quot;&gt;net liability&lt;/span&gt; as the DBO net of unrecognised gains and losses. These concepts belong to the regime before the 2011 amendment, as the note on the &lt;a href=&quot;#modifiche&quot;&gt;corridor approach&lt;/a&gt; recalls. For the current regime, refer to p. 24.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;A plan is called a &quot;contribution&quot; plan, but the entity guarantees a minimum return. What is it?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Substance is what counts. If the entity bears part of the risk, the plan is wholly or partly DB in nature. BNP Paribas shows this in Belgium: a &lt;span class=&quot;en&quot;&gt;provision&lt;/span&gt; for the return guarantee not covered by the insurer &lt;span class=&quot;src&quot;&gt;p. 53&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why can the DB expense differ from the contribution paid?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because the contribution is a funding choice, whereas the expense measures the benefit earned. In addition, the entity guarantees the final result (19.56).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Market rates rise: what happens to the DBO, and where does the effect go?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The DBO falls, because discounting is heavier. This is an actuarial gain from financial assumptions, in OCI.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;A surplus of 25 with recoverable benefits of 10: how much is recognised?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;An asset of 10. The remainder (15) is the effect of the asset ceiling.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;puc&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;Lab&lt;/p&gt;
&lt;h2&gt;The projected unit credit method&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;Each year of service gives rise to one &quot;unit&quot; of benefit. Each unit is measured separately, and their sum builds up the final obligation &lt;span class=&quot;src&quot;&gt;p. 19&lt;/span&gt;.&lt;/p&gt;
&lt;p&gt;The name contains the method. &lt;strong&gt;Projected&lt;/strong&gt;: the salary projected to the end of the career is used, not today&#x27;s salary. &lt;strong&gt;Unit&lt;/strong&gt;: the final benefit is allocated across years of service. &lt;strong&gt;Credit&lt;/strong&gt;: each year credits one unit. The result is then discounted &lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Final salary = S × (1 + g)&lt;sup&gt;n&lt;/sup&gt; &amp;nbsp;·&amp;nbsp; Annual unit = a × final salary&lt;br&gt;Interest cost = opening DBO × r &amp;nbsp;·&amp;nbsp; Current service cost = change in DBO − interest cost&lt;/div&gt;
&lt;p&gt;&lt;span class=&quot;en&quot;&gt;Interest cost&lt;/span&gt;: the unwinding on the amount accumulated at the start of the period, because payment is closer. &lt;span class=&quot;en&quot;&gt;Current service cost&lt;/span&gt;: the &quot;true&quot; benefit earned in the period &lt;span class=&quot;src&quot;&gt;p. 42&lt;/span&gt;.&lt;/p&gt;

&lt;div class=&quot;lab&quot;&gt;&lt;h4&gt;Try the numbers &lt;span class=&quot;src&quot;&gt;p. 41-43&lt;/span&gt;&lt;/h4&gt;
&lt;div class=&quot;seg&quot;&gt;&lt;button class=&quot;btn&quot; data-set=&quot;a&quot;&gt;Example, slides 41-42&lt;/button&gt;&lt;button class=&quot;btn&quot; data-set=&quot;b&quot;&gt;Recalculated, slide 43&lt;/button&gt;&lt;/div&gt;
&lt;label&gt;Annual salary S&lt;input id=&quot;pu-s&quot; type=&quot;range&quot; min=&quot;20000&quot; max=&quot;150000&quot; step=&quot;1000&quot; value=&quot;50000&quot;&gt;&lt;output id=&quot;pu-s-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Salary growth g&lt;input id=&quot;pu-g&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.5&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;pu-g-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Annual share a (‰)&lt;input id=&quot;pu-a&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;50&quot; step=&quot;1&quot; value=&quot;20&quot;&gt;&lt;output id=&quot;pu-a-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Term n (years)&lt;input id=&quot;pu-n&quot; type=&quot;range&quot; min=&quot;3&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;pu-n-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Discount rate r&lt;input id=&quot;pu-r&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;pu-r-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Year analysed&lt;input id=&quot;pu-t&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;5&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;pu-t-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;div class=&quot;seg&quot; id=&quot;pu-m&quot; role=&quot;group&quot; aria-label=&quot;Discounting convention&quot;&gt;&lt;button data-v=&quot;slide&quot;&gt;Discounting as in the slide&lt;/button&gt;&lt;button data-v=&quot;ias&quot;&gt;Discounting over remaining years&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;div&gt;&lt;b id=&quot;pu-f&quot;&gt;&lt;/b&gt;final salary&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;pu-u&quot;&gt;&lt;/b&gt;annual unit&lt;/div&gt;&lt;div&gt;&lt;b id=&quot;pu-tot&quot;&gt;&lt;/b&gt;total at maturity&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Analysis of the year&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;€&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;pu-tb&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;svg viewBox=&quot;0 0 620 250&quot; role=&quot;img&quot; aria-label=&quot;Chart of the obligation by year: opening DBO, interest cost and current service cost stacked; the dashed line is the undiscounted cumulative benefit.&quot;&gt;&lt;g id=&quot;pu-svg&quot;&gt;&lt;/g&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;p class=&quot;say&quot; style=&quot;font-size:.84rem;color:var(--soft)&quot;&gt;&lt;span class=&quot;key&quot; style=&quot;background:var(--rule)&quot;&gt;&lt;/span&gt;opening DBO &lt;span class=&quot;key&quot; style=&quot;background:var(--ochre);margin-left:.6em&quot;&gt;&lt;/span&gt;interest cost &lt;span class=&quot;key&quot; style=&quot;background:var(--accent);margin-left:.6em&quot;&gt;&lt;/span&gt;current service cost · dashed line: undiscounted cumulative benefit&lt;/p&gt;
&lt;p class=&quot;say&quot; id=&quot;pu-say&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;say&quot; style=&quot;font-size:.84rem;color:var(--soft)&quot;&gt;The slides show the year 3 analysis only for the first example (A 3,152.97; B 2,207.08; C 945.89; D 110.35; E 835.54). For the &quot;recalculated&quot; example they give only the cumulative benefits: the year-by-year analysis is calculated here. The examples come from the Ipsoa text, pp. 267-268, cited in the slide.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;tint warn&quot;&gt;&lt;p&gt;&lt;strong&gt;Point to check in class.&lt;/strong&gt; On p. 42 the obligation at the end of year 3 is discounted for 3 years and that at the end of year 2 for 2 years: the factor is tied to the years &lt;em&gt;elapsed&lt;/em&gt;. Under the PUC method, however, discounting covers the time &lt;em&gt;remaining&lt;/em&gt; until payment: at the end of year 3, 2 years remain &lt;a class=&quot;ext&quot; href=&quot;https://www.cpdbox.com/ifrs-projected-unit-credit-method-ias-19-example/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;. Using the remaining years, year 3 becomes A 3,310.62; B 2,101.98; C 1,208.64; D 105.10; E 1,103.54.&lt;/p&gt;&lt;p&gt;The test is simple: at the end of the contract the liability must equal the 6,083.26 € to be paid. Under the slide&#x27;s convention it stops at 4,766.40 €. Try the switch above and, for the exam, ask the lecturer which convention is expected.&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Salary 50,000, growth 4%, 5 years, share 2%: what is the annual unit?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;50,000 × 1.04&lt;sup&gt;5&lt;/sup&gt; = 60,832.65; × 2% = 1,216.65 €.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is the final salary used rather than today&#x27;s?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because the benefit is linked to the last salary. &quot;Projected&quot; incorporates expected growth, which is a financial actuarial assumption.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Opening DBO of 2,102 and a 5% discount rate: what is the interest cost?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;105.1. It is the rate applied to the opening DBO.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Under the remaining-years convention, why does the current service cost rise every year?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The undiscounted unit is constant, but each later year&#x27;s unit is closer to payment and is therefore discounted less.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;part brick&quot; id=&quot;tfr&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;p class=&quot;kicker&quot;&gt;The Italian case&lt;/p&gt;
&lt;h2&gt;TFR: one institution, two accounting natures&lt;/h2&gt;
&lt;p class=&quot;lead&quot;&gt;The &lt;dfn&gt;Trattamento di Fine Rapporto&lt;/dfn&gt; (severance pay) shows that classification follows risk: the same item is a defined benefit or a defined contribution depending on date and destination.&lt;/p&gt;
&lt;p&gt;The TFR is an amount that the employer sets aside each year and pays when employment ends. The Italian Civil Code (Article 2120) sets its accrual and revaluation, and financial statements under OIC (Italian GAAP) recognise the accrued amount &lt;span class=&quot;int&quot;&gt;supplement&lt;/span&gt;. Under IAS 19, by contrast, before the reform it was a post-employment benefit comparable to a defined benefit, as confirmed by the IFRIC &lt;span class=&quot;src&quot;&gt;p. 19&lt;/span&gt;. This entails &lt;strong&gt;demographic and financial variables&lt;/strong&gt;, discounting and the PUC method. The Agenzia delle Entrate (Italian Revenue Agency) also reports this in Resolution 133/2006 &lt;a class=&quot;ext&quot; href=&quot;https://agenziaentrate.gov.it/portale/documents/20143/306666/Risoluzione+n.+133+del+13+novembre+2006_ris_133.pdf/4b5b3529-2f16-4888-f65b-5808d1ef063d&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source&lt;/a&gt;.&lt;/p&gt;

&lt;h3&gt;The reform &lt;span class=&quot;src&quot;&gt;p. 27-28&lt;/span&gt;&lt;/h3&gt;
