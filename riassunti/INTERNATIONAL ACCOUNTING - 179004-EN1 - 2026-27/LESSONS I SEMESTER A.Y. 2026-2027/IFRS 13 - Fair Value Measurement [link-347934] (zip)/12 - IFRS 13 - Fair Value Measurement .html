&lt;h1&gt;IFRS 13&lt;br&gt;&lt;i&gt;Fair Value Measurement&lt;/i&gt;&lt;/h1&gt;
&lt;p class=&quot;deck&quot;&gt;A quanto si potrebbe vendere oggi questo asset (un&#x27;attività), o trasferire questa liability (una passività), secondo il mercato e non secondo chi li detiene?&lt;/p&gt;
&lt;p&gt;Il &lt;i&gt;fair value&lt;/i&gt; (valore equo) è il prezzo di uscita stimato dal punto di vista del mercato. IFRS 13 non dice &lt;b&gt;quando&lt;/b&gt; usarlo, lo decidono gli altri standard: dice &lt;b&gt;come&lt;/b&gt; misurarlo e &lt;b&gt;cosa&lt;/b&gt; raccontarne nelle note. Tutta la lezione si regge su tre verbi della norma: definire, misurare, informare.&lt;/p&gt;

&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Fonte principale: &lt;code&gt;corso/LESSONS I SEMESTER A.Y. 2026-2027/IFRS 13 - Fair Value Measurement [link-347934] (zip)/12 - IFRS 13 - Fair Value Measurement .pdf&lt;/code&gt; (59 slide). Altri file della cartella &lt;code&gt;corso/&lt;/code&gt;: non consultati, perché in questa sessione non è stato possibile elencarne il contenuto. Nessun collegamento qui viene quindi da altre lezioni: i rinvii ad altri standard sono quelli citati dalle slide.&lt;/p&gt;

&lt;section class=&quot;part fam-sal&quot; id=&quot;s1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Cornice&lt;/span&gt;&lt;h2&gt;Nascita e obiettivo del principio&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Prima di IFRS 13 ogni IAS/IFRS aveva una propria definizione di &lt;i class=&quot;t&quot;&gt;fair value&lt;/i&gt;: una situazione «molto composita e disomogenea». Lo IASB (&lt;i&gt;International Accounting Standards Board&lt;/i&gt;, l&#x27;organismo che emana gli standard) crea così un unico standard con una definizione generale. &lt;b&gt;In vigore dal 1° gennaio 2013.&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;
&lt;figure class=&quot;sv-lg&quot;&gt;
&lt;svg viewBox=&quot;0 0 560 190&quot; role=&quot;img&quot; aria-label=&quot;Da molte definizioni di fair value a una definizione generale&quot;&gt;
&lt;g class=&quot;ff&quot; opacity=&quot;.55&quot;&gt;&lt;circle cx=&quot;40&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;82&quot; cy=&quot;32&quot; r=&quot;16&quot;/&gt;&lt;circle cx=&quot;130&quot; cy=&quot;28&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;172&quot; cy=&quot;48&quot; r=&quot;17&quot;/&gt;&lt;circle cx=&quot;205&quot; cy=&quot;90&quot; r=&quot;10&quot;/&gt;&lt;circle cx=&quot;182&quot; cy=&quot;134&quot; r=&quot;15&quot;/&gt;&lt;circle cx=&quot;128&quot; cy=&quot;152&quot; r=&quot;18&quot;/&gt;&lt;circle cx=&quot;74&quot; cy=&quot;142&quot; r=&quot;11&quot;/&gt;&lt;circle cx=&quot;32&quot; cy=&quot;110&quot; r=&quot;15&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;118&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;Molte definizioni&lt;/text&gt;&lt;text x=&quot;118&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;di &lt;tspan font-style=&quot;italic&quot;&gt;fair value&lt;/tspan&gt;&lt;/text&gt;
&lt;text x=&quot;118&quot; y=&quot;184&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;prima di IFRS 13&lt;/text&gt;
&lt;path class=&quot;ff&quot; d=&quot;M250 50L290 92L250 134L270 134L310 92L270 50z&quot; opacity=&quot;.75&quot;/&gt;&lt;path class=&quot;ff&quot; d=&quot;M300 50L340 92L300 134L320 134L360 92L320 50z&quot; opacity=&quot;.35&quot;/&gt;
&lt;circle class=&quot;fb&quot; cx=&quot;455&quot; cy=&quot;88&quot; r=&quot;74&quot;/&gt;&lt;text x=&quot;455&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;Definizione&lt;/text&gt;&lt;text x=&quot;455&quot; y=&quot;94&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;«generale»&lt;/text&gt;&lt;text x=&quot;455&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;IFRS 13.9&lt;/text&gt;
&lt;text x=&quot;455&quot; y=&quot;184&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;dopo IFRS 13&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Convergenza con gli US GAAP&lt;/h4&gt;&lt;p&gt;IFRS 13 nasce dal processo di convergenza con gli &lt;i&gt;US GAAP&lt;/i&gt; (i principi contabili americani), in particolare con SFAS 157, oggi ASC 820 nella &lt;i&gt;FASB Codification&lt;/i&gt;, a cui corrisponde nella sostanza. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Un criterio pervasivo&lt;/h4&gt;&lt;p&gt;Coordina in un solo standard un criterio che si è diffuso in molti IAS/IFRS già emessi. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Una gerarchia di metodi&lt;/h4&gt;&lt;p&gt;Definisce anche una &lt;i&gt;hierarchy&lt;/i&gt;, una graduatoria dei metodi per determinare il fair value (sezione 9). &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Perché il fair value si è diffuso così tanto&lt;/h3&gt;
&lt;p&gt;La slide 3 ne cerca l&#x27;origine nell&#x27;evoluzione delle finalità informative del bilancio, in particolare nel passaggio dal &lt;i&gt;distributable income&lt;/i&gt; all&#x27;&lt;i&gt;income produced&lt;/i&gt;.&lt;/p&gt;
&lt;div class=&quot;plus&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Da sapere&lt;/span&gt;
&lt;p&gt;&lt;b&gt;&lt;i&gt;Distributable income&lt;/i&gt;&lt;/b&gt; (reddito distribuibile): il bilancio serve soprattutto a stabilire quanto si può distribuire senza intaccare il capitale. Conta quindi ciò che è realizzato, in un&#x27;ottica prudenziale vicina al costo storico, a tutela dei creditori.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;&lt;i&gt;Income produced&lt;/i&gt;&lt;/b&gt; (reddito prodotto): il bilancio serve a mostrare la performance a chi investe. Contano anche le variazioni di valore non ancora realizzate, ed è qui che una misura aggiornata al mercato come il fair value diventa utile.&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Objective: tre cose che fa lo standard&lt;/h3&gt;
&lt;figure class=&quot;sv-md&quot;&gt;
&lt;svg viewBox=&quot;0 0 520 210&quot; role=&quot;img&quot; aria-label=&quot;IFRS 13 definisce il fair value, fissa un framework di misurazione e richiede disclosure&quot;&gt;
&lt;rect class=&quot;fb&quot; x=&quot;6&quot; y=&quot;72&quot; width=&quot;130&quot; height=&quot;66&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;71&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;IFRS 13&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;71&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;par. 1&lt;/text&gt;
&lt;path class=&quot;ln&quot; marker-end=&quot;url(#a)&quot; d=&quot;M136 92L190 38&quot;/&gt;&lt;path class=&quot;ln&quot; marker-end=&quot;url(#a)&quot; d=&quot;M136 105H190&quot;/&gt;&lt;path class=&quot;ln&quot; marker-end=&quot;url(#a)&quot; d=&quot;M136 118L190 172&quot;/&gt;
&lt;rect class=&quot;bx&quot; x=&quot;194&quot; y=&quot;10&quot; width=&quot;318&quot; height=&quot;52&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;353&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;15.5&quot;&gt;Definisce il fair value&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;194&quot; y=&quot;79&quot; width=&quot;318&quot; height=&quot;52&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;353&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;15.5&quot;&gt;Fissa un unico framework&lt;/text&gt;&lt;text x=&quot;353&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-size=&quot;15.5&quot;&gt;per misurarlo&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;194&quot; y=&quot;148&quot; width=&quot;318&quot; height=&quot;52&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;353&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;15.5&quot;&gt;Richiede disclosure sulle misurazioni&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Slide 4. &lt;i&gt;Framework&lt;/i&gt;: l&#x27;impianto di regole; &lt;i&gt;disclosure&lt;/i&gt;: informativa nelle note.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Fonte esterna&lt;/span&gt; SFAS 157 fu emesso dal FASB (l&#x27;omologo americano dello IASB) nel settembre 2006, e IFRS 13 dallo IASB nel maggio 2011. &lt;a href=&quot;https://dart.deloitte.com/USDART/home/codification/broad-transactions/asc820-10/roadmap-fair-value-measurements-disclosures/chapter-1-background/1-3-history-fair-value-requirements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Deloitte, Roadmap, §1.3&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-13-fair-value-measurement.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, IFRS 13&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;IFRS 13 stabilisce quali voci vanno valutate a fair value?&lt;/summary&gt;&lt;div&gt;No. Lo decidono gli altri IFRS, che lo richiedono o lo permettono. IFRS 13 dice come misurarlo e quale disclosure fornire (slide 4-5).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quale problema risolve, e con quale data di entrata in vigore?&lt;/summary&gt;&lt;div&gt;La presenza di definizioni diverse in standard diversi. Introduce una definizione generale, in vigore dal 1° gennaio 2013 (slide 2).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;A quale standard americano corrisponde nella sostanza?&lt;/summary&gt;&lt;div&gt;SFAS 157, oggi ASC 820 nella FASB Codification (slide 3).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part fam-sal&quot; id=&quot;s2&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Cornice&lt;/span&gt;&lt;h2&gt;Scope: dove si applica e dove no&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Lo &lt;i class=&quot;t&quot;&gt;scope&lt;/i&gt; (ambito di applicazione) è ampio: IFRS 13 si applica quando un altro IFRS &lt;b&gt;richiede o permette&lt;/b&gt; misurazioni a fair value, o disclosure su di esse, comprese le misure basate sul fair value come il &lt;i&gt;fair value less costs to sell&lt;/i&gt; (fair value meno i costi di vendita). &lt;span class=&quot;src&quot;&gt;slide 5 · IFRS 13.5&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Le eccezioni sono di due tipi, e vanno tenute distinte: alcune voci escono del tutto, sia dal &lt;i&gt;measurement&lt;/i&gt; (le regole di misurazione) sia dalla disclosure, altre escono solo dalla disclosure.&lt;/p&gt;
&lt;figure class=&quot;sv-lg&quot;&gt;
&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;Tre zone: esclusione totale, esclusione dalla sola disclosure, applicazione piena&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;4&quot; y=&quot;4&quot; width=&quot;552&quot; height=&quot;292&quot; rx=&quot;16&quot;/&gt;
&lt;text x=&quot;20&quot; y=&quot;30&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Applicazione piena: measurement + disclosure&lt;/text&gt;
&lt;text class=&quot;m&quot; x=&quot;20&quot; y=&quot;50&quot; font-size=&quot;13&quot;&gt;ogni altro caso in cui un IFRS richiede o permette il fair value&lt;/text&gt;
&lt;rect x=&quot;20&quot; y=&quot;64&quot; width=&quot;520&quot; height=&quot;104&quot; rx=&quot;12&quot; fill=&quot;var(--och-bg)&quot; stroke=&quot;var(--och)&quot;/&gt;
&lt;text x=&quot;34&quot; y=&quot;88&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;Sì measurement, no disclosure · IFRS 13.7&lt;/text&gt;
&lt;text x=&quot;34&quot; y=&quot;110&quot; font-size=&quot;13.5&quot;&gt;Plan assets a fair value (IAS 19)&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;130&quot; font-size=&quot;13.5&quot;&gt;Investimenti dei retirement benefit plan (IAS 26)&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;150&quot; font-size=&quot;13.5&quot;&gt;Recoverable amount = fair value less costs of disposal (IAS 36)&lt;/text&gt;
&lt;rect x=&quot;20&quot; y=&quot;178&quot; width=&quot;520&quot; height=&quot;106&quot; rx=&quot;12&quot; fill=&quot;var(--bri-bg)&quot; stroke=&quot;var(--bri)&quot;/&gt;
&lt;text x=&quot;34&quot; y=&quot;202&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;Né measurement né disclosure · IFRS 13.6&lt;/text&gt;
&lt;text x=&quot;34&quot; y=&quot;224&quot; font-size=&quot;13.5&quot;&gt;Share-based payment (IFRS 2) · Leasing (IFRS 16)&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;244&quot; font-size=&quot;13.5&quot;&gt;Misure simili ma che non sono fair value:&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;264&quot; font-size=&quot;13.5&quot;&gt;net realisable value (IAS 2), value in use (IAS 36)&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Slide 5-6. Il framework vale sia per l&#x27;&lt;i&gt;initial&lt;/i&gt; sia per il &lt;i&gt;subsequent measurement&lt;/i&gt; (prima iscrizione e valutazioni successive), IFRS 13.8.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;h3&gt;Le voci in chiaro&lt;/h3&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Share-based payment · IFRS 2&lt;/summary&gt;&lt;div&gt;Pagamenti basati su azioni, ad esempio stock option ai dipendenti. Escluse da measurement e disclosure di IFRS 13. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Leasing transactions · IFRS 16&lt;/summary&gt;&lt;div&gt;Operazioni di leasing contabilizzate secondo IFRS 16. Escluse da entrambi. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Net realisable value e value in use: perché «simili ma non fair value»&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;i&gt;Net realisable value&lt;/i&gt; (valore netto di realizzo, IAS 2) e &lt;i&gt;value in use&lt;/i&gt; (valore d&#x27;uso, IAS 36) sono esclusi perché assomigliano al fair value senza esserlo. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;plus&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Da sapere&lt;/span&gt; La differenza sta nel punto di vista. Queste due misure riflettono i flussi attesi &lt;b&gt;da quella specifica impresa&lt;/b&gt;, quindi sono &lt;i&gt;entity-specific&lt;/i&gt;. Il fair value è invece &lt;i&gt;market-based&lt;/i&gt;. È lo stesso spartiacque della sezione 3.&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Plan assets, IAS 26, fair value less costs of disposal&lt;/summary&gt;&lt;div&gt;Si misurano a fair value seguendo IFRS 13, ma senza la sua disclosure: &lt;i&gt;plan assets&lt;/i&gt; (attività a servizio di un piano per dipendenti) secondo IAS 19, investimenti dei fondi pensione secondo IAS 26 e attività con &lt;i&gt;recoverable amount&lt;/i&gt; (valore recuperabile) pari a &lt;i&gt;fair value less costs of disposal&lt;/i&gt; (fair value meno i costi di dismissione) secondo IAS 36. &lt;span class=&quot;src&quot;&gt;slide 6 · IFRS 13.7&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;trap&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Trappola&lt;/span&gt; IAS 36 compare in entrambe le zone. Il &lt;i&gt;value in use&lt;/i&gt; è fuori del tutto, il &lt;i&gt;fair value less costs of disposal&lt;/i&gt; è fuori dalla sola disclosure.&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Un&#x27;impresa calcola il recoverable amount come fair value less costs of disposal. IFRS 13 si applica?&lt;/summary&gt;&lt;div&gt;Sì per il measurement, no per la disclosure di IFRS 13 (IFRS 13.7, slide 6).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Il net realisable value delle rimanenze rientra in IFRS 13?&lt;/summary&gt;&lt;div&gt;No: è una misura simile ma non è fair value, ed è esclusa sia dal measurement sia dalla disclosure (IFRS 13.6, slide 5).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Il framework vale solo per la prima iscrizione?&lt;/summary&gt;&lt;div&gt;No, vale per initial e subsequent measurement, se un altro IFRS richiede o permette il fair value (IFRS 13.8, slide 6).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part fam-och&quot; id=&quot;s3&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Definizione&lt;/span&gt;&lt;h2&gt;La definizione, parola per parola&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Le slide 7-11 smontano la definizione di IFRS 13.9 cerchiando una parola alla volta. Fai lo stesso: clicca i termini sottolineati.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;p class=&quot;anat&quot; role=&quot;tablist&quot; aria-label=&quot;Termini della definizione di fair value&quot;&gt;«The &lt;button role=&quot;tab&quot; data-t=&quot;price&quot;&gt;price&lt;/button&gt; that would be received to sell an &lt;button role=&quot;tab&quot; data-t=&quot;al&quot;&gt;asset&lt;/button&gt; or paid to transfer a &lt;button role=&quot;tab&quot; data-t=&quot;al&quot;&gt;liability&lt;/button&gt; in an &lt;button role=&quot;tab&quot; data-t=&quot;tr&quot;&gt;orderly transaction&lt;/button&gt; between &lt;button role=&quot;tab&quot; data-t=&quot;mp&quot;&gt;market participants&lt;/button&gt; at the &lt;button role=&quot;tab&quot; data-t=&quot;md&quot;&gt;measurement date&lt;/button&gt;». &lt;span class=&quot;src&quot;&gt;IFRS 13.9&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;panebox&quot;&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;price&quot;&gt;
&lt;h4&gt;Price: il prezzo non si rettifica per i transaction costs&lt;/h4&gt;
&lt;p&gt;Il prezzo del mercato di riferimento &lt;b&gt;non va rettificato per i &lt;i&gt;transaction costs&lt;/i&gt;&lt;/b&gt; (costi di transazione), che non sono una caratteristica dell&#x27;asset o della liability ma dipendono dal modo in cui si entra nell&#x27;operazione. Si contabilizzano secondo gli altri IFRS. &lt;span class=&quot;src&quot;&gt;slide 8 · IFRS 13.25&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;I &lt;i&gt;transport costs&lt;/i&gt; (costi di trasporto) sono diversi: non fanno parte dei transaction costs. &lt;b&gt;Se la location è una caratteristica dell&#x27;asset&lt;/b&gt;, come può accadere per una &lt;i&gt;commodity&lt;/i&gt; (materia prima), il prezzo si rettifica per i costi necessari a portarlo al mercato. &lt;span class=&quot;src&quot;&gt;slide 8 · IFRS 13.26&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;al&quot; hidden&gt;
&lt;h4&gt;Asset o liability: conta la cosa specifica&lt;/h4&gt;
&lt;p&gt;La misura riguarda un particolare &lt;i&gt;asset&lt;/i&gt; (attività) o &lt;i&gt;liability&lt;/i&gt; (passività). Si considerano le caratteristiche che i market participants valuterebbero: &lt;b&gt;condition and location&lt;/b&gt; (stato e collocazione) e &lt;b&gt;restrictions on the sale or use&lt;/b&gt; (vincoli a vendita o uso). &lt;span class=&quot;src&quot;&gt;slide 9 · IFRS 13.11&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;tr&quot; hidden&gt;
&lt;h4&gt;Transaction: dove avviene&lt;/h4&gt;
&lt;p&gt;Si assume che la vendita o il trasferimento avvenga nel &lt;i&gt;principal market&lt;/i&gt; oppure, se manca, nel &lt;i&gt;most advantageous market&lt;/i&gt;: lo vediamo nella sezione 4. &lt;span class=&quot;src&quot;&gt;slide 10 · IFRS 13.16&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;plus&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Da sapere&lt;/span&gt; &lt;i&gt;Orderly&lt;/i&gt; significa «ordinata»: un&#x27;operazione normale, con il tempo per trovare acquirenti, non una vendita forzata. Per questo la vendita &lt;i&gt;under duress&lt;/i&gt; della sezione 7 può non rappresentare il fair value.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;mp&quot; hidden&gt;
&lt;h4&gt;Market participants: le ipotesi sono le loro&lt;/h4&gt;
&lt;p&gt;Si usano le ipotesi che i &lt;i&gt;market participants&lt;/i&gt; (gli operatori del mercato) userebbero nel fissare il prezzo, assumendo che agiscano nel proprio &lt;i&gt;economic best interest&lt;/i&gt; (interesse economico). &lt;span class=&quot;src&quot;&gt;slide 11 · IFRS 13.22&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Non serve identificare soggetti specifici. Bisogna individuarne le caratteristiche generali, considerando l&#x27;asset o la liability, il mercato di riferimento e gli operatori con cui l&#x27;impresa concluderebbe l&#x27;operazione. &lt;span class=&quot;src&quot;&gt;slide 11 · IFRS 13.23&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;md&quot; hidden&gt;
&lt;h4&gt;Measurement date: una fotografia&lt;/h4&gt;
&lt;div class=&quot;plus&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Da sapere&lt;/span&gt; La slide non dedica una scheda a questo termine. La &lt;i&gt;measurement date&lt;/i&gt; è la data di valutazione: il prezzo riflette le condizioni di mercato di quel giorno, non una media o un&#x27;aspettativa di lungo periodo. L&#x27;obiettivo della valutazione, in IFRS 13.62, parla infatti di &lt;i&gt;current market conditions&lt;/i&gt; (slide 33).&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;i&gt;Exit price&lt;/i&gt; (prezzo di uscita): il prezzo che si riceverebbe per vendere un asset o si pagherebbe per trasferire una liability. &lt;span class=&quot;src&quot;&gt;slide 12 · Appendix A&lt;/span&gt;&lt;/div&gt;
&lt;h3&gt;Market-based, non entity-specific&lt;/h3&gt;
&lt;p&gt;Il fair value è una misura di mercato. Se il prezzo di un elemento identico non è osservabile, si usa un&#x27;altra &lt;i&gt;valuation technique&lt;/i&gt; (tecnica di valutazione) che massimizza gli input osservabili e minimizza quelli non osservabili. Di conseguenza, &lt;b&gt;l&#x27;intenzione dell&#x27;impresa di tenere l&#x27;asset o di estinguere la liability non è rilevante&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 7 · IFRS 13.2-3&lt;/span&gt;&lt;/p&gt;
&lt;figure class=&quot;sv-lg&quot;&gt;
&lt;svg viewBox=&quot;0 0 560 170&quot; role=&quot;img&quot; aria-label=&quot;Confronto tra visione entity-specific e market-based&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;4&quot; y=&quot;8&quot; width=&quot;262&quot; height=&quot;154&quot; rx=&quot;12&quot;/&gt;&lt;rect class=&quot;fb&quot; x=&quot;294&quot; y=&quot;8&quot; width=&quot;262&quot; height=&quot;154&quot; rx=&quot;12&quot;/&gt;
&lt;text x=&quot;135&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Entity-specific&lt;/text&gt;&lt;text x=&quot;425&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Market-based = fair value&lt;/text&gt;
&lt;text x=&quot;20&quot; y=&quot;62&quot; font-size=&quot;13.5&quot;&gt;«Cosa vale per noi?»&lt;/text&gt;&lt;text x=&quot;20&quot; y=&quot;86&quot; font-size=&quot;13.5&quot;&gt;le nostre intenzioni&lt;/text&gt;&lt;text x=&quot;20&quot; y=&quot;108&quot; font-size=&quot;13.5&quot;&gt;le nostre sinergie&lt;/text&gt;&lt;text x=&quot;20&quot; y=&quot;130&quot; font-size=&quot;13.5&quot;&gt;es. value in use&lt;/text&gt;
&lt;text x=&quot;310&quot; y=&quot;62&quot; font-size=&quot;13.5&quot;&gt;«Cosa pagherebbe il mercato?»&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;86&quot; font-size=&quot;13.5&quot;&gt;ipotesi degli operatori&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;108&quot; font-size=&quot;13.5&quot;&gt;rischio incluso nel prezzo&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;130&quot; font-size=&quot;13.5&quot;&gt;exit price alla data&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Schema didattico costruito su slide 5, 7 e 49.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Un&#x27;impresa intende tenere un asset per dieci anni: conta nella misura del fair value?&lt;/summary&gt;&lt;div&gt;No. L&#x27;intenzione di tenerlo non è rilevante, perché la misura è market-based (IFRS 13.3, slide 7).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;I transaction costs rettificano il prezzo? E i transport costs?&lt;/summary&gt;&lt;div&gt;I transaction costs no. I transport costs sì, se la location è una caratteristica dell&#x27;asset (IFRS 13.25-26, slide 8).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Devo individuare per nome i market participants?&lt;/summary&gt;&lt;div&gt;No: bastano le caratteristiche che li distinguono in generale (IFRS 13.23, slide 11).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Un vincolo alla vendita dell&#x27;asset si considera?&lt;/summary&gt;&lt;div&gt;Sì, se i market participants ne terrebbero conto nel prezzo (IFRS 13.11, slide 9).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part fam-och&quot; id=&quot;s4&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Definizione&lt;/span&gt;&lt;h2&gt;Principal o most advantageous market&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Active market&lt;/h4&gt;&lt;p&gt;Mercato attivo: scambi con &lt;b&gt;frequenza e volume sufficienti&lt;/b&gt; a fornire prezzi con continuità. &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Principal market&lt;/h4&gt;&lt;p&gt;Mercato principale: quello con il &lt;b&gt;maggiore volume e livello di attività&lt;/b&gt; per l&#x27;elemento. &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Most advantageous market&lt;/h4&gt;&lt;p&gt;Mercato più vantaggioso: &lt;b&gt;massimizza l&#x27;incasso o minimizza l&#x27;esborso&lt;/b&gt;, dopo transaction e transport costs. &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot; data-steps aria-label=&quot;Procedura di scelta del mercato&quot;&gt;
&lt;div class=&quot;st&quot;&gt;&lt;h4&gt;Passo 1 · Non serve una ricerca esaustiva&lt;/h4&gt;&lt;p&gt;L&#x27;impresa non deve esaminare tutti i mercati possibili, ma considera tutte le informazioni &lt;i&gt;reasonably available&lt;/i&gt; (ragionevolmente disponibili). &lt;span class=&quot;src&quot;&gt;slide 10 · IFRS 13.17&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;st&quot; hidden&gt;&lt;h4&gt;Passo 2 · Parti dal mercato in cui operi di solito&lt;/h4&gt;&lt;p&gt;Salvo prova contraria, il mercato in cui l&#x27;impresa normalmente opererebbe si presume sia il principal market o, in sua assenza, il most advantageous. &lt;span class=&quot;src&quot;&gt;slide 10 · IFRS 13.17&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;st&quot; hidden&gt;&lt;h4&gt;Passo 3 · Se c&#x27;è un principal market, vince lui&lt;/h4&gt;&lt;p&gt;Il fair value è il prezzo in quel mercato, osservabile o stimato, &lt;b&gt;anche se un altro mercato è potenzialmente più vantaggioso&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 10 · IFRS 13.18&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;st&quot; hidden&gt;&lt;h4&gt;Passo 4 · Se manca, confronta i netti&lt;/h4&gt;&lt;p&gt;Si sceglie il mercato con il netto migliore dopo transport e transaction costs. Poi però il fair value si prende &lt;b&gt;prima&lt;/b&gt; dei transaction costs. &lt;span class=&quot;src&quot;&gt;slide 13-14 · IFRS 13.16, 25&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;span class=&quot;idx&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-prev&gt;Indietro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Avanti&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;widget&quot; id=&quot;mkt&quot;&gt;
&lt;h4&gt;Il caso della slide 14, con i cursori&lt;/h4&gt;
&lt;p class=&quot;note&quot;&gt;Valori di partenza: quelli della slide. Costi fissi: transport 5 e 6, transaction 2 e 3.&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;Price, Market 2 &lt;output id=&quot;o-p2&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;p2&quot; min=&quot;80&quot; max=&quot;120&quot; value=&quot;98&quot;&gt;&lt;/label&gt;
&lt;label&gt;Price, Market 3 &lt;output id=&quot;o-p3&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;p3&quot; min=&quot;80&quot; max=&quot;120&quot; value=&quot;105&quot;&gt;&lt;/label&gt;
&lt;label&gt;Volume, Market 2 &lt;output id=&quot;o-v2&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;v2&quot; min=&quot;2000&quot; max=&quot;20000&quot; step=&quot;1000&quot; value=&quot;12000&quot;&gt;&lt;/label&gt;
&lt;label&gt;Volume, Market 3 &lt;output id=&quot;o-v3&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;v3&quot; min=&quot;2000&quot; max=&quot;20000&quot; step=&quot;1000&quot; value=&quot;10000&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;noprinc&quot;&gt; Non esiste un principal market&lt;/label&gt;
&lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;noloc&quot;&gt; La location non è una caratteristica dell&#x27;asset (niente transport costs)&lt;/label&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;mkt-t&quot;&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;span class=&quot;big&quot; id=&quot;mkt-fv&quot;&gt;&lt;/span&gt;&lt;/p&gt;
&lt;p id=&quot;mkt-x&quot; style=&quot;font-size:.95rem&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;trap&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Trappola&lt;/span&gt; Nel caso della slide il fair value è &lt;b&gt;93&lt;/b&gt;. Non è 96, che è il netto del Market 3, e nemmeno 91, che sconta i transaction costs. Senza principal market sarebbe &lt;b&gt;99&lt;/b&gt;: il Market 3 si sceglie guardando il netto, ma il fair value resta prima dei transaction costs.&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché nell&#x27;esempio il Market 2 prevale su un Market 3 che offre un netto più alto?&lt;/summary&gt;&lt;div&gt;Ha il volume maggiore (12.000 contro 10.000), quindi è il principal market, e in presenza di un principal market il prezzo è il suo (IFRS 13.18).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;A cosa servono i transaction costs, se non entrano nel fair value?&lt;/summary&gt;&lt;div&gt;Servono a individuare il most advantageous market, la cui definizione li considera. Una volta scelto il mercato non rettificano il prezzo (slide 13-14, IFRS 13.25).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Se non ho prove contrarie, quale mercato uso?&lt;/summary&gt;&lt;div&gt;Quello in cui opero normalmente: si presume sia il principal o il most advantageous (IFRS 13.17, slide 10).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part fam-sla&quot; id=&quot;s5&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Applicazioni&lt;/span&gt;&lt;h2&gt;Non-financial assets e highest and best use&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;i&gt;Highest and best use&lt;/i&gt; (uso migliore e più redditizio): l&#x27;uso di un &lt;i&gt;non-financial asset&lt;/i&gt; (attività non finanziaria) da parte dei market participants che massimizzerebbe il valore dell&#x27;asset o del gruppo in cui verrebbe usato. &lt;span class=&quot;src&quot;&gt;slide 12 · Appendix A&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;La misura considera la capacità di un operatore di generare benefici usando l&#x27;asset nel suo highest and best use, o vendendolo a chi lo userebbe così. &lt;span class=&quot;src&quot;&gt;slide 15 · IFRS 13.27&lt;/span&gt;&lt;/p&gt;
&lt;figure class=&quot;sv-lg&quot;&gt;
&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;Tre filtri dell&#x27;highest and best use: physically possible, legally permissible, financially feasible&quot;&gt;
&lt;g&gt;&lt;polygon class=&quot;fb&quot; points=&quot;6,20 170,20 150,130 26,130&quot;/&gt;&lt;text x=&quot;88&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;Physically&lt;/text&gt;&lt;text x=&quot;88&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;possible&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;polygon class=&quot;fb&quot; points=&quot;190,20 354,20 334,130 210,130&quot;/&gt;&lt;text x=&quot;272&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;Legally&lt;/text&gt;&lt;text x=&quot;272&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;permissible&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;polygon class=&quot;fb&quot; points=&quot;374,20 554,20 534,130 394,130&quot;/&gt;&lt;text x=&quot;464&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;Financially&lt;/text&gt;&lt;text x=&quot;464&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;feasible&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Slide 15, IFRS 13.28: l&#x27;uso deve essere fisicamente possibile, legalmente ammesso e finanziariamente sostenibile.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Prospettiva del mercato&lt;/h4&gt;&lt;p&gt;Conta il punto di vista degli operatori, anche se l&#x27;impresa intende un uso diverso. L&#x27;uso attuale &lt;b&gt;si presume&lt;/b&gt; highest and best, salvo indicazioni contrarie. &lt;span class=&quot;src&quot;&gt;slide 15 · IFRS 13.29&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Uso difensivo&lt;/h4&gt;&lt;p&gt;Un&#x27;impresa può acquisire un &lt;i&gt;intangible&lt;/i&gt; (attività immateriale) e non usarlo, per impedire che lo usino altri. Lo misura comunque ipotizzando l&#x27;highest and best use degli operatori. &lt;span class=&quot;src&quot;&gt;slide 15 · IFRS 13.30&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Valuation premise: in gruppo o da solo&lt;/h3&gt;
&lt;p&gt;L&#x27;highest and best use stabilisce la &lt;i class=&quot;t&quot;&gt;valuation premise&lt;/i&gt; (l&#x27;ipotesi di base della valutazione). &lt;span class=&quot;src&quot;&gt;slide 16 · IFRS 13.31&lt;/span&gt;&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Valuation premise&quot;&gt;&lt;button role=&quot;tab&quot; data-t=&quot;grp&quot;&gt;In combination&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;alone&quot;&gt;Stand-alone&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;uoa&quot;&gt;Unit of account&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;grp&quot;&gt;
&lt;p&gt;L&#x27;asset dà il massimo valore &lt;b&gt;insieme ad altri asset&lt;/b&gt;, come installati o configurati, o &lt;b&gt;ad altri asset e liabilities&lt;/b&gt;, ad esempio un &lt;i&gt;business&lt;/i&gt; (un&#x27;attività d&#x27;impresa organizzata). Il fair value è il prezzo di vendita ipotizzando che gli elementi complementari siano disponibili agli operatori. &lt;span class=&quot;src&quot;&gt;slide 16&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Le liabilities associate includono quelle che finanziano il &lt;i&gt;working capital&lt;/i&gt; (capitale circolante), non quelle che finanziano asset esterni al gruppo.&lt;/li&gt;&lt;li&gt;Le ipotesi sull&#x27;highest and best use devono essere &lt;b&gt;coerenti per tutti gli asset&lt;/b&gt; del gruppo per cui l&#x27;uso è rilevante.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;alone&quot; hidden&gt;&lt;p&gt;L&#x27;asset dà il massimo valore &lt;b&gt;&lt;i&gt;stand-alone&lt;/i&gt;&lt;/b&gt;, cioè da solo. Il fair value è il prezzo di vendita a operatori che lo userebbero da solo. &lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;uoa&quot; hidden&gt;&lt;p&gt;Si assume che l&#x27;asset sia venduto coerentemente con la &lt;i&gt;unit of account&lt;/i&gt; (l&#x27;unità di riferimento contabile fissata dagli altri IFRS, che può essere il singolo asset), anche se l&#x27;uso migliore è in combinazione: si assume che l&#x27;operatore &lt;b&gt;possieda già&lt;/b&gt; gli asset complementari e le liabilities associate. &lt;span class=&quot;src&quot;&gt;slide 17 · IFRS 13.32&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Il terreno con la fabbrica&lt;/h3&gt;
&lt;p&gt;Un&#x27;impresa può gestire un impianto su un terreno anche se l&#x27;uso migliore sarebbe demolire e costruire residenziale. Le slide scompongono il fair value del gruppo in: (a) &lt;b&gt;valore in current use&lt;/b&gt; (uso attuale) e (b) &lt;b&gt;incremental value&lt;/b&gt; (la differenza fino al fair value). &lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt; Il valore incrementale va al &lt;b&gt;terreno&lt;/b&gt;, cui si riferisce la conversione; all&#x27;impianto resta il valore in current use. &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;land&quot;&gt;
&lt;h4&gt;Prova la scomposizione&lt;/h4&gt;
&lt;p class=&quot;note&quot;&gt;Importi didattici, non dalle slide.&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;Terreno in current use &lt;output id=&quot;o-l&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;l&quot; min=&quot;0&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;&lt;/label&gt;
&lt;label&gt;Impianto in current use &lt;output id=&quot;o-pl&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;pl&quot; min=&quot;0&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;40&quot;&gt;&lt;/label&gt;
&lt;label&gt;Terreno residenziale, netto demolizione &lt;output id=&quot;o-r&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;r&quot; min=&quot;0&quot; max=&quot;500&quot; step=&quot;5&quot; value=&quot;240&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 500 70&quot; role=&quot;img&quot; aria-label=&quot;Barra di composizione del fair value del gruppo&quot;&gt;&lt;rect id=&quot;b1&quot; y=&quot;10&quot; height=&quot;34&quot; fill=&quot;var(--sla)&quot;/&gt;&lt;rect id=&quot;b2&quot; y=&quot;10&quot; height=&quot;34&quot; fill=&quot;var(--sal)&quot;/&gt;&lt;rect id=&quot;b3&quot; y=&quot;10&quot; height=&quot;34&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text id=&quot;t-b&quot; x=&quot;0&quot; y=&quot;64&quot; font-size=&quot;13&quot;&gt;&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;keyl&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--sla)&quot;&gt;&lt;/i&gt;terreno, current use&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--sal)&quot;&gt;&lt;/i&gt;impianto, current use&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;incremental value&lt;/span&gt;&lt;/div&gt;
&lt;p id=&quot;land-x&quot; style=&quot;font-size:.95rem&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Fonte esterna&lt;/span&gt; &lt;b&gt;Da controllare.&lt;/b&gt; La slide 18-19 non indica un paragrafo. Un esempio con questa scomposizione in due componenti compare nell&#x27;&lt;a href=&quot;https://www.drsc.de/app/uploads/2017/03/132_05d_ED_2009_05_FVM_IE.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Exposure Draft del 2009&lt;/a&gt; (la bozza di standard messa in consultazione), e un &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/meetings/2010/february/iasb/fvm-0210b02bobs.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;paper IASB del 2010&lt;/a&gt; chiedeva se rinunciare a richiederla a favore di una disclosure. Gli &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs13-ie.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;esempi illustrativi attuali&lt;/a&gt; mostrano il confronto tra uso industriale e residenziale. La ricerca non ha chiarito come il testo finale risolva il punto: per l&#x27;esame segui la slide, e chiedi al docente se ti serve il riferimento esatto.&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Quali tre condizioni deve rispettare l&#x27;highest and best use?&lt;/summary&gt;&lt;div&gt;Physically possible, legally permissible, financially feasible (IFRS 13.28, slide 15).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Compro un marchio concorrente per non farlo usare. Come lo misuro?&lt;/summary&gt;&lt;div&gt;Ipotizzando l&#x27;highest and best use dei market participants, non il mio uso difensivo (IFRS 13.30, slide 15).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Se l&#x27;uso migliore è in combinazione, devo ipotizzare di vendere tutto il gruppo?&lt;/summary&gt;&lt;div&gt;No: si vende secondo la unit of account, assumendo che l&#x27;operatore abbia già gli asset complementari e le liabilities associate (IFRS 13.32, slide 17).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Nel caso terreno-impianto, a chi va il valore incrementale?&lt;/summary&gt;&lt;div&gt;Al terreno, che è l&#x27;asset a cui si riferisce: il suo fair value è current use più incrementale. L&#x27;impianto riflette il current use (slide 19).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part fam-sla&quot; id=&quot;s6&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Applicazioni&lt;/span&gt;&lt;h2&gt;Liabilities e own equity instruments&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;La misura assume che una liability o un &lt;i class=&quot;t&quot;&gt;own equity instrument&lt;/i&gt; (strumento di capitale emesso dall&#x27;impresa, ad esempio azioni date come corrispettivo in una &lt;i&gt;business combination&lt;/i&gt;, cioè un&#x27;aggregazione aziendale) sia &lt;b&gt;trasferito&lt;/b&gt; a un operatore alla measurement date, non estinto. &lt;span class=&quot;src&quot;&gt;slide 20 · IFRS 13.34&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Liability&lt;/h4&gt;&lt;p&gt;Resta &lt;i&gt;outstanding&lt;/i&gt; (in essere): chi la riceve deve adempiere. Non è regolata con la controparte né estinta alla data.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Own equity instrument&lt;/h4&gt;&lt;p&gt;Resta &lt;i&gt;outstanding&lt;/i&gt;: chi lo riceve assume diritti e responsabilità. Non è cancellato né estinto alla data.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Spesso manca un mercato del trasferimento, per esempio per vincoli contrattuali. Ma può esistere un mercato per gli stessi elementi &lt;b&gt;detenuti da altri come asset&lt;/b&gt;: un &lt;i&gt;corporate bond&lt;/i&gt; (obbligazione societaria) o una &lt;i&gt;call option&lt;/i&gt; sulle azioni dell&#x27;impresa. In ogni caso si massimizzano gli input osservabili. &lt;span class=&quot;src&quot;&gt;slide 21 · IFRS 13.35-36&lt;/span&gt;&lt;/p&gt;
&lt;h3&gt;Quale strada seguire&lt;/h3&gt;
&lt;div class=&quot;walker&quot; id=&quot;walk&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Quando si rettifica il prezzo dell&#x27;asset corrispondente&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;Solo per fattori specifici dell&#x27;asset non applicabili alla liability o all&#x27;equity instrument. Il prezzo dell&#x27;asset non deve riflettere l&#x27;effetto di un vincolo che ne impedisce la vendita. &lt;span class=&quot;src&quot;&gt;slide 24&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;b&gt;Elemento simile ma non identico&lt;/b&gt;: ad esempio diversa &lt;i&gt;credit quality&lt;/i&gt; dell&#x27;emittente. &lt;span class=&quot;src&quot;&gt;slide 24 · IFRS 13.39&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Unit of account diversa&lt;/b&gt;: il prezzo riflette un pacchetto con un &lt;i&gt;credit enhancement&lt;/i&gt; di terzi (una garanzia che migliora il merito di credito). Se la liability non è il pacchetto, si esclude l&#x27;effetto della garanzia. &lt;span class=&quot;src&quot;&gt;slide 25&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
&lt;h3&gt;Non-performance risk&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;i&gt;Non-performance risk&lt;/i&gt; (rischio di inadempimento): il fair value di una liability ne riflette l&#x27;effetto. Include, ma senza limitarsi, l&#x27;&lt;i&gt;own credit risk&lt;/i&gt; (il rischio di credito dell&#x27;impresa stessa), e si assume uguale prima e dopo il trasferimento. &lt;span class=&quot;src&quot;&gt;slide 27 · IFRS 13.42&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;L&#x27;impresa considera il proprio &lt;i&gt;credit standing&lt;/i&gt; (merito di credito) e ogni altro fattore sulla probabilità di adempiere. L&#x27;effetto può variare in base al tipo di obbligo, in denaro o in beni e servizi, e ai credit enhancement. &lt;span class=&quot;src&quot;&gt;slide 27 · IFRS 13.43&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;bond&quot;&gt;
&lt;h4&gt;Il paradosso dell&#x27;own credit&lt;/h4&gt;
&lt;p class=&quot;note&quot;&gt;Esempio didattico, non dalle slide: obbligazione emessa dall&#x27;impresa, nominale 100, cedola 4%, 5 anni.&lt;/p&gt;
&lt;p style=&quot;font-family:var(--serif);font-size:1.08rem&quot;&gt;FV = Σ&lt;sub&gt;t=1..5&lt;/sub&gt; 4 / (1 + r + s)&lt;sup&gt;t&lt;/sup&gt; + 100 / (1 + r + s)&lt;sup&gt;5&lt;/sup&gt;&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;&lt;i&gt;Credit spread&lt;/i&gt; s, premio per il rischio dell&#x27;impresa &lt;output id=&quot;o-s&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;s&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;.25&quot; value=&quot;1&quot;&gt;&lt;/label&gt;
&lt;label&gt;Tasso &lt;i&gt;risk-free&lt;/i&gt; (privo di rischio) r &lt;output id=&quot;o-rf&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;rf&quot; min=&quot;0&quot; max=&quot;6&quot; step=&quot;.25&quot; value=&quot;3&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 500 215&quot; role=&quot;img&quot; aria-label=&quot;Curva del fair value della liability al crescere del credit spread&quot;&gt;
&lt;path class=&quot;ln&quot; d=&quot;M50 12V180H490&quot;/&gt;&lt;path id=&quot;bcurve&quot; fill=&quot;none&quot; stroke=&quot;var(--f)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle id=&quot;bdot&quot; r=&quot;6&quot; fill=&quot;var(--accent)&quot;/&gt;
&lt;text class=&quot;m&quot; x=&quot;490&quot; y=&quot;207&quot; text-anchor=&quot;end&quot; font-size=&quot;13&quot;&gt;credit spread s (0–8%)&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;4&quot; y=&quot;22&quot; font-size=&quot;13&quot;&gt;140&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;4&quot; y=&quot;184&quot; font-size=&quot;13&quot;&gt;60&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;4&quot; y=&quot;100&quot; font-size=&quot;13&quot;&gt;100&lt;/text&gt;&lt;path class=&quot;ln&quot; stroke-dasharray=&quot;3 4&quot; d=&quot;M50 96H490&quot;/&gt;
&lt;/svg&gt;
&lt;p&gt;&lt;span class=&quot;big&quot; id=&quot;b-fv&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p id=&quot;b-x&quot; style=&quot;font-size:.95rem&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Fonte esterna&lt;/span&gt; Senza correttivi, un&#x27;impresa che peggiora registrerebbe un utile sul proprio debito. IFRS 9 evita questo effetto per le liabilities designate a fair value, mandando in &lt;i&gt;OCI&lt;/i&gt; (&lt;i&gt;other comprehensive income&lt;/i&gt;, le altre componenti del conto economico complessivo) la parte dovuta all&#x27;own credit: &lt;a href=&quot;https://www.bdo.nz/en-nz/blogs/financial-reporting-insights/accounting-for-financial-liabilities-under-ifrs-9&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BDO&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/meetings/2022/november/iasb/ap3a-financial-liabilities-and-own-credit.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;staff paper IASB, 2022&lt;/a&gt;.&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Garanzia di terzi inseparabile&lt;/h4&gt;&lt;p&gt;Se è contabilizzata separatamente, l&#x27;emittente &lt;b&gt;non&lt;/b&gt; include il credit enhancement nel fair value e guarda al &lt;b&gt;proprio&lt;/b&gt; credit standing, non a quello del garante. &lt;span class=&quot;src&quot;&gt;slide 28 · IFRS 13.44&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Vincolo al trasferimento&lt;/h4&gt;&lt;p&gt;&lt;b&gt;Nessun input separato né rettifica&lt;/b&gt;: l&#x27;effetto è già nel prezzo, perché creditore e debitore hanno accettato la transaction price conoscendo il vincolo. Vale anche alle date successive. &lt;span class=&quot;src&quot;&gt;slide 29 · IFRS 13.45-46&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Il fair value di una liability ipotizza l&#x27;estinzione?&lt;/summary&gt;&lt;div&gt;No, ipotizza il trasferimento: la liability resta outstanding e chi la riceve deve adempiere (IFRS 13.34, slide 20).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Come cambia il non-performance risk dopo il trasferimento?&lt;/summary&gt;&lt;div&gt;Si assume che resti lo stesso (IFRS 13.42, slide 27).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Per un debito con garanzia di terzi contabilizzata separatamente, di chi è il merito di credito rilevante?&lt;/summary&gt;&lt;div&gt;Dell&#x27;emittente, non del garante (IFRS 13.44, slide 28).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Il mio debito non è trasferibile per contratto: aggiungo uno sconto?&lt;/summary&gt;&lt;div&gt;No, il vincolo è già incluso implicitamente o esplicitamente negli altri input (IFRS 13.45, slide 29).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part fam-sla&quot; id=&quot;s7&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Applicazioni&lt;/span&gt;&lt;h2&gt;Fair value at initial recognition&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Per stabilire se il fair value iniziale coincide con il &lt;i class=&quot;t&quot;&gt;transaction price&lt;/i&gt; (il prezzo della transazione), l&#x27;impresa guarda ai fattori specifici dell&#x27;operazione e dell&#x27;elemento. &lt;span class=&quot;src&quot;&gt;slide 30 · B4&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;plus&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Da sapere&lt;/span&gt; Il transaction price è il prezzo a cui si è entrati nell&#x27;operazione, il fair value è un prezzo di uscita. Spesso coincidono, ma concettualmente restano diversi.&lt;/div&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Casi in cui il transaction price può non essere fair value&quot;&gt;&lt;button role=&quot;tab&quot; data-t=&quot;a&quot;&gt;a. Related parties&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;b&quot;&gt;b. Under duress&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;c&quot;&gt;c. Unit of account&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;d&quot;&gt;d. Altro mercato&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;a&quot;&gt;&lt;p&gt;Operazione tra &lt;i&gt;related parties&lt;/i&gt; (parti correlate). Il prezzo può comunque essere un input se c&#x27;è evidenza che sia a condizioni di mercato. &lt;span class=&quot;src&quot;&gt;slide 30&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;b&quot; hidden&gt;&lt;p&gt;&lt;i&gt;Under duress&lt;/i&gt; (sotto costrizione): il venditore è forzato ad accettare il prezzo, ad esempio per difficoltà finanziarie. &lt;span class=&quot;src&quot;&gt;slide 30&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;c&quot; hidden&gt;&lt;p&gt;La unit of account del prezzo è diversa da quella misurata: l&#x27;elemento è solo una parte dell&#x27;operazione (business combination), ci sono diritti non espressi misurati separatamente, o il prezzo include i transaction costs. &lt;span class=&quot;src&quot;&gt;slide 31&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;d&quot; hidden&gt;&lt;p&gt;Il mercato è diverso dal principal o most advantageous. Un &lt;i&gt;dealer&lt;/i&gt; (intermediario) vende ai clienti nel &lt;i&gt;retail market&lt;/i&gt; (mercato al dettaglio), ma il suo mercato d&#x27;uscita è quello con gli altri dealer. &lt;span class=&quot;src&quot;&gt;slide 31&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;Se un altro IFRS richiede o permette il fair value iniziale e il transaction price ne differisce, il &lt;i&gt;gain&lt;/i&gt; o la &lt;i&gt;loss&lt;/i&gt; (utile o perdita) va a &lt;i&gt;profit or loss&lt;/i&gt; (conto economico), &lt;b&gt;salvo che quell&#x27;IFRS disponga diversamente&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 32 · IFRS 13.60&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;plus&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Da sapere&lt;/span&gt; Quel «salvo» si vede nel caso BNP Paribas (slide 53): per gli strumenti in Level 3, e marginalmente in Level 2, la differenza iniziale, detta &lt;i&gt;Day One Profit&lt;/i&gt;, viene differita e rilasciata in conto economico nel tempo. Nella &lt;a href=&quot;#s11&quot;&gt;sezione 11&lt;/a&gt; trovi il dettaglio.&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Elenca i quattro casi di B4.&lt;/summary&gt;&lt;div&gt;Related parties, under duress, unit of account diversa, mercato diverso dal principal o most advantageous (slide 30-31).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Un prezzo tra related parties è sempre inutilizzabile?&lt;/summary&gt;&lt;div&gt;No, può essere un input se c&#x27;è evidenza di condizioni di mercato (B4(a), slide 30).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Dove va la differenza tra prezzo e fair value iniziale?&lt;/summary&gt;&lt;div&gt;In profit or loss, salvo che l&#x27;IFRS applicabile disponga diversamente (IFRS 13.60, slide 32).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part fam-bri&quot; id=&quot;s8&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Misura&lt;/span&gt;&lt;h2&gt;Valuation techniques e inputs&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;L&#x27;impresa usa tecniche adatte alle circostanze e con dati sufficienti, &lt;b&gt;massimizzando gli input osservabili rilevanti e minimizzando quelli non osservabili&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 33 · IFRS 13.61&lt;/span&gt; L&#x27;obiettivo è stimare il prezzo di un&#x27;orderly transaction tra operatori alla data, in &lt;i&gt;current market conditions&lt;/i&gt; (le condizioni di mercato correnti). &lt;span class=&quot;src&quot;&gt;slide 33 · IFRS 13.62&lt;/span&gt;&lt;/p&gt;
&lt;h3&gt;Tre approcci&lt;/h3&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Approcci di valutazione&quot;&gt;&lt;button role=&quot;tab&quot; data-t=&quot;m&quot;&gt;Market approach&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;c&quot;&gt;Cost approach&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;i&quot;&gt;Income approach&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;m&quot;&gt;&lt;p&gt;&lt;b&gt;Approccio di mercato.&lt;/b&gt; Usa prezzi e altre informazioni di transazioni su elementi identici o comparabili, o su gruppi come un business. &lt;span class=&quot;src&quot;&gt;slide 34 · B5&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Domanda guida: quanto è stato pagato per qualcosa di uguale o simile?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;c&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Approccio del costo.&lt;/b&gt; Riflette l&#x27;importo richiesto oggi per sostituire la &lt;i&gt;service capacity&lt;/i&gt; (la capacità di servizio) di un asset: il &lt;i&gt;current replacement cost&lt;/i&gt;, costo corrente di sostituzione. &lt;span class=&quot;src&quot;&gt;slide 34 · B8&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Domanda guida: quanto costerebbe oggi rimpiazzarlo?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;i&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Approccio reddituale.&lt;/b&gt; Converte importi futuri, flussi o redditi e costi, in un unico importo corrente attualizzato, riflettendo le aspettative di mercato. &lt;span class=&quot;src&quot;&gt;slide 34 · B10&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Tecniche: &lt;i&gt;present value techniques&lt;/i&gt; (attualizzazione), &lt;i&gt;option pricing models&lt;/i&gt; (modelli per le opzioni) e &lt;i&gt;multi-period excess earnings method&lt;/i&gt;, usato per alcuni intangible. &lt;span class=&quot;src&quot;&gt;slide 34 · B11&lt;/span&gt;&lt;/p&gt;
&lt;p style=&quot;font-family:var(--serif);font-size:1.08rem&quot;&gt;PV = Σ&lt;sub&gt;t&lt;/sub&gt; CF&lt;sub&gt;t&lt;/sub&gt; / (1 + r)&lt;sup&gt;t&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;CF: flussi attesi dal mercato; r: tasso coerente con il rischio. Formula aggiunta per chiarezza: la slide non la riporta.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Si usano tecniche coerenti con &lt;b&gt;uno o più&lt;/b&gt; di questi approcci. &lt;span class=&quot;src&quot;&gt;slide 34 · IFRS 13.62&lt;/span&gt;&lt;/p&gt;
&lt;h3&gt;Inputs&lt;/h3&gt;
&lt;p&gt;Gli &lt;i class=&quot;t&quot;&gt;inputs&lt;/i&gt; sono le ipotesi che gli operatori userebbero per il prezzo, rischio compreso: il rischio insito nella tecnica, ad esempio un &lt;i&gt;pricing model&lt;/i&gt;, e quello insito negli input stessi. &lt;span class=&quot;src&quot;&gt;slide 35 · Appendix A&lt;/span&gt;&lt;/p&gt;
&lt;figure class=&quot;sv-lg&quot;&gt;
&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;Massimizzare gli input osservabili e minimizzare quelli non osservabili&quot;&gt;
&lt;rect class=&quot;fb&quot; x=&quot;4&quot; y=&quot;8&quot; width=&quot;264&quot; height=&quot;134&quot; rx=&quot;12&quot;/&gt;&lt;rect class=&quot;bx&quot; x=&quot;292&quot; y=&quot;8&quot; width=&quot;264&quot; height=&quot;134&quot; rx=&quot;12&quot;/&gt;
&lt;path class=&quot;ff&quot; d=&quot;M36 86L62 48L88 86H74V124H50V86z&quot;/&gt;&lt;path d=&quot;M324 72H338V34H362V72H376L350 112z&quot; fill=&quot;var(--soft)&quot;/&gt;
&lt;text x=&quot;104&quot; y=&quot;52&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Observable&lt;/text&gt;&lt;text x=&quot;104&quot; y=&quot;76&quot; font-size=&quot;13&quot;&gt;dati di mercato,&lt;/text&gt;&lt;text x=&quot;104&quot; y=&quot;94&quot; font-size=&quot;13&quot;&gt;eventi e scambi reali&lt;/text&gt;&lt;text x=&quot;104&quot; y=&quot;124&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;massimizza&lt;/text&gt;
&lt;text x=&quot;392&quot; y=&quot;52&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Unobservable&lt;/text&gt;&lt;text x=&quot;392&quot; y=&quot;76&quot; font-size=&quot;13&quot;&gt;migliori informazioni&lt;/text&gt;&lt;text x=&quot;392&quot; y=&quot;94&quot; font-size=&quot;13&quot;&gt;sulle ipotesi del mercato&lt;/text&gt;&lt;text x=&quot;392&quot; y=&quot;124&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;minimizza&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Slide 35-36, IFRS 13.67. Da qui deriva la fair value hierarchy.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Associa: prezzi di comparabili, costo di sostituzione, attualizzazione.&lt;/summary&gt;&lt;div&gt;Market approach, cost approach, income approach (slide 34).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Black-Scholes e multi-period excess earnings method a quale approccio appartengono?&lt;/summary&gt;&lt;div&gt;All&#x27;income approach: B11 cita gli option pricing models, tra cui rientra Black-Scholes, e il multi-period excess earnings method (slide 34).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Differenza tra input observable e unobservable?&lt;/summary&gt;&lt;div&gt;I primi usano dati di mercato pubblici su eventi o transazioni reali. I secondi non hanno dati di mercato e usano le migliori informazioni disponibili sulle ipotesi degli operatori (slide 35).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part fam-bri&quot; id=&quot;s9&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;9&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Misura&lt;/span&gt;&lt;h2&gt;La fair value hierarchy&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Per aumentare &lt;b&gt;consistency and comparability&lt;/b&gt; (coerenza e comparabilità), lo standard ordina in tre livelli gli input delle tecniche: massima priorità ai prezzi quotati non rettificati in active market, minima agli input non osservabili. &lt;span class=&quot;src&quot;&gt;slide 37 · IFRS 13.72&lt;/span&gt; Clicca i livelli.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;figure class=&quot;sv-md&quot; style=&quot;margin-bottom:.4rem&quot;&gt;
&lt;svg viewBox=&quot;0 0 520 260&quot; role=&quot;tablist&quot; aria-label=&quot;Livelli della fair value hierarchy&quot;&gt;
&lt;g class=&quot;pyr-b&quot; role=&quot;tab&quot; tabindex=&quot;0&quot; data-t=&quot;l1&quot;&gt;&lt;polygon class=&quot;fb&quot; points=&quot;170,10 230,10 280,80 120,80&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Level 1&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;pyr-b&quot; role=&quot;tab&quot; tabindex=&quot;0&quot; data-t=&quot;l2&quot;&gt;&lt;polygon class=&quot;fb&quot; points=&quot;114,88 286,88 336,160 64,160&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Level 2&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;pyr-b&quot; role=&quot;tab&quot; tabindex=&quot;0&quot; data-t=&quot;l3&quot;&gt;&lt;polygon class=&quot;fb&quot; points=&quot;58,168 342,168 394,244 6,244&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Level 3&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; marker-end=&quot;url(#a)&quot; d=&quot;M260 47H402&quot;/&gt;&lt;path class=&quot;ln&quot; marker-end=&quot;url(#a)&quot; d=&quot;M314 126H402&quot;/&gt;&lt;path class=&quot;ln&quot; marker-end=&quot;url(#a)&quot; d=&quot;M372 208H402&quot;/&gt;
&lt;text x=&quot;408&quot; y=&quot;42&quot; font-size=&quot;13&quot;&gt;Low&lt;/text&gt;&lt;text x=&quot;408&quot; y=&quot;58&quot; font-size=&quot;13&quot;&gt;disclosure&lt;/text&gt;&lt;text x=&quot;408&quot; y=&quot;121&quot; font-size=&quot;13&quot;&gt;Medium&lt;/text&gt;&lt;text x=&quot;408&quot; y=&quot;137&quot; font-size=&quot;13&quot;&gt;disclosure&lt;/text&gt;&lt;text x=&quot;408&quot; y=&quot;203&quot; font-size=&quot;13&quot;&gt;High&lt;/text&gt;&lt;text x=&quot;408&quot; y=&quot;219&quot; font-size=&quot;13&quot;&gt;disclosure&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Slide 38. Più gli input sono soggettivi, più informativa si richiede.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;panebox&quot;&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;l1&quot;&gt;
&lt;h4&gt;Level 1: prezzi quotati, identici, non rettificati&lt;/h4&gt;
&lt;p&gt;Prezzi quotati in active market per elementi &lt;b&gt;identici&lt;/b&gt;, a cui l&#x27;impresa ha accesso alla data. &lt;span class=&quot;src&quot;&gt;slide 39 · IFRS 13.76&lt;/span&gt; Sono &lt;b&gt;the most reliable evidence&lt;/b&gt; e si usano senza rettifica ogni volta che sono disponibili. &lt;span class=&quot;src&quot;&gt;IFRS 13.77&lt;/span&gt; Disponibili per molti strumenti finanziari, anche scambiati su più mercati. L&#x27;attenzione va su &lt;b&gt;quale&lt;/b&gt; sia il principal o most advantageous market e se l&#x27;impresa possa operarvi a quel prezzo. &lt;span class=&quot;src&quot;&gt;slide 39-40 · IFRS 13.78&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Le uniche rettifiche ammesse, tutte con discesa &lt;b&gt;sotto il Level 1&lt;/b&gt;: &lt;span class=&quot;src&quot;&gt;slide 41-43 · IFRS 13.79&lt;/span&gt;&lt;/p&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;1. Molti elementi simili, con prezzi poco accessibili singolarmente&lt;/summary&gt;&lt;div&gt;Per molti titoli simili ma non identici, ad esempio &lt;i&gt;debt securities&lt;/i&gt; (titoli di debito), si può usare come &lt;i&gt;practical expedient&lt;/i&gt; (semplificazione pratica) un metodo alternativo come il &lt;i&gt;matrix pricing&lt;/i&gt;, che stima il prezzo da titoli comparabili.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;2. Eventi significativi dopo la chiusura del mercato&lt;/summary&gt;&lt;div&gt;Il prezzo non rappresenta il fair value se, tra chiusura e measurement date, avvengono eventi come scambi in un &lt;i&gt;principal-to-principal market&lt;/i&gt; (trattative dirette tra le parti), in un &lt;i&gt;brokered market&lt;/i&gt; (tramite intermediario) o annunci. Serve una policy applicata con coerenza.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;3. Liability o equity quotata come asset, con fattori specifici&lt;/summary&gt;&lt;div&gt;Se il prezzo dell&#x27;elemento identico scambiato come asset va rettificato per fattori specifici (paragrafo 39) si scende di livello. Senza rettifica resta Level 1.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;l2&quot; hidden&gt;
&lt;h4&gt;Level 2: altri input osservabili&lt;/h4&gt;
&lt;p&gt;Input diversi dai prezzi di Level 1, osservabili direttamente o indirettamente. Con una durata contrattuale, devono essere osservabili per quasi tutta la durata. &lt;span class=&quot;src&quot;&gt;slide 45 · IFRS 13.81&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Prezzi quotati di elementi &lt;b&gt;simili&lt;/b&gt; in active market.&lt;/li&gt;&lt;li&gt;Prezzi di elementi &lt;b&gt;identici o simili&lt;/b&gt; in mercati &lt;b&gt;non attivi&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;Altri input osservabili: &lt;i&gt;interest rates&lt;/i&gt; e &lt;i&gt;yield curves&lt;/i&gt; (tassi e curve dei rendimenti) a intervalli quotati, &lt;i&gt;implied volatilities&lt;/i&gt; (volatilità implicite), &lt;i&gt;credit spreads&lt;/i&gt; (premi per il rischio di credito).&lt;/li&gt;&lt;li&gt;&lt;i&gt;Market-corroborated inputs&lt;/i&gt;: input confermati da dati di mercato.&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Le rettifiche dipendono da condizione o location, comparabilità e volume o attività del mercato. &lt;span class=&quot;src&quot;&gt;slide 46 · IFRS 13.83&lt;/span&gt; Una rettifica significativa basata su input non osservabili &lt;b&gt;può portare a Level 3&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;IFRS 13.84&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;l3&quot; hidden&gt;
&lt;h4&gt;Level 3: input non osservabili&lt;/h4&gt;
&lt;p&gt;Si usano nella misura in cui mancano input osservabili, ad esempio con poca attività di mercato. &lt;b&gt;L&#x27;obiettivo non cambia&lt;/b&gt;: exit price alla data, dal punto di vista di un operatore. &lt;span class=&quot;src&quot;&gt;slide 47 · IFRS 13.86-87&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;b&gt;Rischio&lt;/b&gt;: senza la rettifica per il rischio che gli operatori includerebbero, la misura non è fair value. &lt;span class=&quot;src&quot;&gt;slide 48 · IFRS 13.88&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Dati propri&lt;/b&gt;: si può partire dai dati dell&#x27;impresa, ma vanno corretti se gli altri userebbero dati diversi o se c&#x27;è qualcosa di non disponibile ad altri, come una &lt;i&gt;entity-specific synergy&lt;/i&gt; (sinergia propria). &lt;span class=&quot;src&quot;&gt;slide 49 · IFRS 13.89&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Sforzo&lt;/b&gt;: nessuna ricerca esaustiva, ma vanno considerate tutte le informazioni ragionevolmente disponibili. &lt;span class=&quot;src&quot;&gt;slide 49&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;widget&quot; id=&quot;pq&quot;&gt;
&lt;h4&gt;Grande posizione, stesso prezzo: P × Q&lt;/h4&gt;
&lt;p&gt;Per una posizione in un singolo elemento quotato, il Level 1 è &lt;b&gt;prezzo × quantità&lt;/b&gt;, anche se il volume giornaliero non assorbe la posizione e una vendita in blocco muoverebbe il prezzo. &lt;span class=&quot;src&quot;&gt;slide 44 · IFRS 13.80&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;Quantità detenuta &lt;output id=&quot;o-q&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;q&quot; min=&quot;100000&quot; max=&quot;5000000&quot; step=&quot;100000&quot; value=&quot;1000000&quot;&gt;&lt;/label&gt;
&lt;label&gt;Prezzo quotato (€) &lt;output id=&quot;o-pp&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;pp&quot; min=&quot;5&quot; max=&quot;50&quot; value=&quot;20&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;p&gt;&lt;span class=&quot;big&quot; id=&quot;pq-fv&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p id=&quot;pq-x&quot; style=&quot;font-size:.95rem&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;note&quot;&gt;Numeri didattici; volume giornaliero ipotizzato: 200.000 titoli.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;widget game&quot; id=&quot;game&quot;&gt;
&lt;h4&gt;In quale livello?&lt;/h4&gt;
&lt;p class=&quot;item&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;stepnav&quot; style=&quot;margin-top:0&quot;&gt;&lt;button class=&quot;btn&quot; data-l=&quot;1&quot;&gt;Level 1&lt;/button&gt;&lt;button class=&quot;btn&quot; data-l=&quot;2&quot;&gt;Level 2&lt;/button&gt;&lt;button class=&quot;btn&quot; data-l=&quot;3&quot;&gt;Level 3&lt;/button&gt;&lt;/div&gt;
&lt;p class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;span class=&quot;idx&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-n&gt;Prossimo caso&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;plus&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Da sapere&lt;/span&gt; Il livello si assegna all&#x27;intera misura in base all&#x27;input di livello più basso che sia significativo. La regola è nella policy BNP Paribas, slide 53, che la riporta come propria.&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Fonte esterna&lt;/span&gt; La stessa regola è al par. 73 di IFRS 13, e il par. 93 elenca la disclosure, più estesa per il Level 3 (riconciliazione, input quantitativi, sensibilità). Numeri di paragrafo da verificare sul &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs13.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo ufficiale di IFRS 13&lt;/a&gt;.&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Tre circostanze che ammettono una rettifica del Level 1, e la conseguenza.&lt;/summary&gt;&lt;div&gt;Molti elementi simili con matrix pricing, eventi dopo la chiusura, liability o equity con fattori specifici. In tutti i casi la misura scende sotto il Level 1 (IFRS 13.79, slide 41-43).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Posso applicare uno sconto a una partecipazione quotata molto grande?&lt;/summary&gt;&lt;div&gt;No: nel Level 1 resta prezzo × quantità, anche se il mercato non assorbirebbe il blocco (IFRS 13.80, slide 44).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Posso usare il mio business plan per un input Level 3?&lt;/summary&gt;&lt;div&gt;Sì come punto di partenza, ma va corretto se gli altri operatori userebbero dati diversi o se include sinergie proprie (IFRS 13.89, slide 49).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Il rischio si può ignorare nel Level 3 perché è difficile da stimare?&lt;/summary&gt;&lt;div&gt;No: la misura non sarebbe fair value se gli operatori includessero una rettifica (IFRS 13.88, slide 48).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part fam-acc&quot; id=&quot;s10&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;10&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Informativa&lt;/span&gt;&lt;h2&gt;Disclosure: la proposta di modifica che non è passata&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;La slide 50 riporta il &lt;i&gt;feedback summary&lt;/i&gt; (sintesi dei commenti) della &lt;i&gt;Disclosure Initiative – Targeted Standards-level Review of Disclosures&lt;/i&gt;, marzo 2023.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Il problema&lt;/h4&gt;&lt;p&gt;Gli utilizzatori trovano utile la disclosure, ma spesso troppo dettagliata su misure immateriali e scarsa su quelle materiali: molto dettaglio sul Level 3, poco su Level 2 materiali, vicini al Level 3 per incertezza. Ed è costosa. &lt;span class=&quot;src&quot;&gt;slide 50&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;La proposta&lt;/h4&gt;&lt;p&gt;Sostituire i requisiti con obiettivi generali e specifici, che richiedono giudizio; evitare il rinvio ai livelli della hierarchy; indicare il dettaglio necessario; elencare le informazioni utili. &lt;span class=&quot;src&quot;&gt;slide 50&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Perché lo IASB ha deciso di non procedere&lt;/h3&gt;
&lt;ol&gt;
&lt;li&gt;IFRS 13 era stato scelto soprattutto per testare la &lt;i&gt;Guidance&lt;/i&gt; (le linee guida) sulla stesura dei requisiti.&lt;/li&gt;
&lt;li&gt;La &lt;i&gt;Post-implementation Review&lt;/i&gt; (la verifica dello standard dopo l&#x27;adozione) aveva trovato utile la disclosure.&lt;/li&gt;
&lt;li&gt;Un&#x27;impresa che giudica materiali le informazioni sui Level 2 vicini al Level 3 le fornirebbe comunque, applicando il par. 31 di IAS 1.&lt;/li&gt;
&lt;li&gt;Il lavoro su questa disclosure non era una priorità nella &lt;i&gt;Third Agenda Consultation&lt;/i&gt;.&lt;/li&gt;
&lt;/ol&gt;
&lt;p class=&quot;note&quot;&gt;Slide 50. Lo IASB ha discusso i commenti a febbraio e maggio 2022.&lt;/p&gt;
&lt;h3&gt;Il filo del tempo&lt;/h3&gt;
&lt;ul class=&quot;tl&quot;&gt;
&lt;li&gt;&lt;b&gt;Set 2006&lt;/b&gt; · SFAS 157 &lt;span class=&quot;src&quot;&gt;esterna&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Mag 2011&lt;/b&gt; · IASB emette IFRS 13 &lt;span class=&quot;src&quot;&gt;esterna&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;1° gen 2013&lt;/b&gt; · IFRS 13 entra in vigore &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Dic 2018&lt;/b&gt; · La Post-implementation Review conclude che lo standard funziona come previsto &lt;span class=&quot;src&quot;&gt;esterna&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Mar 2021&lt;/b&gt; · Exposure Draft su IFRS 13 e IAS 19 &lt;span class=&quot;src&quot;&gt;esterna&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Feb e Mag 2022&lt;/b&gt; · Lo IASB discute i commenti &lt;span class=&quot;src&quot;&gt;slide 50&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Ott 2022&lt;/b&gt; · Decisione di non proseguire su IFRS 13 e IAS 19 &lt;span class=&quot;src&quot;&gt;esterna&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Mar 2023&lt;/b&gt; · &lt;i&gt;Feedback statement&lt;/i&gt; (il documento di risposta ai commenti) &lt;span class=&quot;src&quot;&gt;slide 50&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;1° gen 2027&lt;/b&gt; · IFRS 18 sostituisce IAS 1 &lt;span class=&quot;src&quot;&gt;esterna&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Fonte esterna&lt;/span&gt; Date esterne da: &lt;a href=&quot;https://www.iasplus.com/en/news/2018/12/pir-ifrs-13&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus sulla PIR&lt;/a&gt;, &lt;a href=&quot;https://www.ifrs.org/projects/completed-projects/2023/standards-level-review-of-disclosures/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;pagina del progetto IASB&lt;/a&gt;, &lt;a href=&quot;https://www.iasplus.com/en-ca/projects/ifrs/exposure-drafts/disclosure-initiative-targeted-standards-level-review-of-disclosures-research&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus sul progetto&lt;/a&gt;, &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 18&lt;/a&gt;. Il par. 31 di IAS 1 citato in slide andrà quindi riletto alla luce di IFRS 18: non ho verificato la disposizione corrispondente.&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Qual era il difetto segnalato dagli utilizzatori?&lt;/summary&gt;&lt;div&gt;Troppo dettaglio su misure immateriali, in particolare Level 3, e poco su quelle materiali, come Level 2 vicini al Level 3 per incertezza (slide 50).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Le modifiche proposte sono state approvate?&lt;/summary&gt;&lt;div&gt;No: lo IASB ha deciso di non proseguire il lavoro sulla disclosure di IFRS 13 (slide 50).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Perché il mancato intervento non priva gli utilizzatori dei Level 2 materiali?&lt;/summary&gt;&lt;div&gt;Se sono materiali, il par. 31 di IAS 1 porterebbe comunque a fornirli (slide 50).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part fam-acc&quot; id=&quot;s11&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;11&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Caso&lt;/span&gt;&lt;h2&gt;BNP Paribas, bilancio consolidato 2025&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Per le entità che operano nei mercati finanziari, come le banche, determinare correttamente il fair value è cruciale. Le slide usano i conti consolidati al 31 dicembre 2025, indicati come &lt;i&gt;unaudited figures&lt;/i&gt; (dati non sottoposti a revisione). &lt;span class=&quot;src&quot;&gt;slide 51&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;bnp&quot;&gt;
&lt;h4&gt;La gerarchia nei numeri (milioni di €)&lt;/h4&gt;
&lt;div class=&quot;stepnav&quot; style=&quot;margin:.2rem 0 .5rem&quot;&gt;
