&lt;button class=&quot;btn on&quot; data-y=&quot;2025&quot;&gt;2025&lt;/button&gt;&lt;button class=&quot;btn&quot; data-y=&quot;2024&quot;&gt;2024&lt;/button&gt;&lt;span style=&quot;width:.7rem&quot;&gt;&lt;/span&gt;
&lt;button class=&quot;btn on&quot; data-side=&quot;a&quot;&gt;Assets&lt;/button&gt;&lt;button class=&quot;btn&quot; data-side=&quot;l&quot;&gt;Liabilities&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;keyl&quot;&gt;&lt;span&gt;&lt;i class=&quot;l1&quot;&gt;&lt;/i&gt;Level 1&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;l2&quot;&gt;&lt;/i&gt;Level 2&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;l3&quot;&gt;&lt;/i&gt;Level 3&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;bars&quot; id=&quot;bnp-b&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;bnp-t&quot;&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p id=&quot;bnp-x&quot; style=&quot;font-size:.95rem&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;note&quot;&gt;Righe da slide 55-58, comprese le colonne dei derivati (positive market value tra gli assets, negative tra le liabilities). &lt;b&gt;Totali e percentuali calcolati qui, non riportati nelle slide.&lt;/b&gt; Il totale non è una voce del bilancio.&lt;/p&gt;
&lt;/div&gt;
&lt;h3&gt;Cosa leggere nella tabella&lt;/h3&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Level 1&lt;/h4&gt;&lt;p&gt;Concentrato nei titoli di trading: 264.725 tra gli asset 2025, soprattutto &lt;i&gt;equities&lt;/i&gt; (azioni, 156.616) e &lt;i&gt;governments&lt;/i&gt; (titoli di Stato, 87.517). &lt;span class=&quot;src&quot;&gt;slide 55&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Level 2&lt;/h4&gt;&lt;p&gt;Il grosso: &lt;i&gt;repurchase agreements&lt;/i&gt; (pronti contro termine, 239.995 tra gli asset) e derivati di tasso e cambio. &lt;span class=&quot;src&quot;&gt;slide 55, 57&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Level 3&lt;/h4&gt;&lt;p&gt;Pesa più nel passivo: &lt;i&gt;issued debt securities&lt;/i&gt; a fair value 45.280, derivati su equity negativi 8.667. All&#x27;attivo, equities non di trading 9.220. &lt;span class=&quot;src&quot;&gt;slide 55, 57&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Derivati per dominant risk factor (fattore di rischio dominante), Level 3, 2025&lt;/summary&gt;&lt;div class=&quot;scroll&quot;&gt;
&lt;table&gt;&lt;tr&gt;&lt;th&gt;Non di copertura&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Positive&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Negative&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Interest rate&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.492&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;797&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Foreign exchange&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;331&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;321&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Credit&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.065&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.818&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Equity&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3.117&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8.667&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Other&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;55&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;24&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Totale&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;6.060&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;11.627&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p class=&quot;note&quot;&gt;Slide 57. I derivati di copertura, soprattutto su tassi, sono tutti in Level 2 (20.017 positivi, 28.493 negativi).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;h3&gt;La policy della nota 1.e.10, confrontata con IFRS 13&lt;/h3&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Policy BNP Paribas&quot;&gt;&lt;button role=&quot;tab&quot; data-t=&quot;t&quot;&gt;Tecniche&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;u&quot;&gt;Unit e portfolio&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;v&quot;&gt;Livelli&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;o&quot;&gt;Day One Profit&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;tr&quot;&gt;Transfers&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;t&quot;&gt;&lt;p&gt;Prezzi da dati esterni o tecniche soprattutto di &lt;i&gt;market&lt;/i&gt; e &lt;i&gt;income approach&lt;/i&gt;: &lt;i&gt;discounted cash flows&lt;/i&gt; (flussi attualizzati), Black-Scholes, interpolazione. Sono calibrate sul mercato, con &lt;i&gt;valuation adjustments&lt;/i&gt; (rettifiche) per rischi di modello, liquidità e credito non catturati ma considerati dagli operatori nell&#x27;exit price. &lt;span class=&quot;src&quot;&gt;slide 52&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Richiama: approcci (sezione 8), massimizzazione degli input e rischio (sezione 9).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;u&quot; hidden&gt;&lt;p&gt;La &lt;i&gt;unit of measurement&lt;/i&gt; (unità di misura) è il singolo strumento, ma la banca adotta una misurazione di portafoglio quando gruppi di posizioni con rischi di mercato o di credito simili e compensativi sono gestiti su &lt;i&gt;net exposure&lt;/i&gt; (esposizione netta), secondo la strategia documentata di risk management. &lt;span class=&quot;src&quot;&gt;slide 52&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Fonte esterna&lt;/span&gt; Si tratta della &lt;i&gt;portfolio exception&lt;/i&gt; del par. 48 di IFRS 13, non trattata nelle slide: &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/meetings/2013/may/ifrs-ic/ap11c-aip-ifrs-13-portfolio-exception.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;paper IASB 2013&lt;/a&gt;.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;v&quot; hidden&gt;&lt;p&gt;Level 1: prezzi quotati in active market. Level 2: input significativi osservabili, tecniche calibrate regolarmente e input corroborati. Level 3: input significativi non osservabili o non corroborabili, ad esempio per illiquidità e &lt;i&gt;model risk&lt;/i&gt; (rischio di modello); giudicare se un prodotto sia illiquido è &lt;b&gt;questione di giudizio&lt;/b&gt;. Il livello dell&#x27;intera misura è quello dell&#x27;input significativo più basso. &lt;span class=&quot;src&quot;&gt;slide 53&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;o&quot; hidden&gt;&lt;p&gt;In Level 3, e marginalmente in Level 2, può nascere all&#x27;inizio una differenza tra transaction price e fair value. Il &lt;i&gt;Day One Profit&lt;/i&gt; è &lt;b&gt;differito&lt;/b&gt; e rilasciato a conto economico nel periodo in cui i parametri restano non osservabili. Se i parametri diventano osservabili, o il valore è confermato da transazioni simili recenti in active market, la quota residua è rilasciata. &lt;span class=&quot;src&quot;&gt;slide 53&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Fonte esterna&lt;/span&gt; Il rinvio di IFRS 13.60 agli altri IFRS porta qui a IFRS 9 (par. B5.1.2A, numero da verificare). Sintesi: &lt;a href=&quot;https://viewpoint.pwc.com/dt/us/en/pwc/accounting_guides/ifrs_and_us_gaap_sim/ifrs_and_us_gaap_sim_US/chapter_11_derivativ_US/117_Measurement_Day-one-gains-and-losses_US.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PwC Viewpoint&lt;/a&gt;.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;tr&quot; hidden&gt;&lt;p&gt;I &lt;i&gt;transfers&lt;/i&gt; (passaggi) tra livelli possono avvenire quando uno strumento soddisfa i criteri, per variazioni di osservabilità, tempo ed eventi durante la vita dell&#x27;operazione. La tempistica è determinata all&#x27;inizio del periodo. Nel 2025 i passaggi tra Level 1 e 2 non sono stati significativi. &lt;span class=&quot;src&quot;&gt;slide 58&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Come classifica BNP Paribas un valore con un solo input significativo non osservabile?&lt;/summary&gt;&lt;div&gt;In Level 3: conta l&#x27;input significativo di livello più basso (slide 53).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;La banca iscrive subito il Day One Profit dei Level 3?&lt;/summary&gt;&lt;div&gt;No, lo differisce e lo rilascia nel periodo in cui i parametri restano non osservabili, o quando diventano osservabili (slide 53).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Dove trovi nel bilancio tre rischi che richiedono valuation adjustments?&lt;/summary&gt;&lt;div&gt;Nella nota 1.e.10: rischi di modello, liquidità e credito (slide 52).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s12&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Tutte fonti esterne&lt;/span&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Norme, documenti e metodi citati nelle slide. &lt;b&gt;Ogni scheda è «fonte esterna»&lt;/b&gt;: descrizioni ricavate dai risultati di ricerca, senza leggere per intero i documenti. La colonna «perché conta» è un collegamento fatto qui con la lezione.&lt;/p&gt;
&lt;h3&gt;Lo standard e il suo gemello americano&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fonte esterna · norma&lt;/span&gt;&lt;h4&gt;IFRS 13 Fair Value Measurement&lt;/h4&gt;&lt;p&gt;Definisce il fair value, fissa il framework e richiede disclosure; emesso a maggio 2011. &lt;b&gt;Perché conta:&lt;/b&gt; è il testo di tutti i paragrafi citati.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-13-fair-value-measurement.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina ufficiale&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs13.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo 2026&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs13-ie.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Esempi illustrativi&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fonte esterna · norma&lt;/span&gt;&lt;h4&gt;SFAS 157 / ASC 820&lt;/h4&gt;&lt;p&gt;Emesso dal FASB nel settembre 2006, poi confluito nel Topic 820 della Codification. &lt;b&gt;Perché conta:&lt;/b&gt; è il modello di IFRS 13 (slide 3).&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://dart.deloitte.com/USDART/home/codification/broad-transactions/asc820-10/roadmap-fair-value-measurements-disclosures/chapter-1-background/1-3-history-fair-value-requirements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Deloitte Roadmap §1.3&lt;/a&gt; · &lt;a href=&quot;https://storage.fasb.org/ASU2011-04.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;FASB ASU 2011-04&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Gli standard citati nello scope e nelle note&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fonte esterna · norma&lt;/span&gt;&lt;h4&gt;IFRS 2 Share-based Payment&lt;/h4&gt;&lt;p&gt;Pagamenti regolati in denaro, altre attività o strumenti di capitale; emesso nel febbraio 2004. &lt;b&gt;Perché conta:&lt;/b&gt; escluso da IFRS 13.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-2-share-based-payment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fonte esterna · norma&lt;/span&gt;&lt;h4&gt;IFRS 16 Leases&lt;/h4&gt;&lt;p&gt;Modello unico per il locatario, con attività e passività per i leasing oltre 12 mesi, salvo basso valore. &lt;b&gt;Perché conta:&lt;/b&gt; escluso da IFRS 13.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-16-leases/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fonte esterna · norma&lt;/span&gt;&lt;h4&gt;IAS 2 Inventories&lt;/h4&gt;&lt;p&gt;Costo delle rimanenze e svalutazione al net realisable value. &lt;b&gt;Perché conta:&lt;/b&gt; misura simile ma non fair value.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fonte esterna · norma&lt;/span&gt;&lt;h4&gt;IAS 36 Impairment of Assets&lt;/h4&gt;&lt;p&gt;Le attività non restano iscritte sopra il recoverable amount, il maggiore tra fair value less costs of disposal e value in use. &lt;b&gt;Perché conta:&lt;/b&gt; compare in due zone dello scope.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-36-impairment-of-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fonte esterna · norma&lt;/span&gt;&lt;h4&gt;IAS 19 Employee Benefits&lt;/h4&gt;&lt;p&gt;Come il datore di lavoro contabilizza i benefici ai dipendenti. &lt;b&gt;Perché conta:&lt;/b&gt; plan assets esclusi dalla disclosure di IFRS 13.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2024/issued/ias19.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo 2024&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fonte esterna · norma&lt;/span&gt;&lt;h4&gt;IAS 26 Retirement Benefit Plans&lt;/h4&gt;&lt;p&gt;Il bilancio dei fondi pensione, complementare a IAS 19. &lt;b&gt;Perché conta:&lt;/b&gt; investimenti esclusi dalla disclosure di IFRS 13.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-26-accounting-and-reporting-by-retirement-benefit-plans/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fonte esterna · norma&lt;/span&gt;&lt;h4&gt;IAS 1, ora verso IFRS 18&lt;/h4&gt;&lt;p&gt;IFRS 18 sostituisce IAS 1 dal 1° gennaio 2027, con applicazione retrospettiva. &lt;b&gt;Perché conta:&lt;/b&gt; la slide 50 cita il par. 31 di IAS 1.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, IFRS 18&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Documenti IASB&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fonte esterna · documento&lt;/span&gt;&lt;h4&gt;Post-implementation Review di IFRS 13&lt;/h4&gt;&lt;p&gt;Pubblicata a dicembre 2018: lo standard funziona come previsto, le informazioni sono utili, le difficoltà riguardano le aree di giudizio. &lt;b&gt;Perché conta:&lt;/b&gt; motivo del «no» alle modifiche.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/news-and-events/news/2018/12/iasb-completes-review-of-the-standard-on-fair-value-measurement/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Comunicato IASB&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fonte esterna · documento&lt;/span&gt;&lt;h4&gt;Targeted Standards-level Review of Disclosures&lt;/h4&gt;&lt;p&gt;Progetto concluso a marzo 2023 con una Guidance per scrivere requisiti di disclosure, senza modifiche a IFRS 13 e IAS 19. &lt;b&gt;Perché conta:&lt;/b&gt; è la fonte della slide 50.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/projects/completed-projects/2023/standards-level-review-of-disclosures/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Pagina del progetto&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fonte esterna · documento&lt;/span&gt;&lt;h4&gt;Third Agenda Consultation&lt;/h4&gt;&lt;p&gt;Feedback statement del luglio 2022 con le priorità IASB per il 2022-2026. &lt;b&gt;Perché conta:&lt;/b&gt; la disclosure di IFRS 13 non era tra le priorità.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/project/third-agenda-consultation/thirdagenda-feedbackstatement-july2022.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF IASB&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Caso e metodi&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fonte esterna · bilancio&lt;/span&gt;&lt;h4&gt;BNP Paribas, Consolidated Financial Statements 2025&lt;/h4&gt;&lt;p&gt;Documento non sottoposto a revisione, approvato dal Board il 4 febbraio 2026. &lt;b&gt;Perché conta:&lt;/b&gt; è il caso delle slide 51-58. La ricerca non ha mostrato il testo della nota 1.e.10.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://invest.bnpparibas/en/document/4q25-cfsu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BNP Paribas, investor relations&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fonte esterna · studio&lt;/span&gt;&lt;h4&gt;Black &amp;amp; Scholes (1973)&lt;/h4&gt;&lt;p&gt;«The Pricing of Options and Corporate Liabilities», &lt;i&gt;Journal of Political Economy&lt;/i&gt;, 81(3), 637-654: formula di valutazione delle opzioni, applicabile anche alle passività societarie. &lt;b&gt;Perché conta:&lt;/b&gt; modello citato da BNP (slide 52).&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.cs.princeton.edu/courses/archive/fall09/cos323/papers/black_scholes73.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF, Princeton&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fonte esterna · metodo&lt;/span&gt;&lt;h4&gt;Matrix pricing&lt;/h4&gt;&lt;p&gt;Stima il prezzo di un titolo poco scambiato da titoli comparabili per scadenza, cedola e merito di credito. &lt;b&gt;Perché conta:&lt;/b&gt; esempio di IFRS 13.79. Fonte secondaria.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://analystprep.com/cfa-level-1-exam/fixed-income/matrix-pricing/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AnalystPrep&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;Fonte esterna · metodo&lt;/span&gt;&lt;h4&gt;Multi-period excess earnings method&lt;/h4&gt;&lt;p&gt;Isola i flussi di un intangible principale togliendo una remunerazione per gli altri asset, i &lt;i&gt;contributory assets&lt;/i&gt;, e attualizza il residuo. &lt;b&gt;Perché conta:&lt;/b&gt; esempio di income approach (B11). Fonte secondaria.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.irmi.com/term/insurance-definitions/multi-period-excess-earnings-method&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IRMI&lt;/a&gt; · &lt;a href=&quot;https://opportune.com/insights/news/intangible-asset-valuation-five-key-customer-related-questions-for-businesses&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Opportune&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;footer&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/footer&gt;
&lt;/div&gt;
&lt;script&gt;
(function(){
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function fmt(n,d){return Number(n).toLocaleString(&#x27;it-IT&#x27;,{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function setA(el,k,v){el.setAttribute(k,v)}

/* linguette */
$$(&#x27;[data-tabs]&#x27;).forEach(function(box,bi){
  var tabs=$$(&#x27;[role=tab]&#x27;,box),panes=$$(&#x27;[data-p]&#x27;,box);
  function show(name,focus){
    tabs.forEach(function(t){var on=t.dataset.t===name;setA(t,&#x27;aria-selected&#x27;,on?&#x27;true&#x27;:&#x27;false&#x27;);setA(t,&#x27;tabindex&#x27;,on?&#x27;0&#x27;:&#x27;-1&#x27;)});
    panes.forEach(function(p){p.hidden=p.dataset.p!==name});
    if(focus){var f=tabs.filter(function(t){return t.dataset.t===name})[0];if(f)f.focus()}
  }
  tabs.forEach(function(t,i){
    t.addEventListener(&#x27;click&#x27;,function(){show(t.dataset.t)});
    t.addEventListener(&#x27;keydown&#x27;,function(e){
      var d=e.key===&#x27;ArrowRight&#x27;||e.key===&#x27;ArrowDown&#x27;?1:e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowUp&#x27;?-1:0;
      if(d){e.preventDefault();show(tabs[(i+d+tabs.length)%tabs.length].dataset.t,true)}
      else if((e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;)&amp;&amp;t.tagName!==&#x27;BUTTON&#x27;){e.preventDefault();show(t.dataset.t)}
    });
  });
  panes.forEach(function(p,i){setA(p,&#x27;role&#x27;,&#x27;tabpanel&#x27;);p.id=&#x27;pn&#x27;+bi+&#x27;-&#x27;+i});
  if(tabs[0])show(tabs[0].dataset.t);
});

/* passi */
$$(&#x27;[data-steps]&#x27;).forEach(function(box){
  var st=$$(&#x27;.st&#x27;,box),i=0,idx=$(&#x27;.idx&#x27;,box),pr=$(&#x27;[data-prev]&#x27;,box),nx=$(&#x27;[data-next]&#x27;,box);
  function r(){st.forEach(function(s,k){s.hidden=k!==i});idx.textContent=&#x27;Passo &#x27;+(i+1)+&#x27; di &#x27;+st.length;pr.disabled=i===0;nx.disabled=i===st.length-1;pr.style.opacity=i===0?.45:1;nx.style.opacity=i===st.length-1?.45:1}
  pr.onclick=function(){if(i&gt;0){i--;r()}};nx.onclick=function(){if(i&lt;st.length-1){i++;r()}};r();
});

/* mercati */
(function(){
  var ids=[&#x27;p2&#x27;,&#x27;p3&#x27;,&#x27;v2&#x27;,&#x27;v3&#x27;],el={};ids.forEach(function(k){el[k]=$(&#x27;#&#x27;+k)});
  var np=$(&#x27;#noprinc&#x27;),nl=$(&#x27;#noloc&#x27;);
  function r(){
    var p=[+el.p2.value,+el.p3.value],v=[+el.v2.value,+el.v3.value],tr=nl.checked?[0,0]:[5,6],tc=[2,3];
    $(&#x27;#o-p2&#x27;).textContent=fmt(p[0],2);$(&#x27;#o-p3&#x27;).textContent=fmt(p[1],2);$(&#x27;#o-v2&#x27;).textContent=fmt(v[0]);$(&#x27;#o-v3&#x27;).textContent=fmt(v[1]);
    var fv=[p[0]-tr[0],p[1]-tr[1]],net=[fv[0]-tc[0],fv[1]-tc[1]];
    var princ=np.checked||v[0]===v[1]?null:(v[0]&gt;v[1]?0:1),mam=net[0]&gt;=net[1]?0:1,u=princ===null?mam:princ;
    function c(i,t,pick){return &#x27;&lt;td class=&quot;n&#x27;+(pick?&#x27; pick&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+t+&#x27;&lt;/td&gt;&#x27;}
    var nm=[&#x27;Market 2&#x27;,&#x27;Market 3&#x27;];
    $(&#x27;#mkt-t&#x27;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Market 2&#x27;+(princ===0?&#x27; · principal&#x27;:&#x27;&#x27;)+(mam===0?&#x27; · most adv.&#x27;:&#x27;&#x27;)+&#x27;&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Market 3&#x27;+(princ===1?&#x27; · principal&#x27;:&#x27;&#x27;)+(mam===1?&#x27; · most adv.&#x27;:&#x27;&#x27;)+&#x27;&lt;/th&gt;&lt;/tr&gt;&#x27;+
      &#x27;&lt;tr&gt;&lt;td&gt;Volume&lt;/td&gt;&#x27;+c(0,fmt(v[0]))+c(1,fmt(v[1]))+&#x27;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Price&lt;/td&gt;&#x27;+c(0,fmt(p[0],2))+c(1,fmt(p[1],2))+&#x27;&lt;/tr&gt;&#x27;+
      &#x27;&lt;tr&gt;&lt;td&gt;Transport costs&lt;/td&gt;&#x27;+c(0,&#x27;(&#x27;+fmt(tr[0],2)+&#x27;)&#x27;)+c(1,&#x27;(&#x27;+fmt(tr[1],2)+&#x27;)&#x27;)+&#x27;&lt;/tr&gt;&#x27;+
      &#x27;&lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Fair value&lt;/td&gt;&#x27;+c(0,fmt(fv[0],2),u===0)+c(1,fmt(fv[1],2),u===1)+&#x27;&lt;/tr&gt;&#x27;+
      &#x27;&lt;tr&gt;&lt;td&gt;Transaction costs&lt;/td&gt;&#x27;+c(0,&#x27;(&#x27;+fmt(tc[0],2)+&#x27;)&#x27;)+c(1,&#x27;(&#x27;+fmt(tc[1],2)+&#x27;)&#x27;)+&#x27;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Net&lt;/td&gt;&#x27;+c(0,fmt(net[0],2))+c(1,fmt(net[1],2))+&#x27;&lt;/tr&gt;&#x27;;
    $(&#x27;#mkt-fv&#x27;).textContent=&#x27;Fair value = &#x27;+fmt(fv[u],2);
    $(&#x27;#mkt-x&#x27;).textContent=princ!==null?nm[princ]+&#x27; ha il volume maggiore: è il principal market, e il suo prezzo vale anche se &#x27;+(mam!==princ?nm[mam]+&#x27; offre un netto più alto (&#x27;+fmt(net[mam],2)+&#x27; contro &#x27;+fmt(net[princ],2)+&#x27;).&#x27;:&#x27;nessun altro mercato offre di più: qui i due criteri coincidono.&#x27;):
      &#x27;Nessun principal market: si sceglie &#x27;+nm[mam]+&#x27;, con il netto migliore (&#x27;+fmt(net[mam],2)+&#x27;). Il fair value resta però prima dei transaction costs.&#x27;;
  }
  ids.forEach(function(k){el[k].addEventListener(&#x27;input&#x27;,r)});np.addEventListener(&#x27;change&#x27;,r);nl.addEventListener(&#x27;change&#x27;,r);r();
})();

/* terreno */
(function(){
  var l=$(&#x27;#l&#x27;),p=$(&#x27;#pl&#x27;),rr=$(&#x27;#r&#x27;);
  function r(){
    var L=+l.value,P=+p.value,R=+rr.value,cu=L+P,inc=Math.max(0,R-cu),tot=cu+inc,s=500/Math.max(tot,1);
    $(&#x27;#o-l&#x27;).textContent=L;$(&#x27;#o-pl&#x27;).textContent=P;$(&#x27;#o-r&#x27;).textContent=R;
    var a=L*s,b=P*s,c=inc*s;
    setA($(&#x27;#b1&#x27;),&#x27;x&#x27;,0);setA($(&#x27;#b1&#x27;),&#x27;width&#x27;,a);setA($(&#x27;#b2&#x27;),&#x27;x&#x27;,a);setA($(&#x27;#b2&#x27;),&#x27;width&#x27;,b);setA($(&#x27;#b3&#x27;),&#x27;x&#x27;,a+b);setA($(&#x27;#b3&#x27;),&#x27;width&#x27;,c);
    $(&#x27;#t-b&#x27;).textContent=&#x27;Fair value del gruppo: &#x27;+tot;
    $(&#x27;#land-x&#x27;).textContent=inc&gt;0?&#x27;L\&#x27;uso residenziale vale più dell\&#x27;uso attuale. Incremental value = &#x27;+R+&#x27; − &#x27;+cu+&#x27; = &#x27;+inc+&#x27;. Terreno: &#x27;+L+&#x27; + &#x27;+inc+&#x27; = &#x27;+(L+inc)+&#x27;. Impianto: &#x27;+P+&#x27;, il suo current use.&#x27;:&#x27;L\&#x27;uso residenziale non supera il valore attuale (&#x27;+cu+&#x27;): nessun incremental value, l\&#x27;uso attuale resta highest and best.&#x27;;
  }
  [l,p,rr].forEach(function(x){x.addEventListener(&#x27;input&#x27;,r)});r();
})();

/* obbligazione */
(function(){
  var s=$(&#x27;#s&#x27;),rf=$(&#x27;#rf&#x27;);
  function pv(y){var t,v=0;for(t=1;t&lt;=5;t++)v+=4/Math.pow(1+y,t);return v+100/Math.pow(1+y,5)}
  function X(a){return 50+a/8*440}function Y(v){return 180-(Math.min(140,Math.max(60,v))-60)/80*168}
  function r(){
    var sp=+s.value,f=+rf.value,d=&#x27;&#x27;,a;
    $(&#x27;#o-s&#x27;).textContent=fmt(sp,2)+&#x27;%&#x27;;$(&#x27;#o-rf&#x27;).textContent=fmt(f,2)+&#x27;%&#x27;;
    for(a=0;a&lt;=8;a+=.5)d+=(a?&#x27;L&#x27;:&#x27;M&#x27;)+X(a).toFixed(1)+&#x27; &#x27;+Y(pv((f+a)/100)).toFixed(1);
    setA($(&#x27;#bcurve&#x27;),&#x27;d&#x27;,d);
    var v=pv((f+sp)/100);setA($(&#x27;#bdot&#x27;),&#x27;cx&#x27;,X(sp));setA($(&#x27;#bdot&#x27;),&#x27;cy&#x27;,Y(v));
