&lt;div class=&quot;keyl&quot;&gt;&lt;span&gt;&lt;i class=&quot;l1&quot;&gt;&lt;/i&gt;Level 1&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;l2&quot;&gt;&lt;/i&gt;Level 2&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;l3&quot;&gt;&lt;/i&gt;Level 3&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;bars&quot; id=&quot;bnp-b&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;bnp-t&quot;&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p id=&quot;bnp-x&quot; style=&quot;font-size:.95rem&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;note&quot;&gt;Rows from slides 55-58, including the derivatives columns (positive market value among assets, negative among liabilities). &lt;b&gt;Totals and percentages calculated here, not reported in the slides.&lt;/b&gt; The total is not a line item of the financial statements.&lt;/p&gt;
&lt;/div&gt;
&lt;h3&gt;What to read in the table&lt;/h3&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Level 1&lt;/h4&gt;&lt;p&gt;Concentrated in trading securities: 264,725 among 2025 assets, mainly &lt;i&gt;equities&lt;/i&gt; (156,616) and &lt;i&gt;governments&lt;/i&gt; (government securities, 87,517). &lt;span class=&quot;src&quot;&gt;slide 55&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Level 2&lt;/h4&gt;&lt;p&gt;The bulk: &lt;i&gt;repurchase agreements&lt;/i&gt; (239,995 among assets) and interest rate and foreign exchange derivatives. &lt;span class=&quot;src&quot;&gt;slides 55, 57&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Level 3&lt;/h4&gt;&lt;p&gt;It weighs more on the liabilities side: &lt;i&gt;issued debt securities&lt;/i&gt; at fair value 45,280, negative equity derivatives 8,667. On the assets side, non-trading equities 9,220. &lt;span class=&quot;src&quot;&gt;slides 55, 57&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Derivatives by dominant risk factor, Level 3, 2025&lt;/summary&gt;&lt;div class=&quot;scroll&quot;&gt;
&lt;table&gt;&lt;tr&gt;&lt;th&gt;Non-hedging&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Positive&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Negative&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Interest rate&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,492&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;797&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Foreign exchange&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;331&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;321&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Credit&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,065&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,818&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Equity&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;3,117&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;8,667&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Other&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;55&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;24&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;hl&quot;&gt;&lt;td&gt;Total&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;6,060&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;11,627&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p class=&quot;note&quot;&gt;Slide 57. Hedging derivatives, mainly on interest rates, are all in Level 2 (20,017 positive, 28,493 negative).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;h3&gt;The policy in note 1.e.10, compared with IFRS 13&lt;/h3&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;BNP Paribas policy&quot;&gt;&lt;button role=&quot;tab&quot; data-t=&quot;t&quot;&gt;Techniques&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;u&quot;&gt;Unit and portfolio&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;v&quot;&gt;Levels&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;o&quot;&gt;Day One Profit&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;tr&quot;&gt;Transfers&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;t&quot;&gt;&lt;p&gt;Prices from external data or techniques mainly under the &lt;i&gt;market&lt;/i&gt; and &lt;i&gt;income approach&lt;/i&gt;: &lt;i&gt;discounted cash flows&lt;/i&gt;, Black-Scholes, interpolation. They are calibrated to the market, with &lt;i&gt;valuation adjustments&lt;/i&gt; for model, liquidity and credit risks not captured but considered by market participants in the exit price. &lt;span class=&quot;src&quot;&gt;slide 52&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Links to: approaches (section 8), maximisation of inputs and risk (section 9).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;u&quot; hidden&gt;&lt;p&gt;The &lt;i&gt;unit of measurement&lt;/i&gt; is the individual instrument, but the bank adopts portfolio measurement when groups of positions with similar and offsetting market or credit risks are managed on a &lt;i&gt;net exposure&lt;/i&gt; basis, in accordance with its documented risk management strategy. &lt;span class=&quot;src&quot;&gt;slide 52&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;External source&lt;/span&gt; This is the &lt;i&gt;portfolio exception&lt;/i&gt; in para. 48 of IFRS 13, not covered in the slides: &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/meetings/2013/may/ifrs-ic/ap11c-aip-ifrs-13-portfolio-exception.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IASB paper 2013&lt;/a&gt;.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;v&quot; hidden&gt;&lt;p&gt;Level 1: quoted prices in active markets. Level 2: significant observable inputs, regularly calibrated techniques and corroborated inputs. Level 3: significant inputs that are unobservable or cannot be corroborated, for example because of illiquidity and &lt;i&gt;model risk&lt;/i&gt;; assessing whether a product is illiquid is &lt;b&gt;a matter of judgement&lt;/b&gt;. The level of the entire measurement is that of the lowest significant input. &lt;span class=&quot;src&quot;&gt;slide 53&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;o&quot; hidden&gt;&lt;p&gt;In Level 3, and marginally in Level 2, a difference between transaction price and fair value may arise at inception. The &lt;i&gt;Day One Profit&lt;/i&gt; is &lt;b&gt;deferred&lt;/b&gt; and released to profit or loss over the period in which the parameters remain unobservable. If the parameters become observable, or the value is confirmed by similar recent transactions in an active market, the remaining portion is released. &lt;span class=&quot;src&quot;&gt;slide 53&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;External source&lt;/span&gt; The reference in IFRS 13.60 to the other IFRSs leads here to IFRS 9 (para. B5.1.2A, number to be verified). Summary: &lt;a href=&quot;https://viewpoint.pwc.com/dt/us/en/pwc/accounting_guides/ifrs_and_us_gaap_sim/ifrs_and_us_gaap_sim_US/chapter_11_derivativ_US/117_Measurement_Day-one-gains-and-losses_US.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PwC Viewpoint&lt;/a&gt;.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;tr&quot; hidden&gt;&lt;p&gt;&lt;i&gt;Transfers&lt;/i&gt; between levels may occur when an instrument meets the criteria, because of changes in observability, the passage of time and events during the life of the transaction. The timing is determined at the beginning of the period. In 2025, transfers between Levels 1 and 2 were not significant. &lt;span class=&quot;src&quot;&gt;slide 58&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;How does BNP Paribas classify a value with a single significant unobservable input?&lt;/summary&gt;&lt;div&gt;In Level 3: the lowest-level significant input is what counts (slide 53).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Does the bank immediately recognise the Day One Profit on Level 3 instruments?&lt;/summary&gt;&lt;div&gt;No, it defers it and releases it over the period in which the parameters remain unobservable, or when they become observable (slide 53).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Where in the financial statements can three risks requiring valuation adjustments be found?&lt;/summary&gt;&lt;div&gt;In note 1.e.10: model, liquidity and credit risks (slide 52).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part&quot; id=&quot;s12&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;All external sources&lt;/span&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Standards, documents and methods cited in the slides. &lt;b&gt;Every card is an “external source”&lt;/b&gt;: descriptions drawn from search results, without reading the documents in full. The “why it matters” column is a link to the lesson made here.&lt;/p&gt;
&lt;h3&gt;The standard and its US twin&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;External source · standard&lt;/span&gt;&lt;h4&gt;IFRS 13 Fair Value Measurement&lt;/h4&gt;&lt;p&gt;Defines fair value, sets out the framework and requires disclosure; issued in May 2011. &lt;b&gt;Why it matters:&lt;/b&gt; it is the text of all the paragraphs cited.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-13-fair-value-measurement.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Official page&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs13.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2026 text&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs13-ie.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Illustrative examples&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;External source · standard&lt;/span&gt;&lt;h4&gt;SFAS 157 / ASC 820&lt;/h4&gt;&lt;p&gt;Issued by the FASB in September 2006, later incorporated into Topic 820 of the Codification. &lt;b&gt;Why it matters:&lt;/b&gt; it is the model for IFRS 13 (slide 3).&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://dart.deloitte.com/USDART/home/codification/broad-transactions/asc820-10/roadmap-fair-value-measurements-disclosures/chapter-1-background/1-3-history-fair-value-requirements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Deloitte Roadmap §1.3&lt;/a&gt; · &lt;a href=&quot;https://storage.fasb.org/ASU2011-04.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;FASB ASU 2011-04&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;The standards cited in the scope and in the notes&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;External source · standard&lt;/span&gt;&lt;h4&gt;IFRS 2 Share-based Payment&lt;/h4&gt;&lt;p&gt;Payments settled in cash, other assets or equity instruments; issued in February 2004. &lt;b&gt;Why it matters:&lt;/b&gt; excluded from IFRS 13.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-2-share-based-payment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;External source · standard&lt;/span&gt;&lt;h4&gt;IFRS 16 Leases&lt;/h4&gt;&lt;p&gt;Single lessee model, with assets and liabilities for leases of more than 12 months, unless of low value. &lt;b&gt;Why it matters:&lt;/b&gt; excluded from IFRS 13.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-16-leases/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;External source · standard&lt;/span&gt;&lt;h4&gt;IAS 2 Inventories&lt;/h4&gt;&lt;p&gt;Cost of inventories and write-down to net realisable value. &lt;b&gt;Why it matters:&lt;/b&gt; a measure similar to, but not, fair value.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;External source · standard&lt;/span&gt;&lt;h4&gt;IAS 36 Impairment of Assets&lt;/h4&gt;&lt;p&gt;Assets are not carried above their recoverable amount, the higher of fair value less costs of disposal and value in use. &lt;b&gt;Why it matters:&lt;/b&gt; it appears in two zones of the scope.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-36-impairment-of-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;External source · standard&lt;/span&gt;&lt;h4&gt;IAS 19 Employee Benefits&lt;/h4&gt;&lt;p&gt;How the employer accounts for employee benefits. &lt;b&gt;Why it matters:&lt;/b&gt; plan assets are excluded from the disclosure in IFRS 13.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2024/issued/ias19.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2024 text&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;External source · standard&lt;/span&gt;&lt;h4&gt;IAS 26 Retirement Benefit Plans&lt;/h4&gt;&lt;p&gt;The financial statements of pension funds, complementary to IAS 19. &lt;b&gt;Why it matters:&lt;/b&gt; investments are excluded from the disclosure in IFRS 13.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-26-accounting-and-reporting-by-retirement-benefit-plans/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;External source · standard&lt;/span&gt;&lt;h4&gt;IAS 1, now moving to IFRS 18&lt;/h4&gt;&lt;p&gt;IFRS 18 replaces IAS 1 from 1 January 2027, with retrospective application. &lt;b&gt;Why it matters:&lt;/b&gt; slide 50 cites para. 31 of IAS 1.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, IFRS 18&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;IASB documents&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;External source · document&lt;/span&gt;&lt;h4&gt;Post-implementation Review of IFRS 13&lt;/h4&gt;&lt;p&gt;Published in December 2018: the standard works as intended, the information is useful, and the difficulties concern areas of judgement. &lt;b&gt;Why it matters:&lt;/b&gt; a reason for the “no” to the amendments.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/news-and-events/news/2018/12/iasb-completes-review-of-the-standard-on-fair-value-measurement/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IASB press release&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;External source · document&lt;/span&gt;&lt;h4&gt;Targeted Standards-level Review of Disclosures&lt;/h4&gt;&lt;p&gt;Project concluded in March 2023 with Guidance for drafting disclosure requirements, without amendments to IFRS 13 and IAS 19. &lt;b&gt;Why it matters:&lt;/b&gt; it is the source of slide 50.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/projects/completed-projects/2023/standards-level-review-of-disclosures/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Project page&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;External source · document&lt;/span&gt;&lt;h4&gt;Third Agenda Consultation&lt;/h4&gt;&lt;p&gt;Feedback statement of July 2022 setting out the IASB&#x27;s priorities for 2022-2026. &lt;b&gt;Why it matters:&lt;/b&gt; the disclosure in IFRS 13 was not among the priorities.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/project/third-agenda-consultation/thirdagenda-feedbackstatement-july2022.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IASB PDF&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Case and methods&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;res&quot;&gt;&lt;span class=&quot;k&quot;&gt;External source · financial statements&lt;/span&gt;&lt;h4&gt;BNP Paribas, Consolidated Financial Statements 2025&lt;/h4&gt;&lt;p&gt;Unaudited document, approved by the Board on 4 February 2026. &lt;b&gt;Why it matters:&lt;/b&gt; it is the case in slides 51-58. The search did not surface the text of note 1.e.10.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://invest.bnpparibas/en/document/4q25-cfsu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BNP Paribas, investor relations&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
