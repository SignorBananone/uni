&lt;div class=&quot;kicker&quot;&gt;International and Advanced Accounting · 179009-ENG · Prof. Roberto Aprile · University of Bergamo · A.Y. 2026-2027&lt;/div&gt;
&lt;h1&gt;IFRS 13&lt;br&gt;&lt;i&gt;Fair Value Measurement&lt;/i&gt;&lt;/h1&gt;
&lt;p class=&quot;deck&quot;&gt;For how much could this asset be sold today, or this liability transferred, according to the market rather than to whoever holds them?&lt;/p&gt;
&lt;p&gt;&lt;i&gt;Fair value&lt;/i&gt; is the estimated exit price from the market&#x27;s perspective. IFRS 13 does not say &lt;b&gt;when&lt;/b&gt; to use it, which is decided by the other standards: it says &lt;b&gt;how&lt;/b&gt; to measure it and &lt;b&gt;what&lt;/b&gt; to report about it in the notes. The whole lesson rests on three verbs of the standard: define, measure, disclose.&lt;/p&gt;
&lt;div class=&quot;legend&quot;&gt;

&lt;span&gt;&lt;span class=&quot;lab&quot; style=&quot;color:var(--sla)&quot;&gt;Good to know&lt;/span&gt; added explanation of what the slides take for granted&lt;/span&gt;

&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Main source: &lt;code&gt;corso/LESSONS I SEMESTER A.Y. 2026-2027/IFRS 13 - Fair Value Measurement [link-347934] (zip)/12 - IFRS 13 - Fair Value Measurement .pdf&lt;/code&gt; (59 slides). Other files in the &lt;code&gt;corso/&lt;/code&gt; folder were not consulted, because their contents could not be listed in this session. No connection made here therefore comes from other lessons: the references to other standards are those cited in the slides.&lt;/p&gt;

&lt;section class=&quot;part fam-sal&quot; id=&quot;s1&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Context&lt;/span&gt;&lt;h2&gt;Origin and objective of the standard&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Before IFRS 13, each IAS/IFRS had its own definition of &lt;i class=&quot;t&quot;&gt;fair value&lt;/i&gt;: a situation described as “highly composite and heterogeneous”. The IASB (&lt;i&gt;International Accounting Standards Board&lt;/i&gt;, the body that issues the standards) therefore created a single standard with a general definition. &lt;b&gt;Effective from 1 January 2013.&lt;/b&gt; &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/p&gt;
&lt;figure class=&quot;sv-lg&quot;&gt;
&lt;svg viewBox=&quot;0 0 560 190&quot; role=&quot;img&quot; aria-label=&quot;From many definitions of fair value to one general definition&quot;&gt;
&lt;g class=&quot;ff&quot; opacity=&quot;.55&quot;&gt;&lt;circle cx=&quot;40&quot; cy=&quot;60&quot; r=&quot;12&quot;/&gt;&lt;circle cx=&quot;82&quot; cy=&quot;32&quot; r=&quot;16&quot;/&gt;&lt;circle cx=&quot;130&quot; cy=&quot;28&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;172&quot; cy=&quot;48&quot; r=&quot;17&quot;/&gt;&lt;circle cx=&quot;205&quot; cy=&quot;90&quot; r=&quot;10&quot;/&gt;&lt;circle cx=&quot;182&quot; cy=&quot;134&quot; r=&quot;15&quot;/&gt;&lt;circle cx=&quot;128&quot; cy=&quot;152&quot; r=&quot;18&quot;/&gt;&lt;circle cx=&quot;74&quot; cy=&quot;142&quot; r=&quot;11&quot;/&gt;&lt;circle cx=&quot;32&quot; cy=&quot;110&quot; r=&quot;15&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;118&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;Many definitions&lt;/text&gt;&lt;text x=&quot;118&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;of &lt;tspan font-style=&quot;italic&quot;&gt;fair value&lt;/tspan&gt;&lt;/text&gt;
&lt;text x=&quot;118&quot; y=&quot;184&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;before IFRS 13&lt;/text&gt;
&lt;path class=&quot;ff&quot; d=&quot;M250 50L290 92L250 134L270 134L310 92L270 50z&quot; opacity=&quot;.75&quot;/&gt;&lt;path class=&quot;ff&quot; d=&quot;M300 50L340 92L300 134L320 134L360 92L320 50z&quot; opacity=&quot;.35&quot;/&gt;
&lt;circle class=&quot;fb&quot; cx=&quot;455&quot; cy=&quot;88&quot; r=&quot;74&quot;/&gt;&lt;text x=&quot;455&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;“General”&lt;/text&gt;&lt;text x=&quot;455&quot; y=&quot;94&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;definition&lt;/text&gt;&lt;text x=&quot;455&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot;&gt;IFRS 13.9&lt;/text&gt;
&lt;text x=&quot;455&quot; y=&quot;184&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;after IFRS 13&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Convergence with US GAAP&lt;/h4&gt;&lt;p&gt;IFRS 13 arose from the convergence process with &lt;i&gt;US GAAP&lt;/i&gt; (the US accounting standards), in particular with SFAS 157, now ASC 820 in the &lt;i&gt;FASB Codification&lt;/i&gt;, to which it substantially corresponds. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;A pervasive measurement basis&lt;/h4&gt;&lt;p&gt;It brings together in one standard a measurement basis that had spread across many IAS/IFRS already issued. &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;A hierarchy of methods&lt;/h4&gt;&lt;p&gt;It also defines a &lt;i&gt;hierarchy&lt;/i&gt;, a ranking of the methods for determining fair value (section 9). &lt;span class=&quot;src&quot;&gt;slide 3&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Why fair value became so widespread&lt;/h3&gt;
&lt;p&gt;Slide 3 traces its origin to the evolution of the information objectives of financial statements, in particular the shift from &lt;i&gt;distributable income&lt;/i&gt; to &lt;i&gt;income produced&lt;/i&gt;.&lt;/p&gt;
&lt;div class=&quot;plus&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Good to know&lt;/span&gt;
&lt;p&gt;&lt;b&gt;&lt;i&gt;Distributable income&lt;/i&gt;&lt;/b&gt;: financial statements serve mainly to establish how much can be distributed without eroding capital. What counts is therefore what has been realised, from a prudential perspective close to historical cost, in order to protect creditors.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;&lt;i&gt;Income produced&lt;/i&gt;&lt;/b&gt;: financial statements serve to show performance to investors. Unrealised changes in value also count, and this is where a market-updated measure such as fair value becomes useful.&lt;/p&gt;&lt;/div&gt;
&lt;h3&gt;Objective: three things the standard does&lt;/h3&gt;
&lt;figure class=&quot;sv-md&quot;&gt;
&lt;svg viewBox=&quot;0 0 520 210&quot; role=&quot;img&quot; aria-label=&quot;IFRS 13 defines fair value, sets out a measurement framework and requires disclosure&quot;&gt;
&lt;rect class=&quot;fb&quot; x=&quot;6&quot; y=&quot;72&quot; width=&quot;130&quot; height=&quot;66&quot; rx=&quot;12&quot;/&gt;&lt;text x=&quot;71&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-weight=&quot;600&quot;&gt;IFRS 13&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;71&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;para. 1&lt;/text&gt;
&lt;path class=&quot;ln&quot; marker-end=&quot;url(#a)&quot; d=&quot;M136 92L190 38&quot;/&gt;&lt;path class=&quot;ln&quot; marker-end=&quot;url(#a)&quot; d=&quot;M136 105H190&quot;/&gt;&lt;path class=&quot;ln&quot; marker-end=&quot;url(#a)&quot; d=&quot;M136 118L190 172&quot;/&gt;
&lt;rect class=&quot;bx&quot; x=&quot;194&quot; y=&quot;10&quot; width=&quot;318&quot; height=&quot;52&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;353&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;15.5&quot;&gt;Defines fair value&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;194&quot; y=&quot;79&quot; width=&quot;318&quot; height=&quot;52&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;353&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;15.5&quot;&gt;Sets out a single framework&lt;/text&gt;&lt;text x=&quot;353&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-size=&quot;15.5&quot;&gt;for measuring it&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;194&quot; y=&quot;148&quot; width=&quot;318&quot; height=&quot;52&quot; rx=&quot;10&quot;/&gt;&lt;text x=&quot;353&quot; y=&quot;180&quot; text-anchor=&quot;middle&quot; font-size=&quot;15.5&quot;&gt;Requires disclosure on measurements&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Slide 4. &lt;i&gt;Framework&lt;/i&gt;: the set of rules; &lt;i&gt;disclosure&lt;/i&gt;: information provided in the notes.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;External source&lt;/span&gt; SFAS 157 was issued by the FASB (the US counterpart of the IASB) in September 2006, and IFRS 13 by the IASB in May 2011. &lt;a href=&quot;https://dart.deloitte.com/USDART/home/codification/broad-transactions/asc820-10/roadmap-fair-value-measurements-disclosures/chapter-1-background/1-3-history-fair-value-requirements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Deloitte, Roadmap, §1.3&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-13-fair-value-measurement.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, IFRS 13&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Does IFRS 13 establish which items must be measured at fair value?&lt;/summary&gt;&lt;div&gt;No. That is decided by the other IFRSs, which require or permit it. IFRS 13 states how to measure it and what disclosure to provide (slides 4-5).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What problem does it solve, and when did it become effective?&lt;/summary&gt;&lt;div&gt;The existence of different definitions in different standards. It introduces a general definition, effective from 1 January 2013 (slide 2).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Which US standard does it substantially correspond to?&lt;/summary&gt;&lt;div&gt;SFAS 157, now ASC 820 in the FASB Codification (slide 3).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part fam-sal&quot; id=&quot;s2&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Context&lt;/span&gt;&lt;h2&gt;Scope: where it applies and where it does not&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;The &lt;i class=&quot;t&quot;&gt;scope&lt;/i&gt; is broad: IFRS 13 applies when another IFRS &lt;b&gt;requires or permits&lt;/b&gt; fair value measurements, or disclosures about them, including measures based on fair value such as &lt;i&gt;fair value less costs to sell&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;slide 5 · IFRS 13.5&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;The exceptions are of two kinds and must be kept separate: some items are excluded altogether, from both &lt;i&gt;measurement&lt;/i&gt; (the measurement requirements) and disclosure, while others are excluded from disclosure only.&lt;/p&gt;
&lt;figure class=&quot;sv-lg&quot;&gt;
&lt;svg viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;Three zones: full exclusion, exclusion from disclosure only, full application&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;4&quot; y=&quot;4&quot; width=&quot;552&quot; height=&quot;292&quot; rx=&quot;16&quot;/&gt;
&lt;text x=&quot;20&quot; y=&quot;30&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Full application: measurement + disclosure&lt;/text&gt;
&lt;text class=&quot;m&quot; x=&quot;20&quot; y=&quot;50&quot; font-size=&quot;13&quot;&gt;every other case in which an IFRS requires or permits fair value&lt;/text&gt;
&lt;rect x=&quot;20&quot; y=&quot;64&quot; width=&quot;520&quot; height=&quot;104&quot; rx=&quot;12&quot; fill=&quot;var(--och-bg)&quot; stroke=&quot;var(--och)&quot;/&gt;
&lt;text x=&quot;34&quot; y=&quot;88&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;Measurement yes, disclosure no · IFRS 13.7&lt;/text&gt;
&lt;text x=&quot;34&quot; y=&quot;110&quot; font-size=&quot;13.5&quot;&gt;Plan assets at fair value (IAS 19)&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;130&quot; font-size=&quot;13.5&quot;&gt;Retirement benefit plan investments (IAS 26)&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;150&quot; font-size=&quot;13.5&quot;&gt;Recoverable amount = fair value less costs of disposal (IAS 36)&lt;/text&gt;
&lt;rect x=&quot;20&quot; y=&quot;178&quot; width=&quot;520&quot; height=&quot;106&quot; rx=&quot;12&quot; fill=&quot;var(--bri-bg)&quot; stroke=&quot;var(--bri)&quot;/&gt;
&lt;text x=&quot;34&quot; y=&quot;202&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;Neither measurement nor disclosure · IFRS 13.6&lt;/text&gt;
&lt;text x=&quot;34&quot; y=&quot;224&quot; font-size=&quot;13.5&quot;&gt;Share-based payment (IFRS 2) · Leases (IFRS 16)&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;244&quot; font-size=&quot;13.5&quot;&gt;Measures similar to fair value but not fair value:&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;264&quot; font-size=&quot;13.5&quot;&gt;net realisable value (IAS 2), value in use (IAS 36)&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Slides 5-6. The framework applies to both &lt;i&gt;initial&lt;/i&gt; and &lt;i&gt;subsequent measurement&lt;/i&gt;, IFRS 13.8.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;h3&gt;The items explained&lt;/h3&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Share-based payment · IFRS 2&lt;/summary&gt;&lt;div&gt;Payments based on shares, for example employee stock options. Excluded from the measurement and disclosure requirements of IFRS 13. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Leasing transactions · IFRS 16&lt;/summary&gt;&lt;div&gt;Leasing transactions accounted for under IFRS 16. Excluded from both. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Net realisable value and value in use: why “similar but not fair value”&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;&lt;i&gt;Net realisable value&lt;/i&gt; (IAS 2) and &lt;i&gt;value in use&lt;/i&gt; (IAS 36) are excluded because they resemble fair value without being fair value. &lt;span class=&quot;src&quot;&gt;slide 5&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;plus&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Good to know&lt;/span&gt; The difference lies in the perspective. These two measures reflect the cash flows expected &lt;b&gt;by that specific entity&lt;/b&gt;, so they are &lt;i&gt;entity-specific&lt;/i&gt;. Fair value, by contrast, is &lt;i&gt;market-based&lt;/i&gt;. This is the same dividing line as in section 3.&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;Plan assets, IAS 26, fair value less costs of disposal&lt;/summary&gt;&lt;div&gt;These are measured at fair value following IFRS 13, but without its disclosure: &lt;i&gt;plan assets&lt;/i&gt; (assets backing an employee benefit plan) under IAS 19, pension fund investments under IAS 26, and assets whose &lt;i&gt;recoverable amount&lt;/i&gt; equals &lt;i&gt;fair value less costs of disposal&lt;/i&gt; under IAS 36. &lt;span class=&quot;src&quot;&gt;slide 6 · IFRS 13.7&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;trap&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Pitfall&lt;/span&gt; IAS 36 appears in both zones. &lt;i&gt;Value in use&lt;/i&gt; is excluded altogether, whereas &lt;i&gt;fair value less costs of disposal&lt;/i&gt; is excluded from disclosure only.&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;An entity calculates recoverable amount as fair value less costs of disposal. Does IFRS 13 apply?&lt;/summary&gt;&lt;div&gt;Yes for measurement, no for the disclosure requirements of IFRS 13 (IFRS 13.7, slide 6).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Does the net realisable value of inventories fall within IFRS 13?&lt;/summary&gt;&lt;div&gt;No: it is a similar measure but not fair value, and it is excluded from both measurement and disclosure (IFRS 13.6, slide 5).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Does the framework apply only at initial recognition?&lt;/summary&gt;&lt;div&gt;No, it applies to initial and subsequent measurement if another IFRS requires or permits fair value (IFRS 13.8, slide 6).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part fam-och&quot; id=&quot;s3&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Definition&lt;/span&gt;&lt;h2&gt;The definition, word by word&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Slides 7-11 take apart the definition in IFRS 13.9 by circling one word at a time. Do the same: click the underlined terms.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;p class=&quot;anat&quot; role=&quot;tablist&quot; aria-label=&quot;Terms of the fair value definition&quot;&gt;“The &lt;button role=&quot;tab&quot; data-t=&quot;price&quot;&gt;price&lt;/button&gt; that would be received to sell an &lt;button role=&quot;tab&quot; data-t=&quot;al&quot;&gt;asset&lt;/button&gt; or paid to transfer a &lt;button role=&quot;tab&quot; data-t=&quot;al&quot;&gt;liability&lt;/button&gt; in an &lt;button role=&quot;tab&quot; data-t=&quot;tr&quot;&gt;orderly transaction&lt;/button&gt; between &lt;button role=&quot;tab&quot; data-t=&quot;mp&quot;&gt;market participants&lt;/button&gt; at the &lt;button role=&quot;tab&quot; data-t=&quot;md&quot;&gt;measurement date&lt;/button&gt;”. &lt;span class=&quot;src&quot;&gt;IFRS 13.9&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;panebox&quot;&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;price&quot;&gt;
&lt;h4&gt;Price: the price is not adjusted for transaction costs&lt;/h4&gt;
&lt;p&gt;The price in the relevant market &lt;b&gt;is not adjusted for &lt;i&gt;transaction costs&lt;/i&gt;&lt;/b&gt;, which are not a characteristic of the asset or liability but depend on how the entity enters into the transaction. They are accounted for under the other IFRSs. &lt;span class=&quot;src&quot;&gt;slide 8 · IFRS 13.25&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;&lt;i&gt;Transport costs&lt;/i&gt; are different: they are not part of transaction costs. &lt;b&gt;If location is a characteristic of the asset&lt;/b&gt;, as may be the case for a &lt;i&gt;commodity&lt;/i&gt;, the price is adjusted for the costs necessary to transport it to the market. &lt;span class=&quot;src&quot;&gt;slide 8 · IFRS 13.26&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;al&quot; hidden&gt;
&lt;h4&gt;Asset or liability: the specific item is what counts&lt;/h4&gt;
&lt;p&gt;The measurement concerns a particular &lt;i&gt;asset&lt;/i&gt; or &lt;i&gt;liability&lt;/i&gt;. It takes into account the characteristics that market participants would consider: &lt;b&gt;condition and location&lt;/b&gt; and &lt;b&gt;restrictions on the sale or use&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 9 · IFRS 13.11&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;tr&quot; hidden&gt;
&lt;h4&gt;Transaction: where it takes place&lt;/h4&gt;
&lt;p&gt;The sale or transfer is assumed to take place in the &lt;i&gt;principal market&lt;/i&gt; or, in its absence, in the &lt;i&gt;most advantageous market&lt;/i&gt;: see section 4. &lt;span class=&quot;src&quot;&gt;slide 10 · IFRS 13.16&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;plus&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Good to know&lt;/span&gt; &lt;i&gt;Orderly&lt;/i&gt; means a normal transaction, with time to find buyers, not a forced sale. This is why the sale &lt;i&gt;under duress&lt;/i&gt; in section 7 may not represent fair value.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;mp&quot; hidden&gt;
&lt;h4&gt;Market participants: the assumptions are theirs&lt;/h4&gt;
&lt;p&gt;The assumptions used are those that &lt;i&gt;market participants&lt;/i&gt; would use when pricing the item, on the premise that they act in their &lt;i&gt;economic best interest&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;slide 11 · IFRS 13.22&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Specific parties need not be identified. Their general distinguishing characteristics must be determined, considering the asset or liability, the relevant market and the participants with whom the entity would enter into the transaction. &lt;span class=&quot;src&quot;&gt;slide 11 · IFRS 13.23&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;md&quot; hidden&gt;
&lt;h4&gt;Measurement date: a snapshot&lt;/h4&gt;
&lt;div class=&quot;plus&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Good to know&lt;/span&gt; The slide does not devote a panel to this term. The &lt;i&gt;measurement date&lt;/i&gt; is the valuation date: the price reflects market conditions on that day, not an average or a long-term expectation. Indeed, the valuation objective in IFRS 13.62 refers to &lt;i&gt;current market conditions&lt;/i&gt; (slide 33).&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;i&gt;Exit price&lt;/i&gt;: the price that would be received to sell an asset or paid to transfer a liability. &lt;span class=&quot;src&quot;&gt;slide 12 · Appendix A&lt;/span&gt;&lt;/div&gt;
&lt;h3&gt;Market-based, not entity-specific&lt;/h3&gt;
&lt;p&gt;Fair value is a market-based measurement. If the price of an identical item is not observable, another &lt;i&gt;valuation technique&lt;/i&gt; is used that maximises observable inputs and minimises unobservable ones. Consequently, &lt;b&gt;the entity&#x27;s intention to hold the asset or to settle the liability is not relevant&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 7 · IFRS 13.2-3&lt;/span&gt;&lt;/p&gt;
&lt;figure class=&quot;sv-lg&quot;&gt;
&lt;svg viewBox=&quot;0 0 560 170&quot; role=&quot;img&quot; aria-label=&quot;Comparison between the entity-specific and market-based views&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;4&quot; y=&quot;8&quot; width=&quot;262&quot; height=&quot;154&quot; rx=&quot;12&quot;/&gt;&lt;rect class=&quot;fb&quot; x=&quot;294&quot; y=&quot;8&quot; width=&quot;262&quot; height=&quot;154&quot; rx=&quot;12&quot;/&gt;
&lt;text x=&quot;135&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Entity-specific&lt;/text&gt;&lt;text x=&quot;425&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Market-based = fair value&lt;/text&gt;
&lt;text x=&quot;20&quot; y=&quot;62&quot; font-size=&quot;13.5&quot;&gt;“What is it worth to us?”&lt;/text&gt;&lt;text x=&quot;20&quot; y=&quot;86&quot; font-size=&quot;13.5&quot;&gt;our intentions&lt;/text&gt;&lt;text x=&quot;20&quot; y=&quot;108&quot; font-size=&quot;13.5&quot;&gt;our synergies&lt;/text&gt;&lt;text x=&quot;20&quot; y=&quot;130&quot; font-size=&quot;13.5&quot;&gt;e.g. value in use&lt;/text&gt;
&lt;text x=&quot;310&quot; y=&quot;62&quot; font-size=&quot;13.5&quot;&gt;“What would the market pay?”&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;86&quot; font-size=&quot;13.5&quot;&gt;market participants&#x27; assumptions&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;108&quot; font-size=&quot;13.5&quot;&gt;risk included in the price&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;130&quot; font-size=&quot;13.5&quot;&gt;exit price at the date&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Teaching diagram based on slides 5, 7 and 49.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;An entity intends to hold an asset for ten years: does this affect its fair value measurement?&lt;/summary&gt;&lt;div&gt;No. The intention to hold it is not relevant, because the measurement is market-based (IFRS 13.3, slide 7).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Do transaction costs adjust the price? And transport costs?&lt;/summary&gt;&lt;div&gt;Transaction costs do not. Transport costs do, if location is a characteristic of the asset (IFRS 13.25-26, slide 8).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Must market participants be identified by name?&lt;/summary&gt;&lt;div&gt;No: the characteristics that distinguish them in general are sufficient (IFRS 13.23, slide 11).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Is a restriction on the sale of the asset taken into account?&lt;/summary&gt;&lt;div&gt;Yes, if market participants would consider it when pricing the asset (IFRS 13.11, slide 9).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part fam-och&quot; id=&quot;s4&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Definition&lt;/span&gt;&lt;h2&gt;Principal or most advantageous market&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Active market&lt;/h4&gt;&lt;p&gt;A market with transactions of &lt;b&gt;sufficient frequency and volume&lt;/b&gt; to provide pricing information on an ongoing basis. &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Principal market&lt;/h4&gt;&lt;p&gt;The market with the &lt;b&gt;greatest volume and level of activity&lt;/b&gt; for the item. &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Most advantageous market&lt;/h4&gt;&lt;p&gt;The market that &lt;b&gt;maximises the amount received or minimises the amount paid&lt;/b&gt;, after transaction and transport costs. &lt;span class=&quot;src&quot;&gt;slide 13&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot; data-steps aria-label=&quot;Procedure for selecting the market&quot;&gt;
&lt;div class=&quot;st&quot;&gt;&lt;h4&gt;Step 1 · No exhaustive search is required&lt;/h4&gt;&lt;p&gt;The entity need not examine all possible markets, but it considers all information that is &lt;i&gt;reasonably available&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;slide 10 · IFRS 13.17&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;st&quot; hidden&gt;&lt;h4&gt;Step 2 · Start from the market in which the entity usually operates&lt;/h4&gt;&lt;p&gt;In the absence of evidence to the contrary, the market in which the entity would normally transact is presumed to be the principal market or, in its absence, the most advantageous market. &lt;span class=&quot;src&quot;&gt;slide 10 · IFRS 13.17&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;st&quot; hidden&gt;&lt;h4&gt;Step 3 · If there is a principal market, it prevails&lt;/h4&gt;&lt;p&gt;Fair value is the price in that market, whether observable or estimated, &lt;b&gt;even if another market is potentially more advantageous&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 10 · IFRS 13.18&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;st&quot; hidden&gt;&lt;h4&gt;Step 4 · If there is none, compare the net amounts&lt;/h4&gt;&lt;p&gt;The market with the best net amount after transport and transaction costs is selected. Fair value, however, is then taken &lt;b&gt;before&lt;/b&gt; transaction costs. &lt;span class=&quot;src&quot;&gt;slides 13-14 · IFRS 13.16, 25&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;span class=&quot;idx&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-prev&gt;Back&lt;/button&gt;&lt;button class=&quot;btn&quot; data-next&gt;Next&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;widget&quot; id=&quot;mkt&quot;&gt;
&lt;h4&gt;The case from slide 14, with sliders&lt;/h4&gt;
&lt;p class=&quot;note&quot;&gt;Starting values: those of the slide. Fixed costs: transport 5 and 6, transaction 2 and 3.&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;Price, Market 2 &lt;output id=&quot;o-p2&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;p2&quot; min=&quot;80&quot; max=&quot;120&quot; value=&quot;98&quot;&gt;&lt;/label&gt;
&lt;label&gt;Price, Market 3 &lt;output id=&quot;o-p3&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;p3&quot; min=&quot;80&quot; max=&quot;120&quot; value=&quot;105&quot;&gt;&lt;/label&gt;
&lt;label&gt;Volume, Market 2 &lt;output id=&quot;o-v2&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;v2&quot; min=&quot;2000&quot; max=&quot;20000&quot; step=&quot;1000&quot; value=&quot;12000&quot;&gt;&lt;/label&gt;
&lt;label&gt;Volume, Market 3 &lt;output id=&quot;o-v3&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;v3&quot; min=&quot;2000&quot; max=&quot;20000&quot; step=&quot;1000&quot; value=&quot;10000&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;noprinc&quot;&gt; There is no principal market&lt;/label&gt;
&lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;noloc&quot;&gt; Location is not a characteristic of the asset (no transport costs)&lt;/label&gt;
&lt;div class=&quot;scroll&quot;&gt;&lt;table id=&quot;mkt-t&quot;&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;span class=&quot;big&quot; id=&quot;mkt-fv&quot;&gt;&lt;/span&gt;&lt;/p&gt;
&lt;p id=&quot;mkt-x&quot; style=&quot;font-size:.95rem&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;trap&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Pitfall&lt;/span&gt; In the slide&#x27;s case, fair value is &lt;b&gt;93&lt;/b&gt;. It is not 96, the net amount of Market 3, nor 91, which deducts transaction costs. Without a principal market it would be &lt;b&gt;99&lt;/b&gt;: Market 3 is selected by looking at the net amount, but fair value remains before transaction costs.&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why, in the example, does Market 2 prevail over a Market 3 offering a higher net amount?&lt;/summary&gt;&lt;div&gt;It has the greater volume (12,000 versus 10,000), so it is the principal market, and when a principal market exists its price is used (IFRS 13.18).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What purpose do transaction costs serve, if they do not enter into fair value?&lt;/summary&gt;&lt;div&gt;They serve to identify the most advantageous market, whose definition takes them into account. Once the market is selected, they do not adjust the price (slides 13-14, IFRS 13.25).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;In the absence of evidence to the contrary, which market is used?&lt;/summary&gt;&lt;div&gt;The one in which the entity normally operates: it is presumed to be the principal or most advantageous market (IFRS 13.17, slide 10).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part fam-sla&quot; id=&quot;s5&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Applications&lt;/span&gt;&lt;h2&gt;Non-financial assets and highest and best use&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;i&gt;Highest and best use&lt;/i&gt;: the use of a &lt;i&gt;non-financial asset&lt;/i&gt; by market participants that would maximise the value of the asset or of the group in which it would be used. &lt;span class=&quot;src&quot;&gt;slide 12 · Appendix A&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;The measurement considers a market participant&#x27;s ability to generate economic benefits by using the asset in its highest and best use, or by selling it to another participant who would use it in that way. &lt;span class=&quot;src&quot;&gt;slide 15 · IFRS 13.27&lt;/span&gt;&lt;/p&gt;
&lt;figure class=&quot;sv-lg&quot;&gt;
&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;Three filters of highest and best use: physically possible, legally permissible, financially feasible&quot;&gt;
&lt;g&gt;&lt;polygon class=&quot;fb&quot; points=&quot;6,20 170,20 150,130 26,130&quot;/&gt;&lt;text x=&quot;88&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;Physically&lt;/text&gt;&lt;text x=&quot;88&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;possible&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;polygon class=&quot;fb&quot; points=&quot;190,20 354,20 334,130 210,130&quot;/&gt;&lt;text x=&quot;272&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;Legally&lt;/text&gt;&lt;text x=&quot;272&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;permissible&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;polygon class=&quot;fb&quot; points=&quot;374,20 554,20 534,130 394,130&quot;/&gt;&lt;text x=&quot;464&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;Financially&lt;/text&gt;&lt;text x=&quot;464&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;600&quot;&gt;feasible&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Slide 15, IFRS 13.28: the use must be physically possible, legally permissible and financially feasible.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Market perspective&lt;/h4&gt;&lt;p&gt;The perspective of market participants is what counts, even if the entity intends a different use. Current use &lt;b&gt;is presumed&lt;/b&gt; to be the highest and best use, unless there are indications to the contrary. &lt;span class=&quot;src&quot;&gt;slide 15 · IFRS 13.29&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Defensive use&lt;/h4&gt;&lt;p&gt;An entity may acquire an &lt;i&gt;intangible&lt;/i&gt; asset and not use it, in order to prevent others from using it. It still measures the asset by assuming market participants&#x27; highest and best use. &lt;span class=&quot;src&quot;&gt;slide 15 · IFRS 13.30&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Valuation premise: in combination or on its own&lt;/h3&gt;
&lt;p&gt;Highest and best use establishes the &lt;i class=&quot;t&quot;&gt;valuation premise&lt;/i&gt; (the underlying assumption of the valuation). &lt;span class=&quot;src&quot;&gt;slide 16 · IFRS 13.31&lt;/span&gt;&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Valuation premise&quot;&gt;&lt;button role=&quot;tab&quot; data-t=&quot;grp&quot;&gt;In combination&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;alone&quot;&gt;Stand-alone&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;uoa&quot;&gt;Unit of account&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;grp&quot;&gt;
&lt;p&gt;The asset provides maximum value &lt;b&gt;together with other assets&lt;/b&gt;, as installed or configured, or &lt;b&gt;with other assets and liabilities&lt;/b&gt;, for example a &lt;i&gt;business&lt;/i&gt;. Fair value is the sale price assuming that the complementary items are available to market participants. &lt;span class=&quot;src&quot;&gt;slide 16&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Associated liabilities include those that fund &lt;i&gt;working capital&lt;/i&gt;, but not those that fund assets outside the group.&lt;/li&gt;&lt;li&gt;Assumptions about highest and best use must be &lt;b&gt;consistent for all the assets&lt;/b&gt; in the group for which that use is relevant.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;alone&quot; hidden&gt;&lt;p&gt;The asset provides maximum value &lt;b&gt;&lt;i&gt;stand-alone&lt;/i&gt;&lt;/b&gt;, that is, on its own. Fair value is the price of a sale to market participants who would use it on its own. &lt;span class=&quot;src&quot;&gt;slide 17&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;uoa&quot; hidden&gt;&lt;p&gt;The asset is assumed to be sold consistently with the &lt;i&gt;unit of account&lt;/i&gt; (the accounting reference unit set by the other IFRSs, which may be the individual asset), even if its best use is in combination: the market participant is assumed &lt;b&gt;already to hold&lt;/b&gt; the complementary assets and associated liabilities. &lt;span class=&quot;src&quot;&gt;slide 17 · IFRS 13.32&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Land with a factory&lt;/h3&gt;
&lt;p&gt;An entity may operate a plant on a piece of land even if the best use would be to demolish it and develop the site for residential purposes. The slides break down the fair value of the group into: (a) &lt;b&gt;value in current use&lt;/b&gt; and (b) &lt;b&gt;incremental value&lt;/b&gt; (the difference up to fair value). &lt;span class=&quot;src&quot;&gt;slide 18&lt;/span&gt; The incremental value is attributed to the &lt;b&gt;land&lt;/b&gt;, to which the conversion relates; the plant retains its value in current use. &lt;span class=&quot;src&quot;&gt;slide 19&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;land&quot;&gt;
&lt;h4&gt;Try the breakdown&lt;/h4&gt;
&lt;p class=&quot;note&quot;&gt;Illustrative amounts, not from the slides.&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;Land in current use &lt;output id=&quot;o-l&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;l&quot; min=&quot;0&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;&lt;/label&gt;
&lt;label&gt;Plant in current use &lt;output id=&quot;o-pl&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;pl&quot; min=&quot;0&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;40&quot;&gt;&lt;/label&gt;
&lt;label&gt;Residential land, net of demolition &lt;output id=&quot;o-r&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;r&quot; min=&quot;0&quot; max=&quot;500&quot; step=&quot;5&quot; value=&quot;240&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 500 70&quot; role=&quot;img&quot; aria-label=&quot;Bar showing the composition of the group&#x27;s fair value&quot;&gt;&lt;rect id=&quot;b1&quot; y=&quot;10&quot; height=&quot;34&quot; fill=&quot;var(--sla)&quot;/&gt;&lt;rect id=&quot;b2&quot; y=&quot;10&quot; height=&quot;34&quot; fill=&quot;var(--sal)&quot;/&gt;&lt;rect id=&quot;b3&quot; y=&quot;10&quot; height=&quot;34&quot; fill=&quot;var(--accent)&quot;/&gt;&lt;text id=&quot;t-b&quot; x=&quot;0&quot; y=&quot;64&quot; font-size=&quot;13&quot;&gt;&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;keyl&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:var(--sla)&quot;&gt;&lt;/i&gt;land, current use&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--sal)&quot;&gt;&lt;/i&gt;plant, current use&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--accent)&quot;&gt;&lt;/i&gt;incremental value&lt;/span&gt;&lt;/div&gt;
&lt;p id=&quot;land-x&quot; style=&quot;font-size:.95rem&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;External source&lt;/span&gt; &lt;b&gt;To be checked.&lt;/b&gt; Slides 18-19 do not cite a paragraph. An example with this two-component breakdown appears in the &lt;a href=&quot;https://www.drsc.de/app/uploads/2017/03/132_05d_ED_2009_05_FVM_IE.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2009 Exposure Draft&lt;/a&gt; (the draft standard issued for consultation), and a &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/meetings/2010/february/iasb/fvm-0210b02bobs.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2010 IASB paper&lt;/a&gt; asked whether to drop this requirement in favour of a disclosure. The &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs13-ie.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;current illustrative examples&lt;/a&gt; show the comparison between industrial and residential use. The search did not establish how the final text resolves the point: for the exam, follow the slide, and ask the lecturer if you need the exact reference.&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Which three conditions must highest and best use meet?&lt;/summary&gt;&lt;div&gt;Physically possible, legally permissible, financially feasible (IFRS 13.28, slide 15).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;An entity buys a competing brand to prevent its use. How is the brand measured?&lt;/summary&gt;&lt;div&gt;By assuming market participants&#x27; highest and best use, not the entity&#x27;s defensive use (IFRS 13.30, slide 15).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;If the best use is in combination, must a sale of the whole group be assumed?&lt;/summary&gt;&lt;div&gt;No: the sale follows the unit of account, assuming that the market participant already holds the complementary assets and associated liabilities (IFRS 13.32, slide 17).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;In the land-and-plant case, where does the incremental value go?&lt;/summary&gt;&lt;div&gt;To the land, the asset to which it relates: its fair value is current use plus incremental value. The plant reflects current use (slide 19).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part fam-sla&quot; id=&quot;s6&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Applications&lt;/span&gt;&lt;h2&gt;Liabilities and own equity instruments&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;The measurement assumes that a liability or an &lt;i class=&quot;t&quot;&gt;own equity instrument&lt;/i&gt; (an equity instrument issued by the entity, for example shares given as consideration in a &lt;i&gt;business combination&lt;/i&gt;) is &lt;b&gt;transferred&lt;/b&gt; to a market participant at the measurement date, not extinguished. &lt;span class=&quot;src&quot;&gt;slide 20 · IFRS 13.34&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Liability&lt;/h4&gt;&lt;p&gt;It remains &lt;i&gt;outstanding&lt;/i&gt;: the transferee must fulfil the obligation. It is not settled with the counterparty or otherwise extinguished at the date.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Own equity instrument&lt;/h4&gt;&lt;p&gt;It remains &lt;i&gt;outstanding&lt;/i&gt;: the transferee takes on the rights and responsibilities. It is not cancelled or otherwise extinguished at the date.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;A market for the transfer is often lacking, for example because of contractual restrictions. There may, however, be a market for the same items &lt;b&gt;held by others as assets&lt;/b&gt;: a &lt;i&gt;corporate bond&lt;/i&gt; or a &lt;i&gt;call option&lt;/i&gt; on the entity&#x27;s shares. In all cases, observable inputs are maximised. &lt;span class=&quot;src&quot;&gt;slide 21 · IFRS 13.35-36&lt;/span&gt;&lt;/p&gt;
&lt;h3&gt;Which route to follow&lt;/h3&gt;
&lt;div class=&quot;walker&quot; id=&quot;walk&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;When the price of the corresponding asset is adjusted&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;Only for factors specific to the asset that do not apply to the liability or equity instrument. The asset price must not reflect the effect of a restriction preventing its sale. &lt;span class=&quot;src&quot;&gt;slide 24&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;b&gt;Similar but not identical item&lt;/b&gt;: for example, a different &lt;i&gt;credit quality&lt;/i&gt; of the issuer. &lt;span class=&quot;src&quot;&gt;slide 24 · IFRS 13.39&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Different unit of account&lt;/b&gt;: the price reflects a package with a third-party &lt;i&gt;credit enhancement&lt;/i&gt; (a guarantee improving creditworthiness). If the liability is not the package, the effect of the guarantee is excluded. &lt;span class=&quot;src&quot;&gt;slide 25&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
&lt;h3&gt;Non-performance risk&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;i&gt;Non-performance risk&lt;/i&gt;: the fair value of a liability reflects its effect. It includes, but is not limited to, &lt;i&gt;own credit risk&lt;/i&gt; (the entity&#x27;s own credit risk), and is assumed to be the same before and after the transfer. &lt;span class=&quot;src&quot;&gt;slide 27 · IFRS 13.42&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;The entity considers its own &lt;i&gt;credit standing&lt;/i&gt; and any other factor affecting the likelihood of fulfilment. The effect may vary according to the type of obligation, whether to deliver cash or goods and services, and to any credit enhancements. &lt;span class=&quot;src&quot;&gt;slide 27 · IFRS 13.43&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;bond&quot;&gt;
&lt;h4&gt;The own credit paradox&lt;/h4&gt;
&lt;p class=&quot;note&quot;&gt;Illustrative example, not from the slides: bond issued by the entity, nominal value 100, 4% coupon, 5 years.&lt;/p&gt;
&lt;p style=&quot;font-family:var(--serif);font-size:1.08rem&quot;&gt;FV = Σ&lt;sub&gt;t=1..5&lt;/sub&gt; 4 / (1 + r + s)&lt;sup&gt;t&lt;/sup&gt; + 100 / (1 + r + s)&lt;sup&gt;5&lt;/sup&gt;&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;&lt;i&gt;Credit spread&lt;/i&gt; s, the premium for the entity&#x27;s risk &lt;output id=&quot;o-s&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;s&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;.25&quot; value=&quot;1&quot;&gt;&lt;/label&gt;
&lt;label&gt;&lt;i&gt;Risk-free&lt;/i&gt; rate r &lt;output id=&quot;o-rf&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;rf&quot; min=&quot;0&quot; max=&quot;6&quot; step=&quot;.25&quot; value=&quot;3&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 500 215&quot; role=&quot;img&quot; aria-label=&quot;Curve of the liability&#x27;s fair value as the credit spread increases&quot;&gt;
&lt;path class=&quot;ln&quot; d=&quot;M50 12V180H490&quot;/&gt;&lt;path id=&quot;bcurve&quot; fill=&quot;none&quot; stroke=&quot;var(--f)&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle id=&quot;bdot&quot; r=&quot;6&quot; fill=&quot;var(--accent)&quot;/&gt;
&lt;text class=&quot;m&quot; x=&quot;490&quot; y=&quot;207&quot; text-anchor=&quot;end&quot; font-size=&quot;13&quot;&gt;credit spread s (0–8%)&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;4&quot; y=&quot;22&quot; font-size=&quot;13&quot;&gt;140&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;4&quot; y=&quot;184&quot; font-size=&quot;13&quot;&gt;60&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;4&quot; y=&quot;100&quot; font-size=&quot;13&quot;&gt;100&lt;/text&gt;&lt;path class=&quot;ln&quot; stroke-dasharray=&quot;3 4&quot; d=&quot;M50 96H490&quot;/&gt;
&lt;/svg&gt;
&lt;p&gt;&lt;span class=&quot;big&quot; id=&quot;b-fv&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p id=&quot;b-x&quot; style=&quot;font-size:.95rem&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;External source&lt;/span&gt; Without corrective measures, an entity whose credit deteriorates would record a gain on its own debt. IFRS 9 avoids this effect for liabilities designated at fair value by taking the portion due to own credit to &lt;i&gt;OCI&lt;/i&gt; (&lt;i&gt;other comprehensive income&lt;/i&gt;): &lt;a href=&quot;https://www.bdo.nz/en-nz/blogs/financial-reporting-insights/accounting-for-financial-liabilities-under-ifrs-9&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;BDO&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/meetings/2022/november/iasb/ap3a-financial-liabilities-and-own-credit.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IASB staff paper, 2022&lt;/a&gt;.&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Inseparable third-party guarantee&lt;/h4&gt;&lt;p&gt;If it is accounted for separately, the issuer does &lt;b&gt;not&lt;/b&gt; include the credit enhancement in fair value and looks to its &lt;b&gt;own&lt;/b&gt; credit standing, not that of the guarantor. &lt;span class=&quot;src&quot;&gt;slide 28 · IFRS 13.44&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;Restriction on transfer&lt;/h4&gt;&lt;p&gt;&lt;b&gt;No separate input or adjustment&lt;/b&gt;: the effect is already in the price, because creditor and debtor accepted the transaction price knowing about the restriction. This also holds at subsequent dates. &lt;span class=&quot;src&quot;&gt;slide 29 · IFRS 13.45-46&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Does the fair value of a liability assume its extinguishment?&lt;/summary&gt;&lt;div&gt;No, it assumes a transfer: the liability remains outstanding and the transferee must fulfil it (IFRS 13.34, slide 20).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;How does non-performance risk change after the transfer?&lt;/summary&gt;&lt;div&gt;It is assumed to remain the same (IFRS 13.42, slide 27).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;For debt with a separately accounted third-party guarantee, whose credit standing is relevant?&lt;/summary&gt;&lt;div&gt;That of the issuer, not the guarantor (IFRS 13.44, slide 28).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;An entity&#x27;s debt cannot be transferred under its contract: is a discount added?&lt;/summary&gt;&lt;div&gt;No, the restriction is already included, implicitly or explicitly, in the other inputs (IFRS 13.45, slide 29).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part fam-sla&quot; id=&quot;s7&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Applications&lt;/span&gt;&lt;h2&gt;Fair value at initial recognition&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;To determine whether fair value at initial recognition equals the &lt;i class=&quot;t&quot;&gt;transaction price&lt;/i&gt;, the entity considers factors specific to the transaction and to the item. &lt;span class=&quot;src&quot;&gt;slide 30 · B4&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;plus&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Good to know&lt;/span&gt; The transaction price is the price at which the transaction was entered into, whereas fair value is an exit price. They often coincide, but they remain conceptually different.&lt;/div&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Cases in which the transaction price may not be fair value&quot;&gt;&lt;button role=&quot;tab&quot; data-t=&quot;a&quot;&gt;a. Related parties&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;b&quot;&gt;b. Under duress&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;c&quot;&gt;c. Unit of account&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;d&quot;&gt;d. Different market&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;a&quot;&gt;&lt;p&gt;A transaction between &lt;i&gt;related parties&lt;/i&gt;. The price may still be used as an input if there is evidence that it was on market terms. &lt;span class=&quot;src&quot;&gt;slide 30&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;b&quot; hidden&gt;&lt;p&gt;&lt;i&gt;Under duress&lt;/i&gt;: the seller is forced to accept the price, for example because of financial difficulties. &lt;span class=&quot;src&quot;&gt;slide 30&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;c&quot; hidden&gt;&lt;p&gt;The unit of account of the price differs from that being measured: the item is only one part of the transaction (business combination), there are unstated rights measured separately, or the price includes transaction costs. &lt;span class=&quot;src&quot;&gt;slide 31&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;d&quot; hidden&gt;&lt;p&gt;The market differs from the principal or most advantageous market. A &lt;i&gt;dealer&lt;/i&gt; sells to customers in the &lt;i&gt;retail market&lt;/i&gt;, but its exit market is the one with other dealers. &lt;span class=&quot;src&quot;&gt;slide 31&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;If another IFRS requires or permits fair value at initial recognition and the transaction price differs from it, the resulting &lt;i&gt;gain&lt;/i&gt; or &lt;i&gt;loss&lt;/i&gt; is recognised in &lt;i&gt;profit or loss&lt;/i&gt;, &lt;b&gt;unless that IFRS specifies otherwise&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 32 · IFRS 13.60&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;plus&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Good to know&lt;/span&gt; That “unless” can be seen in the BNP Paribas case (slide 53): for instruments in Level 3, and marginally in Level 2, the initial difference, known as &lt;i&gt;Day One Profit&lt;/i&gt;, is deferred and released to profit or loss over time. See &lt;a href=&quot;#s11&quot;&gt;section 11&lt;/a&gt; for details.&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;List the four cases in B4.&lt;/summary&gt;&lt;div&gt;Related parties, under duress, different unit of account, market other than the principal or most advantageous market (slides 30-31).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Is a price between related parties always unusable?&lt;/summary&gt;&lt;div&gt;No, it may be an input if there is evidence of market terms (B4(a), slide 30).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Where does the difference between the price and initial fair value go?&lt;/summary&gt;&lt;div&gt;To profit or loss, unless the applicable IFRS specifies otherwise (IFRS 13.60, slide 32).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part fam-bri&quot; id=&quot;s8&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Measurement&lt;/span&gt;&lt;h2&gt;Valuation techniques and inputs&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;The entity uses techniques appropriate to the circumstances and for which sufficient data are available, &lt;b&gt;maximising relevant observable inputs and minimising unobservable ones&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;slide 33 · IFRS 13.61&lt;/span&gt; The objective is to estimate the price of an orderly transaction between market participants at the date, under &lt;i&gt;current market conditions&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;slide 33 · IFRS 13.62&lt;/span&gt;&lt;/p&gt;
&lt;h3&gt;Three approaches&lt;/h3&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot; aria-label=&quot;Valuation approaches&quot;&gt;&lt;button role=&quot;tab&quot; data-t=&quot;m&quot;&gt;Market approach&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;c&quot;&gt;Cost approach&lt;/button&gt;&lt;button role=&quot;tab&quot; data-t=&quot;i&quot;&gt;Income approach&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;m&quot;&gt;&lt;p&gt;&lt;b&gt;Market approach.&lt;/b&gt; It uses prices and other information from transactions involving identical or comparable items, or groups such as a business. &lt;span class=&quot;src&quot;&gt;slide 34 · B5&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Guiding question: how much was paid for something identical or similar?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;c&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Cost approach.&lt;/b&gt; It reflects the amount required today to replace the &lt;i&gt;service capacity&lt;/i&gt; of an asset: its &lt;i&gt;current replacement cost&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;slide 34 · B8&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Guiding question: how much would it cost to replace it today?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;i&quot; hidden&gt;&lt;p&gt;&lt;b&gt;Income approach.&lt;/b&gt; It converts future amounts, such as cash flows or income and expenses, into a single current discounted amount, reflecting market expectations. &lt;span class=&quot;src&quot;&gt;slide 34 · B10&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Techniques: &lt;i&gt;present value techniques&lt;/i&gt;, &lt;i&gt;option pricing models&lt;/i&gt; and the &lt;i&gt;multi-period excess earnings method&lt;/i&gt;, used for some intangibles. &lt;span class=&quot;src&quot;&gt;slide 34 · B11&lt;/span&gt;&lt;/p&gt;
&lt;p style=&quot;font-family:var(--serif);font-size:1.08rem&quot;&gt;PV = Σ&lt;sub&gt;t&lt;/sub&gt; CF&lt;sub&gt;t&lt;/sub&gt; / (1 + r)&lt;sup&gt;t&lt;/sup&gt;&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;CF: cash flows expected by the market; r: rate consistent with the risk. Formula added for clarity: it does not appear on the slide.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;The techniques used are consistent with &lt;b&gt;one or more&lt;/b&gt; of these approaches. &lt;span class=&quot;src&quot;&gt;slide 34 · IFRS 13.62&lt;/span&gt;&lt;/p&gt;
&lt;h3&gt;Inputs&lt;/h3&gt;
&lt;p&gt;&lt;i class=&quot;t&quot;&gt;Inputs&lt;/i&gt; are the assumptions that market participants would use when pricing, including assumptions about risk: the risk inherent in the technique, for example a &lt;i&gt;pricing model&lt;/i&gt;, and the risk inherent in the inputs themselves. &lt;span class=&quot;src&quot;&gt;slide 35 · Appendix A&lt;/span&gt;&lt;/p&gt;
&lt;figure class=&quot;sv-lg&quot;&gt;
&lt;svg viewBox=&quot;0 0 560 150&quot; role=&quot;img&quot; aria-label=&quot;Maximising observable inputs and minimising unobservable ones&quot;&gt;
&lt;rect class=&quot;fb&quot; x=&quot;4&quot; y=&quot;8&quot; width=&quot;264&quot; height=&quot;134&quot; rx=&quot;12&quot;/&gt;&lt;rect class=&quot;bx&quot; x=&quot;292&quot; y=&quot;8&quot; width=&quot;264&quot; height=&quot;134&quot; rx=&quot;12&quot;/&gt;
&lt;path class=&quot;ff&quot; d=&quot;M36 86L62 48L88 86H74V124H50V86z&quot;/&gt;&lt;path d=&quot;M324 72H338V34H362V72H376L350 112z&quot; fill=&quot;var(--soft)&quot;/&gt;
&lt;text x=&quot;104&quot; y=&quot;52&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Observable&lt;/text&gt;&lt;text x=&quot;104&quot; y=&quot;76&quot; font-size=&quot;13&quot;&gt;market data,&lt;/text&gt;&lt;text x=&quot;104&quot; y=&quot;94&quot; font-size=&quot;13&quot;&gt;actual events and trades&lt;/text&gt;&lt;text x=&quot;104&quot; y=&quot;124&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;maximise&lt;/text&gt;
&lt;text x=&quot;392&quot; y=&quot;52&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Unobservable&lt;/text&gt;&lt;text x=&quot;392&quot; y=&quot;76&quot; font-size=&quot;13&quot;&gt;best information on&lt;/text&gt;&lt;text x=&quot;392&quot; y=&quot;94&quot; font-size=&quot;13&quot;&gt;market assumptions&lt;/text&gt;&lt;text x=&quot;392&quot; y=&quot;124&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;minimise&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Slides 35-36, IFRS 13.67. The fair value hierarchy derives from this.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Match: prices of comparables, replacement cost, discounting.&lt;/summary&gt;&lt;div&gt;Market approach, cost approach, income approach (slide 34).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;To which approach do Black-Scholes and the multi-period excess earnings method belong?&lt;/summary&gt;&lt;div&gt;To the income approach: B11 cites option pricing models, which include Black-Scholes, and the multi-period excess earnings method (slide 34).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What is the difference between observable and unobservable inputs?&lt;/summary&gt;&lt;div&gt;The former use publicly available market data on actual events or transactions. The latter have no market data and use the best information available on market participants&#x27; assumptions (slide 35).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part fam-bri&quot; id=&quot;s9&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;9&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Measurement&lt;/span&gt;&lt;h2&gt;The fair value hierarchy&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;To increase &lt;b&gt;consistency and comparability&lt;/b&gt;, the standard ranks the inputs to valuation techniques into three levels: the highest priority goes to unadjusted quoted prices in active markets, the lowest to unobservable inputs. &lt;span class=&quot;src&quot;&gt;slide 37 · IFRS 13.72&lt;/span&gt; Click the levels.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;figure class=&quot;sv-md&quot; style=&quot;margin-bottom:.4rem&quot;&gt;
&lt;svg viewBox=&quot;0 0 520 260&quot; role=&quot;tablist&quot; aria-label=&quot;Levels of the fair value hierarchy&quot;&gt;
&lt;g class=&quot;pyr-b&quot; role=&quot;tab&quot; tabindex=&quot;0&quot; data-t=&quot;l1&quot;&gt;&lt;polygon class=&quot;fb&quot; points=&quot;170,10 230,10 280,80 120,80&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Level 1&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;pyr-b&quot; role=&quot;tab&quot; tabindex=&quot;0&quot; data-t=&quot;l2&quot;&gt;&lt;polygon class=&quot;fb&quot; points=&quot;114,88 286,88 336,160 64,160&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Level 2&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;pyr-b&quot; role=&quot;tab&quot; tabindex=&quot;0&quot; data-t=&quot;l3&quot;&gt;&lt;polygon class=&quot;fb&quot; points=&quot;58,168 342,168 394,244 6,244&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;212&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;Level 3&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; marker-end=&quot;url(#a)&quot; d=&quot;M260 47H402&quot;/&gt;&lt;path class=&quot;ln&quot; marker-end=&quot;url(#a)&quot; d=&quot;M314 126H402&quot;/&gt;&lt;path class=&quot;ln&quot; marker-end=&quot;url(#a)&quot; d=&quot;M372 208H402&quot;/&gt;
&lt;text x=&quot;408&quot; y=&quot;42&quot; font-size=&quot;13&quot;&gt;Low&lt;/text&gt;&lt;text x=&quot;408&quot; y=&quot;58&quot; font-size=&quot;13&quot;&gt;disclosure&lt;/text&gt;&lt;text x=&quot;408&quot; y=&quot;121&quot; font-size=&quot;13&quot;&gt;Medium&lt;/text&gt;&lt;text x=&quot;408&quot; y=&quot;137&quot; font-size=&quot;13&quot;&gt;disclosure&lt;/text&gt;&lt;text x=&quot;408&quot; y=&quot;203&quot; font-size=&quot;13&quot;&gt;High&lt;/text&gt;&lt;text x=&quot;408&quot; y=&quot;219&quot; font-size=&quot;13&quot;&gt;disclosure&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Slide 38. The more subjective the inputs, the more disclosure is required.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;panebox&quot;&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;l1&quot;&gt;
&lt;h4&gt;Level 1: quoted, identical, unadjusted prices&lt;/h4&gt;
&lt;p&gt;Quoted prices in active markets for &lt;b&gt;identical&lt;/b&gt; items that the entity can access at the date. &lt;span class=&quot;src&quot;&gt;slide 39 · IFRS 13.76&lt;/span&gt; They are &lt;b&gt;the most reliable evidence&lt;/b&gt; and are used without adjustment whenever available. &lt;span class=&quot;src&quot;&gt;IFRS 13.77&lt;/span&gt; They are available for many financial instruments, including those traded on several markets. The focus is on &lt;b&gt;which&lt;/b&gt; market is the principal or most advantageous market and whether the entity can transact in it at that price. &lt;span class=&quot;src&quot;&gt;slides 39-40 · IFRS 13.78&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;The only permitted adjustments, all of which result in a measurement &lt;b&gt;below Level 1&lt;/b&gt;: &lt;span class=&quot;src&quot;&gt;slides 41-43 · IFRS 13.79&lt;/span&gt;&lt;/p&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;1. Many similar items, with prices that are hard to access individually&lt;/summary&gt;&lt;div&gt;For many similar but not identical securities, for example &lt;i&gt;debt securities&lt;/i&gt;, an alternative method such as &lt;i&gt;matrix pricing&lt;/i&gt;, which estimates the price from comparable securities, may be used as a &lt;i&gt;practical expedient&lt;/i&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;2. Significant events after the market closes&lt;/summary&gt;&lt;div&gt;The price does not represent fair value if, between the close and the measurement date, events occur such as trades in a &lt;i&gt;principal-to-principal market&lt;/i&gt; (direct negotiation between the parties) or a &lt;i&gt;brokered market&lt;/i&gt; (through an intermediary), or announcements. A policy applied consistently is required.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;3. Liability or equity quoted as an asset, with specific factors&lt;/summary&gt;&lt;div&gt;If the price of the identical item traded as an asset has to be adjusted for specific factors (paragraph 39), the measurement falls to a lower level. Without adjustment it remains Level 1.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;l2&quot; hidden&gt;
&lt;h4&gt;Level 2: other observable inputs&lt;/h4&gt;
&lt;p&gt;Inputs other than Level 1 prices, observable directly or indirectly. Where there is a contractual term, they must be observable for substantially the full term. &lt;span class=&quot;src&quot;&gt;slide 45 · IFRS 13.81&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;Quoted prices for &lt;b&gt;similar&lt;/b&gt; items in active markets.&lt;/li&gt;&lt;li&gt;Prices for &lt;b&gt;identical or similar&lt;/b&gt; items in markets that are &lt;b&gt;not active&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;Other observable inputs: &lt;i&gt;interest rates&lt;/i&gt; and &lt;i&gt;yield curves&lt;/i&gt; observable at commonly quoted intervals, &lt;i&gt;implied volatilities&lt;/i&gt;, &lt;i&gt;credit spreads&lt;/i&gt;.&lt;/li&gt;&lt;li&gt;&lt;i&gt;Market-corroborated inputs&lt;/i&gt;: inputs confirmed by market data.&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Adjustments depend on condition or location, comparability and the volume or level of activity in the market. &lt;span class=&quot;src&quot;&gt;slide 46 · IFRS 13.83&lt;/span&gt; A significant adjustment based on unobservable inputs &lt;b&gt;may result in Level 3&lt;/b&gt;. &lt;span class=&quot;src&quot;&gt;IFRS 13.84&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;pane&quot; data-p=&quot;l3&quot; hidden&gt;
&lt;h4&gt;Level 3: unobservable inputs&lt;/h4&gt;
&lt;p&gt;They are used to the extent that observable inputs are not available, for example where there is little market activity. &lt;b&gt;The objective does not change&lt;/b&gt;: an exit price at the date, from the perspective of a market participant. &lt;span class=&quot;src&quot;&gt;slide 47 · IFRS 13.86-87&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;b&gt;Risk&lt;/b&gt;: without the risk adjustment that market participants would include, the measurement is not fair value. &lt;span class=&quot;src&quot;&gt;slide 48 · IFRS 13.88&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Own data&lt;/b&gt;: the entity&#x27;s own data may be the starting point, but they must be adjusted if others would use different data or if there is something not available to others, such as an &lt;i&gt;entity-specific synergy&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;slide 49 · IFRS 13.89&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Effort&lt;/b&gt;: no exhaustive search is required, but all reasonably available information must be considered. &lt;span class=&quot;src&quot;&gt;slide 49&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;widget&quot; id=&quot;pq&quot;&gt;
&lt;h4&gt;Large position, same price: P × Q&lt;/h4&gt;
&lt;p&gt;For a position in a single quoted item, Level 1 is &lt;b&gt;price × quantity&lt;/b&gt;, even if daily trading volume cannot absorb the position and a block sale would move the price. &lt;span class=&quot;src&quot;&gt;slide 44 · IFRS 13.80&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;ctrl&quot;&gt;
&lt;label&gt;Quantity held &lt;output id=&quot;o-q&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;q&quot; min=&quot;100000&quot; max=&quot;5000000&quot; step=&quot;100000&quot; value=&quot;1000000&quot;&gt;&lt;/label&gt;
&lt;label&gt;Quoted price (€) &lt;output id=&quot;o-pp&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;pp&quot; min=&quot;5&quot; max=&quot;50&quot; value=&quot;20&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;p&gt;&lt;span class=&quot;big&quot; id=&quot;pq-fv&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;p id=&quot;pq-x&quot; style=&quot;font-size:.95rem&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;note&quot;&gt;Illustrative figures; assumed daily volume: 200,000 securities.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;widget game&quot; id=&quot;game&quot;&gt;
&lt;h4&gt;Which level?&lt;/h4&gt;
&lt;p class=&quot;item&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;stepnav&quot; style=&quot;margin-top:0&quot;&gt;&lt;button class=&quot;btn&quot; data-l=&quot;1&quot;&gt;Level 1&lt;/button&gt;&lt;button class=&quot;btn&quot; data-l=&quot;2&quot;&gt;Level 2&lt;/button&gt;&lt;button class=&quot;btn&quot; data-l=&quot;3&quot;&gt;Level 3&lt;/button&gt;&lt;/div&gt;
&lt;p class=&quot;fb&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;stepnav&quot;&gt;&lt;span class=&quot;idx&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-n&gt;Next case&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;plus&quot;&gt;&lt;span class=&quot;lab&quot;&gt;Good to know&lt;/span&gt; The level is assigned to the entire measurement based on the lowest-level input that is significant. The rule appears in the BNP Paribas policy, slide 53, which states it as its own.&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;External source&lt;/span&gt; The same rule is in para. 73 of IFRS 13, and para. 93 lists the disclosure, which is more extensive for Level 3 (reconciliation, quantitative inputs, sensitivity). Paragraph numbers should be verified against the &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs13.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;official text of IFRS 13&lt;/a&gt;.&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Three circumstances permitting an adjustment to Level 1, and the consequence.&lt;/summary&gt;&lt;div&gt;Many similar items with matrix pricing, events after the close, liability or equity with specific factors. In all cases the measurement falls below Level 1 (IFRS 13.79, slides 41-43).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Can a discount be applied to a very large quoted holding?&lt;/summary&gt;&lt;div&gt;No: in Level 1 it remains price × quantity, even if the market could not absorb the block (IFRS 13.80, slide 44).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Can an entity&#x27;s own business plan be used for a Level 3 input?&lt;/summary&gt;&lt;div&gt;Yes as a starting point, but it must be adjusted if other market participants would use different data or if it includes entity-specific synergies (IFRS 13.89, slide 49).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Can risk be ignored in Level 3 because it is difficult to estimate?&lt;/summary&gt;&lt;div&gt;No: the measurement would not be fair value if market participants would include an adjustment (IFRS 13.88, slide 48).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;part fam-acc&quot; id=&quot;s10&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;10&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Disclosure&lt;/span&gt;&lt;h2&gt;Disclosure: the proposed amendment that did not go ahead&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Slide 50 reports the &lt;i&gt;feedback summary&lt;/i&gt; of the &lt;i&gt;Disclosure Initiative – Targeted Standards-level Review of Disclosures&lt;/i&gt;, March 2023.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;The problem&lt;/h4&gt;&lt;p&gt;Users find the disclosure useful, but often too detailed on immaterial measurements and scarce on material ones: much detail on Level 3, little on material Level 2 measurements close to Level 3 in terms of uncertainty. It is also costly. &lt;span class=&quot;src&quot;&gt;slide 50&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;h4&gt;The proposal&lt;/h4&gt;&lt;p&gt;Replace the requirements with overall and specific objectives calling for judgement; avoid referring to the levels of the hierarchy; indicate the detail needed; list the useful information. &lt;span class=&quot;src&quot;&gt;slide 50&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Why the IASB decided not to proceed&lt;/h3&gt;
&lt;ol&gt;
&lt;li&gt;IFRS 13 had been chosen mainly to test the &lt;i&gt;Guidance&lt;/i&gt; on drafting requirements.&lt;/li&gt;
&lt;li&gt;The &lt;i&gt;Post-implementation Review&lt;/i&gt; had found the disclosure useful.&lt;/li&gt;
&lt;li&gt;An entity judging the information on Level 2 measurements close to Level 3 to be material would provide it anyway, by applying para. 31 of IAS 1.&lt;/li&gt;
&lt;li&gt;Work on this disclosure was not a priority in the &lt;i&gt;Third Agenda Consultation&lt;/i&gt;.&lt;/li&gt;
&lt;/ol&gt;
&lt;p class=&quot;note&quot;&gt;Slide 50. The IASB discussed the comments in February and May 2022.&lt;/p&gt;
&lt;h3&gt;Timeline&lt;/h3&gt;
&lt;ul class=&quot;tl&quot;&gt;
&lt;li&gt;&lt;b&gt;Sep 2006&lt;/b&gt; · SFAS 157 &lt;span class=&quot;src&quot;&gt;external&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;May 2011&lt;/b&gt; · IASB issues IFRS 13 &lt;span class=&quot;src&quot;&gt;external&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;1 Jan 2013&lt;/b&gt; · IFRS 13 becomes effective &lt;span class=&quot;src&quot;&gt;slide 2&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Dec 2018&lt;/b&gt; · The Post-implementation Review concludes that the standard works as intended &lt;span class=&quot;src&quot;&gt;external&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Mar 2021&lt;/b&gt; · Exposure Draft on IFRS 13 and IAS 19 &lt;span class=&quot;src&quot;&gt;external&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Feb and May 2022&lt;/b&gt; · The IASB discusses the comments &lt;span class=&quot;src&quot;&gt;slide 50&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Oct 2022&lt;/b&gt; · Decision not to proceed on IFRS 13 and IAS 19 &lt;span class=&quot;src&quot;&gt;external&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Mar 2023&lt;/b&gt; · &lt;i&gt;Feedback statement&lt;/i&gt; (the document responding to the comments) &lt;span class=&quot;src&quot;&gt;slide 50&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;1 Jan 2027&lt;/b&gt; · IFRS 18 replaces IAS 1 &lt;span class=&quot;src&quot;&gt;external&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;lab&quot;&gt;External source&lt;/span&gt; External dates from: &lt;a href=&quot;https://www.iasplus.com/en/news/2018/12/pir-ifrs-13&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus on the PIR&lt;/a&gt;, &lt;a href=&quot;https://www.ifrs.org/projects/completed-projects/2023/standards-level-review-of-disclosures/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IASB project page&lt;/a&gt;, &lt;a href=&quot;https://www.iasplus.com/en-ca/projects/ifrs/exposure-drafts/disclosure-initiative-targeted-standards-level-review-of-disclosures-research&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus on the project&lt;/a&gt;, &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 18&lt;/a&gt;. Para. 31 of IAS 1, cited on the slide, will therefore need to be reread in light of IFRS 18: I have not verified the corresponding provision.&lt;/div&gt;
&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;What shortcoming did users report?&lt;/summary&gt;&lt;div&gt;Too much detail on immaterial measurements, in particular Level 3, and too little on material ones, such as Level 2 measurements close to Level 3 in terms of uncertainty (slide 50).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Were the proposed amendments approved?&lt;/summary&gt;&lt;div&gt;No: the IASB decided not to continue work on the disclosure in IFRS 13 (slide 50).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;q&quot;&gt;&lt;summary&gt;Why does the lack of amendment not deprive users of material Level 2 information?&lt;/summary&gt;&lt;div&gt;If it is material, para. 31 of IAS 1 would lead entities to provide it anyway (slide 50).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;part fam-acc&quot; id=&quot;s11&quot;&gt;
&lt;div class=&quot;parthead&quot;&gt;&lt;span class=&quot;num&quot;&gt;11&lt;/span&gt;&lt;span class=&quot;kicker&quot;&gt;Case&lt;/span&gt;&lt;h2&gt;BNP Paribas, 2025 consolidated financial statements&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;For entities operating in financial markets, such as banks, determining fair value correctly is crucial. The slides use the consolidated accounts at 31 December 2025, labelled as &lt;i&gt;unaudited figures&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;slide 51&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;bnp&quot;&gt;
&lt;h4&gt;The hierarchy in figures (€ million)&lt;/h4&gt;
&lt;div class=&quot;stepnav&quot; style=&quot;margin:.2rem 0 .5rem&quot;&gt;
&lt;button class=&quot;btn on&quot; data-y=&quot;2025&quot;&gt;2025&lt;/button&gt;&lt;button class=&quot;btn&quot; data-y=&quot;2024&quot;&gt;2024&lt;/button&gt;&lt;span style=&quot;width:.7rem&quot;&gt;&lt;/span&gt;
&lt;button class=&quot;btn on&quot; data-side=&quot;a&quot;&gt;Assets&lt;/button&gt;&lt;button class=&quot;btn&quot; data-side=&quot;l&quot;&gt;Liabilities&lt;/button&gt;
&lt;/div&gt;
