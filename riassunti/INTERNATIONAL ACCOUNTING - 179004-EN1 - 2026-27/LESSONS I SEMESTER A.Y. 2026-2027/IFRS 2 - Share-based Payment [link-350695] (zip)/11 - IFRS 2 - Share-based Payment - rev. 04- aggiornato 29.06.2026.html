&lt;h1&gt;&lt;b&gt;IFRS 2&lt;/b&gt; Share-based Payment&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;Come si rilevano in bilancio i pagamenti basati su azioni: stock option, share appreciation rights, piani con alternativa cash e piani di gruppo.&lt;/p&gt;
&lt;p class=&quot;meta&quot;&gt;Slide del Prof. Roberto Aprile · Università degli Studi di Bergamo, Dipartimento di Scienze Aziendali · Master Degree in Accounting, Governance and Sustainability · A.A. 2026-2027 · rev. 04 del 29.06.2026 (48 slide)&lt;/p&gt;
&lt;div class=&quot;oneliner&quot;&gt;&lt;strong&gt;In una frase.&lt;/strong&gt; Quando un&#x27;impresa “paga” beni o servizi (quasi sempre il lavoro dei dipendenti) con &lt;em&gt;proprie azioni od opzioni&lt;/em&gt;, oppure con &lt;em&gt;denaro il cui importo dipende dal prezzo delle azioni&lt;/em&gt;, deve rilevare un &lt;strong&gt;costo&lt;/strong&gt;; la contropartita è il &lt;strong&gt;patrimonio netto&lt;/strong&gt; nel primo caso (&lt;em&gt;equity-settled&lt;/em&gt;) e un &lt;strong&gt;debito&lt;/strong&gt; rimisurato nel tempo nel secondo (&lt;em&gt;cash-settled&lt;/em&gt;).&lt;/div&gt;
&lt;div class=&quot;legend&quot;&gt;&lt;span class=&quot;k-sage&quot;&gt;Parte I · Fondamenta&lt;/span&gt;&lt;span class=&quot;k-slate&quot;&gt;Parte II · Equity-settled&lt;/span&gt;&lt;span class=&quot;k-brick&quot;&gt;Parte III · Cash-settled e alternative&lt;/span&gt;&lt;span class=&quot;k-ochre&quot;&gt;Parte IV · Gruppo, disclosure, caso&lt;/span&gt;&lt;/div&gt;
&lt;p class=&quot;gl&quot; style=&quot;font-size:.85rem&quot;&gt;Legenda dei contrassegni: &lt;span class=&quot;badge&quot;&gt;slide&lt;/span&gt; contenuto delle slide · &lt;span class=&quot;badge add&quot;&gt;integrazione&lt;/span&gt; spiegazione aggiunta per capire (non nelle slide) · &lt;span class=&quot;badge ext&quot;&gt;fonte esterna&lt;/span&gt; dato preso dal web, con link.&lt;/p&gt;
&lt;/div&gt;&lt;/header&gt;

&lt;div class=&quot;sec-h&quot; style=&quot;--c:var(--accent)&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Mappa concettuale&lt;/span&gt;&lt;h2&gt;Gli argomenti e come si collegano&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Clicca un riquadro per saltare alla sezione. Le frecce indicano il rapporto logico: le definizioni alimentano le due grandi famiglie (equity-settled e cash-settled); le transazioni con alternativa cash e quelle di gruppo sono “smistate” verso l&#x27;una o l&#x27;altra famiglia.&lt;/p&gt;

&lt;svg viewBox=&quot;0 0 960 540&quot; role=&quot;img&quot; aria-label=&quot;Mappa concettuale di IFRS 2&quot;&gt;

&lt;g&gt;

&lt;!-- ================= PARTE I ================= --&gt;
&lt;div class=&quot;part p-sage&quot;&gt;&lt;div class=&quot;pn&quot;&gt;Parte I&lt;/div&gt;&lt;h2&gt;Fondamenta: obiettivo, perimetro, definizioni&lt;/h2&gt;&lt;p&gt;Che cosa regola IFRS 2, quando si applica e con quale vocabolario.&lt;/p&gt;&lt;/div&gt;

&lt;section id=&quot;obiettivo&quot; class=&quot;sec p-sage&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Objective · par. 1&lt;/span&gt;&lt;h2&gt;Perché esiste IFRS 2&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;quote&quot;&gt;“The objective of this IFRS is to specify the financial reporting by an entity when it undertakes a &lt;em&gt;share-based payment transaction&lt;/em&gt;.”&lt;small&gt;IFRS 2.1 · slide 2&lt;/small&gt;&lt;/div&gt;
&lt;p&gt;Una &lt;dfn&gt;share-based payment transaction&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(operazione di pagamento basato su azioni)&lt;/span&gt; è uno scambio in cui l&#x27;impresa riceve beni o servizi e li remunera con strumenti del proprio capitale, oppure con un importo in denaro agganciato al valore di quegli strumenti. IFRS 2 chiede di riflettere gli effetti di queste operazioni nel &lt;dfn&gt;profit or loss&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(conto economico)&lt;/span&gt; e nella &lt;dfn&gt;financial position&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(situazione patrimoniale-finanziaria)&lt;/span&gt;, &lt;strong&gt;comprese le spese per le share options assegnate ai dipendenti&lt;/strong&gt;.&lt;/p&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;strong&gt;L&#x27;idea di fondo&lt;/strong&gt; &lt;span class=&quot;badge add&quot;&gt;integrazione&lt;/span&gt;&lt;br&gt;Un servizio ricevuto è un costo, qualunque sia la “moneta” con cui lo si paga. Se un manager lavora tre anni in cambio di opzioni, l&#x27;impresa consuma una risorsa (il lavoro) esattamente come se gli pagasse uno stipendio: non rilevare un costo farebbe apparire l&#x27;utile più alto di quanto sia. Per anni, in molti ordinamenti, le stock option ai dipendenti non passavano dal conto economico; IFRS 2 (emesso nel 2004, vedi &lt;a href=&quot;#approfondire&quot;&gt;Per approfondire&lt;/a&gt;) ha chiuso questo vuoto.&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;

&lt;section id=&quot;scope&quot; class=&quot;sec p-sage&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Scope · par. 2–6A&lt;/span&gt;&lt;h2&gt;Quando si applica (e quando no)&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;IFRS 2 si applica a &lt;strong&gt;tutte&lt;/strong&gt; le share-based payment transactions, &lt;em&gt;anche se l&#x27;impresa non riesce a identificare specificamente&lt;/em&gt; alcuni o tutti i beni o servizi ricevuti (IFRS 2.2). Tre famiglie:&lt;/p&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card k-slate&quot; style=&quot;border-top:4px solid var(--slate)&quot;&gt;&lt;strong&gt;a) Equity-settled&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;gl&quot;&gt;regolate con strumenti di capitale dell&#x27;impresa&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--brick)&quot;&gt;&lt;strong&gt;b) Cash-settled&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;gl&quot;&gt;regolate in denaro, per importi basati sul prezzo delle azioni&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--ochre)&quot;&gt;&lt;strong&gt;c) Con scelta&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;gl&quot;&gt;l&#x27;impresa &lt;em&gt;o&lt;/em&gt; il fornitore può scegliere tra cash (o altre attività) e strumenti di capitale&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Per &lt;em&gt;goods&lt;/em&gt; lo standard intende rimanenze, materiali di consumo, immobili impianti e macchinari, attività immateriali e altre attività non finanziarie (IFRS 2.5).&lt;/p&gt;

&lt;h3&gt;Il caso di gruppo (IFRS 2.3A)&lt;/h3&gt;
&lt;p&gt;L&#x27;operazione può essere regolata da &lt;strong&gt;un&#x27;altra entità del gruppo&lt;/strong&gt; (o da un azionista di una qualsiasi entità del gruppo) per conto dell&#x27;entità che riceve i beni o servizi. IFRS 2 si applica quindi anche all&#x27;entità che (a) &lt;em&gt;riceve&lt;/em&gt; i beni o servizi mentre è un&#x27;altra a dover pagare, oppure (b) &lt;em&gt;ha l&#x27;obbligo di pagare&lt;/em&gt; mentre è un&#x27;altra a ricevere i servizi — &lt;strong&gt;a meno che&lt;/strong&gt; l&#x27;operazione abbia chiaramente uno scopo diverso dal pagamento di beni o servizi forniti. Come si contabilizza lo vediamo in &lt;a href=&quot;#gruppo&quot;&gt;Parte IV&lt;/a&gt;.&lt;/p&gt;

&lt;h3&gt;Le esclusioni&lt;/h3&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Azionista (2.4)&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Aggregazioni (2.5)&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Strumenti finanziari (2.6)&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
&lt;p&gt;&lt;strong&gt;Rapporto in qualità di azionista.&lt;/strong&gt; Una transazione con un dipendente (o altra parte) &lt;em&gt;in quanto detentore di strumenti di capitale&lt;/em&gt; dell&#x27;impresa non è share-based payment.&lt;/p&gt;
&lt;p&gt;Esempio delle slide: l&#x27;impresa offre a &lt;em&gt;tutti&lt;/em&gt; i titolari di una classe di azioni il diritto di comprarne altre a un prezzo inferiore al fair value (un&#x27;offerta in opzione, &lt;em&gt;rights issue&lt;/em&gt;). Se un dipendente riceve quel diritto perché è azionista, il diritto non rientra in IFRS 2: non remunera il suo lavoro.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;strong&gt;Business combinations e joint venture.&lt;/strong&gt; IFRS 2 non si applica ai beni acquisiti come parte delle attività nette in una &lt;dfn&gt;business combination&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(aggregazione aziendale, IFRS 3)&lt;/span&gt;, in una combinazione tra entità &lt;em&gt;under common control&lt;/em&gt; &lt;span class=&quot;gl&quot;&gt;(sotto controllo comune, IFRS 3 B1–B4)&lt;/span&gt;, né al conferimento di un business alla costituzione di una &lt;em&gt;joint venture&lt;/em&gt; (IFRS 11).&lt;/p&gt;
&lt;ul class=&quot;chk&quot;&gt;
&lt;li&gt;Azioni emesse &lt;strong&gt;per ottenere il controllo&lt;/strong&gt; dell&#x27;acquisita → fuori (sono il corrispettivo IFRS 3).&lt;/li&gt;
&lt;li&gt;Strumenti assegnati ai &lt;strong&gt;dipendenti dell&#x27;acquisita in quanto dipendenti&lt;/strong&gt; (es. per restare in servizio) → dentro IFRS 2.&lt;/li&gt;
&lt;li&gt;Cancellazione, sostituzione o modifica di piani &lt;em&gt;a causa&lt;/em&gt; di un&#x27;aggregazione o ristrutturazione del capitale → IFRS 2.&lt;/li&gt;
&lt;/ul&gt;
&lt;p class=&quot;note&quot;&gt;È IFRS 3 a dire se gli strumenti emessi sono corrispettivo per il controllo (IFRS 3) o compenso per servizi futuri da rilevare dopo l&#x27;aggregazione (IFRS 2). Ripassa la lezione del corso su IFRS 3.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;strong&gt;Contratti nell&#x27;ambito di IAS 32 (par. 8–10) o IFRS 9 (par. 2.4–2.7).&lt;/strong&gt; Se l&#x27;impresa riceve beni o servizi tramite un contratto che rientra in quei paragrafi, si applicano gli standard sugli strumenti finanziari, non IFRS 2.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;badge add&quot;&gt;integrazione&lt;/span&gt; Quei paragrafi riguardano i contratti di acquisto o vendita di elementi non finanziari che possono essere regolati “net” in denaro o con altri strumenti finanziari (es. una fornitura di materie prime regolabile per differenza), salvo quelli stipulati per l&#x27;uso proprio dell&#x27;impresa. Sono trattati come derivati, non come compenso per beni o servizi.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Prova tu: dentro o fuori IFRS 2?&lt;/h3&gt;
&lt;p class=&quot;gl&quot;&gt;Scegli una risposta per ogni caso: ricevi subito la spiegazione.&lt;/p&gt;
&lt;div class=&quot;clf&quot;&gt;
&lt;div class=&quot;clf-item&quot; data-correct=&quot;in&quot;&gt;&lt;div&gt;1. Ai dirigenti vengono assegnate stock option esercitabili se restano in azienda per tre anni.&lt;/div&gt;&lt;div class=&quot;bt&quot;&gt;&lt;button class=&quot;btn&quot; data-a=&quot;in&quot;&gt;Dentro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-a=&quot;out&quot;&gt;Fuori&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;span class=&quot;res&quot;&gt;&lt;/span&gt;È il caso tipico di equity-settled share-based payment: opzioni in cambio di servizi, con una service condition.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;clf-item&quot; data-correct=&quot;in&quot;&gt;&lt;div&gt;2. I venditori riceveranno tra due anni un bonus in euro pari all&#x27;aumento del prezzo dell&#x27;azione.&lt;/div&gt;&lt;div class=&quot;bt&quot;&gt;&lt;button class=&quot;btn&quot; data-a=&quot;in&quot;&gt;Dentro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-a=&quot;out&quot;&gt;Fuori&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;span class=&quot;res&quot;&gt;&lt;/span&gt;Cash-settled: si paga denaro, ma l&#x27;importo dipende dal prezzo delle azioni (è una share appreciation right).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;clf-item&quot; data-correct=&quot;out&quot;&gt;&lt;div&gt;3. Aumento di capitale in opzione a tutti gli azionisti a prezzo scontato; un dipendente-azionista sottoscrive.&lt;/div&gt;&lt;div class=&quot;bt&quot;&gt;&lt;button class=&quot;btn&quot; data-a=&quot;in&quot;&gt;Dentro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-a=&quot;out&quot;&gt;Fuori&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;span class=&quot;res&quot;&gt;&lt;/span&gt;Fuori (IFRS 2.4): il dipendente riceve il diritto in quanto azionista, non come compenso per il lavoro.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;clf-item&quot; data-correct=&quot;out&quot;&gt;&lt;div&gt;4. L&#x27;impresa emette azioni per acquistare il controllo di una società target.&lt;/div&gt;&lt;div class=&quot;bt&quot;&gt;&lt;button class=&quot;btn&quot; data-a=&quot;in&quot;&gt;Dentro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-a=&quot;out&quot;&gt;Fuori&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;span class=&quot;res&quot;&gt;&lt;/span&gt;Fuori (IFRS 2.5): è il corrispettivo di una business combination, disciplinato da IFRS 3.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;clf-item&quot; data-correct=&quot;in&quot;&gt;&lt;div&gt;5. Dopo l&#x27;acquisizione, ai dipendenti della target si promettono azioni se restano altri due anni.&lt;/div&gt;&lt;div class=&quot;bt&quot;&gt;&lt;button class=&quot;btn&quot; data-a=&quot;in&quot;&gt;Dentro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-a=&quot;out&quot;&gt;Fuori&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;span class=&quot;res&quot;&gt;&lt;/span&gt;Dentro (IFRS 2.5): strumenti assegnati ai dipendenti dell&#x27;acquisita in quanto dipendenti, in cambio di servizio futuro.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;clf-item&quot; data-correct=&quot;in&quot;&gt;&lt;div&gt;6. La capogruppo assegna proprie azioni ai dipendenti di una controllata.&lt;/div&gt;&lt;div class=&quot;bt&quot;&gt;&lt;button class=&quot;btn&quot; data-a=&quot;in&quot;&gt;Dentro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-a=&quot;out&quot;&gt;Fuori&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;span class=&quot;res&quot;&gt;&lt;/span&gt;Dentro (IFRS 2.3A): la controllata riceve i servizi, la capogruppo regola; entrambe applicano IFRS 2.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;clf-item&quot; data-correct=&quot;out&quot;&gt;&lt;div&gt;7. Contratto di acquisto di una commodity regolabile per differenza in denaro, nell&#x27;ambito di IFRS 9.&lt;/div&gt;&lt;div class=&quot;bt&quot;&gt;&lt;button class=&quot;btn&quot; data-a=&quot;in&quot;&gt;Dentro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-a=&quot;out&quot;&gt;Fuori&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;span class=&quot;res&quot;&gt;&lt;/span&gt;Fuori (IFRS 2.6): ricade negli standard sugli strumenti finanziari (IAS 32 / IFRS 9).&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;definizioni&quot; class=&quot;sec p-sage&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Defined terms · Appendix A&lt;/span&gt;&lt;h2&gt;Il vocabolario dello standard&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-left:4px solid var(--slate)&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Equity-settled share-based payment transaction&lt;/h4&gt;L&#x27;impresa
&lt;ul class=&quot;chk&quot;&gt;&lt;li&gt;riceve beni o servizi come corrispettivo per i propri &lt;strong&gt;equity instruments&lt;/strong&gt; &lt;span class=&quot;gl&quot;&gt;(strumenti rappresentativi di capitale: azioni o share options)&lt;/span&gt;, &lt;em&gt;oppure&lt;/em&gt;&lt;/li&gt;&lt;li&gt;riceve beni o servizi ma &lt;strong&gt;non ha alcun obbligo di regolare&lt;/strong&gt; l&#x27;operazione con il fornitore (paga qualcun altro del gruppo).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-left:4px solid var(--brick)&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Cash-settled share-based payment transaction&lt;/h4&gt;L&#x27;impresa acquisisce beni o servizi &lt;strong&gt;assumendo una passività&lt;/strong&gt; a trasferire cash o altre attività al fornitore, per importi &lt;strong&gt;basati sul prezzo (o valore) degli strumenti di capitale&lt;/strong&gt; dell&#x27;impresa o di un&#x27;altra entità del gruppo.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Share-based payment arrangement&lt;/h4&gt;Accordo tra l&#x27;impresa (o un&#x27;altra entità del gruppo, o un azionista di qualsiasi entità del gruppo) e un&#x27;altra parte, anche un dipendente, che le dà diritto a ricevere (i) cash o altre attività per importi basati sul prezzo di strumenti di capitale, oppure (ii) strumenti di capitale — &lt;strong&gt;purché siano soddisfatte le eventuali vesting conditions&lt;/strong&gt;.
&lt;p class=&quot;note&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;strong&gt;Group&lt;/strong&gt; = “a parent and its subsidiaries” dal punto di vista della capogruppo ultima (Appendix A di IFRS 10). Ripassa la lezione su IFRS 10 per il concetto di controllo.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Vesting condition&lt;/h4&gt;Condizione che determina se l&#x27;impresa &lt;strong&gt;riceve i servizi&lt;/strong&gt; che danno diritto alla controparte di ottenere cash, altre attività o strumenti di capitale. Può essere una &lt;dfn&gt;service condition&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(condizione di permanenza in servizio per un certo periodo)&lt;/span&gt; o una &lt;dfn&gt;performance condition&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(condizione di risultato: servizio + un obiettivo, es. crescita degli utili o del prezzo dell&#x27;azione)&lt;/span&gt;. To &lt;dfn&gt;vest&lt;/dfn&gt; significa “maturare”: diventare un diritto incondizionato.&lt;/div&gt;

&lt;h3&gt;Fair value: due definizioni da non confondere&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-label=&quot;Confronto tra definizioni di fair value&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;360&quot; height=&quot;200&quot; rx=&quot;16&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot; stroke-width=&quot;1.6&quot;/&gt;
&lt;rect x=&quot;390&quot; y=&quot;10&quot; width=&quot;360&quot; height=&quot;200&quot; rx=&quot;16&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot; stroke-width=&quot;1.6&quot;/&gt;
&lt;text x=&quot;190&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;17&quot;&gt;IFRS 2 · Appendix A&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;17&quot;&gt;IFRS 13 · Appendix A&lt;/text&gt;
&lt;text x=&quot;190&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;importo a cui un&#x27;attività, una passività&lt;/text&gt;
&lt;text x=&quot;190&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;o uno strumento di capitale assegnato&lt;/text&gt;
&lt;text x=&quot;190&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;potrebbe essere scambiato tra&lt;/text&gt;
&lt;text x=&quot;190&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;parti consapevoli e disponibili&lt;/text&gt;
&lt;text x=&quot;190&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;in una transazione arm&#x27;s length&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;prezzo che si riceverebbe per vendere&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;un&#x27;attività o si pagherebbe per trasferire&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;una passività in una&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;transazione ordinata tra operatori&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;di mercato alla data di valutazione&lt;/text&gt;
&lt;text x=&quot;190&quot; y=&quot;235&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--sage)&quot; font-weight=&quot;600&quot;&gt;← per IFRS 2 si usa QUESTA&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;235&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; class=&quot;f-mut&quot;&gt;“exit price”, market-based&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Slide 9: per applicare IFRS 2 si fa riferimento alla definizione di IFRS 2, non a quella di IFRS 13.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;&lt;span class=&quot;badge add&quot;&gt;integrazione&lt;/span&gt; &lt;em&gt;Arm&#x27;s length&lt;/em&gt; significa “a condizioni di libero mercato”, tra parti indipendenti. La definizione IFRS 2 guarda allo scambio tra due parti consapevoli; quella IFRS 13 è un &lt;em&gt;exit price&lt;/em&gt; visto dagli operatori di mercato. IFRS 13 stesso esclude dal proprio ambito le share-based payment transactions di IFRS 2 (IFRS 13.6), proprio per evitare conflitti: le opzioni ai dipendenti non hanno un vero mercato, e si valutano con modelli di &lt;em&gt;option pricing&lt;/em&gt; (es. Black-Scholes-Merton o binomiale).&lt;/p&gt;

&lt;h3&gt;Glossario operativo &lt;span class=&quot;badge add&quot;&gt;integrazione&lt;/span&gt;&lt;/h3&gt;
&lt;p class=&quot;gl&quot;&gt;Termini che le slide usano senza definirli. Apri quelli che non ti sono chiari.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Grant date&lt;/summary&gt;&lt;div&gt;Data di assegnazione: il giorno in cui impresa e controparte si accordano sul piano e hanno una comprensione condivisa di termini e condizioni. Se serve un&#x27;approvazione (es. dell&#x27;assemblea), è la data dell&#x27;approvazione. Per i dipendenti è la data in cui si misura il fair value.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Vesting period e vesting date&lt;/summary&gt;&lt;div&gt;Il &lt;em&gt;vesting period&lt;/em&gt; è il periodo in cui devono realizzarsi tutte le vesting conditions; la &lt;em&gt;vesting date&lt;/em&gt; è il giorno in cui il diritto matura. Il costo si distribuisce lungo il vesting period.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Measurement date&lt;/summary&gt;&lt;div&gt;Data a cui si misura il fair value degli strumenti assegnati: grant date per i dipendenti; data in cui si ottengono i beni o la controparte presta il servizio per le altre controparti.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Share option / stock option ed exercise price&lt;/summary&gt;&lt;div&gt;Diritto (non obbligo) di comprare azioni a un prezzo fissato, l&#x27;&lt;em&gt;exercise price&lt;/em&gt; (prezzo di esercizio), entro un certo periodo. Vale qualcosa perché, se il prezzo dell&#x27;azione sale oltre lo strike, il titolare guadagna la differenza.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Intrinsic value&lt;/summary&gt;&lt;div&gt;Differenza tra prezzo corrente dell&#x27;azione e prezzo di esercizio (se positiva). Il fair value di un&#x27;opzione è di solito maggiore del valore intrinseco, perché include anche il valore del tempo residuo.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Share appreciation right (SAR)&lt;/summary&gt;&lt;div&gt;Diritto a ricevere in denaro (di solito) l&#x27;aumento di valore dell&#x27;azione oltre un livello base in un dato periodo. È l&#x27;esempio classico di cash-settled.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Market condition e non-vesting condition&lt;/summary&gt;&lt;div&gt;&lt;em&gt;Market condition&lt;/em&gt;: performance condition legata al prezzo o al valore degli strumenti di capitale (es. prezzo obiettivo dell&#x27;azione, total shareholder return). &lt;em&gt;Non-vesting condition&lt;/em&gt;: condizione che non serve a stabilire se l&#x27;impresa riceve i servizi (es. l&#x27;obbligo per il dipendente di continuare a versare in un piano di risparmio collegato alle azioni). Le trattiamo in &lt;a href=&quot;#vesting&quot;&gt;Vesting conditions&lt;/a&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Forfeit&lt;/summary&gt;&lt;div&gt;Perdere il diritto: chi lascia l&#x27;impresa prima della vesting date di solito &lt;em&gt;forfeits&lt;/em&gt; le proprie opzioni.&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;selfcheck&quot;&gt;&lt;h3&gt;Autoverifica · Parte I&lt;/h3&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;IFRS 2 si applica se l&#x27;impresa non riesce a identificare i beni o servizi ricevuti?&lt;/summary&gt;&lt;div&gt;Sì. IFRS 2.2 si applica a tutte le share-based payment transactions “whether or not the entity can identify specifically some or all of the goods or services received”.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;Una controllata riceve servizi pagati dalla capogruppo con azioni della capogruppo. La controllata applica IFRS 2?&lt;/summary&gt;&lt;div&gt;Sì (IFRS 2.3A): si applica all&#x27;entità che riceve beni o servizi quando un&#x27;altra entità del gruppo ha l&#x27;obbligo di regolare, salvo uno scopo chiaramente diverso dal pagamento.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;Qual è la differenza essenziale tra equity-settled e cash-settled?&lt;/summary&gt;&lt;div&gt;Nella contropartita del costo: aumento di patrimonio netto (si consegnano strumenti di capitale, o l&#x27;entità non ha obbligo di pagare) contro passività da pagare in cash per un importo agganciato al prezzo delle azioni.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;Per valutare uno strumento IFRS 2 si usa la definizione di fair value di IFRS 13?&lt;/summary&gt;&lt;div&gt;No. Si usa quella di IFRS 2 Appendix A: importo di scambio tra parti consapevoli e disponibili in una transazione arm&#x27;s length.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ================= PARTE II ================= --&gt;
&lt;div class=&quot;part p-slate&quot;&gt;&lt;div class=&quot;pn&quot;&gt;Parte II&lt;/div&gt;&lt;h2&gt;Equity-settled share-based payment&lt;/h2&gt;&lt;p&gt;Misurazione, tempi di rilevazione, vesting conditions, forme di assegnazione ed esercizi (par. 10–29).&lt;/p&gt;&lt;/div&gt;

&lt;section id=&quot;equity&quot; class=&quot;sec p-slate&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Par. 10–15&lt;/span&gt;&lt;h2&gt;Misurare e rilevare&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Principio (IFRS 2.10): l&#x27;impresa misura i beni o servizi ricevuti, e il corrispondente &lt;strong&gt;aumento di patrimonio netto&lt;/strong&gt;, &lt;strong&gt;direttamente&lt;/strong&gt; al fair value dei beni o servizi ricevuti; se quel fair value &lt;em&gt;non è stimabile in modo attendibile&lt;/em&gt;, li misura &lt;strong&gt;indirettamente&lt;/strong&gt;, con riferimento al fair value degli strumenti di capitale assegnati.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;formula&quot;&gt;Dr Costo del bene / servizio ricevuto&lt;br&gt;Cr Patrimonio netto (riserva speciale)&lt;small&gt;Le due frecce di slide 10: il costo scende nel conto economico, la riserva sale nell&#x27;equity&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:14px 0&quot;&gt;&lt;strong&gt;Direttamente&lt;/strong&gt; = valore di ciò che ricevo.&lt;br&gt;&lt;strong&gt;Indirettamente&lt;/strong&gt; = valore di ciò che do (le azioni/opzioni).&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Chi è la controparte? Due percorsi&lt;/h3&gt;

&lt;text x=&quot;170&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--paper)&quot;&gt;Sempre INDIRETTO&lt;/text&gt;
&lt;text x=&quot;170&quot; y=&quot;262&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--paper)&quot;&gt;FV degli strumenti assegnati&lt;/text&gt;
