&lt;text x=&quot;480&quot; y=&quot;196&quot; font-size=&quot;11&quot; class=&quot;f-mut&quot;&gt;FV attendibile (regola)&lt;/text&gt;&lt;text x=&quot;650&quot; y=&quot;196&quot; font-size=&quot;11&quot; class=&quot;f-mut&quot;&gt;raro: non attendibile&lt;/text&gt;
&lt;rect x=&quot;360&quot; y=&quot;212&quot; width=&quot;200&quot; height=&quot;96&quot; rx=&quot;12&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;
&lt;text x=&quot;460&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;DIRETTO&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;262&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;FV beni/servizi&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;284&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;alla data di ricevimento&lt;/text&gt;
&lt;rect x=&quot;575&quot; y=&quot;212&quot; width=&quot;175&quot; height=&quot;96&quot; rx=&quot;12&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre)&quot;/&gt;
&lt;text x=&quot;662&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;INDIRETTO&lt;/text&gt;&lt;text x=&quot;662&quot; y=&quot;262&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;FV strumenti&lt;/text&gt;&lt;text x=&quot;662&quot; y=&quot;284&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;alla data di ricevimento&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Per i dipendenti la data è la grant date; per gli altri è la data in cui l&#x27;impresa ottiene i beni o la controparte presta il servizio (slide 11–12).&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;Perché per i dipendenti si usa sempre il metodo indiretto? (IFRS 2.12)&lt;/summary&gt;&lt;div&gt;Le azioni o opzioni fanno parte del pacchetto retributivo insieme a stipendio e benefit: di solito non si può misurare quale parte del servizio “paga” ciascuna componente, né valutare il pacchetto nel suo insieme senza valutare le opzioni. Spesso, poi, le opzioni sono un bonus o un incentivo a restare o a migliorare i risultati: l&#x27;impresa paga una remunerazione aggiuntiva per benefici aggiuntivi difficili da stimare. Le slide 20 aggiungono: lo stock option plan dà un beneficio aggiuntivo “non direttamente collegato” alla retribuzione e quindi non misurabile rispetto ad essa.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché per gli altri fornitori vale la presunzione contraria? (IFRS 2.13)&lt;/summary&gt;&lt;div&gt;Un consulente o un fornitore di beni ha di norma un prezzo di mercato per ciò che fornisce. La presunzione che il fair value sia stimabile è &lt;em&gt;rebuttable&lt;/em&gt; (confutabile): solo in rari casi si passa al metodo indiretto, misurato comunque alla data di ricevimento, non alla grant date.&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;Quando rilevare il costo: la vita di un piano&lt;/h3&gt;
&lt;p&gt;Se gli strumenti &lt;strong&gt;maturano subito&lt;/strong&gt; (&lt;em&gt;vest immediately&lt;/em&gt;), si presume che il servizio sia già stato reso: costo e riserva &lt;strong&gt;interi alla grant date&lt;/strong&gt; (IFRS 2.14). Se maturano solo dopo un &lt;strong&gt;periodo di servizio&lt;/strong&gt;, i servizi si considerano ricevuti in futuro e si rilevano &lt;strong&gt;man mano lungo il vesting period&lt;/strong&gt; (IFRS 2.15): con tre anni di servizio richiesti, il costo si spalma sui tre anni; con una performance condition di durata variabile, sul &lt;em&gt;expected vesting period&lt;/em&gt; (periodo di maturazione atteso).&lt;/p&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;svg viewBox=&quot;0 0 760 120&quot; role=&quot;img&quot; aria-label=&quot;Linea del tempo di una stock option&quot;&gt;
&lt;line x1=&quot;30&quot; y1=&quot;60&quot; x2=&quot;730&quot; y2=&quot;60&quot; class=&quot;s-rule&quot; stroke-width=&quot;3&quot;/&gt;
&lt;rect class=&quot;hl&quot; data-hl=&quot;1&quot; x=&quot;80&quot; y=&quot;48&quot; width=&quot;330&quot; height=&quot;24&quot; rx=&quot;6&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;
&lt;rect class=&quot;hl&quot; data-hl=&quot;3&quot; x=&quot;410&quot; y=&quot;48&quot; width=&quot;290&quot; height=&quot;24&quot; rx=&quot;6&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre)&quot;/&gt;
&lt;circle class=&quot;hl&quot; data-hl=&quot;0&quot; cx=&quot;80&quot; cy=&quot;60&quot; r=&quot;10&quot; style=&quot;fill:var(--slate)&quot;/&gt;
&lt;circle class=&quot;hl&quot; data-hl=&quot;2&quot; cx=&quot;410&quot; cy=&quot;60&quot; r=&quot;10&quot; style=&quot;fill:var(--slate)&quot;/&gt;
&lt;circle class=&quot;hl&quot; data-hl=&quot;4&quot; cx=&quot;700&quot; cy=&quot;60&quot; r=&quot;10&quot; style=&quot;fill:var(--brick)&quot;/&gt;
&lt;text x=&quot;80&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;grant date&lt;/text&gt;
&lt;text x=&quot;245&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;vesting period&lt;/text&gt;
&lt;text x=&quot;410&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;vesting date&lt;/text&gt;
&lt;text x=&quot;555&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;exercise period&lt;/text&gt;
&lt;text x=&quot;700&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;esercizio / scadenza&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Grant date&lt;/h4&gt;&lt;p&gt;Si firma il piano. Per i dipendenti si fissa qui, una volta per tutte, il &lt;strong&gt;fair value unitario&lt;/strong&gt; delle opzioni. Se maturano subito: tutto il costo oggi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Vesting period&lt;/h4&gt;&lt;p&gt;A ogni chiusura si rileva la quota di costo maturata: &lt;em&gt;Dr Costo del personale / Cr Riserva stock option&lt;/em&gt;. Il numero di opzioni attese a maturare si aggiorna con la migliore stima (true-up).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Vesting date&lt;/h4&gt;&lt;p&gt;La stima viene allineata al numero &lt;strong&gt;effettivamente maturato&lt;/strong&gt;. Da qui il totale del costo è definitivo.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · Dopo la vesting date (IFRS 2.23)&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Nessun aggiustamento&lt;/strong&gt; al patrimonio netto totale: anche se le opzioni maturate vengono poi perse o non esercitate, il costo &lt;strong&gt;non si storna&lt;/strong&gt;. È ammesso solo un trasferimento &lt;em&gt;all&#x27;interno&lt;/em&gt; del patrimonio netto (es. dalla riserva stock option agli utili portati a nuovo).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;5 · Esercizio o scadenza&lt;/h4&gt;&lt;p&gt;Se il dipendente esercita, la riserva si chiude contro capitale sociale e sovrapprezzo (vedi &lt;a href=&quot;#grant&quot;&gt;grant types&lt;/a&gt;). Se l&#x27;opzione scade “fuori dai soldi”, la riserva resta nel patrimonio netto (al più si riclassifica).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;st-bar&quot;&gt;&lt;button class=&quot;btn st-prev&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn st-next&quot;&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;st-count&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;vesting&quot; class=&quot;sec p-slate&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Par. 19–21A, 23&lt;/span&gt;&lt;h2&gt;Vesting e non-vesting conditions&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;La regola chiave: &lt;strong&gt;alcune condizioni entrano nel prezzo, altre nel numero&lt;/strong&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Costo cumulato&lt;sub&gt;t&lt;/sub&gt; = N° strumenti attesi a maturare × FV unitario (grant date) × anni trascorsi ⁄ vesting period&lt;small&gt;Costo dell&#x27;esercizio t = Costo cumulato&lt;sub&gt;t&lt;/sub&gt; − Costo cumulato&lt;sub&gt;t−1&lt;/sub&gt; · formula usata negli esercizi delle slide 41–43&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Tipo di condizione&lt;/th&gt;&lt;th&gt;Esempio&lt;/th&gt;&lt;th&gt;Nel FV unitario?&lt;/th&gt;&lt;th&gt;Nel numero (true-up)?&lt;/th&gt;&lt;th&gt;Se non soddisfatta…&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Service condition&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;restare 3 anni&lt;/td&gt;&lt;td class=&quot;no&quot;&gt;No&lt;/td&gt;&lt;td class=&quot;yes&quot;&gt;Sì&lt;/td&gt;&lt;td&gt;costo cumulato azzerato&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Non-market performance&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;crescita utile del 10%&lt;/td&gt;&lt;td class=&quot;no&quot;&gt;No&lt;/td&gt;&lt;td class=&quot;yes&quot;&gt;Sì&lt;/td&gt;&lt;td&gt;costo cumulato azzerato&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Market condition&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;azione oltre € 50&lt;/td&gt;&lt;td class=&quot;yes&quot;&gt;Sì&lt;/td&gt;&lt;td class=&quot;no&quot;&gt;No&lt;/td&gt;&lt;td&gt;costo resta, se il servizio è reso&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Non-vesting condition&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;versamenti in un piano di risparmio&lt;/td&gt;&lt;td class=&quot;yes&quot;&gt;Sì&lt;/td&gt;&lt;td class=&quot;no&quot;&gt;No&lt;/td&gt;&lt;td&gt;costo resta, se il servizio è reso&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;ul class=&quot;chk&quot;&gt;
&lt;li&gt;&lt;strong&gt;IFRS 2.19&lt;/strong&gt; — Le vesting conditions diverse dalle market conditions &lt;em&gt;non&lt;/em&gt; entrano nella stima del fair value alla measurement date: si riflettono rettificando il &lt;strong&gt;numero&lt;/strong&gt; di strumenti, così che alla fine il costo si basi sugli strumenti che maturano davvero. Se non maturano per mancato servizio o mancata performance non di mercato, su base cumulata &lt;strong&gt;non si rileva nulla&lt;/strong&gt;.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;IFRS 2.20&lt;/strong&gt; — Durante il vesting period si usa la migliore stima del numero atteso, rivista se emergono nuove informazioni; alla vesting date la stima diventa il numero effettivo.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;IFRS 2.21&lt;/strong&gt; — Le &lt;strong&gt;market conditions&lt;/strong&gt; si incorporano nel fair value. Il costo si rileva per chi soddisfa tutte le altre condizioni (es. resta in servizio) &lt;em&gt;a prescindere&lt;/em&gt; dalla market condition.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;IFRS 2.21A&lt;/strong&gt; — Lo stesso vale per le &lt;strong&gt;non-vesting conditions&lt;/strong&gt;: dentro il fair value; costo rilevato per chi soddisfa le vesting conditions non di mercato, a prescindere dalle non-vesting.&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;strong&gt;Perché questa asimmetria?&lt;/strong&gt; &lt;span class=&quot;badge add&quot;&gt;integrazione&lt;/span&gt; Un modello di option pricing sa già “prezzare” la probabilità che l&#x27;azione raggiunga un certo livello: quella probabilità sconta il fair value in partenza. Rettificare anche il numero significherebbe contarla due volte. Le condizioni di servizio e di risultato contabile, invece, non si prestano a un modello di mercato e si gestiscono stimando quante opzioni matureranno.&lt;/div&gt;

&lt;h3&gt;Simulatore: il costo resta o si storna?&lt;/h3&gt;
&lt;div class=&quot;card&quot; id=&quot;vsim&quot;&gt;
&lt;p class=&quot;gl&quot; style=&quot;margin-bottom:8px&quot;&gt;Piano illustrativo: 1.000 opzioni, FV unitario alla grant date € 10, vesting 3 anni. Scegli il tipo di condizione e l&#x27;esito.&lt;/p&gt;
&lt;div class=&quot;presets&quot; id=&quot;vs-type&quot;&gt;&lt;button class=&quot;btn on&quot; data-vt=&quot;service&quot;&gt;Service&lt;/button&gt;&lt;button class=&quot;btn&quot; data-vt=&quot;perf&quot;&gt;Non-market performance&lt;/button&gt;&lt;button class=&quot;btn&quot; data-vt=&quot;market&quot;&gt;Market condition&lt;/button&gt;&lt;button class=&quot;btn&quot; data-vt=&quot;nonv&quot;&gt;Non-vesting&lt;/button&gt;&lt;/div&gt;
&lt;label style=&quot;display:block;margin:8px 0&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;vs-serv&quot; checked&gt; Il dipendente resta in servizio per tutti i 3 anni&lt;/label&gt;
&lt;label style=&quot;display:block;margin:8px 0&quot; id=&quot;vs-cond-l&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;vs-cond&quot; checked&gt; &lt;span id=&quot;vs-cond-t&quot;&gt;La condizione è soddisfatta&lt;/span&gt;&lt;/label&gt;
&lt;div class=&quot;result&quot; id=&quot;vs-out&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;grant&quot; class=&quot;sec p-slate&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Slide 20–22&lt;/span&gt;&lt;h2&gt;Stock option e forme di assegnazione&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Una &lt;dfn&gt;stock option&lt;/dfn&gt; dà al titolare il diritto di comprare azioni della società a un certo prezzo. Nei piani con tutte le caratteristiche dell&#x27;equity-settled bisogna stimare il &lt;strong&gt;fair value degli strumenti assegnati&lt;/strong&gt;, perché il fair value dei servizi ricevuti non è misurabile in modo attendibile. Durante il vesting period si alimenta sempre una &lt;strong&gt;riserva stock option&lt;/strong&gt;; ciò che cambia è cosa succede alla fine della vita delle opzioni.&lt;/p&gt;
&lt;p class=&quot;gl&quot;&gt;Numeri illustrativi &lt;span class=&quot;badge add&quot;&gt;integrazione&lt;/span&gt;: 1.000 opzioni maturate, FV unitario alla grant date € 10 (riserva accumulata € 10.000), valore nominale dell&#x27;azione € 1. Le slide descrivono le scritture solo a parole.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Free of charge&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;In mixed form&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Treasury shares&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
&lt;p&gt;&lt;strong&gt;Assegnazione gratuita.&lt;/strong&gt; Alla fine della vita delle opzioni la riserva si chiude e si registra l&#x27;aumento di capitale; se il fair value supera il nominale nasce una &lt;strong&gt;riserva sovrapprezzo&lt;/strong&gt; (&lt;em&gt;share premium reserve&lt;/em&gt;).&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table class=&quot;je&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Conto&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Dare&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Avere&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Riserva stock option&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;cr&quot;&gt;Capitale sociale (1.000 × € 1)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;cr&quot;&gt;Riserva sovrapprezzo&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;9.000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;strong&gt;Forma mista&lt;/strong&gt;: una parte è gratuita (il servizio), una parte la paga il beneficiario (il prezzo di esercizio, qui € 4 per azione). Si storna la riserva per la parte gratuita, si rileva un &lt;strong&gt;credito&lt;/strong&gt; verso il beneficiario per la parte pagata e si registra l&#x27;aumento di capitale. Il sovrapprezzo è in parte differenza tra fair value e nominale, in parte quota pagata.&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table class=&quot;je&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Conto&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Dare&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Avere&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Crediti v/beneficiari (1.000 × € 4)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;4.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Riserva stock option&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;cr&quot;&gt;Capitale sociale&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1.000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;cr&quot;&gt;Riserva sovrapprezzo (9.000 + 4.000)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;13.000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;strong&gt;Con azioni proprie in portafoglio&lt;/strong&gt; (&lt;em&gt;treasury shares&lt;/em&gt;): non si emettono nuove azioni, si consegnano quelle riacquistate. Si storna la riserva e si rileva la &lt;strong&gt;plusvalenza&lt;/strong&gt; (l&#x27;impresa le aveva pagate meno del fair value) o la &lt;strong&gt;minusvalenza&lt;/strong&gt; (le aveva pagate di più) legata all&#x27;uscita delle azioni dal portafoglio. Esempio: azioni proprie in carico a € 12.&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table class=&quot;je&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Conto&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Dare&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Avere&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Riserva stock option&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Differenza negativa su azioni proprie&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2.000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;cr&quot;&gt;Azioni proprie (1.000 × € 12)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;12.000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;badge add&quot;&gt;integrazione&lt;/span&gt; Secondo IAS 32.33 su acquisto, vendita, emissione o cancellazione di azioni proprie non si rilevano utili o perdite a conto economico: la differenza resta nel patrimonio netto.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;strong&gt;Modifiche alle condizioni&lt;/strong&gt; (slide 22). Se cambiano le condizioni di un piano con un dipendente, possono verificarsi eventi favorevoli o sfavorevoli per lui, da analizzare e riflettere in bilancio. &lt;span class=&quot;badge add&quot;&gt;integrazione&lt;/span&gt; In sintesi, IFRS 2.27: si rileva sempre almeno il costo misurato alla grant date originaria; una modifica che &lt;em&gt;aumenta&lt;/em&gt; il fair value (es. riduzione dello strike) aggiunge un costo incrementale; una modifica sfavorevole non riduce il costo.&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;esercizi&quot; class=&quot;sec p-slate&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Slide 41–43&lt;/span&gt;&lt;h2&gt;Esercizi: il piano Kudasai&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;Dati comuni:&lt;/strong&gt; Kudasai assegna &lt;strong&gt;300 share options&lt;/strong&gt; a ciascuno dei suoi &lt;strong&gt;1.500 dipendenti&lt;/strong&gt; (450.000 opzioni), a condizione che restino in azienda per i prossimi &lt;strong&gt;3 anni&lt;/strong&gt;. Fair value di ciascuna opzione alla grant date: &lt;strong&gt;€ 315&lt;/strong&gt;. Stima iniziale: il &lt;strong&gt;20%&lt;/strong&gt; dei dipendenti lascerà e perderà le opzioni.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Exercise 1&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Exercise 2 passo per passo&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
&lt;p&gt;Le stime non cambiano mai e alla fine matura esattamente l&#x27;80%. Il costo è identico ogni anno.&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Calcolo&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Costo a P&amp;amp;L&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Anno 1&lt;/td&gt;&lt;td&gt;450.000 × 80% × € 315 × 1/3&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;37.800.000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Anno 2&lt;/td&gt;&lt;td&gt;(450.000 × 80% × € 315 × 2/3) − 37.800.000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;37.800.000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Anno 3&lt;/td&gt;&lt;td&gt;(450.000 × 80% × € 315) − 75.600.000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;37.800.000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;strong&gt;Totale = riserva stock option&lt;/strong&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;strong&gt;113.400.000&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;div class=&quot;stepper&quot; data-stepper style=&quot;margin:0;border:none;padding:0&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Punto di partenza&lt;/h4&gt;&lt;p&gt;450.000 opzioni, FV € 315 fissato alla grant date. Stima uscite 20% (300 dipendenti). &lt;strong&gt;Il FV unitario non cambierà mai&lt;/strong&gt;: si aggiorna solo il numero (service condition → true-up).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Anno 1&lt;/h4&gt;&lt;p&gt;Escono 60 dipendenti; la stima delle uscite totali scende dal 20% al &lt;strong&gt;18%&lt;/strong&gt; (270). Si stima che maturi l&#x27;82%.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;450.000 × 82% × 315 × 1/3 = &lt;strong&gt;38.745.000&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Anno 2&lt;/h4&gt;&lt;p&gt;Escono altri 66 dipendenti (126 in totale); stima rivista al &lt;strong&gt;19%&lt;/strong&gt; (285). Cumulato 81% × 2/3, meno quanto già rilevato.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;450.000 × 81% × 315 × 2/3 = 76.545.000&lt;br&gt;76.545.000 − 38.745.000 = &lt;strong&gt;37.800.000&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Anno 3 · vesting date&lt;/h4&gt;&lt;p&gt;Escono altri 45 (171 in totale). Restano 1.329 dipendenti × 300 = &lt;strong&gt;398.700&lt;/strong&gt; opzioni maturate: la stima diventa il numero effettivo.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;398.700 × 315 = 125.590.500&lt;br&gt;125.590.500 − 76.545.000 = &lt;strong&gt;49.045.500&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Lettura del risultato&lt;/h4&gt;&lt;p&gt;Costo totale 125.590.500 = opzioni effettivamente maturate × FV alla grant date. Il costo dell&#x27;anno 3 è più alto perché recupera (&lt;em&gt;catch-up&lt;/em&gt;) la differenza tra la stima precedente (81%) e il dato effettivo (88,6%). Nessun ricalcolo del FV, nessun effetto del prezzo dell&#x27;azione.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;st-bar&quot;&gt;&lt;button class=&quot;btn st-prev&quot;&gt;← Indietro&lt;/button&gt;&lt;button class=&quot;btn st-next&quot;&gt;Avanti →&lt;/button&gt;&lt;span class=&quot;st-count&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Calcolatore: cambia le ipotesi&lt;/h3&gt;
&lt;div class=&quot;card&quot; id=&quot;calc&quot;&gt;
&lt;div class=&quot;presets&quot;&gt;&lt;button class=&quot;btn&quot; data-pre=&quot;1&quot;&gt;Carica Exercise 1&lt;/button&gt;&lt;button class=&quot;btn&quot; data-pre=&quot;2&quot;&gt;Carica Exercise 2&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;c-emp&quot;&gt;Dipendenti&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;c-emp&quot; min=&quot;100&quot; max=&quot;3000&quot; step=&quot;50&quot; value=&quot;1500&quot;&gt;&lt;output id=&quot;o-emp&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;c-opt&quot;&gt;Opzioni per dipendente&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;c-opt&quot; min=&quot;50&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;300&quot;&gt;&lt;output id=&quot;o-opt&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;c-fv&quot;&gt;FV unitario (grant date) €&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;c-fv&quot; min=&quot;10&quot; max=&quot;600&quot; step=&quot;5&quot; value=&quot;315&quot;&gt;&lt;output id=&quot;o-fv&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;c-p1&quot;&gt;Uscite stimate a fine anno 1&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;c-p1&quot; min=&quot;0&quot; max=&quot;50&quot; step=&quot;1&quot; value=&quot;18&quot;&gt;&lt;output id=&quot;o-p1&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;c-p2&quot;&gt;Uscite stimate a fine anno 2&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;c-p2&quot; min=&quot;0&quot; max=&quot;50&quot; step=&quot;1&quot; value=&quot;19&quot;&gt;&lt;output id=&quot;o-p2&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;c-v&quot;&gt;Dipendenti che maturano (anno 3)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;c-v&quot; min=&quot;0&quot; max=&quot;3000&quot; step=&quot;1&quot; value=&quot;1329&quot;&gt;&lt;output id=&quot;o-v&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table id=&quot;c-tab&quot;&gt;&lt;/table&gt;&lt;/div&gt;
&lt;svg id=&quot;c-chart&quot; viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;Costo annuo e cumulato&quot;&gt;&lt;/svg&gt;
&lt;p class=&quot;note&quot;&gt;Barre: costo dell&#x27;anno. Linea: costo cumulato (= riserva stock option). Prova ad alzare molto le uscite stimate negli anni 1–2 lasciando invariato il numero finale: vedrai il catch-up dell&#x27;anno 3.&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;selfcheck&quot;&gt;&lt;h3&gt;Autoverifica · Parte II&lt;/h3&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;A quale data si misura il fair value delle opzioni assegnate ai dipendenti? E per un consulente esterno?&lt;/summary&gt;&lt;div&gt;Dipendenti: grant date (IFRS 2.11). Altre controparti: data in cui l&#x27;impresa ottiene i beni o la controparte presta il servizio (IFRS 2.13).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;Un dipendente esce al secondo anno di un piano con service condition di tre anni. Che succede al costo già rilevato per lui?&lt;/summary&gt;&lt;div&gt;Si storna tramite il true-up: su base cumulata non si rileva alcun costo per strumenti che non maturano per mancato servizio (IFRS 2.19–20).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;Il piano richiede che l&#x27;azione arrivi a € 50; il dipendente resta tre anni ma l&#x27;azione si ferma a € 40. Si storna il costo?&lt;/summary&gt;&lt;div&gt;No. È una market condition, già considerata nel fair value: il costo si rileva per chi soddisfa le altre condizioni, a prescindere dalla market condition (IFRS 2.21).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;Le opzioni maturate scadono senza essere esercitate. Si può stornare il costo?&lt;/summary&gt;&lt;div&gt;No (IFRS 2.23). Si può solo trasferire l&#x27;importo da una voce all&#x27;altra del patrimonio netto.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;Nell&#x27;Exercise 2, perché il costo del terzo anno è 49.045.500 e non circa 38 milioni?&lt;/summary&gt;&lt;div&gt;Perché alla vesting date la stima (81%) si allinea al dato effettivo (1.329/1.500 = 88,6%): il terzo anno assorbe l&#x27;intero aggiustamento cumulato.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ================= PARTE III ================= --&gt;
&lt;div class=&quot;part p-brick&quot;&gt;&lt;div class=&quot;pn&quot;&gt;Parte III&lt;/div&gt;&lt;h2&gt;Cash-settled e transazioni con alternativa cash&lt;/h2&gt;&lt;p&gt;Quando l&#x27;impresa deve pagare denaro, o quando qualcuno può scegliere tra denaro e azioni (par. 30–43).&lt;/p&gt;&lt;/div&gt;

&lt;section id=&quot;cash&quot; class=&quot;sec p-brick&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Par. 30–33D&lt;/span&gt;&lt;h2&gt;Cash-settled: una passività che si rimisura&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Principio (IFRS 2.30): l&#x27;impresa misura i beni o servizi acquisiti e la &lt;strong&gt;passività&lt;/strong&gt; sostenuta al &lt;strong&gt;fair value della passività&lt;/strong&gt;. Finché non la estingue, la &lt;strong&gt;rimisura a ogni data di bilancio e alla data di regolamento&lt;/strong&gt;, con le variazioni di fair value &lt;strong&gt;a conto economico&lt;/strong&gt;.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;formula&quot;&gt;Dr Costo del bene / servizio&lt;br&gt;Cr Debito (liability a fair value)&lt;small&gt;Slide 23: sorge una passività misurata a FV; si rileva il costo&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;Δ fair value della passività&lt;br&gt;→ profit or loss del periodo&lt;small&gt;Fino al regolamento (IFRS 2.30)&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Le share appreciation rights&lt;/h3&gt;
&lt;p&gt;Esempio delle slide: le &lt;dfn&gt;share appreciation rights&lt;/dfn&gt; (SAR). Il costo e il debito si rilevano &lt;strong&gt;man mano che i dipendenti prestano servizio&lt;/strong&gt; (IFRS 2.32):&lt;/p&gt;
&lt;ul class=&quot;chk&quot;&gt;&lt;li&gt;SAR che maturano &lt;strong&gt;subito&lt;/strong&gt;: in assenza di prova contraria si presume che il servizio sia già reso → costo e debito &lt;strong&gt;immediati&lt;/strong&gt;.&lt;/li&gt;&lt;li&gt;SAR che maturano dopo un &lt;strong&gt;periodo di servizio&lt;/strong&gt;: costo e debito si rilevano lungo quel periodo.&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;Il debito si misura, inizialmente e a ogni chiusura fino al regolamento, al &lt;strong&gt;fair value delle SAR&lt;/strong&gt;, applicando un &lt;em&gt;option pricing model&lt;/em&gt; che tenga conto di termini e condizioni dell&#x27;assegnazione e della misura in cui i dipendenti hanno già prestato servizio (IFRS 2.33).&lt;/p&gt;
&lt;h3&gt;Condizioni nei piani cash-settled (33A–33D)&lt;/h3&gt;
&lt;ul class=&quot;chk&quot;&gt;
&lt;li&gt;&lt;strong&gt;33A&lt;/strong&gt; — Vesting conditions non di mercato: &lt;em&gt;fuori&lt;/em&gt; dal fair value; si riflettono rettificando il &lt;strong&gt;numero di awards&lt;/strong&gt; nella misura del debito.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;33B&lt;/strong&gt; — Si rileva un importo lungo il vesting period in base alla migliore stima degli awards attesi; stima rivista quando serve e, alla vesting date, pari agli awards maturati.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;33C&lt;/strong&gt; — Market conditions e non-vesting conditions: &lt;em&gt;dentro&lt;/em&gt; il fair value, sia alla rilevazione iniziale sia a ogni rimisurazione.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;33D&lt;/strong&gt; — Risultato: il &lt;strong&gt;costo cumulato&lt;/strong&gt; rilevato è &lt;strong&gt;uguale al cash pagato&lt;/strong&gt;.&lt;/li&gt;
&lt;/ul&gt;
&lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;badge ext&quot;&gt;fonte esterna&lt;/span&gt; I paragrafi 33A–33D derivano dall&#x27;emendamento del giugno 2016 “Classification and Measurement of Share-based Payment Transactions” (&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-2-share-based-payment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;pagina IFRS 2 su ifrs.org&lt;/a&gt;), che ha allineato il trattamento delle condizioni a quello degli equity-settled.&lt;/p&gt;

&lt;h3&gt;Simulatore: cash-settled contro equity-settled&lt;/h3&gt;
&lt;div class=&quot;card&quot; id=&quot;sar&quot;&gt;
&lt;p class=&quot;gl&quot; style=&quot;margin-bottom:8px&quot;&gt;&lt;span class=&quot;badge add&quot;&gt;integrazione · esempio illustrativo&lt;/span&gt; 100 dipendenti × 200 SAR = 20.000 SAR, vesting 3 anni, tutti restano, pagamento a fine anno 3 pari al valore della SAR in quel momento. Confronto con un piano equity-settled identico valutato alla grant date.&lt;/p&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;s-g&quot;&gt;FV alla grant date €&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-g&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;o-g&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;s-1&quot;&gt;FV SAR a fine anno 1 €&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-1&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;12&quot;&gt;&lt;output id=&quot;o-1&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;s-2&quot;&gt;FV SAR a fine anno 2 €&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-2&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;15&quot;&gt;&lt;output id=&quot;o-2&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;s-3&quot;&gt;Valore pagato a fine anno 3 €&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-3&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;9&quot;&gt;&lt;output id=&quot;o-3&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table id=&quot;s-tab&quot;&gt;&lt;/table&gt;&lt;/div&gt;
&lt;svg id=&quot;s-chart&quot; viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;Costo annuo cash-settled ed equity-settled&quot;&gt;&lt;/svg&gt;
&lt;p class=&quot;note&quot;&gt;Nota come nel cash-settled il costo di un anno possa diventare &lt;strong&gt;negativo&lt;/strong&gt; (ricavo) se il valore dell&#x27;azione scende: il costo cumulato insegue il cash che sarà davvero pagato (33D). Nell&#x27;equity-settled il prezzo dell&#x27;azione dopo la grant date non conta.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Equity-settled e cash-settled a confronto&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Equity-settled&lt;/th&gt;&lt;th&gt;Cash-settled&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Contropartita del costo&lt;/td&gt;&lt;td&gt;Patrimonio netto (riserva)&lt;/td&gt;&lt;td&gt;Passività&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Fair value (dipendenti)&lt;/td&gt;&lt;td&gt;degli strumenti, alla grant date, &lt;strong&gt;congelato&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;della passività, &lt;strong&gt;rimisurato&lt;/strong&gt; a ogni chiusura e al regolamento&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Vesting non di mercato&lt;/td&gt;&lt;td&gt;rettificano il numero (2.19–20)&lt;/td&gt;&lt;td&gt;rettificano il numero (33A–B)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Market / non-vesting&lt;/td&gt;&lt;td&gt;nel FV iniziale (2.21–21A)&lt;/td&gt;&lt;td&gt;nel FV, ad ogni rimisurazione (33C)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Costo totale finale&lt;/td&gt;&lt;td&gt;n° maturati × FV grant date&lt;/td&gt;&lt;td&gt;= cash pagato (33D)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Dopo la vesting date&lt;/td&gt;&lt;td&gt;nessun aggiustamento (2.23)&lt;/td&gt;&lt;td&gt;rimisurazione fino al pagamento&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;alternative&quot; class=&quot;sec p-brick&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Par. 34–43&lt;/span&gt;&lt;h2&gt;Transazioni con alternativa cash&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Se l&#x27;accordo dà all&#x27;impresa &lt;em&gt;o&lt;/em&gt; alla controparte la scelta tra cash (o altre attività) e strumenti di capitale, l&#x27;operazione (o ciascuna sua componente) si contabilizza (IFRS 2.34):&lt;/p&gt;
&lt;ul class=&quot;chk&quot;&gt;&lt;li&gt;come &lt;strong&gt;cash-settled&lt;/strong&gt; se, e nella misura in cui, l&#x27;impresa ha &lt;strong&gt;assunto una passività&lt;/strong&gt; a pagare in cash o altre attività;&lt;/li&gt;&lt;li&gt;come &lt;strong&gt;equity-settled&lt;/strong&gt; se, e nella misura in cui, tale passività &lt;strong&gt;non&lt;/strong&gt; è sorta.&lt;/li&gt;&lt;/ul&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Sceglie la controparte&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Sceglie l&#x27;impresa&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
&lt;p&gt;Dare alla controparte il diritto di scegliere significa aver emesso un &lt;dfn&gt;compound financial instrument&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(strumento finanziario composto)&lt;/span&gt; con:&lt;/p&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin-top:6px&quot;&gt;
&lt;svg viewBox=&quot;0 0 700 150&quot; role=&quot;img&quot; aria-label=&quot;Strumento composto&quot;&gt;
&lt;rect x=&quot;20&quot; y=&quot;40&quot; width=&quot;430&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick)&quot; stroke-width=&quot;1.6&quot;/&gt;
&lt;rect x=&quot;450&quot; y=&quot;40&quot; width=&quot;230&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot; stroke-width=&quot;1.6&quot;/&gt;
&lt;text x=&quot;235&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Debt component&lt;/text&gt;&lt;text x=&quot;235&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;diritto a chiedere cash → passività&lt;/text&gt;
&lt;text x=&quot;565&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Equity component&lt;/text&gt;&lt;text x=&quot;565&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;diritto a chiedere azioni&lt;/text&gt;
&lt;text x=&quot;350&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; class=&quot;f-mut&quot;&gt;fair value dello strumento composto&lt;/text&gt;
&lt;text x=&quot;235&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--brick)&quot;&gt;regole cash-settled&lt;/text&gt;&lt;text x=&quot;565&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--slate)&quot;&gt;regole equity-settled&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;ul class=&quot;chk&quot;&gt;
&lt;li&gt;&lt;strong&gt;Controparti non dipendenti&lt;/strong&gt;, FV dei beni misurato direttamente (2.35): componente equity = FV dei beni o servizi ricevuti − FV della componente debito, alla data di ricevimento.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Dipendenti e altre transazioni&lt;/strong&gt; (2.36): si misura il fair value dello strumento composto alla measurement date, considerando termini e condizioni. &lt;span class=&quot;badge add&quot;&gt;integrazione&lt;/span&gt; IFRS 2.37 chiede di misurare prima la componente debito e poi quella equity, tenendo conto che per avere le azioni la controparte rinuncia al cash; se le due alternative valgono uguale, la componente equity è spesso nulla.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Contabilizzazione separata&lt;/strong&gt; (2.38): per la componente debito, costo + passività man mano che il servizio è reso (regole cash-settled); per quella equity, costo + aumento di patrimonio netto (regole equity-settled).&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Al regolamento&lt;/strong&gt; (2.39–40): si rimisura la passività al fair value. Se si consegnano azioni, la passività passa &lt;strong&gt;direttamente a patrimonio netto&lt;/strong&gt; come corrispettivo. Se si paga cash, il pagamento estingue la passività e la componente equity già rilevata &lt;strong&gt;resta nel patrimonio netto&lt;/strong&gt; (la controparte ha rinunciato alle azioni); è ammesso un trasferimento interno al patrimonio netto.&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;strong&gt;Prova (IFRS 2.35)&lt;/strong&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;k-g&quot;&gt;FV beni ricevuti €&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;k-g&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;1000&quot;&gt;&lt;output id=&quot;o-kg&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;k-d&quot;&gt;FV componente debito €&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;k-d&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;800&quot;&gt;&lt;output id=&quot;o-kd&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;result&quot; id=&quot;k-out&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;L&#x27;impresa deve capire se ha una &lt;strong&gt;obbligazione attuale a pagare in cash&lt;/strong&gt; (2.41). Rispondi alle domande:&lt;/p&gt;
&lt;div class=&quot;wiz&quot; data-wiz&gt;
&lt;div data-node=&quot;q1&quot;&gt;&lt;div class=&quot;q&quot;&gt;L&#x27;alternativa in azioni ha sostanza commerciale? (es. all&#x27;impresa non è vietato per legge emettere azioni)&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;q2&quot;&gt;Sì&lt;/button&gt;&lt;button class=&quot;btn&quot; data-go=&quot;cash&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;q2&quot; hidden&gt;&lt;div class=&quot;q&quot;&gt;L&#x27;impresa ha una prassi passata o una policy dichiarata di pagare in cash, o paga in cash ogni volta che la controparte lo chiede?&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;cash&quot;&gt;Sì&lt;/button&gt;&lt;button class=&quot;btn&quot; data-go=&quot;eq&quot;&gt;No&lt;/button&gt;&lt;button class=&quot;btn&quot; data-go=&quot;q1&quot;&gt;↺ Ricomincia&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;cash&quot; hidden&gt;&lt;div class=&quot;end&quot;&gt;&lt;strong&gt;Obbligazione attuale → cash-settled&lt;/strong&gt; (IFRS 2.42). Si applicano le regole dei par. 30–33D.&lt;/div&gt;&lt;div class=&quot;opts&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;q1&quot;&gt;↺ Ricomincia&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;eq&quot; hidden&gt;&lt;div class=&quot;end&quot;&gt;&lt;strong&gt;Nessuna obbligazione → equity-settled&lt;/strong&gt; (IFRS 2.43). Al regolamento:
&lt;ol type=&quot;a&quot;&gt;&lt;li&gt;se paga &lt;strong&gt;cash&lt;/strong&gt;: è il riacquisto di un&#x27;interessenza, cioè una &lt;strong&gt;deduzione dal patrimonio netto&lt;/strong&gt;, salvo (c);&lt;/li&gt;&lt;li&gt;se consegna &lt;strong&gt;azioni&lt;/strong&gt;: nessuna ulteriore scrittura (al più un trasferimento interno al patrimonio netto), salvo (c);&lt;/li&gt;&lt;li&gt;se sceglie l&#x27;alternativa con il &lt;strong&gt;fair value più alto&lt;/strong&gt;: &lt;strong&gt;costo aggiuntivo&lt;/strong&gt; per l&#x27;eccedenza data (cash pagato − FV delle azioni che avrebbe emesso, oppure FV delle azioni emesse − cash che avrebbe pagato).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;div class=&quot;opts&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;q1&quot;&gt;↺ Ricomincia&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Esempio per (c) &lt;span class=&quot;badge add&quot;&gt;integrazione&lt;/span&gt;: alla data di regolamento l&#x27;alternativa cash vale € 1.000 e le azioni € 1.200. Se l&#x27;impresa consegna le azioni, rileva un costo aggiuntivo di € 200; se paga € 1.000 in cash, nessun costo aggiuntivo (deduzione dal patrimonio netto per € 1.000).&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;selfcheck&quot;&gt;&lt;h3&gt;Autoverifica · Parte III&lt;/h3&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;In un piano cash-settled, dove finisce la variazione di fair value del debito tra due chiusure?&lt;/summary&gt;&lt;div&gt;A conto economico del periodo (IFRS 2.30).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;Una market condition in un piano cash-settled: nel fair value o nel numero?&lt;/summary&gt;&lt;div&gt;Nel fair value, sia all&#x27;inizio sia a ogni rimisurazione (IFRS 2.33C).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;Quanto vale, alla fine, il costo cumulato di un piano cash-settled?&lt;/summary&gt;&lt;div&gt;Esattamente il cash pagato (IFRS 2.33D).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;Il dipendente può scegliere tra cash e azioni e alla fine sceglie il cash. Che cosa succede alla componente equity già rilevata?&lt;/summary&gt;&lt;div&gt;Resta nel patrimonio netto (IFRS 2.40); è ammesso solo un trasferimento tra voci del patrimonio netto.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;L&#x27;impresa può scegliere, ma ha sempre pagato in cash. Come classifica il piano?&lt;/summary&gt;&lt;div&gt;Cash-settled: la prassi passata crea un&#x27;obbligazione attuale a pagare in cash (IFRS 2.41–42).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ================= PARTE IV ================= --&gt;
&lt;div class=&quot;part p-ochre&quot;&gt;&lt;div class=&quot;pn&quot;&gt;Parte IV&lt;/div&gt;&lt;h2&gt;Gruppo, disclosure e un bilancio vero&lt;/h2&gt;&lt;p&gt;Piani tra entità dello stesso gruppo, informativa obbligatoria e il caso BNP Paribas (par. 43A–52).&lt;/p&gt;&lt;/div&gt;

&lt;section id=&quot;gruppo&quot; class=&quot;sec p-ochre&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Par. 43A–43D&lt;/span&gt;&lt;h2&gt;Share-based payment tra entità del gruppo&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Nel proprio bilancio separato o individuale, l&#x27;entità che &lt;strong&gt;riceve&lt;/strong&gt; i beni o servizi li misura come equity-settled o cash-settled valutando (IFRS 2.43A) la &lt;em&gt;natura degli awards assegnati&lt;/em&gt; e i &lt;em&gt;propri diritti e obblighi&lt;/em&gt;. L&#x27;importo che rileva può differire da quello del consolidato o dell&#x27;entità del gruppo che regola l&#x27;operazione.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--ochre)&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Chi riceve i servizi (2.43B)&lt;/h4&gt;Equity-settled quando gli awards sono &lt;strong&gt;suoi strumenti di capitale&lt;/strong&gt;, oppure &lt;strong&gt;non ha obblighi&lt;/strong&gt; di regolare. Poi rimisura solo per variazioni delle &lt;em&gt;non-market vesting conditions&lt;/em&gt;. In tutti gli altri casi: cash-settled.&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--ochre)&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Chi regola, se un&#x27;altra riceve (2.43C)&lt;/h4&gt;Equity-settled &lt;strong&gt;solo&lt;/strong&gt; se regola con &lt;strong&gt;propri strumenti di capitale&lt;/strong&gt;. Altrimenti: cash-settled.&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Classifica tu&lt;/h3&gt;
&lt;div class=&quot;wiz card&quot; data-wiz&gt;
&lt;div data-node=&quot;g0&quot;&gt;&lt;div class=&quot;q&quot;&gt;Dal punto di vista di quale entità guardi l&#x27;operazione?&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;r1&quot;&gt;Quella che riceve i servizi&lt;/button&gt;&lt;button class=&quot;btn&quot; data-go=&quot;s1&quot;&gt;Quella che regola (un&#x27;altra riceve)&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;r1&quot; hidden&gt;&lt;div class=&quot;q&quot;&gt;Gli awards sono strumenti di capitale dell&#x27;entità che riceve?&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;reEq&quot;&gt;Sì&lt;/button&gt;&lt;button class=&quot;btn&quot; data-go=&quot;r2&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;r2&quot; hidden&gt;&lt;div class=&quot;q&quot;&gt;L&#x27;entità che riceve ha un obbligo di regolare l&#x27;operazione?&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;reCash&quot;&gt;Sì&lt;/button&gt;&lt;button class=&quot;btn&quot; data-go=&quot;reEq2&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;reEq&quot; hidden&gt;&lt;div class=&quot;end&quot;&gt;&lt;strong&gt;Equity-settled&lt;/strong&gt; (2.43B). Rimisurazione solo per le non-market vesting conditions.&lt;/div&gt;&lt;div class=&quot;opts&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;g0&quot;&gt;↺ Ricomincia&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;reEq2&quot; hidden&gt;&lt;div class=&quot;end&quot;&gt;&lt;strong&gt;Equity-settled&lt;/strong&gt; (2.43B): paga qualcun altro, per lei è un apporto di capitale. Caso tipico &lt;span class=&quot;badge add&quot;&gt;integrazione&lt;/span&gt;: la capogruppo dà proprie azioni (o anche cash) ai dipendenti della controllata, che non ha obblighi.&lt;/div&gt;&lt;div class=&quot;opts&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;g0&quot;&gt;↺ Ricomincia&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;reCash&quot; hidden&gt;&lt;div class=&quot;end&quot;&gt;&lt;strong&gt;Cash-settled&lt;/strong&gt; (2.43B, “in all other circumstances”). Es. la controllata deve consegnare azioni della capogruppo che dovrà procurarsi.&lt;/div&gt;&lt;div class=&quot;opts&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;g0&quot;&gt;↺ Ricomincia&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;s1&quot; hidden&gt;&lt;div class=&quot;q&quot;&gt;Regola con i propri strumenti di capitale?&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;seEq&quot;&gt;Sì&lt;/button&gt;&lt;button class=&quot;btn&quot; data-go=&quot;seCash&quot;&gt;No (cash o strumenti di altri)&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;seEq&quot; hidden&gt;&lt;div class=&quot;end&quot;&gt;&lt;strong&gt;Equity-settled&lt;/strong&gt; (2.43C). Es. la capogruppo assegna proprie azioni ai dipendenti della controllata.&lt;/div&gt;&lt;div class=&quot;opts&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;g0&quot;&gt;↺ Ricomincia&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;seCash&quot; hidden&gt;&lt;div class=&quot;end&quot;&gt;&lt;strong&gt;Cash-settled&lt;/strong&gt; (2.43C). Es. la capogruppo paga in denaro, in base al prezzo delle proprie azioni, i dipendenti della controllata.&lt;/div&gt;&lt;div class=&quot;opts&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;g0&quot;&gt;↺ Ricomincia&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;badge add&quot;&gt;integrazione&lt;/span&gt; Nel consolidato la stessa operazione si guarda dal punto di vista del gruppo come unica entità: se il gruppo consegna strumenti di capitale della capogruppo è equity-settled, se paga cash è cash-settled. Ecco perché gli importi possono differire tra bilancio della controllata, della capogruppo e consolidato (slide 36). Collegamento: lezione su IFRS 10 e consolidato.&lt;/p&gt;
&lt;/section&gt;

&lt;section id=&quot;disclosure&quot; class=&quot;sec p-ochre&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Par. 44–52&lt;/span&gt;&lt;h2&gt;Disclosures: cosa raccontare in nota&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Tre principi guida: far capire agli utenti del bilancio &lt;strong&gt;natura ed estensione&lt;/strong&gt; dei piani esistiti nel periodo (2.44), &lt;strong&gt;come è stato determinato il fair value&lt;/strong&gt; dei beni o servizi ricevuti o degli strumenti assegnati (2.46) e &lt;span class=&quot;badge add&quot;&gt;integrazione&lt;/span&gt; l&#x27;&lt;strong&gt;effetto&lt;/strong&gt; dei piani sul risultato e sulla posizione finanziaria (2.50). Le slide si concentrano sui primi due. Spunta le voci minime richieste da 2.45 man mano che le ripassi:&lt;/p&gt;
&lt;div class=&quot;check-list&quot;&gt;
&lt;button&gt;&lt;span class=&quot;bx&quot;&gt;✓&lt;/span&gt;&lt;span&gt;&lt;strong&gt;Descrizione di ogni tipo di piano&lt;/strong&gt; esistito nel periodo: termini e condizioni generali (vesting requirements, durata massima delle opzioni, metodo di regolamento cash o equity). Piani simili si possono aggregare, salvo che serva darli separati.&lt;/span&gt;&lt;/button&gt;
&lt;button&gt;&lt;span class=&quot;bx&quot;&gt;✓&lt;/span&gt;&lt;span&gt;&lt;strong&gt;Numero e prezzo medio ponderato di esercizio&lt;/strong&gt; delle opzioni: in essere a inizio periodo, assegnate, &lt;em&gt;forfeited&lt;/em&gt; (perse), esercitate, scadute, in essere a fine periodo, esercitabili a fine periodo.&lt;/span&gt;&lt;/button&gt;
&lt;button&gt;&lt;span class=&quot;bx&quot;&gt;✓&lt;/span&gt;&lt;span&gt;Per le opzioni &lt;strong&gt;esercitate nel periodo&lt;/strong&gt;: prezzo medio ponderato dell&#x27;azione alla data di esercizio (o del periodo, se esercitate con regolarità).&lt;/span&gt;&lt;/button&gt;
&lt;button&gt;&lt;span class=&quot;bx&quot;&gt;✓&lt;/span&gt;&lt;span&gt;Per le opzioni &lt;strong&gt;in essere a fine periodo&lt;/strong&gt;: intervallo dei prezzi di esercizio e vita contrattuale residua media ponderata, divisi in fasce significative se l&#x27;intervallo è ampio.&lt;/span&gt;&lt;/button&gt;
&lt;/div&gt;
&lt;h4&gt;Il prospetto di movimentazione, in pratica &lt;span class=&quot;badge add&quot;&gt;integrazione · numeri illustrativi&lt;/span&gt;&lt;/h4&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Opzioni&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Numero&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Prezzo medio ponderato di esercizio €&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;In essere al 1° gennaio&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500.000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20,0&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;+ Assegnate&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;120.000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;24,0&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;− Forfeited&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(30.000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;21,0&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;− Esercitate&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(90.000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;18,0&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;− Scadute&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(20.000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;25,0&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;In essere al 31 dicembre&lt;/strong&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;strong&gt;480.000&lt;/strong&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;di cui esercitabili al 31 dicembre&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;210.000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;bnp&quot; class=&quot;sec p-ochre&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Slide 44–47&lt;/span&gt;&lt;h2&gt;Caso: BNP Paribas, bilancio consolidato 2025&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Le slide mostrano le note del bilancio consolidato BNP Paribas per l&#x27;esercizio chiuso al 31 dicembre 2025 (&lt;em&gt;unaudited figures&lt;/em&gt;). È utile perché in poche righe ritroviamo quasi tutto IFRS 2.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--slate)&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Stock option e share award plans → equity-settled&lt;/h4&gt;
&lt;ul class=&quot;chk&quot;&gt;&lt;li&gt;Costo rilevato lungo il vesting period se il beneficio dipende dalla permanenza del beneficiario.&lt;/li&gt;&lt;li&gt;Rilevato tra le spese per il personale, con contropartita il patrimonio netto.&lt;/li&gt;&lt;li&gt;Valore del piano determinato alla data di assegnazione dal Board of directors (grant date).&lt;/li&gt;&lt;li&gt;Senza mercato per questi strumenti: modelli di valutazione che incorporano le condizioni legate al prezzo dell&#x27;azione BNP (market conditions nel FV).&lt;/li&gt;&lt;li&gt;Si rivedono solo le ipotesi su uscite dal gruppo e su performance &lt;em&gt;non&lt;/em&gt; legate al prezzo dell&#x27;azione → è IFRS 2.19–21.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--brick)&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Deferred compensation legata al prezzo → cash-settled&lt;/h4&gt;
&lt;ul class=&quot;chk&quot;&gt;&lt;li&gt;Costo nell&#x27;anno in cui il dipendente presta il servizio.&lt;/li&gt;&lt;li&gt;Se c&#x27;è una condizione vincolante di permanenza: servizio presunto lungo il vesting period, costo &lt;em&gt;pro rata&lt;/em&gt;.&lt;/li&gt;&lt;li&gt;Spese per il personale con contropartita una passività, rivista per condizioni non rispettate e per la variazione del prezzo dell&#x27;azione BNP → IFRS 2.30–33.&lt;/li&gt;&lt;li&gt;Senza condizione di permanenza: costo immediato e debito rivisto a ogni chiusura → IFRS 2.32 (vest immediately).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Perché una banca paga in strumenti differiti&lt;/h3&gt;
&lt;p&gt;La nota 7.e spiega che i piani di remunerazione variabile differita riguardano i dipendenti con impatto rilevante sul profilo di rischio del gruppo, in base a un quadro regolamentare specifico: decreto del Ministero delle Finanze francese del 13 dicembre 2010, direttiva europea &lt;strong&gt;CRD 4&lt;/strong&gt; del 26 luglio 2013 modificata dalla &lt;strong&gt;CRD 5&lt;/strong&gt; del 20 maggio 2019, recepite nel Code monétaire et financier (ordinanze del 20 febbraio 2014 e del 21 dicembre 2020, decreti e ordini del 3 novembre 2014 e del 22 dicembre 2020) e il &lt;strong&gt;Regolamento delegato europeo del 25 marzo 2021&lt;/strong&gt;. Il pagamento è differito nel tempo, condizionato alla performance di business line e gruppo, e per lo più in cash legato al prezzo dell&#x27;azione BNP. Vedi le fonti in &lt;a href=&quot;#approfondire&quot;&gt;Per approfondire&lt;/a&gt;.&lt;/p&gt;

&lt;p&gt;&lt;span class=&quot;badge add&quot;&gt;ipotesi di lettura&lt;/span&gt; Il balzo dei “prior deferred compensation plans” da 46 a 445 milioni è coerente con la logica cash-settled: i debiti per piani passati si rimisurano con il prezzo dell&#x27;azione, e un rialzo del titolo genera costo aggiuntivo nell&#x27;anno. Le slide non commentano il dato: verificalo nella nota completa prima di usarlo all&#x27;esame.&lt;/p&gt;

&lt;div class=&quot;selfcheck&quot;&gt;&lt;h3&gt;Autoverifica · Parte IV&lt;/h3&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;La capogruppo assegna proprie azioni ai dipendenti di una controllata. Come classificano l&#x27;operazione la controllata e la capogruppo?&lt;/summary&gt;&lt;div&gt;Controllata: equity-settled (riceve i servizi e non ha obblighi, 2.43B). Capogruppo: equity-settled (regola con propri strumenti, 2.43C).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;La capogruppo paga cash in base al proprio prezzo d&#x27;azione ai dipendenti della controllata. E ora?&lt;/summary&gt;&lt;div&gt;Controllata: equity-settled (nessun obbligo). Capogruppo: cash-settled (non regola con propri strumenti di capitale).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;Elenca le sette categorie di opzioni per cui servono numero e prezzo medio ponderato di esercizio.&lt;/summary&gt;&lt;div&gt;In essere a inizio periodo; assegnate; forfeited; esercitate; scadute; in essere a fine periodo; esercitabili a fine periodo (IFRS 2.45).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;Nella nota BNP, quali ipotesi vengono riviste durante il vesting period degli stock option e share award plans, e perché solo quelle?&lt;/summary&gt;&lt;div&gt;Probabilità di uscita dei dipendenti e condizioni di performance non legate al prezzo dell&#x27;azione: sono vesting conditions non di mercato, che si riflettono nel numero (IFRS 2.19–20). Quelle legate al prezzo sono nel fair value iniziale (2.21).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;approfondire&quot; class=&quot;sec&quot; style=&quot;--c:var(--accent)&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Fonti esterne&lt;/span&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Standard, norme e documenti citati nelle slide. Per ciascuno: dati e link trovati con la ricerca web (&lt;span class=&quot;badge ext&quot;&gt;fonte esterna&lt;/span&gt;), cosa contiene e perché conta per questa lezione. Ricerca svolta il 18 novembre 2026.&lt;/p&gt;
&lt;ul class=&quot;ext-list&quot;&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;IFRS 2 Share-based Payment — IFRS Foundation&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Pagina ufficiale dello standard. Emesso a febbraio 2004, in vigore per gli esercizi dal 1° gennaio 2005; ultimo emendamento rilevante a giugno 2016 (classificazione e misurazione, da cui i par. 33A–33D). È il testo da cui sono tratte tutte le citazioni delle slide.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-2-share-based-payment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IFRS 2&lt;/a&gt; · sintesi: &lt;a href=&quot;https://www.iasplus.com/standard/ifrs02.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte)&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;IFRS 13 Fair Value Measurement&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Emesso a maggio 2011, in vigore dal 2013: definisce il fair value come exit price e ne fissa la gerarchia. Conta perché le slide insistono che per IFRS 2 vale un&#x27;altra definizione, e IFRS 13 esclude IFRS 2 dal suo ambito.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-13-fair-value-measurement/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IFRS 13&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;IFRS 3 Business Combinations&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Versione rivista emessa a gennaio 2008. Serve a distinguere gli strumenti emessi come corrispettivo per il controllo (fuori da IFRS 2) da quelli che remunerano servizi futuri dei dipendenti dell&#x27;acquisita (dentro IFRS 2, par. 5).&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-3-business-combinations/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IFRS 3&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;IFRS 10 Consolidated Financial Statements&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Emesso a maggio 2011, stabilisce quando un&#x27;entità controlla un&#x27;altra e va consolidata. La sua Appendix A definisce il “group” usato da IFRS 2 per le transazioni infragruppo.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-10-consolidated-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IFRS 10&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;IFRS 11 Joint Arrangements&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Emesso a maggio 2011 in sostituzione di IAS 31. Rilevante per l&#x27;esclusione del conferimento di un business alla costituzione di una joint venture (IFRS 2.5).&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/content/ifrs/home/issued-standards/list-of-standards/ifrs-11-joint-arrangements.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IFRS 11&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;IAS 32 Financial Instruments: Presentation&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Classifica gli strumenti in attività, passività finanziarie e patrimonio netto; i par. 8–10 delimitano i contratti su elementi non finanziari esclusi da IFRS 2 (par. 6). Il par. 33 regola le azioni proprie, utile per la forma “treasury shares”.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://ifrs.org/issued-standards/list-of-standards/ias-32-financial-instruments-presentation&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IAS 32&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;IFRS 9 Financial Instruments&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Rilevazione e misurazione degli strumenti finanziari; i par. 2.4–2.7 riguardano i contratti su elementi non finanziari regolabili net, esclusi da IFRS 2.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2025/issued/ifrs9.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IFRS 9 (testo HTML)&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Direttiva 2013/36/UE (CRD IV)&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Disciplina accesso all&#x27;attività bancaria e vigilanza prudenziale; gli articoli 92–94 fissano le regole sulle politiche di remunerazione e sulla parte variabile (incluso il tetto al rapporto variabile/fisso). È la base dei piani differiti di BNP.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.eba.europa.eu/regulation-and-policy/single-rulebook/interactive-single-rulebook/11764&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EBA Interactive Single Rulebook — CRD&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/banks-prudential-supervision.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sintesi EUR-Lex&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Direttiva (UE) 2019/878 (CRD V)&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Modifica la CRD IV anche sulla remunerazione (GU L 150 del 7.6.2019; applicazione dal 29.12.2020). Rivede tra l&#x27;altro differimento e pagamento in strumenti della parte variabile.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2019/878/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex — Direttiva 2019/878&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Regolamento delegato (UE) 2021/923 del 25 marzo 2021&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Norma tecnica di regolamentazione che fissa i criteri qualitativi e quantitativi per identificare il personale con impatto rilevante sul profilo di rischio (“material risk takers”); ha sostituito il Regolamento 604/2014. Definisce a chi si applicano i piani differiti della nota BNP.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/reg_del/2021/923/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex — Reg. delegato 2021/923&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Ordonnance n° 2014-158 del 20 febbraio 2014&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Ordinanza francese che completa il recepimento della CRD IV, modificando il Code monétaire et financier (libro V, dove stanno le regole su remunerazione degli enti creditizi). Non ho trovato la pagina Légifrance: il link è alla scheda di Dalloz Actualité.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.dalloz-actualite.fr/document/ord-n-2014-158-20-fevr-2014-jo-21-fevr&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Dalloz Actualité — Ord. 2014-158&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;Arrêté del 13 dicembre 2010 (il “Decree” delle slide)&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Atto del Ministero francese (pubblicato in GU il 17.12.2010) che ha recepito la CRD III sulla remunerazione degli operatori di mercato, rafforzando l&#x27;arrêté del 3 novembre 2009. Il commento di Harvard spiega in inglese le nuove regole.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://corpgov.law.harvard.edu/2011/02/09/new-rules-governing-compensation-within-french-financial-institutions&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Harvard Law School Forum on Corporate Governance&lt;/a&gt; · &lt;a href=&quot;https://www.senat.fr/application-des-lois/pjl09-555.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sénat — stato di applicazione&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;h4&gt;BNP Paribas — Consolidated Financial Statements 2025&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Il bilancio consolidato al 31.12.2025 approvato dal Board il 4 febbraio 2026, nella versione “unaudited” usata dalle slide; la versione certificata è nel Universal Registration Document 2025. Contiene le note 1.l e 7.e citate.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://invest.bnpparibas/en/document/4q25-cfsu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;invest.bnpparibas — 4Q25 consolidated financial statements&lt;/a&gt; · &lt;a href=&quot;https://group.bnpparibas/en/press-release/bnp-paribas-group-results-as-of-31-december-2025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;comunicato risultati 2025&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/section&gt;

&lt;/main&gt;

&lt;p&gt;&lt;strong&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/strong&gt;&lt;/p&gt;
