&lt;/figure&gt;
&lt;p&gt;&lt;span class=&quot;badge add&quot;&gt;interpretive hypothesis&lt;/span&gt; The jump in “prior deferred compensation plans” from 46 to 445 million is consistent with cash-settled logic: liabilities for past plans are remeasured with the share price, and a rise in the share price generates additional expense in the year. The slides do not comment on this figure: check it in the full note before using it in the exam.&lt;/p&gt;

&lt;div class=&quot;selfcheck&quot;&gt;&lt;h3&gt;Self-check · Part IV&lt;/h3&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;The parent grants its own shares to the employees of a subsidiary. How do the subsidiary and the parent classify the transaction?&lt;/summary&gt;&lt;div&gt;Subsidiary: equity-settled (it receives the services and has no obligation, 2.43B). Parent: equity-settled (it settles with its own instruments, 2.43C).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;The parent pays the subsidiary&#x27;s employees cash based on its own share price. What now?&lt;/summary&gt;&lt;div&gt;Subsidiary: equity-settled (no obligation). Parent: cash-settled (it does not settle with its own equity instruments).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;List the seven categories of options for which the number and weighted average exercise price are required.&lt;/summary&gt;&lt;div&gt;Outstanding at the beginning of the period; granted; forfeited; exercised; expired; outstanding at the end of the period; exercisable at the end of the period (IFRS 2.45).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;In the BNP note, which assumptions are revised during the vesting period of stock option and share award plans, and why only those?&lt;/summary&gt;&lt;div&gt;The probability of employees leaving and performance conditions not related to the share price: these are non-market vesting conditions, reflected in the number (IFRS 2.19–20). Those related to the share price are in the initial fair value (2.21).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;approfondire&quot; class=&quot;sec&quot; style=&quot;--c:var(--accent)&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;External sources&lt;/span&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Standards, legislation and documents cited in the slides. For each: details and links found through web research (&lt;span class=&quot;badge ext&quot;&gt;external source&lt;/span&gt;), what it contains and why it matters for this lecture. Research carried out on 18 November 2026.&lt;/p&gt;
&lt;ul class=&quot;ext-list&quot;&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;IFRS 2 Share-based Payment — IFRS Foundation&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Official page of the standard. Issued in February 2004, effective for annual periods beginning on or after 1 January 2005; latest significant amendment in June 2016 (classification and measurement, source of paras. 33A–33D). It is the text from which all the quotations in the slides are taken.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-2-share-based-payment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IFRS 2&lt;/a&gt; · summary: &lt;a href=&quot;https://www.iasplus.com/standard/ifrs02.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus (Deloitte)&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;IFRS 13 Fair Value Measurement&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Issued in May 2011, effective from 2013: defines fair value as an exit price and sets out the fair value hierarchy. It matters because the slides stress that a different definition applies for IFRS 2, and IFRS 13 excludes IFRS 2 from its scope.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-13-fair-value-measurement/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IFRS 13&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;IFRS 3 Business Combinations&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Revised version issued in January 2008. It is used to distinguish instruments issued as consideration for control (outside IFRS 2) from those that remunerate future services of the acquiree&#x27;s employees (within IFRS 2, para. 5).&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-3-business-combinations/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IFRS 3&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;IFRS 10 Consolidated Financial Statements&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Issued in May 2011, it establishes when an entity controls another and must consolidate it. Its Appendix A defines the “group” used by IFRS 2 for intragroup transactions.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-10-consolidated-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IFRS 10&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;IFRS 11 Joint Arrangements&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Issued in May 2011, replacing IAS 31. Relevant to the exclusion of the contribution of a business on the formation of a joint venture (IFRS 2.5).&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/content/ifrs/home/issued-standards/list-of-standards/ifrs-11-joint-arrangements.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IFRS 11&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;IAS 32 Financial Instruments: Presentation&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Classifies instruments as financial assets, financial liabilities and equity; paras. 8–10 delimit the contracts on non-financial items excluded from IFRS 2 (para. 6). Para. 33 deals with treasury shares, relevant to the “treasury shares” form of grant.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://ifrs.org/issued-standards/list-of-standards/ias-32-financial-instruments-presentation&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IAS 32&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;IFRS 9 Financial Instruments&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Recognition and measurement of financial instruments; paras. 2.4–2.7 concern contracts on non-financial items that can be settled net, which are excluded from IFRS 2.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2025/issued/ifrs9.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ifrs.org — IFRS 9 (HTML text)&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Directive 2013/36/EU (CRD IV)&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Governs access to the activity of credit institutions and prudential supervision; Articles 92–94 set the rules on remuneration policies and the variable component (including the cap on the variable-to-fixed ratio). It is the basis of BNP&#x27;s deferred plans.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.eba.europa.eu/regulation-and-policy/single-rulebook/interactive-single-rulebook/11764&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EBA Interactive Single Rulebook — CRD&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/EN/legal-content/summary/banks-prudential-supervision.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex summary&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Directive (EU) 2019/878 (CRD V)&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Amends CRD IV, including on remuneration (OJ L 150 of 7.6.2019; applicable from 29.12.2020). Among other things, it revises the deferral and payment in instruments of the variable component.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/dir/2019/878/oj&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex — Directive 2019/878&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Commission Delegated Regulation (EU) 2021/923 of 25 March 2021&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;Regulatory technical standard setting out the qualitative and quantitative criteria for identifying staff whose professional activities have a material impact on the risk profile (“material risk takers”); it replaced Regulation 604/2014. It defines to whom the deferred plans in the BNP note apply.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://eur-lex.europa.eu/eli/reg_del/2021/923/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex — Delegated Reg. 2021/923&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Ordonnance No. 2014-158 of 20 February 2014&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;French ordinance completing the transposition of CRD IV, amending the Code monétaire et financier (Book V, which contains the rules on remuneration in credit institutions). I could not find the Légifrance page: the link points to the Dalloz Actualité entry.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://www.dalloz-actualite.fr/document/ord-n-2014-158-20-fevr-2014-jo-21-fevr&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Dalloz Actualité — Ord. 2014-158&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;Arrêté of 13 December 2010 (the “Decree” in the slides)&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;French Ministry act (published in the Official Journal on 17.12.2010) that transposed CRD III on the remuneration of market professionals, strengthening the arrêté of 3 November 2009. The Harvard commentary explains the new rules in English.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://corpgov.law.harvard.edu/2011/02/09/new-rules-governing-compensation-within-french-financial-institutions&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Harvard Law School Forum on Corporate Governance&lt;/a&gt; · &lt;a href=&quot;https://www.senat.fr/application-des-lois/pjl09-555.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sénat — implementation status&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;li&gt;&lt;span class=&quot;badge ext&quot;&gt;external source&lt;/span&gt;&lt;h4&gt;BNP Paribas — Consolidated Financial Statements 2025&lt;/h4&gt;&lt;div class=&quot;why&quot;&gt;The consolidated financial statements at 31.12.2025 approved by the Board on 4 February 2026, in the “unaudited” version used in the slides; the audited version is in the 2025 Universal Registration Document. It contains notes 1.l and 7.e cited above.&lt;/div&gt;&lt;div class=&quot;lnk&quot;&gt;&lt;a href=&quot;https://invest.bnpparibas/en/document/4q25-cfsu&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;invest.bnpparibas — 4Q25 consolidated financial statements&lt;/a&gt; · &lt;a href=&quot;https://group.bnpparibas/en/press-release/bnp-paribas-group-results-as-of-31-december-2025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2025 results press release&lt;/a&gt;&lt;/div&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/section&gt;

&lt;/main&gt;

(function(){
 var box=$(&#x27;#vsim&#x27;);if(!box)return;

 };

 serv.addEventListener(&#x27;change&#x27;,run);cond.addEventListener(&#x27;change&#x27;,run);run();
})();

function chart(svg,cats,series,line,H){

 });
 if(line){var pts=line.v.map(function(v,i){return (x0+gw*i+gw/2)+&#x27;,&#x27;+y(v)}).join(&#x27; &#x27;);
