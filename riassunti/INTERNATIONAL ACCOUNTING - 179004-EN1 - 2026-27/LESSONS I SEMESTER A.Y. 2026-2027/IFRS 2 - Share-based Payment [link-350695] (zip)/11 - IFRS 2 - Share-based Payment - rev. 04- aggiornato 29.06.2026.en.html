&lt;text x=&quot;190&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;knowledgeable, willing parties&lt;/text&gt;
&lt;text x=&quot;190&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;in an arm&#x27;s length transaction&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;price that would be received to sell&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;an asset or paid to transfer&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;a liability in an&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;146&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;orderly transaction between market&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;166&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;participants at the measurement date&lt;/text&gt;
&lt;text x=&quot;190&quot; y=&quot;235&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--sage)&quot; font-weight=&quot;600&quot;&gt;← THIS is the one used for IFRS 2&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;235&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; class=&quot;f-mut&quot;&gt;“exit price”, market-based&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Slide 9: when applying IFRS 2, refer to the IFRS 2 definition, not the IFRS 13 one.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;p&gt;&lt;span class=&quot;badge add&quot;&gt;addition&lt;/span&gt; &lt;em&gt;Arm&#x27;s length&lt;/em&gt; means on market terms, between independent parties. The IFRS 2 definition looks at an exchange between two knowledgeable parties; the IFRS 13 one is an &lt;em&gt;exit price&lt;/em&gt; from the perspective of market participants. IFRS 13 itself excludes IFRS 2 share-based payment transactions from its scope (IFRS 13.6), precisely to avoid conflicts: employee share options have no real market and are measured using &lt;em&gt;option pricing&lt;/em&gt; models (e.g. Black-Scholes-Merton or binomial).&lt;/p&gt;

&lt;h3&gt;Working glossary &lt;span class=&quot;badge add&quot;&gt;addition&lt;/span&gt;&lt;/h3&gt;
&lt;p class=&quot;gl&quot;&gt;Terms the slides use without defining them. Open the ones you are unsure about.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Grant date&lt;/summary&gt;&lt;div&gt;The date on which the entity and the counterparty agree to the plan and have a shared understanding of its terms and conditions. If approval is required (e.g. by shareholders), it is the date of approval. For employees, it is the date at which fair value is measured.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Vesting period and vesting date&lt;/summary&gt;&lt;div&gt;The &lt;em&gt;vesting period&lt;/em&gt; is the period during which all the vesting conditions must be satisfied; the &lt;em&gt;vesting date&lt;/em&gt; is the day the entitlement vests. The expense is spread over the vesting period.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Measurement date&lt;/summary&gt;&lt;div&gt;The date at which the fair value of the instruments granted is measured: the grant date for employees; the date the goods are obtained or the counterparty renders service for other counterparties.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Share option / stock option and exercise price&lt;/summary&gt;&lt;div&gt;A right (not an obligation) to buy shares at a fixed price, the &lt;em&gt;exercise price&lt;/em&gt; (strike), within a given period. It has value because, if the share price rises above the strike, the holder gains the difference.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Intrinsic value&lt;/summary&gt;&lt;div&gt;The difference between the current share price and the exercise price (if positive). The fair value of an option is usually higher than its intrinsic value, because it also includes the time value remaining.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Share appreciation right (SAR)&lt;/summary&gt;&lt;div&gt;A right to receive (usually in cash) the increase in the share price above a base level over a given period. It is the classic example of a cash-settled award.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Market condition and non-vesting condition&lt;/summary&gt;&lt;div&gt;&lt;em&gt;Market condition&lt;/em&gt;: a performance condition related to the price or value of equity instruments (e.g. a target share price, total shareholder return). &lt;em&gt;Non-vesting condition&lt;/em&gt;: a condition that does not determine whether the entity receives the services (e.g. a requirement for the employee to keep contributing to a share-linked savings plan). We cover them under &lt;a href=&quot;#vesting&quot;&gt;Vesting conditions&lt;/a&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Forfeit&lt;/summary&gt;&lt;div&gt;To lose the entitlement: someone who leaves the entity before the vesting date usually &lt;em&gt;forfeits&lt;/em&gt; their options.&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;selfcheck&quot;&gt;&lt;h3&gt;Self-check · Part I&lt;/h3&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;Does IFRS 2 apply if the entity cannot identify the goods or services received?&lt;/summary&gt;&lt;div&gt;Yes. IFRS 2.2 applies to all share-based payment transactions “whether or not the entity can identify specifically some or all of the goods or services received”.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;A subsidiary receives services paid for by the parent with the parent&#x27;s shares. Does the subsidiary apply IFRS 2?&lt;/summary&gt;&lt;div&gt;Yes (IFRS 2.3A): it applies to the entity receiving goods or services when another group entity has the obligation to settle, unless the purpose is clearly other than payment.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;What is the essential difference between equity-settled and cash-settled?&lt;/summary&gt;&lt;div&gt;The credit side of the expense: an increase in equity (equity instruments are delivered, or the entity has no obligation to settle) versus a liability to be paid in cash for an amount linked to the share price.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;Is the IFRS 13 definition of fair value used to measure an IFRS 2 instrument?&lt;/summary&gt;&lt;div&gt;No. The IFRS 2 Appendix A definition is used: the amount of an exchange between knowledgeable, willing parties in an arm&#x27;s length transaction.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ================= PART II ================= --&gt;
&lt;div class=&quot;part p-slate&quot;&gt;&lt;div class=&quot;pn&quot;&gt;Part II&lt;/div&gt;&lt;h2&gt;Equity-settled share-based payment&lt;/h2&gt;&lt;p&gt;Measurement, timing of recognition, vesting conditions, forms of grant and exercises (paras. 10–29).&lt;/p&gt;&lt;/div&gt;

&lt;section id=&quot;equity&quot; class=&quot;sec p-slate&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Paras. 10–15&lt;/span&gt;&lt;h2&gt;Measurement and recognition&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Principle (IFRS 2.10): the entity measures the goods or services received, and the corresponding &lt;strong&gt;increase in equity&lt;/strong&gt;, &lt;strong&gt;directly&lt;/strong&gt; at the fair value of the goods or services received; if that fair value &lt;em&gt;cannot be estimated reliably&lt;/em&gt;, it measures them &lt;strong&gt;indirectly&lt;/strong&gt;, by reference to the fair value of the equity instruments granted.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;formula&quot;&gt;Dr Expense for goods / services received&lt;br&gt;Cr Equity (specific reserve)&lt;small&gt;The two arrows on slide 10: the expense goes to profit or loss, the reserve increases equity&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin:14px 0&quot;&gt;&lt;strong&gt;Directly&lt;/strong&gt; = value of what I receive.&lt;br&gt;&lt;strong&gt;Indirectly&lt;/strong&gt; = value of what I give (the shares/options).&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Who is the counterparty? Two routes&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 760 330&quot; role=&quot;img&quot; aria-label=&quot;Equity-settled measurement decision tree&quot;&gt;
&lt;rect x=&quot;270&quot; y=&quot;10&quot; width=&quot;220&quot; height=&quot;50&quot; rx=&quot;12&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;text x=&quot;380&quot; y=&quot;41&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Who renders the services?&lt;/text&gt;
&lt;path d=&quot;M330 60 L170 110&quot; class=&quot;s-mut&quot; stroke-width=&quot;1.6&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M430 60 L580 110&quot; class=&quot;s-mut&quot; stroke-width=&quot;1.6&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect x=&quot;40&quot; y=&quot;112&quot; width=&quot;260&quot; height=&quot;56&quot; rx=&quot;12&quot; class=&quot;f-card s-mut&quot;/&gt;&lt;text x=&quot;170&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Employees and others&lt;/text&gt;&lt;text x=&quot;170&quot; y=&quot;156&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-mut&quot;&gt;IFRS 2.11–12&lt;/text&gt;
&lt;rect x=&quot;450&quot; y=&quot;112&quot; width=&quot;270&quot; height=&quot;56&quot; rx=&quot;12&quot; class=&quot;f-card s-mut&quot;/&gt;&lt;text x=&quot;585&quot; y=&quot;136&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;Other counterparties&lt;/text&gt;&lt;text x=&quot;585&quot; y=&quot;156&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;f-mut&quot;&gt;IFRS 2.13 · rebuttable presumption&lt;/text&gt;
&lt;path d=&quot;M170 168 V210&quot; class=&quot;s-mut&quot; stroke-width=&quot;1.6&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;rect x=&quot;30&quot; y=&quot;212&quot; width=&quot;280&quot; height=&quot;96&quot; rx=&quot;12&quot; style=&quot;fill:var(--slate);stroke:none&quot;/&gt;
&lt;text x=&quot;170&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; style=&quot;fill:var(--paper)&quot;&gt;Always INDIRECT&lt;/text&gt;
&lt;text x=&quot;170&quot; y=&quot;262&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--paper)&quot;&gt;FV of instruments granted&lt;/text&gt;
&lt;text x=&quot;170&quot; y=&quot;284&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; style=&quot;fill:var(--paper)&quot;&gt;measured at GRANT DATE&lt;/text&gt;
&lt;path d=&quot;M540 168 L470 210&quot; class=&quot;s-mut&quot; stroke-width=&quot;1.6&quot; marker-end=&quot;url(#ar)&quot;/&gt;&lt;path d=&quot;M630 168 L680 210&quot; class=&quot;s-mut&quot; stroke-width=&quot;1.6&quot; marker-end=&quot;url(#ar)&quot;/&gt;
&lt;text x=&quot;480&quot; y=&quot;196&quot; font-size=&quot;11&quot; class=&quot;f-mut&quot;&gt;reliable FV (rule)&lt;/text&gt;&lt;text x=&quot;650&quot; y=&quot;196&quot; font-size=&quot;11&quot; class=&quot;f-mut&quot;&gt;rare: not reliable&lt;/text&gt;
&lt;rect x=&quot;360&quot; y=&quot;212&quot; width=&quot;200&quot; height=&quot;96&quot; rx=&quot;12&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot;/&gt;
&lt;text x=&quot;460&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;DIRECT&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;262&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;FV of goods/services&lt;/text&gt;&lt;text x=&quot;460&quot; y=&quot;284&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;at date of receipt&lt;/text&gt;
&lt;rect x=&quot;575&quot; y=&quot;212&quot; width=&quot;175&quot; height=&quot;96&quot; rx=&quot;12&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre)&quot;/&gt;
&lt;text x=&quot;662&quot; y=&quot;240&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;INDIRECT&lt;/text&gt;&lt;text x=&quot;662&quot; y=&quot;262&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;FV of instruments&lt;/text&gt;&lt;text x=&quot;662&quot; y=&quot;284&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot;&gt;at date of receipt&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;For employees the date is the grant date; for others it is the date the entity obtains the goods or the counterparty renders service (slides 11–12).&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;details&gt;&lt;summary&gt;Why is the indirect method always used for employees? (IFRS 2.12)&lt;/summary&gt;&lt;div&gt;Shares or options form part of the remuneration package together with salary and other benefits: it is usually not possible to measure which part of the service each component “pays” for, nor to value the package as a whole without valuing the options. Moreover, options are often granted as a bonus or an incentive to stay or to improve performance: the entity pays additional remuneration for additional benefits that are hard to estimate. Slide 20 adds that the stock option plan provides an additional benefit “not directly linked” to salary and therefore not measurable by reference to it.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why does the opposite presumption apply to other suppliers? (IFRS 2.13)&lt;/summary&gt;&lt;div&gt;A consultant or a supplier of goods normally has a market price for what they provide. The presumption that fair value can be estimated is &lt;em&gt;rebuttable&lt;/em&gt;: only in rare cases does the entity switch to the indirect method, which is still measured at the date of receipt, not at grant date.&lt;/div&gt;&lt;/details&gt;

&lt;h3&gt;When to recognise the expense: the life of a plan&lt;/h3&gt;
&lt;p&gt;If the instruments &lt;strong&gt;vest immediately&lt;/strong&gt;, the service is presumed to have already been received: the full expense and reserve are recognised &lt;strong&gt;at grant date&lt;/strong&gt; (IFRS 2.14). If they vest only after a &lt;strong&gt;period of service&lt;/strong&gt;, the services are deemed to be received in the future and are recognised &lt;strong&gt;as they are rendered over the vesting period&lt;/strong&gt; (IFRS 2.15): with three years of service required, the expense is spread over three years; with a performance condition of variable length, over the &lt;em&gt;expected vesting period&lt;/em&gt;.&lt;/p&gt;
&lt;div class=&quot;stepper&quot; data-stepper&gt;
&lt;svg viewBox=&quot;0 0 760 120&quot; role=&quot;img&quot; aria-label=&quot;Timeline of a share option&quot;&gt;
&lt;line x1=&quot;30&quot; y1=&quot;60&quot; x2=&quot;730&quot; y2=&quot;60&quot; class=&quot;s-rule&quot; stroke-width=&quot;3&quot;/&gt;
&lt;rect class=&quot;hl&quot; data-hl=&quot;1&quot; x=&quot;80&quot; y=&quot;48&quot; width=&quot;330&quot; height=&quot;24&quot; rx=&quot;6&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot;/&gt;
&lt;rect class=&quot;hl&quot; data-hl=&quot;3&quot; x=&quot;410&quot; y=&quot;48&quot; width=&quot;290&quot; height=&quot;24&quot; rx=&quot;6&quot; style=&quot;fill:var(--ochre-bg);stroke:var(--ochre)&quot;/&gt;
&lt;circle class=&quot;hl&quot; data-hl=&quot;0&quot; cx=&quot;80&quot; cy=&quot;60&quot; r=&quot;10&quot; style=&quot;fill:var(--slate)&quot;/&gt;
&lt;circle class=&quot;hl&quot; data-hl=&quot;2&quot; cx=&quot;410&quot; cy=&quot;60&quot; r=&quot;10&quot; style=&quot;fill:var(--slate)&quot;/&gt;
&lt;circle class=&quot;hl&quot; data-hl=&quot;4&quot; cx=&quot;700&quot; cy=&quot;60&quot; r=&quot;10&quot; style=&quot;fill:var(--brick)&quot;/&gt;
&lt;text x=&quot;80&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;grant date&lt;/text&gt;
&lt;text x=&quot;245&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;vesting period&lt;/text&gt;
&lt;text x=&quot;410&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;vesting date&lt;/text&gt;
&lt;text x=&quot;555&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;exercise period&lt;/text&gt;
&lt;text x=&quot;700&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;exercise / expiry&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;1 · Grant date&lt;/h4&gt;&lt;p&gt;The plan is signed. For employees, the &lt;strong&gt;fair value per option&lt;/strong&gt; is fixed here, once and for all. If the options vest immediately: the whole expense today.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;2 · Vesting period&lt;/h4&gt;&lt;p&gt;At each reporting date the portion of expense accrued is recognised: &lt;em&gt;Dr Employee benefits expense / Cr Share option reserve&lt;/em&gt;. The number of options expected to vest is updated with the best estimate (true-up).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;3 · Vesting date&lt;/h4&gt;&lt;p&gt;The estimate is aligned with the number &lt;strong&gt;that actually vests&lt;/strong&gt;. From here on the total expense is final.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;4 · After the vesting date (IFRS 2.23)&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;No subsequent adjustment&lt;/strong&gt; to total equity: even if vested options are later forfeited or not exercised, the expense is &lt;strong&gt;not reversed&lt;/strong&gt;. Only a transfer &lt;em&gt;within&lt;/em&gt; equity is permitted (e.g. from the share option reserve to retained earnings).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;5 · Exercise or expiry&lt;/h4&gt;&lt;p&gt;If the employee exercises, the reserve is closed against share capital and share premium (see &lt;a href=&quot;#grant&quot;&gt;grant types&lt;/a&gt;). If the option expires “out of the money”, the reserve stays in equity (at most it is reclassified).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;st-bar&quot;&gt;&lt;button class=&quot;btn st-prev&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn st-next&quot;&gt;Next →&lt;/button&gt;&lt;span class=&quot;st-count&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;vesting&quot; class=&quot;sec p-slate&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Paras. 19–21A, 23&lt;/span&gt;&lt;h2&gt;Vesting and non-vesting conditions&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;The key rule: &lt;strong&gt;some conditions go into the price, others into the number&lt;/strong&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Cumulative expense&lt;sub&gt;t&lt;/sub&gt; = No. of instruments expected to vest × FV per instrument (grant date) × years elapsed ⁄ vesting period&lt;small&gt;Expense for year t = Cumulative expense&lt;sub&gt;t&lt;/sub&gt; − Cumulative expense&lt;sub&gt;t−1&lt;/sub&gt; · formula used in the exercises on slides 41–43&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Type of condition&lt;/th&gt;&lt;th&gt;Example&lt;/th&gt;&lt;th&gt;In the FV per unit?&lt;/th&gt;&lt;th&gt;In the number (true-up)?&lt;/th&gt;&lt;th&gt;If not satisfied…&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Service condition&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;remain for 3 years&lt;/td&gt;&lt;td class=&quot;no&quot;&gt;No&lt;/td&gt;&lt;td class=&quot;yes&quot;&gt;Yes&lt;/td&gt;&lt;td&gt;cumulative expense reversed to zero&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Non-market performance&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;10% earnings growth&lt;/td&gt;&lt;td class=&quot;no&quot;&gt;No&lt;/td&gt;&lt;td class=&quot;yes&quot;&gt;Yes&lt;/td&gt;&lt;td&gt;cumulative expense reversed to zero&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Market condition&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;share price above €50&lt;/td&gt;&lt;td class=&quot;yes&quot;&gt;Yes&lt;/td&gt;&lt;td class=&quot;no&quot;&gt;No&lt;/td&gt;&lt;td&gt;expense stays, if service is rendered&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Non-vesting condition&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;contributions to a savings plan&lt;/td&gt;&lt;td class=&quot;yes&quot;&gt;Yes&lt;/td&gt;&lt;td class=&quot;no&quot;&gt;No&lt;/td&gt;&lt;td&gt;expense stays, if service is rendered&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;ul class=&quot;chk&quot;&gt;
&lt;li&gt;&lt;strong&gt;IFRS 2.19&lt;/strong&gt; — Vesting conditions other than market conditions are &lt;em&gt;not&lt;/em&gt; taken into account when estimating fair value at the measurement date: they are reflected by adjusting the &lt;strong&gt;number&lt;/strong&gt; of instruments, so that ultimately the expense is based on the instruments that actually vest. If they do not vest because of failure to complete service or to meet a non-market performance condition, on a cumulative basis &lt;strong&gt;no amount is recognised&lt;/strong&gt;.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;IFRS 2.20&lt;/strong&gt; — During the vesting period the best available estimate of the number expected to vest is used, revised if new information emerges; on the vesting date the estimate becomes the actual number.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;IFRS 2.21&lt;/strong&gt; — &lt;strong&gt;Market conditions&lt;/strong&gt; are incorporated into fair value. The expense is recognised for counterparties who satisfy all other conditions (e.g. remain in service) &lt;em&gt;irrespective&lt;/em&gt; of whether the market condition is met.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;IFRS 2.21A&lt;/strong&gt; — The same applies to &lt;strong&gt;non-vesting conditions&lt;/strong&gt;: included in fair value; expense recognised for counterparties who satisfy the non-market vesting conditions, irrespective of the non-vesting conditions.&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;strong&gt;Why this asymmetry?&lt;/strong&gt; &lt;span class=&quot;badge add&quot;&gt;addition&lt;/span&gt; An option pricing model can already “price” the probability that the share reaches a given level: that probability reduces the fair value from the outset. Also adjusting the number would count it twice. Service conditions and accounting-based performance conditions, by contrast, do not lend themselves to a market model and are handled by estimating how many options will vest.&lt;/div&gt;

&lt;h3&gt;Simulator: does the expense stay or is it reversed?&lt;/h3&gt;
&lt;div class=&quot;card&quot; id=&quot;vsim&quot;&gt;
&lt;p class=&quot;gl&quot; style=&quot;margin-bottom:8px&quot;&gt;Illustrative plan: 1,000 options, FV per option at grant date €10, 3-year vesting. Choose the type of condition and the outcome.&lt;/p&gt;
&lt;div class=&quot;presets&quot; id=&quot;vs-type&quot;&gt;&lt;button class=&quot;btn on&quot; data-vt=&quot;service&quot;&gt;Service&lt;/button&gt;&lt;button class=&quot;btn&quot; data-vt=&quot;perf&quot;&gt;Non-market performance&lt;/button&gt;&lt;button class=&quot;btn&quot; data-vt=&quot;market&quot;&gt;Market condition&lt;/button&gt;&lt;button class=&quot;btn&quot; data-vt=&quot;nonv&quot;&gt;Non-vesting&lt;/button&gt;&lt;/div&gt;
&lt;label style=&quot;display:block;margin:8px 0&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;vs-serv&quot; checked&gt; The employee remains in service for the full 3 years&lt;/label&gt;
&lt;label style=&quot;display:block;margin:8px 0&quot; id=&quot;vs-cond-l&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;vs-cond&quot; checked&gt; &lt;span id=&quot;vs-cond-t&quot;&gt;The condition is satisfied&lt;/span&gt;&lt;/label&gt;
&lt;div class=&quot;result&quot; id=&quot;vs-out&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;grant&quot; class=&quot;sec p-slate&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Slides 20–22&lt;/span&gt;&lt;h2&gt;Share options and forms of grant&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;A &lt;dfn&gt;stock option&lt;/dfn&gt; gives the holder the right to buy the company&#x27;s shares at a given price. In plans with all the features of an equity-settled arrangement, the &lt;strong&gt;fair value of the instruments granted&lt;/strong&gt; must be estimated, because the fair value of the services received cannot be measured reliably. During the vesting period a &lt;strong&gt;share option reserve&lt;/strong&gt; is always built up; what changes is what happens at the end of the options&#x27; life.&lt;/p&gt;
&lt;p class=&quot;gl&quot;&gt;Illustrative figures &lt;span class=&quot;badge add&quot;&gt;addition&lt;/span&gt;: 1,000 vested options, FV per option at grant date €10 (accumulated reserve €10,000), nominal value per share €1. The slides describe the entries only in words.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Free of charge&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;In mixed form&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Treasury shares&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
&lt;p&gt;&lt;strong&gt;Free-of-charge grant.&lt;/strong&gt; At the end of the options&#x27; life the reserve is closed and the capital increase is recorded; if fair value exceeds nominal value, a &lt;strong&gt;share premium reserve&lt;/strong&gt; arises.&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table class=&quot;je&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Debit&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Credit&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Share option reserve&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;cr&quot;&gt;Share capital (1,000 × €1)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;cr&quot;&gt;Share premium reserve&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;9,000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;strong&gt;Mixed form&lt;/strong&gt;: one part is free (the service), one part is paid by the beneficiary (the exercise price, here €4 per share). The reserve is reversed for the free part, a &lt;strong&gt;receivable&lt;/strong&gt; from the beneficiary is recognised for the paid part and the capital increase is recorded. The share premium is partly the difference between fair value and nominal value, partly the amount paid.&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table class=&quot;je&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Debit&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Credit&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Receivables from beneficiaries (1,000 × €4)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;4,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Share option reserve&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;cr&quot;&gt;Share capital&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;1,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;cr&quot;&gt;Share premium reserve (9,000 + 4,000)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;13,000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;strong&gt;With treasury shares held&lt;/strong&gt;: no new shares are issued; previously repurchased shares are delivered. The reserve is reversed and the &lt;strong&gt;gain&lt;/strong&gt; (the entity paid less than fair value for them) or &lt;strong&gt;loss&lt;/strong&gt; (it paid more) on the shares leaving the portfolio is recognised. Example: treasury shares carried at €12.&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table class=&quot;je&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Account&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Debit&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Credit&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Share option reserve&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;10,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Negative difference on treasury shares&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;2,000&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;cr&quot;&gt;Treasury shares (1,000 × €12)&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;12,000&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;badge add&quot;&gt;addition&lt;/span&gt; Under IAS 32.33, no gain or loss is recognised in profit or loss on the purchase, sale, issue or cancellation of treasury shares: the difference remains in equity.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;strong&gt;Modifications to terms and conditions&lt;/strong&gt; (slide 22). If the terms of a plan with an employee change, events favourable or unfavourable to the employee may arise, which must be analysed and reflected in the financial statements. &lt;span class=&quot;badge add&quot;&gt;addition&lt;/span&gt; In short, IFRS 2.27: at a minimum, the expense measured at the original grant date is always recognised; a modification that &lt;em&gt;increases&lt;/em&gt; fair value (e.g. a reduction in the strike) adds an incremental expense; an unfavourable modification does not reduce the expense.&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;esercizi&quot; class=&quot;sec p-slate&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Slides 41–43&lt;/span&gt;&lt;h2&gt;Exercises: the Kudasai plan&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;Common data:&lt;/strong&gt; Kudasai grants &lt;strong&gt;300 share options&lt;/strong&gt; to each of its &lt;strong&gt;1,500 employees&lt;/strong&gt; (450,000 options), on condition that they remain with the company for the next &lt;strong&gt;3 years&lt;/strong&gt;. Fair value of each option at grant date: &lt;strong&gt;€315&lt;/strong&gt;. Initial estimate: &lt;strong&gt;20%&lt;/strong&gt; of employees will leave and forfeit their options.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Exercise 1&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Exercise 2 step by step&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
&lt;p&gt;The estimates never change and exactly 80% vest in the end. The expense is the same every year.&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Calculation&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Expense in P&amp;amp;L&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Year 1&lt;/td&gt;&lt;td&gt;450,000 × 80% × €315 × 1/3&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;37,800,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Year 2&lt;/td&gt;&lt;td&gt;(450,000 × 80% × €315 × 2/3) − 37,800,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;37,800,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Year 3&lt;/td&gt;&lt;td&gt;(450,000 × 80% × €315) − 75,600,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;37,800,000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;&lt;strong&gt;Total = share option reserve&lt;/strong&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;strong&gt;113,400,000&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;div class=&quot;stepper&quot; data-stepper style=&quot;margin:0;border:none;padding:0&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4&gt;Starting point&lt;/h4&gt;&lt;p&gt;450,000 options, FV €315 fixed at grant date. Estimated leavers 20% (300 employees). &lt;strong&gt;The FV per option will never change&lt;/strong&gt;: only the number is updated (service condition → true-up).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Year 1&lt;/h4&gt;&lt;p&gt;60 employees leave; the estimate of total leavers falls from 20% to &lt;strong&gt;18%&lt;/strong&gt; (270). 82% are expected to vest.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;450,000 × 82% × 315 × 1/3 = &lt;strong&gt;38,745,000&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Year 2&lt;/h4&gt;&lt;p&gt;A further 66 employees leave (126 in total); estimate revised to &lt;strong&gt;19%&lt;/strong&gt; (285). Cumulative 81% × 2/3, less the amount already recognised.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;450,000 × 81% × 315 × 2/3 = 76,545,000&lt;br&gt;76,545,000 − 38,745,000 = &lt;strong&gt;37,800,000&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Year 3 · vesting date&lt;/h4&gt;&lt;p&gt;A further 45 leave (171 in total). 1,329 employees remain × 300 = &lt;strong&gt;398,700&lt;/strong&gt; vested options: the estimate becomes the actual number.&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;398,700 × 315 = 125,590,500&lt;br&gt;125,590,500 − 76,545,000 = &lt;strong&gt;49,045,500&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; hidden&gt;&lt;h4&gt;Interpreting the result&lt;/h4&gt;&lt;p&gt;Total expense 125,590,500 = options actually vested × FV at grant date. The year 3 expense is higher because it &lt;em&gt;catches up&lt;/em&gt; the difference between the previous estimate (81%) and the actual outcome (88.6%). No remeasurement of FV, no effect of the share price.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;st-bar&quot;&gt;&lt;button class=&quot;btn st-prev&quot;&gt;← Back&lt;/button&gt;&lt;button class=&quot;btn st-next&quot;&gt;Next →&lt;/button&gt;&lt;span class=&quot;st-count&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Calculator: change the assumptions&lt;/h3&gt;
&lt;div class=&quot;card&quot; id=&quot;calc&quot;&gt;
&lt;div class=&quot;presets&quot;&gt;&lt;button class=&quot;btn&quot; data-pre=&quot;1&quot;&gt;Load Exercise 1&lt;/button&gt;&lt;button class=&quot;btn&quot; data-pre=&quot;2&quot;&gt;Load Exercise 2&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;c-emp&quot;&gt;Employees&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;c-emp&quot; min=&quot;100&quot; max=&quot;3000&quot; step=&quot;50&quot; value=&quot;1500&quot;&gt;&lt;output id=&quot;o-emp&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;c-opt&quot;&gt;Options per employee&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;c-opt&quot; min=&quot;50&quot; max=&quot;1000&quot; step=&quot;10&quot; value=&quot;300&quot;&gt;&lt;output id=&quot;o-opt&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;c-fv&quot;&gt;FV per option (grant date) €&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;c-fv&quot; min=&quot;10&quot; max=&quot;600&quot; step=&quot;5&quot; value=&quot;315&quot;&gt;&lt;output id=&quot;o-fv&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;c-p1&quot;&gt;Estimated leavers at end of year 1&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;c-p1&quot; min=&quot;0&quot; max=&quot;50&quot; step=&quot;1&quot; value=&quot;18&quot;&gt;&lt;output id=&quot;o-p1&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;c-p2&quot;&gt;Estimated leavers at end of year 2&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;c-p2&quot; min=&quot;0&quot; max=&quot;50&quot; step=&quot;1&quot; value=&quot;19&quot;&gt;&lt;output id=&quot;o-p2&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;c-v&quot;&gt;Employees who vest (year 3)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;c-v&quot; min=&quot;0&quot; max=&quot;3000&quot; step=&quot;1&quot; value=&quot;1329&quot;&gt;&lt;output id=&quot;o-v&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table id=&quot;c-tab&quot;&gt;&lt;/table&gt;&lt;/div&gt;
&lt;svg id=&quot;c-chart&quot; viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;Annual and cumulative expense&quot;&gt;&lt;/svg&gt;
&lt;p class=&quot;note&quot;&gt;Bars: expense for the year. Line: cumulative expense (= share option reserve). Try raising the estimated leavers sharply in years 1–2 while leaving the final number unchanged: you will see the year 3 catch-up.&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;selfcheck&quot;&gt;&lt;h3&gt;Self-check · Part II&lt;/h3&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;At what date is the fair value of options granted to employees measured? And for an external consultant?&lt;/summary&gt;&lt;div&gt;Employees: grant date (IFRS 2.11). Other counterparties: the date the entity obtains the goods or the counterparty renders service (IFRS 2.13).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;An employee leaves in the second year of a plan with a three-year service condition. What happens to the expense already recognised for them?&lt;/summary&gt;&lt;div&gt;It is reversed through the true-up: on a cumulative basis no expense is recognised for instruments that do not vest because of failure to complete service (IFRS 2.19–20).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;The plan requires the share price to reach €50; the employee stays three years but the share stops at €40. Is the expense reversed?&lt;/summary&gt;&lt;div&gt;No. It is a market condition, already taken into account in fair value: the expense is recognised for those who satisfy the other conditions, irrespective of the market condition (IFRS 2.21).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;Vested options expire unexercised. Can the expense be reversed?&lt;/summary&gt;&lt;div&gt;No (IFRS 2.23). The amount can only be transferred from one component of equity to another.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;In Exercise 2, why is the third-year expense 49,045,500 rather than about 38 million?&lt;/summary&gt;&lt;div&gt;Because at the vesting date the estimate (81%) is aligned with the actual outcome (1,329/1,500 = 88.6%): the third year absorbs the entire cumulative adjustment.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ================= PART III ================= --&gt;
&lt;div class=&quot;part p-brick&quot;&gt;&lt;div class=&quot;pn&quot;&gt;Part III&lt;/div&gt;&lt;h2&gt;Cash-settled and transactions with cash alternatives&lt;/h2&gt;&lt;p&gt;When the entity must pay cash, or when someone can choose between cash and shares (paras. 30–43).&lt;/p&gt;&lt;/div&gt;

&lt;section id=&quot;cash&quot; class=&quot;sec p-brick&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Paras. 30–33D&lt;/span&gt;&lt;h2&gt;Cash-settled: a liability that is remeasured&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Principle (IFRS 2.30): the entity measures the goods or services acquired and the &lt;strong&gt;liability&lt;/strong&gt; incurred at the &lt;strong&gt;fair value of the liability&lt;/strong&gt;. Until the liability is settled, it &lt;strong&gt;remeasures it at the end of each reporting period and at the date of settlement&lt;/strong&gt;, with changes in fair value recognised &lt;strong&gt;in profit or loss&lt;/strong&gt;.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;formula&quot;&gt;Dr Expense for goods / services&lt;br&gt;Cr Liability (at fair value)&lt;small&gt;Slide 23: a liability measured at FV arises; the expense is recognised&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;Δ fair value of the liability&lt;br&gt;→ profit or loss for the period&lt;small&gt;Until settlement (IFRS 2.30)&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Share appreciation rights&lt;/h3&gt;
&lt;p&gt;Example from the slides: &lt;dfn&gt;share appreciation rights&lt;/dfn&gt; (SARs). The expense and the liability are recognised &lt;strong&gt;as the employees render service&lt;/strong&gt; (IFRS 2.32):&lt;/p&gt;
&lt;ul class=&quot;chk&quot;&gt;&lt;li&gt;SARs that vest &lt;strong&gt;immediately&lt;/strong&gt;: in the absence of evidence to the contrary, the service is presumed to have been received → expense and liability recognised &lt;strong&gt;immediately&lt;/strong&gt;.&lt;/li&gt;&lt;li&gt;SARs that vest after a &lt;strong&gt;period of service&lt;/strong&gt;: expense and liability are recognised over that period.&lt;/li&gt;&lt;/ul&gt;
&lt;p&gt;The liability is measured, initially and at each reporting date until settled, at the &lt;strong&gt;fair value of the SARs&lt;/strong&gt;, by applying an &lt;em&gt;option pricing model&lt;/em&gt; that takes into account the terms and conditions of the grant and the extent to which the employees have rendered service to date (IFRS 2.33).&lt;/p&gt;
&lt;h3&gt;Conditions in cash-settled plans (33A–33D)&lt;/h3&gt;
&lt;ul class=&quot;chk&quot;&gt;
&lt;li&gt;&lt;strong&gt;33A&lt;/strong&gt; — Non-market vesting conditions: &lt;em&gt;excluded&lt;/em&gt; from fair value; they are reflected by adjusting the &lt;strong&gt;number of awards&lt;/strong&gt; included in the measurement of the liability.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;33B&lt;/strong&gt; — An amount is recognised over the vesting period based on the best estimate of the number of awards expected to vest; the estimate is revised when necessary and, on the vesting date, equals the number of awards that vest.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;33C&lt;/strong&gt; — Market conditions and non-vesting conditions: &lt;em&gt;included&lt;/em&gt; in fair value, both at initial recognition and at each remeasurement.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;33D&lt;/strong&gt; — Result: the &lt;strong&gt;cumulative expense&lt;/strong&gt; recognised is &lt;strong&gt;equal to the cash paid&lt;/strong&gt;.&lt;/li&gt;
&lt;/ul&gt;
&lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;badge ext&quot;&gt;external source&lt;/span&gt; Paragraphs 33A–33D derive from the June 2016 amendment “Classification and Measurement of Share-based Payment Transactions” (&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-2-share-based-payment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 2 page on ifrs.org&lt;/a&gt;), which aligned the treatment of conditions with that for equity-settled awards.&lt;/p&gt;

&lt;h3&gt;Simulator: cash-settled versus equity-settled&lt;/h3&gt;
&lt;div class=&quot;card&quot; id=&quot;sar&quot;&gt;
&lt;p class=&quot;gl&quot; style=&quot;margin-bottom:8px&quot;&gt;&lt;span class=&quot;badge add&quot;&gt;addition · illustrative example&lt;/span&gt; 100 employees × 200 SARs = 20,000 SARs, 3-year vesting, all employees stay, payment at the end of year 3 equal to the value of the SAR at that time. Compared with an identical equity-settled plan measured at grant date.&lt;/p&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;s-g&quot;&gt;FV at grant date €&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-g&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;o-g&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;s-1&quot;&gt;SAR FV at end of year 1 €&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-1&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;12&quot;&gt;&lt;output id=&quot;o-1&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;s-2&quot;&gt;SAR FV at end of year 2 €&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-2&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;15&quot;&gt;&lt;output id=&quot;o-2&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;s-3&quot;&gt;Amount paid at end of year 3 €&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;s-3&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;9&quot;&gt;&lt;output id=&quot;o-3&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table id=&quot;s-tab&quot;&gt;&lt;/table&gt;&lt;/div&gt;
&lt;svg id=&quot;s-chart&quot; viewBox=&quot;0 0 640 260&quot; role=&quot;img&quot; aria-label=&quot;Annual cash-settled and equity-settled expense&quot;&gt;&lt;/svg&gt;
&lt;p class=&quot;note&quot;&gt;Note how, in the cash-settled plan, the expense for a year can become &lt;strong&gt;negative&lt;/strong&gt; (income) if the share price falls: the cumulative expense tracks the cash that will actually be paid (33D). In the equity-settled plan the share price after grant date is irrelevant.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Equity-settled and cash-settled compared&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Equity-settled&lt;/th&gt;&lt;th&gt;Cash-settled&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Credit side of the expense&lt;/td&gt;&lt;td&gt;Equity (reserve)&lt;/td&gt;&lt;td&gt;Liability&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Fair value (employees)&lt;/td&gt;&lt;td&gt;of the instruments, at grant date, &lt;strong&gt;frozen&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;of the liability, &lt;strong&gt;remeasured&lt;/strong&gt; at each reporting date and at settlement&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Non-market vesting&lt;/td&gt;&lt;td&gt;adjust the number (2.19–20)&lt;/td&gt;&lt;td&gt;adjust the number (33A–B)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Market / non-vesting&lt;/td&gt;&lt;td&gt;in initial FV (2.21–21A)&lt;/td&gt;&lt;td&gt;in FV, at each remeasurement (33C)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Final total expense&lt;/td&gt;&lt;td&gt;no. vested × grant-date FV&lt;/td&gt;&lt;td&gt;= cash paid (33D)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;After the vesting date&lt;/td&gt;&lt;td&gt;no adjustment (2.23)&lt;/td&gt;&lt;td&gt;remeasurement until payment&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;alternative&quot; class=&quot;sec p-brick&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Paras. 34–43&lt;/span&gt;&lt;h2&gt;Transactions with cash alternatives&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;If the arrangement gives the entity &lt;em&gt;or&lt;/em&gt; the counterparty a choice between cash (or other assets) and equity instruments, the transaction (or each of its components) is accounted for (IFRS 2.34):&lt;/p&gt;
&lt;ul class=&quot;chk&quot;&gt;&lt;li&gt;as &lt;strong&gt;cash-settled&lt;/strong&gt; if, and to the extent that, the entity has &lt;strong&gt;incurred a liability&lt;/strong&gt; to settle in cash or other assets;&lt;/li&gt;&lt;li&gt;as &lt;strong&gt;equity-settled&lt;/strong&gt; if, and to the extent that, no such liability has been incurred.&lt;/li&gt;&lt;/ul&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Counterparty chooses&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Entity chooses&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
&lt;p&gt;Giving the counterparty the right to choose means the entity has granted a &lt;dfn&gt;compound financial instrument&lt;/dfn&gt; with:&lt;/p&gt;
&lt;figure class=&quot;fig&quot; style=&quot;margin-top:6px&quot;&gt;
&lt;svg viewBox=&quot;0 0 700 150&quot; role=&quot;img&quot; aria-label=&quot;Compound instrument&quot;&gt;
&lt;rect x=&quot;20&quot; y=&quot;40&quot; width=&quot;430&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--brick-bg);stroke:var(--brick)&quot; stroke-width=&quot;1.6&quot;/&gt;
&lt;rect x=&quot;450&quot; y=&quot;40&quot; width=&quot;230&quot; height=&quot;60&quot; rx=&quot;10&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot; stroke-width=&quot;1.6&quot;/&gt;
&lt;text x=&quot;235&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Debt component&lt;/text&gt;&lt;text x=&quot;235&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;right to demand cash → liability&lt;/text&gt;
&lt;text x=&quot;565&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;Equity component&lt;/text&gt;&lt;text x=&quot;565&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot;&gt;right to demand shares&lt;/text&gt;
&lt;text x=&quot;350&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; class=&quot;f-mut&quot;&gt;fair value of the compound instrument&lt;/text&gt;
&lt;text x=&quot;235&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--brick)&quot;&gt;cash-settled rules&lt;/text&gt;&lt;text x=&quot;565&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; style=&quot;fill:var(--slate)&quot;&gt;equity-settled rules&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;ul class=&quot;chk&quot;&gt;
&lt;li&gt;&lt;strong&gt;Non-employee counterparties&lt;/strong&gt;, FV of goods measured directly (2.35): equity component = FV of goods or services received − FV of the debt component, at the date of receipt.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Employees and other transactions&lt;/strong&gt; (2.36): the fair value of the compound instrument is measured at the measurement date, taking into account its terms and conditions. &lt;span class=&quot;badge add&quot;&gt;addition&lt;/span&gt; IFRS 2.37 requires the debt component to be measured first and then the equity component, taking into account that the counterparty must forfeit the cash to receive the shares; if the two alternatives have the same value, the equity component is often zero.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Separate accounting&lt;/strong&gt; (2.38): for the debt component, expense + liability as the service is rendered (cash-settled rules); for the equity component, expense + increase in equity (equity-settled rules).&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;At settlement&lt;/strong&gt; (2.39–40): the liability is remeasured to fair value. If shares are delivered, the liability is transferred &lt;strong&gt;directly to equity&lt;/strong&gt; as consideration. If cash is paid, the payment settles the liability and the equity component previously recognised &lt;strong&gt;remains in equity&lt;/strong&gt; (the counterparty has forfeited the shares); a transfer within equity is permitted.&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;strong&gt;Try it (IFRS 2.35)&lt;/strong&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;k-g&quot;&gt;FV of goods received €&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;k-g&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;1000&quot;&gt;&lt;output id=&quot;o-kg&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;&lt;label for=&quot;k-d&quot;&gt;FV of debt component €&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;k-d&quot; min=&quot;0&quot; max=&quot;2000&quot; step=&quot;10&quot; value=&quot;800&quot;&gt;&lt;output id=&quot;o-kd&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;result&quot; id=&quot;k-out&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;The entity must determine whether it has a &lt;strong&gt;present obligation to settle in cash&lt;/strong&gt; (2.41). Answer the questions:&lt;/p&gt;
&lt;div class=&quot;wiz&quot; data-wiz&gt;
&lt;div data-node=&quot;q1&quot;&gt;&lt;div class=&quot;q&quot;&gt;Does the share alternative have commercial substance? (e.g. the entity is not legally prohibited from issuing shares)&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;q2&quot;&gt;Yes&lt;/button&gt;&lt;button class=&quot;btn&quot; data-go=&quot;cash&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;q2&quot; hidden&gt;&lt;div class=&quot;q&quot;&gt;Does the entity have a past practice or a stated policy of settling in cash, or does it generally settle in cash whenever the counterparty asks?&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;cash&quot;&gt;Yes&lt;/button&gt;&lt;button class=&quot;btn&quot; data-go=&quot;eq&quot;&gt;No&lt;/button&gt;&lt;button class=&quot;btn&quot; data-go=&quot;q1&quot;&gt;↺ Start again&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;cash&quot; hidden&gt;&lt;div class=&quot;end&quot;&gt;&lt;strong&gt;Present obligation → cash-settled&lt;/strong&gt; (IFRS 2.42). The rules in paras. 30–33D apply.&lt;/div&gt;&lt;div class=&quot;opts&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;q1&quot;&gt;↺ Start again&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;eq&quot; hidden&gt;&lt;div class=&quot;end&quot;&gt;&lt;strong&gt;No obligation → equity-settled&lt;/strong&gt; (IFRS 2.43). On settlement:
&lt;ol type=&quot;a&quot;&gt;&lt;li&gt;if it pays &lt;strong&gt;cash&lt;/strong&gt;: this is the repurchase of an equity interest, i.e. a &lt;strong&gt;deduction from equity&lt;/strong&gt;, except as in (c);&lt;/li&gt;&lt;li&gt;if it delivers &lt;strong&gt;shares&lt;/strong&gt;: no further entry (at most a transfer within equity), except as in (c);&lt;/li&gt;&lt;li&gt;if it chooses the alternative with the &lt;strong&gt;higher fair value&lt;/strong&gt;: &lt;strong&gt;additional expense&lt;/strong&gt; for the excess value given (cash paid − FV of the shares it would have issued, or FV of the shares issued − cash it would have paid).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;div class=&quot;opts&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;q1&quot;&gt;↺ Start again&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;Example for (c) &lt;span class=&quot;badge add&quot;&gt;addition&lt;/span&gt;: at the settlement date the cash alternative is worth €1,000 and the shares €1,200. If the entity delivers the shares, it recognises an additional expense of €200; if it pays €1,000 in cash, there is no additional expense (deduction from equity of €1,000).&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;selfcheck&quot;&gt;&lt;h3&gt;Self-check · Part III&lt;/h3&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;In a cash-settled plan, where does the change in the fair value of the liability between two reporting dates go?&lt;/summary&gt;&lt;div&gt;To profit or loss for the period (IFRS 2.30).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;A market condition in a cash-settled plan: in the fair value or in the number?&lt;/summary&gt;&lt;div&gt;In the fair value, both initially and at each remeasurement (IFRS 2.33C).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;What does the cumulative expense of a cash-settled plan ultimately equal?&lt;/summary&gt;&lt;div&gt;Exactly the cash paid (IFRS 2.33D).&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;The employee can choose between cash and shares and in the end chooses cash. What happens to the equity component already recognised?&lt;/summary&gt;&lt;div&gt;It remains in equity (IFRS 2.40); only a transfer between components of equity is permitted.&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;quiz&quot;&gt;&lt;summary&gt;The entity can choose, but has always settled in cash. How does it classify the plan?&lt;/summary&gt;&lt;div&gt;Cash-settled: past practice creates a present obligation to settle in cash (IFRS 2.41–42).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ================= PART IV ================= --&gt;
&lt;div class=&quot;part p-ochre&quot;&gt;&lt;div class=&quot;pn&quot;&gt;Part IV&lt;/div&gt;&lt;h2&gt;Group, disclosures and a real set of financial statements&lt;/h2&gt;&lt;p&gt;Plans between entities in the same group, required disclosures and the BNP Paribas case (paras. 43A–52).&lt;/p&gt;&lt;/div&gt;

&lt;section id=&quot;gruppo&quot; class=&quot;sec p-ochre&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Paras. 43A–43D&lt;/span&gt;&lt;h2&gt;Share-based payment among group entities&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;In its separate or individual financial statements, the entity that &lt;strong&gt;receives&lt;/strong&gt; the goods or services measures them as equity-settled or cash-settled by assessing (IFRS 2.43A) the &lt;em&gt;nature of the awards granted&lt;/em&gt; and &lt;em&gt;its own rights and obligations&lt;/em&gt;. The amount it recognises may differ from the amount recognised in the consolidated financial statements or by the group entity settling the transaction.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--ochre)&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Entity receiving the services (2.43B)&lt;/h4&gt;Equity-settled when the awards are &lt;strong&gt;its own equity instruments&lt;/strong&gt;, or it has &lt;strong&gt;no obligation&lt;/strong&gt; to settle. Subsequently it remeasures only for changes in &lt;em&gt;non-market vesting conditions&lt;/em&gt;. In all other circumstances: cash-settled.&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--ochre)&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Entity settling, when another receives (2.43C)&lt;/h4&gt;Equity-settled &lt;strong&gt;only&lt;/strong&gt; if it settles with &lt;strong&gt;its own equity instruments&lt;/strong&gt;. Otherwise: cash-settled.&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Classify it yourself&lt;/h3&gt;
&lt;div class=&quot;wiz card&quot; data-wiz&gt;
&lt;div data-node=&quot;g0&quot;&gt;&lt;div class=&quot;q&quot;&gt;From the perspective of which entity are you looking at the transaction?&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;r1&quot;&gt;The one receiving the services&lt;/button&gt;&lt;button class=&quot;btn&quot; data-go=&quot;s1&quot;&gt;The one settling (another receives)&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;r1&quot; hidden&gt;&lt;div class=&quot;q&quot;&gt;Are the awards equity instruments of the receiving entity?&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;reEq&quot;&gt;Yes&lt;/button&gt;&lt;button class=&quot;btn&quot; data-go=&quot;r2&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;r2&quot; hidden&gt;&lt;div class=&quot;q&quot;&gt;Does the receiving entity have an obligation to settle the transaction?&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;reCash&quot;&gt;Yes&lt;/button&gt;&lt;button class=&quot;btn&quot; data-go=&quot;reEq2&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;reEq&quot; hidden&gt;&lt;div class=&quot;end&quot;&gt;&lt;strong&gt;Equity-settled&lt;/strong&gt; (2.43B). Remeasurement only for non-market vesting conditions.&lt;/div&gt;&lt;div class=&quot;opts&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;g0&quot;&gt;↺ Start again&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;reEq2&quot; hidden&gt;&lt;div class=&quot;end&quot;&gt;&lt;strong&gt;Equity-settled&lt;/strong&gt; (2.43B): someone else pays; for the receiving entity it is a capital contribution. Typical case &lt;span class=&quot;badge add&quot;&gt;addition&lt;/span&gt;: the parent grants its own shares (or even cash) to the employees of the subsidiary, which has no obligation.&lt;/div&gt;&lt;div class=&quot;opts&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;g0&quot;&gt;↺ Start again&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;reCash&quot; hidden&gt;&lt;div class=&quot;end&quot;&gt;&lt;strong&gt;Cash-settled&lt;/strong&gt; (2.43B, “in all other circumstances”). E.g. the subsidiary must deliver shares of the parent, which it will have to acquire.&lt;/div&gt;&lt;div class=&quot;opts&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;g0&quot;&gt;↺ Start again&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;s1&quot; hidden&gt;&lt;div class=&quot;q&quot;&gt;Does it settle with its own equity instruments?&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;seEq&quot;&gt;Yes&lt;/button&gt;&lt;button class=&quot;btn&quot; data-go=&quot;seCash&quot;&gt;No (cash or another entity&#x27;s instruments)&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;seEq&quot; hidden&gt;&lt;div class=&quot;end&quot;&gt;&lt;strong&gt;Equity-settled&lt;/strong&gt; (2.43C). E.g. the parent grants its own shares to the employees of the subsidiary.&lt;/div&gt;&lt;div class=&quot;opts&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;g0&quot;&gt;↺ Start again&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div data-node=&quot;seCash&quot; hidden&gt;&lt;div class=&quot;end&quot;&gt;&lt;strong&gt;Cash-settled&lt;/strong&gt; (2.43C). E.g. the parent pays the subsidiary&#x27;s employees in cash, based on its own share price.&lt;/div&gt;&lt;div class=&quot;opts&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button class=&quot;btn&quot; data-go=&quot;g0&quot;&gt;↺ Start again&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;note&quot;&gt;&lt;span class=&quot;badge add&quot;&gt;addition&lt;/span&gt; In the consolidated financial statements the same transaction is viewed from the perspective of the group as a single entity: if the group delivers equity instruments of the parent it is equity-settled; if it pays cash it is cash-settled. This is why the amounts may differ between the financial statements of the subsidiary, the parent and the group (slide 36). Link: lecture on IFRS 10 and consolidation.&lt;/p&gt;
&lt;/section&gt;

&lt;section id=&quot;disclosure&quot; class=&quot;sec p-ochre&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Paras. 44–52&lt;/span&gt;&lt;h2&gt;Disclosures: what to report in the notes&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;Three guiding principles: enabling users of the financial statements to understand the &lt;strong&gt;nature and extent&lt;/strong&gt; of the arrangements that existed during the period (2.44), &lt;strong&gt;how the fair value&lt;/strong&gt; of the goods or services received or of the equity instruments granted &lt;strong&gt;was determined&lt;/strong&gt; (2.46) and &lt;span class=&quot;badge add&quot;&gt;addition&lt;/span&gt; the &lt;strong&gt;effect&lt;/strong&gt; of the arrangements on profit or loss and on the financial position (2.50). The slides focus on the first two. Tick off the minimum items required by 2.45 as you review them:&lt;/p&gt;
&lt;div class=&quot;check-list&quot;&gt;
&lt;button&gt;&lt;span class=&quot;bx&quot;&gt;✓&lt;/span&gt;&lt;span&gt;&lt;strong&gt;Description of each type of arrangement&lt;/strong&gt; that existed during the period: general terms and conditions (vesting requirements, maximum term of options granted, method of settlement, cash or equity). Substantially similar arrangements may be aggregated, unless separate disclosure is needed.&lt;/span&gt;&lt;/button&gt;
&lt;button&gt;&lt;span class=&quot;bx&quot;&gt;✓&lt;/span&gt;&lt;span&gt;&lt;strong&gt;Number and weighted average exercise price&lt;/strong&gt; of options: outstanding at the beginning of the period, granted, &lt;em&gt;forfeited&lt;/em&gt;, exercised, expired, outstanding at the end of the period, exercisable at the end of the period.&lt;/span&gt;&lt;/button&gt;
&lt;button&gt;&lt;span class=&quot;bx&quot;&gt;✓&lt;/span&gt;&lt;span&gt;For options &lt;strong&gt;exercised during the period&lt;/strong&gt;: weighted average share price at the date of exercise (or for the period, if exercised on a regular basis).&lt;/span&gt;&lt;/button&gt;
&lt;button&gt;&lt;span class=&quot;bx&quot;&gt;✓&lt;/span&gt;&lt;span&gt;For options &lt;strong&gt;outstanding at the end of the period&lt;/strong&gt;: range of exercise prices and weighted average remaining contractual life, divided into meaningful ranges if the range is wide.&lt;/span&gt;&lt;/button&gt;
&lt;/div&gt;
&lt;h4&gt;The reconciliation of movements, in practice &lt;span class=&quot;badge add&quot;&gt;addition · illustrative figures&lt;/span&gt;&lt;/h4&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Options&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Number&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Weighted average exercise price €&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Outstanding at 1 January&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;500,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;20.0&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;+ Granted&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;120,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;24.0&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;− Forfeited&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(30,000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;21.0&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;− Exercised&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(90,000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;18.0&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;− Expired&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;(20,000)&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;25.0&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;strong&gt;Outstanding at 31 December&lt;/strong&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;strong&gt;480,000&lt;/strong&gt;&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;of which exercisable at 31 December&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;210,000&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;bnp&quot; class=&quot;sec p-ochre&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Slides 44–47&lt;/span&gt;&lt;h2&gt;Case: BNP Paribas, 2025 consolidated financial statements&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;The slides show the notes to the BNP Paribas consolidated financial statements for the year ended 31 December 2025 (&lt;em&gt;unaudited figures&lt;/em&gt;). The case is useful because a few lines bring together almost all of IFRS 2.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--slate)&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Stock option and share award plans → equity-settled&lt;/h4&gt;
&lt;ul class=&quot;chk&quot;&gt;&lt;li&gt;Expense recognised over the vesting period if the benefit is conditional on the beneficiary&#x27;s continued employment.&lt;/li&gt;&lt;li&gt;Recognised in salary and employee benefit expense, with a corresponding entry in equity.&lt;/li&gt;&lt;li&gt;Plan value determined at the date of grant by the Board of Directors (grant date).&lt;/li&gt;&lt;li&gt;With no market for these instruments: valuation models that incorporate the conditions related to the BNP share price (market conditions in FV).&lt;/li&gt;&lt;li&gt;Only the assumptions on employees leaving the group and on performance conditions &lt;em&gt;not&lt;/em&gt; related to the share price are revised → this is IFRS 2.19–21.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--brick)&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Share price-linked deferred compensation → cash-settled&lt;/h4&gt;
&lt;ul class=&quot;chk&quot;&gt;&lt;li&gt;Expense in the year in which the employee renders the service.&lt;/li&gt;&lt;li&gt;If there is a binding continued-employment condition: service presumed to be rendered over the vesting period, expense recognised &lt;em&gt;pro rata&lt;/em&gt;.&lt;/li&gt;&lt;li&gt;Salary and employee benefit expense with a corresponding liability, revised for conditions not met and for changes in the BNP share price → IFRS 2.30–33.&lt;/li&gt;&lt;li&gt;With no continued-employment condition: immediate expense and liability revised at each reporting date → IFRS 2.32 (vest immediately).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Why a bank pays in deferred instruments&lt;/h3&gt;
&lt;p&gt;Note 7.e explains that the deferred variable remuneration plans concern employees whose activities have a material impact on the group&#x27;s risk profile, under a specific regulatory framework: the French Ministry of Finance decree of 13 December 2010, the European &lt;strong&gt;CRD 4&lt;/strong&gt; directive of 26 July 2013 as amended by &lt;strong&gt;CRD 5&lt;/strong&gt; of 20 May 2019, transposed into the Code monétaire et financier (ordinances of 20 February 2014 and 21 December 2020, decrees and orders of 3 November 2014 and 22 December 2020) and the &lt;strong&gt;European Delegated Regulation of 25 March 2021&lt;/strong&gt;. Payment is deferred over time, conditional on the performance of the business line and the group, and mostly in cash linked to the BNP share price. See the sources in &lt;a href=&quot;#approfondire&quot;&gt;Further reading&lt;/a&gt;.&lt;/p&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 640 250&quot; role=&quot;img&quot; aria-label=&quot;BNP Paribas share-based payment expense 2024 and 2025&quot;&gt;
&lt;line x1=&quot;60&quot; y1=&quot;200&quot; x2=&quot;620&quot; y2=&quot;200&quot; class=&quot;s-rule&quot; stroke-width=&quot;1.5&quot;/&gt;

&lt;rect x=&quot;150&quot; y=&quot;234&quot; width=&quot;12&quot; height=&quot;12&quot; style=&quot;fill:var(--ochre)&quot;/&gt;&lt;text x=&quot;168&quot; y=&quot;244&quot; font-size=&quot;12&quot;&gt;prior-year deferred plans&lt;/text&gt;
&lt;rect x=&quot;380&quot; y=&quot;234&quot; width=&quot;12&quot; height=&quot;12&quot; style=&quot;fill:var(--brick)&quot;/&gt;&lt;text x=&quot;398&quot; y=&quot;244&quot; font-size=&quot;12&quot;&gt;current-year deferred plans&lt;/text&gt;
