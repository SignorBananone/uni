&lt;h1&gt;&lt;b&gt;IFRS 2&lt;/b&gt; Share-based Payment&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;How share-based payments are recognised in the financial statements: share options, share appreciation rights, plans with cash alternatives and group plans.&lt;/p&gt;
&lt;p class=&quot;meta&quot;&gt;Slides by Prof. Roberto Aprile · University of Bergamo, Department of Management · Master Degree in Accounting, Governance and Sustainability · Academic Year 2026–2027 · rev. 04 of 29 June 2026 (48 slides)&lt;/p&gt;
&lt;div class=&quot;oneliner&quot;&gt;&lt;strong&gt;In one sentence.&lt;/strong&gt; When an entity “pays” for goods or services (almost always employee services) with &lt;em&gt;its own shares or options&lt;/em&gt;, or with &lt;em&gt;cash whose amount depends on the share price&lt;/em&gt;, it must recognise an &lt;strong&gt;expense&lt;/strong&gt;; the corresponding credit is to &lt;strong&gt;equity&lt;/strong&gt; in the first case (&lt;em&gt;equity-settled&lt;/em&gt;) and to a &lt;strong&gt;liability&lt;/strong&gt; remeasured over time in the second (&lt;em&gt;cash-settled&lt;/em&gt;).&lt;/div&gt;
&lt;div class=&quot;legend&quot;&gt;&lt;span class=&quot;k-sage&quot;&gt;Part I · Foundations&lt;/span&gt;&lt;span class=&quot;k-slate&quot;&gt;Part II · Equity-settled&lt;/span&gt;&lt;span class=&quot;k-brick&quot;&gt;Part III · Cash-settled and alternatives&lt;/span&gt;&lt;span class=&quot;k-ochre&quot;&gt;Part IV · Group, disclosures, case&lt;/span&gt;&lt;/div&gt;
&lt;p class=&quot;gl&quot; style=&quot;font-size:.85rem&quot;&gt;Key to the labels: &lt;span class=&quot;badge&quot;&gt;slide&lt;/span&gt; content from the slides · &lt;span class=&quot;badge add&quot;&gt;addition&lt;/span&gt; explanation added to aid understanding (not in the slides) · &lt;span class=&quot;badge ext&quot;&gt;external source&lt;/span&gt; information taken from the web, with link.&lt;/p&gt;
&lt;/div&gt;&lt;/header&gt;

&lt;section id=&quot;mappa&quot; class=&quot;sec&quot;&gt;

&lt;p&gt;Click a box to jump to the section. The arrows show the logical relationship: the definitions feed the two main families (equity-settled and cash-settled); transactions with cash alternatives and group transactions are “routed” to one family or the other.&lt;/p&gt;

&lt;!-- ================= PART I ================= --&gt;
&lt;div class=&quot;part p-sage&quot;&gt;&lt;div class=&quot;pn&quot;&gt;Part I&lt;/div&gt;&lt;h2&gt;Foundations: objective, scope, definitions&lt;/h2&gt;&lt;p&gt;What IFRS 2 governs, when it applies and the vocabulary it uses.&lt;/p&gt;&lt;/div&gt;

&lt;section id=&quot;obiettivo&quot; class=&quot;sec p-sage&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Objective · para. 1&lt;/span&gt;&lt;h2&gt;Why IFRS 2 exists&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;quote&quot;&gt;“The objective of this IFRS is to specify the financial reporting by an entity when it undertakes a &lt;em&gt;share-based payment transaction&lt;/em&gt;.”&lt;small&gt;IFRS 2.1 · slide 2&lt;/small&gt;&lt;/div&gt;
&lt;p&gt;A &lt;dfn&gt;share-based payment transaction&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(a transaction in which consideration is based on the entity&#x27;s shares)&lt;/span&gt; is an exchange in which the entity receives goods or services and pays for them with its own equity instruments, or with an amount of cash linked to the value of those instruments. IFRS 2 requires the effects of these transactions to be reflected in &lt;dfn&gt;profit or loss&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(the income statement)&lt;/span&gt; and in the &lt;dfn&gt;financial position&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(the statement of financial position)&lt;/span&gt;, &lt;strong&gt;including expenses associated with share options granted to employees&lt;/strong&gt;.&lt;/p&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;strong&gt;The underlying idea&lt;/strong&gt; &lt;span class=&quot;badge add&quot;&gt;addition&lt;/span&gt;&lt;br&gt;A service received is an expense, whatever the “currency” used to pay for it. If a manager works for three years in exchange for options, the entity consumes a resource (labour) just as if it paid a salary: failing to recognise an expense would overstate profit. For years, in many jurisdictions, employee share options did not pass through profit or loss; IFRS 2 (issued in 2004, see &lt;a href=&quot;#approfondire&quot;&gt;Further reading&lt;/a&gt;) closed this gap.&lt;/div&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 760 230&quot; role=&quot;img&quot; aria-label=&quot;Diagram of the share-based exchange&quot;&gt;
&lt;rect x=&quot;20&quot; y=&quot;70&quot; width=&quot;190&quot; height=&quot;90&quot; rx=&quot;14&quot; class=&quot;f-card s-mut&quot; stroke-width=&quot;1.5&quot;/&gt;

&lt;rect x=&quot;550&quot; y=&quot;70&quot; width=&quot;190&quot; height=&quot;90&quot; rx=&quot;14&quot; class=&quot;f-card s-mut&quot; stroke-width=&quot;1.5&quot;/&gt;

&lt;section id=&quot;scope&quot; class=&quot;sec p-sage&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Scope · paras. 2–6A&lt;/span&gt;&lt;h2&gt;When it applies (and when it does not)&lt;/h2&gt;&lt;/div&gt;
&lt;p&gt;IFRS 2 applies to &lt;strong&gt;all&lt;/strong&gt; share-based payment transactions, &lt;em&gt;whether or not the entity can identify specifically&lt;/em&gt; some or all of the goods or services received (IFRS 2.2). Three families:&lt;/p&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card k-slate&quot; style=&quot;border-top:4px solid var(--slate)&quot;&gt;&lt;strong&gt;a) Equity-settled&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;gl&quot;&gt;settled with the entity&#x27;s equity instruments&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--brick)&quot;&gt;&lt;strong&gt;b) Cash-settled&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;gl&quot;&gt;settled in cash, for amounts based on the share price&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-top:4px solid var(--ochre)&quot;&gt;&lt;strong&gt;c) With a choice&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;gl&quot;&gt;the entity &lt;em&gt;or&lt;/em&gt; the supplier may choose between cash (or other assets) and equity instruments&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;By &lt;em&gt;goods&lt;/em&gt; the standard means inventories, consumables, property, plant and equipment, intangible assets and other non-financial assets (IFRS 2.5).&lt;/p&gt;

&lt;h3&gt;The group case (IFRS 2.3A)&lt;/h3&gt;
&lt;p&gt;The transaction may be settled by &lt;strong&gt;another group entity&lt;/strong&gt; (or by a shareholder of any group entity) on behalf of the entity receiving the goods or services. IFRS 2 therefore also applies to an entity that (a) &lt;em&gt;receives&lt;/em&gt; the goods or services while another entity has the obligation to settle, or (b) &lt;em&gt;has the obligation to settle&lt;/em&gt; while another entity receives the services — &lt;strong&gt;unless&lt;/strong&gt; the transaction is clearly for a purpose other than payment for goods or services supplied. How to account for it is covered in &lt;a href=&quot;#gruppo&quot;&gt;Part IV&lt;/a&gt;.&lt;/p&gt;

&lt;h3&gt;The exclusions&lt;/h3&gt;
&lt;div data-tabs&gt;
&lt;div class=&quot;tablist&quot; role=&quot;tablist&quot;&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Shareholder (2.4)&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Combinations (2.5)&lt;/button&gt;&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Financial instruments (2.6)&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot;&gt;
&lt;p&gt;&lt;strong&gt;Relationship in the capacity of shareholder.&lt;/strong&gt; A transaction with an employee (or other party) &lt;em&gt;in their capacity as a holder of equity instruments&lt;/em&gt; of the entity is not a share-based payment.&lt;/p&gt;
&lt;p&gt;Example from the slides: the entity grants &lt;em&gt;all&lt;/em&gt; holders of a particular class of shares the right to acquire additional shares at a price below fair value (a &lt;em&gt;rights issue&lt;/em&gt;). If an employee receives that right because they are a shareholder, the right falls outside IFRS 2: it does not remunerate their services.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;strong&gt;Business combinations and joint ventures.&lt;/strong&gt; IFRS 2 does not apply to goods acquired as part of the net assets in a &lt;dfn&gt;business combination&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(IFRS 3)&lt;/span&gt;, in a combination of entities or businesses &lt;em&gt;under common control&lt;/em&gt; &lt;span class=&quot;gl&quot;&gt;(IFRS 3 B1–B4)&lt;/span&gt;, or to the contribution of a business on the formation of a &lt;em&gt;joint venture&lt;/em&gt; (IFRS 11).&lt;/p&gt;
&lt;ul class=&quot;chk&quot;&gt;
&lt;li&gt;Shares issued &lt;strong&gt;to obtain control&lt;/strong&gt; of the acquiree → outside (they are IFRS 3 consideration).&lt;/li&gt;
&lt;li&gt;Instruments granted to &lt;strong&gt;employees of the acquiree in their capacity as employees&lt;/strong&gt; (e.g. in return for continued service) → within IFRS 2.&lt;/li&gt;
&lt;li&gt;Cancellation, replacement or modification of plans &lt;em&gt;because of&lt;/em&gt; a business combination or equity restructuring → IFRS 2.&lt;/li&gt;
&lt;/ul&gt;
&lt;p class=&quot;note&quot;&gt;IFRS 3 determines whether the instruments issued are consideration for control (IFRS 3) or remuneration for future services to be recognised after the combination (IFRS 2). Review the course lecture on IFRS 3.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot; role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;strong&gt;Contracts within the scope of IAS 32 (paras. 8–10) or IFRS 9 (paras. 2.4–2.7).&lt;/strong&gt; If the entity receives goods or services under a contract falling within those paragraphs, the financial instruments standards apply, not IFRS 2.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;badge add&quot;&gt;addition&lt;/span&gt; Those paragraphs deal with contracts to buy or sell non-financial items that can be settled net in cash or another financial instrument (e.g. a commodity supply contract that can be settled by difference), except those entered into for the entity&#x27;s own use. They are treated as derivatives, not as remuneration for goods or services.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Try it yourself: inside or outside IFRS 2?&lt;/h3&gt;
&lt;p class=&quot;gl&quot;&gt;Choose an answer for each case: you will get the explanation straight away.&lt;/p&gt;
&lt;div class=&quot;clf&quot;&gt;
&lt;div class=&quot;clf-item&quot; data-correct=&quot;in&quot;&gt;&lt;div&gt;1. Executives are granted share options exercisable if they remain with the company for three years.&lt;/div&gt;&lt;div class=&quot;bt&quot;&gt;&lt;button class=&quot;btn&quot; data-a=&quot;in&quot;&gt;Inside&lt;/button&gt;&lt;button class=&quot;btn&quot; data-a=&quot;out&quot;&gt;Outside&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;span class=&quot;res&quot;&gt;&lt;/span&gt;This is the typical equity-settled share-based payment: options in exchange for services, with a service condition.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;clf-item&quot; data-correct=&quot;in&quot;&gt;&lt;div&gt;2. In two years&#x27; time, sales staff will receive a cash bonus in euros equal to the increase in the share price.&lt;/div&gt;&lt;div class=&quot;bt&quot;&gt;&lt;button class=&quot;btn&quot; data-a=&quot;in&quot;&gt;Inside&lt;/button&gt;&lt;button class=&quot;btn&quot; data-a=&quot;out&quot;&gt;Outside&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;span class=&quot;res&quot;&gt;&lt;/span&gt;Cash-settled: cash is paid, but the amount depends on the share price (it is a share appreciation right).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;clf-item&quot; data-correct=&quot;out&quot;&gt;&lt;div&gt;3. A rights issue to all shareholders at a discounted price; an employee who is also a shareholder subscribes.&lt;/div&gt;&lt;div class=&quot;bt&quot;&gt;&lt;button class=&quot;btn&quot; data-a=&quot;in&quot;&gt;Inside&lt;/button&gt;&lt;button class=&quot;btn&quot; data-a=&quot;out&quot;&gt;Outside&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;span class=&quot;res&quot;&gt;&lt;/span&gt;Outside (IFRS 2.4): the employee receives the right as a shareholder, not as remuneration for services.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;clf-item&quot; data-correct=&quot;out&quot;&gt;&lt;div&gt;4. The entity issues shares to acquire control of a target company.&lt;/div&gt;&lt;div class=&quot;bt&quot;&gt;&lt;button class=&quot;btn&quot; data-a=&quot;in&quot;&gt;Inside&lt;/button&gt;&lt;button class=&quot;btn&quot; data-a=&quot;out&quot;&gt;Outside&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;span class=&quot;res&quot;&gt;&lt;/span&gt;Outside (IFRS 2.5): it is the consideration in a business combination, governed by IFRS 3.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;clf-item&quot; data-correct=&quot;in&quot;&gt;&lt;div&gt;5. After the acquisition, the target&#x27;s employees are promised shares if they stay for another two years.&lt;/div&gt;&lt;div class=&quot;bt&quot;&gt;&lt;button class=&quot;btn&quot; data-a=&quot;in&quot;&gt;Inside&lt;/button&gt;&lt;button class=&quot;btn&quot; data-a=&quot;out&quot;&gt;Outside&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;span class=&quot;res&quot;&gt;&lt;/span&gt;Inside (IFRS 2.5): instruments granted to the acquiree&#x27;s employees in their capacity as employees, in exchange for future service.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;clf-item&quot; data-correct=&quot;in&quot;&gt;&lt;div&gt;6. The parent grants its own shares to the employees of a subsidiary.&lt;/div&gt;&lt;div class=&quot;bt&quot;&gt;&lt;button class=&quot;btn&quot; data-a=&quot;in&quot;&gt;Inside&lt;/button&gt;&lt;button class=&quot;btn&quot; data-a=&quot;out&quot;&gt;Outside&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;span class=&quot;res&quot;&gt;&lt;/span&gt;Inside (IFRS 2.3A): the subsidiary receives the services, the parent settles; both apply IFRS 2.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;clf-item&quot; data-correct=&quot;out&quot;&gt;&lt;div&gt;7. A contract to buy a commodity that can be settled net in cash, within the scope of IFRS 9.&lt;/div&gt;&lt;div class=&quot;bt&quot;&gt;&lt;button class=&quot;btn&quot; data-a=&quot;in&quot;&gt;Inside&lt;/button&gt;&lt;button class=&quot;btn&quot; data-a=&quot;out&quot;&gt;Outside&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;span class=&quot;res&quot;&gt;&lt;/span&gt;Outside (IFRS 2.6): it falls under the financial instruments standards (IAS 32 / IFRS 9).&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;definizioni&quot; class=&quot;sec p-sage&quot;&gt;
&lt;div class=&quot;sec-h&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Defined terms · Appendix A&lt;/span&gt;&lt;h2&gt;The vocabulary of the standard&lt;/h2&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-left:4px solid var(--slate)&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Equity-settled share-based payment transaction&lt;/h4&gt;The entity
&lt;ul class=&quot;chk&quot;&gt;&lt;li&gt;receives goods or services as consideration for its own &lt;strong&gt;equity instruments&lt;/strong&gt; &lt;span class=&quot;gl&quot;&gt;(shares or share options)&lt;/span&gt;, &lt;em&gt;or&lt;/em&gt;&lt;/li&gt;&lt;li&gt;receives goods or services but &lt;strong&gt;has no obligation to settle&lt;/strong&gt; the transaction with the supplier (someone else in the group pays).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-left:4px solid var(--brick)&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Cash-settled share-based payment transaction&lt;/h4&gt;The entity acquires goods or services by &lt;strong&gt;incurring a liability&lt;/strong&gt; to transfer cash or other assets to the supplier, for amounts &lt;strong&gt;based on the price (or value) of equity instruments&lt;/strong&gt; of the entity or of another group entity.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Share-based payment arrangement&lt;/h4&gt;An agreement between the entity (or another group entity, or a shareholder of any group entity) and another party, including an employee, that entitles the other party to receive (i) cash or other assets for amounts based on the price of equity instruments, or (ii) equity instruments — &lt;strong&gt;provided the specified vesting conditions, if any, are met&lt;/strong&gt;.
&lt;p class=&quot;note&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;strong&gt;Group&lt;/strong&gt; = “a parent and its subsidiaries” from the perspective of the ultimate parent (IFRS 10, Appendix A). Review the lecture on IFRS 10 for the concept of control.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Vesting condition&lt;/h4&gt;A condition that determines whether the entity &lt;strong&gt;receives the services&lt;/strong&gt; that entitle the counterparty to cash, other assets or equity instruments. It may be a &lt;dfn&gt;service condition&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(the counterparty must complete a specified period of service)&lt;/span&gt; or a &lt;dfn&gt;performance condition&lt;/dfn&gt; &lt;span class=&quot;gl&quot;&gt;(service plus a specified target, e.g. growth in earnings or in the share price)&lt;/span&gt;. To &lt;dfn&gt;vest&lt;/dfn&gt; means to become an unconditional entitlement.&lt;/div&gt;

&lt;h3&gt;Fair value: two definitions not to be confused&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 760 250&quot; role=&quot;img&quot; aria-label=&quot;Comparison of fair value definitions&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;360&quot; height=&quot;200&quot; rx=&quot;16&quot; style=&quot;fill:var(--sage-bg);stroke:var(--sage)&quot; stroke-width=&quot;1.6&quot;/&gt;
&lt;rect x=&quot;390&quot; y=&quot;10&quot; width=&quot;360&quot; height=&quot;200&quot; rx=&quot;16&quot; style=&quot;fill:var(--slate-bg);stroke:var(--slate)&quot; stroke-width=&quot;1.6&quot;/&gt;
&lt;text x=&quot;190&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;17&quot;&gt;IFRS 2 · Appendix A&lt;/text&gt;
&lt;text x=&quot;570&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot; font-size=&quot;17&quot;&gt;IFRS 13 · Appendix A&lt;/text&gt;
&lt;text x=&quot;190&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;amount for which an asset could be&lt;/text&gt;
&lt;text x=&quot;190&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot;&gt;exchanged, a liability settled, or an&lt;/text&gt;
