&lt;h1&gt;IAS 36 &lt;em&gt;Impairment of Assets&lt;/em&gt;&lt;/h1&gt;
&lt;p class=&quot;lede&quot;&gt;Una regola sola: nessuna attività può restare in bilancio a un valore più alto di quello che l&#x27;azienda può recuperare usandola o vendendola. Il resto dello standard spiega quando controllare, come misurare, chi assorbe la perdita e che cosa raccontare al lettore.&lt;/p&gt;

&lt;section class=&quot;s&quot; id=&quot;obiettivo&quot;&gt;
&lt;h3&gt;1. Objective: il tetto al valore di bilancio&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 2 · §1&lt;/p&gt;
&lt;p&gt;L&#x27;&lt;span class=&quot;en&quot;&gt;impairment&lt;/span&gt; è la riduzione di valore di un&#x27;attività. IAS 36 prescrive le procedure perché le attività siano iscritte a non più del loro &lt;span class=&quot;en&quot;&gt;recoverable amount&lt;/span&gt;, cioè il &lt;strong&gt;valore recuperabile&lt;/strong&gt; attraverso l&#x27;uso o la vendita.&lt;/p&gt;
&lt;p&gt;Se il &lt;span class=&quot;en&quot;&gt;carrying amount&lt;/span&gt; (il valore contabile) supera quel valore, l&#x27;attività è &lt;span class=&quot;en&quot;&gt;impaired&lt;/span&gt; e l&#x27;entità deve rilevare una &lt;span class=&quot;en&quot;&gt;impairment loss&lt;/span&gt;. Lo standard dice anche quando la perdita va stornata (&lt;span class=&quot;en&quot;&gt;reversal&lt;/span&gt;) e quali informazioni pubblicare (&lt;span class=&quot;en&quot;&gt;disclosure&lt;/span&gt;).&lt;/p&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 196&quot; role=&quot;img&quot; aria-label=&quot;Le due strade per recuperare un&#x27;attività: uso e vendita, confrontate con il carrying amount&quot;&gt;
&lt;rect class=&quot;bc&quot; x=&quot;170&quot; y=&quot;6&quot; width=&quot;140&quot; height=&quot;48&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;240&quot; y=&quot;27&quot;&gt;Attività&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;240&quot; y=&quot;45&quot;&gt;carrying amount&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M210 54C210 76 92 66 92 88&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M270 54C270 76 388 66 388 88&quot;/&gt;
&lt;rect class=&quot;bx&quot; x=&quot;6&quot; y=&quot;88&quot; width=&quot;172&quot; height=&quot;44&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;92&quot; y=&quot;115&quot;&gt;la uso → flussi futuri&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;302&quot; y=&quot;88&quot; width=&quot;172&quot; height=&quot;44&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;388&quot; y=&quot;115&quot;&gt;la vendo → prezzo netto&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M92 132C92 154 200 142 200 156&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M388 132C388 154 280 142 280 156&quot;/&gt;
&lt;rect class=&quot;ba&quot; x=&quot;120&quot; y=&quot;156&quot; width=&quot;240&quot; height=&quot;36&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid tp&quot; x=&quot;240&quot; y=&quot;179&quot;&gt;recoverable amount: il maggiore&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;oltre le slide&lt;/span&gt;La logica economica: un&#x27;azienda razionale sceglie la strada migliore tra usare e vendere. Per questo si prende il maggiore dei due valori. Se anche la strada migliore non copre il valore di bilancio, quella parte di attivo non genererà benefici, e il bilancio la starebbe sopravvalutando.&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;scope&quot;&gt;
&lt;h3&gt;2. Scope: chi è dentro, chi è fuori&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 3-6 · §2-5&lt;/p&gt;
&lt;p&gt;La formula di partenza è ampia: IAS 36 vale per &lt;strong&gt;tutte le attività&lt;/strong&gt;, tranne quelle elencate. Le esclusioni seguono uno schema: quelle attività hanno già un proprio criterio di misurazione in un altro standard. &lt;span class=&quot;tagi&quot;&gt;oltre le slide&lt;/span&gt; Le slide danno l&#x27;elenco; i motivi nelle schede sono un&#x27;aggiunta.&lt;/p&gt;
&lt;p&gt;Prova a dire se ciascuna voce rientra in IAS 36, poi aprila.&lt;/p&gt;
&lt;div class=&quot;flips&quot;&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Inventories (rimanenze)&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Fuori · IAS 2&lt;/b&gt;Si valutano al minore tra costo e net realisable value. &lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Contract assets e costi per ottenere un contratto&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Fuori · IFRS 15&lt;/b&gt;Attività che nascono dai contratti con i clienti.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Deferred tax assets (imposte anticipate)&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Fuori · IAS 12&lt;/b&gt;Hanno un test di recuperabilità fiscale proprio.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Assets da employee benefits&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Fuori · IAS 19&lt;/b&gt;Benefici ai dipendenti con regole attuariali proprie.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Financial assets in IFRS 9&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Fuori · IFRS 9&lt;/b&gt;Regole proprie, incluso l&#x27;impairment sulle perdite attese.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Investment property al fair value&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Fuori · IAS 40&lt;/b&gt;Il valore è già aggiornato al fair value a ogni chiusura.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Biological assets al fair value less costs of disposal&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Fuori · IAS 41&lt;/b&gt;Attività agricole già misurate a un valore corrente.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Contratti assicurativi&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Fuori · IFRS 17&lt;/b&gt;Inclusi gli assets per insurance acquisition cash flows.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Non-current assets held for sale&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Fuori · IFRS 5&lt;/b&gt;Dalla classificazione come held for sale non segue più IAS 36 (slide 11).&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Partecipazioni in subsidiaries, associates, joint ventures&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Dentro · §4&lt;/b&gt;Sono financial assets, ma quelle definite da IFRS 10, IAS 28 e IFRS 11 restano in IAS 36.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Macchinario al costo (IAS 16)&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Dentro&lt;/b&gt;È il caso tipico: nessuna esclusione lo riguarda. &lt;span class=&quot;tagi&quot;&gt;oltre le slide&lt;/span&gt;&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Immobile al revalued amount (IAS 16)&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Dentro · §5&lt;/b&gt;Anche se rivalutato. Vedi il Focus qui sotto.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;h4&gt;Focus: perché testare un&#x27;attività già rivalutata?&lt;/h4&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 5-6 · §5&lt;/p&gt;
&lt;p&gt;Il &lt;span class=&quot;en&quot;&gt;revalued amount&lt;/span&gt; è il fair value alla data di rivalutazione, meno ammortamenti e impairment successivi. Sembrerebbe già un valore aggiornato, ma manca un pezzo:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;Se i &lt;span class=&quot;en&quot;&gt;costs of disposal&lt;/span&gt; (costi di dismissione) non sono trascurabili, il FVLCD è per forza &lt;strong&gt;minore&lt;/strong&gt; del fair value.&lt;/li&gt;
&lt;li&gt;Quindi l&#x27;attività è impaired se anche il &lt;span class=&quot;en&quot;&gt;value in use&lt;/span&gt; è minore del revalued amount.&lt;/li&gt;
&lt;li&gt;Per questo, &lt;strong&gt;dopo&lt;/strong&gt; la rivalutazione si applica IAS 36 per capire se l&#x27;attività può essere impaired.&lt;/li&gt;
&lt;/ol&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;oltre le slide&lt;/span&gt;Esempio: revalued amount 100, costi di dismissione 5, VIU 90. FVLCD = 95, recoverable amount = 95, perdita = 5. Se i costi fossero trascurabili, FVLCD ≈ 100 e di norma non ci sarebbe perdita.&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;definizioni&quot;&gt;
&lt;h3&gt;3. Definitions: quattro parole bastano&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 7 · §6&lt;/p&gt;
&lt;dl class=&quot;defs&quot;&gt;
&lt;div&gt;&lt;dt&gt;Carrying amount&lt;/dt&gt;&lt;dd&gt;Il valore di iscrizione, dopo aver dedotto ammortamenti accumulati (&lt;span class=&quot;en&quot;&gt;depreciation&lt;/span&gt; o &lt;span class=&quot;en&quot;&gt;amortisation&lt;/span&gt;) e impairment losses accumulate.&lt;/dd&gt;&lt;/div&gt;
&lt;div&gt;&lt;dt&gt;Recoverable amount&lt;/dt&gt;&lt;dd&gt;Il maggiore tra &lt;span class=&quot;en&quot;&gt;fair value less costs of disposal&lt;/span&gt; (FVLCD, il prezzo di vendita al netto dei costi per vendere) e &lt;span class=&quot;en&quot;&gt;value in use&lt;/span&gt;. Vale per una singola attività o per una &lt;span class=&quot;en&quot;&gt;cash-generating unit&lt;/span&gt; (CGU, il gruppo minimo di attività che genera flussi autonomi).&lt;/dd&gt;&lt;/div&gt;
&lt;div&gt;&lt;dt&gt;Value in use (VIU)&lt;/dt&gt;&lt;dd&gt;Il present value (valore attuale) dei flussi di cassa futuri attesi dall&#x27;attività o dalla CGU.&lt;/dd&gt;&lt;/div&gt;
&lt;div&gt;&lt;dt&gt;Impairment loss&lt;/dt&gt;&lt;dd&gt;L&#x27;importo di cui il carrying amount eccede il recoverable amount.&lt;/dd&gt;&lt;/div&gt;
&lt;/dl&gt;
&lt;div class=&quot;formula&quot;&gt;Recoverable amount = max (FVLCD ; VIU)&lt;br&gt;Impairment loss = max (Carrying amount − Recoverable amount ; 0)&lt;/div&gt;
&lt;div class=&quot;w&quot; id=&quot;sim&quot;&gt;&lt;h4&gt;Prova il test&lt;/h4&gt;&lt;p class=&quot;hint&quot;&gt;Muovi i tre cursori. Importi in CU, la currency unit generica usata dallo standard.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Carrying amount &lt;b data-v=&quot;ca&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;ca&quot; min=&quot;20&quot; max=&quot;200&quot; value=&quot;100&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Fair value less costs of disposal &lt;b data-v=&quot;fv&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;fv&quot; min=&quot;0&quot; max=&quot;200&quot; value=&quot;70&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Value in use &lt;b data-v=&quot;viu&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;viu&quot; min=&quot;0&quot; max=&quot;200&quot; value=&quot;85&quot;&gt;&lt;/label&gt;
&lt;svg role=&quot;img&quot; aria-label=&quot;Barre che confrontano carrying amount, FVLCD, value in use e recoverable amount&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;res&quot;&gt;&lt;p&gt;Recoverable amount &lt;strong data-o=&quot;ra&quot;&gt;&lt;/strong&gt; · Impairment loss &lt;strong data-o=&quot;l&quot;&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p data-o=&quot;m&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;oltre le slide&lt;/span&gt;Il &lt;span class=&quot;en&quot;&gt;fair value&lt;/span&gt; è il prezzo che si incasserebbe vendendo l&#x27;attività in una regolare operazione tra operatori di mercato alla data di valutazione: è un valore di mercato. Il VIU è invece un valore specifico per l&#x27;entità, perché dipende da come essa userà l&#x27;attività. Da qui la possibile differenza tra i due.&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h4&gt;Autoverifica · Parte A&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;Il carrying amount è 500, il FVLCD 430, il VIU 460. Qual è la perdita?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Recoverable amount = max(430; 460) = 460. Perdita = 500 − 460 = &lt;strong&gt;40&lt;/strong&gt;. Il carrying amount diventa 460.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un&#x27;investment property al modello del costo rientra in IAS 36?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sì. La slide 4 esclude solo quella &lt;strong&gt;misurata al fair value&lt;/strong&gt;. Al modello del costo nessuno aggiorna il valore a ogni chiusura, quindi serve il test.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Le partecipazioni in società controllate sono financial assets: perché non seguono IFRS 9?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il §4 riporta esplicitamente in IAS 36 subsidiaries (IFRS 10), associates (IAS 28) e joint ventures (IFRS 11).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché si prende il maggiore e non il minore tra FVLCD e VIU?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché un&#x27;entità razionale recupera il valore scegliendo la strada più conveniente. La perdita esiste solo se &lt;strong&gt;entrambe&lt;/strong&gt; le strade restano sotto il carrying amount.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ocra&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;k&quot;&gt;Parte B&lt;/span&gt;&lt;h2&gt;Quando testare&lt;/h2&gt;&lt;p&gt;Per la maggior parte delle attività serve un indizio. Per alcune il test è comunque annuale.&lt;/p&gt;&lt;/div&gt;

&lt;figure class=&quot;dg&quot; style=&quot;margin-top:24px&quot;&gt;&lt;svg viewBox=&quot;0 0 480 300&quot; role=&quot;img&quot; aria-label=&quot;Schema decisionale: a ogni chiusura si cercano indizi; goodwill e intangibili a vita indefinita si testano comunque ogni anno; se il carrying amount supera il recoverable amount si rileva la perdita&quot;&gt;
&lt;rect class=&quot;bc&quot; x=&quot;6&quot; y=&quot;6&quot; width=&quot;222&quot; height=&quot;60&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;117&quot; y=&quot;31&quot;&gt;A ogni chiusura&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;117&quot; y=&quot;51&quot;&gt;ci sono indizi? (§9)&lt;/text&gt;
&lt;rect class=&quot;bc&quot; x=&quot;252&quot; y=&quot;6&quot; width=&quot;222&quot; height=&quot;60&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;363&quot; y=&quot;31&quot;&gt;Ogni anno, sempre&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;363&quot; y=&quot;51&quot;&gt;goodwill e certi intangibili (§10)&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M117 66V82&quot;/&gt;&lt;text class=&quot;ts&quot; x=&quot;125&quot; y=&quot;80&quot;&gt;sì&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M117 106C117 122 180 112 200 128&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M363 66V112C363 122 300 112 280 128&quot;/&gt;
&lt;rect class=&quot;bx&quot; x=&quot;120&quot; y=&quot;128&quot; width=&quot;240&quot; height=&quot;46&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;240&quot; y=&quot;156&quot;&gt;Stima il recoverable amount&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M240 174V192&quot;/&gt;
&lt;rect class=&quot;bx&quot; x=&quot;120&quot; y=&quot;192&quot; width=&quot;240&quot; height=&quot;40&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;217&quot;&gt;Carrying &amp;gt; recoverable?&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M170 232V252&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M310 232V252&quot;/&gt;
&lt;rect class=&quot;ba&quot; x=&quot;40&quot; y=&quot;252&quot; width=&quot;190&quot; height=&quot;42&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid tp&quot; x=&quot;135&quot; y=&quot;278&quot;&gt;sì → impairment loss&lt;/text&gt;
&lt;rect class=&quot;bm&quot; x=&quot;250&quot; y=&quot;252&quot; width=&quot;190&quot; height=&quot;42&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;345&quot; y=&quot;278&quot;&gt;no → nessuna perdita&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M117 82V106&quot;/&gt;
&lt;/svg&gt;&lt;/figure&gt;

&lt;section class=&quot;s&quot; id=&quot;indizi&quot;&gt;
&lt;h3&gt;4. Indications: i segnali da cercare&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 8, 10-12 · §9, 12, 14&lt;/p&gt;
&lt;p&gt;Alla fine di ogni &lt;span class=&quot;en&quot;&gt;reporting period&lt;/span&gt; (l&#x27;esercizio) l&#x27;entità valuta se c&#x27;è qualche indizio di perdita. Se c&#x27;è, stima il recoverable amount. Se non c&#x27;è, per le attività ordinarie il calcolo non serve.&lt;/p&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button type=&quot;button&quot;&gt;External sources&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Internal sources&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Internal reporting&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 10 · §12&lt;/p&gt;&lt;ul&gt;
&lt;li&gt;Il valore è sceso nel periodo &lt;strong&gt;molto più&lt;/strong&gt; di quanto ci si attende dal tempo o dall&#x27;uso normale.&lt;/li&gt;
&lt;li&gt;Cambiamenti negativi significativi, avvenuti o imminenti, nel contesto &lt;strong&gt;technological, market, economic o legal&lt;/strong&gt;.&lt;/li&gt;
&lt;li&gt;I &lt;strong&gt;tassi di mercato sono saliti&lt;/strong&gt; e l&#x27;aumento può incidere sul discount rate del VIU, riducendo in modo rilevante il recoverable amount.&lt;/li&gt;
&lt;li&gt;Il carrying amount delle &lt;span class=&quot;en&quot;&gt;net assets&lt;/span&gt; dell&#x27;entità supera la sua &lt;strong&gt;market capitalisation&lt;/strong&gt; (il valore di borsa).&lt;/li&gt;
&lt;/ul&gt;&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;oltre le slide&lt;/span&gt;L&#x27;ultimo segnale è il più intuitivo: patrimonio netto contabile 800, capitalizzazione 600. Il mercato sta dicendo che le attività valgono meno di quanto scrive il bilancio.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 11 · §12&lt;/p&gt;&lt;ul&gt;
&lt;li&gt;Evidenza di &lt;strong&gt;obsolescence&lt;/strong&gt; o danno fisico.&lt;/li&gt;
&lt;li&gt;Cambiamenti interni significativi: attività &lt;span class=&quot;en&quot;&gt;idle&lt;/span&gt; (ferma), piani per cessare o ristrutturare l&#x27;operazione, piani per dismetterla prima del previsto, vita utile rivista da indefinita a finita.&lt;/li&gt;
&lt;li&gt;Internal reporting che indica una performance economica peggiore del previsto, ora o in futuro.&lt;/li&gt;
&lt;/ul&gt;&lt;div class=&quot;warn&quot;&gt;Una volta soddisfatti i criteri di &lt;span class=&quot;en&quot;&gt;held for sale&lt;/span&gt;, l&#x27;attività esce da IAS 36 e passa a IFRS 5. Il semplice piano di dismissione anticipata, invece, è ancora un indizio dentro IAS 36.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 12 · §14 · Budget e consuntivi&lt;/p&gt;&lt;ul&gt;
&lt;li&gt;Flussi per acquisire l&#x27;attività, o per gestirla e mantenerla, molto &lt;strong&gt;più alti del budget originario&lt;/strong&gt;.&lt;/li&gt;
&lt;li&gt;Net cash flows o risultato operativo effettivi molto &lt;strong&gt;peggiori del budget&lt;/strong&gt;.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Calo significativo&lt;/strong&gt; dei flussi o del risultato a budget, oppure aumento significativo della perdita a budget.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Perdite operative&lt;/strong&gt; o net cash outflows quando si sommano i dati del periodo e quelli futuri a budget.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;annual&quot;&gt;
&lt;h3&gt;5. Annual test: le eccezioni senza indizi&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 9, 57 · §10, 96&lt;/p&gt;
&lt;p&gt;Tre categorie si testano ogni anno, &lt;strong&gt;anche senza alcun indizio&lt;/strong&gt;:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Intangible assets&lt;/h4&gt;&lt;p&gt;Con &lt;span class=&quot;en&quot;&gt;indefinite useful life&lt;/span&gt; (vita utile indefinita) o &lt;span class=&quot;en&quot;&gt;not yet available for use&lt;/span&gt; (non ancora disponibili all&#x27;uso).&lt;/p&gt;&lt;p&gt;Il test si può fare in qualunque momento dell&#x27;anno, purché sempre nello stesso periodo. Intangibili diversi possono avere date diverse.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Goodwill&lt;/h4&gt;&lt;p&gt;L&#x27;avviamento acquisito in una &lt;span class=&quot;en&quot;&gt;business combination&lt;/span&gt; (aggregazione aziendale), secondo i §80-99.&lt;/p&gt;&lt;p&gt;Se è stato acquisito nell&#x27;anno in corso, la CGU va testata &lt;strong&gt;prima della fine&lt;/strong&gt; di quell&#x27;anno (§96).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;oltre le slide&lt;/span&gt;Il motivo: queste voci non si ammortizzano, oppure non hanno ancora iniziato, e nessun processo periodico ne riduce il valore. Sono anche le stime più incerte. Il test annuale compensa l&#x27;assenza di ammortamento.&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h4&gt;Autoverifica · Parte B&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;Un macchinario senza alcun indizio di perdita va testato?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Serve solo la valutazione degli indizi a ogni chiusura. Il calcolo annuale obbligatorio vale per goodwill e per gli intangibili a vita indefinita o non ancora disponibili.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;La BCE alza i tassi. È automaticamente un&#x27;impairment?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. È un indizio solo se l&#x27;aumento è tale da incidere sul discount rate e da ridurre &lt;strong&gt;in modo rilevante&lt;/strong&gt; il recoverable amount. E anche allora porta a una stima, non a una perdita certa.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un brand a vita indefinita è testato ogni 30 giugno, un altro ogni 30 settembre. È ammesso?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sì. Conta che ciascuno sia testato ogni anno nello stesso momento (§10).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra «piano di dismissione anticipata» e «held for sale»?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il primo è un indizio interno e resta in IAS 36. Il secondo, una volta soddisfatti i criteri, porta l&#x27;attività fuori scope, in IFRS 5.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ardesia&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;k&quot;&gt;Parte C&lt;/span&gt;&lt;h2&gt;Come misurare&lt;/h2&gt;&lt;p&gt;È il cuore tecnico: il recoverable amount, i flussi del value in use, il tasso e le tecniche dell&#x27;Appendix A.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;s&quot; id=&quot;recoverable&quot;&gt;
&lt;h3&gt;6. Recoverable amount: scorciatoie e livello del test&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 13-15 · §19-20, 22, 28&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Basta un valore (§19)&lt;/h4&gt;&lt;p&gt;Se FVLCD &lt;em&gt;o&lt;/em&gt; VIU supera il carrying amount, l&#x27;attività non è impaired. L&#x27;altro valore non va stimato.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;FVLCD non misurabile (§20)&lt;/h4&gt;&lt;p&gt;Se non c&#x27;è base per una stima attendibile del prezzo, si può usare il VIU come recoverable amount.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;Attività singola o CGU? (§22)&lt;/h4&gt;
&lt;p&gt;Il recoverable amount si determina per la &lt;strong&gt;singola attività&lt;/strong&gt;, a meno che non generi flussi in entrata &lt;span class=&quot;en&quot;&gt;largely independent&lt;/span&gt; (largamente indipendenti) da quelli di altre attività. In quel caso si passa alla CGU, salvo che:&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;
&lt;li&gt;il FVLCD dell&#x27;attività sia maggiore del suo carrying amount; oppure&lt;/li&gt;
&lt;li&gt;il VIU si possa stimare vicino al FVLCD, e il FVLCD sia misurabile.&lt;/li&gt;
&lt;/ol&gt;
&lt;p style=&quot;font-size:.88rem;color:var(--muted)&quot;&gt;Nella slide 14 entrambi i punti sono etichettati «a)»: il secondo è il b).&lt;/p&gt;
&lt;h4&gt;Costs of disposal (§28)&lt;/h4&gt;
&lt;p&gt;Sono i costi direttamente legati alla vendita: &lt;strong&gt;legal costs, stamp duty&lt;/strong&gt; (imposta di bollo) e imposte simili sulla transazione, &lt;strong&gt;costi di rimozione&lt;/strong&gt; dell&#x27;attività, costi incrementali diretti per portarla in condizione di essere venduta.&lt;/p&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;viu&quot;&gt;
&lt;h3&gt;7. Value in use: stimare i cash flows&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 16-32 · §31-54&lt;/p&gt;
&lt;p&gt;Il VIU richiede due passi (§31): stimare i flussi in entrata e in uscita dall&#x27;&lt;strong&gt;uso continuativo&lt;/strong&gt; e dalla &lt;strong&gt;dismissione finale&lt;/strong&gt;, poi applicare il &lt;span class=&quot;en&quot;&gt;discount rate&lt;/span&gt; appropriato.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;VIU = Σ CF&lt;sub&gt;t&lt;/sub&gt; / (1 + r)&lt;sup&gt;t&lt;/sup&gt; + flusso netto di dismissione / (1 + r)&lt;sup&gt;n&lt;/sup&gt;&lt;/div&gt;
&lt;p&gt;Comunque si tratti l&#x27;incertezza su importo o tempi, il risultato deve riflettere l&#x27;&lt;span class=&quot;en&quot;&gt;expected present value&lt;/span&gt;: la media pesata di tutti i possibili esiti (§32, vedi &lt;a href=&quot;#appa&quot;&gt;Appendix A&lt;/a&gt;).&lt;/p&gt;
&lt;h4&gt;L&#x27;orizzonte: budget, poi extrapolation (§33)&lt;/h4&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 124&quot; role=&quot;img&quot; aria-label=&quot;Linea del tempo: fino a cinque anni budget approvati dal management, poi estrapolazione a crescita stabile o decrescente fino alla fine della vita utile&quot;&gt;
&lt;rect class=&quot;bc&quot; x=&quot;4&quot; y=&quot;26&quot; width=&quot;238&quot; height=&quot;44&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;123&quot; y=&quot;53&quot;&gt;Budget approvati&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;244&quot; y=&quot;26&quot; width=&quot;232&quot; height=&quot;44&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;360&quot; y=&quot;53&quot;&gt;Extrapolation&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;4&quot; y=&quot;17&quot;&gt;oggi&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;243&quot; y=&quot;17&quot;&gt;max 5 anni*&lt;/text&gt;&lt;text class=&quot;ts end&quot; x=&quot;476&quot; y=&quot;17&quot;&gt;fine vita utile&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;4&quot; y=&quot;92&quot;&gt;senza restructuring futuri&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;4&quot; y=&quot;110&quot;&gt;e senza miglioramenti&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;250&quot; y=&quot;92&quot;&gt;crescita steady o declining;&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;250&quot; y=&quot;110&quot;&gt;non oltre la media di lungo periodo*&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;* Salvo che un periodo più lungo, o un tasso crescente o più alto, sia giustificabile. Slide 18-19.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;div class=&quot;w&quot; id=&quot;viu-w&quot;&gt;&lt;h4&gt;Calcola il value in use&lt;/h4&gt;&lt;p class=&quot;hint&quot;&gt;Nei primi 5 anni vale la crescita da budget, poi quella di extrapolation. &lt;span class=&quot;tagi&quot;&gt;oltre le slide&lt;/span&gt; Numeri a scelta. Prova a portare il tasso all&#x27;11%: compare una perdita.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Flusso netto anno 1 &lt;b data-v=&quot;cf&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;cf&quot; min=&quot;20&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;100&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Crescita da budget &lt;b data-v=&quot;gb&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;gb&quot; min=&quot;-5&quot; max=&quot;10&quot; step=&quot;0.5&quot; data-d=&quot;1&quot; data-u=&quot;%&quot; value=&quot;2&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Crescita extrapolation &lt;b data-v=&quot;g&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;g&quot; min=&quot;-5&quot; max=&quot;5&quot; step=&quot;0.5&quot; data-d=&quot;1&quot; data-u=&quot;%&quot; value=&quot;0&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Discount rate pre-tax &lt;b data-v=&quot;r&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;r&quot; min=&quot;4&quot; max=&quot;18&quot; step=&quot;0.5&quot; data-d=&quot;1&quot; data-u=&quot;%&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Vita utile residua (anni) &lt;b data-v=&quot;n&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;n&quot; min=&quot;5&quot; max=&quot;20&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Flusso netto di dismissione finale &lt;b data-v=&quot;d&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;d&quot; min=&quot;0&quot; max=&quot;300&quot; step=&quot;10&quot; value=&quot;50&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Carrying amount &lt;b data-v=&quot;ca&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;ca&quot; min=&quot;100&quot; max=&quot;1500&quot; step=&quot;10&quot; value=&quot;650&quot;&gt;&lt;/label&gt;
&lt;svg role=&quot;img&quot; aria-label=&quot;Grafico a barre dei flussi annui e del loro valore attuale&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;res&quot;&gt;&lt;p&gt;VIU &lt;strong data-o=&quot;tot&quot;&gt;&lt;/strong&gt; (di cui dismissione &lt;strong data-o=&quot;pvd&quot;&gt;&lt;/strong&gt;)&lt;/p&gt;&lt;p data-o=&quot;m&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

&lt;h4&gt;Che cosa entra nei flussi?&lt;/h4&gt;
&lt;p&gt;Decidi per ciascuna voce: è nel calcolo del VIU o no? Poi apri la scheda.&lt;/p&gt;
&lt;div class=&quot;flips&quot;&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Incassi dall&#x27;uso continuativo&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Dentro · §39a&lt;/b&gt;È il nucleo della stima.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Uscite necessarie, anche per preparare l&#x27;attività all&#x27;uso&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Dentro · §39b&lt;/b&gt;Se attribuibili direttamente o allocabili su base ragionevole e coerente.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Flusso netto di dismissione a fine vita&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Dentro · §39c&lt;/b&gt;Coerente con il valore finale usato per l&#x27;ammortamento (IAS 16).&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Manutenzione ordinaria e overheads attribuibili&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Dentro · §41&lt;/b&gt;&lt;span class=&quot;en&quot;&gt;Day-to-day servicing&lt;/span&gt; e costi generali attribuibili o allocabili.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Costi per finire un edificio in costruzione&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Dentro · §42&lt;/b&gt;Il carrying amount non li include ancora, ma l&#x27;attività non sarebbe pronta senza.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Sostituzione di componenti a vita più breve in una CGU&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Dentro · §49&lt;/b&gt;Se essenziali, è parte del day-to-day servicing della CGU.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Incasso dei crediti commerciali&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Fuori · §43a&lt;/b&gt;Flussi largamente indipendenti: conterli sarebbe un double-counting.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Pagamento di debiti, pensioni, provisions già iscritti&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Fuori · §43b&lt;/b&gt;Sono già liabilities in bilancio: stesso motivo.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Risparmi da un restructuring non ancora deciso&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Fuori · §44&lt;/b&gt;L&#x27;entità non è ancora &lt;span class=&quot;en&quot;&gt;committed&lt;/span&gt;, cioè impegnata.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Benefici da un upgrade non ancora sostenuto&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Fuori · §44, 48&lt;/b&gt;I flussi si stimano per l&#x27;attività nelle condizioni attuali.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Interessi passivi e rimborsi di finanziamenti&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Fuori · §50-51&lt;/b&gt;Il valore del denaro nel tempo è già nell&#x27;attualizzazione.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Imposte sul reddito&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Fuori · §50-51&lt;/b&gt;Il tasso è pre-tax, quindi anche i flussi sono pre-tax.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;

&lt;h4&gt;Le regole di coerenza&lt;/h4&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button type=&quot;button&quot;&gt;Inflation&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Restructuring&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Disposal&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Foreign currency&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 21 · §40&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Il discount rate…&lt;/th&gt;&lt;th&gt;I flussi sono…&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;include l&#x27;inflazione generale&lt;/td&gt;&lt;td&gt;&lt;strong&gt;nominal&lt;/strong&gt;: includono l&#x27;inflazione&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;esclude l&#x27;inflazione generale&lt;/td&gt;&lt;td&gt;&lt;strong&gt;real&lt;/strong&gt;: senza inflazione generale, ma con le variazioni di prezzo specifiche&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;oltre le slide&lt;/span&gt;L&#x27;errore da evitare: flussi reali scontati a un tasso nominale. Lo sconto è troppo forte e il VIU viene sottostimato.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 25-28 · §44, 47-49&lt;/p&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 148&quot; role=&quot;img&quot; aria-label=&quot;Prima dell&#x27;impegno i flussi da restructuring sono esclusi; dopo l&#x27;impegno i benefici entrano nel VIU e le uscite stanno nella provision IAS 37&quot;&gt;
&lt;rect class=&quot;bm&quot; x=&quot;4&quot; y=&quot;50&quot; width=&quot;472&quot; height=&quot;3&quot;/&gt;&lt;rect class=&quot;ba&quot; x=&quot;236&quot; y=&quot;36&quot; width=&quot;4&quot; height=&quot;30&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;238&quot; y=&quot;26&quot;&gt;commitment&lt;/text&gt;
&lt;text class=&quot;t tb&quot; x=&quot;4&quot; y=&quot;84&quot;&gt;Prima&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;4&quot; y=&quot;104&quot;&gt;nessun beneficio&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;4&quot; y=&quot;122&quot;&gt;e nessuna uscita nel VIU&lt;/text&gt;
&lt;text class=&quot;t tb&quot; x=&quot;252&quot; y=&quot;84&quot;&gt;Dopo&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;252&quot; y=&quot;104&quot;&gt;risparmi e benefici: nel VIU&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;252&quot; y=&quot;122&quot;&gt;uscite: provision IAS 37&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;Stesso principio per i miglioramenti: finché l&#x27;entità non sostiene l&#x27;uscita che migliora l&#x27;attività, i benefici attesi restano fuori (§48).&lt;/p&gt;
&lt;div class=&quot;note x&quot;&gt;&lt;span class=&quot;tagx lab&quot;&gt;fonte esterna&lt;/span&gt;IAS 37 limita la provision per restructuring ai costi diretti necessari, non legati alle attività correnti. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-37-provisions-contingent-liabilities-and-contingent-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, IAS 37&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 31 · §53&lt;/p&gt;&lt;p&gt;Il flusso di dismissione a fine vita si stima come un FVLCD, con due differenze:&lt;/p&gt;&lt;ol type=&quot;a&quot;&gt;&lt;li&gt;si usano i prezzi alla data di stima di attività &lt;strong&gt;simili già a fine vita&lt;/strong&gt;, usate in condizioni simili;&lt;/li&gt;&lt;li&gt;si aggiustano quei prezzi per l&#x27;inflazione generale e per le variazioni specifiche. Se flussi e tasso escludono l&#x27;inflazione, la si esclude anche qui.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 32 · §54&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;flussi in valuta → tasso di quella valuta → present value → spot rate alla data del calcolo&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;oltre le slide&lt;/span&gt;Esempio: PV di USD 1.000 scontato a un tasso per il dollaro; con spot 0,90 EUR/USD il VIU è EUR 900. Si converte il risultato, non ogni singolo flusso con cambi futuri stimati.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;rate&quot;&gt;
&lt;h3&gt;8. Discount rate: un tasso, nessun doppio conteggio&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 33-35, 100-103 · §55-57, A15-A21&lt;/p&gt;
&lt;p&gt;Il tasso deve essere &lt;strong&gt;pre-tax&lt;/strong&gt; e riflettere le valutazioni correnti di mercato su due elementi (§55): il &lt;span class=&quot;en&quot;&gt;time value of money&lt;/span&gt; e i rischi specifici dell&#x27;attività &lt;strong&gt;non già considerati nei flussi&lt;/strong&gt;.&lt;/p&gt;
&lt;p&gt;Si ricava dai tassi impliciti in transazioni correnti di attività simili, o dal &lt;span class=&quot;en&quot;&gt;weighted average cost of capital&lt;/span&gt; (WACC, costo medio ponderato del capitale) di una società quotata con attività simili per potenziale e rischi (§56). Se manca un tasso specifico, si usano dei &lt;span class=&quot;en&quot;&gt;surrogates&lt;/span&gt;, cioè dei sostituti (§57, A16-A18).&lt;/p&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 240&quot; role=&quot;img&quot; aria-label=&quot;Dai tassi di partenza all&#x27;aggiustamento per i rischi di mercato, fino al tasso finale&quot;&gt;
&lt;text class=&quot;ts&quot; x=&quot;4&quot; y=&quot;14&quot;&gt;Punti di partenza (A17)&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;4&quot; y=&quot;22&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;79&quot; y=&quot;46&quot;&gt;Entity&#x27;s WACC&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;79&quot; y=&quot;66&quot;&gt;ad es. con CAPM&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;165&quot; y=&quot;22&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;46&quot;&gt;Incremental&lt;/text&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;66&quot;&gt;borrowing rate&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;326&quot; y=&quot;22&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;401&quot; y=&quot;46&quot;&gt;Altri market&lt;/text&gt;&lt;text class=&quot;t mid&quot; x=&quot;401&quot; y=&quot;66&quot;&gt;borrowing rates&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M79 78C79 96 170 88 200 102&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M240 78V102&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M401 78C401 96 310 88 280 102&quot;/&gt;
&lt;rect class=&quot;bc&quot; x=&quot;40&quot; y=&quot;102&quot; width=&quot;400&quot; height=&quot;66&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;240&quot; y=&quot;124&quot;&gt;Aggiustamenti (A18)&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;240&quot; y=&quot;143&quot;&gt;+ i rischi come li valuterebbe il mercato&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;240&quot; y=&quot;160&quot;&gt;− i rischi irrilevanti o già nei flussi&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M240 168V188&quot;/&gt;
&lt;rect class=&quot;ba&quot; x=&quot;90&quot; y=&quot;188&quot; width=&quot;300&quot; height=&quot;46&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid tp&quot; x=&quot;240&quot; y=&quot;216&quot;&gt;Discount rate per il VIU&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button type=&quot;button&quot;&gt;Double-counting&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Capital structure&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Uno o più tassi&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;WACC e CAPM&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 34, 100 · §56, A15&lt;/p&gt;&lt;p&gt;Un rischio va messo &lt;strong&gt;o&lt;/strong&gt; nei flussi &lt;strong&gt;o&lt;/strong&gt; nel tasso. Se i flussi sono già stati ridotti per un rischio e anche il tasso lo incorpora, lo stesso rischio pesa due volte e il VIU risulta troppo basso.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 103 · A19&lt;/p&gt;&lt;p&gt;Il tasso è &lt;strong&gt;indipendente dalla struttura del capitale&lt;/strong&gt; dell&#x27;entità e da come ha finanziato l&#x27;acquisto: i flussi attesi dall&#x27;attività non dipendono dal modo in cui è stata pagata.&lt;/p&gt;&lt;p&gt;Per lo stesso motivo gli interessi non entrano nei flussi (§50).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 94, 103 · A21&lt;/p&gt;&lt;p&gt;Di norma il tasso è unico. Si usano tassi separati per periodi diversi se il VIU è sensibile a una differenza di rischio tra i periodi o alla &lt;span class=&quot;en&quot;&gt;term structure&lt;/span&gt; (la curva dei tassi per scadenza). L&#x27;esempio dell&#x27;&lt;a href=&quot;#appa&quot;&gt;Appendix A&lt;/a&gt; usa 5%, 5,25% e 5,50% su 1, 2 e 3 anni.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;oltre le slide&lt;/span&gt;&lt;p&gt;Le slide citano il Capital Asset Pricing Model (CAPM) senza formule. In sintesi:&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;r&lt;sub&gt;e&lt;/sub&gt; = r&lt;sub&gt;f&lt;/sub&gt; + β (r&lt;sub&gt;m&lt;/sub&gt; − r&lt;sub&gt;f&lt;/sub&gt;)&lt;br&gt;WACC = E/V · r&lt;sub&gt;e&lt;/sub&gt; + D/V · r&lt;sub&gt;d&lt;/sub&gt; (1 − t)&lt;/div&gt;
&lt;p&gt;r&lt;sub&gt;f&lt;/sub&gt; è il tasso privo di rischio, β la sensibilità al mercato, r&lt;sub&gt;m&lt;/sub&gt; − r&lt;sub&gt;f&lt;/sub&gt; il premio per il rischio di mercato. Il WACC così scritto è &lt;strong&gt;post-tax&lt;/strong&gt;, mentre IAS 36 chiede un tasso pre-tax: di solito non basta dividerlo per (1 − t), perché conta anche la tempistica delle imposte. Le regole sulla base pre-tax sono proprio tra i punti in discussione nel &lt;a href=&quot;#progetto&quot;&gt;progetto IASB&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;oltre le slide&lt;/span&gt;La slide 100 rimanda ai fattori (b), (d) ed (e) del §A1, senza riportarli. Sono: le attese sulle variazioni di importo o tempi dei flussi, il prezzo per sopportare l&#x27;incertezza dell&#x27;attività, e altri fattori come l&#x27;illiquidità. Puoi controllarli nel &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias36.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo di IAS 36&lt;/a&gt;. La slide 102 aggiunge che vanno considerati country risk, currency risk e price risk (A18).&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;appa&quot;&gt;
&lt;h3&gt;9. Appendix A: traditional vs expected cash flow&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 87-103 · A1-A21&lt;/p&gt;
&lt;p&gt;L&#x27;Appendix A è parte integrante dello standard e vale anche per le CGU. Principio generale (A3): flussi o tassi devono riflettere la &lt;strong&gt;gamma dei possibili esiti&lt;/strong&gt;, non un singolo importo più probabile, minimo o massimo.&lt;/p&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button type=&quot;button&quot;&gt;Traditional&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Expected&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Tempi incerti&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Dati limitati&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Il dibattito&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 90-91 · A4, A6&lt;/p&gt;&lt;p&gt;Un &lt;strong&gt;solo set di flussi&lt;/strong&gt; e un solo tasso, «the rate commensurate with the risk». Il tasso deve incorporare da solo attese e premio per il rischio: quindi tutta l&#x27;attenzione va sulla sua scelta.&lt;/p&gt;&lt;p&gt;Trovarlo richiede almeno due elementi: un&#x27;attività sul mercato con tasso osservato e l&#x27;attività da misurare. Passi:&lt;/p&gt;&lt;ol type=&quot;a&quot;&gt;&lt;li&gt;identificare i flussi da scontare;&lt;/li&gt;&lt;li&gt;trovare sul mercato un&#x27;attività con flussi simili;&lt;/li&gt;&lt;li&gt;confrontare i due set (contrattuali o stimati?);&lt;/li&gt;&lt;li&gt;cercare elementi presenti in uno solo (uno è meno liquido?);&lt;/li&gt;&lt;li&gt;valutare se i due set variano in modo simile al cambiare dell&#x27;economia.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 92 · A7&lt;/p&gt;&lt;p&gt;Usa &lt;strong&gt;tutte&lt;/strong&gt; le attese sui possibili flussi, non solo il più probabile.&lt;/p&gt;
&lt;div class=&quot;w&quot; id=&quot;exp-w&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;h4&gt;Sposta le probabilità&lt;/h4&gt;&lt;p class=&quot;hint&quot;&gt;Valori iniziali della slide: 10%, 60%, 30%, con valore atteso CU220.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Probabilità CU100 &lt;b data-v=&quot;p1&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;p1&quot; min=&quot;0&quot; max=&quot;100&quot; data-u=&quot;%&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Probabilità CU200 &lt;b data-v=&quot;p2&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;p2&quot; min=&quot;0&quot; max=&quot;100&quot; data-u=&quot;%&quot; value=&quot;60&quot;&gt;&lt;/label&gt;
&lt;svg role=&quot;img&quot; aria-label=&quot;Distribuzione dei tre esiti con linea del valore atteso&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;res&quot;&gt;&lt;p&gt;Probabilità CU300 &lt;strong data-o=&quot;p3&quot;&gt;&lt;/strong&gt; · Expected cash flow &lt;strong data-o=&quot;e&quot;&gt;&lt;/strong&gt; · Most likely &lt;strong data-o=&quot;ml&quot;&gt;&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 93-95 · A8-A9&lt;/p&gt;&lt;p&gt;L&#x27;approccio funziona anche se è incerto &lt;strong&gt;quando&lt;/strong&gt; arriva il flusso: CU1.000 tra 1, 2 o 3 anni con probabilità 10%, 60%, 30%.&lt;/p&gt;
&lt;div class=&quot;stepper&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Tra 1 anno al 5%&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;1.000 / 1,05 = 952,38 → × 10% = &lt;strong&gt;95,24&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Tra 2 anni al 5,25%&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;1.000 / 1,0525² = 902,73 → × 60% = &lt;strong&gt;541,64&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Tra 3 anni al 5,50%&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;1.000 / 1,055³ = 851,61 → × 30% = &lt;strong&gt;255,48&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Expected present value&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;95,24 + 541,64 + 255,48 = &lt;strong&gt;CU892,36&lt;/strong&gt;&lt;/div&gt;&lt;p&gt;La best estimate tradizionale sarebbe CU902,73 (lo scenario al 60%). Il metodo tradizionale deve scegliere una sola scadenza, e un tasso non può riflettere l&#x27;incertezza sui tempi.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 96-97 · A11-A12&lt;/p&gt;&lt;p&gt;Anche con informazioni scarse si può stimare un valore atteso, partendo da una gamma tra CU50 e CU250:&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Che cosa si sa&lt;/th&gt;&lt;th&gt;Calcolo&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Expected&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Nessun importo è più probabile&lt;/td&gt;&lt;td&gt;(50 + 250) / 2&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;150&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Più probabile CU100, probabilità ignote&lt;/td&gt;&lt;td&gt;(50 + 100 + 250) / 3&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;133,33&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;50 al 10%, 250 al 30%, 100 al 60%&lt;/td&gt;&lt;td&gt;5 + 75 + 60&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;140&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;Cost-benefit constraint&lt;/strong&gt; (A12): l&#x27;entità bilancia il costo di ottenere altre informazioni con l&#x27;attendibilità che queste aggiungono alla misura.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 98-99 · A13-A14&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;La critica&lt;/h4&gt;&lt;p&gt;Con 90% di CU10 e 10% di CU1.000 il valore atteso è &lt;strong&gt;CU109&lt;/strong&gt;, un importo che non si verificherà mai. La tecnica non sarebbe adatta a una singola voce con pochi esiti.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;La risposta&lt;/h4&gt;&lt;p&gt;CU10 presenta un flusso incerto come se fosse certo. &lt;strong&gt;Nessuna entità razionale&lt;/strong&gt; venderebbe per CU10 un&#x27;attività con queste caratteristiche.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h4&gt;Autoverifica · Parte C&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;FVLCD 120, carrying amount 100, VIU ignoto. Devi stimare il VIU?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Il FVLCD supera già il carrying amount, quindi l&#x27;attività non è impaired (§19).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Il budget include i risparmi di una ristrutturazione che il board valuta ma non ha deciso. Vanno nel VIU?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Senza commitment sono esclusi (§44). Dopo il commitment entrano i benefici, mentre le uscite stanno nella provision IAS 37 (§47).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché gli interessi passivi non entrano nei flussi, anche se l&#x27;attività è stata acquistata a debito?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Perché il valore del denaro nel tempo è già nell&#x27;attualizzazione (§51) e il tasso è indipendente da come l&#x27;attività è stata finanziata (A19).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Flussi già ridotti per il rischio paese. Il tasso può includere lo stesso rischio?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: sarebbe double-counting (§56, A15, A18b).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Calcola il valore atteso: CU200 al 25%, CU400 al 75%.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;50 + 300 = &lt;strong&gt;CU350&lt;/strong&gt;. Lo scenario più probabile sarebbe 400.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;mattone&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;k&quot;&gt;Parte D&lt;/span&gt;&lt;h2&gt;Perdita, CGU e goodwill&lt;/h2&gt;&lt;p&gt;Come si rileva la perdita, a quale livello si fa il test, chi la assorbe e quando si può tornare indietro.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;s&quot; id=&quot;loss&quot;&gt;
&lt;h3&gt;10. Impairment loss: dove finisce in bilancio&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 36-39 · §60-64&lt;/p&gt;
&lt;p&gt;La perdita si rileva &lt;strong&gt;subito&lt;/strong&gt;. La destinazione dipende da come è misurata l&#x27;attività: &lt;span class=&quot;en&quot;&gt;profit or loss&lt;/span&gt; (P&amp;amp;L, conto economico) oppure &lt;span class=&quot;en&quot;&gt;other comprehensive income&lt;/span&gt; (OCI, le altre componenti del risultato complessivo).&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Attività non rivalutata&lt;/h4&gt;&lt;p&gt;Tutta la perdita in &lt;strong&gt;profit or loss&lt;/strong&gt; (§60).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Attività rivalutata&lt;/h4&gt;&lt;p&gt;In &lt;strong&gt;OCI&lt;/strong&gt; fino alla &lt;span class=&quot;en&quot;&gt;revaluation surplus&lt;/span&gt; (la riserva di rivalutazione) di quella stessa attività, trattata come &lt;span class=&quot;en&quot;&gt;revaluation decrease&lt;/span&gt; (§60-61). &lt;span class=&quot;tagi&quot;&gt;oltre le slide&lt;/span&gt; L&#x27;eventuale eccedenza va in P&amp;amp;L, secondo IAS 16.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;w&quot; id=&quot;reval-w&quot;&gt;&lt;h4&gt;Dividi la perdita di un&#x27;attività rivalutata&lt;/h4&gt;&lt;p class=&quot;hint&quot;&gt;Importi a scelta. Prova una perdita più piccola del surplus.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Revaluation surplus &lt;b data-v=&quot;s&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;s&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;30&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Impairment loss &lt;b data-v=&quot;l&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;l&quot; min=&quot;0&quot; max=&quot;150&quot; step=&quot;5&quot; value=&quot;50&quot;&gt;&lt;/label&gt;
&lt;svg role=&quot;img&quot; aria-label=&quot;Barre con surplus, quota in OCI e quota in profit or loss&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;res&quot;&gt;&lt;p&gt;OCI &lt;strong data-o=&quot;o&quot;&gt;&lt;/strong&gt; · P&amp;amp;L &lt;strong data-o=&quot;p&quot;&gt;&lt;/strong&gt; · Surplus residuo &lt;strong data-o=&quot;r&quot;&gt;&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;h4&gt;Tre conseguenze&lt;/h4&gt;
&lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;La perdita supera il carrying amount (§62)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Si rileva una &lt;span class=&quot;en&quot;&gt;liability&lt;/span&gt; se, e solo se, lo richiede un altro standard. Di norma l&#x27;attività si ferma a zero.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;L&#x27;ammortamento va ricalcolato (§63)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Nei periodi futuri si ripartisce il nuovo carrying amount, meno l&#x27;eventuale &lt;span class=&quot;en&quot;&gt;residual value&lt;/span&gt;, sulla vita utile residua.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tagi&quot;&gt;oltre le slide&lt;/span&gt; Valore 700 con 7 anni residui e ammortamento 100; dopo una perdita a 420, l&#x27;ammortamento scende a 60.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Le imposte differite cambiano (§64)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Si rideterminano secondo IAS 12, confrontando il nuovo carrying amount con la &lt;span class=&quot;en&quot;&gt;tax base&lt;/span&gt; (il valore fiscale).&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tagi&quot;&gt;oltre le slide&lt;/span&gt; Carrying 100 ridotto a 70, tax base 100, aliquota 25%: differenza temporanea deducibile 30, deferred tax asset 7,5 se recuperabile.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;cgu&quot;&gt;
&lt;h3&gt;11. CGU: quando l&#x27;attività non basta da sola&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 40-51 · §65-79&lt;/p&gt;
&lt;p&gt;Se non si può stimare il recoverable amount della singola attività, si determina quello della CGU a cui appartiene (§66). Identificarla richiede &lt;strong&gt;judgement&lt;/strong&gt; (giudizio professionale): è la &lt;strong&gt;più piccola aggregazione&lt;/strong&gt; di attività che genera flussi in entrata largamente indipendenti (§68).&lt;/p&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button type=&quot;button&quot;&gt;La miniera&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Gli autobus&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Altri criteri&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 41&lt;/p&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 142&quot; role=&quot;img&quot; aria-label=&quot;La ferrovia privata è dentro la CGU miniera e non ha flussi propri&quot;&gt;
&lt;rect class=&quot;bc&quot; x=&quot;4&quot; y=&quot;4&quot; width=&quot;472&quot; height=&quot;134&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;18&quot; y=&quot;28&quot;&gt;CGU = l&#x27;intera miniera&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;18&quot; y=&quot;42&quot; width=&quot;136&quot; height=&quot;80&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;86&quot; y=&quot;88&quot;&gt;Giacimento&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;172&quot; y=&quot;42&quot; width=&quot;136&quot; height=&quot;80&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;88&quot;&gt;Impianti&lt;/text&gt;
&lt;rect class=&quot;ba&quot; x=&quot;326&quot; y=&quot;42&quot; width=&quot;136&quot; height=&quot;80&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tb mid tp&quot; x=&quot;394&quot; y=&quot;78&quot;&gt;Ferrovia&lt;/text&gt;&lt;text class=&quot;ts mid tp&quot; x=&quot;394&quot; y=&quot;100&quot;&gt;solo valore scrap&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;La ferrovia privata serve solo alla miniera e si potrebbe vendere solo come rottame (&lt;span class=&quot;en&quot;&gt;scrap value&lt;/span&gt;). Il suo VIU non è determinabile e probabilmente differisce dallo scrap value: quindi si stima il recoverable amount dell&#x27;&lt;strong&gt;intera miniera&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 43&lt;/p&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 106&quot; role=&quot;img&quot; aria-label=&quot;Cinque linee di autobus unite in una sola CGU, una linea è in perdita&quot;&gt;
&lt;rect class=&quot;bc&quot; x=&quot;4&quot; y=&quot;4&quot; width=&quot;472&quot; height=&quot;98&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;18&quot; y=&quot;27&quot;&gt;CGU = l&#x27;intera società di autobus&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;18&quot; y=&quot;40&quot; width=&quot;80&quot; height=&quot;48&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;58&quot; y=&quot;69&quot;&gt;Linea 1&lt;/text&gt;&lt;rect class=&quot;bx&quot; x=&quot;107&quot; y=&quot;40&quot; width=&quot;80&quot; height=&quot;48&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;147&quot; y=&quot;69&quot;&gt;Linea 2&lt;/text&gt;&lt;rect class=&quot;bx&quot; x=&quot;196&quot; y=&quot;40&quot; width=&quot;80&quot; height=&quot;48&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;236&quot; y=&quot;69&quot;&gt;Linea 3&lt;/text&gt;&lt;rect class=&quot;bx&quot; x=&quot;285&quot; y=&quot;40&quot; width=&quot;80&quot; height=&quot;48&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;325&quot; y=&quot;69&quot;&gt;Linea 4&lt;/text&gt;&lt;rect class=&quot;ba&quot; x=&quot;374&quot; y=&quot;40&quot; width=&quot;88&quot; height=&quot;48&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;t tb mid tp&quot; x=&quot;418&quot; y=&quot;69&quot;&gt;In perdita&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;Attività e flussi di ogni linea sono identificabili, ma il contratto col comune impone il servizio minimo su tutte e cinque. La società non può tagliarne una, quindi la CGU è &lt;strong&gt;la società intera&lt;/strong&gt;. La linea in perdita si compensa con le altre.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Come decide il management&lt;/strong&gt; (§69): come monitora le operazioni (linee di prodotto, business, sedi, aree) e come decide di continuarle o dismetterle.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Transfer pricing&lt;/strong&gt; (§70): se i flussi dipendono da prezzi interni al gruppo, si usa la miglior stima di prezzi &lt;span class=&quot;en&quot;&gt;at arm&#x27;s length&lt;/span&gt; (tra parti indipendenti), sia per i flussi in entrata sia per le uscite delle altre CGU coinvolte.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Active market&lt;/strong&gt; (§71): se l&#x27;output, anche se usato internamente, si &lt;em&gt;potrebbe&lt;/em&gt; vendere su un mercato attivo, quell&#x27;attività forma una CGU separata.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Consistency&lt;/strong&gt; (§72-73): stesse CGU di periodo in periodo, salvo cambiamento giustificato e spiegato in disclosure (§130).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;Il carrying amount della CGU: confrontare grandezze omogenee&lt;/h4&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 48-51 · §76-79&lt;/p&gt;
&lt;p&gt;Il carrying amount include solo le attività attribuibili o allocabili su base ragionevole e coerente, che generano i flussi usati nel VIU. &lt;strong&gt;Non include le liabilities iscritte&lt;/strong&gt;, salvo che il recoverable amount non si possa determinare senza di esse. Se si tralascia una attività, la CGU può sembrare recuperabile quando non lo è (§77).&lt;/p&gt;
&lt;div class=&quot;stepper&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;strong&gt;Il caso (§78).&lt;/strong&gt; Chi compra la CGU deve assumersi anche una liability. Allora la liability va dedotta &lt;strong&gt;sia&lt;/strong&gt; dal VIU &lt;strong&gt;sia&lt;/strong&gt; dal carrying amount. &lt;span class=&quot;tagi&quot;&gt;oltre le slide&lt;/span&gt; Esempio con numeri: miniera con provision di ripristino 500.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;strong&gt;Dati.&lt;/strong&gt; Carrying amount attività 1.000 · VIU prima del ripristino 1.200 · FVLCD 800, già al netto del ripristino a carico del compratore.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;formula&quot;&gt;VIU = 1.200 − 500 = 700&lt;br&gt;Carrying amount = 1.000 − 500 = 500&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;formula&quot;&gt;Recoverable amount = max(800; 700) = 800 &amp;gt; 500&lt;/div&gt;&lt;p&gt;Nessuna perdita. Senza dedurre la provision si sarebbe confrontato 1.000 con un FVLCD già netto: un confronto falsato.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Per ragioni pratiche il recoverable amount può considerare anche attività esterne alla CGU, come i crediti, o liabilities iscritte, come debiti e pensioni. Allora il carrying amount &lt;strong&gt;sale&lt;/strong&gt; per quelle attività e &lt;strong&gt;scende&lt;/strong&gt; per quelle liabilities (§79).&lt;/p&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;goodwill&quot;&gt;
&lt;h3&gt;12. Goodwill: allocare, testare, semplificare&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 52-59, 107-108 · §80-81, 96-99&lt;/p&gt;
&lt;p&gt;Il &lt;span class=&quot;en&quot;&gt;goodwill&lt;/span&gt; (avviamento) non genera flussi da solo: contribuisce insieme alle altre attività. Dalla data di acquisizione va allocato alle CGU, o gruppi di CGU, che si attendono di &lt;strong&gt;beneficiare delle sinergie&lt;/strong&gt;, anche se nessun&#x27;altra attività dell&#x27;acquisita è stata assegnata a esse (§80).&lt;/p&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 196&quot; role=&quot;img&quot; aria-label=&quot;Livelli dall&#x27;entità alla singola CGU: l&#x27;unità con goodwill sta al livello più basso di monitoraggio e non sopra l&#x27;operating segment&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;4&quot; y=&quot;4&quot; width=&quot;472&quot; height=&quot;40&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;29&quot;&gt;Entity&lt;/text&gt;
&lt;rect class=&quot;bm&quot; x=&quot;34&quot; y=&quot;52&quot; width=&quot;412&quot; height=&quot;40&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;240&quot; y=&quot;77&quot;&gt;Operating segment (IFRS 8): il limite massimo&lt;/text&gt;
&lt;rect class=&quot;bc&quot; x=&quot;64&quot; y=&quot;100&quot; width=&quot;352&quot; height=&quot;40&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;240&quot; y=&quot;125&quot;&gt;Livello di monitoraggio del goodwill&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;94&quot; y=&quot;148&quot; width=&quot;292&quot; height=&quot;40&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;173&quot;&gt;CGU singola, se l&#x27;allocazione non è arbitraria&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;Prima dell&#x27;aggregazione dei segmenti. Se la ripartizione su singole CGU sarebbe arbitraria, ci si ferma al gruppo (§81).&lt;/figcaption&gt;&lt;/figure&gt;
&lt;ul&gt;&lt;li&gt;L&#x27;unità deve essere il &lt;strong&gt;livello più basso&lt;/strong&gt; a cui il goodwill è monitorato per la gestione interna.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Non più grande di un operating segment&lt;/strong&gt;, come definito dal §5 di IFRS 8, prima dell&#x27;aggregazione.&lt;/li&gt;&lt;/ul&gt;
&lt;div class=&quot;note x&quot;&gt;&lt;span class=&quot;tagx lab&quot;&gt;fonte esterna&lt;/span&gt;Un operating segment svolge attività con ricavi e costi, ha i risultati rivisti regolarmente dal chief operating decision maker e dispone di informazioni finanziarie distinte. &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs8.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 8, testo 2026&lt;/a&gt;&lt;/div&gt;
&lt;h4&gt;Cessioni e riorganizzazioni: il relative value approach&lt;/h4&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 55-56&lt;/p&gt;
&lt;p&gt;Se il goodwill non è associabile in modo non arbitrario a un livello più basso, si usa il rapporto tra i valori relativi.&lt;/p&gt;
&lt;div class=&quot;w&quot; id=&quot;gw-w&quot;&gt;&lt;h4&gt;Quanto goodwill esce con la cessione?&lt;/h4&gt;&lt;p class=&quot;hint&quot;&gt;Valori iniziali della slide 55: 100 e 300, quindi 25%. &lt;span class=&quot;tagi&quot;&gt;oltre le slide&lt;/span&gt; L&#x27;importo del goodwill è a scelta.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Prezzo dell&#x27;operazione ceduta &lt;b data-v=&quot;sold&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;sold&quot; min=&quot;10&quot; max=&quot;500&quot; step=&quot;10&quot; value=&quot;100&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Recoverable amount della parte trattenuta &lt;b data-v=&quot;ret&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;ret&quot; min=&quot;10&quot; max=&quot;900&quot; step=&quot;10&quot; value=&quot;300&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Goodwill allocato alla CGU &lt;b data-v=&quot;gw&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;gw&quot; min=&quot;0&quot; max=&quot;200&quot; step=&quot;10&quot; value=&quot;80&quot;&gt;&lt;/label&gt;
&lt;svg role=&quot;img&quot; aria-label=&quot;Barra con la quota di goodwill ceduta e quella trattenuta&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;res&quot;&gt;&lt;p&gt;Quota ceduta &lt;strong data-o=&quot;q&quot;&gt;&lt;/strong&gt; su un totale di &lt;strong data-o=&quot;tot&quot;&gt;&lt;/strong&gt; · Goodwill nel carrying amount ceduto &lt;strong data-o=&quot;g&quot;&gt;&lt;/strong&gt; · Goodwill che resta &lt;strong data-o=&quot;k&quot;&gt;&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;Riorganizzazione&lt;/strong&gt; (slide 56): la CGU A viene divisa e integrata in B, C e D. Il suo goodwill si rialloca sulla base dei valori relativi delle tre porzioni di A, misurati &lt;strong&gt;prima&lt;/strong&gt; dell&#x27;integrazione.&lt;/p&gt;
&lt;h4&gt;Tempi e ordine dei test&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Timing (§96)&lt;/h4&gt;&lt;p&gt;In qualunque momento dell&#x27;anno, purché sempre nello stesso. CGU diverse possono avere date diverse. Goodwill acquisito nell&#x27;anno: test prima della fine dell&#x27;anno.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Ordine (§98)&lt;/h4&gt;&lt;p&gt;Se c&#x27;è un indizio su una singola attività dentro la CGU, si testa &lt;strong&gt;prima l&#x27;attività&lt;/strong&gt;, si rileva la perdita, poi si testa la CGU con il goodwill.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;Simplification: riusare il calcolo precedente (§99)&lt;/h4&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 59&lt;/p&gt;
&lt;p&gt;Si può riusare l&#x27;ultimo calcolo dettagliato se valgono &lt;strong&gt;tutte&lt;/strong&gt; queste condizioni:&lt;/p&gt;
&lt;ol&gt;&lt;li&gt;attività e liabilities della CGU non sono cambiate in modo significativo;&lt;/li&gt;&lt;li&gt;l&#x27;ultimo calcolo superava il carrying amount di un &lt;strong&gt;margine sostanziale&lt;/strong&gt;;&lt;/li&gt;&lt;li&gt;dall&#x27;analisi di eventi e circostanze, la probabilità che il recoverable amount sia ora inferiore è &lt;strong&gt;remota&lt;/strong&gt;.&lt;/li&gt;&lt;/ol&gt;
&lt;h4&gt;Che cosa dimostra davvero il test&lt;/h4&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 107-108 · In brief, gennaio 2023&lt;/p&gt;
&lt;p&gt;Il test &lt;strong&gt;non misura direttamente il goodwill&lt;/strong&gt;, coerentemente con l&#x27;idea che sia un residuo. Non può nemmeno riflettere il consumo del goodwill per chi lo considera una &lt;span class=&quot;en&quot;&gt;wasting asset&lt;/span&gt; (attività che si consuma). Garantisce però che goodwill e altre attività della CGU siano recuperabili &lt;strong&gt;con i flussi generati insieme&lt;/strong&gt;.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;oltre le slide&lt;/span&gt;Da qui il cosiddetto &lt;span class=&quot;en&quot;&gt;shielding&lt;/span&gt;: il margine di attività e goodwill generato internamente, non iscritti in bilancio, può coprire il calo di valore del goodwill acquisito. La perdita emerge quindi tardi: è una delle critiche che hanno mosso il progetto IASB.&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;corporate&quot;&gt;
&lt;h3&gt;13. Corporate assets: la sede non ha flussi propri&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 60-62 · §100-102&lt;/p&gt;
&lt;p&gt;Sono attività di gruppo o di divisione: l&#x27;edificio della sede, gli impianti EDP (&lt;span class=&quot;en&quot;&gt;electronic data processing&lt;/span&gt;), un centro ricerche. Due tratti distintivi: non generano flussi indipendenti e il loro carrying amount non è interamente attribuibile alla CGU esaminata.&lt;/p&gt;
&lt;p&gt;Il recoverable amount della singola corporate asset non si può determinare, salvo decisione di dismetterla. Se c&#x27;è un indizio, si guarda quindi alla CGU o al gruppo di CGU a cui appartiene (§101).&lt;/p&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 176&quot; role=&quot;img&quot; aria-label=&quot;La sede viene ripartita sulle CGU A, B e C, e ciascuna è confrontata con il proprio recoverable amount&quot;&gt;
&lt;rect class=&quot;ba&quot; x=&quot;140&quot; y=&quot;4&quot; width=&quot;200&quot; height=&quot;42&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid tp&quot; x=&quot;240&quot; y=&quot;30&quot;&gt;Sede (corporate asset)&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M190 46C190 66 76 56 76 76&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M240 46V76&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M290 46C290 66 404 56 404 76&quot;/&gt;
&lt;rect class=&quot;bc&quot; x=&quot;6&quot; y=&quot;76&quot; width=&quot;140&quot; height=&quot;58&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;76&quot; y=&quot;100&quot;&gt;CGU A&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;76&quot; y=&quot;120&quot;&gt;+ quota sede&lt;/text&gt;
&lt;rect class=&quot;bc&quot; x=&quot;170&quot; y=&quot;76&quot; width=&quot;140&quot; height=&quot;58&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;240&quot; y=&quot;100&quot;&gt;CGU B&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;240&quot; y=&quot;120&quot;&gt;+ quota sede&lt;/text&gt;
&lt;rect class=&quot;bc&quot; x=&quot;334&quot; y=&quot;76&quot; width=&quot;140&quot; height=&quot;58&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;404&quot; y=&quot;100&quot;&gt;CGU C&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;404&quot; y=&quot;120&quot;&gt;+ quota sede&lt;/text&gt;
&lt;text class=&quot;ts mid&quot; x=&quot;240&quot; y=&quot;160&quot;&gt;ciascuna confrontata con il proprio recoverable amount&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;Se una quota è allocabile su base ragionevole e coerente, si confronta il carrying amount della CGU &lt;strong&gt;inclusa quella quota&lt;/strong&gt; con il suo recoverable amount (§102).&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;oltre le slide&lt;/span&gt;La slide riporta solo questo ramo. Se invece la quota non è allocabile, il §102(b) prevede due passaggi: si testa la CGU senza corporate asset; poi si individua il più piccolo gruppo di CGU a cui la quota si può allocare, e si testa quel gruppo con la quota. Verifica nel &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias36.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo di IAS 36&lt;/a&gt;.&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;allocation&quot;&gt;
&lt;h3&gt;14. Allocation: chi assorbe la perdita della CGU&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 63-65 · §104-108&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;1° goodwill → 2° altre attività, pro rata sui carrying amount&lt;/div&gt;
&lt;p&gt;Una singola attività però non scende sotto il &lt;strong&gt;maggiore&lt;/strong&gt; tra FVLCD (se misurabile), VIU (se determinabile) e zero (§105). Se il recoverable amount delle singole attività non è stimabile, la ripartizione è per forza arbitraria: lavorano insieme (§106). Se resta perdita, si rileva una liability solo se un altro standard lo richiede (§108).&lt;/p&gt;
&lt;div class=&quot;w&quot; id=&quot;alloc-w&quot;&gt;&lt;h4&gt;Fai scorrere il recoverable amount&lt;/h4&gt;&lt;p class=&quot;hint&quot;&gt;Carrying amount della CGU 1.000. &lt;span class=&quot;tagi&quot;&gt;oltre le slide&lt;/span&gt; Esempio numerico inventato: prova 900, poi 700, poi 300.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Recoverable amount della CGU &lt;b data-v=&quot;ra&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;ra&quot; min=&quot;300&quot; max=&quot;1100&quot; step=&quot;10&quot; value=&quot;700&quot;&gt;&lt;/label&gt;
&lt;svg role=&quot;img&quot; aria-label=&quot;Composizione della CGU prima e dopo l&#x27;allocazione della perdita&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Attività&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Prima&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Limite&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Perdita&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Dopo&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;p&gt;Impairment loss totale &lt;strong data-o=&quot;l&quot;&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p data-o=&quot;m&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;oltre le slide&lt;/span&gt;La redistribuzione della parte eccedente sulle altre attività è nel §105, ma non compare nella slide 64.&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;reversal&quot;&gt;
&lt;h3&gt;15. Reversal: tornare indietro, ma non del tutto&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 66-70 · §110-125&lt;/p&gt;
&lt;p&gt;A ogni chiusura l&#x27;entità valuta se ci sono indizi che una perdita passata, &lt;strong&gt;su attività diverse dal goodwill&lt;/strong&gt;, non esista più o sia diminuita. Se ci sono, stima di nuovo il recoverable amount (§110).&lt;/p&gt;
&lt;div class=&quot;w&quot; id=&quot;rev-w&quot;&gt;&lt;h4&gt;Il tetto del reversal&lt;/h4&gt;&lt;p class=&quot;hint&quot;&gt;&lt;span class=&quot;tagi&quot;&gt;oltre le slide&lt;/span&gt; Costo 1.000, vita 10 anni, residual value zero. Perdita a fine anno 3: da 700 a 420. A fine anno 6 il carrying amount è 240, e senza impairment sarebbe stato 400.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Recoverable amount a fine anno 6 &lt;b data-v=&quot;ra&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;ra&quot; min=&quot;240&quot; max=&quot;600&quot; step=&quot;10&quot; value=&quot;480&quot;&gt;&lt;/label&gt;
&lt;svg role=&quot;img&quot; aria-label=&quot;Grafico del carrying amount nel tempo con perdita, reversal e tetto&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;res&quot;&gt;&lt;p&gt;Nuovo carrying amount &lt;strong data-o=&quot;n&quot;&gt;&lt;/strong&gt; · Reversal &lt;strong data-o=&quot;rv&quot;&gt;&lt;/strong&gt; · Nuovo ammortamento annuo &lt;strong data-o=&quot;d&quot;&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p data-o=&quot;m&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Singola attività&lt;/th&gt;&lt;th&gt;CGU&lt;/th&gt;&lt;th&gt;Goodwill&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;th&gt;Si può stornare?&lt;/th&gt;&lt;td&gt;Sì&lt;/td&gt;&lt;td&gt;Sì, tranne il goodwill&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Mai&lt;/strong&gt; (§124)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Come&lt;/th&gt;&lt;td&gt;Fino al carrying amount che ci sarebbe stato senza perdita (§117)&lt;/td&gt;&lt;td&gt;Pro rata sulle attività (§122)&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Tetto&lt;/th&gt;&lt;td&gt;Carrying amount ipotetico, al netto degli ammortamenti&lt;/td&gt;&lt;td&gt;Il minore tra recoverable amount (se determinabile) e carrying amount ipotetico. L&#x27;eccedenza passa pro rata alle altre attività, escluso il goodwill (§123)&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Dove si rileva&lt;/h4&gt;&lt;p&gt;Subito in &lt;strong&gt;P&amp;amp;L&lt;/strong&gt;, salvo attività rivalutata: lì è un &lt;span class=&quot;en&quot;&gt;revaluation increase&lt;/span&gt; in &lt;strong&gt;OCI&lt;/strong&gt; che aumenta il surplus. Ma per la parte di perdita rilevata in passato in P&amp;amp;L, anche il reversal va in P&amp;amp;L (§119-120).&lt;/p&gt;&lt;/div&gt;
