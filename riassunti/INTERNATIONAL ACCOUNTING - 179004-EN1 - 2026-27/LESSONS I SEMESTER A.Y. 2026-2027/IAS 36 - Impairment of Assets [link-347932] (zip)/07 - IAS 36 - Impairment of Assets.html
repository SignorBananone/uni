&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Dopo il reversal&lt;/h4&gt;&lt;p&gt;L&#x27;ammortamento si adegua: nuovo carrying amount, meno residual value, sulla vita residua (§121).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;strong&gt;Perché mai sul goodwill?&lt;/strong&gt; IAS 38 vieta di iscrivere il goodwill generato internamente. Un aumento successivo del recoverable amount è probabilmente goodwill &lt;em&gt;interno&lt;/em&gt;, non il recupero di quello acquistato: stornare la perdita equivarrebbe a iscrivere ciò che è vietato (§125).&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h4&gt;Autoverifica · Parte D&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;Perdita 80 su un&#x27;attività rivalutata con surplus 50. Dove vanno gli importi?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;50 in OCI, che azzera il surplus, e 30 in profit or loss.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Una linea di autobus è in forte perdita. Va svalutata da sola?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No, se l&#x27;entità non può tagliarla: il contratto impone tutte le linee, quindi la CGU è la società intera (slide 43).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;CGU: goodwill 50, attività X 200 e Y 300. Recoverable amount 400. Come allochi?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Carrying amount 550, perdita 150. Goodwill −50. I restanti 100 pro rata: X −40 (200/500), Y −60 (300/500). Dopo: X 160, Y 240.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Stessa CGU, ma X ha un FVLCD di 180. Che cosa cambia?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;X può perdere solo 20. Gli altri 20 che le sarebbero spettati passano a Y: X 180, Y 220. Il totale resta 400.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Il goodwill può superare il livello dell&#x27;operating segment nel test?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: l&#x27;unità non può essere più grande di un operating segment di IFRS 8, prima dell&#x27;aggregazione (§80).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perdita sul goodwill 40 lo scorso anno, oggi il recoverable amount è risalito. Che cosa fai?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Nessun reversal sul goodwill (§124). La risalita si presume goodwill generato internamente (§125).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In che ordine testi una macchina con indizi e la sua CGU con goodwill?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Prima la macchina, rilevando la perdita. Poi la CGU con il goodwill (§98).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;terra&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;k&quot;&gt;Parte E&lt;/span&gt;&lt;h2&gt;Comunicare e cambiare&lt;/h2&gt;&lt;p&gt;Il test poggia su stime: la disclosure le rende verificabili. E le regole sono in revisione.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;s&quot; id=&quot;disclosure&quot;&gt;
&lt;h3&gt;16. Disclosure: dal generale al goodwill&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 71-86 · §126-134&lt;/p&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 196&quot; role=&quot;img&quot; aria-label=&quot;Quattro livelli di disclosure, dal più generale al più dettagliato&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;4&quot; y=&quot;4&quot; width=&quot;472&quot; height=&quot;42&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;30&quot;&gt;§126 · ogni classe di attività: importi&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;34&quot; y=&quot;52&quot; width=&quot;412&quot; height=&quot;42&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;78&quot;&gt;§130 · perdite rilevate o stornate: il dettaglio&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;64&quot; y=&quot;100&quot; width=&quot;352&quot; height=&quot;42&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;126&quot;&gt;§131-133 · perdite aggregate, goodwill non allocato&lt;/text&gt;
&lt;rect class=&quot;bc&quot; x=&quot;94&quot; y=&quot;148&quot; width=&quot;292&quot; height=&quot;42&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;240&quot; y=&quot;174&quot;&gt;§134 · CGU con goodwill: le stime&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button type=&quot;button&quot;&gt;§126&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;§130&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;§131-133&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;§134&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Sensitivity&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 71&lt;/p&gt;&lt;p&gt;Per ogni classe di attività:&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Impairment losses&lt;/th&gt;&lt;th&gt;Reversals&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Profit or loss&lt;/th&gt;&lt;td&gt;importo e voce del prospetto&lt;/td&gt;&lt;td&gt;importo e voce del prospetto&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;OCI, attività rivalutate&lt;/th&gt;&lt;td&gt;importo&lt;/td&gt;&lt;td&gt;importo&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 72-76&lt;/p&gt;&lt;ol type=&quot;a&quot;&gt;&lt;li&gt;&lt;strong&gt;Eventi e circostanze&lt;/strong&gt; che hanno portato alla perdita o al reversal.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Importo&lt;/strong&gt; rilevato o stornato.&lt;/li&gt;&lt;li&gt;Per &lt;strong&gt;attività singola&lt;/strong&gt;: natura e, se si applica IFRS 8, reportable segment.&lt;/li&gt;&lt;li&gt;Per &lt;strong&gt;CGU&lt;/strong&gt;: descrizione, importo per classe di attività e per segmento, eventuale cambio di aggregazione con i motivi.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Recoverable amount&lt;/strong&gt;, e se è FVLCD o VIU.&lt;/li&gt;&lt;li&gt;Se è &lt;strong&gt;FVLCD&lt;/strong&gt;: livello della fair value hierarchy; per i livelli 2 e 3 tecnica, cambi di tecnica con motivi, assunzioni chiave, e discount rate attuale e precedente se si usa il present value.&lt;/li&gt;&lt;li&gt;Se è &lt;strong&gt;VIU&lt;/strong&gt;: discount rate attuale e precedente.&lt;/li&gt;&lt;/ol&gt;
&lt;div class=&quot;note x&quot;&gt;&lt;span class=&quot;tagx lab&quot;&gt;fonte esterna&lt;/span&gt;La fair value hierarchy di IFRS 13: Level 1, prezzi quotati non rettificati in mercati attivi per attività identiche; Level 2, altri input osservabili; Level 3, input non osservabili. &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs13.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 13, testo 2026&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 78-79&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;§131&lt;/strong&gt;: per perdite e reversal aggregati senza informazioni §130, si indicano le principali classi di attività e i principali eventi e circostanze.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;§132&lt;/strong&gt;: l&#x27;entità è &lt;em&gt;incoraggiata&lt;/em&gt; a indicare le assunzioni usate; per le CGU con goodwill o intangibili a vita indefinita, il §134 le &lt;em&gt;obbliga&lt;/em&gt;.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;§133&lt;/strong&gt;: goodwill acquisito nel periodo e non ancora allocato (§84): importo e motivi.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 80-85 · Si applica se goodwill o intangibili a vita indefinita della CGU sono significativi rispetto al totale&lt;/p&gt;
&lt;p&gt;Sempre: carrying amount di goodwill e di intangibili a vita indefinita allocati, e la base del recoverable amount (VIU o FVLCD).&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Da indicare&lt;/th&gt;&lt;th&gt;VIU&lt;/th&gt;&lt;th&gt;FVLCD&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Assunzioni chiave e approccio del management&lt;/td&gt;&lt;td&gt;Sì&lt;/td&gt;&lt;td&gt;Sì, se non è un prezzo quotato per unità identica&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Tecnica di valutazione&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;td&gt;Sì, con eventuale cambio e motivi&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Livello della fair value hierarchy&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;td&gt;Sì&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Periodo di proiezione&lt;/td&gt;&lt;td&gt;Sì, e perché se oltre 5 anni&lt;/td&gt;&lt;td&gt;Se usa flussi attualizzati&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Growth rate&lt;/td&gt;&lt;td&gt;Sì, e perché se oltre la media di lungo periodo&lt;/td&gt;&lt;td&gt;Se usa flussi attualizzati&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Discount rate&lt;/td&gt;&lt;td&gt;Sì&lt;/td&gt;&lt;td&gt;Se usa flussi attualizzati&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;Le &lt;span class=&quot;en&quot;&gt;key assumptions&lt;/span&gt; sono quelle a cui il recoverable amount è &lt;strong&gt;più sensibile&lt;/strong&gt;. L&#x27;approccio indica se riflettono l&#x27;esperienza passata o fonti esterne e, se no, come e perché se ne discostano. Per il FVLCD non sono richieste le disclosure di IFRS 13.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 86 · §134(f)&lt;/p&gt;&lt;p&gt;Se una variazione &lt;span class=&quot;en&quot;&gt;reasonably possible&lt;/span&gt; di un&#x27;assunzione chiave porterebbe il carrying amount sopra il recoverable amount, l&#x27;entità indica:&lt;/p&gt;&lt;ol type=&quot;i&quot;&gt;&lt;li&gt;il margine tra recoverable amount e carrying amount;&lt;/li&gt;&lt;li&gt;il valore assegnato all&#x27;assunzione;&lt;/li&gt;&lt;li&gt;di quanto dovrebbe variare, considerando gli effetti sulle altre variabili, per azzerare il margine.&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;oltre le slide&lt;/span&gt;Esempio di nota: «Il recoverable amount eccede il carrying amount di 40. Il discount rate è 9%: un aumento di 0,7 punti azzererebbe il margine». Puoi riprodurre il ragionamento con il &lt;a href=&quot;#viu-w&quot;&gt;calcolatore del VIU&lt;/a&gt;.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;progetto&quot;&gt;
&lt;h3&gt;17. Il progetto IASB: Goodwill and Impairment&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 104-108&lt;/p&gt;
&lt;p&gt;Il progetto &lt;span class=&quot;en&quot;&gt;Business Combinations: Disclosures, Goodwill and Impairment&lt;/span&gt; riguarda due standard: IFRS 3, per informare meglio sulla performance delle acquisizioni, e IAS 36, per modificare il test delle CGU con goodwill.&lt;/p&gt;
&lt;p&gt;Secondo le slide, a settembre 2023 l&#x27;IASB (International Accounting Standards Board) ha deciso di pubblicare un &lt;span class=&quot;en&quot;&gt;Exposure Draft&lt;/span&gt; (bozza in consultazione). Il 19 settembre 2023 ha deciso, in via provvisoria, di:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;strong&gt;non&lt;/strong&gt; dare ai &lt;span class=&quot;en&quot;&gt;first-time adopters&lt;/span&gt; un&#x27;esenzione specifica dalle modifiche a IAS 36;&lt;/li&gt;&lt;li&gt;applicare le modifiche ai test effettuati dalla data di efficacia in poi, con applicazione anticipata ammessa.&lt;/li&gt;&lt;/ul&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;strong&gt;Le slide vanno aggiornate su questo punto.&lt;/strong&gt; La slide 105 dice che l&#x27;IASB sta lavorando per pubblicare l&#x27;Exposure Draft: è stato pubblicato a marzo 2024. Le modifiche, a quanto risulta dalle ricerche di novembre 2026, non sono ancora definitive. Vale IAS 36 come descritto sopra.&lt;/div&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 272&quot; role=&quot;img&quot; aria-label=&quot;Linea del tempo del progetto dal 2020 al 2027&quot;&gt;
&lt;path class=&quot;ln&quot; d=&quot;M70 10V262&quot;/&gt;
&lt;g&gt;&lt;circle class=&quot;bm&quot; cx=&quot;70&quot; cy=&quot;20&quot; r=&quot;6&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;4&quot; y=&quot;25&quot;&gt;2020&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;86&quot; y=&quot;25&quot;&gt;Discussion Paper&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;circle class=&quot;bm&quot; cx=&quot;70&quot; cy=&quot;62&quot; r=&quot;6&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;4&quot; y=&quot;67&quot;&gt;01/23&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;86&quot; y=&quot;67&quot;&gt;«In brief», citato nelle slide&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;circle class=&quot;bm&quot; cx=&quot;70&quot; cy=&quot;104&quot; r=&quot;6&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;4&quot; y=&quot;109&quot;&gt;03/23&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;86&quot; y=&quot;109&quot;&gt;Resta il modello impairment-only&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;circle class=&quot;bm&quot; cx=&quot;70&quot; cy=&quot;146&quot; r=&quot;6&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;4&quot; y=&quot;151&quot;&gt;09/23&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;86&quot; y=&quot;151&quot;&gt;Decisione di pubblicare, ferma qui la slide&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;circle class=&quot;ba&quot; cx=&quot;70&quot; cy=&quot;188&quot; r=&quot;6&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;4&quot; y=&quot;193&quot;&gt;03/24&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;86&quot; y=&quot;193&quot;&gt;Exposure Draft, commenti fino al 15/07/2024&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;circle class=&quot;ba&quot; cx=&quot;70&quot; cy=&quot;230&quot; r=&quot;6&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;4&quot; y=&quot;235&quot;&gt;2026&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;86&quot; y=&quot;235&quot;&gt;Riesame delle proposte, ancora in corso&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;circle class=&quot;ba&quot; cx=&quot;70&quot; cy=&quot;258&quot; r=&quot;6&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;4&quot; y=&quot;263&quot;&gt;2027&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;86&quot; y=&quot;263&quot;&gt;H1: decisione attesa sulla direzione&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;figcaption&gt;Solo le tappe 01/23 e 09/23 sono nelle slide; le altre sono &lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt;, con i link qui sotto.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;note x&quot;&gt;&lt;span class=&quot;tagx lab&quot;&gt;fonte esterna&lt;/span&gt;
&lt;p&gt;Exposure Draft del 14 marzo 2024: &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/project/goodwill-and-impairment/exposure-draft-2024/iasb-ed-2024-1-bcdgi.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ED/2024/1&lt;/a&gt;. Stato del progetto: &lt;a href=&quot;https://www.ifrs.org/projects/work-plan/goodwill-and-impairment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;pagina IFRS&lt;/a&gt; e &lt;a href=&quot;https://www.iasplus.com/en/news/2026/10/work-plan&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;work plan di settembre 2026 su IAS Plus&lt;/a&gt;, che sposta al primo semestre 2027 la decisione sulla direzione. Il mantenimento dell&#x27;impairment-only: &lt;a href=&quot;https://www.icaew.com/insights/viewpoints-on-the-news/2023/mar-2023/IASB-retains-impairmentonly-goodwill-model-in-MA&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW, marzo 2023&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;Due proposte toccano regole viste in questa lezione. La prima toglie l&#x27;obbligo di usare flussi e tassi pre-tax (§51, §55), chiedendo assunzioni coerenti tra loro (&lt;a href=&quot;https://ifrs.org/content/dam/ifrs/meetings/2025/january/iasb/ap18d-other-ias-36-proposals.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;staff paper, gennaio 2025&lt;/a&gt;). La seconda riguarda il divieto di includere nel VIU i flussi da restructuring futuri e da miglioramenti (§44): la sua rimozione è ancora in riesame (&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/meetings/2026/april/iasb/ap18f-restructuring-enhancement-cash-flows.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;staff paper, aprile 2026&lt;/a&gt;). Sono proposte, non regole in vigore.&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h4&gt;Autoverifica · Parte E&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;Il recoverable amount è il VIU. Quale tasso va indicato per il §130?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Il discount rate della stima attuale e di quella precedente, se c&#x27;è (§130g).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Il §132 obbliga sempre a indicare le assunzioni?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No, le incoraggia. Diventano obbligatorie con il §134, per le CGU con goodwill o intangibili a vita indefinita significativi.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quando serve la sensitivity del §134(f)?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Quando una variazione ragionevolmente possibile di un&#x27;assunzione chiave farebbe superare al carrying amount il recoverable amount.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Oggi posso includere nel VIU un restructuring non ancora deliberato perché «il progetto IASB lo permetterà»?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Il §44 è ancora in vigore: quelle del progetto sono proposte.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;

&lt;section class=&quot;s&quot; id=&quot;formule&quot;&gt;
&lt;h3&gt;Formulario lampo&lt;/h3&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;th&gt;Recoverable amount&lt;/th&gt;&lt;td&gt;max (FVLCD ; VIU)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;§6&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Impairment loss&lt;/th&gt;&lt;td&gt;Carrying amount − Recoverable amount, se positivo&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;§6&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Value in use&lt;/th&gt;&lt;td&gt;Σ CF&lt;sub&gt;t&lt;/sub&gt; / (1 + r)&lt;sup&gt;t&lt;/sup&gt;, pre-tax, senza financing&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;§31, 50&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Expected CF&lt;/th&gt;&lt;td&gt;Σ esito × probabilità&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;A7&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Attività rivalutata&lt;/th&gt;&lt;td&gt;OCI = min (perdita ; surplus), il resto in P&amp;amp;L&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;§60-61&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Allocazione CGU&lt;/th&gt;&lt;td&gt;goodwill, poi pro rata; limite max (FVLCD ; VIU ; 0)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;§104-105&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Tetto reversal&lt;/th&gt;&lt;td&gt;carrying amount senza perdita passata; CGU: anche il recoverable amount&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;§117, 123&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Goodwill ceduto&lt;/th&gt;&lt;td&gt;valore ceduto / (ceduto + trattenuto)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 55&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;div class=&quot;terra&quot;&gt;
&lt;section class=&quot;s&quot; id=&quot;approfondire&quot;&gt;
&lt;h3&gt;Per approfondire&lt;/h3&gt;
&lt;p&gt;Testi, norme e modelli citati nelle slide. Le descrizioni di questa sezione sono &lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt;, distinte dal contenuto delle slide; il «perché conta» collega ogni voce alla lezione. Le slide non citano autori né studi accademici. La voce su Sharpe è il riferimento di origine del CAPM che esse nominano.&lt;/p&gt;
&lt;p style=&quot;font-size:.9rem;color:var(--muted)&quot;&gt;Altri materiali del corso: per questa pagina non è stato possibile elencare la cartella &lt;code&gt;corso/&lt;/code&gt;, quindi nessun contenuto viene da altre lezioni, esercizi o programma. I legami con gli altri standard vengono dalle citazioni nelle slide di IAS 36.&lt;/p&gt;
&lt;h4&gt;Lo standard e il progetto&lt;/h4&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 36 Impairment of Assets&lt;/h4&gt;&lt;p&gt;IFRS Foundation. Testo completo: §1-141 e Appendici A-C, edizione 2026.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; è la fonte primaria di tutta la lezione; contiene anche ciò che le slide omettono, come §A1 e §102(b).&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias36.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-36-impairment-of-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sintesi&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;In brief, gennaio 2023&lt;/h4&gt;&lt;p&gt;Articolo dell&#x27;IASB del 31 gennaio 2023 sulle decisioni del progetto.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; è la fonte delle slide 107-108 sull&#x27;obiettivo del test.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/project/goodwill-and-impairment/inbrief-businesscombs-jan2023.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IASB Update, settembre 2023&lt;/h4&gt;&lt;p&gt;Riunione del 19 settembre 2023: decisioni provvisorie su transition e first-time adopters.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; è la base della slide 106.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/meetings/2023/september/iasb/ap18b-bcdgi-transition-and-effective-date.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;staff paper&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/meeting-notes/iasb/2023/september/bc&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;ED/2024/1&lt;/h4&gt;&lt;p&gt;Exposure Draft del 14 marzo 2024 con le modifiche proposte a IFRS 3 e IAS 36. Commenti fino al 15 luglio 2024.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; è il passo successivo a quello descritto dalle slide.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/project/goodwill-and-impairment/exposure-draft-2024/iasb-ed-2024-1-bcdgi.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ED&lt;/a&gt; · &lt;a href=&quot;https://cdn.ifrs.org/content/dam/ifrs/project/goodwill-and-impairment/exposure-draft-2024/iasb-bc-2024-1-bcdgi.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Basis for Conclusions&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;Stato del progetto&lt;/h4&gt;&lt;p&gt;Riesame ancora aperto nel 2026; decisione sulla direzione attesa nel primo semestre 2027.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; dice se le regole d&#x27;esame stanno per cambiare. Ricontrolla prima dell&#x27;esame.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/projects/work-plan/goodwill-and-impairment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/news/2026/10/work-plan&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;Sharpe (1964)&lt;/h4&gt;&lt;p&gt;W. F. Sharpe, «Capital Asset Prices: A Theory of Market Equilibrium under Conditions of Risk», &lt;span class=&quot;en&quot;&gt;Journal of Finance&lt;/span&gt;, 19(3), 425-442. Deriva la relazione tra prezzi delle attività e rischio.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; è all&#x27;origine del CAPM citato in A17 per stimare il WACC.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://doi.org/10.1111/j.1540-6261.1964.tb02865.x&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;
&lt;h4&gt;Standard che interagiscono con il test&lt;/h4&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 3 Business Combinations&lt;/h4&gt;&lt;p&gt;Come l&#x27;acquirente rileva attività, passività e goodwill di un&#x27;acquisizione.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; il goodwill testato nasce qui.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-3-business-combinations/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 38 Intangible Assets&lt;/h4&gt;&lt;p&gt;Il §48 vieta di iscrivere il goodwill generato internamente.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; spiega il divieto di reversal e gli intangibili a test annuale.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias38.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 16 Property, Plant and Equipment&lt;/h4&gt;&lt;p&gt;Scelta tra cost model e revaluation model, con surplus in OCI.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; regola dove va la perdita di un&#x27;attività rivalutata.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2025/issued/ias16.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 8 Operating Segments&lt;/h4&gt;&lt;p&gt;Definisce gli operating segment in base a ciò che rivede il chief operating decision maker.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; fissa il limite massimo per allocare il goodwill.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs8.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 13 Fair Value Measurement&lt;/h4&gt;&lt;p&gt;Definizione di fair value e gerarchia a tre livelli degli input.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; sta alla base del FVLCD e della sua disclosure.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs13.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 37 Provisions&lt;/h4&gt;&lt;p&gt;Provisions, incluse quelle per restructuring. Sono in corso modifiche mirate: Exposure Draft di novembre 2024.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; accoglie le uscite del restructuring (§47).&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-37-provisions-contingent-liabilities-and-contingent-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 12 Income Taxes&lt;/h4&gt;&lt;p&gt;Imposte correnti e differite.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; dopo la perdita, le differite si rideterminano (§64).&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-12-income-taxes/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 5 Held for Sale&lt;/h4&gt;&lt;p&gt;Attività destinate alla vendita: minore tra carrying amount e fair value less costs to sell; l&#x27;ammortamento cessa.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; segna l&#x27;uscita da IAS 36.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-5-non-current-assets-held-for-sale-and-discontinued-operations/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 10 Consolidated Financial Statements&lt;/h4&gt;&lt;p&gt;Il controllo come base del consolidamento.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; definisce le subsidiaries che restano in IAS 36.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-10-consolidated-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 28 Associates and Joint Ventures&lt;/h4&gt;&lt;p&gt;Il metodo del patrimonio netto; influenza notevole presunta dal 20% dei voti. Una revisione è attesa nel 2027.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; definisce le associates in scope (§4).&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-28-investments-in-associates-and-joint-ventures/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/projects/work-plan/equity-method/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;progetto&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 11 Joint Arrangements&lt;/h4&gt;&lt;p&gt;Distingue joint operation e joint venture in base a diritti e obblighi.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; definisce le joint ventures in scope (§4).&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-11-joint-arrangements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;
&lt;h4&gt;Standard delle attività escluse dallo scope&lt;/h4&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 2 Inventories&lt;/h4&gt;&lt;p&gt;Minore tra costo e net realisable value.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; ha già un proprio limite di valore, quindi resta fuori.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 15 Revenue&lt;/h4&gt;&lt;p&gt;Il modello a cinque passi per i ricavi da contratti.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; regola contract assets e costi contrattuali esclusi.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-15-revenue-from-contracts-with-customers/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 19 Employee Benefits&lt;/h4&gt;&lt;p&gt;Contabilità e disclosure dei benefici ai dipendenti.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; regola gli assets esclusi da IAS 36.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-19-employee-benefits/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 9 Financial Instruments&lt;/h4&gt;&lt;p&gt;Classificazione e misurazione, con impairment basato sulle expected credit losses.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; è l&#x27;altro modello di impairment, da non confondere.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-9-financial-instruments/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 40 Investment Property&lt;/h4&gt;&lt;p&gt;Scelta tra fair value model, con variazioni in P&amp;amp;L, e cost model.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; solo il primo è escluso da IAS 36.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-40-investment-property/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 41 Agriculture&lt;/h4&gt;&lt;p&gt;Biological assets al fair value less costs to sell; le bearer plants seguono IAS 16.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; il valore corrente rende superfluo il test.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-41-agriculture/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 17 Insurance Contracts&lt;/h4&gt;&lt;p&gt;Misurazione dei contratti assicurativi a valori attuali corretti per il rischio, con contractual service margin.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Perché conta:&lt;/strong&gt; regola i contratti esclusi.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-17-insurance-contracts/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;/main&gt;
&lt;/div&gt;
&lt;footer&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/footer&gt;
