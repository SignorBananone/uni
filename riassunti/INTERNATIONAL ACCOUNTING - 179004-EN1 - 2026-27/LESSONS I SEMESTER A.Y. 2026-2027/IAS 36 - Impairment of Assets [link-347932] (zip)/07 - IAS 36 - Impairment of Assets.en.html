&lt;h1&gt;IAS 36 &lt;em&gt;Impairment of Assets&lt;/em&gt;&lt;/h1&gt;
&lt;p class=&quot;lede&quot;&gt;A single rule: no asset may remain in the financial statements at an amount higher than what the entity can recover by using or selling it. The rest of the standard explains when to check, how to measure, who absorbs the loss and what to tell the reader.&lt;/p&gt;

&lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;k&quot;&gt;Part A&lt;/span&gt;&lt;h2&gt;Foundations&lt;/h2&gt;&lt;p&gt;What the standard aims to achieve, which assets it applies to and the vocabulary it works with.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;s&quot; id=&quot;obiettivo&quot;&gt;
&lt;h3&gt;1. Objective: a ceiling on the carrying amount&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 2 · §1&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;en&quot;&gt;Impairment&lt;/span&gt; is a reduction in the value of an asset. IAS 36 prescribes the procedures to ensure that assets are carried at no more than their &lt;span class=&quot;en&quot;&gt;recoverable amount&lt;/span&gt;, that is, the &lt;strong&gt;amount recoverable&lt;/strong&gt; through use or sale.&lt;/p&gt;
&lt;p&gt;If the &lt;span class=&quot;en&quot;&gt;carrying amount&lt;/span&gt; (the amount at which the asset is recognised) exceeds that amount, the asset is &lt;span class=&quot;en&quot;&gt;impaired&lt;/span&gt; and the entity must recognise an &lt;span class=&quot;en&quot;&gt;impairment loss&lt;/span&gt;. The standard also specifies when the loss must be reversed (&lt;span class=&quot;en&quot;&gt;reversal&lt;/span&gt;) and what information must be published (&lt;span class=&quot;en&quot;&gt;disclosure&lt;/span&gt;).&lt;/p&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 196&quot; role=&quot;img&quot; aria-label=&quot;The two ways of recovering an asset, use and sale, compared with the carrying amount&quot;&gt;
&lt;rect class=&quot;bc&quot; x=&quot;170&quot; y=&quot;6&quot; width=&quot;140&quot; height=&quot;48&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;240&quot; y=&quot;27&quot;&gt;Asset&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;240&quot; y=&quot;45&quot;&gt;carrying amount&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M210 54C210 76 92 66 92 88&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M270 54C270 76 388 66 388 88&quot;/&gt;
&lt;rect class=&quot;bx&quot; x=&quot;6&quot; y=&quot;88&quot; width=&quot;172&quot; height=&quot;44&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;92&quot; y=&quot;115&quot;&gt;use → future cash flows&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;302&quot; y=&quot;88&quot; width=&quot;172&quot; height=&quot;44&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;388&quot; y=&quot;115&quot;&gt;sell → net price&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M92 132C92 154 200 142 200 156&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M388 132C388 154 280 142 280 156&quot;/&gt;
&lt;rect class=&quot;ba&quot; x=&quot;120&quot; y=&quot;156&quot; width=&quot;240&quot; height=&quot;36&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid tp&quot; x=&quot;240&quot; y=&quot;179&quot;&gt;recoverable amount: the higher&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;beyond the slides&lt;/span&gt;The economic logic: a rational entity chooses the better option between using and selling. That is why the higher of the two amounts is taken. If even the better option does not cover the carrying amount, that part of the asset will generate no benefits, and the financial statements would be overstating it.&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;scope&quot;&gt;
&lt;h3&gt;2. Scope: what is in, what is out&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 3-6 · §2-5&lt;/p&gt;
&lt;p&gt;The starting point is broad: IAS 36 applies to &lt;strong&gt;all assets&lt;/strong&gt; except those listed. The exclusions follow a pattern: those assets already have their own measurement basis in another standard. &lt;span class=&quot;tagi&quot;&gt;beyond the slides&lt;/span&gt; The slides give the list; the reasons on the cards are an addition.&lt;/p&gt;
&lt;p&gt;Try to say whether each item falls within IAS 36, then open it.&lt;/p&gt;
&lt;div class=&quot;flips&quot;&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Inventories&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Out · IAS 2&lt;/b&gt;Measured at the lower of cost and net realisable value. &lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Contract assets and costs to obtain a contract&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Out · IFRS 15&lt;/b&gt;Assets arising from contracts with customers.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Deferred tax assets&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Out · IAS 12&lt;/b&gt;They have their own test of tax recoverability.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Assets arising from employee benefits&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Out · IAS 19&lt;/b&gt;Employee benefits with their own actuarial rules.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Financial assets within IFRS 9&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Out · IFRS 9&lt;/b&gt;Their own rules, including impairment based on expected losses.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Investment property at fair value&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Out · IAS 40&lt;/b&gt;The amount is already updated to fair value at each reporting date.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Biological assets at fair value less costs of disposal&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Out · IAS 41&lt;/b&gt;Agricultural assets already measured at a current value.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Insurance contracts&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Out · IFRS 17&lt;/b&gt;Including assets for insurance acquisition cash flows.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Non-current assets held for sale&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Out · IFRS 5&lt;/b&gt;Once classified as held for sale, the asset no longer follows IAS 36 (slide 11).&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Investments in subsidiaries, associates, joint ventures&lt;/summary&gt;&lt;p&gt;&lt;b&gt;In · §4&lt;/b&gt;They are financial assets, but those defined by IFRS 10, IAS 28 and IFRS 11 remain within IAS 36.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Machinery at cost (IAS 16)&lt;/summary&gt;&lt;p&gt;&lt;b&gt;In&lt;/b&gt;The typical case: no exclusion applies to it. &lt;span class=&quot;tagi&quot;&gt;beyond the slides&lt;/span&gt;&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Building at revalued amount (IAS 16)&lt;/summary&gt;&lt;p&gt;&lt;b&gt;In · §5&lt;/b&gt;Even though it has been revalued. See the Focus below.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;h4&gt;Focus: why test an asset that has already been revalued?&lt;/h4&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 5-6 · §5&lt;/p&gt;
&lt;p&gt;The &lt;span class=&quot;en&quot;&gt;revalued amount&lt;/span&gt; is fair value at the revaluation date, less subsequent depreciation and impairment. It might seem to be an up-to-date value already, but one element is missing:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;If the &lt;span class=&quot;en&quot;&gt;costs of disposal&lt;/span&gt; are not negligible, FVLCD is necessarily &lt;strong&gt;lower&lt;/strong&gt; than fair value.&lt;/li&gt;
&lt;li&gt;The asset is therefore impaired if its &lt;span class=&quot;en&quot;&gt;value in use&lt;/span&gt; is also lower than the revalued amount.&lt;/li&gt;
&lt;li&gt;For this reason, IAS 36 is applied &lt;strong&gt;after&lt;/strong&gt; the revaluation to determine whether the asset may be impaired.&lt;/li&gt;
&lt;/ol&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;beyond the slides&lt;/span&gt;Example: revalued amount 100, costs of disposal 5, VIU 90. FVLCD = 95, recoverable amount = 95, loss = 5. If the costs were negligible, FVLCD ≈ 100 and there would normally be no loss.&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;definizioni&quot;&gt;
&lt;h3&gt;3. Definitions: four terms are enough&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 7 · §6&lt;/p&gt;
&lt;dl class=&quot;defs&quot;&gt;
&lt;div&gt;&lt;dt&gt;Carrying amount&lt;/dt&gt;&lt;dd&gt;The amount at which an asset is recognised after deducting accumulated &lt;span class=&quot;en&quot;&gt;depreciation&lt;/span&gt; or &lt;span class=&quot;en&quot;&gt;amortisation&lt;/span&gt; and accumulated impairment losses.&lt;/dd&gt;&lt;/div&gt;
&lt;div&gt;&lt;dt&gt;Recoverable amount&lt;/dt&gt;&lt;dd&gt;The higher of &lt;span class=&quot;en&quot;&gt;fair value less costs of disposal&lt;/span&gt; (FVLCD, the sale price net of the costs of selling) and &lt;span class=&quot;en&quot;&gt;value in use&lt;/span&gt;. It applies to an individual asset or to a &lt;span class=&quot;en&quot;&gt;cash-generating unit&lt;/span&gt; (CGU, the smallest group of assets that generates independent cash flows).&lt;/dd&gt;&lt;/div&gt;
&lt;div&gt;&lt;dt&gt;Value in use (VIU)&lt;/dt&gt;&lt;dd&gt;The present value of the future cash flows expected from the asset or CGU.&lt;/dd&gt;&lt;/div&gt;
&lt;div&gt;&lt;dt&gt;Impairment loss&lt;/dt&gt;&lt;dd&gt;The amount by which the carrying amount exceeds the recoverable amount.&lt;/dd&gt;&lt;/div&gt;
&lt;/dl&gt;
&lt;div class=&quot;formula&quot;&gt;Recoverable amount = max (FVLCD ; VIU)&lt;br&gt;Impairment loss = max (Carrying amount − Recoverable amount ; 0)&lt;/div&gt;
&lt;div class=&quot;w&quot; id=&quot;sim&quot;&gt;&lt;h4&gt;Try the test&lt;/h4&gt;&lt;p class=&quot;hint&quot;&gt;Move the three sliders. Amounts are in CU, the generic currency unit used by the standard.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Carrying amount &lt;b data-v=&quot;ca&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;ca&quot; min=&quot;20&quot; max=&quot;200&quot; value=&quot;100&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Fair value less costs of disposal &lt;b data-v=&quot;fv&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;fv&quot; min=&quot;0&quot; max=&quot;200&quot; value=&quot;70&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Value in use &lt;b data-v=&quot;viu&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;viu&quot; min=&quot;0&quot; max=&quot;200&quot; value=&quot;85&quot;&gt;&lt;/label&gt;
&lt;svg role=&quot;img&quot; aria-label=&quot;Bars comparing carrying amount, FVLCD, value in use and recoverable amount&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;res&quot;&gt;&lt;p&gt;Recoverable amount &lt;strong data-o=&quot;ra&quot;&gt;&lt;/strong&gt; · Impairment loss &lt;strong data-o=&quot;l&quot;&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p data-o=&quot;m&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;beyond the slides&lt;/span&gt;&lt;span class=&quot;en&quot;&gt;Fair value&lt;/span&gt; is the price that would be received for selling the asset in an orderly transaction between market participants at the measurement date: it is a market value. VIU, by contrast, is an entity-specific value, because it depends on how the entity will use the asset. Hence the possible difference between the two.&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h4&gt;Self-check · Part A&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;The carrying amount is 500, FVLCD 430 and VIU 460. What is the loss?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Recoverable amount = max(430; 460) = 460. Loss = 500 − 460 = &lt;strong&gt;40&lt;/strong&gt;. The carrying amount becomes 460.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Does investment property under the cost model fall within IAS 36?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Yes. Slide 4 excludes only property &lt;strong&gt;measured at fair value&lt;/strong&gt;. Under the cost model, nothing updates the amount at each reporting date, so the test is needed.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Investments in subsidiaries are financial assets: why do they not follow IFRS 9?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;§4 explicitly brings subsidiaries (IFRS 10), associates (IAS 28) and joint ventures (IFRS 11) back within IAS 36.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is the higher rather than the lower of FVLCD and VIU taken?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because a rational entity recovers value by choosing the more advantageous option. A loss exists only if &lt;strong&gt;both&lt;/strong&gt; options remain below the carrying amount.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ocra&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;k&quot;&gt;Part B&lt;/span&gt;&lt;h2&gt;When to test&lt;/h2&gt;&lt;p&gt;Most assets require an indication. For some, the test is annual in any case.&lt;/p&gt;&lt;/div&gt;

&lt;figure class=&quot;dg&quot; style=&quot;margin-top:24px&quot;&gt;&lt;svg viewBox=&quot;0 0 480 300&quot; role=&quot;img&quot; aria-label=&quot;Decision diagram: at each reporting date, look for indications; goodwill and intangibles with indefinite useful lives are tested every year in any case; if the carrying amount exceeds the recoverable amount, the loss is recognised&quot;&gt;
&lt;rect class=&quot;bc&quot; x=&quot;6&quot; y=&quot;6&quot; width=&quot;222&quot; height=&quot;60&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;117&quot; y=&quot;31&quot;&gt;At each reporting date&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;117&quot; y=&quot;51&quot;&gt;any indications? (§9)&lt;/text&gt;
&lt;rect class=&quot;bc&quot; x=&quot;252&quot; y=&quot;6&quot; width=&quot;222&quot; height=&quot;60&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;363&quot; y=&quot;31&quot;&gt;Every year, always&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;363&quot; y=&quot;51&quot;&gt;goodwill, some intangibles (§10)&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M117 66V82&quot;/&gt;&lt;text class=&quot;ts&quot; x=&quot;125&quot; y=&quot;80&quot;&gt;yes&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M117 106C117 122 180 112 200 128&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M363 66V112C363 122 300 112 280 128&quot;/&gt;
&lt;rect class=&quot;bx&quot; x=&quot;120&quot; y=&quot;128&quot; width=&quot;240&quot; height=&quot;46&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;240&quot; y=&quot;156&quot;&gt;Estimate recoverable amount&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M240 174V192&quot;/&gt;
&lt;rect class=&quot;bx&quot; x=&quot;120&quot; y=&quot;192&quot; width=&quot;240&quot; height=&quot;40&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;217&quot;&gt;Carrying &amp;gt; recoverable?&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M170 232V252&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M310 232V252&quot;/&gt;
&lt;rect class=&quot;ba&quot; x=&quot;40&quot; y=&quot;252&quot; width=&quot;190&quot; height=&quot;42&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid tp&quot; x=&quot;135&quot; y=&quot;278&quot;&gt;yes → impairment loss&lt;/text&gt;
&lt;rect class=&quot;bm&quot; x=&quot;250&quot; y=&quot;252&quot; width=&quot;190&quot; height=&quot;42&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;345&quot; y=&quot;278&quot;&gt;no → no loss&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M117 82V106&quot;/&gt;
&lt;/svg&gt;&lt;/figure&gt;

&lt;section class=&quot;s&quot; id=&quot;indizi&quot;&gt;
&lt;h3&gt;4. Indications: the signals to look for&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 8, 10-12 · §9, 12, 14&lt;/p&gt;
&lt;p&gt;At the end of each &lt;span class=&quot;en&quot;&gt;reporting period&lt;/span&gt; the entity assesses whether there is any indication of a loss. If there is, it estimates the recoverable amount. If there is not, the calculation is not needed for ordinary assets.&lt;/p&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button type=&quot;button&quot;&gt;External sources&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Internal sources&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Internal reporting&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 10 · §12&lt;/p&gt;&lt;ul&gt;
&lt;li&gt;The asset&#x27;s value has declined during the period &lt;strong&gt;significantly more&lt;/strong&gt; than would be expected from the passage of time or normal use.&lt;/li&gt;
&lt;li&gt;Significant adverse changes, occurred or imminent, in the &lt;strong&gt;technological, market, economic or legal&lt;/strong&gt; environment.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Market interest rates have increased&lt;/strong&gt; and the increase may affect the discount rate used for VIU, materially reducing the recoverable amount.&lt;/li&gt;
&lt;li&gt;The carrying amount of the entity&#x27;s &lt;span class=&quot;en&quot;&gt;net assets&lt;/span&gt; exceeds its &lt;strong&gt;market capitalisation&lt;/strong&gt;.&lt;/li&gt;
&lt;/ul&gt;&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;beyond the slides&lt;/span&gt;The last signal is the most intuitive: book equity 800, market capitalisation 600. The market is saying that the assets are worth less than the financial statements show.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 11 · §12&lt;/p&gt;&lt;ul&gt;
&lt;li&gt;Evidence of &lt;strong&gt;obsolescence&lt;/strong&gt; or physical damage.&lt;/li&gt;
&lt;li&gt;Significant internal changes: the asset becoming &lt;span class=&quot;en&quot;&gt;idle&lt;/span&gt;, plans to discontinue or restructure the operation, plans to dispose of the asset earlier than expected, useful life reassessed from indefinite to finite.&lt;/li&gt;
&lt;li&gt;Internal reporting indicating that economic performance is, or will be, worse than expected.&lt;/li&gt;
&lt;/ul&gt;&lt;div class=&quot;warn&quot;&gt;Once the &lt;span class=&quot;en&quot;&gt;held for sale&lt;/span&gt; criteria are met, the asset leaves IAS 36 and moves to IFRS 5. A mere plan for early disposal, by contrast, is still an indication within IAS 36.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 12 · §14 · Budgets and actuals&lt;/p&gt;&lt;ul&gt;
&lt;li&gt;Cash flows for acquiring the asset, or for operating and maintaining it, are significantly &lt;strong&gt;higher than originally budgeted&lt;/strong&gt;.&lt;/li&gt;
&lt;li&gt;Actual net cash flows or operating results are significantly &lt;strong&gt;worse than budgeted&lt;/strong&gt;.&lt;/li&gt;
&lt;li&gt;A &lt;strong&gt;significant decline&lt;/strong&gt; in budgeted cash flows or results, or a significant increase in the budgeted loss.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Operating losses&lt;/strong&gt; or net cash outflows when current-period figures are aggregated with budgeted future figures.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;annual&quot;&gt;
&lt;h3&gt;5. Annual test: the exceptions that need no indication&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 9, 57 · §10, 96&lt;/p&gt;
&lt;p&gt;Three categories are tested every year, &lt;strong&gt;even without any indication&lt;/strong&gt;:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Intangible assets&lt;/h4&gt;&lt;p&gt;With an &lt;span class=&quot;en&quot;&gt;indefinite useful life&lt;/span&gt; or &lt;span class=&quot;en&quot;&gt;not yet available for use&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;The test may be performed at any time during the year, provided it is at the same time every year. Different intangibles may have different dates.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Goodwill&lt;/h4&gt;&lt;p&gt;Goodwill acquired in a &lt;span class=&quot;en&quot;&gt;business combination&lt;/span&gt;, in accordance with §80-99.&lt;/p&gt;&lt;p&gt;If it was acquired in the current year, the CGU must be tested &lt;strong&gt;before the end&lt;/strong&gt; of that year (§96).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;beyond the slides&lt;/span&gt;The reason: these items are not amortised, or have not yet begun to be, so no periodic process reduces their value. They also involve the most uncertain estimates. The annual test compensates for the absence of amortisation.&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h4&gt;Self-check · Part B&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;Must a machine with no indication of a loss be tested?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Only the assessment of indications at each reporting date is required. The mandatory annual calculation applies to goodwill and to intangibles with an indefinite useful life or not yet available for use.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;The ECB raises interest rates. Is this automatically an impairment?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. It is an indication only if the increase is such as to affect the discount rate and &lt;strong&gt;materially&lt;/strong&gt; reduce the recoverable amount. Even then, it leads to an estimate, not to a certain loss.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;One brand with an indefinite useful life is tested every 30 June, another every 30 September. Is this permitted?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Yes. What matters is that each is tested every year at the same time (§10).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between a “plan for early disposal” and “held for sale”?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The former is an internal indication and remains within IAS 36. The latter, once the criteria are met, takes the asset out of scope and into IFRS 5.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ardesia&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;k&quot;&gt;Part C&lt;/span&gt;&lt;h2&gt;How to measure&lt;/h2&gt;&lt;p&gt;The technical core: the recoverable amount, the value in use cash flows, the discount rate and the techniques of Appendix A.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;s&quot; id=&quot;recoverable&quot;&gt;
&lt;h3&gt;6. Recoverable amount: shortcuts and level of the test&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 13-15 · §19-20, 22, 28&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;One amount is enough (§19)&lt;/h4&gt;&lt;p&gt;If FVLCD &lt;em&gt;or&lt;/em&gt; VIU exceeds the carrying amount, the asset is not impaired. The other amount need not be estimated.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;FVLCD not measurable (§20)&lt;/h4&gt;&lt;p&gt;If there is no basis for a reliable estimate of the price, VIU may be used as the recoverable amount.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;Individual asset or CGU? (§22)&lt;/h4&gt;
&lt;p&gt;The recoverable amount is determined for the &lt;strong&gt;individual asset&lt;/strong&gt;, unless the asset does not generate cash inflows that are &lt;span class=&quot;en&quot;&gt;largely independent&lt;/span&gt; of those from other assets. In that case the test moves to the CGU, unless:&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;
&lt;li&gt;the asset&#x27;s FVLCD is higher than its carrying amount; or&lt;/li&gt;
&lt;li&gt;VIU can be estimated to be close to FVLCD, and FVLCD can be measured.&lt;/li&gt;
&lt;/ol&gt;
&lt;p style=&quot;font-size:.88rem;color:var(--muted)&quot;&gt;On slide 14 both points are labelled “a)”: the second is b).&lt;/p&gt;
&lt;h4&gt;Costs of disposal (§28)&lt;/h4&gt;
&lt;p&gt;These are costs directly attributable to the sale: &lt;strong&gt;legal costs, stamp duty&lt;/strong&gt; and similar transaction taxes, &lt;strong&gt;costs of removing&lt;/strong&gt; the asset, and direct incremental costs of bringing it into condition for sale.&lt;/p&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;viu&quot;&gt;
&lt;h3&gt;7. Value in use: estimating the cash flows&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 16-32 · §31-54&lt;/p&gt;
&lt;p&gt;VIU requires two steps (§31): estimating the cash inflows and outflows from &lt;strong&gt;continuing use&lt;/strong&gt; and from &lt;strong&gt;ultimate disposal&lt;/strong&gt;, then applying the appropriate &lt;span class=&quot;en&quot;&gt;discount rate&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;VIU = Σ CF&lt;sub&gt;t&lt;/sub&gt; / (1 + r)&lt;sup&gt;t&lt;/sup&gt; + net disposal cash flow / (1 + r)&lt;sup&gt;n&lt;/sup&gt;&lt;/div&gt;
&lt;p&gt;However uncertainty about amount or timing is treated, the result must reflect the &lt;span class=&quot;en&quot;&gt;expected present value&lt;/span&gt;: the weighted average of all possible outcomes (§32, see &lt;a href=&quot;#appa&quot;&gt;Appendix A&lt;/a&gt;).&lt;/p&gt;
&lt;h4&gt;The horizon: budgets, then extrapolation (§33)&lt;/h4&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 124&quot; role=&quot;img&quot; aria-label=&quot;Timeline: up to five years of budgets approved by management, then extrapolation at a steady or declining growth rate until the end of the useful life&quot;&gt;
&lt;rect class=&quot;bc&quot; x=&quot;4&quot; y=&quot;26&quot; width=&quot;238&quot; height=&quot;44&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;123&quot; y=&quot;53&quot;&gt;Approved budgets&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;244&quot; y=&quot;26&quot; width=&quot;232&quot; height=&quot;44&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;360&quot; y=&quot;53&quot;&gt;Extrapolation&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;4&quot; y=&quot;17&quot;&gt;today&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;243&quot; y=&quot;17&quot;&gt;max 5 years*&lt;/text&gt;&lt;text class=&quot;ts end&quot; x=&quot;476&quot; y=&quot;17&quot;&gt;end of useful life&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;4&quot; y=&quot;92&quot;&gt;no future restructuring&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;4&quot; y=&quot;110&quot;&gt;and no enhancements&lt;/text&gt;
&lt;text class=&quot;ts&quot; x=&quot;250&quot; y=&quot;92&quot;&gt;steady or declining growth;&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;250&quot; y=&quot;110&quot;&gt;not above the long-term average*&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;* Unless a longer period, or an increasing or higher rate, can be justified. Slides 18-19.&lt;/figcaption&gt;&lt;/figure&gt;

&lt;div class=&quot;w&quot; id=&quot;viu-w&quot;&gt;&lt;h4&gt;Calculate the value in use&lt;/h4&gt;&lt;p class=&quot;hint&quot;&gt;Budget growth applies in the first 5 years, extrapolation growth thereafter. &lt;span class=&quot;tagi&quot;&gt;beyond the slides&lt;/span&gt; Figures of your choice. Try moving the rate to 11%: a loss appears.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Net cash flow, year 1 &lt;b data-v=&quot;cf&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;cf&quot; min=&quot;20&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;100&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Budget growth &lt;b data-v=&quot;gb&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;gb&quot; min=&quot;-5&quot; max=&quot;10&quot; step=&quot;0.5&quot; data-d=&quot;1&quot; data-u=&quot;%&quot; value=&quot;2&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Extrapolation growth &lt;b data-v=&quot;g&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;g&quot; min=&quot;-5&quot; max=&quot;5&quot; step=&quot;0.5&quot; data-d=&quot;1&quot; data-u=&quot;%&quot; value=&quot;0&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Pre-tax discount rate &lt;b data-v=&quot;r&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;r&quot; min=&quot;4&quot; max=&quot;18&quot; step=&quot;0.5&quot; data-d=&quot;1&quot; data-u=&quot;%&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Remaining useful life (years) &lt;b data-v=&quot;n&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;n&quot; min=&quot;5&quot; max=&quot;20&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Net cash flow from ultimate disposal &lt;b data-v=&quot;d&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;d&quot; min=&quot;0&quot; max=&quot;300&quot; step=&quot;10&quot; value=&quot;50&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Carrying amount &lt;b data-v=&quot;ca&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;ca&quot; min=&quot;100&quot; max=&quot;1500&quot; step=&quot;10&quot; value=&quot;650&quot;&gt;&lt;/label&gt;
&lt;svg role=&quot;img&quot; aria-label=&quot;Bar chart of the annual cash flows and their present value&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;res&quot;&gt;&lt;p&gt;VIU &lt;strong data-o=&quot;tot&quot;&gt;&lt;/strong&gt; (of which disposal &lt;strong data-o=&quot;pvd&quot;&gt;&lt;/strong&gt;)&lt;/p&gt;&lt;p data-o=&quot;m&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

&lt;h4&gt;What goes into the cash flows?&lt;/h4&gt;
&lt;p&gt;Decide for each item: is it in the VIU calculation or not? Then open the card.&lt;/p&gt;
&lt;div class=&quot;flips&quot;&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Cash inflows from continuing use&lt;/summary&gt;&lt;p&gt;&lt;b&gt;In · §39a&lt;/b&gt;The core of the estimate.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Necessary outflows, including those to prepare the asset for use&lt;/summary&gt;&lt;p&gt;&lt;b&gt;In · §39b&lt;/b&gt;If directly attributable or allocable on a reasonable and consistent basis.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Net disposal cash flow at the end of the useful life&lt;/summary&gt;&lt;p&gt;&lt;b&gt;In · §39c&lt;/b&gt;Consistent with the residual value used for depreciation (IAS 16).&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Routine maintenance and attributable overheads&lt;/summary&gt;&lt;p&gt;&lt;b&gt;In · §41&lt;/b&gt;&lt;span class=&quot;en&quot;&gt;Day-to-day servicing&lt;/span&gt; and overheads that are attributable or allocable.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Costs to complete a building under construction&lt;/summary&gt;&lt;p&gt;&lt;b&gt;In · §42&lt;/b&gt;The carrying amount does not yet include them, but the asset would not be ready without them.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;in&quot;&gt;&lt;summary&gt;Replacement of shorter-lived components in a CGU&lt;/summary&gt;&lt;p&gt;&lt;b&gt;In · §49&lt;/b&gt;If essential, it is part of the CGU&#x27;s day-to-day servicing.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Collection of trade receivables&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Out · §43a&lt;/b&gt;Largely independent cash flows: counting them would be double-counting.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Payment of payables, pensions and provisions already recognised&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Out · §43b&lt;/b&gt;They are already liabilities in the financial statements: same reason.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Savings from a restructuring not yet decided&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Out · §44&lt;/b&gt;The entity is not yet &lt;span class=&quot;en&quot;&gt;committed&lt;/span&gt;.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Benefits from an upgrade not yet undertaken&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Out · §44, 48&lt;/b&gt;Cash flows are estimated for the asset in its current condition.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Interest expense and loan repayments&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Out · §50-51&lt;/b&gt;The time value of money is already captured by discounting.&lt;/p&gt;&lt;/details&gt;
&lt;details class=&quot;out&quot;&gt;&lt;summary&gt;Income taxes&lt;/summary&gt;&lt;p&gt;&lt;b&gt;Out · §50-51&lt;/b&gt;The rate is pre-tax, so the cash flows are pre-tax as well.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;

&lt;h4&gt;The consistency rules&lt;/h4&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button type=&quot;button&quot;&gt;Inflation&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Restructuring&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Disposal&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Foreign currency&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 21 · §40&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;The discount rate…&lt;/th&gt;&lt;th&gt;The cash flows are…&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;includes general inflation&lt;/td&gt;&lt;td&gt;&lt;strong&gt;nominal&lt;/strong&gt;: they include inflation&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;excludes general inflation&lt;/td&gt;&lt;td&gt;&lt;strong&gt;real&lt;/strong&gt;: without general inflation, but with specific price changes&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;beyond the slides&lt;/span&gt;The error to avoid: real cash flows discounted at a nominal rate. The discounting is too heavy and VIU is understated.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slides 25-28 · §44, 47-49&lt;/p&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 148&quot; role=&quot;img&quot; aria-label=&quot;Before the commitment, restructuring cash flows are excluded; after the commitment, the benefits enter VIU and the outflows sit in the IAS 37 provision&quot;&gt;
&lt;rect class=&quot;bm&quot; x=&quot;4&quot; y=&quot;50&quot; width=&quot;472&quot; height=&quot;3&quot;/&gt;&lt;rect class=&quot;ba&quot; x=&quot;236&quot; y=&quot;36&quot; width=&quot;4&quot; height=&quot;30&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;238&quot; y=&quot;26&quot;&gt;commitment&lt;/text&gt;
&lt;text class=&quot;t tb&quot; x=&quot;4&quot; y=&quot;84&quot;&gt;Before&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;4&quot; y=&quot;104&quot;&gt;no benefits&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;4&quot; y=&quot;122&quot;&gt;and no outflows in VIU&lt;/text&gt;
&lt;text class=&quot;t tb&quot; x=&quot;252&quot; y=&quot;84&quot;&gt;After&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;252&quot; y=&quot;104&quot;&gt;savings and benefits: in VIU&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;252&quot; y=&quot;122&quot;&gt;outflows: IAS 37 provision&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;The same principle applies to enhancements: until the entity incurs the outflow that enhances the asset, the expected benefits remain excluded (§48).&lt;/p&gt;
&lt;div class=&quot;note x&quot;&gt;&lt;span class=&quot;tagx lab&quot;&gt;external source&lt;/span&gt;IAS 37 limits the restructuring provision to the necessary direct costs that are not associated with ongoing activities. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-37-provisions-contingent-liabilities-and-contingent-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, IAS 37&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 31 · §53&lt;/p&gt;&lt;p&gt;The disposal cash flow at the end of the useful life is estimated like an FVLCD, with two differences:&lt;/p&gt;&lt;ol type=&quot;a&quot;&gt;&lt;li&gt;prices at the estimation date are used for &lt;strong&gt;similar assets already at the end of their useful life&lt;/strong&gt;, used under similar conditions;&lt;/li&gt;&lt;li&gt;those prices are adjusted for general inflation and for specific changes. If cash flows and rate exclude inflation, it is excluded here as well.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 32 · §54&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;foreign-currency cash flows → rate for that currency → present value → spot rate at the calculation date&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;beyond the slides&lt;/span&gt;Example: PV of USD 1,000 discounted at a dollar rate; at a spot rate of 0.90 EUR/USD, VIU is EUR 900. The result is translated, not each individual cash flow at estimated future exchange rates.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;rate&quot;&gt;
&lt;h3&gt;8. Discount rate: one rate, no double-counting&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 33-35, 100-103 · §55-57, A15-A21&lt;/p&gt;
&lt;p&gt;The rate must be &lt;strong&gt;pre-tax&lt;/strong&gt; and reflect current market assessments of two elements (§55): the &lt;span class=&quot;en&quot;&gt;time value of money&lt;/span&gt; and the risks specific to the asset &lt;strong&gt;not already reflected in the cash flows&lt;/strong&gt;.&lt;/p&gt;
&lt;p&gt;It is derived from rates implicit in current market transactions for similar assets, or from the &lt;span class=&quot;en&quot;&gt;weighted average cost of capital&lt;/span&gt; (WACC) of a listed entity with assets similar in service potential and risks (§56). If no asset-specific rate is available, &lt;span class=&quot;en&quot;&gt;surrogates&lt;/span&gt; are used instead (§57, A16-A18).&lt;/p&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 240&quot; role=&quot;img&quot; aria-label=&quot;From the starting rates to the adjustment for market risks, up to the final rate&quot;&gt;
&lt;text class=&quot;ts&quot; x=&quot;4&quot; y=&quot;14&quot;&gt;Starting points (A17)&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;4&quot; y=&quot;22&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;79&quot; y=&quot;46&quot;&gt;Entity&#x27;s WACC&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;79&quot; y=&quot;66&quot;&gt;e.g. using CAPM&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;165&quot; y=&quot;22&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;46&quot;&gt;Incremental&lt;/text&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;66&quot;&gt;borrowing rate&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;326&quot; y=&quot;22&quot; width=&quot;150&quot; height=&quot;56&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;401&quot; y=&quot;46&quot;&gt;Other market&lt;/text&gt;&lt;text class=&quot;t mid&quot; x=&quot;401&quot; y=&quot;66&quot;&gt;borrowing rates&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M79 78C79 96 170 88 200 102&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M240 78V102&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M401 78C401 96 310 88 280 102&quot;/&gt;
&lt;rect class=&quot;bc&quot; x=&quot;40&quot; y=&quot;102&quot; width=&quot;400&quot; height=&quot;66&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;240&quot; y=&quot;124&quot;&gt;Adjustments (A18)&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;240&quot; y=&quot;143&quot;&gt;+ risks as the market would assess them&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;240&quot; y=&quot;160&quot;&gt;− risks that are irrelevant or already in the cash flows&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M240 168V188&quot;/&gt;
&lt;rect class=&quot;ba&quot; x=&quot;90&quot; y=&quot;188&quot; width=&quot;300&quot; height=&quot;46&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid tp&quot; x=&quot;240&quot; y=&quot;216&quot;&gt;Discount rate for VIU&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button type=&quot;button&quot;&gt;Double-counting&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Capital structure&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;One or more rates&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;WACC and CAPM&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slides 34, 100 · §56, A15&lt;/p&gt;&lt;p&gt;A risk must be reflected &lt;strong&gt;either&lt;/strong&gt; in the cash flows &lt;strong&gt;or&lt;/strong&gt; in the rate. If the cash flows have already been reduced for a risk and the rate also incorporates it, the same risk counts twice and VIU is too low.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 103 · A19&lt;/p&gt;&lt;p&gt;The rate is &lt;strong&gt;independent of the entity&#x27;s capital structure&lt;/strong&gt; and of how it financed the purchase: the cash flows expected from the asset do not depend on how it was paid for.&lt;/p&gt;&lt;p&gt;For the same reason, interest does not enter the cash flows (§50).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slides 94, 103 · A21&lt;/p&gt;&lt;p&gt;Normally there is a single rate. Separate rates are used for different periods if VIU is sensitive to a difference in risk between periods or to the &lt;span class=&quot;en&quot;&gt;term structure&lt;/span&gt; of interest rates. The example in &lt;a href=&quot;#appa&quot;&gt;Appendix A&lt;/a&gt; uses 5%, 5.25% and 5.50% over 1, 2 and 3 years.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;beyond the slides&lt;/span&gt;&lt;p&gt;The slides mention the Capital Asset Pricing Model (CAPM) without formulas. In brief:&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;r&lt;sub&gt;e&lt;/sub&gt; = r&lt;sub&gt;f&lt;/sub&gt; + β (r&lt;sub&gt;m&lt;/sub&gt; − r&lt;sub&gt;f&lt;/sub&gt;)&lt;br&gt;WACC = E/V · r&lt;sub&gt;e&lt;/sub&gt; + D/V · r&lt;sub&gt;d&lt;/sub&gt; (1 − t)&lt;/div&gt;
&lt;p&gt;r&lt;sub&gt;f&lt;/sub&gt; is the risk-free rate, β the sensitivity to the market, r&lt;sub&gt;m&lt;/sub&gt; − r&lt;sub&gt;f&lt;/sub&gt; the market risk premium. The WACC as written here is &lt;strong&gt;post-tax&lt;/strong&gt;, whereas IAS 36 requires a pre-tax rate: dividing it by (1 − t) is usually not enough, because the timing of taxes also matters. The rules on the pre-tax basis are among the very points under discussion in the &lt;a href=&quot;#progetto&quot;&gt;IASB project&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;beyond the slides&lt;/span&gt;Slide 100 refers to factors (b), (d) and (e) of §A1 without stating them. They are: expectations about variations in the amount or timing of the cash flows, the price for bearing the uncertainty inherent in the asset, and other factors such as illiquidity. You can check them in the &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias36.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;text of IAS 36&lt;/a&gt;. Slide 102 adds that country risk, currency risk and price risk must be considered (A18).&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;appa&quot;&gt;
&lt;h3&gt;9. Appendix A: traditional vs expected cash flow&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 87-103 · A1-A21&lt;/p&gt;
&lt;p&gt;Appendix A is an integral part of the standard and also applies to CGUs. General principle (A3): cash flows or rates must reflect the &lt;strong&gt;range of possible outcomes&lt;/strong&gt;, not a single most likely, minimum or maximum amount.&lt;/p&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button type=&quot;button&quot;&gt;Traditional&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Expected&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Uncertain timing&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Limited data&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;The debate&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slides 90-91 · A4, A6&lt;/p&gt;&lt;p&gt;A &lt;strong&gt;single set of cash flows&lt;/strong&gt; and a single rate, “the rate commensurate with the risk”. The rate alone must incorporate expectations and the risk premium, so all the attention falls on choosing it.&lt;/p&gt;&lt;p&gt;Finding it requires at least two elements: an asset on the market with an observed rate, and the asset to be measured. Steps:&lt;/p&gt;&lt;ol type=&quot;a&quot;&gt;&lt;li&gt;identify the cash flows to be discounted;&lt;/li&gt;&lt;li&gt;find an asset on the market with similar cash flows;&lt;/li&gt;&lt;li&gt;compare the two sets (contractual or estimated?);&lt;/li&gt;&lt;li&gt;look for elements present in only one of them (is one less liquid?);&lt;/li&gt;&lt;li&gt;assess whether the two sets vary similarly as economic conditions change.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 92 · A7&lt;/p&gt;&lt;p&gt;It uses &lt;strong&gt;all&lt;/strong&gt; expectations about the possible cash flows, not just the most likely one.&lt;/p&gt;
&lt;div class=&quot;w&quot; id=&quot;exp-w&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;h4&gt;Move the probabilities&lt;/h4&gt;&lt;p class=&quot;hint&quot;&gt;Initial values from the slide: 10%, 60%, 30%, with an expected value of CU220.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Probability of CU100 &lt;b data-v=&quot;p1&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;p1&quot; min=&quot;0&quot; max=&quot;100&quot; data-u=&quot;%&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Probability of CU200 &lt;b data-v=&quot;p2&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;p2&quot; min=&quot;0&quot; max=&quot;100&quot; data-u=&quot;%&quot; value=&quot;60&quot;&gt;&lt;/label&gt;
&lt;svg role=&quot;img&quot; aria-label=&quot;Distribution of the three outcomes with a line marking the expected value&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;res&quot;&gt;&lt;p&gt;Probability of CU300 &lt;strong data-o=&quot;p3&quot;&gt;&lt;/strong&gt; · Expected cash flow &lt;strong data-o=&quot;e&quot;&gt;&lt;/strong&gt; · Most likely &lt;strong data-o=&quot;ml&quot;&gt;&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slides 93-95 · A8-A9&lt;/p&gt;&lt;p&gt;The approach also works when it is uncertain &lt;strong&gt;when&lt;/strong&gt; the cash flow will arrive: CU1,000 in 1, 2 or 3 years with probabilities of 10%, 60%, 30%.&lt;/p&gt;
&lt;div class=&quot;stepper&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;In 1 year at 5%&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;1,000 / 1.05 = 952.38 → × 10% = &lt;strong&gt;95.24&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;In 2 years at 5.25%&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;1,000 / 1.0525² = 902.73 → × 60% = &lt;strong&gt;541.64&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;In 3 years at 5.50%&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;1,000 / 1.055³ = 851.61 → × 30% = &lt;strong&gt;255.48&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;h4 style=&quot;margin-top:0&quot;&gt;Expected present value&lt;/h4&gt;&lt;div class=&quot;formula&quot;&gt;95.24 + 541.64 + 255.48 = &lt;strong&gt;CU892.36&lt;/strong&gt;&lt;/div&gt;&lt;p&gt;The traditional best estimate would be CU902.73 (the 60% scenario). The traditional method must choose a single maturity, and a rate cannot reflect uncertainty about timing.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slides 96-97 · A11-A12&lt;/p&gt;&lt;p&gt;An expected value can be estimated even with limited information, starting from a range between CU50 and CU250:&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;What is known&lt;/th&gt;&lt;th&gt;Calculation&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Expected&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;No amount is more likely than another&lt;/td&gt;&lt;td&gt;(50 + 250) / 2&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;150&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;CU100 most likely, probabilities unknown&lt;/td&gt;&lt;td&gt;(50 + 100 + 250) / 3&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;133.33&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;50 at 10%, 250 at 30%, 100 at 60%&lt;/td&gt;&lt;td&gt;5 + 75 + 60&lt;/td&gt;&lt;td class=&quot;n&quot;&gt;140&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;Cost-benefit constraint&lt;/strong&gt; (A12): the entity balances the cost of obtaining further information against the reliability that it adds to the measurement.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slides 98-99 · A13-A14&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;The criticism&lt;/h4&gt;&lt;p&gt;With a 90% chance of CU10 and a 10% chance of CU1,000, the expected value is &lt;strong&gt;CU109&lt;/strong&gt;, an amount that will never occur. The technique would be unsuitable for a single item with few outcomes.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;The response&lt;/h4&gt;&lt;p&gt;CU10 presents an uncertain cash flow as if it were certain. &lt;strong&gt;No rational entity&lt;/strong&gt; would sell an asset with these characteristics for CU10.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h4&gt;Self-check · Part C&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;FVLCD 120, carrying amount 100, VIU unknown. Must you estimate VIU?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. FVLCD already exceeds the carrying amount, so the asset is not impaired (§19).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;The budget includes savings from a restructuring that the board is considering but has not decided on. Do they go into VIU?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Without a commitment they are excluded (§44). After the commitment the benefits enter, while the outflows sit in the IAS 37 provision (§47).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why does interest expense not enter the cash flows, even if the asset was purchased with debt?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Because the time value of money is already captured by discounting (§51) and the rate is independent of how the asset was financed (A19).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;The cash flows have already been reduced for country risk. Can the rate include the same risk?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: that would be double-counting (§56, A15, A18b).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Calculate the expected value: CU200 at 25%, CU400 at 75%.&lt;/summary&gt;&lt;div&gt;&lt;p&gt;50 + 300 = &lt;strong&gt;CU350&lt;/strong&gt;. The most likely scenario would be 400.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;mattone&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;k&quot;&gt;Part D&lt;/span&gt;&lt;h2&gt;Loss, CGUs and goodwill&lt;/h2&gt;&lt;p&gt;How the loss is recognised, at what level the test is performed, who absorbs the loss and when it can be reversed.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;s&quot; id=&quot;loss&quot;&gt;
&lt;h3&gt;10. Impairment loss: where it goes in the financial statements&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 36-39 · §60-64&lt;/p&gt;
&lt;p&gt;The loss is recognised &lt;strong&gt;immediately&lt;/strong&gt;. Where it goes depends on how the asset is measured: &lt;span class=&quot;en&quot;&gt;profit or loss&lt;/span&gt; (P&amp;amp;L) or &lt;span class=&quot;en&quot;&gt;other comprehensive income&lt;/span&gt; (OCI).&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Asset not revalued&lt;/h4&gt;&lt;p&gt;The entire loss goes to &lt;strong&gt;profit or loss&lt;/strong&gt; (§60).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Revalued asset&lt;/h4&gt;&lt;p&gt;In &lt;strong&gt;OCI&lt;/strong&gt; up to the &lt;span class=&quot;en&quot;&gt;revaluation surplus&lt;/span&gt; of that same asset, treated as a &lt;span class=&quot;en&quot;&gt;revaluation decrease&lt;/span&gt; (§60-61). &lt;span class=&quot;tagi&quot;&gt;beyond the slides&lt;/span&gt; Any excess goes to P&amp;amp;L, in accordance with IAS 16.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;w&quot; id=&quot;reval-w&quot;&gt;&lt;h4&gt;Split the loss on a revalued asset&lt;/h4&gt;&lt;p class=&quot;hint&quot;&gt;Amounts of your choice. Try a loss smaller than the surplus.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Revaluation surplus &lt;b data-v=&quot;s&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;s&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;30&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Impairment loss &lt;b data-v=&quot;l&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;l&quot; min=&quot;0&quot; max=&quot;150&quot; step=&quot;5&quot; value=&quot;50&quot;&gt;&lt;/label&gt;
&lt;svg role=&quot;img&quot; aria-label=&quot;Bars showing the surplus, the portion in OCI and the portion in profit or loss&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;res&quot;&gt;&lt;p&gt;OCI &lt;strong data-o=&quot;o&quot;&gt;&lt;/strong&gt; · P&amp;amp;L &lt;strong data-o=&quot;p&quot;&gt;&lt;/strong&gt; · Remaining surplus &lt;strong data-o=&quot;r&quot;&gt;&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;h4&gt;Three consequences&lt;/h4&gt;
&lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;The loss exceeds the carrying amount (§62)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;A &lt;span class=&quot;en&quot;&gt;liability&lt;/span&gt; is recognised if, and only if, another standard requires it. The asset normally stops at zero.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Depreciation must be recalculated (§63)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In future periods the new carrying amount, less any &lt;span class=&quot;en&quot;&gt;residual value&lt;/span&gt;, is allocated over the remaining useful life.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tagi&quot;&gt;beyond the slides&lt;/span&gt; Carrying amount 700 with 7 years remaining and depreciation of 100; after a write-down to 420, depreciation falls to 60.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Deferred taxes change (§64)&lt;/summary&gt;&lt;div&gt;&lt;p&gt;They are redetermined under IAS 12, by comparing the new carrying amount with the &lt;span class=&quot;en&quot;&gt;tax base&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;&lt;span class=&quot;tagi&quot;&gt;beyond the slides&lt;/span&gt; Carrying amount 100 reduced to 70, tax base 100, tax rate 25%: deductible temporary difference 30, deferred tax asset 7.5 if recoverable.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;cgu&quot;&gt;
&lt;h3&gt;11. CGU: when the asset does not stand alone&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 40-51 · §65-79&lt;/p&gt;
&lt;p&gt;If the recoverable amount of the individual asset cannot be estimated, the recoverable amount of the CGU to which it belongs is determined (§66). Identifying the CGU requires &lt;strong&gt;judgement&lt;/strong&gt;: it is the &lt;strong&gt;smallest group&lt;/strong&gt; of assets that generates largely independent cash inflows (§68).&lt;/p&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button type=&quot;button&quot;&gt;The mine&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;The buses&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Other criteria&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 41&lt;/p&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 142&quot; role=&quot;img&quot; aria-label=&quot;The private railway is inside the mine CGU and has no cash flows of its own&quot;&gt;
&lt;rect class=&quot;bc&quot; x=&quot;4&quot; y=&quot;4&quot; width=&quot;472&quot; height=&quot;134&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;18&quot; y=&quot;28&quot;&gt;CGU = the entire mine&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;18&quot; y=&quot;42&quot; width=&quot;136&quot; height=&quot;80&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;86&quot; y=&quot;88&quot;&gt;Mineral deposit&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;172&quot; y=&quot;42&quot; width=&quot;136&quot; height=&quot;80&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;88&quot;&gt;Plant&lt;/text&gt;
&lt;rect class=&quot;ba&quot; x=&quot;326&quot; y=&quot;42&quot; width=&quot;136&quot; height=&quot;80&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tb mid tp&quot; x=&quot;394&quot; y=&quot;78&quot;&gt;Railway&lt;/text&gt;&lt;text class=&quot;ts mid tp&quot; x=&quot;394&quot; y=&quot;100&quot;&gt;scrap value only&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;The private railway serves only the mine and could be sold only for its &lt;span class=&quot;en&quot;&gt;scrap value&lt;/span&gt;. Its VIU cannot be determined and probably differs from its scrap value, so the recoverable amount of the &lt;strong&gt;entire mine&lt;/strong&gt; is estimated.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 43&lt;/p&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 106&quot; role=&quot;img&quot; aria-label=&quot;Five bus routes combined in a single CGU; one route is loss-making&quot;&gt;
&lt;rect class=&quot;bc&quot; x=&quot;4&quot; y=&quot;4&quot; width=&quot;472&quot; height=&quot;98&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;18&quot; y=&quot;27&quot;&gt;CGU = the entire bus company&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;18&quot; y=&quot;40&quot; width=&quot;80&quot; height=&quot;48&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;58&quot; y=&quot;69&quot;&gt;Route 1&lt;/text&gt;&lt;rect class=&quot;bx&quot; x=&quot;107&quot; y=&quot;40&quot; width=&quot;80&quot; height=&quot;48&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;147&quot; y=&quot;69&quot;&gt;Route 2&lt;/text&gt;&lt;rect class=&quot;bx&quot; x=&quot;196&quot; y=&quot;40&quot; width=&quot;80&quot; height=&quot;48&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;236&quot; y=&quot;69&quot;&gt;Route 3&lt;/text&gt;&lt;rect class=&quot;bx&quot; x=&quot;285&quot; y=&quot;40&quot; width=&quot;80&quot; height=&quot;48&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;325&quot; y=&quot;69&quot;&gt;Route 4&lt;/text&gt;&lt;rect class=&quot;ba&quot; x=&quot;374&quot; y=&quot;40&quot; width=&quot;88&quot; height=&quot;48&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;t tb mid tp&quot; x=&quot;418&quot; y=&quot;69&quot;&gt;At a loss&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;The assets and cash flows of each route are identifiable, but the contract with the municipality requires a minimum service on all five. The company cannot cut any one of them, so the CGU is &lt;strong&gt;the entire company&lt;/strong&gt;. The loss-making route is offset by the others.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;How management decides&lt;/strong&gt; (§69): how it monitors operations (product lines, businesses, locations, areas) and how it decides whether to continue or dispose of them.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Transfer pricing&lt;/strong&gt; (§70): if cash flows depend on internal group prices, the best estimate of prices &lt;span class=&quot;en&quot;&gt;at arm&#x27;s length&lt;/span&gt; is used, both for cash inflows and for the outflows of the other CGUs involved.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Active market&lt;/strong&gt; (§71): if the output, even if used internally, &lt;em&gt;could&lt;/em&gt; be sold on an active market, that asset forms a separate CGU.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Consistency&lt;/strong&gt; (§72-73): the same CGUs from period to period, unless a change is justified and explained in the disclosure (§130).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;The carrying amount of the CGU: comparing like with like&lt;/h4&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 48-51 · §76-79&lt;/p&gt;
&lt;p&gt;The carrying amount includes only assets that are attributable or allocable on a reasonable and consistent basis and that generate the cash flows used in VIU. &lt;strong&gt;It does not include recognised liabilities&lt;/strong&gt;, unless the recoverable amount cannot be determined without them. If an asset is left out, the CGU may appear recoverable when it is not (§77).&lt;/p&gt;
&lt;div class=&quot;stepper&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;strong&gt;The case (§78).&lt;/strong&gt; A buyer of the CGU must also assume a liability. The liability is then deducted &lt;strong&gt;both&lt;/strong&gt; from VIU &lt;strong&gt;and&lt;/strong&gt; from the carrying amount. &lt;span class=&quot;tagi&quot;&gt;beyond the slides&lt;/span&gt; Numerical example: a mine with a restoration provision of 500.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;p&gt;&lt;strong&gt;Data.&lt;/strong&gt; Carrying amount of assets 1,000 · VIU before restoration 1,200 · FVLCD 800, already net of the restoration borne by the buyer.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;formula&quot;&gt;VIU = 1,200 − 500 = 700&lt;br&gt;Carrying amount = 1,000 − 500 = 500&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;formula&quot;&gt;Recoverable amount = max(800; 700) = 800 &amp;gt; 500&lt;/div&gt;&lt;p&gt;No loss. Without deducting the provision, 1,000 would have been compared with an FVLCD that is already net: a distorted comparison.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;For practical reasons, the recoverable amount may also take into account assets outside the CGU, such as receivables, or recognised liabilities, such as payables and pensions. In that case the carrying amount &lt;strong&gt;increases&lt;/strong&gt; for those assets and &lt;strong&gt;decreases&lt;/strong&gt; for those liabilities (§79).&lt;/p&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;goodwill&quot;&gt;
&lt;h3&gt;12. Goodwill: allocate, test, simplify&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 52-59, 107-108 · §80-81, 96-99&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;en&quot;&gt;Goodwill&lt;/span&gt; does not generate cash flows on its own: it contributes together with other assets. From the acquisition date it must be allocated to the CGUs, or groups of CGUs, that are expected to &lt;strong&gt;benefit from the synergies&lt;/strong&gt;, even if no other assets of the acquiree are assigned to them (§80).&lt;/p&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 196&quot; role=&quot;img&quot; aria-label=&quot;Levels from the entity down to the individual CGU: the unit with goodwill sits at the lowest level of monitoring and not above the operating segment&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;4&quot; y=&quot;4&quot; width=&quot;472&quot; height=&quot;40&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;29&quot;&gt;Entity&lt;/text&gt;
&lt;rect class=&quot;bm&quot; x=&quot;34&quot; y=&quot;52&quot; width=&quot;412&quot; height=&quot;40&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;240&quot; y=&quot;77&quot;&gt;Operating segment (IFRS 8): the upper limit&lt;/text&gt;
&lt;rect class=&quot;bc&quot; x=&quot;64&quot; y=&quot;100&quot; width=&quot;352&quot; height=&quot;40&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;240&quot; y=&quot;125&quot;&gt;Goodwill monitoring level&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;94&quot; y=&quot;148&quot; width=&quot;292&quot; height=&quot;40&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;173&quot;&gt;Single CGU, if allocation is not arbitrary&lt;/text&gt;
&lt;/svg&gt;&lt;figcaption&gt;Before the aggregation of segments. If allocation to individual CGUs would be arbitrary, the test stops at the group (§81).&lt;/figcaption&gt;&lt;/figure&gt;
&lt;ul&gt;&lt;li&gt;The unit must be the &lt;strong&gt;lowest level&lt;/strong&gt; at which goodwill is monitored for internal management purposes.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;No larger than an operating segment&lt;/strong&gt;, as defined by §5 of IFRS 8, before aggregation.&lt;/li&gt;&lt;/ul&gt;
&lt;div class=&quot;note x&quot;&gt;&lt;span class=&quot;tagx lab&quot;&gt;external source&lt;/span&gt;An operating segment engages in activities that earn revenues and incur expenses, has its results regularly reviewed by the chief operating decision maker and has discrete financial information available. &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs8.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 8, 2026 text&lt;/a&gt;&lt;/div&gt;
&lt;h4&gt;Disposals and reorganisations: the relative value approach&lt;/h4&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 55-56&lt;/p&gt;
&lt;p&gt;If goodwill cannot be associated on a non-arbitrary basis with a lower level, the ratio of relative values is used.&lt;/p&gt;
&lt;div class=&quot;w&quot; id=&quot;gw-w&quot;&gt;&lt;h4&gt;How much goodwill leaves with the disposal?&lt;/h4&gt;&lt;p class=&quot;hint&quot;&gt;Initial values from slide 55: 100 and 300, hence 25%. &lt;span class=&quot;tagi&quot;&gt;beyond the slides&lt;/span&gt; The goodwill amount is of your choice.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Price of the operation disposed of &lt;b data-v=&quot;sold&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;sold&quot; min=&quot;10&quot; max=&quot;500&quot; step=&quot;10&quot; value=&quot;100&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Recoverable amount of the portion retained &lt;b data-v=&quot;ret&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;ret&quot; min=&quot;10&quot; max=&quot;900&quot; step=&quot;10&quot; value=&quot;300&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Goodwill allocated to the CGU &lt;b data-v=&quot;gw&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;gw&quot; min=&quot;0&quot; max=&quot;200&quot; step=&quot;10&quot; value=&quot;80&quot;&gt;&lt;/label&gt;
&lt;svg role=&quot;img&quot; aria-label=&quot;Bar showing the share of goodwill disposed of and the share retained&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;res&quot;&gt;&lt;p&gt;Share disposed of &lt;strong data-o=&quot;q&quot;&gt;&lt;/strong&gt; of a total of &lt;strong data-o=&quot;tot&quot;&gt;&lt;/strong&gt; · Goodwill in the carrying amount disposed of &lt;strong data-o=&quot;g&quot;&gt;&lt;/strong&gt; · Goodwill remaining &lt;strong data-o=&quot;k&quot;&gt;&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;Reorganisation&lt;/strong&gt; (slide 56): CGU A is split and integrated into B, C and D. Its goodwill is reallocated on the basis of the relative values of the three portions of A, measured &lt;strong&gt;before&lt;/strong&gt; integration.&lt;/p&gt;
&lt;h4&gt;Timing and order of the tests&lt;/h4&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Timing (§96)&lt;/h4&gt;&lt;p&gt;At any time during the year, provided it is always the same time. Different CGUs may have different dates. Goodwill acquired during the year: test before the end of the year.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Order (§98)&lt;/h4&gt;&lt;p&gt;If there is an indication concerning an individual asset within the CGU, &lt;strong&gt;the asset is tested first&lt;/strong&gt; and the loss recognised; the CGU with the goodwill is tested afterwards.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;Simplification: reusing the previous calculation (§99)&lt;/h4&gt;
&lt;p class=&quot;pg&quot;&gt;Slide 59&lt;/p&gt;
&lt;p&gt;The most recent detailed calculation may be reused if &lt;strong&gt;all&lt;/strong&gt; of these conditions are met:&lt;/p&gt;
&lt;ol&gt;&lt;li&gt;the assets and liabilities of the CGU have not changed significantly;&lt;/li&gt;&lt;li&gt;the most recent calculation exceeded the carrying amount by a &lt;strong&gt;substantial margin&lt;/strong&gt;;&lt;/li&gt;&lt;li&gt;based on an analysis of events and circumstances, the likelihood that the recoverable amount is now lower is &lt;strong&gt;remote&lt;/strong&gt;.&lt;/li&gt;&lt;/ol&gt;
&lt;h4&gt;What the test actually demonstrates&lt;/h4&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 107-108 · In brief, January 2023&lt;/p&gt;
&lt;p&gt;The test &lt;strong&gt;does not measure goodwill directly&lt;/strong&gt;, consistently with the idea that goodwill is a residual. Nor can it reflect the consumption of goodwill for those who regard it as a &lt;span class=&quot;en&quot;&gt;wasting asset&lt;/span&gt;. It does, however, ensure that goodwill and the other assets of the CGU are recoverable &lt;strong&gt;from the cash flows they generate together&lt;/strong&gt;.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;beyond the slides&lt;/span&gt;Hence the so-called &lt;span class=&quot;en&quot;&gt;shielding&lt;/span&gt; effect: the headroom from internally generated assets and goodwill, which are not recognised in the financial statements, can cover the decline in value of acquired goodwill. The loss therefore emerges late: this is one of the criticisms that prompted the IASB project.&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;corporate&quot;&gt;
&lt;h3&gt;13. Corporate assets: head office has no cash flows of its own&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 60-62 · §100-102&lt;/p&gt;
&lt;p&gt;These are group or divisional assets: the headquarters building, EDP (&lt;span class=&quot;en&quot;&gt;electronic data processing&lt;/span&gt;) equipment, a research centre. They have two distinctive features: they do not generate independent cash flows, and their carrying amount is not fully attributable to the CGU under review.&lt;/p&gt;
&lt;p&gt;The recoverable amount of an individual corporate asset cannot be determined, unless a decision has been made to dispose of it. If there is an indication, attention therefore turns to the CGU or group of CGUs to which it belongs (§101).&lt;/p&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 176&quot; role=&quot;img&quot; aria-label=&quot;Head office is allocated across CGUs A, B and C, and each is compared with its own recoverable amount&quot;&gt;
&lt;rect class=&quot;ba&quot; x=&quot;140&quot; y=&quot;4&quot; width=&quot;200&quot; height=&quot;42&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid tp&quot; x=&quot;240&quot; y=&quot;30&quot;&gt;HQ (corporate asset)&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M190 46C190 66 76 56 76 76&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M240 46V76&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M290 46C290 66 404 56 404 76&quot;/&gt;
&lt;rect class=&quot;bc&quot; x=&quot;6&quot; y=&quot;76&quot; width=&quot;140&quot; height=&quot;58&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;76&quot; y=&quot;100&quot;&gt;CGU A&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;76&quot; y=&quot;120&quot;&gt;+ HQ share&lt;/text&gt;
&lt;rect class=&quot;bc&quot; x=&quot;170&quot; y=&quot;76&quot; width=&quot;140&quot; height=&quot;58&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;240&quot; y=&quot;100&quot;&gt;CGU B&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;240&quot; y=&quot;120&quot;&gt;+ HQ share&lt;/text&gt;
&lt;rect class=&quot;bc&quot; x=&quot;334&quot; y=&quot;76&quot; width=&quot;140&quot; height=&quot;58&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;404&quot; y=&quot;100&quot;&gt;CGU C&lt;/text&gt;&lt;text class=&quot;ts mid&quot; x=&quot;404&quot; y=&quot;120&quot;&gt;+ HQ share&lt;/text&gt;
&lt;text class=&quot;ts mid&quot; x=&quot;240&quot; y=&quot;160&quot;&gt;each compared with its own recoverable amount&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;If a share can be allocated on a reasonable and consistent basis, the carrying amount of the CGU &lt;strong&gt;including that share&lt;/strong&gt; is compared with its recoverable amount (§102).&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;beyond the slides&lt;/span&gt;The slide covers only this branch. If the share cannot be allocated, §102(b) provides for two steps: the CGU is tested without the corporate asset; then the smallest group of CGUs to which the share can be allocated is identified, and that group is tested with the share. Check the &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias36.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;text of IAS 36&lt;/a&gt;.&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;allocation&quot;&gt;
&lt;h3&gt;14. Allocation: who absorbs the CGU&#x27;s loss&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 63-65 · §104-108&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;1st goodwill → 2nd other assets, pro rata on carrying amounts&lt;/div&gt;
&lt;p&gt;An individual asset, however, does not fall below the &lt;strong&gt;highest&lt;/strong&gt; of FVLCD (if measurable), VIU (if determinable) and zero (§105). If the recoverable amount of individual assets cannot be estimated, the allocation is necessarily arbitrary, because they work together (§106). If a loss remains, a liability is recognised only if another standard requires it (§108).&lt;/p&gt;
&lt;div class=&quot;w&quot; id=&quot;alloc-w&quot;&gt;&lt;h4&gt;Slide the recoverable amount&lt;/h4&gt;&lt;p class=&quot;hint&quot;&gt;CGU carrying amount 1,000. &lt;span class=&quot;tagi&quot;&gt;beyond the slides&lt;/span&gt; Invented numerical example: try 900, then 700, then 300.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Recoverable amount of the CGU &lt;b data-v=&quot;ra&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;ra&quot; min=&quot;300&quot; max=&quot;1100&quot; step=&quot;10&quot; value=&quot;700&quot;&gt;&lt;/label&gt;
&lt;svg role=&quot;img&quot; aria-label=&quot;Composition of the CGU before and after the allocation of the loss&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Asset&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Before&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Floor&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;Loss&lt;/th&gt;&lt;th class=&quot;n&quot;&gt;After&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;res&quot;&gt;&lt;p&gt;Total impairment loss &lt;strong data-o=&quot;l&quot;&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p data-o=&quot;m&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;beyond the slides&lt;/span&gt;The reallocation of the excess to the other assets is in §105, but does not appear on slide 64.&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;reversal&quot;&gt;
&lt;h3&gt;15. Reversal: going back, but not all the way&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 66-70 · §110-125&lt;/p&gt;
&lt;p&gt;At each reporting date the entity assesses whether there are indications that a past loss, &lt;strong&gt;on assets other than goodwill&lt;/strong&gt;, no longer exists or has decreased. If there are, it estimates the recoverable amount again (§110).&lt;/p&gt;
&lt;div class=&quot;w&quot; id=&quot;rev-w&quot;&gt;&lt;h4&gt;The reversal ceiling&lt;/h4&gt;&lt;p class=&quot;hint&quot;&gt;&lt;span class=&quot;tagi&quot;&gt;beyond the slides&lt;/span&gt; Cost 1,000, useful life 10 years, residual value zero. Loss at the end of year 3: from 700 to 420. At the end of year 6 the carrying amount is 240; without impairment it would have been 400.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;&lt;span&gt;Recoverable amount at the end of year 6 &lt;b data-v=&quot;ra&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;input type=&quot;range&quot; data-k=&quot;ra&quot; min=&quot;240&quot; max=&quot;600&quot; step=&quot;10&quot; value=&quot;480&quot;&gt;&lt;/label&gt;
&lt;svg role=&quot;img&quot; aria-label=&quot;Chart of the carrying amount over time with the loss, the reversal and the ceiling&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;res&quot;&gt;&lt;p&gt;New carrying amount &lt;strong data-o=&quot;n&quot;&gt;&lt;/strong&gt; · Reversal &lt;strong data-o=&quot;rv&quot;&gt;&lt;/strong&gt; · New annual depreciation &lt;strong data-o=&quot;d&quot;&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p data-o=&quot;m&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Individual asset&lt;/th&gt;&lt;th&gt;CGU&lt;/th&gt;&lt;th&gt;Goodwill&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;th&gt;Can it be reversed?&lt;/th&gt;&lt;td&gt;Yes&lt;/td&gt;&lt;td&gt;Yes, except for goodwill&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Never&lt;/strong&gt; (§124)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;How&lt;/th&gt;&lt;td&gt;Up to the carrying amount that would have existed without the loss (§117)&lt;/td&gt;&lt;td&gt;Pro rata across the assets (§122)&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Ceiling&lt;/th&gt;&lt;td&gt;Hypothetical carrying amount, net of depreciation&lt;/td&gt;&lt;td&gt;The lower of recoverable amount (if determinable) and hypothetical carrying amount. The excess passes pro rata to the other assets, excluding goodwill (§123)&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
