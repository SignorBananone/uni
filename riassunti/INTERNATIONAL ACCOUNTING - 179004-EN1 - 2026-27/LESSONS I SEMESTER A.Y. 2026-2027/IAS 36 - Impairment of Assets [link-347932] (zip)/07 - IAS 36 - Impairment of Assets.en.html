&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Where it is recognised&lt;/h4&gt;&lt;p&gt;Immediately in &lt;strong&gt;P&amp;amp;L&lt;/strong&gt;, unless the asset is revalued: there it is a &lt;span class=&quot;en&quot;&gt;revaluation increase&lt;/span&gt; in &lt;strong&gt;OCI&lt;/strong&gt; that increases the surplus. However, to the extent that the loss was previously recognised in P&amp;amp;L, the reversal also goes to P&amp;amp;L (§119-120).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;After the reversal&lt;/h4&gt;&lt;p&gt;Depreciation is adjusted: new carrying amount, less residual value, over the remaining useful life (§121).&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;strong&gt;Why never on goodwill?&lt;/strong&gt; IAS 38 prohibits the recognition of internally generated goodwill. A subsequent increase in recoverable amount is likely to be &lt;em&gt;internally generated&lt;/em&gt; goodwill, not a recovery of the acquired goodwill: reversing the loss would amount to recognising what is prohibited (§125).&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h4&gt;Self-check · Part D&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;A loss of 80 on a revalued asset with a surplus of 50. Where do the amounts go?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;50 to OCI, which eliminates the surplus, and 30 to profit or loss.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;A bus route is heavily loss-making. Is it written down on its own?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No, if the entity cannot cut it: the contract requires all the routes, so the CGU is the entire company (slide 43).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;CGU: goodwill 50, assets X 200 and Y 300. Recoverable amount 400. How do you allocate the loss?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Carrying amount 550, loss 150. Goodwill −50. The remaining 100 pro rata: X −40 (200/500), Y −60 (300/500). After: X 160, Y 240.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Same CGU, but X has an FVLCD of 180. What changes?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;X can lose only 20. The other 20 that would have fallen to it pass to Y: X 180, Y 220. The total remains 400.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Can goodwill be tested above the operating segment level?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No: the unit cannot be larger than an IFRS 8 operating segment, before aggregation (§80).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;A goodwill loss of 40 last year; today the recoverable amount has risen again. What do you do?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No reversal on goodwill (§124). The increase is presumed to be internally generated goodwill (§125).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In what order do you test a machine with indications and its CGU with goodwill?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;First the machine, recognising the loss. Then the CGU with the goodwill (§98).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;terra&quot;&gt;
&lt;div class=&quot;phead&quot;&gt;&lt;span class=&quot;k&quot;&gt;Part E&lt;/span&gt;&lt;h2&gt;Communicating and changing&lt;/h2&gt;&lt;p&gt;The test rests on estimates: disclosure makes them verifiable. And the rules are under review.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;s&quot; id=&quot;disclosure&quot;&gt;
&lt;h3&gt;16. Disclosure: from the general to goodwill&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 71-86 · §126-134&lt;/p&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 196&quot; role=&quot;img&quot; aria-label=&quot;Four levels of disclosure, from the most general to the most detailed&quot;&gt;
&lt;rect class=&quot;bx&quot; x=&quot;4&quot; y=&quot;4&quot; width=&quot;472&quot; height=&quot;42&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;30&quot;&gt;§126 · each class of assets: amounts&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;34&quot; y=&quot;52&quot; width=&quot;412&quot; height=&quot;42&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;78&quot;&gt;§130 · losses recognised or reversed: details&lt;/text&gt;
&lt;rect class=&quot;bx&quot; x=&quot;64&quot; y=&quot;100&quot; width=&quot;352&quot; height=&quot;42&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t mid&quot; x=&quot;240&quot; y=&quot;126&quot;&gt;§131-133 · aggregate losses, unallocated goodwill&lt;/text&gt;
&lt;rect class=&quot;bc&quot; x=&quot;94&quot; y=&quot;148&quot; width=&quot;292&quot; height=&quot;42&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;t tb mid&quot; x=&quot;240&quot; y=&quot;174&quot;&gt;§134 · CGUs with goodwill: estimates&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;button type=&quot;button&quot;&gt;§126&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;§130&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;§131-133&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;§134&lt;/button&gt;&lt;button type=&quot;button&quot;&gt;Sensitivity&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 71&lt;/p&gt;&lt;p&gt;For each class of assets:&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Impairment losses&lt;/th&gt;&lt;th&gt;Reversals&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Profit or loss&lt;/th&gt;&lt;td&gt;amount and line item in the statement&lt;/td&gt;&lt;td&gt;amount and line item in the statement&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;OCI, revalued assets&lt;/th&gt;&lt;td&gt;amount&lt;/td&gt;&lt;td&gt;amount&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slides 72-76&lt;/p&gt;&lt;ol type=&quot;a&quot;&gt;&lt;li&gt;&lt;strong&gt;Events and circumstances&lt;/strong&gt; that led to the loss or reversal.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Amount&lt;/strong&gt; recognised or reversed.&lt;/li&gt;&lt;li&gt;For an &lt;strong&gt;individual asset&lt;/strong&gt;: its nature and, if IFRS 8 applies, the reportable segment.&lt;/li&gt;&lt;li&gt;For a &lt;strong&gt;CGU&lt;/strong&gt;: description, amount by class of assets and by segment, any change in aggregation with the reasons.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Recoverable amount&lt;/strong&gt;, and whether it is FVLCD or VIU.&lt;/li&gt;&lt;li&gt;If it is &lt;strong&gt;FVLCD&lt;/strong&gt;: level of the fair value hierarchy; for levels 2 and 3, the technique, changes of technique with reasons, key assumptions, and the current and previous discount rate if present value is used.&lt;/li&gt;&lt;li&gt;If it is &lt;strong&gt;VIU&lt;/strong&gt;: current and previous discount rate.&lt;/li&gt;&lt;/ol&gt;
&lt;div class=&quot;note x&quot;&gt;&lt;span class=&quot;tagx lab&quot;&gt;external source&lt;/span&gt;The IFRS 13 fair value hierarchy: Level 1, unadjusted quoted prices in active markets for identical assets; Level 2, other observable inputs; Level 3, unobservable inputs. &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs13.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 13, 2026 text&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slides 78-79&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;§131&lt;/strong&gt;: for aggregate losses and reversals without §130 information, the main classes of assets and the main events and circumstances are disclosed.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;§132&lt;/strong&gt;: the entity is &lt;em&gt;encouraged&lt;/em&gt; to disclose the assumptions used; for CGUs with goodwill or intangibles with indefinite useful lives, §134 makes them &lt;em&gt;mandatory&lt;/em&gt;.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;§133&lt;/strong&gt;: goodwill acquired during the period and not yet allocated (§84): amount and reasons.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slides 80-85 · Applies if the CGU&#x27;s goodwill or intangibles with indefinite useful lives are significant relative to the total&lt;/p&gt;
&lt;p&gt;Always: the carrying amount of allocated goodwill and of intangibles with indefinite useful lives, and the basis of the recoverable amount (VIU or FVLCD).&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;To be disclosed&lt;/th&gt;&lt;th&gt;VIU&lt;/th&gt;&lt;th&gt;FVLCD&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Key assumptions and management&#x27;s approach&lt;/td&gt;&lt;td&gt;Yes&lt;/td&gt;&lt;td&gt;Yes, unless it is a quoted price for an identical unit&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Valuation technique&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;td&gt;Yes, with any change and the reasons&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Level of the fair value hierarchy&lt;/td&gt;&lt;td&gt;–&lt;/td&gt;&lt;td&gt;Yes&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Projection period&lt;/td&gt;&lt;td&gt;Yes, and why if beyond 5 years&lt;/td&gt;&lt;td&gt;If discounted cash flows are used&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Growth rate&lt;/td&gt;&lt;td&gt;Yes, and why if above the long-term average&lt;/td&gt;&lt;td&gt;If discounted cash flows are used&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Discount rate&lt;/td&gt;&lt;td&gt;Yes&lt;/td&gt;&lt;td&gt;If discounted cash flows are used&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;&lt;span class=&quot;en&quot;&gt;Key assumptions&lt;/span&gt; are those to which the recoverable amount is &lt;strong&gt;most sensitive&lt;/strong&gt;. The approach states whether they reflect past experience or external sources and, if not, how and why they differ. For FVLCD, the IFRS 13 disclosures are not required.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tp-p&quot;&gt;&lt;p class=&quot;pg&quot;&gt;Slide 86 · §134(f)&lt;/p&gt;&lt;p&gt;If a &lt;span class=&quot;en&quot;&gt;reasonably possible&lt;/span&gt; change in a key assumption would cause the carrying amount to exceed the recoverable amount, the entity discloses:&lt;/p&gt;&lt;ol type=&quot;i&quot;&gt;&lt;li&gt;the margin between recoverable amount and carrying amount;&lt;/li&gt;&lt;li&gt;the value assigned to the assumption;&lt;/li&gt;&lt;li&gt;how much it would have to change, after taking into account the effects on the other variables, to eliminate the margin.&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tagi lab&quot;&gt;beyond the slides&lt;/span&gt;Sample note: “The recoverable amount exceeds the carrying amount by 40. The discount rate is 9%: an increase of 0.7 percentage points would eliminate the margin.” You can reproduce the reasoning with the &lt;a href=&quot;#viu-w&quot;&gt;VIU calculator&lt;/a&gt;.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;s&quot; id=&quot;progetto&quot;&gt;
&lt;h3&gt;17. The IASB project: Goodwill and Impairment&lt;/h3&gt;
&lt;p class=&quot;pg&quot;&gt;Slides 104-108&lt;/p&gt;
&lt;p&gt;The &lt;span class=&quot;en&quot;&gt;Business Combinations: Disclosures, Goodwill and Impairment&lt;/span&gt; project concerns two standards: IFRS 3, to improve information on the performance of acquisitions, and IAS 36, to amend the test for CGUs with goodwill.&lt;/p&gt;
&lt;p&gt;According to the slides, in September 2023 the IASB (International Accounting Standards Board) decided to publish an &lt;span class=&quot;en&quot;&gt;Exposure Draft&lt;/span&gt;. On 19 September 2023 it tentatively decided to:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;strong&gt;not&lt;/strong&gt; give &lt;span class=&quot;en&quot;&gt;first-time adopters&lt;/span&gt; a specific exemption from the amendments to IAS 36;&lt;/li&gt;&lt;li&gt;apply the amendments to tests performed from the effective date onwards, with early application permitted.&lt;/li&gt;&lt;/ul&gt;
&lt;div class=&quot;warn&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;strong&gt;The slides need updating on this point.&lt;/strong&gt; Slide 105 says that the IASB is working towards publishing the Exposure Draft: it was published in March 2024. According to searches carried out in November 2026, the amendments are not yet final. IAS 36 as described above still applies.&lt;/div&gt;
&lt;figure class=&quot;dg&quot;&gt;&lt;svg viewBox=&quot;0 0 480 272&quot; role=&quot;img&quot; aria-label=&quot;Timeline of the project from 2020 to 2027&quot;&gt;
&lt;path class=&quot;ln&quot; d=&quot;M70 10V262&quot;/&gt;
&lt;g&gt;&lt;circle class=&quot;bm&quot; cx=&quot;70&quot; cy=&quot;20&quot; r=&quot;6&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;4&quot; y=&quot;25&quot;&gt;2020&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;86&quot; y=&quot;25&quot;&gt;Discussion Paper&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;circle class=&quot;bm&quot; cx=&quot;70&quot; cy=&quot;62&quot; r=&quot;6&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;4&quot; y=&quot;67&quot;&gt;01/23&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;86&quot; y=&quot;67&quot;&gt;“In brief”, cited in the slides&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;circle class=&quot;bm&quot; cx=&quot;70&quot; cy=&quot;104&quot; r=&quot;6&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;4&quot; y=&quot;109&quot;&gt;03/23&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;86&quot; y=&quot;109&quot;&gt;Impairment-only model retained&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;circle class=&quot;bm&quot; cx=&quot;70&quot; cy=&quot;146&quot; r=&quot;6&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;4&quot; y=&quot;151&quot;&gt;09/23&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;86&quot; y=&quot;151&quot;&gt;Decision to publish; the slides stop here&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;circle class=&quot;ba&quot; cx=&quot;70&quot; cy=&quot;188&quot; r=&quot;6&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;4&quot; y=&quot;193&quot;&gt;03/24&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;86&quot; y=&quot;193&quot;&gt;Exposure Draft, comments until 15/07/2024&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;circle class=&quot;ba&quot; cx=&quot;70&quot; cy=&quot;230&quot; r=&quot;6&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;4&quot; y=&quot;235&quot;&gt;2026&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;86&quot; y=&quot;235&quot;&gt;Review of the proposals, still under way&lt;/text&gt;&lt;/g&gt;
&lt;g&gt;&lt;circle class=&quot;ba&quot; cx=&quot;70&quot; cy=&quot;258&quot; r=&quot;6&quot;/&gt;&lt;text class=&quot;t tb&quot; x=&quot;4&quot; y=&quot;263&quot;&gt;2027&lt;/text&gt;&lt;text class=&quot;ts&quot; x=&quot;86&quot; y=&quot;263&quot;&gt;H1: decision on direction expected&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;&lt;figcaption&gt;Only the 01/23 and 09/23 milestones are in the slides; the others are &lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt;, with the links below.&lt;/figcaption&gt;&lt;/figure&gt;
&lt;div class=&quot;note x&quot;&gt;&lt;span class=&quot;tagx lab&quot;&gt;external source&lt;/span&gt;
&lt;p&gt;Exposure Draft of 14 March 2024: &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/project/goodwill-and-impairment/exposure-draft-2024/iasb-ed-2024-1-bcdgi.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ED/2024/1&lt;/a&gt;. Project status: &lt;a href=&quot;https://www.ifrs.org/projects/work-plan/goodwill-and-impairment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS page&lt;/a&gt; and &lt;a href=&quot;https://www.iasplus.com/en/news/2026/10/work-plan&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;September 2026 work plan on IAS Plus&lt;/a&gt;, which moves the decision on direction to the first half of 2027. Retention of the impairment-only model: &lt;a href=&quot;https://www.icaew.com/insights/viewpoints-on-the-news/2023/mar-2023/IASB-retains-impairmentonly-goodwill-model-in-MA&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW, March 2023&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;Two proposals affect rules covered in this lecture. The first removes the requirement to use pre-tax cash flows and rates (§51, §55), requiring internally consistent assumptions instead (&lt;a href=&quot;https://ifrs.org/content/dam/ifrs/meetings/2025/january/iasb/ap18d-other-ias-36-proposals.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;staff paper, January 2025&lt;/a&gt;). The second concerns the prohibition on including cash flows from future restructurings and enhancements in VIU (§44): its removal is still under review (&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/meetings/2026/april/iasb/ap18f-restructuring-enhancement-cash-flows.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;staff paper, April 2026&lt;/a&gt;). These are proposals, not rules in force.&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h4&gt;Self-check · Part E&lt;/h4&gt;
&lt;details&gt;&lt;summary&gt;The recoverable amount is VIU. Which rate must be disclosed under §130?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The discount rate of the current estimate and of the previous one, if any (§130g).&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Does §132 always require the assumptions to be disclosed?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No, it encourages disclosure. It becomes mandatory under §134, for CGUs with significant goodwill or intangibles with indefinite useful lives.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;When is the §134(f) sensitivity disclosure needed?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;When a reasonably possible change in a key assumption would cause the carrying amount to exceed the recoverable amount.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Can I include in VIU today a restructuring not yet approved because “the IASB project will allow it”?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. §44 is still in force: those in the project are proposals.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;

&lt;section class=&quot;s&quot; id=&quot;formule&quot;&gt;
&lt;h3&gt;Quick formula sheet&lt;/h3&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;th&gt;Recoverable amount&lt;/th&gt;&lt;td&gt;max (FVLCD ; VIU)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;§6&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Impairment loss&lt;/th&gt;&lt;td&gt;Carrying amount − Recoverable amount, if positive&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;§6&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Value in use&lt;/th&gt;&lt;td&gt;Σ CF&lt;sub&gt;t&lt;/sub&gt; / (1 + r)&lt;sup&gt;t&lt;/sup&gt;, pre-tax, without financing&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;§31, 50&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Expected CF&lt;/th&gt;&lt;td&gt;Σ outcome × probability&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;A7&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Revalued asset&lt;/th&gt;&lt;td&gt;OCI = min (loss ; surplus), the rest in P&amp;amp;L&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;§60-61&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;CGU allocation&lt;/th&gt;&lt;td&gt;goodwill, then pro rata; floor max (FVLCD ; VIU ; 0)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;§104-105&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Reversal ceiling&lt;/th&gt;&lt;td&gt;carrying amount without the past loss; CGU: also the recoverable amount&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;§117, 123&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;th&gt;Goodwill disposed of&lt;/th&gt;&lt;td&gt;value disposed of / (disposed of + retained)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;slide 55&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;div class=&quot;terra&quot;&gt;
&lt;section class=&quot;s&quot; id=&quot;approfondire&quot;&gt;
&lt;h3&gt;Further reading&lt;/h3&gt;
&lt;p&gt;Texts, standards and models cited in the slides. The descriptions in this section are &lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt;, distinct from the content of the slides; “why it matters” links each entry to the lecture. The slides cite no authors or academic studies. The Sharpe entry is the original reference for the CAPM they mention.&lt;/p&gt;
&lt;p style=&quot;font-size:.9rem;color:var(--muted)&quot;&gt;Other course materials: for this page it was not possible to list the &lt;code&gt;corso/&lt;/code&gt; folder, so no content comes from other lectures, exercises or the syllabus. The links to other standards come from the citations in the IAS 36 slides.&lt;/p&gt;
&lt;h4&gt;The standard and the project&lt;/h4&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 36 Impairment of Assets&lt;/h4&gt;&lt;p&gt;IFRS Foundation. Full text: §1-141 and Appendices A-C, 2026 edition.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it is the primary source for the whole lecture; it also contains what the slides omit, such as §A1 and §102(b).&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias36.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;text&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-36-impairment-of-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;summary&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;In brief, January 2023&lt;/h4&gt;&lt;p&gt;IASB article of 31 January 2023 on the project decisions.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it is the source of slides 107-108 on the objective of the test.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/project/goodwill-and-impairment/inbrief-businesscombs-jan2023.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS PDF&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IASB Update, September 2023&lt;/h4&gt;&lt;p&gt;Meeting of 19 September 2023: tentative decisions on transition and first-time adopters.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it is the basis of slide 106.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/meetings/2023/september/iasb/ap18b-bcdgi-transition-and-effective-date.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;staff paper&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/meeting-notes/iasb/2023/september/bc&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;ED/2024/1&lt;/h4&gt;&lt;p&gt;Exposure Draft of 14 March 2024 with the proposed amendments to IFRS 3 and IAS 36. Comments until 15 July 2024.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it is the step following the one described in the slides.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/project/goodwill-and-impairment/exposure-draft-2024/iasb-ed-2024-1-bcdgi.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ED&lt;/a&gt; · &lt;a href=&quot;https://cdn.ifrs.org/content/dam/ifrs/project/goodwill-and-impairment/exposure-draft-2024/iasb-bc-2024-1-bcdgi.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Basis for Conclusions&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;Project status&lt;/h4&gt;&lt;p&gt;Review still open in 2026; decision on direction expected in the first half of 2027.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it tells you whether the exam rules are about to change. Check again before the exam.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/projects/work-plan/goodwill-and-impairment/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/news/2026/10/work-plan&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;Sharpe (1964)&lt;/h4&gt;&lt;p&gt;W. F. Sharpe, “Capital Asset Prices: A Theory of Market Equilibrium under Conditions of Risk”, &lt;span class=&quot;en&quot;&gt;Journal of Finance&lt;/span&gt;, 19(3), 425-442. Derives the relationship between asset prices and risk.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it is the origin of the CAPM cited in A17 for estimating the WACC.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://doi.org/10.1111/j.1540-6261.1964.tb02865.x&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;
&lt;h4&gt;Standards that interact with the test&lt;/h4&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 3 Business Combinations&lt;/h4&gt;&lt;p&gt;How the acquirer recognises the assets, liabilities and goodwill of an acquisition.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; the goodwill being tested originates here.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-3-business-combinations/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 38 Intangible Assets&lt;/h4&gt;&lt;p&gt;§48 prohibits the recognition of internally generated goodwill.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it explains the prohibition on reversal and the intangibles subject to the annual test.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias38.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 16 Property, Plant and Equipment&lt;/h4&gt;&lt;p&gt;Choice between cost model and revaluation model, with the surplus in OCI.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it governs where the loss on a revalued asset goes.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2025/issued/ias16.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 8 Operating Segments&lt;/h4&gt;&lt;p&gt;Defines operating segments on the basis of what the chief operating decision maker reviews.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it sets the upper limit for allocating goodwill.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs8.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 13 Fair Value Measurement&lt;/h4&gt;&lt;p&gt;Definition of fair value and the three-level hierarchy of inputs.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it underlies FVLCD and its disclosure.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs13.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 37 Provisions&lt;/h4&gt;&lt;p&gt;Provisions, including those for restructuring. Targeted amendments are in progress: Exposure Draft of November 2024.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it houses the restructuring outflows (§47).&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-37-provisions-contingent-liabilities-and-contingent-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 12 Income Taxes&lt;/h4&gt;&lt;p&gt;Current and deferred taxes.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; after the loss, deferred taxes are redetermined (§64).&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-12-income-taxes/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 5 Held for Sale&lt;/h4&gt;&lt;p&gt;Assets held for sale: lower of carrying amount and fair value less costs to sell; depreciation ceases.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it marks the exit from IAS 36.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-5-non-current-assets-held-for-sale-and-discontinued-operations/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 10 Consolidated Financial Statements&lt;/h4&gt;&lt;p&gt;Control as the basis for consolidation.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it defines the subsidiaries that remain within IAS 36.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-10-consolidated-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 28 Associates and Joint Ventures&lt;/h4&gt;&lt;p&gt;The equity method; significant influence presumed from 20% of the voting power. A revision is expected in 2027.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it defines the associates in scope (§4).&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-28-investments-in-associates-and-joint-ventures/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/projects/work-plan/equity-method/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;project&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 11 Joint Arrangements&lt;/h4&gt;&lt;p&gt;Distinguishes joint operations and joint ventures on the basis of rights and obligations.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it defines the joint ventures in scope (§4).&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-11-joint-arrangements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;
&lt;h4&gt;Standards for the assets excluded from scope&lt;/h4&gt;
&lt;div class=&quot;refs&quot;&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 2 Inventories&lt;/h4&gt;&lt;p&gt;Lower of cost and net realisable value.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it already has its own value limit, so it stays out.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 15 Revenue&lt;/h4&gt;&lt;p&gt;The five-step model for revenue from contracts.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it governs the excluded contract assets and contract costs.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-15-revenue-from-contracts-with-customers/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 19 Employee Benefits&lt;/h4&gt;&lt;p&gt;Accounting and disclosure for employee benefits.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it governs the assets excluded from IAS 36.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-19-employee-benefits/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 9 Financial Instruments&lt;/h4&gt;&lt;p&gt;Classification and measurement, with impairment based on expected credit losses.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it is the other impairment model, not to be confused with this one.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-9-financial-instruments/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 40 Investment Property&lt;/h4&gt;&lt;p&gt;Choice between fair value model, with changes in P&amp;amp;L, and cost model.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; only the former is excluded from IAS 36.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-40-investment-property/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IAS 41 Agriculture&lt;/h4&gt;&lt;p&gt;Biological assets at fair value less costs to sell; bearer plants follow IAS 16.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; the current value makes the test unnecessary.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-41-agriculture/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;ref&quot;&gt;&lt;h4&gt;IFRS 17 Insurance Contracts&lt;/h4&gt;&lt;p&gt;Measurement of insurance contracts at risk-adjusted current values, with a contractual service margin.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Why it matters:&lt;/strong&gt; it governs the excluded contracts.&lt;/p&gt;&lt;p class=&quot;a&quot;&gt;&lt;span class=&quot;tagx&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-17-insurance-contracts/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/div&gt;
&lt;/main&gt;
&lt;/div&gt;
