&lt;div class=&quot;sort-item&quot; data-a=&quot;is&quot; data-amt=&quot;30000&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Loss of efficiency iniziale · € 30.000&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;sfp&quot;&gt;SFP&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;is&quot;&gt;IS&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;b&gt;IS.&lt;/b&gt; Non è un intangible, anche se in futuro ci saranno benefici: i sei criteri non sono soddisfatti. &lt;span class=&quot;s&quot;&gt;slide 55&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;is&quot; data-amt=&quot;20000&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Advertising campaign · € 20.000&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;sfp&quot;&gt;SFP&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;is&quot;&gt;IS&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;b&gt;IS.&lt;/b&gt; È un&#x27;aggiunta all&#x27;internally generated goodwill, che non si capitalizza. &lt;span class=&quot;s&quot;&gt;slide 55&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;sfp&quot; data-amt=&quot;150000&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Working time · € 150.000&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;sfp&quot;&gt;SFP&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;is&quot;&gt;IS&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;b&gt;SFP.&lt;/b&gt; Directly attributable costs: costi per employee benefits (IAS 19) che derivano direttamente dal portare l&#x27;asset in condizione di funzionare. &lt;span class=&quot;s&quot;&gt;slide 56&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;is&quot; data-amt=&quot;40000&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Training new staff · € 40.000&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;sfp&quot;&gt;SFP&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;is&quot;&gt;IS&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;b&gt;IS.&lt;/b&gt; Alfa non controlla i benefici futuri: i lavoratori possono andarsene. &lt;span class=&quot;s&quot;&gt;slide 56&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;button class=&quot;btn&quot; data-all&gt;Mostra tutte le soluzioni&lt;/button&gt;
&lt;/div&gt;
&lt;p class=&quot;meta&quot;&gt;Quadratura calcolata qui, non nelle slide: SFP € 700.000 + IS € 1.230.000 = € 1.930.000, il totale dei costi elencati a &lt;span class=&quot;s&quot;&gt;slide 52&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;flag&quot;&gt;&lt;b&gt;Da chiarire.&lt;/b&gt; Le slide non dicono quale intangible producano consulenza e working time, e il «may be capitalized» subordina l&#x27;iscrizione ai sei criteri. IAS 38.69 elenca invece tra le spese da rilevare a costo quelle per &lt;i&gt;relocating or reorganising&lt;/i&gt; un&#x27;entity. Quindi la soluzione regge se quei costi riguardano lo sviluppo di un asset identificabile, non la riorganizzazione in sé: conviene chiedere al docente quale sia l&#x27;ipotesi del caso. &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias38.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · IAS 38.69 ↗&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;summary&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;17&lt;/span&gt;Summary: le regole da portare via&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 57&lt;/span&gt; Requisiti principali di IFRS 3 e IAS 38:&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Elemento&lt;/th&gt;&lt;th&gt;Trattamento&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Purchased goodwill e intangible assets&lt;/td&gt;&lt;td&gt;Capitalised&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Internally generated goodwill&lt;/td&gt;&lt;td&gt;&lt;b&gt;Mai&lt;/b&gt; capitalised&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Intangible sviluppati internamente (development costs)&lt;/td&gt;&lt;td&gt;Capitalised solo con benefici probabili e costo misurabile. Dettaglio: i sei criteri &lt;span class=&quot;s&quot;&gt;slide 30&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Asset capitalizzati&lt;/td&gt;&lt;td&gt;Soggetti ad amortisation e impairment review&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Indefinite useful life&lt;/td&gt;&lt;td&gt;Niente amortisation, impairment test ogni anno&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica, parte IV&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Vendi un intangible con guadagno: lo presenti come revenue?&lt;/summary&gt;&lt;div&gt;No: il gain va in profit or loss, ma non è classificato come revenue. &lt;span class=&quot;s&quot;&gt;slide 45 · IAS 38.113&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quando è la date of disposal?&lt;/summary&gt;&lt;div&gt;Quando chi riceve ottiene il control dell&#x27;asset, secondo le regole IFRS 15 sulla performance obligation. Per il sale and leaseback si applica IFRS 16. &lt;span class=&quot;s&quot;&gt;slide 45 · IAS 38.114&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Vita indefinita: che cosa aggiunge la disclosure?&lt;/summary&gt;&lt;div&gt;Il carrying amount e i motivi della valutazione, con i fattori che hanno avuto un ruolo significativo. &lt;span class=&quot;s&quot;&gt;slide 48 · IAS 38.122&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché training e reinstatement workers finiscono in IS?&lt;/summary&gt;&lt;div&gt;Perché i lavoratori possono lasciare il lavoro: manca il control sui benefici futuri. &lt;span class=&quot;s&quot;&gt;slide 54, 56&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che differenza c&#x27;è tra feasibility study e consultancy nel caso Alfa?&lt;/summary&gt;&lt;div&gt;Il primo è assimilato alla research, quindi va a expense; la seconda è development, capitalizzabile se i sei criteri sono dimostrati. &lt;span class=&quot;s&quot;&gt;slide 53–54&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;section id=&quot;fonti&quot; style=&quot;scroll-margin-top:50px;margin-top:64px&quot;&gt;
&lt;h2 style=&quot;font-size:36px&quot;&gt;Per approfondire&lt;/h2&gt;
&lt;p&gt;&lt;span class=&quot;xl&quot;&gt;fonte esterna&lt;/span&gt; Tutto in questa sezione viene dal web, non dalle slide. Le slide non citano autori, studi né siti: i loro riferimenti sono il Conceptual Framework e altri standard, quindi la sezione è costruita su questi. Le pagine sono state trovate tramite ricerca web il 4 novembre 2026 e lette negli estratti dei risultati, non integralmente: per le citazioni esatte apri il testo.&lt;/p&gt;
&lt;p class=&quot;flag&quot;&gt;&lt;b&gt;Altri materiali del corso.&lt;/b&gt; In questa sessione non è stato possibile elencare il contenuto di &lt;code&gt;corso/&lt;/code&gt;: solo il PDF di questa lezione è stato letto, quindi la pagina non prende nulla da altri file. I legami con altre norme vengono dalle slide stesse.&lt;/p&gt;

&lt;h4 class=&quot;p-sage&quot; style=&quot;color:var(--sage)&quot;&gt;Lo standard e la sua cornice&lt;/h4&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h5&gt;IAS 38 Intangible Assets&lt;/h5&gt;&lt;p&gt;Emesso dall&#x27;IASC nel settembre 1998 e adottato dall&#x27;IASB nell&#x27;aprile 2001. Contiene il testo normativo con i paragrafi citati dalle slide. È il riferimento finale per ogni dubbio di questa lezione.&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias38.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · testo edizione 2026 ↗&lt;/a&gt; &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-38-intangible-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · scheda IFRS ↗&lt;/a&gt; &lt;a class=&quot;x&quot; href=&quot;https://www.iasplus.com/en/standards/ias/ias38&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · sintesi IAS Plus ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h5&gt;Conceptual Framework for Financial Reporting (2018)&lt;/h5&gt;&lt;p&gt;Pubblicato dall&#x27;IASB nel marzo 2018, sostituisce la versione 2010. Definisce obiettivi, elementi del bilancio, recognition e measurement. Conta perché la slide 3 prende da qui la definizione di asset (4.3–4.4), che tratta gli asset come diritti.&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/conceptual-framework/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · IFRS Foundation ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h5&gt;Il progetto IASB sugli Intangible Assets&lt;/h5&gt;&lt;p&gt;Non è nelle slide, ma riguarda il futuro di questa norma: l&#x27;IASB sta rivedendo IAS 38 per adattarla ai nuovi tipi di intangible, partendo da due filoni, definizione e recognition da un lato, disclosure dall&#x27;altro. Dalle ricerche di novembre 2026 non risulta un exposure draft, e l&#x27;esito della riunione di ottobre 2026 non è stato confermato.&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/projects/work-plan/intangible-assets&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · work plan IASB ↗&lt;/a&gt; &lt;a class=&quot;x&quot; href=&quot;https://www.icaew.com/technical/corporate-reporting/corporate-reporting-resources/by-all-accounts/articles/2025/the-future-of-accounting-for-intangibles&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · ICAEW, 2025 ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h5&gt;SIC-32 Intangible Assets: Web Site Costs&lt;/h5&gt;&lt;p&gt;Non è citata nelle slide, ma è l&#x27;interpretazione specifica per il loro esempio del sito web: divide il progetto in fasi e collega ciascuna alle regole di IAS 38.&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/sic32.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · testo 2026 ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h5&gt;Adozione nell&#x27;Unione europea&lt;/h5&gt;&lt;p&gt;Non è nelle slide. Nell&#x27;UE gli standard si applicano nel testo omologato: la pagina della Commissione raccoglie i regolamenti, tra cui il Regolamento (UE) 2023/1803, che consolida gli standard adottati.&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;x&quot; href=&quot;https://finance.ec.europa.eu/regulation-and-supervision/financial-services-legislation/implementing-and-delegated-acts/international-accounting-standards-regulation_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · Commissione europea ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h4 style=&quot;color:var(--slate)&quot;&gt;Gli standard collegati, citati nelle slide&lt;/h4&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h5&gt;IAS 36 Impairment of Assets&lt;/h5&gt;&lt;p&gt;Assicura che gli asset non restino iscritti sopra il recoverable amount. Spiega come calcolarlo e quando testarlo: è la norma a cui rinvia la slide 44.&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias36.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · testo 2026 ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h5&gt;IFRS 3 Business Combinations&lt;/h5&gt;&lt;p&gt;Regola le aggregazioni aziendali con l&#x27;acquisition method: identifiable assets separati dal goodwill, in genere al fair value. Slide 6, 26 e 57.&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs3.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · testo 2026 ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h5&gt;IAS 8&lt;/h5&gt;&lt;p&gt;Tratta policies, changes in accounting estimates ed errori. Slide 43. Con IFRS 18 prende il titolo &lt;i&gt;Basis of Preparation of Financial Statements&lt;/i&gt; e assorbe parti di IAS 1, per i periodi dal 1° gennaio 2027.&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-8-basis-of-preparation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · IFRS Foundation ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
