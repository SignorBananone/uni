&lt;div class=&quot;p-sage&quot; id=&quot;parte1&quot; style=&quot;scroll-margin-top:50px&quot;&gt;
&lt;div class=&quot;part&quot;&gt;&lt;div class=&quot;n&quot;&gt;Parte I&lt;/div&gt;&lt;h2&gt;Che cos&#x27;è un intangible asset&lt;/h2&gt;&lt;p&gt;Prima di contabilizzare qualcosa bisogna capire se rientra nella norma e se risponde alla definizione.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;t&quot; id=&quot;asset&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;1&lt;/span&gt;Asset: il punto di partenza&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 3&lt;/span&gt; IAS 38 poggia sulla definizione generale del &lt;em class=&quot;t&quot;&gt;Conceptual Framework&lt;/em&gt; (CF, il quadro concettuale dell&#x27;IASB, da cui derivano gli standard).&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;q&gt;A present economic resource controlled by the entity as a result of past events.&lt;/q&gt;&lt;span class=&quot;s&quot;&gt;CF 4.3&lt;/span&gt; &lt;span class=&quot;s&quot;&gt;slide 3&lt;/span&gt;&lt;br&gt;
&lt;q style=&quot;font-size:17px;margin-top:6px&quot;&gt;An economic resource is a right that has the potential to produce economic benefits.&lt;/q&gt;&lt;span class=&quot;s&quot;&gt;CF 4.4&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;In italiano: un &lt;em class=&quot;t&quot;&gt;asset&lt;/em&gt; (attività) è una risorsa economica attuale che l&#x27;&lt;em class=&quot;t&quot;&gt;entity&lt;/em&gt; (l&#x27;impresa che redige il bilancio) controlla per effetto di fatti già avvenuti. La risorsa è un &lt;b&gt;diritto&lt;/b&gt; capace di produrre benefici. Conta il diritto più dell&#x27;oggetto, ed è per questo che la definizione funziona anche per cose senza corpo fisico.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 210&quot; role=&quot;img&quot; aria-label=&quot;Classificazione degli asset in tangible e intangible&quot;&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;190&quot; y=&quot;6&quot; width=&quot;100&quot; height=&quot;34&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;240&quot; y=&quot;28&quot;&gt;Asset&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M240 40V58M120 58H360M120 58V74M360 58V74&quot;/&gt;
&lt;rect class=&quot;box&quot; x=&quot;30&quot; y=&quot;74&quot; width=&quot;180&quot; height=&quot;42&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;120&quot; y=&quot;92&quot;&gt;Tangible assets&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;120&quot; y=&quot;108&quot;&gt;hanno sostanza fisica&lt;/text&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;270&quot; y=&quot;74&quot; width=&quot;180&quot; height=&quot;42&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;360&quot; y=&quot;92&quot;&gt;Intangible assets&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;360&quot; y=&quot;108&quot;&gt;risorse e diritti non fisici&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M120 116V132M65 132H175M65 132V146M175 132V146M360 116V146&quot;/&gt;
&lt;rect class=&quot;box&quot; x=&quot;18&quot; y=&quot;146&quot; width=&quot;94&quot; height=&quot;56&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;65&quot; y=&quot;166&quot;&gt;Current&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;65&quot; y=&quot;184&quot;&gt;inventory&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;124&quot; y=&quot;146&quot; width=&quot;102&quot; height=&quot;56&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;175&quot; y=&quot;166&quot;&gt;Fixed&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;175&quot; y=&quot;180&quot;&gt;buildings,&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;175&quot; y=&quot;194&quot;&gt;equipment&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;258&quot; y=&quot;146&quot; width=&quot;204&quot; height=&quot;56&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m sm&quot; x=&quot;360&quot; y=&quot;166&quot;&gt;software, patents, copyrights,&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;360&quot; y=&quot;184&quot;&gt;trademarks, design, know-how&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Le due classi di asset. &lt;span class=&quot;s&quot;&gt;slide 3–4&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;flag&quot;&gt;&lt;b&gt;Da chiarire.&lt;/b&gt; &lt;span class=&quot;s&quot;&gt;slide 3&lt;/span&gt; elenca tra gli esempi di intangible anche goodwill e financial assets (crediti, bond, azioni). In senso economico sono immateriali, ma per IAS 38 no: i financial assets sono esclusi dallo scope &lt;span class=&quot;s&quot;&gt;slide 5–6&lt;/span&gt; e il goodwill non è identifiable, quindi «by definition» non è un intangible asset &lt;span class=&quot;s&quot;&gt;slide 18&lt;/span&gt;. Per l&#x27;esame vale la definizione tecnica.&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;objective&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;2&lt;/span&gt;Objective: che cosa fa la norma&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 4 · IAS 38.1&lt;/span&gt; IAS 38 risponde a tre domande sugli intangible non trattati da altri standard:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;Quando rilevarli?&lt;/h5&gt;&lt;p&gt;L&#x27;&lt;em class=&quot;t&quot;&gt;entity&lt;/em&gt; fa &lt;em class=&quot;t&quot;&gt;recognition&lt;/em&gt; (iscrizione in bilancio) «if, and only if» sono soddisfatti criteri precisi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;A quanto iscriverli?&lt;/h5&gt;&lt;p&gt;Stabilisce come misurare il &lt;em class=&quot;t&quot;&gt;carrying amount&lt;/em&gt; (valore contabile, l&#x27;importo a cui l&#x27;asset compare nello stato patrimoniale).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;Che cosa raccontare?&lt;/h5&gt;&lt;p&gt;Impone la &lt;em class=&quot;t&quot;&gt;disclosure&lt;/em&gt; (informativa nelle note) sugli intangible.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Candidati tipici secondo le slide: computer software, patents, copyrights, advertising, brands and trademarks, intellectual property, market knowledge. Sono &lt;em&gt;intangible items&lt;/em&gt;: non tutti diventeranno asset. L&#x27;advertising, per esempio, supera il test della definizione? Lo vedrai nel caso Alfa.&lt;/p&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;scope&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;3&lt;/span&gt;Scope: chi resta fuori&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 5–7 · IAS 38.2–3&lt;/span&gt; La logica è residuale: se un altro standard disciplina un tipo specifico di intangible, si applica quello. Scegli una voce per vedere dove va.&lt;/p&gt;
&lt;div data-picker&gt;
&lt;div class=&quot;chips&quot;&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IAS 2 Inventories.&lt;/b&gt; Se l&#x27;intangible è destinato alla vendita nell&#x27;ordinary course of business (attività ordinaria) è rimanenza, per esempio una software house che vende licenze standard come prodotto.&quot;&gt;Intangible da vendere nell&#x27;attività ordinaria&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IAS 12 Income Taxes.&lt;/b&gt; Le deferred tax assets sono imposte anticipate, cioè benefici fiscali futuri.&quot;&gt;Deferred tax assets&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IFRS 16 Leases.&lt;/b&gt; I leases of intangible assets contabilizzati secondo IFRS 16 sono esclusi.&quot;&gt;Leases of intangible assets&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IAS 19 Employee Benefits.&lt;/b&gt; Asset che nascono dai benefici ai dipendenti.&quot;&gt;Asset da employee benefits&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IAS 32&lt;/b&gt; per la definizione. Per rilevazione e misurazione di alcuni financial assets: &lt;b&gt;IFRS 10&lt;/b&gt; (bilancio consolidato), &lt;b&gt;IAS 27&lt;/b&gt; (bilancio separato), &lt;b&gt;IAS 28&lt;/b&gt; (collegate e joint venture).&quot;&gt;Financial assets&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IFRS 3 Business Combinations.&lt;/b&gt; Il goodwill acquisito in una aggregazione aziendale segue IFRS 3.&quot;&gt;Goodwill da business combination&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IFRS 17 Insurance Contracts.&lt;/b&gt; Contratti assicurativi e asset per insurance acquisition cash flows (i costi per acquisire i contratti).&quot;&gt;Contratti assicurativi&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IFRS 5.&lt;/b&gt; I non-current intangible assets classificati held for sale (destinati alla vendita), anche dentro un disposal group, cioè un gruppo di attività da cedere insieme.&quot;&gt;Intangible held for sale&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IFRS 15 Revenue from Contracts with Customers.&lt;/b&gt; Asset che nascono da contratti con i clienti.&quot;&gt;Asset da contratti con clienti&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IFRS 6.&lt;/b&gt; Rilevazione e misurazione degli exploration and evaluation assets, cioè la ricerca e valutazione di risorse minerarie.&quot;&gt;Exploration and evaluation&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;Fuori da IAS 38.&lt;/b&gt; La slide esclude la spesa per development and extraction di minerali, petrolio, gas naturale e simili risorse non rigenerative, senza indicare uno standard.&quot;&gt;Estrazione di minerali, oil, gas&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;out&quot; aria-live=&quot;polite&quot;&gt;Scegli una voce qui sopra.&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;definition&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;4&lt;/span&gt;Definition: i tre pilastri&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;q&gt;An identifiable non-monetary asset without physical substance.&lt;/q&gt;&lt;span class=&quot;s&quot;&gt;IAS 38.8 · slide 8&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;La slide aggiunge lo scopo: &lt;b&gt;held for use&lt;/b&gt; nella produzione o fornitura di beni e servizi, &lt;b&gt;for rental&lt;/b&gt; a terzi o per fini amministrativi. &lt;em class=&quot;t&quot;&gt;Non-monetary&lt;/em&gt; significa che non è denaro né diritto a ricevere importi fissi o determinabili. Non lo vedi e non lo tocchi, ma genera benefici: un design usato in produzione, le conoscenze dei dipendenti usate per un servizio.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 182&quot; role=&quot;img&quot; aria-label=&quot;Tempio con tre colonne: identifiability, control, future economic benefits&quot;&gt;
&lt;path class=&quot;boxc&quot; d=&quot;M240 6L466 50H14z&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;240&quot; y=&quot;40&quot;&gt;Intangible asset&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;26&quot; y=&quot;58&quot; width=&quot;132&quot; height=&quot;86&quot; rx=&quot;4&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;92&quot; y=&quot;84&quot;&gt;Identifiability&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;92&quot; y=&quot;106&quot;&gt;separabile, oppure&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;92&quot; y=&quot;122&quot;&gt;da diritti legali&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;174&quot; y=&quot;58&quot; width=&quot;132&quot; height=&quot;86&quot; rx=&quot;4&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;240&quot; y=&quot;84&quot;&gt;Control&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;240&quot; y=&quot;106&quot;&gt;ottieni i benefici&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;240&quot; y=&quot;122&quot;&gt;e ne escludi gli altri&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;322&quot; y=&quot;58&quot; width=&quot;132&quot; height=&quot;86&quot; rx=&quot;4&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;388&quot; y=&quot;78&quot;&gt;Future economic&lt;/text&gt;&lt;text class=&quot;m b&quot; x=&quot;388&quot; y=&quot;94&quot;&gt;benefits&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;388&quot; y=&quot;114&quot;&gt;ricavi, risparmi&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;388&quot; y=&quot;130&quot;&gt;o altri vantaggi&lt;/text&gt;
&lt;rect class=&quot;fr&quot; x=&quot;14&quot; y=&quot;152&quot; width=&quot;452&quot; height=&quot;8&quot;/&gt;&lt;text class=&quot;m sm&quot; x=&quot;240&quot; y=&quot;176&quot;&gt;Se manca una colonna, la spesa è un expense&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;I tre pilastri&quot;&gt;
&lt;button role=&quot;tab&quot;&gt;Identifiability&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Control&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Future benefits&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 9–10 · IAS 38.11–12&lt;/span&gt; Serve a distinguere l&#x27;intangible dal &lt;em class=&quot;t&quot;&gt;goodwill&lt;/em&gt; (avviamento): i benefici futuri, in una aggregazione aziendale, che non corrispondono ad asset individuati singolarmente, ad esempio le sinergie.&lt;/p&gt;
&lt;p&gt;Basta &lt;b&gt;una&lt;/b&gt; delle due condizioni:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;b&gt;Separable&lt;/b&gt;: si può separare dall&#x27;entity e vendere, trasferire, dare in licenza, affittare o scambiare, da solo o con un contratto, asset o passività collegati. Conta la possibilità, anche se l&#x27;entity non intende farlo.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Contractual or other legal rights&lt;/b&gt;: nasce da diritti contrattuali o legali, anche se non trasferibili né separabili.&lt;/li&gt;&lt;/ul&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 11 · IAS 38.13&lt;/span&gt; &lt;em class=&quot;t&quot;&gt;Control&lt;/em&gt; vuol dire due poteri insieme: ottenere i benefici futuri e &lt;b&gt;limitare l&#x27;accesso degli altri&lt;/b&gt; a quei benefici. Di solito deriva da diritti azionabili in tribunale. Senza diritti legali il controllo è più difficile da dimostrare, ma l&#x27;enforceability non è una condizione necessaria.&lt;/p&gt;
&lt;p&gt;Per questo il personale formato è un caso classico: i dipendenti possono andarsene. Lo ritroverai nel caso Alfa. &lt;span class=&quot;s&quot;&gt;slide 56&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 12 · IAS 38.17&lt;/span&gt; Non servono per forza maggiori ricavi: i benefici includono revenue, &lt;b&gt;cost savings&lt;/b&gt; o altri vantaggi dall&#x27;uso. Una proprietà intellettuale usata in produzione può ridurre i costi futuri anziché aumentare i ricavi.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;Prova: risponde alla definizione?&lt;/h4&gt;
&lt;div data-sorter&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;si&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Un brevetto registrato, che l&#x27;impresa non pensa di vendere&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;si&quot;&gt;Sì&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;no&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;Nasce da un diritto legale, e comunque la separabilità non dipende dall&#x27;intenzione di vendere. &lt;span class=&quot;s&quot;&gt;slide 10&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;no&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Le competenze di un team appena formato, senza vincoli contrattuali&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;si&quot;&gt;Sì&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;no&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;Manca il control: le persone possono lasciare l&#x27;impresa e portare con sé i benefici. &lt;span class=&quot;s&quot;&gt;slide 54, 56&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;no&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Le sinergie pagate in un&#x27;acquisizione, non attribuibili a singoli asset&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;si&quot;&gt;Sì&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;no&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;È goodwill: non è identifiable, quindi non è un intangible asset secondo la definizione. &lt;span class=&quot;s&quot;&gt;slide 9, 18&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;si&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Un processo brevettato che riduce i costi di produzione senza far crescere i ricavi&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;si&quot;&gt;Sì&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;no&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;Anche i risparmi di costo sono future economic benefits, e il brevetto dà identifiability e control. &lt;span class=&quot;s&quot;&gt;slide 12&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica, parte I&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché IAS 38 richiede che l&#x27;asset sia identifiable?&lt;/summary&gt;&lt;div&gt;Per distinguerlo dal goodwill. &lt;span class=&quot;s&quot;&gt;slide 9&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Le due vie per essere identifiable sono alternative o cumulative?&lt;/summary&gt;&lt;div&gt;Alternative: separable &lt;b&gt;oppure&lt;/b&gt; derivante da contractual or other legal rights. &lt;span class=&quot;s&quot;&gt;slide 10&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un marchio destinato alla vendita ordinaria è sempre sotto IAS 38?&lt;/summary&gt;&lt;div&gt;No. Un intangible held for sale nell&#x27;ordinary course of business rientra in IAS 2 &lt;span class=&quot;s&quot;&gt;slide 6&lt;/span&gt;. Se è un non-current asset classificato held for sale, si applica IFRS 5 &lt;span class=&quot;s&quot;&gt;slide 7&lt;/span&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Senza diritti legali può esserci control?&lt;/summary&gt;&lt;div&gt;Sì, ma è più difficile dimostrarlo: la legal enforceability non è condizione necessaria. &lt;span class=&quot;s&quot;&gt;slide 11&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;div class=&quot;p-ochre&quot; id=&quot;parte2&quot; style=&quot;scroll-margin-top:50px&quot;&gt;
&lt;div class=&quot;part&quot;&gt;&lt;div class=&quot;n&quot;&gt;Parte II&lt;/div&gt;&lt;h2&gt;Come entra in bilancio&lt;/h2&gt;&lt;p&gt;Due chiavi da girare insieme, poi un costo da determinare: dipende da come l&#x27;asset è stato ottenuto.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;t&quot; id=&quot;criteri&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;5&lt;/span&gt;Recognition: le due chiavi&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 13 · IAS 38.18&lt;/span&gt; Per iscrivere un intangible bisogna dimostrare che soddisfa &lt;b&gt;sia&lt;/b&gt; la definizione &lt;b&gt;sia&lt;/b&gt; i recognition criteria. La regola vale per i costi iniziali, per acquistarlo o generarlo internamente, e per quelli successivi, per ampliarlo, sostituirne parti o mantenerlo.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 170&quot; role=&quot;img&quot; aria-label=&quot;Definizione e criteri portano al riconoscimento, altrimenti a costo&quot;&gt;
&lt;rect class=&quot;box&quot; x=&quot;10&quot; y=&quot;8&quot; width=&quot;170&quot; height=&quot;48&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;95&quot; y=&quot;28&quot;&gt;Definition&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;95&quot; y=&quot;45&quot;&gt;IAS 38.8–17&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;10&quot; y=&quot;72&quot; width=&quot;170&quot; height=&quot;86&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;95&quot; y=&quot;92&quot;&gt;Recognition criteria&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;95&quot; y=&quot;112&quot;&gt;a) benefici probabili&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;95&quot; y=&quot;128&quot;&gt;b) costo misurabile&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;95&quot; y=&quot;146&quot;&gt;IAS 38.21&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M180 32H222V64M180 115H222V82&quot;/&gt;
&lt;circle class=&quot;boxc&quot; cx=&quot;222&quot; cy=&quot;73&quot; r=&quot;15&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;222&quot; y=&quot;78&quot;&gt;e&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M237 62L296 36M237 84L296 112&quot;/&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;298&quot; y=&quot;12&quot; width=&quot;170&quot; height=&quot;50&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;383&quot; y=&quot;33&quot;&gt;Entrambe sì&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;383&quot; y=&quot;50&quot;&gt;recognition come asset&lt;/text&gt;
&lt;rect class=&quot;boxa&quot; x=&quot;298&quot; y=&quot;88&quot; width=&quot;170&quot; height=&quot;50&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;383&quot; y=&quot;109&quot;&gt;Anche un solo no&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;383&quot; y=&quot;126&quot;&gt;expense in profit or loss&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;def&quot;&gt;&lt;q&gt;An intangible asset shall be recognised if, and only if: (a) it is probable that the expected future economic benefits attributable to the asset will flow to the entity; and (b) the cost of the asset can be measured reliably.&lt;/q&gt;&lt;span class=&quot;s&quot;&gt;IAS 38.21 · slide 14&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;Come si valuta la probabilità? &lt;span class=&quot;s&quot;&gt;slide 15 · IAS 38.22–23&lt;/span&gt; Con ipotesi ragionevoli e supportabili, che riflettono la migliore stima del management per tutta la &lt;em class=&quot;t&quot;&gt;useful life&lt;/em&gt; (vita utile). Serve giudizio, sulla base delle evidenze disponibili alla rilevazione iniziale, dando &lt;b&gt;più peso alle evidenze esterne&lt;/b&gt;.&lt;/p&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;matite&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;6&lt;/span&gt;Esempio: il design e l&#x27;eccedenza&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 16–18&lt;/span&gt; Un&#x27;entity paga &lt;b&gt;€ 250.000&lt;/b&gt; a un grossista per un gruppo di asset con cui produrrà astucci di legno. I valori alla data di acquisto sommano però a € 220.000.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 122&quot; role=&quot;img&quot; aria-label=&quot;Barra: materie prime 150 mila, design 50 mila, etichette 20 mila, eccedenza 30 mila, totale 250 mila&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;30&quot; width=&quot;276&quot; height=&quot;44&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;text class=&quot;m&quot; x=&quot;148&quot; y=&quot;57&quot;&gt;Raw materials 150k&lt;/text&gt;
&lt;rect class=&quot;fc&quot; x=&quot;286&quot; y=&quot;30&quot; width=&quot;92&quot; height=&quot;44&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;332&quot; y=&quot;57&quot; style=&quot;fill:var(--paper)&quot;&gt;Design 50k&lt;/text&gt;
&lt;rect x=&quot;378&quot; y=&quot;30&quot; width=&quot;37&quot; height=&quot;44&quot; fill=&quot;var(--muted)&quot; opacity=&quot;.55&quot;/&gt;&lt;text class=&quot;m sm&quot; x=&quot;396&quot; y=&quot;57&quot; style=&quot;fill:var(--ink)&quot;&gt;20k&lt;/text&gt;
&lt;rect class=&quot;fa&quot; x=&quot;415&quot; y=&quot;30&quot; width=&quot;55&quot; height=&quot;44&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;442&quot; y=&quot;57&quot; style=&quot;fill:var(--paper)&quot;&gt;30k&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M10 20H470&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;240&quot; y=&quot;14&quot;&gt;Prezzo pagato € 250.000&lt;/text&gt;
&lt;text class=&quot;sm m&quot; x=&quot;148&quot; y=&quot;92&quot;&gt;tangible inventory&lt;/text&gt;&lt;text class=&quot;sm m&quot; x=&quot;332&quot; y=&quot;92&quot;&gt;intangible asset&lt;/text&gt;&lt;text class=&quot;sm m&quot; x=&quot;396&quot; y=&quot;92&quot;&gt;labels&lt;/text&gt;&lt;text class=&quot;sm e&quot; x=&quot;470&quot; y=&quot;92&quot;&gt;eccedenza&lt;/text&gt;
&lt;text class=&quot;sm e&quot; x=&quot;470&quot; y=&quot;110&quot;&gt;= goodwill per le slide&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;formula&quot;&gt;€ 30.000 = 250.000 − (150.000 + 50.000 + 20.000)&lt;/div&gt;
&lt;p&gt;Senza design le materie prime non servono a nulla, e il prezzo accordato ne misura il valore: è un intangible da € 50.000. L&#x27;eccedenza di € 30.000 si paga perché servono tutti e tre gli asset insieme, ed è «a possible example of the acquired goodwill». Design e goodwill restano &lt;b&gt;due asset distinti&lt;/b&gt;, perché il valore del design si può identificare a parte. Il goodwill non è identifiable e quindi, per definizione, non è un intangible asset.&lt;/p&gt;
&lt;div class=&quot;flag&quot;&gt;&lt;b&gt;Da chiarire.&lt;/b&gt; Le slide iscrivono € 30.000 di goodwill su un acquisto da un grossista. Secondo IFRS 3, però, l&#x27;acquisto di un gruppo di asset che &lt;i&gt;non&lt;/i&gt; costituisce un business non genera goodwill: il costo si ripartisce sulla base dei relative fair values. L&#x27;esempio serve a far vedere la differenza concettuale, ma vale la pena chiedere se il docente lo intenda come business. &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/supporting-implementation/agenda-decisions/2017/ifrs-3-acqusition-of-a-group-of-assets-nov-17.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · agenda decision IFRS 3, 2017 ↗&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;costo&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;7&lt;/span&gt;Initial measurement: sempre al cost&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;q&gt;An intangible asset shall be measured initially at cost.&lt;/q&gt;&lt;span class=&quot;s&quot;&gt;IAS 38.24 · slide 19&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;Il principio è uno, ma il costo si calcola diversamente secondo la via d&#x27;ingresso. &lt;span class=&quot;s&quot;&gt;slide 20&lt;/span&gt;&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Vie di ingresso&quot;&gt;
&lt;button role=&quot;tab&quot;&gt;Separate acquisition&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Exchange&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Business combination&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Internally generated&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 21–24 · IAS 38.25–29&lt;/span&gt; Acquisto singolo da terzi. Il prezzo riflette già le attese sui benefici, quindi il criterio di probabilità è &lt;b&gt;sempre considerato soddisfatto&lt;/b&gt; &lt;span class=&quot;s&quot;&gt;38.25&lt;/span&gt;, e il costo è di solito attendibile, soprattutto se si paga in denaro &lt;span class=&quot;s&quot;&gt;38.26&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Cost = purchase price + import duties + non-refundable taxes − trade discounts and rebates + directly attributable costs&lt;/div&gt;
&lt;p&gt;I &lt;em class=&quot;t&quot;&gt;directly attributable costs&lt;/em&gt; sono quelli necessari a preparare l&#x27;asset all&#x27;uso previsto. &lt;span class=&quot;s&quot;&gt;IAS 38.27&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 25 · IAS 38.45&lt;/span&gt; L&#x27;asset si ottiene in cambio di un asset non monetario, o di un mix monetario e non. Regola: &lt;em class=&quot;t&quot;&gt;fair value&lt;/em&gt; (il prezzo di mercato che si otterrebbe alla data di misurazione).&lt;/p&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 186&quot; role=&quot;img&quot; aria-label=&quot;Scambio: se c&#x27;è commercial substance e fair value misurabile si usa il fair value, altrimenti il carrying amount dell&#x27;asset ceduto&quot;&gt;
&lt;rect class=&quot;box&quot; x=&quot;8&quot; y=&quot;8&quot; width=&quot;208&quot; height=&quot;52&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m&quot; x=&quot;112&quot; y=&quot;30&quot;&gt;Lo scambio ha&lt;/text&gt;&lt;text class=&quot;m b&quot; x=&quot;112&quot; y=&quot;48&quot;&gt;commercial substance?&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;8&quot; y=&quot;96&quot; width=&quot;208&quot; height=&quot;62&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m&quot; x=&quot;112&quot; y=&quot;118&quot;&gt;Fair value misurabile&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;112&quot; y=&quot;136&quot;&gt;di almeno uno dei due asset?&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M112 60V96&quot;/&gt;&lt;text class=&quot;sm&quot; x=&quot;120&quot; y=&quot;82&quot;&gt;sì&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M216 34H284M216 126H284M112 158V176H240&quot;/&gt;&lt;text class=&quot;sm&quot; x=&quot;248&quot; y=&quot;28&quot;&gt;no&lt;/text&gt;&lt;text class=&quot;sm&quot; x=&quot;248&quot; y=&quot;120&quot;&gt;no&lt;/text&gt;&lt;text class=&quot;sm&quot; x=&quot;120&quot; y=&quot;172&quot;&gt;sì&lt;/text&gt;
&lt;rect class=&quot;boxa&quot; x=&quot;284&quot; y=&quot;26&quot; width=&quot;186&quot; height=&quot;100&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;377&quot; y=&quot;62&quot;&gt;Carrying amount&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;377&quot; y=&quot;82&quot;&gt;dell&#x27;asset ceduto&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;377&quot; y=&quot;102&quot;&gt;eccezione&lt;/text&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;240&quot; y=&quot;146&quot; width=&quot;230&quot; height=&quot;36&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;355&quot; y=&quot;169&quot;&gt;Cost = fair value&lt;/text&gt;
&lt;/svg&gt;
&lt;p&gt;&lt;em class=&quot;t&quot;&gt;Commercial substance&lt;/em&gt; vuol dire che lo scambio cambia davvero i flussi di cassa attesi dell&#x27;entity. La misura vale anche se l&#x27;asset ceduto non si può eliminare subito dal bilancio.&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 26 · IAS 38.33&lt;/span&gt; In una &lt;em class=&quot;t&quot;&gt;business combination&lt;/em&gt; (acquisizione del controllo di un&#x27;azienda, IFRS 3), il costo dell&#x27;intangible è il suo &lt;b&gt;fair value alla data di acquisizione&lt;/b&gt;.&lt;/p&gt;
&lt;p&gt;Conseguenza importante, non esplicitata nelle slide: la lista clienti o il marchio che l&#x27;azienda acquisita non aveva in bilancio possono comparire separatamente dal goodwill nel bilancio dell&#x27;acquirente, se identifiable. &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs3.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · IFRS 3 ↗&lt;/a&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 27&lt;/span&gt; Sviluppato dentro l&#x27;entity, senza terzi che fissino un prezzo. Se il costo non si può misurare, l&#x27;elemento &lt;b&gt;non si rileva&lt;/b&gt; come intangible. È il tema della prossima sezione.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;Dentro o fuori dal cost?&lt;/h4&gt;
&lt;div data-sorter&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;in&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Dazi di importazione su una licenza acquistata&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;in&quot;&gt;Dentro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;out&quot;&gt;Fuori&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;Fanno parte del purchase price, come le imposte non recuperabili. &lt;span class=&quot;s&quot;&gt;slide 22&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;out&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Campagna pubblicitaria per lanciare il nuovo prodotto&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;in&quot;&gt;Dentro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;out&quot;&gt;Fuori&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;I costi di introduzione di un prodotto, inclusi advertising e promozione, non fanno parte del cost. &lt;span class=&quot;s&quot;&gt;slide 23 · IAS 38.29&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;out&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Formazione del personale per operare in una nuova sede&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;in&quot;&gt;Dentro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;out&quot;&gt;Fuori&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;Sono costi per fare impresa in una nuova location o con nuovi clienti. &lt;span class=&quot;s&quot;&gt;slide 23 · IAS 38.29&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;out&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Quota di spese generali e amministrative&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;in&quot;&gt;Dentro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;out&quot;&gt;Fuori&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;Administration e general overhead sono esclusi. &lt;span class=&quot;s&quot;&gt;slide 23 · IAS 38.29&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;in&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Costo diretto per rendere il software pronto all&#x27;uso previsto&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;in&quot;&gt;Dentro&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;out&quot;&gt;Fuori&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;È un directly attributable cost. &lt;span class=&quot;s&quot;&gt;slide 22 · IAS 38.27&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;interni&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;8&lt;/span&gt;Internally generated: research e development&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 28&lt;/span&gt; Per gli asset interni il progetto si divide in due fasi, con esiti opposti.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 148&quot; role=&quot;img&quot; aria-label=&quot;Linea del tempo: fase di research a costo, fase di development capitalizzabile solo dopo i sei criteri, poi produzione commerciale&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ah2&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L8 4L0 8z&quot; fill=&quot;var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect class=&quot;boxa&quot; x=&quot;10&quot; y=&quot;36&quot; width=&quot;170&quot; height=&quot;54&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;95&quot; y=&quot;58&quot;&gt;Research&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;95&quot; y=&quot;77&quot;&gt;sempre expense&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;180&quot; y=&quot;36&quot; width=&quot;90&quot; height=&quot;54&quot;/&gt;&lt;text class=&quot;m sm&quot; x=&quot;225&quot; y=&quot;58&quot;&gt;development&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;225&quot; y=&quot;75&quot;&gt;ancora a costo&lt;/text&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;270&quot; y=&quot;36&quot; width=&quot;130&quot; height=&quot;54&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;335&quot; y=&quot;58&quot;&gt;Capitalise&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;335&quot; y=&quot;77&quot;&gt;6 criteri su 6&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;400&quot; y=&quot;36&quot; width=&quot;70&quot; height=&quot;54&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;m sm&quot; x=&quot;435&quot; y=&quot;58&quot;&gt;uso o&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;435&quot; y=&quot;75&quot;&gt;vendita&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M10 112H468&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path class=&quot;ad&quot; d=&quot;M270 18V112&quot;/&gt;&lt;text class=&quot;m sm&quot; x=&quot;270&quot; y=&quot;14&quot;&gt;criteri soddisfatti&lt;/text&gt;
&lt;text class=&quot;sm&quot; x=&quot;10&quot; y=&quot;132&quot;&gt;il tempo scorre&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;Research expenditure&lt;/h5&gt;&lt;p&gt;&lt;span class=&quot;s&quot;&gt;IAS 38.54–56&lt;/span&gt; Nessun intangible può nascere dalla research: in questa fase non si dimostra che esista un asset con benefici probabili. Va a &lt;em class=&quot;t&quot;&gt;expense&lt;/em&gt; (costo di conto economico) quando sostenuta.&lt;/p&gt;
&lt;p&gt;Esempi: ottenere nuove conoscenze; cercare, valutare e selezionare applicazioni dei risultati; cercare alternative per materiali, prodotti, processi; formulare, progettare e scegliere le alternative possibili.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;Development expenditure&lt;/h5&gt;&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 28&lt;/span&gt; Si applicano i risultati della ricerca per &lt;b&gt;pianificare la produzione&lt;/b&gt; di materiali, prodotti o processi nuovi o molto migliorati, prima della produzione commerciale o dell&#x27;uso.&lt;/p&gt;
&lt;p&gt;Si può &lt;em class=&quot;t&quot;&gt;capitalise&lt;/em&gt; (iscrivere la spesa nell&#x27;attivo anziché a costo) solo se si dimostrano tutti i sei criteri.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;I sei criteri: accendili tutti&lt;/h4&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 30 · IAS 38.57&lt;/span&gt; Sono cumulativi. Tocca ciascuno quando l&#x27;entity può dimostrarlo.&lt;/p&gt;
&lt;div id=&quot;crit&quot;&gt;
&lt;div class=&quot;crits&quot;&gt;
&lt;button class=&quot;crit&quot;&gt;&lt;span class=&quot;lamp&quot;&gt;a&lt;/span&gt;&lt;span&gt;&lt;b&gt;Technical feasibility&lt;/b&gt;: è tecnicamente possibile completarlo per l&#x27;uso o la vendita&lt;/span&gt;&lt;/button&gt;
&lt;button class=&quot;crit&quot;&gt;&lt;span class=&quot;lamp&quot;&gt;b&lt;/span&gt;&lt;span&gt;&lt;b&gt;Intention&lt;/b&gt; di completarlo e di usarlo o venderlo&lt;/span&gt;&lt;/button&gt;
&lt;button class=&quot;crit&quot;&gt;&lt;span class=&quot;lamp&quot;&gt;c&lt;/span&gt;&lt;span&gt;&lt;b&gt;Ability&lt;/b&gt;: l&#x27;entity è in grado di usarlo o venderlo&lt;/span&gt;&lt;/button&gt;
&lt;button class=&quot;crit&quot;&gt;&lt;span class=&quot;lamp&quot;&gt;d&lt;/span&gt;&lt;span&gt;&lt;b&gt;Probable future economic benefits&lt;/b&gt;: si mostra come, per esempio con un mercato per l&#x27;output o per l&#x27;asset, oppure con la sua utilità se è per uso interno&lt;/span&gt;&lt;/button&gt;
&lt;button class=&quot;crit&quot;&gt;&lt;span class=&quot;lamp&quot;&gt;e&lt;/span&gt;&lt;span&gt;&lt;b&gt;Resources&lt;/b&gt;: risorse tecniche, finanziarie e di altro tipo adeguate a completarlo e usarlo o venderlo&lt;/span&gt;&lt;/button&gt;
&lt;button class=&quot;crit&quot;&gt;&lt;span class=&quot;lamp&quot;&gt;f&lt;/span&gt;&lt;span&gt;&lt;b&gt;Reliable measurement&lt;/b&gt;: la spesa attribuibile durante lo sviluppo è misurabile in modo attendibile&lt;/span&gt;&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;verdict&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;meta&quot; style=&quot;margin-top:8px&quot;&gt;Mnemonica &lt;span class=&quot;own&quot;&gt;non è nelle slide&lt;/span&gt;: P.I.R.A.T.E. = Probable benefits, Intention, Resources, Ability, Technical feasibility, Expenditure measured.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Oltre le slide.&lt;/b&gt; Se la fase di research non si distingue da quella di development, tutta la spesa si tratta come research (IAS 38.53). Non si rilevano mai come asset, se generati internamente, il goodwill (38.48) né brands, mastheads, publishing titles e customer lists (38.63). &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias38.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · testo IAS 38 ↗&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;sito&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;9&lt;/span&gt;Esempio: il sito di e-commerce&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 31–33&lt;/span&gt; Scorri gli anni e guarda dove finisce ogni euro. Il grafico mostra il saldo dell&#x27;asset e la spesa cumulata in &lt;em class=&quot;t&quot;&gt;profit or loss&lt;/em&gt; (P&amp;amp;L, il conto economico).&lt;/p&gt;
&lt;div class=&quot;stepper&quot; id=&quot;web&quot;&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 232&quot; role=&quot;img&quot; aria-label=&quot;Grafico a due barre: valore dell&#x27;asset sito web e costi cumulati in profit and loss&quot; style=&quot;max-width:430px&quot;&gt;
&lt;line class=&quot;ax&quot; x1=&quot;30&quot; x2=&quot;450&quot; y1=&quot;210&quot; y2=&quot;210&quot;/&gt;
&lt;rect id=&quot;webA&quot; class=&quot;fc&quot; x=&quot;100&quot; y=&quot;210&quot; width=&quot;90&quot; height=&quot;0&quot;/&gt;&lt;text id=&quot;webAt&quot; class=&quot;m b&quot; x=&quot;145&quot; y=&quot;203&quot;&gt;&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;145&quot; y=&quot;227&quot;&gt;Website asset&lt;/text&gt;
&lt;rect id=&quot;webP&quot; class=&quot;fa&quot; x=&quot;290&quot; y=&quot;210&quot; width=&quot;90&quot; height=&quot;0&quot;/&gt;&lt;text id=&quot;webPt&quot; class=&quot;m b&quot; x=&quot;335&quot; y=&quot;203&quot;&gt;&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;335&quot; y=&quot;227&quot;&gt;P&amp;amp;L cumulato&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;step&quot; data-a=&quot;0&quot; data-p=&quot;60&quot;&gt;&lt;h5&gt;20X5: research&lt;/h5&gt;&lt;p&gt;L&#x27;entity studia come progettare il sito e quali sistemi di sicurezza servono. Costo pieno &lt;b&gt;€ 60.000&lt;/b&gt;: siamo in research, quindi expense.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; data-a=&quot;25&quot; data-p=&quot;60&quot; hidden&gt;&lt;h5&gt;20X6, inizio: si passa al development&lt;/h5&gt;&lt;p&gt;Un consulente chiede € 50.000, metà all&#x27;avvio. I &lt;b&gt;€ 25.000&lt;/b&gt; pagati vengono capitalizzati nel conto «Website asset».&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; data-a=&quot;0&quot; data-p=&quot;85&quot; hidden&gt;&lt;h5&gt;20X6, fine: arrivano i dubbi&lt;/h5&gt;&lt;p&gt;Firewall e sicurezza creano difficoltà: non è chiaro se il sito sia fattibile né se l&#x27;entity riuscirà a usarlo. Il criterio non regge, quindi i € 25.000 si eliminano e vanno a expense.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; data-a=&quot;55&quot; data-p=&quot;85&quot; hidden&gt;&lt;h5&gt;20X7: tutto torna a posto&lt;/h5&gt;&lt;p&gt;Nuovo software di sicurezza, test riuscito, mercato disponibile, lancio previsto a inizio anno nuovo. Si capitalizzano i costi dell&#x27;anno: secondo saldo al consulente € 25.000 + software € 30.000 = &lt;b&gt;€ 55.000&lt;/b&gt;. I € 25.000 già spesati &lt;b&gt;non si riprendono&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; data-a=&quot;70&quot; data-p=&quot;85&quot; hidden&gt;&lt;h5&gt;Periodo successivo: l&#x27;upgrade&lt;/h5&gt;&lt;p&gt;Il sito viene aggiornato per vendere nuovi prodotti importati, a &lt;b&gt;€ 15.000&lt;/b&gt;. Benefici probabili e costo misurabile: si capitalizza &lt;span class=&quot;s&quot;&gt;slide 38&lt;/span&gt;. Cassa totale 60 + 50 + 30 + 15 = € 155.000, cioè 70 in asset e 85 in P&amp;amp;L.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;st-nav&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Prima&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Dopo →&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;flag&quot;&gt;&lt;b&gt;Da chiarire.&lt;/b&gt; La slide 33 scrive «could not &lt;i&gt;reserve&lt;/i&gt;»: è un refuso per &lt;i&gt;reverse&lt;/i&gt;. La regola è in IAS 38.71: una spesa già rilevata come expense non può diventare parte del costo in seguito. Inoltre, IAS 38.65 capitalizza solo dalla data in cui i criteri sono soddisfatti per la prima volta; la slide prende tutti i costi del 20X7, che in un caso reale andrebbero separati per data. &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias38.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · IAS 38.65, 38.71 ↗&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Oltre le slide.&lt;/b&gt; Per i siti web esiste un&#x27;interpretazione apposita, SIC-32: fase di planning a costo come la research, sviluppo di applicazioni e infrastruttura capitalizzabile a certe condizioni, operating a costo salvo i criteri di IAS 38.18. &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/sic32.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · SIC-32 ↗&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica, parte II&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché per un acquisto separato il criterio di probabilità è sempre soddisfatto?&lt;/summary&gt;&lt;div&gt;Perché il prezzo riflette già le attese sui benefici futuri: l&#x27;incertezza riguarda tempi e importo, non l&#x27;esistenza di un inflow. &lt;span class=&quot;s&quot;&gt;slide 21 · IAS 38.25&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un intangible ottenuto in una business combination a quale valore entra?&lt;/summary&gt;&lt;div&gt;Al fair value alla data di acquisizione, che ne costituisce il cost. &lt;span class=&quot;s&quot;&gt;slide 26 · IAS 38.33&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Scambio senza commercial substance: a quanto si iscrive il nuovo asset?&lt;/summary&gt;&lt;div&gt;Al carrying amount dell&#x27;asset ceduto. &lt;span class=&quot;s&quot;&gt;slide 25 · IAS 38.45&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;A fine anno 3 i sei criteri sono soddisfatti. Le spese di development degli anni 1 e 2, già a costo, si possono riprendere?&lt;/summary&gt;&lt;div&gt;No, non si fa reverse del write-off. &lt;span class=&quot;s&quot;&gt;slide 33&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quale dei sei criteri è venuto meno nel sito web a fine 20X6?&lt;/summary&gt;&lt;div&gt;La technical feasibility e la ability di usarlo con successo: «unsure if this website would be feasible». &lt;span class=&quot;s&quot;&gt;slide 32&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;p-slate&quot; id=&quot;parte3&quot; style=&quot;scroll-margin-top:50px&quot;&gt;
&lt;div class=&quot;part&quot;&gt;&lt;div class=&quot;n&quot;&gt;Parte III&lt;/div&gt;&lt;h2&gt;La vita dopo l&#x27;ingresso&lt;/h2&gt;&lt;p&gt;Scegliere un modello, ripartire il costo negli anni, controllare che il valore regga.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;t&quot; id=&quot;modelli&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;10&lt;/span&gt;Subsequent measurement: cost o revaluation&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 34&lt;/span&gt; Dopo la rilevazione iniziale l&#x27;entity sceglie tra due modelli.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;Cost model&lt;/h5&gt;&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 35 · IAS 38.74&lt;/span&gt; Cost − accumulated amortisation − accumulated impairment losses.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;Revaluation model&lt;/h5&gt;&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 36 · IAS 38.75&lt;/span&gt; Fair value alla data di rivalutazione − amortisation successiva − impairment losses successive.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Il revaluation model ha tre vincoli &lt;span class=&quot;s&quot;&gt;slide 36&lt;/span&gt;:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;il fair value si misura con riferimento a un &lt;em class=&quot;t&quot;&gt;active market&lt;/em&gt; (mercato attivo, in cui si scambiano con continuità beni omogenei a prezzi osservabili);&lt;/li&gt;
&lt;li&gt;le rivalutazioni sono abbastanza regolari da evitare che, a fine esercizio, il carrying amount si discosti in modo materiale dal fair value;&lt;/li&gt;
&lt;li&gt;vale per tutta la &lt;b&gt;class&lt;/b&gt; di asset, salvo gli asset della classe per cui non esiste un active market &lt;span class=&quot;s&quot;&gt;IAS 38.72&lt;/span&gt;.&lt;/li&gt;&lt;/ul&gt;
&lt;div id=&quot;rv&quot; class=&quot;stepper&quot; style=&quot;padding-bottom:14px&quot;&gt;
&lt;div class=&quot;own&quot;&gt;esempio costruito: asset da € 100.000, vita 10 anni, straight-line&lt;/div&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 240&quot; role=&quot;img&quot; aria-label=&quot;Grafico del carrying amount con cost model e revaluation model&quot; style=&quot;margin-top:8px&quot;&gt;&lt;g id=&quot;rvG&quot;&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;p class=&quot;meta&quot; style=&quot;margin:2px 0;text-align:center&quot;&gt;Tratteggio: cost model. Linea piena: revaluation model. Asse x: anni.&lt;/p&gt;
&lt;div class=&quot;ctl&quot;&gt;
&lt;label&gt;Data della rivaluazione &lt;output id=&quot;rvKo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;rvK&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;9&quot; step=&quot;1&quot; value=&quot;4&quot;&gt;&lt;/label&gt;
&lt;label&gt;Fair value a quella data &lt;output id=&quot;rvFo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;rvF&quot; type=&quot;range&quot; min=&quot;10000&quot; max=&quot;120000&quot; step=&quot;1000&quot; value=&quot;70000&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;rvRead&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Oltre le slide.&lt;/b&gt; Un aumento va in &lt;em class=&quot;t&quot;&gt;other comprehensive income&lt;/em&gt; (OCI, componenti di reddito fuori dal P&amp;amp;L) e si accumula nella &lt;em class=&quot;t&quot;&gt;revaluation surplus&lt;/em&gt;, salvo che storni una precedente svalutazione a P&amp;amp;L; una diminuzione va a P&amp;amp;L, ma prima riduce l&#x27;eventuale surplus esistente (38.85–86). Gli active market per intangible sono rari (38.78): per questo il cost model è il caso comune. &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias38.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · IAS 38.78, 38.85–86 ↗&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;subseq&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;11&lt;/span&gt;Subsequent expenditure&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 37 · IAS 38.20&lt;/span&gt; Sono le spese sostenute dopo la rilevazione iniziale di un intangible acquisito o dopo il completamento di uno interno. Solo &lt;b&gt;di rado&lt;/b&gt; entrano nel carrying amount, per due motivi: di solito mantengono i benefici esistenti, senza crearne di nuovi, ed è difficile attribuirle a quell&#x27;asset anziché all&#x27;impresa nel suo insieme.&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;q&gt;Subsequent expenditure on brands, mastheads, publishing titles, customer lists and items similar in substance is always recognised in profit or loss as incurred.&lt;/q&gt;&lt;span class=&quot;s&quot;&gt;IAS 38.20 · slide 37&lt;/span&gt;&lt;br&gt;Vale sia se acquisiti sia se generati internamente, perché questa spesa non si distingue da quella per sviluppare il business. &lt;em class=&quot;t&quot;&gt;Mastheads&lt;/em&gt; sono le testate giornalistiche, &lt;em class=&quot;t&quot;&gt;publishing titles&lt;/em&gt; i titoli editoriali.&lt;/div&gt;
&lt;figure&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 138&quot; role=&quot;img&quot; aria-label=&quot;Decisione sulle spese successive&quot;&gt;
&lt;rect class=&quot;box&quot; x=&quot;8&quot; y=&quot;8&quot; width=&quot;176&quot; height=&quot;48&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m&quot; x=&quot;96&quot; y=&quot;28&quot;&gt;Brand, testata, lista&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;96&quot; y=&quot;45&quot;&gt;clienti o simili?&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;8&quot; y=&quot;80&quot; width=&quot;176&quot; height=&quot;50&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m&quot; x=&quot;96&quot; y=&quot;101&quot;&gt;Soddisfa definizione&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;96&quot; y=&quot;118&quot;&gt;e recognition criteria?&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M96 56V80&quot;/&gt;&lt;text class=&quot;sm&quot; x=&quot;104&quot; y=&quot;72&quot;&gt;no&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M184 32H300&quot;/&gt;&lt;text class=&quot;sm&quot; x=&quot;232&quot; y=&quot;26&quot;&gt;sì&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M184 90H300&quot;/&gt;&lt;text class=&quot;sm&quot; x=&quot;232&quot; y=&quot;84&quot;&gt;no&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M184 118H300&quot;/&gt;&lt;text class=&quot;sm&quot; x=&quot;232&quot; y=&quot;112&quot;&gt;sì (raro)&lt;/text&gt;
&lt;rect class=&quot;boxa&quot; x=&quot;300&quot; y=&quot;8&quot; width=&quot;170&quot; height=&quot;92&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;385&quot; y=&quot;52&quot;&gt;Expense&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;385&quot; y=&quot;70&quot;&gt;in profit or loss&lt;/text&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;300&quot; y=&quot;106&quot; width=&quot;170&quot; height=&quot;28&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;385&quot; y=&quot;125&quot;&gt;Capitalise&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;L&#x27;upgrade del sito da € 15.000 &lt;span class=&quot;s&quot;&gt;slide 38&lt;/span&gt; è il caso raro: permette di vendere nuovi prodotti, è misurabile e porta benefici probabili, perciò si capitalizza.&lt;/p&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;amort&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;12&lt;/span&gt;Amortisation&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 39–40&lt;/span&gt; L&#x27;&lt;em class=&quot;t&quot;&gt;amortisation&lt;/em&gt; (ammortamento) ripartisce in modo sistematico il costo sulla vita utile attesa, fino al &lt;em class=&quot;t&quot;&gt;residual value&lt;/em&gt; (valore residuo stimato a fine uso). È concettualmente uguale alla &lt;em class=&quot;t&quot;&gt;depreciation&lt;/em&gt; di property, plant and equipment: cambia solo il nome.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 148&quot; role=&quot;img&quot; aria-label=&quot;Useful life finita: si ammortizza. Useful life indefinita: niente ammortamento, revisione ogni periodo e impairment test annuale&quot;&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;170&quot; y=&quot;6&quot; width=&quot;140&quot; height=&quot;34&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;240&quot; y=&quot;28&quot;&gt;Useful life&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M240 40V52M120 52H360M120 52V64M360 52V64&quot;/&gt;
&lt;rect class=&quot;box&quot; x=&quot;16&quot; y=&quot;64&quot; width=&quot;208&quot; height=&quot;76&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;120&quot; y=&quot;86&quot;&gt;Finite&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;120&quot; y=&quot;106&quot;&gt;si ammortizza su questo periodo;&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;120&quot; y=&quot;124&quot;&gt;impairment test se ci sono indizi&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;256&quot; y=&quot;64&quot; width=&quot;208&quot; height=&quot;76&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;360&quot; y=&quot;86&quot;&gt;Indefinite&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;360&quot; y=&quot;106&quot;&gt;niente amortisation; vita rivista&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;360&quot; y=&quot;124&quot;&gt;ogni periodo; test annuale&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 41–42 · IAS 38.97–98&lt;/span&gt; Il metodo deve riflettere il &lt;b&gt;modello di consumo&lt;/b&gt; dei benefici, applicato con costanza da un periodo all&#x27;altro salvo che il modello cambi. Se non è determinabile in modo attendibile, si usa la &lt;b&gt;straight-line&lt;/b&gt;.&lt;/p&gt;
&lt;div id=&quot;am&quot; class=&quot;stepper&quot; style=&quot;padding-bottom:14px&quot;&gt;
&lt;div data-tabs id=&quot;amT&quot;&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Metodo di amortisation&quot;&gt;
&lt;button role=&quot;tab&quot;&gt;Straight-line&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Diminishing balance&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Units of production&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p class=&quot;formula&quot; style=&quot;border:0;margin:6px 0&quot;&gt;Quota = (cost − residual value) ÷ useful life&lt;/p&gt;&lt;p style=&quot;font-size:15px&quot;&gt;Quota uguale ogni anno. È anche il metodo di ripiego.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p class=&quot;formula&quot; style=&quot;border:0;margin:6px 0&quot;&gt;Quota = tasso × carrying amount di inizio anno&lt;/p&gt;&lt;p style=&quot;font-size:15px&quot;&gt;Quote alte all&#x27;inizio, adatta a benefici che si consumano presto. Qui il tasso è 2 ÷ vita utile, con l&#x27;ultimo anno che arriva al residual value &lt;span class=&quot;own&quot;&gt;scelta illustrativa&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p class=&quot;formula&quot; style=&quot;border:0;margin:6px 0&quot;&gt;Quota = depreciable amount × unità dell&#x27;anno ÷ unità totali&lt;/p&gt;&lt;p style=&quot;font-size:15px&quot;&gt;Segue l&#x27;uso effettivo. Il profilo produttivo, a campana, è inventato &lt;span class=&quot;own&quot;&gt;scelta illustrativa&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 240&quot; role=&quot;img&quot; aria-label=&quot;Grafico del carrying amount e delle quote annue di amortisation&quot; style=&quot;margin-top:12px&quot;&gt;&lt;g id=&quot;amG&quot;&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;p class=&quot;meta&quot; style=&quot;margin:2px 0;text-align:center&quot;&gt;Linea piena: carrying amount col metodo scelto. Tratteggi: gli altri due. Barre: quota annua. Asse x: anni.&lt;/p&gt;
&lt;div class=&quot;ctl&quot;&gt;
&lt;label&gt;Cost &lt;output id=&quot;amCo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;amC&quot; type=&quot;range&quot; min=&quot;10000&quot; max=&quot;200000&quot; step=&quot;5000&quot; value=&quot;100000&quot;&gt;&lt;/label&gt;
&lt;label&gt;Residual value &lt;output id=&quot;amRo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;amR&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;40&quot; step=&quot;5&quot; value=&quot;0&quot;&gt;&lt;/label&gt;
&lt;label&gt;Useful life &lt;output id=&quot;amNo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;amN&quot; type=&quot;range&quot; min=&quot;2&quot; max=&quot;15&quot; step=&quot;1&quot; value=&quot;5&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;amRead&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;Che cosa si rivede a ogni chiusura&lt;/h4&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Elemento&lt;/th&gt;&lt;th&gt;Quando&lt;/th&gt;&lt;th&gt;Se cambia&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Residual value&lt;/td&gt;&lt;td&gt;Almeno a ogni financial year-end &lt;span class=&quot;s&quot;&gt;38.102&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Si aggiorna la stima&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Amortisation period e method, vita finita&lt;/td&gt;&lt;td&gt;Almeno a ogni financial year-end &lt;span class=&quot;s&quot;&gt;38.104&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Si adeguano: &lt;em class=&quot;t&quot;&gt;change in accounting estimate&lt;/em&gt; (IAS 8)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Useful life indefinita&lt;/td&gt;&lt;td&gt;Ogni periodo &lt;span class=&quot;s&quot;&gt;38.109&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Da indefinite a finite: change in accounting estimate (IAS 8)&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;meta&quot;&gt;Tabella da &lt;span class=&quot;s&quot;&gt;slide 43&lt;/span&gt;. Le righe sono tratte dalle slide; «si aggiorna la stima» è una spiegazione, non testo della slide.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Oltre le slide.&lt;/b&gt; Un &lt;em class=&quot;t&quot;&gt;change in estimate&lt;/em&gt; si applica prospetticamente: non si rifanno gli anni passati. Dal 1° gennaio 2027 IAS 8 si intitola &lt;i&gt;Basis of Preparation of Financial Statements&lt;/i&gt;, per effetto di IFRS 18. Il residual value si presume zero salvo impegno di un terzo ad acquistare o active market (38.100); «indefinite» non vuol dire «infinite» (38.91); l&#x27;amortisation inizia quando l&#x27;asset è disponibile per l&#x27;uso (38.97). Basare l&#x27;amortisation sui revenue si presume inappropriato (38.98A).
&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-8-basis-of-preparation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · IAS 8 ↗&lt;/a&gt; &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias38.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · IAS 38 ↗&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;impair&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;13&lt;/span&gt;Impairment&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 44&lt;/span&gt; Un asset è &lt;em class=&quot;t&quot;&gt;impaired&lt;/em&gt; (ha subito una perdita durevole di valore) se il carrying amount supera il &lt;em class=&quot;t&quot;&gt;recoverable amount&lt;/em&gt;, cioè il valore recuperabile. Per calcolarlo le slide rinviano a IAS 36.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;Vita finita&lt;/h5&gt;&lt;p&gt;Test solo se ci sono &lt;b&gt;evidenze&lt;/b&gt; di impairment.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;Vita indefinita&lt;/h5&gt;&lt;p&gt;Test &lt;b&gt;ogni anno&lt;/b&gt;, anche senza indizi, oltre che quando ci sono evidenze.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Oltre le slide: la formula di IAS 36.&lt;/b&gt; Recoverable amount = il maggiore tra &lt;em class=&quot;t&quot;&gt;fair value less costs of disposal&lt;/em&gt; (FVLCD, quanto incasseresti vendendo, al netto dei costi) e &lt;em class=&quot;t&quot;&gt;value in use&lt;/em&gt; (VIU, valore attuale dei flussi futuri attesi dall&#x27;uso). Il test annuale vale anche per gli intangible non ancora disponibili per l&#x27;uso e per il goodwill. Se il singolo asset non genera flussi autonomi, il test si fa sulla &lt;em class=&quot;t&quot;&gt;cash-generating unit&lt;/em&gt;. &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias36.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;fonte esterna · IAS 36 ↗&lt;/a&gt;&lt;/div&gt;
&lt;div id=&quot;imp&quot; class=&quot;stepper&quot; style=&quot;padding-bottom:14px&quot;&gt;
&lt;div class=&quot;own&quot;&gt;esempio costruito: prova il test&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;
&lt;label&gt;Carrying amount &lt;output id=&quot;impAo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;impA&quot; type=&quot;range&quot; min=&quot;10000&quot; max=&quot;150000&quot; step=&quot;1000&quot; value=&quot;90000&quot;&gt;&lt;/label&gt;
&lt;label&gt;FVLCD &lt;output id=&quot;impFo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;impF&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;150000&quot; step=&quot;1000&quot; value=&quot;60000&quot;&gt;&lt;/label&gt;
&lt;label&gt;VIU &lt;output id=&quot;impVo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;impV&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;150000&quot; step=&quot;1000&quot; value=&quot;72000&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;bars&quot;&gt;
&lt;div class=&quot;bar m&quot;&gt;&lt;span&gt;Carrying amount&lt;/span&gt;&lt;div class=&quot;tr&quot;&gt;&lt;div class=&quot;fl&quot; id=&quot;impB1&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;span&gt;Recoverable&lt;/span&gt;&lt;div class=&quot;tr&quot;&gt;&lt;div class=&quot;fl&quot; id=&quot;impB2&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;bar a&quot;&gt;&lt;span&gt;Impairment loss&lt;/span&gt;&lt;div class=&quot;tr&quot;&gt;&lt;div class=&quot;fl&quot; id=&quot;impB3&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;meta&quot; style=&quot;margin:0&quot;&gt;Carrying &lt;span id=&quot;impT1&quot;&gt;&lt;/span&gt; · Recoverable &lt;span id=&quot;impT2&quot;&gt;&lt;/span&gt; · Loss &lt;span id=&quot;impT3&quot;&gt;&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;read&quot; id=&quot;impRead&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica, parte III&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Revaluation model su un marchio: si può rivalutare solo quello?&lt;/summary&gt;&lt;div&gt;No: tutta la class va col revaluation model, salvo gli asset della classe senza active market. &lt;span class=&quot;s&quot;&gt;slide 36 · IAS 38.72&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quale metodo si usa se il consumo dei benefici non è determinabile?&lt;/summary&gt;&lt;div&gt;La straight-line. &lt;span class=&quot;s&quot;&gt;slide 42 · IAS 38.97&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un intangible con vita indefinita si ammortizza? Che controlli richiede?&lt;/summary&gt;&lt;div&gt;Non si ammortizza; la useful life si rivede ogni periodo e l&#x27;impairment test è annuale anche senza indizi. &lt;span class=&quot;s&quot;&gt;slide 40, 43, 44&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Spendi per rilanciare un brand già iscritto. Puoi aggiungere la spesa all&#x27;asset?&lt;/summary&gt;&lt;div&gt;No: la subsequent expenditure sui brand va sempre in profit or loss. &lt;span class=&quot;s&quot;&gt;slide 37 · IAS 38.20&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Carrying amount 100, FVLCD 80, VIU 90. Qual è la loss?&lt;/summary&gt;&lt;div&gt;Recoverable amount = 90, il maggiore. Loss = 100 − 90 = 10. &lt;span class=&quot;own&quot;&gt;esempio costruito&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Come si contabilizza il passaggio da useful life indefinite a finite?&lt;/summary&gt;&lt;div&gt;Come change in accounting estimate secondo IAS 8. &lt;span class=&quot;s&quot;&gt;slide 43 · IAS 38.109&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;p-brick&quot; id=&quot;parte4&quot; style=&quot;scroll-margin-top:50px&quot;&gt;
&lt;div class=&quot;part&quot;&gt;&lt;div class=&quot;n&quot;&gt;Parte IV&lt;/div&gt;&lt;h2&gt;Uscita, informativa, casi&lt;/h2&gt;&lt;p&gt;Come si chiude la vita dell&#x27;asset, che cosa va raccontato nelle note e come si ragiona su un caso completo.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;t&quot; id=&quot;derec&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;14&lt;/span&gt;Derecognition&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 45 · IAS 38.112–114&lt;/span&gt; La &lt;em class=&quot;t&quot;&gt;derecognition&lt;/em&gt; (eliminazione dal bilancio) avviene in due casi: alla &lt;em class=&quot;t&quot;&gt;disposal&lt;/em&gt; (cessione), oppure quando dall&#x27;uso o dalla cessione non si attendono più benefici.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Gain or loss = net disposal proceeds − carrying amount&lt;/div&gt;
&lt;ul&gt;&lt;li&gt;Va in profit or loss alla derecognition, salvo che IFRS 16 disponga altrimenti per un &lt;em class=&quot;t&quot;&gt;sale and leaseback&lt;/em&gt; (vendita con ripresa in leasing).&lt;/li&gt;
&lt;li&gt;I &lt;b&gt;gain non sono revenue&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;La disposal può avvenire per vendita, finance lease o donazione. La data è quella in cui chi riceve ottiene il control, con le regole IFRS 15 sul soddisfacimento della performance obligation.&lt;/li&gt;&lt;/ul&gt;
&lt;div id=&quot;der&quot; class=&quot;stepper&quot; style=&quot;padding-bottom:14px&quot;&gt;
&lt;div class=&quot;own&quot;&gt;esempio costruito&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;
&lt;label&gt;Carrying amount &lt;output id=&quot;derAo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;derA&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100000&quot; step=&quot;1000&quot; value=&quot;40000&quot;&gt;&lt;/label&gt;
&lt;label&gt;Net disposal proceeds &lt;output id=&quot;derPo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;derP&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100000&quot; step=&quot;1000&quot; value=&quot;55000&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;derRead&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;discl&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;15&lt;/span&gt;Disclosure&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 46–50&lt;/span&gt; L&#x27;informativa si dà per &lt;b&gt;class&lt;/b&gt; di intangible, separando gli asset generati internamente dagli altri.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Obblighi di disclosure&quot;&gt;
&lt;button role=&quot;tab&quot;&gt;Per ogni class&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Casi specifici&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Revaluation&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 46–47 · IAS 38.118&lt;/span&gt;&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;
&lt;li&gt;useful lives indefinite o finite; se finite, durate o tassi di amortisation;&lt;/li&gt;
&lt;li&gt;amortisation methods per le vite finite;&lt;/li&gt;
&lt;li&gt;&lt;em class=&quot;t&quot;&gt;gross carrying amount&lt;/em&gt; (valore lordo) e accumulated amortisation, aggregata con le impairment losses, a inizio e fine periodo;&lt;/li&gt;
&lt;li&gt;le voci del &lt;em class=&quot;t&quot;&gt;statement of comprehensive income&lt;/em&gt; che includono l&#x27;amortisation;&lt;/li&gt;
&lt;li&gt;una &lt;em class=&quot;t&quot;&gt;reconciliation&lt;/em&gt; (prospetto di raccordo) del carrying amount tra inizio e fine periodo.&lt;/li&gt;
&lt;/ol&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 110&quot; role=&quot;img&quot; aria-label=&quot;Esempio di prospetto di raccordo con additions, revaluations, amortisation, impairment e disposals&quot;&gt;
&lt;rect class=&quot;box&quot; x=&quot;4&quot; y=&quot;28&quot; width=&quot;70&quot; height=&quot;46&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;m sm&quot; x=&quot;39&quot; y=&quot;48&quot;&gt;Inizio&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;39&quot; y=&quot;64&quot;&gt;periodo&lt;/text&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;86&quot; y=&quot;28&quot; width=&quot;62&quot; height=&quot;46&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;117&quot; y=&quot;48&quot;&gt;+&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;117&quot; y=&quot;66&quot;&gt;additions&lt;/text&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;152&quot; y=&quot;28&quot; width=&quot;66&quot; height=&quot;46&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;185&quot; y=&quot;48&quot;&gt;±&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;185&quot; y=&quot;66&quot;&gt;revaluat.&lt;/text&gt;
&lt;rect class=&quot;boxa&quot; x=&quot;222&quot; y=&quot;28&quot; width=&quot;62&quot; height=&quot;46&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;253&quot; y=&quot;48&quot;&gt;−&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;253&quot; y=&quot;66&quot;&gt;amortis.&lt;/text&gt;
&lt;rect class=&quot;boxa&quot; x=&quot;288&quot; y=&quot;28&quot; width=&quot;62&quot; height=&quot;46&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;319&quot; y=&quot;48&quot;&gt;−&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;319&quot; y=&quot;66&quot;&gt;impairm.&lt;/text&gt;
&lt;rect class=&quot;boxa&quot; x=&quot;354&quot; y=&quot;28&quot; width=&quot;56&quot; height=&quot;46&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;382&quot; y=&quot;48&quot;&gt;−&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;382&quot; y=&quot;66&quot;&gt;disposals&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;416&quot; y=&quot;28&quot; width=&quot;60&quot; height=&quot;46&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;m sm&quot; x=&quot;446&quot; y=&quot;48&quot;&gt;Fine&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;446&quot; y=&quot;64&quot;&gt;periodo&lt;/text&gt;
&lt;text class=&quot;sm m&quot; x=&quot;240&quot; y=&quot;96&quot;&gt;La reconciliation in una riga&lt;/text&gt;
&lt;/svg&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 48–49 · IAS 38.122&lt;/span&gt;&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;
&lt;li&gt;vita indefinita: carrying amount e &lt;b&gt;motivi&lt;/b&gt; della valutazione, con i fattori determinanti;&lt;/li&gt;
&lt;li&gt;singolo asset &lt;b&gt;material&lt;/b&gt; (rilevante per il bilancio): descrizione, carrying amount, periodo residuo di amortisation;&lt;/li&gt;
&lt;li&gt;ottenuti con &lt;em class=&quot;t&quot;&gt;government grant&lt;/em&gt; (contributo pubblico) e iscritti al fair value: fair value iniziale, carrying amount, modello usato dopo la rilevazione;&lt;/li&gt;
&lt;li&gt;asset con titolo limitato, e carrying amount di quelli &lt;em class=&quot;t&quot;&gt;pledged as security&lt;/em&gt; (dati in garanzia);&lt;/li&gt;
&lt;li&gt;impegni contrattuali per acquistare intangible.&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 50 · IAS 38.124&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;per class: data effettiva della revaluation; carrying amount rivalutato; carrying amount che si avrebbe col cost model;&lt;/li&gt;
&lt;li&gt;la &lt;b&gt;revaluation surplus&lt;/b&gt; degli intangible a inizio e fine periodo, le variazioni e gli eventuali limiti alla distribuzione ai soci.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;alfa&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;16&lt;/span&gt;Caso Alfa: la riorganizzazione&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 51–52&lt;/span&gt; Alfa ha due stabilimenti, Z e X, in città diverse. Il 01/01/20X0 riorganizza: chiude X, Z resta l&#x27;unico attivo, compra nuovi macchinari. Come tratta IAS 38 questi costi? Prova tu: &lt;b&gt;SFP&lt;/b&gt; (statement of financial position, cioè asset) o &lt;b&gt;IS&lt;/b&gt; (income statement, cioè expense)?&lt;/p&gt;
&lt;div data-sorter&gt;
&lt;div class=&quot;tot&quot;&gt;&lt;div&gt;&lt;b data-t=&quot;sfp&quot;&gt;&lt;/b&gt;in SFP&lt;/div&gt;&lt;div&gt;&lt;b data-t=&quot;is&quot;&gt;&lt;/b&gt;in IS&lt;/div&gt;&lt;div&gt;&lt;b data-t=&quot;n&quot;&gt;&lt;/b&gt;classificati&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;is&quot; data-amt=&quot;1000000&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Chiusura stabilimento X · € 1.000.000&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;sfp&quot;&gt;SFP&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;is&quot;&gt;IS&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;b&gt;IS.&lt;/b&gt; Non ci sono future economic benefits. &lt;span class=&quot;s&quot;&gt;slide 53&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;is&quot; data-amt=&quot;90000&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Feasibility study · € 90.000&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;sfp&quot;&gt;SFP&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;is&quot;&gt;IS&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;b&gt;IS.&lt;/b&gt; È come una spesa di research: expense quando sostenuta. &lt;span class=&quot;s&quot;&gt;slide 53&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;is&quot; data-amt=&quot;50000&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Reinstatement workers · € 50.000&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;sfp&quot;&gt;SFP&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;is&quot;&gt;IS&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;b&gt;IS.&lt;/b&gt; I lavoratori possono lasciare il lavoro, quindi non c&#x27;è control. La slide non definisce la voce: si può intendere come costo per ricollocarli. &lt;span class=&quot;s&quot;&gt;slide 54&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;sfp&quot; data-amt=&quot;550000&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Consultancy costs · € 550.000&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;sfp&quot;&gt;SFP&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;is&quot;&gt;IS&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;b&gt;SFP.&lt;/b&gt; Development expenditure: capitalizzabile, ma solo dimostrando tutti i sei criteri. &lt;span class=&quot;s&quot;&gt;slide 54&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
