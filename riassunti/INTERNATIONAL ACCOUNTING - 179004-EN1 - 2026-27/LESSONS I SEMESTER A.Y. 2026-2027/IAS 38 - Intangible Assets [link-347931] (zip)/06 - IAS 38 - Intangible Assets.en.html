&lt;div class=&quot;sort-item&quot; data-a=&quot;is&quot; data-amt=&quot;50000&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Reinstatement workers · € 50,000&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;sfp&quot;&gt;SFP&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;is&quot;&gt;IS&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;b&gt;IS.&lt;/b&gt; Workers can leave their jobs, so there is no control. The slide does not define this item: it can be read as the cost of redeploying them. &lt;span class=&quot;s&quot;&gt;slide 54&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;sfp&quot; data-amt=&quot;550000&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Consultancy costs · € 550,000&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;sfp&quot;&gt;SFP&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;is&quot;&gt;IS&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;b&gt;SFP.&lt;/b&gt; Development expenditure: capitalisable, but only if all six criteria are demonstrated. &lt;span class=&quot;s&quot;&gt;slide 54&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;is&quot; data-amt=&quot;30000&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Initial loss of efficiency · € 30,000&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;sfp&quot;&gt;SFP&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;is&quot;&gt;IS&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;b&gt;IS.&lt;/b&gt; It is not an intangible, even if there will be benefits in the future: the six criteria are not met. &lt;span class=&quot;s&quot;&gt;slide 55&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;is&quot; data-amt=&quot;20000&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Advertising campaign · € 20,000&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;sfp&quot;&gt;SFP&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;is&quot;&gt;IS&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;b&gt;IS.&lt;/b&gt; It is an addition to internally generated goodwill, which is not capitalised. &lt;span class=&quot;s&quot;&gt;slide 55&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;sfp&quot; data-amt=&quot;150000&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Working time · € 150,000&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;sfp&quot;&gt;SFP&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;is&quot;&gt;IS&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;b&gt;SFP.&lt;/b&gt; Directly attributable costs: costs of employee benefits (IAS 19) arising directly from bringing the asset to working condition. &lt;span class=&quot;s&quot;&gt;slide 56&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;is&quot; data-amt=&quot;40000&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Training new staff · € 40,000&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;sfp&quot;&gt;SFP&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;is&quot;&gt;IS&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;b&gt;IS.&lt;/b&gt; Alfa does not control the future benefits: the workers can leave. &lt;span class=&quot;s&quot;&gt;slide 56&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;button class=&quot;btn&quot; data-all&gt;Show all solutions&lt;/button&gt;
&lt;/div&gt;
&lt;p class=&quot;meta&quot;&gt;Reconciliation calculated here, not in the slides: SFP € 700,000 + IS € 1,230,000 = € 1,930,000, the total of the costs listed on &lt;span class=&quot;s&quot;&gt;slide 52&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;flag&quot;&gt;&lt;b&gt;To clarify.&lt;/b&gt; The slides do not state which intangible the consultancy and working time produce, and “may be capitalized” makes recognition conditional on the six criteria. IAS 38.69, by contrast, lists expenditure on &lt;i&gt;relocating or reorganising&lt;/i&gt; an entity among the items to be expensed. The solution therefore holds if those costs relate to the development of an identifiable asset, not to the reorganisation itself: it is advisable to ask the lecturer what the assumption of the case is. &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias38.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · IAS 38.69 ↗&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;summary&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;17&lt;/span&gt;Summary: the rules to take away&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 57&lt;/span&gt; Main requirements of IFRS 3 and IAS 38:&lt;/p&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th&gt;Treatment&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Purchased goodwill and intangible assets&lt;/td&gt;&lt;td&gt;Capitalised&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Internally generated goodwill&lt;/td&gt;&lt;td&gt;&lt;b&gt;Never&lt;/b&gt; capitalised&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Internally developed intangibles (development costs)&lt;/td&gt;&lt;td&gt;Capitalised only with probable benefits and measurable cost. Detail: the six criteria &lt;span class=&quot;s&quot;&gt;slide 30&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Capitalised assets&lt;/td&gt;&lt;td&gt;Subject to amortisation and impairment review&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Indefinite useful life&lt;/td&gt;&lt;td&gt;No amortisation, annual impairment test&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check, Part IV&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;You sell an intangible at a gain: do you present it as revenue?&lt;/summary&gt;&lt;div&gt;No: the gain goes to profit or loss, but it is not classified as revenue. &lt;span class=&quot;s&quot;&gt;slide 45 · IAS 38.113&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;When is the date of disposal?&lt;/summary&gt;&lt;div&gt;When the recipient obtains control of the asset, under the IFRS 15 rules on the performance obligation. For a sale and leaseback, IFRS 16 applies. &lt;span class=&quot;s&quot;&gt;slide 45 · IAS 38.114&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Indefinite life: what does the disclosure add?&lt;/summary&gt;&lt;div&gt;The carrying amount and the reasons for the assessment, with the factors that played a significant role. &lt;span class=&quot;s&quot;&gt;slide 48 · IAS 38.122&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why do training and reinstatement workers end up in IS?&lt;/summary&gt;&lt;div&gt;Because workers can leave their jobs: control over the future benefits is missing. &lt;span class=&quot;s&quot;&gt;slides 54, 56&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between the feasibility study and the consultancy in the Alfa case?&lt;/summary&gt;&lt;div&gt;The former is treated like research, so it is expensed; the latter is development, capitalisable if the six criteria are demonstrated. &lt;span class=&quot;s&quot;&gt;slides 53–54&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;section id=&quot;fonti&quot; style=&quot;scroll-margin-top:50px;margin-top:64px&quot;&gt;
&lt;h2 style=&quot;font-size:36px&quot;&gt;Further reading&lt;/h2&gt;
&lt;p&gt;&lt;span class=&quot;xl&quot;&gt;external source&lt;/span&gt; Everything in this section comes from the web, not from the slides. The slides cite no authors, studies or websites: their references are the Conceptual Framework and other standards, so this section is built on those. The pages were found through a web search on 4 November 2026 and read in the search result excerpts, not in full: for exact quotations, open the text.&lt;/p&gt;
&lt;p class=&quot;flag&quot;&gt;&lt;b&gt;Other course materials.&lt;/b&gt; It was not possible to list the contents of &lt;code&gt;corso/&lt;/code&gt; in this session: only the PDF of this lecture was read, so the page draws nothing from other files. The links to other standards come from the slides themselves.&lt;/p&gt;

&lt;h4 class=&quot;p-sage&quot; style=&quot;color:var(--sage)&quot;&gt;The standard and its framework&lt;/h4&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h5&gt;IAS 38 Intangible Assets&lt;/h5&gt;&lt;p&gt;Issued by the IASC in September 1998 and adopted by the IASB in April 2001. It contains the normative text with the paragraphs cited in the slides. It is the final reference for any doubt in this lecture.&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias38.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · 2026 edition text ↗&lt;/a&gt; &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-38-intangible-assets/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · IFRS overview ↗&lt;/a&gt; &lt;a class=&quot;x&quot; href=&quot;https://www.iasplus.com/en/standards/ias/ias38&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · IAS Plus summary ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h5&gt;Conceptual Framework for Financial Reporting (2018)&lt;/h5&gt;&lt;p&gt;Published by the IASB in March 2018, it replaces the 2010 version. It defines the objectives, the elements of financial statements, recognition and measurement. It matters because slide 3 takes from it the definition of an asset (4.3–4.4), which treats assets as rights.&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/conceptual-framework/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · IFRS Foundation ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h5&gt;The IASB project on Intangible Assets&lt;/h5&gt;&lt;p&gt;It is not in the slides, but it concerns the future of this standard: the IASB is reviewing IAS 38 to adapt it to new types of intangibles, starting from two workstreams, definition and recognition on the one hand, disclosure on the other. The searches of November 2026 show no exposure draft, and the outcome of the October 2026 meeting has not been confirmed.&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/projects/work-plan/intangible-assets&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · IASB work plan ↗&lt;/a&gt; &lt;a class=&quot;x&quot; href=&quot;https://www.icaew.com/technical/corporate-reporting/corporate-reporting-resources/by-all-accounts/articles/2025/the-future-of-accounting-for-intangibles&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · ICAEW, 2025 ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h5&gt;SIC-32 Intangible Assets: Web Site Costs&lt;/h5&gt;&lt;p&gt;It is not cited in the slides, but it is the specific interpretation for their website example: it divides the project into phases and links each one to the rules of IAS 38.&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/sic32.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · 2026 text ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h5&gt;Adoption in the European Union&lt;/h5&gt;&lt;p&gt;It is not in the slides. In the EU, the standards apply in their endorsed text: the Commission&#x27;s page collects the regulations, including Regulation (EU) 2023/1803, which consolidates the adopted standards.&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;x&quot; href=&quot;https://finance.ec.europa.eu/regulation-and-supervision/financial-services-legislation/implementing-and-delegated-acts/international-accounting-standards-regulation_en&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · European Commission ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h4 style=&quot;color:var(--slate)&quot;&gt;The related standards cited in the slides&lt;/h4&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h5&gt;IAS 36 Impairment of Assets&lt;/h5&gt;&lt;p&gt;It ensures that assets are not carried above their recoverable amount. It explains how to calculate that amount and when to test: it is the standard to which slide 44 refers.&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias36.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · 2026 text ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h5&gt;IFRS 3 Business Combinations&lt;/h5&gt;&lt;p&gt;It governs business combinations through the acquisition method: identifiable assets separate from goodwill, generally at fair value. Slides 6, 26 and 57.&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs3.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · 2026 text ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;ref&quot;&gt;&lt;h5&gt;IAS 8&lt;/h5&gt;&lt;p&gt;It deals with policies, changes in accounting estimates and errors. Slide 43. With IFRS 18 it takes the title &lt;i&gt;Basis of Preparation of Financial Statements&lt;/i&gt; and absorbs parts of IAS 1, for periods from 1 January 2027.&lt;/p&gt;&lt;p&gt;&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-8-basis-of-preparation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · IFRS Foundation ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Standard&lt;/th&gt;&lt;th&gt;What it contains&lt;/th&gt;&lt;th&gt;Why it matters here&lt;/th&gt;&lt;th&gt;Link&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;IAS 2 Inventories&lt;/td&gt;&lt;td&gt;Measurement of inventories, cost formulas, net realisable value&lt;/td&gt;&lt;td&gt;Intangibles sold in the ordinary course of business&lt;/td&gt;&lt;td&gt;&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2025/issued/ias2.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;2025 ↗&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;
