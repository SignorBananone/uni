&lt;h1&gt;IAS 38 &lt;i&gt;Intangible Assets&lt;/i&gt;&lt;/h1&gt;
&lt;p class=&quot;lede&quot;&gt;How something that cannot be touched (a patent, software, a design) enters, lives in and leaves the financial statements. And why advertising, however profitable it may be, does not enter them.&lt;/p&gt;
&lt;p class=&quot;meta&quot;&gt;Prof. Roberto Aprile · University of Bergamo, Department of Management · Master Degree in Accounting, Governance and Sustainability · A.Y. 2026-2027. Based on the 58 slides of &lt;code&gt;06 - IAS 38 - Intangible Assets.pdf&lt;/code&gt;.&lt;/p&gt;

&lt;div class=&quot;p-sage&quot; id=&quot;parte1&quot; style=&quot;scroll-margin-top:50px&quot;&gt;
&lt;div class=&quot;part&quot;&gt;&lt;div class=&quot;n&quot;&gt;Part I&lt;/div&gt;&lt;h2&gt;What an intangible asset is&lt;/h2&gt;&lt;p&gt;Before accounting for an item, one must establish whether it falls within the standard and whether it meets the definition.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;t&quot; id=&quot;asset&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;1&lt;/span&gt;Asset: the starting point&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 3&lt;/span&gt; IAS 38 rests on the general definition in the &lt;em class=&quot;t&quot;&gt;Conceptual Framework&lt;/em&gt; (CF, the IASB&#x27;s conceptual framework, from which the standards derive).&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;q&gt;A present economic resource controlled by the entity as a result of past events.&lt;/q&gt;&lt;span class=&quot;s&quot;&gt;CF 4.3&lt;/span&gt; &lt;span class=&quot;s&quot;&gt;slide 3&lt;/span&gt;&lt;br&gt;
&lt;q style=&quot;font-size:17px;margin-top:6px&quot;&gt;An economic resource is a right that has the potential to produce economic benefits.&lt;/q&gt;&lt;span class=&quot;s&quot;&gt;CF 4.4&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;In plain terms: an &lt;em class=&quot;t&quot;&gt;asset&lt;/em&gt; is a present economic resource that the &lt;em class=&quot;t&quot;&gt;entity&lt;/em&gt; (the company preparing the financial statements) controls as a result of events that have already occurred. The resource is a &lt;b&gt;right&lt;/b&gt; capable of producing benefits. The right matters more than the object, which is why the definition also works for items with no physical body.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 210&quot; role=&quot;img&quot; aria-label=&quot;Classification of assets into tangible and intangible&quot;&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;190&quot; y=&quot;6&quot; width=&quot;100&quot; height=&quot;34&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;240&quot; y=&quot;28&quot;&gt;Asset&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M240 40V58M120 58H360M120 58V74M360 58V74&quot;/&gt;
&lt;rect class=&quot;box&quot; x=&quot;30&quot; y=&quot;74&quot; width=&quot;180&quot; height=&quot;42&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;120&quot; y=&quot;92&quot;&gt;Tangible assets&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;120&quot; y=&quot;108&quot;&gt;have physical substance&lt;/text&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;270&quot; y=&quot;74&quot; width=&quot;180&quot; height=&quot;42&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;360&quot; y=&quot;92&quot;&gt;Intangible assets&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;360&quot; y=&quot;108&quot;&gt;non-physical resources/rights&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M120 116V132M65 132H175M65 132V146M175 132V146M360 116V146&quot;/&gt;
&lt;rect class=&quot;box&quot; x=&quot;18&quot; y=&quot;146&quot; width=&quot;94&quot; height=&quot;56&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;65&quot; y=&quot;166&quot;&gt;Current&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;65&quot; y=&quot;184&quot;&gt;inventory&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;124&quot; y=&quot;146&quot; width=&quot;102&quot; height=&quot;56&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;175&quot; y=&quot;166&quot;&gt;Fixed&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;175&quot; y=&quot;180&quot;&gt;buildings,&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;175&quot; y=&quot;194&quot;&gt;equipment&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;258&quot; y=&quot;146&quot; width=&quot;204&quot; height=&quot;56&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m sm&quot; x=&quot;360&quot; y=&quot;166&quot;&gt;software, patents, copyrights,&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;360&quot; y=&quot;184&quot;&gt;trademarks, design, know-how&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;The two classes of assets. &lt;span class=&quot;s&quot;&gt;slides 3–4&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;flag&quot;&gt;&lt;b&gt;To clarify.&lt;/b&gt; &lt;span class=&quot;s&quot;&gt;slide 3&lt;/span&gt; also lists goodwill and financial assets (receivables, bonds, shares) among the examples of intangibles. In an economic sense they are intangible, but not under IAS 38: financial assets are excluded from the scope &lt;span class=&quot;s&quot;&gt;slides 5–6&lt;/span&gt;, and goodwill is not identifiable, so “by definition” it is not an intangible asset &lt;span class=&quot;s&quot;&gt;slide 18&lt;/span&gt;. For the exam, the technical definition applies.&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;objective&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;2&lt;/span&gt;Objective: what the standard does&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 4 · IAS 38.1&lt;/span&gt; IAS 38 answers three questions about intangibles not dealt with by other standards:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;When should they be recognised?&lt;/h5&gt;&lt;p&gt;The &lt;em class=&quot;t&quot;&gt;entity&lt;/em&gt; performs &lt;em class=&quot;t&quot;&gt;recognition&lt;/em&gt; (inclusion in the financial statements) “if, and only if” specific criteria are met.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;At what amount?&lt;/h5&gt;&lt;p&gt;It establishes how to measure the &lt;em class=&quot;t&quot;&gt;carrying amount&lt;/em&gt; (the amount at which the asset appears in the statement of financial position).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;What should be reported?&lt;/h5&gt;&lt;p&gt;It requires &lt;em class=&quot;t&quot;&gt;disclosure&lt;/em&gt; (information in the notes) about intangibles.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Typical candidates according to the slides: computer software, patents, copyrights, advertising, brands and trademarks, intellectual property, market knowledge. These are &lt;em&gt;intangible items&lt;/em&gt;: not all of them will become assets. Does advertising, for example, pass the definition test? You will see in the Alfa case.&lt;/p&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;scope&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;3&lt;/span&gt;Scope: what is excluded&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slides 5–7 · IAS 38.2–3&lt;/span&gt; The logic is residual: if another standard governs a specific type of intangible, that standard applies. Choose an item to see where it goes.&lt;/p&gt;
&lt;div data-picker&gt;
&lt;div class=&quot;chips&quot;&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IAS 2 Inventories.&lt;/b&gt; An intangible held for sale in the ordinary course of business is inventory: for example, a software house selling standard licences as a product.&quot;&gt;Intangible for sale in the ordinary course of business&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IAS 12 Income Taxes.&lt;/b&gt; Deferred tax assets represent future tax benefits.&quot;&gt;Deferred tax assets&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IFRS 16 Leases.&lt;/b&gt; Leases of intangible assets accounted for under IFRS 16 are excluded.&quot;&gt;Leases of intangible assets&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IAS 19 Employee Benefits.&lt;/b&gt; Assets arising from employee benefits.&quot;&gt;Assets from employee benefits&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IAS 32&lt;/b&gt; for the definition. For the recognition and measurement of certain financial assets: &lt;b&gt;IFRS 10&lt;/b&gt; (consolidated financial statements), &lt;b&gt;IAS 27&lt;/b&gt; (separate financial statements), &lt;b&gt;IAS 28&lt;/b&gt; (associates and joint ventures).&quot;&gt;Financial assets&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IFRS 3 Business Combinations.&lt;/b&gt; Goodwill acquired in a business combination follows IFRS 3.&quot;&gt;Goodwill from a business combination&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IFRS 17 Insurance Contracts.&lt;/b&gt; Insurance contracts and assets for insurance acquisition cash flows (the costs of acquiring the contracts).&quot;&gt;Insurance contracts&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IFRS 5.&lt;/b&gt; Non-current intangible assets classified as held for sale, including those within a disposal group, that is, a group of assets to be disposed of together.&quot;&gt;Intangible held for sale&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IFRS 15 Revenue from Contracts with Customers.&lt;/b&gt; Assets arising from contracts with customers.&quot;&gt;Assets from contracts with customers&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;IFRS 6.&lt;/b&gt; Recognition and measurement of exploration and evaluation assets, that is, the exploration for and evaluation of mineral resources.&quot;&gt;Exploration and evaluation&lt;/button&gt;
&lt;button class=&quot;chip&quot; data-d=&quot;&lt;b&gt;Outside IAS 38.&lt;/b&gt; The slide excludes expenditure on the development and extraction of minerals, oil, natural gas and similar non-regenerative resources, without indicating a standard.&quot;&gt;Extraction of minerals, oil, gas&lt;/button&gt;

&lt;section class=&quot;t&quot; id=&quot;definition&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;4&lt;/span&gt;Definition: the three pillars&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;q&gt;An identifiable non-monetary asset without physical substance.&lt;/q&gt;&lt;span class=&quot;s&quot;&gt;IAS 38.8 · slide 8&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;The slide adds the purpose: &lt;b&gt;held for use&lt;/b&gt; in the production or supply of goods and services, &lt;b&gt;for rental&lt;/b&gt; to others, or for administrative purposes. &lt;em class=&quot;t&quot;&gt;Non-monetary&lt;/em&gt; means that it is neither money nor a right to receive fixed or determinable amounts. You can neither see nor touch it, yet it generates benefits: a design used in production, or employees&#x27; knowledge used to provide a service.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 182&quot; role=&quot;img&quot; aria-label=&quot;Temple with three columns: identifiability, control, future economic benefits&quot;&gt;
&lt;path class=&quot;boxc&quot; d=&quot;M240 6L466 50H14z&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;240&quot; y=&quot;40&quot;&gt;Intangible asset&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;26&quot; y=&quot;58&quot; width=&quot;132&quot; height=&quot;86&quot; rx=&quot;4&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;92&quot; y=&quot;84&quot;&gt;Identifiability&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;92&quot; y=&quot;106&quot;&gt;separable, or from&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;92&quot; y=&quot;122&quot;&gt;legal rights&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;174&quot; y=&quot;58&quot; width=&quot;132&quot; height=&quot;86&quot; rx=&quot;4&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;240&quot; y=&quot;84&quot;&gt;Control&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;240&quot; y=&quot;106&quot;&gt;obtain the benefits&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;240&quot; y=&quot;122&quot;&gt;and exclude others&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;322&quot; y=&quot;58&quot; width=&quot;132&quot; height=&quot;86&quot; rx=&quot;4&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;388&quot; y=&quot;78&quot;&gt;Future economic&lt;/text&gt;&lt;text class=&quot;m b&quot; x=&quot;388&quot; y=&quot;94&quot;&gt;benefits&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;388&quot; y=&quot;114&quot;&gt;revenue, savings&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;388&quot; y=&quot;130&quot;&gt;or other benefits&lt;/text&gt;
&lt;rect class=&quot;fr&quot; x=&quot;14&quot; y=&quot;152&quot; width=&quot;452&quot; height=&quot;8&quot;/&gt;&lt;text class=&quot;m sm&quot; x=&quot;240&quot; y=&quot;176&quot;&gt;If a column is missing, the expenditure is an expense&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;The three pillars&quot;&gt;
&lt;button role=&quot;tab&quot;&gt;Identifiability&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Control&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Future benefits&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slides 9–10 · IAS 38.11–12&lt;/span&gt; It serves to distinguish an intangible from &lt;em class=&quot;t&quot;&gt;goodwill&lt;/em&gt;: the future benefits, in a business combination, that do not correspond to individually identified assets, such as synergies.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;One&lt;/b&gt; of the two conditions is sufficient:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;&lt;b&gt;Separable&lt;/b&gt;: it can be separated from the entity and sold, transferred, licensed, rented or exchanged, either individually or together with a related contract, asset or liability. What matters is the possibility, even if the entity does not intend to do so.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Contractual or other legal rights&lt;/b&gt;: it arises from contractual or legal rights, even if these are neither transferable nor separable.&lt;/li&gt;&lt;/ul&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 11 · IAS 38.13&lt;/span&gt; &lt;em class=&quot;t&quot;&gt;Control&lt;/em&gt; means two powers together: obtaining the future benefits and &lt;b&gt;restricting the access of others&lt;/b&gt; to those benefits. It usually derives from rights enforceable in court. Without legal rights, control is harder to demonstrate, but enforceability is not a necessary condition.&lt;/p&gt;
&lt;p&gt;This is why trained staff are a classic case: employees can leave. You will meet this again in the Alfa case. &lt;span class=&quot;s&quot;&gt;slide 56&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 12 · IAS 38.17&lt;/span&gt; Higher revenue is not strictly required: the benefits include revenue, &lt;b&gt;cost savings&lt;/b&gt; or other advantages from use. Intellectual property used in production may reduce future costs rather than increase revenue.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;Test: does it meet the definition?&lt;/h4&gt;
&lt;div data-sorter&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;si&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;A registered patent that the company does not plan to sell&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;si&quot;&gt;Yes&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;no&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;It arises from a legal right, and in any case separability does not depend on the intention to sell. &lt;span class=&quot;s&quot;&gt;slide 10&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;no&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;The skills of a newly trained team, with no contractual ties&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;si&quot;&gt;Yes&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;no&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;Control is missing: the people can leave the company and take the benefits with them. &lt;span class=&quot;s&quot;&gt;slides 54, 56&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;no&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Synergies paid for in an acquisition, not attributable to individual assets&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;si&quot;&gt;Yes&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;no&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;This is goodwill: it is not identifiable, and is therefore not an intangible asset under the definition. &lt;span class=&quot;s&quot;&gt;slides 9, 18&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;si&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;A patented process that reduces production costs without increasing revenue&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;si&quot;&gt;Yes&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;no&quot;&gt;No&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;Cost savings are also future economic benefits, and the patent provides identifiability and control. &lt;span class=&quot;s&quot;&gt;slide 12&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check, Part I&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why does IAS 38 require an asset to be identifiable?&lt;/summary&gt;&lt;div&gt;To distinguish it from goodwill. &lt;span class=&quot;s&quot;&gt;slide 9&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Are the two routes to being identifiable alternative or cumulative?&lt;/summary&gt;&lt;div&gt;Alternative: separable &lt;b&gt;or&lt;/b&gt; arising from contractual or other legal rights. &lt;span class=&quot;s&quot;&gt;slide 10&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Does a trademark intended for ordinary sale always fall under IAS 38?&lt;/summary&gt;&lt;div&gt;No. An intangible held for sale in the ordinary course of business falls under IAS 2 &lt;span class=&quot;s&quot;&gt;slide 6&lt;/span&gt;. If it is a non-current asset classified as held for sale, IFRS 5 applies &lt;span class=&quot;s&quot;&gt;slide 7&lt;/span&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Can there be control without legal rights?&lt;/summary&gt;&lt;div&gt;Yes, but it is harder to demonstrate: legal enforceability is not a necessary condition. &lt;span class=&quot;s&quot;&gt;slide 11&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;&lt;div class=&quot;p-ochre&quot; id=&quot;parte2&quot; style=&quot;scroll-margin-top:50px&quot;&gt;
&lt;div class=&quot;part&quot;&gt;&lt;div class=&quot;n&quot;&gt;Part II&lt;/div&gt;&lt;h2&gt;How it enters the financial statements&lt;/h2&gt;&lt;p&gt;Two keys to turn together, then a cost to determine, which depends on how the asset was obtained.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;t&quot; id=&quot;criteri&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;5&lt;/span&gt;Recognition: the two keys&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 13 · IAS 38.18&lt;/span&gt; To recognise an intangible, one must demonstrate that it meets &lt;b&gt;both&lt;/b&gt; the definition &lt;b&gt;and&lt;/b&gt; the recognition criteria. The rule applies to initial costs, incurred to acquire or internally generate it, and to subsequent costs, incurred to add to it, replace parts of it or service it.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 170&quot; role=&quot;img&quot; aria-label=&quot;Definition and criteria lead to recognition, otherwise to expense&quot;&gt;
&lt;rect class=&quot;box&quot; x=&quot;10&quot; y=&quot;8&quot; width=&quot;170&quot; height=&quot;48&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;95&quot; y=&quot;28&quot;&gt;Definition&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;95&quot; y=&quot;45&quot;&gt;IAS 38.8–17&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;10&quot; y=&quot;72&quot; width=&quot;170&quot; height=&quot;86&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;95&quot; y=&quot;92&quot;&gt;Recognition criteria&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;95&quot; y=&quot;112&quot;&gt;a) probable benefits&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;95&quot; y=&quot;128&quot;&gt;b) measurable cost&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;95&quot; y=&quot;146&quot;&gt;IAS 38.21&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M180 32H222V64M180 115H222V82&quot;/&gt;
&lt;circle class=&quot;boxc&quot; cx=&quot;222&quot; cy=&quot;73&quot; r=&quot;15&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;222&quot; y=&quot;78&quot;&gt;and&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M237 62L296 36M237 84L296 112&quot;/&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;298&quot; y=&quot;12&quot; width=&quot;170&quot; height=&quot;50&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;383&quot; y=&quot;33&quot;&gt;Both yes&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;383&quot; y=&quot;50&quot;&gt;recognition as an asset&lt;/text&gt;
&lt;rect class=&quot;boxa&quot; x=&quot;298&quot; y=&quot;88&quot; width=&quot;170&quot; height=&quot;50&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;383&quot; y=&quot;109&quot;&gt;Even a single no&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;383&quot; y=&quot;126&quot;&gt;expense in profit or loss&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;def&quot;&gt;&lt;q&gt;An intangible asset shall be recognised if, and only if: (a) it is probable that the expected future economic benefits attributable to the asset will flow to the entity; and (b) the cost of the asset can be measured reliably.&lt;/q&gt;&lt;span class=&quot;s&quot;&gt;IAS 38.21 · slide 14&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;How is probability assessed? &lt;span class=&quot;s&quot;&gt;slide 15 · IAS 38.22–23&lt;/span&gt; Using reasonable and supportable assumptions that reflect management&#x27;s best estimate over the entire &lt;em class=&quot;t&quot;&gt;useful life&lt;/em&gt;. Judgement is required, based on the evidence available at initial recognition, with &lt;b&gt;greater weight given to external evidence&lt;/b&gt;.&lt;/p&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;matite&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;6&lt;/span&gt;Example: the design and the excess&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slides 16–18&lt;/span&gt; An entity pays &lt;b&gt;€ 250,000&lt;/b&gt; to a wholesaler for a group of assets with which it will produce wooden pencil cases. The values at the purchase date, however, add up to € 220,000.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 122&quot; role=&quot;img&quot; aria-label=&quot;Bar: raw materials 150 thousand, design 50 thousand, labels 20 thousand, excess 30 thousand, total 250 thousand&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;30&quot; width=&quot;276&quot; height=&quot;44&quot; fill=&quot;var(--rule)&quot;/&gt;&lt;text class=&quot;m&quot; x=&quot;148&quot; y=&quot;57&quot;&gt;Raw materials 150k&lt;/text&gt;
&lt;rect class=&quot;fc&quot; x=&quot;286&quot; y=&quot;30&quot; width=&quot;92&quot; height=&quot;44&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;332&quot; y=&quot;57&quot; style=&quot;fill:var(--paper)&quot;&gt;Design 50k&lt;/text&gt;
&lt;rect x=&quot;378&quot; y=&quot;30&quot; width=&quot;37&quot; height=&quot;44&quot; fill=&quot;var(--muted)&quot; opacity=&quot;.55&quot;/&gt;&lt;text class=&quot;m sm&quot; x=&quot;396&quot; y=&quot;57&quot; style=&quot;fill:var(--ink)&quot;&gt;20k&lt;/text&gt;
&lt;rect class=&quot;fa&quot; x=&quot;415&quot; y=&quot;30&quot; width=&quot;55&quot; height=&quot;44&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;442&quot; y=&quot;57&quot; style=&quot;fill:var(--paper)&quot;&gt;30k&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M10 20H470&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;240&quot; y=&quot;14&quot;&gt;Price paid € 250,000&lt;/text&gt;
&lt;text class=&quot;sm m&quot; x=&quot;148&quot; y=&quot;92&quot;&gt;tangible inventory&lt;/text&gt;&lt;text class=&quot;sm m&quot; x=&quot;332&quot; y=&quot;92&quot;&gt;intangible asset&lt;/text&gt;&lt;text class=&quot;sm m&quot; x=&quot;396&quot; y=&quot;92&quot;&gt;labels&lt;/text&gt;&lt;text class=&quot;sm e&quot; x=&quot;470&quot; y=&quot;92&quot;&gt;excess&lt;/text&gt;
&lt;text class=&quot;sm e&quot; x=&quot;470&quot; y=&quot;110&quot;&gt;= goodwill per the slides&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;formula&quot;&gt;€ 30,000 = 250,000 − (150,000 + 50,000 + 20,000)&lt;/div&gt;
&lt;p&gt;Without the design, the raw materials are useless, and the agreed price measures its value: it is an intangible of € 50,000. The excess of € 30,000 is paid because all three assets are needed together, and it is “a possible example of the acquired goodwill”. Design and goodwill remain &lt;b&gt;two distinct assets&lt;/b&gt;, because the value of the design can be identified separately. Goodwill is not identifiable and therefore, by definition, is not an intangible asset.&lt;/p&gt;
&lt;div class=&quot;flag&quot;&gt;&lt;b&gt;To clarify.&lt;/b&gt; The slides recognise € 30,000 of goodwill on a purchase from a wholesaler. Under IFRS 3, however, the purchase of a group of assets that does &lt;i&gt;not&lt;/i&gt; constitute a business does not give rise to goodwill: the cost is allocated on the basis of relative fair values. The example serves to show the conceptual difference, but it is worth asking whether the lecturer intends it as a business. &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/supporting-implementation/agenda-decisions/2017/ifrs-3-acqusition-of-a-group-of-assets-nov-17.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · IFRS 3 agenda decision, 2017 ↗&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;costo&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;7&lt;/span&gt;Initial measurement: always at cost&lt;/h3&gt;
&lt;div class=&quot;def&quot;&gt;&lt;q&gt;An intangible asset shall be measured initially at cost.&lt;/q&gt;&lt;span class=&quot;s&quot;&gt;IAS 38.24 · slide 19&lt;/span&gt;&lt;/div&gt;
&lt;p&gt;There is one principle, but the cost is calculated differently depending on the route of entry. &lt;span class=&quot;s&quot;&gt;slide 20&lt;/span&gt;&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Routes of entry&quot;&gt;
&lt;button role=&quot;tab&quot;&gt;Separate acquisition&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Exchange&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Business combination&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Internally generated&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slides 21–24 · IAS 38.25–29&lt;/span&gt; Individual purchase from third parties. The price already reflects expectations about the benefits, so the probability criterion is &lt;b&gt;always considered satisfied&lt;/b&gt; &lt;span class=&quot;s&quot;&gt;38.25&lt;/span&gt;, and the cost is usually reliable, especially if paid in cash &lt;span class=&quot;s&quot;&gt;38.26&lt;/span&gt;.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Cost = purchase price + import duties + non-refundable taxes − trade discounts and rebates + directly attributable costs&lt;/div&gt;
&lt;p&gt;&lt;em class=&quot;t&quot;&gt;Directly attributable costs&lt;/em&gt; are those necessary to prepare the asset for its intended use. &lt;span class=&quot;s&quot;&gt;IAS 38.27&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 25 · IAS 38.45&lt;/span&gt; The asset is obtained in exchange for a non-monetary asset, or a mix of monetary and non-monetary assets. Rule: &lt;em class=&quot;t&quot;&gt;fair value&lt;/em&gt; (the market price that would be obtained at the measurement date).&lt;/p&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 186&quot; role=&quot;img&quot; aria-label=&quot;Exchange: with commercial substance and a measurable fair value, fair value is used; otherwise the carrying amount of the asset given up&quot;&gt;
&lt;rect class=&quot;box&quot; x=&quot;8&quot; y=&quot;8&quot; width=&quot;208&quot; height=&quot;52&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m&quot; x=&quot;112&quot; y=&quot;30&quot;&gt;Does the exchange have&lt;/text&gt;&lt;text class=&quot;m b&quot; x=&quot;112&quot; y=&quot;48&quot;&gt;commercial substance?&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;8&quot; y=&quot;96&quot; width=&quot;208&quot; height=&quot;62&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m&quot; x=&quot;112&quot; y=&quot;118&quot;&gt;Fair value measurable&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;112&quot; y=&quot;136&quot;&gt;for at least one asset?&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M112 60V96&quot;/&gt;&lt;text class=&quot;sm&quot; x=&quot;120&quot; y=&quot;82&quot;&gt;yes&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M216 34H284M216 126H284M112 158V176H240&quot;/&gt;&lt;text class=&quot;sm&quot; x=&quot;248&quot; y=&quot;28&quot;&gt;no&lt;/text&gt;&lt;text class=&quot;sm&quot; x=&quot;248&quot; y=&quot;120&quot;&gt;no&lt;/text&gt;&lt;text class=&quot;sm&quot; x=&quot;120&quot; y=&quot;172&quot;&gt;yes&lt;/text&gt;
&lt;rect class=&quot;boxa&quot; x=&quot;284&quot; y=&quot;26&quot; width=&quot;186&quot; height=&quot;100&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;377&quot; y=&quot;62&quot;&gt;Carrying amount&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;377&quot; y=&quot;82&quot;&gt;of the asset given up&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;377&quot; y=&quot;102&quot;&gt;exception&lt;/text&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;240&quot; y=&quot;146&quot; width=&quot;230&quot; height=&quot;36&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;355&quot; y=&quot;169&quot;&gt;Cost = fair value&lt;/text&gt;
&lt;/svg&gt;
&lt;p&gt;&lt;em class=&quot;t&quot;&gt;Commercial substance&lt;/em&gt; means that the exchange genuinely changes the entity&#x27;s expected cash flows. The measurement applies even if the asset given up cannot be derecognised immediately.&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 26 · IAS 38.33&lt;/span&gt; In a &lt;em class=&quot;t&quot;&gt;business combination&lt;/em&gt; (the acquisition of control of a business, IFRS 3), the cost of the intangible is its &lt;b&gt;fair value at the acquisition date&lt;/b&gt;.&lt;/p&gt;
&lt;p&gt;An important consequence, not stated explicitly in the slides: a customer list or trademark that the acquired business did not carry in its financial statements may appear separately from goodwill in the acquirer&#x27;s financial statements, if identifiable. &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ifrs3.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · IFRS 3 ↗&lt;/a&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 27&lt;/span&gt; Developed within the entity, with no third party to set a price. If the cost cannot be measured, the item is &lt;b&gt;not recognised&lt;/b&gt; as an intangible. This is the topic of the next section.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;In or out of cost?&lt;/h4&gt;
&lt;div data-sorter&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;in&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Import duties on a purchased licence&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;in&quot;&gt;In&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;out&quot;&gt;Out&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;They form part of the purchase price, as do non-refundable taxes. &lt;span class=&quot;s&quot;&gt;slide 22&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;out&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Advertising campaign to launch the new product&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;in&quot;&gt;In&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;out&quot;&gt;Out&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;The costs of introducing a product, including advertising and promotion, are not part of cost. &lt;span class=&quot;s&quot;&gt;slide 23 · IAS 38.29&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;out&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Staff training to operate at a new site&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;in&quot;&gt;In&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;out&quot;&gt;Out&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;These are costs of conducting business in a new location or with new customers. &lt;span class=&quot;s&quot;&gt;slide 23 · IAS 38.29&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;out&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Share of general and administrative expenses&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;in&quot;&gt;In&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;out&quot;&gt;Out&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;Administration and general overheads are excluded. &lt;span class=&quot;s&quot;&gt;slide 23 · IAS 38.29&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;in&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Direct cost of making the software ready for its intended use&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;in&quot;&gt;In&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;out&quot;&gt;Out&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;It is a directly attributable cost. &lt;span class=&quot;s&quot;&gt;slide 22 · IAS 38.27&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;interni&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;8&lt;/span&gt;Internally generated: research and development&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 28&lt;/span&gt; For internal assets, the project is divided into two phases with opposite outcomes.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 148&quot; role=&quot;img&quot; aria-label=&quot;Timeline: research phase expensed, development phase capitalisable only after the six criteria are met, then commercial production&quot;&gt;
&lt;defs&gt;&lt;marker id=&quot;ah2&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L8 4L0 8z&quot; fill=&quot;var(--muted)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
&lt;rect class=&quot;boxa&quot; x=&quot;10&quot; y=&quot;36&quot; width=&quot;170&quot; height=&quot;54&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;95&quot; y=&quot;58&quot;&gt;Research&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;95&quot; y=&quot;77&quot;&gt;always expense&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;180&quot; y=&quot;36&quot; width=&quot;90&quot; height=&quot;54&quot;/&gt;&lt;text class=&quot;m sm&quot; x=&quot;225&quot; y=&quot;58&quot;&gt;development&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;225&quot; y=&quot;75&quot;&gt;still expense&lt;/text&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;270&quot; y=&quot;36&quot; width=&quot;130&quot; height=&quot;54&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;335&quot; y=&quot;58&quot;&gt;Capitalise&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;335&quot; y=&quot;77&quot;&gt;6 of 6 criteria&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;400&quot; y=&quot;36&quot; width=&quot;70&quot; height=&quot;54&quot; rx=&quot;6&quot;/&gt;&lt;text class=&quot;m sm&quot; x=&quot;435&quot; y=&quot;58&quot;&gt;use or&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;435&quot; y=&quot;75&quot;&gt;sale&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M10 112H468&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;path class=&quot;ad&quot; d=&quot;M270 18V112&quot;/&gt;&lt;text class=&quot;m sm&quot; x=&quot;270&quot; y=&quot;14&quot;&gt;criteria met&lt;/text&gt;
&lt;text class=&quot;sm&quot; x=&quot;10&quot; y=&quot;132&quot;&gt;time passes&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;Research expenditure&lt;/h5&gt;&lt;p&gt;&lt;span class=&quot;s&quot;&gt;IAS 38.54–56&lt;/span&gt; No intangible can arise from research: at this stage it cannot be demonstrated that an asset with probable benefits exists. It is recognised as an &lt;em class=&quot;t&quot;&gt;expense&lt;/em&gt; (a cost in profit or loss) when incurred.&lt;/p&gt;
&lt;p&gt;Examples: obtaining new knowledge; searching for, evaluating and selecting applications of the findings; searching for alternatives for materials, products and processes; formulating, designing and choosing among possible alternatives.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;Development expenditure&lt;/h5&gt;&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 28&lt;/span&gt; Research findings are applied to &lt;b&gt;plan the production&lt;/b&gt; of new or substantially improved materials, products or processes, before commercial production or use.&lt;/p&gt;
&lt;p&gt;It may be &lt;em class=&quot;t&quot;&gt;capitalised&lt;/em&gt; (recorded as an asset rather than as an expense) only if all six criteria are demonstrated.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;The six criteria: switch them all on&lt;/h4&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 30 · IAS 38.57&lt;/span&gt; They are cumulative. Tap each one when the entity can demonstrate it.&lt;/p&gt;
&lt;div id=&quot;crit&quot;&gt;
&lt;div class=&quot;crits&quot;&gt;
&lt;button class=&quot;crit&quot;&gt;&lt;span class=&quot;lamp&quot;&gt;a&lt;/span&gt;&lt;span&gt;&lt;b&gt;Technical feasibility&lt;/b&gt;: it is technically possible to complete it for use or sale&lt;/span&gt;&lt;/button&gt;
&lt;button class=&quot;crit&quot;&gt;&lt;span class=&quot;lamp&quot;&gt;b&lt;/span&gt;&lt;span&gt;&lt;b&gt;Intention&lt;/b&gt; to complete it and to use or sell it&lt;/span&gt;&lt;/button&gt;
&lt;button class=&quot;crit&quot;&gt;&lt;span class=&quot;lamp&quot;&gt;c&lt;/span&gt;&lt;span&gt;&lt;b&gt;Ability&lt;/b&gt;: the entity is able to use or sell it&lt;/span&gt;&lt;/button&gt;
&lt;button class=&quot;crit&quot;&gt;&lt;span class=&quot;lamp&quot;&gt;d&lt;/span&gt;&lt;span&gt;&lt;b&gt;Probable future economic benefits&lt;/b&gt;: how they will arise is demonstrated, for example through a market for the output or the asset, or through its usefulness if it is for internal use&lt;/span&gt;&lt;/button&gt;
&lt;button class=&quot;crit&quot;&gt;&lt;span class=&quot;lamp&quot;&gt;e&lt;/span&gt;&lt;span&gt;&lt;b&gt;Resources&lt;/b&gt;: adequate technical, financial and other resources to complete it and to use or sell it&lt;/span&gt;&lt;/button&gt;
&lt;button class=&quot;crit&quot;&gt;&lt;span class=&quot;lamp&quot;&gt;f&lt;/span&gt;&lt;span&gt;&lt;b&gt;Reliable measurement&lt;/b&gt;: the expenditure attributable to it during development can be measured reliably&lt;/span&gt;&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;verdict&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;meta&quot; style=&quot;margin-top:8px&quot;&gt;Mnemonic &lt;span class=&quot;own&quot;&gt;not in the slides&lt;/span&gt;: P.I.R.A.T.E. = Probable benefits, Intention, Resources, Ability, Technical feasibility, Expenditure measured.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Beyond the slides.&lt;/b&gt; If the research phase cannot be distinguished from the development phase, all the expenditure is treated as research (IAS 38.53). Goodwill (38.48) and brands, mastheads, publishing titles and customer lists (38.63) are never recognised as assets if internally generated. &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias38.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · IAS 38 text ↗&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;sito&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;9&lt;/span&gt;Example: the e-commerce website&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slides 31–33&lt;/span&gt; Move through the years and watch where each euro ends up. The chart shows the asset balance and the cumulative expense in &lt;em class=&quot;t&quot;&gt;profit or loss&lt;/em&gt; (P&amp;amp;L, the income statement).&lt;/p&gt;
&lt;div class=&quot;stepper&quot; id=&quot;web&quot;&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 232&quot; role=&quot;img&quot; aria-label=&quot;Two-bar chart: value of the website asset and cumulative costs in profit and loss&quot; style=&quot;max-width:430px&quot;&gt;
&lt;line class=&quot;ax&quot; x1=&quot;30&quot; x2=&quot;450&quot; y1=&quot;210&quot; y2=&quot;210&quot;/&gt;
&lt;rect id=&quot;webA&quot; class=&quot;fc&quot; x=&quot;100&quot; y=&quot;210&quot; width=&quot;90&quot; height=&quot;0&quot;/&gt;&lt;text id=&quot;webAt&quot; class=&quot;m b&quot; x=&quot;145&quot; y=&quot;203&quot;&gt;&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;145&quot; y=&quot;227&quot;&gt;Website asset&lt;/text&gt;
&lt;rect id=&quot;webP&quot; class=&quot;fa&quot; x=&quot;290&quot; y=&quot;210&quot; width=&quot;90&quot; height=&quot;0&quot;/&gt;&lt;text id=&quot;webPt&quot; class=&quot;m b&quot; x=&quot;335&quot; y=&quot;203&quot;&gt;&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;335&quot; y=&quot;227&quot;&gt;Cumulative P&amp;amp;L&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;step&quot; data-a=&quot;0&quot; data-p=&quot;60&quot;&gt;&lt;h5&gt;20X5: research&lt;/h5&gt;&lt;p&gt;The entity studies how to design the website and which security systems are needed. Full cost &lt;b&gt;€ 60,000&lt;/b&gt;: this is research, hence an expense.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; data-a=&quot;25&quot; data-p=&quot;60&quot; hidden&gt;&lt;h5&gt;Early 20X6: moving to development&lt;/h5&gt;&lt;p&gt;A consultant charges € 50,000, half of it at the start. The &lt;b&gt;€ 25,000&lt;/b&gt; paid is capitalised in the “Website asset” account.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; data-a=&quot;0&quot; data-p=&quot;85&quot; hidden&gt;&lt;h5&gt;End of 20X6: doubts arise&lt;/h5&gt;&lt;p&gt;The firewall and security create difficulties: it is unclear whether the website is feasible or whether the entity will manage to use it. The criterion no longer holds, so the € 25,000 is eliminated and expensed.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; data-a=&quot;55&quot; data-p=&quot;85&quot; hidden&gt;&lt;h5&gt;20X7: everything is back on track&lt;/h5&gt;&lt;p&gt;New security software, a successful test, an available market, launch planned for the start of the new year. The year&#x27;s costs are capitalised: second payment to the consultant € 25,000 + software € 30,000 = &lt;b&gt;€ 55,000&lt;/b&gt;. The € 25,000 already expensed is &lt;b&gt;not reinstated&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot; data-a=&quot;70&quot; data-p=&quot;85&quot; hidden&gt;&lt;h5&gt;Following period: the upgrade&lt;/h5&gt;&lt;p&gt;The website is upgraded to sell new imported products, at a cost of &lt;b&gt;€ 15,000&lt;/b&gt;. Probable benefits and measurable cost: it is capitalised &lt;span class=&quot;s&quot;&gt;slide 38&lt;/span&gt;. Total cash 60 + 50 + 30 + 15 = € 155,000, that is, 70 in the asset and 85 in P&amp;amp;L.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;st-nav&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Previous&lt;/button&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;span class=&quot;count&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;flag&quot;&gt;&lt;b&gt;To clarify.&lt;/b&gt; Slide 33 reads “could not &lt;i&gt;reserve&lt;/i&gt;”: this is a typo for &lt;i&gt;reverse&lt;/i&gt;. The rule is in IAS 38.71: expenditure already recognised as an expense cannot later become part of cost. In addition, IAS 38.65 capitalises only from the date on which the criteria are first met; the slide takes all the costs of 20X7, which in a real case would have to be separated by date. &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias38.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · IAS 38.65, 38.71 ↗&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Beyond the slides.&lt;/b&gt; There is a dedicated interpretation for websites, SIC-32: the planning phase is expensed like research, the development of applications and infrastructure can be capitalised under certain conditions, and the operating phase is expensed unless the criteria of IAS 38.18 are met. &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/sic32.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · SIC-32 ↗&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check, Part II&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why is the probability criterion always satisfied for a separate acquisition?&lt;/summary&gt;&lt;div&gt;Because the price already reflects expectations about future benefits: the uncertainty concerns timing and amount, not the existence of an inflow. &lt;span class=&quot;s&quot;&gt;slide 21 · IAS 38.25&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;At what value does an intangible obtained in a business combination enter?&lt;/summary&gt;&lt;div&gt;At fair value at the acquisition date, which constitutes its cost. &lt;span class=&quot;s&quot;&gt;slide 26 · IAS 38.33&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Exchange without commercial substance: at what amount is the new asset recognised?&lt;/summary&gt;&lt;div&gt;At the carrying amount of the asset given up. &lt;span class=&quot;s&quot;&gt;slide 25 · IAS 38.45&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;At the end of year 3, the six criteria are met. Can the development expenditure of years 1 and 2, already expensed, be reinstated?&lt;/summary&gt;&lt;div&gt;No, the write-off is not reversed. &lt;span class=&quot;s&quot;&gt;slide 33&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Which of the six criteria failed for the website at the end of 20X6?&lt;/summary&gt;&lt;div&gt;Technical feasibility and the ability to use it successfully: “unsure if this website would be feasible”. &lt;span class=&quot;s&quot;&gt;slide 32&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;p-slate&quot; id=&quot;parte3&quot; style=&quot;scroll-margin-top:50px&quot;&gt;
&lt;div class=&quot;part&quot;&gt;&lt;div class=&quot;n&quot;&gt;Part III&lt;/div&gt;&lt;h2&gt;Life after entry&lt;/h2&gt;&lt;p&gt;Choosing a model, allocating the cost over the years, checking that the value holds.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;t&quot; id=&quot;modelli&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;10&lt;/span&gt;Subsequent measurement: cost or revaluation&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 34&lt;/span&gt; After initial recognition, the entity chooses between two models.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;Cost model&lt;/h5&gt;&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 35 · IAS 38.74&lt;/span&gt; Cost − accumulated amortisation − accumulated impairment losses.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;Revaluation model&lt;/h5&gt;&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 36 · IAS 38.75&lt;/span&gt; Fair value at the revaluation date − subsequent amortisation − subsequent impairment losses.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;The revaluation model has three constraints &lt;span class=&quot;s&quot;&gt;slide 36&lt;/span&gt;:&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;fair value is measured by reference to an &lt;em class=&quot;t&quot;&gt;active market&lt;/em&gt; (one in which homogeneous items are traded continuously at observable prices);&lt;/li&gt;
&lt;li&gt;revaluations are regular enough to prevent the carrying amount from differing materially from fair value at the end of the reporting period;&lt;/li&gt;
&lt;li&gt;it applies to the entire &lt;b&gt;class&lt;/b&gt; of assets, except for assets in the class for which no active market exists &lt;span class=&quot;s&quot;&gt;IAS 38.72&lt;/span&gt;.&lt;/li&gt;&lt;/ul&gt;
&lt;div id=&quot;rv&quot; class=&quot;stepper&quot; style=&quot;padding-bottom:14px&quot;&gt;
&lt;div class=&quot;own&quot;&gt;constructed example: € 100,000 asset, 10-year life, straight-line&lt;/div&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 240&quot; role=&quot;img&quot; aria-label=&quot;Chart of the carrying amount under the cost model and the revaluation model&quot; style=&quot;margin-top:8px&quot;&gt;&lt;g id=&quot;rvG&quot;&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;p class=&quot;meta&quot; style=&quot;margin:2px 0;text-align:center&quot;&gt;Dashed line: cost model. Solid line: revaluation model. X-axis: years.&lt;/p&gt;
&lt;div class=&quot;ctl&quot;&gt;
&lt;label&gt;Revaluation date &lt;output id=&quot;rvKo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;rvK&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;9&quot; step=&quot;1&quot; value=&quot;4&quot;&gt;&lt;/label&gt;
&lt;label&gt;Fair value at that date &lt;output id=&quot;rvFo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;rvF&quot; type=&quot;range&quot; min=&quot;10000&quot; max=&quot;120000&quot; step=&quot;1000&quot; value=&quot;70000&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;rvRead&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Beyond the slides.&lt;/b&gt; An increase goes to &lt;em class=&quot;t&quot;&gt;other comprehensive income&lt;/em&gt; (OCI, items of income outside P&amp;amp;L) and accumulates in the &lt;em class=&quot;t&quot;&gt;revaluation surplus&lt;/em&gt;, unless it reverses a previous decrease recognised in P&amp;amp;L; a decrease goes to P&amp;amp;L, but first reduces any existing surplus (38.85–86). Active markets for intangibles are rare (38.78): this is why the cost model is the common case. &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias38.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · IAS 38.78, 38.85–86 ↗&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;subseq&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;11&lt;/span&gt;Subsequent expenditure&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 37 · IAS 38.20&lt;/span&gt; This is expenditure incurred after the initial recognition of an acquired intangible or after the completion of an internally generated one. Only &lt;b&gt;rarely&lt;/b&gt; does it enter the carrying amount, for two reasons: it usually maintains existing benefits without creating new ones, and it is difficult to attribute it to that asset rather than to the business as a whole.&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;q&gt;Subsequent expenditure on brands, mastheads, publishing titles, customer lists and items similar in substance is always recognised in profit or loss as incurred.&lt;/q&gt;&lt;span class=&quot;s&quot;&gt;IAS 38.20 · slide 37&lt;/span&gt;&lt;br&gt;This applies whether they are acquired or internally generated, because such expenditure cannot be distinguished from that of developing the business. &lt;em class=&quot;t&quot;&gt;Mastheads&lt;/em&gt; are newspaper titles; &lt;em class=&quot;t&quot;&gt;publishing titles&lt;/em&gt; are the titles of published works.&lt;/div&gt;
&lt;figure&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 138&quot; role=&quot;img&quot; aria-label=&quot;Decision on subsequent expenditure&quot;&gt;
&lt;rect class=&quot;box&quot; x=&quot;8&quot; y=&quot;8&quot; width=&quot;176&quot; height=&quot;48&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m&quot; x=&quot;96&quot; y=&quot;28&quot;&gt;Brand, masthead,&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;96&quot; y=&quot;45&quot;&gt;customer list, similar?&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;8&quot; y=&quot;80&quot; width=&quot;176&quot; height=&quot;50&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m&quot; x=&quot;96&quot; y=&quot;101&quot;&gt;Meets definition and&lt;/text&gt;&lt;text class=&quot;m&quot; x=&quot;96&quot; y=&quot;118&quot;&gt;recognition criteria?&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M96 56V80&quot;/&gt;&lt;text class=&quot;sm&quot; x=&quot;104&quot; y=&quot;72&quot;&gt;no&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M184 32H300&quot;/&gt;&lt;text class=&quot;sm&quot; x=&quot;232&quot; y=&quot;26&quot;&gt;yes&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M184 90H300&quot;/&gt;&lt;text class=&quot;sm&quot; x=&quot;232&quot; y=&quot;84&quot;&gt;no&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M184 118H300&quot;/&gt;&lt;text class=&quot;sm&quot; x=&quot;232&quot; y=&quot;112&quot;&gt;yes (rare)&lt;/text&gt;
&lt;rect class=&quot;boxa&quot; x=&quot;300&quot; y=&quot;8&quot; width=&quot;170&quot; height=&quot;92&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;385&quot; y=&quot;52&quot;&gt;Expense&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;385&quot; y=&quot;70&quot;&gt;in profit or loss&lt;/text&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;300&quot; y=&quot;106&quot; width=&quot;170&quot; height=&quot;28&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;385&quot; y=&quot;125&quot;&gt;Capitalise&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;The € 15,000 website upgrade &lt;span class=&quot;s&quot;&gt;slide 38&lt;/span&gt; is the rare case: it makes it possible to sell new products, it is measurable and it brings probable benefits, so it is capitalised.&lt;/p&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;amort&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;12&lt;/span&gt;Amortisation&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slides 39–40&lt;/span&gt; &lt;em class=&quot;t&quot;&gt;Amortisation&lt;/em&gt; systematically allocates the cost over the expected useful life, down to the &lt;em class=&quot;t&quot;&gt;residual value&lt;/em&gt; (the estimated value at the end of use). It is conceptually identical to the &lt;em class=&quot;t&quot;&gt;depreciation&lt;/em&gt; of property, plant and equipment: only the name changes.&lt;/p&gt;
&lt;figure&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 148&quot; role=&quot;img&quot; aria-label=&quot;Finite useful life: amortised. Indefinite useful life: no amortisation, review each period and annual impairment test&quot;&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;170&quot; y=&quot;6&quot; width=&quot;140&quot; height=&quot;34&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;240&quot; y=&quot;28&quot;&gt;Useful life&lt;/text&gt;
&lt;path class=&quot;ar&quot; d=&quot;M240 40V52M120 52H360M120 52V64M360 52V64&quot;/&gt;
&lt;rect class=&quot;box&quot; x=&quot;16&quot; y=&quot;64&quot; width=&quot;208&quot; height=&quot;76&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;120&quot; y=&quot;86&quot;&gt;Finite&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;120&quot; y=&quot;106&quot;&gt;amortised over this period;&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;120&quot; y=&quot;124&quot;&gt;impairment test if indicated&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;256&quot; y=&quot;64&quot; width=&quot;208&quot; height=&quot;76&quot; rx=&quot;7&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;360&quot; y=&quot;86&quot;&gt;Indefinite&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;360&quot; y=&quot;106&quot;&gt;no amortisation; life reviewed&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;360&quot; y=&quot;124&quot;&gt;each period; annual test&lt;/text&gt;
&lt;/svg&gt;&lt;/figure&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slides 41–42 · IAS 38.97–98&lt;/span&gt; The method must reflect the &lt;b&gt;pattern of consumption&lt;/b&gt; of the benefits, applied consistently from one period to the next unless the pattern changes. If it cannot be determined reliably, the &lt;b&gt;straight-line&lt;/b&gt; method is used.&lt;/p&gt;
&lt;div id=&quot;am&quot; class=&quot;stepper&quot; style=&quot;padding-bottom:14px&quot;&gt;
&lt;div data-tabs id=&quot;amT&quot;&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Amortisation method&quot;&gt;
&lt;button role=&quot;tab&quot;&gt;Straight-line&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Diminishing balance&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Units of production&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;&lt;p class=&quot;formula&quot; style=&quot;border:0;margin:6px 0&quot;&gt;Charge = (cost − residual value) ÷ useful life&lt;/p&gt;&lt;p style=&quot;font-size:15px&quot;&gt;The same charge every year. It is also the fallback method.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p class=&quot;formula&quot; style=&quot;border:0;margin:6px 0&quot;&gt;Charge = rate × carrying amount at the start of the year&lt;/p&gt;&lt;p style=&quot;font-size:15px&quot;&gt;High charges at the start, suited to benefits consumed early. Here the rate is 2 ÷ useful life, with the final year reaching the residual value &lt;span class=&quot;own&quot;&gt;illustrative choice&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;&lt;p class=&quot;formula&quot; style=&quot;border:0;margin:6px 0&quot;&gt;Charge = depreciable amount × units for the year ÷ total units&lt;/p&gt;&lt;p style=&quot;font-size:15px&quot;&gt;It follows actual use. The bell-shaped production profile is invented &lt;span class=&quot;own&quot;&gt;illustrative choice&lt;/span&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 240&quot; role=&quot;img&quot; aria-label=&quot;Chart of the carrying amount and the annual amortisation charges&quot; style=&quot;margin-top:12px&quot;&gt;&lt;g id=&quot;amG&quot;&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;p class=&quot;meta&quot; style=&quot;margin:2px 0;text-align:center&quot;&gt;Solid line: carrying amount under the chosen method. Dashed lines: the other two. Bars: annual charge. X-axis: years.&lt;/p&gt;
&lt;div class=&quot;ctl&quot;&gt;
&lt;label&gt;Cost &lt;output id=&quot;amCo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;amC&quot; type=&quot;range&quot; min=&quot;10000&quot; max=&quot;200000&quot; step=&quot;5000&quot; value=&quot;100000&quot;&gt;&lt;/label&gt;
&lt;label&gt;Residual value &lt;output id=&quot;amRo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;amR&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;40&quot; step=&quot;5&quot; value=&quot;0&quot;&gt;&lt;/label&gt;
&lt;label&gt;Useful life &lt;output id=&quot;amNo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;amN&quot; type=&quot;range&quot; min=&quot;2&quot; max=&quot;15&quot; step=&quot;1&quot; value=&quot;5&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;amRead&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;What is reviewed at each year-end&lt;/h4&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th&gt;When&lt;/th&gt;&lt;th&gt;If it changes&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;Residual value&lt;/td&gt;&lt;td&gt;At least at each financial year-end &lt;span class=&quot;s&quot;&gt;38.102&lt;/span&gt;&lt;/td&gt;&lt;td&gt;The estimate is updated&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Amortisation period and method, finite life&lt;/td&gt;&lt;td&gt;At least at each financial year-end &lt;span class=&quot;s&quot;&gt;38.104&lt;/span&gt;&lt;/td&gt;&lt;td&gt;They are adjusted: &lt;em class=&quot;t&quot;&gt;change in accounting estimate&lt;/em&gt; (IAS 8)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Indefinite useful life&lt;/td&gt;&lt;td&gt;Each period &lt;span class=&quot;s&quot;&gt;38.109&lt;/span&gt;&lt;/td&gt;&lt;td&gt;From indefinite to finite: change in accounting estimate (IAS 8)&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;meta&quot;&gt;Table from &lt;span class=&quot;s&quot;&gt;slide 43&lt;/span&gt;. The rows are taken from the slides; “The estimate is updated” is an explanation, not slide text.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Beyond the slides.&lt;/b&gt; A &lt;em class=&quot;t&quot;&gt;change in estimate&lt;/em&gt; is applied prospectively: past years are not restated. From 1 January 2027, IAS 8 is titled &lt;i&gt;Basis of Preparation of Financial Statements&lt;/i&gt;, as a result of IFRS 18. The residual value is presumed to be zero unless a third party has committed to purchase the asset or an active market exists (38.100); “indefinite” does not mean “infinite” (38.91); amortisation begins when the asset is available for use (38.97). Basing amortisation on revenue is presumed to be inappropriate (38.98A).
&lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-8-basis-of-preparation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · IAS 8 ↗&lt;/a&gt; &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias38.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · IAS 38 ↗&lt;/a&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;impair&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;13&lt;/span&gt;Impairment&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 44&lt;/span&gt; An asset is &lt;em class=&quot;t&quot;&gt;impaired&lt;/em&gt; (it has suffered a lasting loss of value) if its carrying amount exceeds its &lt;em class=&quot;t&quot;&gt;recoverable amount&lt;/em&gt;. For the calculation, the slides refer to IAS 36.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;Finite life&lt;/h5&gt;&lt;p&gt;Test only if there is &lt;b&gt;evidence&lt;/b&gt; of impairment.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;Indefinite life&lt;/h5&gt;&lt;p&gt;Test &lt;b&gt;every year&lt;/b&gt;, even without indications, as well as whenever there is evidence.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Beyond the slides: the IAS 36 formula.&lt;/b&gt; Recoverable amount = the higher of &lt;em class=&quot;t&quot;&gt;fair value less costs of disposal&lt;/em&gt; (FVLCD, what you would receive from selling, net of costs) and &lt;em class=&quot;t&quot;&gt;value in use&lt;/em&gt; (VIU, the present value of the future cash flows expected from use). The annual test also applies to intangibles not yet available for use and to goodwill. If the individual asset does not generate independent cash flows, the test is performed on the &lt;em class=&quot;t&quot;&gt;cash-generating unit&lt;/em&gt;. &lt;a class=&quot;x&quot; href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias36.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;external source · IAS 36 ↗&lt;/a&gt;&lt;/div&gt;
&lt;div id=&quot;imp&quot; class=&quot;stepper&quot; style=&quot;padding-bottom:14px&quot;&gt;
&lt;div class=&quot;own&quot;&gt;constructed example: try the test&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;
&lt;label&gt;Carrying amount &lt;output id=&quot;impAo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;impA&quot; type=&quot;range&quot; min=&quot;10000&quot; max=&quot;150000&quot; step=&quot;1000&quot; value=&quot;90000&quot;&gt;&lt;/label&gt;
&lt;label&gt;FVLCD &lt;output id=&quot;impFo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;impF&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;150000&quot; step=&quot;1000&quot; value=&quot;60000&quot;&gt;&lt;/label&gt;
&lt;label&gt;VIU &lt;output id=&quot;impVo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;impV&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;150000&quot; step=&quot;1000&quot; value=&quot;72000&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;bars&quot;&gt;
&lt;div class=&quot;bar m&quot;&gt;&lt;span&gt;Carrying amount&lt;/span&gt;&lt;div class=&quot;tr&quot;&gt;&lt;div class=&quot;fl&quot; id=&quot;impB1&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;span&gt;Recoverable&lt;/span&gt;&lt;div class=&quot;tr&quot;&gt;&lt;div class=&quot;fl&quot; id=&quot;impB2&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;bar a&quot;&gt;&lt;span&gt;Impairment loss&lt;/span&gt;&lt;div class=&quot;tr&quot;&gt;&lt;div class=&quot;fl&quot; id=&quot;impB3&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;meta&quot; style=&quot;margin:0&quot;&gt;Carrying &lt;span id=&quot;impT1&quot;&gt;&lt;/span&gt; · Recoverable &lt;span id=&quot;impT2&quot;&gt;&lt;/span&gt; · Loss &lt;span id=&quot;impT3&quot;&gt;&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;read&quot; id=&quot;impRead&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check, Part III&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Revaluation model for a trademark: can that trademark alone be revalued?&lt;/summary&gt;&lt;div&gt;No: the entire class must follow the revaluation model, except for assets in the class with no active market. &lt;span class=&quot;s&quot;&gt;slide 36 · IAS 38.72&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Which method is used if the consumption of benefits cannot be determined?&lt;/summary&gt;&lt;div&gt;The straight-line method. &lt;span class=&quot;s&quot;&gt;slide 42 · IAS 38.97&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Is an intangible with an indefinite life amortised? What checks does it require?&lt;/summary&gt;&lt;div&gt;It is not amortised; the useful life is reviewed each period and the impairment test is annual, even without indications. &lt;span class=&quot;s&quot;&gt;slides 40, 43, 44&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;You spend money to relaunch a brand already recognised. Can you add the expenditure to the asset?&lt;/summary&gt;&lt;div&gt;No: subsequent expenditure on brands always goes to profit or loss. &lt;span class=&quot;s&quot;&gt;slide 37 · IAS 38.20&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Carrying amount 100, FVLCD 80, VIU 90. What is the loss?&lt;/summary&gt;&lt;div&gt;Recoverable amount = 90, the higher figure. Loss = 100 − 90 = 10. &lt;span class=&quot;own&quot;&gt;constructed example&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;How is the change from an indefinite to a finite useful life accounted for?&lt;/summary&gt;&lt;div&gt;As a change in accounting estimate under IAS 8. &lt;span class=&quot;s&quot;&gt;slide 43 · IAS 38.109&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;p-brick&quot; id=&quot;parte4&quot; style=&quot;scroll-margin-top:50px&quot;&gt;
&lt;div class=&quot;part&quot;&gt;&lt;div class=&quot;n&quot;&gt;Part IV&lt;/div&gt;&lt;h2&gt;Exit, disclosure, cases&lt;/h2&gt;&lt;p&gt;How the life of the asset ends, what must be reported in the notes and how to reason through a complete case.&lt;/p&gt;&lt;/div&gt;

&lt;section class=&quot;t&quot; id=&quot;derec&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;14&lt;/span&gt;Derecognition&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 45 · IAS 38.112–114&lt;/span&gt; &lt;em class=&quot;t&quot;&gt;Derecognition&lt;/em&gt; (removal from the financial statements) occurs in two cases: on &lt;em class=&quot;t&quot;&gt;disposal&lt;/em&gt;, or when no further benefits are expected from use or disposal.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Gain or loss = net disposal proceeds − carrying amount&lt;/div&gt;
&lt;ul&gt;&lt;li&gt;It goes to profit or loss on derecognition, unless IFRS 16 requires otherwise for a &lt;em class=&quot;t&quot;&gt;sale and leaseback&lt;/em&gt; (the sale of an asset that is then leased back).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Gains are not revenue&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Disposal may occur through sale, finance lease or donation. The date is that on which the recipient obtains control, under the IFRS 15 rules on the satisfaction of a performance obligation.&lt;/li&gt;&lt;/ul&gt;
&lt;div id=&quot;der&quot; class=&quot;stepper&quot; style=&quot;padding-bottom:14px&quot;&gt;
&lt;div class=&quot;own&quot;&gt;constructed example&lt;/div&gt;
&lt;div class=&quot;ctl&quot;&gt;
&lt;label&gt;Carrying amount &lt;output id=&quot;derAo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;derA&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100000&quot; step=&quot;1000&quot; value=&quot;40000&quot;&gt;&lt;/label&gt;
&lt;label&gt;Net disposal proceeds &lt;output id=&quot;derPo&quot;&gt;&lt;/output&gt;&lt;input id=&quot;derP&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100000&quot; step=&quot;1000&quot; value=&quot;55000&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div class=&quot;read&quot; id=&quot;derRead&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;discl&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;15&lt;/span&gt;Disclosure&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slides 46–50&lt;/span&gt; Disclosure is provided by &lt;b&gt;class&lt;/b&gt; of intangible, separating internally generated assets from the others.&lt;/p&gt;
&lt;div data-tabs&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Disclosure requirements&quot;&gt;
&lt;button role=&quot;tab&quot;&gt;For each class&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Specific cases&lt;/button&gt;&lt;button role=&quot;tab&quot;&gt;Revaluation&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot;&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slides 46–47 · IAS 38.118&lt;/span&gt;&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;
&lt;li&gt;indefinite or finite useful lives; if finite, the useful lives or amortisation rates;&lt;/li&gt;
&lt;li&gt;amortisation methods for finite lives;&lt;/li&gt;
&lt;li&gt;&lt;em class=&quot;t&quot;&gt;gross carrying amount&lt;/em&gt; (the amount before amortisation and impairment) and accumulated amortisation, aggregated with impairment losses, at the beginning and end of the period;&lt;/li&gt;
&lt;li&gt;the line items of the &lt;em class=&quot;t&quot;&gt;statement of comprehensive income&lt;/em&gt; that include amortisation;&lt;/li&gt;
&lt;li&gt;a &lt;em class=&quot;t&quot;&gt;reconciliation&lt;/em&gt; (a statement linking the opening and closing balances) of the carrying amount between the beginning and end of the period.&lt;/li&gt;
&lt;/ol&gt;
&lt;svg class=&quot;d&quot; viewBox=&quot;0 0 480 110&quot; role=&quot;img&quot; aria-label=&quot;Example of a reconciliation with additions, revaluations, amortisation, impairment and disposals&quot;&gt;
&lt;rect class=&quot;box&quot; x=&quot;4&quot; y=&quot;28&quot; width=&quot;70&quot; height=&quot;46&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;m sm&quot; x=&quot;39&quot; y=&quot;48&quot;&gt;Start of&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;39&quot; y=&quot;64&quot;&gt;period&lt;/text&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;86&quot; y=&quot;28&quot; width=&quot;62&quot; height=&quot;46&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;117&quot; y=&quot;48&quot;&gt;+&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;117&quot; y=&quot;66&quot;&gt;additions&lt;/text&gt;
&lt;rect class=&quot;boxc&quot; x=&quot;152&quot; y=&quot;28&quot; width=&quot;66&quot; height=&quot;46&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;185&quot; y=&quot;48&quot;&gt;±&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;185&quot; y=&quot;66&quot;&gt;revaluat.&lt;/text&gt;
&lt;rect class=&quot;boxa&quot; x=&quot;222&quot; y=&quot;28&quot; width=&quot;62&quot; height=&quot;46&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;253&quot; y=&quot;48&quot;&gt;−&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;253&quot; y=&quot;66&quot;&gt;amortis.&lt;/text&gt;
&lt;rect class=&quot;boxa&quot; x=&quot;288&quot; y=&quot;28&quot; width=&quot;62&quot; height=&quot;46&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;319&quot; y=&quot;48&quot;&gt;−&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;319&quot; y=&quot;66&quot;&gt;impairm.&lt;/text&gt;
&lt;rect class=&quot;boxa&quot; x=&quot;354&quot; y=&quot;28&quot; width=&quot;56&quot; height=&quot;46&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;m b&quot; x=&quot;382&quot; y=&quot;48&quot;&gt;−&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;382&quot; y=&quot;66&quot;&gt;disposals&lt;/text&gt;
&lt;rect class=&quot;box&quot; x=&quot;416&quot; y=&quot;28&quot; width=&quot;60&quot; height=&quot;46&quot; rx=&quot;5&quot;/&gt;&lt;text class=&quot;m sm&quot; x=&quot;446&quot; y=&quot;48&quot;&gt;End of&lt;/text&gt;&lt;text class=&quot;m sm&quot; x=&quot;446&quot; y=&quot;64&quot;&gt;period&lt;/text&gt;
&lt;text class=&quot;sm m&quot; x=&quot;240&quot; y=&quot;96&quot;&gt;The reconciliation in one line&lt;/text&gt;
&lt;/svg&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slides 48–49 · IAS 38.122&lt;/span&gt;&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;
&lt;li&gt;indefinite life: carrying amount and the &lt;b&gt;reasons&lt;/b&gt; for the assessment, with the determining factors;&lt;/li&gt;
&lt;li&gt;individual &lt;b&gt;material&lt;/b&gt; asset (significant to the financial statements): description, carrying amount, remaining amortisation period;&lt;/li&gt;
&lt;li&gt;obtained through a &lt;em class=&quot;t&quot;&gt;government grant&lt;/em&gt; (public funding) and recognised at fair value: initial fair value, carrying amount, model used after recognition;&lt;/li&gt;
&lt;li&gt;assets with restricted title, and the carrying amount of those &lt;em class=&quot;t&quot;&gt;pledged as security&lt;/em&gt; (given as collateral);&lt;/li&gt;
&lt;li&gt;contractual commitments to acquire intangibles.&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; hidden&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slide 50 · IAS 38.124&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;by class: effective date of the revaluation; revalued carrying amount; carrying amount that would have resulted under the cost model;&lt;/li&gt;
&lt;li&gt;the &lt;b&gt;revaluation surplus&lt;/b&gt; on intangibles at the beginning and end of the period, the changes and any restrictions on distribution to shareholders.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;t&quot; id=&quot;alfa&quot;&gt;
&lt;h3&gt;&lt;span class=&quot;k&quot;&gt;16&lt;/span&gt;Alfa case: the reorganisation&lt;/h3&gt;
&lt;p&gt;&lt;span class=&quot;s&quot;&gt;slides 51–52&lt;/span&gt; Alfa has two plants, Z and X, in different cities. On 01/01/20X0 it reorganises: it closes X, Z remains the only active plant, and it buys new machinery. How does IAS 38 treat these costs? Try it yourself: &lt;b&gt;SFP&lt;/b&gt; (statement of financial position, that is, asset) or &lt;b&gt;IS&lt;/b&gt; (income statement, that is, expense)?&lt;/p&gt;
&lt;div data-sorter&gt;
&lt;div class=&quot;tot&quot;&gt;&lt;div&gt;&lt;b data-t=&quot;sfp&quot;&gt;&lt;/b&gt;in SFP&lt;/div&gt;&lt;div&gt;&lt;b data-t=&quot;is&quot;&gt;&lt;/b&gt;in IS&lt;/div&gt;&lt;div&gt;&lt;b data-t=&quot;n&quot;&gt;&lt;/b&gt;classified&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;is&quot; data-amt=&quot;1000000&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Closure of plant X · € 1,000,000&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;sfp&quot;&gt;SFP&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;is&quot;&gt;IS&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;b&gt;IS.&lt;/b&gt; There are no future economic benefits. &lt;span class=&quot;s&quot;&gt;slide 53&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sort-item&quot; data-a=&quot;is&quot; data-amt=&quot;90000&quot;&gt;&lt;div class=&quot;sort-row&quot;&gt;&lt;div class=&quot;q&quot;&gt;Feasibility study · € 90,000&lt;/div&gt;&lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-v=&quot;sfp&quot;&gt;SFP&lt;/button&gt;&lt;button class=&quot;btn&quot; data-v=&quot;is&quot;&gt;IS&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;why&quot; hidden&gt;&lt;span class=&quot;fb&quot;&gt;&lt;/span&gt;&lt;b&gt;IS.&lt;/b&gt; It is similar to research expenditure: an expense when incurred. &lt;span class=&quot;s&quot;&gt;slide 53&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
