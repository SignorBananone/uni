&lt;h1&gt;IAS 40 &lt;span&gt;Investment Property&lt;/span&gt;&lt;/h1&gt;
&lt;p class=&quot;deck&quot;&gt;How to account for a property held neither for use nor for sale, but for the return it generates: its life in the financial statements, from entry to exit, and the disclosure that accompanies it.&lt;/p&gt;

&lt;main&gt;
&lt;section id=&quot;s1&quot; class=&quot;part sage&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;h2&gt;Definition, objective and scope&lt;/h2&gt;&lt;p&gt;What the standard governs and what it leaves out.&lt;/p&gt;&lt;/header&gt;

&lt;p&gt;IAS 40 deals with &lt;i lang=&quot;en&quot;&gt;property&lt;/i&gt; (real estate: &lt;i lang=&quot;en&quot;&gt;land&lt;/i&gt; and &lt;i lang=&quot;en&quot;&gt;buildings&lt;/i&gt;) held to earn &lt;i lang=&quot;en&quot;&gt;rentals&lt;/i&gt; (rental income), for &lt;i lang=&quot;en&quot;&gt;capital appreciation&lt;/i&gt; (growth in value over time) or for both. &lt;span class=&quot;src&quot;&gt;Slide 2&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;def&quot;&gt;
&lt;p&gt;&lt;strong&gt;Investment property&lt;/strong&gt; (&lt;strong&gt;IP&lt;/strong&gt; from here on)&lt;/p&gt;
&lt;p class=&quot;q&quot;&gt;Land or a building, or part of a building, or both, held by the owner or by the lessee as a right-of-use asset, to earn rentals or for capital appreciation or both.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;src&quot;&gt;Slide 5 · IAS 40.5&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;p&gt;The definition has three elements, and each one resolves a different problem:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;What&lt;/h4&gt;&lt;p&gt;Land, a building &lt;em&gt;or part of a building&lt;/em&gt;. Even a single floor of a block can therefore qualify.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Who holds it&lt;/h4&gt;&lt;p&gt;The owner, or the &lt;i lang=&quot;en&quot;&gt;lessee&lt;/i&gt; through a &lt;i lang=&quot;en&quot;&gt;right-of-use asset&lt;/i&gt;, that is, the asset representing the right to use the leased item.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Why&lt;/h4&gt;&lt;p&gt;For the return, not for production or for sale in the ordinary course of business.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Supplement&lt;/span&gt;This is the logic of the &lt;em&gt;why&lt;/em&gt;: a factory is worth what is produced in it, whereas a leased building is worth its rentals and its value on the property market. This is why it makes sense to present the latter at &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt;, with changes recognised in the result for the period. A clarification added in this summary, not stated in the slides.&lt;/div&gt;

&lt;h3&gt;Objective&lt;/h3&gt;
&lt;p&gt;The standard prescribes two things: the &lt;i lang=&quot;en&quot;&gt;accounting treatment&lt;/i&gt; and the &lt;i lang=&quot;en&quot;&gt;disclosure requirements&lt;/i&gt; (the information to be given in the notes). &lt;span class=&quot;src&quot;&gt;Slide 3 · IAS 40.1&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Scope&lt;/h3&gt;
&lt;p&gt;It applies to the &lt;i lang=&quot;en&quot;&gt;recognition&lt;/i&gt; (when to record the item), &lt;i lang=&quot;en&quot;&gt;measurement&lt;/i&gt; (at what amount) and &lt;i lang=&quot;en&quot;&gt;disclosure&lt;/i&gt; (what to report) of IP. &lt;span class=&quot;src&quot;&gt;Slide 4 · IAS 40.2&lt;/span&gt;&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 440 180&quot; style=&quot;max-width:36rem&quot; role=&quot;img&quot; aria-label=&quot;The scope of IAS 40 with its two exclusions: biological assets and mineral rights&quot;&gt;
&lt;g class=&quot;nd on&quot;&gt;&lt;rect x=&quot;110&quot; y=&quot;6&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;220&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;IAS 40 applies to IP&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;recognition · measurement · disclosure&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M170 62 110 96M270 62 330 96&quot;/&gt;
&lt;text class=&quot;sv-l&quot; x=&quot;220&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot;&gt;does not apply to&lt;/text&gt;
&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;96&quot; width=&quot;210&quot; height=&quot;78&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;109&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot;&gt;Biological assets&lt;/text&gt;&lt;text x=&quot;109&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot;&gt;related to agricultural activity&lt;/text&gt;&lt;text x=&quot;109&quot; y=&quot;156&quot; text-anchor=&quot;middle&quot;&gt;IAS 41 and IAS 16&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;226&quot; y=&quot;96&quot; width=&quot;210&quot; height=&quot;78&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;331&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot;&gt;Mineral rights and reserves&lt;/text&gt;&lt;text x=&quot;331&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot;&gt;oil, natural gas and similar&lt;/text&gt;&lt;text x=&quot;331&quot; y=&quot;156&quot; text-anchor=&quot;middle&quot;&gt;non-regenerative resources&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;The two exclusions. &lt;span class=&quot;src&quot;&gt;Slide 4 · IAS 40.4&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;Why the slide cites both IAS 41 and IAS 16: since 2014, &lt;i lang=&quot;en&quot;&gt;bearer plants&lt;/i&gt; (plants that bear produce over several periods, such as vines and fruit trees) have fallen under IAS 16, while the produce they bear remains under IAS 41. &lt;a href=&quot;https://www.ifrs.org/news-and-events/news/2014/06/iasb-issues-amendments-to-ias-16-and-ias-41-for-bearer-plants/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, 2014 news item&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Can a lessee hold IP without being the owner?&lt;/summary&gt;&lt;div&gt;Yes. The definition includes the &lt;i lang=&quot;en&quot;&gt;lessee&lt;/i&gt; holding it as a &lt;i lang=&quot;en&quot;&gt;right-of-use asset&lt;/i&gt;, provided that the purpose is to earn rentals or capital appreciation. &lt;span class=&quot;src&quot;&gt;Slide 5&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Which two areas are expressly excluded from IAS 40?&lt;/summary&gt;&lt;div&gt;&lt;i lang=&quot;en&quot;&gt;Biological assets&lt;/i&gt; related to agricultural activity, and &lt;i lang=&quot;en&quot;&gt;mineral rights&lt;/i&gt; and &lt;i lang=&quot;en&quot;&gt;mineral reserves&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 4&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Does land bought to profit from growth in value, without any lease, meet the definition?&lt;/summary&gt;&lt;div&gt;Yes: one of the two purposes is enough. &quot;&lt;i lang=&quot;en&quot;&gt;Or both&lt;/i&gt;&quot; means that rentals and &lt;i lang=&quot;en&quot;&gt;capital appreciation&lt;/i&gt; may be alternative or cumulative.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s2&quot; class=&quot;part ochre&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;h2&gt;Classification&lt;/h2&gt;&lt;p&gt;IP or &lt;i lang=&quot;en&quot;&gt;owner-occupied property&lt;/i&gt;: use determines the standard (paras. 6-15).&lt;/p&gt;&lt;/header&gt;
&lt;p&gt;&lt;i lang=&quot;en&quot;&gt;Owner-occupied property&lt;/i&gt; is property used by the entity itself for production, for the supply of services or for administration. The same walls may fall under different standards depending on their use.&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 440 262&quot; style=&quot;max-width:36rem&quot; role=&quot;img&quot; aria-label=&quot;A property may fall under IAS 40, IAS 16 or IFRS 16, or IAS 2, or leave the lessor&#x27;s statement of financial position under a finance lease&quot;&gt;
&lt;g class=&quot;nd on&quot;&gt;&lt;rect x=&quot;130&quot; y=&quot;4&quot; width=&quot;180&quot; height=&quot;46&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;220&quot; y=&quot;24&quot; text-anchor=&quot;middle&quot;&gt;A property&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot;&gt;why do you hold it?&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M170 50 112 84M270 50 328 84M190 50 112 170M250 50 328 170&quot;/&gt;
&lt;g class=&quot;nd on&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;84&quot; width=&quot;208&quot; height=&quot;66&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;108&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot;&gt;For rentals or growth in value&lt;/text&gt;&lt;text x=&quot;108&quot; y=&quot;124&quot; text-anchor=&quot;middle&quot;&gt;Investment property&lt;/text&gt;&lt;text x=&quot;108&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot;&gt;IAS 40&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;228&quot; y=&quot;84&quot; width=&quot;208&quot; height=&quot;66&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;332&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot;&gt;For use&lt;/text&gt;&lt;text x=&quot;332&quot; y=&quot;124&quot; text-anchor=&quot;middle&quot;&gt;Owner-occupied&lt;/text&gt;&lt;text x=&quot;332&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot;&gt;IAS 16 and IFRS 16&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;170&quot; width=&quot;208&quot; height=&quot;82&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;108&quot; y=&quot;192&quot; text-anchor=&quot;middle&quot;&gt;For sale in the ordinary course&lt;/text&gt;&lt;text x=&quot;108&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;Inventories&lt;/text&gt;&lt;text x=&quot;108&quot; y=&quot;226&quot; text-anchor=&quot;middle&quot;&gt;IAS 2&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;228&quot; y=&quot;170&quot; width=&quot;208&quot; height=&quot;82&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;332&quot; y=&quot;192&quot; text-anchor=&quot;middle&quot;&gt;Under a finance lease&lt;/text&gt;&lt;text x=&quot;332&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;Not IP: risks and rewards&lt;/text&gt;&lt;text x=&quot;332&quot; y=&quot;226&quot; text-anchor=&quot;middle&quot;&gt;pass to the other party&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;The possible destinations. &lt;span class=&quot;src&quot;&gt;Slides 6-8&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;IP&lt;/button&gt;&lt;button&gt;Not IP&lt;/button&gt;&lt;button&gt;Borderline cases&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;p&gt;Examples of IP &lt;span class=&quot;src&quot;&gt;Slide 6 · IAS 40.8&lt;/span&gt;&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;
&lt;li&gt;&lt;strong&gt;Land held for long-term capital appreciation&lt;/strong&gt;, not for short-term sale in the ordinary course of business.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Land with a currently undetermined future use&lt;/strong&gt;: if the entity has not decided to use it or to sell it in the short term, it is regarded as held for capital appreciation.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;A building owned, or a &lt;i lang=&quot;en&quot;&gt;right-of-use asset&lt;/i&gt; relating to a building, leased out under an &lt;i lang=&quot;en&quot;&gt;operating lease&lt;/i&gt;&lt;/strong&gt; (a lease that does not transfer substantially all the risks and rewards of ownership).&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;A vacant building held to be leased out under an &lt;i lang=&quot;en&quot;&gt;operating lease&lt;/i&gt;&lt;/strong&gt;: what matters is its intended purpose, not whether it is let today.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Property being constructed or developed for future use as IP.&lt;/strong&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;p&gt;Outside the scope of IAS 40 &lt;span class=&quot;src&quot;&gt;Slides 7-8 · IAS 40.5, 40.9&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Property used&lt;/strong&gt; in the production or supply of goods or services, or for administrative purposes.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Property intended for sale&lt;/strong&gt; in the ordinary course of business, or being constructed or developed for such sale (IAS 2): for example, property acquired solely for resale in the near future or for development and resale.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;&lt;i lang=&quot;en&quot;&gt;Owner-occupied property&lt;/i&gt;&lt;/strong&gt; (IAS 16 and IFRS 16), including: property held for future use by the owner; property held for future development and subsequent use by the owner; property occupied by employees, &lt;em&gt;even if they pay rent at market rates&lt;/em&gt;; owner-occupied property awaiting disposal.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Property leased to another entity under a &lt;i lang=&quot;en&quot;&gt;finance lease&lt;/i&gt;&lt;/strong&gt; (a lease that transfers substantially all the risks and rewards).&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Supplement&lt;/span&gt;The employee case is counterintuitive: even at a market rent, the accommodation serves the entity&#x27;s business, so it is not a stand-alone investment.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;p&gt;The slides indicate the range paras. 6-15 but do not cover these cases, which are useful for the exam.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Supplement&lt;/span&gt;&lt;strong&gt;Not in the slides and not verified through web search: check against the &lt;a href=&quot;https://www.ifrs.org/content/ifrs/home/issued-standards/list-of-standards/ias-40-investment-property.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;text of IAS 40&lt;/a&gt;.&lt;/strong&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Mixed-use property (para. 10)&lt;/summary&gt;&lt;div&gt;If the two portions can be sold or leased out under a &lt;i lang=&quot;en&quot;&gt;finance lease&lt;/i&gt; separately, they are accounted for separately. If not, the property is IP only if the portion held for own use is insignificant.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Ancillary services to occupants (paras. 11-13)&lt;/summary&gt;&lt;div&gt;With ancillary services (security, maintenance), it remains IP. If the services are significant, as in an owner-managed hotel, it is &lt;i lang=&quot;en&quot;&gt;owner-occupied&lt;/i&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Property leased to a group company (para. 15)&lt;/summary&gt;&lt;div&gt;In the consolidated financial statements it is &lt;i lang=&quot;en&quot;&gt;owner-occupied&lt;/i&gt;, because the group uses it. In the separate financial statements of the entity leasing it out, it may be IP.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;widget&quot; id=&quot;sorter&quot;&gt;
&lt;h4&gt;Try classifying&lt;/h4&gt;
&lt;p class=&quot;hint&quot;&gt;One case at a time: decide, then read why.&lt;/p&gt;
&lt;p id=&quot;sq&quot; style=&quot;font:400 1.2rem/1.35 var(--serif);min-height:3.3em;margin:.4rem 0&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;btns&quot;&gt;&lt;button id=&quot;sy&quot;&gt;Investment property&lt;/button&gt;&lt;button id=&quot;sn&quot;&gt;Not investment property&lt;/button&gt;&lt;button id=&quot;snx&quot; hidden&gt;Next case&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;feedback&quot; id=&quot;sf&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;hint&quot; id=&quot;ss&quot;&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Is a building that is vacant today, but intended for leasing, IP?&lt;/summary&gt;&lt;div&gt;Yes, if it is held to be leased out under one or more &lt;i lang=&quot;en&quot;&gt;operating leases&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 6&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between an operating lease and a finance lease for the owner-lessor?&lt;/summary&gt;&lt;div&gt;Under an &lt;i lang=&quot;en&quot;&gt;operating lease&lt;/i&gt; the building may be IP. Under a &lt;i lang=&quot;en&quot;&gt;finance lease&lt;/i&gt; it is not. &lt;span class=&quot;src&quot;&gt;Slides 6, 8&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Land with no determined use: why does its classification not remain open?&lt;/summary&gt;&lt;div&gt;The standard presumes that it is held for capital appreciation, so it is IP until the entity determines an own use or a short-term sale. &lt;span class=&quot;src&quot;&gt;Slide 6&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s3&quot; class=&quot;part slate&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;h2&gt;Recognition and measurement at recognition&lt;/h2&gt;&lt;p&gt;When the property enters the financial statements, and at what amount (paras. 16-29A).&lt;/p&gt;&lt;/header&gt;
&lt;h3&gt;Recognition: two conditions, both necessary&lt;/h3&gt;
&lt;p&gt;&lt;i lang=&quot;en&quot;&gt;Recognition&lt;/i&gt; means recording the item in the financial statements. An owned IP is recognised as an asset &lt;em&gt;when, and only when&lt;/em&gt;:&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 440 150&quot; style=&quot;max-width:36rem&quot; role=&quot;img&quot; aria-label=&quot;Probable economic benefits and reliably measurable cost together lead to recognition&quot;&gt;
&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;6&quot; width=&quot;210&quot; height=&quot;60&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;109&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;a) Future economic benefits&lt;/text&gt;&lt;text x=&quot;109&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;probable inflow to the entity&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;226&quot; y=&quot;6&quot; width=&quot;210&quot; height=&quot;60&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;331&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;b) Cost&lt;/text&gt;&lt;text x=&quot;331&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;reliably measurable&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M109 66 205 96M331 66 235 96&quot;/&gt;
&lt;text class=&quot;sv-l&quot; x=&quot;220&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;and&lt;/text&gt;
&lt;g class=&quot;nd on&quot;&gt;&lt;rect x=&quot;120&quot; y=&quot;96&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;220&quot; y=&quot;124&quot; text-anchor=&quot;middle&quot;&gt;Recognition as an asset&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;&lt;span class=&quot;src&quot;&gt;Slide 9 · IAS 40.16&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;h3&gt;Measurement at recognition: at cost&lt;/h3&gt;
&lt;p&gt;Measurement always starts at cost, whichever model is chosen later, with &lt;i lang=&quot;en&quot;&gt;transaction costs&lt;/i&gt; included. &lt;span class=&quot;src&quot;&gt;Slide 10 · IAS 40.20&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;The following do not increase cost &lt;span class=&quot;src&quot;&gt;Slide 10 · IAS 40.23&lt;/span&gt;:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;&lt;i lang=&quot;en&quot;&gt;Start-up costs&lt;/i&gt;&lt;/strong&gt;, unless they are necessary to bring the property to the condition needed for it to operate as intended by management.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;&lt;i lang=&quot;en&quot;&gt;Operating losses&lt;/i&gt;&lt;/strong&gt; incurred before the planned level of occupancy is reached.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Abnormal waste&lt;/strong&gt; of materials, labour or other resources in construction or development.&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;widget&quot; id=&quot;cost&quot;&gt;
&lt;h4&gt;Build up the initial cost&lt;/h4&gt;
&lt;p class=&quot;hint&quot;&gt;Select the items you think belong in cost, then check. &lt;span class=&quot;tag n&quot;&gt;Supplement&lt;/span&gt;Hypothetical figures, in thousands of euros. Legal fees and taxes are examples of transaction costs chosen for this summary.&lt;/p&gt;
&lt;div id=&quot;costl&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;tiles&quot;&gt;&lt;div class=&quot;tile&quot;&gt;&lt;b id=&quot;costv&quot;&gt;0&lt;/b&gt;&lt;span&gt;your initial cost&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;btns&quot;&gt;&lt;button class=&quot;pri&quot; id=&quot;costc&quot;&gt;Check&lt;/button&gt;&lt;button id=&quot;costr&quot;&gt;Reset&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;feedback&quot; id=&quot;costf&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;&quot;When, and only when&quot;: what does it imply?&lt;/summary&gt;&lt;div&gt;That the two conditions are necessary and sufficient: without either one the item is not recognised; with both it must be recognised. &lt;span class=&quot;src&quot;&gt;Slide 9&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Are the losses of the first months, with a half-empty building, capitalised?&lt;/summary&gt;&lt;div&gt;No. They are &lt;i lang=&quot;en&quot;&gt;operating losses&lt;/i&gt; incurred before the planned level of occupancy and are recognised in profit or loss. &lt;span class=&quot;src&quot;&gt;Slide 10&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Does an entity choosing the fair value model still start from cost?&lt;/summary&gt;&lt;div&gt;Yes. Initial measurement is at cost for an owned IP. The choice of model concerns subsequent measurement. &lt;span class=&quot;src&quot;&gt;Slides 10-11&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s4&quot; class=&quot;part brick&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;h2&gt;Measurement after recognition&lt;/h2&gt;&lt;p&gt;The central choice of the lecture: &lt;i lang=&quot;en&quot;&gt;fair value model&lt;/i&gt; or &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; (paras. 30-56).&lt;/p&gt;&lt;/header&gt;
&lt;p&gt;IAS 40 allows a choice, but &lt;strong&gt;only one method for all of the entity&#x27;s IP&lt;/strong&gt;. &lt;span class=&quot;src&quot;&gt;Slide 11 · IAS 40.30&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;A change is allowed only if the financial statements then provide reliable and &lt;em&gt;more relevant&lt;/em&gt; information, as IAS 8 requires. A change from &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; to &lt;i lang=&quot;en&quot;&gt;cost&lt;/i&gt; is &lt;strong&gt;&quot;highly unlikely&quot;&lt;/strong&gt; to meet this condition. &lt;span class=&quot;src&quot;&gt;Slide 11 · IAS 40.31&lt;/span&gt;&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 440 104&quot; style=&quot;max-width:32rem&quot; role=&quot;img&quot; aria-label=&quot;A change from the cost model to the fair value model is possible; the reverse is highly unlikely&quot;&gt;
&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;22&quot; width=&quot;120&quot; height=&quot;58&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;64&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot;&gt;Cost model&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd on&quot;&gt;&lt;rect x=&quot;316&quot; y=&quot;22&quot; width=&quot;120&quot; height=&quot;58&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;376&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot;&gt;Fair value model&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln on&quot; d=&quot;M128 38H306&quot;/&gt;&lt;path class=&quot;ln on&quot; d=&quot;M306 38l-9-5M306 38l-9 5&quot;/&gt;
&lt;text class=&quot;sv-l&quot; x=&quot;220&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;allowed if more relevant&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M312 66H134&quot; stroke-dasharray=&quot;4 5&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M134 66l9-5M134 66l9 5&quot;/&gt;
&lt;text class=&quot;sv-l&quot; x=&quot;220&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;&quot;highly unlikely&quot;&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;The slide strikes through the old title of IAS 8: with IFRS 18 it becomes &lt;i lang=&quot;en&quot;&gt;Basis of Preparation of Financial Statements&lt;/i&gt;. IFRS 18 applies to annual periods beginning on or after 1 January 2027, with early application permitted. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-8-basis-of-preparation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, IAS 8&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Supplement&lt;/span&gt;&lt;strong&gt;Not in the slides and not verified through web search:&lt;/strong&gt; IAS 40.32A permits a separate choice for IP backing liabilities that pay a return linked to its fair value (typical of insurers). Check against the &lt;a href=&quot;https://www.ifrs.org/content/ifrs/home/issued-standards/list-of-standards/ias-40-investment-property.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;text of IAS 40&lt;/a&gt;.&lt;/div&gt;

&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Fair value model&lt;/button&gt;&lt;button&gt;Cost model&lt;/button&gt;&lt;button&gt;Comparison&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;p&gt;&lt;strong&gt;Fair value&lt;/strong&gt;&lt;/p&gt;
&lt;p class=&quot;q&quot;&gt;The price that would be received to sell an asset, or paid to transfer a liability, in an orderly transaction between market participants at the measurement date.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;src&quot;&gt;Slide 12 · IAS 40.5, IFRS 13&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;An &lt;i lang=&quot;en&quot;&gt;orderly transaction&lt;/i&gt; is a normal sale, not a forced one. &lt;i lang=&quot;en&quot;&gt;Market participants&lt;/i&gt; are the actors in the market: their perspective is what counts, not that of the entity. The &lt;i lang=&quot;en&quot;&gt;measurement date&lt;/i&gt; is the date of the valuation.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;All IP is measured at &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt;, except in the cases of para. 53. &lt;span class=&quot;src&quot;&gt;Slide 12 · IAS 40.33&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Gains or losses from changes in fair value are recognised in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;&lt;/strong&gt; for the period in which they arise. &lt;span class=&quot;src&quot;&gt;Slide 13 · IAS 40.35&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;i lang=&quot;en&quot;&gt;Fair value&lt;/i&gt; reflects rental income from current leases and the other assumptions that &lt;i lang=&quot;en&quot;&gt;market participants&lt;/i&gt; would use under current conditions. &lt;span class=&quot;src&quot;&gt;Slide 13 · IAS 40.40&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;In practice, there is no separate &lt;i lang=&quot;en&quot;&gt;depreciation&lt;/i&gt;: any loss of value passes through the annual remeasurement.&lt;/p&gt;

&lt;div class=&quot;widget&quot; id=&quot;cap&quot;&gt;
&lt;h4&gt;Where does the number come from? Rentals and yield&lt;/h4&gt;
&lt;p class=&quot;hint&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Supplement&lt;/span&gt;Direct capitalisation, the simplest method, with hypothetical figures. The slides cite &lt;i lang=&quot;en&quot;&gt;discounted cash flow&lt;/i&gt; projections as an alternative measure. &lt;span class=&quot;src&quot;&gt;Slide 15&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Fair value ≈ annual net rent ÷ market yield&lt;/div&gt;
&lt;label class=&quot;sl&quot;&gt;Annual net rent &lt;output id=&quot;capno&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;capn&quot; min=&quot;20&quot; max=&quot;120&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;Yield required by the market &lt;output id=&quot;capyo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;capy&quot; min=&quot;3&quot; max=&quot;10&quot; step=&quot;0.25&quot; value=&quot;6&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;tiles&quot;&gt;&lt;div class=&quot;tile&quot;&gt;&lt;b id=&quot;capv&quot;&gt;&lt;/b&gt;&lt;span&gt;estimated fair value, € thousand&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;hint&quot; id=&quot;capt&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;DCF: Fair value = Σ CF&lt;sub&gt;t&lt;/sub&gt; ÷ (1 + r)&lt;sup&gt;t&lt;/sup&gt; + terminal value ÷ (1 + r)&lt;sup&gt;n&lt;/sup&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;IFRS 13 fair value hierarchy: the three levels&lt;/summary&gt;&lt;div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;a href=&quot;https://www.iasplus.com/standard/ifrs13.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Summary of IFRS 13 on IAS Plus&lt;/a&gt;&lt;/div&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Level 1:&lt;/strong&gt; unadjusted quoted prices in active markets for identical assets. Highest priority.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Level 2:&lt;/strong&gt; observable inputs other than the above (Supplement: for example, prices per square metre of comparable properties).&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Level 3:&lt;/strong&gt; unobservable inputs, lowest priority (Supplement: for example, internal estimates of rentals and vacancy in a DCF). Two properties are rarely identical, so Level 1 is rare for property.&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;IFRS 13 also uses &lt;i lang=&quot;en&quot;&gt;highest and best use&lt;/i&gt;: the use that is physically possible, legally permissible and financially feasible and that maximises value.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;

&lt;div class=&quot;tabpanel&quot;&gt;
&lt;p&gt;Measurement follows one of three routes. &lt;span class=&quot;src&quot;&gt;Slide 18 · IAS 40.56&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;IFRS 5&lt;/h4&gt;&lt;p&gt;If it meets the criteria to be classified as &lt;i lang=&quot;en&quot;&gt;held for sale&lt;/i&gt;, or is included in a &lt;i lang=&quot;en&quot;&gt;disposal group&lt;/i&gt; (a group of assets to be disposed of together) so classified.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;IFRS 16&lt;/h4&gt;&lt;p&gt;If it is held by a &lt;i lang=&quot;en&quot;&gt;lessee&lt;/i&gt; as a &lt;i lang=&quot;en&quot;&gt;right-of-use asset&lt;/i&gt; and is not &lt;i lang=&quot;en&quot;&gt;held for sale&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;IAS 16&lt;/h4&gt;&lt;p&gt;In all other cases, using the &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; of that standard.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;Carrying amount = cost − accumulated depreciation − accumulated impairment&lt;/div&gt;
&lt;p&gt;The &lt;i lang=&quot;en&quot;&gt;carrying amount&lt;/i&gt; is the amount at which the asset is recognised. The formula is that of the IAS 16 &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt;. &lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;a href=&quot;https://www.iasplus.com/standard/ias16.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus, IAS 16&lt;/a&gt;&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Impairment&lt;/strong&gt;: a loss equal to the excess of the &lt;i lang=&quot;en&quot;&gt;carrying amount&lt;/i&gt; over the &lt;i lang=&quot;en&quot;&gt;recoverable amount&lt;/i&gt;, that is, the higher of &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; less costs of disposal and &lt;i lang=&quot;en&quot;&gt;value in use&lt;/i&gt;. &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias36.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 36, IFRS Foundation&lt;/a&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Held for sale&lt;/strong&gt;: the lower of &lt;i lang=&quot;en&quot;&gt;carrying amount&lt;/i&gt; and &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; less costs to sell, without depreciation. &lt;a href=&quot;https://www.iasplus.com/en/standards/ifrs/ifrs5&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus, IFRS 5&lt;/a&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;p&gt;&lt;i lang=&quot;en&quot;&gt;Fair value&lt;/i&gt; does not disappear: entities using the &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; must still disclose it in the notes. &lt;span class=&quot;src&quot;&gt;Slide 34 · IAS 40.79(e)&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;tabpanel&quot;&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Fair value model&lt;/th&gt;&lt;th&gt;Cost model&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Amount in the financial statements&lt;/td&gt;&lt;td&gt;Fair value at the end of the period&lt;/td&gt;&lt;td&gt;Cost less depreciation and impairment&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Depreciation&lt;/td&gt;&lt;td&gt;No&lt;/td&gt;&lt;td&gt;Yes&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Changes in value&lt;/td&gt;&lt;td&gt;Profit or loss&lt;/td&gt;&lt;td&gt;Impairment only, under IAS 36&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Fair value&lt;/td&gt;&lt;td&gt;In the financial statements&lt;/td&gt;&lt;td&gt;In the notes (79(e))&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Reference standards&lt;/td&gt;&lt;td&gt;IAS 40, IFRS 13&lt;/td&gt;&lt;td&gt;IAS 16, IFRS 16, IFRS 5&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Change to the other model&lt;/td&gt;&lt;td&gt;&quot;Highly unlikely&quot;&lt;/td&gt;&lt;td&gt;Allowed if more relevant&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;widget&quot; id=&quot;model&quot;&gt;
&lt;h4&gt;The same property under the two models&lt;/h4&gt;

&lt;h3&gt;Lessee: right-of-use asset at fair value&lt;/h3&gt;
&lt;p&gt;The &lt;i lang=&quot;en&quot;&gt;lessee&lt;/i&gt; measures the &lt;i lang=&quot;en&quot;&gt;right-of-use asset&lt;/i&gt; at &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt;, &lt;strong&gt;not&lt;/strong&gt; the underlying property: it owns a right, not the building. &lt;span class=&quot;src&quot;&gt;Slide 13 · IAS 40.40A&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;IFRS 16 sets the initial cost. Para. 33 then requires remeasurement to &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; if that model is chosen. If payments are &lt;strong&gt;at market terms&lt;/strong&gt;, the &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; at acquisition, net of all expected payments, must be &lt;strong&gt;zero&lt;/strong&gt;. The remeasurement therefore gives rise to no initial gain or loss, unless &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; is measured at different times, as when the model is chosen after initial recognition. &lt;span class=&quot;src&quot;&gt;Slide 14 · IAS 40.41&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;The reference to para. 50 serves to avoid double counting of assets or liabilities already recognised separately. &lt;span class=&quot;src&quot;&gt;Slide 14&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;rou&quot;&gt;
&lt;h4&gt;Why the gain is zero at market terms&lt;/h4&gt;
&lt;p class=&quot;hint&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Supplement&lt;/span&gt;10-year lease, 5% rate, market rent 100, payments at the end of each year. Hypothetical figures. The slide deals only with the at-market case: the other case serves to explain the logic and is not a rule from the slide.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;Contract rent &lt;output&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;rc&quot; min=&quot;60&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;100&quot;&gt;&lt;/label&gt;
&lt;svg id=&quot;rchart&quot; viewBox=&quot;0 0 440 110&quot; role=&quot;img&quot; aria-label=&quot;Comparison between the cost of the right-of-use asset and its fair value&quot;&gt;&lt;/svg&gt;
&lt;p id=&quot;rtxt&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;When fair value cannot be measured: paras. 53 and 55&lt;/h3&gt;
&lt;p&gt;There is a &lt;i lang=&quot;en&quot;&gt;rebuttable presumption&lt;/i&gt; (one that can be overturned by contrary evidence): &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; can be measured reliably &lt;i lang=&quot;en&quot;&gt;on a continuing basis&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 15&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;In the diagram, &lt;i lang=&quot;en&quot;&gt;disposal&lt;/i&gt; is the sale or other transfer of the property and &lt;i lang=&quot;en&quot;&gt;residual value&lt;/i&gt; is the value remaining at the end of its useful life.&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;p53&quot;&gt;
&lt;svg viewBox=&quot;0 0 440 282&quot; role=&quot;img&quot; aria-label=&quot;Path of the presumption that fair value can be measured&quot;&gt;
&lt;path class=&quot;ln&quot; id=&quot;p53l1&quot; d=&quot;M138 56V84&quot;/&gt;&lt;path class=&quot;ln&quot; id=&quot;p53l2&quot; d=&quot;M272 110H300&quot;/&gt;&lt;path class=&quot;ln&quot; id=&quot;p53l3&quot; d=&quot;M72 136V170&quot;/&gt;&lt;path class=&quot;ln&quot; id=&quot;p53l4&quot; d=&quot;M210 136V170&quot;/&gt;&lt;path class=&quot;ln&quot; id=&quot;p53l5&quot; d=&quot;M368 136V170&quot;/&gt;

&lt;g class=&quot;nd&quot; data-s=&quot;2&quot;&gt;&lt;rect x=&quot;300&quot; y=&quot;84&quot; width=&quot;136&quot; height=&quot;52&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;368&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot;&gt;Fair value&lt;/text&gt;&lt;text x=&quot;368&quot; y=&quot;123&quot; text-anchor=&quot;middle&quot;&gt;normal rule&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot; data-s=&quot;3&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;170&quot; width=&quot;136&quot; height=&quot;104&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;72&quot; y=&quot;192&quot; text-anchor=&quot;middle&quot;&gt;In construction&lt;/text&gt;&lt;text x=&quot;72&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;cost until earlier of&lt;/text&gt;&lt;text x=&quot;72&quot; y=&quot;228&quot; text-anchor=&quot;middle&quot;&gt;reliable FV and&lt;/text&gt;&lt;text x=&quot;72&quot; y=&quot;246&quot; text-anchor=&quot;middle&quot;&gt;completion&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot; data-s=&quot;4&quot;&gt;&lt;rect x=&quot;152&quot; y=&quot;170&quot; width=&quot;136&quot; height=&quot;104&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;220&quot; y=&quot;192&quot; text-anchor=&quot;middle&quot;&gt;Other IP&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;IAS 16 or IFRS 16&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;228&quot; text-anchor=&quot;middle&quot;&gt;residual value = 0&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;246&quot; text-anchor=&quot;middle&quot;&gt;until disposal&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot; data-s=&quot;5&quot;&gt;&lt;rect x=&quot;300&quot; y=&quot;170&quot; width=&quot;136&quot; height=&quot;104&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;368&quot; y=&quot;192&quot; text-anchor=&quot;middle&quot;&gt;Para. 55&lt;/text&gt;&lt;text x=&quot;368&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;at FV: stays at FV&lt;/text&gt;&lt;text x=&quot;368&quot; y=&quot;228&quot; text-anchor=&quot;middle&quot;&gt;even if the market&lt;/text&gt;&lt;text x=&quot;368&quot; y=&quot;246&quot; text-anchor=&quot;middle&quot;&gt;becomes thin&lt;/text&gt;&lt;/g&gt;

&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Where does the change in fair value of an IP go under the fair value model?&lt;/summary&gt;&lt;div&gt;To &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;, in the period in which it arises. &lt;span class=&quot;src&quot;&gt;Slide 13 · IAS 40.35&lt;/span&gt; Take care not to confuse it with the IAS 16 revaluation.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Which two conditions are needed to rebut the presumption of para. 53?&lt;/summary&gt;&lt;div&gt;An inactive market for comparable properties &lt;strong&gt;and&lt;/strong&gt; no reliable alternative measure of &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt;, for example through DCF projections. Both are required, with &lt;i lang=&quot;en&quot;&gt;clear evidence&lt;/i&gt;, on first entry. &lt;span class=&quot;src&quot;&gt;Slide 15&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;The market becomes illiquid after years of measurement at fair value: does the entity return to cost?&lt;/summary&gt;&lt;div&gt;No. It stays at &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; until &lt;i lang=&quot;en&quot;&gt;disposal&lt;/i&gt;, or until the property becomes &lt;i lang=&quot;en&quot;&gt;owner-occupied&lt;/i&gt; or development for sale begins. &lt;span class=&quot;src&quot;&gt;Slide 17 · IAS 40.55&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;In the para. 53 exception, what is the residual value?&lt;/summary&gt;&lt;div&gt;It is assumed to be zero, and the entity continues with IAS 16 or IFRS 16 until &lt;i lang=&quot;en&quot;&gt;disposal&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 16&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s5&quot; class=&quot;part sage&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;h2&gt;Transfers&lt;/h2&gt;&lt;p&gt;When the use changes, the property changes standard (paras. 57-65).&lt;/p&gt;&lt;/header&gt;
&lt;p&gt;A transfer takes place &lt;em&gt;when, and only when&lt;/em&gt; there is a &lt;strong&gt;&lt;i lang=&quot;en&quot;&gt;change in use&lt;/i&gt;&lt;/strong&gt; evidenced by the facts. &lt;span class=&quot;src&quot;&gt;Slide 19 · IAS 40.57&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;strong&gt;Note that the slide reports the earlier wording.&lt;/strong&gt; Under the December 2016 amendment (&lt;i lang=&quot;en&quot;&gt;Transfers of Investment Property&lt;/i&gt;), the four situations are &lt;em&gt;non-exhaustive examples&lt;/em&gt; of evidence of a change in use, and a change in management&#x27;s intentions alone is not enough: observable actions are required. &lt;a href=&quot;https://www.iasplus.com/en/news/2016/12/ias-40&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/news-and-events/news/2016/05/ifrs-ic-recommends-the-board-to-amend-ias-40/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;widget&quot; id=&quot;tr&quot;&gt;

&lt;h3&gt;The rules in a table&lt;/h3&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;From → to, with IP at fair value&lt;/th&gt;&lt;th&gt;Treatment of the difference&lt;/th&gt;&lt;th&gt;Source&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;IP → owner-occupied or inventories&lt;/td&gt;&lt;td&gt;&lt;i lang=&quot;en&quot;&gt;Deemed cost&lt;/i&gt; (the starting point for the receiving standard) = &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; at the date of change in use&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;Slide 21 · 40.60&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Owner-occupied → IP&lt;/td&gt;&lt;td&gt;IAS 16 or IFRS 16 up to that date. The difference is treated as an IAS 16 &lt;i lang=&quot;en&quot;&gt;revaluation&lt;/i&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;Slide 21 · 40.61&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Inventories → IP&lt;/td&gt;&lt;td&gt;Difference in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;Slide 22 · 40.63&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Self-constructed IP completed&lt;/td&gt;&lt;td&gt;Difference in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;Slide 22 · 40.65&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;Paras. 60-65 apply to entities using the &lt;i lang=&quot;en&quot;&gt;fair value model&lt;/i&gt;. Under the &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt;, by contrast, transfers &lt;strong&gt;do not change&lt;/strong&gt; either the &lt;i lang=&quot;en&quot;&gt;carrying amount&lt;/i&gt; or the cost, for measurement or disclosure purposes. &lt;span class=&quot;src&quot;&gt;Slide 23 · IAS 40.59&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;strong&gt;What &quot;as a revaluation&quot; means.&lt;/strong&gt; An increase goes to revaluation surplus through &lt;i lang=&quot;en&quot;&gt;OCI&lt;/i&gt; (&lt;i lang=&quot;en&quot;&gt;other comprehensive income&lt;/i&gt;, the components of total comprehensive income outside profit or loss), except for the portion reversing a previous &lt;i lang=&quot;en&quot;&gt;impairment&lt;/i&gt;, which goes to &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;. A decrease goes to &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;. The diagram above assumes that there is no pre-existing surplus. &lt;a href=&quot;https://cfrr.worldbank.org:443/sites/default/files/2022-05/06_0.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank CFRR&lt;/a&gt; · &lt;a href=&quot;https://standards.aasb.gov.au/node/907&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AASB 140, the Australian twin of IAS 40&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Supplement&lt;/span&gt;Why the asymmetry? A property leaving own use was not yet in the fair value &quot;circuit&quot;: the gain accrued while it was in use is kept out of profit or loss, as under IAS 16. Inventories, on the other hand, were intended for sale, so the difference resembles revenue. A point of interpretation: after the transfer, subsequent changes in fair value go to profit or loss.&lt;/div&gt;

&lt;h3&gt;Two cases in which there is no transfer&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Selling without developing&lt;/summary&gt;&lt;div&gt;If the entity decides to dispose of the IP &lt;strong&gt;without development&lt;/strong&gt;, the property remains IP until &lt;i lang=&quot;en&quot;&gt;derecognition&lt;/i&gt; (removal from the statement of financial position) and does not move to &lt;i lang=&quot;en&quot;&gt;inventories&lt;/i&gt;. The move requires the start of development with a view to sale. &lt;span class=&quot;src&quot;&gt;Slide 20 · IAS 40.58&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Redeveloping to continue leasing&lt;/summary&gt;&lt;div&gt;During &lt;i lang=&quot;en&quot;&gt;redevelopment&lt;/i&gt; for continued use as IP, the property remains IP and does not become &lt;i lang=&quot;en&quot;&gt;owner-occupied&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 20 · IAS 40.58&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;The board resolves to occupy the leased building in the future, but nothing has changed yet. Is there a transfer?&lt;/summary&gt;&lt;div&gt;No. Slide: &lt;i lang=&quot;en&quot;&gt;owner-occupation&lt;/i&gt; must have commenced. The updated text reiterates that intentions alone do not evidence a change in use (external source above). &lt;span class=&quot;src&quot;&gt;Slide 19&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Inventories with a carrying amount of 300 and a fair value of 420 move to IP at fair value: what is the effect?&lt;/summary&gt;&lt;div&gt;A gain of 120 in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 22 · IAS 40.63&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Own offices with a carrying amount of 500 and a fair value of 650 become IP at fair value, with no past impairment: what is the effect?&lt;/summary&gt;&lt;div&gt;A difference of 150 treated as an IAS 16 &lt;i lang=&quot;en&quot;&gt;revaluation&lt;/i&gt;, hence in &lt;i lang=&quot;en&quot;&gt;OCI&lt;/i&gt;, not in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 21 · IAS 40.61&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What if the same entity used the cost model?&lt;/summary&gt;&lt;div&gt;No effect: &lt;i lang=&quot;en&quot;&gt;carrying amount&lt;/i&gt; and cost remain unchanged. &lt;span class=&quot;src&quot;&gt;Slide 23 · IAS 40.59&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s6&quot; class=&quot;part ochre&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;h2&gt;Disposals&lt;/h2&gt;&lt;p&gt;Exit from the financial statements (paras. 66-73).&lt;/p&gt;&lt;/header&gt;
&lt;p&gt;&lt;i lang=&quot;en&quot;&gt;Derecognition&lt;/i&gt; takes place &lt;strong&gt;on &lt;i lang=&quot;en&quot;&gt;disposal&lt;/i&gt;&lt;/strong&gt;, or when the property is &lt;strong&gt;permanently withdrawn from use and no future economic benefits are expected&lt;/strong&gt; from its disposal. &lt;span class=&quot;src&quot;&gt;Slide 24 · IAS 40.66&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Gain or loss = net disposal proceeds − carrying amount&lt;/div&gt;
&lt;p&gt;It is recognised in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt; in the period of the disposal or retirement, unless IFRS 16 requires otherwise on a &lt;i lang=&quot;en&quot;&gt;sale and leaseback&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 24 · IAS 40.69&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;dis&quot;&gt;
&lt;h4&gt;Calculate the gain or loss&lt;/h4&gt;
&lt;p class=&quot;hint&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Supplement&lt;/span&gt;Hypothetical figures, in thousands of euros.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;Selling price &lt;output id=&quot;dpo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dp&quot; min=&quot;600&quot; max=&quot;1400&quot; step=&quot;10&quot; value=&quot;1100&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;Costs to sell &lt;output id=&quot;dco&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dc&quot; min=&quot;0&quot; max=&quot;80&quot; step=&quot;5&quot; value=&quot;30&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;Carrying amount &lt;output id=&quot;dao&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;da&quot; min=&quot;600&quot; max=&quot;1400&quot; step=&quot;10&quot; value=&quot;1000&quot;&gt;&lt;/label&gt;
&lt;svg id=&quot;dchart&quot; viewBox=&quot;0 0 440 92&quot; role=&quot;img&quot; aria-label=&quot;Comparison between net disposal proceeds and carrying amount&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;tiles&quot;&gt;&lt;div class=&quot;tile&quot;&gt;&lt;b id=&quot;dv&quot;&gt;&lt;/b&gt;&lt;span id=&quot;dvl&quot;&gt;gain&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;hint&quot;&gt;Under the &lt;i lang=&quot;en&quot;&gt;fair value model&lt;/i&gt; the &lt;i lang=&quot;en&quot;&gt;carrying amount&lt;/i&gt; tends to be close to the price, so the result on disposal is often small: the gain has already emerged year by year. Under the &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; it all emerges on sale.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;p&gt;&lt;strong&gt;Compensation from third parties&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;For IP that was &lt;i lang=&quot;en&quot;&gt;impaired&lt;/i&gt;, lost or given up, compensation is recognised in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt; &lt;strong&gt;when it becomes &lt;i lang=&quot;en&quot;&gt;receivable&lt;/i&gt;&lt;/strong&gt;. &lt;span class=&quot;src&quot;&gt;Slide 24 · IAS 40.72&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Supplement&lt;/span&gt;Example: a fire destroys a building and the insurer grants compensation the following year. The building is derecognised in the year of the fire; the compensation is recognised when it becomes receivable.&lt;/div&gt;
&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Does an unusable, abandoned building, with no benefits expected from its disposal, remain in the financial statements?&lt;/summary&gt;&lt;div&gt;No. It is permanently withdrawn from use, so &lt;i lang=&quot;en&quot;&gt;derecognition&lt;/i&gt; applies. &lt;span class=&quot;src&quot;&gt;Slide 24 · IAS 40.66&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Price 900, costs to sell 20, carrying amount 850: what is the result?&lt;/summary&gt;&lt;div&gt;Net proceeds of 880, a gain of 30 in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 24 · IAS 40.69&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;When is insurance compensation recognised?&lt;/summary&gt;&lt;div&gt;When it becomes &lt;i lang=&quot;en&quot;&gt;receivable&lt;/i&gt;, not necessarily at the time of the damage. &lt;span class=&quot;src&quot;&gt;Slide 24 · IAS 40.72&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s7&quot; class=&quot;part slate&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt;&lt;h2&gt;Disclosure&lt;/h2&gt;&lt;p&gt;What to report in the notes: a common base and a part for each model (paras. 74-79).&lt;/p&gt;&lt;/header&gt;
&lt;p&gt;These requirements are in addition to those of IFRS 16. The owner provides the &lt;i lang=&quot;en&quot;&gt;lessor&lt;/i&gt; disclosures. A &lt;i lang=&quot;en&quot;&gt;lessee&lt;/i&gt; holding IP as a &lt;i lang=&quot;en&quot;&gt;right-of-use asset&lt;/i&gt; provides the &lt;i lang=&quot;en&quot;&gt;lessee&lt;/i&gt; disclosures and, for the &lt;i lang=&quot;en&quot;&gt;operating leases&lt;/i&gt; it has granted, the &lt;i lang=&quot;en&quot;&gt;lessor&lt;/i&gt; disclosures. &lt;span class=&quot;src&quot;&gt;Slide 25 · IAS 40.74&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Common (75)&lt;/button&gt;&lt;button&gt;Fair value (76-78)&lt;/button&gt;&lt;button&gt;Cost (79)&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;ol&gt;
&lt;li&gt;&lt;strong&gt;Which model&lt;/strong&gt; is applied. &lt;span class=&quot;src&quot;&gt;Slide 26&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;The classification criteria&lt;/strong&gt;, when it is difficult to distinguish IP from &lt;i lang=&quot;en&quot;&gt;owner-occupied&lt;/i&gt; property and from property held for sale. &lt;span class=&quot;src&quot;&gt;Slide 26&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;The extent to which &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; is based on an &lt;i lang=&quot;en&quot;&gt;independent valuer&lt;/i&gt;&lt;/strong&gt; with a recognised and relevant qualification and recent experience in the location and category. If there has been no such valuation, this must be stated. &lt;span class=&quot;src&quot;&gt;Slide 26&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;The amounts in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;:&lt;/strong&gt; rental income from IP; direct operating expenses, including repairs and maintenance, separating IP that generated rental income from IP that did not; the cumulative change in &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; on a sale from a &lt;i lang=&quot;en&quot;&gt;pool&lt;/i&gt; of assets at cost to one at &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 27&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Restrictions:&lt;/strong&gt; their existence and amounts, on the realisability of IP or the remittance of income and disposal proceeds. &lt;span class=&quot;src&quot;&gt;Slide 27&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Contractual obligations&lt;/strong&gt; to purchase, construct or develop, or for repairs, maintenance or enhancements. &lt;span class=&quot;src&quot;&gt;Slide 27&lt;/span&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;p&gt;A &lt;i lang=&quot;en&quot;&gt;reconciliation&lt;/i&gt; between the opening and closing amounts is required, with these items. &lt;span class=&quot;src&quot;&gt;Slides 28-29 · IAS 40.76&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;wf&quot; style=&quot;margin-top:.4rem&quot;&gt;
&lt;h4&gt;The reconciliation at a glance&lt;/h4&gt;
&lt;p class=&quot;hint&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Supplement&lt;/span&gt;Hypothetical figures, in thousands of euros. Truncated axis to make the movements visible.&lt;/p&gt;
&lt;svg id=&quot;wchart&quot; viewBox=&quot;0 0 440 262&quot; role=&quot;img&quot; aria-label=&quot;Reconciliation of the carrying amount from the beginning to the end of the period&quot;&gt;&lt;/svg&gt;
&lt;label class=&quot;sl&quot;&gt;Net gains or losses from fair value &lt;output id=&quot;wfo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;wfr&quot; min=&quot;-150&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;65&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Para. 77: adjusted valuation&lt;/summary&gt;&lt;div&gt;If the valuation is adjusted significantly for the financial statements, for example to avoid double counting items already recognised, the entity reconciles the valuation with the amount in the financial statements, showing separately the &lt;i lang=&quot;en&quot;&gt;lease liabilities&lt;/i&gt; added back and the other significant adjustments. &lt;span class=&quot;src&quot;&gt;Slide 30&lt;/span&gt;&lt;p&gt;&lt;span class=&quot;tag n&quot;&gt;Supplement&lt;/span&gt;Example: valuation 800 + lease liabilities added back 200 = 1,000 in the financial statements.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Para. 78: IP at cost under the para. 53 exception&lt;/summary&gt;&lt;div&gt;Separate amounts in the &lt;i lang=&quot;en&quot;&gt;reconciliation&lt;/i&gt;, plus: a description of the IP; why &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; is not reliable; if possible, the range of estimates within which it is highly likely to lie; on disposal, the fact itself, the &lt;i lang=&quot;en&quot;&gt;carrying amount&lt;/i&gt; at the time of sale and the gain or loss. &lt;span class=&quot;src&quot;&gt;Slide 31&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;p&gt;In addition to para. 75. &lt;span class=&quot;src&quot;&gt;Slides 32-34 · IAS 40.79&lt;/span&gt;&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;
&lt;li&gt;&lt;strong&gt;&lt;i lang=&quot;en&quot;&gt;Depreciation&lt;/i&gt; methods&lt;/strong&gt; used.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;&lt;i lang=&quot;en&quot;&gt;Useful lives&lt;/i&gt; or depreciation rates&lt;/strong&gt; used.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;&lt;i lang=&quot;en&quot;&gt;Gross carrying amount&lt;/i&gt; and accumulated depreciation&lt;/strong&gt;, aggregated with accumulated &lt;i lang=&quot;en&quot;&gt;impairment&lt;/i&gt; losses, at the beginning and end of the period.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;&lt;i lang=&quot;en&quot;&gt;Reconciliation&lt;/i&gt;&lt;/strong&gt;: &lt;i lang=&quot;en&quot;&gt;additions&lt;/i&gt; (from acquisitions, from subsequent expenditure, from &lt;i lang=&quot;en&quot;&gt;business combinations&lt;/i&gt;); &lt;i lang=&quot;en&quot;&gt;held for sale&lt;/i&gt; and other disposals; &lt;i lang=&quot;en&quot;&gt;depreciation&lt;/i&gt;; &lt;i lang=&quot;en&quot;&gt;impairment&lt;/i&gt; losses recognised and reversed (IAS 36); exchange differences; transfers to and from &lt;i lang=&quot;en&quot;&gt;inventories&lt;/i&gt; and &lt;i lang=&quot;en&quot;&gt;owner-occupied&lt;/i&gt; property; other changes.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;The &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; of the IP.&lt;/strong&gt; If it cannot be measured (para. 53): a description, the reason and, if possible, the range of estimates.&lt;/li&gt;
&lt;/ol&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Supplement&lt;/span&gt;Memory aid: the two &lt;i lang=&quot;en&quot;&gt;reconciliations&lt;/i&gt; are almost the same. Where the &lt;i lang=&quot;en&quot;&gt;fair value model&lt;/i&gt; has &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; adjustments, the &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; has &lt;i lang=&quot;en&quot;&gt;depreciation&lt;/i&gt; and &lt;i lang=&quot;en&quot;&gt;impairment&lt;/i&gt;.&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;If there has been no independent valuation, what should be stated?&lt;/summary&gt;&lt;div&gt;That fact itself. It must be disclosed in the notes. &lt;span class=&quot;src&quot;&gt;Slide 26&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Can an entity using the cost model ignore fair value?&lt;/summary&gt;&lt;div&gt;No, it must disclose it, or explain why it cannot be measured reliably. &lt;span class=&quot;src&quot;&gt;Slide 34 · IAS 40.79(e)&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why are direct operating expenses split into two items?&lt;/summary&gt;&lt;div&gt;The standard distinguishes IP that generated rental income during the period from IP that did not. &lt;span class=&quot;src&quot;&gt;Slide 27&lt;/span&gt; Supplement: this way the reader also sees the cost of vacant property.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s8&quot; class=&quot;part brick&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;&lt;h2&gt;Decision tree&lt;/h2&gt;&lt;p&gt;A summary of the entire path, from the guide by Alexander and Archer (2017).&lt;/p&gt;&lt;/header&gt;
&lt;p&gt;The tree is reproduced from the appendix to the 2000 version of IAS 40. &lt;span class=&quot;src&quot;&gt;Slides 35-36&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;strong&gt;One branch is superseded.&lt;/strong&gt; The branch &quot;under construction → IAS 16 until completion&quot; reflects the 2000 text. With the May 2008 &lt;i lang=&quot;en&quot;&gt;Improvements&lt;/i&gt;, effective from 1 January 2009, property under construction for future use as IP moved into IAS 40: this is also what slides 6(e) and 16 state. &lt;a href=&quot;https://pwc.com/gx/en/asset-management/assets/practical-guide-to-amended-ias-40.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PwC guide to the amended IAS 40&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;widget&quot; id=&quot;tree&quot;&gt;
&lt;h4&gt;Walk through the tree&lt;/h4&gt;
&lt;div id=&quot;tq&quot; aria-live=&quot;polite&quot; style=&quot;min-height:5.4em&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;btns&quot; id=&quot;tb&quot;&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 440 468&quot; style=&quot;max-width:32rem;margin:auto&quot; role=&quot;img&quot; aria-label=&quot;Decision tree from slide 36: four questions lead to IAS 2, IAS 16 or IAS 40&quot;&gt;
&lt;text class=&quot;sv-l&quot; x=&quot;118&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;Start&lt;/text&gt;
&lt;path class=&quot;ln on&quot; d=&quot;M118 26V40&quot;/&gt;
&lt;path class=&quot;ln&quot; id=&quot;l-q1-o1&quot; d=&quot;M236 70H290&quot;/&gt;&lt;path class=&quot;ln&quot; id=&quot;l-q1-q2&quot; d=&quot;M118 100V120&quot;/&gt;
&lt;path class=&quot;ln&quot; id=&quot;l-q2-o2&quot; d=&quot;M236 150H290&quot;/&gt;&lt;path class=&quot;ln&quot; id=&quot;l-q2-q3&quot; d=&quot;M118 180V200&quot;/&gt;
&lt;path class=&quot;ln&quot; id=&quot;l-q3-o3&quot; d=&quot;M236 230H290&quot;/&gt;&lt;path class=&quot;ln&quot; id=&quot;l-q3-ip&quot; d=&quot;M118 260V280&quot;/&gt;
&lt;path class=&quot;ln&quot; id=&quot;l-ip-q4&quot; d=&quot;M118 320V340&quot;/&gt;
&lt;path class=&quot;ln&quot; id=&quot;l-q4-o4&quot; d=&quot;M236 370H290&quot;/&gt;&lt;path class=&quot;ln&quot; id=&quot;l-q4-o5&quot; d=&quot;M118 400V442H290&quot;/&gt;
&lt;text class=&quot;sv-l&quot; x=&quot;262&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot;&gt;yes&lt;/text&gt;&lt;text class=&quot;sv-l&quot; x=&quot;128&quot; y=&quot;114&quot;&gt;no&lt;/text&gt;
&lt;text class=&quot;sv-l&quot; x=&quot;262&quot; y=&quot;144&quot; text-anchor=&quot;middle&quot;&gt;yes&lt;/text&gt;&lt;text class=&quot;sv-l&quot; x=&quot;128&quot; y=&quot;194&quot;&gt;no&lt;/text&gt;
&lt;text class=&quot;sv-l&quot; x=&quot;262&quot; y=&quot;224&quot; text-anchor=&quot;middle&quot;&gt;yes&lt;/text&gt;&lt;text class=&quot;sv-l&quot; x=&quot;128&quot; y=&quot;274&quot;&gt;no&lt;/text&gt;
&lt;text class=&quot;sv-l&quot; x=&quot;262&quot; y=&quot;364&quot; text-anchor=&quot;middle&quot;&gt;cost&lt;/text&gt;&lt;text class=&quot;sv-l&quot; x=&quot;200&quot; y=&quot;436&quot; text-anchor=&quot;middle&quot;&gt;fair value&lt;/text&gt;
&lt;g class=&quot;nd&quot; id=&quot;n-q1&quot;&gt;&lt;polygon points=&quot;22,40 214,40 234,70 214,100 22,100 2,70&quot;/&gt;&lt;text x=&quot;118&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot;&gt;Held for sale in the&lt;/text&gt;&lt;text x=&quot;118&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot;&gt;ordinary course of business?&lt;/text&gt;&lt;/g&gt;

&lt;g class=&quot;nd&quot; id=&quot;n-o2&quot;&gt;&lt;rect x=&quot;290&quot; y=&quot;126&quot; width=&quot;146&quot; height=&quot;48&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;363&quot; y=&quot;154&quot; text-anchor=&quot;middle&quot;&gt;Use IAS 16&lt;/text&gt;&lt;/g&gt;

&lt;g class=&quot;nd&quot; id=&quot;n-o4&quot;&gt;&lt;rect x=&quot;290&quot; y=&quot;346&quot; width=&quot;146&quot; height=&quot;48&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;363&quot; y=&quot;366&quot; text-anchor=&quot;middle&quot;&gt;Use IAS 16 with&lt;/text&gt;&lt;text x=&quot;363&quot; y=&quot;382&quot; text-anchor=&quot;middle&quot;&gt;IAS 40 disclosure&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot; id=&quot;n-o5&quot;&gt;&lt;rect x=&quot;290&quot; y=&quot;420&quot; width=&quot;146&quot; height=&quot;42&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;363&quot; y=&quot;445&quot; text-anchor=&quot;middle&quot;&gt;Use IAS 40&lt;/text&gt;&lt;/g&gt;

&lt;/div&gt;
&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Self-check&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why is the first question about sale rather than use?&lt;/summary&gt;&lt;div&gt;The tree progressively excludes the cases outside IAS 40: IP is what remains after setting aside ordinary sale, own use and construction. &lt;span class=&quot;src&quot;&gt;Slide 36&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Today, does a building under construction for future leasing follow IAS 16?&lt;/summary&gt;&lt;div&gt;No: it is IP. Slides 6(e) and 16 say so, whereas the tree reports the 2000 version.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;The cost model branch says &quot;IAS 16 with IAS 40 disclosure&quot;: is this complete?&lt;/summary&gt;&lt;div&gt;It must be supplemented with slide 18: IFRS 5 if &lt;i lang=&quot;en&quot;&gt;held for sale&lt;/i&gt;, IFRS 16 for the &lt;i lang=&quot;en&quot;&gt;right-of-use asset&lt;/i&gt;, IAS 16 in other cases.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s9&quot; class=&quot;part terra&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;→&lt;/span&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;p&gt;Texts and standards cited in the slides. All entries are &lt;strong&gt;external sources&lt;/strong&gt;, distinct from the slide content.&lt;/p&gt;&lt;/header&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Note&lt;/span&gt;The other files in &lt;code&gt;corso/&lt;/code&gt; were not consulted: the working environment did not allow the folder to be listed. Links to other lectures are therefore limited to those between the standards cited in these slides. The entries are based on excerpts returned by the search: for the exact wording, the official text prevails.&lt;/div&gt;

&lt;h3&gt;The book cited&lt;/h3&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;David Alexander and Simon Archer, &lt;i&gt;International Accounting/Financial Reporting Standards Guide&lt;/i&gt;&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Wolters Kluwer, 2017 edition (the catalogue shows copyright 2016) · cited on slide 35&lt;/p&gt;
&lt;p&gt;A reference guide to the international standards, published in annual editions. It matters because it is the source from which the slides take the decision tree. The table of contents of the volume has not been verified.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;a href=&quot;https://search.ub.tum.de/vufind/Record/DE-604.BV043840803&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Catalogue record, TU München library&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;The standard and its history&lt;/h3&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IAS 40 &lt;i&gt;Investment Property&lt;/i&gt;&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;IFRS Foundation · issued by the IASC in April 2000, reissued by the IASB in December 2003&lt;/p&gt;
&lt;p&gt;The reference text for the whole lecture. The 2000 version, effective from 2001, is the one with the appendix from which the tree on slide 36 comes. To be read in its updated version, given the differences flagged in sections 5 and 8.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/content/ifrs/home/issued-standards/list-of-standards/ias-40-investment-property.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/standard/ias40.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Summary and timeline, IAS Plus&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;Improvements to IFRSs (May 2008): IP under construction&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Effective from 1 January 2009&lt;/p&gt;
&lt;p&gt;Brings property under construction for future use as IP into IAS 40. It matters because it explains the contrast between slide 36 and slides 6 and 16.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;a href=&quot;https://pwc.com/gx/en/asset-management/assets/practical-guide-to-amended-ias-40.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PwC guide&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/news/2009/October/news5308&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;Transfers of Investment Property (Amendments to IAS 40)&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;IASB, December 2016 · amends paras. 57-58 · EU endorsement: Regulation (EU) 2018/400&lt;/p&gt;
&lt;p&gt;Clarifies that a change in use requires evidence and that the list consists of examples. It matters because slide 19 still uses the wording of the earlier text.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;a href=&quot;https://www.iasplus.com/en/news/2016/12/ias-40&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2018/400/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;The other standards cited in the slides&lt;/h3&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IFRS 13 &lt;i&gt;Fair Value Measurement&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;Defines &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt;, the three-level hierarchy and &lt;i lang=&quot;en&quot;&gt;highest and best use&lt;/i&gt;. It matters because it says &lt;em&gt;how&lt;/em&gt; to measure the number that IAS 40 asks entities to use.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;a href=&quot;https://www.iasplus.com/standard/ifrs13.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt; · &lt;a href=&quot;https://www.icaew.com/technical/financial-reporting/ifrs/ifrs-standards/ifrs-13-fair-value-measurement/summary-and-timeline&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IFRS 16 &lt;i&gt;Leases&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;Replaces IAS 17: a single model for the &lt;i lang=&quot;en&quot;&gt;lessee&lt;/i&gt;, an &lt;i lang=&quot;en&quot;&gt;operating&lt;/i&gt; and &lt;i lang=&quot;en&quot;&gt;finance&lt;/i&gt; distinction for the &lt;i lang=&quot;en&quot;&gt;lessor&lt;/i&gt;, and rules on &lt;i lang=&quot;en&quot;&gt;sale and leaseback&lt;/i&gt;. It matters for the &lt;i lang=&quot;en&quot;&gt;right-of-use asset&lt;/i&gt;, for classification and for disclosure.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;a href=&quot;https://icaew.com/technical/financial-reporting/ifrs/ifrs-standards/ifrs-16-leases/summary-and-timeline&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IAS 16 &lt;i&gt;Property, Plant and Equipment&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;Governs property in own use, with a &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; or a &lt;i lang=&quot;en&quot;&gt;revaluation model&lt;/i&gt;. It matters for &lt;i lang=&quot;en&quot;&gt;owner-occupied property&lt;/i&gt;, for the IAS 40 &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; and for para. 61.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;a href=&quot;https://www.iasplus.com/standard/ias16.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IAS 2 &lt;i&gt;Inventories&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;Inventories are measured at the lower of cost and &lt;i lang=&quot;en&quot;&gt;net realisable value&lt;/i&gt;. It matters for property intended for sale in the ordinary course of business.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IFRS 5 &lt;i&gt;Non-current Assets Held for Sale and Discontinued Operations&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;Issued in March 2004. Assets &lt;i lang=&quot;en&quot;&gt;held for sale&lt;/i&gt; at the lower of &lt;i lang=&quot;en&quot;&gt;carrying amount&lt;/i&gt; and &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; less costs to sell, without depreciation. It matters for the &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; branch on slide 18.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-5-non-current-assets-held-for-sale-and-discontinued-operations/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/standards/ifrs/ifrs5&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IAS 36 &lt;i&gt;Impairment of Assets&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;Ensures that an asset is not carried above its &lt;i lang=&quot;en&quot;&gt;recoverable amount&lt;/i&gt;. It matters for the &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; and for the para. 79 disclosures.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias36.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Text, IFRS Foundation&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/standards/ias/ias36&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IAS 41 &lt;i&gt;Agriculture&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;&lt;i lang=&quot;en&quot;&gt;Biological assets&lt;/i&gt; at &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; less costs to sell, &lt;i lang=&quot;en&quot;&gt;bearer plants&lt;/i&gt; under IAS 16. It matters for the scope exclusion on slide 4.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-41-agriculture/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IAS 8 &lt;i&gt;Basis of Preparation of Financial Statements&lt;/i&gt; and IFRS 18&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;IFRS 18 issued on 9 April 2024 · annual periods from 1 January 2027&lt;/p&gt;
&lt;p&gt;IAS 8 contains the criteria for changing &lt;i lang=&quot;en&quot;&gt;accounting policy&lt;/i&gt;, referred to by IAS 40.31. IFRS 18 replaces IAS 1 and changed the title of IAS 8: this is why slide 11 strikes it through.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;External source&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-8-basis-of-preparation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 8, IFRS Foundation&lt;/a&gt; · &lt;a href=&quot;https://www.icas.com/news-insights-events/news/corporate-financial-reporting/ifrs-18-a-new-standard-on-presentation-and-disclosure-in-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 18, ICAS&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;
&lt;p&gt;Summary written by Claude from the slides: always check against the material.&lt;/p&gt;
&lt;/footer&gt;
