&lt;/header&gt;

&lt;main&gt;
&lt;section id=&quot;s1&quot; class=&quot;part sage&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;h2&gt;Definizione, objective e scope&lt;/h2&gt;&lt;p&gt;Che cosa regola lo standard e che cosa lascia fuori.&lt;/p&gt;&lt;/header&gt;

&lt;p&gt;IAS 40 riguarda la &lt;i lang=&quot;en&quot;&gt;property&lt;/i&gt; (immobili: &lt;i lang=&quot;en&quot;&gt;land&lt;/i&gt;, terreni, e &lt;i lang=&quot;en&quot;&gt;buildings&lt;/i&gt;, edifici) tenuta per incassare &lt;i lang=&quot;en&quot;&gt;rentals&lt;/i&gt; (canoni di affitto), per &lt;i lang=&quot;en&quot;&gt;capital appreciation&lt;/i&gt; (crescita di valore nel tempo) o per entrambi. &lt;span class=&quot;src&quot;&gt;Slide 2&lt;/span&gt;&lt;/p&gt;

&lt;div class=&quot;def&quot;&gt;
&lt;p&gt;&lt;strong&gt;Investment property&lt;/strong&gt; (&lt;strong&gt;IP&lt;/strong&gt; da qui in poi; investimento immobiliare)&lt;/p&gt;
&lt;p class=&quot;q&quot;&gt;Terreno, edificio o parte di edificio, o entrambi, tenuto dal proprietario o dal lessee come right-of-use asset, per ottenere canoni, per l&#x27;apprezzamento del capitale o per entrambi.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;src&quot;&gt;Slide 5 · IAS 40.5&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;p&gt;La definizione ha tre elementi, e ognuno risolve un problema diverso:&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Che cosa&lt;/h4&gt;&lt;p&gt;Terreno, edificio &lt;em&gt;o una sua parte&lt;/em&gt;. Può quindi rientrare anche solo un piano di un palazzo.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Chi la tiene&lt;/h4&gt;&lt;p&gt;Il proprietario oppure il &lt;i lang=&quot;en&quot;&gt;lessee&lt;/i&gt; (locatario) tramite un &lt;i lang=&quot;en&quot;&gt;right-of-use asset&lt;/i&gt;, cioè l&#x27;attività che rappresenta il diritto di usare il bene preso in lease.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Perché&lt;/h4&gt;&lt;p&gt;Per il rendimento, non per produrre o per vendere nell&#x27;attività ordinaria.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Integrazione&lt;/span&gt;È la logica del &lt;em&gt;perché&lt;/em&gt;: una fabbrica vale per ciò che vi si produce, un palazzo affittato vale per i suoi canoni e per il mercato immobiliare. Per questo ha senso mostrare il secondo a &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt;, con le variazioni nel risultato. Chiarimento del riassunto, non scritto nelle slide.&lt;/div&gt;

&lt;h3&gt;Objective&lt;/h3&gt;
&lt;p&gt;Lo standard prescrive due cose: l&#x27;&lt;i lang=&quot;en&quot;&gt;accounting treatment&lt;/i&gt; (trattamento contabile) e i &lt;i lang=&quot;en&quot;&gt;disclosure requirements&lt;/i&gt; (informazioni da dare nelle note). &lt;span class=&quot;src&quot;&gt;Slide 3 · IAS 40.1&lt;/span&gt;&lt;/p&gt;

&lt;h3&gt;Scope&lt;/h3&gt;
&lt;p&gt;Si applica a &lt;i lang=&quot;en&quot;&gt;recognition&lt;/i&gt; (quando iscrivere), &lt;i lang=&quot;en&quot;&gt;measurement&lt;/i&gt; (a che valore) e &lt;i lang=&quot;en&quot;&gt;disclosure&lt;/i&gt; (cosa raccontare) dell&#x27;IP. &lt;span class=&quot;src&quot;&gt;Slide 4 · IAS 40.2&lt;/span&gt;&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 440 180&quot; style=&quot;max-width:36rem&quot; role=&quot;img&quot; aria-label=&quot;Lo scope di IAS 40 con le due esclusioni: biological assets e mineral rights&quot;&gt;
&lt;g class=&quot;nd on&quot;&gt;&lt;rect x=&quot;110&quot; y=&quot;6&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;220&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;IAS 40 si applica all&#x27;IP&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;recognition · measurement · disclosure&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M170 62 110 96M270 62 330 96&quot;/&gt;
&lt;text class=&quot;sv-l&quot; x=&quot;220&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot;&gt;non si applica a&lt;/text&gt;
&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;96&quot; width=&quot;210&quot; height=&quot;78&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;109&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot;&gt;Biological assets&lt;/text&gt;&lt;text x=&quot;109&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot;&gt;legati all&#x27;attività agricola&lt;/text&gt;&lt;text x=&quot;109&quot; y=&quot;156&quot; text-anchor=&quot;middle&quot;&gt;IAS 41 e IAS 16&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;226&quot; y=&quot;96&quot; width=&quot;210&quot; height=&quot;78&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;331&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot;&gt;Mineral rights e reserves&lt;/text&gt;&lt;text x=&quot;331&quot; y=&quot;138&quot; text-anchor=&quot;middle&quot;&gt;petrolio, gas naturale e simili&lt;/text&gt;&lt;text x=&quot;331&quot; y=&quot;156&quot; text-anchor=&quot;middle&quot;&gt;risorse non rigenerative&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Le due esclusioni. &lt;span class=&quot;src&quot;&gt;Slide 4 · IAS 40.4&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;Perché la slide cita sia IAS 41 sia IAS 16: dal 2014 le &lt;i lang=&quot;en&quot;&gt;bearer plants&lt;/i&gt; (piante che producono per più periodi, come viti e alberi da frutto) sono in IAS 16, mentre i frutti che portano restano in IAS 41. &lt;a href=&quot;https://www.ifrs.org/news-and-events/news/2014/06/iasb-issues-amendments-to-ias-16-and-ias-41-for-bearer-plants/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, notizia 2014&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Un locatario può avere un&#x27;IP anche se non è proprietario?&lt;/summary&gt;&lt;div&gt;Sì. La definizione include il &lt;i lang=&quot;en&quot;&gt;lessee&lt;/i&gt; che la tiene come &lt;i lang=&quot;en&quot;&gt;right-of-use asset&lt;/i&gt;, purché lo scopo sia incassare canoni o apprezzamento. &lt;span class=&quot;src&quot;&gt;Slide 5&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quali due aree sono fuori da IAS 40 per espressa esclusione?&lt;/summary&gt;&lt;div&gt;&lt;i lang=&quot;en&quot;&gt;Biological assets&lt;/i&gt; legati all&#x27;attività agricola, e &lt;i lang=&quot;en&quot;&gt;mineral rights&lt;/i&gt; e &lt;i lang=&quot;en&quot;&gt;mineral reserves&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 4&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Un terreno comprato per guadagnare dalla crescita di valore, senza alcun affitto, rientra nella definizione?&lt;/summary&gt;&lt;div&gt;Sì: basta uno dei due scopi. &quot;&lt;i lang=&quot;en&quot;&gt;Or both&lt;/i&gt;&quot; significa che canoni e &lt;i lang=&quot;en&quot;&gt;capital appreciation&lt;/i&gt; sono alternativi o cumulabili.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s2&quot; class=&quot;part ochre&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;h2&gt;Classification&lt;/h2&gt;&lt;p&gt;IP oppure &lt;i lang=&quot;en&quot;&gt;owner-occupied property&lt;/i&gt;: l&#x27;uso decide lo standard (par. 6-15).&lt;/p&gt;&lt;/header&gt;
&lt;p&gt;L&#x27;&lt;i lang=&quot;en&quot;&gt;owner-occupied property&lt;/i&gt; è l&#x27;immobile usato dall&#x27;impresa stessa, per produrre, fornire servizi o amministrare. Le stesse pareti possono ricadere in standard diversi a seconda dell&#x27;uso.&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 440 262&quot; style=&quot;max-width:36rem&quot; role=&quot;img&quot; aria-label=&quot;Un immobile può ricadere in IAS 40, IAS 16 o IFRS 16, IAS 2, oppure uscire dal bilancio del locatore in un finance lease&quot;&gt;
&lt;g class=&quot;nd on&quot;&gt;&lt;rect x=&quot;130&quot; y=&quot;4&quot; width=&quot;180&quot; height=&quot;46&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;220&quot; y=&quot;24&quot; text-anchor=&quot;middle&quot;&gt;Un immobile&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot;&gt;perché lo tieni?&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M170 50 112 84M270 50 328 84M190 50 112 170M250 50 328 170&quot;/&gt;
&lt;g class=&quot;nd on&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;84&quot; width=&quot;208&quot; height=&quot;66&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;108&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot;&gt;Per canoni o crescita di valore&lt;/text&gt;&lt;text x=&quot;108&quot; y=&quot;124&quot; text-anchor=&quot;middle&quot;&gt;Investment property&lt;/text&gt;&lt;text x=&quot;108&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot;&gt;IAS 40&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;228&quot; y=&quot;84&quot; width=&quot;208&quot; height=&quot;66&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;332&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot;&gt;Per usarlo&lt;/text&gt;&lt;text x=&quot;332&quot; y=&quot;124&quot; text-anchor=&quot;middle&quot;&gt;Owner-occupied&lt;/text&gt;&lt;text x=&quot;332&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot;&gt;IAS 16 e IFRS 16&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;170&quot; width=&quot;208&quot; height=&quot;82&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;108&quot; y=&quot;192&quot; text-anchor=&quot;middle&quot;&gt;Per venderlo nell&#x27;attività tipica&lt;/text&gt;&lt;text x=&quot;108&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;Inventories (rimanenze)&lt;/text&gt;&lt;text x=&quot;108&quot; y=&quot;226&quot; text-anchor=&quot;middle&quot;&gt;IAS 2&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;228&quot; y=&quot;170&quot; width=&quot;208&quot; height=&quot;82&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;332&quot; y=&quot;192&quot; text-anchor=&quot;middle&quot;&gt;Dato in finance lease&lt;/text&gt;&lt;text x=&quot;332&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;Non è IP: rischi e benefici&lt;/text&gt;&lt;text x=&quot;332&quot; y=&quot;226&quot; text-anchor=&quot;middle&quot;&gt;passano all&#x27;altra parte&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Le destinazioni possibili. &lt;span class=&quot;src&quot;&gt;Slide 6-8&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;

&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Sono IP&lt;/button&gt;&lt;button&gt;Non sono IP&lt;/button&gt;&lt;button&gt;Casi di confine&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;p&gt;Esempi di IP &lt;span class=&quot;src&quot;&gt;Slide 6 · IAS 40.8&lt;/span&gt;&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;
&lt;li&gt;&lt;strong&gt;Terreno tenuto per l&#x27;apprezzamento di lungo periodo&lt;/strong&gt;, non per la vendita a breve nell&#x27;attività ordinaria.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Terreno dall&#x27;uso futuro non ancora deciso&lt;/strong&gt;: se l&#x27;impresa non ha stabilito di usarlo o di venderlo a breve, si considera tenuto per l&#x27;apprezzamento.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Edificio di proprietà, o &lt;i lang=&quot;en&quot;&gt;right-of-use asset&lt;/i&gt; su un edificio, dato in &lt;i lang=&quot;en&quot;&gt;operating lease&lt;/i&gt;&lt;/strong&gt; (locazione che non trasferisce sostanzialmente i rischi e i benefici della proprietà).&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Edificio vuoto, tenuto per essere dato in &lt;i lang=&quot;en&quot;&gt;operating lease&lt;/i&gt;&lt;/strong&gt;: conta la destinazione, non che oggi sia affittato.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Immobile in costruzione o sviluppo per uso futuro come IP.&lt;/strong&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;p&gt;Fuori dallo scope di IAS 40 &lt;span class=&quot;src&quot;&gt;Slide 7-8 · IAS 40.5, 40.9&lt;/span&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Immobile usato&lt;/strong&gt; per produrre o fornire beni e servizi, o per scopi amministrativi.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Immobile destinato alla vendita&lt;/strong&gt; nell&#x27;attività ordinaria, oppure in costruzione o sviluppo per tale vendita (IAS 2): per esempio, acquistato solo per rivenderlo a breve o per sviluppo e rivendita.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;&lt;i lang=&quot;en&quot;&gt;Owner-occupied property&lt;/i&gt;&lt;/strong&gt; (IAS 16 e IFRS 16), compresi: immobile destinato a futuro uso proprio; immobile da sviluppare e poi usare; immobile occupato da dipendenti, &lt;em&gt;anche se pagano un canone di mercato&lt;/em&gt;; immobile usato in proprio in attesa di dismissione.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Immobile dato a un&#x27;altra entità in &lt;i lang=&quot;en&quot;&gt;finance lease&lt;/i&gt;&lt;/strong&gt; (locazione che trasferisce sostanzialmente rischi e benefici).&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Integrazione&lt;/span&gt;Il caso dei dipendenti è controintuitivo: anche con un canone di mercato, l&#x27;alloggio serve all&#x27;attività dell&#x27;impresa, quindi non è un investimento autonomo.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;p&gt;Le slide indicano il range par. 6-15 ma non trattano questi casi, utili all&#x27;esame.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Integrazione&lt;/span&gt;&lt;strong&gt;Non nelle slide e non verificato con la ricerca web: controlla sul &lt;a href=&quot;https://www.ifrs.org/content/ifrs/home/issued-standards/list-of-standards/ias-40-investment-property.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo di IAS 40&lt;/a&gt;.&lt;/strong&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Immobile a uso misto (par. 10)&lt;/summary&gt;&lt;div&gt;Se le due parti si possono vendere o dare in &lt;i lang=&quot;en&quot;&gt;finance lease&lt;/i&gt; separatamente, si contabilizzano separatamente. Se no, è IP solo se la parte a uso proprio è insignificante.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Servizi accessori agli occupanti (par. 11-13)&lt;/summary&gt;&lt;div&gt;Con servizi secondari (sicurezza, manutenzione) resta IP. Se i servizi sono significativi, come in un hotel gestito direttamente, è &lt;i lang=&quot;en&quot;&gt;owner-occupied&lt;/i&gt;.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Immobile affittato a una società del gruppo (par. 15)&lt;/summary&gt;&lt;div&gt;Nel bilancio consolidato è &lt;i lang=&quot;en&quot;&gt;owner-occupied&lt;/i&gt;, perché il gruppo lo usa. Nel bilancio separato di chi lo affitta può essere IP.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;widget&quot; id=&quot;sorter&quot;&gt;
&lt;h4&gt;Prova a classificare&lt;/h4&gt;
&lt;p class=&quot;hint&quot;&gt;Un caso alla volta: decidi, poi leggi perché.&lt;/p&gt;
&lt;p id=&quot;sq&quot; style=&quot;font:400 1.2rem/1.35 var(--serif);min-height:3.3em;margin:.4rem 0&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;btns&quot;&gt;&lt;button id=&quot;sy&quot;&gt;È investment property&lt;/button&gt;&lt;button id=&quot;sn&quot;&gt;Non è investment property&lt;/button&gt;&lt;button id=&quot;snx&quot; hidden&gt;Caso successivo&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;feedback&quot; id=&quot;sf&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;hint&quot; id=&quot;ss&quot;&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Un edificio oggi vuoto, destinato all&#x27;affitto, è IP?&lt;/summary&gt;&lt;div&gt;Sì, se è tenuto per essere dato in uno o più &lt;i lang=&quot;en&quot;&gt;operating lease&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 6&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Cosa cambia tra operating lease e finance lease per il proprietario-locatore?&lt;/summary&gt;&lt;div&gt;Con l&#x27;&lt;i lang=&quot;en&quot;&gt;operating lease&lt;/i&gt; l&#x27;edificio può essere IP. Con il &lt;i lang=&quot;en&quot;&gt;finance lease&lt;/i&gt; non lo è. &lt;span class=&quot;src&quot;&gt;Slide 6, 8&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Terreno senza destinazione decisa: perché non resta in sospeso?&lt;/summary&gt;&lt;div&gt;Lo standard lo presume tenuto per l&#x27;apprezzamento, quindi è IP, finché l&#x27;impresa non determina un uso proprio o una vendita a breve. &lt;span class=&quot;src&quot;&gt;Slide 6&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s3&quot; class=&quot;part slate&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;h2&gt;Recognition e measurement at recognition&lt;/h2&gt;&lt;p&gt;Quando l&#x27;immobile entra in bilancio, e a quale valore (par. 16-29A).&lt;/p&gt;&lt;/header&gt;
&lt;h3&gt;Recognition: due condizioni, entrambe necessarie&lt;/h3&gt;
&lt;p&gt;La &lt;i lang=&quot;en&quot;&gt;recognition&lt;/i&gt; è l&#x27;iscrizione in bilancio. Un&#x27;IP di proprietà si iscrive come attività &lt;em&gt;when, and only when&lt;/em&gt; (se, e solo se):&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 440 150&quot; style=&quot;max-width:36rem&quot; role=&quot;img&quot; aria-label=&quot;Benefici economici probabili e costo misurabile attendibilmente portano insieme alla recognition&quot;&gt;
&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;6&quot; width=&quot;210&quot; height=&quot;60&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;109&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;a) Future economic benefits&lt;/text&gt;&lt;text x=&quot;109&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;probabile che affluiscano all&#x27;entità&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;226&quot; y=&quot;6&quot; width=&quot;210&quot; height=&quot;60&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;331&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;b) Cost&lt;/text&gt;&lt;text x=&quot;331&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot;&gt;misurabile in modo attendibile&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln&quot; d=&quot;M109 66 205 96M331 66 235 96&quot;/&gt;
&lt;text class=&quot;sv-l&quot; x=&quot;220&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;and&lt;/text&gt;
&lt;g class=&quot;nd on&quot;&gt;&lt;rect x=&quot;120&quot; y=&quot;96&quot; width=&quot;200&quot; height=&quot;46&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;220&quot; y=&quot;124&quot; text-anchor=&quot;middle&quot;&gt;Iscrizione come asset&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;&lt;span class=&quot;src&quot;&gt;Slide 9 · IAS 40.16&lt;/span&gt;&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;h3&gt;Measurement at recognition: al costo&lt;/h3&gt;
&lt;p&gt;All&#x27;inizio si parte sempre dal costo, qualunque modello si sceglierà dopo, con i &lt;i lang=&quot;en&quot;&gt;transaction costs&lt;/i&gt; (costi dell&#x27;operazione) inclusi. &lt;span class=&quot;src&quot;&gt;Slide 10 · IAS 40.20&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Non aumentano il costo &lt;span class=&quot;src&quot;&gt;Slide 10 · IAS 40.23&lt;/span&gt;:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;&lt;i lang=&quot;en&quot;&gt;Start-up costs&lt;/i&gt;&lt;/strong&gt; (costi di avvio), salvo quelli necessari a portare l&#x27;immobile nella condizione per funzionare come previsto dal management.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;&lt;i lang=&quot;en&quot;&gt;Operating losses&lt;/i&gt;&lt;/strong&gt; (perdite operative) sostenute prima di raggiungere il livello di occupazione programmato.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Sprechi anomali&lt;/strong&gt; di materiali, lavoro o altre risorse nella costruzione o nello sviluppo.&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;widget&quot; id=&quot;cost&quot;&gt;
&lt;h4&gt;Componi il costo iniziale&lt;/h4&gt;
&lt;p class=&quot;hint&quot;&gt;Attiva le voci che secondo te entrano nel costo, poi controlla. &lt;span class=&quot;tag n&quot;&gt;Integrazione&lt;/span&gt;Cifre inventate, in migliaia di euro. Spese legali e imposte sono esempi di transaction costs scelti dal riassunto.&lt;/p&gt;
&lt;div id=&quot;costl&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;tiles&quot;&gt;&lt;div class=&quot;tile&quot;&gt;&lt;b id=&quot;costv&quot;&gt;0&lt;/b&gt;&lt;span&gt;il tuo costo iniziale&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;btns&quot;&gt;&lt;button class=&quot;pri&quot; id=&quot;costc&quot;&gt;Controlla&lt;/button&gt;&lt;button id=&quot;costr&quot;&gt;Azzera&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;feedback&quot; id=&quot;costf&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;&quot;When, and only when&quot;: cosa implica?&lt;/summary&gt;&lt;div&gt;Che le due condizioni sono necessarie e sufficienti: senza una delle due non si iscrive, con entrambe si deve iscrivere. &lt;span class=&quot;src&quot;&gt;Slide 9&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Le perdite dei primi mesi, con palazzo semivuoto, si capitalizzano?&lt;/summary&gt;&lt;div&gt;No. Sono &lt;i lang=&quot;en&quot;&gt;operating losses&lt;/i&gt; prima del livello di occupazione programmato e vanno a conto economico. &lt;span class=&quot;src&quot;&gt;Slide 10&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Chi sceglie il fair value model parte comunque dal costo?&lt;/summary&gt;&lt;div&gt;Sì. La misurazione iniziale è al costo per un&#x27;IP di proprietà. La scelta del modello riguarda la misurazione successiva. &lt;span class=&quot;src&quot;&gt;Slide 10-11&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s4&quot; class=&quot;part brick&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;h2&gt;Measurement after recognition&lt;/h2&gt;&lt;p&gt;La scelta centrale della lezione: &lt;i lang=&quot;en&quot;&gt;fair value model&lt;/i&gt; o &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; (par. 30-56).&lt;/p&gt;&lt;/header&gt;
&lt;p&gt;IAS 40 lascia scegliere, ma &lt;strong&gt;un solo metodo per tutta l&#x27;IP dell&#x27;impresa&lt;/strong&gt;. &lt;span class=&quot;src&quot;&gt;Slide 11 · IAS 40.30&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Cambiare si può solo se il bilancio ne esce con informazioni attendibili e &lt;em&gt;più rilevanti&lt;/em&gt;, come richiede IAS 8. Il passaggio da &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; a &lt;i lang=&quot;en&quot;&gt;cost&lt;/i&gt; è &lt;strong&gt;&quot;highly unlikely&quot;&lt;/strong&gt; che soddisfi questa condizione. &lt;span class=&quot;src&quot;&gt;Slide 11 · IAS 40.31&lt;/span&gt;&lt;/p&gt;
&lt;figure&gt;
&lt;svg viewBox=&quot;0 0 440 104&quot; style=&quot;max-width:32rem&quot; role=&quot;img&quot; aria-label=&quot;Da cost model a fair value model il cambio è possibile; il ritorno è altamente improbabile&quot;&gt;
&lt;g class=&quot;nd&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;22&quot; width=&quot;120&quot; height=&quot;58&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;64&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot;&gt;Cost model&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd on&quot;&gt;&lt;rect x=&quot;316&quot; y=&quot;22&quot; width=&quot;120&quot; height=&quot;58&quot; rx=&quot;9&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;376&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot;&gt;Fair value model&lt;/text&gt;&lt;/g&gt;
&lt;path class=&quot;ln on&quot; d=&quot;M128 38H306&quot;/&gt;&lt;path class=&quot;ln on&quot; d=&quot;M306 38l-9-5M306 38l-9 5&quot;/&gt;
&lt;text class=&quot;sv-l&quot; x=&quot;220&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;ammesso se più rilevante&lt;/text&gt;
&lt;path class=&quot;ln&quot; d=&quot;M312 66H134&quot; stroke-dasharray=&quot;4 5&quot;/&gt;&lt;path class=&quot;ln&quot; d=&quot;M134 66l9-5M134 66l9 5&quot;/&gt;
&lt;text class=&quot;sv-l&quot; x=&quot;220&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot;&gt;&quot;highly unlikely&quot;&lt;/text&gt;
&lt;/svg&gt;
&lt;/figure&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;La slide barra il vecchio titolo di IAS 8: con IFRS 18 diventa &lt;i lang=&quot;en&quot;&gt;Basis of Preparation of Financial Statements&lt;/i&gt;. IFRS 18 si applica agli esercizi dal 1° gennaio 2027, con applicazione anticipata ammessa. &lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-8-basis-of-preparation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation, IAS 8&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Integrazione&lt;/span&gt;&lt;strong&gt;Non nelle slide e non verificato con la ricerca web:&lt;/strong&gt; IAS 40.32A ammette una scelta separata per l&#x27;IP a copertura di passività con rendimento legato al suo fair value (tipico delle assicurazioni). Controlla sul &lt;a href=&quot;https://www.ifrs.org/content/ifrs/home/issued-standards/list-of-standards/ias-40-investment-property.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo di IAS 40&lt;/a&gt;.&lt;/div&gt;

&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Fair value model&lt;/button&gt;&lt;button&gt;Cost model&lt;/button&gt;&lt;button&gt;Confronto&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;p&gt;&lt;strong&gt;Fair value&lt;/strong&gt; (valore equo)&lt;/p&gt;
&lt;p class=&quot;q&quot;&gt;Il prezzo che si riceverebbe per vendere un&#x27;attività, o si pagherebbe per trasferire una passività, in un&#x27;orderly transaction tra market participants alla measurement date.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;src&quot;&gt;Slide 12 · IAS 40.5, IFRS 13&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;p&gt;Una &lt;i lang=&quot;en&quot;&gt;orderly transaction&lt;/i&gt; è una vendita normale, non forzata. I &lt;i lang=&quot;en&quot;&gt;market participants&lt;/i&gt; sono gli operatori di mercato: conta il loro punto di vista, non quello dell&#x27;impresa. La &lt;i lang=&quot;en&quot;&gt;measurement date&lt;/i&gt; è la data di valutazione.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;Tutta l&#x27;IP è valutata a &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt;, salvo i casi del par. 53. &lt;span class=&quot;src&quot;&gt;Slide 12 · IAS 40.33&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Gain o loss da variazione di fair value vanno in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;&lt;/strong&gt; (conto economico) dell&#x27;esercizio in cui sorgono. &lt;span class=&quot;src&quot;&gt;Slide 13 · IAS 40.35&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Il &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; riflette i canoni dei lease in essere e le altre assunzioni che i &lt;i lang=&quot;en&quot;&gt;market participants&lt;/i&gt; userebbero nelle condizioni correnti. &lt;span class=&quot;src&quot;&gt;Slide 13 · IAS 40.40&lt;/span&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;In pratica, non c&#x27;è &lt;i lang=&quot;en&quot;&gt;depreciation&lt;/i&gt; (ammortamento) separata: l&#x27;eventuale perdita di valore passa dall&#x27;adeguamento annuale.&lt;/p&gt;

&lt;div class=&quot;widget&quot; id=&quot;cap&quot;&gt;
&lt;h4&gt;Da dove viene il numero? Canoni e rendimento&lt;/h4&gt;
&lt;p class=&quot;hint&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Integrazione&lt;/span&gt;Capitalizzazione diretta, il metodo più semplice, con cifre inventate. Le slide citano le proiezioni di &lt;i lang=&quot;en&quot;&gt;discounted cash flow&lt;/i&gt; (flussi di cassa attualizzati) come misura alternativa. &lt;span class=&quot;src&quot;&gt;Slide 15&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Fair value ≈ canone netto annuo ÷ yield di mercato&lt;/div&gt;
&lt;label class=&quot;sl&quot;&gt;Canone netto annuo &lt;output id=&quot;capno&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;capn&quot; min=&quot;20&quot; max=&quot;120&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;Yield richiesto dal mercato &lt;output id=&quot;capyo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;capy&quot; min=&quot;3&quot; max=&quot;10&quot; step=&quot;0.25&quot; value=&quot;6&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;tiles&quot;&gt;&lt;div class=&quot;tile&quot;&gt;&lt;b id=&quot;capv&quot;&gt;&lt;/b&gt;&lt;span&gt;fair value stimato, migliaia di €&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;hint&quot; id=&quot;capt&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;DCF: Fair value = Σ CF&lt;sub&gt;t&lt;/sub&gt; ÷ (1 + r)&lt;sup&gt;t&lt;/sup&gt; + valore finale ÷ (1 + r)&lt;sup&gt;n&lt;/sup&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Fair value hierarchy di IFRS 13: i tre livelli&lt;/summary&gt;&lt;div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.iasplus.com/standard/ifrs13.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sintesi di IFRS 13 su IAS Plus&lt;/a&gt;&lt;/div&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Level 1:&lt;/strong&gt; prezzi quotati non rettificati in mercati attivi per beni identici. Priorità massima.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Level 2:&lt;/strong&gt; input osservabili diversi dai precedenti (Integrazione: per esempio prezzi al mq di immobili comparabili).&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Level 3:&lt;/strong&gt; input non osservabili, priorità minima (Integrazione: per esempio le stime interne di canoni e sfitto in un DCF). Due immobili raramente sono identici, quindi il Level 1 è raro per gli immobili.&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;IFRS 13 usa anche l&#x27;&lt;i lang=&quot;en&quot;&gt;highest and best use&lt;/i&gt;: l&#x27;uso fisicamente possibile, legalmente ammesso e finanziariamente fattibile che massimizza il valore.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;

&lt;div class=&quot;tabpanel&quot;&gt;
&lt;p&gt;La misurazione segue una di tre strade. &lt;span class=&quot;src&quot;&gt;Slide 18 · IAS 40.56&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;IFRS 5&lt;/h4&gt;&lt;p&gt;Se rispetta i criteri per l&#x27;&lt;i lang=&quot;en&quot;&gt;held for sale&lt;/i&gt; (destinata alla vendita), o è in un &lt;i lang=&quot;en&quot;&gt;disposal group&lt;/i&gt; (gruppo di attività da dismettere insieme) così classificato.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;IFRS 16&lt;/h4&gt;&lt;p&gt;Se è tenuta da un &lt;i lang=&quot;en&quot;&gt;lessee&lt;/i&gt; come &lt;i lang=&quot;en&quot;&gt;right-of-use asset&lt;/i&gt; e non è &lt;i lang=&quot;en&quot;&gt;held for sale&lt;/i&gt;.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;IAS 16&lt;/h4&gt;&lt;p&gt;In tutti gli altri casi, con il &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; di quello standard.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;formula&quot;&gt;Carrying amount = cost − accumulated depreciation − accumulated impairment&lt;/div&gt;
&lt;p&gt;Il &lt;i lang=&quot;en&quot;&gt;carrying amount&lt;/i&gt; è il valore contabile. La formula è quella del &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; di IAS 16. &lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.iasplus.com/standard/ias16.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus, IAS 16&lt;/a&gt;&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Impairment&lt;/strong&gt; (riduzione di valore): perdita pari all&#x27;eccedenza del &lt;i lang=&quot;en&quot;&gt;carrying amount&lt;/i&gt; sul &lt;i lang=&quot;en&quot;&gt;recoverable amount&lt;/i&gt;, cioè il maggiore tra &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; al netto dei costi di dismissione e &lt;i lang=&quot;en&quot;&gt;value in use&lt;/i&gt;. &lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias36.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 36, IFRS Foundation&lt;/a&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Held for sale&lt;/strong&gt;: minore tra &lt;i lang=&quot;en&quot;&gt;carrying amount&lt;/i&gt; e &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; al netto dei costi di vendita, senza ammortamento. &lt;a href=&quot;https://www.iasplus.com/en/standards/ifrs/ifrs5&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus, IFRS 5&lt;/a&gt;&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;p&gt;Il &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; non sparisce: chi usa il &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; deve comunque indicarlo nelle note. &lt;span class=&quot;src&quot;&gt;Slide 34 · IAS 40.79(e)&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;tabpanel&quot;&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Fair value model&lt;/th&gt;&lt;th&gt;Cost model&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Valore in bilancio&lt;/td&gt;&lt;td&gt;Fair value a fine periodo&lt;/td&gt;&lt;td&gt;Costo meno ammortamenti e impairment&lt;/td&gt;&lt;/tr&gt;

&lt;tr&gt;&lt;td&gt;Fair value&lt;/td&gt;&lt;td&gt;In bilancio&lt;/td&gt;&lt;td&gt;Nelle note (79(e))&lt;/td&gt;&lt;/tr&gt;

&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;widget&quot; id=&quot;model&quot;&gt;
&lt;h4&gt;Lo stesso immobile con i due modelli&lt;/h4&gt;
&lt;p class=&quot;hint&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Integrazione&lt;/span&gt;Edificio da 1.000 (migliaia di €), residual value zero, nessun impairment. Cifre inventate. I canoni non cambiano tra i modelli, quindi non compaiono.&lt;/p&gt;
&lt;svg id=&quot;mchart&quot; viewBox=&quot;0 0 440 240&quot; role=&quot;img&quot; aria-label=&quot;Grafico del carrying amount nei due modelli su dieci anni&quot;&gt;&lt;/svg&gt;
&lt;label class=&quot;sl&quot;&gt;Variazione annua del fair value &lt;output id=&quot;mgo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;mg&quot; min=&quot;-6&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;3&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;Useful life (vita utile) &lt;output id=&quot;mlo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;ml&quot; min=&quot;20&quot; max=&quot;60&quot; step=&quot;5&quot; value=&quot;40&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;Anno da leggere &lt;output id=&quot;mto&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;mt&quot; min=&quot;1&quot; max=&quot;10&quot; step=&quot;1&quot; value=&quot;5&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;tiles&quot;&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;b id=&quot;mv1&quot;&gt;&lt;/b&gt;&lt;span&gt;carrying amount, FV&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;b id=&quot;mv2&quot;&gt;&lt;/b&gt;&lt;span&gt;carrying amount, cost&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;b id=&quot;mv3&quot;&gt;&lt;/b&gt;&lt;span&gt;effetto sul P&amp;amp;L dell&#x27;anno, FV&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;tile&quot;&gt;&lt;b id=&quot;mv4&quot;&gt;&lt;/b&gt;&lt;span&gt;effetto sul P&amp;amp;L dell&#x27;anno, cost&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;hint&quot; id=&quot;mtxt&quot;&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Lessee: right-of-use asset a fair value&lt;/h3&gt;
&lt;p&gt;Il &lt;i lang=&quot;en&quot;&gt;lessee&lt;/i&gt; misura a &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; il &lt;i lang=&quot;en&quot;&gt;right-of-use asset&lt;/i&gt;, &lt;strong&gt;non&lt;/strong&gt; l&#x27;immobile sottostante: possiede un diritto, non il palazzo. &lt;span class=&quot;src&quot;&gt;Slide 13 · IAS 40.40A&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;IFRS 16 fissa il costo iniziale. Il par. 33 richiede poi di rimisurare a &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; se si sceglie quel modello. Se i pagamenti sono &lt;strong&gt;a condizioni di mercato&lt;/strong&gt;, il &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; all&#x27;acquisizione, al netto di tutti i pagamenti attesi, deve essere &lt;strong&gt;zero&lt;/strong&gt;. Quindi la rimisurazione non genera gain o loss iniziali, salvo che il &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; sia misurato in momenti diversi, come quando il modello viene scelto dopo l&#x27;iscrizione iniziale. &lt;span class=&quot;src&quot;&gt;Slide 14 · IAS 40.41&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Il rinvio al par. 50 serve a non contare due volte attività o passività già iscritte separatamente. &lt;span class=&quot;src&quot;&gt;Slide 14&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;rou&quot;&gt;
&lt;h4&gt;Perché a condizioni di mercato il gain è zero&lt;/h4&gt;
&lt;p class=&quot;hint&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Integrazione&lt;/span&gt;Lease di 10 anni, tasso 5%, canone di mercato 100, pagamenti a fine anno. Cifre inventate. La slide tratta solo il caso a mercato: l&#x27;altro serve a capire la logica, non è una regola della slide.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;Canone del contratto &lt;output&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;rc&quot; min=&quot;60&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;100&quot;&gt;&lt;/label&gt;
&lt;svg id=&quot;rchart&quot; viewBox=&quot;0 0 440 110&quot; role=&quot;img&quot; aria-label=&quot;Confronto tra costo del right-of-use asset e fair value&quot;&gt;&lt;/svg&gt;
&lt;p id=&quot;rtxt&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Quando il fair value non è misurabile: par. 53 e 55&lt;/h3&gt;
&lt;p&gt;Esiste una &lt;i lang=&quot;en&quot;&gt;rebuttable presumption&lt;/i&gt; (presunzione che ammette prova contraria): il &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; è misurabile in modo attendibile &lt;i lang=&quot;en&quot;&gt;on a continuing basis&lt;/i&gt; (con continuità). &lt;span class=&quot;src&quot;&gt;Slide 15&lt;/span&gt;&lt;/p&gt;
&lt;p&gt;Nello schema, il &lt;i lang=&quot;en&quot;&gt;disposal&lt;/i&gt; è la cessione dell&#x27;immobile e il &lt;i lang=&quot;en&quot;&gt;residual value&lt;/i&gt; è il valore residuo a fine vita utile.&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;p53&quot;&gt;
&lt;svg viewBox=&quot;0 0 440 282&quot; role=&quot;img&quot; aria-label=&quot;Percorso della presunzione di misurabilità del fair value&quot;&gt;
&lt;path class=&quot;ln&quot; id=&quot;p53l1&quot; d=&quot;M138 56V84&quot;/&gt;&lt;path class=&quot;ln&quot; id=&quot;p53l2&quot; d=&quot;M272 110H300&quot;/&gt;&lt;path class=&quot;ln&quot; id=&quot;p53l3&quot; d=&quot;M72 136V170&quot;/&gt;&lt;path class=&quot;ln&quot; id=&quot;p53l4&quot; d=&quot;M210 136V170&quot;/&gt;&lt;path class=&quot;ln&quot; id=&quot;p53l5&quot; d=&quot;M368 136V170&quot;/&gt;

&lt;g class=&quot;nd&quot; data-s=&quot;1&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;84&quot; width=&quot;268&quot; height=&quot;52&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;138&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot;&gt;Clear evidence al primo ingresso?&lt;/text&gt;&lt;text x=&quot;138&quot; y=&quot;123&quot; text-anchor=&quot;middle&quot;&gt;mercato inattivo e nessuna stima alternativa&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot; data-s=&quot;2&quot;&gt;&lt;rect x=&quot;300&quot; y=&quot;84&quot; width=&quot;136&quot; height=&quot;52&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;368&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot;&gt;Fair value&lt;/text&gt;&lt;text x=&quot;368&quot; y=&quot;123&quot; text-anchor=&quot;middle&quot;&gt;regola normale&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot; data-s=&quot;3&quot;&gt;&lt;rect x=&quot;4&quot; y=&quot;170&quot; width=&quot;136&quot; height=&quot;104&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;72&quot; y=&quot;192&quot; text-anchor=&quot;middle&quot;&gt;In costruzione&lt;/text&gt;&lt;text x=&quot;72&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;cost fino al primo tra&lt;/text&gt;&lt;text x=&quot;72&quot; y=&quot;228&quot; text-anchor=&quot;middle&quot;&gt;FV attendibile e&lt;/text&gt;&lt;text x=&quot;72&quot; y=&quot;246&quot; text-anchor=&quot;middle&quot;&gt;fine lavori&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot; data-s=&quot;4&quot;&gt;&lt;rect x=&quot;152&quot; y=&quot;170&quot; width=&quot;136&quot; height=&quot;104&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;220&quot; y=&quot;192&quot; text-anchor=&quot;middle&quot;&gt;Altra IP&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;IAS 16 o IFRS 16&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;228&quot; text-anchor=&quot;middle&quot;&gt;residual value = 0&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;246&quot; text-anchor=&quot;middle&quot;&gt;fino al disposal&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;nd&quot; data-s=&quot;5&quot;&gt;&lt;rect x=&quot;300&quot; y=&quot;170&quot; width=&quot;136&quot; height=&quot;104&quot; rx=&quot;8&quot;/&gt;&lt;text class=&quot;b&quot; x=&quot;368&quot; y=&quot;192&quot; text-anchor=&quot;middle&quot;&gt;Par. 55&lt;/text&gt;&lt;text x=&quot;368&quot; y=&quot;210&quot; text-anchor=&quot;middle&quot;&gt;già a FV: resta a FV&lt;/text&gt;&lt;text x=&quot;368&quot; y=&quot;228&quot; text-anchor=&quot;middle&quot;&gt;anche se il mercato&lt;/text&gt;&lt;text x=&quot;368&quot; y=&quot;246&quot; text-anchor=&quot;middle&quot;&gt;si rarefà&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;

&lt;/div&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Dove finisce la variazione di fair value di un&#x27;IP nel fair value model?&lt;/summary&gt;&lt;div&gt;In &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;, nell&#x27;esercizio in cui sorge. &lt;span class=&quot;src&quot;&gt;Slide 13 · IAS 40.35&lt;/span&gt; Attenzione a non confonderla con la rivalutazione di IAS 16.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quali due condizioni servono per uscire dalla presunzione del par. 53?&lt;/summary&gt;&lt;div&gt;Mercato di immobili comparabili inattivo &lt;strong&gt;e&lt;/strong&gt; nessuna misura alternativa attendibile del &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt;, per esempio con proiezioni DCF. Entrambe, con &lt;i lang=&quot;en&quot;&gt;clear evidence&lt;/i&gt;, al primo ingresso. &lt;span class=&quot;src&quot;&gt;Slide 15&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Il mercato diventa illiquido dopo anni di valutazione a fair value: si torna al costo?&lt;/summary&gt;&lt;div&gt;No. Si resta a &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; fino al &lt;i lang=&quot;en&quot;&gt;disposal&lt;/i&gt;, o finché l&#x27;immobile diventa &lt;i lang=&quot;en&quot;&gt;owner-occupied&lt;/i&gt; o inizia lo sviluppo per la vendita. &lt;span class=&quot;src&quot;&gt;Slide 17 · IAS 40.55&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Nell&#x27;eccezione del par. 53, qual è il residual value?&lt;/summary&gt;&lt;div&gt;Si assume pari a zero, e si continua con IAS 16 o IFRS 16 fino al &lt;i lang=&quot;en&quot;&gt;disposal&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 16&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s5&quot; class=&quot;part sage&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;h2&gt;Transfers&lt;/h2&gt;&lt;p&gt;Quando l&#x27;uso cambia, l&#x27;immobile cambia standard (par. 57-65).&lt;/p&gt;&lt;/header&gt;
&lt;p&gt;Un trasferimento avviene &lt;em&gt;when, and only when&lt;/em&gt; c&#x27;è un &lt;strong&gt;&lt;i lang=&quot;en&quot;&gt;change in use&lt;/i&gt;&lt;/strong&gt; (cambiamento d&#x27;uso) provato dai fatti. &lt;span class=&quot;src&quot;&gt;Slide 19 · IAS 40.57&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;strong&gt;Attenzione, la slide riporta la formula precedente.&lt;/strong&gt; Con l&#x27;emendamento del dicembre 2016 (&lt;i lang=&quot;en&quot;&gt;Transfers of Investment Property&lt;/i&gt;) le quattro situazioni sono &lt;em&gt;esempi non esaustivi&lt;/em&gt; di prova del cambiamento d&#x27;uso, e un cambio di intenzioni del management, da solo, non basta: servono azioni osservabili. &lt;a href=&quot;https://www.iasplus.com/en/news/2016/12/ias-40&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt; · &lt;a href=&quot;https://www.ifrs.org/news-and-events/news/2016/05/ifrs-ic-recommends-the-board-to-amend-ias-40/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/div&gt;

&lt;div class=&quot;widget&quot; id=&quot;tr&quot;&gt;
&lt;h4&gt;Esplora i trasferimenti&lt;/h4&gt;
&lt;p class=&quot;hint&quot;&gt;Scegli una freccia nello schema, o il pulsante del completamento, poi muovi il fair value. &lt;span class=&quot;tag n&quot;&gt;Integrazione&lt;/span&gt;Cifre inventate, in migliaia di euro. Carrying amount prima del trasferimento: 800.&lt;/p&gt;
&lt;svg viewBox=&quot;0 0 440 284&quot; style=&quot;max-width:36rem;margin:auto&quot; aria-label=&quot;Trasferimenti tra investment property, owner-occupied property e inventories&quot;&gt;

&lt;g class=&quot;ar&quot; data-k=&quot;c&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;Da owner-occupied a investment property&quot;&gt;&lt;path class=&quot;hit&quot; d=&quot;M120 214 205 66&quot;/&gt;&lt;path class=&quot;vis&quot; d=&quot;M120 214 205 66&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;circle cx=&quot;162&quot; cy=&quot;140&quot; r=&quot;12&quot;/&gt;&lt;text x=&quot;162&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot;&gt;c&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;ar&quot; data-k=&quot;b&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;Da investment property a inventories&quot;&gt;&lt;path class=&quot;hit&quot; d=&quot;M285 66 380 214&quot;/&gt;&lt;path class=&quot;vis&quot; d=&quot;M285 66 380 214&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;circle cx=&quot;333&quot; cy=&quot;140&quot; r=&quot;12&quot;/&gt;&lt;text x=&quot;333&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot;&gt;b&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;ar&quot; data-k=&quot;d&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;Da inventories a investment property&quot;&gt;&lt;path class=&quot;hit&quot; d=&quot;M320 214 235 66&quot;/&gt;&lt;path class=&quot;vis&quot; d=&quot;M320 214 235 66&quot; marker-end=&quot;url(#ah2)&quot;/&gt;&lt;circle cx=&quot;278&quot; cy=&quot;140&quot; r=&quot;12&quot;/&gt;&lt;text x=&quot;278&quot; y=&quot;145&quot; text-anchor=&quot;middle&quot;&gt;d&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;btns&quot;&gt;&lt;button id=&quot;tre&quot;&gt;Self-constructed completata&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;btns&quot; role=&quot;group&quot; aria-label=&quot;Modello&quot;&gt;&lt;button id=&quot;trfv&quot; aria-pressed=&quot;true&quot;&gt;Fair value model&lt;/button&gt;&lt;button id=&quot;trcm&quot; aria-pressed=&quot;false&quot;&gt;Cost model&lt;/button&gt;&lt;/div&gt;
&lt;h4 id=&quot;trh&quot; aria-live=&quot;polite&quot;&gt;&lt;/h4&gt;
&lt;p id=&quot;trev&quot;&gt;&lt;/p&gt;
&lt;p id=&quot;trr&quot;&gt;&lt;/p&gt;
&lt;label class=&quot;sl&quot; id=&quot;trfl&quot;&gt;Fair value alla data del cambio d&#x27;uso &lt;output id=&quot;trfo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;trf&quot; min=&quot;500&quot; max=&quot;1200&quot; step=&quot;10&quot; value=&quot;950&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot; id=&quot;tril&quot;&gt;Impairment rilevato in passato &lt;output id=&quot;trio&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;tri&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;10&quot; value=&quot;50&quot;&gt;&lt;/label&gt;
&lt;div class=&quot;tiles&quot;&gt;&lt;div class=&quot;tile&quot;&gt;&lt;b id=&quot;trv1&quot;&gt;&lt;/b&gt;&lt;span&gt;nuovo carrying amount&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;b id=&quot;trv2&quot;&gt;&lt;/b&gt;&lt;span&gt;in profit or loss&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;b id=&quot;trv3&quot;&gt;&lt;/b&gt;&lt;span&gt;in OCI&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Le regole in tabella&lt;/h3&gt;
&lt;div class=&quot;tw&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Da → a, con IP a fair value&lt;/th&gt;&lt;th&gt;Trattamento della differenza&lt;/th&gt;&lt;th&gt;Fonte&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;IP → owner-occupied o inventories&lt;/td&gt;&lt;td&gt;&lt;i lang=&quot;en&quot;&gt;Deemed cost&lt;/i&gt; (costo presunto, il punto di partenza per lo standard di arrivo) = &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; alla data del cambio d&#x27;uso&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;Slide 21 · 40.60&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Owner-occupied → IP&lt;/td&gt;&lt;td&gt;IAS 16 o IFRS 16 fino alla data. La differenza si tratta come una &lt;i lang=&quot;en&quot;&gt;revaluation&lt;/i&gt; di IAS 16&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;Slide 21 · 40.61&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Inventories → IP&lt;/td&gt;&lt;td&gt;Differenza in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;Slide 22 · 40.63&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Self-constructed completata&lt;/td&gt;&lt;td&gt;Differenza in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;src&quot;&gt;Slide 22 · 40.65&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;I par. 60-65 valgono per chi usa il &lt;i lang=&quot;en&quot;&gt;fair value model&lt;/i&gt;. Col &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt;, invece, i trasferimenti &lt;strong&gt;non cambiano&lt;/strong&gt; né il &lt;i lang=&quot;en&quot;&gt;carrying amount&lt;/i&gt; né il costo, ai fini di misurazione e disclosure. &lt;span class=&quot;src&quot;&gt;Slide 23 · IAS 40.59&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;strong&gt;Cosa significa &quot;come una revaluation&quot;.&lt;/strong&gt; Un aumento va in revaluation surplus tramite &lt;i lang=&quot;en&quot;&gt;OCI&lt;/i&gt; (&lt;i lang=&quot;en&quot;&gt;other comprehensive income&lt;/i&gt;, le componenti del risultato complessivo fuori dal conto economico), salvo la parte che riprende un &lt;i lang=&quot;en&quot;&gt;impairment&lt;/i&gt; precedente, che va a &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;. Una diminuzione va a &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;. Lo schema sopra assume che non ci sia surplus preesistente. &lt;a href=&quot;https://cfrr.worldbank.org:443/sites/default/files/2022-05/06_0.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank CFRR&lt;/a&gt; · &lt;a href=&quot;https://standards.aasb.gov.au/node/907&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;AASB 140, gemello australiano di IAS 40&lt;/a&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Integrazione&lt;/span&gt;Perché l&#x27;asimmetria? L&#x27;immobile uscito dall&#x27;uso proprio non era ancora nel &quot;circuito&quot; del fair value: la plusvalenza maturata mentre era in uso si tiene fuori dal conto economico, come in IAS 16. Le rimanenze invece erano destinate alla vendita, quindi la differenza somiglia a un ricavo. Attenzione alla lettura: dopo il trasferimento, le variazioni successive di fair value vanno a profit or loss.&lt;/div&gt;

&lt;h3&gt;Due casi in cui non c&#x27;è transfer&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Vendere senza sviluppare&lt;/summary&gt;&lt;div&gt;Se l&#x27;impresa decide di cedere l&#x27;IP &lt;strong&gt;senza sviluppo&lt;/strong&gt;, l&#x27;immobile resta IP fino alla &lt;i lang=&quot;en&quot;&gt;derecognition&lt;/i&gt; (eliminazione dallo stato patrimoniale) e non passa a &lt;i lang=&quot;en&quot;&gt;inventories&lt;/i&gt;. Il passaggio richiede l&#x27;avvio dello sviluppo in vista della vendita. &lt;span class=&quot;src&quot;&gt;Slide 20 · IAS 40.58&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Riqualificare per continuare a dare in affitto&lt;/summary&gt;&lt;div&gt;Durante il &lt;i lang=&quot;en&quot;&gt;redevelopment&lt;/i&gt; per continuare l&#x27;uso come IP, l&#x27;immobile resta IP e non diventa &lt;i lang=&quot;en&quot;&gt;owner-occupied&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 20 · IAS 40.58&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Il CdA delibera di occupare in futuro il palazzo affittato, ma nulla cambia ancora. C&#x27;è transfer?&lt;/summary&gt;&lt;div&gt;No. Slide: serve l&#x27;inizio dell&#x27;&lt;i lang=&quot;en&quot;&gt;owner-occupation&lt;/i&gt;. Il testo aggiornato ribadisce che le sole intenzioni non provano il cambiamento d&#x27;uso (fonte esterna sopra). &lt;span class=&quot;src&quot;&gt;Slide 19&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Rimanenze con carrying amount 300 e fair value 420 passano a IP a fair value: effetto?&lt;/summary&gt;&lt;div&gt;Gain di 120 in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 22 · IAS 40.63&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Uffici propri con carrying amount 500 e fair value 650 diventano IP a fair value, senza impairment passati: effetto?&lt;/summary&gt;&lt;div&gt;Differenza di 150 trattata come &lt;i lang=&quot;en&quot;&gt;revaluation&lt;/i&gt; di IAS 16, quindi in &lt;i lang=&quot;en&quot;&gt;OCI&lt;/i&gt;, non in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 21 · IAS 40.61&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;E se la stessa impresa usasse il cost model?&lt;/summary&gt;&lt;div&gt;Nessun effetto: &lt;i lang=&quot;en&quot;&gt;carrying amount&lt;/i&gt; e costo restano invariati. &lt;span class=&quot;src&quot;&gt;Slide 23 · IAS 40.59&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s6&quot; class=&quot;part ochre&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;h2&gt;Disposals&lt;/h2&gt;&lt;p&gt;L&#x27;uscita dal bilancio (par. 66-73).&lt;/p&gt;&lt;/header&gt;
&lt;p&gt;La &lt;i lang=&quot;en&quot;&gt;derecognition&lt;/i&gt; avviene &lt;strong&gt;al &lt;i lang=&quot;en&quot;&gt;disposal&lt;/i&gt;&lt;/strong&gt; (cessione), oppure quando l&#x27;immobile è &lt;strong&gt;ritirato definitivamente dall&#x27;uso e non ci si attendono benefici economici futuri&lt;/strong&gt; dalla sua cessione. &lt;span class=&quot;src&quot;&gt;Slide 24 · IAS 40.66&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Gain o loss = net disposal proceeds − carrying amount&lt;/div&gt;
&lt;p&gt;Va in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt; nel periodo della cessione o del ritiro, salvo diversa previsione di IFRS 16 per un &lt;i lang=&quot;en&quot;&gt;sale and leaseback&lt;/i&gt; (vendita con ripresa in locazione). &lt;span class=&quot;src&quot;&gt;Slide 24 · IAS 40.69&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;dis&quot;&gt;
&lt;h4&gt;Calcola il gain o la loss&lt;/h4&gt;
&lt;p class=&quot;hint&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Integrazione&lt;/span&gt;Cifre inventate, in migliaia di euro.&lt;/p&gt;
&lt;label class=&quot;sl&quot;&gt;Prezzo di vendita &lt;output id=&quot;dpo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dp&quot; min=&quot;600&quot; max=&quot;1400&quot; step=&quot;10&quot; value=&quot;1100&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;Costi di vendita &lt;output id=&quot;dco&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;dc&quot; min=&quot;0&quot; max=&quot;80&quot; step=&quot;5&quot; value=&quot;30&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;Carrying amount &lt;output id=&quot;dao&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;da&quot; min=&quot;600&quot; max=&quot;1400&quot; step=&quot;10&quot; value=&quot;1000&quot;&gt;&lt;/label&gt;
&lt;svg id=&quot;dchart&quot; viewBox=&quot;0 0 440 92&quot; role=&quot;img&quot; aria-label=&quot;Confronto tra net disposal proceeds e carrying amount&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;tiles&quot;&gt;&lt;div class=&quot;tile&quot;&gt;&lt;b id=&quot;dv&quot;&gt;&lt;/b&gt;&lt;span id=&quot;dvl&quot;&gt;gain&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;hint&quot;&gt;Col &lt;i lang=&quot;en&quot;&gt;fair value model&lt;/i&gt; il &lt;i lang=&quot;en&quot;&gt;carrying amount&lt;/i&gt; tende a essere vicino al prezzo, quindi il risultato di cessione è spesso piccolo: il guadagno è già emerso anno per anno. Col &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; emerge tutto alla vendita.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;p&gt;&lt;strong&gt;Compensation from third parties&lt;/strong&gt; (indennizzi da terzi)&lt;/p&gt;&lt;p&gt;Per un&#x27;IP &lt;i lang=&quot;en&quot;&gt;impaired&lt;/i&gt; (svalutata), persa o ceduta, l&#x27;indennizzo va in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt; &lt;strong&gt;quando diventa &lt;i lang=&quot;en&quot;&gt;receivable&lt;/i&gt;&lt;/strong&gt; (esigibile). &lt;span class=&quot;src&quot;&gt;Slide 24 · IAS 40.72&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Integrazione&lt;/span&gt;Esempio: un incendio distrugge un palazzo e l&#x27;assicuratore riconosce l&#x27;indennizzo l&#x27;anno dopo. Si elimina il palazzo nell&#x27;anno dell&#x27;incendio, si rileva l&#x27;indennizzo quando diventa esigibile.&lt;/div&gt;
&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Un edificio inagibile e abbandonato, senza benefici attesi dalla cessione, resta in bilancio?&lt;/summary&gt;&lt;div&gt;No. È ritirato definitivamente dall&#x27;uso, quindi scatta la &lt;i lang=&quot;en&quot;&gt;derecognition&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 24 · IAS 40.66&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Prezzo 900, costi di vendita 20, carrying amount 850: risultato?&lt;/summary&gt;&lt;div&gt;Net proceeds 880, gain di 30 in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 24 · IAS 40.69&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quando si rileva un indennizzo assicurativo?&lt;/summary&gt;&lt;div&gt;Quando diventa &lt;i lang=&quot;en&quot;&gt;receivable&lt;/i&gt;, non necessariamente al momento del danno. &lt;span class=&quot;src&quot;&gt;Slide 24 · IAS 40.72&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s7&quot; class=&quot;part slate&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt;&lt;h2&gt;Disclosure&lt;/h2&gt;&lt;p&gt;Cosa raccontare nelle note: una base comune e una parte per modello (par. 74-79).&lt;/p&gt;&lt;/header&gt;
&lt;p&gt;Queste richieste si aggiungono a quelle di IFRS 16. Il proprietario dà l&#x27;informativa da &lt;i lang=&quot;en&quot;&gt;lessor&lt;/i&gt; (locatore). Il &lt;i lang=&quot;en&quot;&gt;lessee&lt;/i&gt; che tiene l&#x27;IP come &lt;i lang=&quot;en&quot;&gt;right-of-use asset&lt;/i&gt; dà quella da &lt;i lang=&quot;en&quot;&gt;lessee&lt;/i&gt; e, per i suoi &lt;i lang=&quot;en&quot;&gt;operating lease&lt;/i&gt; attivi, quella da &lt;i lang=&quot;en&quot;&gt;lessor&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 25 · IAS 40.74&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;tabs&quot; data-tabs&gt;
&lt;div class=&quot;tablist&quot;&gt;&lt;button&gt;Comune (75)&lt;/button&gt;&lt;button&gt;Fair value (76-78)&lt;/button&gt;&lt;button&gt;Cost (79)&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;ol&gt;
&lt;li&gt;&lt;strong&gt;Quale modello&lt;/strong&gt; si applica. &lt;span class=&quot;src&quot;&gt;Slide 26&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;I criteri di classificazione&lt;/strong&gt;, quando è difficile distinguere IP da &lt;i lang=&quot;en&quot;&gt;owner-occupied&lt;/i&gt; e da immobile destinato alla vendita. &lt;span class=&quot;src&quot;&gt;Slide 26&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Quanto il &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; si basa su un &lt;i lang=&quot;en&quot;&gt;independent valuer&lt;/i&gt;&lt;/strong&gt; (perito indipendente) con qualifica riconosciuta e pertinente, ed esperienza recente per zona e categoria. Se questa valutazione manca, va detto. &lt;span class=&quot;src&quot;&gt;Slide 26&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Gli importi in &lt;i lang=&quot;en&quot;&gt;profit or loss&lt;/i&gt;:&lt;/strong&gt; canoni da IP; costi operativi diretti, comprese riparazioni e manutenzioni, separando l&#x27;IP che ha generato canoni da quella che non ne ha generati; variazione cumulata di &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; per la vendita da un &lt;i lang=&quot;en&quot;&gt;pool&lt;/i&gt; (insieme) al costo a uno a &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt;. &lt;span class=&quot;src&quot;&gt;Slide 27&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Restrizioni:&lt;/strong&gt; esistenza e importi, sulla realizzabilità dell&#x27;IP o sul trasferimento di proventi e incassi di cessione. &lt;span class=&quot;src&quot;&gt;Slide 27&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Obblighi contrattuali&lt;/strong&gt; di acquisto, costruzione o sviluppo, o per riparazioni, manutenzione o migliorie. &lt;span class=&quot;src&quot;&gt;Slide 27&lt;/span&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;p&gt;Serve una &lt;i lang=&quot;en&quot;&gt;reconciliation&lt;/i&gt; (riconciliazione tra valore iniziale e finale) con queste voci. &lt;span class=&quot;src&quot;&gt;Slide 28-29 · IAS 40.76&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;widget&quot; id=&quot;wf&quot; style=&quot;margin-top:.4rem&quot;&gt;
&lt;h4&gt;La reconciliation a colpo d&#x27;occhio&lt;/h4&gt;
&lt;p class=&quot;hint&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Integrazione&lt;/span&gt;Cifre inventate, in migliaia di euro. Asse troncato per rendere visibili i movimenti.&lt;/p&gt;
&lt;svg id=&quot;wchart&quot; viewBox=&quot;0 0 440 262&quot; role=&quot;img&quot; aria-label=&quot;Riconciliazione del carrying amount dall&#x27;inizio alla fine del periodo&quot;&gt;&lt;/svg&gt;
&lt;label class=&quot;sl&quot;&gt;Net gains or losses da fair value &lt;output id=&quot;wfo&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;wfr&quot; min=&quot;-150&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;65&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;Par. 77: valutazione rettificata&lt;/summary&gt;&lt;div&gt;Se la perizia è rettificata in modo significativo per il bilancio, per esempio per non contare due volte voci già iscritte, si riconcilia il valore della perizia con quello in bilancio, mostrando a parte le &lt;i lang=&quot;en&quot;&gt;lease liabilities&lt;/i&gt; (debiti per lease) riaggiunte e le altre rettifiche significative. &lt;span class=&quot;src&quot;&gt;Slide 30&lt;/span&gt;&lt;p&gt;&lt;span class=&quot;tag n&quot;&gt;Integrazione&lt;/span&gt;Esempio: perizia 800 + lease liabilities riaggiunte 200 = 1.000 in bilancio.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Par. 78: IP al costo per l&#x27;eccezione del par. 53&lt;/summary&gt;&lt;div&gt;Importi separati nella &lt;i lang=&quot;en&quot;&gt;reconciliation&lt;/i&gt;, più: descrizione dell&#x27;IP; perché il &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; non è attendibile; se possibile, il range di stime in cui è altamente probabile che ricada; alla cessione, il fatto stesso, il &lt;i lang=&quot;en&quot;&gt;carrying amount&lt;/i&gt; al momento della vendita e il gain o loss. &lt;span class=&quot;src&quot;&gt;Slide 31&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;div class=&quot;tabpanel&quot;&gt;
&lt;p&gt;Oltre al par. 75. &lt;span class=&quot;src&quot;&gt;Slide 32-34 · IAS 40.79&lt;/span&gt;&lt;/p&gt;
&lt;ol type=&quot;a&quot;&gt;
&lt;li&gt;&lt;strong&gt;Metodi di &lt;i lang=&quot;en&quot;&gt;depreciation&lt;/i&gt;&lt;/strong&gt; usati.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;&lt;i lang=&quot;en&quot;&gt;Useful lives&lt;/i&gt; o aliquote&lt;/strong&gt; usate.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;&lt;i lang=&quot;en&quot;&gt;Gross carrying amount&lt;/i&gt; (valore lordo) e ammortamenti accumulati&lt;/strong&gt;, aggregati agli &lt;i lang=&quot;en&quot;&gt;impairment&lt;/i&gt; accumulati, a inizio e fine periodo.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;&lt;i lang=&quot;en&quot;&gt;Reconciliation&lt;/i&gt;&lt;/strong&gt;: &lt;i lang=&quot;en&quot;&gt;additions&lt;/i&gt; (da acquisizioni, da spese successive, da &lt;i lang=&quot;en&quot;&gt;business combinations&lt;/i&gt;, cioè aggregazioni aziendali); &lt;i lang=&quot;en&quot;&gt;held for sale&lt;/i&gt; e altre cessioni; &lt;i lang=&quot;en&quot;&gt;depreciation&lt;/i&gt;; &lt;i lang=&quot;en&quot;&gt;impairment&lt;/i&gt; rilevati e ripristinati (IAS 36); differenze di cambio; trasferimenti da e verso &lt;i lang=&quot;en&quot;&gt;inventories&lt;/i&gt; e &lt;i lang=&quot;en&quot;&gt;owner-occupied&lt;/i&gt;; altre variazioni.&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Il &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; dell&#x27;IP.&lt;/strong&gt; Se non è misurabile (par. 53): descrizione, motivo e, se possibile, il range di stime.&lt;/li&gt;
&lt;/ol&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Integrazione&lt;/span&gt;Trucco di memoria: le due &lt;i lang=&quot;en&quot;&gt;reconciliation&lt;/i&gt; sono quasi uguali. Dove il &lt;i lang=&quot;en&quot;&gt;fair value model&lt;/i&gt; ha gli adeguamenti a &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt;, il &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; ha &lt;i lang=&quot;en&quot;&gt;depreciation&lt;/i&gt; e &lt;i lang=&quot;en&quot;&gt;impairment&lt;/i&gt;.&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Se non c&#x27;è stata una perizia indipendente, cosa si scrive?&lt;/summary&gt;&lt;div&gt;Lo si dichiara. Il fatto stesso va indicato nelle note. &lt;span class=&quot;src&quot;&gt;Slide 26&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Chi usa il cost model può ignorare il fair value?&lt;/summary&gt;&lt;div&gt;No, deve indicarlo, oppure spiegare perché non è misurabile in modo attendibile. &lt;span class=&quot;src&quot;&gt;Slide 34 · IAS 40.79(e)&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché i costi operativi diretti sono separati in due voci?&lt;/summary&gt;&lt;div&gt;Lo standard distingue l&#x27;IP che ha generato canoni nel periodo da quella che non ne ha generati. &lt;span class=&quot;src&quot;&gt;Slide 27&lt;/span&gt; Integrazione: così il lettore vede anche il costo dell&#x27;immobile sfitto.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s8&quot; class=&quot;part brick&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;&lt;h2&gt;Decision tree&lt;/h2&gt;&lt;p&gt;Il riassunto dell&#x27;intero percorso, dalla guida di Alexander e Archer (2017).&lt;/p&gt;&lt;/header&gt;
&lt;p&gt;L&#x27;albero è riprodotto dall&#x27;appendice alla versione 2000 di IAS 40. &lt;span class=&quot;src&quot;&gt;Slide 35-36&lt;/span&gt;&lt;/p&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;strong&gt;Un ramo è superato.&lt;/strong&gt; Il ramo &quot;in costruzione → IAS 16 fino al completamento&quot; riflette il testo del 2000. Con gli &lt;i lang=&quot;en&quot;&gt;Improvements&lt;/i&gt; del maggio 2008, in vigore dal 1° gennaio 2009, l&#x27;immobile in costruzione per futuro uso come IP è passato in IAS 40: è ciò che dicono anche le slide 6(e) e 16. &lt;a href=&quot;https://pwc.com/gx/en/asset-management/assets/practical-guide-to-amended-ias-40.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Guida PwC all&#x27;IAS 40 modificato&lt;/a&gt;&lt;/div&gt;
