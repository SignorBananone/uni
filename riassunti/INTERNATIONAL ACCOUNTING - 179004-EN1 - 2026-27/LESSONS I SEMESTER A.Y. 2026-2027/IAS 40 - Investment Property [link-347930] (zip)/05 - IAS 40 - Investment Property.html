&lt;div class=&quot;check&quot;&gt;&lt;h3&gt;Autoverifica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché la prima domanda è la vendita e non l&#x27;uso?&lt;/summary&gt;&lt;div&gt;L&#x27;albero esclude via via i casi fuori da IAS 40: l&#x27;IP è ciò che resta dopo aver scartato vendita ordinaria, uso proprio e costruzione. &lt;span class=&quot;src&quot;&gt;Slide 36&lt;/span&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Oggi, un edificio in costruzione per futuro affitto segue IAS 16?&lt;/summary&gt;&lt;div&gt;No: è IP. Lo dicono la slide 6(e) e la slide 16, mentre l&#x27;albero riporta la versione del 2000.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Il ramo cost model dice &quot;IAS 16 con disclosure di IAS 40&quot;: è completo?&lt;/summary&gt;&lt;div&gt;Va integrato con la slide 18: IFRS 5 se &lt;i lang=&quot;en&quot;&gt;held for sale&lt;/i&gt;, IFRS 16 per il &lt;i lang=&quot;en&quot;&gt;right-of-use asset&lt;/i&gt;, IAS 16 negli altri casi.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;s9&quot; class=&quot;part terra&quot;&gt;
&lt;header&gt;&lt;span class=&quot;num&quot;&gt;→&lt;/span&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;p&gt;Testi e standard citati nelle slide. Tutte le schede sono &lt;strong&gt;fonti esterne&lt;/strong&gt;, distinte dal contenuto delle slide.&lt;/p&gt;&lt;/header&gt;
&lt;div class=&quot;note&quot;&gt;&lt;span class=&quot;tag n&quot;&gt;Nota&lt;/span&gt;Gli altri file di &lt;code&gt;corso/&lt;/code&gt; non sono stati consultati: l&#x27;ambiente di lavoro non permetteva di elencare la cartella. I legami con altre lezioni sono quindi solo quelli tra standard citati in queste slide. Le schede si basano sugli estratti restituiti dalla ricerca: per la parola esatta fa fede il testo ufficiale.&lt;/div&gt;

&lt;h3&gt;Il libro citato&lt;/h3&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;David Alexander e Simon Archer, &lt;i&gt;International Accounting/Financial Reporting Standards Guide&lt;/i&gt;&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;Wolters Kluwer, edizione 2017 (il catalogo indica copyright 2016) · citato alla slide 35&lt;/p&gt;
&lt;p&gt;Guida di consultazione agli standard internazionali, pubblicata in edizioni annuali. Conta perché è la fonte da cui le slide prendono il decision tree. L&#x27;indice del volume non è stato verificato.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;a href=&quot;https://search.ub.tum.de/vufind/Record/DE-604.BV043840803&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda di catalogo, biblioteca TU München&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Lo standard e la sua storia&lt;/h3&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IAS 40 &lt;i&gt;Investment Property&lt;/i&gt;&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;IFRS Foundation · emesso dall&#x27;IASC nell&#x27;aprile 2000, riemesso dall&#x27;IASB nel dicembre 2003&lt;/p&gt;
&lt;p&gt;Il testo di riferimento di tutta la lezione. La versione del 2000, in vigore dal 2001, è quella con l&#x27;appendice da cui viene l&#x27;albero della slide 36. Da leggere in versione aggiornata, per le differenze segnalate nelle sezioni 5 e 8.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/content/ifrs/home/issued-standards/list-of-standards/ias-40-investment-property.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/standard/ias40.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Sintesi e cronologia, IAS Plus&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;Improvements to IFRSs (maggio 2008): IP in costruzione&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;In vigore dal 1° gennaio 2009&lt;/p&gt;
&lt;p&gt;Porta in IAS 40 gli immobili in costruzione per futuro uso come IP. Conta perché spiega il contrasto tra la slide 36 e le slide 6 e 16.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;a href=&quot;https://pwc.com/gx/en/asset-management/assets/practical-guide-to-amended-ias-40.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Guida PwC&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/news/2009/October/news5308&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;Transfers of Investment Property (Amendments to IAS 40)&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;IASB, dicembre 2016 · modifica i par. 57-58 · omologazione UE: Regolamento (UE) 2018/400&lt;/p&gt;
&lt;p&gt;Chiarisce che il cambiamento d&#x27;uso richiede prove e che l&#x27;elenco è di esempi. Conta perché la slide 19 usa ancora la formula del testo precedente.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.iasplus.com/en/news/2016/12/ias-40&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt; · &lt;a href=&quot;https://eur-lex.europa.eu/eli/reg/2018/400/oj/eng&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;EUR-Lex&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Gli altri standard citati nelle slide&lt;/h3&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IFRS 13 &lt;i&gt;Fair Value Measurement&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;Definisce il &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt;, la gerarchia a tre livelli e l&#x27;&lt;i lang=&quot;en&quot;&gt;highest and best use&lt;/i&gt;. Conta perché dice &lt;em&gt;come&lt;/em&gt; si misura il numero che IAS 40 chiede di usare.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.iasplus.com/standard/ifrs13.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt; · &lt;a href=&quot;https://www.icaew.com/technical/financial-reporting/ifrs/ifrs-standards/ifrs-13-fair-value-measurement/summary-and-timeline&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IFRS 16 &lt;i&gt;Leases&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;Sostituisce IAS 17: modello unico per il &lt;i lang=&quot;en&quot;&gt;lessee&lt;/i&gt;, distinzione &lt;i lang=&quot;en&quot;&gt;operating&lt;/i&gt; e &lt;i lang=&quot;en&quot;&gt;finance&lt;/i&gt; per il &lt;i lang=&quot;en&quot;&gt;lessor&lt;/i&gt;, regole sul &lt;i lang=&quot;en&quot;&gt;sale and leaseback&lt;/i&gt;. Conta per il &lt;i lang=&quot;en&quot;&gt;right-of-use asset&lt;/i&gt;, per la classificazione e per l&#x27;informativa.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;a href=&quot;https://icaew.com/technical/financial-reporting/ifrs/ifrs-standards/ifrs-16-leases/summary-and-timeline&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;ICAEW&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IAS 16 &lt;i&gt;Property, Plant and Equipment&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;Regola gli immobili usati in proprio, con &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; o &lt;i lang=&quot;en&quot;&gt;revaluation model&lt;/i&gt;. Conta per l&#x27;&lt;i lang=&quot;en&quot;&gt;owner-occupied property&lt;/i&gt;, per il &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; di IAS 40 e per il par. 61.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.iasplus.com/standard/ias16.htm&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IAS 2 &lt;i&gt;Inventories&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;Le rimanenze si valutano al minore tra costo e &lt;i lang=&quot;en&quot;&gt;net realisable value&lt;/i&gt; (valore netto di realizzo). Conta per gli immobili destinati alla vendita ordinaria.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IFRS 5 &lt;i&gt;Non-current Assets Held for Sale and Discontinued Operations&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;Emesso nel marzo 2004. Attività &lt;i lang=&quot;en&quot;&gt;held for sale&lt;/i&gt; al minore tra &lt;i lang=&quot;en&quot;&gt;carrying amount&lt;/i&gt; e &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; al netto dei costi di vendita, senza ammortamento. Conta per il ramo del &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; alla slide 18.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ifrs-5-non-current-assets-held-for-sale-and-discontinued-operations/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/standards/ifrs/ifrs5&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IAS 36 &lt;i&gt;Impairment of Assets&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;Garantisce che un&#x27;attività non sia iscritta sopra il suo &lt;i lang=&quot;en&quot;&gt;recoverable amount&lt;/i&gt;. Conta per il &lt;i lang=&quot;en&quot;&gt;cost model&lt;/i&gt; e per l&#x27;informativa del par. 79.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/content/dam/ifrs/publications/html-standards/english/2026/issued/ias36.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo, IFRS Foundation&lt;/a&gt; · &lt;a href=&quot;https://www.iasplus.com/en/standards/ias/ias36&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS Plus&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IAS 41 &lt;i&gt;Agriculture&lt;/i&gt;&lt;/h4&gt;
&lt;p&gt;&lt;i lang=&quot;en&quot;&gt;Biological assets&lt;/i&gt; a &lt;i lang=&quot;en&quot;&gt;fair value&lt;/i&gt; al netto dei costi di vendita, &lt;i lang=&quot;en&quot;&gt;bearer plants&lt;/i&gt; in IAS 16. Conta per l&#x27;esclusione dallo scope alla slide 4.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-41-agriculture/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS Foundation&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;src-card&quot;&gt;&lt;h4&gt;IAS 8 &lt;i&gt;Basis of Preparation of Financial Statements&lt;/i&gt; e IFRS 18&lt;/h4&gt;
&lt;p class=&quot;meta&quot;&gt;IFRS 18 emesso il 9 aprile 2024 · esercizi dal 1° gennaio 2027&lt;/p&gt;
&lt;p&gt;IAS 8 contiene i criteri per cambiare &lt;i lang=&quot;en&quot;&gt;accounting policy&lt;/i&gt; (il criterio contabile adottato), richiamati da IAS 40.31. IFRS 18 sostituisce IAS 1 e ne ha cambiato il titolo: per questo la slide 11 lo barra.&lt;/p&gt;
&lt;p&gt;&lt;span class=&quot;tag x&quot;&gt;Fonte esterna&lt;/span&gt;&lt;a href=&quot;https://www.ifrs.org/issued-standards/list-of-standards/ias-8-basis-of-preparation-of-financial-statements/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IAS 8, IFRS Foundation&lt;/a&gt; · &lt;a href=&quot;https://www.icas.com/news-insights-events/news/corporate-financial-reporting/ifrs-18-a-new-standard-on-presentation-and-disclosure-in-financial-statements&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IFRS 18, ICAS&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;
&lt;p&gt;Riassunto scritto da Claude a partire dalle slide: controlla sempre sul materiale.&lt;/p&gt;
&lt;/footer&gt;
